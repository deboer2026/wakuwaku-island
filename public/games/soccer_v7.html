<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>どうぶつサッカー</title>
<link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@700;800;900&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{width:100%;height:100%;overflow:hidden;font-family:'M PLUS Rounded 1c',sans-serif;user-select:none;background:#1e6b1e;}
#wrap{position:fixed;inset:0;}
canvas#cv{position:absolute;top:0;left:0;display:block;}

/* HUD */
#hud{position:fixed;top:0;left:0;right:0;z-index:100;
  display:flex;justify-content:space-between;align-items:center;
  padding:max(10px,env(safe-area-inset-top)) 12px 8px;
  background:linear-gradient(180deg,rgba(0,0,0,0.75) 0%,rgba(0,0,0,0.4) 70%,transparent 100%);
  box-sizing:border-box;}
#hud-stage{font-size:12px;font-weight:800;color:#FFD700;}
#hud-score{font-size:14px;font-weight:900;color:white;}
#hud-life{font-size:14px;}
#back-btn{background:rgba(0,0,0,0.5);color:white;border:1px solid rgba(255,255,255,0.3);
  border-radius:20px;padding:6px 14px;font-size:13px;font-weight:700;
  cursor:pointer;pointer-events:all;font-family:inherit;}

/* フリックヒント */
#hint{position:absolute;z-index:10;font-size:13px;font-weight:800;color:rgba(255,255,255,0.85);text-shadow:0 2px 6px rgba(0,0,0,0.7);pointer-events:none;white-space:nowrap;animation:blink 1.5s ease-in-out infinite;}
@keyframes blink{0%,100%{opacity:0.5;}50%{opacity:1;}}

/* 結果ポップ */
#result{position:absolute;z-index:20;pointer-events:none;display:none;text-align:center;left:50%;transform:translateX(-50%);}
@keyframes popIn{0%{transform:translateX(-50%) scale(0.2);opacity:0;}50%{transform:translateX(-50%) scale(1.3);}100%{transform:translateX(-50%) scale(1);opacity:1;}}

/* オーバーレイ */
.ov{position:absolute;inset:0;z-index:100;display:flex;flex-direction:column;align-items:center;justify-content:center;background:rgba(0,20,0,0.9);backdrop-filter:blur(10px);opacity:0;pointer-events:none;transition:opacity 0.3s;}
.ov.show{opacity:1;pointer-events:all;}
.ob{background:linear-gradient(160deg,#0a2a0a,#051205);border:1.5px solid rgba(100,220,100,0.35);border-radius:22px;padding:20px 26px;text-align:center;max-width:290px;width:90%;}
.ot{font-size:20px;font-weight:900;color:#FFD700;margin:8px 0 5px;}
.os{font-size:11px;color:rgba(255,255,255,0.55);margin-bottom:10px;line-height:1.8;}
.osc{font-size:30px;font-weight:900;color:#FFD700;margin:5px 0;}
.bg{background:linear-gradient(135deg,#2E7D32,#66BB6A);color:white;border:none;border-radius:11px;padding:11px 22px;font-size:14px;font-weight:900;cursor:pointer;font-family:inherit;margin:3px;}
.gg{background:rgba(255,255,255,0.08);border:1px solid rgba(255,255,255,0.2);border-radius:11px;padding:8px 16px;font-size:12px;font-weight:700;color:rgba(255,255,255,0.7);cursor:pointer;font-family:inherit;margin:3px;}

/* タイトル */
#ts{position:absolute;inset:0;z-index:200;overflow-y:auto;overflow-x:hidden;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;-webkit-overflow-scrolling:touch;}
#tsvg{position:absolute;inset:0;z-index:0;width:100%;height:100%;pointer-events:none;}
#tc{position:relative;z-index:10;width:100%;display:flex;flex-direction:column;align-items:center;padding-bottom:env(safe-area-inset-bottom, 16px);}
@keyframes sh{0%{background-position:0%}100%{background-position:200%}}


#common-bgm-btn{
  position:fixed;
  top:max(10px,env(safe-area-inset-top,10px));
  right:10px;z-index:1000;
  background:rgba(0,0,0,0.45);
  border:1.5px solid rgba(255,255,255,0.35);
  border-radius:50%;width:40px;height:40px;
  font-size:18px;cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  color:white;
}

/* === safe-area & common buttons === */
:root {
  --sat: env(safe-area-inset-top, 0px);
  --sab: env(safe-area-inset-bottom, 0px);
}
#ui-bgm-btn {
  width: 40px; height: 40px;
  background: rgba(0,0,0,0.5);
  border: 1.5px solid rgba(255,255,255,0.4);
  border-radius: 50%;
  font-size: 20px;
  cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  touch-action: manipulation;
  -webkit-tap-highlight-color: transparent;
  flex-shrink: 0;
}
#status-bar {
  position: fixed;
  top: calc(max(10px, env(safe-area-inset-top)) + 44px);
  left: 0; right: 0;
  display: flex;
  justify-content: center;
  align-items: center;
  gap: 16px;
  padding: 4px 12px;
  z-index: 99;
  pointer-events: none;
}

/* === 横向き対応 === */
@media (orientation: landscape) {
  body { overflow-y: auto; }
  #hud { top: max(6px, env(safe-area-inset-top, 6px)); }
  #status-bar { top: calc(max(6px, env(safe-area-inset-top, 6px)) + 40px); }
}
@media (orientation: landscape) and (max-height: 500px) {
  /* 横向き時にゲームエリアを縮小・スクロール対応 */
  canvas { max-height: 100vh; }
  #game-area { overflow-y: auto; }
}
</style>

<script>
const KICKERS=['🧒','👧','🧑','👨','🧔','👩','🏃','🧑‍🦱'];
const MAX_STAGE=5;
const STAGE_CFG=[
  {win:3,miss:3,spd:2.5,name:'かんたん'},
  {win:3,miss:3,spd:3.8,name:'ふつう'},
  {win:4,miss:3,spd:5.0,name:'むずかしい'},
  {win:4,miss:3,spd:6.2,name:'かなりむず'},
  {win:5,miss:3,spd:7.5,name:'さいきょう'},
];

// ===== ゲーム変数 =====
let W,H;
let selChar=0;
let stage=0,goals=0,misses=0,totalScore=0;
let gameRunning=false;

// ゴール座標（Canvas上）
let GL,GR,GT,GB; // ゴール Left/Right/Top/Bottom

// キーパー（Canvas座標）
let KX,KY,KW,KH,KDir; // X中心,Y中心,幅,高さ,方向

// ボール（Canvas座標）
let BX,BY,BVX,BVY,BR; // X,Y,速度X,速度Y,半径

// キッカー
let PKX,PKY; // キッカー位置

// フェーズ: 'wait' | 'flying' | 'bouncing' | 'result'
let phase='wait';
let resultTimer=null;

// フリック
let flickStartX=0,flickStartY=0,flicking=false,flickStartTime=0;

// Canvas
const cv=document.getElementById('cv');
const ctx=cv.getContext('2d');
let raf=null;

// ===== 初期化 =====
function init(){
  resize();
  buildCharSel();
  updateHsDisp();
  setupInput();
  window.addEventListener('resize',()=>{resize();if(gameRunning)setupLayout();});
}

function resize(){
  W=window.innerWidth;
  H=window.innerHeight;
  cv.width=W;cv.height=H;
}

// ===== レイアウト計算（全部ここで一元管理） =====
function setupLayout(){
  // ゴール：画面上部、横幅80%、高さ30%
  const gW=W*0.80, gH=H*0.28;
  GL=(W-gW)/2; GR=GL+gW;
  GT=H*0.11;   GB=GT+gH;

  // キーパー：ゴール内、幅はゴール幅の35%、高さはゴール高さの80%
  KW=gW*0.35; KH=gH*0.85;
  KX=W/2;     KY=GB-KH/2; // 足元をゴール下端に合わせる
  KDir=1;

  // ボール
  BR=Math.min(W,H)*0.04;
  BX=W/2; BY=H*0.70;
  BVX=0;  BVY=0;

  // キッカー
  PKX=W/2; PKY=H*0.83;

  phase='wait';
  positionHint();
}

function positionHint(){
  const el=document.getElementById('hint');
  el.style.left='50%';el.style.transform='translateX(-50%)';
  el.style.top=(PKY+BR*2+8)+'px';
  el.style.display='block';
}

// ===== キャラ選択 =====
function buildCharSel(){
  const w=document.getElementById('csel');w.innerHTML='';
  KICKERS.forEach((c,i)=>{
    const btn=document.createElement('button');
    btn.style.cssText=`width:44px;height:44px;border-radius:10px;background:${i===selChar?'rgba(76,175,80,0.25)':'rgba(255,255,255,0.06)'};border:2px solid ${i===selChar?'#4CAF50':'rgba(255,255,255,0.12)'};display:flex;align-items:center;justify-content:center;font-size:24px;cursor:pointer;touch-action:manipulation;`;
    btn.textContent=c;
    const fn=()=>{selChar=i;buildCharSel();};
    btn.onclick=fn;btn.addEventListener('touchend',e=>{e.preventDefault();fn();},{passive:false});
    w.appendChild(btn);
  });
}

// ===== ゲーム開始 =====
function startGame(){
  document.getElementById('ts').style.display='none';
  ['clear-ov','go-ov','ac-ov'].forEach(id=>document.getElementById(id).classList.remove('show'));
  stage=0;goals=0;misses=0;totalScore=0;
  gameRunning=true;
  setupLayout();
  updateHUD();
  if(raf)cancelAnimationFrame(raf);
  loop();
}

function showTitle(){
  cancelAnimationFrame(raf);gameRunning=false;
  document.getElementById('ts').style.display='flex';
  ['clear-ov','go-ov','ac-ov'].forEach(id=>document.getElementById(id).classList.remove('show'));
}

function nextStage(){
  document.getElementById('clear-ov').classList.remove('show');
  stage++;goals=0;misses=0;
  setupLayout();updateHUD();
}

// ===== メインループ =====
function loop(){
  if(!gameRunning)return;
  update();
  draw();
  raf=requestAnimationFrame(loop);
}

function update(){
  const cfg=STAGE_CFG[stage];

  // キーパー横移動
  KX+=cfg.spd*KDir;
  if(KX+KW/2>GR){KX=GR-KW/2;KDir=-1;}
  if(KX-KW/2<GL){KX=GL+KW/2;KDir=1;}

  // ボール移動（flying）
  if(phase==='flying'){
    BX+=BVX; BY+=BVY;
    BVY*=0.99;

    // ゴールエリア内に到達したか
    if(BY-BR<GB && BY+BR>GT && BX+BR>GL && BX-BR<GR){
      // ===== セーブ判定 =====
      // キーパーの矩形：[KX-KW/2, KX+KW/2] x [KY-KH/2, KY+KH/2]
      const kLeft=KX-KW/2, kRight=KX+KW/2;
      const ballRight=BX+BR, ballLeft=BX-BR;
      if(ballRight>kLeft && ballLeft<kRight){
        // セーブ！
        phase='bouncing';
        const bdir=BX>KX?1:-1;
        BVX=bdir*(7+Math.random()*4);
        BVY=-(6+Math.random()*4);
        showResult('セーブ！😤','','#EF9A9A');
        clearTimeout(resultTimer);
        resultTimer=setTimeout(()=>onMiss(),900);
      } else {
        // ゴール！
        phase='result';
        onGoal();
      }
    }
    // 画面外
    if(BY<-BR*2||BX<-BR*2||BX>W+BR*2){
      phase='result';
      showResult('はずれ！💨','','#90CAF9');
      clearTimeout(resultTimer);
      resultTimer=setTimeout(()=>onMiss(),800);
    }
  }

  // バウンス中（セーブ後のボール）
  if(phase==='bouncing'){
    BX+=BVX; BY+=BVY;
    BVY+=0.5; // 重力
    BVX*=0.98;
  }
}

// ===== ゴール =====
function onGoal(){
  goals++;
  const pts=100*(stage+1);
  totalScore+=pts;
  updateHUD();
  showResult('⚽ ゴール！！',`+${pts}点`,'#FFD700');
  clearTimeout(resultTimer);
  resultTimer=setTimeout(()=>{
    const cfg=STAGE_CFG[stage];
    if(goals>=cfg.win){
      if(stage>=MAX_STAGE-1) endAllClear();
      else showStageClear();
    } else {
      resetBall();
    }
  },1500);
}

function onMiss(){
  misses++;updateHUD();
  clearTimeout(resultTimer);
  if(misses>=STAGE_CFG[stage].miss){
    endGameOver();
  } else {
    resetBall();
  }
}

function resetBall(){
  BX=W/2;BY=H*0.70;BVX=0;BVY=0;
  phase='wait';
  positionHint();
}

// ===== 描画（全部Canvas） =====
function draw(){
  ctx.clearRect(0,0,W,H);
  drawField();
  drawGoal();
  drawKeeper();
  drawBall();
  drawKicker();
  drawFlickGuide();
}

function drawField(){
  // 空グラデ
  const sg=ctx.createLinearGradient(0,0,0,H*0.45);
  sg.addColorStop(0,'#0a1428');sg.addColorStop(1,'#1a2a50');
  ctx.fillStyle=sg;ctx.fillRect(0,0,W,H*0.45);

  // グラウンド
  const fg=ctx.createLinearGradient(0,H*0.4,0,H);
  fg.addColorStop(0,'#1e7a1e');fg.addColorStop(1,'#155015');
  ctx.fillStyle=fg;ctx.fillRect(0,H*0.4,W,H*0.6);

  // 芝ストライプ
  const sw=W/10;
  for(let i=0;i<10;i++){
    if(i%2===0){ctx.fillStyle='rgba(255,255,255,0.025)';ctx.fillRect(i*sw,H*0.4,sw,H*0.6);}
  }

  // 照明ポール
  ctx.fillStyle='#666';
  ctx.fillRect(W*0.08-2,0,4,H*0.14);
  ctx.fillRect(W*0.92-2,0,4,H*0.14);
  // 照明ライト
  const lg1=ctx.createRadialGradient(W*0.08,H*0.04,0,W*0.08,H*0.04,W*0.25);
  lg1.addColorStop(0,'rgba(255,245,200,0.3)');lg1.addColorStop(1,'rgba(255,245,200,0)');
  ctx.fillStyle=lg1;ctx.fillRect(0,0,W*0.5,H*0.4);
  const lg2=ctx.createRadialGradient(W*0.92,H*0.04,0,W*0.92,H*0.04,W*0.25);
  lg2.addColorStop(0,'rgba(255,245,200,0.3)');lg2.addColorStop(1,'rgba(255,245,200,0)');
  ctx.fillStyle=lg2;ctx.fillRect(W*0.5,0,W*0.5,H*0.4);
  ctx.fillStyle='#FFFDE7';
  ctx.beginPath();ctx.ellipse(W*0.08,H*0.04,10,5,0,0,Math.PI*2);ctx.fill();
  ctx.beginPath();ctx.ellipse(W*0.92,H*0.04,10,5,0,0,Math.PI*2);ctx.fill();

  // 観客席
  ctx.fillStyle='#0d1a0d';ctx.fillRect(0,H*0.045,W,H*0.09);
  const seatC=['#E53935','#1E88E5','#FFD600','#43A047','#F06292'];
  for(let row=0;row<3;row++){
    const sy=H*(0.055+row*0.025);
    for(let i=0;i<Math.floor(W/15);i++){
      ctx.fillStyle=seatC[(i+row)%seatC.length];
      ctx.globalAlpha=0.6;
      ctx.beginPath();ctx.arc(i*15+7,sy,4,0,Math.PI*2);ctx.fill();
    }
  }
  ctx.globalAlpha=1;

  // 広告ボード
  ctx.fillStyle='#0a100a';ctx.fillRect(0,H*0.135,W,H*0.018);
  const ads=[['#C62828','WAKUWAKU'],['#1565C0','ISLAND FC'],['#F9A825','どうぶつCUP'],['#2E7D32','GOAL!!'],['#6A1B9A','SOCCER']];
  const aw=W/ads.length;
  ads.forEach(([c,t],i)=>{
    ctx.fillStyle=c;ctx.fillRect(i*aw+2,H*0.136,aw-4,H*0.016);
    ctx.fillStyle='white';ctx.font=`bold ${Math.round(H*0.012)}px sans-serif`;
    ctx.textAlign='center';ctx.fillText(t,i*aw+aw/2,H*0.148);
  });

  // センターライン・サークル
  ctx.save();ctx.strokeStyle='rgba(255,255,255,0.4)';ctx.lineWidth=2;
  ctx.beginPath();ctx.moveTo(W*0.05,H*0.56);ctx.lineTo(W*0.95,H*0.56);ctx.stroke();
  ctx.beginPath();ctx.ellipse(W/2,H*0.56,W*0.18,H*0.07,0,0,Math.PI*2);ctx.stroke();
  ctx.fillStyle='rgba(255,255,255,0.5)';ctx.beginPath();ctx.arc(W/2,H*0.56,3,0,Math.PI*2);ctx.fill();
  // ペナルティエリア
  ctx.globalAlpha=0.35;ctx.strokeRect(W*0.2,H*0.7,W*0.6,H*0.12);
  ctx.restore();
}

function drawGoal(){
  ctx.save();
  // ゴール内部
  ctx.fillStyle='rgba(0,0,0,0.4)';
  ctx.fillRect(GL,GT,GR-GL,GB-GT);
  // ネット
  ctx.strokeStyle='rgba(255,255,255,0.15)';ctx.lineWidth=0.8;
  const nStepX=(GR-GL)/12, nStepY=(GB-GT)/8;
  for(let x=GL+nStepX;x<GR;x+=nStepX){ctx.beginPath();ctx.moveTo(x,GT);ctx.lineTo(x,GB);ctx.stroke();}
  for(let y=GT+nStepY;y<GB;y+=nStepY){ctx.beginPath();ctx.moveTo(GL,y);ctx.lineTo(GR,y);ctx.stroke();}
  // ポスト
  ctx.strokeStyle='white';ctx.lineWidth=4;ctx.lineJoin='round';
  ctx.strokeRect(GL,GT,GR-GL,GB-GT);
  // 奥行き感
  const d=8;
  ctx.strokeStyle='rgba(255,255,255,0.3)';ctx.lineWidth=2;
  ctx.beginPath();ctx.moveTo(GL,GT);ctx.lineTo(GL-d,GT-d);ctx.stroke();
  ctx.beginPath();ctx.moveTo(GR,GT);ctx.lineTo(GR+d,GT-d);ctx.stroke();
  ctx.beginPath();ctx.moveTo(GL-d,GT-d);ctx.lineTo(GR+d,GT-d);ctx.stroke();
  ctx.restore();
}

function drawKeeper(){
  ctx.save();
  const sz=KH; // フォントサイズ＝キーパー高さ
  ctx.font=`${sz}px "Apple Color Emoji","Segoe UI Emoji",serif`;
  ctx.textAlign='center';ctx.textBaseline='middle';
  ctx.globalAlpha=0.95;
  // 影
  ctx.globalAlpha=0.2;ctx.fillStyle='#000';
  ctx.beginPath();ctx.ellipse(KX,GB,KW*0.4,KH*0.06,0,0,Math.PI*2);ctx.fill();
  ctx.globalAlpha=0.95;
  ctx.fillText('🐻',KX,KY);
  ctx.restore();
}

function drawBall(){
  if(phase==='wait'||phase==='flying'||phase==='bouncing'){
    ctx.save();
    // 影
    ctx.fillStyle='rgba(0,0,0,0.25)';
    ctx.beginPath();ctx.ellipse(BX,BY+BR*0.8,BR*0.7,BR*0.25,0,0,Math.PI*2);ctx.fill();
    // ボール（回転アニメはCanvasの絵文字では難しいので単純に描画）
    const sz=BR*2.2;
    ctx.font=`${sz}px "Apple Color Emoji","Segoe UI Emoji",serif`;
    ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.fillText('⚽',BX,BY);
    ctx.restore();
  }
}

function drawKicker(){
  ctx.save();
  const sz=Math.min(W,H)*0.10;
  ctx.font=`${sz}px "Apple Color Emoji","Segoe UI Emoji",serif`;
  ctx.textAlign='center';ctx.textBaseline='bottom';
  // 蹴る仕草：flyingの開始直後だけ傾ける
  ctx.fillText(KICKERS[selChar],PKX,PKY+sz*0.1);
  ctx.restore();
}

function drawFlickGuide(){
  if(!flicking||phase!=='wait')return;
  // フリック中：ボールから指の方向に矢印
  const dx=flickStartX-BX, dy=flickStartY-BY;
  ctx.save();
  ctx.strokeStyle='rgba(255,215,0,0.6)';ctx.lineWidth=3;ctx.setLineDash([6,4]);
  ctx.beginPath();ctx.moveTo(BX,BY);ctx.lineTo(flickStartX,flickStartY);ctx.stroke();
  ctx.setLineDash([]);
  ctx.fillStyle='rgba(255,215,0,0.8)';
  ctx.beginPath();ctx.arc(flickStartX,flickStartY,6,0,Math.PI*2);ctx.fill();
  ctx.restore();
}

// ===== フリック処理 =====
function onFlick(sx,sy,ex,ey){
  if(phase!=='wait')return;
  const dx=ex-sx, dy=ey-sy;
  const dist=Math.sqrt(dx*dx+dy*dy);
  if(dist<12)return;

  phase='flying';
  document.getElementById('hint').style.display='none';

  // ===== コース決定 =====
  // 左右：dxをそのままコースに（右フリック→右寄り、左→左寄り）
  const xPower=Math.max(-1,Math.min(1,dx/80));
  // ターゲットX：ゴール内（左1/3・中央・右1/3）
  const tX=W/2+xPower*(GR-GL)*0.35;
  // ターゲットY：常にゴール中央（縦は固定）
  const tY=(GT+GB)/2;

  // ボールからターゲットへのベクトル
  const tvX=tX-BX, tvY=tY-BY;
  const tLen=Math.sqrt(tvX*tvX+tvY*tvY)||1;
  const spd=Math.min(16,Math.max(10,dist*0.14));
  BVX=(tvX/tLen)*spd*0.6;
  BVY=(tvY/tLen)*spd;
}

// ===== 演出 =====
function showResult(main,sub,color){
  const el=document.getElementById('result');
  el.innerHTML=`<div style="font-size:36px;font-weight:900;color:${color};text-shadow:0 0 24px ${color};white-space:nowrap;">${main}</div>${sub?`<div style="font-size:18px;color:#FFD700;font-weight:800;margin-top:3px;">${sub}</div>`:''}`;
  el.style.top=(H*0.38)+'px';
  el.style.display='block';
  el.style.animation='none';el.offsetHeight;
  el.style.animation='popIn 0.4s ease-out forwards';
  setTimeout(()=>el.style.display='none',1400);
}

function showStageClear(){
  document.getElementById('clear-title').textContent=`ステージ ${stage+1} クリア！`;
  document.getElementById('clear-sub').innerHTML=`⚽ ${goals}ゴール！${stage<MAX_STAGE-1?`<br>つぎは「${STAGE_CFG[stage+1].name}」！`:''}`;
  document.getElementById('clear-score').textContent=`⭐ ${totalScore} てん`;
  document.getElementById('next-btn').onclick=nextStage;
  document.getElementById('clear-ov').classList.add('show');
}
function endAllClear(){
  cancelAnimationFrame(raf);gameRunning=false;
  const hs=getHs(),isNew=totalScore>hs;if(isNew)saveHs(totalScore);
  document.getElementById('ac-sub').innerHTML='ぜんステージ クリア！';
  document.getElementById('ac-score').textContent=`⭐ ${totalScore} てん${isNew?' 🏆':''}`;
  document.getElementById('ac-ov').classList.add('show');
}
function gameOver(){ endGameOver(); }
function endGameOver(){
  cancelAnimationFrame(raf);gameRunning=false;
  const hs=getHs(),isNew=totalScore>hs;if(isNew)saveHs(totalScore);
  document.getElementById('go-sub').innerHTML=`ステージ${stage+1}　⚽ ${goals}ゴール`;
  document.getElementById('go-score').textContent=`⭐ ${totalScore} てん${isNew?' 🏆':''}`;
  document.getElementById('go-ov').classList.add('show');
}

function updateHUD(){
  const cfg=STAGE_CFG[stage];
  document.getElementById('hud-stage').textContent=`⚽ ステージ ${stage+1}（${cfg.name}）`;
  document.getElementById('hud-score').textContent=`${goals}/${cfg.win}ゴール　${totalScore}点`;
  document.getElementById('hud-life').textContent='❤️'.repeat(cfg.miss-misses)+'🖤'.repeat(misses);
}
function getHs(){return parseInt(localStorage.getItem('soccer_hs3')||'0');}
function saveHs(s){localStorage.setItem('soccer_hs3',s);}
function updateHsDisp(){const hs=getHs();document.getElementById('ths').textContent=hs>0?`ハイスコア：⭐${hs}`:''}

// ===== 入力 =====
function setupInput(){
  cv.addEventListener('touchstart',e=>{
    e.preventDefault();
    if(phase!=='wait')return;
    flicking=true;
    flickStartX=e.touches[0].clientX;
    flickStartY=e.touches[0].clientY;
    flickStartTime=Date.now();
  },{passive:false});
  cv.addEventListener('touchmove',e=>{e.preventDefault();},{passive:false});
  cv.addEventListener('touchend',e=>{
    e.preventDefault();
    if(!flicking)return;
    flicking=false;
    const ex=e.changedTouches[0].clientX;
    const ey=e.changedTouches[0].clientY;
    if(Date.now()-flickStartTime<600){
      onFlick(flickStartX,flickStartY,ex,ey);
    }
  },{passive:false});
  // マウス
  let md=false;
  cv.addEventListener('mousedown',e=>{if(phase==='wait'){md=true;flicking=true;flickStartX=e.clientX;flickStartY=e.clientY;flickStartTime=Date.now();}});
  cv.addEventListener('mouseup',e=>{if(!md)return;md=false;flicking=false;if(Date.now()-flickStartTime<600)onFlick(flickStartX,flickStartY,e.clientX,e.clientY);});
  // スタートボタン
  document.getElementById('sbtn').addEventListener('click',startGame);
  document.getElementById('sbtn').addEventListener('touchend',e=>{e.preventDefault();startGame();},{passive:false});
}

var _bgmEnabled=true;
function toggleCommonBGM(){
  _bgmEnabled=!_bgmEnabled;
  var btn=document.getElementById('ui-bgm-btn');
  if(btn)btn.textContent=_bgmEnabled?'🔊':'🔇';

// === BGM (Web Audio API) ===
(function(){
  var _ctx=null, _gain=null, _playing=false, _stopped=false;
  var _notes=[[523,0.2],[587,0.2],[659,0.4],[698,0.2],[659,0.2],[587,0.2],[523,0.4],[440,0.2],[494,0.2],[523,0.4],[587,0.2],[523,0.2],[494,0.2],[440,0.6]];
  var _ni=0;

  function _initBGM(){
    if(_ctx)return;
    try{
      _ctx=new(window.AudioContext||window.webkitAudioContext)();
      _gain=_ctx.createGain();
      _gain.gain.value=0.08;
      _gain.connect(_ctx.destination);
      window._masterGain=_gain;
    }catch(e){}
  }

  function _playNote(freq,dur,time){
    if(!_ctx||_stopped)return;
    var o=_ctx.createOscillator();
    var g=_ctx.createGain();
    o.type='square';
    o.frequency.value=freq;
    g.gain.setValueAtTime(0.08,time);
    g.gain.exponentialRampToValueAtTime(0.001,time+dur*0.9);
    o.connect(g);g.connect(_gain);
    o.start(time);o.stop(time+dur);
  }

  function _loop(){
    if(_stopped||!_ctx||!_gain)return;
    var t=_ctx.currentTime+0.05;
    _notes.forEach(function(n,i){
      var offset=0;
      for(var j=0;j<i;j++)offset+=_notes[j][1];
      _playNote(n[0],n[1],t+offset);
    });
    var total=_notes.reduce(function(s,n){return s+n[1];},0);
    _loopTimer=setTimeout(_loop,(total-0.1)*1000);
  }
  var _loopTimer=null;

  function startBGM(){
    if(_playing)return;
    _initBGM();
    if(!_ctx)return;
    _stopped=false;_playing=true;
    if(_ctx.state==='suspended')_ctx.resume();
    _loop();
  }

  function stopBGM(){
    _stopped=true;_playing=false;
    if(_loopTimer){clearTimeout(_loopTimer);_loopTimer=null;}
    if(_gain)_gain.gain.value=0;
  }

  function resumeBGM(){
    if(_playing)return;
    _stopped=false;_playing=true;
    if(_gain)_gain.gain.value=0.08;
    if(_ctx&&_ctx.state==='suspended')_ctx.resume();
    _loop();
  }

  // ページ表示後にBGM開始（タップ後）
  function _tryStart(){
    startBGM();
    document.removeEventListener('touchstart',_tryStart);
    document.removeEventListener('click',_tryStart);
  }
  document.addEventListener('touchstart',_tryStart,{once:true});
  document.addEventListener('click',_tryStart,{once:true});

  // toggleCommonBGMを上書き
  window.toggleCommonBGM=function(){
    _bgmEnabled=!_bgmEnabled;
    var btn=document.getElementById('ui-bgm-btn');
    if(btn)btn.textContent=_bgmEnabled?'🔊':'🔇';
    if(_bgmEnabled)resumeBGM();else stopBGM();
  };

  window._startBGM=startBGM;
  window._stopBGM=stopBGM;
})();
