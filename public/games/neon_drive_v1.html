<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>NEON EXPRESSWAY — きらきらナイトドライブ</title>
<script src="/games/safe_area.js"></script>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { width:100%; height:100%; overflow:hidden; background:#05030f; touch-action:none; }
  #game { position:fixed; inset:0; }
  canvas { display:block; }
  .hud, .screen { font-family:'Courier New', monospace; color:#e8f6ff; user-select:none; -webkit-user-select:none; }

  /* ===== HUD ===== */
  #hud { position:fixed; inset:0; pointer-events:none; display:none; }
  #speed { position:fixed; right:calc(18px + var(--sar, env(safe-area-inset-right,0px))); bottom:calc(18px + var(--sab, env(safe-area-inset-bottom,0px))); text-align:right; }
  #speedNum { font-size:52px; font-weight:bold; color:#7df9ff; text-shadow:0 0 14px #00d5ff, 0 0 40px #0077ff; line-height:1; font-style:italic; }
  #speedUnit { font-size:13px; letter-spacing:4px; color:#8fb8d8; }
  #score { position:fixed; left:calc(18px + var(--sal, env(safe-area-inset-left,0px))); top:calc(16px + var(--sat, env(safe-area-inset-top,0px))); }
  #scoreNum { font-size:30px; font-weight:bold; color:#fff; text-shadow:0 0 10px #ff2fb0; }
  #scoreLabel { font-size:11px; letter-spacing:4px; color:#ff8fd6; }
  #stars { position:fixed; left:calc(18px + var(--sal, env(safe-area-inset-left,0px))); top:calc(74px + var(--sat, env(safe-area-inset-top,0px))); font-size:22px; font-weight:bold; color:#ffe14d; text-shadow:0 0 10px #ff9d00; }
  #hearts { position:fixed; right:calc(18px + var(--sar, env(safe-area-inset-right,0px))); top:calc(16px + var(--sat, env(safe-area-inset-top,0px))); font-size:26px; letter-spacing:4px; text-align:right;
            filter:drop-shadow(0 0 8px #ff2fb0); }
  #best { position:fixed; right:calc(18px + var(--sar, env(safe-area-inset-right,0px))); top:calc(52px + var(--sat, env(safe-area-inset-top,0px))); text-align:right; font-size:12px; letter-spacing:2px; color:#8fb8d8; }
  #combo { position:fixed; left:50%; top:22%; transform:translateX(-50%) scale(0); font-size:34px; font-weight:bold; font-style:italic;
           color:#ffe14d; text-shadow:0 0 12px #ff9d00, 0 0 34px #ff5500; transition:transform .12s ease-out; white-space:nowrap; }
  #combo.pop { transform:translateX(-50%) scale(1); }
  #praise { position:fixed; left:50%; top:32%; transform:translateX(-50%) scale(0); font-size:30px; font-weight:bold;
            color:#7dffb0; text-shadow:0 0 14px #00ff88, 0 0 30px #00cc66; transition:transform .15s ease-out; white-space:nowrap; }
  #praise.pop { transform:translateX(-50%) scale(1); }
  #rainbowMsg { position:fixed; left:50%; top:42%; transform:translateX(-50%); font-size:24px; font-weight:bold; opacity:0;
                transition:opacity .2s; white-space:nowrap;
                background:linear-gradient(90deg,#ff5e5e,#ffd25e,#7dff8a,#5ecdff,#c77dff);
                -webkit-background-clip:text; background-clip:text; color:transparent;
                filter:drop-shadow(0 0 10px rgba(255,255,255,.6)); }

  /* ===== 画面共通 ===== */
  .screen { position:fixed; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center;
            background:radial-gradient(ellipse at 50% 70%, rgba(40,10,80,.55), rgba(5,3,15,.92) 70%); z-index:10; text-align:center; padding:20px; }
  .title-jp { font-size:15px; letter-spacing:10px; color:#ff8fd6; margin-bottom:10px; text-shadow:0 0 12px #ff2fb0; }
  .title-main { font-size:min(11vw,64px); font-weight:bold; font-style:italic; letter-spacing:2px; line-height:1.05;
                background:linear-gradient(180deg,#aef6ff 0%, #33ccff 45%, #ff2fb0 100%);
                -webkit-background-clip:text; background-clip:text; color:transparent;
                filter:drop-shadow(0 0 18px rgba(0,180,255,.7)); }
  .btn { margin-top:30px; padding:14px 46px; font-family:inherit; font-size:17px; letter-spacing:6px; font-weight:bold;
         color:#05030f; background:linear-gradient(90deg,#7df9ff,#ff8fd6); border:none; cursor:pointer; border-radius:30px;
         box-shadow:0 0 22px rgba(0,200,255,.55); transition:transform .1s; }
  .btn:active { transform:scale(.95); }
  .hint { margin-top:24px; font-size:13px; line-height:2.1; letter-spacing:1px; color:#c8e2f4; }
  #resultScore { font-size:52px; font-weight:bold; color:#ffe14d; text-shadow:0 0 18px #ff9d00; margin:10px 0 2px; }
  #resultLabel { font-size:12px; letter-spacing:6px; color:#ff8fd6; }
  #resultStars { font-size:24px; color:#ffe14d; text-shadow:0 0 12px #ff9d00; margin-top:8px; }
  #resultRank { font-size:20px; font-weight:bold; color:#7dffb0; text-shadow:0 0 12px #00cc66; margin-top:12px; }
  #resultBest { font-size:13px; letter-spacing:3px; color:#7df9ff; margin-top:10px; }
  #gameover { display:none; }
  #newRecord { display:none; font-size:14px; letter-spacing:4px; color:#ff2fb0; margin-top:8px; animation:blink 0.7s infinite; }
  @keyframes blink { 50% { opacity:.2; } }

  #muteBtn { position:fixed; left:calc(16px + var(--sal, env(safe-area-inset-left,0px))); bottom:calc(16px + var(--sab, env(safe-area-inset-bottom,0px))); z-index:20; width:44px; height:44px; border-radius:50%;
             border:1px solid #3a6a8a; background:rgba(10,20,40,.6); color:#7df9ff; font-size:18px; cursor:pointer; }
  #flash { position:fixed; inset:0; background:#fff; opacity:0; pointer-events:none; z-index:5; }

  /* ===== キャラ選択 ===== */
  #selectScreen { display:none; }
  .sel-title { font-size:17px; letter-spacing:6px; color:#ffe14d; text-shadow:0 0 12px #ff9d00; margin-bottom:22px; }
  .sel-grid { display:flex; gap:12px; flex-wrap:wrap; justify-content:center; max-width:460px; }
  .sel-card { width:100px; padding:12px 6px 14px; border-radius:18px; background:rgba(20,16,44,.72);
              border:2px solid #3a2f6a; cursor:pointer; transition:transform .1s, border-color .1s, box-shadow .1s; }
  .sel-card:active { transform:scale(.94); }
  .sel-card.pick { border-color:#ffe14d; box-shadow:0 0 18px rgba(255,200,60,.5); }
  .sel-portrait { width:62px; height:62px; margin:0 auto 6px; border-radius:50%; padding:5px;
                  background:radial-gradient(circle at 50% 38%, rgba(255,255,255,.18), rgba(0,0,0,.22)); }
  .sel-portrait svg { width:100%; height:100%; display:block; }
  .sel-name { font-size:15px; font-weight:bold; color:#fff; }
  .sel-desc { font-size:10px; color:#9fc4e0; margin-top:3px; letter-spacing:1px; }
  .sel-hint { margin-top:22px; font-size:13px; color:#c8e2f4; letter-spacing:2px; }
</style>
</head>
<body>
<div id="game"></div>

<div id="hud" class="hud">
  <div id="score"><div id="scoreLabel">SCORE</div><div id="scoreNum">0</div></div>
  <div id="stars">★ 0</div>
  <div id="hearts">♥♥♥</div>
  <div id="best">BEST 0</div>
  <div id="speed"><div id="speedNum">0</div><div id="speedUnit">km/h</div></div>
  <div id="combo"></div>
  <div id="praise"></div>
  <div id="rainbowMsg">にじいろパワー！むてきだよ！</div>
</div>

<div id="flash"></div>

<div id="titleScreen" class="screen">
  <div class="title-jp">きらきらナイトドライブ</div>
  <div class="title-main">NEON<br>EXPRESSWAY</div>
  <button class="btn" id="startBtn">スタート！</button>
  <div class="hint">
    ゆびで がめんを なぞって うんてん🚗<br>
    （パソコンは ← → キー）<br>
    <span style="color:#ffe14d">★ほし</span>を あつめて、
    <span style="background:linear-gradient(90deg,#ff5e5e,#ffd25e,#7dff8a,#5ecdff,#c77dff);-webkit-background-clip:text;background-clip:text;color:transparent;font-weight:bold;">にじたま</span>で むてきに！<br>
    くるまに ぶつかっても <span style="color:#ff8fd6">♥ハート</span>が あれば だいじょうぶ
  </div>
</div>

<div id="selectScreen" class="screen">
  <div class="sel-title">だれで はしる？</div>
  <div class="sel-grid" id="selGrid"></div>
  <div class="sel-hint">タップで スタート！</div>
</div>

<div id="gameover" class="screen">
  <div class="title-jp">おつかれさま！</div>
  <div id="resultLabel">SCORE</div>
  <div id="resultScore">0</div>
  <div id="resultStars">★ 0こ あつめたよ</div>
  <div id="resultRank"></div>
  <div id="resultBest">BEST 0</div>
  <div id="newRecord">★ しんきろく ★</div>
  <button class="btn" id="retryBtn">もういっかい！</button>
</div>

<button id="muteBtn">♪</button>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function(){
"use strict";

/* ============================================================
   NEON EXPRESSWAY — きらきらナイトドライブ（キッズ版）
   ============================================================ */

const container = document.getElementById('game');
const renderer = new THREE.WebGLRenderer({ antialias:true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
container.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.fog = new THREE.Fog(0x0a0620, 40, 260);
scene.background = new THREE.Color(0x0a0620);

const camera = new THREE.PerspectiveCamera(72, window.innerWidth/window.innerHeight, 0.1, 500);

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth/window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

scene.add(new THREE.AmbientLight(0x223355, 1.4));
const moon = new THREE.DirectionalLight(0x8899ff, 0.6);
moon.position.set(-30, 60, -40);
scene.add(moon);
const playerGlow = new THREE.PointLight(0x00ccff, 1.6, 30);
scene.add(playerGlow);

const LANES = [-6, -2, 2, 6];
const ROAD_W = 17;
const SEG_LEN = 40;
const SEG_COUNT = 12;

// ---------- 道路 ----------
const roadGroup = new THREE.Group();
scene.add(roadGroup);
{
  const roadMat = new THREE.MeshLambertMaterial({ color:0x14121f });
  const lineMatW = new THREE.MeshBasicMaterial({ color:0xbfe8ff });
  const edgeMatL = new THREE.MeshBasicMaterial({ color:0xff2fb0 });
  const edgeMatR = new THREE.MeshBasicMaterial({ color:0x00e5ff });

  for (let s=0; s<SEG_COUNT; s++) {
    const seg = new THREE.Group();
    const road = new THREE.Mesh(new THREE.PlaneGeometry(ROAD_W+3, SEG_LEN), roadMat);
    road.rotation.x = -Math.PI/2;
    seg.add(road);
    for (const x of [-4, 0, 4]) {
      for (let d=0; d<SEG_LEN; d+=8) {
        const dash = new THREE.Mesh(new THREE.PlaneGeometry(0.22, 3.4), lineMatW);
        dash.rotation.x = -Math.PI/2;
        dash.position.set(x, 0.02, -SEG_LEN/2 + d + 2);
        seg.add(dash);
      }
    }
    const eL = new THREE.Mesh(new THREE.BoxGeometry(0.35, 0.5, SEG_LEN), edgeMatL);
    eL.position.set(-ROAD_W/2-1, 0.25, 0); seg.add(eL);
    const eR = new THREE.Mesh(new THREE.BoxGeometry(0.35, 0.5, SEG_LEN), edgeMatR);
    eR.position.set(ROAD_W/2+1, 0.25, 0); seg.add(eR);

    if (s % 2 === 0) {
      const arch = new THREE.Mesh(
        new THREE.BoxGeometry(ROAD_W+6, 0.5, 0.5),
        new THREE.MeshBasicMaterial({ color:0x7df9ff })
      );
      arch.position.set(0, 9, -SEG_LEN/2+4);
      seg.add(arch);
      const pL = new THREE.Mesh(new THREE.BoxGeometry(0.4,9,0.4), new THREE.MeshLambertMaterial({color:0x333355}));
      pL.position.set(-(ROAD_W/2+2.5), 4.5, -SEG_LEN/2+4); seg.add(pL);
      const pR = pL.clone(); pR.position.x = ROAD_W/2+2.5; seg.add(pR);
    }
    seg.position.z = -s * SEG_LEN;
    roadGroup.add(seg);
  }
}

// ---------- ビル群 ----------
const buildingGroup = new THREE.Group();
scene.add(buildingGroup);
const buildings = [];
{
  const neonColors = [0xff2fb0, 0x00e5ff, 0xffe14d, 0x9d4dff, 0x37ff8b];
  function makeBuilding(z, side) {
    const g = new THREE.Group();
    const h = 12 + Math.random()*36;
    const w = 6 + Math.random()*8;
    const body = new THREE.Mesh(
      new THREE.BoxGeometry(w, h, w),
      new THREE.MeshLambertMaterial({ color:0x0d0b18 })
    );
    body.position.y = h/2;
    g.add(body);
    const winMat = new THREE.MeshBasicMaterial({ color:0xffd98a });
    const winMat2 = new THREE.MeshBasicMaterial({ color:0x7df9ff });
    for (let i=0; i<14; i++) {
      if (Math.random() < 0.45) continue;
      const win = new THREE.Mesh(new THREE.PlaneGeometry(0.8, 1.2), Math.random()<0.7?winMat:winMat2);
      win.position.set(
        (side>0?-1:1) * (w/2 + 0.05),
        2 + Math.random()*(h-4),
        (Math.random()-0.5)*w*0.8
      );
      win.rotation.y = side>0 ? -Math.PI/2 : Math.PI/2;
      g.add(win);
    }
    if (Math.random() < 0.4) {
      const sign = new THREE.Mesh(
        new THREE.BoxGeometry(w*0.7, 2.4, 0.3),
        new THREE.MeshBasicMaterial({ color:neonColors[Math.floor(Math.random()*neonColors.length)] })
      );
      sign.position.set(0, h+1.5, 0);
      g.add(sign);
    }
    g.position.set(side * (ROAD_W/2 + 8 + Math.random()*14), 0, z);
    buildingGroup.add(g);
    buildings.push(g);
  }
  for (let z=0; z>-SEG_COUNT*SEG_LEN; z-=14) {
    makeBuilding(z + Math.random()*6, -1);
    makeBuilding(z + Math.random()*6, 1);
  }
}

// ---------- 車を作る ----------
function makeCar(bodyColor, neonColor, isPlayer, earType, innerColor) {
  const car = new THREE.Group();
  const bodyMat = new THREE.MeshLambertMaterial({ color:bodyColor });
  const darkMat = new THREE.MeshLambertMaterial({ color:0x111118 });
  const glassMat = new THREE.MeshLambertMaterial({ color:0x223344 });

  const lower = new THREE.Mesh(new THREE.BoxGeometry(2.0, 0.55, 4.4), bodyMat);
  lower.position.y = 0.55; car.add(lower);
  const upper = new THREE.Mesh(new THREE.BoxGeometry(1.7, 0.5, 2.4), glassMat);
  upper.position.set(0, 1.05, 0.1); car.add(upper);

  for (const [x,z] of [[-0.95,1.4],[0.95,1.4],[-0.95,-1.4],[0.95,-1.4]]) {
    const t = new THREE.Mesh(new THREE.CylinderGeometry(0.42,0.42,0.35,12), darkMat);
    t.rotation.z = Math.PI/2;
    t.position.set(x, 0.42, z);
    car.add(t);
  }
  const tail = new THREE.Mesh(new THREE.BoxGeometry(1.8, 0.22, 0.1),
    new THREE.MeshBasicMaterial({ color:0xff2244 }));
  tail.position.set(0, 0.75, 2.22); car.add(tail);
  const head = new THREE.Mesh(new THREE.BoxGeometry(1.8, 0.18, 0.1),
    new THREE.MeshBasicMaterial({ color:0xfff2cc }));
  head.position.set(0, 0.7, -2.22); car.add(head);
  const neon = new THREE.Mesh(new THREE.BoxGeometry(2.2, 0.08, 4.4),
    new THREE.MeshBasicMaterial({ color:neonColor }));
  neon.position.y = 0.18; car.add(neon);
  car.userData.neonMesh = neon;
  car.userData.bodyMesh = lower;

  // どうぶつの みみ＆しっぽ（プレイヤーのみ、キャラで きりかえ）
  if (isPlayer) {
    const earMat = new THREE.MeshLambertMaterial({ color:bodyColor });
    const innerMat = new THREE.MeshBasicMaterial({ color: (innerColor!=null ? innerColor : 0xffb0d8) });
    const blackMat = new THREE.MeshLambertMaterial({ color:0x222228 });
    const et = earType || 'cat';
    for (const sx of [-1, 1]) {
      if (et === 'rabbit') {
        const ear = new THREE.Mesh(new THREE.CylinderGeometry(0.15, 0.2, 1.2, 8), earMat);
        ear.position.set(sx*0.4, 1.95, -0.55); car.add(ear);
        const inner = new THREE.Mesh(new THREE.CylinderGeometry(0.07, 0.1, 0.9, 8), innerMat);
        inner.position.set(sx*0.4, 2.0, -0.5); car.add(inner);
      } else if (et === 'panda') {
        const ear = new THREE.Mesh(new THREE.SphereGeometry(0.34, 12, 12), blackMat);
        ear.position.set(sx*0.62, 1.55, -0.55); car.add(ear);
      } else if (et === 'fox') {
        const ear = new THREE.Mesh(new THREE.ConeGeometry(0.34, 0.85, 4), earMat);
        ear.position.set(sx*0.58, 1.68, -0.6); ear.rotation.y = Math.PI/4; ear.rotation.z = sx*0.18; car.add(ear);
        const inner = new THREE.Mesh(new THREE.ConeGeometry(0.16, 0.48, 4), innerMat);
        inner.position.set(sx*0.58, 1.6, -0.55); inner.rotation.y = Math.PI/4; car.add(inner);
      } else { // cat
        const ear = new THREE.Mesh(new THREE.ConeGeometry(0.35, 0.7, 4), earMat);
        ear.position.set(sx*0.55, 1.6, -0.6); ear.rotation.y = Math.PI/4; car.add(ear);
        const inner = new THREE.Mesh(new THREE.ConeGeometry(0.18, 0.4, 4), innerMat);
        inner.position.set(sx*0.55, 1.55, -0.55); inner.rotation.y = Math.PI/4; car.add(inner);
      }
    }
    // しっぽ（後ろでゆらゆら）
    const tailCat = new THREE.Mesh(new THREE.CylinderGeometry(0.1, 0.16, 1.4, 8), earMat);
    tailCat.position.set(0.5, 1.1, 2.6);
    tailCat.rotation.x = -0.7;
    car.add(tailCat);
    car.userData.catTail = tailCat;
  }
  return car;
}

// ---------- キャラクター（サイト共通の どうぶつ） ----------
const CHARACTERS = [
  { key:'rabbit', name:'ラビィ', body:0xf4b6d2, neon:0xff5ea8, ear:'rabbit', inner:0xffd8e8, desc:'バランスがた',     spd:1.00, steer:1.00 },
  { key:'fox',    name:'コン',   body:0xef8a3a, neon:0xffb020, ear:'fox',    inner:0xffd9b0, desc:'はやいよ！',       spd:1.08, steer:0.97 },
  { key:'cat',    name:'ミィ',   body:0x10c8e8, neon:0x00ffff, ear:'cat',    inner:0xffb0d8, desc:'まがりやすい',     spd:1.00, steer:1.14 },
  { key:'panda',  name:'パオ',   body:0xeeeeee, neon:0x9d7dff, ear:'panda',  inner:0x333333, desc:'ゆっくりあんしん', spd:0.92, steer:1.05 },
];
let currentChar = CHARACTERS[0];
let player = null;
function buildPlayer(char) {
  if (player) scene.remove(player);
  player = makeCar(char.body, char.neon, true, char.ear, char.inner);
  player.userData.baseBody = char.body;
  player.userData.baseNeon = char.neon;
  player.position.set(0, 0, 0);
  scene.add(player);
  currentChar = char;
}
buildPlayer(CHARACTERS[0]);

// ---------- 敵車プール ----------
const TRAFFIC_COLORS = [0xd8355e, 0xe8b410, 0x8a3de8, 0x38d868, 0xe86a2a, 0xcccccc];
const traffic = [];
for (let i=0; i<10; i++) {
  const c = TRAFFIC_COLORS[i % TRAFFIC_COLORS.length];
  const car = makeCar(c, 0xff2fb0, false);
  car.visible = false;
  car.userData.active = false;
  car.userData.nearMissed = false;
  scene.add(car);
  traffic.push(car);
}

// ---------- ⭐ 星アイテム（ベクター描画・絵文字不使用） ----------
function makeStarGeometry() {
  const shape = new THREE.Shape();
  const outer = 0.9, inner = 0.38, N = 5;
  for (let i=0; i<N*2; i++) {
    const r = (i%2===0) ? outer : inner;
    const a = (i/(N*2)) * Math.PI*2 - Math.PI/2;
    const x = Math.cos(a)*r, y = Math.sin(a)*r;
    if (i===0) shape.moveTo(x,y); else shape.lineTo(x,y);
  }
  shape.closePath();
  return new THREE.ExtrudeGeometry(shape, { depth:0.25, bevelEnabled:false });
}
const starGeo = makeStarGeometry();
const starMat = new THREE.MeshBasicMaterial({ color:0xffe14d });
const stars = [];
for (let i=0; i<24; i++) {
  const s = new THREE.Mesh(starGeo, starMat);
  s.visible = false;
  s.userData = { active:false };
  scene.add(s);
  stars.push(s);
}

// ---------- 🌈 にじたま（レインボーアイテム） ----------
const rainbowOrbs = [];
for (let i=0; i<2; i++) {
  const orb = new THREE.Mesh(
    new THREE.OctahedronGeometry(1.0, 0),
    new THREE.MeshBasicMaterial({ color:0xff5e5e })
  );
  orb.visible = false;
  orb.userData = { active:false };
  scene.add(orb);
  rainbowOrbs.push(orb);
}

// ---------- スピードライン ----------
let speedLines;
{
  const geo = new THREE.BufferGeometry();
  const N = 220;
  const pos = new Float32Array(N*3);
  for (let i=0; i<N; i++) {
    pos[i*3]   = (Math.random()-0.5)*40;
    pos[i*3+1] = Math.random()*14;
    pos[i*3+2] = -Math.random()*220;
  }
  geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  speedLines = new THREE.Points(geo, new THREE.PointsMaterial({ color:0x88ccff, size:0.28, transparent:true, opacity:0.75 }));
  scene.add(speedLines);
}

// ============================================================
//  サウンド
// ============================================================
let audioCtx = null, muted = false;
let engineOsc = null, engineGain = null, musicTimer = null;

function initAudio() {
  if (audioCtx) return;
  audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  engineOsc = audioCtx.createOscillator();
  engineOsc.type = 'sawtooth';
  engineOsc.frequency.value = 55;
  const filt = audioCtx.createBiquadFilter();
  filt.type = 'lowpass'; filt.frequency.value = 300;
  engineGain = audioCtx.createGain();
  engineGain.gain.value = 0;
  engineOsc.connect(filt); filt.connect(engineGain); engineGain.connect(audioCtx.destination);
  engineOsc.start();
  startMusic();
}

function tone(freq, dur, type, vol, delay=0) {
  if (!audioCtx || muted) return;
  const t = audioCtx.currentTime + delay;
  const o = audioCtx.createOscillator();
  const g = audioCtx.createGain();
  o.type = type; o.frequency.value = freq;
  g.gain.setValueAtTime(vol, t);
  g.gain.exponentialRampToValueAtTime(0.001, t + dur);
  o.connect(g); g.connect(audioCtx.destination);
  o.start(t); o.stop(t + dur);
}

function startMusic() {
  if (musicTimer) return;
  const bass = [110, 87.3, 130.8, 98];
  const arps = [
    [220, 261.6, 329.6, 440],
    [174.6, 220, 261.6, 349.2],
    [261.6, 329.6, 392, 523.3],
    [196, 246.9, 293.7, 392]
  ];
  let bar = 0, step = 0;
  const BPM = 118, stepDur = 60/BPM/2;
  musicTimer = setInterval(() => {
    if (muted || !audioCtx) { step=(step+1)%8; if(step===0) bar=(bar+1)%4; return; }
    if (step % 2 === 0) tone(bass[bar], stepDur*1.8, 'triangle', 0.09);
    tone(arps[bar][step % 4], stepDur*0.9, 'square', 0.028);
    tone(7000 + Math.random()*2000, 0.03, 'square', 0.012);
    step = (step+1) % 8;
    if (step === 0) bar = (bar+1) % 4;
  }, stepDur*1000);
}

function sfxNearMiss() { tone(880, 0.12, 'sine', 0.15); tone(1320, 0.18, 'sine', 0.1, 0.05); }
function sfxStar() { tone(1046.5, 0.09, 'sine', 0.14); tone(1568, 0.14, 'sine', 0.12, 0.06); }
function sfxRainbow() {
  const seq = [523.3, 659.3, 784, 1046.5, 1318.5];
  seq.forEach((f,i) => tone(f, 0.15, 'sine', 0.12, i*0.07));
}
function sfxHit() {
  tone(200, 0.2, 'square', 0.18);
  tone(140, 0.3, 'square', 0.14, 0.08);
}
function sfxCrash() {
  if (!audioCtx || muted) return;
  const t = audioCtx.currentTime;
  const buf = audioCtx.createBuffer(1, audioCtx.sampleRate*0.5, audioCtx.sampleRate);
  const d = buf.getChannelData(0);
  for (let i=0;i<d.length;i++) d[i] = (Math.random()*2-1) * Math.pow(1 - i/d.length, 2);
  const src = audioCtx.createBufferSource(); src.buffer = buf;
  const g = audioCtx.createGain(); g.gain.setValueAtTime(0.4, t);
  src.connect(g); g.connect(audioCtx.destination); src.start(t);
  tone(70, 0.6, 'sawtooth', 0.25);
}

document.getElementById('muteBtn').addEventListener('click', function(){

});

// ---------- 入力 ----------
const input = { left:false, right:false, pointerX:null };
window.addEventListener('keydown', e => {
  if (e.code==='ArrowLeft'||e.code==='KeyA') input.left = true;
  if (e.code==='ArrowRight'||e.code==='KeyD') input.right = true;
});
window.addEventListener('keyup', e => {
  if (e.code==='ArrowLeft'||e.code==='KeyA') input.left = false;
  if (e.code==='ArrowRight'||e.code==='KeyD') input.right = false;
});
function pointerToX(clientX) {
  const r = (clientX / window.innerWidth) * 2 - 1;
  return r * 7.2;
}
container.addEventListener('pointerdown', e => { input.pointerX = pointerToX(e.clientX); });
container.addEventListener('pointermove', e => { if (input.pointerX!==null) input.pointerX = pointerToX(e.clientX); });

// ---------- 開始／終了 ----------
function startGame() {
  initAudio();
  if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
  state.running = true;
  state.speed = 0.35; state.score = 0; state.combo = 0; state.comboTimer = 0;
  state.spawnTimer = 1.5; state.starTimer = 1.0; state.orbTimer = 10;
  state.shake = 0; state.distance = 0;
  state.hearts = 3; state.invincible = 0; state.rainbow = 0; state.starCount = 0;
  state.targetX = 0;
  player.position.set(0, 0, 0);
  player.rotation.set(0,0,0);
  player.visible = true;
  traffic.forEach(c => { c.visible=false; c.userData.active=false; });
  stars.forEach(s => { s.visible=false; s.userData.active=false; });
  rainbowOrbs.forEach(o => { o.visible=false; o.userData.active=false; });
  el.title.style.display = 'none';
  el.select.style.display = 'none';
  el.over.style.display = 'none';
  el.hud.style.display = 'block';
  el.best.textContent = 'BEST ' + state.best;
  el.starsEl.textContent = '★ 0';
  updateHearts();
}

function rankMessage(n) {
  if (n >= 40) return 'スターマスター！でんせつだね！';
  if (n >= 25) return 'ほしあつめの めいじん！';
  if (n >= 12) return 'いいかんじ！つぎも がんばろう！';
  if (n >= 5)  return 'よく がんばったね！';
  return 'また いっしょに はしろうね！';
}

function gameOver() {
  state.running = false;
  sfxCrash();
  state.shake = 1.4;
  el.flash.style.transition = 'none';
  el.flash.style.opacity = 0.9;
  requestAnimationFrame(() => {
    el.flash.style.transition = 'opacity .6s';
    el.flash.style.opacity = 0;
  });
  const isRecord = state.score > state.best;
  if (isRecord) state.best = state.score;
  setTimeout(() => {
    el.hud.style.display = 'none';
    el.resultScore.textContent = state.score;
    el.resultStars.textContent = '★ ' + state.starCount + 'こ あつめたよ';
    el.resultRank.textContent = rankMessage(state.starCount);
    el.resultBest.textContent = 'BEST ' + state.best;
    el.newRecord.style.display = isRecord ? 'block' : 'none';
    el.over.style.display = 'flex';
  }, 900);
}

  try { const k='__ndt'; localStorage.setItem(k,'1'); localStorage.removeItem(k); return localStorage; }
  catch(e){ const m={}; return {
    getItem:k=> (k in m ? m[k] : null),
    setItem:(k,v)=>{ m[k]=String(v); },
    removeItem:k=>{ delete m[k]; } }; }
})();

try {

document.getElementById('retryBtn').addEventListener('click', startGame);

// ---------- スポーン ----------
function spawnTraffic() {
  const free = traffic.filter(c => !c.userData.active);
  if (!free.length) return;
  const car = free[0];
  const lane = LANES[Math.floor(Math.random()*LANES.length)];
  car.userData.active = true;
  car.userData.lane = lane;
  car.userData.speed = 0.25 + Math.random()*0.25;
  car.userData.nearMissed = false;
  car.position.set(lane, 0, -250 - Math.random()*60);
  car.rotation.set(0,0,0);
  car.visible = true;
}

function spawnStarRow() {
  const lane = LANES[Math.floor(Math.random()*LANES.length)];
  const n = 3 + Math.floor(Math.random()*3);       // 3〜5個の列
  let placed = 0;
  for (const s of stars) {
    if (s.userData.active) continue;
    s.userData.active = true;
    s.visible = true;
    s.position.set(lane, 1.5, -250 - placed*7);
    placed++;
    if (placed >= n) break;
  }
}

function spawnOrb() {
  const orb = rainbowOrbs.find(o => !o.userData.active);
  if (!orb) return;
  orb.userData.active = true;
  orb.visible = true;
  orb.position.set(LANES[Math.floor(Math.random()*LANES.length)], 1.6, -260);
}

function showCombo() {
  el.combo.textContent = 'ニアミス ×' + state.combo;
  el.combo.classList.remove('pop');
  void el.combo.offsetWidth;
  el.combo.classList.add('pop');
}

// ============================================================
//  メインループ
// ============================================================
let lastT = performance.now();
const RAINBOW_COLORS = [0xff5e5e, 0xffd25e, 0x7dff8a, 0x5ecdff, 0xc77dff];

function loop(now) {
  requestAnimationFrame(loop);
  const dt = Math.min((now - lastT)/1000, 0.05);
  lastT = now;

  if (state.running) {
    // にじいろ中はボーナス加速
    const maxSpeed = (state.rainbow > 0 ? 1.7 : 1.45) * currentChar.spd;
    state.speed = Math.min(state.speed + dt*0.024, maxSpeed);
    const worldSpeed = state.speed * 90 * dt;
    state.distance += worldSpeed;

    // --- ステアリング ---
    if (input.pointerX !== null) {
      state.targetX = input.pointerX;
    } else {
      const steer = (input.right?1:0) - (input.left?1:0);
      state.targetX += steer * dt * 16 * currentChar.steer;
    }
    state.targetX = Math.max(-7.2, Math.min(7.2, state.targetX));
    const dx = state.targetX - player.position.x;
    player.position.x += dx * Math.min(dt*9*currentChar.steer, 1);
    player.rotation.z = -dx * 0.08;
    player.rotation.y = -dx * 0.06;

    // ネコしっぽゆらゆら
    if (player.userData.catTail) {
      player.userData.catTail.rotation.z = Math.sin(now*0.006) * 0.5;
    }

    // --- 無敵／にじいろタイマー ---
    if (state.invincible > 0) {
      state.invincible -= dt;
      player.visible = (Math.floor(now/100) % 2 === 0);   // 点滅
      if (state.invincible <= 0) player.visible = true;
    }
    if (state.rainbow > 0) {
      state.rainbow -= dt;
      const c = RAINBOW_COLORS[Math.floor(now/120) % RAINBOW_COLORS.length];
      player.userData.neonMesh.material.color.setHex(c);
      player.userData.bodyMesh.material.color.setHex(c);
      playerGlow.color.setHex(c);
      el.rainbowMsg.style.opacity = 1;
      if (state.rainbow <= 0) {
        player.userData.neonMesh.material.color.setHex(player.userData.baseNeon);
        player.userData.bodyMesh.material.color.setHex(player.userData.baseBody);
        playerGlow.color.setHex(0x00ccff);
        el.rainbowMsg.style.opacity = 0;
      }
    }

    // --- スクロール ---
    roadGroup.children.forEach(seg => {
      seg.position.z += worldSpeed;
      if (seg.position.z > SEG_LEN) seg.position.z -= SEG_COUNT*SEG_LEN;
    });
    buildings.forEach(b => {
      b.position.z += worldSpeed;
      if (b.position.z > 30) b.position.z -= SEG_COUNT*SEG_LEN;
    });

    // --- スピードライン ---
    {
      const p = speedLines.geometry.attributes.position;
      for (let i=0; i<p.count; i++) {
        let z = p.getZ(i) + worldSpeed*2.2;
        if (z > 8) z = -220;
        p.setZ(i, z);
      }
      p.needsUpdate = true;
      speedLines.material.opacity = 0.25 + state.speed*0.4;
    }

    // --- スポーンタイマー ---
    state.spawnTimer -= dt;
    if (state.spawnTimer <= 0) {
      spawnTraffic();
      state.spawnTimer = Math.max(0.4, 1.5 - state.speed*0.55) * (0.7 + Math.random()*0.6);
    }
    state.starTimer -= dt;
    if (state.starTimer <= 0) {
      spawnStarRow();
      state.starTimer = 2.5 + Math.random()*2.5;
    }
    state.orbTimer -= dt;
    if (state.orbTimer <= 0) {
      spawnOrb();
      state.orbTimer = 14 + Math.random()*8;
    }

    // --- 敵車 ---
    for (const car of traffic) {
      if (!car.userData.active) continue;
      car.position.z += worldSpeed - car.userData.speed*90*dt;

      const zd = Math.abs(car.position.z - player.position.z);
      const xd = Math.abs(car.position.x - player.position.x);
      if (zd < 4.0 && xd < 2.0) {
        if (state.rainbow > 0) {
          // にじいろ中は はじきとばす！
          car.userData.active = false; car.visible = false;
          state.score += 300;
          showPraise('ドーン！');
          sfxNearMiss();
        } else if (state.invincible <= 0) {
          // ハートを1つ失う
          state.hearts--;
          updateHearts();
          sfxHit();
          state.shake = 0.9;
          state.combo = 0;
          car.userData.active = false; car.visible = false;
          if (state.hearts <= 0) {
            gameOver();
          } else {
            state.invincible = 2.0;
            showPraise('だいじょうぶ！');
          }
        }
      } else if (!car.userData.nearMissed && car.position.z > player.position.z + 2 && xd < 3.6) {
        car.userData.nearMissed = true;
        state.combo++;
        state.comboTimer = 3.0;
        state.score += 100 * state.combo;
        showCombo();
        sfxNearMiss();
      }
      if (car.position.z > 25) { car.userData.active = false; car.visible = false; }
    }

    // --- ⭐ 星の移動＆取得 ---
    for (const s of stars) {
      if (!s.userData.active) continue;
      s.position.z += worldSpeed;
      s.rotation.y += dt*3;
      s.rotation.z = Math.sin(now*0.004 + s.position.z)*0.2;
      const zd = Math.abs(s.position.z - player.position.z);
      const xd = Math.abs(s.position.x - player.position.x);
      if (zd < 3.2 && xd < 2.0) {
        s.userData.active = false; s.visible = false;
        state.starCount++;
        state.score += 50;
        el.starsEl.textContent = '★ ' + state.starCount;
        sfxStar();
        if (state.starCount % 5 === 0) {
          showPraise(PRAISES[Math.floor(Math.random()*PRAISES.length)]);
        }
      }
      if (s.position.z > 20) { s.userData.active = false; s.visible = false; }
    }

    // --- 🌈 にじたま ---
    for (const orb of rainbowOrbs) {
      if (!orb.userData.active) continue;
      orb.position.z += worldSpeed;
      orb.rotation.y += dt*4;
      orb.rotation.x += dt*2;
      orb.material.color.setHex(RAINBOW_COLORS[Math.floor(now/100) % RAINBOW_COLORS.length]);
      orb.position.y = 1.6 + Math.sin(now*0.005)*0.4;
      const zd = Math.abs(orb.position.z - player.position.z);
      const xd = Math.abs(orb.position.x - player.position.x);
      if (zd < 3.5 && xd < 2.2) {
        orb.userData.active = false; orb.visible = false;
        state.rainbow = 6.0;
        state.score += 200;
        sfxRainbow();
        showPraise('にじいろパワー！');
      }
      if (orb.position.z > 20) { orb.userData.active = false; orb.visible = false; }
    }

    // --- コンボタイマー ---
    if (state.comboTimer > 0) {
      state.comboTimer -= dt;
      if (state.comboTimer <= 0) { state.combo = 0; el.combo.classList.remove('pop'); }
    }

    state.score += Math.round(worldSpeed * 1.2);
    el.speedNum.textContent = Math.round(60 + state.speed*160);
    el.scoreNum.textContent = state.score;

    if (engineOsc && audioCtx) {
      engineOsc.frequency.value = 50 + state.speed*90 + Math.sin(now*0.02)*3;
      engineGain.gain.value = muted ? 0 : 0.045 + state.speed*0.02;
    }
  }

  // --- カメラ ---
  const camTargetX = player.position.x * 0.55;
  camera.position.x += (camTargetX - camera.position.x) * Math.min(dt*5, 1);
  camera.position.y = 4.6;
  camera.position.z = 9.5;
  camera.fov = 72 + state.speed*16;
  camera.updateProjectionMatrix();
  if (state.shake > 0) {
    state.shake = Math.max(0, state.shake - dt*2.5);
    camera.position.x += (Math.random()-0.5)*state.shake;
    camera.position.y += (Math.random()-0.5)*state.shake;
  }
  camera.lookAt(player.position.x*0.55, 1.6, -30);
  playerGlow.position.set(player.position.x, 1.5, player.position.z);

  renderer.render(scene, camera);
}
requestAnimationFrame(loop);

})();
