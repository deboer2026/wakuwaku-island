<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>しりとりブリッジ3D - ことばを つないで はしを わたろう</title>
<link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@700;800;900&family=DotGothic16&display=swap" rel="stylesheet">
<style>:root{
  --ink:#33474F; --paper:#FFFCF6; --acc:#2FA8C4; --acc2:#F2705A;
  --panel:rgba(255,252,246,.95); --hud:rgba(50,44,60,.44);
  --btn1:#3FBBD4; --btn2:#2A8FA8; --bg0:#9FD8EE;
  --logoInk:#1E6E85; --logoShade:#134C5E; --logoGlow:rgba(150,235,255,.95);
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{width:100%;height:100%;overflow:hidden;user-select:none;-webkit-user-select:none;
  font-family:'M PLUS Rounded 1c','Hiragino Maru Gothic ProN',sans-serif;color:var(--ink);}
body{background:var(--bg0);}
#cv{display:block;position:fixed;inset:0;width:100%;height:100%;z-index:0;touch-action:none;}
#loading,#fallback{position:fixed;inset:0;z-index:200;display:none;flex-direction:column;
  align-items:center;justify-content:center;gap:14px;background:var(--bg0);text-align:center;padding:24px;}
#loading.on,#fallback.on{display:flex;}
.spin{width:44px;height:44px;border-radius:50%;border:5px solid rgba(255,255,255,.55);
  border-top-color:var(--acc);animation:sp 1s linear infinite;}
@keyframes sp{to{transform:rotate(360deg)}}
#loading p,#fallback p{font-weight:800;font-size:15px;line-height:1.7;}

/* HUD */
#hud{position:fixed;top:0;left:0;right:0;z-index:40;display:none;pointer-events:none;
  padding:max(8px,var(--sat,0px)) max(10px,var(--sar,0px)) 0 max(10px,var(--sal,0px));}
#hud.on{display:block;}
#hud button{pointer-events:auto;}
.hud-row{display:flex;align-items:center;justify-content:space-between;gap:8px;}
.hud-l{display:flex;gap:6px;align-items:center;min-width:0;}
.hud-r{display:flex;gap:6px;flex:none;}
.hbtn{background:var(--hud);border:1px solid rgba(255,255,255,.3);border-radius:13px;padding:6px 11px;
  font-size:13px;font-weight:800;color:#FFFCF6;font-family:inherit;flex:none;}
.hround{background:var(--hud);border:1px solid rgba(255,255,255,.3);border-radius:50%;width:32px;height:32px;
  font-size:15px;display:flex;align-items:center;justify-content:center;color:#FFFCF6;}
#hud-stage{font-size:12.5px;font-weight:900;color:#FFFCF6;text-shadow:0 2px 6px rgba(30,20,10,.6);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}

/* しつもん */
#qpanel{position:fixed;left:50%;transform:translateX(-50%);top:calc(max(8px,var(--sat,0px)) + 44px);
  z-index:38;width:min(94vw,470px);background:var(--panel);border-radius:22px;padding:10px 12px 11px;
  box-shadow:0 8px 24px rgba(60,40,20,.22);display:none;}
#qpanel.on{display:block;}
.qrow{display:flex;align-items:center;gap:11px;}
#q-icon{flex:none;width:80px;height:80px;border-radius:16px;background:#FFFCF6;box-shadow:0 2px 8px rgba(80,60,30,.14);cursor:pointer;}
.qright{flex:1;min-width:0;}
#q-word{font-size:27px;font-weight:900;letter-spacing:.02em;line-height:1.15;}
#q-word .tail{color:var(--acc2);text-shadow:0 0 12px rgba(232,88,106,.35);}
#q-ask{font-size:13px;font-weight:800;color:#8A7A6A;margin-top:2px;}
#q-ask b{color:var(--acc2);font-size:17px;}
.qmeta{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:4px;}
#q-sub{font-size:11.5px;font-weight:800;color:#A99B88;}
#q-prog{font-size:12px;font-weight:900;color:var(--acc);flex:none;}
#prog-bar{height:6px;border-radius:3px;background:#EDE4D4;margin-top:5px;overflow:hidden;}
#prog-fill{height:100%;width:0;border-radius:3px;background:linear-gradient(90deg,#F5C24E,#E8873F);transition:width .5s cubic-bezier(.2,1,.3,1);}

/* せんたくし */
#choicebar{position:fixed;left:50%;transform:translateX(-50%);z-index:38;
  bottom:calc(max(10px,var(--sab,0px)) + 4px);width:min(96vw,520px);display:none;flex-direction:column;gap:8px;}
#choicebar.on{display:flex;}
#choices{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;}
.choice{background:var(--panel);border:3px solid #E6DAC6;border-radius:18px;padding:7px 6px 6px;
  font-family:inherit;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px;
  min-width:78px;box-shadow:0 4px 0 rgba(0,0,0,.1),0 8px 18px rgba(50,30,10,.16);}
.choice:active{transform:translateY(2px);box-shadow:0 2px 0 rgba(0,0,0,.1);}
.choice canvas{display:block;}
.clabel{font-size:13px;font-weight:900;color:var(--ink);line-height:1.2;}
.clabel b{color:var(--acc2);font-size:15px;}
.choice.hint{border-color:var(--acc);background:#FFF6E4;animation:hp 1s ease-in-out infinite;}
@keyframes hp{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
.choice.ng{animation:ng .38s ease;}
@keyframes ng{0%,100%{transform:translateX(0)}25%{transform:translateX(-7px)}75%{transform:translateX(7px)}}
.cbtns{display:flex;gap:8px;justify-content:center;}
.pbtn{border:none;border-radius:16px;padding:8px 16px;font-family:inherit;font-size:13.5px;font-weight:900;
  color:#FFFCF6;box-shadow:0 4px 0 rgba(0,0,0,.16);}
.pbtn:active{transform:translateY(2px);box-shadow:0 2px 0 rgba(0,0,0,.16);}
.pbtn.a{background:linear-gradient(180deg,var(--btn1),var(--btn2));}
.pbtn.b{background:linear-gradient(180deg,#9BA8C4,#7A88A8);}

/* オーバーレイ がめん */
.sc{position:fixed;inset:0;z-index:60;display:none;flex-direction:column;overflow-y:auto;
  padding:max(14px,var(--sat,0px)) max(12px,var(--sar,0px)) max(14px,var(--sab,0px)) max(12px,var(--sal,0px));}
.sc.on{display:flex;}
.sc:empty{display:none !important;pointer-events:none;}
.sc-in{width:100%;max-width:520px;margin:auto;}
.ttl{font-family:'DotGothic16',sans-serif;font-size:clamp(27px,8vw,40px);line-height:1.24;text-align:center;
  color:#FFFCF6;margin-bottom:6px;text-shadow:0 0 18px rgba(150,235,255,.95),0 4px 0 rgba(30,105,125,.65),0 9px 20px rgba(10,50,65,.35);}
.sub{text-align:center;font-size:13.5px;font-weight:800;color:#FFFCF6;text-shadow:0 2px 7px rgba(50,30,10,.6);
  margin-bottom:16px;line-height:1.6;}
.card{background:var(--panel);border-radius:24px;padding:16px 14px;box-shadow:0 10px 30px rgba(70,45,20,.26);}
.btn{display:block;width:100%;border:none;border-radius:20px;padding:14px;font-family:inherit;font-size:18px;
  font-weight:900;color:#FFFCF6;margin-top:10px;background:linear-gradient(180deg,var(--btn1),var(--btn2));
  box-shadow:0 5px 0 rgba(0,0,0,.16),0 10px 22px rgba(50,30,10,.22);}
.btn:active{transform:translateY(2px);box-shadow:0 3px 0 rgba(0,0,0,.16);}
.btn.g{background:linear-gradient(180deg,#9BA8C4,#7A88A8);font-size:16px;padding:12px;}
.btn.p{background:linear-gradient(180deg,#8FD07A,#5FA84E);}
.rrow.done .risl{background:linear-gradient(180deg,#F5C24E,#E8A02F);}

#mode-list{display:flex;flex-direction:column;gap:11px;}
.mcard{border:none;border-radius:22px;padding:15px 16px;font-family:inherit;display:flex;align-items:center;
  gap:14px;color:#FFFCF6;text-align:left;box-shadow:0 6px 0 rgba(0,0,0,.14),0 10px 24px rgba(40,25,10,.2);}
.mcard:active{transform:translateY(2px);box-shadow:0 4px 0 rgba(0,0,0,.14);}
.mbig{font-family:'DotGothic16',sans-serif;font-size:32px;line-height:1;flex:none;min-width:56px;text-align:center;
  text-shadow:0 3px 0 rgba(0,0,0,.18);}
.mname{font-size:19px;font-weight:900;flex:1;text-shadow:0 2px 4px rgba(0,0,0,.2);}
.mstar{font-size:13px;font-weight:900;flex:none;opacity:.92;}

/* ルートマップ (しまが みちで つながる) */
#route-sum{display:inline-block;margin-left:10px;color:#FFE9A8;}
.route{position:relative;padding:6px 0 4px;}
.route::before{content:'';position:absolute;left:31px;top:16px;bottom:16px;width:6px;margin-left:-3px;
  border-radius:3px;background:repeating-linear-gradient(180deg,rgba(255,252,246,.9) 0 11px,rgba(255,252,246,0) 11px 21px);}
.rrow{position:relative;display:flex;align-items:center;gap:11px;margin:9px 0;}
.risl{flex:none;width:62px;height:62px;border-radius:50%;border:4px solid #FFFCF6;
  background:linear-gradient(180deg,#8FC46E,#5FA84E);font-family:inherit;
  display:flex;align-items:center;justify-content:center;
  box-shadow:0 5px 0 rgba(0,0,0,.16),0 8px 18px rgba(30,60,50,.28);}
.risl:active{transform:translateY(2px);box-shadow:0 3px 0 rgba(0,0,0,.16);}
.rno{font-family:'DotGothic16',sans-serif;font-size:26px;color:#FFFCF6;text-shadow:0 3px 0 rgba(60,110,60,.55);}
.rrow.done .risl{background:linear-gradient(180deg,#F5C24E,#E8A02F);}
.rrow.lock .risl{background:linear-gradient(180deg,#C8C2B4,#A69E90);box-shadow:0 4px 0 rgba(0,0,0,.12);}
.rrow.here .risl{animation:hereP 1.5s ease-in-out infinite;}
@keyframes hereP{0%,100%{transform:scale(1)}50%{transform:scale(1.09)}}
.rinfo{flex:1;min-width:0;background:var(--panel);border-radius:16px;padding:8px 12px;
  box-shadow:0 4px 14px rgba(40,60,60,.2);}
.rrow.lock .rinfo{background:rgba(240,236,228,.85);}
.rname{font-size:15px;font-weight:900;line-height:1.25;}
.rmeta{font-size:11.5px;font-weight:800;color:#8A7A6A;margin-top:1px;}
.rstarline{font-size:13px;color:var(--acc);letter-spacing:1px;line-height:1.3;}
.rrow.here .rinfo{border:2.5px solid var(--acc);}

#res-stars{display:flex;justify-content:center;gap:10px;margin:6px 0 10px;}
.rstar{width:52px;height:52px;font-size:40px;line-height:52px;text-align:center;color:#D8CDBA;transform:scale(.6);
  transition:transform .35s cubic-bezier(.2,1.5,.4,1),color .3s;}
.rstar.on{color:var(--acc);transform:scale(1);text-shadow:0 0 16px rgba(245,169,63,.85);}
#res-chain{display:flex;flex-wrap:wrap;gap:4px;justify-content:center;align-items:center;
  font-size:14px;font-weight:900;line-height:1.7;}
#res-chain .arw{color:var(--acc);}
#res-chain .cw{background:#FFF3DC;border-radius:9px;padding:2px 8px;}
#res-allclear{display:none;text-align:center;font-size:14px;font-weight:900;color:var(--acc2);margin-top:10px;}

@media (orientation:landscape) and (max-height:520px){
  #qpanel{top:calc(max(4px,var(--sat,0px)) + 34px);padding:6px 10px 7px;border-radius:16px;width:min(96vw,600px);}
  #q-word{font-size:21px;} #q-ask{font-size:11.5px;} #q-ask b{font-size:15px;}
  #prog-bar{height:5px;margin-top:3px;}
  .choice{min-width:66px;padding:5px 5px 4px;border-radius:14px;border-width:2px;}
  .clabel{font-size:11.5px;} .clabel b{font-size:13px;}
  .pbtn{padding:6px 13px;font-size:12px;}
  .ttl{font-size:clamp(22px,5.5vh,30px);} .sub{font-size:12px;margin-bottom:10px;}
  .btn{padding:10px;font-size:16px;border-radius:16px;margin-top:8px;}
}

/* ============ リッチ タイトル ============ */
#sc-title .sc-in{position:relative;margin-top:auto;margin-bottom:8vh;}
.logo{font-family:'DotGothic16',sans-serif;text-align:center;line-height:1.02;margin:0 0 4px;}
.logo .ch{display:inline-block;font-size:clamp(34px,11.5vw,58px);color:#FFFCF6;
  text-shadow:
    3px 0 0 var(--logoInk),-3px 0 0 var(--logoInk),0 3px 0 var(--logoInk),0 -3px 0 var(--logoInk),
    2px 2px 0 var(--logoInk),-2px 2px 0 var(--logoInk),2px -2px 0 var(--logoInk),-2px -2px 0 var(--logoInk),
    0 7px 0 var(--logoShade), 0 0 26px var(--logoGlow), 0 14px 26px rgba(0,30,40,.35);
  animation:logoIn .55s cubic-bezier(.2,1.6,.4,1) backwards, logoFloat 3.2s ease-in-out infinite;
  animation-delay:calc(var(--i) * .07s), calc(var(--i) * .12s);}
.logo .br{display:block;height:0;}
@keyframes logoIn{0%{opacity:0;transform:translateY(-38px) scale(.5) rotate(-12deg)}100%{opacity:1;transform:none}}
@keyframes logoFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
.tagwrap{text-align:center;}
.tagline{display:inline-block;font-size:13px;font-weight:900;color:#FFFCF6;
  background:rgba(20,60,72,.36);border:1.5px solid rgba(255,255,255,.42);
  border-radius:999px;padding:6px 16px;line-height:1.5;margin:8px auto 4px;
  text-shadow:0 2px 6px rgba(10,40,50,.5);}
.sparks{position:absolute;inset:-18px 0 auto;height:200px;pointer-events:none;overflow:hidden;}
.sparks i{position:absolute;font-style:normal;font-size:15px;color:#FFFCF6;opacity:0;
  text-shadow:0 0 10px var(--logoGlow);animation:tw 2.6s ease-in-out infinite;}
@keyframes tw{0%,100%{opacity:0;transform:scale(.4) rotate(0)}45%{opacity:1;transform:scale(1.15) rotate(22deg)}}
.btn.big{font-size:22px;padding:18px;border-radius:24px;position:relative;overflow:hidden;
  animation:bp 2.1s ease-in-out infinite;}
@keyframes bp{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
.btn.big::after{content:'';position:absolute;top:0;left:-60%;width:45%;height:100%;
  background:linear-gradient(100deg,transparent,rgba(255,255,255,.55),transparent);
  animation:shine 3.4s ease-in-out infinite;}
@keyframes shine{0%{left:-60%}55%{left:120%}100%{left:120%}}
.btn.big:active{animation:none;transform:translateY(2px);}
.badgewrap{text-align:center;margin-top:10px;}
.starbadge{display:inline-flex;align-items:center;gap:6px;background:rgba(255,252,246,.94);
  border-radius:999px;padding:5px 14px;font-size:13px;font-weight:900;color:var(--ink);
  box-shadow:0 4px 12px rgba(10,40,50,.24);}
.starbadge b{color:var(--acc);font-size:15px;}</style>
</head>
<body>
<canvas id="cv"></canvas>
<div id="loading" class="on"><div class="spin"></div><p>はしを かけています…</p></div>
<div id="fallback"><p>このブラウザでは 3Dが つかえません。<br>べつの ブラウザで ためしてね。</p></div>

<div id="hud">
  <div class="hud-row">
    <div class="hud-l">
      <button class="hbtn" id="btn-hud-back">◀ もどる</button>
      <span id="hud-stage"></span>
    </div>
    <div class="hud-r">
      <button class="hround" id="bgm-btn">🔊</button>
      <button class="hround" id="btn-hud-home">🏠</button>
    </div>
  </div>
</div>

<div id="qpanel">
  <div class="qrow">
    <canvas id="q-icon"></canvas>
    <div class="qright">
      <div id="q-word"></div>
      <div id="q-ask"></div>
      <div class="qmeta"><span id="q-sub"></span><span id="q-prog"></span></div>
      <div id="prog-bar"><div id="prog-fill"></div></div>
    </div>
  </div>
</div>

<div id="choicebar">
  <div id="choices"></div>
  <div class="cbtns">
    <button class="pbtn a" id="btn-say">🔈 もういちど</button>
    <button class="pbtn b" id="btn-hint">💡 ヒント</button>
  </div>
</div>

<section class="sc" id="sc-title"><div class="sc-in">
  <div class="sparks" id="sparks"></div>
  <h1 class="logo" id="logo" data-text="しりとり|ブリッジ">しりとりブリッジ</h1>
  <div class="tagwrap"><span class="tagline">ことばを つないで はしを のばそう！<br>しりとりで ゴールの しまへ</span></div>
  <button class="btn big" id="btn-start">▶ はしを わたる</button>
  <div class="badgewrap" id="badge-wrap" style="display:none"><span class="starbadge" id="star-badge"></span></div>
</div></section>


<section class="sc" id="sc-mode"><div class="sc-in">
  <h1 class="ttl">なにで あそぶ？</h1>
  <p class="sub">すきな ことばを えらんでね</p>
  <div id="mode-list"></div>
  <button class="btn g" id="btn-mode-back">◀ もどる</button>
</div></section>

<section class="sc" id="sc-stage"><div class="sc-in">
  <h1 class="ttl" id="stage-title"></h1>
  <p class="sub">しまを タップして しゅっぱつ！<span id="route-sum"></span></p>
  <div id="stage-list" class="route"></div>
  <button class="btn g" id="btn-stage-back">◀ もどる</button>
</div></section>

<section class="sc" id="sc-result"><div class="sc-in">
  <h1 class="ttl" id="res-title"></h1>
  <p class="sub" id="res-sub"></p>
  <div class="card">
    <div id="res-stars">
      <div class="rstar" id="res-star1">★</div>
      <div class="rstar" id="res-star2">★</div>
      <div class="rstar" id="res-star3">★</div>
    </div>
    <div id="res-chain"></div>
    <div id="res-allclear">🎉 ぜんぶ わたりきった！ すごい！</div>
  </div>
  <button class="btn" id="res-next">▶ つぎへ</button>
  <button class="btn g" id="res-retry">↺ もういちど</button>
  <button class="btn g" id="res-back">◀ ステージ</button>
</div></section>

    var flag=new T.Mesh(new T.PlaneGeometry(1.5,0.95),
      new T.MeshLambertMaterial({color:TH.flag||0xE8586A,side:T.DoubleSide}));
    flag.position.set(goalIsland.position.x+0.78,2.7,0); bridgeGroup.add(flag);
    anims.push({o:flag,fn:function(o,t){o.rotation.y=Math.sin(t*2.2)*0.35;}});
    /* あいぼう */
    if(partner)bridgeGroup.remove(partner);
    var pi=0; for(var mi=0;mi<CFG.modes.length;mi++)if(CFG.modes[mi].key===ST.mode)pi=mi;
    partner=buildPartner(CFG.partners[pi%CFG.partners.length]);
    partner.position.set(-STEP*1.6,0,0); partner.rotation.y=Math.PI/2.2;
    bridgeGroup.add(partner);
    ST.planks=[];
  }

  function addPlank(){
    var p=makePlank(ST.step);
    var x=ST.step*STEP;
    p.position.set(x,-1.2,0);
    p.scale.setScalar(0.01);
    bridgeGroup.add(p);
    ST.planks.push({o:p,t:0,y:-1.2});
    return p;
  }

  /* ---------- せんたくし ---------- */
  function drawIcon(cv,name,size){
    var dpr=Math.min(global.devicePixelRatio||1,2);
    cv.width=size*dpr; cv.height=size*dpr;
    cv.style.width=size+'px'; cv.style.height=size+'px';
    var g=cv.getContext('2d'); g.setTransform(dpr,0,0,dpr,0,0);
    g.clearRect(0,0,size,size);
    if(global.MojiIcons)global.MojiIcons.draw(g,name,size,0.05);
  }

  function renderQuestion(){
    var md=modeDef(ST.mode);
    drawIcon($('q-icon'),ST.cur.i,80);
    var w=$('q-word'); if(w){
      w.innerHTML='';
      var txt=ST.cur.t, tail=tailOf(txt,md);
      for(var i=0;i<txt.length;i++){
        var s=document.createElement('span');
        s.textContent=txt[i];
        if(i===txt.length-1)s.className='tail';
        w.appendChild(s);
      }
    }
    var ask=$('q-ask');
    if(ask)ask.innerHTML=md.askPre+'<b>'+tailOf(ST.cur.t,md)+'</b>'+md.askPost;
    var sub=$('q-sub'); if(sub)sub.textContent=ST.cur.j&&ST.cur.j!==ST.cur.t?ST.cur.j:'';
    var pg=$('q-prog'); if(pg)pg.textContent=ST.step+' / '+(ST.chain.length-1);
    var bar=$('prog-fill'); if(bar)bar.style.width=(ST.step/(ST.chain.length-1)*100)+'%';
  }

  function renderChoices(){
    var md=modeDef(ST.mode);
    var box=$('choices'); if(!box)return;
    box.innerHTML='';
    var right=ST.chain[ST.step+1];
    if(!right)return;
    var need=tailOf(ST.cur.t,md);
    /* ダミー: あたまの おとが ちがう ことば */
    var pool=md.pool.filter(function(w){
      return w.t!==right.t && w.t!==ST.cur.t && headOf(w.t)!==need;
    });
    var nOpt=clamp(2+Math.floor(ST.stage/2),2,3);   /* ダミー2〜3 */
    var opts=shuffle(pool).slice(0,nOpt).concat([right]);
    opts=shuffle(opts);
    for(var i=0;i<opts.length;i++){
      (function(w){
        var b=document.createElement('button');
        b.className='choice';
        var cv=document.createElement('canvas'); b.appendChild(cv);
        var lb=document.createElement('div'); lb.className='clabel'; lb.textContent=w.t;
        /* あたまの もじを めだたせる */
        lb.innerHTML='<b>'+w.t[0]+'</b>'+w.t.slice(1);
        b.appendChild(lb);
        b.onclick=function(){ choose(w,b); };
        box.appendChild(b);
        drawIcon(cv,w.i,56);
      })(opts[i]);
    }
  }

  function speakCur(){
    var md=modeDef(ST.mode);
    Voice.speak(ST.cur.t,md.lang,md.rate||0.8);
  }

  /* ---------- せんたく ---------- */
  function choose(w,btn){
    SB.unlockAudio();
    if(ST.locked||!running)return;
    var right=ST.chain[ST.step+1];
    if(w.t!==right.t){
      ST.miss++;
      SFX.wrong();
      btn.classList.remove('ng'); void btn.offsetWidth; btn.classList.add('ng');
      if(ST.miss>=TUNE.HINT_MISS_COUNT)hintOn();
      return;
    }
    ST.locked=true;
    SFX.ok();
    SV.dex[ST.mode+':'+w.t]=1; SB.saveNow();
    /* はしを のばして あるく */
    var p=addPlank();
    burst(new T.Vector3(ST.step*STEP,0.6,0),TH.spark||0xFFE9A8,14);
    ST.step++;
    ST.cur=w;
    ST.walkTo=ST.step*STEP;
    var md=modeDef(ST.mode);
    setTimeout(function(){ Voice.speak(w.t,md.lang,md.rate||0.8); },260);
    var box=$('choices'); if(box)box.innerHTML='';
    renderQuestion();
    setTimeout(function(){
      if(ST.step>=ST.chain.length-1){ stageClear(); return; }
      ST.locked=false;
      renderQuestion(); renderChoices();
    },TUNE.ANSWER_NEXT_MS);
  }

  function hintOn(){
    var box=$('choices'); if(!box)return;
    var right=ST.chain[ST.step+1];
    var kids=box.children;
    for(var i=0;i<kids.length;i++){
      var lb=kids[i].querySelector('.clabel');
      if(lb&&lb.textContent===right.t)kids[i].classList.add('hint');
    }
  }

  /* ---------- クリア ---------- */
  function stageClear(){
    running=false; ST.locked=true;
    SFX.clear();
    ST.walkTo=ST.step*STEP+STEP*1.6;    /* ゴールの しまへ */
    for(var i=0;i<3;i++)
      burst(new T.Vector3(goalIsland.position.x+rnd(-2,2),rnd(1,4),rnd(-1,1)),
            [0xFFE08A,0xE8586A,0x8FD0F0][i],16);
    var stars=ST.miss===0?3:(ST.miss<=2?2:1);
    var k=sKey(ST.mode,ST.stage);
    if((SV.stars[k]||0)<stars)SV.stars[k]=stars;
    SB.saveNow();
    var md=modeDef(ST.mode);
    setTimeout(function(){
      var t=$('res-title'); if(t)t.textContent=md.stages[ST.stage].name;
      var s=$('res-sub'); if(s)s.textContent=ST.miss===0?(CFG.text.perfect):(CFG.text.good);
      var ch=$('res-chain');
      if(ch){ ch.innerHTML='';
        for(var i=0;i<ST.chain.length;i++){
          if(i){var ar=document.createElement('span');ar.className='arw';ar.textContent='→';ch.appendChild(ar);}
          var sp=document.createElement('span');sp.className='cw';sp.textContent=ST.chain[i].t;ch.appendChild(sp);
        }
      }
      for(var j=1;j<=3;j++){
        var el=$('res-star'+j); if(!el)continue; el.classList.remove('on');
        if(j<=stars)(function(e,n){setTimeout(function(){e.classList.add('on');SFX.star(n);},220+n*TUNE.STAR_STAGGER_MS);})(el,j);
      }
      var last=ST.stage>=md.stages.length-1;
      var nx=$('res-next'); if(nx)nx.style.display=last?'none':'block';
      var ac=$('res-allclear'); if(ac)ac.style.display=last?'block':'none';
      goScreen('result');
    },TUNE.RESULT_SHOW_MS);
  }

  /* ---------- がめん ---------- */
  var SCREENS=['title','mode','stage','result'];
  var current='title';
  function goScreen(n){
    current=n;
    for(var i=0;i<SCREENS.length;i++){
      var el=$('sc-'+SCREENS[i]); if(el)el.classList.toggle('on',SCREENS[i]===n);
    }
    var hud=$('hud'); if(hud)hud.classList.toggle('on',n==='play');
    var qp=$('qpanel'); if(qp)qp.classList.toggle('on',n==='play');
    var cb=$('choicebar'); if(cb)cb.classList.toggle('on',n==='play');
    if(bridgeGroup)bridgeGroup.visible=(n==='play'||n==='result'||n==='title');
    if(n==='title'){ buildLogo(); titleScene(); }
    else if(n!=='play'&&n!=='result') titleMode=false;
    if(n!=='play')Voice.stop();
  }

  /* ---------- あいぼう・モード・ステージ せんたく ---------- */
  function drawFace(cv,p){
    var size=76,dpr=Math.min(global.devicePixelRatio||1,2);
    cv.width=size*dpr;cv.height=size*dpr;cv.style.width=size+'px';cv.style.height=size+'px';
    var g=cv.getContext('2d');g.setTransform(dpr,0,0,dpr,0,0);
    var S=size,cx=S/2,cy=S*0.56,r=S*0.31,INK='#4A3B32';
    var hex=function(n){return '#'+('000000'+n.toString(16)).slice(-6);};
    var body=hex(p.body),belly=hex(p.belly),ac=hex(p.acc||0xF5C24E);
    g.lineJoin='round';g.lineCap='round';
    function fs(c,w){g.fillStyle=c;g.fill();g.strokeStyle=INK;g.lineWidth=w||2.6;g.stroke();}
    if(p.ear==='round'){
      g.beginPath();g.arc(cx-r*.82,cy-r*.72,r*.4,0,6.3);fs(body);
      g.beginPath();g.arc(cx+r*.82,cy-r*.72,r*.4,0,6.3);fs(body);
    }else if(p.ear==='pointy'){
      g.beginPath();g.moveTo(cx-r*.9,cy-r*.3);g.lineTo(cx-r*.7,cy-r*1.5);g.lineTo(cx-r*.1,cy-r*.75);g.closePath();fs(body);
      g.beginPath();g.moveTo(cx+r*.9,cy-r*.3);g.lineTo(cx+r*.7,cy-r*1.5);g.lineTo(cx+r*.1,cy-r*.75);g.closePath();fs(body);
    }else if(p.ear==='long'){
      g.beginPath();g.ellipse(cx-r*.42,cy-r*1.24,r*.2,r*.62,.12,0,6.3);fs(body);
      g.beginPath();g.ellipse(cx+r*.42,cy-r*1.24,r*.2,r*.62,-.12,0,6.3);fs(body);
    }else if(p.ear==='antenna'){
      g.beginPath();g.moveTo(cx,cy-r*.9);g.lineTo(cx,cy-r*1.6);g.strokeStyle=INK;g.lineWidth=3;g.stroke();
      g.beginPath();g.arc(cx,cy-r*1.78,r*.22,0,6.3);fs(ac,2.2);
    }
    g.beginPath();g.arc(cx,cy,r,0,6.3);fs(body);
    g.beginPath();g.ellipse(cx,cy+r*.34,r*.46,r*.34,0,0,6.3);fs(belly,2.2);
    g.fillStyle=INK;
    g.beginPath();g.arc(cx-r*.36,cy-r*.1,r*.13,0,6.3);g.fill();
    g.beginPath();g.arc(cx+r*.36,cy-r*.1,r*.13,0,6.3);g.fill();
    g.fillStyle='#fff';
    g.beginPath();g.arc(cx-r*.31,cy-r*.16,r*.05,0,6.3);g.fill();
    g.beginPath();g.arc(cx+r*.41,cy-r*.16,r*.05,0,6.3);g.fill();
    g.fillStyle=INK;g.beginPath();g.ellipse(cx,cy+r*.22,r*.1,r*.075,0,0,6.3);g.fill();
    g.beginPath();g.moveTo(cx-r*.18,cy+r*.4);g.quadraticCurveTo(cx,cy+r*.58,cx+r*.18,cy+r*.4);
    g.strokeStyle=INK;g.lineWidth=2.2;g.stroke();
    if(p.accType==='crown'){
      g.beginPath();g.moveTo(cx-r*.5,cy-r*.86);g.lineTo(cx-r*.38,cy-r*1.3);g.lineTo(cx,cy-r*.98);
      g.lineTo(cx+r*.38,cy-r*1.3);g.lineTo(cx+r*.5,cy-r*.86);g.closePath();fs(ac,2.2);
    }
  }

  function renderPartners(){
    var box=$('partner-list'); if(!box)return;
    box.innerHTML='';
    for(var i=0;i<CFG.partners.length;i++){
      (function(i){
        var p=CFG.partners[i];
        var b=document.createElement('button');
        b.className='pcard'+(SV.partner===i?' sel':'');
        var cv=document.createElement('canvas'); cv.className='pface'; b.appendChild(cv);
        var nm=document.createElement('div'); nm.className='pname'; nm.textContent=p.name; b.appendChild(nm);
        b.onclick=function(){SB.unlockAudio();SFX.tap();SV.partner=i;SB.saveNow();renderPartners();};
        box.appendChild(b); drawFace(cv,p);
      })(i);
    }
  }

  function renderModes(){
    var box=$('mode-list'); if(!box)return;
    box.innerHTML='';
    for(var i=0;i<CFG.modes.length;i++){
      (function(m){
        var b=document.createElement('button'); b.className='mcard'; b.style.background=m.color;
        var big=document.createElement('div'); big.className='mbig'; big.textContent=m.sample; b.appendChild(big);
        var nm=document.createElement('div'); nm.className='mname'; nm.textContent=m.name; b.appendChild(nm);
        var st=document.createElement('div'); st.className='mstar';
        st.textContent='★ '+totalStars(m.key)+' / '+(m.stages.length*3); b.appendChild(st);
        b.onclick=function(){SB.unlockAudio();SFX.tap();ST.mode=m.key;renderStages();goScreen('stage');};
        box.appendChild(b);
      })(CFG.modes[i]);
    }
  }

  function renderStages(){
    var md=modeDef(ST.mode);
    var t=$('stage-title'); if(t)t.textContent=md.name+' ルート';
    var box=$('stage-list'); if(!box)return;
    box.innerHTML='';
    var open=openUpto(ST.mode);
    var got=totalStars(ST.mode), max=md.stages.length*3;
    var sm=$('route-sum'); if(sm)sm.textContent='★ '+got+' / '+max;
    for(var i=0;i<md.stages.length;i++){
      (function(i){
        var s=md.stages[i], locked=i>open, done=starOf(ST.mode,i)>0;
        var row=document.createElement('div');
        row.className='rrow'+(locked?' lock':'')+(done?' done':'');
        /* しま(バッジ) */
        var isl=document.createElement('button');
        isl.className='risl';
        var no=document.createElement('span'); no.className='rno'; no.textContent=locked?'?':(i+1);
        isl.appendChild(no);
        row.appendChild(isl);
        /* ふきだし */
        var info=document.createElement('div'); info.className='rinfo';
        var nm=document.createElement('div'); nm.className='rname';
        nm.textContent=locked?'？？？':s.name; info.appendChild(nm);
        var meta=document.createElement('div'); meta.className='rmeta';
        meta.textContent=locked?'🔒 まだ わたれない':(s.chain.length-1)+'ほ の はし';
        info.appendChild(meta);
        var st=document.createElement('div'); st.className='rstarline';
        st.textContent=locked?'':['☆☆☆','★☆☆','★★☆','★★★'][starOf(ST.mode,i)];
        info.appendChild(st);
        row.appendChild(info);
        if(!locked){
          var go=function(){SB.unlockAudio();SFX.tap();startStage(i);};
          isl.onclick=go; info.onclick=go;
          if(i===open)row.classList.add('here');
        }
        box.appendChild(row);
      })(i);
    }
  }

  /* ---------- ループ ---------- */
  var tAcc=0;
  function loop(){
    requestAnimationFrame(loop);
    if(!ready)return;
    var dt=Math.min(clock.getDelta(),0.1); tAcc+=dt; var t=tAcc;
    for(var i=0;i<anims.length;i++)anims[i].fn(anims[i].o,t);

    /* いた の せりあがり */
    if(ST.planks){
      for(var p=0;p<ST.planks.length;p++){
        var pl=ST.planks[p];
        if(pl.t<1){ pl.t=clamp(pl.t+dt*2.4,0,1);
          var e=1-Math.pow(1-pl.t,3);
          pl.o.scale.setScalar(Math.max(0.01,e));
          pl.o.position.y=lerp(-1.2,-0.35,e);
        }
      }
    }
    /* あいぼう が あるく */
    if(partner){
      var d=ST.walkTo-ST.walk;
      if(Math.abs(d)>0.02){
        ST.walk+=clamp(d,-1,1)*dt*TUNE.WALK_SPEED;
        partner.position.x=ST.walk;
        var sw=Math.sin(t*13)*0.16;
        if(partner.userData.feet){partner.userData.feet[0].position.z=sw;partner.userData.feet[1].position.z=-sw;}
        partner.position.y=Math.abs(Math.sin(t*13))*0.09;
      }else{
        partner.position.x=ST.walkTo; ST.walk=ST.walkTo;
        if(titleMode){
          ST.walkTo = (ST.walkTo>0.1) ? 0 : STEP*2.2;
          partner.rotation.y = (ST.walkTo>0.1) ? Math.PI/2.2 : -Math.PI/2.2;
        }
        partner.position.y=Math.sin(t*1.8)*0.06;
        if(partner.userData.feet){partner.userData.feet[0].position.z=0;partner.userData.feet[1].position.z=0;}
      }
      if(partner.userData.head)partner.userData.head.rotation.z=Math.sin(t*1.3)*0.06;
      if(partner.userData.spin)partner.userData.spin.rotation.y+=dt*1.6;
    }
    /* カメラ は あいぼう を おう */
    var portrait=global.innerHeight>global.innerWidth;
    var focus=partner?partner.position.x:0;
    /* あいぼうの ななめ うしろから、はしが おくへ のびて 見えるように */
    var back=portrait?5.6:7.0, side=portrait?10.5:12.5, high=portrait?5.0:4.8;
    var camX=lerp(camera.position.x,focus-back,1-Math.pow(0.002,dt));
    camera.position.set(camX, high+Math.sin(t*0.5)*0.14, side);
    camera.lookAt(focus+4.2, 0.2, -1.2);

    updParts(dt);
    renderer.render(scene,camera);
  }

  /* ---------- リッチ タイトル ---------- */
  var titleMode=false;
  function buildLogo(){
    var el=$('logo'); if(!el)return;
    var raw=el.getAttribute('data-text')||el.textContent;
    el.setAttribute('data-text',raw); el.innerHTML='';
    var n=0;
    for(var i=0;i<raw.length;i++){
      var c=raw.charAt(i);
      if(c==='|'){var br=document.createElement('span');br.className='br';el.appendChild(br);continue;}
      var sp=document.createElement('span'); sp.className='ch'; sp.textContent=c;
      sp.style.setProperty('--i',n++); el.appendChild(sp);
    }
    var sk=$('sparks');
    if(sk&&!sk.children.length){
      var pos=[[9,16],[26,5],[47,22],[70,7],[88,18],[15,50],[80,48],[53,58]];
      for(var k=0;k<pos.length;k++){
        var it=document.createElement('i');
        it.textContent = k%3===0 ? '\u2726' : (k%3===1 ? '\u2727' : '\u30FB');
        it.style.left=pos[k][0]+'%'; it.style.top=pos[k][1]+'%';
        it.style.animationDelay=(k*0.33)+'s'; it.style.fontSize=(11+(k%3)*5)+'px';
        sk.appendChild(it);
      }
    }
    var bd=$('star-badge');
    if(bd){
      var got=0,max=0;
      for(var m=0;m<CFG.modes.length;m++){got+=totalStars(CFG.modes[m].key);max+=CFG.modes[m].stages.length*3;}
      bd.innerHTML='<b>\u2605</b> あつめた ほし '+got+' / '+max;
      var bw=$('badge-wrap'); if(bw)bw.style.display=got>0?'block':'none';
    }
  }

  /* タイトルの ミニ はしシーン (あいぼうが いったりきたり) */
  function titleScene(){
    titleMode=true;
    ST.chain=[{},{},{},{}];
    ST.step=0;
    buildStageWorld();
    for(var i=0;i<3;i++){ ST.step=i; var p=addPlank(); p.scale.setScalar(1); p.position.y=-0.35; ST.planks[i].t=1; }
    ST.step=0;
    ST.walk=0; ST.walkTo=STEP*2.2;
    if(partner)partner.position.x=ST.walk;
  }

  /* ---------- はいせん ---------- */
  function bind(){
    global.addEventListener('resize',onResize);
    function on(id,fn){var e=$(id);if(e)e.onclick=function(){SB.unlockAudio();SFX.tap();fn();};}
    on('btn-start',function(){renderModes();goScreen('mode');});
    on('btn-mode-back',function(){goScreen('title');});
    on('btn-stage-back',function(){renderModes();goScreen('mode');});
    on('btn-hud-back',function(){running=false;renderStages();goScreen('stage');});
    on('btn-hud-home',function(){SB.goBack();});
    on('btn-say',function(){speakCur();});
    on('btn-hint',function(){hintOn();});
    on('res-next',function(){var md=modeDef(ST.mode);
      if(ST.stage<md.stages.length-1)startStage(ST.stage+1);else{renderStages();goScreen('stage');}});
    on('res-retry',function(){startStage(ST.stage);});
    on('res-back',function(){renderStages();goScreen('stage');});
    var qi=$('q-icon'); if(qi)qi.onclick=function(){SB.unlockAudio();speakCur();};
    var bb=$('bgm-btn'); if(bb)bb.onclick=function(){SB.toggleBGM();};
    SB.syncBgm();
  }

  function boot(){
    SB.loadSave();
    var cv=$('cv');
    if(!hasWebGL()||typeof global.THREE==='undefined'){
      var fb=$('fallback');if(fb)fb.classList.add('on');
      var ld=$('loading');if(ld)ld.classList.remove('on');return;
    }
    init3D(cv); bind(); goScreen('title');
    var ld=$('loading');if(ld)ld.classList.remove('on');
    loop();
  }
  function start(){var done=false;function go(){if(done)return;done=true;boot();}
    try{if(document.fonts&&document.fonts.ready){document.fonts.ready.then(go);setTimeout(go,2500);}else go();}catch(e){go();}}
  if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',start);else start();

  global.SB.debug={state:ST,goScreen:goScreen,startStage:startStage,choose:choose,
    modeDef:modeDef,renderChoices:renderChoices,stageClear:stageClear,
    __scene:function(){return scene;},__cam:function(){return camera;},
    tailOf:tailOf,headOf:headOf};
})(window);</script>
