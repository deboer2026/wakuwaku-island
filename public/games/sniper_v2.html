<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>どうぶつスナイパー</title>
<link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@700;800;900&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{width:100%;height:100%;overflow:hidden;font-family:'M PLUS Rounded 1c',sans-serif;user-select:none;}
body{background:#1a2e10;}
#wrap{position:fixed;inset:0;overflow:hidden;}
canvas{position:absolute;top:0;left:0;display:block;}
#dl{position:absolute;top:0;left:0;width:100%;height:100%;pointer-events:none;overflow:hidden;z-index:6;}

/* HUD */
#hud{position:fixed;top:0;left:0;right:0;z-index:100;
  display:flex;justify-content:space-between;align-items:center;
  padding:max(10px,env(safe-area-inset-top)) 12px 8px;
  background:linear-gradient(180deg,rgba(0,0,0,0.75) 0%,rgba(0,0,0,0.4) 70%,transparent 100%);
  box-sizing:border-box;}
#hud-stage{font-size:13px;font-weight:800;color:#A5D6A7;text-shadow:0 1px 4px rgba(0,0,0,0.5);}
#hud-score{font-size:18px;font-weight:900;color:#FFD700;text-shadow:0 0 10px rgba(255,215,0,0.4);}
#hud-life{font-size:16px;}

/* タイマー */
#timer-wrap{position:absolute;top:88px;left:50%;transform:translateX(-50%);z-index:20;pointer-events:none;text-align:center;}
#timer-bar-bg{width:180px;height:10px;background:rgba(255,255,255,0.2);border-radius:5px;overflow:hidden;margin:0 auto 3px;}
#timer-bar-fill{height:100%;border-radius:5px;transition:width 0.1s linear,background 0.3s;}
#timer-text{font-size:13px;font-weight:900;color:white;text-shadow:0 1px 4px rgba(0,0,0,0.5);}

/* コンボ */
#combo-disp{position:absolute;top:110px;right:14px;z-index:20;pointer-events:none;
  font-size:14px;font-weight:900;color:#FFD700;
  text-shadow:0 0 10px rgba(255,215,0,0.6);display:none;}

/* もどる */
#back-btn{background:rgba(0,0,0,0.5);color:white;border:1px solid rgba(255,255,255,0.3);
  border-radius:20px;padding:6px 14px;font-size:13px;font-weight:700;
  cursor:pointer;pointer-events:all;font-family:inherit;}

/* ヒットエフェクト */
@keyframes hitRing{0%{transform:translate(-50%,-50%) scale(0.3);opacity:1;}100%{transform:translate(-50%,-50%) scale(1.8);opacity:0;}}
.hit-ring{position:absolute;border-radius:50%;pointer-events:none;z-index:10;
  animation:hitRing 0.4s ease-out forwards;}
@keyframes missPulse{0%{opacity:0;}30%{opacity:1;}100%{opacity:0;}}
.miss-flash{position:fixed;inset:0;background:rgba(255,0,0,0.25);pointer-events:none;z-index:50;
  animation:missPulse 0.4s ease-out forwards;}
@keyframes scoreFloat{0%{transform:translateX(-50%) translateY(0);opacity:1;}100%{transform:translateX(-50%) translateY(-65px);opacity:0;}}
.score-pop{position:absolute;font-size:18px;font-weight:900;
  pointer-events:none;z-index:9;
  animation:scoreFloat 0.85s ease-out forwards;white-space:nowrap;
  text-shadow:0 2px 6px rgba(0,0,0,0.5);}
@keyframes animalHit{0%{transform:translate(-50%,-50%) scale(1);}50%{transform:translate(-50%,-50%) scale(1.4);}100%{transform:translate(-50%,-50%) scale(0);opacity:0;}}
.animal-hit{position:absolute;pointer-events:none;z-index:11;
  animation:animalHit 0.35s ease-out forwards;}

/* ステージバナー */
#stage-banner{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);
  z-index:30;pointer-events:none;display:none;text-align:center;}
@keyframes bannerPop{0%{transform:translate(-50%,-50%) scale(0.3);opacity:0;}
  55%{transform:translate(-50%,-50%) scale(1.15);}
  100%{transform:translate(-50%,-50%) scale(1);opacity:1;}}

/* オーバーレイ */
.ov{position:absolute;inset:0;z-index:100;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  background:rgba(0,20,0,0.88);backdrop-filter:blur(12px);
  opacity:0;pointer-events:none;transition:opacity 0.3s;}
.ov.show{opacity:1;pointer-events:all;}
.ob{background:linear-gradient(160deg,#0a1e08,#050f03);
  border:1.5px solid rgba(100,200,80,0.4);border-radius:24px;
  padding:22px 28px;text-align:center;max-width:300px;width:90%;
  box-shadow:0 20px 60px rgba(0,0,0,0.7);}
.ot{font-size:22px;font-weight:900;color:#A5D6A7;margin:8px 0 6px;}
.os{font-size:12px;color:rgba(180,220,160,0.6);margin-bottom:12px;line-height:1.8;}
.osc{font-size:34px;font-weight:900;color:#FFD700;margin:6px 0;text-shadow:0 0 16px rgba(255,215,0,0.4);}
.btn-green{background:linear-gradient(135deg,#2E7D32,#66BB6A);color:white;
  border:none;border-radius:12px;padding:12px 26px;font-size:15px;font-weight:900;
  cursor:pointer;font-family:inherit;margin:4px;box-shadow:0 4px 14px rgba(46,125,50,0.4);}
.btn-ghost{background:rgba(255,255,255,0.08);border:1px solid rgba(255,255,255,0.2);
  border-radius:12px;padding:10px 20px;font-size:13px;font-weight:700;
  color:rgba(255,255,255,0.7);cursor:pointer;font-family:inherit;margin:4px;}

/* タイトル */
#ts{position:absolute;inset:0;z-index:200;overflow:hidden;
  display:flex;flex-direction:column;align-items:center;justify-content:flex-end;}
#tsvg{position:absolute;inset:0;z-index:0;width:100%;height:100%;pointer-events:none;}
#tc{position:relative;z-index:10;width:100%;
  display:flex;flex-direction:column;align-items:center;padding-bottom:26px;}
@keyframes sh{0%{background-position:0%}100%{background-position:200%}}
@keyframes animalBob{0%,100%{transform:translateY(0);}50%{transform:translateY(-8px);}}


#common-bgm-btn{
  position:fixed;
  top:max(10px,env(safe-area-inset-top,10px));
  right:10px;z-index:1000;
  background:rgba(0,0,0,0.45);
  border:1.5px solid rgba(255,255,255,0.35);
  border-radius:50%;width:40px;height:40px;
  font-size:18px;cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  color:white;
}

/* === safe-area & common buttons === */
:root {
  --sat: env(safe-area-inset-top, 0px);
  --sab: env(safe-area-inset-bottom, 0px);
}
#ui-bgm-btn {
  width: 40px; height: 40px;
  background: rgba(0,0,0,0.5);
  border: 1.5px solid rgba(255,255,255,0.4);
  border-radius: 50%;
  font-size: 20px;
  cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  touch-action: manipulation;
  -webkit-tap-highlight-color: transparent;
  flex-shrink: 0;
}
#status-bar {
  position: fixed;
  top: calc(max(10px, env(safe-area-inset-top)) + 44px);
  left: 0; right: 0;
  display: flex;
  justify-content: center;
  align-items: center;
  gap: 16px;
  padding: 4px 12px;
  z-index: 99;
  pointer-events: none;
}

/* === 横向き対応 === */
@media (orientation: landscape) {
  body { overflow-y: auto; }
  #hud { top: max(6px, env(safe-area-inset-top, 6px)); }
  #status-bar { top: calc(max(6px, env(safe-area-inset-top, 6px)) + 40px); }
}
@media (orientation: landscape) and (max-height: 500px) {
  /* 横向き時にゲームエリアを縮小・スクロール対応 */
  canvas { max-height: 100vh; }
  #game-area { overflow-y: auto; }
}
</style>
<script src="/games/wakuwaku_bgm.js"></script>
</head>

<script>
// ===== ステージ設定 =====
const STAGES=[

const ANIMALS=['🐱','🐰','🦊','🐸','🐼','🐶','🐹','🐨','🐯','🐧'];
const FAKES=['🌿','🍀','🌸','🍃','🌱','🍂'];

// ===== 状態 =====
let W,H;
let stageIdx=0,score=0,lives=3,combo=0,comboTimer=null;
let animals=[];
let timeLeft=30,timerIv=null;
let gameRunning=false;
let bullets=[]; // 弾エフェクト
let raf=null,frameCount=0;
// 背景
let bgTrees=[],bgStars=[],bgFireflies=[];
// 霧
let fogX=0;

const cv=document.getElementById('cv');
const ctx=cv.getContext('2d');

// ===== 初期化 =====
function init(){
  W=window.innerWidth; H=window.innerHeight;
  cv.width=W; cv.height=H;
  initBg();
  updateHsDisp();
  document.getElementById('sbtn').addEventListener('click',startGame);
  document.getElementById('sbtn').addEventListener('touchend',e=>{e.preventDefault();startGame();},{passive:false});
  cv.addEventListener('touchstart',onTap,{passive:false});
  cv.addEventListener('click',onTap);
  window.addEventListener('resize',()=>{W=window.innerWidth;H=window.innerHeight;cv.width=W;cv.height=H;initBg();});
}

function initBg(){
  // 背景ホタル
  bgFireflies=[];
  for(let i=0;i<12;i++){
    bgFireflies.push({
      x:Math.random()*W, y:H*0.15+Math.random()*H*0.6,
      vx:(Math.random()-0.5)*0.4, vy:(Math.random()-0.5)*0.3,
      phase:Math.random()*Math.PI*2, size:2+Math.random()*2,
    });
  }
}

// ===== ゲーム開始 =====
function startGame(){
  document.getElementById('ts').style.display='none';
  ['clear-ov','go-ov','ac-ov'].forEach(id=>document.getElementById(id).classList.remove('show'));
  stageIdx=0; score=0; lives=3;
  if(raf)cancelAnimationFrame(raf);
  setupStage();
  gameRunning=true;
  loop();
}

function showTitle(){
  cancelAnimationFrame(raf); clearInterval(timerIv); gameRunning=false;
  document.getElementById('ts').style.display='flex';
  ['clear-ov','go-ov','ac-ov'].forEach(id=>document.getElementById(id).classList.remove('show'));
}

function setupStage(){
  const st=STAGES[stageIdx];
  animals=[]; bullets=[]; combo=0; timeLeft=st.time; frameCount=0;
  clearInterval(timerIv); clearTimeout(comboTimer);
  updateHUD(); updateTimerBar();
  showStageBanner(st.name, st.num);
  // 動物スポーン
  setTimeout(()=>{
    if(!gameRunning)return;
    spawnAnimals();
    // タイマー開始
    timerIv=setInterval(()=>{
      timeLeft--;
      updateTimerBar();
      if(timeLeft<=0){clearInterval(timerIv);stageEnd();}
    },1000);
  },1800);
}

function nextStage(){
  document.getElementById('clear-ov').classList.remove('show');
  stageIdx++;
  setupStage();
  loop();
}

// ===== 動物スポーン =====
function spawnAnimals(){
  const st=STAGES[stageIdx];
  animals=[];
  const total=st.count+st.fakeCount;
  for(let i=0;i<total;i++){
    const isF=i>=st.count;
    const sz=Math.min(W,H)*(st.sizeMin+Math.random()*(st.sizeMax-st.sizeMin));
    const spd=st.spdMin+Math.random()*(st.spdMax-st.spdMin);
    const a=Math.random()*Math.PI*2;
    animals.push({
      x:sz+Math.random()*(W-sz*2),
      y:H*0.15+Math.random()*(H*0.65),
      vx:Math.cos(a)*spd, vy:Math.sin(a)*spd,
      size:sz,
      emoji:isF?FAKES[Math.floor(Math.random()*FAKES.length)]:ANIMALS[Math.floor(Math.random()*ANIMALS.length)],
      isFake:isF,
      wobble:Math.random()*Math.PI*2,
      hitAnim:0,
    });
  }
}

// ===== メインループ =====
function loop(){
  if(!gameRunning)return;
  update(); draw();
  raf=requestAnimationFrame(loop);
}

function update(){
  frameCount++;
  fogX=(fogX+0.5)%W;

  // ホタル
  bgFireflies.forEach(f=>{
    f.x+=f.vx; f.y+=f.vy; f.phase+=0.05;
    if(f.x<0||f.x>W)f.vx*=-1;
    if(f.y<H*0.1||f.y>H*0.85)f.vy*=-1;
  });

  // 弾エフェクト更新
  bullets=bullets.filter(b=>{
    b.x+=b.vx; b.y+=b.vy;
    b.life--;
    return b.life>0;
  });

  // 動物移動
  animals.forEach(a=>{
    a.x+=a.vx; a.y+=a.vy; a.wobble+=0.04;
    // バウンド
    if(a.x-a.size/2<0){a.x=a.size/2;a.vx=Math.abs(a.vx);}
    if(a.x+a.size/2>W){a.x=W-a.size/2;a.vx=-Math.abs(a.vx);}
    if(a.y-a.size/2<H*0.1){a.y=H*0.1+a.size/2;a.vy=Math.abs(a.vy);}
    if(a.y+a.size/2>H*0.85){a.y=H*0.85-a.size/2;a.vy=-Math.abs(a.vy);}
    // たまにランダム方向転換
    if(Math.random()<0.005){
      const ang=Math.random()*Math.PI*2;
      const spd=Math.sqrt(a.vx*a.vx+a.vy*a.vy);
      a.vx=Math.cos(ang)*spd; a.vy=Math.sin(ang)*spd;
    }
  });
}

// ===== タップ処理 =====
function onTap(e){
  e.preventDefault();
  if(!gameRunning||timeLeft<=0)return;
  const tx=e.touches?e.touches[0].clientX:e.clientX;
  const ty=e.touches?e.touches[0].clientY:e.clientY;

  // 弾を発射（画面下中央から）
  const originX=W/2, originY=H*0.92;
  const dx=tx-originX, dy=ty-originY;
  const len=Math.sqrt(dx*dx+dy*dy)||1;
  const bspd=22;
  for(let i=0;i<3;i++){
    const spread=(i-1)*0.04;
    bullets.push({
      x:originX, y:originY,
      vx:(dx/len+spread)*bspd,
      vy:(dy/len)*bspd,
      life:14, maxLife:14,
    });
  }

  // 照準エフェクト（常に表示）
  showScopeEffect(tx,ty);

  // 当たり判定
  let hit=false;
  for(let i=animals.length-1;i>=0;i--){
    const a=animals[i];
    const dx=tx-a.x, dy=ty-a.y;
    if(Math.sqrt(dx*dx+dy*dy)<a.size*0.6){
      if(a.isFake){
        // フェイク
        lives--; combo=0;
        updateHUD(); updateComboDisp();
        showMissFlash();
        showScorePop('🌿 にせもの！',tx,ty,'#EF9A9A');
        // フェイクも消す
        showAnimalHit(a.emoji,a.x,a.y,a.size);
        animals.splice(i,1);
        if(lives<=0){setTimeout(()=>endGameOver(),500);}
      } else {
        // ヒット！
        combo++;
        clearTimeout(comboTimer);
        comboTimer=setTimeout(()=>{combo=0;updateComboDisp();},1200);
        const mult=combo>=5?3:combo>=3?2:1;
        const pts=STAGES[stageIdx].pts*mult;
        score+=pts;
        showAnimalHit(a.emoji,a.x,a.y,a.size);
        showHitRing(a.x,a.y,a.size);
        showScorePop(`+${pts}${combo>=3?` 🔥${combo}コンボ！`:''}`,a.x,a.y-a.size/2,'#FFD700');
        animals.splice(i,1);
        // 新しい動物スポーン（1匹減ったら補充）
        setTimeout(()=>{if(gameRunning&&timeLeft>0)spawnOneAnimal();},400);
        updateHUD(); updateComboDisp();
      }
      hit=true;
      break;
    }
  }
  // ミス（何もない場所）
  if(!hit){
    // ミスでもコンボは続く（照準が外れただけ）
  }
}

function spawnOneAnimal(){
  const st=STAGES[stageIdx];
  const isF=Math.random()<0.15*st.fakeCount;
  const sz=Math.min(W,H)*(st.sizeMin+Math.random()*(st.sizeMax-st.sizeMin));
  const spd=st.spdMin+Math.random()*(st.spdMax-st.spdMin);
  const a=Math.random()*Math.PI*2;
  animals.push({
    x:sz+Math.random()*(W-sz*2),
    y:H*0.15+Math.random()*(H*0.65),
    vx:Math.cos(a)*spd, vy:Math.sin(a)*spd,
    size:sz,
    emoji:isF?FAKES[Math.floor(Math.random()*FAKES.length)]:ANIMALS[Math.floor(Math.random()*ANIMALS.length)],
    isFake:isF,
    wobble:Math.random()*Math.PI*2,
  });
}

// ===== 描画 =====
function draw(){
  ctx.clearRect(0,0,W,H);
  drawBg();
  drawAnimals();
  drawBullets();
}

function drawBg(){
  // 夜の森グラデ
  const sg=ctx.createLinearGradient(0,0,0,H);
  sg.addColorStop(0,'#0d1f08');
  sg.addColorStop(0.4,'#1a3a0d');
  sg.addColorStop(1,'#0a1806');
  ctx.fillStyle=sg;ctx.fillRect(0,0,W,H);

  // 星
  ctx.fillStyle='white';
  [[0.08,0.04,1.1],[0.23,0.02,1.4],[0.4,0.07,1],[0.58,0.03,1.5],
   [0.72,0.06,1.2],[0.88,0.02,1],[0.15,0.12,0.9],[0.55,0.1,1.1],[0.80,0.09,1]
  ].forEach(([rx,ry,r])=>{
    ctx.globalAlpha=0.6+Math.sin(frameCount*0.02+rx*10)*0.3;
    ctx.beginPath();ctx.arc(W*rx,H*ry,r,0,Math.PI*2);ctx.fill();
  });
  ctx.globalAlpha=1;

  // 月
  const mg=ctx.createRadialGradient(W*0.82,H*0.1,0,W*0.82,H*0.1,60);
  mg.addColorStop(0,'rgba(255,240,150,0.3)');mg.addColorStop(1,'rgba(255,215,0,0)');
  ctx.fillStyle=mg;ctx.fillRect(W*0.65,0,W*0.35,H*0.25);
  ctx.fillStyle='#FFF9C4';ctx.beginPath();ctx.arc(W*0.82,H*0.1,20,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='#FFEE88';ctx.beginPath();ctx.arc(W*0.82,H*0.1,14,0,Math.PI*2);ctx.fill();

  // ホタル
  bgFireflies.forEach(f=>{
    const glow=Math.sin(f.phase)*0.5+0.5;
    ctx.save();ctx.globalAlpha=glow*0.7;
    const fg=ctx.createRadialGradient(f.x,f.y,0,f.x,f.y,f.size*3);
    fg.addColorStop(0,'rgba(180,255,100,0.9)');fg.addColorStop(1,'rgba(180,255,100,0)');
    ctx.fillStyle=fg;ctx.fillRect(f.x-f.size*3,f.y-f.size*3,f.size*6,f.size*6);
    ctx.fillStyle='#CCFF66';ctx.beginPath();ctx.arc(f.x,f.y,f.size*0.7,0,Math.PI*2);ctx.fill();
    ctx.restore();
  });

  // 遠景シルエット
  ctx.fillStyle='#0a1806';
  ctx.beginPath();ctx.moveTo(0,H*0.5);
  for(let x=0;x<=W;x+=30){
    const y=H*0.45+Math.sin(x*0.02)*H*0.06+Math.cos(x*0.015)*H*0.04;
    ctx.lineTo(x,y);
  }
  ctx.lineTo(W,H);ctx.lineTo(0,H);ctx.closePath();ctx.fill();

  // 霧（スクロール）
  ctx.save();ctx.globalAlpha=0.12;
  const fog=ctx.createLinearGradient(0,H*0.55,0,H*0.7);
  fog.addColorStop(0,'rgba(80,140,60,0)');fog.addColorStop(0.5,'rgba(80,140,60,1)');fog.addColorStop(1,'rgba(80,140,60,0)');
  ctx.fillStyle=fog;ctx.fillRect(-W+fogX,H*0.55,W*3,H*0.15);
  ctx.restore();

  // 近景の木（左右）
  drawTree(W*0.05,H*0.92,H*0.38,'#061204','#0a1a06');
  drawTree(W*0.12,H*0.9,H*0.28,'#061204','#0d2008');
  drawTree(W*0.9,H*0.92,H*0.36,'#061204','#0a1a06');
  drawTree(W*0.83,H*0.9,H*0.26,'#061204','#0d2008');

  // 草地
  const gg=ctx.createLinearGradient(0,H*0.87,0,H);
  gg.addColorStop(0,'#0d2008');gg.addColorStop(1,'#061204');
  ctx.fillStyle=gg;ctx.fillRect(0,H*0.87,W,H*0.13);
  ctx.fillStyle='#0f2a0a';
  ctx.beginPath();ctx.ellipse(W/2,H*0.87,W*0.7,H*0.025,0,0,Math.PI*2);ctx.fill();
}

function drawTree(cx,base,h,dark,light){
  ctx.fillStyle=dark;
  ctx.fillRect(cx-h*0.04,base-h*0.25,h*0.08,h*0.27);
  ctx.fillStyle=dark;
  ctx.beginPath();ctx.ellipse(cx,base-h*0.3,h*0.18,h*0.32,0,0,Math.PI*2);ctx.fill();
  ctx.fillStyle=light;
  ctx.beginPath();ctx.ellipse(cx,base-h*0.38,h*0.13,h*0.24,0,0,Math.PI*2);ctx.fill();
  ctx.beginPath();ctx.ellipse(cx,base-h*0.48,h*0.08,h*0.15,0,0,Math.PI*2);ctx.fill();
}

function drawBullets(){
  bullets.forEach(b=>{
    ctx.save();
    const alpha=b.life/b.maxLife;
    // 弾本体（小さな光点）
    ctx.globalAlpha=alpha;
    const bg=ctx.createRadialGradient(b.x,b.y,0,b.x,b.y,5);
    bg.addColorStop(0,'rgba(255,255,180,1)');
    bg.addColorStop(1,'rgba(255,200,0,0)');
    ctx.fillStyle=bg;
    ctx.beginPath();ctx.arc(b.x,b.y,5,0,Math.PI*2);ctx.fill();
    // トレイル（尾を引く）
    ctx.globalAlpha=alpha*0.6;
    ctx.strokeStyle='rgba(255,230,100,0.8)';
    ctx.lineWidth=2;
    ctx.beginPath();
    ctx.moveTo(b.x,b.y);
    ctx.lineTo(b.x-b.vx*6,b.y-b.vy*6);
    ctx.stroke();
    ctx.restore();
  });
}

function drawAnimals(){
  animals.forEach(a=>{
    ctx.save();
    // 影
    ctx.globalAlpha=0.2;ctx.fillStyle='#000';
    ctx.beginPath();ctx.ellipse(a.x+3,a.y+a.size*0.35,a.size*0.4,a.size*0.12,0,0,Math.PI*2);ctx.fill();
    ctx.globalAlpha=1;
    // ゆらゆら
    const wx=Math.sin(a.wobble)*2;
    // フェイクは少し暗くして葉っぱっぽく
    if(a.isFake){ctx.globalAlpha=0.75;}
    // グロー（フェイクはなし）
    if(!a.isFake){
      ctx.shadowBlur=8;
      ctx.shadowColor='rgba(255,255,255,0.4)';
    }
    ctx.font=`${a.size}px "Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",serif`;
    ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.fillText(a.emoji,a.x+wx,a.y);
    ctx.restore();
  });
}

// ===== 演出 =====
function showScopeEffect(x,y){
  // Canvas上に照準を描く
  const r=28;
  ctx.save();
  ctx.strokeStyle='rgba(255,215,0,0.85)';ctx.lineWidth=2.5;
  ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx.stroke();
  ctx.beginPath();ctx.arc(x,y,r*0.55,0,Math.PI*2);ctx.stroke();
  ctx.fillStyle='rgba(255,215,0,0.85)';
  ctx.beginPath();ctx.arc(x,y,4,0,Math.PI*2);ctx.fill();
  // 十字線
  ctx.beginPath();ctx.moveTo(x-r-8,y);ctx.lineTo(x-r*0.7,y);ctx.stroke();
  ctx.beginPath();ctx.moveTo(x+r*0.7,y);ctx.lineTo(x+r+8,y);ctx.stroke();
  ctx.beginPath();ctx.moveTo(x,y-r-8);ctx.lineTo(x,y-r*0.7);ctx.stroke();
  ctx.beginPath();ctx.moveTo(x,y+r*0.7);ctx.lineTo(x,y+r+8);ctx.stroke();
  ctx.restore();
}

function showHitRing(x,y,size){
  const el=document.createElement('div');
  el.className='hit-ring';
  const sz=size*1.8;
  el.style.cssText=`left:${x}px;top:${y}px;width:${sz}px;height:${sz}px;border:3px solid #FFD700;box-shadow:0 0 10px rgba(255,215,0,0.6);`;
  document.getElementById('dl').appendChild(el);
  setTimeout(()=>el.remove(),420);
}

function showAnimalHit(emoji,x,y,size){
  const el=document.createElement('div');
  el.className='animal-hit';
  el.style.cssText=`left:${x}px;top:${y}px;font-size:${size*1.3}px;`;
  el.textContent=emoji;
  document.getElementById('dl').appendChild(el);
  setTimeout(()=>el.remove(),380);
}

function showMissFlash(){
  const el=document.createElement('div');
  el.className='miss-flash';
  document.getElementById('wrap').appendChild(el);
  setTimeout(()=>el.remove(),420);
}

function showScorePop(text,x,y,color='#FFD700'){
  const el=document.createElement('div');
  el.className='score-pop';
  el.textContent=text;el.style.color=color;
  el.style.left=x+'px';el.style.top=y+'px';
  document.getElementById('dl').appendChild(el);
  setTimeout(()=>el.remove(),900);
}

function showStageBanner(name,num){
  const el=document.getElementById('stage-banner');
  el.innerHTML=`<div style="font-size:28px;font-weight:900;color:#A5D6A7;text-shadow:0 2px 10px rgba(100,200,80,0.5);white-space:nowrap;">ステージ ${num}</div><div style="font-size:18px;font-weight:800;color:#FFD700;">${name}</div>`;
  el.style.display='block';el.style.animation='none';el.offsetHeight;
  el.style.animation='bannerPop 0.5s ease-out forwards';
  setTimeout(()=>el.style.display='none',2000);
}

// ===== タイマーバー =====
function updateTimerBar(){
  const st=STAGES[stageIdx];
  const pct=(timeLeft/st.time)*100;
  const fill=document.getElementById('timer-bar-fill');
  fill.style.width=pct+'%';
  fill.style.background=pct>50?'#4CAF50':pct>25?'#FF9800':'#F44336';
  document.getElementById('timer-text').textContent=`${timeLeft}びょう`;
}

// ===== HUD =====
function updateHUD(){
  document.getElementById('hud-stage').textContent=`ステージ ${STAGES[stageIdx].num}`;
  document.getElementById('hud-score').textContent=`🎯 ${score}`;
  document.getElementById('hud-life').textContent='❤️'.repeat(lives)+'🖤'.repeat(3-lives);
}
function updateComboDisp(){
  const el=document.getElementById('combo-disp');
  if(combo>=2){el.style.display='block';el.textContent=`🔥 ${combo}コンボ！`;}
  else el.style.display='none';
}

// ===== ステージ終了 =====
function stageEnd(){
  animals=[];
  const st=STAGES[stageIdx];
  const isLast=stageIdx>=STAGES.length-1;
  document.getElementById('clear-emoji').textContent=isLast?'🌟':'🎉';
  document.getElementById('clear-title').textContent=`ステージ ${st.num} クリア！`;
  document.getElementById('clear-sub').innerHTML=`🎯 スコア：${score}てん`;
  document.getElementById('clear-score').textContent=`⭐ ${score} てん`;
  const btn=document.getElementById('next-btn');
  if(isLast){
    btn.textContent='🏆 ぜんぶクリア！';
    btn.onclick=()=>endAllClear();
  } else {
    btn.textContent=`ステージ ${st.num+1} へ ▶`;
    btn.onclick=()=>nextStage();
  }
  document.getElementById('clear-ov').classList.add('show');
}

function endAllClear(){
  const hs=getHs(),isNew=score>hs;if(isNew)saveHs(score);
  document.getElementById('clear-ov').classList.remove('show');
  document.getElementById('ac-sub').innerHTML='ぜんステージ クリア！';
  document.getElementById('ac-score').textContent=`⭐ ${score} てん${isNew?' 🏆':''}`;
  document.getElementById('ac-ov').classList.add('show');
}

function endGameOver(){
  clearInterval(timerIv);gameRunning=false;
  const hs=getHs(),isNew=score>hs;if(isNew)saveHs(score);
  document.getElementById('go-sub').innerHTML=`ステージ${STAGES[stageIdx].num}　🎯${score}てん`;
  document.getElementById('go-score').textContent=`⭐ ${score} てん${isNew?' 🏆':''}`;
  document.getElementById('go-ov').classList.add('show');
}

function getHs(){return parseInt(localStorage.getItem('sniper_hs')||'0');}
function saveHs(s){localStorage.setItem('sniper_hs',s);}
function updateHsDisp(){const hs=getHs();document.getElementById('ths').textContent=hs>0?`ハイスコア：⭐${hs}`:''}




function goBack(){
  cancelAnimationFrame(raf);clearInterval(timerIv);gameRunning=false;
  if(window.parent!==window)window.parent.postMessage({type:'goBack'},'*');
  else history.back();
}

setTimeout(init,80);



// === 共通UI ===
function goHome(){
  if(window.parent!==window){window.parent.postMessage({type:'goHome'},'*');}
  else{window.location.href='/';}
}
// ── BGM (WakuwakuBGM library) ──────────────────────
let _bgm = null;

function _startBGM() {
  if (_bgm) return;
  _bgm = new WakuwakuBGM('action');
  const on = WakuwakuBGM.loadState();
  _bgm.setEnabled(on);
  if (on) _bgm.start();
  _syncBgmBtn();
}

function toggleCommonBGM() {
  if (!_bgm) { _startBGM(); return; }
  const on = _bgm.toggle();
  WakuwakuBGM.saveState(on);
  _syncBgmBtn();
}

function _syncBgmBtn() {
  const on = _bgm ? _bgm.enabled : WakuwakuBGM.loadState();
  const btns = document.querySelectorAll(
    '#bgm-btn,#ui-bgm-btn,#bgm-toggle,#sound-btn,.bgm-btn'
  );
  btns.forEach(b => { b.textContent = on ? '🔊' : '🔇'; });
}

// First interaction triggers BGM start
(function(){
  function _first(){ _startBGM(); }
  document.addEventListener('click', _first, { once: true });
  document.addEventListener('touchstart', _first, { once: true });
})();
// ── End BGM ────────────────────────────────────────
</script>
