<!DOCTYPE html>
<html lang="ja">
<head>
<script src="/games/wakuwaku_ui.js"></script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>まほうのめいろ</title>
<link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@700;800;900&family=DotGothic16&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{width:100%;height:100%;overflow:hidden;font-family:'M PLUS Rounded 1c',sans-serif;
  user-select:none;-webkit-user-select:none;background:#2a1f4a;color:#4A3B32;}
#wrap{position:fixed;inset:0;overflow:hidden;}
#cv{display:block;position:absolute;inset:0;width:100%;height:100%;z-index:0;touch-action:none;}

/* ============ 共通スクリーン ============ */
.screen{position:fixed;inset:0;z-index:30;display:none;flex-direction:column;
  padding:max(10px,var(--sat,0px)) max(12px,var(--sar,0px)) max(12px,var(--sab,0px)) max(12px,var(--sal,0px));
  overflow:hidden;}
.screen.on{display:flex;}
.btn{font-family:inherit;font-weight:900;border:none;cursor:pointer;color:#fff;
  border-radius:999px;padding:13px 30px;font-size:17px;
  background:linear-gradient(180deg,#ffc94d,#ff9f2e);
  box-shadow:0 5px 0 #d97a12,0 9px 18px rgba(0,0,0,.28);transition:transform .12s,box-shadow .12s;}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 #d97a12,0 4px 10px rgba(0,0,0,.28);}
.btn.sub{background:linear-gradient(180deg,#b79cff,#8a6bdd);box-shadow:0 5px 0 #5d43a8,0 9px 18px rgba(0,0,0,.28);}
.btn.sub:active{box-shadow:0 1px 0 #5d43a8,0 4px 10px rgba(0,0,0,.28);}
.btn.sm{padding:9px 20px;font-size:14px;box-shadow:0 4px 0 #d97a12,0 6px 12px rgba(0,0,0,.24);}
.btn.sm.sub{box-shadow:0 4px 0 #5d43a8,0 6px 12px rgba(0,0,0,.24);}
.topbar{display:flex;align-items:center;gap:8px;flex:none;z-index:4;}
.icon-btn{width:44px;height:44px;border-radius:15px;border:2px solid rgba(255,255,255,.72);
  background:rgba(255,255,255,.9);color:#5b3fa0;font-size:19px;font-weight:900;font-family:inherit;
  cursor:pointer;display:flex;align-items:center;justify-content:center;flex:none;
  box-shadow:0 3px 9px rgba(20,10,50,.3);}
.scr-title{font-family:'DotGothic16',monospace;font-size:20px;font-weight:900;color:#fff;
  text-shadow:0 3px 0 rgba(70,40,130,.85),0 6px 14px rgba(0,0,0,.4);flex:1;text-align:center;}

/* ============ タイトル ============ */
#title{background:radial-gradient(120% 90% at 50% 8%,#6b4fb8 0%,#3d2a72 48%,#1d1440 100%);
  align-items:center;justify-content:center;padding:0;}
#t-sky{position:absolute;inset:0;overflow:hidden;}
.t-star{position:absolute;background:#fff;border-radius:50%;opacity:.85;
  animation:twk 2.6s ease-in-out infinite;}
@keyframes twk{0%,100%{opacity:.22;transform:scale(.7)}50%{opacity:1;transform:scale(1.25)}}
.t-ring{position:absolute;left:50%;top:44%;transform:translate(-50%,-50%);
  border-radius:50%;border:2px solid rgba(183,156,255,.3);animation:ringPulse 6s ease-in-out infinite;}
@keyframes ringPulse{0%,100%{transform:translate(-50%,-50%) scale(.9);opacity:.15}50%{transform:translate(-50%,-50%) scale(1.1);opacity:.45}}
#t-glow{position:absolute;left:50%;top:40%;width:min(88vw,460px);height:min(88vw,460px);
  transform:translate(-50%,-50%);border-radius:50%;
  background:radial-gradient(circle,rgba(255,214,120,.32) 0%,rgba(150,110,255,.16) 42%,transparent 70%);
  animation:glowPulse 5s ease-in-out infinite;}
@keyframes glowPulse{0%,100%{transform:translate(-50%,-50%) scale(1);opacity:.8}50%{transform:translate(-50%,-50%) scale(1.14);opacity:1}}
#t-inner{position:relative;z-index:3;display:flex;flex-direction:column;align-items:center;
  gap:clamp(8px,2.4vh,20px);
  padding:max(14px,var(--sat,0px)) 16px max(18px,var(--sab,0px));}
#t-logo{font-family:'DotGothic16',monospace;text-align:center;line-height:1.02;
  font-size:clamp(38px,13.5vw,74px);font-weight:900;letter-spacing:.04em;
  background:linear-gradient(180deg,#fff6d0 0%,#ffd85e 45%,#ff9de0 100%);
  -webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 4px 0 #6a3fbe) drop-shadow(0 9px 0 #452a80) drop-shadow(0 14px 22px rgba(0,0,0,.5));
  animation:logoFloat 3.6s ease-in-out infinite;}
@keyframes logoFloat{0%,100%{transform:translateY(0) rotate(-1deg)}50%{transform:translateY(-9px) rotate(1deg)}}
#t-sub{font-size:clamp(11px,3.3vw,15px);font-weight:900;color:#ffe9a8;text-align:center;
  text-shadow:0 2px 8px rgba(60,20,120,.9);letter-spacing:.03em;}
#t-cast{display:flex;align-items:flex-end;justify-content:center;gap:clamp(4px,2.2vw,14px);
  height:clamp(52px,13vh,96px);}
.t-pet{width:clamp(38px,11vw,62px);height:clamp(38px,11vw,62px);border-radius:50%;
  position:relative;box-shadow:0 6px 14px rgba(0,0,0,.35),inset 0 -6px 10px rgba(0,0,0,.12);
  animation:petHop 1.7s ease-in-out infinite;}
.t-pet i{position:absolute;width:16%;height:16%;background:#4A3B32;border-radius:50%;top:40%;z-index:2;}
.t-pet i.l{left:26%}.t-pet i.r{right:26%}
.t-pet b{position:absolute;left:50%;top:56%;transform:translateX(-50%);
  width:34%;height:24%;background:rgba(255,255,255,.85);border-radius:50%;z-index:1;}
.t-pet .ear,.t-pet .patch{position:absolute;background:inherit;}
.t-pet:nth-child(2){animation-delay:.16s}.t-pet:nth-child(3){animation-delay:.32s}
.t-pet:nth-child(4){animation-delay:.48s}.t-pet:nth-child(5){animation-delay:.64s}
.t-pet:nth-child(6){animation-delay:.8s}
@keyframes petHop{0%,100%{transform:translateY(0)}50%{transform:translateY(-11px)}}
#t-fairy{position:absolute;font-size:clamp(22px,7vw,34px);left:12%;top:26%;z-index:4;
  animation:fairyFly 9s ease-in-out infinite;filter:drop-shadow(0 0 10px rgba(255,240,160,.9));}
@keyframes fairyFly{
  0%{transform:translate(0,0) scale(1)}25%{transform:translate(64vw,10vh) scale(.85)}
  50%{transform:translate(70vw,42vh) scale(1.05)}75%{transform:translate(8vw,34vh) scale(.9)}
  100%{transform:translate(0,0) scale(1)}}
#t-btns{display:flex;flex-direction:column;align-items:center;gap:clamp(7px,1.8vh,13px);}
#t-start{font-size:clamp(19px,5.6vw,25px);padding:15px 46px;animation:startPulse 1.5s ease-in-out infinite;}
@keyframes startPulse{0%,100%{transform:scale(1)}50%{transform:scale(1.06)}}
#t-side{display:flex;gap:9px;}
@media(max-height:520px){#t-cast{height:46px}#t-logo{font-size:clamp(30px,9vw,44px)}#t-inner{gap:6px}}

/* ============ キャラ選択 ============ */
#charsel{background:linear-gradient(180deg,#4b3792 0%,#6b52b8 55%,#9b83e0 100%);}
#char-grid{flex:1;display:grid;grid-template-columns:repeat(3,1fr);gap:clamp(8px,2.4vw,16px);
  align-content:center;padding:10px clamp(4px,3vw,26px);max-width:520px;width:100%;margin:0 auto;}
.cbox{position:relative;border-radius:20px;padding:clamp(8px,2vh,14px) 6px;cursor:pointer;
  background:rgba(255,255,255,.16);border:3px solid rgba(255,255,255,.28);
  display:flex;flex-direction:column;align-items:center;gap:6px;transition:transform .14s,background .14s;}
.cbox.sel{background:rgba(255,240,180,.34);border-color:#ffd95e;transform:scale(1.06);
  box-shadow:0 0 0 3px rgba(255,217,94,.35),0 8px 18px rgba(0,0,0,.3);}
.cbox .face{width:clamp(42px,13vw,64px);height:clamp(42px,13vw,64px);border-radius:50%;position:relative;
  box-shadow:inset 0 -6px 10px rgba(0,0,0,.13),0 4px 8px rgba(0,0,0,.22);}
.cbox .face i{position:absolute;width:15%;height:15%;background:#4A3B32;border-radius:50%;top:40%;z-index:2;}
.cbox .face i.l{left:25%}.cbox .face i.r{right:25%}
.face.panda i{background:#f7f5ee;width:11%;height:11%;top:43%;}
.cbox .face b{position:absolute;left:50%;top:56%;transform:translateX(-50%);
  width:34%;height:24%;background:rgba(255,255,255,.88);border-radius:50%;z-index:1;}
.face.dog b{width:44%;height:30%;top:58%;}
.face.fox b{width:42%;height:26%;top:60%;background:#fff1e0;}
.face.bear b{width:42%;height:30%;top:56%;background:#d7b088;}
.face.rabbit b{width:30%;height:20%;top:58%;}
.cbox .ear{position:absolute;background:inherit;}
.cbox .ear .in{position:absolute;left:50%;top:34%;transform:translateX(-50%);
  width:52%;height:56%;border-radius:inherit;}
/* ねこ：小さめの とがった みみ */
.face.cat .ear{top:-16%;width:30%;height:34%;border-radius:52% 52% 12% 12%;}
.face.cat .ear.l{left:2%;transform:rotate(-18deg)}.face.cat .ear.r{right:2%;transform:rotate(18deg)}
/* きつね：大きく するどい みみ */
.face.fox .ear{top:-30%;width:32%;height:52%;border-radius:56% 56% 8% 8%;}
.face.fox .ear.l{left:-2%;transform:rotate(-20deg)}.face.fox .ear.r{right:-2%;transform:rotate(20deg)}
/* いぬ：横に たれた みみ */
.face.dog .ear{top:12%;width:30%;height:52%;border-radius:44% 44% 50% 50%;}
.face.dog .ear.l{left:-16%;transform:rotate(12deg)}.face.dog .ear.r{right:-16%;transform:rotate(-12deg)}
/* うさぎ：とても ながい みみ */
.face.rabbit .ear{top:-62%;width:22%;height:74%;border-radius:50% 50% 34% 34%;}
.face.rabbit .ear.l{left:16%;transform:rotate(-9deg)}.face.rabbit .ear.r{right:16%;transform:rotate(9deg)}
/* くま・ぱんだ：大きな まるい みみ */
.face.bear .ear,.face.panda .ear{top:-19%;width:38%;height:38%;border-radius:50%;}
.face.bear .ear.l,.face.panda .ear.l{left:-6%}
.face.bear .ear.r,.face.panda .ear.r{right:-6%}
/* かおの もよう */
.face .patch{position:absolute;border-radius:50%;}
.face.panda .patch{width:34%;height:38%;top:28%;background:#2f2b33;}
.face.panda .patch.l{left:11%;transform:rotate(-14deg)}
.face.panda .patch.r{right:11%;transform:rotate(14deg)}
.face.rabbit .patch{width:22%;height:15%;top:52%;background:#f7a8c4;opacity:.85;}
.face.rabbit .patch.l{left:6%}.face.rabbit .patch.r{right:6%}
.face.fox .patch{width:30%;height:34%;top:16%;background:#fff1e0;opacity:.9;}
.face.fox .patch.l{left:8%;transform:rotate(-12deg)}
.face.fox .patch.r{right:8%;transform:rotate(12deg)}
.face.dog .patch{width:26%;height:20%;top:16%;background:#9d6a3c;opacity:.75;}
.face.dog .patch.l{left:12%}.face.dog .patch.r{right:12%}
.face.bear .patch{display:none}.face.cat .patch{display:none}
/* ひげ（ねこだけ） */
.face .whisk{position:absolute;top:60%;width:26%;height:2px;background:rgba(80,60,45,.55);border-radius:2px;}
.face .whisk.l{left:-16%}.face .whisk.r{right:-16%}
.face:not(.cat) .whisk{display:none}
/* はなさき */
.face .snout{position:absolute;left:50%;transform:translateX(-50%);
  border-radius:50%;background:rgba(255,255,255,.9);}
.face .nose{position:absolute;left:50%;transform:translateX(-50%);
  width:14%;height:10%;border-radius:50%;background:#4A3B32;}
.cbox span{font-size:clamp(11px,3.1vw,14px);font-weight:900;color:#fff;text-shadow:0 2px 4px rgba(0,0,0,.35);}
#charsel .foot{flex:none;display:flex;justify-content:center;padding:6px 0 4px;}

/* ============ ワールド／ステージ選択 ============ */
#worldmap{background:linear-gradient(180deg,#3b2b74 0%,#5a4299 60%,#7d63c4 100%);}
#wm-tabs{flex:none;display:flex;gap:6px;justify-content:center;padding:8px 0 4px;}
.wtab{border:none;font-family:inherit;font-weight:900;font-size:clamp(11px,3.2vw,14px);cursor:pointer;
  padding:9px 12px;border-radius:14px;color:#fff;background:rgba(255,255,255,.16);
  border:2px solid rgba(255,255,255,.22);display:flex;align-items:center;gap:5px;transition:.14s;}
.wtab.sel{background:rgba(255,255,255,.94);color:#4b3792;border-color:#ffd95e;box-shadow:0 4px 10px rgba(0,0,0,.28);}
.wtab.lock{opacity:.5;}
#wm-name{flex:none;text-align:center;font-family:'DotGothic16',monospace;font-size:clamp(15px,4.4vw,20px);
  font-weight:900;color:#fff;text-shadow:0 3px 0 rgba(50,28,100,.8);padding:6px 0 2px;}
#wm-desc{flex:none;text-align:center;font-size:clamp(10px,2.9vw,12px);font-weight:800;color:#e5d9ff;padding-bottom:6px;}
#wm-stages{flex:1;overflow-y:auto;display:grid;grid-template-columns:repeat(auto-fit,minmax(122px,1fr));
  gap:clamp(7px,2vw,12px);align-content:start;padding:4px clamp(4px,3vw,24px) 10px;max-width:560px;width:100%;margin:0 auto;
  -webkit-overflow-scrolling:touch;}
.sbox{border-radius:18px;padding:11px 8px 9px;cursor:pointer;position:relative;overflow:hidden;
  background:linear-gradient(180deg,rgba(255,255,255,.95),rgba(238,232,255,.88));
  border:3px solid #fff;box-shadow:0 5px 12px rgba(0,0,0,.26);
  display:flex;flex-direction:column;align-items:center;gap:4px;transition:transform .12s;}
.sbox:active{transform:scale(.96);}
.sbox.locked{background:rgba(255,255,255,.2);border-color:rgba(255,255,255,.28);cursor:default;box-shadow:none;}
.sbox .sn{font-family:'DotGothic16',monospace;font-size:15px;font-weight:900;color:#5b3fa0;}
.sbox.locked .sn{color:rgba(255,255,255,.75);}
.sbox .sfairy{font-size:26px;line-height:1;filter:drop-shadow(0 2px 4px rgba(0,0,0,.2));}
.sbox .stars{font-size:14px;letter-spacing:2px;color:#ffc107;height:18px;}
.sbox .stars .off{color:#d8cfe8;}
.sbox.locked .sfairy{filter:grayscale(1) opacity(.55);}
#wm-foot{flex:none;display:flex;justify-content:center;gap:9px;padding:4px 0 2px;}

/* ============ 図鑑 ============ */
#zukan{background:linear-gradient(180deg,#2f2360 0%,#4b3792 70%,#6b52b8 100%);}
#z-grid{flex:1;overflow-y:auto;display:grid;grid-template-columns:repeat(auto-fit,minmax(88px,1fr));
  gap:9px;padding:8px clamp(4px,3vw,22px) 12px;align-content:start;max-width:540px;width:100%;margin:0 auto;
  -webkit-overflow-scrolling:touch;}
.zc{border-radius:16px;padding:9px 5px;text-align:center;background:rgba(255,255,255,.92);
  border:3px solid #fff;box-shadow:0 4px 10px rgba(0,0,0,.24);}
.zc.hide{background:rgba(255,255,255,.14);border-color:rgba(255,255,255,.2);box-shadow:none;}
.zc .zi{font-size:30px;line-height:1.1;}
.zc.hide .zi{filter:grayscale(1) brightness(.4) opacity(.5);}
.zc .zn{font-size:11px;font-weight:900;color:#5b3fa0;margin-top:3px;}
.zc.hide .zn{color:rgba(255,255,255,.6);}
#z-count{flex:none;text-align:center;font-size:13px;font-weight:900;color:#ffe9a8;padding:2px 0 6px;}

/* ============ ゲームHUD ============ */
#hud{position:fixed;inset:0;z-index:20;display:none;pointer-events:none;
  padding:max(9px,var(--sat,0px)) max(11px,var(--sar,0px)) max(9px,var(--sab,0px)) max(11px,var(--sal,0px));}
#hud.on{display:block;}
#hud .row{display:flex;align-items:flex-start;gap:8px;}
#hud button{pointer-events:auto;}
/* 共通UI(wakuwaku_ui.js)は back/sound を画面左上に固定する。
   共通UIが読み込まれなかった場合も同じ配置になるよう自前でも固定しておく */
#back-btn,#ui-bgm-btn{position:fixed;top:calc(var(--sat,0px) + 8px);z-index:41;}
#back-btn{left:calc(var(--sal,0px) + 10px);}
#ui-bgm-btn{left:calc(var(--sal,0px) + 62px);}
#h-stage{position:fixed;top:calc(var(--sat,0px) + 8px);right:calc(var(--sar,0px) + 10px);}
#h-stage{background:rgba(30,16,64,.55);border:2px solid rgba(255,255,255,.3);border-radius:15px;
  padding:7px 13px;color:#fff;font-weight:900;font-size:13px;backdrop-filter:blur(6px);
  display:flex;flex-direction:column;align-items:center;gap:2px;}
#h-stage .nm{font-family:'DotGothic16',monospace;font-size:12px;color:#ffe9a8;}
#h-stars{display:flex;gap:3px;font-size:16px;line-height:1;}
#h-stars .off{opacity:.3;}
#h-keys{position:fixed;left:50%;transform:translateX(-50%);
  bottom:calc(max(12px,var(--sab,0px)) + 6px);display:flex;gap:8px;z-index:21;pointer-events:none;}
.keychip{width:38px;height:38px;border-radius:12px;display:flex;align-items:center;justify-content:center;
  font-size:19px;border:2px solid rgba(255,255,255,.6);box-shadow:0 3px 9px rgba(0,0,0,.34);
  transition:transform .25s,opacity .25s;}
.keychip.open{opacity:.35;transform:scale(.82);}
#toast{position:fixed;left:50%;top:22%;transform:translateX(-50%) scale(.7);z-index:35;
  background:rgba(255,255,255,.96);color:#5b3fa0;font-weight:900;font-size:16px;
  padding:11px 22px;border-radius:18px;box-shadow:0 6px 18px rgba(0,0,0,.34);
  opacity:0;pointer-events:none;transition:opacity .2s,transform .28s;text-align:center;line-height:1.4;}
#toast.on{opacity:1;transform:translateX(-50%) scale(1);}
#hint{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(max(12px,var(--sab,0px)) + 58px);
  z-index:22;color:#fff;font-size:13px;font-weight:900;background:rgba(30,16,64,.5);
  padding:8px 16px;border-radius:16px;backdrop-filter:blur(5px);pointer-events:none;
  border:2px solid rgba(255,255,255,.28);opacity:0;transition:opacity .4s;text-align:center;}
#hint.on{opacity:1;}
#flash{position:fixed;inset:0;z-index:25;background:#fff;opacity:0;pointer-events:none;transition:opacity .35s;}

/* ============ 結果オーバーレイ ============ */
.ov{position:fixed;inset:0;z-index:40;display:none;align-items:center;justify-content:center;
  background:rgba(24,12,54,.72);backdrop-filter:blur(4px);padding:20px;}
.ov.on{display:flex;}
.ovbox{background:linear-gradient(180deg,#fffdf6,#f3ecff);border-radius:26px;border:4px solid #fff;
  box-shadow:0 14px 40px rgba(0,0,0,.45);padding:22px 22px 20px;text-align:center;
  max-width:340px;width:100%;animation:ovIn .4s cubic-bezier(.2,1.3,.5,1);}
@keyframes ovIn{0%{transform:scale(.6) translateY(30px);opacity:0}100%{transform:scale(1) translateY(0);opacity:1}}
.ov-h{font-family:'DotGothic16',monospace;font-size:23px;font-weight:900;color:#6c43a7;margin-bottom:4px;}
.ov-fairy{font-size:56px;line-height:1.1;margin:4px 0 2px;animation:fairyPop .7s cubic-bezier(.2,1.5,.4,1);}
@keyframes fairyPop{0%{transform:scale(0) rotate(-40deg)}70%{transform:scale(1.25) rotate(10deg)}100%{transform:scale(1) rotate(0)}}
.ov-fname{font-size:14px;font-weight:900;color:#8a6bdd;margin-bottom:8px;}
.ov-stars{font-size:40px;letter-spacing:5px;margin:6px 0 4px;height:50px;}
.ov-stars span{display:inline-block;opacity:0;transform:scale(0);color:#ffc107;}
.ov-stars span.on{animation:starIn .5s cubic-bezier(.2,1.6,.4,1) forwards;}
.ov-stars span.off{opacity:1;transform:scale(1);color:#ddd4ee;}
@keyframes starIn{0%{opacity:0;transform:scale(0) rotate(-60deg)}100%{opacity:1;transform:scale(1) rotate(0)}}
.ov-msg{font-size:13px;font-weight:800;color:#7a6a92;margin-bottom:13px;line-height:1.5;}
.ov-btns{display:flex;flex-direction:column;gap:8px;align-items:center;}
.ov-btns .row2{display:flex;gap:8px;}

#loading{position:fixed;inset:0;z-index:60;display:flex;align-items:center;justify-content:center;
  background:#241a4d;color:#ffe9a8;font-weight:900;font-size:15px;flex-direction:column;gap:12px;}
#loading.off{display:none;}
.spin{width:38px;height:38px;border:4px solid rgba(255,233,168,.25);border-top-color:#ffe9a8;
  border-radius:50%;animation:sp 1s linear infinite;}
@keyframes sp{to{transform:rotate(360deg)}}
#fallback{position:fixed;inset:0;z-index:70;display:none;align-items:center;justify-content:center;
  background:#241a4d;color:#fff;font-weight:900;font-size:15px;text-align:center;padding:30px;line-height:1.7;}
</style>
</head>
<body>
<div id="wrap">
  <canvas id="cv"></canvas>

  <!-- ===== HUD ===== -->
  <div id="hud">
    <div class="row">
      <button class="icon-btn" id="back-btn" aria-label="もどる">←</button>
      <div id="h-stage"><div class="nm" id="h-name">まほうのもり 1</div><div id="h-stars"></div></div>
      <button class="icon-btn" id="ui-bgm-btn" aria-label="おと">🔊</button>

/* ---------- localStorage 安全シム ---------- */

  var mem = {};
  try {
    var k = '__t' + Math.random();
    window.localStorage.setItem(k, '1');
    window.localStorage.removeItem(k);
    return window.localStorage;
  } catch(e) {
    return {
      getItem: function(key){ return Object.prototype.hasOwnProperty.call(mem, key) ? mem[key] : null; },
      setItem: function(key, val){ mem[key] = String(val); },
      removeItem: function(key){ delete mem[key]; }
    };
  }
})();

var SAVE_KEY = 'meiro_v8_progress';

try {
  var raw = SAFE_LS.getItem(SAVE_KEY);
  if (raw) {
    var p = JSON.parse(raw);

      save.stars   = (p.stars   && typeof p.stars   === 'object') ? p.stars   : {};
      save.fairies = (p.fairies && typeof p.fairies === 'object') ? p.fairies : {};
      save.char    = (typeof p.char === 'number' && p.char >= 0 && p.char < 6) ? p.char : 0;

function mulberry32(a){
  return function(){
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    var t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

/* =========================================================
   サウンド（WebAudio 短音）
   ========================================================= */
var actx = null;
function ac(){
  if (!actx) {
    try { actx = new (window.AudioContext || window.webkitAudioContext)(); } catch(e) { actx = null; }
  }
  if (actx && actx.state === 'suspended') { try { actx.resume(); } catch(e){} }
  return actx;
}
function tone(freq, dur, type, vol, delay){
  var c = ac(); if (!c) return;
  try {
    var t0 = c.currentTime + (delay || 0);
    var o = c.createOscillator(), g = c.createGain();
    o.type = type || 'sine';
    o.frequency.setValueAtTime(freq, t0);
    g.gain.setValueAtTime(0, t0);
    g.gain.linearRampToValueAtTime(vol == null ? 0.16 : vol, t0 + 0.012);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    o.connect(g); g.connect(c.destination);
    o.start(t0); o.stop(t0 + dur + 0.03);
  } catch(e) {}
}
function sfx(kind){
  switch(kind){
    case 'tap':    tone(660, 0.07, 'triangle', 0.13); break;
    case 'step':   tone(320, 0.04, 'sine', 0.045); break;
    case 'star':   tone(880, 0.09, 'triangle', 0.16); tone(1318, 0.13, 'triangle', 0.13, 0.07); break;
    case 'crystal':tone(523, 0.10, 'sine', 0.16); tone(784, 0.12, 'sine', 0.15, 0.08);
                   tone(1046, 0.18, 'sine', 0.13, 0.16); break;
    case 'gate':   tone(196, 0.22, 'sawtooth', 0.09); tone(392, 0.20, 'triangle', 0.10, 0.05); break;
    case 'ghost':  tone(300, 0.14, 'square', 0.10); tone(180, 0.24, 'square', 0.09, 0.10); break;
    case 'warp':   tone(400, 0.10, 'sine', 0.12); tone(700, 0.10, 'sine', 0.12, 0.06);
                   tone(1100, 0.16, 'sine', 0.11, 0.12); break;
    case 'clear':  [523,659,784,1046].forEach(function(f,i){ tone(f, 0.30, 'triangle', 0.16, i*0.11); }); break;
    case 'fanfare':[523,659,784,1046,1318].forEach(function(f,i){ tone(f, 0.42, 'triangle', 0.17, i*0.13); }); break;
  }
}

/* ---------- BGM ----------
   このゲームは共通MP3プレイヤー(WakuwakuMP3BGM)を使う。
   ワールドごとにトラックを切り替える（クロスフェード付き）。
   MP3が使えない環境では合成音の WakuwakuBGM にフォールバックする。 */
var _bgm = null, _bgmTheme = '', _bgmIsMp3 = false;
var MENU_TRACK = 'cute-animals';
var FALLBACK_THEME = { 'cute-animals':'cute', 'adventure':'magical', 'action':'sky' };

function initBGM(theme){
  var th = theme || MENU_TRACK;
  if (typeof WakuwakuMP3BGM !== 'undefined'){
    try {
      if (!_bgm || !_bgmIsMp3){
        _bgm = new WakuwakuMP3BGM(th);
        _bgmIsMp3 = true;
        _bgmTheme = th;
        _bgm.start();
      } else if (_bgmTheme !== th){
        _bgmTheme = th;
        _bgm.setTheme(th);
      } else {
        _bgm.start();
      }
    } catch(e){ _bgm = null; _bgmIsMp3 = false; }
    syncBgmBtn();
    if (_bgm) return;
  }
  /* --- フォールバック：合成音 --- */
  if (typeof WakuwakuBGM === 'undefined') { syncBgmBtn(); return; }
  var fth = FALLBACK_THEME[th] || 'magical';
  if (_bgm && !_bgmIsMp3 && _bgmTheme === fth){
    if (_bgm.enabled) { try { _bgm.start(); } catch(e){} }
    syncBgmBtn(); return;
  }
  try { if (_bgm) _bgm.stop(); } catch(e) {}
  try {
    _bgm = new WakuwakuBGM(fth);
    _bgmIsMp3 = false;
    _bgmTheme = fth;
    var on = WakuwakuBGM.loadState();
    _bgm.setEnabled(on);
    if (on) _bgm.start();
  } catch(e) { _bgm = null; }
  syncBgmBtn();
}

function toggleBGM(){
  if (!_bgm) { initBGM(_bgmTheme || MENU_TRACK); if (!_bgm) return; }
  try {
    var on = _bgm.toggle();
    if (!_bgmIsMp3 && typeof WakuwakuBGM !== 'undefined') WakuwakuBGM.saveState(on);
  } catch(e) {}
  syncBgmBtn();
}

function bgmEnabled(){
  if (_bgm && typeof _bgm.enabled === 'boolean') return _bgm.enabled;
  try {
    if (typeof WakuwakuMP3BGM !== 'undefined') return WakuwakuMP3BGM.loadState();
    if (typeof WakuwakuBGM !== 'undefined') return WakuwakuBGM.loadState();
  } catch(e) {}
  return false;
}

function syncBgmBtn(){
  var label = bgmEnabled() ? '🔊' : '🔇';
  var a = $('ui-bgm-btn'); if (a) a.textContent = label;
  var b = $('t-bgm'); if (b) b.textContent = label + ' おと';
}

function isCleared(i){ return stageStars(i) >= 0; }
function worldCleared(w){
  for (var i = w*STAGES_PER_WORLD; i < (w+1)*STAGES_PER_WORLD; i++) if (!isCleared(i)) return false;
  return true;
}
function worldUnlocked(w){ return w === 0 || worldCleared(w-1); }
function stageUnlocked(i){
  var w = STAGES[i].w;
  if (!worldUnlocked(w)) return false;
  if (i % STAGES_PER_WORLD === 0) return true;
  return isCleared(i-1);
}
function fairyCount(){
  var n = 0;
  for (var i=0;i<FAIRIES.length;i++) if (save.fairies['f'+i]) n++;

/* =========================================================
   めいろ生成（完全迷路 / 再帰的バックトラッカ）
   ========================================================= */
function genMaze(n){
  var m = [], y, x;
  for (y=0;y<n;y++){ m.push([]); for (x=0;x<n;x++) m[y].push(1); }
  var stack = [[1,1]];
  m[1][1] = 0;
  var DX = [0,0,-1,1], DY = [-1,1,0,0];
  while (stack.length){
    var cur = stack[stack.length-1];
    var cx = cur[0], cy = cur[1];
    var opts = [];
    for (var d=0;d<4;d++){
      var nx = cx + DX[d]*2, ny = cy + DY[d]*2;
      if (nx>0 && ny>0 && nx<n-1 && ny<n-1 && m[ny][nx] === 1) opts.push(d);
    }
    if (!opts.length) { stack.pop(); continue; }
    var pick = opts[(rnd()*opts.length)|0];
    m[cy + DY[pick]][cx + DX[pick]] = 0;
    m[cy + DY[pick]*2][cx + DX[pick]*2] = 0;
    stack.push([cx + DX[pick]*2, cy + DY[pick]*2]);
  }
  return m;
}

/* ちょっとだけループを足して行き止まりを減らす（低確率） */
function addLoops(m, n, count){
  var tries = 0;
  while (count > 0 && tries < count*40){
    tries++;
    var x = 1 + ((rnd()*(n-2))|0);
    var y = 1 + ((rnd()*(n-2))|0);
    if (m[y][x] !== 1) continue;
    var hOpen = (x>0 && x<n-1 && m[y][x-1] === 0 && m[y][x+1] === 0);
    var vOpen = (y>0 && y<n-1 && m[y-1][x] === 0 && m[y+1][x] === 0);
    if (hOpen !== vOpen) { m[y][x] = 0; count--; }
  }
}

function key(x,y){ return y*512 + x; }

/* 開いている色集合を条件に到達可能セルを求める */
function reachSet(m, n, gateList, openColors){
  var seen = {}, q = [[1,1]], out = [];
  seen[key(1,1)] = 1;
  var gmap = {};
  for (var i=0;i<gateList.length;i++){
    if (openColors.indexOf(gateList[i].c) < 0) gmap[key(gateList[i].x, gateList[i].y)] = 1;
  }
  var DX = [0,0,-1,1], DY = [-1,1,0,0];
  while (q.length){
    var c = q.shift(); out.push(c);
    for (var d=0;d<4;d++){
      var nx = c[0]+DX[d], ny = c[1]+DY[d];
      if (nx<0||ny<0||nx>=n||ny>=n) continue;
      if (m[ny][nx] === 1) continue;
      var k = key(nx,ny);
      if (seen[k]) continue;
      if (gmap[k]) continue;
      seen[k] = 1; q.push([nx,ny]);
    }
  }
  return { cells: out, seen: seen };
}

/* start→target の最短経路（壁と閉じたとびらを考慮） */
function bfsPath(m, n, sx, sy, tx, ty, blockedFn){
  if (sx === tx && sy === ty) return [[sx,sy]];
  var prev = {}, seen = {}, q = [[sx,sy]];
  seen[key(sx,sy)] = 1;
  var DX = [0,0,-1,1], DY = [-1,1,0,0];
  while (q.length){
    var c = q.shift();
    for (var d=0;d<4;d++){
      var nx = c[0]+DX[d], ny = c[1]+DY[d];
      if (nx<0||ny<0||nx>=n||ny>=n) continue;
      if (m[ny][nx] === 1) continue;
      if (blockedFn && blockedFn(nx,ny)) continue;
      var k = key(nx,ny);
      if (seen[k]) continue;
      seen[k] = 1; prev[k] = c;
      if (nx === tx && ny === ty){
        var path = [[nx,ny]], cur = [nx,ny];
        while (!(cur[0] === sx && cur[1] === sy)){
          cur = prev[key(cur[0],cur[1])];
          path.push(cur);
        }
        path.reverse();
        return path;
      }
      q.push([nx,ny]);
    }
  }
  return null;
}

function openNeighbors(m, n, x, y){
  var c = 0, DX = [0,0,-1,1], DY = [-1,1,0,0];
  for (var d=0;d<4;d++){
    var nx = x+DX[d], ny = y+DY[d];
    if (nx>=0 && ny>=0 && nx<n && ny<n && m[ny][nx] === 0) c++;
  }
  return c;
}

/* いちばん遠いセルを探す（ゴール決め）
   ようせいは「行き止まり」に置く。通り道にあると、ほしを集める前に
   うっかりクリアしてしまうため。 */
function farthestCell(m, n){
  var seen = {}, q = [[1,1,0]], best = [1,1], bd = -1;
  var bestDead = null, bdDead = -1;
  seen[key(1,1)] = 1;
  var DX = [0,0,-1,1], DY = [-1,1,0,0];
  while (q.length){
    var c = q.shift();
    if (c[2] > bd){ bd = c[2]; best = [c[0],c[1]]; }
    if (c[2] > bdDead && openNeighbors(m, n, c[0], c[1]) === 1 && !(c[0] === 1 && c[1] === 1)){
      bdDead = c[2]; bestDead = [c[0],c[1]];
    }
    for (var d=0;d<4;d++){
      var nx = c[0]+DX[d], ny = c[1]+DY[d];
      if (nx<0||ny<0||nx>=n||ny>=n) continue;
      if (m[ny][nx] === 1) continue;
      var k = key(nx,ny);
      if (seen[k]) continue;
      seen[k] = 1; q.push([nx,ny,c[2]+1]);
    }
  }
  if (bestDead && bdDead >= bd * 0.72) return { cell: bestDead, dist: bdDead, dead: true };
  return { cell: best, dist: bd, dead: false };
}

/* ゴールを通らずに行けるセル（＝先にクリアしてしまわない範囲） */
function avoidGoalSet(m, n, goal){
  var seen = {}, q = [[1,1]];
  seen[key(1,1)] = 1;
  var DX = [0,0,-1,1], DY = [-1,1,0,0];
  while (q.length){
    var c = q.shift();
    for (var d=0;d<4;d++){
      var nx = c[0]+DX[d], ny = c[1]+DY[d];
      if (nx<0||ny<0||nx>=n||ny>=n) continue;
      if (m[ny][nx] === 1) continue;
      if (nx === goal[0] && ny === goal[1]) continue;
      var k = key(nx,ny);
      if (seen[k]) continue;
      seen[k] = 1; q.push([nx,ny]);
    }
  }
  return seen;
}

/* =========================================================
   パズル配置（とびら／クリスタル）
   ========================================================= */
function placePuzzle(m, n, cfg, goal){
  var attempt, res;
  for (attempt = 0; attempt < 40; attempt++){
    res = tryPlace(m, n, cfg, goal);
    if (res) return res;
  }
  /* どうしても組めない場合はとびら無しで成立させる */
  return { gates: [], switches: [] };
}

function tryPlace(m, n, cfg, goal){
  var nColors = cfg.colors;
  if (nColors <= 0) return { gates: [], switches: [] };

  var path = bfsPath(m, n, 1, 1, goal[0], goal[1], null);
  if (!path || path.length < nColors*3 + 4) return null;

  var gates = [], switches = [];
  var usedGate = {}, usedSw = {};
  usedSw[key(1,1)] = 1;
  usedSw[key(goal[0],goal[1])] = 1;

  for (var c=0;c<nColors;c++){
    /* --- 経路上に「かんもん」を置く --- */
    var frac = (c+1) / (nColors+1);
    var anchorIdx = Math.max(2, Math.min(path.length-2, Math.round(path.length*frac)));
    var anchor = null;
    for (var off=0; off<path.length; off++){
      var cand = [anchorIdx+off, anchorIdx-off];
      for (var s=0;s<2;s++){
        var ai = cand[s];
        if (ai < 2 || ai > path.length-2) continue;
        var p = path[ai];
        if (usedGate[key(p[0],p[1])]) continue;
        if (p[0] === 1 && p[1] === 1) continue;
        if (p[0] === goal[0] && p[1] === goal[1]) continue;
        anchor = p; break;
      }
      if (anchor) break;
    }
    if (!anchor) return null;
    gates.push({ x:anchor[0], y:anchor[1], c:c });
    usedGate[key(anchor[0],anchor[1])] = 1;
    usedSw[key(anchor[0],anchor[1])] = 1;

    /* --- この色の門を閉じた状態で到達できる範囲にクリスタルを置く --- */
    var openBefore = [];
    for (var oc=0; oc<c; oc++) openBefore.push(oc);
    var r = reachSet(m, n, gates, openBefore);
    var avoid = avoidGoalSet(m, n, goal);
    var pool = [], deadPool = [];
    for (var i=0;i<r.cells.length;i++){
      var cell = r.cells[i];
      var k = key(cell[0],cell[1]);
      if (usedSw[k] || usedGate[k]) continue;
      if (cell[0] === 1 && cell[1] === 1) continue;
      if (!avoid[k]) continue;   /* ゴールの向こう側には置かない */
      pool.push(cell);
      if (openNeighbors(m, n, cell[0], cell[1]) === 1) deadPool.push(cell);
    }
    var src = deadPool.length ? deadPool : pool;
    if (!src.length) return null;
    var pickCell = src[(rnd()*src.length)|0];
    switches.push({ x:pickCell[0], y:pickCell[1], c:c });
    usedSw[key(pickCell[0],pickCell[1])] = 1;

    /* --- 同色の追加とびら（gpc-1個） --- */
    var extra = Math.max(0, (cfg.gpc || 1) - 1);
    var guard = 0;
    while (extra > 0 && guard < 200){
      guard++;
      var gx = 1 + ((rnd()*(n-2))|0), gy = 1 + ((rnd()*(n-2))|0);
      if (m[gy][gx] !== 0) continue;
      var gk = key(gx,gy);
      if (usedGate[gk] || usedSw[gk]) continue;
      if (gx === 1 && gy === 1) continue;
      if (gx === goal[0] && gy === goal[1]) continue;
      if (openNeighbors(m, n, gx, gy) !== 2) continue;
      gates.push({ x:gx, y:gy, c:c });
      usedGate[gk] = 1; usedSw[gk] = 1;
      extra--;
    }
  }

  /* --- 解けるか検証（門は開くだけなので単調） --- */
  var open = [], changed = true, safety = 0;
  while (changed && safety < 20){
    changed = false; safety++;
    var rr = reachSet(m, n, gates, open);
    for (var si=0; si<switches.length; si++){
      var sw = switches[si];
      if (open.indexOf(sw.c) < 0 && rr.seen[key(sw.x, sw.y)]) { open.push(sw.c); changed = true; }
    }
  }
  var fin = reachSet(m, n, gates, open);
  if (!fin.seen[key(goal[0], goal[1])]) return null;

  /* --- クリスタルを取らなくてもゴールできる＝つまらない、ので却下 --- */
  if (nColors > 0){
    var trivial = reachSet(m, n, gates, []);
    if (trivial.seen[key(goal[0], goal[1])]) return null;
  }
  return { gates: gates, switches: switches };
}

/* 壁を1マスだけ彫って「行き止まりの小部屋」を作る。
   開いているとなりが1マスだけの壁を選ぶので、
   めいろの通り道（＝解ける／解けない）は絶対に変わらない。 */
function carveAlcoves(m, n, goal, avoid, taken, want){
  var cands = [], x, y;
  var DX = [0,0,-1,1], DY = [-1,1,0,0];
  for (y=1; y<n-1; y++){
    for (x=1; x<n-1; x++){
      if (m[y][x] !== 1) continue;
      var open = [], d;
      for (d=0; d<4; d++){
        var nx = x+DX[d], ny = y+DY[d];
        if (nx<0||ny<0||nx>=n||ny>=n) continue;
        if (m[ny][nx] === 0) open.push([nx,ny]);
      }
      if (open.length !== 1) continue;
      var nb = open[0];
      if (nb[0] === goal[0] && nb[1] === goal[1]) continue;
      if (!avoid[key(nb[0], nb[1])]) continue;      /* ゴールの向こう側には作らない */
      if (taken[key(nb[0], nb[1])]) continue;
      if (Math.abs(x-1) + Math.abs(y-1) < 4) continue; /* スタートのすぐ横は避ける */
      cands.push([x,y]);
    }
  }
  /* できるだけ離れた組み合わせになるよう、遠い順に間引いて選ぶ */
  var picked = [];
  var guard = 0;
  while (picked.length < want && cands.length && guard < 400){
    guard++;
    var best = -1, bestScore = -1;
    for (var i=0;i<cands.length;i++){
      var minD = 999;
      for (var j=0;j<picked.length;j++){
        var dd = Math.abs(cands[i][0]-picked[j][0]) + Math.abs(cands[i][1]-picked[j][1]);
        if (dd < minD) minD = dd;
      }
      if (picked.length === 0) minD = Math.abs(cands[i][0]-1) + Math.abs(cands[i][1]-1);
      if (minD > bestScore){ bestScore = minD; best = i; }
    }
    if (best < 0) break;
    if (picked.length % 2 === 1 && bestScore < Math.max(5, (n/2)|0)) break;
    var c = cands.splice(best, 1)[0];
    m[c[1]][c[0]] = 0;
    avoid[key(c[0], c[1])] = 1;
    picked.push(c);
  }
  /* 奇数個しか取れなかったら、対にならないので最後の1つは埋め戻す */
  if (picked.length % 2 === 1){
    var last = picked.pop();
    m[last[1]][last[0]] = 1;
    avoid[key(last[0], last[1])] = 0;
  }
  return picked;
}

/* =========================================================
   ほし・おばけ・ワープ配置
   ========================================================= */
function placeExtras(m, n, cfg, goal, gates, switches){
  var taken = {};
  var avoid = avoidGoalSet(m, n, goal);
  taken[key(1,1)] = 1;
  taken[key(goal[0],goal[1])] = 1;
  var i;
  for (i=0;i<gates.length;i++) taken[key(gates[i].x, gates[i].y)] = 1;
  for (i=0;i<switches.length;i++) taken[key(switches[i].x, switches[i].y)] = 1;

  /* 到達順の段階（tier）を作る：クリスタルを取るたびに広がる範囲 */
  var tiers = [], open = [], guard = 0;
  while (guard < 12){
    guard++;
    var r = reachSet(m, n, gates, open.slice());
    tiers.push(r);
    var added = false;
    for (var si=0; si<switches.length; si++){
      var sw = switches[si];
      if (open.indexOf(sw.c) < 0 && r.seen[key(sw.x, sw.y)]) { open.push(sw.c); added = true; }
    }
    if (!added) break;
  }
  var full = tiers[tiers.length-1];

  function pickFrom(cells, filter){
    var pool = [];
    for (var i2=0;i2<cells.length;i2++){
      var c = cells[i2];
      var ck = key(c[0],c[1]);
      if (taken[ck]) continue;
      if (!avoid[ck]) continue;   /* ゴールの向こう側には置かない */
      if (filter && !filter(c)) continue;
      pool.push(c);
    }
    if (!pool.length) return null;
    var p = pool[(rnd()*pool.length)|0];
    taken[key(p[0],p[1])] = 1;
    return p;
  }

  /* --- ほし3つ：やさしい1つは通り道の近く、2つは行き止まり --- */
  var stars = [];
  var mainPath = bfsPath(m, n, 1, 1, goal[0], goal[1], function(x,y){
    return false; /* 検証済みなので全開通で経路をとる */
  });
  if (mainPath && mainPath.length > 6){
    var mid = mainPath[Math.floor(mainPath.length*0.45)];
    var mk = key(mid[0],mid[1]);
    if (!taken[mk] && avoid[mk]) { taken[mk] = 1; stars.push({x:mid[0], y:mid[1]}); }
  }
  var deadFilter = function(c){ return openNeighbors(m, n, c[0], c[1]) === 1; };
  while (stars.length < 3){
    var tierIdx = Math.min(tiers.length-1, stars.length);
    var src = tiers[tierIdx] ? tiers[tierIdx].cells : full.cells;
    var p2 = pickFrom(src, deadFilter) || pickFrom(full.cells, deadFilter) || pickFrom(full.cells, null);
    if (!p2) break;
    stars.push({ x:p2[0], y:p2[1] });
  }

  /* --- おばけ：スタートから離れた通路 --- */
  var ghosts = [];
  for (var gi=0; gi<(cfg.ghosts||0); gi++){
    var g = pickFrom(full.cells, function(c){
      var dd = Math.abs(c[0]-1) + Math.abs(c[1]-1);
      return dd >= 5 && openNeighbors(m, n, c[0], c[1]) >= 2;
    });
    if (!g) g = pickFrom(full.cells, function(c){ return Math.abs(c[0]-1)+Math.abs(c[1]-1) >= 4; });
    if (!g) break;
    ghosts.push({ x:g[0], y:g[1], dir:(rnd()*4)|0, t:0 });
  }

  /* --- ワープ：壁に「まほうの小部屋」を彫って、そこだけに置く。
         通り道に置くと 子どもが意図せず飛ばされてしまうので、
         かならず自分から入りに行く行き止まりにする。 --- */
  var warps = [];
  var nWarps = cfg.warps || 0;
  if (nWarps > 0){
    var alcoves = carveAlcoves(m, n, goal, avoid, taken, nWarps * 2);
    for (var wi=0; wi<nWarps; wi++){
      var a = alcoves[wi*2], b = alcoves[wi*2 + 1];
      if (!a || !b) break;
      taken[key(a[0],a[1])] = 1;
      taken[key(b[0],b[1])] = 1;
      warps.push({ a:{x:a[0],y:a[1]}, b:{x:b[0],y:b[1]} });
    }
  }

  return { stars: stars, ghosts: ghosts, warps: warps };
}

   Three.js セットアップ
   ========================================================= */
var renderer, scene, camera, hemi, dirLight, playerLight;
var gWorld = null;      /* ステージごとに作り直すグループ */
var petObj = null, fairyObj = null;
var ghostObjs = [], starObjs = [], crystalObjs = [], gateObjs = [], warpObjs = [], decoObjs = [];

function mat(color, emissive){
  return new THREE.MeshLambertMaterial({
    color: color,
    emissive: emissive || 0x000000,
    emissiveIntensity: emissive ? 0.55 : 0
  });
}
function mesh(geo, material, x, y, z){
  var m = new THREE.Mesh(geo, material);
  m.position.set(x||0, y||0, z||0);
  return m;
}
function disposeGroup(root){
  if (!root) return;
  root.traverse(function(o){
    if (o.geometry) o.geometry.dispose();
    if (o.material){
      if (Array.isArray(o.material)) o.material.forEach(function(mm){ mm.dispose(); });
      else o.material.dispose();
    }
  });
}

function init3D(){
  var canvas = $('cv');
  try {
    renderer = new THREE.WebGLRenderer({ canvas: canvas, antialias: true, alpha: false });
  } catch(e) { return false; }
  if (!renderer) return false;
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
  renderer.setSize(window.innerWidth, window.innerHeight, false);
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  if (THREE.sRGBEncoding !== undefined) renderer.outputEncoding = THREE.sRGBEncoding;

  scene = new THREE.Scene();
  scene.background = new THREE.Color(0x9fd8a8);
  scene.fog = new THREE.Fog(0x9fd8a8, 14, 30);

  camera = new THREE.PerspectiveCamera(48, window.innerWidth / Math.max(1, window.innerHeight), 0.1, 120);
  camera.position.set(0, 9, 7.2);

  hemi = new THREE.HemisphereLight(0xdff5c8, 0x3f7a44, 0.95);
  scene.add(hemi);

  dirLight = new THREE.DirectionalLight(0xfff3d0, 0.68);
  dirLight.position.set(6, 13, 5);
  dirLight.castShadow = true;
  dirLight.shadow.mapSize.width = 1024;
  dirLight.shadow.mapSize.height = 1024;
  dirLight.shadow.camera.near = 1;
  dirLight.shadow.camera.far = 42;
  dirLight.shadow.camera.left = -9;
  dirLight.shadow.camera.right = 9;
  dirLight.shadow.camera.top = 9;
  dirLight.shadow.camera.bottom = -9;
  dirLight.shadow.bias = -0.0016;
  scene.add(dirLight);
  scene.add(dirLight.target);

  playerLight = new THREE.PointLight(0xffe9b0, 0.0, 7.5);
  scene.add(playerLight);

  gl3dReady = true;
  return true;
}

function onResize(){
  if (!renderer || !camera) return;
  var w = window.innerWidth, h = Math.max(1, window.innerHeight);
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
  renderer.setSize(w, h, false);
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
}

/* =========================================================
   キャラモデル（ローポリ・絵文字不使用）
   ========================================================= */
function makePet(def){
  var g = new THREE.Group();
  var fur    = mat(def.fur);
  var accent = mat(def.accent);
  var dark   = mat(0x3a2b22);
  var white  = mat(0xffffff);
  var noseM  = mat(def.nose);

  var body = mesh(new THREE.SphereGeometry(0.27, 14, 11), fur, 0, 0.27, 0);
  body.scale.set(1, 0.92, 0.9);
  body.castShadow = true;
  g.add(body);

  var head = mesh(new THREE.SphereGeometry(0.235, 14, 11), fur, 0, 0.56, 0.03);
  head.castShadow = true;
  g.add(head);

  /* ---------- みみ（どうぶつごとに かたちを かえる） ---------- */
  var ears = [];
  function addEar(side){
    var e = new THREE.Group();
    var outer, inner;
    if (def.ear === 'long'){            /* うさぎ：とても ながい */
      outer = mesh(new THREE.SphereGeometry(0.072, 8, 7), fur, 0, 0, 0);
      outer.scale.set(1, 2.9, 0.62);
      inner = mesh(new THREE.SphereGeometry(0.072, 8, 7), accent, 0, 0, 0.035);
      inner.scale.set(0.58, 2.5, 0.4);
      e.position.set(side * 0.10, 0.90, 0);
      e.rotation.z = -side * 0.10;
    } else if (def.ear === 'flop'){      /* いぬ：よこに たれる */
      outer = mesh(new THREE.SphereGeometry(0.085, 8, 7), fur, 0, 0, 0);
      outer.scale.set(0.72, 1.9, 0.6);
      inner = mesh(new THREE.SphereGeometry(0.085, 8, 7), accent, 0, -0.02, 0.03);
      inner.scale.set(0.42, 1.5, 0.34);
      e.position.set(side * 0.215, 0.60, 0);
      e.rotation.z = side * 0.30;
    } else if (def.ear === 'foxTri'){    /* きつね：大きく するどい */
      outer = mesh(new THREE.ConeGeometry(0.095, 0.27, 4), fur, 0, 0, 0);
      inner = mesh(new THREE.ConeGeometry(0.058, 0.19, 4), accent, 0, -0.01, 0.035);
      e.position.set(side * 0.145, 0.79, 0);
      e.rotation.z = -side * 0.20;
    } else if (def.ear === 'catTri'){    /* ねこ：小さめの さんかく */
      outer = mesh(new THREE.ConeGeometry(0.082, 0.15, 4), fur, 0, 0, 0);
      inner = mesh(new THREE.ConeGeometry(0.048, 0.10, 4), accent, 0, -0.01, 0.03);
      e.position.set(side * 0.135, 0.735, 0);
      e.rotation.z = -side * 0.24;
    } else {                            /* くま・ぱんだ：大きな まる */
      outer = mesh(new THREE.SphereGeometry(0.105, 10, 8), (def.key === 'panda' ? accent : fur), 0, 0, 0);
      outer.scale.set(1, 1, 0.66);
      inner = mesh(new THREE.SphereGeometry(0.06, 9, 7),
                   (def.key === 'panda' ? mat(0x5a5560) : accent), 0, 0, 0.05);
      inner.scale.set(1, 1, 0.5);
      e.position.set(side * 0.185, 0.715, 0);
    }
    outer.castShadow = true;
    e.add(outer); e.add(inner);
    g.add(e); ears.push(e);
  }
  addEar(-1); addEar(1);

  /* ---------- かおの もよう ---------- */
  if (def.patch === 'eyePatch'){        /* ぱんだ：目のまわりの くろ */
    for (var pz=0; pz<2; pz++){
      var side = pz ? 1 : -1;
      var patch = mesh(new THREE.SphereGeometry(0.078, 9, 8), accent, side * 0.088, 0.596, 0.175);
      patch.scale.set(1, 1.18, 0.42);
      patch.rotation.z = side * 0.28;
      g.add(patch);
    }
  } else if (def.patch === 'foxFace'){  /* きつね：白い ほお */
    for (var fz=0; fz<2; fz++){
      var fs2 = fz ? 1 : -1;
      var cheek = mesh(new THREE.SphereGeometry(0.085, 9, 8), accent, fs2 * 0.125, 0.545, 0.135);
      cheek.scale.set(0.8, 0.85, 0.5);
      g.add(cheek);
    }
  } else if (def.patch === 'cheek'){    /* うさぎ：ピンクの ほお */
    for (var cz=0; cz<2; cz++){
      var cs2 = cz ? 1 : -1;
      var ch = mesh(new THREE.SphereGeometry(0.045, 8, 7), accent, cs2 * 0.145, 0.545, 0.155);
      ch.scale.set(1, 0.7, 0.35);
      g.add(ch);
    }
  } else if (def.patch === 'browSpot'){ /* いぬ：まゆの ぶち */
    for (var bz=0; bz<2; bz++){
      var bs2 = bz ? 1 : -1;
      var br = mesh(new THREE.SphereGeometry(0.05, 8, 7), accent, bs2 * 0.085, 0.665, 0.165);
      br.scale.set(1, 0.7, 0.35);
      g.add(br);
    }
  }

  /* ---------- め・はな・くち ---------- */
  var eyeGeo = new THREE.SphereGeometry(0.036, 7, 6);
  var eyeMat = (def.key === 'panda') ? white : mat(0x3a2b22);
  g.add(mesh(eyeGeo, eyeMat, -0.085, 0.60, 0.207));
  g.add(mesh(eyeGeo, eyeMat,  0.085, 0.60, 0.207));
  if (def.key === 'panda'){
    var pupilGeo = new THREE.SphereGeometry(0.019, 6, 5);
    g.add(mesh(pupilGeo, mat(0x2f2b33), -0.085, 0.60, 0.235));
    g.add(mesh(pupilGeo, mat(0x2f2b33),  0.085, 0.60, 0.235));
  }
  var sn = def.snout || 1;
  var muzzle = mesh(new THREE.SphereGeometry(0.085, 10, 8),
                    (def.key === 'fox' || def.key === 'bear') ? accent : white,
                    0, 0.525, 0.175 + 0.03 * sn);
  muzzle.scale.set(1.1, 0.74, 0.62 * sn);
  g.add(muzzle);
  g.add(mesh(new THREE.SphereGeometry(0.03, 7, 6), noseM, 0, 0.548, 0.235 + 0.055 * sn));

  /* ねこの ひげ */
  if (def.patch === 'whisker'){
    var wMat = new THREE.MeshBasicMaterial({ color: 0x5a4636 });
    for (var ws=0; ws<2; ws++){
      var wside = ws ? 1 : -1;
      for (var wi2=0; wi2<2; wi2++){
        var wh = mesh(new THREE.BoxGeometry(0.13, 0.006, 0.006), wMat,
                      wside * 0.135, 0.532 + wi2 * 0.028, 0.20);
        wh.rotation.z = wside * (0.16 - wi2 * 0.24);
        g.add(wh);
      }
    }
  }

  /* ---------- あし ---------- */
  var footGeo = new THREE.SphereGeometry(0.075, 8, 7);
  var feet = [];
  var fp = [[-0.13,0.07,0.10],[0.13,0.07,0.10],[-0.13,0.07,-0.10],[0.13,0.07,-0.10]];
  for (var i=0;i<4;i++){
    var f = mesh(footGeo, (def.key === 'panda') ? accent : fur, fp[i][0], fp[i][1], fp[i][2]);
    f.scale.set(1, 0.72, 1.25);
    f.castShadow = true;
    g.add(f); feet.push(f);
  }

  /* ---------- しっぽ ---------- */
  var tail;
  if (def.tail === 'bushy'){            /* きつね：大きく ふさふさ */
    tail = new THREE.Group();
    var t1 = mesh(new THREE.SphereGeometry(0.115, 10, 8), fur, 0, 0, 0);
    t1.scale.set(0.85, 0.85, 1.5);
    var t2 = mesh(new THREE.SphereGeometry(0.075, 9, 7), accent, 0, 0.02, -0.14);
    tail.add(t1); tail.add(t2);
    tail.position.set(0, 0.32, -0.30);
    tail.rotation.x = -0.35;
  } else if (def.tail === 'puff'){      /* うさぎ：まるい わた */
    tail = mesh(new THREE.SphereGeometry(0.085, 9, 8), white, 0, 0.28, -0.27);
  } else if (def.tail === 'long'){      /* ねこ：ながい しっぽ */
    tail = new THREE.Group();
    for (var ti=0; ti<4; ti++){
      var seg = mesh(new THREE.SphereGeometry(0.045 - ti * 0.006, 7, 6), fur,
                     0, ti * 0.075, -0.03 * ti);
      tail.add(seg);
    }
    tail.position.set(0, 0.30, -0.26);
    tail.rotation.x = 0.45;
  } else if (def.tail === 'wag'){       /* いぬ：ふとめ */
    tail = mesh(new THREE.SphereGeometry(0.06, 8, 7), fur, 0, 0.36, -0.26);
    tail.scale.set(0.8, 1.5, 0.8);
    tail.rotation.x = -0.5;
  } else {                              /* くま・ぱんだ：まるい ちょび */
    tail = mesh(new THREE.SphereGeometry(0.058, 8, 7),
                (def.key === 'panda') ? accent : fur, 0, 0.28, -0.27);
  }
  g.add(tail);

  /* 足もとの わっか（自分の いちが すぐ わかるように） */
  var ringMat = new THREE.MeshBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0.30 });
  var footRing = mesh(new THREE.CircleGeometry(0.34, 18), ringMat, 0, 0.02, 0);
  footRing.rotation.x = -Math.PI/2;
  g.add(footRing);

  g.userData.head = head;
  g.userData.feet = feet;
  g.userData.tail = tail;
  g.userData.body = body;
  g.userData.ears = ears;
  g.userData.footRing = footRing;
  return g;
}

/* =========================================================
   ゴールのようせい
   ========================================================= */
function makeFairy(colorHex){
  var g = new THREE.Group();

  /* はね（おおきめ・うすい白）— さきに置いて うしろに見せる */
  var wingMat = new THREE.MeshBasicMaterial({
    color: 0xffffff, transparent: true, opacity: 0.5, side: THREE.DoubleSide
  });
  var wings = [];
  for (var s=0;s<2;s++){
    var wg = mesh(new THREE.CircleGeometry(0.30, 12), wingMat, (s?0.20:-0.20), 0.80, -0.10);
    wg.scale.set(0.6, 1.15, 1);
    wg.rotation.z = s ? -0.45 : 0.45;
    wg.rotation.y = s ? -0.55 : 0.55;
    g.add(wg); wings.push(wg);
  }

  /* からだ（ひかる玉） */
  var core = mesh(new THREE.SphereGeometry(0.24, 14, 11), new THREE.MeshLambertMaterial({
    color: 0xfffaf0, emissive: colorHex, emissiveIntensity: 0.95
  }), 0, 0.66, 0);
  g.add(core);

  /* うすい ひかりのモヤ（じゃまにならない濃さに） */
  var halo = mesh(new THREE.SphereGeometry(0.40, 12, 10),
    new THREE.MeshBasicMaterial({ color: colorHex, transparent: true, opacity: 0.13 }), 0, 0.66, 0);
  g.add(halo);

  /* まわりを まわる きらきら */
  var sparks = [];
  var sparkMat = new THREE.MeshBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0.9 });
  for (var k=0;k<4;k++){
    var sp = mesh(new THREE.OctahedronGeometry(0.055, 0), sparkMat, 0, 0.66, 0);
    g.add(sp); sparks.push(sp);
  }

  /* だいざ（ひかりの輪） */
  var ring = mesh(new THREE.TorusGeometry(0.42, 0.05, 6, 20),
    new THREE.MeshLambertMaterial({ color: 0xffffff, emissive: colorHex, emissiveIntensity: 0.85 }), 0, 0.06, 0);
  ring.rotation.x = Math.PI/2;
  g.add(ring);

  g.userData.core = core;
  g.userData.halo = halo;
  g.userData.wings = wings;
  g.userData.sparks = sparks;
  g.userData.ring = ring;
  return g;
}

function makeGate(gc, wallH){

    color: gc.main, emissive: gc.main, emissiveIntensity: 0.45, transparent: true, opacity: 0.95

    post.castShadow = true;
    g.add(post);

  var top = mesh(new THREE.BoxGeometry(1.08, 0.14, 0.30), frameMat, 0, h*1.02, 0);

  g.add(lock);
  g.userData.door = door;
