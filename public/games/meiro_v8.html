/* =========================================================
   ステージの3Dを組み立て
   ========================================================= */
function w2(v, size){ return v - size/2 + 0.5; }

function buildStage3D(){
  if (gWorld){ scene.remove(gWorld); disposeGroup(gWorld); gWorld = null; }
  ghostObjs = []; starObjs = []; crystalObjs = []; gateObjs = []; warpObjs = []; decoObjs = [];

  var W = WORLDS[curStage.w];
  var n = sz;
  gWorld = new THREE.Group();
  scene.add(gWorld);

  scene.background = new THREE.Color(W.sky);
  scene.fog.color = new THREE.Color(W.fog);
  scene.fog.near = 13; scene.fog.far = 30;
  hemi.color = new THREE.Color(W.hemiSky);
  hemi.groundColor = new THREE.Color(W.hemiGnd);
  dirLight.color = new THREE.Color(W.dirColor);
  if (curStage.w === 0){ hemi.intensity = 0.86; dirLight.intensity = 0.60; playerLight.intensity = 0.0; }
  else if (curStage.w === 1){ hemi.intensity = 0.60; dirLight.intensity = 0.46; playerLight.intensity = 0.60; }
  else { hemi.intensity = 0.64; dirLight.intensity = 0.48; playerLight.intensity = 0.48; }

  var wallH = (curStage.w === 0) ? 1.0 : (curStage.w === 1 ? 1.25 : 1.1);

  /* --- ゆか（市松） --- */
  /* そとがわの ひろい 地面（めいろの ゆかとは 色を かえる） */
  var floorGeo = new THREE.PlaneGeometry(n + 110, n + 110, 14, 14);
  var floor = mesh(floorGeo, mat(W.outerGround || W.ground), 0, -0.01, 0);
  floor.rotation.x = -Math.PI/2;
  floor.receiveShadow = true;
  gWorld.add(floor);

  /* めいろの ゆか */
  var mazeFloor = mesh(new THREE.PlaneGeometry(n, n), mat(W.ground), 0, 0, 0);
  mazeFloor.rotation.x = -Math.PI/2;
  mazeFloor.receiveShadow = true;
  gWorld.add(mazeFloor);

  var tileGeo = new THREE.PlaneGeometry(1, 1);
  var tileMat = mat(W.groundAlt);
  var tileCount = 0, tx, ty;
  for (ty=0; ty<n; ty++) for (tx=0; tx<n; tx++)
    if (maze[ty][tx] === 0 && ((tx+ty) % 2 === 0)) tileCount++;
  if (tileCount > 0){
    var tiles = new THREE.InstancedMesh(tileGeo, tileMat, tileCount);
    tiles.receiveShadow = true;
    var dummy = new THREE.Object3D(), ti = 0;
    for (ty=0; ty<n; ty++) for (tx=0; tx<n; tx++){
      if (maze[ty][tx] !== 0 || ((tx+ty) % 2 !== 0)) continue;
      dummy.position.set(w2(tx,n), 0.012, w2(ty,n));
      dummy.rotation.set(-Math.PI/2, 0, 0);
      dummy.scale.set(1,1,1);
      dummy.updateMatrix();
      tiles.setMatrixAt(ti++, dummy.matrix);
    }
    tiles.instanceMatrix.needsUpdate = true;
    gWorld.add(tiles);
  }

  /* --- かべ（InstancedMesh） --- */
  var wallCells = [];
  for (ty=0; ty<n; ty++) for (tx=0; tx<n; tx++) if (maze[ty][tx] === 1) wallCells.push([tx,ty]);
  if (wallCells.length){
    var wallGeo = new THREE.BoxGeometry(1, wallH, 1);
    var walls = new THREE.InstancedMesh(wallGeo, mat(W.wall), wallCells.length);
    walls.castShadow = true; walls.receiveShadow = true;
    var d1 = new THREE.Object3D();
    for (var wi=0; wi<wallCells.length; wi++){
      d1.position.set(w2(wallCells[wi][0],n), wallH/2, w2(wallCells[wi][1],n));
      d1.rotation.set(0,0,0); d1.scale.set(1,1,1);
      d1.updateMatrix();
      walls.setMatrixAt(wi, d1.matrix);
    }
    walls.instanceMatrix.needsUpdate = true;
    gWorld.add(walls);

    /* かべの天面かざり */
    var capGeo, capMat = mat(W.wallTop);
    if (W.deco === 'bush')         capGeo = new THREE.SphereGeometry(0.42, 8, 6);
    else if (W.deco === 'candle')  capGeo = new THREE.BoxGeometry(0.94, 0.14, 0.94);
    else                           capGeo = new THREE.ConeGeometry(0.36, 0.42, 5);
    var caps = new THREE.InstancedMesh(capGeo, capMat, wallCells.length);
    caps.castShadow = true;
    var d2 = new THREE.Object3D();
    for (var ci=0; ci<wallCells.length; ci++){
      var yTop = wallH + (W.deco === 'bush' ? 0.12 : (W.deco === 'candle' ? 0.07 : 0.20));
      d2.position.set(w2(wallCells[ci][0],n), yTop, w2(wallCells[ci][1],n));
      /* 箱の天面は回すと菱形にはみ出るので、まわすのは丸・とんがりだけ */
      d2.rotation.set(0, (W.deco === 'candle') ? 0 : ((ci*37)%360) * Math.PI/180, 0);
      var s = (W.deco === 'bush') ? (0.9 + ((ci*13)%7)*0.03) : 1;
      d2.scale.set(s, W.deco === 'bush' ? s*0.72 : s, s);
      d2.updateMatrix();
      caps.setMatrixAt(ci, d2.matrix);
    }
    caps.instanceMatrix.needsUpdate = true;
    gWorld.add(caps);
  }

  /* --- ワールドごとの光るかざり --- */
  buildWorldDeco(W, n, wallH);

  /* --- めいろの そとの けしき --- */
  buildOuterScenery(W, n);

  /* --- とびら --- */
  for (var gi2=0; gi2<gates.length; gi2++){
    var gd = gates[gi2];
    var gc = GATE_COLORS[gd.c % GATE_COLORS.length];
    var go = makeGate(gc, wallH);
    go.position.set(w2(gd.x,n), 0, w2(gd.y,n));
    /* とおりみちの向きに合わせる */
    var horiz = (gd.x > 0 && gd.x < n-1 && maze[gd.y][gd.x-1] === 0 && maze[gd.y][gd.x+1] === 0);
    go.rotation.y = horiz ? Math.PI/2 : 0;
    gWorld.add(go);
    gateObjs.push({ obj: go, data: gd });
  }

  /* --- クリスタル --- */
  for (var si2=0; si2<switches.length; si2++){
    var sd = switches[si2];
    var gc2 = GATE_COLORS[sd.c % GATE_COLORS.length];
    var co = makeCrystal(gc2);
    co.position.set(w2(sd.x,n), 0, w2(sd.y,n));
    gWorld.add(co);
    crystalObjs.push({ obj: co, data: sd, taken: false });
  }

  /* --- ほし --- */
  for (var ti2=0; ti2<stars.length; ti2++){
    var so = makeStar();
    so.position.set(w2(stars[ti2].x,n), 0, w2(stars[ti2].y,n));
    gWorld.add(so);
    starObjs.push({ obj: so, data: stars[ti2], taken: false });
  }

  /* --- ワープ --- */
  for (var wi2=0; wi2<warps.length; wi2++){
    var pair = warps[wi2];
    var oa = makeWarp(), ob = makeWarp();
    oa.position.set(w2(pair.a.x,n), 0, w2(pair.a.y,n));
    ob.position.set(w2(pair.b.x,n), 0, w2(pair.b.y,n));
    gWorld.add(oa); gWorld.add(ob);
    warpObjs.push({ objA: oa, objB: ob, data: pair });
  }

  /* --- おばけ --- */
  for (var hi=0; hi<ghosts.length; hi++){
    var ho = makeGhost();
    ho.position.set(w2(ghosts[hi].x,n), 0, w2(ghosts[hi].y,n));
    gWorld.add(ho);
    ghostObjs.push({ obj: ho, data: ghosts[hi], rx: ghosts[hi].x, ry: ghosts[hi].y });
  }

  /* --- ゴールのようせい --- */
  fairyObj = makeFairy(FAIRIES[stageIdx].color);
  fairyObj.position.set(w2(goal[0],n), 0, w2(goal[1],n));
  gWorld.add(fairyObj);

  /* --- あいぼう --- */
  petObj = makePet(CHARS[selChar]);
  petObj.scale.set(1.18, 1.18, 1.18);
  petObj.position.set(w2(1,n), 0, w2(1,n));
  gWorld.add(petObj);

  /* --- スタート地点のしるし --- */
  var startRing = mesh(new THREE.TorusGeometry(0.36, 0.05, 6, 18),
    new THREE.MeshLambertMaterial({ color: 0xffffff, emissive: 0xffe9a8, emissiveIntensity: 0.4 }),
    w2(1,n), 0.05, w2(1,n));
  startRing.rotation.x = Math.PI/2;
  gWorld.add(startRing);
}

/* =========================================================
   めいろの そとの けしき
   カメラは 約48ど 見下ろしなので、空や 地平線は 画面に 入らない。
   そのため 遠景ではなく「めいろの すぐ そと」を にぎやかにする。
   高さは かべ(約1.1)より 低くおさえ、めいろが かくれないようにする。
   ドローコールを へらすため InstancedMesh で まとめる。
   ========================================================= */
function instMesh(geo, material, list){
  if (!list.length) return null;
  var im = new THREE.InstancedMesh(geo, material, list.length);
  im.castShadow = false; im.receiveShadow = false;
  var d = new THREE.Object3D();
  for (var i=0;i<list.length;i++){
    var t = list[i];
    d.position.set(t.x, t.y, t.z);
    d.rotation.set(t.rx || 0, t.ry || 0, t.rz || 0);
    var sc = (t.s === undefined) ? 1 : t.s;
    d.scale.set(sc * (t.sx || 1), sc * (t.sy || 1), sc * (t.sz || 1));
    d.updateMatrix();
    im.setMatrixAt(i, d.matrix);
  }
  im.instanceMatrix.needsUpdate = true;
  gWorld.add(im);
  return im;
}

function buildOuterScenery(W, n){
  var inner = n / 2 + 1.2;     /* めいろの ふちの すぐ そと */
  var outerR = n / 2 + 13;     /* 画面に 入る はんいの ぎりぎり */
  var i, x, z;

  function spot(){
    var ang = rnd() * Math.PI * 2;
    var rad = inner + Math.pow(rnd(), 1.7) * (outerR - inner);
    x = Math.cos(ang) * rad;
    z = Math.sin(ang) * rad;
    /* しかくい めいろに めりこまないよう そとへ 押し出す */
    var m = Math.max(Math.abs(x), Math.abs(z));
    if (m < inner && m > 0.001){ var push = inner / m; x *= push; z *= push; }
  }

  /* めいろを ふちどる 台座（どのワールドでも） */
  var rimGeo = new THREE.BoxGeometry(n + 2.2, 0.26, n + 2.2);
  var rim = mesh(rimGeo, mat(W.wallTop), 0, -0.14, 0);
  rim.receiveShadow = true;
  gWorld.add(rim);

  if (W.deco === 'bush'){
    /* --- まほうのもり：おはな畑・まるい しげみ・ちいさな 池 --- */
    var bushes = [], stems = [], petals = [], rocks = [], ponds = [];
    var petalCols = [0xff8ab0, 0xffd166, 0xff7a7a, 0xc48cff, 0xfff0f5];
    var petalBuckets = [[], [], [], [], []];
    for (i=0;i<150;i++){
      spot();
      var r = rnd();
      if (r < 0.42){
        /* まるい しげみ（低い） */
        var bs = 0.35 + rnd() * 0.45;
        bushes.push({ x:x, y:bs * 0.42, z:z, ry:rnd()*6.28, s:bs, sy:0.72 });
      } else if (r < 0.86){
        /* おはな：くき＋花びら */
        var fh = 0.22 + rnd() * 0.26;
        stems.push({ x:x, y:fh/2, z:z, s:1, sy:fh/1.0 });
        petalBuckets[(rnd()*petalCols.length)|0].push({ x:x, y:fh + 0.06, z:z, ry:rnd()*6.28, s:0.9 + rnd()*0.5 });
      } else {
        /* いし */
        rocks.push({ x:x, y:0.05, z:z, ry:rnd()*6.28, s:0.18 + rnd()*0.28, sy:0.6 });
      }
    }
    for (i=0;i<9;i++){
      /* 池は めいろに かからないよう すこし そとへ */
      do { spot(); } while (Math.max(Math.abs(x), Math.abs(z)) < n / 2 + 3.2);
      ponds.push({ x:x, y:0.02, z:z, rx:-Math.PI/2, ry:rnd()*6.28, s:1.0 + rnd()*1.3 });
    }
    instMesh(new THREE.SphereGeometry(1, 8, 6), mat(0x4fae59), bushes);
    instMesh(new THREE.CylinderGeometry(0.022, 0.03, 1.0, 4), mat(0x4a9a52), stems);
    for (i=0;i<petalCols.length;i++){
      instMesh(new THREE.SphereGeometry(0.075, 6, 5), mat(petalCols[i]), petalBuckets[i]);
    }
    instMesh(new THREE.DodecahedronGeometry(1, 0), mat(0xbdb59a), rocks);
    instMesh(new THREE.CircleGeometry(1, 14),
      new THREE.MeshLambertMaterial({ color: 0x5ab6d8, emissive: 0x2f7fa4, emissiveIntensity: 0.12 }), ponds);

  } else if (W.deco === 'candle'){
    /* --- おばけのおしろ：ろうそく台・こわれた柱・むらさきの ひ --- */
    var pedestals = [], candles = [], flames = [], rubble = [], pillars = [];
    for (i=0;i<130;i++){
      spot();
      var r2 = rnd();
      if (r2 < 0.40){
        /* ろうそく台 */
        pedestals.push({ x:x, y:0.09, z:z, ry:rnd()*6.28, s:0.9 + rnd()*0.5 });
        var ch = 0.28 + rnd() * 0.22;
        candles.push({ x:x, y:0.18 + ch/2, z:z, s:1, sy:ch/1.0 });
        flames.push({ x:x, y:0.18 + ch + 0.07, z:z, s:0.9 + rnd()*0.4 });
      } else if (r2 < 0.75){
        /* こわれた いしの かけら */
        rubble.push({ x:x, y:0.06, z:z, ry:rnd()*6.28, rz:rnd()*0.5-0.25, s:0.16 + rnd()*0.3 });
      } else {
        /* おれた 柱（低い） */
        var ph2 = 0.35 + rnd() * 0.55;
        pillars.push({ x:x, y:ph2/2, z:z, ry:rnd()*6.28, s:0.9 + rnd()*0.5, sy:ph2/1.0 });
      }
    }
    instMesh(new THREE.CylinderGeometry(0.19, 0.24, 0.18, 8), mat(0x554a8c), pedestals);
    instMesh(new THREE.CylinderGeometry(0.055, 0.065, 1.0, 6), mat(0xfff3dc), candles);
    var flameIM = instMesh(new THREE.ConeGeometry(0.055, 0.16, 6),
      new THREE.MeshBasicMaterial({ color: 0xffc766 }), flames);
    if (flameIM) decoObjs.push({ kind:'flameInst', im:flameIM, base:flames });
    instMesh(new THREE.DodecahedronGeometry(1, 0), mat(0x4a3f72), rubble);
    instMesh(new THREE.CylinderGeometry(0.17, 0.21, 1.0, 7), mat(0x554a8c), pillars);

  } else {
    /* --- ほしぞらのとう：ひかる かけら・ちいさな うかぶ島・ひかりの わ --- */
    var shards = [], isles = [], rings = [], shardBase = [];
    for (i=0;i<130;i++){
      spot();
      var r3 = rnd();
      if (r3 < 0.55){
        /* ひくく うかぶ すいしょう */
        var sy3 = 0.25 + rnd() * 0.6;
        var ss3 = 0.12 + rnd() * 0.2;
        shardBase.push({ x:x, y:sy3, z:z, s:ss3, ph:rnd()*6.28 });
        shards.push({ x:x, y:sy3, z:z, s:ss3, sy:1.9 });
      } else if (r3 < 0.85){
        /* ちいさな うかぶ島 */
        var ir = 0.3 + rnd() * 0.45;
        isles.push({ x:x, y:0.12, z:z, ry:rnd()*6.28, s:ir, sy:0.45 });
      } else {
        /* ひかりの わ */
        rings.push({ x:x, y:0.10, z:z, rx:-Math.PI/2, ry:rnd()*6.28, s:0.30 + rnd()*0.28 });
      }
    }
    var shardIM = instMesh(new THREE.OctahedronGeometry(1, 0), new THREE.MeshLambertMaterial({
      color: 0x9ec4ff, emissive: 0x5f7fe0, emissiveIntensity: 0.5, transparent: true, opacity: 0.9 }), shards);
    if (shardIM) decoObjs.push({ kind:'shardInst', im:shardIM, base:shardBase });
    instMesh(new THREE.SphereGeometry(1, 8, 6, 0, Math.PI*2, 0, Math.PI/2), mat(0x2b3a7a), isles);
    instMesh(new THREE.TorusGeometry(1, 0.10, 6, 18), new THREE.MeshLambertMaterial({
      color: 0x9be8ff, emissive: 0x4fc3f7, emissiveIntensity: 0.5 }), rings);
  }
}

/* ワールドごとの光るかざり（絵文字なし・ジオメトリのみ） */
function buildWorldDeco(W, n, wallH){
  var i, x, y;
  var count = Math.min(26, Math.floor(n*1.4));
  var picks = [];
  var guard = 0;
  while (picks.length < count && guard < count*30){
    guard++;
    x = 1 + ((rnd()*(n-2))|0); y = 1 + ((rnd()*(n-2))|0);
    if (maze[y][x] !== 1) continue;
    picks.push([x,y]);
  }
  if (W.deco === 'bush'){
    /* もり：光るキノコ */
    var capMat = new THREE.MeshLambertMaterial({ color: 0xff8a7a, emissive: 0xff6f5a, emissiveIntensity: 0.45 });
    var stemMat = mat(0xfff0dc);
    for (i=0;i<picks.length;i++){
      var g = new THREE.Group();
      var my = wallH + 0.20;
      g.add(mesh(new THREE.CylinderGeometry(0.05, 0.07, 0.18, 6), stemMat, 0, my + 0.09, 0));
      g.add(mesh(new THREE.SphereGeometry(0.15, 9, 6, 0, Math.PI*2, 0, Math.PI/2), capMat, 0, my + 0.19, 0));
      /* 通路には置かない。かならず生垣の上に生やす（壁に埋まるのも防ぐ） */
      g.position.set(w2(picks[i][0],n) + (rnd()-0.5)*0.34, wallH + 0.13, w2(picks[i][1],n) + (rnd()-0.5)*0.34);
      gWorld.add(g); decoObjs.push({ obj:g, kind:'mushroom', ph: rnd()*6.28 });
    }
  } else if (W.deco === 'candle'){
    /* おしろ：ろうそく */
    var waxMat = mat(0xfff3dc);
    var flameMat = new THREE.MeshBasicMaterial({ color: 0xffc766, transparent: true, opacity: 0.92 });
    for (i=0;i<picks.length;i++){
      var g2 = new THREE.Group();
      g2.add(mesh(new THREE.CylinderGeometry(0.055, 0.065, 0.26, 7), waxMat, 0, wallH + 0.13, 0));
      var fl = mesh(new THREE.ConeGeometry(0.055, 0.15, 6), flameMat, 0, wallH + 0.33, 0);
      g2.add(fl);
      g2.position.set(w2(picks[i][0],n), 0, w2(picks[i][1],n));
      gWorld.add(g2); decoObjs.push({ obj:g2, flame:fl, kind:'candle', ph: rnd()*6.28 });
    }
  } else {
    /* とう：ういている水晶 */
    var cMat = new THREE.MeshLambertMaterial({ color: 0x9ec4ff, emissive: 0x5f7fe0, emissiveIntensity: 0.5, transparent: true, opacity: 0.85 });
    for (i=0;i<picks.length;i++){
      var g3 = new THREE.Group();
      var oc = mesh(new THREE.OctahedronGeometry(0.13, 0), cMat, 0, wallH + 0.42, 0);
      oc.scale.set(1, 1.5, 1);
      g3.add(oc);
      g3.position.set(w2(picks[i][0],n), 0, w2(picks[i][1],n));
      gWorld.add(g3); decoObjs.push({ obj:g3, kind:'crystal', ph: rnd()*6.28, base: wallH + 0.42, node: oc });
    }
  }
}

/* =========================================================
   ゲーム状態
   ========================================================= */
var stageIdx = 0, curStage = STAGES[0], sz = 9;
var maze = [], gates = [], switches = [], stars = [], ghosts = [], warps = [], goal = [1,1];
var openColors = [];
var playing = false;
var gotStars = 0;

/* あいぼうの位置 */
var pgx = 1, pgy = 1, tgx = 1, tgy = 1, moveT = 1, moving = false;
var faceAngle = 0, faceTarget = 0;
var trail = [];
var invUntil = 0, warpLock = 0;
var TUNE = {
  MOVE_TIME: 0.24,             // あいぼうが1マス進む秒数。大きいほどゆっくり
  GHOST_STEP_CASTLE: 1.05,     // おばけのおしろ
  GHOST_STEP_TOWER: 1.15,      // ほしぞらのとう
  DRAG_START_PX: 15,           // ドラッグ開始判定
  DRAG_ANCHOR_MAX_PX: 42,      // 相対ドラッグの基準点最大移動量
  TAP_DEADZONE_PX: 18,         // キャラ直近タップの誤操作防止
};

/* 入力 */
var dirX = 0, dirY = 0;
var tapHold = false;   /* タップで すすみつづけている さいちゅうか */
var pointers = {}, dragId = null, dragAX = 0, dragAY = 0, dragMoved = false;
var zoom = 1, pinchBase = 0, pinchZoom0 = 1;

/* =========================================================
   セル判定
   ========================================================= */
function gateAt(x,y){
  for (var i=0;i<gates.length;i++) if (gates[i].x === x && gates[i].y === y) return gates[i];
  return null;
}
function isWall(x,y){
  if (x < 0 || y < 0 || x >= sz || y >= sz) return true;
  return maze[y][x] === 1;
}
function isBlocked(x,y){
  if (isWall(x,y)) return true;
  var g = gateAt(x,y);
  if (g && openColors.indexOf(g.c) < 0) return true;
  return false;
}
function cellW(x){ return x - sz/2 + 0.5; }

/* =========================================================
   ステージ開始
   ========================================================= */
function startStage(i){
  stageIdx = i;
  curStage = STAGES[i];
  sz = curStage.size;
  rnd = mulberry32(curStage.seed);

  var built = null, tries = 0;
  while (!built && tries < 25){
    tries++;
    maze = genMaze(sz);
    addLoops(maze, sz, Math.max(1, Math.floor(sz/5)));
    var far = farthestCell(maze, sz);
    goal = far.cell;
    if (far.dist < sz){ built = null; continue; }
    var pz = placePuzzle(maze, sz, curStage, goal);
    if (curStage.colors > 0 && pz.gates.length === 0) { built = null; continue; }
    gates = pz.gates; switches = pz.switches;
    var ex = placeExtras(maze, sz, curStage, goal, gates, switches);
    stars = ex.stars; ghosts = ex.ghosts; warps = ex.warps;
    built = true;
  }
  if (!built){
    /* 最終フォールバック：とびら無しの素直なめいろ */
    maze = genMaze(sz);
    goal = farthestCell(maze, sz).cell;
    gates = []; switches = [];
    var ex2 = placeExtras(maze, sz, curStage, goal, gates, switches);
    stars = ex2.stars; ghosts = ex2.ghosts; warps = ex2.warps;
  }

  openColors = [];
  gotStars = 0;
  pgx = 1; pgy = 1; tgx = 1; tgy = 1; moveT = 1; moving = false;
  faceAngle = 0; faceTarget = 0;
  trail = [[1,1]];
  dirX = 0; dirY = 0; tapHold = false;
  invUntil = 0; warpLock = 0;
  ghostTimer = 0;
  zoom = 1;

  buildStage3D();
  updateHUD();
  buildKeyChips();

  showScreen('game');
  $('ov-clear').classList.remove('on');
  $('ov-world').classList.remove('on');
  playing = true;

  initBGM(WORLDS[curStage.w].bgm);

  /* カメラを即座に定位置へ */
  var px = cellW(pgx), pz2 = cellW(pgy);
  camera.position.set(px, 7.8*zoom, pz2 + 6.0*zoom);
  camera.lookAt(px, 0.45, pz2 - 0.5);

  if (stageIdx === 0) showHint('すすみたい ほうこうを タップ！ ドラッグでも うごけるよ', 5600);
  else if (curStage.warps > 0 && stageIdx === 10) showHint('ひかる わっかに のると ワープ！', 4200);
  else if (curStage.ghosts > 0 && stageIdx === 5) showHint('おばけに さわると すこし もどされるよ', 4200);
  else hideHint();

  try {
    if (window.WakuwakuAnalytics){
      WakuwakuAnalytics.startGame({ game_id:'/mahou-meiro', game_name:'まほうのめいろ', game_category:'puzzle' });
      WakuwakuAnalytics.stageStart(i+1);
    }
  } catch(e){}
}

function updateHUD(){
  var W = WORLDS[curStage.w];
  $('h-name').textContent = W.name + ' ' + ((stageIdx % STAGES_PER_WORLD) + 1);
  var html = '';
  for (var i=0;i<3;i++) html += '<span class="' + (i < gotStars ? '' : 'off') + '">⭐</span>';
  $('h-stars').innerHTML = html;
}

function buildKeyChips(){
  var box = $('h-keys'); if (!box) return;
  var used = [];
  for (var i=0;i<gates.length;i++) if (used.indexOf(gates[i].c) < 0) used.push(gates[i].c);
  used.sort();
  var html = '';
  for (var j=0;j<used.length;j++){
    var gc = GATE_COLORS[used[j] % GATE_COLORS.length];
    html += '<div class="keychip' + (openColors.indexOf(used[j]) >= 0 ? ' open' : '') +
            '" data-c="' + used[j] + '" style="background:' + gc.css + '">🔒</div>';
  }
  box.innerHTML = html;
}
function syncKeyChips(){
  var box = $('h-keys'); if (!box) return;
  var chips = box.querySelectorAll('.keychip');
  for (var i=0;i<chips.length;i++){
    var c = parseInt(chips[i].getAttribute('data-c'), 10);
    var open = openColors.indexOf(c) >= 0;
    chips[i].classList.toggle('open', open);
    chips[i].textContent = open ? '🔓' : '🔒';
  }
}

/* =========================================================
   セル到着時の処理
   ========================================================= */
function onArrive(){
  trail.push([pgx, pgy]);
  if (trail.length > 60) trail.shift();
  sfx('step');
}

function collectStar(rec){
  rec.taken = true;
  rec.obj.visible = false;
  gotStars++;
  updateHUD();
  sfx('star');
  showToast('⭐ ほしを ' + gotStars + 'こ ゲット！', 1000);
}

function takeCrystal(rec){
  rec.taken = true;
  rec.obj.visible = false;
  var c = rec.data.c;
  if (openColors.indexOf(c) < 0) openColors.push(c);
  var gc = GATE_COLORS[c % GATE_COLORS.length];
  sfx('crystal');
  setTimeout(function(){ sfx('gate'); }, 180);
  showToast(gc.icon + ' ' + gc.name + 'の とびらが ひらいた！', 1500);
  for (var i=0;i<gateObjs.length;i++){
    if (gateObjs[i].data.c === c && !gateObjs[i].opening){
      gateObjs[i].opening = true;
      gateObjs[i].openT = 0;
    }
  }
  syncKeyChips();
}

function doWarp(pair, fromA){
  var dest = fromA ? pair.b : pair.a;
  warpLock = 0.9;
  sfx('warp');
  flashScreen(0.55);
  pgx = dest.x; pgy = dest.y; tgx = dest.x; tgy = dest.y;
  moveT = 1; moving = false; dirX = 0; dirY = 0; tapHold = false;
  trail.push([pgx,pgy]);
  if (petObj) petObj.position.set(cellW(pgx), 0, cellW(pgy));
  var px = cellW(pgx), pz = cellW(pgy);
  camera.position.set(px, 7.8*zoom, pz + 6.0*zoom);
}

function flashScreen(op){
  var f = $('flash'); if (!f) return;
  f.style.opacity = String(op);
  setTimeout(function(){ f.style.opacity = '0'; }, 60);
}

function ghostHit(){
  if (performance.now() < invUntil) return;
  invUntil = performance.now() + 1400;
  sfx('ghost');
  flashScreen(0.45);
  /* 通ってきた道を すこし もどる。
     スタートまで戻すのは きびしすぎるので、
     安全な場所が見つかるまで 通ってきた道を さかのぼる */
  var back = null;
  for (var s=0; s<30 && trail.length > 1; s++){
    trail.pop();
    var c = trail[trail.length-1];
    if (s < 4) continue;
    if (safeFromGhosts(c[0], c[1])) { back = c; break; }
  }
  if (!back && trail.length) back = trail[trail.length-1];
  if (!back) back = [1,1];
  pgx = back[0]; pgy = back[1]; tgx = pgx; tgy = pgy;
  moveT = 1; moving = false; dirX = 0; dirY = 0; tapHold = false;
  if (petObj) petObj.position.set(cellW(pgx), 0, cellW(pgy));
  showToast('わっ！ ちょっと もどされた〜', 1300);
}
function safeFromGhosts(x, y){
  for (var i=0;i<ghostObjs.length;i++){
    var g = ghostObjs[i].data;
    if (Math.abs(g.x - x) + Math.abs(g.y - y) < 2) return false;
  }
  return true;
}

/* =========================================================
   おばけの移動
   ========================================================= */
var ghostTimer = 0;
function ghostStepInterval(){
  return curStage.w === 1
    ? TUNE.GHOST_STEP_CASTLE
    : TUNE.GHOST_STEP_TOWER;
}
function moveGhosts(){
  var DX = [0,0,-1,1], DY = [-1,1,0,0];
  for (var i=0;i<ghostObjs.length;i++){
    var rec = ghostObjs[i], g = rec.data;
    var opts = [], back = -1;
    for (var d=0;d<4;d++){
      var nx = g.x + DX[d], ny = g.y + DY[d];
      if (isWall(nx, ny)) continue;
      /* スタートのまわりと ゴールには 入らない（はじまってすぐ 押し戻される事故を防ぐ） */
      if (Math.abs(nx - 1) + Math.abs(ny - 1) <= 2) continue;
      if (nx === goal[0] && ny === goal[1]) continue;
      if (nx === rec.px && ny === rec.py) { back = d; continue; }
      opts.push(d);
    }
    if (!opts.length && back >= 0) opts.push(back);
    if (!opts.length) continue;
    var pick = opts[(Math.random()*opts.length)|0];
    rec.px = g.x; rec.py = g.y;
    g.x += DX[pick]; g.y += DY[pick];
    rec.fromX = rec.px; rec.fromY = rec.py;
    rec.t = 0;
  }
}

/* =========================================================
   入力
   ========================================================= */
function setupInput(){
  var cv = $('cv');
  if (!cv) return;
  cv.addEventListener('pointerdown', function(e){
    if (!playing) return;
    pointers[e.pointerId] = { x:e.clientX, y:e.clientY };
    if (Object.keys(pointers).length === 2){
      var ks = Object.keys(pointers);
      var a = pointers[ks[0]], b = pointers[ks[1]];
      pinchBase = Math.hypot(a.x-b.x, a.y-b.y) || 1;
      pinchZoom0 = zoom;
      dragId = null; dirX = 0; dirY = 0;
      return;
    }
    dragId = e.pointerId;
    dragAX = e.clientX; dragAY = e.clientY;
    dragMoved = false;
    try { cv.setPointerCapture(e.pointerId); } catch(err){}
  });
  cv.addEventListener('pointermove', function(e){
    if (!playing) return;
    if (pointers[e.pointerId]) { pointers[e.pointerId].x = e.clientX; pointers[e.pointerId].y = e.clientY; }
    var ids = Object.keys(pointers);
    if (ids.length >= 2){
      var a = pointers[ids[0]], b = pointers[ids[1]];
      var d = Math.hypot(a.x-b.x, a.y-b.y) || 1;
      zoom = Math.max(0.72, Math.min(1.6, pinchZoom0 * (pinchBase / d)));
      return;
    }
    if (e.pointerId !== dragId) return;
    var dx = e.clientX - dragAX, dy = e.clientY - dragAY;
    var dist = Math.hypot(dx, dy);
    if (dist < TUNE.DRAG_START_PX) return;
    dragMoved = true;
    if (Math.abs(dx) > Math.abs(dy)) { dirX = dx > 0 ? 1 : -1; dirY = 0; }
    else                             { dirY = dy > 0 ? 1 : -1; dirX = 0; }
    tapHold = false;
    /* アンカーを追従させて 方向転換を軽くする */
    var maxD = TUNE.DRAG_ANCHOR_MAX_PX;
    if (dist > maxD){
      dragAX = e.clientX - dx / dist * maxD;
      dragAY = e.clientY - dy / dist * maxD;
    }
  });
  function endPointer(e){
    var wasDrag = (e.pointerId === dragId);
    delete pointers[e.pointerId];
    if (!wasDrag) { if (Object.keys(pointers).length < 2) pinchBase = 0; return; }
    dragId = null;
    if (!dragMoved && playing){
      /* ドラッグせずに はなした＝タップ。その ほうがくへ すすみつづける */
      tapMove(e.clientX, e.clientY);
    } else {
      /* ドラッグして いた ばあいは 指を はなしたら とまる */
      dirX = 0; dirY = 0; tapHold = false;
    }
  }
  cv.addEventListener('pointerup', endPointer);
  cv.addEventListener('pointercancel', endPointer);
  cv.addEventListener('pointerleave', function(e){
    if (e.pointerId === dragId){ dragId = null; dirX = 0; dirY = 0; delete pointers[e.pointerId]; }
  });
  cv.addEventListener('contextmenu', function(e){ e.preventDefault(); });

  /* キーボード（PC） */
  window.addEventListener('keydown', function(e){
    if (!playing) return;
    var k = e.key;
    if (k === 'ArrowUp' || k === 'w'){ dirX = 0; dirY = -1; tapHold = false; }
    else if (k === 'ArrowDown' || k === 's'){ dirX = 0; dirY = 1; tapHold = false; }
    else if (k === 'ArrowLeft' || k === 'a'){ dirX = -1; dirY = 0; tapHold = false; }
    else if (k === 'ArrowRight' || k === 'd'){ dirX = 1; dirY = 0; tapHold = false; }
    else return;
    e.preventDefault();
  });
  window.addEventListener('keyup', function(e){
    var k = e.key;
    if (['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','w','a','s','d'].indexOf(k) >= 0){ dirX = 0; dirY = 0; tapHold = false; }
  });
}

/* タップした「ほうがく」へ すすむ
   ・あいぼうの 画面上の いちから 見て、タップされた 向きを しらべる
   ・たて／よこの うち ずれの 大きい ほうを えらび、その むきへ すすみつづける
   ・かべに ぶつかったら とまる（じどうで 道を たどることは しない） */
var _projV = null;
function tapMove(cx, cy){
  if (!camera || !petObj) return;
  if (!_projV) _projV = new THREE.Vector3();
  /* あいぼうの あたまの あたりを 画面座標に なおす */
  _projV.set(petObj.position.x, 0.45, petObj.position.z);
  _projV.project(camera);
  var px = (_projV.x * 0.5 + 0.5) * window.innerWidth;
  var py = (1 - (_projV.y * 0.5 + 0.5)) * window.innerHeight;

  var dx = cx - px, dy = cy - py;
  /* あいぼうの すぐ上を タップしたときは 反応させない（誤操作ぼうし） */
  if (Math.abs(dx) < TUNE.TAP_DEADZONE_PX && Math.abs(dy) < TUNE.TAP_DEADZONE_PX) return;

  if (Math.abs(dx) > Math.abs(dy)) { dirX = dx > 0 ? 1 : -1; dirY = 0; }
  else                             { dirY = dy > 0 ? 1 : -1; dirX = 0; }
  tapHold = true;
  sfx('tap');
}

/* =========================================================
   1マス すすむ
   ========================================================= */
function tryStep(){
  if (moving) return;
  var nx = pgx, ny = pgy, has = false;
  if (dirX || dirY){
    var cx = pgx + dirX, cy = pgy + dirY;
    if (!isBlocked(cx, cy)) { nx = cx; ny = cy; has = true; }
    else if (tapHold) { dirX = 0; dirY = 0; tapHold = false; }  /* かべに ぶつかったら とまる */
  }
  if (!has) return;
  tgx = nx; tgy = ny;
  moveT = 0; moving = true;
  faceTarget = Math.atan2(nx - pgx, ny - pgy);
}

/* =========================================================
   メインループ
   ========================================================= */
var lastT = 0, animT = 0, _dummy = null;
function loop(now){
  requestAnimationFrame(loop);
  if (!gl3dReady) return;
  var dt = Math.max(0, Math.min(0.1, (now - lastT) / 1000));
  lastT = now;
  animT += dt;

  if (playing) updateGame(dt);
  if (curScreen !== 'game') return;   /* メニュー中は描かない（電池のむだ） */
  updateVisuals(dt);
  renderer.render(scene, camera);
}

function updateGame(dt){
  if (warpLock > 0) warpLock -= dt;

  /* あいぼうの移動 */
  if (moving){
    moveT += dt / TUNE.MOVE_TIME;
    if (moveT >= 1){
      moveT = 1; moving = false;
      pgx = tgx; pgy = tgy;
      onArrive();
      checkCell();
      if (!playing) return;
      tryStep();
    }
  } else {
    tryStep();
  }

  /* おばけ */
  if (ghostObjs.length){
    ghostTimer += dt;
    var iv = ghostStepInterval();
    if (ghostTimer >= iv){ ghostTimer -= iv; moveGhosts(); }
    for (var i=0;i<ghostObjs.length;i++){
      var rec = ghostObjs[i];
      if (rec.t === undefined) rec.t = 1;
      rec.t = Math.min(1, rec.t + dt / iv);
    }
  }

  /* おばけとの あたり判定（ワールド座標） */
  if (petObj && performance.now() >= invUntil){
    for (var j=0;j<ghostObjs.length;j++){
      var go = ghostObjs[j].obj;
      var ddx = go.position.x - petObj.position.x;
      var ddz = go.position.z - petObj.position.z;
      if (ddx*ddx + ddz*ddz < 0.34){ ghostHit(); break; }
    }
  }
}

/* いま立っているマスの判定 */
function checkCell(){
  var i;
  for (i=0;i<starObjs.length;i++){
    var s = starObjs[i];
    if (!s.taken && s.data.x === pgx && s.data.y === pgy) collectStar(s);
  }
  for (i=0;i<crystalObjs.length;i++){
    var c = crystalObjs[i];
    if (!c.taken && c.data.x === pgx && c.data.y === pgy) takeCrystal(c);
  }
  if (warpLock <= 0){
    for (i=0;i<warpObjs.length;i++){
      var p = warpObjs[i].data;
      if (p.a.x === pgx && p.a.y === pgy) { doWarp(p, true); return; }
      if (p.b.x === pgx && p.b.y === pgy) { doWarp(p, false); return; }
    }
  }
  if (pgx === goal[0] && pgy === goal[1]) stageClear();
}

/* =========================================================
   みため更新
   ========================================================= */
function updateVisuals(dt){
  var i;
  /* あいぼう */
  if (petObj){
    var fx = cellW(pgx) + (cellW(tgx) - cellW(pgx)) * moveT;
    var fz = cellW(pgy) + (cellW(tgy) - cellW(pgy)) * moveT;
    petObj.position.x = fx;
    petObj.position.z = fz;
    petObj.position.y = moving ? Math.abs(Math.sin(moveT * Math.PI)) * 0.09 : 0;
    /* むき */
    var da = faceTarget - faceAngle;
    while (da > Math.PI) da -= Math.PI*2;
    while (da < -Math.PI) da += Math.PI*2;
    faceAngle += da * Math.min(1, dt * 14);
    petObj.rotation.y = faceAngle;
    /* あし・しっぽ */
    var ud = petObj.userData;
    if (ud.feet){
      var sw = moving ? Math.sin(animT * 22) * 0.055 : 0;
      ud.feet[0].position.z = 0.10 + sw; ud.feet[3].position.z = -0.10 + sw;
      ud.feet[1].position.z = 0.10 - sw; ud.feet[2].position.z = -0.10 - sw;
    }
    if (ud.tail) ud.tail.position.y = 0.30 + Math.sin(animT * 6) * 0.02;
    if (ud.head) ud.head.rotation.z = Math.sin(animT * 5) * 0.035;
    /* 点滅（むてき中） */
    var inv = performance.now() < invUntil;
    petObj.visible = inv ? (Math.floor(animT * 14) % 2 === 0) : true;

    /* あかり */
    if (playerLight) playerLight.position.set(fx, 1.6, fz);

    /* カメラ追従 */
    var camY = 7.8 * zoom, camZ = 6.0 * zoom;
    var k = 1 - Math.exp(-dt * 7.5);
    camera.position.x += (fx - camera.position.x) * k;
    camera.position.y += (camY - camera.position.y) * k;
    camera.position.z += (fz + camZ - camera.position.z) * k;
    camera.lookAt(fx, 0.45, fz - 0.5);

    if (dirLight){
      dirLight.position.set(fx + 6, 13, fz + 5);
      dirLight.target.position.set(fx, 0, fz);
      dirLight.target.updateMatrixWorld();
    }
  }

  /* ようせい */
  if (fairyObj){
    var u = fairyObj.userData;
    fairyObj.position.y = Math.sin(animT * 1.9) * 0.12;
    if (u.core) u.core.rotation.y += dt * 1.2;
    if (u.halo){
      var s = 1 + Math.sin(animT * 2.6) * 0.12;
      u.halo.scale.set(s, s, s);
    }
    if (u.wings){
      u.wings[0].rotation.y = 0.55 + Math.sin(animT * 18) * 0.45;
      u.wings[1].rotation.y = -0.55 - Math.sin(animT * 18) * 0.45;
    }
    if (u.sparks){
      for (var sk=0; sk<u.sparks.length; sk++){
        var ang = animT * 1.6 + sk * Math.PI/2;
        u.sparks[sk].position.set(Math.cos(ang) * 0.42, 0.66 + Math.sin(animT*2.2 + sk) * 0.14, Math.sin(ang) * 0.42);
        u.sparks[sk].rotation.y += dt * 2.4;
      }
    }
    if (u.ring) u.ring.rotation.z += dt * 0.8;
  }

  /* ほし */
  for (i=0;i<starObjs.length;i++){
    if (starObjs[i].taken) continue;
    var so = starObjs[i].obj;
    so.rotation.y += dt * 1.6;
    so.position.y = Math.sin(animT * 2.4 + i) * 0.09;
  }

  /* クリスタル */
  for (i=0;i<crystalObjs.length;i++){
    if (crystalObjs[i].taken) continue;
    var co = crystalObjs[i].obj;
    if (co.userData.body){
      co.userData.body.rotation.y += dt * 1.1;
      co.userData.body.position.y = 0.52 + Math.sin(animT * 2.2 + i) * 0.06;
    }
    if (co.userData.glow){
      var gs = 1 + Math.sin(animT * 3 + i) * 0.15;
      co.userData.glow.scale.set(gs, gs, gs);
    }
  }

  /* とびら（あいたら しずんで きえる） */
  for (i=0;i<gateObjs.length;i++){
    var g = gateObjs[i];
    if (!g.opening) continue;
    if (g.openT === undefined) g.openT = 0;
    if (g.openT >= 1) continue;
    g.openT = Math.min(1, g.openT + dt * 1.6);
    var e = g.openT;
    var d = g.obj.userData.door;
    if (d){
      d.position.y = (g.obj.userData.h/2) * (1 - e * 0.96);
      d.scale.y = Math.max(0.04, 1 - e);
      if (d.material) { d.material.transparent = true; d.material.opacity = Math.max(0, 0.95 - e); }
    }
    if (g.obj.userData.lock) g.obj.userData.lock.visible = e < 0.5;
    if (g.openT >= 1 && d) d.visible = false;
  }

  /* ワープ */
  for (i=0;i<warpObjs.length;i++){
    var wp = warpObjs[i];
    [wp.objA, wp.objB].forEach(function(o){
      if (o.userData.ring) o.userData.ring.rotation.z += dt * 1.9;
      if (o.userData.disc){
        var ds = 1 + Math.sin(animT * 3.4) * 0.16;
        o.userData.disc.scale.set(ds, ds, 1);
      }
    });
  }

  /* おばけ */
  for (i=0;i<ghostObjs.length;i++){
    var rec = ghostObjs[i];
    var gd = rec.data;
    var t = (rec.t === undefined) ? 1 : rec.t;
    var fx2 = (rec.fromX === undefined) ? gd.x : rec.fromX;
    var fy2 = (rec.fromY === undefined) ? gd.y : rec.fromY;
    rec.obj.position.x = cellW(fx2) + (cellW(gd.x) - cellW(fx2)) * t;
    rec.obj.position.z = cellW(fy2) + (cellW(gd.y) - cellW(fy2)) * t;
    rec.obj.position.y = Math.sin(animT * 2.6 + i) * 0.09;
    rec.obj.rotation.y = Math.sin(animT * 1.4 + i) * 0.5;
    if (rec.obj.userData.body){
      var bs = 1 + Math.sin(animT * 3.2 + i) * 0.06;
      rec.obj.userData.body.scale.set(bs, 1.15 / bs, bs);
    }
  }

  /* かざり */
  for (i=0;i<decoObjs.length;i++){
    var dd = decoObjs[i];
    if (dd.kind === 'candle' && dd.flame){
      var fs = 1 + Math.sin(animT * 9 + dd.ph) * 0.22;
      dd.flame.scale.set(1, fs, 1);
    } else if (dd.kind === 'crystal' && dd.node){
      dd.node.position.y = dd.base + Math.sin(animT * 1.6 + dd.ph) * 0.16;
      dd.node.rotation.y += dt * 0.6;
    } else if (dd.kind === 'mushroom'){
      dd.obj.rotation.y += dt * 0.25;
    } else if (dd.kind === 'shardInst'){
      /* うかぶ すいしょうが ゆっくり 上下して まわる */
      if (!_dummy) _dummy = new THREE.Object3D();
      for (var k=0;k<dd.base.length;k++){
        var bs = dd.base[k];
        _dummy.position.set(bs.x, bs.y + Math.sin(animT * 0.8 + bs.ph) * 0.13, bs.z);
        _dummy.rotation.set(0, animT * 0.5 + bs.ph, 0);
        _dummy.scale.set(bs.s, bs.s * 1.9, bs.s);
        _dummy.updateMatrix();
        dd.im.setMatrixAt(k, _dummy.matrix);
      }
      dd.im.instanceMatrix.needsUpdate = true;
    } else if (dd.kind === 'flameInst'){
      /* ろうそくの ほのおが ゆれる */
      if (!_dummy) _dummy = new THREE.Object3D();
      for (var q=0;q<dd.base.length;q++){
        var fb = dd.base[q];
        var fs2 = fb.s * (0.85 + Math.sin(animT * 8 + q) * 0.2);
        _dummy.position.set(fb.x, fb.y, fb.z);
        _dummy.rotation.set(0, 0, 0);
        _dummy.scale.set(fb.s, fs2, fb.s);
        _dummy.updateMatrix();
        dd.im.setMatrixAt(q, _dummy.matrix);
      }
      dd.im.instanceMatrix.needsUpdate = true;
    }
  }
}

/* =========================================================
   クリア処理
   ========================================================= */
function stageClear(){
  if (!playing) return;
  playing = false;
  dirX = 0; dirY = 0; tapHold = false;
  hideHint();
  sfx('clear');

  var prev = stageStars(stageIdx);
  if (gotStars > prev) save.stars[stageKey(stageIdx)] = gotStars;
  var isNewFairy = !save.fairies['f' + stageIdx];
  save.fairies['f' + stageIdx] = 1;
  persist();

  try {
    if (window.WakuwakuAnalytics){
      var an = { game_id:'/mahou-meiro', game_name:'まほうのめいろ', game_category:'puzzle',
                 stage_id: stageIdx+1, stars: gotStars, result:'complete' };
      WakuwakuAnalytics.stageComplete(an);
      if (stageIdx >= STAGES.length - 1) WakuwakuAnalytics.gameComplete(an);
    }
  } catch(e){}

  var f = FAIRIES[stageIdx];
  $('cl-h').textContent = 'ステージ ' + ((stageIdx % STAGES_PER_WORLD) + 1) + ' クリア！';
  $('cl-fairy').textContent = f.icon;
  $('cl-fname').textContent = f.name + 'の ようせいを たすけた！' + (isNewFairy ? ' 🎉' : '');
  var sh = '';
  for (var i=0;i<3;i++) sh += '<span class="' + (i < gotStars ? '' : 'off') + '">★</span>';
  $('cl-stars').innerHTML = sh;
  setTimeout(function(){
    var sp = $('cl-stars').querySelectorAll('span');
    for (var k=0;k<sp.length;k++){
      if (sp[k].className === 'off') continue;
      (function(el, d){ setTimeout(function(){ el.classList.add('on'); sfx('star'); }, d); })(sp[k], k*230);
    }
  }, 260);
  var msg;
  if (gotStars === 3) msg = 'ほし ぜんぶ ゲット！ かんぺき！';
  else if (gotStars === 2) msg = 'あと 1こで ほし ぜんぶ だよ！';
  else if (gotStars === 1) msg = 'ほしは ぜんぶで 3こ かくれているよ';
  else msg = 'ほしを さがしながら いくと もっと たのしいよ！';
  $('cl-msg').textContent = msg;

  var last = (stageIdx % STAGES_PER_WORLD) === STAGES_PER_WORLD - 1;
  var nb = $('cl-next');
  if (stageIdx >= STAGES.length - 1){ nb.textContent = '🏆 ぜんぶ クリア！'; }
  else if (last){ nb.textContent = 'つぎの せかいへ ▶'; }
  else { nb.textContent = 'つぎへ ▶'; }

  setTimeout(function(){ $('ov-clear').classList.add('on'); }, 420);
}

function goNext(){
  $('ov-clear').classList.remove('on');
  var last = (stageIdx % STAGES_PER_WORLD) === STAGES_PER_WORLD - 1;
  if (stageIdx >= STAGES.length - 1){
    sfx('fanfare');
    $('wc-h').textContent = 'ぜんぶ クリア！';
    $('wc-icon').textContent = '🏆';
    $('wc-msg').innerHTML = 'ようせいを ' + fairyCount() + ' たい たすけたよ！<br>ほんとうに すごい！';
    $('wc-ok').textContent = 'ちずへ もどる';
    $('ov-world').classList.add('on');
    return;
  }
  if (last){
    sfx('fanfare');
    var wIdx = curStage.w;
    $('wc-h').textContent = WORLDS[wIdx].name + ' クリア！';
    $('wc-icon').textContent = WORLDS[wIdx + 1] ? WORLDS[wIdx + 1].icon : '🏆';
    $('wc-msg').innerHTML = 'つぎは「' + (WORLDS[wIdx+1] ? WORLDS[wIdx+1].name : '') + '」だよ！';
    $('wc-ok').textContent = 'つぎの せかいへ ▶';
    $('ov-world').classList.add('on');
    return;
  }
  startStage(stageIdx + 1);
}

function toMap(){
  playing = false;
  $('ov-clear').classList.remove('on');
  $('ov-world').classList.remove('on');
  hideHint();
  viewWorld = curStage.w;
  buildWorldMap();
  showScreen('worldmap');
  initBGM(MENU_TRACK);
}


/* =========================================================
   ボタン配線
   ========================================================= */
function on(id, fn){
  var el = $(id);
  if (el) el.addEventListener('click', fn);
}

/* --- タイトル --- */
on('t-start', function(){
  sfx('tap');
  initBGM(MENU_TRACK);
  buildCharGrid();
  showScreen('charsel');
});
on('t-zukan', function(){
  sfx('tap'); zukanFrom = 'title'; buildZukan(); showScreen('zukan');
});
on('t-bgm', function(){ toggleBGM(); });

/* --- キャラ選択 --- */
on('c-back', function(){ sfx('tap'); showScreen('title'); });
on('c-go', function(){
  sfx('tap');
  save.char = selChar; persist();
  /* まだ遊んだことがなければ 最初のステージへ直行 */
  var anyCleared = false;
  for (var i=0;i<STAGES.length;i++) if (isCleared(i)) { anyCleared = true; break; }
  if (!anyCleared){ startStage(0); return; }
  viewWorld = 0;
  for (var w=WORLDS.length-1; w>=0; w--) if (worldUnlocked(w)) { viewWorld = w; break; }
  buildWorldMap();
  showScreen('worldmap');
});

/* --- ワールドマップ --- */
on('w-back', function(){ sfx('tap'); showScreen('title'); });
on('w-zukan', function(){ sfx('tap'); zukanFrom = 'worldmap'; buildZukan(); showScreen('zukan'); });
on('w-char', function(){ sfx('tap'); buildCharGrid(); showScreen('charsel'); });

/* --- 図鑑 --- */
on('z-back', function(){
  sfx('tap');
  if (zukanFrom === 'worldmap'){ buildWorldMap(); showScreen('worldmap'); }
  else showScreen('title');
});

/* --- ゲーム中 --- */
on('back-btn', function(){ sfx('tap'); toMap(); });
on('ui-bgm-btn', function(){ toggleBGM(); });

/* --- クリア --- */
on('cl-next', function(){ sfx('tap'); goNext(); });
on('cl-retry', function(){ sfx('tap'); $('ov-clear').classList.remove('on'); startStage(stageIdx); });
on('cl-map', function(){ sfx('tap'); toMap(); });
on('wc-ok', function(){
  sfx('tap');
  $('ov-world').classList.remove('on');
  if (stageIdx >= STAGES.length - 1){ toMap(); return; }
  startStage(stageIdx + 1);
});

/* =========================================================
   起動
   ========================================================= */
function boot(){
  var ok = false;
  try { ok = init3D(); } catch(e) { ok = false; }
  if (!ok){
    $('loading').classList.add('off');
    $('fallback').style.display = 'flex';
    return;
  }
  setupInput();
  showScreen('title');
  syncBgmBtn();
  buildCharGrid();
  buildWorldMap();
  buildZukan();
  $('loading').classList.add('off');
  lastT = performance.now();
  requestAnimationFrame(loop);
}

window.addEventListener('resize', onResize);
window.addEventListener('orientationchange', function(){ setTimeout(onResize, 250); });
document.addEventListener('visibilitychange', function(){
  if (document.hidden){ dirX = 0; dirY = 0; tapHold = false; }
  else lastT = performance.now();
});

/* 最初のタップで オーディオを起こす */
(function(){
  function wake(){
    ac();
    if (!_bgm) initBGM(MENU_TRACK);
    window.removeEventListener('pointerdown', wake);
    window.removeEventListener('touchstart', wake);
  }
  window.addEventListener('pointerdown', wake, { passive:true });
  window.addEventListener('touchstart', wake, { passive:true });
})();

if (typeof THREE === 'undefined'){
  $('loading').classList.add('off');
  $('fallback').style.display = 'flex';
} else {
  boot();
}
</script>
</body>
</html>
