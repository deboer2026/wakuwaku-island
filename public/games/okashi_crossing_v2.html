<!DOCTYPE html>
<html lang="ja">
<head>
<script src="/games/wakuwaku_ui.js"></script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>ぴょんぴょん！おかしのくに 3D</title>
<script src="/games/wakuwaku_bgm.js"></script>
<script src="/games/safe_area.js"></script>
<link href="https://fonts.googleapis.com/css2?family=DotGothic16&family=M+PLUS+Rounded+1c:wght@700;800;900&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none;}
html,body{width:100%;height:100%;overflow:hidden;font-family:'M PLUS Rounded 1c',sans-serif;touch-action:none;}
body{background:linear-gradient(180deg,#ffd9ec 0%,#ffe9f4 60%,#fff4e0 100%);transition:background .8s;}
body.sky-cookie{background:linear-gradient(180deg,#9fdcf5 0%,#ffe7c4 68%,#ffd9a8 100%);}
body.sky-choco{background:linear-gradient(180deg,#c9a3e8 0%,#ffc9e2 60%,#ffe2c9 100%);}
body.sky-ice{background:linear-gradient(180deg,#8fc7f0 0%,#d8ecff 62%,#fdf3ff 100%);}
#wrap{position:fixed;inset:0;overflow:hidden;}
canvas{display:block;width:100%;height:100%;touch-action:none;}

/* ============ 共通パーツ ============ */
.btn{font-family:'M PLUS Rounded 1c';font-weight:900;color:#fff;background:linear-gradient(#ff8ec0,#e0559a);border:none;border-radius:24px;padding:13px 34px;font-size:20px;cursor:pointer;box-shadow:0 5px 0 #b03a76,0 8px 14px rgba(176,58,118,.28);letter-spacing:.04em;}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 #b03a76;}
.btn.sub{background:linear-gradient(#ffd27a,#f5a93c);box-shadow:0 5px 0 #c07d1c,0 8px 14px rgba(192,125,28,.24);}
.btn.sub:active{box-shadow:0 1px 0 #c07d1c;}
.btn.ghost{background:rgba(255,255,255,.9);color:#a3457c;box-shadow:0 4px 0 rgba(163,69,124,.3);}
.btn.ghost:active{box-shadow:0 1px 0 rgba(163,69,124,.3);}
.btn[disabled]{filter:grayscale(.75);opacity:.6;box-shadow:0 4px 0 #999;}
.pill{background:rgba(255,255,255,.9);border:3px solid #ff9ecb;border-radius:20px;padding:3px 14px;font-family:'DotGothic16',monospace;font-size:19px;color:#a3457c;box-shadow:0 3px 0 rgba(163,69,124,.2);white-space:nowrap;}
.hidden{display:none!important;}

/* ============ 画面 ============ */
.screen{position:fixed;inset:0;z-index:20;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:calc(18px + var(--sat,0px)) 18px calc(18px + var(--sab,0px));text-align:center;}
.screen.pane{background:rgba(255,226,241,.9);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);overflow-y:auto;}

/* --- タイトル --- */
#scr-title{background:transparent;justify-content:flex-start;padding-top:calc(6vh + var(--sat,0px));pointer-events:none;}
#scr-title>*{pointer-events:auto;}
.logo{position:relative;font-family:'DotGothic16',monospace;line-height:1.18;color:#e0559a;
  text-shadow:-3px -3px 0 #fff,3px -3px 0 #fff,-3px 3px 0 #fff,3px 3px 0 #fff,0 -4px 0 #fff,0 4px 0 #fff,-4px 0 0 #fff,4px 0 0 #fff,6px 9px 0 rgba(224,85,154,.32);
  animation:wob 2.8s ease-in-out infinite;}
.logo .l1{display:block;font-size:min(9.5vw,42px);}
.logo .l2{display:block;font-size:min(13.5vw,60px);color:#ff7fb8;}
@keyframes wob{0%,100%{transform:rotate(-1.6deg) scale(1)}50%{transform:rotate(1.6deg) scale(1.045)}}
.ribbon{background:#e0559a;color:#fff;font-weight:900;font-size:13px;letter-spacing:3px;padding:5px 24px;border-radius:15px;box-shadow:0 3px 0 #b03a76;}
.tspacer{flex:1;min-height:8px;}
.tfoot{display:flex;flex-direction:column;align-items:center;gap:12px;padding-bottom:6px;}
.hsline{font-family:'DotGothic16',monospace;font-size:17px;color:#a3457c;background:rgba(255,255,255,.75);border-radius:12px;padding:4px 16px;min-height:26px;}
.tsub{display:flex;gap:10px;}
.tsub .btn{font-size:15px;padding:9px 18px;border-radius:18px;}

/* --- ワールド選択 / ステージ選択 --- */
.head{font-family:'DotGothic16',monospace;font-size:min(7.6vw,32px);color:#c13d7e;text-shadow:2px 2px 0 #fff,4px 4px 0 rgba(193,61,126,.18);}
.lead{font-weight:800;font-size:14.5px;color:#a3457c;line-height:1.7;}
.worlds{display:flex;flex-direction:column;gap:12px;width:min(100%,430px);}
.wcard{position:relative;display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:22px;border:4px solid #fff;box-shadow:0 6px 0 rgba(163,69,124,.22),0 10px 18px rgba(163,69,124,.16);cursor:pointer;text-align:left;overflow:hidden;}
.wcard:active{transform:translateY(3px);box-shadow:0 3px 0 rgba(163,69,124,.22);}
.wcard .wico{width:58px;height:58px;flex:0 0 58px;border-radius:16px;background:rgba(255,255,255,.85);display:flex;align-items:center;justify-content:center;box-shadow:inset 0 -3px 0 rgba(0,0,0,.06);}
.wcard .wico svg{width:44px;height:44px;}
.wcard .wtx{flex:1;min-width:0;}
.wcard .wnm{font-family:'DotGothic16',monospace;font-size:20px;color:#5b2b45;line-height:1.25;}
.wcard .wds{font-weight:800;font-size:12.5px;color:#7b4462;opacity:.9;margin-top:2px;}
.wcard .wpr{margin-top:5px;font-family:'DotGothic16',monospace;font-size:15px;color:#b8437f;}
.wcard.lock{filter:grayscale(.72);opacity:.72;}
.wcard .lockbadge{position:absolute;right:12px;top:50%;transform:translateY(-50%);font-size:13px;font-weight:900;color:#6b4a5c;background:rgba(255,255,255,.9);border-radius:12px;padding:5px 10px;line-height:1.35;}

.stages{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;width:min(100%,410px);}
.scard{position:relative;aspect-ratio:1/1.18;border-radius:18px;border:4px solid #fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;cursor:pointer;box-shadow:0 5px 0 rgba(163,69,124,.22);}
.scard:active{transform:translateY(3px);box-shadow:0 2px 0 rgba(163,69,124,.22);}
.scard .snum{font-family:'DotGothic16',monospace;font-size:min(7vw,26px);color:#fff;text-shadow:0 2px 0 rgba(0,0,0,.18);}
.scard .sstar{display:flex;gap:1px;}
.scard .sstar svg{width:13px;height:13px;}
.scard.lock{filter:grayscale(.8);opacity:.6;}
.scard .lk{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;}
.scard .lk svg{width:26px;height:26px;opacity:.9;}

/* --- キャラ選択 --- */
.charrow{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;width:min(100%,430px);}
.ccard{position:relative;width:82px;padding:8px 4px 9px;border-radius:18px;border:4px solid #fff;background:rgba(255,255,255,.86);box-shadow:0 5px 0 rgba(163,69,124,.2);cursor:pointer;}
.ccard:active{transform:translateY(3px);box-shadow:0 2px 0 rgba(163,69,124,.2);}
.ccard.on{border-color:#ffd65b;box-shadow:0 5px 0 #d8a01e,0 0 0 4px rgba(255,214,91,.4);}
.ccard.lock{filter:grayscale(.8);opacity:.62;}
.ccard svg{width:52px;height:52px;display:block;margin:0 auto;}
.ccard .cnm{font-family:'DotGothic16',monospace;font-size:13px;color:#7b4462;margin-top:2px;}
.ccard .clk{font-size:10.5px;font-weight:900;color:#6b4a5c;margin-top:1px;line-height:1.25;}

/* --- プレイHUD --- */
#hud{position:fixed;inset:0;z-index:6;pointer-events:none;}
#hud-top{position:absolute;top:calc(62px + var(--sat,0px));left:0;right:0;display:flex;justify-content:center;gap:9px;flex-wrap:wrap;padding:0 calc(64px + var(--sar,0px)) 0 calc(112px + var(--sal,0px));}
#hud-goal{position:absolute;left:50%;transform:translateX(-50%);top:calc(104px + var(--sat,0px));width:min(62vw,260px);height:13px;border-radius:9px;background:rgba(255,255,255,.72);border:3px solid #ff9ecb;overflow:hidden;box-shadow:0 3px 0 rgba(163,69,124,.18);}
#hud-goal i{display:block;height:100%;width:0%;background:linear-gradient(90deg,#ffd65b,#ff8ec0);transition:width .18s ease-out;}
#tapguide{position:absolute;inset:0;pointer-events:none;opacity:0;transition:opacity .35s;}
#tapguide.on{opacity:1;}
#tapguide b{position:absolute;transform:translate(-50%,-50%);font-size:min(8vw,30px);line-height:1;color:#fff;text-shadow:0 0 0 #e0559a,-2px -2px 0 #e0559a,2px -2px 0 #e0559a,-2px 2px 0 #e0559a,2px 2px 0 #e0559a,0 4px 8px rgba(120,40,90,.55);animation:tgp 1.5s ease-in-out infinite;}
#tapguide b.d2{animation-delay:.18s}#tapguide b.d3{animation-delay:.36s}#tapguide b.d4{animation-delay:.54s}
@keyframes tgp{0%,100%{opacity:.5;transform:translate(-50%,-50%) scale(.86)}50%{opacity:1;transform:translate(-50%,-50%) scale(1.14)}}
#hint{position:absolute;bottom:calc(16px + var(--sab,0px));left:0;right:0;text-align:center;color:#fff;font-weight:900;font-size:14.5px;text-shadow:0 2px 4px rgba(120,40,90,.7);opacity:.96;padding:0 20px;}
#toast{position:absolute;left:50%;top:34%;transform:translate(-50%,-50%) scale(.6);opacity:0;font-family:'DotGothic16',monospace;font-size:min(9vw,38px);color:#fff;text-shadow:0 0 0 #e0559a,-3px -3px 0 #e0559a,3px -3px 0 #e0559a,-3px 3px 0 #e0559a,3px 3px 0 #e0559a,0 7px 0 rgba(176,58,118,.4);white-space:nowrap;}
#toast.show{animation:pop 1.05s ease-out forwards;}
@keyframes pop{0%{opacity:0;transform:translate(-50%,-50%) scale(.55)}22%{opacity:1;transform:translate(-50%,-50%) scale(1.14)}38%{transform:translate(-50%,-50%) scale(1)}80%{opacity:1}100%{opacity:0;transform:translate(-50%,-58%) scale(1)}}
@media (min-width:700px){#hud-top{top:calc(10px + var(--sat,0px));}#hud-goal{top:calc(52px + var(--sat,0px));}}

/* --- リザルト --- */
.rbox{background:rgba(255,255,255,.95);border:5px solid #ffb0d3;border-radius:26px;padding:18px 24px;box-shadow:0 8px 0 rgba(163,69,124,.22);width:min(100%,390px);}
.rstars{display:flex;justify-content:center;gap:8px;margin:4px 0 10px;}
.rstars svg{width:min(15vw,58px);height:min(15vw,58px);}
.rstars .st{transform:scale(0);animation:starpop .45s cubic-bezier(.2,1.6,.5,1) forwards;}
.rstars .st:nth-child(2){animation-delay:.18s}
.rstars .st:nth-child(3){animation-delay:.36s}
@keyframes starpop{to{transform:scale(1)}}
.rline{font-family:'DotGothic16',monospace;font-size:18px;color:#a3457c;line-height:1.9;}
.rline b{color:#e0559a;font-size:22px;}
.rbtns{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin-top:6px;}
.rbtns .btn{font-size:16px;padding:11px 20px;border-radius:20px;}
.unlockmsg{margin-top:8px;font-weight:900;font-size:14px;color:#c1701d;background:#fff6db;border:3px solid #ffd98a;border-radius:14px;padding:7px 12px;line-height:1.6;}

/* --- ボタン群 --- */
#back-btn{position:fixed;top:calc(10px + var(--sat,0px));left:calc(10px + var(--sal,0px));z-index:30;background:rgba(255,255,255,.92);border:3px solid #ff9ecb;border-radius:16px;padding:6px 12px;font-family:'M PLUS Rounded 1c';font-weight:900;font-size:15px;color:#a3457c;cursor:pointer;}
#bgm-btn{position:fixed;top:calc(10px + var(--sat,0px));right:calc(10px + var(--sar,0px));z-index:30;background:rgba(255,255,255,.92);border:3px solid #ff9ecb;border-radius:16px;width:44px;height:38px;font-size:17px;color:#a3457c;cursor:pointer;display:flex;align-items:center;justify-content:center;}

/* --- WebGL フォールバック --- */
#nogl{position:fixed;inset:0;z-index:99;display:none;flex-direction:column;align-items:center;justify-content:center;gap:14px;background:#ffe2f1;padding:24px;text-align:center;}
#nogl p{font-weight:800;color:#a3457c;line-height:1.9;font-size:15px;}

@media (max-height:520px){
  .logo .l1{font-size:min(7vw,30px)}.logo .l2{font-size:min(10vw,42px)}
  .screen{gap:9px}
  .stages{grid-template-columns:repeat(6,minmax(0,1fr));max-width:520px}
  .wcard .wico{width:46px;height:46px;flex:0 0 46px}
  .wcard .wico svg{width:34px;height:34px}
}
</style>
</head>
<body>
<div id="wrap"><canvas id="cv"></canvas></div>

<button id="back-btn" type="button">🏠 もどる</button>
<button id="bgm-btn" type="button" aria-label="おと">🔊</button>

<!-- ================= HUD ================= -->
<div id="hud" class="hidden">
  <div id="hud-top">
    <div class="pill" id="hud-stage">1-1</div>
    <div class="pill" id="hud-candy">🍬 0/0</div>
    <div class="pill" id="hud-dist">0m</div>
  </div>
  <div id="hud-goal"><i></i></div>
  <div id="tapguide"><b id="tg-u">▲</b><b id="tg-r" class="d2">▶</b><b id="tg-l" class="d3">◀</b><b id="tg-d" class="d4">▼</b></div>
  <div id="toast"></div>
  <div id="hint">いきたい ほうこうを タップ！ うえを タップで まえに ぴょん</div>
</div>

<!-- ================= タイトル ================= -->
<div class="screen" id="scr-title">
  <div class="ribbon">わくわくアイランド</div>
  <div class="logo"><span class="l1">ぴょんぴょん！</span><span class="l2">おかしのくに</span></div>
  <div class="tspacer"></div>
  <div class="tfoot">
    <div class="hsline" id="t-hs">ようこそ おかしのくにへ！</div>
    <button class="btn" id="t-start" type="button">▶ はじめる</button>
    <div class="tsub">
      <button class="btn sub" id="t-chara" type="button">なかま</button>
      <button class="btn ghost" id="t-endless" type="button" disabled>どこまでも</button>
    </div>
  </div>
</div>

<!-- ================= ワールド選択 ================= -->
<div class="screen pane hidden" id="scr-world">
  <div class="head">どこへ いく？</div>
  <div class="lead" id="w-lead">すきな くにを えらんでね</div>
  <div class="worlds" id="w-list"></div>
  <button class="btn ghost" id="w-back" type="button">もどる</button>
</div>

<!-- ================= ステージ選択 ================= -->
<div class="screen pane hidden" id="scr-stage">
  <div class="head" id="s-title">クッキーへいげん</div>
  <div class="lead" id="s-lead">ステージを えらんでね</div>
  <div class="stages" id="s-list"></div>
  <button class="btn ghost" id="s-back" type="button">もどる</button>
</div>

<!-- ================= なかま選択 ================= -->
<div class="screen pane hidden" id="scr-chara">
  <div class="head">なかまを えらぶ</div>
  <div class="lead" id="c-lead">ステージを クリアすると なかまが ふえるよ</div>
  <div class="charrow" id="c-list"></div>
  <button class="btn ghost" id="c-back" type="button">もどる</button>
</div>

<!-- ================= リザルト ================= -->
<div class="screen pane hidden" id="scr-result">
  <div class="head" id="r-head">ゴール！</div>
  <div class="rbox">
    <div class="rstars" id="r-stars"></div>
    <div class="rline" id="r-line"></div>
    <div class="unlockmsg hidden" id="r-unlock"></div>
  </div>
  <div class="rbtns">
    <button class="btn sub" id="r-retry" type="button">もういちど</button>
    <button class="btn" id="r-next" type="button">つぎへ ▶</button>
    <button class="btn ghost" id="r-map" type="button">ステージへ</button>
  </div>
</div>

<!-- ================= WebGL fallback ================= -->
<div id="nogl">
  <div class="head">ごめんね…</div>
  <p>この ブラウザでは 3Dが つかえないみたい。<br>べつの ブラウザで ためしてみてね。</p>
  <button class="btn ghost" id="nogl-back" type="button">もどる</button>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
'use strict';
/* =======================================================================
   ぴょんぴょん！おかしのくに 3D  (okashi_crossing_v2)
   Three.js r128 / わくわくアイランド
   ======================================================================= */

/* ---------------- SAFE_LS ---------------- */
var SAFE_LS = (function () {
  try { var t = '__ok_t'; localStorage.setItem(t, '1'); localStorage.removeItem(t); return localStorage; }
  catch (e) { var m = {}; return { getItem: function (k) { return (k in m) ? m[k] : null; }, setItem: function (k, v) { m[k] = String(v); }, removeItem: function (k) { delete m[k]; } }; }
})();
var SAVE_KEY = 'okashi_crossing_v2';
var LEGACY_HS = 'okashi_crossing_hs';

/* ---------------- 定数 ---------------- */
var LANE_MIN = -4, LANE_MAX = 4;
var ROW_W_TEX = 24;
var HOP_TIME = 0.19, HOP_H = 0.62;
var STAGE_PER_WORLD = 4;
var TOTAL_STAGES = 12;

/* ---------------- キャラクター ---------------- */
var CHARAS = [
  { id: 'usagi', name: 'うさぎ', need: 0, body: 0xfff4f8, accent: 0xffb3d1, belly: 0xffffff, ear: 'long' },
  { id: 'kuma', name: 'くま', need: 3, body: 0xc98f5e, accent: 0xe8bd91, belly: 0xf3dcc2, ear: 'round' },
  { id: 'neko', name: 'ねこ', need: 6, body: 0xffd9a0, accent: 0xffb870, belly: 0xfff3e2, ear: 'cat' },
  { id: 'pengin', name: 'ペンギン', need: 9, body: 0x4a5f8f, accent: 0xffc93c, belly: 0xffffff, ear: 'none' }
];

/* ---------------- ワールド ---------------- */
var WORLDS = [
  {
    id: 1, name: 'クッキーへいげん', desc: 'グミのくるまに きをつけて！', sky: 'sky-cookie',
    bg: 'linear-gradient(135deg,#ffe6bd,#ffd39a)', card: '#ffcf8f',
    ground: 0xf2d6a2, groundAlt: 0xdcb87c, road: 0xc2497e, roadLine: 0xffe6f3,
    rail: 0x8f8a99, fog: 0xf5d9b0, deco: 'lolli', bgm: 'happy'
  },
  {
    id: 2, name: 'チョコレートかわ', desc: 'クッキーの いかだに のって わたろう', sky: 'sky-choco',
    bg: 'linear-gradient(135deg,#d9b3f0,#ffc2e0)', card: '#dcb0ee',
    ground: 0xe8c48c, groundAlt: 0xd2aa70, road: 0x93386a, roadLine: 0xffe0f0,
    river: 0x5a3620, riverTop: 0x764a2c, rail: 0x8f8a99, fog: 0xf0c8de, deco: 'donut', bgm: 'cute'
  },
  {
    id: 3, name: 'アイスやま', desc: 'キャンディれっしゃが とおるよ！', sky: 'sky-ice',
    bg: 'linear-gradient(135deg,#bfe4ff,#f0e2ff)', card: '#bcdcf7',
    ground: 0xfff0e2, groundAlt: 0xf7d4e2, road: 0x5f5596, roadLine: 0xfff0a8,
    river: 0x2f8fd0, riverTop: 0x5cc0ee, rail: 0x8f8a99, fog: 0xdce8f5, deco: 'cone', bgm: 'magical'
  }
];

/* ---------------- ステージ設定 ----------------
   rows  : ゴールまでの行数
   candy : 配置キャンディ数
   speed : 障害物の基準速度倍率
   mix   : 行タイプの出現重み
------------------------------------------------- */
var STAGES = [
  /* World 1 : クッキーへいげん（グミロードだけ） */
  { w: 1, rows: 16, candy: 5, speed: 0.78, hz: { road: 4 } },
  { w: 1, rows: 20, candy: 6, speed: 0.90, hz: { road: 6 } },
  { w: 1, rows: 24, candy: 7, speed: 1.00, hz: { road: 8 } },
  { w: 1, rows: 28, candy: 8, speed: 1.12, hz: { road: 10 } },
  /* World 2 : チョコレートかわ（いかだ登場） */
  { w: 2, rows: 22, candy: 6, speed: 0.92, hz: { road: 4, river: 3 } },
  { w: 2, rows: 26, candy: 7, speed: 1.02, hz: { road: 5, river: 4 } },
  { w: 2, rows: 30, candy: 8, speed: 1.12, hz: { road: 6, river: 5 } },
  { w: 2, rows: 34, candy: 9, speed: 1.22, hz: { road: 7, river: 6 } },
  /* World 3 : アイスやま（キャンディれっしゃ登場） */
  { w: 3, rows: 26, candy: 8, speed: 1.05, hz: { road: 4, river: 3, rail: 2 } },
  { w: 3, rows: 30, candy: 9, speed: 1.15, hz: { road: 5, river: 3, rail: 3 } },
  { w: 3, rows: 34, candy: 10, speed: 1.25, hz: { road: 6, river: 4, rail: 3 } },
  { w: 3, rows: 40, candy: 12, speed: 1.35, hz: { road: 7, river: 5, rail: 4 } }
];

/* ---------------- セーブ ---------------- */
function defaultSave() {
  return { v: 2, stars: {}, chara: 'usagi', endlessBest: 0, sound: true, seen: false };
}
function loadSave() {
  var s = defaultSave();
  try {
    var raw = SAFE_LS.getItem(SAVE_KEY);
    if (raw) {
      var o = JSON.parse(raw);
      if (o && typeof o === 'object') {
        if (o.stars && typeof o.stars === 'object') {

function buildChara(c) {
  var grp = new THREE.Group();
  var outline = [];

  var accM = matLambert(c.accent);
  var bellyM = matLambert(c.belly);

  var whiteM = matLambert(0xffffff);

  var pivot = new THREE.Group();      // ぷにっと変形用
  grp.add(pivot);

  var body = mesh(sph(0.34, 14), bodyM, true, false);
  body.scale.set(1, 0.92, 0.92);
  body.position.y = 0.34;
  pivot.add(body); outline.push(body);

  var belly = mesh(sph(0.235, 12), bellyM, false, false);
  belly.scale.set(0.86, 0.94, 0.7);
  belly.position.set(0, 0.29, 0.2);
  pivot.add(belly);

  var head = mesh(sph(0.26, 14), bodyM, true, false);
  head.scale.set(1, 0.95, 0.95);
  head.position.set(0, 0.66, 0.03);
  pivot.add(head); outline.push(head);

  /* 耳 */
  if (c.ear === 'long') {
    [-0.12, 0.12].forEach(function (x) {
      var e = mesh(sph(0.085, 10), bodyM, true, false);
      e.scale.set(0.8, 2.5, 0.55); e.position.set(x, 0.98, -0.01); e.rotation.z = x * 1.1;
      pivot.add(e); outline.push(e);
      var ei = mesh(sph(0.05, 8), accM, false, false);
      ei.scale.set(0.7, 2.4, 0.4); ei.position.set(x, 0.98, 0.05); ei.rotation.z = x * 1.1;
      pivot.add(ei);
    });
  } else if (c.ear === 'round') {
    [-0.19, 0.19].forEach(function (x) {
      var e = mesh(sph(0.1, 10), bodyM, true, false);
      e.position.set(x, 0.85, -0.01); pivot.add(e); outline.push(e);
      var ei = mesh(sph(0.055, 8), accM, false, false);
      ei.position.set(x, 0.85, 0.05); pivot.add(ei);
    });
  } else if (c.ear === 'cat') {
    [-0.16, 0.16].forEach(function (x) {
      var e = mesh(cone(0.11, 0.19, 4), bodyM, true, false);
      e.position.set(x, 0.87, -0.01); e.rotation.y = Math.PI / 4; e.rotation.z = x * 0.9;
      pivot.add(e); outline.push(e);
    });

    var cap = mesh(sph(0.245, 12), bodyM, false, false);

  }

  /* 顔（ペンギンは白い顔） */
  if (c.ear === 'none') {
    var face = mesh(sph(0.2, 12), whiteM, false, false);

    var eye = mesh(sph(0.045, 8), darkM, false, false);

    var sp = mesh(sph(0.016, 6), whiteM, false, false);
    sp.position.set(x + 0.015, 0.72, 0.245); pivot.add(sp);
  });

  var nose = mesh(sph(0.05, 8), accM, false, false);
  nose.scale.set(1.1, 0.75, 0.9); nose.position.set(0, 0.635, 0.235); pivot.add(nose);

  [-0.19, 0.19].forEach(function (x) {
    var ch = mesh(sph(0.055, 8), accM, false, false);

  });

  /* 手足 */
  var feet = [];
  [-0.17, 0.17].forEach(function (x) {
    var f = mesh(sph(0.1, 8), accM, true, false);

  b.position.y = 0.12; grp.add(b);
  var rim = mesh(torus(size * 0.97, 0.055, 14), matLambert(0xb87f36), false, false);
  rim.rotation.x = Math.PI / 2; rim.position.y = 0.14; grp.add(rim);
  for (var i = 0; i < 3; i++) {
    var a = (i / 3) * Math.PI * 2 + 0.4;
    var r = size * (0.28 + (i % 2) * 0.34);
    var c = mesh(sph(0.07, 6), chipM, false, false);
    c.scale.y = 0.6;
    c.position.set(Math.cos(a) * r, 0.21, Math.sin(a) * r);
    grp.add(c);
  }
  grp.userData = { halfW: size * 0.94 };
  return grp;
}

function buildTrain(cars) {
  var grp = new THREE.Group();
  var len = 0;
  var bodyCols = [0xff5f8a, 0xffffff];
  for (var i = 0; i < cars; i++) {
    var seg = new THREE.Group();
    var m = matPhong(bodyCols[i % 2], 70);
    var b = mesh(box(1.5, 0.6, 0.72), m, true, false);
    b.position.y = 0.48; seg.add(b);
    var stripe = mesh(box(1.52, 0.14, 0.74), matPhong(i % 2 ? 0xff5f8a : 0xffffff, 70), false, false);
    stripe.position.y = 0.62; seg.add(stripe);
    var roof = mesh(box(1.35, 0.12, 0.62), matLambert(0xffe08a), false, false);
    roof.position.y = 0.83; seg.add(roof);
    seg.position.x = i * 1.62;
    len = i * 1.62 + 1.5;
    grp.add(seg);
  }
  grp.userData = { halfW: len * 0.5 };
  /* 中央基準にそろえる */
  grp.children.forEach(function (ch) { ch.position.x -= (len - 1.5) * 0.5; });
  return grp;
}

function buildCandy() {

function buildDeco(kind, rnd) {

function buildGate(theme) {

var worldRoot = null;
var rows = {};              // index -> row
var decoPool = [];
var player = null, playerShadow = null;
var theme = WORLDS[0];

function disposeGroup(o) {
  if (!o) return;
  o.traverse(function (n) {
    if (n.isMesh && n.geometry && n.geometry.__temp) n.geometry.dispose();
    if (n.isMesh && n.userData && n.userData.disposeMaterial && n.material) n.material.dispose();
  });
  if (o.parent) o.parent.remove(o);
}
function clearWorld() {
  if (worldRoot) { disposeGroup(worldRoot); worldRoot = null; }
  rows = {}; decoPool = [];
  player = null; playerShadow = null;
  if (titleDio) { disposeGroup(titleDio); titleDio = null; }
}

function applyTheme(w) {
  theme = w;
  document.body.className = w.sky;
  if (scene && scene.fog) scene.fog.color.setHex(w.fog);
  if (hemi) hemi.groundColor.setHex(w.ground);
}

/* ---------------- 行の生成 ---------------- */
var ROW_W = ROW_W_TEX;   /* = 24 : 画面外の無駄な生成を抑える */

function rowTheme(i) {
  if (!G_.endless) return theme;
  var band = i < 26 ? 0 : (i < 58 ? 1 : 2);
  return WORLDS[band];
}

function makeRow(i) {
  if (rows[i]) return rows[i];
  var cfg = G_.cfg;
  var th = rowTheme(i);
  var rnd = mulberry32((G_.seed * 7919 + i * 104729) >>> 0);
  var type;

  if (!G_.endless) type = G_.layout[i] || 'grass';
  else if (i <= 2) type = 'grass';
  else type = pickRowType(i, rnd, cfg);

  var g = new THREE.Group();
  g.position.z = -i;
  worldRoot.add(g);

  var row = { i: i, type: type, g: g, obs: [], candy: null, speed: 0, dir: 1, span: ROW_W, th: th, timer: 0, warn: null, active: false };

  var deckY = 0;
  if (type === 'river') {
    var water = mesh(box(ROW_W, 0.42, 1.0), matLambert(th.river || 0x6b4226), false, true);
    water.position.y = -0.06; g.add(water);
    var surf = mesh(box(ROW_W, 0.04, 0.98), matPhong(th.riverTop || 0x8a5a34, 40, { transparent: true, opacity: 0.9 }), false, false);
    surf.position.y = 0.16; g.add(surf);
    for (var s = 0; s < 3; s++) {
      var st = mesh(box(2.4 + rnd() * 2, 0.02, 0.1), matPhong(0xffffff, 90, { transparent: true, opacity: 0.22 }), false, false);
      st.position.set(-10 + s * 8 + rnd() * 3, 0.19, -0.3 + s * 0.3);
      g.add(st);
      if (!row.streaks) row.streaks = [];
      row.streaks.push(st);
    }
    deckY = 0.18;
  } else {
    var topCol = (type === 'road') ? th.road : (type === 'rail' ? (th.rail || 0xa79bc4) : (i % 2 ? th.ground : th.groundAlt));
    var ground = mesh(box(ROW_W, 0.34, 1.0), matLambert(topCol), false, true);
    ground.position.y = -0.17; g.add(ground);
    if (type === 'road') {
      var dashes = mesh(plane(ROW_W, 1.0), new THREE.MeshBasicMaterial({ map: stripeTex(th.roadLine), transparent: true, depthWrite: false }), false, false);
      dashes.position.y = 0.006; g.add(dashes);
    }
    if (type === 'rail') {
      [-0.26, 0.26].forEach(function (z) {
        var rail = mesh(box(ROW_W, 0.12, 0.14), matPhong(0xff3b6e, 60), false, false);
        rail.position.set(0, 0.06, z); g.add(rail);
      });
      var ties = mesh(plane(ROW_W, 0.78), new THREE.MeshBasicMaterial({ map: railTex(), transparent: true, depthWrite: false }), false, false);
      ties.position.y = 0.012; g.add(ties);
      row.warn = [];
      [-(LANE_MAX + 0.95), LANE_MAX + 0.95].forEach(function (wx) {
        var pole = mesh(cyl(0.06, 0.06, 0.95, 8), matLambert(0xffffff), true, false);
        pole.position.set(wx, 0.48, 0); g.add(pole);
        var w = mesh(sph(0.17, 10), matPhong(0xffe08a, 70), false, false);
        w.position.set(wx, 1.02, 0); g.add(w);
        row.warn.push(w);
      });
      deckY = 0.02;
    }
  }

  /* ---- 障害物 ---- */
  var sp = G_.speedMul;
  if (type === 'road') {
    row.dir = rnd() > 0.5 ? 1 : -1;
    var len = 1.05 + Math.floor(rnd() * 3) * 0.28;
    row.speed = (1.6 + rnd() * 1.5) * sp;
    var gap = Math.max(len + 1.7, 2.5 + rnd() * 1.9 + row.speed * 0.42);
    var n = Math.max(2, Math.floor(ROW_W / gap));
    row.span = n * gap;
    for (var k = 0; k < n; k++) {
      var car = buildGummyCar(Math.floor(rnd() * GUMMY_COLORS.length), len);
      car.position.set(-row.span / 2 + k * gap + rnd() * 0.3, 0, 0);
      car.rotation.y = row.dir > 0 ? 0 : Math.PI;
      g.add(car);
      row.obs.push({ o: car, halfW: len * 0.5 });
    }
  } else if (type === 'river') {
    row.dir = rnd() > 0.5 ? 1 : -1;
    row.speed = (0.85 + rnd() * 0.85) * sp;
    var rs = 0.78 + rnd() * 0.42;
    var rgap = rs * 2 + 1.25 + rnd() * 1.0;
    var rn = Math.max(2, Math.floor(ROW_W / rgap));
    row.span = rn * rgap;
    for (var r2 = 0; r2 < rn; r2++) {
      var raft = buildRaft(rs);
      raft.position.set(-row.span / 2 + r2 * rgap, deckY - 0.08, 0);
      g.add(raft);
      row.obs.push({ o: raft, halfW: rs * 0.92, raft: true });
    }
  } else if (type === 'rail') {
    row.dir = rnd() > 0.5 ? 1 : -1;
    row.speed = (6.4 + rnd() * 1.8) * Math.min(1.25, sp);
    row.timer = 2.2 + rnd() * 3.2;
    var tr = buildTrain(2 + Math.floor(rnd() * 2));
    tr.position.set(row.dir > 0 ? -ROW_W : ROW_W, 0.02, 0);
    tr.visible = false;
    g.add(tr);
    row.obs.push({ o: tr, halfW: tr.userData.halfW, train: true });
  }

  /* ---- ゴール ---- */
  if (type === 'goal') {
    var gate = buildGate(th);
    gate.position.set(0, 0, 0);
    g.add(gate);
    row.gate = gate;
    for (var fx = -3; fx <= 3; fx++) {
      if (Math.abs(fx) < 2) continue;
      var fl = mesh(cyl(0.14, 0.14, 0.5, 10), matPhong(0xffd65b, 80), true, false);
      fl.position.set(fx * 1.1, 0.25, 0.1); g.add(fl);
    }
  }

  /* ---- 装飾（レーン外のみ・進路をふさがない） ---- */
  if (type === 'grass' || type === 'goal') {
    var dn = (rnd() > 0.45) ? 1 + Math.floor(rnd() * 2) : 0;
    for (var dd = 0; dd < dn; dd++) {
      var side = rnd() > 0.5 ? 1 : -1;
      var dx = side * (LANE_MAX + 1.2 + rnd() * 5.5);
      var deco = buildDeco(th.deco, rnd);
      deco.position.set(dx, 0, (rnd() - 0.5) * 0.4);
      deco.rotation.y = rnd() * Math.PI;
      var sc = 0.85 + rnd() * 0.5;
      deco.scale.set(sc, sc, sc);
      g.add(deco);
    }
  }

  /* ---- キャンディ（安全な行のみ） ---- */
  if (G_.endless && type === 'grass' && i > 2 && rnd() < 0.24) {
    G_.candyRows[i] = Math.round(rnd() * (LANE_MAX - LANE_MIN) + LANE_MIN);
  }
  if (G_.candyRows && G_.candyRows[i] !== undefined && (type === 'grass')) {
    var cm = buildCandy();
    cm.position.set(G_.candyRows[i], 0.02, 0);
    g.add(cm);
    row.candy = { o: cm, x: G_.candyRows[i], taken: false };
  }

  rows[i] = row;
  return row;
}

/* ---------------------------------------------------------
   行タイプの安全ルール（幼児向け・詰み防止）
   ・危険な行は最大2連続まで（必ず休める場所ができる）
   ・川のあとは必ず安全地帯（いかだの上で行き止まりにしない）
   ・線路のあとは必ず安全地帯（高速なため）
   ・同じ種類の連続は maxRun まで
--------------------------------------------------------- */
function isHazard(t) { return t !== 'grass' && t !== 'goal'; }
function adjustType(t, at, i, maxRun) {
  if (i <= 2) return 'grass';
  if (!isHazard(t)) return t;
  var p1 = at(i - 1);
  if (p1 === 'river' && t !== 'river') return 'grass';   /* 川→他の危険 は禁止 */
  if (p1 === 'rail') return 'grass';                      /* 線路の直後は休憩 */
  var run = 0, j;
  for (j = i - 1; j >= 0 && at(j) === t; j--) run++;
  if (run >= maxRun) return 'grass';
  var hz = 0, m;
  for (m = i - 1; m >= 0 && isHazard(at(m)); m--) hz++;
  if (hz >= 2) return 'grass';                            /* 危険は2連続まで */
  return t;
}

function mixKeys(mix) {
  var keys = [];
  for (var k in mix) for (var n = 0; n < mix[k]; n++) keys.push(k);
  return keys;
}

/* ステージは「種類ごとの本数」を決めて等間隔に配置する。
   乱数まかせだと本数が偏り、難易度カーブが壊れるため。 */
function canPlace(types, i, t) {
  var at = function (j) { return types[j] || 'grass'; };
  if (at(i) !== 'grass') return false;
  /* 危険な行は2連続まで */
  if (isHazard(at(i - 1)) && isHazard(at(i - 2))) return false;
  if (isHazard(at(i + 1)) && isHazard(at(i + 2))) return false;
  if (isHazard(at(i - 1)) && isHazard(at(i + 1))) return false;
  /* 川のあとは川か安全地帯だけ（いかだの上で行き止まりにしない） */
  if (at(i - 1) === 'river' && t !== 'river') return false;
  if (t === 'river' && isHazard(at(i + 1)) && at(i + 1) !== 'river') return false;
  /* 線路の前後は必ず安全地帯（高速なため） */
  if (at(i - 1) === 'rail' || at(i + 1) === 'rail') return false;
  if (t === 'rail' && (isHazard(at(i - 1)) || isHazard(at(i + 1)))) return false;
  /* 同じ種類が3連続しない */
  if (at(i - 1) === t && at(i - 2) === t) return false;
  if (at(i + 1) === t && at(i + 2) === t) return false;
  return true;
}

function planLayout(cfg, seed, goal) {
  var rnd = mulberry32((seed * 2654435761) >>> 0);
  var types = {}, i;
  for (i = 0; i <= goal + 12; i++) types[i] = 'grass';
  types[goal] = 'goal';

  var bag = [];
  for (var k in cfg.hz) for (var n = 0; n < cfg.hz[k]; n++) bag.push(k);
  for (var sh = bag.length - 1; sh > 0; sh--) {
    var j = Math.floor(rnd() * (sh + 1));
    var tmp = bag[sh]; bag[sh] = bag[j]; bag[j] = tmp;
  }

  var first = 3, last = goal - 2;
  var span = Math.max(1, last - first + 1);
  for (var b = 0; b < bag.length; b++) {
    var target = first + Math.floor((b + 0.5) * span / bag.length);
    var pos = -1;
    for (var d = 0; d < span && pos < 0; d++) {
      var cands = d === 0 ? [target] : [target + d, target - d];
      for (var ci = 0; ci < cands.length; ci++) {
        var p = cands[ci];
        if (p < first || p > last) continue;
        if (canPlace(types, p, bag[b])) { pos = p; break; }
      }
    }
    if (pos >= 0) types[pos] = bag[b];
  }
  return types;
}

function pickRowType(i, rnd, cfg) {
  var keys = mixKeys(cfg.mix);
  var at = function (j) { return rows[j] ? rows[j].type : 'grass'; };
  return adjustType(keys[Math.floor(rnd() * keys.length)] || 'grass', at, i, cfg.maxRun || 2);
}

/* =========================================================
   ゲーム状態
   ========================================================= */
var G_ = {
  mode: 'title',       // title | play
  endless: false,
  stageNo: 1, cfg: null, goalRow: 20, seed: 1, speedMul: 1, layout: null,
  candyRows: null, candyTotal: 0, candyGot: 0,
  mistakes: 0, running: false, maxRow: 0, farthest: 0
};
var px = 0, pRowF = 0, pRow = 0;
var hop = null;           // {fx,fz,tx,tz,t,dur}
var invuln = 0, splash = null, squash = 0, bumpT = 0;
var ridingRow = -1;
var clock = null;

function notifyRunning(r) {
  if (!r) setGuide(false);
  try { if (window.parent !== window) window.parent.postMessage({ type: 'okashi-crossing-running', running: !!r }, '*'); } catch (e) { /* noop */ }
}

function planCandies(cfg, seed, goal, layout) {
  var rnd = mulberry32((seed * 31337) >>> 0);
  var safe = [];
  for (var i = 3; i < goal; i++) if (layout[i] === 'grass') safe.push(i);
  /* シード固定シャッフル */
  for (var s = safe.length - 1; s > 0; s--) {
    var j = Math.floor(rnd() * (s + 1));
    var tmp = safe[s]; safe[s] = safe[j]; safe[j] = tmp;
  }
  var map = {}, n = Math.min(cfg.candy, safe.length);
  for (var k = 0; k < n; k++) {
    map[safe[k]] = Math.round(rnd() * (LANE_MAX - LANE_MIN) + LANE_MIN);
  }
  return map;
}

function startStage(n) {
  var cfg = STAGES[n - 1];
  G_.mode = 'play'; G_.endless = false; G_.stageNo = n; G_.cfg = cfg;
  G_.goalRow = cfg.rows; G_.seed = 1000 + n * 17; G_.speedMul = cfg.speed;
  G_.layout = planLayout(cfg, G_.seed, cfg.rows);
  G_.candyRows = planCandies(cfg, G_.seed, cfg.rows, G_.layout);
  G_.candyTotal = 0; for (var k in G_.candyRows) G_.candyTotal++;
  G_.candyGot = 0; G_.mistakes = 0; G_.maxRow = 0; G_.running = true;
  applyTheme(WORLDS[cfg.w - 1]);
  initBGM(WORLDS[cfg.w - 1].bgm);
  buildRun();
}

function startEndless() {
  G_.mode = 'play'; G_.endless = true; G_.cfg = { rows: 9999, candy: 0, speed: 1, mix: { road: 4, river: 3, rail: 2, grass: 8 }, maxRun: 2 };
  G_.goalRow = 99999; G_.seed = (Date.now() % 100000) | 0; G_.speedMul = 0.95;
  G_.layout = null;
  G_.candyRows = {}; G_.candyTotal = 0; G_.candyGot = 0;
  G_.mistakes = 0; G_.maxRow = 0; G_.running = true;
  applyTheme(WORLDS[0]);
  initBGM('happy');
  buildRun();
}

function buildRun() {
  clearWorld();
  worldRoot = new THREE.Group();
  scene.add(worldRoot);

  px = 0; pRowF = 0; pRow = 0; hop = null; invuln = 0; splash = null; squash = 0; bumpT = 0; ridingRow = -1;

  var c = charaById(save.chara) || CHARAS[0];
  player = buildChara(c);
  worldRoot.add(player);
  playerShadow = new THREE.Group();
  var shBlob = mesh(cyl(0.32, 0.32, 0.02, 16), new THREE.MeshBasicMaterial({ color: 0x6b3f57, transparent: true, opacity: 0.26, depthWrite: false }), false, false);
  shBlob.userData.disposeMaterial = true;
  playerShadow.add(shBlob);
  var shRing = mesh(torus(0.42, 0.045, 20), new THREE.MeshBasicMaterial({ color: 0xff7fb8, transparent: true, opacity: 0.6, depthWrite: false }), false, false);
  shRing.userData.disposeMaterial = true;
  shRing.rotation.x = Math.PI / 2; shRing.position.y = 0.005;
  playerShadow.add(shRing);
  playerShadow.userData = { blob: shBlob, ring: shRing };
  worldRoot.add(playerShadow);

  for (var i = -3; i <= 16; i++) makeRow(i);
  /* タイトルのカメラ位置から補間すると開始直後にキャラが画面外に出るため、正位置に置いてから始める */
  computeCam();
  camera.position.set(0, camOff.y, camOff.z);
  camera.lookAt(0, 0.45, -camOff.look);
  camera.updateMatrixWorld(true);

  syncHUD();
  showScreen(null);
  document.getElementById('hud').classList.remove('hidden');
  document.getElementById('hint').style.opacity = '.96';
  setGuide(true);
  notifyRunning(true);
  resize();
}

/* ---------------- 行の追加と破棄 ---------------- */
function streamRows() {
  var ahead = pRow + 17;
  var limit = G_.endless ? ahead : Math.min(ahead, G_.goalRow + 10);
  for (var i = pRow - 3; i <= limit; i++) makeRow(i);
  var cut = pRow - 7;
  for (var k in rows) {
    var idx = +k;
    if (idx < cut) { disposeGroup(rows[k].g); delete rows[k]; }
  }
}

/* =========================================================
   入力
   ========================================================= */
function solidRow(i) { var r = rows[i]; return !r || r.type !== 'river'; }

function tryMove(dir) {
  if (G_.mode !== 'play' || !G_.running || hop || splash) return;
  var nx = px, nz = pRow;
  if (dir === 'up') nz = pRow + 1;
  else if (dir === 'down') nz = pRow - 1;
  else if (dir === 'left') nx = px - 1;
  else if (dir === 'right') nx = px + 1;

  if (nz < 0) return;
  makeRow(nz);
  if (solidRow(nz)) {
    nx = Math.round(nx);
    if (nx < LANE_MIN || nx > LANE_MAX) return;
  } else {
    if (nx < LANE_MIN - 1.4 || nx > LANE_MAX + 1.4) return;
  }
  hop = { fx: px, fz: pRow, tx: nx, tz: nz, t: 0, dur: HOP_TIME };
  sfxHop();
  document.getElementById('hint').style.opacity = '0';
  setGuide(false);
}

/* 操作: キャラを基準に、タップした「方向」へ進む。スワイプでも同じ方向へ動く。 */
var guideOn = false;
var GUIDE_R = 96;
function setGuide(on) {
  if (guideOn === on) return;
  guideOn = on;
  var el = document.getElementById('tapguide');
  if (el) el.classList.toggle('on', on);
}
function updateGuide() {
  if (!guideOn) return;
  var sp = playerScreenPos();
  if (!sp) return;
  var r = Math.min(GUIDE_R, window.innerWidth * 0.26);
  var set = function (id, dx, dy) {
    var e = document.getElementById(id);
    if (e) { e.style.left = (sp.x + dx) + 'px'; e.style.top = (sp.y + dy) + 'px'; }
  };
  set('tg-u', 0, -r);
  set('tg-d', 0, r);
  set('tg-l', -r, 0);
  set('tg-r', r, 0);
}

var _pv = null;
function playerScreenPos() {
  if (!player || !camera) return null;
  if (!_pv) _pv = new THREE.Vector3();
  player.getWorldPosition(_pv);
  _pv.y += 0.42;                 /* 体の中心あたりを基準にする */
  _pv.project(camera);
  if (!isFinite(_pv.x) || !isFinite(_pv.y)) return null;
  return {
    x: (_pv.x * 0.5 + 0.5) * window.innerWidth,
    y: (1 - (_pv.y * 0.5 + 0.5)) * window.innerHeight
  };
}
function dirFromTap(cx, cy) {
  var sp = playerScreenPos();
  if (!sp) return 'up';
  var dx = cx - sp.x, dy = cy - sp.y;
  /* キャラのすぐ上／真上あたりは前進あつかい（いちばん使う操作なので広めに） */
  if (dx * dx + dy * dy < 34 * 34) return 'up';
  if (Math.abs(dx) > Math.abs(dy)) return dx > 0 ? 'right' : 'left';
  return dy < 0 ? 'up' : 'down';
}

var pointerStart = null;
function onDown(e) {
  e.preventDefault();
  activateAudio();
  if (pointerStart) return;
  try { cv.setPointerCapture(e.pointerId); } catch (err) { /* capture非対応でも操作は続ける */ }
  var p = e;
  pointerStart = { id: e.pointerId, x: p.clientX, y: p.clientY, t: performance.now() };
}
function onUp(e) {
  if (!pointerStart || pointerStart.id !== e.pointerId) return;
  var p = e;
  var dx = p.clientX - pointerStart.x, dy = p.clientY - pointerStart.y;
  var ad = Math.abs(dx), ay = Math.abs(dy);
  pointerStart = null;
  if (G_.mode !== 'play') return;
  if (ad < 26 && ay < 26) { tryMove(dirFromTap(p.clientX, p.clientY)); return; }
  if (ad > ay) tryMove(dx > 0 ? 'right' : 'left');
  else tryMove(dy > 0 ? 'down' : 'up');
}
function onPointerCancel(e) { if (pointerStart && pointerStart.id === e.pointerId) pointerStart = null; }
cv.addEventListener('pointerdown', onDown, { passive: false });
cv.addEventListener('pointerup', onUp, { passive: false });
cv.addEventListener('pointercancel', onPointerCancel, { passive: false });
document.addEventListener('pointerdown', activateAudio, { capture: true, once: true });
window.addEventListener('keydown', function (e) {
  var m = { ArrowUp: 'up', ArrowDown: 'down', ArrowLeft: 'left', ArrowRight: 'right', w: 'up', s: 'down', a: 'left', d: 'right', ' ': 'up' }[e.key];
  if (m) { e.preventDefault(); tryMove(m); }
});
window.addEventListener('message', function (e) {
  var d = e && e.data;
  if (d && d.type === 'okashi-move' && typeof d.dir === 'string') tryMove(d.dir);
});
document.addEventListener('visibilitychange', function () {
  pageHidden = document.hidden;
  last = performance.now();
  if (pageHidden) { if (bgm && bgm.stop) bgm.stop(); return; }
  if (audioActivated && save.sound && bgm) { try { bgm.start(); } catch (e) { /* noop */ } }
});

/* =========================================================
   ゲームループ
   ========================================================= */
var camOff = { y: 10.6, z: 9.8, look: 3.4 };
function computeCam() {
  var w = window.innerWidth, h = window.innerHeight;
  var ratio = h / Math.max(1, w);
  if (ratio > 1.6) camOff = { y: 12.4, z: 11.4, look: 4.4 };
  else if (ratio > 1.05) camOff = { y: 10.8, z: 10.0, look: 3.6 };
  else camOff = { y: 8.8, z: 8.4, look: 2.4 };
  var dist = Math.sqrt(camOff.y * camOff.y + camOff.z * camOff.z);
  if (scene && scene.fog) scene.fog.density = 0.30 / dist;   /* カメラ距離に連動 */
}

function resize() {
  if (!renderer) return;
  var w = window.innerWidth, h = window.innerHeight;
  renderer.setSize(w, h, false);
  computeCam();
  if (camera) { camera.aspect = w / Math.max(1, h); camera.updateProjectionMatrix(); }
}
window.addEventListener('resize', resize);
window.addEventListener('orientationchange', function () { setTimeout(resize, 220); });

/* 立ち止まっても安全な行（草地・ゴール）だけを退避先にする */
function isSafeRow(i) {
  if (i < 0) return false;
  var r = rows[i] || makeRow(i);
  return r.type === 'grass' || r.type === 'goal';
}
function lastSafeRow(from) {
  for (var i = from; i >= 0; i--) { if (isSafeRow(i)) return i; }
  return 0;
}

function bumpBack() {
  if (invuln > 0) return;
  invuln = 1.25; bumpT = 0.42; G_.mistakes++;
  sfxBump();
  /* 1マス下がる。そこが危ない行なら、いちばん近い安全な行まで下がる */
  var target = lastSafeRow(Math.max(0, pRow - 1));
  pRow = target; pRowF = target;
  px = Math.max(LANE_MIN, Math.min(LANE_MAX, Math.round(px)));
  ridingRow = -1;
  toast('あぶない！');
}

function doSplash() {
  if (splash) return;
  var back = lastSafeRow(pRow);
  splash = { t: 0, dur: 0.55, fx: px, fz: pRowF, tz: back, tx: Math.max(LANE_MIN, Math.min(LANE_MAX, Math.round(px))) };
  G_.mistakes++; invuln = 1.25;
  sfxSplash();
  toast('ちゃぽん！');
}

var toastEl = document.getElementById('toast');
var toastTO = null;
function toast(txt) {
  toastEl.textContent = txt;
  toastEl.classList.remove('show');
  void toastEl.offsetWidth;
  toastEl.classList.add('show');
  if (toastTO) clearTimeout(toastTO);
  toastTO = setTimeout(function () { toastEl.classList.remove('show'); }, 1100);
}

function updateRows(dt) {
  for (var k in rows) {
    var r = rows[k];
    var visible = (r.i > pRow - 6) && (r.i < pRow + 19);
    r.g.visible = visible;
    if (!visible) continue;
    if (r.streaks) {
      for (var s = 0; s < r.streaks.length; s++) {
        var st = r.streaks[s];
        st.position.x += r.dir * (r.speed || 0.6) * 0.5 * dt;
        if (st.position.x > 15) st.position.x -= 30;
        if (st.position.x < -15) st.position.x += 30;
      }
    }
    if (r.type === 'road' || r.type === 'river') {
      for (var j = 0; j < r.obs.length; j++) {
        var ob = r.obs[j];
        ob.o.position.x += r.dir * r.speed * dt;
        var half = r.span / 2;
        if (ob.o.position.x > half) ob.o.position.x -= r.span;
        if (ob.o.position.x < -half) ob.o.position.x += r.span;
        if (ob.raft) ob.o.position.y = -0.06 + Math.sin(performance.now() * 0.003 + r.i) * 0.03;
      }
    } else if (r.type === 'rail') {
      var tr = r.obs[0];
      r.timer -= dt;
      if (!r.active) {
        if (r.warn) {
          var blink = r.timer < 2.2;
          var lit = blink && (Math.floor(performance.now() / 140) % 2 === 0);
          var wm = lit ? matPhong(0xff3b5c, 90) : matPhong(0xffe08a, 70);
          for (var wi = 0; wi < r.warn.length; wi++) {
            r.warn[wi].material = wm;
            r.warn[wi].scale.setScalar(blink ? 1.3 : 1);
          }
        }
        if (r.timer <= 0) {
          r.active = true;
          tr.o.visible = true;
          tr.o.position.x = r.dir > 0 ? -(ROW_W / 2 + tr.halfW) : (ROW_W / 2 + tr.halfW);
          if (Math.abs(r.i - pRow) < 12) beep(420, 0, 0.18, 0.05, 'square');
        }
      } else {
        tr.o.position.x += r.dir * r.speed * dt;
        if ((r.dir > 0 && tr.o.position.x > ROW_W / 2 + tr.halfW) || (r.dir < 0 && tr.o.position.x < -(ROW_W / 2 + tr.halfW))) {
          r.active = false; tr.o.visible = false; r.timer = 3.0 + Math.random() * 3.6;
        }
      }
    }
    if (r.candy && !r.candy.taken) {
      r.candy.o.rotation.y += dt * 2.2;
      r.candy.o.position.y = 0.02 + Math.sin(performance.now() * 0.004 + r.i) * 0.06;
    }
    if (r.gate) {
      r.gate.userData.heart.rotation.y += dt * 1.3;
      r.gate.userData.heart.position.y = 2.85 + Math.sin(performance.now() * 0.003) * 0.08;
    }
  }
}

function checkCollisions(dt) {
  var r = rows[pRow];
  if (!r) return;
  if (r.type === 'river') {
    var onRaft = null;
    for (var j = 0; j < r.obs.length; j++) {
      var ob = r.obs[j];
      if (Math.abs(px - ob.o.position.x) < ob.halfW + 0.20) { onRaft = ob; break; }
    }
    if (onRaft) {
      ridingRow = r.i;
      px += r.dir * r.speed * dt;
      if (px < LANE_MIN - 1.5 || px > LANE_MAX + 1.5) doSplash();
    } else { doSplash(); }
    return;
  }
  ridingRow = -1;
  if (invuln > 0) return;
  if (r.type === 'road') {
    for (var k = 0; k < r.obs.length; k++) {
      var o = r.obs[k];
      if (Math.abs(px - o.o.position.x) < o.halfW + 0.34) { bumpBack(); return; }
    }
  } else if (r.type === 'rail' && r.active) {
    var tr = r.obs[0];
    if (tr.o.visible && Math.abs(px - tr.o.position.x) < tr.halfW + 0.34) { bumpBack(); return; }
  }
}

function checkCandy() {
  var r = rows[pRow];
  if (!r || !r.candy || r.candy.taken) return;
  if (Math.abs(px - r.candy.x) < 0.6) {
    r.candy.taken = true;
    r.candy.o.visible = false;
    G_.candyGot++;
    sfxCandy();
    syncHUD();
  }
}

function reachGoal() {
  G_.running = false;
  notifyRunning(false);
  sfxClear();
  var stars = 1;
  if (G_.candyTotal > 0 && G_.candyGot >= G_.candyTotal) stars++;
  else if (G_.candyTotal === 0) stars++;
  if (G_.mistakes === 0) stars++;
  var prev = starOf(G_.stageNo);
  var newUnlock = null;
  if (stars > prev) save.stars[G_.stageNo] = stars;
  else save.stars[G_.stageNo] = Math.max(prev, 1);
  var cc = clearedCount();
  for (var i = 0; i < CHARAS.length; i++) {
    if (CHARAS[i].need > 0 && CHARAS[i].need === cc) newUnlock = CHARAS[i];
  }
  persist();
  setTimeout(function () { showResult(stars, newUnlock); }, 620);
}

function endEndless() {
  G_.running = false;
  notifyRunning(false);
  var d = G_.maxRow;
  var isBest = d > save.endlessBest;
  if (isBest) { save.endlessBest = d; persist(); }
  showEndlessResult(d, isBest);
}

var last = 0;
function loop(now) {
  requestAnimationFrame(loop);
  if (!renderer) return;
  if (pageHidden) { last = now; return; }
  var dt = Math.min(0.1, (now - last) / 1000 || 0);
  last = now;

  if (G_.mode === 'title') { updateTitle(dt); render(); return; }
  if (!player) { render(); return; }

  if (invuln > 0) invuln -= dt;
  if (bumpT > 0) bumpT -= dt;

  /* --- スプラッシュ復帰 --- */
  if (splash) {
    splash.t += dt;
    var s = Math.min(1, splash.t / splash.dur);
    var e = 1 - Math.pow(1 - s, 3);
    pRowF = splash.fz + (splash.tz - splash.fz) * e;
    px = splash.fx + (splash.tx - splash.fx) * e;
    player.position.y = Math.sin(s * Math.PI) * 0.5 - (1 - s) * 0.22;
    if (s >= 1) { pRow = splash.tz; pRowF = splash.tz; px = splash.tx; splash = null; player.position.y = 0; }
  } else if (hop) {
    hop.t += dt;
    var t = Math.min(1, hop.t / hop.dur);
    pRowF = hop.fz + (hop.tz - hop.fz) * t;
    px = hop.fx + (hop.tx - hop.fx) * t;
    player.position.y = Math.sin(t * Math.PI) * HOP_H;
    var sq = 1 + Math.sin(t * Math.PI) * 0.14;
    player.userData.pivot.scale.set(2 - sq, sq, 2 - sq);
    if (t >= 1) {
      pRow = hop.tz; pRowF = hop.tz; px = hop.tx; hop = null;
      player.position.y = 0; squash = 0.14;
      if (pRow > G_.maxRow) { G_.maxRow = pRow; syncHUD(); }
      checkCandy();
      if (!G_.endless && pRow >= G_.goalRow && G_.running) { reachGoal(); }
    }
  } else {
    if (squash > 0) {
      squash -= dt;
      var q = Math.max(0, squash / 0.14);
      player.userData.pivot.scale.set(1 + q * 0.2, 1 - q * 0.22, 1 + q * 0.2);
    } else {
      var idle = Math.sin(now * 0.004) * 0.03;
      player.userData.pivot.scale.set(1 - idle * 0.5, 1 + idle, 1 - idle * 0.5);
    }
  }

  if (bumpT > 0) {
    player.rotation.z = Math.sin(bumpT * 42) * 0.22 * (bumpT / 0.42);
  } else player.rotation.z = 0;

  if (invuln > 0 && !splash) {
    var vis = Math.floor(now / 90) % 2 === 0;
    player.visible = vis || invuln < 0.25;
  } else player.visible = true;

  streamRows();
  updateRows(dt);
  if (G_.running && !splash && !hop) checkCollisions(dt);
  else if (G_.running && !splash && hop && rows[pRow] && rows[pRow].type === 'river' && ridingRow === pRow) { /* いかだから跳ぶ間は判定しない */ }

  if (G_.endless && G_.running) {
    G_.speedMul = 0.95 + Math.min(0.75, G_.maxRow * 0.006);
  }

  /* プレイヤー配置 */
  player.position.x = px;
  player.position.z = -pRowF;
  player.rotation.y = 0;
  playerShadow.position.set(px, 0.02, -pRowF);
  var sc = 1 - Math.min(0.5, player.position.y * 0.45);
  playerShadow.scale.set(sc, 1, sc);
  playerShadow.userData.blob.material.opacity = 0.26 * sc;
  playerShadow.userData.ring.material.opacity = 0.6 * sc;
  playerShadow.visible = player.visible;

  /* カメラ */
  var tx = px * 0.32, tz = -pRowF + camOff.z;
  camera.position.x += (tx - camera.position.x) * Math.min(1, dt * 6);
  camera.position.y += (camOff.y - camera.position.y) * Math.min(1, dt * 6);
  camera.position.z += (tz - camera.position.z) * Math.min(1, dt * 7.5);
  camera.lookAt(px * 0.2, 0.45, -pRowF - camOff.look);

  updateGuide();

  sun.position.set(px + 6, 14, -pRowF + 8);
  sun.target.position.set(px, 0, -pRowF);
  sun.target.updateMatrixWorld();

  render();
}
function render() { if (renderer && scene && camera) renderer.render(scene, camera); }

/* =========================================================
   タイトル 3Dジオラマ
   ========================================================= */
var titleDio = null, titleT = 0, titleChara = null, titleOrbs = [];

function buildTitleScene() {
  clearWorld();
  applyTheme(WORLDS[0]);
  titleDio = new THREE.Group();
  scene.add(titleDio);
  titleOrbs = [];
  var rnd = mulberry32(7);

  /* クッキーの丘 */
  var hill = mesh(cyl(3.4, 3.7, 1.0, 28), matLambert(0xf0cf9a), true, true);
  hill.position.y = -0.5; titleDio.add(hill);
  var rim = mesh(cyl(3.45, 3.45, 0.16, 28), matLambert(0xe0b87f), false, true);
  rim.position.y = 0.02; titleDio.add(rim);
  for (var i = 0; i < 14; i++) {
    var a = rnd() * Math.PI * 2, r = rnd() * 2.9;
    var chip = mesh(sph(0.13, 6), matLambert(0x6e4228), false, false);
    chip.scale.y = 0.5;
    chip.position.set(Math.cos(a) * r, 0.08, Math.sin(a) * r);
    titleDio.add(chip);
  }

  /* まわりのおかし */
  for (var d = 0; d < 7; d++) {
    var ang = (d / 7) * Math.PI * 2 + 0.3;
    var deco = buildDeco(d % 3 === 0 ? 'donut' : (d % 3 === 1 ? 'lolli' : 'cone'), rnd);
    deco.position.set(Math.cos(ang) * 2.55, 0.05, Math.sin(ang) * 2.55);
    var s = 0.9 + rnd() * 0.35; deco.scale.set(s, s, s);
    titleDio.add(deco);
  }

  /* おかしの門 */
  var gate = buildGate(WORLDS[0]);
  gate.position.set(0, 0.05, -2.2);
  gate.scale.set(0.85, 0.85, 0.85);
  titleDio.add(gate);
  titleDio.userData = { gate: gate };

  /* グミカーが丘のまわりを走る */
  for (var c = 0; c < 3; c++) {
    var car = buildGummyCar(c * 2, 1.15);
    car.userData.ang = (c / 3) * Math.PI * 2;
    car.userData.rad = 4.5 + c * 0.55;
    titleDio.add(car);
    titleOrbs.push({ o: car, kind: 'car', sp: 0.4 + c * 0.1 });
  }

  /* ふわふわキャンディ */
  for (var q = 0; q < 6; q++) {
    var cd = buildCandy();
    cd.userData.ang = rnd() * Math.PI * 2;
    cd.userData.rad = 1.6 + rnd() * 2.2;
    cd.userData.hgt = 1.4 + rnd() * 1.8;
    var s2 = 0.8 + rnd() * 0.6; cd.scale.set(s2, s2, s2);
    titleDio.add(cd);
    titleOrbs.push({ o: cd, kind: 'candy', sp: 0.25 + rnd() * 0.3 });
  }

  /* 主役 */
  var c0 = charaById(save.chara) || CHARAS[0];
  titleChara = buildChara(c0);
  titleChara.position.set(0, 0.05, 0.5);
  titleChara.scale.set(1.55, 1.55, 1.55);
  titleDio.add(titleChara);

  camera.position.set(0, 4.2, 8.6);
  camera.lookAt(0, 1.15, 0);
  titleT = 0;
}

function updateTitle(dt) {
  if (!titleDio) return;
  titleT += dt;
  titleDio.rotation.y += dt * 0.14;

  for (var i = 0; i < titleOrbs.length; i++) {
    var it = titleOrbs[i], o = it.o;
    o.userData.ang += dt * it.sp;
    if (it.kind === 'car') {
      o.position.set(Math.cos(o.userData.ang) * o.userData.rad, 0.02, Math.sin(o.userData.ang) * o.userData.rad);
      o.rotation.y = -o.userData.ang + Math.PI / 2;
    } else {
      o.position.set(Math.cos(o.userData.ang) * o.userData.rad, o.userData.hgt + Math.sin(titleT * 1.6 + i) * 0.18, Math.sin(o.userData.ang) * o.userData.rad);
      o.rotation.y += dt * 1.6;
    }
  }

  /* ぴょんぴょん */
  var ph = (titleT * 1.5) % 1;
  var up = Math.max(0, Math.sin(ph * Math.PI));
  titleChara.position.y = 0.05 + up * 0.62;
  var sq = 1 + up * 0.14;
  titleChara.userData.pivot.scale.set(2 - sq, sq, 2 - sq);
  titleChara.rotation.y = Math.sin(titleT * 0.7) * 0.5;

  if (titleDio.userData.gate) {
    var h = titleDio.userData.gate.userData.heart;
    h.rotation.y += dt * 1.6;
    h.position.y = 2.85 + Math.sin(titleT * 2.4) * 0.09;
  }

  var tall = window.innerHeight / Math.max(1, window.innerWidth) > 1.5;
  var camR = tall ? 8.6 : 7.2, camA = Math.sin(titleT * 0.16) * 0.35;
  camera.position.set(Math.sin(camA) * camR, (tall ? 4.2 : 3.5) + Math.sin(titleT * 0.4) * 0.22, Math.cos(camA) * camR);
  camera.lookAt(0, tall ? 1.15 : 1.0, 0);
}

var SCREENS = ['scr-title', 'scr-world', 'scr-stage', 'scr-chara', 'scr-result'];
var curScreen = 'scr-title';
var curWorld = 1;

function showScreen(id) {
  curScreen = id;
  for (var i = 0; i < SCREENS.length; i++) {
    document.getElementById(SCREENS[i]).classList.toggle('hidden', SCREENS[i] !== id);
  }
  document.getElementById('hud').classList.toggle('hidden', id !== null);
}

function showTitle() {

  notifyRunning(false);
  buildTitleScene();
  var hs = document.getElementById('t-hs');
  var cc = clearedCount();

  else hs.textContent = 'ようこそ おかしのくにへ！';

function showWorlds() {
  var list = document.getElementById('w-list');
  list.innerHTML = '';
  for (var i = 0; i < WORLDS.length; i++) {
    (function (w) {
      var unlocked = worldUnlocked(w.id);
      var got = 0, max = STAGE_PER_WORLD * 3;
      for (var s = 1; s <= STAGE_PER_WORLD; s++) got += starOf((w.id - 1) * STAGE_PER_WORLD + s);
      var el = document.createElement('div');
      el.className = 'wcard' + (unlocked ? '' : ' lock');
      el.style.background = w.bg;
      el.innerHTML =
        '<div class="wico">' + worldIconSVG(w.id) + '</div>' +
        '<div class="wtx"><div class="wnm">' + w.name + '</div>' +
        '<div class="wds">' + w.desc + '</div>' +
        '<div class="wpr">★ ' + got + ' / ' + max + '</div></div>' +
        (unlocked ? '' : '<div class="lockbadge">まえの くにを<br>クリアしてね</div>');
      el.addEventListener('click', function () {
        if (!unlocked) { sfxBump(); return; }
        sfxTap(); showStages(w.id);
      });
      list.appendChild(el);
    })(WORLDS[i]);
  }
  showScreen('scr-world');
}

function showStages(w) {
  curWorld = w;
  var wd = WORLDS[w - 1];
  document.getElementById('s-title').textContent = wd.name;
  document.getElementById('s-lead').textContent = wd.desc;
  applyTheme(wd);
  var list = document.getElementById('s-list');
  list.innerHTML = '';
  for (var s = 1; s <= STAGE_PER_WORLD; s++) {
    (function (n) {
      var unlocked = stageUnlocked(n);
      var st = starOf(n);
      var el = document.createElement('div');
      el.className = 'scard' + (unlocked ? '' : ' lock');
      el.style.background = wd.card;
      var stars = '';
      for (var k = 1; k <= 3; k++) stars += starSVG(k <= st);
      el.innerHTML = '<div class="snum">' + s + '</div><div class="sstar">' + stars + '</div>' +
        (unlocked ? '' : '<div class="lk">' + lockSVG() + '</div>');
      el.addEventListener('click', function () {
        if (!unlocked) { sfxBump(); return; }
        sfxTap(); startStage(n);
      });
      list.appendChild(el);
    })((w - 1) * STAGE_PER_WORLD + s);
  }
  showScreen('scr-stage');
}

function showChara() {
  var list = document.getElementById('c-list');
  list.innerHTML = '';
  var cc = clearedCount();
  for (var i = 0; i < CHARAS.length; i++) {
    (function (c) {
      var unlocked = cc >= c.need;
      var el = document.createElement('div');
      el.className = 'ccard' + (unlocked ? '' : ' lock') + (save.chara === c.id ? ' on' : '');
      el.innerHTML = charaSVG(c) + '<div class="cnm">' + c.name + '</div>' +
        (unlocked ? '' : '<div class="clk">' + c.need + 'ステージ<br>クリアで</div>');
      el.addEventListener('click', function () {
        if (!unlocked) { sfxBump(); return; }
        save.chara = c.id; persist(); sfxTap(); showChara();
        if (G_.mode === 'title') buildTitleScene();
      });
      list.appendChild(el);
    })(CHARAS[i]);
  }
  document.getElementById('c-lead').textContent = 'クリア ' + cc + ' / ' + TOTAL_STAGES + ' ステージ';
  showScreen('scr-chara');
}

/* ---------------- リザルト ---------------- */
var resultKind = 'stage';
function showResult(stars, unlock) {
  resultKind = 'stage';
  document.getElementById('r-head').textContent = 'ゴール！';
  var sw = document.getElementById('r-stars');
  sw.innerHTML = '';
  for (var i = 1; i <= 3; i++) {
    var d = document.createElement('div');
    d.className = 'st';
    d.innerHTML = starSVG(i <= stars);
    sw.appendChild(d);
  }
  var msg = '🍬 キャンディ <b>' + G_.candyGot + '</b> / ' + G_.candyTotal + '<br>' +
    (G_.mistakes === 0 ? 'ノーミス！ すごい！' : 'ぶつかった かず <b>' + G_.mistakes + '</b>');
  document.getElementById('r-line').innerHTML = msg;
  var u = document.getElementById('r-unlock');
  if (unlock) {
    u.classList.remove('hidden');
    u.innerHTML = '🎉 あたらしい なかま「' + unlock.name + '」が なかまに なったよ！';
    sfxUnlock();
  } else if (allCleared() && G_.stageNo === TOTAL_STAGES) {
    u.classList.remove('hidden');
    u.innerHTML = '🎉 ぜんぶ クリア！「どこまでも」モードが あそべるよ！';
    sfxUnlock();
  } else u.classList.add('hidden');

  document.getElementById('r-next').classList.toggle('hidden', G_.stageNo >= TOTAL_STAGES);
  document.getElementById('r-retry').classList.remove('hidden');
  showScreen('scr-result');
}

function showEndlessResult(dist, isBest) {
  resultKind = 'endless';
  document.getElementById('r-head').textContent = isBest ? 'しんきろく！' : 'おつかれさま！';
  var sw = document.getElementById('r-stars');
  sw.innerHTML = '';
  var lv = dist >= 90 ? 3 : (dist >= 45 ? 2 : (dist >= 15 ? 1 : 0));
  for (var i = 1; i <= 3; i++) {
    var d = document.createElement('div'); d.className = 'st';
    d.innerHTML = starSVG(i <= lv); sw.appendChild(d);
  }
  document.getElementById('r-line').innerHTML =
    'すすんだ きょり <b>' + dist + '</b> m<br>🍬 <b>' + G_.candyGot + '</b> こ<br>さいこう <b>' + save.endlessBest + '</b> m';
  document.getElementById('r-unlock').classList.add('hidden');
  document.getElementById('r-next').classList.add('hidden');
  showScreen('scr-result');
  if (isBest) sfxUnlock();
}

/* ---------------- HUD ---------------- */
function syncHUD() {
  var hs = document.getElementById('hud-stage');
  var hc = document.getElementById('hud-candy');
  var hd = document.getElementById('hud-dist');
  var bar = document.querySelector('#hud-goal i');
  if (G_.endless) {
    hs.textContent = 'どこまでも';
    hc.textContent = '🍬 ' + G_.candyGot;
    hd.textContent = G_.maxRow + 'm';
    document.getElementById('hud-goal').classList.add('hidden');
  } else {
    document.getElementById('hud-goal').classList.remove('hidden');
    var w = STAGES[G_.stageNo - 1].w;
    hs.textContent = w + '-' + (G_.stageNo - (w - 1) * STAGE_PER_WORLD);
    hc.textContent = '🍬 ' + G_.candyGot + '/' + G_.candyTotal;
    hd.textContent = Math.min(G_.maxRow, G_.goalRow) + '/' + G_.goalRow;
    bar.style.width = Math.min(100, (G_.maxRow / G_.goalRow) * 100) + '%';
  }
}

/* =========================================================
   ボタン配線
   ========================================================= */
function goBackHost() {
  try {
    if (window.parent !== window) { window.parent.postMessage({ type: 'goBack' }, '*'); return; }
  } catch (e) { /* noop */ }
  history.back();
}

document.getElementById('back-btn').addEventListener('click', function () {
  sfxTap();
  if (curScreen === null) {           /* プレイ中 */
    if (G_.endless) { endEndless(); return; }
    G_.running = false; notifyRunning(false);
    showStages(STAGES[G_.stageNo - 1].w);
    return;
  }
  if (curScreen === 'scr-title') { goBackHost(); return; }
  if (curScreen === 'scr-stage') { showWorlds(); return; }
  if (curScreen === 'scr-result') { if (resultKind === 'endless') showTitle(); else showStages(STAGES[G_.stageNo - 1].w); return; }
  showTitle();
});
document.getElementById('bgm-btn').addEventListener('click', toggleSound);
document.getElementById('nogl-back').addEventListener('click', goBackHost);

document.getElementById('t-start').addEventListener('click', function () { ac(); sfxTap(); showWorlds(); });
document.getElementById('t-chara').addEventListener('click', function () { ac(); sfxTap(); showChara(); });
document.getElementById('t-endless').addEventListener('click', function () {
  if (!allCleared()) { sfxBump(); return; }
  ac(); sfxTap(); startEndless();
});
document.getElementById('w-back').addEventListener('click', function () { sfxTap(); showTitle(); });
document.getElementById('s-back').addEventListener('click', function () { sfxTap(); showWorlds(); });
document.getElementById('c-back').addEventListener('click', function () { sfxTap(); showTitle(); });

document.getElementById('r-retry').addEventListener('click', function () {
  sfxTap();
  if (resultKind === 'endless') startEndless(); else startStage(G_.stageNo);
});
document.getElementById('r-next').addEventListener('click', function () {
  sfxTap();
  var n = Math.min(TOTAL_STAGES, G_.stageNo + 1);
  startStage(n);
});
document.getElementById('r-map').addEventListener('click', function () {
  sfxTap();
  if (resultKind === 'endless') showTitle(); else showStages(STAGES[G_.stageNo - 1].w);
});

/* =========================================================
   起動
   ========================================================= */
if (glOK) {
  syncSoundBtn();
  resize();
  showTitle();
  requestAnimationFrame(function (t) { last = t; requestAnimationFrame(loop); });
}
</script>
</body>
</html>
