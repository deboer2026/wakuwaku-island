<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>そらとびプリンセス</title>
<style>
  :root{
    --sky1:#ffd9ec; --sky2:#bfe3ff; --sky3:#d9c6ff;
    --pink:#ff7eb6; --grape:#7b5bd6; --gold:#ffd25a; --ink:#3a2a55;
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{height:100%;overflow:hidden;background:#1c1030;
    font-family:"Hiragino Maru Gothic ProN","Yu Gothic",system-ui,sans-serif;
    -webkit-user-select:none;user-select:none;touch-action:none;}
  #wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;}
  canvas{display:block;background:#cfeaff;width:100%;height:100%;image-rendering:auto;}
  .screen{position:absolute;inset:0;display:flex;flex-direction:column;
    align-items:center;justify-content:center;text-align:center;color:#fff;
    padding:calc(var(--sat,env(safe-area-inset-top,0px)) + 12px) 20px calc(var(--sab,env(safe-area-inset-bottom,0px)) + 12px);
    background:radial-gradient(140% 120% at 50% 25%, rgba(80,20,160,.94), rgba(15,5,40,.98));
    gap:12px;overflow:hidden;}
  .screen::before{content:'';position:absolute;inset:0;
    background:radial-gradient(ellipse 80% 50% at 50% 0%, rgba(255,140,220,.18), transparent 70%);
    pointer-events:none;}
  .hidden{display:none!important;}
  @keyframes twinkle{0%,100%{opacity:.2;transform:scale(.6)}50%{opacity:1;transform:scale(1.2)}}
  .ts{position:absolute;animation:twinkle var(--d,2s) ease-in-out infinite;
    animation-delay:var(--dl,0s);font-size:var(--s,16px);pointer-events:none;}
  @keyframes floatUp{0%{transform:translateY(8px)}50%{transform:translateY(-10px)}100%{transform:translateY(8px)}}
  .title{font-size:clamp(28px,8.5vw,54px);font-weight:800;letter-spacing:1px;
    color:#fff;position:relative;z-index:1;
    text-shadow:0 0 30px rgba(255,120,180,.8),0 4px 0 var(--pink),0 8px 24px rgba(0,0,0,.6);
    animation:titleGlow 2.5s ease-in-out infinite alternate;}
  @keyframes titleGlow{from{text-shadow:0 0 20px rgba(255,120,180,.6),0 4px 0 var(--pink),0 8px 20px rgba(0,0,0,.5)}
    to{text-shadow:0 0 45px rgba(255,160,220,1),0 4px 0 var(--pink),0 8px 30px rgba(100,0,80,.6)}}
  .sub{font-size:clamp(12px,3.4vw,16px);opacity:.92;line-height:1.6;max-width:360px;position:relative;z-index:1;}
  .pill{display:inline-block;background:rgba(255,255,255,.16);border-radius:999px;
    padding:5px 12px;font-size:12px;margin:2px;}
  .btn{appearance:none;border:none;cursor:pointer;font-family:inherit;font-weight:800;
    color:#fff;background:linear-gradient(180deg,#ff95c4,#ff5fa2);
    padding:14px 38px;border-radius:999px;font-size:clamp(17px,4.6vw,22px);
    box-shadow:0 6px 0 #d23d80,0 10px 18px rgba(0,0,0,.35);transition:transform .08s;
    position:relative;z-index:1;}
  .btn:active{transform:translateY(4px);box-shadow:0 2px 0 #d23d80;}
  .btn.ghost{background:rgba(255,255,255,.14);box-shadow:0 4px 0 rgba(0,0,0,.3);
    font-size:14px;padding:10px 22px;}
  .btn.ghost:active{box-shadow:0 1px 0 rgba(0,0,0,.3);}
  @keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.06)}}
  #startBtn{animation:pulse 1.6s ease-in-out infinite;}
  .score-big{font-size:clamp(26px,7.5vw,44px);font-weight:800;color:var(--gold);
    text-shadow:0 3px 0 rgba(0,0,0,.3);position:relative;z-index:1;}

  /* title hero svg */
  #titleHero{width:min(60vw,240px);height:auto;position:relative;z-index:1;
    animation:floatUp 2.4s ease-in-out infinite;
    filter:drop-shadow(0 0 22px rgba(255,140,210,.65));}

  /* ===== character select ===== */
  .char-grid{display:flex;gap:clamp(8px,2.4vw,16px);flex-wrap:wrap;justify-content:center;
    position:relative;z-index:1;max-width:520px;}
  .char-card{width:clamp(86px,22vw,116px);background:rgba(255,255,255,.1);
    border:3px solid rgba(255,255,255,.25);border-radius:18px;padding:8px 4px 10px;
    cursor:pointer;transition:transform .12s,border-color .12s,background .12s;}
  .char-card svg{width:76%;height:auto;display:block;margin:0 auto;}
  .char-card .cn{font-size:clamp(11px,3vw,14px);font-weight:800;margin-top:4px;}
  .char-card .ct{font-size:clamp(9px,2.4vw,11px);opacity:.8;margin-top:2px;}
  .char-card.sel{border-color:var(--gold);background:rgba(255,214,90,.18);
    transform:translateY(-6px) scale(1.05);
    box-shadow:0 8px 20px rgba(255,200,80,.35);}

  /* ===== stage map ===== */
  #mapRow{display:flex;gap:clamp(6px,2vw,14px);align-items:center;justify-content:center;
    position:relative;z-index:1;flex-wrap:wrap;max-width:560px;}
  .st-node{width:clamp(74px,17vw,100px);border-radius:18px;padding:8px 4px 9px;
    background:rgba(255,255,255,.1);border:3px solid rgba(255,255,255,.25);
    cursor:pointer;transition:transform .12s;position:relative;}
  .st-node:active{transform:scale(.94);}
  .st-node .num{font-size:11px;font-weight:800;opacity:.85;}
  .st-node .ic{font-size:clamp(24px,7vw,34px);line-height:1.2;
    filter:drop-shadow(0 2px 4px rgba(0,0,0,.4));}
  .st-node .nm{font-size:clamp(9px,2.5vw,12px);font-weight:800;line-height:1.2;}
  .st-node .strs{font-size:clamp(10px,2.8vw,13px);letter-spacing:1px;margin-top:2px;}
  .st-node.lock{opacity:.42;filter:grayscale(.8);}
  .st-node.lock::after{content:'🔒';position:absolute;top:-8px;right:-6px;font-size:18px;}
  .st-node.next{border-color:var(--gold);animation:pulse 1.6s ease-in-out infinite;
    box-shadow:0 0 18px rgba(255,210,90,.5);}
  .map-arrow{font-size:16px;opacity:.6;}

  /* HUD */
  #hud{position:absolute;top:0;left:0;right:0;
    padding:calc(var(--sat,env(safe-area-inset-top,0px)) + 8px) calc(var(--sar,env(safe-area-inset-right,0px)) + 12px) 8px calc(var(--sal,env(safe-area-inset-left,0px)) + 12px);
    display:flex;justify-content:space-between;align-items:flex-start;
    pointer-events:none;color:#fff;font-weight:800;
    text-shadow:0 2px 4px rgba(0,0,0,.45);}
  #hearts{font-size:22px;letter-spacing:2px;}
  #score{font-size:19px;}
  #score small{display:block;font-size:11px;opacity:.85;font-weight:600;}
  #stageLbl{position:absolute;top:calc(var(--sat,env(safe-area-inset-top,0px)) + 8px);
    left:50%;transform:translateX(-50%);color:#fff;font-weight:800;font-size:13px;
    text-shadow:0 2px 4px rgba(0,0,0,.5);pointer-events:none;padding-top:2px;}
  #power{position:absolute;left:50%;transform:translateX(-50%);
    bottom:calc(var(--sab,env(safe-area-inset-bottom,0px)) + 10px);
    display:flex;gap:6px;align-items:center;pointer-events:none;}
  .cell{min-width:58px;padding:7px 6px;border-radius:12px;font-size:12px;font-weight:800;
    text-align:center;color:#fff;background:rgba(40,24,70,.55);
    border:2px solid rgba(255,255,255,.25);text-shadow:0 1px 2px rgba(0,0,0,.5);line-height:1.1;}
  .cell small{display:block;font-size:9px;opacity:.8;font-weight:600;}
  .cell.lit{background:linear-gradient(180deg,#ffe27a,#ffb52e);color:#5a3a00;
    border-color:#fff;text-shadow:none;transform:translateY(-3px);
    box-shadow:0 6px 14px rgba(255,180,40,.6);}
  #pwBtn{pointer-events:auto;}
  #muteBtn{position:absolute;top:calc(var(--sat,env(safe-area-inset-top,0px)) + 6px);
    left:calc(50% + 76px);pointer-events:auto;background:rgba(255,255,255,.18);
    border:none;color:#fff;font-size:16px;width:36px;height:36px;border-radius:50%;cursor:pointer;}
  #backBtn{position:absolute;top:calc(var(--sat,env(safe-area-inset-top,0px)) + 6px);
    left:calc(50% - 112px);pointer-events:auto;background:rgba(255,255,255,.18);
    border:none;color:#fff;font-size:16px;width:36px;height:36px;border-radius:50%;cursor:pointer;}
  #toast{position:absolute;left:50%;top:30%;transform:translate(-50%,-50%) scale(.6);
    color:#fff;font-weight:800;font-size:clamp(20px,6.5vw,38px);opacity:0;
    text-shadow:0 4px 0 var(--grape),0 8px 16px rgba(0,0,0,.4);pointer-events:none;
    transition:transform .25s,opacity .25s;text-align:center;}
  #toast.show{opacity:1;transform:translate(-50%,-50%) scale(1);}
  /* boss HP */
  #bossBar{position:absolute;top:calc(var(--sat,env(safe-area-inset-top,0px)) + 44px);
    left:50%;transform:translateX(-50%);width:min(60vw,300px);pointer-events:none;}
  #bossBar .bn{color:#fff;font-weight:800;font-size:12px;text-align:center;
    text-shadow:0 2px 3px rgba(0,0,0,.6);margin-bottom:2px;}
  #bossBar .bg{height:10px;border-radius:6px;background:rgba(0,0,0,.4);
    border:2px solid rgba(255,255,255,.5);overflow:hidden;}
  #bossBar .fg{height:100%;width:100%;border-radius:4px;
    background:linear-gradient(90deg,#ff5f7a,#ffb52e);transition:width .15s;}

  /* result stars */
  .res-stars{font-size:clamp(34px,10vw,52px);letter-spacing:6px;position:relative;z-index:1;
    filter:drop-shadow(0 4px 8px rgba(0,0,0,.4));}
  .btn-row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;position:relative;z-index:1;}

  @media (max-height:480px){
    .screen{gap:6px;padding:6px 14px;overflow-y:auto;}
    #titleHero{width:110px;animation:none;}
    .title{font-size:22px !important;}
    .sub{font-size:11px !important;line-height:1.35;}
    .pill{font-size:10px !important;padding:3px 8px !important;}
    .btn{padding:8px 26px !important;font-size:15px !important;}
    .btn.ghost{padding:6px 16px !important;font-size:12px !important;}
    .char-card{width:78px;padding:5px 3px 6px;}
    .st-node{width:70px;padding:5px 3px 6px;}
    .st-node .ic{font-size:22px !important;}
    .res-stars{font-size:30px !important;}
    .deco-stars{display:none;}
  }
</style>
<script src="/games/safe_area.js"></script>
</head>
<body>
<div id="wrap"><canvas id="c"></canvas></div>

<!-- HUD -->
<div id="hud" class="hidden">
  <div id="score">0<small>ベスト 0</small></div>
  <div id="hearts">💛💛💛</div>
</div>
<div id="stageLbl" class="hidden"></div>
<button id="muteBtn" class="hidden">🔊</button>
<button id="backBtn" class="hidden">🏠</button>
<div id="bossBar" class="hidden"><div class="bn"></div><div class="bg"><div class="fg"></div></div></div>

<div id="power" class="hidden">
  <div class="cell" data-i="0">スピード<small>はやく</small></div>
  <div class="cell" data-i="1">れんしゃ<small>たくさん</small></div>
  <div class="cell" data-i="2">なかま<small>どうぶつ</small></div>
  <div class="cell" data-i="3">バリア<small>まもる</small></div>
  <button class="btn cell" id="pwBtn" style="padding:7px 14px;border-radius:14px;box-shadow:0 4px 0 #d23d80;">⭐<small style="font-size:9px">パワーアップ</small></button>
</div>

<div id="toast"></div>

<!-- ===== Title ===== -->
<div id="titleScreen" class="screen">
  <button class="btn ghost" id="backBtn" style="position:absolute;top:calc(var(--sat,env(safe-area-inset-top,0px)) + 10px);left:calc(var(--sal,env(safe-area-inset-left,0px)) + 12px);z-index:2;">← もどる</button>
  <div class="deco-stars">
    <span class="ts" style="left:8%;top:12%;--d:1.8s;--s:14px">✦</span>
    <span class="ts" style="left:20%;top:6%;--d:2.2s;--dl:.3s;--s:10px">✧</span>
    <span class="ts" style="left:75%;top:8%;--d:1.6s;--dl:.6s;--s:16px">★</span>
    <span class="ts" style="left:88%;top:18%;--d:2.5s;--dl:.1s;--s:10px">✦</span>
    <span class="ts" style="left:5%;top:38%;--d:2.0s;--dl:.9s;--s:12px">✧</span>
    <span class="ts" style="left:92%;top:42%;--d:1.9s;--dl:.4s;--s:14px">★</span>
    <span class="ts" style="left:15%;top:78%;--d:2.3s;--dl:.7s;--s:10px">✦</span>
    <span class="ts" style="left:82%;top:72%;--d:1.7s;--dl:.2s;--s:12px">✧</span>
    <span class="ts" style="left:50%;top:4%;--d:2.1s;--dl:.5s;--s:18px">⭐</span>
  </div>
  <svg id="titleHero" viewBox="0 0 200 140">
    <!-- broom -->
    <rect x="30" y="96" width="130" height="8" rx="4" fill="#b07840" transform="rotate(-8 100 100)"/>
    <path d="M152 82 L192 74 L192 106 L152 100 Z" fill="#ffd25a" transform="rotate(-8 100 100)"/>
    <!-- princess -->
    <g transform="translate(72 30)">
      <path d="M10 46 Q28 24 46 46 L50 74 L6 74 Z" fill="#ff8fc0"/>
      <path d="M14 50 Q28 36 42 50 L44 68 L12 68 Z" fill="#ffb3d6"/>
      <circle cx="28" cy="22" r="17" fill="#ffe3c8"/>
      <path d="M11 20 Q13 2 28 4 Q43 2 45 20 Q40 12 28 12 Q16 12 11 20Z" fill="#ffca6b"/>
      <path d="M20 4 L23 -3 L26 4 L28 -5 L31 4 L34 -3 L37 4 Z" fill="#ffd25a" transform="translate(-0.5 4)"/>
      <circle cx="22" cy="22" r="2.4" fill="#3a2a55"/>
      <circle cx="34" cy="22" r="2.4" fill="#3a2a55"/>
      <path d="M24 29 Q28 32 32 29" stroke="#e06a90" stroke-width="2" fill="none" stroke-linecap="round"/>
      <circle cx="17" cy="27" r="2.6" fill="#ffb3c8" opacity=".8"/>
      <circle cx="39" cy="27" r="2.6" fill="#ffb3c8" opacity=".8"/>
    </g>
    <!-- sparkles -->
    <circle cx="34" cy="40" r="4" fill="#fff" opacity=".9"/>
    <circle cx="170" cy="34" r="3" fill="#ffd25a"/>
    <circle cx="22" cy="80" r="3" fill="#ffd25a"/>
    <circle cx="182" cy="118" r="4" fill="#fff" opacity=".8"/>
  </svg>
  <div class="title">そらとびプリンセス</div>
  <div class="sub">まほうのほうきで そらのぼうけんへ！<br>5つのステージで まってるボスを たおそう！</div>
  <div style="position:relative;z-index:1">
    <span class="pill">🗺️ 5つのステージ</span>
    <span class="pill">👑 4にんのなかま</span>
    <span class="pill">⭐ ほしをあつめて</span>
  </div>
  <button class="btn" id="startBtn">▶ ぼうけんにでる</button>
</div>

<!-- ===== Character select ===== -->
<div id="charScreen" class="screen hidden">
  <div class="title" style="font-size:clamp(20px,6vw,32px)">だれで とぶ？</div>
  <div class="char-grid" id="charGrid"></div>
  <div class="btn-row">
    <button class="btn ghost" id="charBackBtn">← もどる</button>
    <button class="btn" id="charOkBtn">これにする！</button>
  </div>
</div>

<!-- ===== Stage map ===== -->
<div id="mapScreen" class="screen hidden">
  <div class="title" style="font-size:clamp(20px,6vw,32px)">ステージをえらぼう</div>
  <div id="mapRow"></div>
  <div class="sub" id="mapHint">ステージをクリアすると つぎがあくよ！</div>
  <div class="btn-row">
    <button class="btn ghost" id="mapCharBtn">👑 キャラへんこう</button>
  </div>
</div>

<!-- ===== Result ===== -->
<div id="overScreen" class="screen hidden">
  <div class="title" id="overTitle">クリア！</div>
  <div class="res-stars hidden" id="resStars"></div>
  <div class="score-big" id="finalScore">0</div>
  <div class="sub" id="bestLine">ベストスコア 0</div>
  <div class="btn-row">
    <button class="btn ghost" id="mapBtn">🗺️ マップへ</button>
    <button class="btn" id="retryBtn">🔁 もういちど</button>
    <button class="btn hidden" id="nextBtn" style="background:linear-gradient(180deg,#8de08a,#3fbf5a);box-shadow:0 6px 0 #2a8f42,0 10px 18px rgba(0,0,0,.35)">つぎへ ▶</button>
  </div>
</div>

<script>
(function(){
"use strict";
const cv=document.getElementById('c'), ctx=cv.getContext('2d');
let W=0,H=0,DPR=Math.min(window.devicePixelRatio||1,2);
function resize(){
  W=window.innerWidth; H=window.innerHeight;
  cv.width=W*DPR; cv.height=H*DPR;
  ctx.setTransform(DPR,0,0,DPR,0,0);
}
window.addEventListener('resize',resize); resize();
const $=id=>document.getElementById(id);

/* ---------- save ---------- */
const SAVE_KEY='soratobi_v3_progress';
let save={stars:{}, char:'princess'};
try{ const s=JSON.parse(localStorage.getItem(SAVE_KEY)||'null'); if(s&&s.stars) save=s; }catch(e){}
function persist(){ try{localStorage.setItem(SAVE_KEY,JSON.stringify(save));}catch(e){} }
let best=+(localStorage.getItem('soratobi_best')||0);

/* ---------- audio ---------- */
let AC=null, master=null, muted=false;
function initAudio(){
  if(AC) return;
  AC=new (window.AudioContext||window.webkitAudioContext)();
  master=AC.createGain(); master.gain.value=0.5; master.connect(AC.destination);
}
function beep(freq,dur,type,vol,glideTo){
  if(!AC||muted) return;
  const o=AC.createOscillator(), g=AC.createGain();
  o.type=type||'sine'; o.frequency.value=freq;
  if(glideTo) o.frequency.exponentialRampToValueAtTime(glideTo,AC.currentTime+dur);
  g.gain.value=0.0001;
  g.gain.exponentialRampToValueAtTime(vol||0.2,AC.currentTime+0.01);
  g.gain.exponentialRampToValueAtTime(0.0001,AC.currentTime+dur);
  o.connect(g); g.connect(master); o.start(); o.stop(AC.currentTime+dur+0.02);
}
const SE={
  shoot(){beep(880,0.07,'triangle',0.10,1320);},
  hit(){beep(180,0.18,'sawtooth',0.18,90);},
  power(){beep(660,0.12,'square',0.16,1320); setTimeout(()=>beep(990,0.14,'square',0.16,1480),90);},
  boom(){beep(120,0.3,'sawtooth',0.22,40);},
  star(){beep(1200,0.1,'sine',0.14,1800);},
  select(){beep(700,0.09,'square',0.14,1050);},
  bossIn(){[160,200,160,120].forEach((f,i)=>setTimeout(()=>beep(f,0.22,'sawtooth',0.2),i*160));},
  clear(){[523,659,784,1046,1318].forEach((f,i)=>setTimeout(()=>beep(f,0.25,'triangle',0.2),i*120));}
};
/* stage BGM: melody set per stage */
const MELODIES=[
  {m:[523,659,587,784,659,523,587,440,523,659,784,880,784,659,587,523], b:[131,131,98,98,110,110,131,131,131,131,98,98,110,110,131,131], t:230},
  {m:[440,554,494,659,554,440,494,370,440,554,659,740,659,554,494,440], b:[110,110,82,82,92,92,110,110,110,110,82,82,92,92,110,110], t:240},
  {m:[392,466,440,587,466,392,440,349,392,466,587,622,587,466,440,392], b:[98,98,78,78,87,87,98,98,98,98,78,78,87,87,98,98], t:260},
  {m:[587,698,659,880,698,587,659,523,587,698,880,932,880,698,659,587], b:[147,147,110,110,131,131,147,147,147,147,110,110,131,131,147,147], t:220},
  {m:[659,784,740,988,784,659,740,554,659,784,988,1046,988,784,740,659], b:[165,165,123,123,147,147,165,165,165,165,123,123,147,147,165,165], t:210}
];
let bgmTimer=null, bgmStep=0, bgmIdx=0;
function startBGM(idx){
  if(!AC) return;
  if(bgmTimer&&bgmIdx===idx) return;
  stopBGM(); bgmIdx=idx; bgmStep=0;
  const M=MELODIES[idx]||MELODIES[0];
  bgmTimer=setInterval(()=>{
    if(muted){bgmStep++;return;}
    beep(M.m[bgmStep%16],0.22,'triangle',0.07);
    beep(M.b[bgmStep%16],0.26,'sine',0.10);
    bgmStep++;
  },M.t);
}
function stopBGM(){ if(bgmTimer){clearInterval(bgmTimer);bgmTimer=null;} }
document.addEventListener('visibilitychange',()=>{ if(document.hidden) stopBGM(); else if(state==='play') startBGM(curStage); });
$('muteBtn').addEventListener('click',()=>{muted=!muted;$('muteBtn').textContent=muted?'🔇':'🔊';});
$('backBtn').addEventListener('click',()=>{
  stopBGM();
  if(window.parent!==window) window.parent.postMessage({type:'goBack'},'*');
  else history.back();
});

/* ---------- input ---------- */
/* relative drag: 指の移動量ぶんだけ機体が動く */
let pointer={active:false,lx:0,ly:0,dx:0,dy:0};
function pDown(e){
  const t=e.touches?e.touches[0]:e;
  pointer.active=true; pointer.lx=t.clientX; pointer.ly=t.clientY;
  pointer.dx=0; pointer.dy=0;
}
function pMove(e){
  if(!pointer.active) return;
  const t=e.touches?e.touches[0]:e;
  pointer.dx+=t.clientX-pointer.lx;
  pointer.dy+=t.clientY-pointer.ly;
  pointer.lx=t.clientX; pointer.ly=t.clientY;
}

function unlockedCount(){
  let n=1;
  for(let i=0;i<STAGES.length;i++){ if(save.stars[i]>0) n=Math.max(n,i+2); }
  return Math.min(n,STAGES.length);
}
function buildMap(){
  const row=$('mapRow'); row.innerHTML='';
  const unl=unlockedCount();
  STAGES.forEach((st,i)=>{
    if(i>0){ const a=document.createElement('span'); a.className='map-arrow'; a.textContent='▶'; row.appendChild(a); }
    const n=document.createElement('div');
    const got=save.stars[i]||0;
    const locked=i>=unl;
    n.className='st-node'+(locked?' lock':(got===0?' next':''));
    n.innerHTML='<div class="num">ステージ'+(i+1)+'</div><div class="ic">'+st.ic+'</div>'+
      '<div class="nm">'+st.name+'</div>'+
      '<div class="strs">'+('★'.repeat(got)+'☆'.repeat(3-got))+'</div>';
    if(!locked) n.addEventListener('click',()=>{SE.select();startStage(i);});
    row.appendChild(n);
  });
  const done=STAGES.every((s,i)=>(save.stars[i]||0)>0);
  $('mapHint').textContent=done?'ぜんぶクリア！★3を めざそう！':'ステージをクリアすると つぎがあくよ！';
}

/* ---------- game state ---------- */
let state='title'; // title, play, over
let curStage=0;
const P={x:120,y:0,r:20, speed:3.2, fireGap:16, dmg:1, inv:0, shield:0, fireT:0,
         options:0, optTrail:[], ch:CHARS[0]};
let bullets=[], foes=[], foeBullets=[], stars=[], parts=[], clouds=[], bgItems=[];
let score=0, lives=3;
let meterCursor=0, capsules=0;
let wave=0, waveT=0, bossActive=false, boss=null, frame=0;
const POWERS=['speed','rapid','option','shield'];
const WAVES_PER_STAGE=3;

function startStage(i){
  curStage=i;
  const ch=charById(save.char);
  P.ch=ch; P.speed=ch.speed; P.fireGap=ch.fireGap; P.dmg=ch.dmg; P.r=ch.r;
  P.x=110; P.y=H*0.5; P.inv=0; P.shield=0; P.options=0; P.optTrail=[]; P.fireT=0;
  bullets=[];foes=[];foeBullets=[];stars=[];parts=[];bgItems=[];
  score=0; lives=3; meterCursor=0; capsules=0;
  wave=0; waveT=90; bossActive=false; boss=null; frame=0;
  initClouds();
  show(null);
  $('hud').classList.remove('hidden');
  $('power').classList.remove('hidden');
  $('muteBtn').classList.remove('hidden');
  $('backBtn').classList.remove('hidden');
  $('stageLbl').classList.remove('hidden');
  $('stageLbl').textContent='ステージ'+(i+1)+' '+STAGES[i].name;
  $('bossBar').classList.add('hidden');
  updateHUD(); updateMeter();
  state='play';
  startBGM(i);
  toast(STAGES[i].ic+' '+STAGES[i].name+' スタート！');
}

function endGame(cleared){
  state='over'; stopBGM();
  $('hud').classList.add('hidden');
  $('power').classList.add('hidden');
  $('muteBtn').classList.add('hidden');
  $('backBtn').classList.add('hidden');
  $('stageLbl').classList.add('hidden');
  $('bossBar').classList.add('hidden');
  if(score>best){best=score; try{localStorage.setItem('soratobi_best',best);}catch(e){}}
  $('finalScore').textContent=score.toLocaleString();
  $('bestLine').textContent='ベストスコア '+best.toLocaleString();
  const rs=$('resStars'), nx=$('nextBtn');
  if(cleared){
    SE.clear();
    const got=Math.max(1,lives); // 残りライフ=星（最低1）
    const prev=save.stars[curStage]||0;
    if(got>prev){ save.stars[curStage]=got; persist(); }
    $('overTitle').textContent='ステージクリア！';
    rs.textContent='★'.repeat(got)+'☆'.repeat(3-got);
    rs.classList.remove('hidden');
    if(curStage<STAGES.length-1) nx.classList.remove('hidden'); else nx.classList.add('hidden');
    if(curStage===STAGES.length-1) $('overTitle').textContent='ぜんぶクリア！すごい！';
  }else{
    $('overTitle').textContent='またちょうせんしてね！';
    rs.classList.add('hidden');
    nx.classList.add('hidden');
  }
  show('overScreen');
}

/* ---------- HUD ---------- */
function updateHUD(){
  $('score').innerHTML=score.toLocaleString()+'<small>ベスト '+best.toLocaleString()+'</small>';
  $('hearts').textContent='💛'.repeat(lives)+'🖤'.repeat(Math.max(0,3-lives));
}
function updateMeter(){
  document.querySelectorAll('#power .cell[data-i]').forEach(el=>{
    el.classList.toggle('lit',+el.dataset.i===meterCursor-1);
  });
}
function toast(msg){
  const t=$('toast'); t.textContent=msg; t.classList.add('show');
  clearTimeout(t._tm); t._tm=setTimeout(()=>t.classList.remove('show'),1200);
}
function usePower(){
  if(state!=='play'||meterCursor===0) return;
  const p=POWERS[meterCursor-1];
  if(p==='speed'){ P.speed+=0.7; toast('スピードアップ！'); }
  else if(p==='rapid'){ P.fireGap=Math.max(6,P.fireGap-4); toast('れんしゃアップ！'); }
  else if(p==='option'){
    if(P.options<3){ P.options++; toast('なかまがきた！'); }
    else { P.shield=1; toast('バリア！'); }
  }
  else if(p==='shield'){ P.shield=1; toast('バリア！'); }
  SE.power(); meterCursor=0; updateMeter();
}
$('pwBtn').addEventListener('click',usePower);

/* ---------- spawning ---------- */
function rnd(a,b){return a+Math.random()*(b-a);}
function spawnWave(){
  const stg=STAGES[curStage];
  const kind=stg.foes[wave%stg.foes.length];
  const n=4+wave+curStage; // stage difficulty scaling
  for(let i=0;i<n;i++){
    const y=rnd(H*0.15,H*0.85);
    foes.push(makeFoe(kind, W+40+i*70, y, i));
  }
}
function makeFoe(kind,x,y,i){
  const base={kind,x,y,t:i*8,dead:false,hp:1,r:18,vx:-2,fireT:rnd(80,200)};
  if(kind==='bird'){ base.r=17; base.vx=-2.4; }
  if(kind==='balloon'){ base.r=19; base.vx=-1.5; base.hp=2; }
  if(kind==='bee'){ base.r=14; base.vx=-2.8; }
  if(kind==='kite'){ base.r=17; base.vx=-2.0; }
  if(kind==='bat'){ base.r=15; base.vx=-2.6; }
  if(kind==='ghost'){ base.r=18; base.vx=-1.7; base.hp=2; }
  if(kind==='ufo'){ base.r=18; base.vx=-2.2; base.hp=2; base.shoots=true; }
  if(kind==='gull'){ base.r=17; base.vx=-2.5; }
  if(kind==='fish'){ base.r=16; base.vx=-3.2; base.jump=true; base.y=H+30; base.vy=-rnd(6,9); }
  if(kind==='knight'){ base.r=19; base.vx=-1.9; base.hp=3; base.shoots=true; }
  base.hp += Math.floor(curStage/2); // later stages tougher
  return base;
}
function spawnBoss(){
  const stg=STAGES[curStage];
  bossActive=true;
  boss={type:stg.boss,x:W+140,y:H*0.5,r:64,hp:stg.bossHP,max:stg.bossHP,
        t:0,fireT:60,enter:true,phase:0,alpha:1,tx:0,ty:0};
  SE.bossIn();
  toast('⚠️ '+stg.bossName+' とうじょう！');
  $('bossBar').classList.remove('hidden');
  $('bossBar').querySelector('.bn').textContent=stg.bossName;
}

/* ---------- update ---------- */
function initClouds(){
  clouds=[];
  for(let i=0;i<7;i++) clouds.push({x:rnd(0,W),y:rnd(0,H),s:rnd(0.5,1.4),v:rnd(0.4,1.1)});
  bgItems=[];
  if(STAGES[curStage].night){
    for(let i=0;i<26;i++) bgItems.push({x:rnd(0,W),y:rnd(0,H*0.9),tw:rnd(0,6.28),k:'star'});
  }
  if(STAGES[curStage].sea){
    for(let i=0;i<4;i++) bgItems.push({x:rnd(0,W),y:0,k:'waveseed',ph:rnd(0,6.28)});
  }
  if(curStage===4){
    for(let i=0;i<3;i++) bgItems.push({x:rnd(0,W),y:rnd(H*0.1,H*0.5),k:'tower',v:rnd(0.3,0.6)});
  }
}
function hit(a,b,pad){
  const dx=a.x-b.x, dy=a.y-b.y, rr=a.r+b.r-(pad||6);
  return dx*dx+dy*dy < rr*rr;
}
function explode(x,y,col,n){
  for(let i=0;i<(n||8);i++)
    parts.push({x,y,vx:rnd(-3,3),vy:rnd(-3,3),life:rnd(18,34),col});
}
function damage(){
  if(P.inv>0) return;
  if(P.shield>0){ P.shield=0; P.inv=60; explode(P.x,P.y,'#8fd3ff',14); SE.hit(); toast('バリアがまもった！'); return; }
  lives--; P.inv=90; SE.hit(); explode(P.x,P.y,'#ff7eb6',18);
  updateHUD();
  if(lives<=0){ setTimeout(()=>endGame(false),500); state='dying'; }
}

function update(){
  frame++;
  /* --- player move --- */
  if(state==='play'){
    if(pointer.dx||pointer.dy){
      const sens=P.speed/3.2*1.15; // キャラのspeed=ドラッグ感度
      P.x+=pointer.dx*sens; P.y+=pointer.dy*sens;
      pointer.dx=0; pointer.dy=0;
    }
    let kx=0,ky=0;
    if(keys.ArrowLeft)kx-=1; if(keys.ArrowRight)kx+=1;
    if(keys.ArrowUp)ky-=1; if(keys.ArrowDown)ky+=1;
    if(kx||ky){ const d=Math.hypot(kx,ky); P.x+=kx/d*P.speed*1.9; P.y+=ky/d*P.speed*1.9; }
    P.x=Math.max(30,Math.min(W-30,P.x));
    P.y=Math.max(36,Math.min(H-60,P.y));
    if(P.inv>0)P.inv--;

    /* fire */
    P.fireT--;
    if(P.fireT<=0){
      P.fireT=P.fireGap;
      bullets.push({x:P.x+18,y:P.y,vx:8,vy:0,r:6,dmg:P.dmg,big:P.dmg>1});
      for(let i=0;i<P.options;i++){
        const tp=P.optTrail[(i+1)*12];
        if(tp) bullets.push({x:tp.x+16,y:tp.y,vx:8,vy:0,r:5,dmg:1,big:false});
      }
      if(frame%3===0) SE.shoot();
    }
    P.optTrail.unshift({x:P.x,y:P.y});
    if(P.optTrail.length>60)P.optTrail.pop();

    /* waves / boss */
    if(!bossActive){
      waveT--;
      if(waveT<=0){
        wave++;
        if(wave>WAVES_PER_STAGE){ spawnBoss(); }
        else{ spawnWave(); waveT=230; toast('ウェーブ '+wave+'／'+WAVES_PER_STAGE); }
      }
    }
    /* random star capsule */
    if(frame%150===0) stars.push({x:W+20,y:rnd(H*0.15,H*0.8),r:13,t:0});
  }

  /* bullets */
  bullets.forEach(b=>{b.x+=b.vx;b.y+=b.vy;});
  bullets=bullets.filter(b=>!b.dead&&b.x<W+30);
  foeBullets.forEach(b=>{b.x+=b.vx;b.y+=b.vy;});
  foeBullets=foeBullets.filter(b=>b.x>-30&&b.x<W+30&&b.y>-30&&b.y<H+30);

  /* foes */
  foes.forEach(f=>{
    f.t++;
    if(f.kind==='fish'){
      f.x+=f.vx; f.vy+=0.18; f.y+=f.vy;
    }else if(f.kind==='bee'||f.kind==='bat'){
      f.x+=f.vx; f.y+=Math.sin(f.t*0.12)*2.6;
    }else if(f.kind==='kite'){
      f.x+=f.vx; f.y+=Math.sin(f.t*0.05)*1.4;
    }else if(f.kind==='ghost'){
      f.x+=f.vx; f.y+=Math.sin(f.t*0.04)*1.8;
    }else{
      f.x+=f.vx; f.y+=Math.sin(f.t*0.06)*1.2;
    }
    if(f.shoots){
      f.fireT--;
      if(f.fireT<=0&&f.x<W-40&&f.x>P.x){
        f.fireT=rnd(140,220);
        const ang=Math.atan2(P.y-f.y,P.x-f.x);
        foeBullets.push({x:f.x,y:f.y,vx:Math.cos(ang)*3.4,vy:Math.sin(ang)*3.4,r:7});
      }
    }
    if(state==='play'&&!f.dead&&hit(f,P)) { f.dead=true; explode(f.x,f.y,'#fff',6); damage(); }
  });
  foes=foes.filter(f=>!f.dead&&f.x>-60&&f.y<H+80);

  /* bullet vs foe */
  bullets.forEach(b=>{
    foes.forEach(f=>{
      if(!b.dead&&!f.dead&&hit(b,f,2)){
        b.dead=true; f.hp-=b.dmg;
        if(f.hp<=0){
          f.dead=true; score+=100; SE.boom();
          explode(f.x,f.y,'#ffd25a',10);
          if(Math.random()<0.34) stars.push({x:f.x,y:f.y,r:13,t:0});
          updateHUD();
        } else explode(b.x,b.y,'#fff',3);
      }
    });
    if(bossActive&&boss&&!b.dead&&hit(b,boss)){
      b.dead=true; boss.hp-=b.dmg; explode(b.x,b.y,'#fff',3);
      $('bossBar').querySelector('.fg').style.width=Math.max(0,boss.hp/boss.max*100)+'%';
      if(boss.hp<=0){
        explode(boss.x,boss.y,'#ff5fa2',48); SE.boom(); score+=2000+curStage*500;
        boss=null; bossActive=false; updateHUD();
        state='clearing';
        setTimeout(()=>endGame(true),800);
      }
    }
  });
  bullets=bullets.filter(b=>!b.dead);

  /* boss AI */
  if(bossActive&&boss){
    boss.t++;
    updateBoss(boss);
    if(state==='play'&&hit(boss,P,10)) damage();
  }

  /* foe bullets vs player */
  if(state==='play'){
    foeBullets.forEach(b=>{
      if(hit(b,P,4)){ b.x=-999; damage(); }
    });
  }

  /* stars */
  stars.forEach(s=>{ s.x-=2; s.t++; });
  stars=stars.filter(s=>{
    if(state==='play'&&hit(s,P,0)){
      SE.star(); capsules++;
      meterCursor=meterCursor%4+1; updateMeter();
      score+=50; updateHUD();
      explode(s.x,s.y,'#ffd25a',6);
      return false;
    }
    return s.x>-20;
  });

  /* particles / clouds */
  parts.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.life--;});
  parts=parts.filter(p=>p.life>0);
  clouds.forEach(c=>{ c.x-=c.v; if(c.x<-120){c.x=W+120;c.y=rnd(0,H);} });
  bgItems.forEach(b=>{ if(b.k==='tower'){ b.x-=b.v; if(b.x<-90)b.x=W+90; } });
}

function updateBoss(b){
  if(b.enter){ b.x-=2.4; if(b.x<W-120){b.x=W-120;b.enter=false;} return; }
  const type=b.type;
  if(type==='bigbird'){
    b.y=H*0.5+Math.sin(b.t*0.022)*(H*0.3);
    b.fireT--;
    if(b.fireT<=0){
      b.fireT=52;
      for(let i=-1;i<=1;i++)
        foeBullets.push({x:b.x-46,y:b.y+i*16,vx:-4.2,vy:i*1.2,r:8});
    }
  }
  else if(type==='dragon'){
    if(b.phase===0){
      b.y=H*0.5+Math.sin(b.t*0.02)*(H*0.28);
      b.fireT--;
      if(b.fireT<=0){
        b.fireT=48;
        const ang=Math.atan2(P.y-b.y,P.x-b.x);
        for(let i=-1;i<=1;i++){
          const an=ang+i*0.25;
          foeBullets.push({x:b.x-42,y:b.y,vx:Math.cos(an)*4.4,vy:Math.sin(an)*4.4,r:9,fire:true});
        }
      }
      if(b.t%420===380){ b.phase=1; b.ty=P.y; }
    }else{ // charge
      b.x-=6.5;
      if(b.x<90){ b.phase=2; }
    }
    if(b.phase===2){ b.x+=3.4; if(b.x>=W-120){b.x=W-120;b.phase=0;} }
  }
  else if(type==='ghostking'){
    b.y=H*0.5+Math.sin(b.t*0.018)*(H*0.3);
    // fade cycle
    const cyc=b.t%300;
    b.alpha = cyc<200 ? 1 : (cyc<230 ? 1-(cyc-200)/30*0.75 : (cyc<270?0.25:0.25+(cyc-270)/30*0.75));
    b.fireT--;
    if(b.fireT<=0&&b.alpha>0.6){
      b.fireT=64;
      const ang=Math.atan2(P.y-b.y,P.x-b.x);
      foeBullets.push({x:b.x-40,y:b.y,vx:Math.cos(ang)*4.0,vy:Math.sin(ang)*4.0,r:9,ghost:true});
      if(foes.length<5&&Math.random()<0.5)
        foes.push(makeFoe('ghost',W+30,rnd(H*0.2,H*0.8),0));
    }
  }
  else if(type==='kraken'){
    // rise & dive
    const cyc=b.t%360;
    if(cyc<180) b.y=H*0.62+Math.sin(b.t*0.02)*30;
    else b.y=H*0.62+Math.sin((cyc-180)/180*Math.PI)* -H*0.34 + Math.sin(b.t*0.02)*20;
    b.fireT--;
    if(b.fireT<=0){
      b.fireT=70;
      for(let i=0;i<3;i++)
        foeBullets.push({x:b.x-40,y:b.y-20+i*20,vx:-2.6-i*0.4,vy:rnd(-0.8,0.8),r:11,ink:true});
    }
  }
  else if(type==='witch'){
    // teleport
    if(b.t%240===200){ b.tp=30; explode(b.x,b.y,'#ce93d8',16); }
    if(b.tp>0){
      b.tp--; b.alpha=b.tp/30;
      if(b.tp===0){ b.x=rnd(W*0.55,W-100); b.y=rnd(H*0.2,H*0.8); b.alpha=1; }
    }else{
      b.alpha=1;
      b.y+=Math.sin(b.t*0.03)*1.6;
      b.fireT--;
      if(b.fireT<=0){
        b.fireT= b.hp<b.max*0.4 ? 50 : 66;
        const n=8;
        for(let i=0;i<n;i++){
          const an=b.t*0.01+i/n*Math.PI*2;
          foeBullets.push({x:b.x,y:b.y,vx:Math.cos(an)*3.2,vy:Math.sin(an)*3.2,r:8,starB:true});
        }
      }
    }
  }
}

/* ---------- drawing ---------- */
function drawBG(){
  const stg=STAGES[curStage];
  const g=ctx.createLinearGradient(0,0,0,H);
  g.addColorStop(0,stg.sky[0]); g.addColorStop(1,stg.sky[1]);
  ctx.fillStyle=g; ctx.fillRect(0,0,W,H);
  // night stars
  bgItems.forEach(b=>{
    if(b.k==='star'){
      const a=0.4+0.6*Math.abs(Math.sin(frame*0.03+b.tw));
      ctx.fillStyle='rgba(255,255,240,'+a.toFixed(2)+')';
      ctx.beginPath();ctx.arc(b.x,b.y,1.6,0,7);ctx.fill();
    }
    if(b.k==='tower'){ // cloud castle towers
      ctx.fillStyle='rgba(255,255,255,.55)';
      ctx.fillRect(b.x,b.y,44,H);
      ctx.beginPath();
      ctx.moveTo(b.x-6,b.y);ctx.lineTo(b.x+22,b.y-42);ctx.lineTo(b.x+50,b.y);ctx.closePath();
      ctx.fillStyle='rgba(255,182,220,.7)';ctx.fill();
    }
  });
  if(stg.night){
    // moon
    ctx.fillStyle='#fff6c9';
    ctx.beginPath();ctx.arc(W*0.82,H*0.16,34,0,7);ctx.fill();
    ctx.fillStyle=stg.sky[0];
    ctx.beginPath();ctx.arc(W*0.82+13,H*0.16-6,30,0,7);ctx.fill();
  }else if(curStage===1){
    // sunset sun
    ctx.fillStyle='rgba(255,120,60,.85)';
    ctx.beginPath();ctx.arc(W*0.8,H*0.75,52,0,7);ctx.fill();
  }
  // clouds
  clouds.forEach(c=>{
    ctx.fillStyle=stg.night?'rgba(255,255,255,.14)':'rgba(255,255,255,.8)';
    ctx.beginPath();
    ctx.arc(c.x,c.y,26*c.s,0,7);
    ctx.arc(c.x+22*c.s,c.y+6*c.s,18*c.s,0,7);
    ctx.arc(c.x-22*c.s,c.y+7*c.s,17*c.s,0,7);
    ctx.fill();
  });
  // sea
  if(stg.sea){
    const sy=H*0.8;
    ctx.fillStyle='#2f9fd8';
    ctx.beginPath();ctx.moveTo(0,H);ctx.lineTo(0,sy);
    for(let x=0;x<=W;x+=24)
      ctx.lineTo(x, sy+Math.sin(x*0.04+frame*0.06)*6);
    ctx.lineTo(W,H);ctx.closePath();ctx.fill();
    ctx.strokeStyle='rgba(255,255,255,.6)';ctx.lineWidth=2;
    ctx.beginPath();
    for(let x=0;x<=W;x+=24){
      const y=sy+Math.sin(x*0.04+frame*0.06)*6;
      if(x===0)ctx.moveTo(x,y);else ctx.lineTo(x,y);
    }
    ctx.stroke();
  }
}

/* player (vector broom rider) */
function drawPlayer(){
  const c=P.ch;
  if(P.inv>0&&(frame>>2)%2===0) return;
  ctx.save();
  ctx.translate(P.x,P.y);
  const bob=Math.sin(frame*0.1)*2;
  ctx.translate(0,bob);
  const sc=P.r/20;
  ctx.scale(sc,sc);
  // shield
  if(P.shield>0){
    ctx.strokeStyle='rgba(120,200,255,.85)';ctx.lineWidth=3;
    ctx.beginPath();ctx.arc(0,0,30,0,7);ctx.stroke();
    ctx.fillStyle='rgba(120,200,255,.12)';ctx.fill();
  }
  // broom
  ctx.save();ctx.rotate(-0.1);
  ctx.fillStyle='#b07840';ctx.fillRect(-26,10,46,5);
  ctx.fillStyle='#ffd25a';
  ctx.beginPath();ctx.moveTo(20,4);ctx.lineTo(38,0);ctx.lineTo(38,22);ctx.lineTo(20,17);ctx.closePath();ctx.fill();
  ctx.restore();
  // fairy wings
  if(c.id==='fairy'){
    ctx.fillStyle='rgba(220,255,240,.85)';
    ctx.beginPath();ctx.ellipse(-12,-4,7,12,-0.4,0,7);ctx.fill();
    ctx.beginPath();ctx.ellipse(-4,-6,6,11,0.3,0,7);ctx.fill();
  }
  // dress
  ctx.fillStyle=c.body;
  ctx.beginPath();ctx.moveTo(-9,2);ctx.quadraticCurveTo(0,-10,9,2);ctx.lineTo(12,16);ctx.lineTo(-12,16);ctx.closePath();ctx.fill();
  ctx.fillStyle=c.body2;
  ctx.beginPath();ctx.moveTo(-6,4);ctx.quadraticCurveTo(0,-3,6,4);ctx.lineTo(7,13);ctx.lineTo(-7,13);ctx.closePath();ctx.fill();
  // head
  ctx.fillStyle='#ffe3c8';
  ctx.beginPath();ctx.arc(0,-13,9,0,7);ctx.fill();
  // hair
  ctx.fillStyle=c.hair;
  ctx.beginPath();ctx.arc(0,-16,9,Math.PI*0.95,Math.PI*2.05);ctx.fill();
  // crown / hat
  if(c.id==='mage'){
    ctx.fillStyle=c.crown;
    ctx.beginPath();ctx.moveTo(-8,-21);ctx.lineTo(0,-36);ctx.lineTo(8,-21);ctx.closePath();ctx.fill();
    ctx.fillStyle='#ffd25a';ctx.beginPath();ctx.arc(0,-34,2.4,0,7);ctx.fill();
  }else{
    ctx.fillStyle=c.crown;
    ctx.beginPath();
    ctx.moveTo(-6,-22);ctx.lineTo(-4,-27);ctx.lineTo(-2,-22);ctx.lineTo(0,-28);
    ctx.lineTo(2,-22);ctx.lineTo(4,-27);ctx.lineTo(6,-22);ctx.closePath();ctx.fill();
  }
  // face
  ctx.fillStyle='#3a2a55';
  ctx.beginPath();ctx.arc(-3,-13,1.4,0,7);ctx.fill();
  ctx.beginPath();ctx.arc(3,-13,1.4,0,7);ctx.fill();
  ctx.strokeStyle='#e06a90';ctx.lineWidth=1.4;
  ctx.beginPath();ctx.arc(0,-10,2.4,0.2,Math.PI-0.2);ctx.stroke();
  ctx.restore();
  // sparkle trail
  if(frame%4===0) parts.push({x:P.x-24,y:P.y+bob+12,vx:-1.6,vy:rnd(-0.5,0.5),life:16,col:'#ffd25a'});
}

/* animal companions (vector) */
const ANIMAL_COLS=[['#fff','#ffb3c8'],['#ffca6b','#fff'],['#b07840','#e8c9a0']]; // rabbit cat bear
function drawOptions(){
  for(let i=0;i<P.options;i++){
    const tp=P.optTrail[(i+1)*12];
    if(!tp) continue;
    const [c1,c2]=ANIMAL_COLS[i%3];
    ctx.save();ctx.translate(tp.x,tp.y+Math.sin((frame+i*20)*0.1)*2.5);
    // body
    ctx.fillStyle=c1;
    ctx.beginPath();ctx.arc(0,0,10,0,7);ctx.fill();
    // ears
    if(i%3===0){ // rabbit
      ctx.fillStyle=c1;
      ctx.beginPath();ctx.ellipse(-4,-11,2.6,7,-0.15,0,7);ctx.fill();
      ctx.beginPath();ctx.ellipse(4,-11,2.6,7,0.15,0,7);ctx.fill();
      ctx.fillStyle=c2;
      ctx.beginPath();ctx.ellipse(-4,-10,1.2,4.4,-0.15,0,7);ctx.fill();
      ctx.beginPath();ctx.ellipse(4,-10,1.2,4.4,0.15,0,7);ctx.fill();
    }else if(i%3===1){ // cat
      ctx.fillStyle=c1;
      ctx.beginPath();ctx.moveTo(-8,-5);ctx.lineTo(-6,-13);ctx.lineTo(-1,-8);ctx.closePath();ctx.fill();
      ctx.beginPath();ctx.moveTo(8,-5);ctx.lineTo(6,-13);ctx.lineTo(1,-8);ctx.closePath();ctx.fill();
    }else{ // bear
      ctx.fillStyle=c1;
      ctx.beginPath();ctx.arc(-6,-8,3.6,0,7);ctx.fill();
      ctx.beginPath();ctx.arc(6,-8,3.6,0,7);ctx.fill();
    }
    // face
    ctx.fillStyle='#3a2a55';
    ctx.beginPath();ctx.arc(-3,-1,1.3,0,7);ctx.fill();
    ctx.beginPath();ctx.arc(3,-1,1.3,0,7);ctx.fill();
    ctx.fillStyle='#e06a90';
    ctx.beginPath();ctx.arc(0,2.5,1.4,0,7);ctx.fill();
    ctx.restore();
  }
}

/* enemies (vector) */
function drawFoe(f){
  ctx.save();ctx.translate(f.x,f.y);
  const k=f.kind;
  if(k==='bird'||k==='gull'){
    const flap=Math.sin(f.t*0.3)*8;
    ctx.fillStyle=k==='gull'?'#fff':'#7fb8ff';
    ctx.beginPath();ctx.ellipse(0,0,13,9,0,0,7);ctx.fill();
    ctx.beginPath();ctx.moveTo(-2,-2);ctx.quadraticCurveTo(-4,-14-flap,-16,-8-flap);ctx.quadraticCurveTo(-8,-2,-2,-2);ctx.fill();
    ctx.fillStyle='#ffb52e';
    ctx.beginPath();ctx.moveTo(-13,0);ctx.lineTo(-20,2);ctx.lineTo(-13,4);ctx.closePath();ctx.fill();
    ctx.fillStyle='#3a2a55';ctx.beginPath();ctx.arc(-8,-2,1.7,0,7);ctx.fill();
  }
  else if(k==='balloon'){
    ctx.fillStyle='#ff8a8a';
    ctx.beginPath();ctx.ellipse(0,-4,13,15,0,0,7);ctx.fill();
    ctx.fillStyle='rgba(255,255,255,.5)';
    ctx.beginPath();ctx.ellipse(-4,-9,4,6,0.4,0,7);ctx.fill();
    ctx.strokeStyle='#a05050';ctx.lineWidth=1.4;
    ctx.beginPath();ctx.moveTo(0,11);ctx.quadraticCurveTo(3,16,0,20);ctx.stroke();
    ctx.fillStyle='#3a2a55';
    ctx.beginPath();ctx.arc(-4,-5,1.6,0,7);ctx.fill();
    ctx.beginPath();ctx.arc(4,-5,1.6,0,7);ctx.fill();
    ctx.strokeStyle='#3a2a55';ctx.lineWidth=1.3;
    ctx.beginPath();ctx.arc(0,-1,3,0.3,Math.PI-0.3);ctx.stroke();
  }
  else if(k==='bee'){
    ctx.fillStyle='#ffd25a';
    ctx.beginPath();ctx.ellipse(0,0,12,9,0,0,7);ctx.fill();
    ctx.fillStyle='#5a4a20';
    ctx.fillRect(-4,-9,4,18); ctx.fillRect(4,-8,4,16);
    const w=Math.sin(f.t*0.6)*4;
    ctx.fillStyle='rgba(220,240,255,.85)';
    ctx.beginPath();ctx.ellipse(-2,-11+w*0.3,6,4+w*0.5,0,0,7);ctx.fill();
    ctx.fillStyle='#3a2a55';ctx.beginPath();ctx.arc(-8,-2,1.6,0,7);ctx.fill();
  }
  else if(k==='kite'){
    ctx.rotate(Math.sin(f.t*0.05)*0.2);
    ctx.fillStyle='#ff9a56';
    ctx.beginPath();ctx.moveTo(0,-16);ctx.lineTo(12,0);ctx.lineTo(0,16);ctx.lineTo(-12,0);ctx.closePath();ctx.fill();
    ctx.strokeStyle='#fff';ctx.lineWidth=1.6;
    ctx.beginPath();ctx.moveTo(0,-16);ctx.lineTo(0,16);ctx.moveTo(-12,0);ctx.lineTo(12,0);ctx.stroke();
    ctx.fillStyle='#3a2a55';
    ctx.beginPath();ctx.arc(-3,-3,1.5,0,7);ctx.fill();
    ctx.beginPath();ctx.arc(3,-3,1.5,0,7);ctx.fill();
  }
  else if(k==='bat'){
    const flap=Math.sin(f.t*0.4)*6;
    ctx.fillStyle='#7b5bd6';
    ctx.beginPath();ctx.arc(0,0,9,0,7);ctx.fill();
    ctx.beginPath();ctx.moveTo(-7,-2);ctx.quadraticCurveTo(-18,-8-flap,-22,2);ctx.quadraticCurveTo(-14,2,-7,4);ctx.fill();
    ctx.beginPath();ctx.moveTo(7,-2);ctx.quadraticCurveTo(18,-8-flap,22,2);ctx.quadraticCurveTo(14,2,7,4);ctx.fill();
    ctx.beginPath();ctx.moveTo(-5,-7);ctx.lineTo(-3,-13);ctx.lineTo(-1,-8);ctx.closePath();ctx.fill();
    ctx.beginPath();ctx.moveTo(5,-7);ctx.lineTo(3,-13);ctx.lineTo(1,-8);ctx.closePath();ctx.fill();
    ctx.fillStyle='#ffd25a';
    ctx.beginPath();ctx.arc(-3,-1,1.6,0,7);ctx.fill();
    ctx.beginPath();ctx.arc(3,-1,1.6,0,7);ctx.fill();
  }
  else if(k==='ghost'){
    ctx.globalAlpha=0.88;
    ctx.fillStyle='#eef2ff';
    ctx.beginPath();ctx.arc(0,-3,12,Math.PI,0);
    ctx.lineTo(12,10);
    for(let i=2;i>=-2;i--) ctx.quadraticCurveTo(i*6+3,14,i*6,10);
    ctx.closePath();ctx.fill();
    ctx.fillStyle='#3a2a55';
    ctx.beginPath();ctx.arc(-4,-4,2,0,7);ctx.fill();
    ctx.beginPath();ctx.arc(4,-4,2,0,7);ctx.fill();
    ctx.beginPath();ctx.arc(0,2,2.6,0,Math.PI);ctx.fill();
    ctx.globalAlpha=1;
  }
  else if(k==='ufo'){
    ctx.fillStyle='#9fd8e8';
    ctx.beginPath();ctx.ellipse(0,-4,9,8,0,Math.PI,0);ctx.fill();
    ctx.fillStyle='#b8b8d0';
    ctx.beginPath();ctx.ellipse(0,0,17,6,0,0,7);ctx.fill();
    ctx.fillStyle='#ffd25a';
    for(let i=-1;i<=1;i++){ctx.beginPath();ctx.arc(i*9,1,2,0,7);ctx.fill();}
    ctx.fillStyle='#3a2a55';
    ctx.beginPath();ctx.arc(-3,-5,1.4,0,7);ctx.fill();
    ctx.beginPath();ctx.arc(3,-5,1.4,0,7);ctx.fill();
  }
  else if(k==='fish'){
    ctx.rotate(Math.atan2(f.vy,f.vx)*0.4);
    ctx.fillStyle='#6fb8ff';
    ctx.beginPath();ctx.ellipse(0,0,13,8,0,0,7);ctx.fill();
    ctx.beginPath();ctx.moveTo(11,0);ctx.lineTo(19,-7);ctx.lineTo(19,7);ctx.closePath();ctx.fill();
    ctx.fillStyle='#fff';
    ctx.beginPath();ctx.arc(-6,-2,2.6,0,7);ctx.fill();
    ctx.fillStyle='#3a2a55';
    ctx.beginPath();ctx.arc(-6,-2,1.3,0,7);ctx.fill();
  }
  else if(k==='knight'){
    ctx.fillStyle='#c8ccd8';
    ctx.beginPath();ctx.arc(0,-6,9,0,7);ctx.fill(); // helmet
    ctx.fillStyle='#8a90a8';
    ctx.fillRect(-9,-6,18,4);
    ctx.fillStyle='#c8ccd8';
    ctx.beginPath();ctx.moveTo(-8,2);ctx.lineTo(8,2);ctx.lineTo(6,16);ctx.lineTo(-6,16);ctx.closePath();ctx.fill();
    ctx.fillStyle='#ff5f7a';
    ctx.beginPath();ctx.moveTo(0,-15);ctx.quadraticCurveTo(6,-20,4,-12);ctx.closePath();ctx.fill(); // plume
    ctx.fillStyle='#3a2a55';
    ctx.fillRect(-5,-6,3,2); ctx.fillRect(2,-6,3,2);
  }
  ctx.restore();
}

/* bosses (unique vector designs) */
function drawBoss(b){
  ctx.save();ctx.translate(b.x,b.y);
  ctx.globalAlpha=b.alpha!=null?b.alpha:1;
  const t=b.t;
  if(b.type==='bigbird'){
    const flap=Math.sin(t*0.18)*16;
    ctx.fillStyle='#5aa8f0';
    // wings
    ctx.beginPath();ctx.moveTo(-8,-10);ctx.quadraticCurveTo(-30,-56-flap,-76,-30-flap);ctx.quadraticCurveTo(-44,-6,-8,4);ctx.fill();
    ctx.beginPath();ctx.moveTo(-8,10);ctx.quadraticCurveTo(-30,56+flap,-76,30+flap);ctx.quadraticCurveTo(-44,6,-8,-4);ctx.fill();
    // body
    ctx.fillStyle='#7fb8ff';
    ctx.beginPath();ctx.ellipse(0,0,44,36,0,0,7);ctx.fill();
    ctx.fillStyle='#dceeff';
    ctx.beginPath();ctx.ellipse(6,8,26,20,0,0,7);ctx.fill();
    // beak
    ctx.fillStyle='#ffb52e';
    ctx.beginPath();ctx.moveTo(-42,-2);ctx.lineTo(-62,6);ctx.lineTo(-42,12);ctx.closePath();ctx.fill();
    // eye (angry)
    ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(-24,-12,8,0,7);ctx.fill();
    ctx.fillStyle='#3a2a55';ctx.beginPath();ctx.arc(-26,-11,4,0,7);ctx.fill();
    ctx.strokeStyle='#3a2a55';ctx.lineWidth=3;
    ctx.beginPath();ctx.moveTo(-34,-22);ctx.lineTo(-16,-16);ctx.stroke();
    // crest
    ctx.fillStyle='#ff5f7a';
    ctx.beginPath();ctx.moveTo(6,-34);ctx.quadraticCurveTo(18,-52,26,-36);ctx.quadraticCurveTo(30,-48,38,-30);ctx.quadraticCurveTo(20,-26,6,-30);ctx.fill();
  }
  else if(b.type==='dragon'){
    const und=Math.sin(t*0.1)*6;
    // tail
    ctx.strokeStyle='#e05a3a';ctx.lineWidth=16;ctx.lineCap='round';
    ctx.beginPath();ctx.moveTo(30,0);
    ctx.quadraticCurveTo(66,und*2,86,-und*2);
    ctx.stroke();
    // wings
    const flap=Math.sin(t*0.16)*14;
    ctx.fillStyle='#a83a20';
    ctx.beginPath();ctx.moveTo(6,-16);ctx.quadraticCurveTo(20,-58-flap,58,-44-flap);ctx.quadraticCurveTo(30,-16,6,-8);ctx.fill();
    // body
    ctx.fillStyle='#ff7a4a';
    ctx.beginPath();ctx.ellipse(6,0,40,32,0,0,7);ctx.fill();
    ctx.fillStyle='#ffd8a0';
    ctx.beginPath();ctx.ellipse(-8,10,20,16,0,0,7);ctx.fill();
    // head
    ctx.fillStyle='#ff7a4a';
    ctx.beginPath();ctx.ellipse(-40,-8,22,18,0,0,7);ctx.fill();
    // snout + fire glow
    ctx.fillStyle='#ffd8a0';
    ctx.beginPath();ctx.ellipse(-56,-2,12,9,0,0,7);ctx.fill();
    ctx.fillStyle='rgba(255,180,60,'+(0.4+0.3*Math.sin(t*0.2))+')';
    ctx.beginPath();ctx.arc(-66,-2,7,0,7);ctx.fill();
    // horns
    ctx.fillStyle='#ffe8c8';
    ctx.beginPath();ctx.moveTo(-44,-22);ctx.lineTo(-50,-38);ctx.lineTo(-38,-26);ctx.closePath();ctx.fill();
    ctx.beginPath();ctx.moveTo(-32,-22);ctx.lineTo(-34,-36);ctx.lineTo(-24,-24);ctx.closePath();ctx.fill();
    // eye
    ctx.fillStyle='#ffd25a';ctx.beginPath();ctx.arc(-44,-12,5,0,7);ctx.fill();
    ctx.fillStyle='#3a2a55';ctx.beginPath();ctx.arc(-46,-12,2.4,0,7);ctx.fill();
    // spikes
    ctx.fillStyle='#a83a20';
    for(let i=0;i<3;i++){
      ctx.beginPath();ctx.moveTo(-6+i*18,-30);ctx.lineTo(0+i*18,-42);ctx.lineTo(8+i*18,-30);ctx.closePath();ctx.fill();
    }
  }
  else if(b.type==='ghostking'){
    const wob=Math.sin(t*0.08)*4;
    ctx.fillStyle='#eef2ff';
    ctx.beginPath();ctx.arc(0,-14+wob*0.3,44,Math.PI,0);
    ctx.lineTo(44,34);
    for(let i=3;i>=-3;i--) ctx.quadraticCurveTo(i*13+6,46+wob,i*13,34);
    ctx.closePath();ctx.fill();
    // crown
    ctx.fillStyle='#ffd25a';
    ctx.beginPath();
    ctx.moveTo(-24,-52);ctx.lineTo(-24,-70);ctx.lineTo(-12,-58);ctx.lineTo(0,-74);
    ctx.lineTo(12,-58);ctx.lineTo(24,-70);ctx.lineTo(24,-52);ctx.closePath();ctx.fill();
    ctx.fillStyle='#ff5f7a';ctx.beginPath();ctx.arc(0,-60,3.6,0,7);ctx.fill();
    // face
    ctx.fillStyle='#3a2a55';
    ctx.beginPath();ctx.ellipse(-14,-16,6,9,0.2,0,7);ctx.fill();
    ctx.beginPath();ctx.ellipse(14,-16,6,9,-0.2,0,7);ctx.fill();
    ctx.beginPath();ctx.arc(0,4,9,0,Math.PI);ctx.fill();
    // blush
    ctx.fillStyle='rgba(180,190,255,.7)';
    ctx.beginPath();ctx.arc(-26,-4,5,0,7);ctx.fill();
    ctx.beginPath();ctx.arc(26,-4,5,0,7);ctx.fill();
  }
  else if(b.type==='kraken'){
    // tentacles
    ctx.strokeStyle='#c05aa0';ctx.lineWidth=14;ctx.lineCap='round';
    for(let i=0;i<5;i++){
      const ph=t*0.06+i*1.2;
      ctx.beginPath();
      ctx.moveTo(-10+i*10-20,26);
      ctx.quadraticCurveTo(-20+i*14-20+Math.sin(ph)*16, 66, -30+i*18-16+Math.cos(ph)*20, 96);
      ctx.stroke();
    }
    // head
    ctx.fillStyle='#e070b8';
    ctx.beginPath();ctx.ellipse(0,-6,46,42,0,0,7);ctx.fill();
    ctx.fillStyle='#f0a0d0';
    ctx.beginPath();ctx.ellipse(0,6,32,24,0,0,7);ctx.fill();
    // bandana
    ctx.fillStyle='#3a5ad0';
    ctx.beginPath();ctx.ellipse(0,-34,40,12,0,Math.PI,0);ctx.fill();
    ctx.beginPath();ctx.moveTo(34,-38);ctx.lineTo(56,-30);ctx.lineTo(40,-24);ctx.closePath();ctx.fill();
    // eyes
    ctx.fillStyle='#fff';
    ctx.beginPath();ctx.arc(-16,-10,9,0,7);ctx.fill();
    ctx.beginPath();ctx.arc(16,-10,9,0,7);ctx.fill();
    ctx.fillStyle='#3a2a55';
    ctx.beginPath();ctx.arc(-18,-9,4.4,0,7);ctx.fill();
    ctx.beginPath();ctx.arc(14,-9,4.4,0,7);ctx.fill();
    // mouth
    ctx.strokeStyle='#903070';ctx.lineWidth=3;
    ctx.beginPath();ctx.arc(0,8,8,0.2,Math.PI-0.2);ctx.stroke();
  }
  else if(b.type==='witch'){
    const wob=Math.sin(t*0.07)*3;
    // broom
    ctx.save();ctx.rotate(-0.12);
    ctx.fillStyle='#7a4a20';ctx.fillRect(-56,30,112,8);
    ctx.fillStyle='#c8a050';
    ctx.beginPath();ctx.moveTo(52,24);ctx.lineTo(84,18);ctx.lineTo(84,50);ctx.lineTo(52,42);ctx.closePath();ctx.fill();
    ctx.restore();
    // robe
    ctx.fillStyle='#6a3aa0';
    ctx.beginPath();ctx.moveTo(-22,-8+wob);ctx.quadraticCurveTo(0,-34+wob,22,-8+wob);
    ctx.lineTo(32,34);ctx.lineTo(-32,34);ctx.closePath();ctx.fill();
    ctx.fillStyle='#8a5ac8';
    ctx.beginPath();ctx.moveTo(-14,-6+wob);ctx.quadraticCurveTo(0,-22+wob,14,-6+wob);
    ctx.lineTo(18,26);ctx.lineTo(-18,26);ctx.closePath();ctx.fill();
    // head
    ctx.fillStyle='#ffe3c8';
    ctx.beginPath();ctx.arc(0,-30+wob,17,0,7);ctx.fill();
    // hair
    ctx.fillStyle='#40286a';
    ctx.beginPath();ctx.arc(0,-36+wob,17,Math.PI*0.9,Math.PI*2.1);ctx.fill();
    ctx.beginPath();ctx.moveTo(-16,-32+wob);ctx.quadraticCurveTo(-24,-10+wob,-18,6+wob);ctx.lineTo(-12,-20+wob);ctx.fill();
    ctx.beginPath();ctx.moveTo(16,-32+wob);ctx.quadraticCurveTo(24,-10+wob,18,6+wob);ctx.lineTo(12,-20+wob);ctx.fill();
    // big hat
    ctx.fillStyle='#40286a';
    ctx.beginPath();ctx.ellipse(0,-46+wob,30,8,0,0,7);ctx.fill();
    ctx.beginPath();ctx.moveTo(-16,-48+wob);ctx.quadraticCurveTo(2,-96+wob,14,-50+wob);ctx.closePath();ctx.fill();
    ctx.fillStyle='#ffd25a';
    ctx.beginPath();ctx.arc(6,-84+wob,4,0,7);ctx.fill();
    ctx.fillStyle='#ff5f7a';
    ctx.fillRect(-16,-52+wob,30,5);
    // face
    ctx.fillStyle='#3a2a55';
    ctx.beginPath();ctx.arc(-6,-30+wob,2.4,0,7);ctx.fill();
    ctx.beginPath();ctx.arc(6,-30+wob,2.4,0,7);ctx.fill();
    ctx.strokeStyle='#c05a80';ctx.lineWidth=2;
    ctx.beginPath();ctx.arc(0,-24+wob,4,0.3,Math.PI-0.3);ctx.stroke();
    // wand
    ctx.strokeStyle='#c8a050';ctx.lineWidth=4;
    ctx.beginPath();ctx.moveTo(-26,-14+wob);ctx.lineTo(-44,-34+wob);ctx.stroke();
    const gl=0.5+0.5*Math.sin(t*0.15);
    ctx.fillStyle='rgba(255,210,90,'+(0.5+gl*0.5)+')';
    drawStarShape(-46,-38+wob,7+gl*2);
  }
  ctx.globalAlpha=1;
  ctx.restore();
}
function drawStarShape(x,y,r){
  ctx.beginPath();
  for(let i=0;i<10;i++){
    const an=-Math.PI/2+i*Math.PI/5;
    const rr=i%2===0?r:r*0.45;
    const px=x+Math.cos(an)*rr, py=y+Math.sin(an)*rr;
    if(i===0)ctx.moveTo(px,py);else ctx.lineTo(px,py);
  }
  ctx.closePath();ctx.fill();
}

function draw(){
  drawBG();
  // stars (capsules)
  stars.forEach(s=>{
    ctx.save();ctx.translate(s.x,s.y);ctx.rotate(Math.sin(s.t*0.08)*0.3);
    ctx.fillStyle='#ffd25a';
    drawStarShape(0,0,13);
    ctx.fillStyle='rgba(255,255,255,.7)';
    ctx.beginPath();ctx.arc(-3,-3,2.4,0,7);ctx.fill();
    ctx.restore();
  });
  // foes
  foes.forEach(drawFoe);
  // boss
  if(bossActive&&boss) drawBoss(boss);
  // player bullets
  bullets.forEach(b=>{
    if(b.big){
      ctx.fillStyle='#7fd0ff';
      ctx.beginPath();ctx.ellipse(b.x,b.y,11,6,0,0,7);ctx.fill();
      ctx.fillStyle='#fff';
      ctx.beginPath();ctx.ellipse(b.x-2,b.y,5,3,0,0,7);ctx.fill();
    }else{
      ctx.fillStyle='#fff';
      ctx.beginPath();ctx.ellipse(b.x,b.y,8,4,0,0,7);ctx.fill();
      ctx.fillStyle='#ffd25a';
      ctx.beginPath();ctx.arc(b.x+3,b.y,2.6,0,7);ctx.fill();
    }
  });
  // foe bullets
  foeBullets.forEach(b=>{
    if(b.fire){
      ctx.fillStyle='#ff7a30';
      ctx.beginPath();ctx.arc(b.x,b.y,b.r,0,7);ctx.fill();
      ctx.fillStyle='#ffd25a';
      ctx.beginPath();ctx.arc(b.x+2,b.y,b.r*0.5,0,7);ctx.fill();
    }else if(b.ink){
      ctx.fillStyle='#404060';
      ctx.beginPath();ctx.arc(b.x,b.y,b.r,0,7);ctx.fill();
      ctx.fillStyle='rgba(255,255,255,.3)';
      ctx.beginPath();ctx.arc(b.x-3,b.y-3,b.r*0.34,0,7);ctx.fill();
    }else if(b.starB){
      ctx.fillStyle='#c887ff';
      ctx.save();ctx.translate(b.x,b.y);ctx.rotate(frame*0.1);
      drawStarShape(0,0,b.r+2);
      ctx.restore();
    }else if(b.ghost){
      ctx.fillStyle='rgba(200,210,255,.9)';
      ctx.beginPath();ctx.arc(b.x,b.y,b.r,0,7);ctx.fill();
    }else{
      ctx.fillStyle='#ff6a9a';
      ctx.beginPath();ctx.arc(b.x,b.y,b.r,0,7);ctx.fill();
      ctx.fillStyle='rgba(255,255,255,.5)';
      ctx.beginPath();ctx.arc(b.x-2,b.y-2,b.r*0.4,0,7);ctx.fill();
    }
  });
  // options + player
  drawOptions();
  if(state==='play'||state==='clearing') drawPlayer();
  // particles
  parts.forEach(p=>{
    ctx.globalAlpha=Math.min(1,p.life/20);
    ctx.fillStyle=p.col;
    ctx.beginPath();ctx.arc(p.x,p.y,3,0,7);ctx.fill();
  });
  ctx.globalAlpha=1;
}

/* ---------- loop ---------- */
function loop(){
  if(state==='play'||state==='dying'||state==='clearing') update();
  else frame++;
  if(state!=='title'||true) draw();
  requestAnimationFrame(loop);
}
P.y=H*0.5;
initClouds();
loop();

/* back-navigation helper for wrapper */
window.addEventListener('message',e=>{
  if(e&&e.data&&e.data.type==='pause'){ stopBGM(); }
});
})();
</script>
