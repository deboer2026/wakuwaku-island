<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>ほしぞらアニマルレスキュー</title>
  <style>
    :root{ --sky1:#3a4a9e; --sky2:#7b6fd8; --pink:#ff9ecb; --mint:#7be0c8; --lemon:#fff2a8; --lav:#c9b8ff; }
    *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
    html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#232a5c;color:#fff;font-family:"Hiragino Maru Gothic ProN","M PLUS Rounded 1c",system-ui,sans-serif}
    canvas{display:block}
    #game{position:fixed;inset:0}
    .screen{position:fixed;inset:0;z-index:40;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center;padding:calc(16px + var(--sat,0px)) calc(16px + var(--sar,0px)) calc(16px + var(--sab,0px)) calc(16px + var(--sal,0px));background:linear-gradient(160deg,var(--sky1),var(--sky2));transition:.3s;overflow-y:auto}
    .hidden{display:none!important}
    h1.tt{font-size:clamp(26px,6vw,42px);font-weight:900;margin:0;color:#fff8d8;text-shadow:0 3px 0 rgba(60,40,120,.5)}
    .sub{font-size:14px;font-weight:800;color:#eaf0ff;margin:0}
    .bigbtn{font-family:inherit;font-weight:900;font-size:18px;color:#4a3a10;background:linear-gradient(180deg,#fff2a8,#ffd35a);border:none;border-radius:20px;padding:14px 40px;cursor:pointer;box-shadow:0 6px 0 #d69a2a;touch-action:manipulation;min-height:52px}
    .bigbtn:active{transform:translateY(4px);box-shadow:0 2px 0 #d69a2a}
    .bigbtn.sub2{background:linear-gradient(180deg,#dff0ff,#a8d0ff);color:#1a3a6a;box-shadow:0 6px 0 #6a97cc}
    .bigbtn.sub2:active{box-shadow:0 2px 0 #6a97cc}
    .bigbtn:disabled{opacity:.4;cursor:default}
    .rowwrap{display:flex;flex-wrap:wrap;gap:12px;justify-content:center;max-width:900px}
    .charcard{width:150px;background:rgba(255,255,255,.92);border-radius:20px;padding:12px 8px;cursor:pointer;border:4px solid transparent;color:#333}
    .charcard.sel{border-color:#ffd35a;background:#fff9e0}
    .charcard canvas{width:100%;height:110px;display:block;border-radius:12px;background:radial-gradient(circle,#eaf3ff,#cfe0ff)}
    .charcard .cn{font-weight:900;font-size:16px;margin-top:6px}
    .charcard .cf{font-size:11px;color:#666;margin-top:2px;line-height:1.5}
    #stageGrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;max-width:760px;width:100%}
    .stagecard{background:rgba(255,255,255,.92);border-radius:18px;padding:12px;cursor:pointer;color:#333;text-align:center}
    .stagecard.locked{opacity:.55;cursor:default}
    .stagecard canvas{width:100%;height:80px;border-radius:10px;display:block}
    .stagecard .sn{font-weight:900;font-size:13px;margin-top:6px}
    .stagecard .ss{font-size:15px;letter-spacing:2px;margin-top:2px}
    .stagecard .lockrow{font-size:11px;color:#888;margin-top:4px}
    #hud{position:fixed;inset:0;z-index:12;pointer-events:none;opacity:0;transition:.3s}
    #hud.show{opacity:1}
    .hudtop{position:absolute;left:calc(10px + var(--sal,0px));right:calc(10px + var(--sar,0px));top:calc(8px + var(--sat,0px));display:flex;align-items:center;gap:8px;pointer-events:auto}
    .chip{background:rgba(20,20,60,.55);border:1px solid rgba(255,255,255,.4);border-radius:14px;padding:5px 11px;font-weight:900;font-size:12px;color:#fff;white-space:nowrap}
    .spacer{flex:1}
    #goalTxt{position:absolute;left:50%;top:calc(52px + var(--sat,0px));transform:translateX(-50%);background:rgba(20,20,60,.55);border:1px solid rgba(255,255,255,.35);border-radius:14px;padding:6px 16px;font-size:12px;font-weight:800;white-space:nowrap;pointer-events:none}
    #toastMsg{position:absolute;left:50%;top:30%;transform:translate(-50%,-50%) scale(.85);opacity:0;transition:.25s;font-weight:900;font-size:clamp(18px,4vw,26px);color:#fff8d8;text-shadow:0 3px 10px rgba(0,0,0,.4);text-align:center;pointer-events:none;white-space:nowrap}
    #toastMsg.show{opacity:1;transform:translate(-50%,-50%) scale(1)}
    #joyBase{position:absolute;left:calc(18px + var(--sal,0px));bottom:calc(18px + var(--sab,0px));width:110px;height:110px;border-radius:50%;background:rgba(255,255,255,.18);border:1px solid rgba(255,255,255,.35);pointer-events:auto;touch-action:none}
    #joyNub{position:absolute;left:31px;top:31px;width:48px;height:48px;border-radius:50%;background:rgba(255,255,255,.75)}
    #sparkleBtn{position:absolute;right:calc(20px + var(--sar,0px));bottom:calc(26px + var(--sab,0px));width:84px;height:84px;border-radius:50%;border:3px solid #fff;background:radial-gradient(circle at 35% 30%,#fff6c8,#ffce4a);color:#7a5200;font-family:inherit;font-weight:900;font-size:13px;pointer-events:auto;display:none;box-shadow:0 5px 0 #c98a1e;touch-action:manipulation}
    #sparkleBtn.show{display:block}
    #sparkleBtn:active{transform:translateY(3px);box-shadow:0 2px 0 #c98a1e}
    #backChip{pointer-events:auto;background:rgba(20,20,60,.55);border:1px solid rgba(255,255,255,.4);border-radius:14px;padding:6px 12px;font-weight:900;font-size:12px;color:#fff;cursor:pointer;min-height:34px}
    #bgmChip{pointer-events:auto;background:rgba(20,20,60,.55);border:1px solid rgba(255,255,255,.4);border-radius:14px;padding:6px 10px;font-size:15px;cursor:pointer;min-height:34px}
    .resultbox{background:rgba(255,255,255,.95);border-radius:22px;padding:22px 20px;max-width:420px;width:100%;color:#333}
    .starsrow{font-size:40px;letter-spacing:6px;margin:6px 0}
    .starsrow .off{color:#ddd}
    .starsrow .on{color:#ffc93c}
    #dressGrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(90px,1fr));gap:10px;max-width:560px;width:100%}
    .ditem{background:rgba(255,255,255,.92);border-radius:14px;padding:10px 6px;color:#333;cursor:pointer;border:3px solid transparent;font-size:11px;font-weight:800}
    .ditem.eq{border-color:#7be0c8;background:#e6fff6}
    .ditem.locked{opacity:.45;cursor:default}
    .ditem .di-ico{font-size:26px;display:block;margin-bottom:4px}
    #rotate{position:fixed;inset:0;z-index:99999;display:none;flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center;padding:24px;background:linear-gradient(160deg,#3a4a9e,#7b6fd8);color:#fff;font-weight:800;font-size:14px;line-height:1.9}
    #rotate .ph{font-size:52px;animation:tilt 1.4s ease-in-out infinite}
    @keyframes tilt{0%,100%{transform:rotate(0)}50%{transform:rotate(90deg)}}
    body.portrait #rotate{display:flex}
    a11y-hidden{display:none}
    @media(max-width:480px){ .bigbtn{padding:12px 28px;font-size:16px} }
  </style>
</head>
<body>
  <div id="game"></div>

  <div id="scrTitle" class="screen">
    <h1 class="tt">ほしぞらアニマルレスキュー</h1>
    <p class="sub">どうぶつたちを たすけにいこう！</p>
    <button class="bigbtn" id="btnStart" aria-label="はじめる">はじめる</button>
    <button class="bigbtn sub2 hidden" id="btnContinue" aria-label="つづきから">つづきから</button>
    <button class="bigbtn sub2" id="btnMusicTitle" aria-label="おんがく">🎵 おんがく</button>
  </div>

  <div id="scrChar" class="screen hidden">
    <h1 class="tt" style="font-size:24px">どうぶつを えらんでね</h1>
    <div class="rowwrap" id="charGrid"></div>
    <div style="display:flex;gap:10px">
      <button class="bigbtn sub2" id="btnCharBack" aria-label="もどる">← もどる</button>
      <button class="bigbtn" id="btnCharGo" aria-label="きめた">きめた！</button>
    </div>
  </div>

  <div id="scrStage" class="screen hidden">
    <h1 class="tt" style="font-size:22px">ステージを えらんでね</h1>
    <div id="stageGrid"></div>
    <div style="display:flex;gap:10px;flex-wrap:wrap;justify-content:center">
      <button class="bigbtn sub2" id="btnStageBack" aria-label="もどる">← もどる</button>
      <button class="bigbtn sub2" id="btnOpenDress" aria-label="おしゃれ">✨ おしゃれ</button>
    </div>
  </div>

  <div id="scrResult" class="screen hidden">
    <div class="resultbox">
      <h1 class="tt" style="font-size:22px;color:#7a5200">クリア！</h1>
      <div class="starsrow" id="resStars">☆☆☆</div>
      <p id="resDetail" style="font-weight:800;line-height:1.8;font-size:13px"></p>
      <p id="resNewItem" style="font-weight:900;color:#c98a1e;font-size:13px"></p>
      <div style="display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-top:10px">
        <button class="bigbtn sub2" id="btnRetry" aria-label="もういちど">もういちど</button>
        <button class="bigbtn sub2" id="btnToStages" aria-label="ステージをえらぶ">ステージをえらぶ</button>
        <button class="bigbtn hidden" id="btnNext" aria-label="つぎへ">つぎへ</button>
      </div>
    </div>
  </div>

  <div id="scrDress" class="screen hidden">
    <h1 class="tt" style="font-size:22px">おしゃれ</h1>
    <canvas id="dressPreview" width="200" height="150" style="border-radius:16px;background:radial-gradient(circle,#eaf3ff,#cfe0ff)"></canvas>
    <div id="dressTabs" style="display:flex;gap:6px;flex-wrap:wrap;justify-content:center"></div>
    <div id="dressGrid"></div>
    <button class="bigbtn sub2" id="btnDressBack" aria-label="もどる">← もどる</button>
  </div>

  <div id="hud">
    <div class="hudtop">
      <button id="backChip" aria-label="もどる">← もどる</button>
      <span class="chip" id="stageNameChip">ステージ</span>
      <span class="spacer"></span>
      <span class="chip" id="starChip">⭐0</span>
      <span class="chip" id="rescueChip">🐾0</span>
      <button id="bgmChip" aria-label="おんがく">🔊</button>
    </div>
    <div id="goalTxt">すすもう！</div>
    <div id="toastMsg"></div>
    <div id="joyBase"><div id="joyNub"></div></div>
    <button id="sparkleBtn" aria-label="きらきらアクション">✨<br>きらきら</button>
  </div>

  <div id="rotate"><div class="ph">📱</div><div>よこむきにして<br>あそんでね</div></div>

  <script src="/games/wakuwaku_bgm.js"></script>
  <script src="/games/safe_area.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script>
/* ================= ほしぞらアニマルレスキュー =================
   戦闘・ダメージ・ゲームオーバーなしの新規タイトル。
   星を集め、まいごの どうぶつを たすける やさしい3Dアドベンチャー。 */
"use strict";

/* ---------- SAFE_LS（sandboxed iframe対応・メモリフォールバック） ---------- */
var SAFE_LS = (function(){
  var ok = true;
  try { var t = "__sar_t"; localStorage.setItem(t,"1"); localStorage.removeItem(t); } catch(e){ ok = false; }
  var mem = {};
  return {
    getItem: function(k){ try{ return ok ? localStorage.getItem(k) : (k in mem ? mem[k] : null); }catch(e){ return k in mem ? mem[k] : null; } },
    setItem: function(k,v){ try{ if(ok) localStorage.setItem(k,v); else mem[k]=String(v); }catch(e){ mem[k]=String(v); } },
    removeItem: function(k){ try{ if(ok) localStorage.removeItem(k); }catch(e){} delete mem[k]; }
  };
})();
var SAVE_KEY = "starry_animal_rescue_v1";
var LEGACY_KEY = "astral_fang_best"; /* 旧ゲームのキー（読み取りのみ、上書き・削除しない） */

function defaultState(){
  return {
    version: 1,
    selectedCharacter: "lulu",
    unlockedStage: 0,
    stageStars: [0,0,0,0,0],
    rescued: [0,0,0,0,0],
    collected: [0,0,0,0,0],
    totalStars: 0,
    unlockedItems: [],
    equipped: { head:"none", cape:"none", wand:"default", pet:"none", trail:"none" },
    settings: { cameraAssist:true },
    lastStage: 0,
    updatedAt: 0,
    _legacyBonusGiven:false
  };
}
var S = defaultState();
function saveGame(){
  S.updatedAt = Date.now();
  try{ SAFE_LS.setItem(SAVE_KEY, JSON.stringify(S)); }catch(e){}
}
function loadGame(){
  try{
    var raw = SAFE_LS.getItem(SAVE_KEY);
    if(raw){
      var d = JSON.parse(raw);
      S = Object.assign(defaultState(), d);
      if(!Array.isArray(S.stageStars) || S.stageStars.length !== 5) S.stageStars = [0,0,0,0,0];
      if(!Array.isArray(S.rescued) || S.rescued.length !== 5) S.rescued = [0,0,0,0,0];
      if(!Array.isArray(S.collected) || S.collected.length !== 5) S.collected = [0,0,0,0,0];
      if(!Array.isArray(S.unlockedItems)) S.unlockedItems = [];
      S.equipped = Object.assign(defaultState().equipped, d.equipped||{});
      S.settings = Object.assign(defaultState().settings, d.settings||{});
      return;
    }
  }catch(e){ S = defaultState(); return; }
  /* 新規プレイヤー：旧セーブがあれば記念アイテムのみ付与（進行は移行しない） */
  S = defaultState();
  try{
    var legacy = SAFE_LS.getItem(LEGACY_KEY);
    if(legacy !== null){
      if(S.unlockedItems.indexOf("medal_kishi") < 0) S.unlockedItems.push("medal_kishi");
      S._legacyBonusGiven = true;
    }
  }catch(e){}
  saveGame();
}

/* ---------- データ定義 ---------- */
var CHARACTERS = {
  lulu:{ name:"ルル", species:"ねこ", flavor:"ほしを すこし\nひきよせる", color:0xffcf7a, ear:"cat", speed:1.0, pushMul:1.0, magnet:2.2, sense:false },
  mimi:{ name:"ミミ", species:"うさぎ", flavor:"はやく うごけて\nジャンプが かるい", color:0xffe6f0, ear:"rabbit", speed:1.22, pushMul:1.0, magnet:0, sense:false },
  popo:{ name:"ポポ", species:"こぐま", flavor:"おもい しかけを\nすぐ うごかせる", color:0xc98a5a, ear:"bear", speed:0.92, pushMul:1.6, magnet:0, sense:false },
  kon: { name:"コン", species:"きつね", flavor:"ちかくの ひみつを\nおしえてくれる", color:0xff9a52, ear:"fox", speed:1.05, pushMul:1.0, magnet:0, sense:true }
};
var CHAR_ORDER = ["lulu","mimi","popo","kon"];

var REWARD_TABLE = [
  { at:3,  id:"head_star",  slot:"head",  name:"きいろい ほしの ぼうし" },
  { at:6,  id:"cape_blue",  slot:"cape",  name:"あおい マント" },
  { at:9,  id:"pet_cloud",  slot:"pet",   name:"くもの ペット" },
  { at:12, id:"trail_rainbow", slot:"trail", name:"にじの あしあと" },
  { at:15, id:"pet_whale",  slot:"pet",   name:"ほしくじらの ミニペット" }
];
var ITEM_LIB = {
  none:{ name:"なし" },
  default:{ name:"ふつうの ステッキ" },
  medal_kishi:{ name:"ほしのきしメダル", slot:"head" },
  head_star:{ name:"きいろい ほしの ぼうし", slot:"head" },
  cape_blue:{ name:"あおい マント", slot:"cape" },
  pet_cloud:{ name:"くもの ペット", slot:"pet" },
  trail_rainbow:{ name:"にじの あしあと", slot:"trail" },
  pet_whale:{ name:"ほしくじらの ミニペット", slot:"pet" }
};
var DRESS_SLOTS = ["head","cape","wand","pet","trail"];

/* ステージ定義。すべて「星を集める＋救助/浄化系＋ゴール」の共通エンジンをテーマ違いで使う。 */
var STAGES = [
  { id:0, name:"おほしさまの丘", bgm:"magical", sky:0x596bd0, fog:0x596bd0, floor:0x4f8f5c,
    arena:26, starTarget:10, rescueTarget:3, taskTarget:0, taskType:"none",
    rescueLabel:"ひよこ", rescueColor:0xfff3b0, propTheme:"hill" },
  { id:1, name:"ふわふわ雲の道", bgm:"sky", sky:0x8fc6ff, fog:0xbfe0ff, floor:0xdfeeff,
    arena:24, starTarget:15, rescueTarget:1, taskTarget:3, taskType:"cloud",
    rescueLabel:"こいぬ", rescueColor:0xf0e0c0, propTheme:"cloud" },
  { id:2, name:"お月さま遊園地", bgm:"happy", sky:0x2c2560, fog:0x2c2560, floor:0x3a2f70,
    arena:26, starTarget:20, rescueTarget:1, taskTarget:3, taskType:"switch",
    rescueLabel:"こねこ", rescueColor:0xf5f5f5, propTheme:"park" },
  { id:3, name:"にじいろ星の森", bgm:"forest", sky:0x6a4fa0, fog:0x6a4fa0, floor:0x4a3a7a,
    arena:28, starTarget:12, rescueTarget:3, taskTarget:5, taskType:"flower",
    rescueLabel:"どうぶつ", rescueColor:0xb0e0b0, propTheme:"forest" },
  { id:4, name:"おおきな星くじら", bgm:"magical", sky:0x1c1a44, fog:0x1c1a44, floor:0x2a2860,
    arena:22, starTarget:5, rescueTarget:0, taskTarget:6, taskType:"moya",
    rescueLabel:"", rescueColor:0x000000, propTheme:"whale" }
];

/* ---------- Three.js 基本セットアップ ---------- */
var canEl;
var renderer=null, scene=null, camera=null, clock=null;
var webglOK = true;
try{
  canEl = document.createElement("canvas");
  document.getElementById("game").appendChild(canEl);
  renderer = new THREE.WebGLRenderer({ canvas:canEl, antialias:true, alpha:false, powerPreference:"high-performance" });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio||1, 2));
  renderer.setSize(innerWidth, innerHeight);
  scene = new THREE.Scene();
  camera = new THREE.PerspectiveCamera(58, innerWidth/innerHeight, 0.1, 260);
  clock = new THREE.Clock();
}catch(e){
  webglOK = false;
  console.error("[starry_animal_rescue] WebGL init failed:", e);
}
if(!webglOK){
  var fallback = document.createElement("div");
  fallback.style.cssText = "position:fixed;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;padding:24px;background:#3a4a9e;color:#fff;font-weight:800;font-size:15px;line-height:1.8;z-index:99998;";
  fallback.textContent = "ごめんね、この きさくでは あそべないみたい。べつの ブラウザで ためしてね。";
  document.body.appendChild(fallback);
}
window.addEventListener("error", function(e){ console.error("[starry_animal_rescue] error:", e.message, e.filename, e.lineno); });
window.addEventListener("unhandledrejection", function(e){ console.error("[starry_animal_rescue] unhandled rejection:", e.reason); });

/* ---------- 共有ジオメトリ・マテリアル（パフォーマンス対策） ---------- */
var GEO = {
  sphere: new THREE.SphereGeometry(1,12,10),
  sphereLo: new THREE.SphereGeometry(1,7,6),
  cone: new THREE.ConeGeometry(1,1,10),
  cyl: new THREE.CylinderGeometry(1,1,1,10),
  box: new THREE.BoxGeometry(1,1,1),
  torus: new THREE.TorusGeometry(1,0.16,8,20),
  octa: new THREE.OctahedronGeometry(1,0),
  ring: new THREE.RingGeometry(0.8,1,24),
  plane: new THREE.PlaneGeometry(1,1)
};
var MATCACHE = {};
function mat(color, opt){
  var key = color + JSON.stringify(opt||{});
  if(!MATCACHE[key]) MATCACHE[key] = new THREE.MeshLambertMaterial(Object.assign({color:color}, opt||{}));
  return MATCACHE[key];
}
function meshOf(geo, m, castShadow){
  var o = new THREE.Mesh(geo, m);
  o.castShadow = !!castShadow; o.receiveShadow = false;
  return o;
}

/* ---------- ライト（軽量：影は最小限） ---------- */
var hemi = new THREE.HemisphereLight(0xffffff, 0x556b2f, 1.05); scene.add(hemi);
var sun = new THREE.DirectionalLight(0xfff6d8, 0.85); sun.position.set(10,20,8); scene.add(sun);

/* ---------- パーティクル（単一Pointsバッファ・プール化） ---------- */
var P_MAX = 120;
var pGeo = new THREE.BufferGeometry();
var pPos = new Float32Array(P_MAX*3), pCol = new Float32Array(P_MAX*3);
pGeo.setAttribute("position", new THREE.BufferAttribute(pPos,3));
pGeo.setAttribute("color", new THREE.BufferAttribute(pCol,3));
var pMat = new THREE.PointsMaterial({ size:0.5, vertexColors:true, transparent:true, opacity:0.95, depthWrite:false, sizeAttenuation:true });
var pPoints = new THREE.Points(pGeo, pMat); pPoints.frustumCulled=false; scene.add(pPoints);
var pData = []; for(var pi=0;pi<P_MAX;pi++){ pData.push({life:0,x:0,y:-999,z:0,vx:0,vy:0,vz:0}); pPos[pi*3+1]=-999; }
var pNext = 0;
function burst(x,y,z,color,count,speed){
  var col = new THREE.Color(color);
  for(var i=0;i<count;i++){
    var idx = pNext; pNext=(pNext+1)%P_MAX;
    var d = pData[idx];
    d.life = 0.5+Math.random()*0.4; d.x=x; d.y=y; d.z=z;
    var th=Math.random()*Math.PI*2, ph=(Math.random()-0.3)*Math.PI*0.5, sp=(speed||4)*(0.5+Math.random());
    d.vx=Math.cos(th)*Math.cos(ph)*sp; d.vy=Math.sin(ph)*sp+2; d.vz=Math.sin(th)*Math.cos(ph)*sp;
    pCol[idx*3]=col.r; pCol[idx*3+1]=col.g; pCol[idx*3+2]=col.b;
  }
}
function updateParticles(dt){
  for(var i=0;i<P_MAX;i++){
    var d = pData[i];
    if(d.life>0){
      d.life-=dt; d.x+=d.vx*dt; d.y+=d.vy*dt; d.z+=d.vz*dt; d.vy-=5*dt;
      pPos[i*3]=d.x; pPos[i*3+1]=d.life>0?d.y:-999; pPos[i*3+2]=d.z;
    }
  }
  pGeo.attributes.position.needsUpdate = true;
}

/* ---------- キャラクター生成（頭・胴・手足・しっぽを分離、背面からも動物と分かる形状） ---------- */
function buildCharacterMesh(charId, equipped){
  var c = CHARACTERS[charId];

  } else if(c.ear==="rabbit"){
    [-1,1].forEach(function(s){ var ear=meshOf(GEO.cyl, mat(0xffffff)); ear.scale.set(0.09,0.58,0.09); ear.position.set(0.17*s,1.62,0); ear.rotation.z=-0.08*s; g.add(ear); ears.push(ear); });

  }
  /* しっぽ（全キャラ共通で用意し、背面からも動物と分かるようにする） */
  var tail;
  if(c.ear==="fox"){ tail=meshOf(GEO.cone, bodyMat); tail.scale.set(0.2,0.62,0.2); tail.rotation.x=1.25; tail.position.set(0,0.5,-0.56); }
  else if(c.ear==="cat"){ tail=meshOf(GEO.cyl, bodyMat); tail.scale.set(0.08,0.5,0.08); tail.rotation.x=0.9; tail.position.set(0,0.55,-0.5); }
  else if(c.ear==="rabbit"){ tail=meshOf(GEO.sphereLo, mat(0xffffff)); tail.scale.setScalar(0.14); tail.position.set(0,0.42,-0.52); }
  else { tail=meshOf(GEO.sphereLo, bodyMat); tail.scale.setScalar(0.17); tail.position.set(0,0.44,-0.5); }
  g.add(tail);
  /* 手足（円柱の脚＋足先） */
  var legMat = mat(0xffffff);
  var legs=[];
  [[-0.22,0.22],[0.22,0.22],[-0.22,-0.18],[0.22,-0.18]].forEach(function(p){
    var legGroup = new THREE.Group(); legGroup.position.set(p[0],0.22,p[1]);
    var leg = meshOf(GEO.cyl, legMat); leg.scale.set(0.1,0.22,0.1); leg.position.y=-0.06; legGroup.add(leg);
    var foot = meshOf(GEO.sphereLo, legMat); foot.scale.set(0.12,0.08,0.14); foot.position.y=-0.17; legGroup.add(foot);
    g.add(legGroup); legs.push(legGroup);
  });
  /* 前あし（腕）を少し高い位置にも用意し、正面からも手足があると分かるようにする */
  var arms=[];
  [-0.32,0.32].forEach(function(sx){
    var arm = meshOf(GEO.cyl, legMat); arm.scale.set(0.08,0.22,0.08); arm.position.set(sx,0.42,0.28); arm.rotation.x=-0.25;
    g.add(arm); arms.push(arm);
  });

  /* 装備（見た目のみ） */
  var eq = equipped || {};
  var extras = {};
  if(eq.head && eq.head!=="none" && ITEM_LIB[eq.head]){
    var hat = meshOf(GEO.cone, mat(0xffd35a)); hat.scale.set(0.24,0.32,0.24); hat.position.y=1.42; g.add(hat);
    var hatTip = meshOf(GEO.octa, mat(0xfff6c8)); hatTip.scale.setScalar(0.06); hatTip.position.y=1.62; g.add(hatTip);
  }
  if(eq.cape && eq.cape!=="none" && ITEM_LIB[eq.cape]){
    var cape = meshOf(GEO.plane, mat(0x5a8dff, {side:THREE.DoubleSide, transparent:true, opacity:0.9})); cape.scale.set(0.5,0.7,1); cape.position.set(0,0.62,-0.32); cape.rotation.x=0.15; g.add(cape);
  }
  if(eq.pet && eq.pet!=="none" && ITEM_LIB[eq.pet]){
    var petCol = eq.pet==="pet_whale" ? 0x8fc6ff : 0xffffff;
    var pet = meshOf(GEO.sphere, mat(petCol)); pet.scale.setScalar(0.16); pet.position.set(0.45,0.5,-0.45); g.add(pet);

  var wandGroup = new THREE.Group();
  var stick = meshOf(GEO.cyl, mat(0xd8b070)); stick.scale.set(0.03,0.5,0.03); wandGroup.add(stick);
  var star = meshOf(GEO.octa, mat(0xfff2a8, {emissive:0x998030, emissiveIntensity:0.4})); star.scale.setScalar(0.09); star.position.y=0.28; wandGroup.add(star);
  wandGroup.position.set(0.42,0.55,0.15); wandGroup.rotation.z=-0.3; g.add(wandGroup);
  extras.wandStar = star;

  g.userData.headY = 1.04; g.userData.extras = extras;
  g.userData.legs = legs; g.userData.arms = arms; g.userData.tail = tail; g.userData.ears = ears; g.userData.body = body;
  g.userData.animPhase = Math.random()*Math.PI*2;
  return g;
}
/* ---------- キャラクターの歩行・待機アニメーション ---------- */
function animateCharacterMesh(g, dt, now, moving){
  if(!g || !g.userData) return;
  var ph = g.userData.animPhase||0;
  var legs = g.userData.legs, arms = g.userData.arms, tail = g.userData.tail, ears = g.userData.ears, body = g.userData.body;
  if(moving){
    var w = now*0.012;
    if(legs) legs.forEach(function(lg, i){ lg.rotation.x = Math.sin(w + (i%2?Math.PI:0))*0.6; });
    if(arms) arms.forEach(function(ar, i){ ar.rotation.x = -0.25 + Math.sin(w + (i%2?Math.PI:0))*0.35; });
    if(tail) tail.rotation.y = Math.sin(w*1.4)*0.35;
    if(body) body.scale.y = body.scale.y; /* 走行中は呼吸アニメを止め、脚の動きを優先 */
  } else {
    if(legs) legs.forEach(function(lg){ lg.rotation.x = 0; });
    if(arms) arms.forEach(function(ar){ ar.rotation.x = -0.25; });
    if(tail) tail.rotation.y = Math.sin(now*0.002+ph)*0.15;
    if(ears) ears.forEach(function(e,i){ e.rotation.x = Math.sin(now*0.0025+ph+i)*0.08; });
    if(body){ var baseY=0.46; body.scale.y = baseY + Math.sin(now*0.003+ph)*0.02; }
  }
}

/* ---------- SFX（Web Audio、軽量・不快音なし） ---------- */
var audioCtx=null;
function ensureAudio(){ if(!audioCtx){ try{ audioCtx = new (window.AudioContext||window.webkitAudioContext)(); }catch(e){} } if(audioCtx && audioCtx.state==="suspended") audioCtx.resume(); }
function beep(freq,dur,type,vol,when,slide){
  if(!audioCtx) return;
  var o=audioCtx.createOscillator(), g=audioCtx.createGain();
  o.type=type||"sine"; o.frequency.setValueAtTime(freq, audioCtx.currentTime+(when||0));
  if(slide) o.frequency.exponentialRampToValueAtTime(Math.max(40,freq+slide), audioCtx.currentTime+(when||0)+dur);
  g.gain.setValueAtTime(0.0001, audioCtx.currentTime+(when||0));
  g.gain.exponentialRampToValueAtTime(vol||0.08, audioCtx.currentTime+(when||0)+0.01);
  g.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime+(when||0)+dur);
  o.connect(g); g.connect(audioCtx.destination); o.start(audioCtx.currentTime+(when||0)); o.stop(audioCtx.currentTime+(when||0)+dur+0.03);
}
var sfx = {
  star: function(){ beep(720,.08,"triangle",.07); beep(980,.1,"triangle",.06,.06); },
  rescue: function(){ [660,880,1100].forEach(function(f,i){ beep(f,.14,"triangle",.07,i*.08); }); },
  sparkle: function(){ beep(880,.06,"sine",.05); },
  clean: function(){ beep(300,.12,"sine",.05); beep(500,.14,"sine",.04,.05); },
  bloom: function(){ beep(520,.1,"triangle",.06); beep(760,.14,"triangle",.05,.07); },
  fix: function(){ beep(440,.1,"sine",.06); beep(660,.12,"sine",.05,.06); beep(880,.16,"sine",.05,.12); },
  reward: function(){ [523,659,784,1046].forEach(function(f,i){ beep(f,.16,"square",.05,i*.09); }); },
  clear: function(){ [440,554,659,880].forEach(function(f,i){ beep(f,.2,"triangle",.06,i*.1); }); },
  tap: function(){ beep(500,.05,"sine",.04); },

  /* 光の粒・蝶（円運動） */

  for(var mi=0;mi<7;mi++){

}
function buildHillStage(group, st, anim){
  /* おほしさまの丘：レスキュー基地 → 光る足あと → 1羽目 → 橋 → 風車 → 花畑で2羽目 → 丘で3羽目 → 星10個 → 虹のゲート */
  var stars=[], rescues=[], tasks=[];

  /* レスキュー基地（スタート地点） */
  var base = makeRescueBase(); base.position.set(0,0,18); group.add(base);
  scatterGrass(group, anim, 0, 18, 4, 6, 0x4fae5a);

  /* 光る足あと（基地→1羽目） */
  for(var f=0; f<6; f++){
    var fp = makeFootprintMarker();
    fp.position.set(-1.2 + f*0.5, 0.03, 16 - f*1.5);
    group.add(fp); anim.footprints.push(fp);
  }

  /* 1羽目：光の柱つき */
  var chick1 = makeAnimalNPC(st.rescueColor);
  chick1.position.set(-3, 0, 7.5);
  chick1.userData.rescued=false;
  var beam1 = makeGuideBeam(0xfff2a8); chick1.add(beam1); chick1.userData.beam = beam1;
  group.add(chick1); rescues.push(chick1);

  /* 小川と橋 */
  var stream = makeStream(st.arena*2.1, 3.6); stream.position.set(0,0,2.5); group.add(stream);
  var bridge = makeBridge(4.2); bridge.position.set(0,0,2.5); group.add(bridge);

  /* 風車（橋を渡った先） */
  var windmill = makeWindmill(); windmill.position.set(5.5,0,0.5); group.add(windmill);
  anim.windmillBlades.push(windmill.userData.blades);

  /* 花畑と2羽目 */
  scatterGrass(group, anim, -1, -8, 6, 14, 0xff9ecb);
  for(var fl=0; fl<8; fl++){
    var flower = makeFlowerDeco([0xff9ecb,0xffe36a,0xbfe0ff][fl%3]);
    flower.position.set(-4+Math.random()*8, 0, -5+Math.random()*7);
    group.add(flower);
  }
  var chick2 = makeAnimalNPC(st.rescueColor);
  chick2.position.set(4, 0, -8);
  chick2.userData.rescued=false;
  var beam2 = makeGuideBeam(0xfff2a8); chick2.add(beam2); chick2.userData.beam = beam2;
  group.add(chick2); rescues.push(chick2);

  /* 小さな丘（3〜4か所）と3羽目 */
  var hillSpots = [[-6,-15],[3,-17],[-2,-13],[7,-14]];
  hillSpots.forEach(function(p, i){
    var mound = meshOf(GEO.sphereLo, mat(0x6bb85a));
    mound.scale.set(2.4+Math.random(), 1.0+Math.random()*0.4, 2.4+Math.random());
    mound.position.set(p[0], -0.3, p[1]);
    group.add(mound);
    var tree = makeTree(0x8a5a2a, [0x4fae5a,0x5fcf6f,0x3f9a4f][i%3], 0.7+Math.random()*0.3);
    tree.position.set(p[0]+(Math.random()-0.5)*1.5, mound.scale.y*0.4-0.3, p[1]+(Math.random()-0.5)*1.5);
    group.add(tree);
  });
  var chick3 = makeAnimalNPC(st.rescueColor);
  chick3.position.set(-6, 0.5, -15);
  chick3.userData.rescued=false;
  var beam3 = makeGuideBeam(0xfff2a8); chick3.add(beam3); chick3.userData.beam = beam3;
  group.add(chick3); rescues.push(chick3);

  /* 木・茂み・岩をランダム配置（種類・大きさ・色・回転をばらけさせる） */
  for(var d=0; d<18; d++){
    var a=Math.random()*Math.PI*2, r=8+Math.random()*(st.arena*0.85);
    var x=Math.cos(a)*r, z=Math.sin(a)*r;
    if(Math.abs(z-2.5)<3 && Math.abs(x)<st.arena) continue; /* 川の上には置かない */
    var pick = Math.random();
    var deco;
    if(pick<0.45) deco = makeTree(0x8a5a2a, [0x4fae5a,0x5fcf6f,0x3f9a4f,0x6fdf7f][Math.floor(Math.random()*4)], 0.7+Math.random()*0.6);
    else if(pick<0.7) deco = makeBush([0x4fae5a,0x5fcf6f,0x6fdf7f][Math.floor(Math.random()*3)]);
    else deco = makeRock(0.7+Math.random()*0.8);
    deco.position.set(x,0,z); deco.rotation.y = Math.random()*Math.PI*2;
    group.add(deco);
  }
  scatterGrass(group, anim, 0, 0, st.arena*0.9, 30, 0x4fae5a);

  /* 星10個：道・橋・花畑・丘へ誘導するように配置（ランダム散布ではない） */
  var starSpots = [
    [-0.6,15],[-2,11],[0,8.8], /* 基地→1羽目 */
    [0,4.5],[0.6,1.2], /* 橋周辺 */
    [-2,-4],[2,-6],[-3,-9],[4,-10], /* 花畑 */
    [-5,-13] /* 丘 */
  ];
  starSpots.forEach(function(p){
    var star = makeStarPickup();
    star.userData.baseY = 0.7;
    star.position.set(p[0], 0.7, p[1]);
    group.add(star); stars.push(star);
  });

  /* 虹のゲート（ゴール、装飾は縦のアーチ、判定用の平たいリングは従来通り足元に） */
  var goal = makeGoalRing(0x9ff7c8);
  goal.position.set(0, 0.05, -21);
  goal.userData.active = false;
  group.add(goal);
  var gate = makeRainbowGate(); gate.position.set(0,0,-21); group.add(gate);
  scatterGrass(group, anim, 0, -21, 5, 8, 0x6fdf7f);

  return { stars:stars, rescues:rescues, tasks:tasks, goal:goal, playerStart:new THREE.Vector3(0,0,16) };
}

function buildCloudStage(group, st, anim){
  /* ふわふわ雲の道：雲の駅→大きな雲→雨雲1→上昇気流→風船広場+雨雲2→空中庭園→雨雲3→ふうせんの こいぬ救助→虹の橋→虹の出口 */
  var stars=[], rescues=[], tasks=[];

  var station = makeCloudStation(); station.position.set(0,0,17); group.add(station);

  function addRainCloud(x,z){
    var t = makeRainCloudTask(); t.position.set(x,1.1,z);
    var beam = makeGuideBeam(0x9ff7c8); t.add(beam); t.userData.beam = beam;
    group.add(t); tasks.push(t); return t;
  }
  addRainCloud(-1, 10);
  addRainCloud(3, -4);
  addRainCloud(-2, -11);

  /* 上昇気流：入ると主人公がふわっと上の雲へ */
  var pillar = makeUpdraftPillar(); pillar.position.set(3,0,4); group.add(pillar);
  stageObjs.updraft = { pos:new THREE.Vector3(3,0,4), radius:1.8, landAt:new THREE.Vector3(0,0,-1) };

  /* 風船広場 */
  var balloonColors=[0xff9ecb,0xfff2a8,0x9ecbff,0xb08bff];
  for(var b=0;b<10;b++){
    var bx=-6+Math.random()*12, bz=-1-Math.random()*7;
    var bal = makeBalloon(balloonColors[b%balloonColors.length]);
    bal.position.set(bx,0,bz); group.add(bal);
  }
  /* 空中庭園（花＋雲だまり） */
  for(var fg=0; fg<6; fg++){ var fl=makeFlowerDeco([0xff9ecb,0xbfe0ff][fg%2]); fl.position.set(-3+Math.random()*6,0,-8+Math.random()*2); group.add(fl); }
  for(var cd=0; cd<4; cd++){ var cdeco=makeCloudDeco(0xffffff); cdeco.position.set(-7+Math.random()*14, 0, -8+Math.random()*3); group.add(cdeco); }

  /* ふうせんの こいぬ */
  var pup = makeAnimalNPC(st.rescueColor);
  pup.position.set(3,0,-14);
  pup.userData.rescued=false;
  var pupBalloon = makeBalloon(0xffe36a); pupBalloon.position.set(0,0.3,0); pup.add(pupBalloon);
  var pupBeam = makeGuideBeam(0xfff2a8); pup.add(pupBeam); pup.userData.beam = pupBeam;
  group.add(pup); rescues.push(pup);

  /* 雲の種類を増やして密度アップ */
  for(var d=0; d<16; d++){
    var a=Math.random()*Math.PI*2, r=8+Math.random()*(st.arena*0.85);
    var x=Math.cos(a)*r, z=Math.sin(a)*r;
    var deco = makeCloudDeco(0xffffff);
    deco.scale.setScalar(0.6+Math.random()*0.8);
    deco.position.set(x,0,z);
    group.add(deco);
  }

  /* 虹の橋（雨雲3つ完了で徐々に光る演出用） */
  var bridgeArcs=[];
  for(var ba=0; ba<5; ba++){
    var arc = makeMiniRainbow(); arc.scale.setScalar(2.2);
    arc.position.set(0, 0.1, -12-ba*1.7);
    arc.visible = false;
    group.add(arc); bridgeArcs.push(arc);
  }
  stageObjs.onProgress = function(){
    if(runState.task>=st.taskTarget){ bridgeArcs.forEach(function(a){ a.visible=true; }); }
  };

  /* 星15個：誘導配置 */
  var starSpots = [
    [-0.6,15],[0.5,13],[-1,11], /* 駅→雨雲1 */
    [1,7],[2,5.5],[3,3], /* 上昇気流へ */
    [1,-1],[-2,-2],[2,-4],[-1,-6], /* 風船広場 */
    [-3,-9],[-1,-11],[1,-12], /* 雨雲3 */
    [2,-15],[0,-17] /* 虹の出口 */
  ];
  starSpots.forEach(function(p){ var star=makeStarPickup(); star.userData.baseY=0.9; star.position.set(p[0],0.9,p[1]); group.add(star); stars.push(star); });

  var goal = makeGoalRing(0x9ff7c8);
  goal.position.set(0,0.05,-19);
  goal.userData.active = false;
  group.add(goal);
  var gate = makeRainbowGate(); gate.position.copy(goal.position); gate.position.y=0; group.add(gate);

  return { stars:stars, rescues:rescues, tasks:tasks, goal:goal, playerStart:new THREE.Vector3(0,0,15.5) };
}

function buildParkStage(group, st, anim){
  /* お月さま遊園地：入口→カルーセル→星のレール→ミニ汽車→風船広場でこねこ救助→ティーカップ→観覧車広場→月ゲート */
  var stars=[], rescues=[], tasks=[];

  [-3,3].forEach(function(sx){ var lamp=makeStreetLamp(); lamp.position.set(sx,0,15); group.add(lamp); });
  [[-3,12,0xff9ecb],[3,12,0x9ecbff]].forEach(function(p){ var stall=makeStall(p[2]); stall.position.set(p[0],0,p[1]); group.add(stall); });

  });

  var kitten = makeAnimalNPC(st.rescueColor);

    if(runState.task>=st.taskTarget) anim.ferrisWheelSpin = true;

  [0,1,2,3].forEach(function(i){ var lamp=makeStreetLamp(); lamp.position.set(i%2?4:-4,0,-13+i); group.add(lamp); });

    [-2,-2],[2,-4],[0,-6], /* 風船広場 */
    [-2,-8],[-4,-10],[2,-11], /* ティーカップ */
    [1,-14],[-1,-16],[0,-17.5],[2,-13],[-3,-6],[3,7],[-2,9],[1,-1] /* 観覧車広場・補充 */
  ];
  starSpots.forEach(function(p){ var star=makeStarPickup(); star.userData.baseY=0.8; star.position.set(p[0],0.8,p[1]); group.add(star); stars.push(star); });

  var goal = makeGoalRing(0x9ff7c8);
  goal.position.set(0,0.05,-20.5);
  goal.userData.active = false;
  group.add(goal);
  var gate = makeRainbowGate(); gate.position.copy(goal.position); gate.position.y=0; group.add(gate);

  return { stars:stars, rescues:rescues, tasks:tasks, goal:goal, playerStart:new THREE.Vector3(0,0,17) };
}

function buildForestStage(group, st, anim){
  /* にじいろ星の森：入口→足跡で1匹目→泉のほとりで花1→丸太橋→光る大木で2匹目→木の実収集→泉→3匹目→最後の花→虹の道復元→ゲート */
  var stars=[], rescues=[], tasks=[];

  for(var f=0; f<6; f++){ var fp=makeFootprintMarker(); fp.position.set(-1+f*0.4,0.03,17-f*1.4); group.add(fp); anim.footprints.push(fp); }

  var rescue1 = makeAnimalNPC(st.rescueColor); rescue1.position.set(-3,0,13); rescue1.userData.rescued=false;
  var r1beam = makeGuideBeam(0xfff2a8); rescue1.add(r1beam); rescue1.userData.beam=r1beam;
  group.add(rescue1); rescues.push(rescue1);

  var pond = makePond(); pond.position.set(2,0,9); group.add(pond);
  function addFlower(x,z,color){
    var t = makeFlowerDeco(color); t.position.set(x,0,z);
    var beam = makeGuideBeam(0x9ff7c8); t.add(beam); t.userData.beam = beam;
    t.userData.kind = "flower";
    group.add(t); tasks.push(t); return t;
  }
  addFlower(0,8,0xff9ecb);

  var bridge = makeLogBridge(3.2); bridge.position.set(0,0,5); group.add(bridge);

  var glowTree = makeGlowTree(); glowTree.position.set(0,0,0); group.add(glowTree);
  var rescue2 = makeAnimalNPC(st.rescueColor); rescue2.position.set(3,0,1); rescue2.userData.rescued=false;
  var r2beam = makeGuideBeam(0xfff2a8); rescue2.add(r2beam); rescue2.userData.beam=r2beam;
  group.add(rescue2); rescues.push(rescue2);
  addFlower(-3,0,0xffe36a);

  /* 木の実（星がわり、木の上や低い枝に配置） */
  for(var i=0;i<12;i++){
    var a=(i/12)*Math.PI*2, r=3+Math.random()*(st.arena*0.55);
    var fruit = makeStarFruit();
    fruit.userData.baseY = 0.65+Math.random()*0.3;
    fruit.position.set(Math.cos(a)*r, fruit.userData.baseY, -3+Math.sin(a)*r*0.6-3);
    group.add(fruit); stars.push(fruit);
  }

  var spring = makePond(); spring.position.set(0,0,-11); group.add(spring);
  var rescue3 = makeAnimalNPC(st.rescueColor); rescue3.position.set(-4,0,-13); rescue3.userData.rescued=false;
  var r3beam = makeGuideBeam(0xfff2a8); rescue3.add(r3beam); rescue3.userData.beam=r3beam;
  group.add(rescue3); rescues.push(rescue3);
  addFlower(-2,-14,0xbfe0ff);
  addFlower(2,-16,0xff9ecb);
  addFlower(0,-18,0xffe36a);

  /* 木を最低5種類、茂み・岩・光るキノコを混在 */
  var treePalettes = [[0x5a4a80,0x9a7fe0],[0x6a5a90,0xb08bff],[0x4a3a70,0x7f9ae0],[0x8a5a2a,0x4fae5a],[0x5a4a80,0xff9ecb]];
  for(var d=0; d<20; d++){
    var ta=Math.random()*Math.PI*2, tr=6+Math.random()*(st.arena*0.85);
    var x=Math.cos(ta)*tr, z=Math.sin(ta)*tr;
    var pick = Math.random();
    var deco;
    if(pick<0.55){ var pal=treePalettes[Math.floor(Math.random()*treePalettes.length)]; deco = makeTree(pal[0], pal[1], 0.7+Math.random()*0.6); }
    else if(pick<0.75) deco = makeBush([0x8a6fd0,0x4fae5a][Math.floor(Math.random()*2)]);
    else if(pick<0.9) deco = makeRock(0.7+Math.random()*0.7);
    else { deco = meshOf(GEO.sphereLo, new THREE.MeshBasicMaterial({color:0xbfe0ff})); deco.scale.setScalar(0.14); }
    deco.position.set(x,0,z); deco.rotation.y = Math.random()*Math.PI*2;
    group.add(deco);
  }
  scatterGrass(group, anim, 0, 0, st.arena*0.9, 20, 0x6a5a90);

  /* 虹の道の復元（花が咲くたびに区間が光る） */
  var roadSegs=[];
  for(var rs=0; rs<6; rs++){
    var seg = makeStarRailSeg(); seg.material = seg.material.clone(); seg.material.opacity=0.15;
    seg.position.set(0,0,-17-rs*0.9);
    group.add(seg); roadSegs.push(seg);
  }
  stageObjs.onProgress = function(){
    var lit = Math.min(roadSegs.length, runState.task);
    roadSegs.forEach(function(seg,i){ seg.material.opacity = i<lit? 0.85 : 0.15; });
  };

  var goal = makeGoalRing(0x9ff7c8);
  goal.position.set(0,0.05,-21);
  goal.userData.active = false;
  group.add(goal);
  var gate = makeRainbowGate(); gate.position.copy(goal.position); gate.position.y=0; group.add(gate);

  return { stars:stars, rescues:rescues, tasks:tasks, goal:goal, playerStart:new THREE.Vector3(0,0,18) };
}

function buildWhaleStage(group, st, anim){
  /* おおきな星くじら：区画1 雲海の入口→区画2 星のかけらの島々→区画3 星くじら */
  var stars=[], rescues=[], tasks=[];

  function addMoya(x,z){
    var t = makeMoyaCloud(); t.position.set(x,0.9,z); t.userData.kind="moya";
    var beam = makeGuideBeam(0x9ff7c8); t.add(beam); t.userData.beam = beam;
    group.add(t); tasks.push(t); return t;
  }

  /* 区画1：雲海の入口 */
  var startIsland = makeFloatingIslandDeco(0x6fdf7f); startIsland.position.set(0,0,15); group.add(startIsland);
  var zoneAnimals=[];
  [[-1.5,14],[1.5,14],[0,15.6]].forEach(function(p,i){
    var a = makeAnimalNPC([0xfff3b0,0xf0e0c0,0xf5f5f5][i]);
    a.position.set(p[0],0,p[1]);
    a.userData.gatherOffset = new THREE.Vector3((i-1)*0.8, 0, -0.8);
    group.add(a); zoneAnimals.push(a);
  });
  stageObjs.zoneAnimals = zoneAnimals;
  addMoya(1,11); addMoya(-1,7);

  /* 区画2：星のかけらの島々 */
  [[-4,3],[4,0],[-3,-4]].forEach(function(p,i){ var isl=makeFloatingIslandDeco([0x6fdf7f,0x9ecbff,0xb08bff][i]); isl.position.set(p[0],0,p[1]); group.add(isl); });
  for(var lp=0; lp<10; lp++){ var fp=makeFootprintMarker(); fp.position.set(Math.sin(lp*0.6)*1.5, 0.03, 5-lp*1.1); group.add(fp); anim.footprints.push(fp); }
  var shardSpots = [[0,4],[-3,1],[3,-1],[-2,-4],[2,-5]];
  shardSpots.forEach(function(p){ var shard=makeStarShard(); shard.userData.baseY=0.8; shard.position.set(p[0],0.8,p[1]); group.add(shard); stars.push(shard); });
  addMoya(2,3); addMoya(-4,-1); addMoya(0,-3); addMoya(-2,-6);

  /* 区画3：星くじら */
  var whale = makeWhale();
  whale.position.set(0,2.4,-18);
  whale.scale.setScalar(0.01);
  group.add(whale);
  stageObjs.whale = whale;
  stageObjs.whaleAwake = false;

  stageObjs.onProgress = function(){
    lightWhaleSpot(whale, Math.max(0, runState.stars-1));
  };

  for(var d=0; d<12; d++){
    var a=Math.random()*Math.PI*2, r=6+Math.random()*(st.arena*0.85);
    var deco = makeRock(0.7+Math.random()*0.6);
    deco.position.set(Math.cos(a)*r,0,Math.sin(a)*r);
    group.add(deco);
  }

  /* モヤ＋かけらタイプはゴールリングを使わず、くじら演出でクリアする */
  return { stars:stars, rescues:rescues, tasks:tasks, goal:null, playerStart:new THREE.Vector3(0,0,15) };
}

function buildStageWorld(st){
  scene.fog = new THREE.Fog(st.fog, 22, st.arena*2.4);
  renderer.setClearColor(st.sky);
  var group = new THREE.Group();
  scene.add(group);
  var anim = { grass:[], clouds:[], motes:[], footprints:[], windmillBlades:[] };
  stageObjs = { group:group, stars:[], rescues:[], tasks:[], goal:null, whale:null, followers:[], anim:anim };

  var floor = meshOf(GEO.cyl, mat(st.floor)); floor.scale.set(st.arena, 0.4, st.arena); floor.position.y=-0.2; floor.receiveShadow=false; group.add(floor);
  var edgeGlow = meshOf(GEO.ring, new THREE.MeshBasicMaterial({color:0xffffff, transparent:true, opacity:0.12, side:THREE.DoubleSide}));
  edgeGlow.rotation.x=-Math.PI/2; edgeGlow.scale.setScalar(st.arena*0.98); group.add(edgeGlow);

  addAmbientScenery(group, st, anim);

  var playerStart = new THREE.Vector3(0,0,st.arena*0.3);

  var built;
  if(st.id===0) built = buildHillStage(group, st, anim);
  else if(st.id===1) built = buildCloudStage(group, st, anim);
  else if(st.id===2) built = buildParkStage(group, st, anim);
  else if(st.id===3) built = buildForestStage(group, st, anim);
  else built = buildWhaleStage(group, st, anim);
  stageObjs.stars = built.stars; stageObjs.rescues = built.rescues; stageObjs.tasks = built.tasks; stageObjs.goal = built.goal;
  playerStart = built.playerStart;

  /* プレイヤー配置 */
  if(player){ scene.remove(player); }
  playerParts = null;
  player = buildCharacterMesh(S.selectedCharacter, S.equipped);

  }

  shadow.scale.set(0.55,0.02,0.4); shadow.position.set(playerStart.x,0.02,playerStart.z);
  group.add(shadow); stageObjs.playerShadow = shadow;
}

/* ---------- 入力 ---------- */
var joyBase = $("joyBase"), joyNub = $("joyNub");
function joyStart(x,y,id){ joyActive=true; joyId=id; joyOrigin={x:x,y:y}; }
function joyMove(x,y){
  var dx=x-joyOrigin.x, dy=y-joyOrigin.y, len=Math.sqrt(dx*dx+dy*dy), max=40;
  if(len>max){ dx=dx/len*max; dy=dy/len*max; }
  joyNub.style.transform = "translate("+dx+"px,"+dy+"px)";
  joyVec = {x:dx/max, y:dy/max};
}
function joyEnd(){ joyActive=false; joyId=null; joyVec={x:0,y:0}; joyNub.style.transform="translate(0,0)"; }
joyBase.addEventListener("touchstart", function(e){ ensureAudio(); var t=e.changedTouches[0]; joyStart(t.clientX,t.clientY,t.identifier); e.preventDefault(); }, {passive:false});
window.addEventListener("touchmove", function(e){ if(!joyActive) return; for(var i=0;i<e.changedTouches.length;i++){ var t=e.changedTouches[i]; if(t.identifier===joyId){ joyMove(t.clientX,t.clientY); e.preventDefault(); } } }, {passive:false});
window.addEventListener("touchend", function(e){ for(var i=0;i<e.changedTouches.length;i++){ if(e.changedTouches[i].identifier===joyId) joyEnd(); } });
joyBase.addEventListener("mousedown", function(e){ ensureAudio(); joyStart(e.clientX,e.clientY,"m"); });
window.addEventListener("mousemove", function(e){ if(joyActive && joyId==="m") joyMove(e.clientX,e.clientY); });
window.addEventListener("mouseup", function(){ if(joyId==="m") joyEnd(); });
window.addEventListener("keydown", function(e){
  keys[e.key.toLowerCase()]=true;
  if(e.code==="Space" || e.key==="Enter"){ doSparkleAction(); e.preventDefault(); }
  if(e.key==="Escape"){ if(stageObjs) backFromStage(); }
  ensureAudio();
});
window.addEventListener("keyup", function(e){ keys[e.key.toLowerCase()]=false; });
function inputVec(){
  var x=joyVec.x, y=joyVec.y;
  if(keys["arrowleft"]||keys["a"]) x-=1;
  if(keys["arrowright"]||keys["d"]) x+=1;
  if(keys["arrowup"]||keys["w"]) y-=1;
  if(keys["arrowdown"]||keys["s"]) y+=1;
  var len=Math.sqrt(x*x+y*y); if(len>1){x/=len;y/=len;}
  return {x:x,y:y};
}
$("sparkleBtn").addEventListener("click", function(){ ensureAudio(); doSparkleAction(); });
$("backChip").addEventListener("click", function(){ ensureAudio(); backFromStage(); });
$("bgmChip").addEventListener("click", function(){ ensureAudio(); toggleBGM(); });

/* ---------- アクション判定（近くの1つだけに反応、複数ボタン化しない） ---------- */
function findNearbyAction(){
  if(!player || !stageObjs) return null;
  var p = player.position;
  var best=null, bestD=1e9;
  stageObjs.rescues.forEach(function(a){
    if(a.userData.rescued) return;
    var d = p.distanceTo(a.position);
    if(d<1.8 && d<bestD){ bestD=d; best={type:"rescue", obj:a}; }
  });
  stageObjs.tasks.forEach(function(t){
    if(t.userData.done) return;
    var d = p.distanceTo(t.position);
    if(d<1.8 && d<bestD){ bestD=d; best={type:"task", obj:t}; }
  });
  if(stageObjs.whale && stageObjs.whaleAwake===false && runState.stars>=STAGES[curStageIdx].starTarget && runState.task>=STAGES[curStageIdx].taskTarget){
    var dw = p.distanceTo(stageObjs.whale.position);
    if(dw<4.5){ best={type:"whale", obj:stageObjs.whale}; }
  }
  return best;
}
var lastProgressAt = 0, lastHintAt = 0;
function markProgress(){ lastProgressAt = performance.now(); }
function updateChargeVisual(obj){
  if(!obj.userData.chargeMat) return;
  var ratio = Math.min(1, (obj.userData.tapsDone||0) / (obj.userData.tapsNeeded||1));
  obj.userData.chargeMat.color.copy(obj.userData.dimColor).lerp(obj.userData.brightColor, ratio);
}
function announceNextObjective(st){
  if(!stageObjs) return;
  var msg = null;
  if(st.taskType==="cloud"){
    if(runState.task<st.taskTarget) msg = "つぎは あめぐもを きれいにしよう";
    else if(runState.rescued<st.rescueTarget) msg = "ふうせんの こいぬを たすけよう";
    else if(runState.stars<st.starTarget) msg = "ほしを あつめよう";
    else msg = "にじの でぐちへ すすもう！";
  } else if(st.taskType==="switch"){
    if(runState.task<st.taskTarget) msg = "のりものを キラキラで なおそう";
    else if(runState.rescued<st.rescueTarget) msg = "まいごの こねこを さがそう";
    else if(runState.stars<st.starTarget) msg = "ほしを あつめよう";
    else msg = "かんらんしゃの ひろばへ すすもう！";
  } else if(st.taskType==="flower"){
    if(runState.task<st.taskTarget) msg = "はなを さかせよう";
    else if(runState.rescued<st.rescueTarget) msg = "まいごの どうぶつを たすけよう";
    else if(runState.stars<st.starTarget) msg = "きのみを あつめよう";
    else msg = "にじの みちが できたよ！";
  } else if(st.taskType==="moya"){
    if(runState.task<st.taskTarget) msg = "モヤを きらきらで きれいにしよう";
    else if(runState.stars<st.starTarget) msg = "ほしの かけらを あつめよう";
    else if(stageObjs.whale && !stageObjs.whaleAwake) msg = "ほしくじらに ひかりを とどけよう";
    else msg = "みんな げんきに なったよ！";
  } else return;
  if(msg && msg!==stageObjs.lastPhaseMsg){ stageObjs.lastPhaseMsg = msg; showToast(msg, 1700); }
}
function triggerHintPulse(){
  if(!stageObjs || !player) return;
  var best=null, bestD=1e9;
  stageObjs.rescues.forEach(function(o){ if(o.userData.rescued) return; var d=player.position.distanceTo(o.position); if(d<bestD){bestD=d;best=o;} });
  stageObjs.tasks.forEach(function(o){ if(o.userData.done) return; var d=player.position.distanceTo(o.position); if(d<bestD){bestD=d;best=o;} });
  if(best){ best.userData.hintPulse = 2.2; showToast("ヒント：ひかる ほうへ すすんでみよう！", 1800); }
}
function doSparkleAction(){
  if(!activeAction) return;
  var st = STAGES[curStageIdx];
  if(activeAction.type==="rescue"){
    activeAction.obj.userData.rescued = true;
    if(activeAction.obj.userData.beam){ activeAction.obj.remove(activeAction.obj.userData.beam); activeAction.obj.userData.beam=null; }
    stageObjs.followers = stageObjs.followers || [];
    stageObjs.followers.push(activeAction.obj);
    runState.rescued++;
    sfx.rescue();
    burst(activeAction.obj.position.x, activeAction.obj.position.y+0.5, activeAction.obj.position.z, 0xffd6e8, 20, 4);
    showToast("たすけたよ！ ついてくるよ");
    markProgress();
  } else if(activeAction.type==="task"){
    var obj = activeAction.obj;
    var needed = obj.userData.tapsNeeded||1;
    if(needed>1){
      var boost = (obj.userData.kind==="switch") ? (CHARACTERS[S.selectedCharacter].pushMul||1) : 1;
      obj.userData.tapsDone = (obj.userData.tapsDone||0) + boost;
      updateChargeVisual(obj);
      sfx.sparkle();
      markProgress();
      if(obj.userData.tapsDone < needed){ return; }
    }
    obj.userData.done = true;
    if(obj.userData.beam){ obj.remove(obj.userData.beam); obj.userData.beam=null; }
    runState.task++;
    if(st.taskType==="cloud"){
      sfx.clean(); burst(obj.position.x,obj.position.y,obj.position.z,0xffffff,18,3); showToast("あめが やんで にじが でたよ！");
      if(obj.userData.chargeMat) obj.userData.chargeMat.color.set(0xeaf6ff);
      var mini = makeMiniRainbow(); mini.position.set(0,0.5,0); obj.add(mini);
    }
    else if(st.taskType==="switch"){
      sfx.fix(); burst(obj.position.x,obj.position.y,obj.position.z,0xfff2a8,16,3); showToast("のりものが なおったよ！");
      if(obj.userData.chargeMat) obj.userData.chargeMat.color.set(0xfff2a8);
      if(obj.userData.spinPart){ stageObjs.anim.rideSpins = stageObjs.anim.rideSpins||[]; stageObjs.anim.rideSpins.push(obj.userData.spinPart); }
    }
    else if(st.taskType==="flower"){
      sfx.bloom(); burst(obj.position.x,obj.position.y+0.5,obj.position.z,0xff9ecb,16,3); showToast("はなが さいたよ！");
      if(obj.userData.bud){ obj.userData.bud.scale.setScalar(0.24); }
    }
    else if(st.taskType==="moya"){
      sfx.clean(); burst(obj.position.x,obj.position.y,obj.position.z,0x9ff7c8,20,3); showToast("モヤが きえたよ！");
      obj.visible = false;
    }
    markProgress();
    if(stageObjs.onProgress) stageObjs.onProgress();
  } else if(activeAction.type==="whale"){
    stageObjs.whaleAwake = true;
    sfx.fix();
    showToast("ほしくじらに ひかりが とどいたよ！");
    markProgress();
  }
  updateHud(); updateGoalText(st);
  announceNextObjective(st);
  checkStageComplete();
}

/* ---------- 落下復帰 ---------- */
function checkFallRecovery(dt){
  lastSafeTimer -= dt;
  if(player && lastSafeTimer<=0){
    var d = Math.sqrt(player.position.x*player.position.x + player.position.z*player.position.z);
    var st = STAGES[curStageIdx];
    if(d < st.arena*0.95 && player.position.y > -3){ lastSafe.copy(player.position); }
    lastSafeTimer = 0.4;
  }
  if(player && player.position.y < -6){
    sfx.fall();
    player.position.copy(lastSafe); player.position.y = 0;
    showToast("だいじょうぶ！ ここから もういちど");
  }
}

/* ---------- ステージクリア判定 ---------- */
function checkStageComplete(){
  var st = STAGES[curStageIdx];
  if(runState.done) return;
  if(st.taskType==="moya"){
    if(runState.task>=st.taskTarget && runState.stars>=st.starTarget && stageObjs.whaleAwake){
      finishWhaleSequence();
    }
    return;
  }
  if(runState.rescued>=st.rescueTarget && runState.task>=st.taskTarget){
    if(stageObjs.goal && !stageObjs.goal.userData.active){
      stageObjs.goal.userData.active = true;
      showToast("ひかる わっかへ すすもう！");
    }
  }
}
function finishWhaleSequence(){
  runState.done = true; runState.finishing = true;
  showToast("みんな げんきに なったよ！", 2400);
  sfx.clear();
  var whale = stageObjs.whale;
  var gatherAnimals = stageObjs.zoneAnimals || [];
  var centerPos = whale ? whale.position.clone() : new THREE.Vector3();
  var playerPos = player ? player.position.clone() : new THREE.Vector3();
  var t0 = performance.now();
  (function grow(){
    var el = (performance.now()-t0)/1800;
    var elC = Math.min(1, el);
    if(whale){
      whale.scale.setScalar(elC);
      if(whale.userData.eyes) whale.userData.eyes.forEach(function(e){ e.scale.y = 0.06 + elC*0.16; });
    }
    gatherAnimals.forEach(function(a){ a.position.lerp(centerPos.clone().add(a.userData.gatherOffset||new THREE.Vector3()), 0.03); });
    if(el<1){ requestAnimationFrame(grow); } else { swim(); }
  })();
  function swim(){
    var t1 = performance.now();
    (function circle(){
      var el2 = (performance.now()-t1)/2600;
      if(whale){
        var ang = el2*Math.PI*2;
        whale.position.set(playerPos.x+Math.sin(ang)*4.5, 2.6+Math.sin(el2*6)*0.3, playerPos.z+Math.cos(ang)*4.5-2);
        whale.rotation.y = ang+Math.PI/2;
      }
      gatherAnimals.forEach(function(a){ a.position.lerp(centerPos.clone().add(a.userData.gatherOffset||new THREE.Vector3()), 0.04); });
      if(el2<1){ requestAnimationFrame(circle); } else { setTimeout(function(){ completeStage(); }, 500); }
    })();
  }
}
function reachGoal(){
  if(runState.done) return;
  runState.done = true;
  sfx.clear();
  burst(player.position.x, player.position.y+0.6, player.position.z, 0xffe36a, 30, 5);
  setTimeout(function(){ completeStage(); }, 500);
}

function completeStage(){
  var st = STAGES[curStageIdx];
  var stars = 1; /* クリアで必ず★1 */
  var rescueOk = st.rescueTarget===0 ? true : (runState.rescued>=st.rescueTarget);
  var taskOk = st.taskTarget===0 ? true : (runState.task>=st.taskTarget);
  var collectOk = runState.stars >= st.starTarget;
  if(rescueOk && taskOk) stars++;
  if(collectOk) stars++;
  stars = Math.min(3, Math.max(1, stars));

  if(stars > (S.stageStars[curStageIdx]||0)) S.stageStars[curStageIdx] = stars;
  S.rescued[curStageIdx] = Math.max(S.rescued[curStageIdx]||0, runState.rescued);
  S.collected[curStageIdx] = Math.max(S.collected[curStageIdx]||0, runState.stars);
  if(curStageIdx+1 > S.unlockedStage && curStageIdx+1 < STAGES.length) S.unlockedStage = curStageIdx+1;
  S.totalStars = S.stageStars.reduce(function(a,b){return a+b;},0);

  var newItem = null;
  REWARD_TABLE.forEach(function(r){
    if(S.totalStars>=r.at && S.unlockedItems.indexOf(r.id)<0){
      S.unlockedItems.push(r.id); newItem = r;
    }
  });
  saveGame();

  if(bgmInst){ bgmInst.stop(); bgmInst=null; }
  showResultScreen(stars, newItem);
}

function showResultScreen(stars, newItem){
  var st = STAGES[curStageIdx];
  var starHtml = "";
  for(var i=0;i<3;i++) starHtml += '<span class="'+(i<stars?"on":"off")+'">★</span>';
  $("resStars").innerHTML = starHtml;
  var lines = [st.name+" クリア！"];
  if(st.rescueTarget>0) lines.push("たすけた どうぶつ："+runState.rescued+"/"+st.rescueTarget);
  lines.push("あつめた ほし："+runState.stars+"/"+st.starTarget);
  $("resDetail").innerHTML = lines.join("<br>");
  $("resNewItem").textContent = newItem ? ("あたらしい ごほうび："+newItem.name+"！") : "";
  if(newItem) sfx.reward();
  $("btnNext").classList.toggle("hidden", curStageIdx+1>=STAGES.length);
  showScreen("scrResult");
}

/* ---------- メインループ ---------- */
var lastT = performance.now();
function tick(now){
  requestAnimationFrame(tick);
  if(!renderer) return;
  var dt = Math.min(0.05, (now-lastT)/1000);
  lastT = now;
  if(document.hidden) return;

  if(player && stageObjs && !runState.finishing){
    /* 上昇気流：範囲に入るとふわっと上の雲へ（操作不能時間は短く、落下扱いにしない） */
    if(stageObjs.updraft && !stageObjs.riding){
      var du = player.position.distanceTo(stageObjs.updraft.pos);
      if(du < stageObjs.updraft.radius){
        stageObjs.riding = {t:0};
        showToast("ふわっと うえの くもへ！", 1300);
        sfx.sparkle();
      }
    }
    if(stageObjs.riding){
      stageObjs.riding.t += dt;
      var rt = stageObjs.riding.t;
      if(rt<0.7){ player.position.y = (rt/0.7)*2.4; }
      else if(rt<1.0){ var lp=(rt-0.7)/0.3; player.position.set(stageObjs.updraft.landAt.x, (1-lp)*2.4, stageObjs.updraft.landAt.z); }
      else { player.position.copy(stageObjs.updraft.landAt); player.position.y=0; lastSafe.copy(player.position); stageObjs.riding=null; }
    }
    var iv = stageObjs.riding ? {x:0,y:0} : inputVec();
    var mvLen = Math.sqrt(iv.x*iv.x+iv.y*iv.y);
    var c = CHARACTERS[S.selectedCharacter];
    if(mvLen>0.08){
      var camFwd = new THREE.Vector3();
      camera.getWorldDirection(camFwd);
      camFwd.y = 0; camFwd.normalize();
      var camRight = new THREE.Vector3().crossVectors(camFwd, camera.up).normalize();
      var mx = Math.min(1, mvLen);
      var move = new THREE.Vector3()
        .addScaledVector(camFwd, -iv.y)
        .addScaledVector(camRight, iv.x);
      if(move.lengthSq()>0.0001){
        move.normalize().multiplyScalar(5.2*c.speed*mx*dt);
        player.position.add(move);
        var targetRot = Math.atan2(move.x, move.z);
        var dr = targetRot - player.rotation.y;
        while(dr>Math.PI) dr-=Math.PI*2; while(dr<-Math.PI) dr+=Math.PI*2;
        player.rotation.y += dr*Math.min(1,dt*10);
      }
      player.position.y = Math.abs(Math.sin(now*0.008))*0.06;
    }
    animateCharacterMesh(player, dt, now, mvLen>0.08);
    /* 星の自動収集（磁石半径） */
    var st = STAGES[curStageIdx];
    var magnetR = 1.1 + (c.magnet||0);
    for(var i=stageObjs.stars.length-1;i>=0;i--){
      var star = stageObjs.stars[i];
      if(!star.visible) continue;
      star.rotation.y += dt*2.2;
      star.position.y = (star.userData.baseY!==undefined?star.userData.baseY:0.7) + Math.sin(now*0.0025+i)*0.12;
      var d = player.position.distanceTo(star.position);
      if(d<magnetR){
        star.visible=false; runState.stars++; sfx.star();
        burst(star.position.x,star.position.y,star.position.z,0xffe36a,8,3);
        markProgress();
        updateHud(); updateGoalText(st); announceNextObjective(st); checkStageComplete();
        if(stageObjs.onProgress) stageObjs.onProgress();
      }
    }
    /* ゴール判定 */
    if(stageObjs.goal && stageObjs.goal.userData.active && !runState.done){
      var dg = player.position.distanceTo(stageObjs.goal.position);
      stageObjs.goal.rotation.z += dt*1.2;
      if(dg < 1.6) reachGoal();
    }
    /* タスクの見た目アニメ（軽量） */
    stageObjs.tasks.forEach(function(t){ if(t.visible) t.rotation.y += dt*0.5; });
    /* 迷子どうぶつ：待機中はプレイヤーを見て小さく跳ね、救助後は後ろをついてくる */
    stageObjs.rescues.forEach(function(a){
      if(a.userData.rescued) return;
      a.position.y = Math.abs(Math.sin(now*0.006 + a.id))*0.08;
      var toPlayer = new THREE.Vector3().subVectors(player.position, a.position); toPlayer.y=0;
      if(toPlayer.lengthSq()>0.01){
        var lookRot = Math.atan2(toPlayer.x, toPlayer.z);
        var dr = lookRot - a.rotation.y; while(dr>Math.PI) dr-=Math.PI*2; while(dr<-Math.PI) dr+=Math.PI*2;
        a.rotation.y += dr*Math.min(1,dt*2);
      }
    });
    if(stageObjs.followers && stageObjs.followers.length){
      var behind = new THREE.Vector3(-Math.sin(player.rotation.y),0,-Math.cos(player.rotation.y));
      stageObjs.followers.forEach(function(f, idx){
        var tp = player.position.clone().addScaledVector(behind, 0.75+idx*0.55);
        tp.y = Math.abs(Math.sin(now*0.006+idx*1.7))*0.1;
        f.position.lerp(tp, Math.min(1,dt*4));
        var faceDir = new THREE.Vector3().subVectors(player.position, f.position); faceDir.y=0;
        if(faceDir.lengthSq()>0.02) f.rotation.y = Math.atan2(faceDir.x, faceDir.z);
      });
    }
    if(stageObjs.whale && stageObjs.whaleAwake){ stageObjs.whale.position.y = 2.4 + Math.sin(now*0.0012)*0.4; stageObjs.whale.rotation.y += dt*0.15; }

    /* 足元のやわらかい影 */
    if(stageObjs.playerShadow){ stageObjs.playerShadow.position.x = player.position.x; stageObjs.playerShadow.position.z = player.position.z; }

    /* 情景アニメーション（草花の揺れ・風車・雲の移動・光の粒・のりもの回転） */
    if(stageObjs.anim){
      var an = stageObjs.anim;
      if(an.grass) an.grass.forEach(function(gr){ gr.rotation.z = Math.sin(now*0.0016+gr.userData.sway)*0.12; });
      if(an.windmillBlades) an.windmillBlades.forEach(function(bl){ bl.rotation.z += dt*1.6; });
      if(an.clouds) an.clouds.forEach(function(cl){ cl.position.x += dt*cl.userData.speed; if(cl.position.x>cl.userData.range) cl.position.x=-cl.userData.range; });
      if(an.motes) an.motes.forEach(function(m){ var t=now*0.0009+m.userData.phase; m.position.set(m.userData.cx+Math.cos(t)*m.userData.r, m.userData.cy+Math.sin(t*1.6)*0.3, m.userData.cz+Math.sin(t)*m.userData.r); });
      if(an.footprints) an.footprints.forEach(function(fp,i){ fp.material.opacity = 0.35+Math.abs(Math.sin(now*0.002+i*0.6))*0.3; });
      if(an.rideSpins) an.rideSpins.forEach(function(sp){ sp.rotation.y += dt*0.9; });
      if(an.ferrisWheel) an.ferrisWheel.userData.hub.rotation.z += dt*(an.ferrisWheelSpin?0.35:0);
    }

    /* ヒント：迷子/タスクのビーム点滅、しばらく進行がなければ自動で発生 */
    [stageObjs.rescues, stageObjs.tasks].forEach(function(list){
      list.forEach(function(o){
        if(o.userData.hintPulse>0){
          o.userData.hintPulse -= dt;
          if(o.userData.beam){ var s=1+Math.max(0,Math.sin(now*0.01))*0.6; o.userData.beam.scale.x=o.userData.beam.scale.z=s*0.22; }
        }
      });
    });
    if(now-lastProgressAt>25000 && now-lastHintAt>25000 && !runState.done){ triggerHintPulse(); lastHintAt=now; }

    /* コンことぎつね：ちかくの迷子の方向へ耳の上の矢印が向く */
    if(player.userData.hintArrow){
      var nearestR=null, nrD=1e9;
      stageObjs.rescues.forEach(function(r){ if(r.userData.rescued) return; var d=player.position.distanceTo(r.position); if(d<nrD){nrD=d; nearestR=r;} });
      if(nearestR){
        player.userData.hintArrow.visible = true;
        var toR = new THREE.Vector3().subVectors(nearestR.position, player.position); toR.y=0;
        if(toR.lengthSq()>0.01) player.userData.hintArrow.rotation.y = Math.atan2(toR.x,toR.z) - player.rotation.y;
      } else { player.userData.hintArrow.visible = false; }
    }

    checkFallRecovery(dt);

    /* コンテキストアクション検出 */
    var prevAction = activeAction;
    activeAction = findNearbyAction();
    $("sparkleBtn").classList.toggle("show", !!activeAction);
    if(activeAction && !prevAction) showToast("ちかづいて きらきら してね！", 1300);

    /* カメラ */
    var camTargetPos = new THREE.Vector3(player.position.x, player.position.y+1.2, player.position.z);
    var camPos = new THREE.Vector3(camTargetPos.x - Math.sin(camYaw)*camDist, camTargetPos.y+camHeight, camTargetPos.z - Math.cos(camYaw)*camDist);
    camera.position.lerp(camPos, Math.min(1,dt*4));
    camera.lookAt(camTargetPos);
  }

  updateParticles(dt);
  if(player && player.userData.extras && player.userData.extras.wandStar) player.userData.extras.wandStar.rotation.y += dt*3;

  renderer.render(scene, camera);
}

/* ================= 画面遷移ハンドラ ================= */
$("btnStart").addEventListener("click", function(){ ensureAudio(); pickedChar=S.selectedCharacter; buildCharGrid(); showScreen("scrChar"); });
$("btnContinue").addEventListener("click", function(){ ensureAudio(); buildStageGrid(); showScreen("scrStage"); playBGM("magical"); });
$("btnMusicTitle").addEventListener("click", function(){ ensureAudio(); toggleBGM(); });
$("btnCharBack").addEventListener("click", function(){ showScreen("scrTitle"); });
$("btnCharGo").addEventListener("click", function(){
  S.selectedCharacter = pickedChar; saveGame();
  buildStageGrid(); showScreen("scrStage"); playBGM("magical");
});
$("btnStageBack").addEventListener("click", function(){ showScreen("scrTitle"); if(bgmInst){bgmInst.stop();bgmInst=null;} });
$("btnOpenDress").addEventListener("click", function(){ buildDressScreen(); showScreen("scrDress"); });
$("btnDressBack").addEventListener("click", function(){ buildStageGrid(); showScreen("scrStage"); });
$("btnRetry").addEventListener("click", function(){ startStage(curStageIdx); });
$("btnToStages").addEventListener("click", function(){ if(bgmInst){bgmInst.stop();bgmInst=null;} clearStageObjs(); if(player){scene.remove(player);player=null;} buildStageGrid(); showScreen("scrStage"); playBGM("magical"); });
$("btnNext").addEventListener("click", function(){ startStage(curStageIdx+1); });

/* ---------- 初期化 ---------- */
(function init(){
  loadGame();
  var hasProgress = (S.unlockedStage>0) || (S.totalStars>0) || S.stageStars.some(function(v){return v>0;});
  if(hasProgress) $("btnContinue").classList.remove("hidden");
  syncBgmIcons();
  onResize();
  if(webglOK) requestAnimationFrame(tick);
  showScreen("scrTitle");
})();
  </script>
