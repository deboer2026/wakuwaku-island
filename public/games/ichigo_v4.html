<style>
:root{--pink:#f65386;--deep:#a92b55;--cream:#fff8df;--leaf:#62bf66;--ink:#6c3550}*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#91d9ff;font-family:"M PLUS Rounded 1c","Hiragino Maru Gothic ProN",sans-serif;color:var(--ink)}#app{position:relative;width:100%;height:100svh;overflow:hidden;background:linear-gradient(#8fd9ff,#d9f8ff 55%,#9ee48d)}canvas{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}.screen{position:absolute;inset:0;z-index:5;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:calc(18px + var(--sat,0px)) 18px calc(18px + var(--sab,0px));transition:opacity .28s,transform .28s}.screen.off{opacity:0;pointer-events:none;transform:scale(1.03)}#title{background:linear-gradient(180deg,rgba(179,231,255,.16),rgba(255,223,235,.12))}.title-card{width:min(94vw,530px);text-align:center;filter:drop-shadow(0 12px 18px rgba(88,71,90,.18))}.logo-kicker{font-size:clamp(13px,2.8vw,18px);font-weight:900;letter-spacing:.12em;color:#8d4f73;text-shadow:0 1px #fff}.logo{margin:4px 0 7px;font-size:clamp(43px,11vw,72px);font-weight:900;line-height:1;letter-spacing:.04em;color:var(--cream);text-shadow:0 4px 0 #f85d8c,0 8px 0 rgba(162,48,83,.28),0 0 20px #fff}.subtitle{font-weight:900;font-size:clamp(15px,3.4vw,20px);color:#85536c}.hi{display:inline-flex;gap:7px;align-items:center;margin:14px 0 20px;background:rgba(255,255,255,.77);border:2px solid #fff;border-radius:99px;padding:7px 16px;font-size:13px;font-weight:900;color:#a14568;box-shadow:0 4px 0 rgba(136,74,86,.14)}.berry-dot{width:14px;height:14px;border-radius:50% 50% 55% 55%;background:#f54678;border:2px solid #bd2854;position:relative}.berry-dot:after{content:"";position:absolute;left:2px;top:-6px;border-left:5px solid transparent;border-right:5px solid transparent;border-bottom:7px solid #57a851}.big-btn,.soft-btn,.stage{font:900 18px inherit;border:0;cursor:pointer;min-height:60px}.big-btn{width:min(90vw,360px);border-radius:24px;color:#8e254d;background:linear-gradient(180deg,#fffdf3,#ffe3eb);box-shadow:0 7px 0 #df7e9d,0 12px 23px rgba(123,58,77,.22);border:2px solid #fff;transition:transform .12s}.big-btn:active,.soft-btn:active,.stage:active{transform:translateY(4px);box-shadow:none}.big-btn strong{font-size:22px}.big-btn small{display:block;font-size:12px;opacity:.7}.title-actions{display:grid;gap:13px;justify-items:center}.mini-row{display:flex;gap:10px;margin-top:13px}.soft-btn{min-height:42px;border-radius:18px;padding:8px 15px;font-size:13px;color:#7c4a59;background:rgba(255,255,255,.76);border:2px solid #fff;box-shadow:0 3px 0 rgba(132,80,96,.15)}.panel{width:min(94vw,620px);max-height:calc(100svh - 32px - var(--sat,0px) - var(--sab,0px));overflow:auto;border:3px solid rgba(255,255,255,.85);border-radius:28px;padding:20px;background:linear-gradient(145deg,rgba(255,254,239,.94),rgba(255,224,234,.94));box-shadow:0 15px 35px rgba(74,59,83,.24);text-align:center}.panel h2{margin:0 0 10px;font-size:clamp(24px,6vw,34px);color:#ad3d65}.panel p{font-weight:800}.char-grid{display:grid;grid-template-columns:repeat(2,minmax(120px,1fr));gap:13px;margin:15px 0}.char{min-height:130px;border:3px solid #fff;border-radius:22px;background:linear-gradient(160deg,#fff,#f7fff0);font:900 16px inherit;color:#835169;box-shadow:0 5px 0 #dfb9c7;cursor:pointer}.char .portrait{height:86px;display:block;border-radius:19px 19px 0 0;background:linear-gradient(#a9e5ff,#b8ee8e)}.char small{display:block;margin-top:4px;font-size:11px;color:#aa6680}.stage-list{display:grid;gap:10px;margin:14px 0}.stage{display:flex;align-items:center;text-align:left;gap:12px;padding:10px 13px;border:2px solid #fff;border-radius:19px;background:linear-gradient(140deg,#fffdf0,#fff1c9);color:#82495f;box-shadow:0 4px 0 #d7a272}.stage.lock{filter:saturate(.2);opacity:.55;cursor:not-allowed}.stage-num{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(#ff8da8,#ed4676);color:#fff;font-size:19px;box-shadow:inset 0 -3px rgba(125,31,65,.22)}.stage b{display:block;font-size:15px}.stage small{font-weight:800;color:#a27669}.stage em{margin-left:auto;font-style:normal;color:#f0a300}.nav{position:absolute;z-index:10;top:calc(10px + var(--sat,0px));left:12px;right:12px;display:none;justify-content:space-between;pointer-events:none}.nav>*{pointer-events:auto}.nav button{border:2px solid #fff;border-radius:20px;padding:8px 12px;background:rgba(255,254,241,.92);color:#7a4260;font:900 13px inherit;box-shadow:0 3px 0 rgba(117,75,83,.17)}#hud{position:absolute;z-index:11;left:50%;transform:translateX(-50%);top:calc(10px + var(--sat,0px));display:none;gap:9px;align-items:center;pointer-events:none}.chip{min-width:84px;padding:6px 12px;border:2px solid #fff;border-radius:19px;background:rgba(255,252,229,.92);box-shadow:0 3px 0 rgba(128,91,75,.16);text-align:center;color:#8c4b62}.chip span{display:block;font-size:10px;font-weight:900;color:#ba7282}.chip b{font-size:20px}.chip.urgent{animation:softPulse .8s infinite}@keyframes softPulse{50%{transform:scale(1.08);background:#fff3c2}}#combo{position:absolute;z-index:12;top:calc(92px + var(--sat,0px));left:50%;transform:translateX(-50%) scale(.8);opacity:0;color:#fff;border-radius:18px;background:#ef6d92;padding:6px 14px;font-weight:900;text-shadow:0 2px #b33e60;transition:.18s}.countdown{position:absolute;z-index:14;inset:0;display:grid;place-items:center;pointer-events:none;font-size:min(31vw,150px);font-weight:900;color:#fff8d5;text-shadow:0 8px 0 #e4517c,0 12px 22px rgba(113,54,76,.35);opacity:0}.countdown.show{animation:count .82s ease-out}@keyframes count{0%{opacity:0;transform:scale(.3)}25%{opacity:1;transform:scale(1.1)}100%{opacity:0;transform:scale(1.45)}}#result{background:radial-gradient(circle at 50% 17%,rgba(255,255,255,.94),rgba(255,204,223,.94) 45%,rgba(244,130,170,.95))}.result-bunny{height:115px;position:relative}.stars{font-size:40px;letter-spacing:5px;color:#ffc22e;text-shadow:0 3px #d97829}.score-big{font-size:55px;line-height:1;color:#ee4d78;text-shadow:0 3px #fff}.best{color:#c05b7b;font-weight:900}.result-actions{display:grid;gap:10px;margin-top:15px}.confetti{position:absolute;inset:0;overflow:hidden;pointer-events:none}.confetti i{position:absolute;width:9px;height:15px;border-radius:5px;animation:fall 2.8s linear infinite}@keyframes fall{from{transform:translateY(-20px) rotate(0)}to{transform:translateY(110svh) rotate(500deg)}}.toast{position:absolute;z-index:15;font-size:20px;font-weight:900;color:#fff;text-shadow:0 3px #ce3f6d;pointer-events:none;animation:toast .95s forwards}@keyframes toast{to{transform:translateY(-75px) scale(1.25);opacity:0}}@media(min-width:700px){#app{background:linear-gradient(90deg,#7ad3ff,#d9f9ff 20%,#b9ed8e 50%,#d9f9ff 80%,#7ad3ff)}.screen{max-width:760px;left:50%;right:auto;width:760px;transform:translateX(-50%)}.screen.off{transform:translateX(-50%) scale(1.03)}}
</style>

<body><main id="app"><canvas id="game"></canvas>
<div class="nav" id="nav"><button id="back">← もどる</button><button id="music">おと ♪</button></div>
<div id="hud"><div class="chip"><span>いちご</span><b id="score">0</b></div><div class="chip" id="timeChip"><span>じかん</span><b id="time">30</b></div><div class="chip"><span>ベスト</span><b id="bestHud">0</b></div></div><div id="combo">キラキラ コンボ！</div><div class="countdown" id="count"></div>
<section class="screen" id="title"><div class="title-card"><div class="logo-kicker">いちごばたけ トイゲーム</div><div class="logo">いちご</div><div class="subtitle">いちごばたけへ<br>しゅっぱつ！</div><div class="hi"><i class="berry-dot"></i> ハイスコア <span id="hi">0</span></div><div class="title-actions"><button class="big-btn" id="start"><strong>はじめる</strong><small>30びょうで いちごを あつめよう！</small></button></div><div class="mini-row"><button class="soft-btn" id="titleMusic">おと ♪</button><button class="soft-btn" id="goBack">← もどる</button></div></div></section>
<section class="screen off" id="chars"><div class="panel"><h2>だれと いく？</h2><p>すきな どうぶつを えらんでね</p><div class="char-grid" id="charGrid"></div><button class="soft-btn" data-home>← もどる</button></div></section>
<section class="screen off" id="map"><div class="panel"><h2>いちごばたけ</h2><p>どの はたけへ いく？</p><div class="stage-list" id="stages"></div><button class="soft-btn" data-home>← もどる</button></div></section>
<section class="screen off" id="result"><div class="confetti" id="confetti"></div><div class="panel"><div class="result-bunny"></div><h2 id="resultTitle">いっぱい とれたね！</h2><div class="stars" id="stars">★</div><p>あつめた いちご</p><div class="score-big" id="resultScore">0</div><div class="best" id="newBest"></div><div class="result-actions"><button class="big-btn" id="retry"><strong>もういちど</strong></button><button class="soft-btn" id="toMap">はたけを えらぶ</button></div></div></section>
</main>
<script>
(()=>{'use strict';
const $=id=>document.getElementById(id), screens=['title','chars','map','result'].reduce((o,id)=>(o[id]=$(id),o),{});const canvas=$('game');
const SAFE_LS=(()=>{try{const k='__ww_storage_test__';localStorage.setItem(k,k);localStorage.removeItem(k);return localStorage}catch(_){const m={};return{getItem:k=>m[k]||null,setItem:(k,v)=>m[k]=String(v)}}})();
const read=(k,f)=>{try{return JSON.parse(SAFE_LS.getItem(k))||f}catch(_){return f}},write=(k,v)=>SAFE_LS.setItem(k,JSON.stringify(v));
const chars=[['usagi','うさぎ','#fff9f1','#f3a8bd'],['neko','ねこ','#ffcf98','#fa8d79'],['kuma','くま','#bf8a62','#f4ba9d'],['risu','りす','#e9a55f','#ffcf93']];
const stages=[['いちごばたけ',10,'field'],['もりの はたけ',13,'forest'],['ゆうやけ はたけ',16,'sunset'],['ほしぞら はたけ',19,'night'],['にじいろ はたけ',23,'rainbow'],['おうさま はたけ',28,'boss']];
const themes={field:['#91d9ff','#b9ed83','#6ebf54'],forest:['#9be5d1','#91c866','#49955a'],sunset:['#ffc28a','#eda267','#8dbf58'],night:['#6e87d8','#9a82bd','#5da15e'],rainbow:['#8edbff','#e4b1ef','#7ec45e'],boss:['#ffd09a','#f28a93','#83bd5c']};
let renderer,scene,camera,clock,ray,mouse,bunny,world,time=0,last=0,active=false,mode='stage',chosen=chars[0],stage=0,score=0,berries=[],particles=[],intro=0,bgm=null,progress=read('ichigo_v3_progress',{stars:{},unlocked:1}),high=Number(SAFE_LS.getItem('ichigo_hi')||0),audio=null;
function save(){write('ichigo_v3_progress',progress)}function screen(id){Object.entries(screens).forEach(([k,e])=>e.classList.toggle('off',k!==id));$('nav').style.display=id==='title'?'none':'flex'}
function sound(f=660,d=.09,v=.15){try{audio||=(new (window.AudioContext||window.webkitAudioContext)());const o=audio.createOscillator(),g=audio.createGain();o.type='triangle';o.frequency.value=f;o.connect(g);g.connect(audio.destination);g.gain.setValueAtTime(v,audio.currentTime);g.gain.exponentialRampToValueAtTime(.001,audio.currentTime+d);o.start();o.stop(audio.currentTime+d)}catch(_){}}
function music(){if(!bgm){bgm=typeof WakuwakuBGM!=='undefined'?new WakuwakuBGM('fruity'):{start(){},toggle(){return true}}}const on=bgm.toggle?bgm.toggle():true;$('music').textContent=$('titleMusic').textContent=on?'おと ♪':'おと ×'}
function init(){try{renderer=new THREE.WebGLRenderer({canvas,antialias:true,alpha:true});renderer.setPixelRatio(Math.min(devicePixelRatio||1,2));renderer.outputEncoding=THREE.sRGBEncoding;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=.82;renderer.setClearColor(0xa9e8ff,1);scene=new THREE.Scene();scene.fog=new THREE.Fog(0xa9e8ff,19,42);camera=new THREE.PerspectiveCamera(42,1,.1,100);camera.position.set(0,7.3,11);camera.lookAt(0,0,0);clock=new THREE.Clock();ray=new THREE.Raycaster();mouse=new THREE.Vector2();scene.add(new THREE.HemisphereLight(0xeaf8ff,0x76ad55,1.25));const sun=new THREE.DirectionalLight(0xfff5d5,1.15);sun.position.set(5,10,6);scene.add(sun);world=new THREE.Group();scene.add(world);buildWorld();bunny=makeBunny(chosen);scene.add(bunny);resize();addEventListener('resize',resize);document.addEventListener('visibilitychange',()=>{if(document.hidden)last=performance.now()});canvas.addEventListener('pointerdown',tap,{passive:false});requestAnimationFrame(loop)}catch(_){canvas.style.display='none'}}
function mat(c,em=0){return new THREE.MeshLambertMaterial({color:c,emissive:c,emissiveIntensity:em})}function mesh(g,m,x=0,y=0,z=0){const q=new THREE.Mesh(g,m);q.position.set(x,y,z);return q}
function buildWorld(){const ground=mesh(new THREE.PlaneGeometry(42,38),mat(0x72bd5d),0,0,0);ground.rotation.x=-Math.PI/2;world.add(ground);const soil=mat(0x9d6a3c),leaf=mat(0x459d45),wood=mat(0xb8743d),white=mat(0xf9fff4);for(let z=-13;z<11;z+=3){for(let x=-17;x<18;x+=3){const plant=new THREE.Group();plant.add(mesh(new THREE.SphereGeometry(.18,10,8),leaf,x,.14,z));plant.add(mesh(new THREE.SphereGeometry(.14,10,8),leaf,x+.25,.13,z+.1));world.add(plant)}}for(let x=-18;x<=18;x+=3){for(const z of[-15,13]){const post=mesh(new THREE.CylinderGeometry(.07,.1,1.05,10),wood,x,.53,z);world.add(post);world.add(mesh(new THREE.BoxGeometry(2.9,.08,.08),wood,x+1.45,.8,z))}}const hill=mat(0x92cd78);world.add(mesh(new THREE.SphereGeometry(8,20,14),hill,-12,2,-16),mesh(new THREE.SphereGeometry(7,20,14),hill,13,1.8,-17));const glass=mat(0xd9ffff,.08),frame=mat(0xf9f3d5);const house=new THREE.Group();house.position.set(-8,.65,-8);house.add(mesh(new THREE.BoxGeometry(3,2,2.2),glass));house.add(mesh(new THREE.ConeGeometry(2.2,1.3,4),frame,0,1.65,0));world.add(house);const wind=new THREE.Group();wind.position.set(9,1.8,-9);wind.add(mesh(new THREE.CylinderGeometry(.22,.32,3.6,12),wood));for(let i=0;i<4;i++){const blade=mesh(new THREE.BoxGeometry(.25,1.7,.09),white);blade.position.set(Math.sin(i*Math.PI/2)*.65,1.65+Math.cos(i*Math.PI/2)*.65,0);blade.rotation.z=i*Math.PI/2;wind.add(blade)}wind.userData.wind=true;world.add(wind);for(let i=0;i<18;i++){const flower=mesh(new THREE.SphereGeometry(.09,8,8),mat(i%2?0xffb3d0:0xffed86),-16+Math.random()*32,.25,-12+Math.random()*23);world.add(flower)}}
function makeBunny(c){const g=new THREE.Group(),fur=mat(c[2]),pink=mat(c[3]),dark=mat(0x4a3154),cream=mat(0xffefd9),apron=mat(0xf75d87);g.add(mesh(new THREE.SphereGeometry(.82,24,16),fur,0,1.25,0));g.add(mesh(new THREE.SphereGeometry(.58,24,16),fur,0,.55,.08));for(const x of[-.38,.38]){g.add(mesh(new THREE.SphereGeometry(.18,16,12),fur,x,.14,.12));g.add(mesh(new THREE.SphereGeometry(.12,16,12),fur,x,.38,.47))}for(const x of[-.38,.38]){const ear=mesh(new THREE.SphereGeometry(.18,16,12),fur,x,2.1,0);ear.scale.y=3.2;g.add(ear);const inner=mesh(new THREE.SphereGeometry(.10,16,12),pink,x,2.1,.15);inner.scale.y=3;g.add(inner)}for(const x of[-.27,.27]){g.add(mesh(new THREE.SphereGeometry(.15,12,10),dark,x,1.38,.72));g.add(mesh(new THREE.SphereGeometry(.055,10,8),cream,x-.035,1.43,.84))}g.add(mesh(new THREE.SphereGeometry(.11,12,10),pink,0,1.12,.78));const bib=mesh(new THREE.BoxGeometry(.64,.52,.09),apron,0,.72,.56);bib.rotation.x=-.1;g.add(bib);g.add(mesh(new THREE.SphereGeometry(.25,16,12),fur,0,.65,-.52));g.userData={char:c,blink:0,happy:0};return g}
function clearBerries(){berries.forEach(b=>scene.remove(b));berries=[]}function makeBerry(){if(!active||berries.length>9)return;const b=new THREE.Group(),red=mat(Math.random()<.12?0xffc12e:0xf34871,.04),leaf=mat(0x4aa94d);const fruit=mesh(new THREE.SphereGeometry(.31,18,12),red);fruit.scale.set(1,1.12,.82);b.add(fruit);for(let i=0;i<4;i++){const l=mesh(new THREE.ConeGeometry(.13,.28,6),leaf);l.position.y=.29;l.rotation.z=i*Math.PI/2;b.add(l)}b.userData={berry:true,phase:Math.random()*6,bob:Math.random()*6,used:false};b.position.set(-5.2+Math.random()*10.4,.55,-2.5+Math.random()*5);scene.add(b);berries.push(b)}
function startGame(){Object.values(screens).forEach(e=>e.classList.add('off'));$('count').textContent='3';$('count').classList.add('show');setTimeout(()=>{$('count').textContent='2';$('count').classList.remove('show');void $('count').offsetWidth;$('count').classList.add('show')},700);setTimeout(()=>{$('count').textContent='1';$('count').classList.remove('show');void $('count').offsetWidth;$('count').classList.add('show')},1400);setTimeout(()=>{$('count').textContent='スタート！';$('count').classList.remove('show');void $('count').offsetWidth;$('count').classList.add('show');active=true;time=30;score=0;clearBerries();for(let i=0;i<5;i++)makeBerry();$('hud').style.display='flex';$('nav').style.display='flex';$('bestHud').textContent=high;bgm?.start?.();sound(784,.16,.18)},2100)}
function tap(e){if(!active)return;e.preventDefault();const r=canvas.getBoundingClientRect();mouse.x=((e.clientX-r.left)/r.width)*2-1;mouse.y=-((e.clientY-r.top)/r.height)*2+1;ray.setFromCamera(mouse,camera);const hit=ray.intersectObjects(berries,true)[0];if(!hit)return;let b=hit.object;while(b&&!b.userData.berry)b=b.parent;if(!b||b.userData.used)return;b.userData.used=true;score++;sound(720,.08,.18);for(let i=0;i<11;i++)particles.push({p:b.position.clone(),v:new THREE.Vector3((Math.random()-.5)*3,Math.random()*2+.8,(Math.random()-.5)*2),life:.55,col:i%2?0xffe66a:0xff82aa});const t=document.createElement('div');t.className='toast';t.textContent='+1';t.style.left=`${e.clientX-r.left}px`;t.style.top=`${e.clientY-r.top}px`;$('app').appendChild(t);setTimeout(()=>t.remove(),1000);scene.remove(b);berries=berries.filter(x=>x!==b);setTimeout(makeBerry,180);if(score%5===0){$('combo').style.opacity=1;$('combo').style.transform='translateX(-50%) scale(1)';sound(1047,.16,.2);setTimeout(()=>{$('combo').style.opacity=0;$('combo').style.transform='translateX(-50%) scale(.8)'},850)}}
function end(){active=false;$('hud').style.display='none';let stars=score>=stages[stage][1]?3:score>=Math.ceil(stages[stage][1]*.65)?2:1;progress.stars[stage+1]=Math.max(progress.stars[stage+1]||0,stars);progress.unlocked=Math.max(progress.unlocked,Math.min(6,stage+2));save();const was=score>high;if(was){high=score;SAFE_LS.setItem('ichigo_hi',String(high))}$('resultScore').textContent=score;$('stars').textContent='★'.repeat(stars)+'☆'.repeat(3-stars);$('newBest').textContent=was?'ハイスコア こうしん！':'';$('resultTitle').textContent=score>=stages[stage][1]?'いっぱい とれたね！':'また いこうね！';const c=$('confetti');c.innerHTML='';for(let i=0;i<26;i++){const e=document.createElement('i');e.style.left=Math.random()*100+'%';e.style.background=['#f94d78','#ffdb5d','#7ecb72','#8fceff'][i%4];e.style.animationDelay=Math.random()*1.2+'s';c.appendChild(e)}screen('result');sound(784,.15,.2);setTimeout(()=>sound(1047,.18,.2),110)}
function loop(now){requestAnimationFrame(loop);const dt=Math.min(.05,last?(now-last)/1000:0);last=now;const e=clock.getElapsedTime();if(active){time-=dt;if(time<=0){time=0;end()}$('score').textContent=score;$('time').textContent=Math.ceil(time);$('timeChip').classList.toggle('urgent',time<8);if(Math.random()<dt*1.8)makeBerry()}if(bunny){bunny.position.y=.12+Math.sin(e*2.3)*.055;bunny.rotation.y=Math.sin(e*.55)*.13;bunny.userData.blink+=dt;const eyeScale=bunny.userData.blink%4.3>.13?1:.12; bunny.children.filter(x=>x.material&&x.material.color&&x.material.color.getHex()===0x4a3154).forEach(x=>x.scale.y=eyeScale);if(active)bunny.rotation.z=Math.sin(e*8)*.025}berries.forEach(b=>{b.rotation.y+=dt*1.8;b.position.y=.58+Math.sin(e*2+b.userData.bob)*.08});particles=particles.filter(q=>{q.p.addScaledVector(q.v,dt);q.v.y-=dt*4;q.life-=dt;if(q.life<=0){scene.remove(q.m);return false}if(!q.m){q.m=mesh(new THREE.SphereGeometry(.045,8,6),mat(q.col,.25));scene.add(q.m)}q.m.position.copy(q.p);q.m.scale.setScalar(q.life*2);return true});world.children.forEach(o=>{if(o.userData.wind)o.rotation.z=e*.8});camera.position.x=Math.sin(e*.15)*.5;camera.lookAt(0,.8,0);renderer.render(scene,camera)}
function resize(){if(!renderer)return;const w=innerWidth,h=innerHeight;renderer.setSize(w,h,false);camera.aspect=w/h;camera.updateProjectionMatrix()}
function charsUI(){const g=$('charGrid');g.innerHTML='';chars.forEach(c=>{const b=document.createElement('button');b.className='char';b.innerHTML=`<span class="portrait" style="background:linear-gradient(135deg,${c[2]},${c[3]})"></span>${c[1]}<small>いちごばたけの なかま</small>`;b.onclick=()=>{chosen=c;scene.remove(bunny);bunny=makeBunny(c);scene.add(bunny);screen('map');stagesUI();sound()};g.appendChild(b)});}
function stagesUI(){const g=$('stages');g.innerHTML='';stages.forEach((s,i)=>{const lock=i+1>progress.unlocked,b=document.createElement('button');b.className='stage'+(lock?' lock':'');b.disabled=lock;b.innerHTML=`<span class="stage-num">${i+1}</span><span><b>${s[0]}</b><small>もくひょう ${s[1]}こ</small></span><em>${'★'.repeat(progress.stars[i+1]||0)}</em>`;b.onclick=()=>{stage=i;scene.fog.color.set(themes[s[2]][0]);screen('title');startGame()};g.appendChild(b)});$('hi').textContent=high;$('bestHud').textContent=high;}
$('start').onclick=()=>{charsUI();screen('chars');sound()};$('titleMusic').onclick=music;$('music').onclick=music;$('goBack').onclick=()=>parent.postMessage({type:'goBack'},'*');$('back').onclick=()=>{active=false;clearBerries();$('hud').style.display='none';screen('map');stagesUI()};document.querySelectorAll('[data-home]').forEach(b=>b.onclick=()=>screen('title'));$('retry').onclick=()=>startGame();$('toMap').onclick=()=>{screen('map');stagesUI()};init();
})();
</script></body></html>
