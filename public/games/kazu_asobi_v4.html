<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>かずあそび〜かずのおまつり〜</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DotGothic16&family=M+PLUS+Rounded+1c:wght@700;900&display=swap" rel="stylesheet">
<script src="/games/wakuwaku_bgm.js"></script>
<script src="/games/safe_area.js"></script>
<script src="/games/analytics_bridge.js"></script>
<style>
:root{
  --night:#1A1030;--night2:#3A2159;--ground:#2E2340;--cream:#FFF6E8;--ink:#4A3B32;
  --lantern:#E8564F;--glow:#FFD76A;--pink:#FF8FB8;--mint:#9FE3D0;--lilac:#C9B6F5;
  --sat:0px;--sab:0px;--sal:0px;--sar:0px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--night);font-family:"M PLUS Rounded 1c",system-ui,sans-serif;color:var(--cream);touch-action:none;overscroll-behavior:none}
button{font:inherit;color:inherit;border:0;cursor:pointer;touch-action:manipulation}
#stage{position:fixed;inset:0;background:linear-gradient(var(--night),var(--night2));overflow:hidden}
#stage canvas{display:block;width:100%;height:100%;touch-action:none}
#vignette{position:fixed;inset:0;pointer-events:none;background:radial-gradient(circle at 50% 42%,transparent 35%,rgba(14,8,28,.18) 75%,rgba(14,8,28,.5) 100%);z-index:2}
.layer{position:fixed;inset:0;z-index:20;display:none;align-items:center;justify-content:center;padding:calc(18px + var(--sat)) calc(16px + var(--sar)) calc(18px + var(--sab)) calc(16px + var(--sal));pointer-events:none}
.layer.on{display:flex}.layer>*{pointer-events:auto}
.panel{width:min(92vw,520px);background:rgba(46,35,64,.88);border:3px solid rgba(255,215,106,.85);border-radius:28px;box-shadow:0 8px 0 rgba(22,13,38,.55),0 0 34px rgba(255,215,106,.12);padding:24px 22px;text-align:center;backdrop-filter:blur(8px)}
.smallBtn{min-height:52px;border:3px solid var(--ink);border-radius:16px;background:linear-gradient(#FFE58F,#F8C64B);color:#49382E;font-weight:900;box-shadow:0 5px 0 #8B5A2A;padding:9px 18px;font-size:16px;transition:transform .08s,box-shadow .08s}
.smallBtn:active{transform:translateY(4px);box-shadow:0 1px 0 #8B5A2A}
.smallBtn.pink{background:linear-gradient(#FFB4D3,#FF8FB8);box-shadow:0 5px 0 #A94B74;color:#513442}
.smallBtn.mint{background:linear-gradient(#C9F6E8,#9FE3D0);box-shadow:0 5px 0 #4C9E88;color:#254A42}
#hud{position:fixed;left:0;right:0;top:0;z-index:30;display:none;align-items:center;justify-content:space-between;padding:calc(10px + var(--sat)) max(10px,var(--sar)) 0 max(10px,var(--sal));pointer-events:none}
#hud.on{display:flex}#hud>*{pointer-events:auto}
.iconBtn{width:52px;height:52px;border-radius:17px;background:rgba(255,246,232,.94);border:3px solid var(--ink);color:#49382E;font-size:20px;font-weight:900;box-shadow:0 5px 0 rgba(74,59,50,.78);display:grid;place-items:center}
.iconBtn:active{transform:translateY(3px);box-shadow:0 2px 0 rgba(74,59,50,.78)}
#progress{height:20px;display:flex;gap:6px;align-items:center;justify-content:center;padding:0 6px;flex-wrap:wrap;max-width:60vw}
.pip{width:12px;height:12px;border-radius:50%;background:rgba(255,246,232,.24);border:2px solid rgba(255,246,232,.4)}
.pip.done{background:var(--glow);border-color:#7D5B19;box-shadow:0 0 10px rgba(255,215,106,.7)}
.pip.now{background:var(--pink);border-color:#8E365C;animation:pulse 1s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(1.25);box-shadow:0 0 18px rgba(255,143,184,.7)}}

#targetCard{
  position:fixed;left:50%;top:calc(66px + var(--sat));transform:translateX(-50%);z-index:25;
  width:min(calc(100vw - 40px),520px);
  padding:9px 16px 10px;display:none;
  background:linear-gradient(180deg,rgba(43,27,58,.92),rgba(32,20,49,.92));
  border:2px solid rgba(255,215,106,.72);border-radius:17px;color:var(--cream);
  box-shadow:0 4px 0 rgba(16,8,28,.5),0 0 16px rgba(255,215,106,.12);backdrop-filter:blur(7px);
  text-align:center;
}
#targetCard.on{display:block;animation:goalIn .3s cubic-bezier(.2,1.4,.45,1)}
@keyframes goalIn{0%{opacity:0;transform:translateX(-50%) translateY(-8px) scale(.95)}100%{opacity:1;transform:translateX(-50%) translateY(0) scale(1)}}
#missionText{font-size:clamp(15px,3.8vw,20px);line-height:1.25;font-weight:900;color:#FFF2D0;text-shadow:0 2px 0 rgba(74,38,43,.6)}
#missionRoundBadge{font-family:"DotGothic16";font-size:11px;color:#FFE9A8;opacity:.85;margin-top:2px}
#goalDisplay{margin-top:6px;display:flex;flex-direction:column;align-items:center;gap:3px}
#goalNumber{font-family:"DotGothic16";font-size:34px;line-height:1;color:#FFD76A;text-shadow:0 3px 0 #7C3D31}
#goalDots{font-size:15px;letter-spacing:4px;color:var(--glow)}
#slotDots{display:flex;justify-content:center;gap:5px;flex-wrap:wrap;margin-top:5px}
#slotDots i{width:12px;height:15px;border-radius:44% 44% 38% 38%;background:#D6C8BA;border:2px solid #7A6557;box-shadow:inset 0 2px 0 rgba(255,255,255,.35);transition:.18s ease-out}
#slotDots i.done{background:linear-gradient(#FFE99D,#F6B64A);border-color:#7D5228;box-shadow:0 0 10px rgba(255,196,77,.72);transform:translateY(-2px) scale(1.08)}

#bottomBar{position:fixed;left:50%;bottom:calc(18px + var(--sab));transform:translateX(-50%);z-index:28;display:none;align-items:center;gap:10px;pointer-events:none}
#bottomBar.on{display:flex}#bottomBar>*{pointer-events:auto}
#doneBtn{min-height:60px;min-width:150px;border-radius:999px;border:4px solid #5D3828;background:linear-gradient(180deg,#FFF0A6,#FFD76A 46%,#F2A84B);color:#5A3828;font-family:"DotGothic16";font-size:22px;font-weight:900;box-shadow:0 7px 0 #7A4329,0 0 22px rgba(255,215,106,.32);display:none}
#doneBtn.on{display:block}
#doneBtn:active{transform:translateY(5px);box-shadow:0 2px 0 #7A4329}
#resetBtn{min-height:48px;border-radius:15px;padding:8px 14px;background:rgba(255,246,232,.92);border:3px solid var(--ink);color:#49382E;font-size:13px;font-weight:900;box-shadow:0 4px 0 #6B4A2F}
#resetBtn:active{transform:translateY(3px);box-shadow:0 1px 0 #6B4A2F}
#compareBar{position:fixed;left:0;right:0;bottom:calc(94px + var(--sab));z-index:27;display:none;justify-content:space-between;padding:0 max(18px,var(--sal)) 0 max(18px,var(--sar));pointer-events:none}
#compareBar.on{display:flex}#compareBar>*{pointer-events:auto}
.compareBtn{min-height:56px;min-width:110px;border-radius:18px;border:4px solid #5D3828;background:linear-gradient(180deg,#FFB4D3,#FF8FB8);color:#513442;font-family:"DotGothic16";font-size:18px;font-weight:900;box-shadow:0 6px 0 #A94B74}
.compareBtn:active{transform:translateY(4px);box-shadow:0 2px 0 #A94B74}

#hubUI{position:fixed;left:0;right:0;top:calc(72px + var(--sat));z-index:26;display:none;justify-content:center;pointer-events:none}
#hubUI.on{display:flex}#hubUI>*{pointer-events:auto}
.hubChip{background:rgba(32,20,54,.78);border:2px solid rgba(255,215,106,.5);border-radius:999px;padding:8px 18px;font-family:"DotGothic16";font-size:13px;color:var(--glow);backdrop-filter:blur(6px);display:flex;align-items:center;gap:10px}
.buddyBtn{min-height:32px;border-radius:999px;padding:5px 12px;background:linear-gradient(180deg,#FFEBA0,#F6C85A);border:2px solid #6A4430;color:#5B392D;font-size:10px;font-weight:900;box-shadow:0 3px 0 #6A4430}
.buddyBtn:active{transform:translateY(2px);box-shadow:0 1px 0 #6A4430}
#stallLabel{position:fixed;left:50%;bottom:calc(28px + var(--sab));transform:translateX(-50%);z-index:24;background:rgba(26,16,48,.72);border:2px solid rgba(255,246,232,.22);border-radius:999px;padding:8px 18px;font-size:13px;display:none;white-space:nowrap;pointer-events:none;backdrop-filter:blur(5px)}
#stallLabel.on{display:block}

#toast{position:fixed;left:50%;top:calc(124px + var(--sat));transform:translate(-50%,-50%) scale(.9);z-index:50;min-width:0;max-width:min(70vw,340px);text-align:center;background:rgba(255,246,232,.96);border:3px solid var(--ink);border-radius:999px;color:#49382E;padding:8px 16px;font-family:"DotGothic16";font-size:16px;opacity:0;pointer-events:none;transition:.18s;box-shadow:0 4px 0 rgba(74,59,50,.72)}
#toast.on{opacity:1;transform:translate(-50%,-50%) scale(1)}
#countPop{position:fixed;left:50%;top:44%;transform:translate(-50%,-50%) scale(.55);z-index:44;font-family:"DotGothic16";font-size:64px;color:var(--glow);text-shadow:0 5px 0 #7C3D31,0 0 25px rgba(255,215,106,.5);opacity:0;pointer-events:none}
.popNow{animation:countPop .5s ease-out}
@keyframes countPop{0%{opacity:0;transform:translate(-50%,-40%) scale(.45)}30%{opacity:1;transform:translate(-50%,-50%) scale(1.15)}100%{opacity:0;transform:translate(-50%,-62%) scale(.92)}}
#result .panel{max-width:430px;background:linear-gradient(180deg,rgba(72,46,92,.96),rgba(40,25,58,.96));border-color:#FFD76A;box-shadow:0 9px 0 rgba(25,13,35,.65),0 0 38px rgba(255,215,106,.18)}
.logoTop{font-family:"DotGothic16",monospace;font-size:clamp(19px,4.8vw,28px);letter-spacing:.06em;color:var(--glow);text-shadow:0 3px 0 #7C3D31,0 0 18px rgba(255,215,106,.35)}
.stars{font-size:44px;letter-spacing:4px;color:var(--glow);text-shadow:0 4px 0 #7A5422;margin:8px 0}
.rewardName{font-size:16px;color:#FFE9A8;margin:7px 0 16px}
.resultBtns{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}
#hint{position:fixed;left:50%;bottom:calc(16px + var(--sab));transform:translateX(-50%);z-index:33;max-width:min(74vw,360px);background:rgba(33,21,50,.88);color:#FFF2D0;border:2px solid rgba(255,215,106,.68);border-radius:999px;padding:8px 16px;font-size:13px;font-weight:900;opacity:0;pointer-events:none;transition:opacity .2s;text-align:center;box-shadow:0 3px 0 rgba(14,7,25,.48)}
#hint.on{opacity:1}
#roundBurst{position:fixed;left:50%;top:43%;transform:translate(-50%,-50%) scale(.65);z-index:51;pointer-events:none;opacity:0;font-family:'DotGothic16';font-size:clamp(28px,8vw,52px);color:#FFF0A8;text-shadow:0 5px 0 #7C3D31,0 0 24px rgba(255,215,106,.75)}
#roundBurst.on{animation:roundBurst .8s ease-out}
@keyframes roundBurst{0%{opacity:0;transform:translate(-50%,-40%) scale(.5)}25%{opacity:1;transform:translate(-50%,-50%) scale(1.15)}70%{opacity:1}100%{opacity:0;transform:translate(-50%,-65%) scale(.95)}}
#noWebGL{display:none;position:fixed;inset:0;z-index:100;background:linear-gradient(var(--night),var(--night2));align-items:center;justify-content:center;padding:20px;text-align:center}
.noBox{background:var(--cream);color:#49382E;border:3px solid var(--ink);border-radius:22px;padding:22px}

#titleLayer{align-items:flex-end;justify-content:center;background:linear-gradient(180deg,rgba(15,8,31,0) 0%,rgba(15,8,31,.03) 38%,rgba(15,8,31,.70) 100%)}
#titleLayer .titleHero{width:min(96vw,760px);padding:0 12px calc(18px + var(--sab));text-align:center;filter:drop-shadow(0 12px 22px rgba(7,3,18,.3))}
#titleBack{position:fixed;left:max(14px,var(--sal));top:calc(14px + var(--sat));z-index:30}
.titleKicker{display:inline-flex;align-items:center;gap:9px;padding:6px 15px;border-radius:999px;background:rgba(78,42,85,.72);border:2px solid rgba(255,224,135,.55);color:#FFE9A8;font-family:"DotGothic16";font-size:13px;letter-spacing:.08em;backdrop-filter:blur(7px);box-shadow:0 4px 0 rgba(41,20,48,.45)}
.titleLogo{position:relative;margin:7px auto 8px;width:min(94vw,690px);padding:6px 24px 11px}
.titleLogoTop{font-family:"DotGothic16";font-weight:900;font-size:clamp(21px,4.4vw,31px);letter-spacing:.22em;color:#FFE486;text-shadow:0 3px 0 #71382E,0 0 16px rgba(255,215,106,.55)}
.titleLogoMain{font-family:"DotGothic16";font-size:clamp(48px,11vw,82px);line-height:.94;letter-spacing:.025em;color:#FFF4D5;-webkit-text-stroke:2px #6A3340;text-shadow:0 7px 0 #8C3E55,0 11px 0 rgba(33,17,45,.4),0 0 30px rgba(255,143,184,.34)}
.titleLogoMain .num{display:inline-block;color:#FFD76A;-webkit-text-stroke-color:#77412C;transform:rotate(-5deg) translateY(-2px);text-shadow:0 7px 0 #A45A2E,0 0 26px rgba(255,215,106,.42)}
.titleRibbon{display:inline-block;margin-top:7px;background:linear-gradient(180deg,#E86258,#C9474B);border:3px solid #6D3431;border-radius:999px;padding:7px 18px;color:#FFF3D6;font-size:clamp(13px,3vw,17px);font-weight:900;box-shadow:0 5px 0 #74312F,0 0 20px rgba(232,98,88,.25)}
.titleActions{display:flex;justify-content:center;align-items:center;gap:12px;margin-top:11px}
.titleStart{position:relative;min-width:min(78vw,330px);min-height:67px;border-radius:999px;border:4px solid #5D3828;background:linear-gradient(180deg,#FFF0A6 0%,#FFD76A 46%,#F2A84B 100%);color:#5A3828;font-family:"DotGothic16";font-size:24px;font-weight:900;box-shadow:0 8px 0 #7A4329,0 0 30px rgba(255,215,106,.38);overflow:hidden}
.titleStart:before{content:"";position:absolute;top:-25%;left:-22%;width:28%;height:150%;background:linear-gradient(90deg,transparent,rgba(255,255,255,.62),transparent);transform:skewX(-18deg);animation:titleShine 2.8s ease-in-out infinite}
.titleStart:active{transform:translateY(5px);box-shadow:0 3px 0 #7A4329}
@keyframes titleShine{0%,55%{left:-28%}78%,100%{left:120%}}
.titleFoot{margin-top:11px;color:rgba(255,246,232,.88);font-size:12px;font-weight:900;text-shadow:0 2px 5px rgba(0,0,0,.5)}
.titleDots{display:flex;justify-content:center;gap:8px;margin-top:8px}
.titleDots i{width:7px;height:7px;border-radius:50%;background:#FFD76A;box-shadow:0 0 9px rgba(255,215,106,.8);animation:twinkle 1.6s ease-in-out infinite}
.titleDots i:nth-child(2){animation-delay:.2s}.titleDots i:nth-child(3){animation-delay:.4s}.titleDots i:nth-child(4){animation-delay:.6s}.titleDots i:nth-child(5){animation-delay:.8s}
@keyframes twinkle{50%{transform:scale(1.6);opacity:.45}}

#charLayer{align-items:flex-end;justify-content:center;background:linear-gradient(180deg,rgba(15,8,31,.04) 0%,rgba(15,8,31,.12) 40%,rgba(15,8,31,.82) 100%)}
.charShell{width:min(96vw,820px);padding:0 12px calc(16px + var(--sab));text-align:center}
.charKicker{font-family:"DotGothic16";font-size:clamp(22px,5vw,34px);color:#FFF2C7;text-shadow:0 4px 0 #793B48,0 0 20px rgba(255,215,106,.28)}
.charSub{margin:5px 0 11px;font-size:13px;font-weight:900;color:rgba(255,246,232,.82)}
.charCards{display:grid;grid-template-columns:repeat(4,1fr);gap:9px;margin:0 auto;width:min(100%,720px)}
.charCard{position:relative;min-height:70px;border-radius:18px;border:3px solid rgba(255,246,232,.32);background:linear-gradient(180deg,rgba(81,60,100,.82),rgba(41,27,60,.92));box-shadow:0 5px 0 rgba(20,11,31,.65);padding:8px 6px 7px;color:#FFF6E8;overflow:hidden}
.charCard:before{content:"";position:absolute;inset:0;background:radial-gradient(circle at 50% 0%,var(--cc,rgba(255,215,106,.24)),transparent 62%);opacity:.7}
.charCard b,.charCard span{position:relative;z-index:1;display:block}.charCard b{font-family:"DotGothic16";font-size:17px;color:#FFE7A0}.charCard span{font-size:11px;margin-top:2px;color:rgba(255,246,232,.78)}
.charCard.selected{border-color:#FFD76A;background:linear-gradient(180deg,rgba(122,83,100,.94),rgba(63,37,75,.96));transform:translateY(-4px);box-shadow:0 8px 0 #68402E,0 0 23px rgba(255,215,106,.3)}
.charCard.selected:after{content:"えらんだよ";position:absolute;right:5px;top:5px;border-radius:999px;background:#FFD76A;color:#623C2E;font-size:8px;font-weight:900;padding:2px 6px;z-index:3}
.charBottom{display:flex;justify-content:center;align-items:center;gap:10px;margin-top:12px}
.charConfirm{min-width:min(64vw,300px);min-height:58px;border:4px solid #5D3828;border-radius:999px;background:linear-gradient(180deg,#FFF0A6,#FFD76A 48%,#F2A84B);color:#5A3828;font-family:"DotGothic16";font-size:20px;font-weight:900;box-shadow:0 7px 0 #7A4329,0 0 24px rgba(255,215,106,.25)}
.charConfirm:active{transform:translateY(4px);box-shadow:0 3px 0 #7A4329}
.charBack{width:52px;height:52px;border-radius:17px;background:rgba(255,246,232,.9);border:3px solid #4A3B32;color:#49382E;font-size:20px;font-weight:900;box-shadow:0 5px 0 rgba(74,59,50,.78)}
.charBack:active{transform:translateY(3px);box-shadow:0 2px 0 rgba(74,59,50,.78)}
@media (max-width:680px){.charCards{grid-template-columns:repeat(2,1fr);gap:7px;max-width:430px}.charCard{min-height:57px;padding:6px 4px}.charCard b{font-size:15px}.charCard span{font-size:10px}.charShell{padding-bottom:calc(10px + var(--sab))}.charKicker{font-size:clamp(20px,6vw,28px)}.charSub{margin:3px 0 8px}.charBottom{margin-top:9px}.charConfirm{min-height:52px;font-size:18px}}
@media (max-height:560px) and (orientation:landscape){#charLayer{align-items:center}.charShell{padding:calc(8px + var(--sat)) 10px calc(8px + var(--sab));display:grid;grid-template-columns:1fr 1.35fr;grid-template-areas:"title cards" "bottom cards";gap:6px 14px;align-items:center}.charKicker{grid-area:title;font-size:21px}.charSub{grid-area:title;margin-top:34px;font-size:11px}.charCards{grid-area:cards;grid-template-columns:repeat(2,1fr);gap:6px}.charCard{min-height:52px}.charBottom{grid-area:bottom;margin:0}.charConfirm{min-height:48px;font-size:16px}.charBack{width:46px;height:46px}}
@media (max-width:680px){.titleLogoMain{font-size:clamp(46px,14vw,68px)}.titleHero{padding-bottom:calc(12px + var(--sab))}.titleStart{min-height:62px;font-size:21px}.titleRibbon{margin-top:4px}.panel{padding:20px 16px}}
@media (max-height:560px) and (orientation:landscape){#targetCard{top:calc(52px + var(--sat));transform:translateX(-50%) scale(.82);transform-origin:top center}#bottomBar{bottom:calc(8px + var(--sab));transform:translateX(-50%) scale(.8);transform-origin:bottom center}#compareBar{bottom:calc(70px + var(--sab))}.panel{padding:14px}}
@media(max-width:430px){#targetCard{width:calc(100vw - 30px)}#missionText{font-size:14px}#goalNumber{font-size:28px}}
</style>
</head>
<body>
<div id="stage"></div><div id="vignette"></div>
<div id="noWebGL"><div class="noBox"><b>ごめんね</b><br>この たんまつでは<br>3Dを ひょうじできません</div></div>

<div class="layer on" id="titleLayer">
  <button class="iconBtn" id="titleBack" aria-label="もどる">←</button>
  <div class="titleHero">
    <div class="titleKicker">よるの おまつりじま</div>
    <div class="titleLogo">
      <div class="titleLogoTop">かずあそび</div>
      <div class="titleLogoMain"><span class="num">かず</span>の<br>おまつり</div>
      <div class="titleRibbon">6つの やたいで かぞえよう！</div>
    </div>
    <div class="titleActions"><button class="titleStart" id="startBtn">はじめる</button></div>
    <div class="titleDots"><i></i><i></i><i></i><i></i><i></i></div>
    <div class="titleFoot">きんぎょ・たこやき・わなげ・りんごあめ・ちょうちん・はなび</div>
  </div>
</div>

<div class="layer" id="charLayer">
  <div class="charShell">
    <div class="charKicker">いっしょに いく どうぶつは？</div>
    <div class="charSub">すきな こを えらんで おまつりへ！</div>
    <div class="charCards" id="charCards"></div>
    <div class="charBottom"><button class="charBack" id="charBack" aria-label="もどる">←</button><button class="charConfirm" id="charConfirm">このこで いく！</button></div>
  </div>
</div>

<div id="hud"><button class="iconBtn" id="backBtn" aria-label="もどる">←</button><div id="progress"></div><button class="iconBtn" id="soundBtn" aria-label="おと">♪</button></div>

<div id="hubUI"><div class="hubChip"><span id="hubTitle">どの やたいで あそぶ？</span><button class="buddyBtn" id="buddyBtn">どうぶつを かえる</button></div></div>
<div id="stallLabel"></div>

<div id="targetCard">
  <div id="missionText">ここを タップ！</div>
  <div id="missionRoundBadge">1/6</div>
  <div id="goalDisplay"><div id="goalNumber"></div><div id="goalDots"></div></div>
  <div id="slotDots"></div>
</div>

<div id="compareBar">
  <button class="compareBtn" id="compareLeftBtn">こっち！</button>

/* ================= tween / anim helpers ================= */
function updateAnim(dt,t){
  for(var k=0;k<animatables.length;k++){
    var o=animatables[k];
    if(o.userData.celebrate){o.userData.celebrate=Math.max(0,o.userData.celebrate-dt);var p=1-o.userData.celebrate/1.15;o.position.y=(o.userData.bob?o.userData.bob.base:0)+Math.sin(Math.min(1,p)*Math.PI)*.65;o.rotation.z=Math.sin(p*Math.PI*2)*.12;if(o.userData.celebrate<=0)o.rotation.z=0}
    if(o.userData.bob&&!o.userData.celebrate){var b=o.userData.bob;o.position.y=b.base+Math.sin(t*b.speed+b.phase)*b.amp}
    if(o.userData.move){var m=o.userData.move;m.t=Math.min(1,m.t+dt*2.3);var e=1-Math.pow(1-m.t,3);o.position.lerpVectors(m.from,m.to,e);o.position.y+=Math.sin(m.t*Math.PI)*dt*4;if(m.t>=1){o.scale.setScalar(o.userData.moveScale||1);delete o.userData.move}}
    if(o.userData.wobble){o.userData.wobble=Math.max(0,o.userData.wobble-dt);o.rotation.z=Math.sin(t*25)*o.userData.wobble*.3;if(!o.userData.wobble)o.rotation.z=0}
    if(o.userData.returnAnim){var ra=o.userData.returnAnim;ra.t+=dt*2.6;var pr=Math.min(1,ra.t);o.position.lerpVectors(ra.from,ra.to,pr);o.position.y+=Math.sin(Math.PI*pr)*1.2;o.scale.setScalar(Math.max(.001,1-pr));if(pr>=1){roundGroup.remove(o);disposeObject(o);animatables.splice(k,1);k--}}
    if(o.userData.swim){o.position.x+=Math.sin(t*1.4+(o.userData.swimPhase||0))*dt*.28;o.position.z+=Math.cos(t*1.1+(o.userData.swimPhase||0))*dt*.2;var b0=o.userData.swim;var dx=o.position.x-b0.cx,dz=o.position.z-b0.cz,dist=Math.sqrt(dx*dx+dz*dz);if(dist>b0.r){o.position.x=b0.cx+dx/dist*b0.r;o.position.z=b0.cz+dz/dist*b0.r}o.rotation.y=Math.sin(t*1.2+(o.userData.swimPhase||0))*.5}
  }
}
function tweenPos(obj,to,dur,onDone){obj.userData.tweenTo={t:0,dur:dur||.5,from:obj.position.clone(),to:to,onDone:onDone}}
function stepTweens(dt){
  animatables.forEach(function(o){
    if(o.userData.tweenTo){var tw=o.userData.tweenTo;tw.t+=dt;var p=Math.min(1,tw.t/tw.dur);var e=1-Math.pow(1-p,3);o.position.lerpVectors(tw.from,tw.to,e);if(p>=1){var cb=tw.onDone;o.userData.tweenTo=null;if(cb)cb()}}
  });
}

/* ================= stage flow ================= */
function totalRoundsFor(i){return ROUND_CONFIGS[i].length}
function roundCfg(i,r){return ROUND_CONFIGS[i][r]}
function tierFor(i,r){
  var total=totalRoundsFor(i);
  var third=total/3;
  if(r<third)return 1;
  if(r<third*2)return 2;
  return 3;
}
function startStage(i){
  if(!stageUnlocked(i))return;
  initAudio();unlockAudioAndBgm();
  stageIndex=i;anaStageStart(i);
  startStageRound(i,0);
}
function startStageRound(i,r){
  stageIndex=i;stageRound=r;currentCfg=roundCfg(i,r);
  var isNewStage=(mode!=='stage')||(lastBuiltStage!==i);
  mode='stage';
  if(isNewStage){clearStage();buildStageBackdrop(i);lastBuiltStage=i;} else {clearRound();}
  mistakes=(r===0)?0:mistakes;
  if(r===0)mistakes=0;
  resetRound();
}
var lastBuiltStage=-1;
function buildStageBackdrop(i){
  root.position.set(0,0,0);groundCircle();buildFestivalBackdrop();
  var s=STAGES[i];
  if(i===0)buildKingyoStatic();
  else if(i===1)buildTakoyakiStatic();
  else if(i===2)buildWanageStatic();
  else if(i===3)buildRingoStatic();
  else if(i===4)buildChochinStatic();
  else if(i===5)buildHanabiStatic();
}
function resetRound(){
  clearRound();inputLocked=false;count=0;lastAction=performance.now();
  $('missionRoundBadge').textContent=(stageRound+1)+'/'+totalRoundsFor(stageIndex);
  buildProgress(stageRound,totalRoundsFor(stageIndex));
  show('hub' + 'UI',false);show('hud',true);show('targetCard',true);show('result',false);show('finale',false);
  updateCarriedLantern(0);
  var mech=STAGES[stageIndex].mech==='boss'?currentCfg.fmt:STAGES[stageIndex].mech;
  show('bottomBar',mech==='count');
  show('compareBar',mech==='compare');
  $('doneBtn').classList.toggle('on',mech==='count'&&tierFor(stageIndex,stageRound)>=2);
  if(mech==='count')buildRoundCount();
  else if(mech==='select')buildRoundSelect();
  else if(mech==='compare')buildRoundCompare();
  else if(mech==='order')buildRoundOrder();
  var spots=[[-5.3,3.0,.66,.35],[-5.35,3.0,.66,.35],[5.25,3.0,.65,-.4],[0,3.65,.64,0],[-5.2,2.75,.62,.25],[0,5.0,.68,Math.PI]];
  var q=spots[stageIndex];
  if(player){stageGroup.remove(player);}
  player=addFestivalPlayer(stageGroup,q[0],q[1],q[2],q[3],selectedChar);
  countLantern=addCarriedLantern(player);updateCarriedLantern(mech==='count'?count:0);
  addShadowBlob(stageGroup,q[0],.02,q[1],.9);
}
function buildProgress(done,total){var p=$('progress');p.innerHTML='';for(var i=0;i<total;i++){var e=document.createElement('i');e.className='pip '+(i<done?'done':i===done?'now':'');p.appendChild(e)}}
function setMissionText(txt){$('missionText').textContent=txt}
function updateGoalDisplay(tier,n,label){
  var num=$('goalNumber'),dots=$('goalDots');
  if(tier===1){num.textContent='';dots.textContent='● '.repeat(Math.min(n,10)).trim()}
  else if(tier===2){num.textContent=n;dots.textContent='● '.repeat(Math.min(n,10)).trim()}
  else {num.textContent=n;dots.textContent=''}
  if(label!==undefined){num.textContent=label}
}
function updateSlotDots(n,filled){
  var h=$('slotDots');h.innerHTML='';
  if(n<=0){return}
  for(var i=0;i<Math.min(n,10);i++){var e=document.createElement('i');if(i<filled)e.className='done';h.appendChild(e)}
}

/* ---- COUNT mechanic (kingyo / takoyaki / boss-count) ---- */
function buildRoundCount(){
  var cfg=currentCfg.fmt?currentCfg:currentCfg;
  target=cfg.n;var tier=tierFor(stageIndex,stageRound);
  setMissionText(missionForCount());
  updateGoalDisplay(tier,target);
  updateSlotDots(tier===1?target:0,0);
  if(stageIndex===0)spawnKingyoFish();
  else if(stageIndex===1)spawnTakoyaki();
  else if(stageIndex===5)spawnHanabiCount();
}
function missionForCount(){
  if(stageIndex===0)return 'きんぎょを '+target+'びき すくおう';
  if(stageIndex===1)return 'たこやきを '+target+'こ のせよう';
  return target+'はつ はなびを うちあげよう';
}
function countHit(obj,onEntered){
  if(inputLocked)return;
  var tier=tierFor(stageIndex,stageRound);
  if(count>=target){
    /* overshoot: this tap is the extra one -> bounce back instead of counting */
    triggerReturn(obj);
    mistakes++;
    softWrong();
    return;
  }
  count++;countTone(count);popCount(count);lastAction=performance.now();updateCarriedLantern(count);
  updateSlotDots(tier===1?target:0,count);
  try{navigator.vibrate&&navigator.vibrate(10)}catch(e){}
  if(onEntered)onEntered();
  if(tier===1&&count===target)completeRound();
}
function triggerReturn(obj){
  if(!obj)return;
  var home=obj.userData.homePos||obj.position.clone();
  obj.userData.returnAnim={t:0,from:obj.position.clone(),to:obj.userData.tankPos||home};
  if(animatables.indexOf(obj)<0)animatables.push(obj);
  toast('あっ！ おおすぎたね');
}
function onDoneBtn(){
  if(mode!=='stage'||inputLocked)return;
  var mech=STAGES[stageIndex].mech==='boss'?currentCfg.fmt:STAGES[stageIndex].mech;
  if(mech!=='count')return;
  lastAction=performance.now();
  if(count===target){completeRound()}
  else if(count<target){mistakes++;toast('あと ちょっと！');softWrong()}
}

/* ---- SELECT mechanic (wanage / boss-select) ---- */
function selectTargetFor(cfg){
  if(cfg.rel==='next')return cfg.base+1;
  if(cfg.rel==='prev')return cfg.base-1;
  return cfg.n;
}
function buildRoundSelect(){
  target=selectTargetFor(currentCfg);
  var tier=tierFor(stageIndex,stageRound);
  var label=currentCfg.rel==='next'?(currentCfg.base+'の つぎ'):currentCfg.rel==='prev'?(currentCfg.base+'の まえ'):null;
  setMissionText(stageIndex===5?'その ばんごうの つつへ うちあげよう':(label?label+'の ぼうへ わを いれよう':target+' の ぼうに わを いれよう'));
  updateGoalDisplay(3,target,label||target);
  updateSlotDots(0,0);
  if(stageIndex===2)buildWanageRound();
  else if(stageIndex===5)buildHanabiSelectRound();
}
function selectHit(num,obj){
  if(inputLocked)return;
  if(num===target){completeRound()}
  else{mistakes++;softWrong();obj.userData.wobble=.45;if(animatables.indexOf(obj)<0)animatables.push(obj);toast('おしい！ すうじを みてね')}
}

/* ---- COMPARE mechanic (ringo / boss-compare) ---- */
function buildRoundCompare(){
  var left=currentCfg.a,right=currentCfg.b;
  target=currentCfg.ask==='more'?Math.max(left,right):Math.min(left,right);
  compareCounts={left:0,right:0};
  setMissionText((currentCfg.ask==='more'?'おおい':'すくない')+' ほうは どっち？');
  $('goalNumber').textContent='';$('goalDots').textContent='';updateSlotDots(0,0);
  if(stageIndex===3)buildRingoRound(left,right);
  else if(stageIndex===5)buildHanabiCompareRound(left,right);
}
function compareTap(side){
  compareCounts[side]++;
  countTone(compareCounts[side]);
  popCount(compareCounts[side]);
  toast(compareCounts[side]+'こ');
}
function compareAnswer(side){
  if(inputLocked)return;
  var n=side==='left'?currentCfg.a:currentCfg.b;
  if(n===target){completeRound()}
  else{mistakes++;softWrong();toast('おしい！ かぞえて みよう')}
}

/* ---- ORDER mechanic (chochin / boss-order) ---- */
function buildRoundOrder(){
  target=currentCfg.n;var progress=0;
  setMissionText(stageIndex===5?'1 → '+target+' じゅんばんに うちあげよう':'1 → '+target+' じゅんばんに ともそう');
  $('goalNumber').textContent='';$('goalDots').textContent='';updateSlotDots(target,0);
  orderProgress=0;
  if(stageIndex===4)buildChochinRound();
  else if(stageIndex===5)buildHanabiOrderRound();
}
var orderProgress=0;
function orderHit(num,obj){
  if(inputLocked)return;
  if(num===orderProgress+1){
    orderProgress++;popCount(orderProgress);countTone(orderProgress);updateSlotDots(target,orderProgress);lastAction=performance.now();
    if(orderProgress>=target)completeRound();
  }else{
    mistakes++;softWrong();obj.userData.wobble=.4;if(animatables.indexOf(obj)<0)animatables.push(obj);toast('おしい！ じゅんばんを みてね');
  }
}

/* ================= round complete / stage complete ================= */
function popCount(n){var e=$('countPop');e.textContent=n;e.classList.remove('popNow');void e.offsetWidth;e.classList.add('popNow')}
var toastTimer=null;
function toast(t){var e=$('toast');e.textContent=t;e.classList.add('on');clearTimeout(toastTimer);toastTimer=setTimeout(function(){e.classList.remove('on')},700)}
function burstText(t){var e=$('roundBurst');e.textContent=t;e.classList.remove('on');void e.offsetWidth;e.classList.add('on')}
function completeRound(){
  if(inputLocked)return;inputLocked=true;
  goodSound();celebratePlayer();
  var total=totalRoundsFor(stageIndex);
  buildProgress(stageRound+1,total);
  burstText(stageRound<total-1?'できた！':'ぜんぶ できた！');
  spawnFirework((Math.random()-.5)*3,5.6,-6,iRand([C.glow,C.pink,C.mint]));
  var nextRound=stageRound+1;
  setTimeout(function(){
    if(nextRound<total)startStageRound(stageIndex,nextRound);
    else finishStage();
  },TUNE.ROUND_GAP*1000);
}
function finishStage(){
  if(stageIndex<0)return;
  var stars=starsFor(mistakes);
  var prevStars=SAVE.stars[stageIndex]||0;
  SAVE.stars[stageIndex]=Math.max(prevStars,stars);
  var id=STAGES[stageIndex].id;
  if(SAVE.prizes.indexOf(id)<0)SAVE.prizes.push(id);
  SAVE.char=selectedChar;SAVE.lastStage=stageIndex;
  var isBoss=(stageIndex===STAGES.length-1);
  if(isBoss)SAVE.cleared=true;
  persistSave();
  anaStageComplete(stageIndex,stars);
  if(isBoss){anaGameComplete();playFinale();return}
  $('resultTitle').textContent='やたい クリア！';
  $('rewardName').textContent=STAGES[stageIndex].reward+' を ゲット！';
  celebratePlayer();
  show('result',true);show('targetCard',false);show('bottomBar',false);show('compareBar',false);show('hint',false);
  var starsEl=document.querySelector('#result .stars');
  starsEl.textContent='★'.repeat(stars)+'☆'.repeat(3-stars);
  spawnFirework(0,6,-6,C.glow);spawnFirework(-4,5,-7,C.pink);
}
function playFinale(){
  show('result',false);show('targetCard',false);show('bottomBar',false);show('compareBar',false);show('hint',false);
  celebratePlayer();
  show('finale',true);
  finaleTimer=performance.now();
  finaleActive=true;
}

function updateFinale(now){

}

var chochinBaseFog=52;
function buildChochinRound(){

var chochinAmbientBase=.55;
function handleChochinHit(l){
  if(l.userData.num===orderProgress+1){
    relightLantern(l,true);

    scene.fog.far=chochinBaseFog-litRatio*20;
    ambientLight.intensity=chochinAmbientBase+litRatio*.35;
    if(orderProgress+1>=target){
      celebratePlayer();
      spawnFirework(0,5,-9,C.glow);
    }
    orderHit(l.userData.num,l);
  }else{
    orderHit(l.userData.num,l);
  }
}

/* ================= pointer handling ================= */
function onPointer(e){
  if(inputLocked&&mode==='stage')return;
  initAudio();unlockAudioAndBgm();
  lastAction=performance.now();
  var r=renderer.domElement.getBoundingClientRect();
  pointer.x=((e.clientX-r.left)/r.width)*2-1;
  pointer.y=-((e.clientY-r.top)/r.height)*2+1;
  raycaster.setFromCamera(pointer,camera);
  var pool=(mode==='hub')?stageGroup.children:stageGroup.children.concat(roundGroup.children);
  var hits=raycaster.intersectObjects(pool,true);
  for(var i=0;i<hits.length;i++){
    var o=hits[i].object,owner=o.userData.owner||o;
    while(o&&o.parent&&!owner.userData.hit){o=o.parent;owner=o.userData.owner||o}
    if(owner&&owner.userData.hit){handleHit(owner);return}
  }
  tapSound();
}
function handleHit(o){
  var type=o.userData.hit;
  if(type==='stall'){
    var i=o.userData.stall;
    if(!stageUnlocked(i)){tapSound();toast('まだ ロック中');return}
    tapSound();startStage(i);return;
  }
  if(mode!=='stage'||inputLocked)return;
  lastAction=performance.now();
  if(type==='fish')handleKingyoHit(o);
  else if(type==='tako')handleTakoHit(o);
  else if(type==='post')selectHit(o.userData.num,o);
  else if(type==='apple')handleAppleTap(o);
  else if(type==='roadLantern')handleChochinHit(o);
  else if(type==='shell')handleHanabiShellHit(o);
  else if(type==='tube')handleHanabiTubeHit(o);
  else if(type==='fwapple')handleAppleTap(o);
  else if(type==='otube')handleHanabiOrderHit(o);
}

/* ================= idle hint (never reveals the answer) ================= */
function hintCheck(now){
  if(mode!=='stage'||inputLocked)return;
  if(now-lastAction>TUNE.HINT_SEC*1000){
    var msgs=['かぞえて みよう','すうじを よく みよう','どっちが おおいかな','じゅんばんに よく みよう'];
    var mech=STAGES[stageIndex].mech==='boss'?currentCfg.fmt:STAGES[stageIndex].mech;
    var m=mech==='compare'?'どっちが おおいかな':mech==='order'?'じゅんばんに よく みよう':mech==='select'?'すうじを よく みよう':'かぞえて みよう';
    $('hint').textContent=m;show('hint',true);setTimeout(function(){show('hint',false)},1500);
    lastAction=now;
  }
}

/* ================= resize / boot / loop ================= */
var BASE_FOV=48,BASE_ASPECT=16/9;
function resize(){
  if(!renderer)return;var w=innerWidth,h=innerHeight;renderer.setSize(w,h,false);
  var aspect=w/h;camera.aspect=aspect;
  if(aspect<BASE_ASPECT){
    var halfV=THREE.MathUtils.degToRad(BASE_FOV/2),halfH=Math.atan(Math.tan(halfV)*BASE_ASPECT);
    var newHalfV=Math.atan(Math.tan(halfH)/aspect);
    camera.fov=Math.min(100,THREE.MathUtils.radToDeg(newHalfV)*2);
  }else{
    camera.fov=BASE_FOV;
  }
  camera.updateProjectionMatrix();
}
var ambientLight,dirLight;
function boot(){
  if(typeof THREE==='undefined'){$('noWebGL').style.display='flex';return}
  try{
    var cv=document.createElement('canvas');
    if(!cv.getContext('webgl')&&!cv.getContext('experimental-webgl'))throw new Error('no webgl');
    renderer=new THREE.WebGLRenderer({antialias:true,alpha:false});
    renderer.setPixelRatio(Math.min(devicePixelRatio||1,TUNE.DPR_MAX));
    renderer.setClearColor(C.night);
    $('stage').appendChild(renderer.domElement);
    scene=new THREE.Scene();scene.fog=new THREE.Fog(0x241645,16,52);
    camera=new THREE.PerspectiveCamera(48,1,.1,120);
    ambientLight=new THREE.HemisphereLight(0x6A5A9A,0x1A1030,.55);scene.add(ambientLight);
    dirLight=new THREE.DirectionalLight(0xFFE0A8,.75);dirLight.position.set(4,8,5);scene.add(dirLight);
    scene.add(permanentWorld);scene.add(stageGroup);stageGroup.add(roundGroup);
    root=stageGroup;
    raycaster=new THREE.Raycaster();
    glowTex=makeGlowTex();lockTex=makeLockTex();
    buildStarfield();
    resize();window.addEventListener('resize',resize);
    renderer.domElement.addEventListener('pointerdown',function(e){e.preventDefault();onPointer(e)},{passive:false});
    anaStart();
    buildTitleScene();$('titleLayer').classList.add('on');
    loop(performance.now());
  }catch(e){console.error(e);$('noWebGL').style.display='flex'}
}
var lastTitleFire=0,last=performance.now();
function loop(now){
  var dt=Math.min((now-last)/1000,TUNE.DT_MAX);last=now;var t=now/1000;
  if(mode==='title'){
    camera.position.x=Math.sin(t*.12)*.75;camera.position.y=6.9+Math.sin(t*.18)*.14;camera.lookAt(0,2.1,-2);
    if(now-lastTitleFire>TUNE.TITLE_FIREWORK_SEC*1000){spawnFirework((Math.random()-.5)*10,6+Math.random()*3,-10-Math.random()*4,iRand([C.glow,C.pink,C.mint,C.lilac]));lastTitleFire=now}
  }else if(mode==='charselect'){
    camera.position.x=Math.sin(t*.14)*.45;camera.position.y=5.6+Math.sin(t*.18)*.12;camera.lookAt(0,1.55,-.4);
  }else if(mode==='hub'){
    camera.position.x=Math.sin(t*.11)*1.1;camera.position.y=12.4+Math.sin(t*.14)*.18;camera.lookAt(0,1,0);
  }else if(mode==='stage'){
    camera.position.x+=Math.sin(t*.7)*TUNE.CAM_SWAY*dt;
  }
  updateAnim(dt,t);stepTweens(dt);updateFireworks(dt);hintCheck(now);updateFinale(now);
  renderer.render(scene,camera);
  requestAnimationFrame(loop);
}
