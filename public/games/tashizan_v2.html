<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>たしざんゲーム</title>
<link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@400;700;800;900&display=swap" rel="stylesheet">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'M PLUS Rounded 1c', sans-serif; overflow: hidden; background: #1a237e; }
#game-wrap { width: 100vw; height: 100svh; max-width: 480px; margin: 0 auto; position: relative; overflow: hidden; }
canvas#bg { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }

/* HUD */
#hud {
  position: fixed; top: 0; left: 50%; transform: translateX(-50%);
  width: 100%; max-width: 480px; z-index: 100; box-sizing: border-box;
  padding: max(10px, env(safe-area-inset-top)) 12px 8px;
  display: none;
  background: linear-gradient(180deg, rgba(5,10,50,0.92) 0%, rgba(5,10,50,0.6) 70%, transparent);
}
.hud-nav { display: flex; justify-content: space-between; align-items: center; margin-bottom: 4px; }
#back-btn { background: rgba(0,0,0,0.55); color: white; border: 1.5px solid rgba(255,255,255,0.3); border-radius: 20px; padding: 5px 14px; font-size: 12px; font-weight: 700; cursor: pointer; font-family: inherit; }
#ui-bgm-btn { background: rgba(0,0,0,0.55); color: white; border: 1.5px solid rgba(255,255,255,0.3); border-radius: 50%; width: 32px; height: 32px; font-size: 16px; cursor: pointer; display: flex; align-items: center; justify-content: center; }
#status-bar { display: flex; justify-content: center; gap: 14px; pointer-events: none; }
.hud-chip { background: rgba(0,0,0,0.6); border: 1.5px solid rgba(100,180,255,0.4); border-radius: 12px; padding: 3px 12px; display: flex; align-items: center; gap: 6px; }
.hud-chip-label { font-size: 9px; color: rgba(255,255,255,0.55); font-weight: 700; }
.hud-chip-val { font-size: 16px; font-weight: 900; color: #64B5F6; }

.screen { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 20; padding: 0 20px; }

/* TITLE */
.title-frame {
  background: linear-gradient(145deg, rgba(20,30,100,0.97), rgba(10,15,70,0.99));
  border: 4px solid #42A5F5; border-radius: 28px; padding: 24px 28px; text-align: center;
  width: 100%; max-width: 340px;
  box-shadow: 0 0 0 2px #1565C0, 0 0 40px rgba(66,165,245,0.2), 0 12px 40px rgba(0,0,0,0.6);
}
.title-nums { display: flex; justify-content: center; gap: 6px; margin-bottom: 10px; flex-wrap: wrap; }
.title-num-block {
  width: 40px; height: 40px; border-radius: 10px; display: flex; align-items: center; justify-content: center;
  font-size: 20px; font-weight: 900; color: white;
  box-shadow: 0 4px 0 rgba(0,0,0,0.3);
  animation: blockBounce var(--d,1.2s) ease-in-out infinite;
}
@keyframes blockBounce { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-7px)} }
.title-label { font-size: 12px; font-weight: 900; color: rgba(100,181,246,0.7); letter-spacing: 4px; margin-bottom: 4px; }
.title-text {
  font-size: 36px; font-weight: 900;
  background: linear-gradient(180deg, #90CAF9, #1E88E5);
  -webkit-background-clip: text; -webkit-text-fill-color: transparent;
  filter: drop-shadow(2px 3px 0 rgba(0,0,0,0.5)); margin-bottom: 6px;
}
.title-sub { font-size: 13px; color: rgba(255,255,255,0.72); line-height: 1.9; margin-bottom: 14px; }
.hi-badge { background: rgba(66,165,245,0.15); border: 1.5px solid rgba(66,165,245,0.4); color: #64B5F6; font-size: 13px; font-weight: 700; padding: 5px 18px; border-radius: 20px; margin-bottom: 16px; display: inline-block; }
.big-btn {
  background: linear-gradient(145deg, #42A5F5, #1565C0);
  color: #fff; border: none; border-radius: 50px; padding: 15px 48px; font-size: 21px; font-weight: 900;
  cursor: pointer; position: relative; overflow: hidden;
  box-shadow: 0 6px 0 #0D47A1, 0 8px 20px rgba(0,0,0,0.35);
  touch-action: manipulation; font-family: inherit;
}
.big-btn::before { content:''; position:absolute; top:0; left:0; right:0; height:50%; border-radius:50px 50px 0 0; background:rgba(255,255,255,0.18); }
.big-btn:active { transform:translateY(5px); box-shadow:0 1px 0 #0D47A1; }

/* GAME */
#game-area {
  position: absolute; inset: 0; z-index: 10; display: none;
  flex-direction: column; align-items: center; justify-content: space-around;
  padding: 80px 14px 14px;
}

/* Progress */
#progress-wrap { width: 100%; max-width: 340px; }
.progress-stars { display: flex; gap: 3px; justify-content: center; margin-bottom: 6px; }
.p-star { font-size: 15px; opacity: 0.2; filter: grayscale(1); transition: all .3s; }
.p-star.earned { opacity: 1; filter: none; animation: starPop .4s ease; }
@keyframes starPop { 0%{transform:scale(0) rotate(-30deg)} 60%{transform:scale(1.5)} 100%{transform:scale(1)} }
#progress-bar-bg { background: rgba(255,255,255,0.12); border-radius: 10px; height: 8px; overflow: hidden; border: 1px solid rgba(255,255,255,0.2); }
#progress-bar { background: linear-gradient(90deg, #42A5F5, #FFD700); height: 100%; border-radius: 10px; transition: width .5s ease; }
#progress-text { font-size: 10px; color: rgba(255,255,255,0.45); text-align: right; margin-top: 3px; }

/* Equation panel */
#eq-panel {
  width: 100%; max-width: 340px;
  background: linear-gradient(145deg, rgba(20,40,120,0.92), rgba(10,20,80,0.95));
  border: 3px solid rgba(66,165,245,0.5); border-radius: 22px; padding: 14px 16px;
  box-shadow: 0 0 20px rgba(66,165,245,0.15), 0 6px 20px rgba(0,0,0,0.4);
}
#eq-mode-label { font-size: 12px; font-weight: 700; color: rgba(100,181,246,0.8); text-align: center; margin-bottom: 10px; letter-spacing: 1px; }

/* Animal rows */
.animal-row-wrap { display: flex; flex-wrap: wrap; justify-content: center; gap: 3px; min-height: 44px; align-items: center; }
.a-item { font-size: 30px; line-height: 1; animation: aPop .3s ease both; }
@keyframes aPop { 0%{transform:scale(0) rotate(-15deg);opacity:0} 60%{transform:scale(1.2)} 100%{transform:scale(1);opacity:1} }
.a-item.faded { opacity: 0.28; }

/* Equation line */
.eq-line { display: flex; align-items: center; justify-content: center; gap: 6px; margin: 8px 0; flex-wrap: wrap; }
.num-badge {
  background: linear-gradient(145deg, #42A5F5, #1E88E5);
  color: #fff; border-radius: 12px; padding: 5px 14px; font-size: 22px; font-weight: 900;
  box-shadow: 0 3px 0 #0D47A1;
}
.op-sign { font-size: 26px; font-weight: 900; color: #FFD700; }
.eq-sign  { font-size: 26px; font-weight: 900; color: #64B5F6; }
.q-mark { font-size: 36px; font-weight: 900; color: #FF6B35; animation: qPulse 1s ease-in-out infinite; }
@keyframes qPulse { 0%,100%{transform:scale(1)} 50%{transform:scale(1.18)} }

/* Choices */
#choices { display: grid; grid-template-columns: repeat(2,1fr); gap: 10px; width: 100%; max-width: 340px; }
.choice-btn {
  position: relative; overflow: hidden;
  background: linear-gradient(145deg, #ffffff, #e8f4ff);
  border: 3px solid #90CAF9; border-radius: 18px; padding: 14px 8px;
  font-size: 30px; font-weight: 900; color: #1565C0;
  cursor: pointer; text-align: center;
  box-shadow: 0 5px 0 #90CAF9, 0 7px 14px rgba(0,0,0,0.18);
  touch-action: manipulation; font-family: inherit; transition: transform .1s;
}
.choice-btn::before { content:''; position:absolute; top:0; left:0; right:0; height:45%; border-radius:15px 15px 0 0; background:rgba(255,255,255,0.5); }
.choice-btn:active { transform:translateY(4px); box-shadow:0 1px 0 #90CAF9; }
.choice-btn.correct { border-color:#4CAF50; background:linear-gradient(145deg,#c8e6c9,#a5d6a7); animation:cPop .4s; box-shadow:0 5px 0 #388e3c, 0 0 20px rgba(76,175,80,0.4); color:#1b5e20; }
.choice-btn.wrong   { border-color:#f44336; background:linear-gradient(145deg,#ffcdd2,#ef9a9a); animation:wShake .4s; color:#b71c1c; }
@keyframes cPop  { 0%{transform:scale(1)} 30%{transform:scale(1.1)} 100%{transform:scale(1)} }
@keyframes wShake{ 0%,100%{transform:translateX(0)} 25%{transform:translateX(-8px)} 75%{transform:translateX(8px)} }

/* Feedback */
#feedback-overlay { position:fixed; inset:0; pointer-events:none; z-index:50; display:flex; align-items:center; justify-content:center; opacity:0; transition:opacity .15s; }
#feedback-text { font-size:90px; filter:drop-shadow(0 4px 12px rgba(0,0,0,.3)); }
#flash { position:fixed; inset:0; z-index:45; pointer-events:none; opacity:0; }

/* Result */
#result-overlay { position:absolute; inset:0; z-index:30; display:none; flex-direction:column; align-items:center; justify-content:center; background:rgba(5,8,40,0.93); }
.result-frame {
  background: linear-gradient(145deg, rgba(20,30,100,0.97), rgba(10,15,70,0.99));
  border: 4px solid #42A5F5; border-radius: 28px; padding: 26px 26px; text-align: center;
  box-shadow: 0 0 0 2px #1565C0, 0 0 40px rgba(66,165,245,0.2), 0 12px 40px rgba(0,0,0,0.6);
  width: 100%; max-width: 320px;
}
.result-trophy { font-size: 64px; margin-bottom: 6px; animation: tBounce .6s ease; }
@keyframes tBounce { 0%{transform:scale(0) rotate(-10deg)} 60%{transform:scale(1.2)} 100%{transform:scale(1)} }
.result-title { font-size: 30px; font-weight: 900; color: #64B5F6; text-shadow: 2px 2px 0 #0D47A1; margin-bottom: 10px; }
.result-score-wrap { background: rgba(0,0,0,0.35); border-radius: 16px; padding: 12px 20px; margin-bottom: 12px; }
.result-score-label { font-size: 15px; color: rgba(255,255,255,.65); font-weight: 700; }
.result-score-num { font-size: 58px; font-weight: 900; color: #FFD700; line-height: 1; display: block; }
.result-hi { font-size: 13px; color: rgba(255,255,255,.5); margin-bottom: 18px; font-weight: 700; }
.result-hi.new { color: #FFD700; font-size: 16px; }
.result-btns { display: flex; gap: 10px; justify-content: center; }
.btn-retry { background:linear-gradient(145deg,#42A5F5,#1565C0); color:#fff; border:none; border-radius:50px; padding:12px 24px; font-size:16px; font-weight:700; cursor:pointer; box-shadow:0 5px 0 #0D47A1; font-family:inherit; }
.btn-title { background:linear-gradient(145deg,#FF9800,#e65100); color:#fff; border:none; border-radius:50px; padding:12px 24px; font-size:16px; font-weight:700; cursor:pointer; box-shadow:0 5px 0 #bf360c; font-family:inherit; }
.btn-retry:active,.btn-title:active { transform:translateY(4px); box-shadow:none; }

.particle { position:fixed; pointer-events:none; z-index:48; font-size:22px; animation:pFly var(--dur,.9s) ease forwards; }
@keyframes pFly { 0%{opacity:1;transform:translate(0,0) scale(1)} 100%{opacity:0;transform:translate(var(--tx,0),var(--ty,-80px)) scale(.2)} }
.pop-word { position:fixed; font-weight:900; pointer-events:none; z-index:49; font-size:24px; animation:pWord .9s ease forwards; }
@keyframes pWord { 0%{opacity:0;transform:translateY(10px) scale(.6)} 25%{opacity:1;transform:translateY(-8px) scale(1.2)} 100%{opacity:0;transform:translateY(-60px) scale(.9)} }
</style>
</head>
<body>
<div id="game-wrap">
<canvas id="bg"></canvas>

<!-- TITLE -->
<div id="title-screen" class="screen">
  <div class="title-frame">
    <div class="title-nums">
      <div class="title-num-block" style="background:linear-gradient(145deg,#EF5350,#B71C1C);--d:1.0s">1</div>
      <div style="font-size:22px;font-weight:900;color:#FFD700;align-self:center;animation:blockBounce 1.1s ease-in-out infinite;animation-delay:.15s">＋</div>
      <div class="title-num-block" style="background:linear-gradient(145deg,#66BB6A,#1B5E20);--d:1.3s;animation-delay:.2s">2</div>
      <div style="font-size:22px;font-weight:900;color:#64B5F6;align-self:center;animation:blockBounce 1.2s ease-in-out infinite;animation-delay:.3s">＝</div>
      <div class="title-num-block" style="background:linear-gradient(145deg,#FF9800,#E65100);--d:1.1s;animation-delay:.1s">？</div>
    </div>
    <div class="title-label">✦ たしざんゲーム ✦</div>
    <div class="title-text">たしざんゲーム！</div>
    <p class="title-sub">どうぶつをかぞえて<br>こたえをえらんでね！</p>
    <div id="hi-title" class="hi-badge">🏆 ハイスコア: 0もん</div>
    <button class="big-btn" onclick="startGame()">▶ スタート！</button>
  </div>
</div>

<!-- HUD -->
<div id="hud">
  <div class="hud-nav">
    <button id="back-btn" onclick="goBack()">🏠 もどる</button>
    <div id="ui-bgm-btn">🔊</div>
  </div>
  <div id="status-bar">
    <div class="hud-chip"><span class="hud-chip-label">せいかい</span><span class="hud-chip-val" id="score-disp">0</span></div>
    <div class="hud-chip"><span class="hud-chip-label">もんだい</span><span class="hud-chip-val" id="q-num-disp">1/10</span></div>
  </div>
</div>

<!-- GAME -->
<div id="game-area">
  <div id="progress-wrap">
    <div class="progress-stars" id="progress-stars"></div>
    <div id="progress-bar-bg"><div id="progress-bar" style="width:0%"></div></div>
    <div id="progress-text">0 / 10</div>
  </div>
  <div id="eq-panel">
    <div id="eq-mode-label">あわせると いくつ？</div>
    <div id="row-a" class="animal-row-wrap"></div>
    <div class="eq-line" id="eq-line"></div>
    <div id="row-b" class="animal-row-wrap"></div>
  </div>
  <div id="choices"></div>
</div>

<!-- FEEDBACK -->
<div id="feedback-overlay"><div id="feedback-text">⭕</div></div>
<div id="flash"></div>

<!-- RESULT -->
<div id="result-overlay" style="display:none;">
  <div class="result-frame">
    <div class="result-trophy" id="r-trophy">🏆</div>
    <div class="result-title" id="r-title">かんぺき！</div>
    <div class="result-score-wrap">
      <div class="result-score-label">せいかい</div>
      <span class="result-score-num" id="r-score">0</span>
      <div class="result-score-label">/ 10 もん</div>
    </div>
    <div class="result-hi" id="r-hi"></div>
    <div class="result-btns">
      <button class="btn-retry" onclick="startGame()">もういちど</button>
      <button class="btn-title" onclick="goTitle()">タイトルへ</button>
    </div>
  </div>
</div>
</div>

<script>
/* ===== Canvas BG ===== */
const cvs=document.getElementById('bg'),ctx=cvs.getContext('2d');
let W,H,stars=[],floats=[];
function initC(){
  W=cvs.offsetWidth;H=cvs.offsetHeight;cvs.width=W;cvs.height=H;
  stars=[];for(let i=0;i<60;i++)stars.push({x:Math.random()*W,y:Math.random()*H*.75,r:.8+Math.random()*2,ph:Math.random()*Math.PI*2,sp:.4+Math.random()});
  floats=[];
  const nums=['1','2','3','4','5','＋','－','＝'];
  for(let i=0;i<8;i++)floats.push({text:nums[i],x:Math.random()*W,y:Math.random()*H*.8,size:16+Math.random()*16,alpha:.06+Math.random()*.1,ph:Math.random()*Math.PI*2,sp:.3+Math.random()*.5});
}
function drawBg(t){
  ctx.clearRect(0,0,W,H);
  const g=ctx.createLinearGradient(0,0,0,H);
  g.addColorStop(0,'#0d1b6e');g.addColorStop(.5,'#1a2fa8');g.addColorStop(1,'#1e3db5');
  ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  // Grid lines (classroom)
  ctx.strokeStyle='rgba(100,150,255,0.07)';ctx.lineWidth=1;
  for(let x=0;x<W;x+=32){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,H);ctx.stroke();}
  for(let y=0;y<H;y+=32){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke();}
  // Stars
  const ts=t/1000;
  stars.forEach(s=>{const tw=(Math.sin(ts*s.sp+s.ph)+1)/2;ctx.fillStyle=`rgba(200,220,255,${tw*.8})`;ctx.beginPath();ctx.arc(s.x,s.y,s.r*(0.5+tw*.5),0,Math.PI*2);ctx.fill();});
  // Floating numbers
  floats.forEach(f=>{
    const bob=Math.sin(ts*f.sp+f.ph)*8;
    ctx.font=`900 ${f.size}px 'M PLUS Rounded 1c',sans-serif`;
    ctx.fillStyle=`rgba(150,200,255,${f.alpha})`;
    ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.fillText(f.text,f.x,f.y+bob);
  });
}
let raf;function bgLoop(t){drawBg(t);raf=requestAnimationFrame(bgLoop);}
initC();requestAnimationFrame(bgLoop);window.addEventListener('resize',initC);

/* ===== Game ===== */
const ANIMALS=['🐱','🐶','🐰','🐸','🐼','🦊','🐧','🐮','🐷','🦁','🐯','🐨'];
const TOTAL=10;
let qIdx=0,score=0,locked=false,current=null;

function getHi(){return parseInt(localStorage.getItem('tashizan_hi')||'0');}
function saveHi(v){localStorage.setItem('tashizan_hi',v);}
function updateHiBadge(){document.getElementById('hi-title').textContent='🏆 ハイスコア: '+getHi()+'もん';}
function shuffle(a){return [...a].sort(()=>Math.random()-.5);}

function initStars(){
  const c=document.getElementById('progress-stars');c.innerHTML='';
  for(let i=0;i<TOTAL;i++){const s=document.createElement('span');s.className='p-star';s.textContent='⭐';s.id='pstar-'+i;c.appendChild(s);}
}
function earnStar(i){const el=document.getElementById('pstar-'+i);if(el)el.classList.add('earned');}

function mkQ(){
  const op='+'; // たしざんゲーム = addition only
  let a,b;
  if(op==='+'){a=1+Math.floor(Math.random()*5);b=1+Math.floor(Math.random()*5);if(a+b>9)b=Math.max(1,9-a);}
  else{a=2+Math.floor(Math.random()*7);b=1+Math.floor(Math.random()*(a-1));}
  const ans=op==='+'?a+b:a-b;
  const an1=ANIMALS[Math.floor(Math.random()*ANIMALS.length)];
  const an2=ANIMALS[Math.floor(Math.random()*ANIMALS.length)];
  return{a,b,op,ans,an1,an2};
}

function mkChoices(ans){
  const s=new Set([ans]);
  while(s.size<4){const d=Math.floor(Math.random()*4)+1;const c=Math.random()<.5?ans+d:Math.max(0,ans-d);if(c!==ans&&c>=0&&c<=10)s.add(c);}
  return [...s].sort(()=>Math.random()-.5);
}

function startGame(){
  score=0;qIdx=0;locked=false;
  document.getElementById('title-screen').style.display='none';
  document.getElementById('result-overlay').style.display='none';
  document.getElementById('hud').style.display='block';
  document.getElementById('game-area').style.display='flex';
  initStars();nextQ();
}

function goTitle(){
  document.getElementById('result-overlay').style.display='none';
  document.getElementById('hud').style.display='none';
  document.getElementById('game-area').style.display='none';
  document.getElementById('title-screen').style.display='flex';
  updateHiBadge();
}

function nextQ(){
  if(qIdx>=TOTAL){endGame();return;}
  locked=false;current=mkQ();
  document.getElementById('progress-bar').style.width=(qIdx/TOTAL*100)+'%';
  document.getElementById('progress-text').textContent=qIdx+' / '+TOTAL;
  document.getElementById('q-num-disp').textContent=(qIdx+1)+'/'+TOTAL;
  document.getElementById('score-disp').textContent=score;
  // Label
  document.getElementById('eq-mode-label').textContent=current.op==='+'?'あわせると いくつ？':'のこりは いくつ？';
  // Row A
  const rA=document.getElementById('row-a');rA.innerHTML='';
  for(let i=0;i<current.a;i++){const s=document.createElement('span');s.className='a-item';s.textContent=current.an1;s.style.animationDelay=(i*.04)+'s';rA.appendChild(s);}
  // Eq line
  const eL=document.getElementById('eq-line');eL.innerHTML='';
  const mkEl=(t,cls)=>{const s=document.createElement('span');s.className=cls;s.textContent=t;return s;};
  eL.appendChild(mkEl(current.a,'num-badge'));
  eL.appendChild(mkEl(current.op==='+'?'＋':'－','op-sign'));
  eL.appendChild(mkEl(current.b,'num-badge'));
  eL.appendChild(mkEl('＝','eq-sign'));
  eL.appendChild(mkEl('？','q-mark'));
  // Row B
  const rB=document.getElementById('row-b');rB.innerHTML='';
  for(let i=0;i<current.b;i++){
    const s=document.createElement('span');s.className='a-item';
    s.textContent=current.op==='+'?current.an2:current.an1;
    if(current.op==='-')s.classList.add('faded');
    s.style.animationDelay=(i*.04)+'s';rB.appendChild(s);
  }
  // Choices
  const ch=mkChoices(current.ans);
  const grid=document.getElementById('choices');grid.innerHTML='';
  ch.forEach(c=>{
    const b=document.createElement('button');b.className='choice-btn';b.textContent=c;
    b.onclick=()=>onAnswer(b,c);
    b.addEventListener('touchend',e=>{e.preventDefault();onAnswer(b,c);},{passive:false});
    grid.appendChild(b);
  });
}

function onAnswer(btn,chosen){
  if(locked)return;locked=true;
  const ok=chosen===current.ans;
  btn.classList.add(ok?'correct':'wrong');
  document.querySelectorAll('.choice-btn').forEach(b=>{if(+b.textContent===current.ans)b.classList.add('correct');});
  if(ok){
    score++;document.getElementById('score-disp').textContent=score;
    earnStar(qIdx);showFeedback('⭕');flash('rgba(76,175,80,0.3)');burst();pop('✨ せいかい！','#FFD700');
  } else {
    showFeedback('❌');flash('rgba(244,67,54,0.3)');pop('こたえは '+current.ans+'！','#FF8A65');
  }
  setTimeout(()=>{hideFeedback();qIdx++;nextQ();},1200);
}

function showFeedback(t){document.getElementById('feedback-text').textContent=t;document.getElementById('feedback-overlay').style.opacity='1';}
function hideFeedback(){document.getElementById('feedback-overlay').style.opacity='0';}
function flash(c){const f=document.getElementById('flash');f.style.transition='';f.style.background=c;f.style.opacity='1';setTimeout(()=>{f.style.transition='opacity .35s';f.style.opacity='0';},100);}
function burst(){
  const items=['⭐','✨','🌟','💫','🎉','➕'];
  const cx=window.innerWidth/2,cy=window.innerHeight*.45;
  for(let i=0;i<10;i++){
    const el=document.createElement('div');el.className='particle';
    el.textContent=items[Math.floor(Math.random()*items.length)];
    const a=(i/10)*Math.PI*2,d=70+Math.random()*60;
    el.style.cssText=`left:${cx}px;top:${cy}px;--tx:${Math.cos(a)*d}px;--ty:${Math.sin(a)*d-50}px;--dur:${.6+Math.random()*.4}s;animation-delay:${Math.random()*.08}s`;
    document.body.appendChild(el);setTimeout(()=>el.remove(),1100);
  }
}
function pop(text,color){
  const el=document.createElement('div');el.className='pop-word';el.textContent=text;el.style.color=color;
  el.style.cssText+=`;left:${window.innerWidth/2-80}px;top:${window.innerHeight*.38}px;text-shadow:2px 2px 4px rgba(0,0,0,.5)`;
  document.body.appendChild(el);setTimeout(()=>el.remove(),1000);
}
function endGame(){
  document.getElementById('hud').style.display='none';
  document.getElementById('game-area').style.display='none';
  document.getElementById('result-overlay').style.display='flex';
  const hi=getHi(),isNew=score>hi;if(isNew)saveHi(score);
  updateHiBadge();
  document.getElementById('r-score').textContent=score;
  const hiEl=document.getElementById('r-hi');
  let trophy,title;
  if(score>=9){trophy='🏆';title='かんぺき！';}
  else if(score>=6){trophy='⭐';title='ナイス！';}
  else{trophy='📖';title='もういちど！';}
  document.getElementById('r-trophy').textContent=trophy;
  document.getElementById('r-title').textContent=title;
  hiEl.textContent=isNew?'🏆 ニューレコード！':'ハイスコア: '+hi+'もん';
  hiEl.className='result-hi'+(isNew?' new':'');
  if(score>=6)for(let i=0;i<12;i++)setTimeout(burst,i*120);
}
function goBack(){if(window.parent!==window)window.parent.postMessage({type:'goBack'},'*');else history.back();}
updateHiBadge();
</script>
