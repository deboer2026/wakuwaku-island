<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>どうぶつのむら｜わくわくアイランド</title>
<link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700;900&display=swap" rel="stylesheet">
<script src="/games/wakuwaku_bgm.js"></script>
<script src="/games/safe_area.js"></script>
<style>
  :root{
    --night:#2a4020;
    --accent:#6bb04a;
    --accent-dark:#437a2b;
    --gold:#ffc93c;
    --pink:#ff9ecb;
    --bad:#ef5350;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent; user-select:none; -webkit-user-select:none;}
  html,body{margin:0; padding:0; width:100%; height:100%; overflow:hidden;}
  body{
    font-family:"Zen Maru Gothic","Hiragino Maru Gothic ProN",sans-serif;
    background:#8fce6e;
    color:var(--night);
    touch-action:manipulation;
    position:fixed; inset:0;
  }
  #gameCanvas{position:absolute; inset:0; width:100%; height:100%; display:block; touch-action:none;}

  /* アクションボタン */
  .action-btn{position:absolute; left:50%; transform:translateX(-50%); bottom:calc(78px + var(--sab,0px)); z-index:11; background:#fff; border:3px solid var(--accent-dark); color:var(--night); border-radius:999px; padding:13px 26px; font-family:inherit; font-size:16px; font-weight:900; box-shadow:0 5px 0 var(--accent-dark); display:none; white-space:nowrap; max-width:88vw;}
  .action-btn.show{display:block; animation:abIn .18s ease-out;}
  .action-btn:active{transform:translateX(-50%) translateY(3px); box-shadow:0 2px 0 var(--accent-dark);}
  @keyframes abIn{from{opacity:0; transform:translateX(-50%) translateY(8px);}to{opacity:1; transform:translateX(-50%) translateY(0);}}

  /* ── HUD ── */
  .hud{position:absolute; left:0; right:0; top:0; padding:max(10px,var(--sat,0px)) max(10px,var(--sar,0px)) 0 max(10px,var(--sal,0px)); display:flex; justify-content:space-between; align-items:flex-start; pointer-events:none; z-index:10;}
  .hud > div{display:flex; gap:6px; align-items:center; flex-wrap:wrap;}
  .icon-btn{pointer-events:auto; background:rgba(255,255,255,.9); border:none; border-radius:50%; width:40px; height:40px; font-size:18px; font-weight:900; color:var(--night); display:flex; align-items:center; justify-content:center; cursor:pointer; box-shadow:0 3px 0 rgba(42,64,32,.3);}
  .icon-btn:active{transform:translateY(2px); box-shadow:0 1px 0 rgba(42,64,32,.3);}
  .chip{pointer-events:auto; background:rgba(255,255,255,.92); border-radius:999px; padding:6px 12px; font-size:13px; font-weight:900; box-shadow:0 3px 0 rgba(42,64,32,.25); display:flex; align-items:center; gap:4px;}
  .chip .lvbar{width:44px; height:8px; background:#e3eeda; border-radius:99px; overflow:hidden;}
  .chip .lvbar i{display:block; height:100%; background:linear-gradient(90deg,#8bc34a,#4caf50); border-radius:99px;}
  .hud-bottom{position:absolute; right:max(10px,var(--sar,0px)); bottom:max(12px,var(--sab,0px)); z-index:10; display:flex; flex-direction:column; gap:8px;}
  .fab{pointer-events:auto; background:#fff; border:3px solid var(--accent-dark); border-radius:50%; width:54px; height:54px; font-size:24px; display:flex; align-items:center; justify-content:center; cursor:pointer; box-shadow:0 4px 0 var(--accent-dark);}
  .fab:active{transform:translateY(2px); box-shadow:0 2px 0 var(--accent-dark);}
  .fab .fdot{position:absolute; top:2px; right:2px; width:12px; height:12px; background:var(--bad); border-radius:50%; border:2px solid #fff; visibility:hidden;}
  .fab .fdot.on{visibility:visible;}
  .mission{position:absolute; top:calc(58px + var(--sat,0px)); left:max(10px,var(--sal,0px)); z-index:9; background:rgba(255,251,235,.95); border:2px solid #e0c780; border-radius:14px; padding:7px 12px; font-size:12px; font-weight:900; box-shadow:0 3px 0 rgba(42,64,32,.2); pointer-events:none; max-width:78vw;}
  .mission .mprog{color:#c79400;}
  .mission.flash{animation:mflash .5s ease-out 2;}
  @keyframes mflash{0%,100%{transform:scale(1);}50%{transform:scale(1.07);}}
  .hint{position:absolute; left:50%; transform:translateX(-50%); bottom:max(16px,var(--sab,0px)); background:rgba(42,64,32,.75); color:#fff; font-size:12px; font-weight:900; border-radius:99px; padding:7px 16px; z-index:9; pointer-events:none; white-space:nowrap; opacity:0; transition:opacity .4s;}
  .hint.show{opacity:1;}

  /* ── キッチンパネル ── */
  .kitchen-panel{position:absolute; left:0; right:0; bottom:0; max-height:58%; background:#fff; border-radius:22px 22px 0 0; box-shadow:0 -6px 0 rgba(42,64,32,.2); z-index:12; padding:12px 14px max(14px,var(--sab,0px)); overflow-y:auto; display:none;}
  .kitchen-panel.show{display:block;}
  .kp-head{display:flex; justify-content:space-between; align-items:center; margin-bottom:8px;}
  .kp-head h2{margin:0; font-size:17px; font-weight:900;}
  .kp-close{background:#eee; border-radius:99px; padding:8px 16px; font-size:13px; font-weight:900; color:var(--night);}
  .recipes{display:flex; flex-direction:column; gap:8px;}
  .recipe{background:#fdf6ec; border:2px solid #e8d5b5; border-radius:14px; padding:8px 10px; display:flex; align-items:center; gap:10px;}
  .recipe .rsprite{width:46px; height:46px; flex-shrink:0;}
  .recipe .rsprite svg{width:100%; height:100%;}
  .recipe .rinfo{flex:1; min-width:0;}
  .recipe .rname{font-size:13px; font-weight:900;}
  .recipe .rneed{display:flex; gap:5px; margin-top:3px; flex-wrap:wrap;}
  .recipe .need{display:flex; align-items:center; gap:2px; background:#fff; border-radius:99px; padding:2px 7px 2px 3px; font-size:11px; font-weight:900;}
  .recipe .need svg{width:17px; height:17px;}
  .recipe .need.ok{color:var(--accent-dark);}
  .recipe .need.ng{color:var(--bad);}
  .cook-btn{background:var(--pink); color:#fff; border:3px solid #d4548f; border-radius:12px; font-size:13px; font-weight:900; padding:9px 13px; box-shadow:0 3px 0 #d4548f; flex-shrink:0;}
  .cook-btn:active{transform:translateY(2px); box-shadow:0 1px 0 #d4548f;}
  .recipe.locked{opacity:.55;}
  .dish-shelf{margin-top:10px; background:#f2f8ec; border-radius:14px; padding:8px;}
  .dish-shelf .row{display:flex; gap:6px; flex-wrap:wrap; margin-top:6px;}
  .dish-chip{background:#fff; border-radius:12px; padding:4px 8px 3px; text-align:center; box-shadow:0 2px 0 rgba(42,64,32,.12);}
  .dish-chip svg{width:26px; height:26px; display:block; margin:0 auto;}
  .dish-chip .st{font-size:10px; color:#c79400; font-weight:900;}

  /* ── モーダル ── */
  .modal-bg{position:fixed; inset:0; background:rgba(30,45,20,.55); display:flex; align-items:center; justify-content:center; z-index:50; padding:16px;}
  .modal{background:#fff; border-radius:22px; padding:18px; width:100%; max-width:360px; text-align:center; box-shadow:0 10px 0 rgba(0,0,0,.2); max-height:84vh; overflow-y:auto;}
  .modal h2{margin:0 0 8px; font-size:18px; font-weight:900;}
  .modal .big-btn{display:block; width:100%; margin-top:12px; background:var(--accent); color:#fff; border:3px solid var(--accent-dark); border-radius:16px; padding:13px 0; font-size:17px; font-weight:900; box-shadow:0 5px 0 var(--accent-dark);}
  .modal .big-btn:active{transform:translateY(3px); box-shadow:0 2px 0 var(--accent-dark);}
  .modal .sub-btn{display:block; width:100%; margin-top:8px; background:#eee; color:var(--night); border-radius:14px; padding:10px 0; font-size:14px; font-weight:900;}
  .modal .act-btn{display:block; width:100%; margin-top:8px; background:#4fc3f7; color:#fff; border:3px solid #0288d1; border-radius:14px; padding:11px 0; font-size:15px; font-weight:900; box-shadow:0 4px 0 #0288d1;}
  .modal .act-btn:active{transform:translateY(2px); box-shadow:0 2px 0 #0288d1;}
  .seed-grid{display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-top:8px;}
  .seed-card{background:#f2f8ec; border:2px solid #cfe4bd; border-radius:14px; padding:8px; cursor:pointer; text-align:center;}
  .seed-card:active{transform:scale(.96);}
  .seed-card svg{width:42px; height:42px;}
  .seed-card .sname{font-size:12px; font-weight:900;}
  .seed-card .stime{font-size:10px; opacity:.7; font-weight:700;}
  .seed-card.locked{opacity:.45; pointer-events:none;}
  .char-grid{display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-top:10px;}
  .char-card{background:#f2f8ec; border:3px solid #cfe4bd; border-radius:18px; padding:12px 8px; cursor:pointer; text-align:center;}
  .char-card:active{transform:scale(.96);}
  .char-card svg{width:76px; height:76px;}
  .char-card .cname{font-size:14px; font-weight:900; margin-top:4px;}
  .reward-line{font-size:15px; font-weight:900; margin:6px 0;}
  .sparkle{display:inline-block; animation:spk 1s ease-in-out infinite;}
  @keyframes spk{0%,100%{transform:scale(1) rotate(0deg);}50%{transform:scale(1.25) rotate(12deg);}}
  .stars-result{font-size:34px; letter-spacing:4px; margin:8px 0;}
  .inv-grid{display:flex; gap:6px; flex-wrap:wrap; justify-content:center; margin-top:8px;}
  .inv-grid .item{background:#f2f8ec; border-radius:12px; padding:5px 7px 4px; text-align:center; min-width:54px;}
  .inv-grid .item svg{width:28px; height:28px; display:block; margin:0 auto;}
  .inv-grid .item .cnt{font-size:11px; font-weight:900;}
  .map-pieces{display:flex; gap:8px; justify-content:center; margin-top:8px;}
  .map-piece{width:44px; height:44px; border-radius:10px; background:#efe3cc; border:2px solid #d9b06a; display:flex; align-items:center; justify-content:center;}
  .map-piece svg{width:34px; height:34px;}
  .hearts{font-size:11px; letter-spacing:1px;}

  /* おようふくやさん */
  .shop-tabs{display:flex; gap:6px; margin:8px 0; overflow-x:auto; padding-bottom:4px; -webkit-overflow-scrolling:touch;}
  .shop-tab{flex:0 0 auto; background:#f3e6f0; border:2px solid #e0c2d5; border-radius:12px; padding:8px 12px; font-family:inherit; font-size:12px; font-weight:900; color:var(--night); opacity:.65; white-space:nowrap;}
  .shop-tab.active{background:#ffdff0; border-color:#e0a8c0; opacity:1;}
  .shop-grid{display:grid; grid-template-columns:1fr 1fr; gap:8px;}
  .shop-card{background:#fdf3f8; border:2px solid #efd4e2; border-radius:14px; padding:8px 6px; text-align:center; cursor:pointer; position:relative;}
  .shop-card:active{transform:scale(.96);}
  .shop-card canvas{width:76px; height:92px; display:block; margin:0 auto;}
  .shop-card .wname{font-size:11px; font-weight:900; margin-top:2px;}
  .shop-card .wprice{font-size:12px; font-weight:900; color:#c79400; margin-top:2px;}
  .shop-card.wearing{border-color:#6bb04a; background:#eef8e6;}
  .shop-card .wtag{position:absolute; top:5px; right:5px; background:var(--accent); color:#fff; font-size:9px; font-weight:900; border-radius:99px; padding:2px 7px;}
  .shop-card.cant .wprice{color:var(--bad);}

  /* 料理ミニゲーム */
  .mini-stage{margin-top:6px;}
  .mini-label{font-size:14px; font-weight:900; margin-bottom:6px;}
  .cut-bar{position:relative; height:34px; background:#f0e6d6; border-radius:99px; overflow:hidden; border:2px solid #d9c6a2;}
  .cut-zone{position:absolute; top:0; bottom:0; background:rgba(139,195,74,.55);}
  .cut-marker{position:absolute; top:0; bottom:0; width:8px; background:var(--bad); border-radius:4px;}
  .tap-btn{display:block; width:100%; margin-top:12px; background:var(--pink); color:#fff; border:3px solid #d4548f; border-radius:16px; padding:14px 0; font-size:18px; font-weight:900; box-shadow:0 5px 0 #d4548f;}
  .tap-btn:active{transform:translateY(3px); box-shadow:0 2px 0 #d4548f;}
  .cut-count{font-size:13px; font-weight:900; margin-top:8px;}
  .pan-gauge{position:relative; height:34px; background:#f0e6d6; border-radius:99px; overflow:hidden; border:2px solid #d9c6a2; margin-top:4px;}
  .pan-fill{position:absolute; top:0; bottom:0; left:0; width:0%; background:linear-gradient(90deg,#ffe082,#ff9800,#e53935); border-radius:99px;}
  .pan-zone{position:absolute; top:0; bottom:0; background:rgba(139,195,74,.55);}

  .toast{position:fixed; left:50%; transform:translateX(-50%); bottom:calc(80px + var(--sab,0px)); background:var(--night); color:#fff; font-size:13px; font-weight:900; border-radius:99px; padding:9px 18px; z-index:60; opacity:0; transition:opacity .25s; pointer-events:none; max-width:90vw; text-align:center;}
  .toast.show{opacity:1;}
</style>
</head>
<body>
<canvas id="gameCanvas"></canvas>

<div class="hud">
  <div>
    <button class="icon-btn" id="backBtn" aria-label="もどる">←</button>
    <span class="chip">👑 <span id="crownNum">0</span></span>
    <span class="chip">Lv.<span id="lvNum">1</span> <span class="lvbar"><i id="lvFill" style="width:0%"></i></span></span>
    <span class="chip" id="mapChip">🗺️ <span id="mapNum">0</span>/4</span>
  </div>
  <div>
    <button class="icon-btn" id="bgmBtn" aria-label="おんがく">🔇</button>
  </div>
</div>
<div class="hud-bottom">
  <button class="fab" id="invBtn" aria-label="もちもの" style="position:relative;">🧺<span class="fdot" id="invDot"></span></button>
</div>
<div class="mission" id="missionBanner">📜 <span id="missionText"></span></div>
<div class="hint" id="hint"></div>

<div class="kitchen-panel" id="kitchenPanel">
  <div class="kp-head">
    <h2>🍳 キッチン</h2>
    <button class="kp-close" id="kitchenClose">むらに もどる</button>
  </div>
  <div class="recipes" id="recipes"></div>
  <div class="dish-shelf">
    <div style="font-size:12px; font-weight:900;">🍽️ できた りょうり</div>
    <div class="row" id="dishRow"></div>
  </div>
</div>

<button class="action-btn" id="actionBtn"></button>
<div class="toast" id="toast"></div>
<div id="modalRoot"></div>

<script>
(function(){
  "use strict";
  const $ = (id) => document.getElementById(id);

  /* ---------- localStorage（安全シム） ---------- */
  const SAFE_LS = (function(){
    try{ const t="__ww_t"; localStorage.setItem(t,t); localStorage.removeItem(t); return localStorage; }
    catch(e){ const m={}; return {
      getItem:(k)=> (k in m ? m[k] : null),
      setItem:(k,v)=>{ m[k]=String(v); },
      removeItem:(k)=>{ delete m[k]; }
    }; }
  })();
  const SAVE_KEY = "mura_progress";

  /* ---------- BGM（共有ライブラリ） ---------- */
  let _bgm = null;
  function initBgm(){
    if(_bgm) return;
    if(typeof WakuwakuBGM !== "undefined"){
      _bgm = new WakuwakuBGM("forest");
      const on = WakuwakuBGM.loadState(); _bgm.setEnabled(on); if(on) _bgm.start();
    } else {
      _bgm = { enabled:false, toggle(){return false;}, start(){}, stop(){}, setEnabled(){} };
    }
    syncBgm();
  }
  function toggleBgm(){
    if(!_bgm){ initBgm(); }
    const on = _bgm.toggle();
    if(typeof WakuwakuBGM !== "undefined") WakuwakuBGM.saveState(on);
    syncBgm();
  }
  function syncBgm(){ $("bgmBtn").textContent = (_bgm && _bgm.enabled) ? "🔊" : "🔇"; }
  $("bgmBtn").addEventListener("click", () => { ensureAudio(); toggleBgm(); });
  $("backBtn").addEventListener("click", () => { try{ parent.postMessage({type:"goBack"}, "*"); }catch(e){} });

  /* ---------- 効果音 ---------- */
  let audioCtx = null;
  function ensureAudio(){
    if(!audioCtx){
      try{ audioCtx = new (window.AudioContext || window.webkitAudioContext)(); }catch(e){}
    }
    initBgm();
  }
  function beep(freq, dur, type, when, vol){
    if(!audioCtx) return;
    try{
      const o = audioCtx.createOscillator();
      const g = audioCtx.createGain();
      o.type = type || "sine";
      o.frequency.value = freq;
      g.gain.setValueAtTime(vol || 0.12, audioCtx.currentTime + (when||0));
      g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + (when||0) + dur);
      o.connect(g); g.connect(audioCtx.destination);
      o.start(audioCtx.currentTime + (when||0));
      o.stop(audioCtx.currentTime + (when||0) + dur + 0.02);
    }catch(e){}
  }
  const sfx = {
    plant(){ beep(520,.09,"triangle",0); beep(660,.1,"triangle",.08); },
    water(){ beep(880,.06,"sine",0,.09); beep(990,.06,"sine",.06,.09); beep(1180,.08,"sine",.12,.09); },
    harvest(){ beep(660,.08,"square",0,.08); beep(880,.1,"square",.07,.08); beep(1320,.14,"square",.14,.08); },
    tap(){ beep(740,.05,"triangle",0,.1); },
    step(){ beep(300,.03,"triangle",0,.04); },
    good(){ beep(880,.08,"triangle",0); beep(1100,.1,"triangle",.07); },
    bad(){ beep(220,.15,"sawtooth",0,.08); },
    done(){ beep(660,.1,"triangle",0); beep(830,.1,"triangle",.09); beep(990,.16,"triangle",.18); },
    crown(){ beep(784,.09,"square",0,.08); beep(988,.09,"square",.08,.08); beep(1175,.09,"square",.16,.08); beep(1568,.2,"square",.24,.08); },
    dig(){ beep(180,.08,"square",0,.1); beep(150,.08,"square",.1,.1); },
    treasure(){ beep(523,.1,"triangle",0); beep(659,.1,"triangle",.1); beep(784,.1,"triangle",.2); beep(1046,.3,"triangle",.3); },
    door(){ beep(440,.07,"triangle",0,.09); beep(550,.09,"triangle",.07,.09); },
  };

  /* ================= データ定義 ================= */
  const CROPS = {
    ninjin:{ name:"にんじん",     time:40,  lv:1 },
    tomato:{ name:"トマト",       time:60,  lv:1 },
    ichigo:{ name:"いちご",       time:90,  lv:1 },
    corn:{   name:"とうもろこし", time:120, lv:2 },
    komugi:{ name:"こむぎ",       time:150, lv:0 },
  };
  const RECIPES = {
    salad:{   name:"やさいサラダ", need:{ninjin:1,tomato:1}, lv:1 },
    soup:{    name:"やさいスープ", need:{ninjin:2,corn:1},   lv:2 },
    popcorn:{ name:"ポップコーン", need:{corn:2},            lv:2 },
    omelet:{  name:"オムレツ",     need:{egg:2,tomato:1},    lv:5 },
    cake:{    name:"いちごケーキ", need:{ichigo:2,egg:1},    lv:5 },
    pan:{     name:"こむぎパン",   need:{komugi:2},          lv:1, needKomugi:true },
  };
  const ANIMALS = {
    neko:{    name:"ねこ" },
    usagi:{   name:"うさぎ" },
    kuma:{    name:"くま" },
    kitsune:{ name:"きつね" },
    panda:{   name:"ぱんだ" },
  };
  const LEVELS = [0, 0, 30, 70, 120, 180, 260];
  const MAX_LV = 6;
  const LEVEL_MSG = {
    2:"はたけが 1つ ふえた！ とうもろこしの たねも つかえるよ！",
    3:"⛲ いどが できた！ ぜんぶの はたけに いっきに みずを あげられるよ！",
    4:"🔥 かまどが ぱわーあっぷ！ りょうりが すこし かんたんに なったよ！",
    5:"🐔 にわとりごやが できた！ たまごで あたらしい りょうりが つくれるよ！",
    6:"はたけが もう1つ ふえた！ むらが おおきくなったね！",
  };
  const MAX_PLOTS_BY_LV = {1:4, 2:5, 3:5, 4:5, 5:5, 6:6};
  const EGG_INTERVAL = 90;
  const EGG_MAX = 3;
  const TREASURES = [
    { id:"komugi", label:"こむぎの たね！ あたらしい さくもつだ！" },
    { id:"hata",   label:"むらの はた！ むらに かざられたよ！" },
    { id:"funsui", label:"ふんすい！ むらが にぎやかに なったよ！" },
    { id:"crown30",label:"クラウン 30こ！ やったね！" },
  ];

  /* ================= ワールド座標 ================= */
  const WORLD = { w:760, h:1020 };
  const POS = {
    kitchen: {x:390, y:180},           /* 建物中心 */
    kitchenDoor: {x:390, y:262},       /* 近づく地点 */
    coop: {x:130, y:300},
    well: {x:118, y:500},
    plots: [
      {x:150, y:660},{x:275, y:660},{x:400, y:660},
      {x:150, y:800},{x:275, y:800},{x:400, y:800},
    ],
    houses: [ {x:640,y:330},{x:640,y:480},{x:640,y:630},{x:640,y:780},{x:640,y:915} ],
    dig: {x:530, y:520},
    fountain: {x:390, y:470},
    boutique: {x:265, y:360},
    boutiqueDoor: {x:265, y:420},
    flag: {x:505, y:225},
    star: {x:255, y:470},
    spawn: {x:390, y:560},
    trees: [ {x:60,y:150},{x:695,y:120},{x:55,y:930},{x:520,y:950},{x:700,y:200} ],
    bushes: [ {x:230,y:150},{x:60,y:640},{x:540,y:880} ],
  };

  /* ================= セーブデータ ================= */
  function defaultState(){
    return {
      gender:null,
      crowns:0, totalCrowns:0, level:1,
      plots:[null,null,null,null,null,null],

  function load(){
    try{
      const raw = SAFE_LS.getItem(SAVE_KEY);
      if(!raw) return;
      const d = JSON.parse(raw);
      S = Object.assign(defaultState(), d);
      S.inv = Object.assign(defaultState().inv, d.inv || {});
      S.friends = Object.assign(defaultState().friends, d.friends || {});
      if(!Array.isArray(S.plots) || S.plots.length !== 6) S.plots = defaultState().plots;
      if(!Array.isArray(S.dishes)) S.dishes = [];
      if(!Array.isArray(S.orders)) S.orders = [];
      if(!Array.isArray(S.decos)) S.decos = [];
      const wdef = defaultState().wardrobe;
      S.wardrobe = Object.assign({}, wdef, d.wardrobe || {});
      if(!Array.isArray(S.wardrobe.owned)) S.wardrobe.owned = wdef.owned.slice();
      wdef.owned.forEach(id => { if(S.wardrobe.owned.indexOf(id) < 0) S.wardrobe.owned.push(id); });

  }

  /* ================= レベル ================= */
  function calcLevel(total){
    let lv = 1;
    for(let i=2; i<=MAX_LV; i++){ if(total >= LEVELS[i]) lv = i; }
    return lv;
  }
  function addCrowns(n){
    S.crowns += n; S.totalCrowns += n;
    const newLv = calcLevel(S.totalCrowns);
    if(newLv > S.level){
      const msgs = [];
      for(let l=S.level+1; l<=newLv; l++){ if(LEVEL_MSG[l]) msgs.push("むらLv." + l + "！ " + LEVEL_MSG[l]); }
      S.level = newLv;
      if(msgs.length){ showRewardModal("🎉 レベルアップ！", msgs.join("\n"), null); sfx.crown(); }
      setTimeout(checkStateMission, 50);

  }

  const stick = { active:false, id:null, ox:0, oy:0, dx:0, dy:0 };
  const STICK_R = 52, STICK_DEAD = 9;
  const keys = {};
  window.addEventListener("keydown", (e) => { keys[e.key] = true; });
  window.addEventListener("keyup", (e) => { keys[e.key] = false; });
  function inputVector(){
    if(stick.active){
      const d = Math.hypot(stick.dx, stick.dy);
      if(d > STICK_DEAD) return { x: stick.dx/d, y: stick.dy/d };
      return null;
    }
    let ix = 0, iy = 0;
    if(keys.ArrowLeft || keys.a) ix -= 1;
    if(keys.ArrowRight || keys.d) ix += 1;
    if(keys.ArrowUp || keys.w) iy -= 1;
    if(keys.ArrowDown || keys.s) iy += 1;
    if(ix || iy){ const d = Math.hypot(ix, iy); return { x: ix/d, y: iy/d }; }
    return null;
  }

  function moveTowards(o, speed, dt){
    const dx = o.tx - o.x, dy = o.ty - o.y;
    const d = Math.hypot(dx, dy);
    if(d < 4){ o.moving = false; return true; }
    o.moving = true;
    const step = Math.min(d, speed * dt);
    o.x += dx/d * step; o.y += dy/d * step;
    return false;
  }

  function cropRatio(p){
    const total = CROPS[p.crop].time * 1000;
    const elapsed = Date.now() - p.plantedAt + (p.boost || 0);
    return Math.min(1, elapsed / total);
  }
  function recipeUnlocked(id){
    const r = RECIPES[id];
    if(r.needKomugi && !S.komugiUnlocked) return false;
    return S.level >= r.lv;
  }
  function canCook(id){
    const r = RECIPES[id];
    return Object.keys(r.need).every(k => (S.inv[k]||0) >= r.need[k]);
  }
  function availableRecipeIds(){ return Object.keys(RECIPES).filter(recipeUnlocked); }
  function makeOrder(excludeAnimal){
    const rs = availableRecipeIds();
    const dish = rs[Math.floor(Math.random()*rs.length)];
    let as = Object.keys(ANIMALS).filter(a => a !== excludeAnimal);
    const animal = as[Math.floor(Math.random()*as.length)];
    return { animal, dish };
  }
  function ensureOrders(){
    S.orders = S.orders.filter(o => o && ANIMALS[o.animal] && RECIPES[o.dish]);
    while(S.orders.length < 2){
      S.orders.push(makeOrder(S.orders.length ? S.orders[0].animal : null));
    }
    if(S.orders[0].animal === S.orders[1].animal){
      S.orders[1] = makeOrder(S.orders[0].animal);
    }
    S.orders = S.orders.map((o,i) => recipeUnlocked(o.dish) ? o : makeOrder(S.orders[1-i] ? S.orders[1-i].animal : null));
  }
  function orderForAnimal(id){ return S.orders.find(o => o.animal === id) || null; }
  function findDishIndex(dishId){
    let best = -1, bestStars = -1;
    S.dishes.forEach((d,i) => { if(d.id === dishId && d.stars > bestStars){ best = i; bestStars = d.stars; } });
    return best;
  }

  function rr(x, y, w, h, r){
    ctx.beginPath();
    ctx.moveTo(x+r, y);
    ctx.arcTo(x+w, y, x+w, y+h, r);
    ctx.arcTo(x+w, y+h, x, y+h, r);
    ctx.arcTo(x, y+h, x, y, r);
    ctx.arcTo(x, y, x+w, y, r);
    ctx.closePath();
  }
  function shadow(x, y, w){
    ctx.fillStyle = "rgba(42,64,32,.18)";
    ctx.beginPath(); ctx.ellipse(x, y, w, w*0.36, 0, 0, Math.PI*2); ctx.fill();
  }
  function star5(x, y, r, fill, stroke){
    ctx.beginPath();
    for(let i=0; i<10; i++){
      const ang = -Math.PI/2 + i*Math.PI/5;
      const rad = (i%2===0) ? r : r*0.45;
      const px = x + Math.cos(ang)*rad, py = y + Math.sin(ang)*rad;
      if(i===0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
    }
    ctx.closePath();
    ctx.fillStyle = fill; ctx.fill();
    if(stroke){ ctx.strokeStyle = stroke; ctx.lineWidth = 1.2; ctx.stroke(); }
  }
  function diamond(x, y, r, fill){
    ctx.beginPath();
    ctx.moveTo(x, y-r); ctx.lineTo(x+r*0.6, y); ctx.lineTo(x, y+r); ctx.lineTo(x-r*0.6, y);
    ctx.closePath(); ctx.fillStyle = fill; ctx.fill();
  }

  /* ---- 主人公 ---- */
  function rrc(c, x, y, w, h, r){
    c.beginPath();
    c.moveTo(x+r, y);
    c.arcTo(x+w, y, x+w, y+h, r);
    c.arcTo(x+w, y+h, x, y+h, r);
    c.arcTo(x, y+h, x, y, r);
    c.arcTo(x, y, x+w, y, r);
    c.closePath();
  }
  function star5c(c, x, y, r, fill, stroke){
    c.beginPath();
    for(let i=0; i<10; i++){
      const ang = -Math.PI/2 + i*Math.PI/5;
      const rad = (i%2===0) ? r : r*0.45;
      const px = x + Math.cos(ang)*rad, py = y + Math.sin(ang)*rad;
      if(i===0) c.moveTo(px, py); else c.lineTo(px, py);
    }
    c.closePath();
    c.fillStyle = fill; c.fill();
    if(stroke){ c.strokeStyle = stroke; c.lineWidth = 1.2; c.stroke(); }
  }
  function heartc(c, x, y, sz, fill){
    c.fillStyle = fill;
    c.beginPath();
    c.moveTo(x, y + sz*0.9);
    c.bezierCurveTo(x - sz*1.2, y, x - sz*0.7, y - sz*0.9, x, y - sz*0.25);
    c.bezierCurveTo(x + sz*0.7, y - sz*0.9, x + sz*1.2, y, x, y + sz*0.9);
    c.closePath(); c.fill();
  }
  function princessDressPath(c, x, by){
    c.beginPath();
    c.moveTo(x-7, by-34); c.lineTo(x+7, by-34);
    c.quadraticCurveTo(x+15, by-14, x+13, by-8);
    c.quadraticCurveTo(x, by-4, x-13, by-8);
    c.quadraticCurveTo(x-15, by-14, x-7, by-34);
    c.closePath();
  }
  function outfitFill(c, of, x, by, princess){
    if(of.rainbow){
      const g = c.createLinearGradient(x, by-36, x, by-6);
      g.addColorStop(0, "#ff7eb3"); g.addColorStop(0.3, "#ffd24d");
      g.addColorStop(0.62, "#6bd47e"); g.addColorStop(1, "#5b8def");
      return g;
    }
    return princess ? of.d : of.p;
  }
  function drawOutfitPattern(c, of, x, by, princess){
    if(!of.pat) return;
    c.save();
    if(princess){ princessDressPath(c, x, by); } else { rrc(c, x-9, by-36, 18, 24, 6); }
    c.clip();
    if(of.pat === "dots"){
      c.fillStyle = "rgba(255,255,255,.85)";
      for(let iy=0; iy<4; iy++) for(let ix=0; ix<3; ix++){
        c.beginPath();
        c.arc(x-10 + ix*10 + (iy%2)*5, by-32 + iy*8, 1.8, 0, Math.PI*2);
        c.fill();
      }
    } else if(of.pat === "stars"){
      star5c(c, x-6, by-28, 3.4, "#ffe082");
      star5c(c, x+6, by-20, 3, "#ffe082");
      star5c(c, x-2, by-11, 2.6, "#fff");
    } else if(of.pat === "stripes"){
      c.fillStyle = "rgba(255,255,255,.9)";
      for(let i=0; i<4; i++) c.fillRect(x-15, by-34 + i*7.5, 30, 3.4);
    } else if(of.pat === "hearts"){
      heartc(c, x-6, by-27, 3, "rgba(255,255,255,.9)");
      heartc(c, x+6, by-19, 2.7, "rgba(255,255,255,.9)");
      heartc(c, x-2, by-11, 2.4, "#ffe0ec");
    } else if(of.pat === "flowers"){
      [[-6,-27],[6,-20],[-1,-11]].forEach(f => {
        for(let i=0; i<5; i++){
          const a = i * Math.PI*2/5;
          c.fillStyle = "#fff";
          c.beginPath(); c.arc(x+f[0]+Math.cos(a)*2.4, by+f[1]+Math.sin(a)*2.4, 1.5, 0, Math.PI*2); c.fill();
        }
        c.fillStyle = "#ffd24d";
        c.beginPath(); c.arc(x+f[0], by+f[1], 1.4, 0, Math.PI*2); c.fill();
      });
    } else if(of.pat === "galaxy"){
      c.fillStyle = "#ffe082";
      c.beginPath(); c.arc(x-5, by-26, 4.2, 0, Math.PI*2); c.fill();
      c.fillStyle = princess ? of.d : of.p;
      c.beginPath(); c.arc(x-3.4, by-27.2, 3.6, 0, Math.PI*2); c.fill();
      star5c(c, x+6, by-20, 2.6, "#ffe082");
      star5c(c, x-1, by-12, 2.2, "#fff");
      c.fillStyle = "#fff";
      c.beginPath(); c.arc(x+7, by-11, 1, 0, Math.PI*2); c.fill();
    } else if(of.pat === "trim"){
      c.strokeStyle = "#ffd24d"; c.lineWidth = 2;
      if(princess){ princessDressPath(c, x, by); c.stroke(); }
      else { rrc(c, x-7.5, by-34.5, 15, 21, 5); c.stroke(); }
      c.fillStyle = "#ffd24d";
      c.beginPath(); c.arc(x, by-29, 1.6, 0, Math.PI*2); c.fill();
      c.beginPath(); c.arc(x, by-23, 1.6, 0, Math.PI*2); c.fill();
    }
    c.restore();
  }

    c.moveTo(x-9, by-34);
    c.quadraticCurveTo(x-19+sway, by-20, x-16+sway, by-6);
    c.lineTo(x+16-sway, by-6);
    c.quadraticCurveTo(x+19-sway, by-20, x+9, by-34);
    c.closePath(); c.fill();
    if(neck === "neck_capestar"){
      star5c(c, x-8+sway*0.5, by-18, 2.6, "#ffe082");
      star5c(c, x+7-sway*0.5, by-13, 2.2, "#ffe082");
    }
  }
  function drawNeckFront(c, neck, x, by){
    if(neck === "neck_scarf"){
      c.fillStyle = "#e05572";
      rrc(c, x-9.5, by-37, 19, 5.5, 2.6); c.fill();
      rrc(c, x+2, by-34, 5.5, 11, 2.4); c.fill();
      c.strokeStyle = "#c94560"; c.lineWidth = 1;
      c.beginPath(); c.moveTo(x+3.4, by-26); c.lineTo(x+3.4, by-24); c.moveTo(x+6, by-26); c.lineTo(x+6, by-24); c.stroke();
    } else if(neck === "neck_tie"){
      c.fillStyle = "#e05572";
      c.beginPath(); c.moveTo(x, by-33); c.lineTo(x-6, by-36.4); c.lineTo(x-6, by-29.6); c.closePath(); c.fill();
      c.beginPath(); c.moveTo(x, by-33); c.lineTo(x+6, by-36.4); c.lineTo(x+6, by-29.6); c.closePath(); c.fill();
      c.fillStyle = "#c94560";
      c.beginPath(); c.arc(x, by-33, 1.9, 0, Math.PI*2); c.fill();
    } else if(neck === "neck_necklace"){
      c.strokeStyle = "#ffd24d"; c.lineWidth = 1.6;

  function drawHandItem(c, hand, x, by, t){
    const hx = x-13, hy2 = by-22;
    if(hand === "hand_wand"){
      c.strokeStyle = "#b06a3b"; c.lineWidth = 2.6; c.lineCap = "round";
      c.beginPath(); c.moveTo(hx+3, hy2+3); c.lineTo(hx-6, hy2-14); c.stroke();
      star5c(c, hx-7, hy2-17, 5, "#ffd24d", "#c79400");
    } else if(hand === "hand_balloon"){
      const sw = t !== undefined ? Math.sin(t*2.2)*3 : 0;
      c.strokeStyle = "rgba(120,120,140,.8)"; c.lineWidth = 1.2;
      c.beginPath(); c.moveTo(hx, hy2); c.quadraticCurveTo(hx-3, hy2-16, hx-5+sw, hy2-32); c.stroke();
      c.fillStyle = "#e05572";
      c.beginPath(); c.ellipse(hx-5+sw, hy2-40, 8, 9.5, 0, 0, Math.PI*2); c.fill();
      c.fillStyle = "rgba(255,255,255,.55)";
      c.beginPath(); c.arc(hx-8+sw, hy2-43, 2.6, 0, Math.PI*2); c.fill();
    } else if(hand === "hand_hana"){
      c.strokeStyle = "#6fb54e"; c.lineWidth = 2.2; c.lineCap = "round";
      c.beginPath(); c.moveTo(hx, hy2); c.lineTo(hx-3, hy2-9); c.stroke();
      c.beginPath(); c.moveTo(hx, hy2); c.lineTo(hx+1, hy2-10); c.stroke();
      c.beginPath(); c.moveTo(hx, hy2); c.lineTo(hx-7, hy2-8); c.stroke();
      [[-7,-10,"#ff9ecb"],[-3,-12,"#ffd24d"],[1,-13,"#c97fe0"]].forEach(f => {
        c.fillStyle = f[2];
        c.beginPath(); c.arc(hx+f[0], hy2+f[1], 3.2, 0, Math.PI*2); c.fill();
        c.fillStyle = "#fff";
        c.beginPath(); c.arc(hx+f[0], hy2+f[1], 1.3, 0, Math.PI*2); c.fill();
      });
    } else if(hand === "hand_basket"){
      c.fillStyle = "#c9954e";
      c.beginPath(); c.moveTo(hx-7, hy2); c.lineTo(hx+7, hy2); c.lineTo(hx+5, hy2+8); c.lineTo(hx-5, hy2+8); c.closePath(); c.fill();
      c.strokeStyle = "#a3773a"; c.lineWidth = 1.6;
      c.beginPath(); c.arc(hx, hy2-1, 6, Math.PI, 0); c.stroke();
      c.strokeStyle = "rgba(163,119,58,.7)"; c.lineWidth = 1;
      c.beginPath(); c.moveTo(hx-6, hy2+3); c.lineTo(hx+6, hy2+3); c.stroke();
    } else if(hand === "hand_flag"){
      c.strokeStyle = "#8a5a30"; c.lineWidth = 2.4; c.lineCap = "round";
      c.beginPath(); c.moveTo(hx, hy2+4); c.lineTo(hx, hy2-24); c.stroke();
      const wav = t !== undefined ? Math.sin(t*3)*1.6 : 0;
      c.fillStyle = "#ff7eb3";
      c.beginPath();
      c.moveTo(hx+1, hy2-24);
      c.quadraticCurveTo(hx+10, hy2-23+wav, hx+18, hy2-21);
      c.lineTo(hx+1, hy2-15);
      c.closePath(); c.fill();
      star5c(c, hx+8, hy2-20, 2.6, "#fff");
    } else if(hand === "hand_candy"){
      c.strokeStyle = "#fff"; c.lineWidth = 2.6; c.lineCap = "round";
      c.beginPath(); c.moveTo(hx, hy2+3); c.lineTo(hx-3, hy2-10); c.stroke();
      c.fillStyle = "#ff7eb3";
      c.beginPath(); c.arc(hx-4, hy2-16, 7, 0, Math.PI*2); c.fill();
      c.strokeStyle = "#fff"; c.lineWidth = 2.2;
      c.beginPath(); c.arc(hx-4, hy2-16, 4.4, 0.2, Math.PI*1.4); c.stroke();
      c.beginPath(); c.arc(hx-4, hy2-16, 1.8, Math.PI, Math.PI*2.2); c.stroke();
    }
  }
  function drawPlayerTo(c, x, y, t, moving, gender, ward){
    ward = normalizeWard(ward || S.wardrobe);
    const of = OUTFITS[ward.outfit];
    const sh = SHOES[ward.shoes];
    const princess = (gender === "princess");
    const bob = moving ? Math.sin(t*12)*2.2 : Math.sin(t*2.2)*1;
    const legPh = moving ? Math.sin(t*12) : 0;
    c.fillStyle = "rgba(42,64,32,.18)";
    c.beginPath(); c.ellipse(x, y+2, 15, 5.4, 0, 0, Math.PI*2); c.fill();
    const by = y + bob;
    /* マント（うしろ） */
    drawNeckBack(c, ward.neck, x, by, t);
    /* あし（くつ） */
    if(sh.niji){
      c.fillStyle = "#ff7eb3"; rrc(c, x-8, by-14+legPh*3, 6, 12, 3); c.fill();
      c.fillStyle = "#5b8def"; rrc(c, x+2, by-14-legPh*3, 6, 12, 3); c.fill();
      c.strokeStyle = "#ffd24d"; c.lineWidth = 1.4;
      rrc(c, x-8, by-14+legPh*3, 6, 12, 3); c.stroke();
      rrc(c, x+2, by-14-legPh*3, 6, 12, 3); c.stroke();
    } else {
      c.fillStyle = sh.col;
      rrc(c, x-8, by-14+legPh*3, 6, 12, 3); c.fill();
      rrc(c, x+2, by-14-legPh*3, 6, 12, 3); c.fill();
      if(sh.trim){
        c.strokeStyle = sh.trim; c.lineWidth = 1.4;
        rrc(c, x-8, by-14+legPh*3, 6, 12, 3); c.stroke();
        rrc(c, x+2, by-14-legPh*3, 6, 12, 3); c.stroke();
      }
    }
    /* ふく */
    if(princess){
      c.fillStyle = outfitFill(c, of, x, by, true);
      princessDressPath(c, x, by); c.fill();
      drawOutfitPattern(c, of, x, by, true);
      if(of.pat !== "trim"){
        c.strokeStyle = "rgba(255,255,255,.75)"; c.lineWidth = 1.6;
        c.beginPath(); c.moveTo(x-9, by-14); c.quadraticCurveTo(x, by-10, x+9, by-14); c.stroke();
      }
    } else {
      c.fillStyle = outfitFill(c, of, x, by, false);
      rrc(c, x-9, by-36, 18, 24, 6); c.fill();
      drawOutfitPattern(c, of, x, by, false);
      if(of.pat !== "trim"){
        c.fillStyle = "#ffd24d";
        c.fillRect(x-9, by-20, 18, 3.5);
      }
    }
    /* くびもと（まえ） */
    drawNeckFront(c, ward.neck, x, by);
    /* うで */
    c.strokeStyle = "#ffe0c2"; c.lineWidth = 4.5; c.lineCap = "round";
    c.beginPath(); c.moveTo(x-9, by-31); c.lineTo(x-13, by-22-legPh*2); c.stroke();
    c.beginPath(); c.moveTo(x+9, by-31); c.lineTo(x+13, by-22+legPh*2); c.stroke();
    /* てのアイテム */
    drawHandItem(c, ward.hand, x, by, t);
    /* あたま */
    const hy = by - 44;
    if(princess){
      c.fillStyle = "#b0713a";
      c.beginPath(); c.ellipse(x, hy+2, 13.5, 13, 0, 0, Math.PI*2); c.fill();
      c.beginPath(); c.ellipse(x-11, hy+9, 4.5, 9, 0.25, 0, Math.PI*2); c.fill();
      c.beginPath(); c.ellipse(x+11, hy+9, 4.5, 9, -0.25, 0, Math.PI*2); c.fill();
    }
    c.fillStyle = "#ffe0c2";
    c.beginPath(); c.arc(x, hy+2, 10.5, 0, Math.PI*2); c.fill();
    /* かみ（前髪） */
    c.fillStyle = princess ? "#b0713a" : "#7a4f2b";
    c.beginPath();
    c.arc(x, hy+1, 10.5, Math.PI*1.05, Math.PI*1.95);
    c.quadraticCurveTo(x+6, hy-3, x, hy-2);
    c.quadraticCurveTo(x-6, hy-3, x-10, hy+1);
    c.closePath(); c.fill();
    /* かお */
    c.fillStyle = "#2a2440";
    c.beginPath(); c.arc(x-3.6, hy+3, 1.5, 0, Math.PI*2); c.fill();
    c.beginPath(); c.arc(x+3.6, hy+3, 1.5, 0, Math.PI*2); c.fill();
    c.strokeStyle = "#2a2440"; c.lineWidth = 1.3;
    c.beginPath(); c.arc(x, hy+6, 2.6, 0.15*Math.PI, 0.85*Math.PI); c.stroke();
    if(princess){
      c.fillStyle = "rgba(255,140,170,.5)";
      c.beginPath(); c.arc(x-6.5, hy+6, 1.7, 0, Math.PI*2); c.fill();
      c.beginPath(); c.arc(x+6.5, hy+6, 1.7, 0, Math.PI*2); c.fill();
    }
    /* かおのアイテム */
    drawFaceAcc(c, ward.face, x, hy);
    /* あたまのアイテム */
    drawHeadwear(c, ward.head, x, hy, t);
  }
  function drawPlayer(x, y, t, moving, gender){
    drawPlayerTo(ctx, x, y, t, moving, gender, S.wardrobe);
  }

  /* ---- おとも ---- */
  function drawPet(c, id, x, y, t){

      c.beginPath(); c.ellipse(x-6, y-7+bob, 3, 4.2, 0.5, 0, Math.PI*2); c.fill();
      c.fillStyle = "#ff9800";
      c.beginPath(); c.moveTo(x+6.5, y-9+bob); c.lineTo(x+10, y-8+bob); c.lineTo(x+6.5, y-7+bob); c.closePath(); c.fill();
      c.fillStyle = "#2a2440";

    } else if(id === "pet_chou"){

      c.beginPath(); c.ellipse(x+4.5*flap, fy-2, 5.5*flap, 6.5, 0.4, 0, Math.PI*2); c.fill();
      c.fillStyle = "#f75d7f";

      c.beginPath(); c.ellipse(x+3.4*flap, fy+3, 3.4*flap, 3.8, 0.4, 0, Math.PI*2); c.fill();
      c.fillStyle = "#5a4a6a";
      c.beginPath(); c.ellipse(x, fy+1, 1.5, 5.5, 0, 0, Math.PI*2); c.fill();
    } else if(id === "pet_kotori"){
      const fy = y - 26 + Math.sin(t*2.6)*3.4;
      c.fillStyle = "#5ecbf7";
      c.beginPath(); c.ellipse(x, fy, 7, 6, 0, 0, Math.PI*2); c.fill();
      const flap = Math.sin(t*9) * 0.5;
      c.fillStyle = "#3fa8d8";
      c.beginPath(); c.ellipse(x-3, fy-1, 5, 3, -0.7 + flap, 0, Math.PI*2); c.fill();
      c.beginPath(); c.moveTo(x-6.5, fy+2); c.lineTo(x-11, fy+4); c.lineTo(x-6.5, fy+4.6); c.closePath(); c.fill();
      c.fillStyle = "#ff9800";
      c.beginPath(); c.moveTo(x+6.4, fy-1.4); c.lineTo(x+9.6, fy-0.4); c.lineTo(x+6.4, fy+0.6); c.closePath(); c.fill();
      c.fillStyle = "#2a2440";
      c.beginPath(); c.arc(x+3.4, fy-2, 1.1, 0, Math.PI*2); c.fill();
      c.fillStyle = "#cfefff";
      c.beginPath(); c.ellipse(x+1, fy+2.6, 3.4, 2.4, 0, 0, Math.PI*2); c.fill();
    } else if(id === "pet_kaeru"){
      const bob = Math.abs(Math.sin(t*4))*3;
      c.fillStyle = "rgba(42,64,32,.14)";
      c.beginPath(); c.ellipse(x, y+1, 8, 3, 0, 0, Math.PI*2); c.fill();
      c.fillStyle = "#6bd47e";
      c.beginPath(); c.ellipse(x, y-6-bob, 8, 6.5, 0, 0, Math.PI*2); c.fill();
      c.beginPath(); c.arc(x-4, y-12-bob, 3, 0, Math.PI*2); c.fill();
      c.beginPath(); c.arc(x+4, y-12-bob, 3, 0, Math.PI*2); c.fill();
      c.fillStyle = "#fff";

      c.beginPath(); c.arc(x+4, y-12.4-bob, 1.8, 0, Math.PI*2); c.fill();
      c.fillStyle = "#2a2440";
      c.beginPath(); c.arc(x-4, y-12.4-bob, 0.9, 0, Math.PI*2); c.fill();
      c.beginPath(); c.arc(x+4, y-12.4-bob, 0.9, 0, Math.PI*2); c.fill();

      c.beginPath(); c.arc(x, y-8-bob, 2, 0.2*Math.PI, 0.8*Math.PI); c.stroke();
    } else if(id === "pet_hoshi"){

      const g = c.createRadialGradient(x, fy, 1, x, fy, 15);

      c.beginPath(); c.arc(x, fy, 15, 0, Math.PI*2); c.fill();

      c.beginPath(); c.arc(x-1.8, fy-0.4, 0.8, 0, Math.PI*2); c.fill();
      c.beginPath(); c.arc(x+1.8, fy-0.4, 0.8, 0, Math.PI*2); c.fill();
      c.globalAlpha = 0.6 + Math.sin(t*5)*0.3;
      c.fillStyle = "#fff";
      c.beginPath(); c.arc(x+8, fy-8, 1.4, 0, Math.PI*2); c.fill();
      c.beginPath(); c.arc(x-9, fy+4, 1.1, 0, Math.PI*2); c.fill();
      c.globalAlpha = 1;

  /* ---- どうぶつ ---- */
  const ANIMAL_COLORS = {
    neko:{ body:"#f2b56b", inner:"#fbe0bb", ear:"#ff9ec4" },
    usagi:{ body:"#fbfbfb", inner:"#ffe4ee", ear:"#ff9ec4" },
    kuma:{ body:"#b08154", inner:"#e3c39a", ear:"#8a5f3a" },
    kitsune:{ body:"#f2934b", inner:"#fde6cf", ear:"#d1732c" },
    panda:{ body:"#fbfbfb", inner:"#f0f0f0", ear:"#3a3a3a" },
  };
  function drawAnimal(id, x, y, t, moving){
    const C = ANIMAL_COLORS[id];
    const bob = moving ? Math.sin(t*11)*1.8 : Math.sin(t*2 + x)*0.8;
    shadow(x, y+2, 13);
    const by = y + bob;
    /* からだ */
    ctx.fillStyle = C.body;
    ctx.beginPath(); ctx.ellipse(x, by-12, 11, 9, 0, 0, Math.PI*2); ctx.fill();
    if(id === "panda"){
      ctx.fillStyle = "#3a3a3a";
      ctx.beginPath(); ctx.ellipse(x-8, by-8, 3.4, 4.5, 0.3, 0, Math.PI*2); ctx.fill();
      ctx.beginPath(); ctx.ellipse(x+8, by-8, 3.4, 4.5, -0.3, 0, Math.PI*2); ctx.fill();
    }
    const hy = by - 27;
    /* みみ */
    if(id === "usagi"){
      ctx.fillStyle = C.body;
      ctx.beginPath(); ctx.ellipse(x-5, hy-11, 3.4, 9, 0.1, 0, Math.PI*2); ctx.fill();
      ctx.beginPath(); ctx.ellipse(x+5, hy-11, 3.4, 9, -0.1, 0, Math.PI*2); ctx.fill();
      ctx.fillStyle = C.ear;
      ctx.beginPath(); ctx.ellipse(x-5, hy-10, 1.7, 6, 0.1, 0, Math.PI*2); ctx.fill();
      ctx.beginPath(); ctx.ellipse(x+5, hy-10, 1.7, 6, -0.1, 0, Math.PI*2); ctx.fill();
    } else if(id === "kuma" || id === "panda"){
      ctx.fillStyle = (id === "panda") ? "#3a3a3a" : C.body;
      ctx.beginPath(); ctx.arc(x-7.5, hy-7, 4.5, 0, Math.PI*2); ctx.fill();
      ctx.beginPath(); ctx.arc(x+7.5, hy-7, 4.5, 0, Math.PI*2); ctx.fill();
    } else {
      ctx.fillStyle = C.body;
      ctx.beginPath(); ctx.moveTo(x-10, hy-2); ctx.lineTo(x-8, hy-12); ctx.lineTo(x-2, hy-6); ctx.closePath(); ctx.fill();
      ctx.beginPath(); ctx.moveTo(x+10, hy-2); ctx.lineTo(x+8, hy-12); ctx.lineTo(x+2, hy-6); ctx.closePath(); ctx.fill();
      ctx.fillStyle = C.ear;
      ctx.beginPath(); ctx.moveTo(x-8.4, hy-3.4); ctx.lineTo(x-7.4, hy-9); ctx.lineTo(x-3.6, hy-5.4); ctx.closePath(); ctx.fill();
      ctx.beginPath(); ctx.moveTo(x+8.4, hy-3.4); ctx.lineTo(x+7.4, hy-9); ctx.lineTo(x+3.6, hy-5.4); ctx.closePath(); ctx.fill();
    }
    /* あたま */
    ctx.fillStyle = C.body;
    ctx.beginPath(); ctx.arc(x, hy, 10, 0, Math.PI*2); ctx.fill();
    if(id === "panda"){
      ctx.fillStyle = "#3a3a3a";
      ctx.beginPath(); ctx.ellipse(x-4, hy-1, 2.9, 3.4, 0, 0, Math.PI*2); ctx.fill();
      ctx.beginPath(); ctx.ellipse(x+4, hy-1, 2.9, 3.4, 0, 0, Math.PI*2); ctx.fill();
    }
    ctx.fillStyle = C.inner;
    ctx.beginPath(); ctx.ellipse(x, hy+4, 5, 3.8, 0, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = "#2a2440";
    ctx.beginPath(); ctx.arc(x-3.6, hy-1, 1.3, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(x+3.6, hy-1, 1.3, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = "#ff7eb3";
    ctx.beginPath(); ctx.moveTo(x-1.4, hy+2.4); ctx.lineTo(x+1.4, hy+2.4); ctx.lineTo(x, hy+4.2); ctx.closePath(); ctx.fill();
  }

  /* ---- 料理ミニアイコン（吹き出し用） ---- */
  function drawDishIcon(id, x, y, s){
    ctx.save();
    ctx.translate(x, y); ctx.scale(s/22, s/22);
    if(id === "salad"){
      ctx.fillStyle = "#f7e9cf"; ctx.beginPath(); ctx.ellipse(0, 4, 11, 5, 0, 0, Math.PI*2); ctx.fill();

      ctx.fillStyle = "#ff8a3c"; ctx.beginPath(); ctx.arc(4, -1.4, 2.4, 0, Math.PI*2); ctx.fill();
    } else if(id === "soup"){
      ctx.fillStyle = "#ff9e5e"; ctx.beginPath(); ctx.arc(0, 1, 9, 0, Math.PI, false); ctx.closePath(); ctx.fill();
      ctx.fillStyle = "#ffbe8a"; ctx.beginPath(); ctx.ellipse(0, 1, 9, 2.8, 0, 0, Math.PI*2); ctx.fill();
      ctx.strokeStyle = "#cfd8dc"; ctx.lineWidth = 1.6; ctx.lineCap = "round";
      ctx.beginPath(); ctx.moveTo(-3, -3); ctx.quadraticCurveTo(-2, -6, -3, -8); ctx.stroke();

  function drawCropWorld(cropId, ratio, x, y, t){
    const bounce = (ratio >= 1) ? Math.abs(Math.sin(t*4))*4 : 0;
    const yy = y - bounce;
    if(ratio < 0.5){
      /* め */
      ctx.strokeStyle = "#5a9e3d"; ctx.lineWidth = 3.5; ctx.lineCap = "round";
      ctx.beginPath(); ctx.moveTo(x, yy+8); ctx.lineTo(x, yy-4); ctx.stroke();

      ctx.beginPath(); ctx.ellipse(x-5, yy-7, 5.5, 3.4, -0.6, 0, Math.PI*2); ctx.fill();
      ctx.fillStyle = "#8fd06e";
      ctx.beginPath(); ctx.ellipse(x+5, yy-7, 5.5, 3.4, 0.6, 0, Math.PI*2); ctx.fill();
      return;
    }
    if(ratio < 1){
      /* なえ */
      ctx.strokeStyle = "#4e8f33"; ctx.lineWidth = 4; ctx.lineCap = "round";
      ctx.beginPath(); ctx.moveTo(x, yy+10); ctx.lineTo(x, yy-12); ctx.stroke();
      ctx.fillStyle = "#6fb54e";
      ctx.beginPath(); ctx.ellipse(x-8, yy-10, 8, 4.6, -0.5, 0, Math.PI*2); ctx.fill();
      ctx.beginPath(); ctx.ellipse(x+8, yy-10, 8, 4.6, 0.5, 0, Math.PI*2); ctx.fill();
      ctx.fillStyle = "#82c661";
      ctx.beginPath(); ctx.ellipse(x-6, yy-1, 6.5, 3.8, -0.5, 0, Math.PI*2); ctx.fill();
      ctx.beginPath(); ctx.ellipse(x+6, yy-1, 6.5, 3.8, 0.5, 0, Math.PI*2); ctx.fill();
      return;
    }
    /* かんせい */
    if(cropId === "ninjin"){
      ctx.fillStyle = "#5a9e3d";
      ctx.beginPath(); ctx.ellipse(x-7, yy-16, 8, 4.4, -0.6, 0, Math.PI*2); ctx.fill();
      ctx.fillStyle = "#6fb54e";
      ctx.beginPath(); ctx.ellipse(x+7, yy-16, 8, 4.4, 0.6, 0, Math.PI*2); ctx.fill();
      ctx.fillStyle = "#82c661";
      ctx.beginPath(); ctx.ellipse(x, yy-20, 4.4, 7, 0, 0, Math.PI*2); ctx.fill();
      ctx.fillStyle = "#ff8a3c";
      ctx.beginPath();
      ctx.moveTo(x-8, yy-11); ctx.quadraticCurveTo(x, yy-15, x+8, yy-11);
      ctx.lineTo(x+2, yy+12); ctx.quadraticCurveTo(x, yy+15, x-2, yy+12);
      ctx.closePath(); ctx.fill();
      ctx.strokeStyle = "#e06a1e"; ctx.lineWidth = 1.6; ctx.lineCap = "round";
      ctx.beginPath(); ctx.moveTo(x-4, yy-4); ctx.lineTo(x+4, yy-5.4); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(x-3.4, yy+2); ctx.lineTo(x+3.4, yy+0.6); ctx.stroke();
    } else if(cropId === "tomato"){
      ctx.fillStyle = "#5a9e3d";
      ctx.beginPath(); ctx.ellipse(x, yy-8, 15, 11, 0, 0, Math.PI*2); ctx.fill();
      [[x-8,yy-2],[x+8,yy-3],[x,yy+5]].forEach(p => {
        ctx.fillStyle = "#ef5350";
        ctx.beginPath(); ctx.arc(p[0], p[1], 6.5, 0, Math.PI*2); ctx.fill();
        ctx.fillStyle = "rgba(255,255,255,.45)";
        ctx.beginPath(); ctx.arc(p[0]-2, p[1]-2, 2, 0, Math.PI*2); ctx.fill();
      });
    } else if(cropId === "ichigo"){
      ctx.fillStyle = "#5a9e3d";
      ctx.beginPath(); ctx.ellipse(x, yy-6, 15, 9.5, 0, 0, Math.PI*2); ctx.fill();
      [[x-8,yy+2],[x+8,yy+1],[x,yy+7]].forEach(p => {
        ctx.fillStyle = "#f75d7f";
        ctx.beginPath();
        ctx.moveTo(p[0]-4.5, p[1]-3);
        ctx.quadraticCurveTo(p[0], p[1]-5.4, p[0]+4.5, p[1]-3);
        ctx.quadraticCurveTo(p[0]+4.5, p[1]+3, p[0], p[1]+6);
        ctx.quadraticCurveTo(p[0]-4.5, p[1]+3, p[0]-4.5, p[1]-3);
        ctx.closePath(); ctx.fill();
        ctx.fillStyle = "#ffe082";
        ctx.beginPath(); ctx.arc(p[0]-1.4, p[1], 0.7, 0, Math.PI*2); ctx.fill();
        ctx.beginPath(); ctx.arc(p[0]+1.6, p[1]+1.4, 0.7, 0, Math.PI*2); ctx.fill();
      });
    } else if(cropId === "corn"){
      ctx.strokeStyle = "#4e8f33"; ctx.lineWidth = 4.5; ctx.lineCap = "round";
      ctx.beginPath(); ctx.moveTo(x, yy+12); ctx.lineTo(x, yy-24); ctx.stroke();
      ctx.fillStyle = "#6fb54e";
      ctx.beginPath(); ctx.ellipse(x-9, yy-4, 10, 4.6, -0.65, 0, Math.PI*2); ctx.fill();
      ctx.beginPath(); ctx.ellipse(x+9, yy-12, 10, 4.6, 0.65, 0, Math.PI*2); ctx.fill();
      ctx.fillStyle = "#ffd24d";
      ctx.beginPath(); ctx.ellipse(x+7, yy-22, 6, 11, 0.35, 0, Math.PI*2); ctx.fill();
      ctx.fillStyle = "#e8ae1f";
      ctx.beginPath(); ctx.arc(x+5.4, yy-26, 1.3, 0, Math.PI*2); ctx.fill();
      ctx.beginPath(); ctx.arc(x+8.4, yy-22, 1.3, 0, Math.PI*2); ctx.fill();
      ctx.beginPath(); ctx.arc(x+6.4, yy-18, 1.3, 0, Math.PI*2); ctx.fill();
    } else if(cropId === "komugi"){
      ctx.strokeStyle = "#d9a53c"; ctx.lineWidth = 3; ctx.lineCap = "round";
      for(let i=-1; i<=1; i++){
        ctx.beginPath(); ctx.moveTo(x + i*9, yy+12); ctx.lineTo(x + i*11, yy-14); ctx.stroke();
        ctx.fillStyle = "#ffd77a";
        ctx.beginPath(); ctx.ellipse(x + i*11, yy-19, 4.4, 8, i*0.15, 0, Math.PI*2); ctx.fill();

    }
    /* しゅうかくマーク */
    ctx.fillStyle = "#ffd24d";
    ctx.strokeStyle = "#c79400"; ctx.lineWidth = 1.4;
    ctx.beginPath(); ctx.arc(x+30, yy-30, 9, 0, Math.PI*2); ctx.fill(); ctx.stroke();
    ctx.fillStyle = "#6b4d00";
    rr(x+28.6, yy-36, 2.8, 7.5, 1.4); ctx.fill();

  /* ================= 村シーン描画 ================= */
  let scene = "village"; /* village | kitchen */
  function drawGround(){
    /* しばふ */
    ctx.fillStyle = "#8fce6e";
    ctx.fillRect(-cam.x, -cam.y, WORLD.w, WORLD.h);
    /* しばのもよう */
    ctx.fillStyle = "rgba(255,255,255,.08)";
    for(let gy=40; gy<WORLD.h; gy+=110){
      for(let gx=(gy/110)%2 ? 40 : 95; gx<WORLD.w; gx+=110){
        ctx.beginPath(); ctx.ellipse(gx-cam.x, gy-cam.y, 22, 9, 0, 0, Math.PI*2); ctx.fill();
      }
    }
    /* こみち */
    ctx.strokeStyle = "#e8d9b8"; ctx.lineWidth = 46; ctx.lineCap = "round"; ctx.lineJoin = "round";
    ctx.beginPath();
    ctx.moveTo(POS.kitchenDoor.x-cam.x, (POS.kitchenDoor.y+6)-cam.y);
    ctx.lineTo(POS.fountain.x-cam.x, (POS.fountain.y+40)-cam.y);
    ctx.lineTo(330-cam.x, 700-cam.y);
    ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(POS.fountain.x-cam.x, (POS.fountain.y+40)-cam.y);
    ctx.lineTo(600-cam.x, 560-cam.y);
    ctx.stroke();
    ctx.strokeStyle = "rgba(180,150,100,.35)"; ctx.lineWidth = 2;
    /* いしのてん */
    ctx.fillStyle = "rgba(180,150,100,.4)";
    [[380,340],[400,410],[360,450],[420,510],[350,560],[460,540],[520,555]].forEach(p => {
      ctx.beginPath(); ctx.ellipse(p[0]-cam.x, p[1]-cam.y, 5, 3, 0, 0, Math.PI*2); ctx.fill();
    });
    /* はたけの土 */
    POS.plots.forEach((p, i) => {
      drawPlotGround(p.x-cam.x, p.y-cam.y, i >= maxPlots());
    });
    /* ほりあと（宝） */
    if(S.treasureReady){
      drawDigSpot(POS.dig.x-cam.x, POS.dig.y-cam.y, tGlobal);
    }
  }
  let tGlobal = 0;
  function drawVillage(){
    drawGround();
    /* 深度ソート描画物 */
    const ents = [];
    ents.push({ y:POS.kitchen.y+55, d:() => drawKitchenBuilding(POS.kitchen.x-cam.x, POS.kitchen.y-cam.y, tGlobal) });
    if(hasKoya()) ents.push({ y:POS.coop.y+28, d:() => drawCoop(POS.coop.x-cam.x, POS.coop.y-cam.y, tGlobal, pendingEggs()) });
    if(hasWell()) ents.push({ y:POS.well.y+8, d:() => drawWell(POS.well.x-cam.x, POS.well.y-cam.y, tGlobal) });
    ents.push({ y:POS.boutique.y+39, d:() => drawBoutique(POS.boutique.x-cam.x, POS.boutique.y-cam.y, tGlobal) });
    POS.trees.forEach(tr => ents.push({ y:tr.y, d:() => drawTree(tr.x-cam.x, tr.y-cam.y) }));
    POS.bushes.forEach(b => ents.push({ y:b.y, d:() => drawBush(b.x-cam.x, b.y-cam.y) }));
    /* じゅうにんのいえ */
    const residents = Object.keys(S.friends).filter(a => S.friends[a] >= 5);
    residents.forEach((a, i) => {
      if(i >= POS.houses.length) return;
      const h = POS.houses[i];
      ents.push({ y:h.y+31, d:() => drawHouse(h.x-cam.x, h.y-cam.y, i) });
    });
    /* かざり */
    if(S.decos.indexOf("hata") >= 0) ents.push({ y:POS.flag.y, d:() => drawFlag(POS.flag.x-cam.x, POS.flag.y-cam.y, tGlobal) });
    if(S.decos.indexOf("funsui") >= 0) ents.push({ y:POS.fountain.y+8, d:() => drawFountain(POS.fountain.x-cam.x, POS.fountain.y-cam.y, tGlobal) });
    if(S.decos.indexOf("hoshi") >= 0) ents.push({ y:POS.star.y, d:() => drawStarStatue(POS.star.x-cam.x, POS.star.y-cam.y) });
    /* さくもつ */
    S.plots.forEach((p, i) => {
      if(!p || i >= maxPlots()) return;
      const pos = POS.plots[i];
      ents.push({ y:pos.y, d:() => {
        const r = cropRatio(p);
        drawCropWorld(p.crop, r, pos.x-cam.x, pos.y-cam.y, tGlobal);
        if(r < 1) drawProgressBar(pos.x-cam.x, (pos.y+40)-cam.y, r);
      }});
    });
    /* どうぶつ */
    npcs.forEach(n => {
      ents.push({ y:n.y, d:() => drawAnimal(n.id, n.x-cam.x, n.y-cam.y, tGlobal + n.x*0.01, n.moving) });
    });
    /* 主人公 */
    ents.push({ y:player.y, d:() => drawPlayer(player.x-cam.x, player.y-cam.y, tGlobal, player.moving, S.gender || "prince") });
    /* おとも */
    if(S.wardrobe.pet !== "pet_none"){
      ents.push({ y:pet.y, d:() => drawPet(ctx, S.wardrobe.pet, pet.x-cam.x, pet.y-cam.y, tGlobal) });
    }
    ents.sort((a,b) => a.y - b.y);
    /* キラキラの あと（キャラのうしろ） */
    const fx = S.wardrobe.fx;
    if(fx !== "fx_none"){
      for(let i = trail.length - 1; i >= 0; i--){
        const tp = trail[i];
        const age = tGlobal - tp.t0;
        if(age > 0.85){ trail.splice(i, 1); continue; }
        const a = 1 - age / 0.85;
        const px = tp.x - cam.x, py = tp.y - cam.y - age * 22;
        ctx.globalAlpha = a;
        if(fx === "fx_kira") diamond(px, py, 6, tp.ci % 2 ? "#ffd24d" : "#fff");
        else if(fx === "fx_heart") heartc(ctx, px, py, 4.4, "#ff9ecb");
        else if(fx === "fx_star") star5(px, py, 5.5, "#ffd24d");
        else if(fx === "fx_niji"){
          ctx.fillStyle = TRAIL_COLORS_NIJI[tp.ci];
          ctx.beginPath(); ctx.arc(px, py, 4.4, 0, Math.PI*2); ctx.fill();
        }
        ctx.globalAlpha = 1;
      }
    }
    ents.forEach(e => e.d());
    /* オーバーレイ：吹き出し */
    npcs.forEach(n => {
      const o = orderForAnimal(n.id);
      if(o) drawBubble(n.x-cam.x, (n.y-46)-cam.y, o.dish, tGlobal + n.x*0.02);
    });
  }

  /* ================= キッチンシーン描画 ================= */
  function drawKitchen(){
    /* かべ・ゆか */
    const fy = ch * 0.46;
    ctx.fillStyle = "#f5e2c8"; ctx.fillRect(0, 0, cw, fy);
    ctx.fillStyle = "#e6c391"; ctx.fillRect(0, fy, cw, ch-fy);

    for(let x=0; x<cw+80; x+=64){

    }
    ctx.fillStyle = "#d9b06a"; ctx.fillRect(0, fy-8, cw, 8);
    const cx = cw/2;
    /* まど */
    ctx.fillStyle = "#bfe9ff"; ctx.strokeStyle = "#b98a4e"; ctx.lineWidth = 5;

    ctx.strokeStyle = "#fff"; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.moveTo(cx-90, 66); ctx.lineTo(cx-90, 140); ctx.stroke();
    ctx.fillStyle = "#fff";
    ctx.beginPath(); ctx.ellipse(cx-115, 92, 12, 6, 0, 0, Math.PI*2); ctx.fill();
    /* たな */
    ctx.fillStyle = "#b98a4e"; rr(cx+50, 70, 130, 10, 4); ctx.fill();
    const jars = ["#ff9ecb","#8fd06e","#ffd24d","#7fa8ff"];
    jars.forEach((c, i) => {
      ctx.fillStyle = c;
      rr(cx+60 + i*30, 46, 20, 24, 5); ctx.fill();
      ctx.fillStyle = "#8a5a30";
      rr(cx+63 + i*30, 42, 14, 6, 2); ctx.fill();
    });
    /* かまど・コンロ */
    const sy = fy + 30;
    ctx.fillStyle = "#c9614a"; rr(cx+40, sy-46, 130, 78, 8); ctx.fill();
    ctx.fillStyle = "#8a5a30"; rr(cx+40, sy-52, 130, 10, 4); ctx.fill();
    ctx.fillStyle = "#2f2f3f"; ctx.beginPath(); ctx.ellipse(cx+105, sy-46, 42, 10, 0, 0, Math.PI*2); ctx.fill();
    /* おなべ */
    ctx.fillStyle = "#5c7a99";
    ctx.beginPath(); ctx.ellipse(cx+105, sy-58, 32, 14, 0, 0, Math.PI); ctx.fill();
    ctx.fillRect(cx+73, sy-70, 64, 12);
    ctx.fillStyle = "#4a6480"; ctx.beginPath(); ctx.ellipse(cx+105, sy-70, 32, 9, 0, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = "#ff9e5e"; ctx.beginPath(); ctx.ellipse(cx+105, sy-70, 26, 6.5, 0, 0, Math.PI*2); ctx.fill();
    /* ゆげ */
    for(let i=0; i<3; i++){
      const ph = (tGlobal*0.6 + i/3) % 1;
      ctx.fillStyle = "rgba(255,255,255," + (0.65*(1-ph)) + ")";
      ctx.beginPath(); ctx.arc(cx+90 + i*16 + Math.sin(ph*5+i)*5, sy-84 - ph*46, 6 + ph*7, 0, Math.PI*2); ctx.fill();
    }
    /* かまどのひ（Lv4+） */
    if(hasKamado()){
      const fl = Math.sin(tGlobal*8)*3;
      ctx.fillStyle = "#ff7043";
      ctx.beginPath();
      ctx.moveTo(cx+90, sy+16); ctx.quadraticCurveTo(cx+96, sy-4-fl, cx+105, sy+2);
      ctx.quadraticCurveTo(cx+114, sy-6+fl, cx+120, sy+16);
      ctx.closePath(); ctx.fill();
      ctx.fillStyle = "#ffd24d";
      ctx.beginPath();
      ctx.moveTo(cx+98, sy+16); ctx.quadraticCurveTo(cx+105, sy+2-fl*0.5, cx+112, sy+16);
      ctx.closePath(); ctx.fill();
    }
    /* カウンターとしょくざい */
    ctx.fillStyle = "#b98a4e"; rr(cx-190, sy-34, 160, 66, 8); ctx.fill();
    ctx.fillStyle = "#d9b06a"; rr(cx-190, sy-42, 160, 12, 5); ctx.fill();
    /* まないた+にんじん */
    ctx.fillStyle = "#f0d9a8"; rr(cx-170, sy-52, 56, 12, 4); ctx.fill();
    ctx.fillStyle = "#ff8a3c";
    ctx.beginPath(); ctx.ellipse(cx-142, sy-52, 14, 4.6, 0, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = "#6fb54e";
    ctx.beginPath(); ctx.ellipse(cx-128, sy-54, 5, 2.6, 0.5, 0, Math.PI*2); ctx.fill();
    /* ボウル */
    ctx.fillStyle = "#ff9ecb";
    ctx.beginPath(); ctx.arc(cx-80, sy-46, 13, 0, Math.PI); ctx.closePath(); ctx.fill();
    ctx.fillStyle = "#ffc7e0"; ctx.beginPath(); ctx.ellipse(cx-80, sy-46, 13, 4, 0, 0, Math.PI*2); ctx.fill();
    /* 主人公 */
    drawPlayer(cx-110, sy+66, tGlobal, false, S.gender || "prince");
    if(S.wardrobe.pet !== "pet_none") drawPet(ctx, S.wardrobe.pet, cx-158, sy+72, tGlobal);

    /* ---- 料理かんせいアニメーション ---- */
    if(kAnim){
      const ph = Math.min(1, (performance.now() - kAnim.t0) / KANIM_DUR);
      const potX = cx+105, potY = sy-70;
      /* A: しょくざいが なべへ とびこむ (0〜0.38) */
      kAnim.ings.forEach((k, i) => {
        const delay = i * 0.07;
        const p = Math.min(1, Math.max(0, (ph - delay) / 0.3));
        if(p <= 0 || p >= 1) return;
        const sx0 = cx-142, sy0 = sy-52;
        const ix = sx0 + (potX - sx0) * p;
        const iy = sy0 + (potY - 20 - sy0) * p - Math.sin(p * Math.PI) * 90;
        ctx.fillStyle = ING_COLORS[k] || "#8fd06e";
        ctx.beginPath(); ctx.arc(ix, iy, 9, 0, Math.PI*2); ctx.fill();
        ctx.fillStyle = "rgba(255,255,255,.55)";
        ctx.beginPath(); ctx.arc(ix-3, iy-3, 3, 0, Math.PI*2); ctx.fill();
      });
      /* B: ぐつぐつ + キラキラ (0.3〜0.72) */
      if(ph > 0.3 && ph < 0.75){
        const bp = (ph - 0.3) / 0.45;
        /* おおきな ゆげ */
        for(let i=0; i<5; i++){
          const pp = (bp * 2 + i * 0.2) % 1;
          ctx.fillStyle = "rgba(255,255,255," + (0.8 * (1 - pp)) + ")";
          ctx.beginPath();
          ctx.arc(potX - 24 + i*12 + Math.sin(pp*6 + i)*7, potY - 16 - pp*70, 8 + pp*12, 0, Math.PI*2);
          ctx.fill();
        }
        /* なべから はねる しずく */
        for(let i=0; i<4; i++){
          const pp = (bp * 3 + i * 0.25) % 1;
          const ang = -Math.PI/2 + (i - 1.5) * 0.5;
          const jx = potX + Math.cos(ang) * pp * 46;
          const jy = potY - 8 + Math.sin(ang) * pp * 46 + pp * pp * 30;
          ctx.fillStyle = "rgba(255,190,138," + (1 - pp) + ")";
          ctx.beginPath(); ctx.arc(jx, jy, 4, 0, Math.PI*2); ctx.fill();
        }
        /* キラキラ */
        for(let i=0; i<6; i++){
          const pp = (bp * 2 + i / 6) % 1;
          const ang = i * 1.05 + bp * 3;
          ctx.globalAlpha = 1 - pp;
          diamond(potX + Math.cos(ang) * (30 + pp*36), potY - 20 - pp*40 + Math.sin(ang*2)*8, 6, i%2 ? "#ffd24d" : "#fff");
          ctx.globalAlpha = 1;
        }
        /* なべの ゆれ */
        const shake = Math.sin(bp * 40) * 2.5 * (1 - bp);
        ctx.fillStyle = "#ff9e5e";
        ctx.beginPath(); ctx.ellipse(potX + shake, potY, 26, 6.5, 0, 0, Math.PI*2); ctx.fill();
      }
      /* C: りょうり とうじょう (0.7〜1) */
      if(ph > 0.7){
        const cp = (ph - 0.7) / 0.3;
        const ease = 1 - Math.pow(1 - cp, 3);
        const dy = potY - 26 - ease * 74;
        /* ひかりの わ */
        const glowR = 34 + Math.sin(tGlobal*6) * 4;
        const grad = ctx.createRadialGradient(potX, dy, 4, potX, dy, glowR + 18);
        grad.addColorStop(0, "rgba(255,240,180,.9)");
        grad.addColorStop(1, "rgba(255,240,180,0)");
        ctx.fillStyle = grad;
        ctx.beginPath(); ctx.arc(potX, dy, glowR + 18, 0, Math.PI*2); ctx.fill();
        /* ひかりの すじ */
        ctx.strokeStyle = "rgba(255,220,120,.7)"; ctx.lineWidth = 3; ctx.lineCap = "round";
        for(let i=0; i<8; i++){
          const ang = i * Math.PI/4 + tGlobal * 1.2;
          ctx.beginPath();
          ctx.moveTo(potX + Math.cos(ang) * (glowR - 4), dy + Math.sin(ang) * (glowR - 4));
          ctx.lineTo(potX + Math.cos(ang) * (glowR + 10), dy + Math.sin(ang) * (glowR + 10));
          ctx.stroke();
        }
        /* りょうり ほんたい（おおきく） */
        drawDishIcon(kAnim.recipeId, potX, dy, 52);
        /* ほし ポップ */
        for(let i=0; i<kAnim.stars; i++){
          const st = 0.35 + i * 0.2;
          if(cp < st) continue;
          const sp = Math.min(1, (cp - st) / 0.15);
          const pop = sp < 0.6 ? sp / 0.6 * 1.25 : 1.25 - (sp - 0.6) / 0.4 * 0.25;
          const sxp = potX + (i - (kAnim.stars-1)/2) * 34;
          star5(sxp, dy - 48, 11 * pop, "#ffd24d", "#c79400");
        }
      }
    }
  }

  /* ================= メインループ ================= */
  let lastT = performance.now();
  function loop(now){
    const dt = Math.min(0.05, (now - lastT)/1000);
    lastT = now;
    tGlobal = now / 1000;
    if(scene === "village"){
      const iv = modalOpen() ? null : inputVector();
      if(iv){
        player.moving = true;
        player.x = Math.max(40, Math.min(WORLD.w-40, player.x + iv.x * player.speed * dt));
        player.y = Math.max(120, Math.min(WORLD.h-30, player.y + iv.y * player.speed * dt));
      } else {
        player.moving = false;
      }
      /* おとも：主人公をゆっくり追いかける */
      if(S.wardrobe.pet !== "pet_none"){
        const gx = player.x - 30, gy = player.y + 8;
        pet.x += (gx - pet.x) * Math.min(1, dt * 4.2);
        pet.y += (gy - pet.y) * Math.min(1, dt * 4.2);
      }
      /* キラキラの あと */
      if(S.wardrobe.fx !== "fx_none" && player.moving){
        trailTimer -= dt;
        if(trailTimer <= 0){
          trailTimer = 0.1;
          trail.push({
            x: player.x + (Math.random()-0.5)*16,
            y: player.y + Math.random()*4,
            t0: tGlobal,
            ci: Math.floor(Math.random()*5),
          });
          if(trail.length > 22) trail.shift();
        }
      }
      npcs.forEach(n => {
        if(n.wait > 0){ n.wait -= dt; n.moving = false; }
        else {
          const done = moveTowards(n, 42, dt);
          if(done){ n.wait = 1.5 + Math.random()*3.5; npcWanderTarget(n); }
        }
        /* ふきだし（ちゅうもん）ありは 接触で自動的に会話 */
        const d = Math.hypot(player.x - n.x, player.y - n.y);
        if(d < 42){
          if(!n.contact){
            n.contact = true;
            if(orderForAnimal(n.id) && !modalOpen()){
              sfx.good();
              openAnimalModal(n.id);
            }
          }
        } else if(d > 58){
          n.contact = false;
        }
      });
      updateCamera();
      ctx.clearRect(0, 0, cw, ch);
      drawVillage();
      drawStick();
      updateActionButton();
    } else {
      ctx.clearRect(0, 0, cw, ch);
      drawKitchen();
    }
    requestAnimationFrame(loop);
  }

  /* ================= 操作：バーチャルスティック ================= */
  function modalOpen(){ return $("modalRoot").children.length > 0; }
  canvas.addEventListener("pointerdown", (e) => {
    ensureAudio();
    if(modalOpen()) return;
    if(scene !== "village") return;
    e.preventDefault();
    if(stick.active) return; /* 1本目の指のみ */
    const rect = canvas.getBoundingClientRect();
    stick.active = true;
    stick.id = e.pointerId;
    stick.ox = e.clientX - rect.left;
    stick.oy = e.clientY - rect.top;
    stick.dx = 0; stick.dy = 0;
    try{ canvas.setPointerCapture(e.pointerId); }catch(err){}
  });
  canvas.addEventListener("pointermove", (e) => {
    if(!stick.active || e.pointerId !== stick.id) return;
    e.preventDefault();
    const rect = canvas.getBoundingClientRect();
    let dx = (e.clientX - rect.left) - stick.ox;
    let dy = (e.clientY - rect.top) - stick.oy;
    const d = Math.hypot(dx, dy);
    if(d > STICK_R){
      /* スティックが指についてくる（フローティング） */
      const over = d - STICK_R;
      stick.ox += dx/d * over;
      stick.oy += dy/d * over;
      dx = dx/d * STICK_R;
      dy = dy/d * STICK_R;
    }
    stick.dx = dx; stick.dy = dy;
  });
  function stickEnd(e){
    if(!stick.active || e.pointerId !== stick.id) return;
    stick.active = false;
    stick.id = null;
    stick.dx = 0; stick.dy = 0;
  }
  canvas.addEventListener("pointerup", stickEnd);
  canvas.addEventListener("pointercancel", stickEnd);
  function drawStick(){
    if(!stick.active) return;
    const d = Math.hypot(stick.dx, stick.dy);
    /* だい */
    ctx.fillStyle = "rgba(255,255,255,.28)";
    ctx.beginPath(); ctx.arc(stick.ox, stick.oy, STICK_R, 0, Math.PI*2); ctx.fill();
    ctx.strokeStyle = "rgba(255,255,255,.65)"; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.arc(stick.ox, stick.oy, STICK_R, 0, Math.PI*2); ctx.stroke();
    /* つまみ */
    const kx = stick.ox + stick.dx, ky = stick.oy + stick.dy;
    ctx.fillStyle = "rgba(255,255,255,.85)";
    ctx.beginPath(); ctx.arc(kx, ky, 24, 0, Math.PI*2); ctx.fill();
    ctx.strokeStyle = "rgba(67,122,43,.5)"; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.arc(kx, ky, 24, 0, Math.PI*2); ctx.stroke();
    if(d > STICK_DEAD){
      ctx.fillStyle = "rgba(67,122,43,.55)";
      const ax = stick.ox + stick.dx/d * (STICK_R+14);
      const ay = stick.oy + stick.dy/d * (STICK_R+14);
      ctx.save();
      ctx.translate(ax, ay);
      ctx.rotate(Math.atan2(stick.dy, stick.dx));
      ctx.beginPath(); ctx.moveTo(8, 0); ctx.lineTo(-5, -7); ctx.lineTo(-5, 7); ctx.closePath(); ctx.fill();
      ctx.restore();
    }
  }

  /* ================= 近接アクション ================= */
  let currentAction = null;
  let currentLabel = "";
  function nearestAction(){
    let best = null, bd = 1e9;
    function cand(x, y, r, label, fn){
      const d = Math.hypot(player.x - x, player.y - y);
      if(d < r && d < bd){ bd = d; best = { label, fn }; }
    }
    /* キッチンのドア */
    cand(POS.kitchenDoor.x, POS.kitchenDoor.y + 6, 64, "🍳 キッチンに はいる", enterKitchen);
    /* おようふくやさん */
    cand(POS.boutiqueDoor.x, POS.boutiqueDoor.y + 6, 62, "👗 おようふくやさんに はいる", openShop);
    /* はたけ */
    for(let i=0; i<POS.plots.length; i++){
      const pos = POS.plots[i];
      if(i >= maxPlots()) continue;
      const p = S.plots[i];
      let label;
      if(!p) label = "🌱 たねを まく";
      else if(cropRatio(p) >= 1) label = "🧺 " + CROPS[p.crop].name + "を しゅうかく！";
      else label = hasWell() ? "🔍 ようすを みる" : "💧 みずやり・ようすを みる";
      cand(pos.x, pos.y + 14, 76, label, ((idx) => () => openPlotModal(idx))(i));
    }
    /* どうぶつ */
    npcs.forEach(n => {
      const o = orderForAnimal(n.id);
      const label = o ? ("🚚 " + ANIMALS[n.id].name + "の ちゅうもんを きく") : ("💬 " + ANIMALS[n.id].name + "と はなす");
      cand(n.x, n.y - 10, 62, label, () => openAnimalModal(n.id));
    });
    /* にわとりごや */
    if(hasKoya()) cand(POS.coop.x, POS.coop.y + 30, 78, "🥚 たまごを あつめる", collectEggs);
    /* いど */
    if(hasWell()) cand(POS.well.x, POS.well.y + 8, 68, "⛲ みんなに みずを あげる", useWell);
    /* たから */
    if(S.treasureReady) cand(POS.dig.x, POS.dig.y, 62, "⛏️ ここを ほる！", digTreasure);
    return best;
  }
  function updateActionButton(){
    const btn = $("actionBtn");
    const best = modalOpen() ? null : nearestAction();
    if(!best){
      if(currentLabel !== ""){ currentLabel = ""; currentAction = null; btn.classList.remove("show"); }
      return;
    }
    currentAction = best.fn;
    if(best.label !== currentLabel){
      currentLabel = best.label;
      btn.textContent = best.label;
      btn.classList.add("show");
    }
  }

        const c = CROPS[id];

        const lockTxt = (id === "komugi") ? "たからもので かいほう" : ("むらLv." + c.lv + "で かいほう");
        return '<div class="seed-card' + (locked ? ' locked' : '') + '" data-crop="' + id + '">' +

          missionEvent("plant");

      });

    }

    if(r >= 1){

    Object.keys(r.need).forEach(k => { S.inv[k] -= r.need[k]; });
    save();
    mini = { recipeId, phase:"cut", hits:0, taps:0, pos:0, dir:1, raf:0, panPct:0, panRunning:false };
    const zoneW = hasKamado() ? 30 : 22;
    const zoneL = 50 - zoneW/2;
    showModal(
      '<h2>🔪 ざいりょうを きろう！</h2>' +
      '<div class="mini-stage">' +
      '<div class="mini-label">みどりの ところで タップ！（3かい）</div>' +

      '<button class="tap-btn" id="cutTap">トン！</button>' +
      '</div>', true
    );
    mini.zoneL = zoneL; mini.zoneW = zoneW;
    const marker = $("cutMarker");
    const speed = 1.35;
    function mloop(){
      if(!mini || mini.phase !== "cut") return;
      mini.pos += speed * mini.dir;
      if(mini.pos >= 96){ mini.pos = 96; mini.dir = -1; }
      if(mini.pos <= 0){ mini.pos = 0; mini.dir = 1; }
      marker.style.left = mini.pos + "%";
      mini.raf = requestAnimationFrame(mloop);
    }
    mini.raf = requestAnimationFrame(mloop);
    $("cutTap").addEventListener("click", () => {
      if(!mini || mini.phase !== "cut") return;
      mini.taps++;
      const center = mini.pos + 2;
      const inZone = center >= mini.zoneL && center <= mini.zoneL + mini.zoneW;
      if(inZone){ mini.hits++; sfx.good(); } else { sfx.bad(); }
      $("cutCount").textContent = "きった かず：" + mini.taps + " / 3" + (inZone ? "　✨じょうず！" : "　💦おしい！");
      if(mini.taps >= 3){
        cancelAnimationFrame(mini.raf);
        setTimeout(startPanPhase, 500);
      }
    });
  }
  function startPanPhase(){
    if(!mini) return;
    mini.phase = "pan";
    const zoneStart = hasKamado() ? 55 : 60;
    const zoneEnd = hasKamado() ? 90 : 86;
    mini.zoneStart = zoneStart; mini.zoneEnd = zoneEnd;
    showModal(
      '<h2>🔥 やこう！</h2>' +

    );
    mini.panPct = 0; mini.panRunning = true;

      if(!mini || mini.phase !== "pan" || !mini.panRunning) return;

      const inZone = mini.panPct >= mini.zoneStart && mini.panPct <= mini.zoneEnd;

        pc.globalAlpha = 0.9 - i*0.25;
        if(id === "fx_kira"){
          pc.beginPath(); pc.moveTo(pt[0], pt[1]-5); pc.lineTo(pt[0]+3.4, pt[1]); pc.lineTo(pt[0], pt[1]+5); pc.lineTo(pt[0]-3.4, pt[1]); pc.closePath();
          pc.fillStyle = i%2 ? "#ffd24d" : "#e8c86a"; pc.fill();
        } else if(id === "fx_heart") heartc(pc, pt[0], pt[1], 4, "#ff9ecb");
        else if(id === "fx_star") star5c(pc, pt[0], pt[1], 5, "#ffd24d");
        else { pc.fillStyle = TRAIL_COLORS_NIJI[i]; pc.beginPath(); pc.arc(pt[0], pt[1], 4, 0, Math.PI*2); pc.fill(); }
      });
      pc.globalAlpha = 1;
      return;
    }
    drawPlayerTo(pc, 38, 84, 0.6, false, S.gender || "prince", w);
  }
  function renderShop(){
    const slot = shopTab;
    const items = WSLOTS[slot].items;
    const cards = Object.keys(items).map(id => {
      const it = items[id];
      const owned = S.wardrobe.owned.indexOf(id) >= 0;
      const wearing = S.wardrobe[slot] === id;
      const cant = !owned && S.crowns < it.price;
      let priceHtml;
      if(wearing) priceHtml = '<div class="wprice" style="color:#437a2b;">いま これ！</div>';
      else if(owned) priceHtml = '<div class="wprice" style="color:#437a2b;">もっている</div>';
      else priceHtml = '<div class="wprice">👑 ' + it.price + '</div>';
      return '<div class="shop-card' + (wearing ? ' wearing' : '') + (cant ? ' cant' : '') + '" data-item="' + id + '">' +
        (wearing ? '<span class="wtag">いまこれ</span>' : '') +
        '<canvas class="wcv" width="152" height="184" data-item="' + id + '"></canvas>' +
        '<div class="wname">' + it.name + '</div>' + priceHtml + '</div>';
    }).join("");
    const tabs = Object.keys(WSLOTS).map(k =>
      '<button class="shop-tab' + (shopTab===k?" active":"") + '" data-slot="' + k + '">' + WSLOTS[k].icon + ' ' + WSLOTS[k].label + '</button>'
    ).join("");
    showModal(
      '<h2>👗 おようふくやさん</h2>' +
      '<p style="font-size:12px; font-weight:900; margin:0;">もっている クラウン：<span style="color:#c79400;">👑 ' + S.crowns + '</span></p>' +
      '<div class="shop-tabs">' + tabs + '</div>' +
      '<div class="shop-grid">' + cards + '</div>' +
      '<button class="sub-btn" data-close="1">おみせを でる</button>'
    );
    document.querySelectorAll(".shop-tab").forEach(tb => {
      tb.addEventListener("click", () => { shopTab = tb.getAttribute("data-slot"); sfx.tap(); renderShop(); });
    });
    document.querySelectorAll(".wcv").forEach(cv => {
      drawShopPreview(cv, slot, cv.getAttribute("data-item"));
    });
    document.querySelectorAll(".shop-card").forEach(card => {
      card.addEventListener("click", () => {
        tryWearOrBuy(slot, card.getAttribute("data-item"));
      });
    });
  }
  function tryWearOrBuy(slot, id){
    const it = WSLOTS[slot].items[id];
    const owned = S.wardrobe.owned.indexOf(id) >= 0;
    if(owned){
      S.wardrobe[slot] = id;
      sfx.good(); save();
      toast("✨ " + it.name + "に きがえた！");
      renderShop();
      return;
    }
    if(S.crowns < it.price){
      sfx.bad();
      toast("👑が たりないみたい…（あと " + (it.price - S.crowns) + "）");
      return;
    }
    /* こうにゅうかくにん */
    showModal(
      '<h2>👗 ' + it.name + '</h2>' +
      '<canvas id="buyPreview" width="180" height="220" style="width:90px; height:110px; display:block; margin:4px auto;"></canvas>' +
      '<p class="reward-line">👑 ' + it.price + 'で かう？</p>' +
      '<button class="big-btn" id="buyOk">かう！</button>' +
      '<button class="sub-btn" id="buyNo">やめておく</button>'
    );
    const pv = $("buyPreview");
    if(pv) drawShopPreview(pv, slot, id);
    $("buyOk").addEventListener("click", () => {
      if(S.crowns < it.price){ sfx.bad(); renderShop(); return; }
      S.crowns -= it.price;
      S.wardrobe.owned.push(id);
      S.wardrobe[slot] = id;
      save();
      sfx.crown();
      renderStatus();
      toast("🎀 " + it.name + "を かって みにつけた！");
      renderShop();
      missionEvent("buy");
    });
    $("buyNo").addEventListener("click", () => { sfx.tap(); renderShop(); });
  }

  /* ================= もちもの ================= */
  $("invBtn").addEventListener("click", () => {
    ensureAudio();
    const keys = ["ninjin","tomato","ichigo","corn","komugi","egg"];
    let itemsHtml = "";
    keys.forEach(k => {
      if(k === "komugi" && !S.komugiUnlocked && S.inv.komugi === 0) return;
      if(k === "egg" && !hasKoya() && S.inv.egg === 0) return;
      itemsHtml += '<div class="item">' + SPRITES[k] + '<div class="cnt">×' + S.inv[k] + '</div></div>';
    });
    let dishesHtml = "";
    S.dishes.forEach(d => {
      dishesHtml += '<div class="item">' + SPRITES[d.id] + '<div class="cnt" style="color:#c79400;">' + "★".repeat(d.stars) + '</div></div>';
    });
    let piecesHtml = "";
    for(let i=0; i<4; i++){
      piecesHtml += '<div class="map-piece">' + (i < S.mapPieces ? SPRITES.mapPiece : '<span style="font-size:16px; opacity:.4;">？</span>') + '</div>';
    }
    let friendsHtml = "";
    Object.keys(ANIMALS).forEach(a => {
      const h = S.friends[a] || 0;
      friendsHtml += '<div class="item"><div style="width:30px; height:30px; margin:0 auto;">' + animalSVG(a) + '</div><div class="cnt">' + (h>=5 ? "🏠" : ("❤️" + h)) + '</div></div>';
    });
    showModal(
      '<h2>🧺 もちもの</h2>' +
      '<div style="font-size:12px; font-weight:900; text-align:left;">しゅうかくした もの</div>' +
      '<div class="inv-grid">' + (itemsHtml || '<span style="font-size:11px; opacity:.6;">まだ ないよ</span>') + '</div>' +
      '<div style="font-size:12px; font-weight:900; text-align:left; margin-top:8px;">できた りょうり</div>' +
      '<div class="inv-grid">' + (dishesHtml || '<span style="font-size:11px; opacity:.6;">まだ ないよ</span>') + '</div>' +
      '<div style="font-size:12px; font-weight:900; text-align:left; margin-top:8px;">🗺️ たからの ちず</div>' +
      '<div class="map-pieces">' + piecesHtml + '</div>' +
      '<div style="font-size:12px; font-weight:900; text-align:left; margin-top:8px;">🐾 なかよし</div>' +
      '<div class="inv-grid">' + friendsHtml + '</div>' +
      '<button class="big-btn" data-close="1">とじる</button>'
    );
  });

  /* ================= モーダル・トースト・HUD ================= */
  function showModal(html, noClose){
    const root = $("modalRoot");
    root.innerHTML = '<div class="modal-bg"><div class="modal">' + html + '</div></div>';
    root.querySelectorAll("[data-close]").forEach(b => b.addEventListener("click", closeModal));
    if(!noClose){
      const bg = root.querySelector(".modal-bg");
      if(bg) bg.addEventListener("click", (e) => { if(e.target.classList.contains("modal-bg")) closeModal(); });
    }
  }
  function closeModal(){ $("modalRoot").innerHTML = ""; }
  function showRewardModal(title, body){
    showModal('<h2>' + title + '</h2><p style="font-size:14px; font-weight:900; white-space:pre-line;">' + body + '</p><button class="big-btn" data-close="1">オッケー！</button>');
  }
  let toastTimer = 0;
  function toast(msg){
    const t = $("toast");
    t.textContent = msg;
    t.classList.add("show");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => t.classList.remove("show"), 1900);
  }
  function renderStatus(){
    $("crownNum").textContent = S.crowns;
    $("lvNum").textContent = S.level;
    let pct = 100;
    if(S.level < MAX_LV){
      const cur = LEVELS[S.level] || 0, next = LEVELS[S.level+1];
      pct = Math.min(100, Math.round((S.totalCrowns - cur) / (next - cur) * 100));
    }
    $("lvFill").style.width = pct + "%";
    $("mapNum").textContent = S.mapPieces;
    updateBadges();
  }
  function updateBadges(){
    const anyDeliverable = S.orders.some(o => findDishIndex(o.dish) >= 0);
    $("invDot").classList.toggle("on", anyDeliverable);
  }
  let hintTimer = 0;
  function hint(msg, dur){
    const h = $("hint");
    h.textContent = msg;
    h.classList.add("show");
    clearTimeout(hintTimer);
    hintTimer = setTimeout(() => h.classList.remove("show"), dur || 4500);
  }

  /* ================= 起動 ================= */
  load();
  S.level = calcLevel(S.totalCrowns);
  missionCatchup();
  ensureOrders();
  renderStatus();
  renderKitchenPanel();
  missionBanner(false);

  /* 定期セーブ・バッジ更新 */
  setInterval(() => { save(); updateBadges(); }, 8000);

  requestAnimationFrame(loop);

  function startWelcome(){
    const readyCount = S.plots.filter(p => p && cropRatio(p) >= 1).length;
    const eggs = pendingEggs();
    const away = Date.now() - (S.lastSeen || Date.now());
    if((readyCount > 0 || eggs > 0) && away > 60*1000){
      let lines = [];
      if(readyCount > 0) lines.push("🥕 さくもつが " + readyCount + "こ そだったよ！");
      if(eggs > 0) lines.push("🥚 たまごが うまれてるよ！");
      showRewardModal("🏡 おかえりなさい！", lines.join("\n") + "\nしゅうかくしに いこう！");
    } else if(S.totalCrowns === 0){
      hint("がめんを おしたまま うごかすと あるけるよ！ はたけに いってみよう 🥕", 6500);
    }
  }
  if(!S.gender){
    showModal(
      '<h2>👑 きみは どっち？</h2>' +
      '<p style="font-size:13px; font-weight:900;">むらの しゅじんこうを えらんでね</p>' +
      '<div class="char-grid">' +
      '<div class="char-card" id="pickPrince">' + SPRITES.prince + '<div class="cname">おうじさま</div></div>' +
      '<div class="char-card" id="pickPrincess">' + SPRITES.princess + '<div class="cname">おひめさま</div></div>' +
      '</div>', true
    );
    $("pickPrince").addEventListener("click", () => { ensureAudio(); S.gender = "prince"; save(); sfx.crown(); closeModal(); startWelcome(); });
    $("pickPrincess").addEventListener("click", () => { ensureAudio(); S.gender = "princess"; save(); sfx.crown(); closeModal(); startWelcome(); });
  } else {
    startWelcome();
  }
  save();
})();
</script>
</body>
