<!DOCTYPE html>
<html lang="ja">
<head>
<script src="/games/wakuwaku_ui.js"></script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>どうぶつターゲット</title>
<link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@700;800;900&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{width:100%;height:100%;overflow:hidden;font-family:'M PLUS Rounded 1c',sans-serif;user-select:none;-webkit-user-select:none;}
body{background:#1a2e10;}
#wrap{position:fixed;inset:0;overflow:hidden;}
canvas{position:absolute;top:0;left:0;display:block;touch-action:none;}

/* ===== HUD ===== */
#hud{position:absolute;top:0;left:0;right:0;z-index:20;padding:8px 12px 4px;
  padding-top:max(8px,var(--sat,env(safe-area-inset-top,0px)));
  display:flex;align-items:center;gap:8px;pointer-events:none;}
#hud button{pointer-events:auto;}
#back-btn,#ui-bgm-btn{background:rgba(0,0,0,0.35);border:2px solid rgba(255,255,255,0.35);
  color:#fff;font-family:inherit;font-weight:800;font-size:13px;padding:6px 10px;border-radius:12px;cursor:pointer;}
#ui-bgm-btn{padding:6px 9px;}
#hud-stage{font-size:13px;font-weight:900;color:#fff;text-shadow:0 1px 4px rgba(0,0,0,0.6);}
#hud-right{margin-left:auto;display:flex;flex-direction:column;align-items:flex-end;gap:2px;}
#hud-score{font-size:18px;font-weight:900;color:#FFD700;text-shadow:0 1px 4px rgba(0,0,0,0.6);}
#hud-lives{font-size:14px;letter-spacing:1px;text-shadow:0 1px 3px rgba(0,0,0,0.5);}

/* combo */
#combo-box{position:absolute;top:calc(max(8px,var(--sat,env(safe-area-inset-top,0px))) + 46px);
  left:12px;z-index:20;display:none;pointer-events:none;}
#combo-label{font-size:15px;font-weight:900;color:#FF7043;text-shadow:0 1px 0 #fff,0 2px 6px rgba(0,0,0,0.4);}
#combo-mult{font-size:12px;font-weight:900;color:#fff;background:linear-gradient(135deg,#FF7043,#F4511E);
  padding:1px 8px;border-radius:10px;margin-left:4px;box-shadow:0 2px 5px rgba(0,0,0,0.3);}
#combo-gauge{width:110px;height:6px;background:rgba(0,0,0,0.35);border-radius:3px;margin-top:3px;overflow:hidden;}
#combo-fill{height:100%;width:100%;background:linear-gradient(90deg,#FFD54F,#FF7043);border-radius:3px;}

/* timer */
#timer-wrap{position:absolute;left:12px;right:12px;z-index:20;
  top:calc(max(8px,var(--sat,env(safe-area-inset-top,0px))) + 40px);display:none;pointer-events:none;}
#timer-bar{height:8px;background:rgba(0,0,0,0.35);border-radius:4px;overflow:hidden;border:1px solid rgba(255,255,255,0.25);}
#timer-fill{height:100%;width:100%;background:linear-gradient(90deg,#66BB6A,#AED581);border-radius:4px;transition:width 0.3s linear;}

/* stage banner */
#stage-banner{position:absolute;top:42%;left:50%;transform:translate(-50%,-50%) scale(0.6);
  z-index:25;text-align:center;opacity:0;pointer-events:none;transition:all 0.35s cubic-bezier(0.34,1.56,0.64,1);}
#stage-banner.show{opacity:1;transform:translate(-50%,-50%) scale(1);}

/* rush banner */
#rush-banner{position:absolute;top:30%;left:50%;transform:translateX(-50%);z-index:25;
  font-size:24px;font-weight:900;color:#FFD700;text-shadow:0 0 12px rgba(255,215,0,0.8),0 2px 4px rgba(0,0,0,0.5);
  opacity:0;pointer-events:none;transition:opacity 0.3s;white-space:nowrap;}
#rush-banner.show{opacity:1;animation:rushPulse 0.5s infinite alternate;}
@keyframes rushPulse{from{transform:translateX(-50%) scale(1);}to{transform:translateX(-50%) scale(1.12);}}

/* boss hp */
#boss-hp{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(max(14px,var(--sab,env(safe-area-inset-bottom,0px))) + 8px);
  width:min(72%,300px);z-index:20;display:none;pointer-events:none;}
#boss-hp-label{text-align:center;font-size:12px;font-weight:900;color:#FF8A80;text-shadow:0 1px 3px rgba(0,0,0,0.6);margin-bottom:2px;}
#boss-hp-bar{height:10px;background:rgba(0,0,0,0.45);border-radius:5px;overflow:hidden;border:2px solid rgba(255,255,255,0.4);}
#boss-hp-fill{height:100%;width:100%;background:linear-gradient(90deg,#EF5350,#FF8A80);transition:width 0.2s;}

/* ===== screens ===== */
.screen{position:absolute;inset:0;z-index:40;display:none;flex-direction:column;align-items:center;
  overflow-y:auto;-webkit-overflow-scrolling:touch;}
.screen.show{display:flex;}

/* title */
#ts{background:linear-gradient(180deg,#1a2352 0%,#2d3a6e 45%,#1e4d3a 100%);justify-content:center;}
.ts-float{position:absolute;font-size:30px;opacity:0.7;animation:tsFloat 6s ease-in-out infinite;pointer-events:none;}
@keyframes tsFloat{0%,100%{transform:translateY(0) rotate(-5deg);}50%{transform:translateY(-22px) rotate(5deg);}}
#ts-scope{font-size:64px;animation:tsScope 2.6s ease-in-out infinite;filter:drop-shadow(0 4px 10px rgba(0,0,0,0.4));}
@keyframes tsScope{0%,100%{transform:translate(0,0) scale(1);}25%{transform:translate(-18px,8px) scale(1.05);}55%{transform:translate(16px,-6px) scale(0.97);}80%{transform:translate(-6px,-12px) scale(1.08);}}
#ts-title{font-size:min(11vw,46px);font-weight:900;color:#fff;margin-top:6px;
  text-shadow:0 3px 0 #E64A19,0 6px 14px rgba(0,0,0,0.45);letter-spacing:1px;}
#ts-sub{font-size:14px;font-weight:800;color:#FFE082;margin-top:8px;text-shadow:0 1px 4px rgba(0,0,0,0.5);}
#ts-stars{margin-top:10px;font-size:13px;font-weight:800;color:#FFD700;background:rgba(0,0,0,0.25);
  padding:4px 14px;border-radius:14px;}
#ts-btn{margin-top:26px;font-family:inherit;font-size:22px;font-weight:900;color:#fff;
  background:linear-gradient(135deg,#FF7043,#F4511E);border:none;border-radius:26px;
  padding:14px 52px;cursor:pointer;box-shadow:0 6px 0 #BF360C,0 10px 18px rgba(0,0,0,0.35);
  animation:btnPulse 1.4s ease-in-out infinite;}
@keyframes btnPulse{0%,100%{transform:scale(1);}50%{transform:scale(1.06);}}
#ts-btn:active{transform:translateY(4px);box-shadow:0 2px 0 #BF360C;}

/* map */
#map{background:linear-gradient(180deg,#263a80 0%,#2e5c46 100%);padding:0 16px;}
#map-head{width:100%;max-width:420px;display:flex;align-items:center;gap:10px;
  padding-top:calc(max(10px,var(--sat,env(safe-area-inset-top,0px))) + 6px);}
#map-title{font-size:19px;font-weight:900;color:#fff;text-shadow:0 2px 6px rgba(0,0,0,0.4);}
#map-back{background:rgba(0,0,0,0.3);border:2px solid rgba(255,255,255,0.35);color:#fff;
  font-family:inherit;font-weight:800;font-size:13px;padding:6px 12px;border-radius:12px;cursor:pointer;}
#map-list{width:100%;max-width:420px;display:flex;flex-direction:column;gap:10px;margin-top:12px;
  padding-bottom:calc(max(20px,var(--sab,env(safe-area-inset-bottom,0px))) + 12px);}
.stg-card{display:flex;align-items:center;gap:12px;background:rgba(255,255,255,0.12);
  border:2px solid rgba(255,255,255,0.3);border-radius:18px;padding:12px 14px;cursor:pointer;
  transition:transform 0.12s;}
.stg-card:active{transform:scale(0.97);}
.stg-card.locked{opacity:0.45;cursor:default;}
.stg-icon{width:52px;height:52px;border-radius:14px;display:flex;align-items:center;justify-content:center;
  font-size:28px;flex-shrink:0;box-shadow:inset 0 -3px 0 rgba(0,0,0,0.15);}
.stg-info{flex:1;min-width:0;}
.stg-num{font-size:11px;font-weight:800;color:rgba(255,255,255,0.7);}
.stg-name{font-size:16px;font-weight:900;color:#fff;text-shadow:0 1px 3px rgba(0,0,0,0.3);}
.stg-stars{font-size:15px;letter-spacing:2px;}
.stg-go{font-size:20px;color:#FFE082;}
#endless-card{background:linear-gradient(135deg,rgba(255,215,0,0.22),rgba(255,112,67,0.22));
  border-color:#FFD700;}
#endless-hi{font-size:12px;font-weight:800;color:#FFE082;}

/* overlays */
.ov{position:absolute;inset:0;z-index:50;display:flex;align-items:center;justify-content:center;
  background:rgba(10,16,30,0.62);opacity:0;pointer-events:none;transition:opacity 0.3s;}
.ov.show{opacity:1;pointer-events:auto;}
.ov-card{background:linear-gradient(180deg,#fffef5,#fff3e0);border-radius:24px;padding:26px 30px;
  text-align:center;box-shadow:0 12px 34px rgba(0,0,0,0.45);max-width:82vw;
  transform:scale(0.7);transition:transform 0.35s cubic-bezier(0.34,1.56,0.64,1);}
.ov.show .ov-card{transform:scale(1);}
.ot{font-size:23px;font-weight:900;color:#5D4037;}
.os{font-size:14px;font-weight:800;color:#8D6E63;margin-top:8px;line-height:1.7;}
.ostars{font-size:34px;letter-spacing:6px;margin:10px 0 4px;}
.obtn{font-family:inherit;font-size:16px;font-weight:900;color:#fff;border:none;border-radius:18px;
  padding:11px 26px;cursor:pointer;margin:6px 4px 0;box-shadow:0 4px 0 rgba(0,0,0,0.25);}
.obtn:active{transform:translateY(3px);box-shadow:none;}
.obtn.main{background:linear-gradient(135deg,#66BB6A,#43A047);}
.obtn.sub{background:linear-gradient(135deg,#90A4AE,#78909C);}
.obtn.hot{background:linear-gradient(135deg,#FF7043,#F4511E);}
</style>
<script src="/games/wakuwaku_bgm_mp3.js"></script>
<script src="/games/safe_area.js"></script>
</head>
<body>
<div id="wrap">
  <canvas id="cv"></canvas>

  <div id="hud">
    <button id="back-btn">← もどる</button>
    <button id="ui-bgm-btn">🔊</button>
    <div id="hud-stage"></div>
    <div id="hud-right">
      <div id="hud-score">🎯 0</div>
      <div id="hud-lives">❤️❤️❤️</div>
    </div>
  </div>

  <div id="timer-wrap"><div id="timer-bar"><div id="timer-fill"></div></div></div>

  <div id="combo-box">
    <span id="combo-label">コンボ 0</span><span id="combo-mult">x1</span>
    <div id="combo-gauge"><div id="combo-fill"></div></div>
  </div>

  <div id="stage-banner"></div>
  <div id="rush-banner">✨ ゴールドラッシュ！ ✨</div>

  <div id="boss-hp">
    <div id="boss-hp-label">👑 ボスが あらわれた！</div>
    <div id="boss-hp-bar"><div id="boss-hp-fill"></div></div>
  </div>

  <!-- タイトル -->
  <div id="ts" class="screen show">
    <span class="ts-float" style="top:12%;left:12%;animation-delay:0s;">🐰</span>
    <span class="ts-float" style="top:20%;right:14%;animation-delay:1.2s;">🦊</span>
    <span class="ts-float" style="bottom:26%;left:16%;animation-delay:2.1s;">🐸</span>
    <span class="ts-float" style="bottom:18%;right:12%;animation-delay:0.7s;">🐼</span>
    <span class="ts-float" style="top:38%;left:6%;animation-delay:1.8s;font-size:22px;">⭐</span>
    <span class="ts-float" style="top:34%;right:6%;animation-delay:0.4s;font-size:22px;">⭐</span>
    <div id="ts-scope">🎯</div>
    <div id="ts-title">どうぶつターゲット</div>
    <div id="ts-sub">ねらって タップ！ どうぶつを うちおとせ！</div>
    <div id="ts-stars">⭐ あつめたスター：<span id="ts-star-count">0</span> / 15</div>
    <button id="ts-btn">▶ あそぶ</button>
  </div>

  <!-- ステージマップ -->
  <div id="map" class="screen">
    <div id="map-head">
      <button id="map-back">◀ タイトル</button>
      <div id="map-title">🗺️ ステージをえらぼう</div>
    </div>
    <div id="map-list"></div>
  </div>

  <!-- クリア -->
  <div id="clear-ov" class="ov"><div class="ov-card">
    <div class="ot" id="clear-title">ステージクリア！</div>
    <div class="ostars" id="clear-stars"></div>
    <div class="os" id="clear-sub"></div>
    <div><button class="obtn main" id="clear-next">つぎへ ▶</button><button class="obtn sub" id="clear-map">マップ</button></div>
  </div></div>

  <!-- ゲームオーバー -->
  <div id="go-ov" class="ov"><div class="ov-card">
    <div class="ot">😢 ゲームオーバー</div>
    <div class="os" id="go-sub"></div>
    <div><button class="obtn hot" id="go-retry">もういちど</button><button class="obtn sub" id="go-map">マップ</button></div>
  </div></div>

  <!-- 全クリア -->
  <div id="ac-ov" class="ov"><div class="ov-card">
    <div class="ot">🏆 ぜんステージクリア！</div>
    <div class="ostars" id="ac-stars"></div>
    <div class="os" id="ac-sub">きみは でんせつの ターゲットマスターだ！</div>
    <div><button class="obtn hot" id="ac-endless">🔥 エンドレスにちょうせん</button><button class="obtn sub" id="ac-map">マップ</button></div>
  </div></div>
</div>

<script>
'use strict';
const SAFE_LS = (function () {
  try {
    const testKey = "__ww_storage_test__";
    localStorage.setItem(testKey, testKey);
    localStorage.removeItem(testKey);
    return localStorage;
  } catch (e) {
    const memory = {};

    return {
      getItem(key) {
        return Object.prototype.hasOwnProperty.call(memory, key)
          ? memory[key]
          : null;
      },

      setItem(key, value) {
        memory[key] = String(value);
      },

      removeItem(key) {
        delete memory[key];
      }
    };
  }
})();
// ================= 保存 =================
const SAVE_KEY='sniper_v3_progress';
function loadProg(){
  try{const d=JSON.parse(SAFE_LS.getItem(SAVE_KEY));
    if(d&&Array.isArray(d.stars))return{stars:d.stars.slice(0,5).concat([0,0,0,0,0]).slice(0,5),endlessHi:d.endlessHi|0};
  }catch(e){}
  return{stars:[0,0,0,0,0],endlessHi:0};
}
function saveProg(){try{SAFE_LS.setItem(SAVE_KEY,JSON.stringify(prog));}catch(e){}}
let prog=loadProg();

// ================= ステージ設定 =================
const STAGES=[
  {name:'ひるのもりはら',icon:'🌼',theme:'meadow', time:45,count:4,szMin:0.115,szMax:0.15,spMin:1.0,spMax:1.8,pts:10,fakes:0,bossHP:5, s2:600, s3:1000, iconBg:'#AED581'},
  {name:'ゆうやけさばく',icon:'🌵',theme:'desert', time:45,count:5,szMin:0.10,szMax:0.135,spMin:1.5,spMax:2.4,pts:15,fakes:1,bossHP:6, s2:900, s3:1500, iconBg:'#FFB74D'},
  {name:'よるのもり',  icon:'🌙',theme:'forest', time:45,count:5,szMin:0.09,szMax:0.125,spMin:1.9,spMax:3.0,pts:20,fakes:2,bossHP:7, s2:1200,s3:2000, iconBg:'#4DB6AC'},
  {name:'ゆきやま',    icon:'⛄',theme:'snow',   time:45,count:6,szMin:0.085,szMax:0.115,spMin:2.3,spMax:3.6,pts:25,fakes:2,bossHP:8, s2:1500,s3:2500, iconBg:'#81D4FA'},
  {name:'ほしぞらのしま',icon:'🌠',theme:'starry',time:45,count:6,szMin:0.075,szMax:0.105,spMin:2.7,spMax:4.2,pts:30,fakes:3,bossHP:10,s2:1800,s3:3000, iconBg:'#9575CD'},
];
const FAKE_KIND={meadow:'flower',desert:'cactus',forest:'bush',snow:'snowball',starry:'bush'};
const SPECIES_LIST=['cat','rabbit','fox','frog','panda','bear','penguin'];

// ================= 状態 =================
let W,H;
let mode='stage';           // 'stage' | 'endless'
let stageIdx=0;
let score=0,lives=3;
let combo=0,comboExpire=0;
let timeLeft=45,timerIv=null;
let gameRunning=false;
let animals=[],particles=[],floats=[],rings=[],shots=[];
let boss=null,bossDone=false;
let rushUntil=0,rushSpawnT=0,rushDone=false;
let raf=null,lastT=0,elapsed=0;
let level=1,nextLevelAt=30,nextBossAt=40,nextRushScore=400;
let bg={clouds:[],stars:[],trees:[],snow:[],flies:[],dunes:[]};
let curTheme='meadow';
let shakeT=0;

const cv=document.getElementById('cv');
const ctx=cv.getContext('2d');
const $=id=>document.getElementById(id);

// ================= 画面遷移 =================
function show(id){['ts','map'].forEach(s=>$(s).classList.toggle('show',s===id));}
function hideOverlays(){['clear-ov','go-ov','ac-ov'].forEach(id=>$(id).classList.remove('show'));}
function gameUIVisible(v){
  $('timer-wrap').style.display=(v&&mode==='stage')?'block':'none';
  $('hud-stage').textContent=v?(mode==='stage'?`ステージ${stageIdx+1} ${STAGES[stageIdx].name}`:`🔥 エンドレス Lv${level}`):'';
}

// ================= マップ =================
function buildMap(){
  const list=$('map-list');
  list.innerHTML='';
  // エンドレス
  const ec=document.createElement('div');
  ec.className='stg-card';ec.id='endless-card';
  ec.innerHTML=`<div class="stg-icon" style="background:#FFD54F;">🔥</div>
    <div class="stg-info"><div class="stg-num">エンドレスモード</div>
    <div class="stg-name">むげんチャレンジ</div>
    <div id="endless-hi">🏅 さいこう：${prog.endlessHi} てん</div></div>
    <div class="stg-go">▶</div>`;
  ec.addEventListener('click',()=>startGame('endless',0));
  list.appendChild(ec);
  // ステージ
  STAGES.forEach((st,i)=>{
    const unlocked=i===0||prog.stars[i-1]>0;
    const c=document.createElement('div');
    c.className='stg-card'+(unlocked?'':' locked');
    const stars=prog.stars[i];
    const starTxt='★'.repeat(stars)+'☆'.repeat(3-stars);
    c.innerHTML=`<div class="stg-icon" style="background:${st.iconBg};">${unlocked?st.icon:'🔒'}</div>
      <div class="stg-info"><div class="stg-num">ステージ ${i+1}</div>
      <div class="stg-name">${st.name}</div>
      <div class="stg-stars" style="color:#FFD700;">${starTxt}</div></div>
      <div class="stg-go">${unlocked?'▶':''}</div>`;
    if(unlocked)c.addEventListener('click',()=>startGame('stage',i));
    list.appendChild(c);
  });
}
function updateTitleStars(){
  $('ts-star-count').textContent=prog.stars.reduce((a,b)=>a+b,0);
}

// ================= ゲーム開始 =================
function startGame(m,idx){
  mode=m;stageIdx=idx;
  show('');hideOverlays();
  score=0;lives=3;combo=0;comboExpire=0;
  animals=[];particles=[];floats=[];rings=[];shots=[];
  boss=null;bossDone=false;rushUntil=0;rushDone=false;elapsed=0;shakeT=0;
  level=1;nextLevelAt=30;nextBossAt=40;nextRushScore=400;
  const st=STAGES[mode==='stage'?stageIdx:0];
  curTheme=mode==='stage'?st.theme:'meadow';
  timeLeft=st.time;
  initBg(curTheme);
  clearInterval(timerIv);
  gameUIVisible(true);
  updateHUD();updateTimerBar();updateCombo();
  $('boss-hp').style.display='none';
  showBanner(mode==='stage'?`ステージ ${stageIdx+1}`:'🔥 エンドレス',mode==='stage'?st.name:'どこまでいける？');
  setTimeout(()=>{
    if(mode==='stage'){
      timerIv=setInterval(()=>{
        if(!gameRunning)return;
        timeLeft--;updateTimerBar();
        if(timeLeft===25&&!rushDone)startRush();
        if(timeLeft===14&&!boss&&!bossDone)spawnBoss();
        if(timeLeft<=0){clearInterval(timerIv);stageEnd();}
      },1000);
    }
    gameRunning=true;
    lastT=performance.now();
    if(raf)cancelAnimationFrame(raf);
    raf=requestAnimationFrame(loop);
  },900);
  startBGMIfOn();
}

// ================= 背景 =================
function initBg(theme){
  bg={clouds:[],stars:[],trees:[],snow:[],flies:[],dunes:[]};
  if(theme==='meadow'){
    for(let i=0;i<4;i++)bg.clouds.push({x:Math.random()*W,y:H*(0.08+Math.random()*0.15),s:0.7+Math.random()*0.8,v:0.15+Math.random()*0.2});
  }else if(theme==='desert'){
    for(let i=0;i<3;i++)bg.trees.push({x:W*(0.1+i*0.35+Math.random()*0.1),h:H*(0.07+Math.random()*0.05)});
  }else if(theme==='forest'){
    for(let i=0;i<7;i++)bg.trees.push({x:i*W/6+Math.random()*30-15,h:H*(0.18+Math.random()*0.12)});
    for(let i=0;i<10;i++)bg.flies.push({x:Math.random()*W,y:H*(0.2+Math.random()*0.55),ph:Math.random()*6.28,vx:(Math.random()-0.5)*0.4,vy:(Math.random()-0.5)*0.3});
    for(let i=0;i<25;i++)bg.stars.push({x:Math.random()*W,y:Math.random()*H*0.35,r:0.6+Math.random()*1.2,ph:Math.random()*6.28});
  }else if(theme==='snow'){
    for(let i=0;i<40;i++)bg.snow.push({x:Math.random()*W,y:Math.random()*H,r:1.2+Math.random()*2.2,v:0.5+Math.random()*1.2,sw:Math.random()*6.28});
  }else if(theme==='starry'){
    for(let i=0;i<60;i++)bg.stars.push({x:Math.random()*W,y:Math.random()*H*0.6,r:0.5+Math.random()*1.4,ph:Math.random()*6.28});
  }
}
function drawBG(t){
  const g=ctx.createLinearGradient(0,0,0,H);
  if(curTheme==='meadow'){
    g.addColorStop(0,'#8ED6FF');g.addColorStop(1,'#DFF7FF');
    ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
    ctx.fillStyle='#FFEE58';ctx.beginPath();ctx.arc(W*0.85,H*0.12,26,0,6.29);ctx.fill();
    ctx.fillStyle='rgba(255,255,255,0.9)';
    bg.clouds.forEach(c=>{
      c.x+=c.v;if(c.x>W+60)c.x=-60;
      ctx.beginPath();
      ctx.arc(c.x,c.y,16*c.s,0,6.29);ctx.arc(c.x+16*c.s,c.y+4*c.s,13*c.s,0,6.29);ctx.arc(c.x-16*c.s,c.y+4*c.s,12*c.s,0,6.29);ctx.fill();
    });
    ctx.fillStyle='#A5D66E';ctx.beginPath();ctx.ellipse(W*0.25,H*1.02,W*0.7,H*0.16,0,0,6.29);ctx.fill();
    ctx.fillStyle='#8BC34A';ctx.beginPath();ctx.ellipse(W*0.85,H*1.04,W*0.6,H*0.13,0,0,6.29);ctx.fill();
  }else if(curTheme==='desert'){
    g.addColorStop(0,'#FFB74D');g.addColorStop(0.6,'#FF8A65');g.addColorStop(1,'#FF7043');
    ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
    ctx.fillStyle='#FFE082';ctx.beginPath();ctx.arc(W*0.5,H*0.28,34,0,6.29);ctx.fill();
    ctx.fillStyle='#FFCC80';ctx.beginPath();ctx.ellipse(W*0.2,H*1.0,W*0.75,H*0.18,0,0,6.29);ctx.fill();
    ctx.fillStyle='#FFA726';ctx.beginPath();ctx.ellipse(W*0.85,H*1.03,W*0.65,H*0.14,0,0,6.29);ctx.fill();
    ctx.fillStyle='rgba(90,60,20,0.4)';
    bg.trees.forEach(c=>{
      ctx.fillRect(c.x-4,H*0.86-c.h,8,c.h);
      ctx.fillRect(c.x-14,H*0.86-c.h*0.7,8,4);ctx.fillRect(c.x-14,H*0.86-c.h*0.7-10,4,12);
      ctx.fillRect(c.x+6,H*0.86-c.h*0.55,8,4);ctx.fillRect(c.x+10,H*0.86-c.h*0.55-9,4,11);
    });
  }else if(curTheme==='forest'){
    g.addColorStop(0,'#0D1B2A');g.addColorStop(1,'#1B3B2F');
    ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
    bg.stars.forEach(s=>{
      const a=0.4+0.5*Math.abs(Math.sin(t*0.001+s.ph));
      ctx.fillStyle=`rgba(255,255,220,${a})`;
      ctx.beginPath();ctx.arc(s.x,s.y,s.r,0,6.29);ctx.fill();
    });
    ctx.fillStyle='rgba(8,25,16,0.85)';
    bg.trees.forEach(tr=>{
      ctx.beginPath();ctx.moveTo(tr.x,H-tr.h);
      ctx.lineTo(tr.x-tr.h*0.35,H);ctx.lineTo(tr.x+tr.h*0.35,H);ctx.closePath();ctx.fill();
    });
    bg.flies.forEach(f=>{
      f.x+=f.vx;f.y+=f.vy;
      if(f.x<0||f.x>W)f.vx*=-1;if(f.y<H*0.15||f.y>H*0.85)f.vy*=-1;
      const a=0.3+0.6*Math.abs(Math.sin(t*0.003+f.ph));
      ctx.fillStyle=`rgba(180,255,120,${a})`;
      ctx.beginPath();ctx.arc(f.x,f.y,2.4,0,6.29);ctx.fill();
    });
  }else if(curTheme==='snow'){
    g.addColorStop(0,'#90CAF9');g.addColorStop(1,'#E3F2FD');
    ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
    ctx.fillStyle='rgba(255,255,255,0.95)';
    ctx.beginPath();ctx.moveTo(0,H*0.75);ctx.lineTo(W*0.28,H*0.38);ctx.lineTo(W*0.55,H*0.75);ctx.closePath();ctx.fill();
    ctx.beginPath();ctx.moveTo(W*0.42,H*0.78);ctx.lineTo(W*0.72,H*0.32);ctx.lineTo(W*1.05,H*0.78);ctx.closePath();ctx.fill();
    ctx.fillStyle='#F0F8FF';ctx.fillRect(0,H*0.74,W,H*0.26);
    bg.snow.forEach(s=>{
      s.y+=s.v;s.x+=Math.sin(t*0.001+s.sw)*0.4;
      if(s.y>H)s.y=-4;
      ctx.fillStyle='rgba(255,255,255,0.85)';
      ctx.beginPath();ctx.arc(s.x,s.y,s.r,0,6.29);ctx.fill();
    });
  }else{ // starry
    g.addColorStop(0,'#0B1035');g.addColorStop(1,'#1A2350');
    ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
    bg.stars.forEach(s=>{
      const a=0.3+0.6*Math.abs(Math.sin(t*0.0012+s.ph));
      ctx.fillStyle=`rgba(255,255,230,${a})`;
      ctx.beginPath();ctx.arc(s.x,s.y,s.r,0,6.29);ctx.fill();
    });
    ctx.fillStyle='#FFF9C4';ctx.beginPath();ctx.arc(W*0.82,H*0.14,22,0,6.29);ctx.fill();
    ctx.fillStyle='#0B1035';ctx.beginPath();ctx.arc(W*0.82+9,H*0.14-4,19,0,6.29);ctx.fill();
    ctx.fillStyle='#16305a';ctx.fillRect(0,H*0.82,W,H*0.18);
    ctx.fillStyle='rgba(30,45,30,0.9)';
    ctx.beginPath();ctx.ellipse(W*0.5,H*0.86,W*0.3,H*0.05,0,0,6.29);ctx.fill();
  }
  // ラッシュ中は金の空気
  if(elapsed<rushUntil){
    ctx.fillStyle='rgba(255,215,0,0.08)';ctx.fillRect(0,0,W,H);
  }
}

// ================= 動物ベクター描画 =================
const SPECIES={
  cat:    {body:'#FFB74D',ear:'tri', earC:'#FF9800'},
  rabbit: {body:'#FFF3E0',ear:'long',earC:'#FFCDD2'},
  fox:    {body:'#FF8A65',ear:'tri', earC:'#E64A19',muzzle:'#FFF8F0'},
  frog:   {body:'#81C784',ear:'top', earC:'#66BB6A'},
  panda:  {body:'#FAFAFA',ear:'round',earC:'#37474F',patch:'#37474F'},
  bear:   {body:'#A1887F',ear:'round',earC:'#8D6E63'},
  penguin:{body:'#546E7A',ear:'none',belly:'#ECEFF1'},
};
function drawAnimal(x,y,r,spName,wob,gold,isBoss,hpRatio){
  const sp=SPECIES[spName]||SPECIES.cat;
  const body=gold?'#FFD54F':sp.body;
  const earC=gold?'#FFB300':sp.earC;
  ctx.save();
  ctx.translate(x,y);
  ctx.rotate(Math.sin(wob)*0.08);
  if(gold){ctx.shadowColor='rgba(255,215,0,0.9)';ctx.shadowBlur=r*0.6;}
  // 耳
  ctx.fillStyle=earC;
  if(sp.ear==='tri'){
    ctx.beginPath();ctx.moveTo(-r*0.75,-r*0.35);ctx.lineTo(-r*0.5,-r*1.25);ctx.lineTo(-r*0.15,-r*0.75);ctx.closePath();ctx.fill();
    ctx.beginPath();ctx.moveTo(r*0.75,-r*0.35);ctx.lineTo(r*0.5,-r*1.25);ctx.lineTo(r*0.15,-r*0.75);ctx.closePath();ctx.fill();
  }else if(sp.ear==='long'){
    ctx.beginPath();ctx.ellipse(-r*0.4,-r*1.15,r*0.24,r*0.65,-0.15,0,6.29);ctx.fill();
    ctx.beginPath();ctx.ellipse(r*0.4,-r*1.15,r*0.24,r*0.65,0.15,0,6.29);ctx.fill();
  }else if(sp.ear==='round'){
    ctx.beginPath();ctx.arc(-r*0.6,-r*0.75,r*0.34,0,6.29);ctx.fill();
    ctx.beginPath();ctx.arc(r*0.6,-r*0.75,r*0.34,0,6.29);ctx.fill();
  }else if(sp.ear==='top'){
    ctx.beginPath();ctx.arc(-r*0.42,-r*0.85,r*0.3,0,6.29);ctx.fill();
    ctx.beginPath();ctx.arc(r*0.42,-r*0.85,r*0.3,0,6.29);ctx.fill();
    ctx.fillStyle='#fff';
    ctx.beginPath();ctx.arc(-r*0.42,-r*0.88,r*0.16,0,6.29);ctx.fill();
    ctx.beginPath();ctx.arc(r*0.42,-r*0.88,r*0.16,0,6.29);ctx.fill();
    ctx.fillStyle='#333';
    ctx.beginPath();ctx.arc(-r*0.42,-r*0.88,r*0.07,0,6.29);ctx.fill();
    ctx.beginPath();ctx.arc(r*0.42,-r*0.88,r*0.07,0,6.29);ctx.fill();
  }
  // 体
  ctx.fillStyle=body;
  ctx.beginPath();ctx.arc(0,0,r,0,6.29);ctx.fill();
  ctx.shadowBlur=0;
  // ペンギンおなか
  if(sp.belly){ctx.fillStyle=gold?'#FFF8E1':sp.belly;
    ctx.beginPath();ctx.ellipse(0,r*0.22,r*0.62,r*0.72,0,0,6.29);ctx.fill();}
  // パンダ目パッチ
  if(sp.patch&&!gold){ctx.fillStyle=sp.patch;
    ctx.beginPath();ctx.ellipse(-r*0.36,-r*0.12,r*0.24,r*0.3,-0.3,0,6.29);ctx.fill();
    ctx.beginPath();ctx.ellipse(r*0.36,-r*0.12,r*0.24,r*0.3,0.3,0,6.29);ctx.fill();}
  // キツネ口元
  if(sp.muzzle&&!gold){ctx.fillStyle=sp.muzzle;
    ctx.beginPath();ctx.ellipse(0,r*0.3,r*0.5,r*0.42,0,0,6.29);ctx.fill();}
  // ボス眉
  if(isBoss){
    ctx.strokeStyle='#4E342E';ctx.lineWidth=r*0.1;ctx.lineCap='round';
    ctx.beginPath();ctx.moveTo(-r*0.55,-r*0.45);ctx.lineTo(-r*0.18,-r*0.3);ctx.stroke();
    ctx.beginPath();ctx.moveTo(r*0.55,-r*0.45);ctx.lineTo(r*0.18,-r*0.3);ctx.stroke();
  }
  // 目
  ctx.fillStyle='#333';
  ctx.beginPath();ctx.arc(-r*0.32,-r*0.08,r*0.11,0,6.29);ctx.fill();
  ctx.beginPath();ctx.arc(r*0.32,-r*0.08,r*0.11,0,6.29);ctx.fill();
  ctx.fillStyle='#fff';
  ctx.beginPath();ctx.arc(-r*0.29,-r*0.12,r*0.04,0,6.29);ctx.fill();
  ctx.beginPath();ctx.arc(r*0.35,-r*0.12,r*0.04,0,6.29);ctx.fill();
  // 鼻・口
  ctx.fillStyle='#795548';
  ctx.beginPath();ctx.arc(0,r*0.16,r*0.08,0,6.29);ctx.fill();
  ctx.strokeStyle='#795548';ctx.lineWidth=Math.max(1.2,r*0.05);ctx.lineCap='round';
  ctx.beginPath();ctx.arc(0,r*0.24,r*0.16,0.3,2.84);ctx.stroke();
  // ほっぺ
  ctx.fillStyle='rgba(255,150,150,0.5)';
  ctx.beginPath();ctx.arc(-r*0.55,r*0.18,r*0.14,0,6.29);ctx.fill();
  ctx.beginPath();ctx.arc(r*0.55,r*0.18,r*0.14,0,6.29);ctx.fill();
  // 王冠（ボス・ゴールド）
  if(isBoss||gold){
    ctx.fillStyle='#FFD700';
    const cw=r*0.7,cy=-r*(sp.ear==='long'?1.75:1.35);
    ctx.beginPath();
    ctx.moveTo(-cw/2,cy);ctx.lineTo(-cw/2,cy-r*0.28);
    ctx.lineTo(-cw/4,cy-r*0.12);ctx.lineTo(0,cy-r*0.34);
    ctx.lineTo(cw/4,cy-r*0.12);ctx.lineTo(cw/2,cy-r*0.28);
    ctx.lineTo(cw/2,cy);ctx.closePath();ctx.fill();
    ctx.fillStyle='#E53935';
    ctx.beginPath();ctx.arc(0,cy-r*0.1,r*0.06,0,6.29);ctx.fill();
  }
  ctx.restore();
  // ボスHPミニバー
  if(isBoss){
    ctx.fillStyle='rgba(0,0,0,0.4)';
    ctx.fillRect(x-r,y-r*1.9,r*2,r*0.16);
    ctx.fillStyle='#FF5252';
    ctx.fillRect(x-r,y-r*1.9,r*2*hpRatio,r*0.16);
  }
}
function drawFake(x,y,r,kind,wob){

  }else if(kind==='cactus'){
    ctx.fillStyle='#66BB6A';
    ctx.beginPath();ctx.ellipse(0,0,r*0.45,r*0.85,0,0,6.29);ctx.fill();
    ctx.beginPath();ctx.ellipse(-r*0.55,-r*0.15,r*0.22,r*0.4,0.5,0,6.29);ctx.fill();
    ctx.beginPath();ctx.ellipse(r*0.55,-r*0.05,r*0.22,r*0.4,-0.5,0,6.29);ctx.fill();
    ctx.fillStyle='#F48FB1';ctx.beginPath();ctx.arc(0,-r*0.8,r*0.16,0,6.29);ctx.fill();
  }else if(kind==='snowball'){
    ctx.fillStyle='#FFFFFF';
    ctx.beginPath();ctx.arc(0,r*0.25,r*0.7,0,6.29);ctx.fill();
    ctx.beginPath();ctx.arc(0,-r*0.5,r*0.48,0,6.29);ctx.fill();
    ctx.fillStyle='rgba(150,190,220,0.5)';
    ctx.beginPath();ctx.arc(-r*0.25,r*0.35,r*0.12,0,6.29);ctx.fill();
  }else{ // bush
    ctx.fillStyle='#4CAF50';
    ctx.beginPath();ctx.arc(-r*0.4,r*0.1,r*0.5,0,6.29);ctx.fill();
    ctx.beginPath();ctx.arc(r*0.4,r*0.1,r*0.5,0,6.29);ctx.fill();
    ctx.beginPath();ctx.arc(0,-r*0.3,r*0.55,0,6.29);ctx.fill();
    ctx.fillStyle='#E53935';
    ctx.beginPath();ctx.arc(-r*0.3,-r*0.1,r*0.1,0,6.29);ctx.fill();
    ctx.beginPath();ctx.arc(r*0.35,r*0.2,r*0.1,0,6.29);ctx.fill();
  }
  ctx.restore();
}

// ================= スポーン =================
function curCfg(){
  if(mode==='stage')return STAGES[stageIdx];
  // エンドレス：レベルで難度上昇
  const l=level;
  return{
    count:Math.min(8,3+Math.floor(l/2)),
    szMin:Math.max(0.06,0.13-l*0.006),szMax:Math.max(0.09,0.16-l*0.006),
    spMin:1.0+l*0.28,spMax:1.8+l*0.36,
    pts:10+l*4,fakes:Math.min(3,Math.floor(l/2)),
    bossHP:5+l,time:0,
  };
}
function fieldTop(){return H*0.2;}
function fieldBottom(){return H*0.9;}
function spawnAnimal(opts){
  opts=opts||{};
  const cfg=curCfg();
  const base=Math.min(W,H);
  let r=base*(cfg.szMin+Math.random()*(cfg.szMax-cfg.szMin))*0.5;
  if(opts.gold)r*=1.05;
  if(opts.boss)r=base*0.115;
  const sp=cfg.spMin+Math.random()*(cfg.spMax-cfg.spMin);
  const ang=Math.random()*6.28;
  const a={
    x:r+Math.random()*(W-2*r),
    y:fieldTop()+r+Math.random()*(fieldBottom()-fieldTop()-2*r),
    vx:Math.cos(ang)*sp,vy:Math.sin(ang)*sp,
    r:r,sp:SPECIES_LIST[(Math.random()*SPECIES_LIST.length)|0],
    wob:Math.random()*6.28,
    gold:!!opts.gold,fake:!!opts.fake,boss:!!opts.boss,
    hp:opts.boss?curCfg().bossHP:1,maxHp:opts.boss?curCfg().bossHP:1,
    changeT:60+Math.random()*90,
    life:opts.gold?260:Infinity, // ゴールドは約4秒で消える
    pop:0, // 出現アニメ
  };
  if(opts.boss){a.vx*=1.4;a.vy*=1.4;a.sp='bear';}
  animals.push(a);
  return a;
}
function maintainSpawn(){
  const cfg=curCfg();
  while(animals.filter(a=>!a.gold&&!a.fake&&!a.boss).length<cfg.count)spawnAnimal();
  while(animals.filter(a=>a.fake).length<cfg.fakes)spawnAnimal({fake:true});
}
function spawnBoss(){
  boss=spawnAnimal({boss:true});
  $('boss-hp').style.display='block';
  $('boss-hp-fill').style.width='100%';
  showBanner('👑 ボス とうじょう！','たくさん タップして たおせ！');
  sfx('boss');
}
function startRush(){
  rushDone=true;
  rushUntil=elapsed+6;
  rushSpawnT=0;
  $('rush-banner').classList.add('show');
  setTimeout(()=>$('rush-banner').classList.remove('show'),6000);
  sfx('rush');
}

// ================= メインループ =================
function loop(now){
  raf=requestAnimationFrame(loop);
  const dt=Math.min(0.05,(now-lastT)/1000);
  lastT=now;
  if(!gameRunning)return;
  elapsed+=dt;

  // エンドレス進行
  if(mode==='endless'){
    if(elapsed>=nextLevelAt){
      level++;nextLevelAt+=30;
      const themes=['meadow','desert','forest','snow','starry'];
      curTheme=themes[(level-1)%themes.length];
      initBg(curTheme);
      gameUIVisible(true);
      showBanner(`🔥 レベル ${level}！`,'どんどん はやくなる！');
      sfx('level');
    }
    if(elapsed>=nextBossAt&&!boss){nextBossAt=elapsed+45;spawnBoss();}
    if(score>=nextRushScore&&elapsed>=rushUntil){nextRushScore+=400;startRush();}
  }

  // ラッシュ中スポーン
  if(elapsed<rushUntil){
    rushSpawnT-=dt;
    if(rushSpawnT<=0){
      rushSpawnT=0.35;
      if(animals.filter(a=>a.gold).length<6)spawnAnimal({gold:true});
    }
  }
  maintainSpawn();

  // コンボ期限
  if(combo>0&&elapsed>comboExpire){combo=0;updateCombo();}

  // 動物更新
  for(let i=animals.length-1;i>=0;i--){
    const a=animals[i];
    a.wob+=dt*4;
    a.pop=Math.min(1,a.pop+dt*4);
    a.changeT-=dt*60;
    if(a.changeT<=0){
      a.changeT=60+Math.random()*90;
      const sp=Math.hypot(a.vx,a.vy);
      const ang=Math.random()*6.28;
      a.vx=Math.cos(ang)*sp;a.vy=Math.sin(ang)*sp;
    }
    a.x+=a.vx;a.y+=a.vy;
    if(a.x<a.r){a.x=a.r;a.vx=Math.abs(a.vx);}
    if(a.x>W-a.r){a.x=W-a.r;a.vx=-Math.abs(a.vx);}
    if(a.y<fieldTop()+a.r){a.y=fieldTop()+a.r;a.vy=Math.abs(a.vy);}
    if(a.y>fieldBottom()-a.r){a.y=fieldBottom()-a.r;a.vy=-Math.abs(a.vy);}
    if(a.gold){a.life--;if(a.life<=0){animals.splice(i,1);continue;}}
  }

  // パーティクル
  for(let i=particles.length-1;i>=0;i--){
    const p=particles[i];
    p.x+=p.vx;p.y+=p.vy;p.vy+=0.15;p.life-=dt;
    if(p.life<=0)particles.splice(i,1);
  }
  for(let i=floats.length-1;i>=0;i--){
    const f=floats[i];f.y-=0.8;f.life-=dt;
    if(f.life<=0)floats.splice(i,1);
  }
  for(let i=rings.length-1;i>=0;i--){
    const rg=rings[i];rg.r+=3.2;rg.life-=dt;
    if(rg.life<=0)rings.splice(i,1);
  }
  for(let i=shots.length-1;i>=0;i--){
    const s=shots[i];
    s.prog=Math.min(1,s.prog+dt*9);  // 約0.11秒で着弾
    s.life-=dt;
    if(s.life<=0)shots.splice(i,1);
  }
  if(shakeT>0)shakeT-=dt;

  draw(now);
  updateComboGauge();
}

function draw(now){
  ctx.setTransform(1,0,0,1,0,0);
  if(shakeT>0){
    ctx.setTransform(1,0,0,1,(Math.random()-0.5)*8,(Math.random()-0.5)*8);
  }
  drawBG(now);
  // 動物（ボスは最後＝最前面）
  animals.forEach(a=>{
    if(a.boss)return;
    const r=a.r*(0.4+0.6*a.pop);
    if(a.fake)drawFake(a.x,a.y,r,FAKE_KIND[curTheme],a.wob);
    else drawAnimal(a.x,a.y,r,a.sp,a.wob,a.gold,false,1);
  });
  animals.forEach(a=>{
    if(!a.boss)return;
    drawAnimal(a.x,a.y,a.r*(0.4+0.6*a.pop),a.sp,a.wob,false,true,a.hp/a.maxHp);
  });
  // 弾道トレーサー
  shots.forEach(s=>{
    const hx=s.x1+(s.x2-s.x1)*s.prog;
    const hy=s.y1+(s.y2-s.y1)*s.prog;
    const tail=Math.max(0,s.prog-0.45);
    const tx=s.x1+(s.x2-s.x1)*tail;
    const ty=s.y1+(s.y2-s.y1)*tail;
    const a=Math.max(0,s.life*3.4);
    // 光の帯
    const lg=ctx.createLinearGradient(tx,ty,hx,hy);
    lg.addColorStop(0,`rgba(255,220,120,0)`);
    lg.addColorStop(1,`rgba(255,240,180,${a})`);
    ctx.strokeStyle=lg;
    ctx.lineWidth=4;ctx.lineCap='round';
    ctx.beginPath();ctx.moveTo(tx,ty);ctx.lineTo(hx,hy);ctx.stroke();
    ctx.strokeStyle=`rgba(255,255,255,${a})`;
    ctx.lineWidth=1.6;
    ctx.beginPath();ctx.moveTo(tx,ty);ctx.lineTo(hx,hy);ctx.stroke();
    // 弾頭グロー
    ctx.fillStyle=`rgba(255,250,200,${a})`;
    ctx.beginPath();ctx.arc(hx,hy,3.5,0,6.29);ctx.fill();
    // マズルフラッシュ（発射直後のみ）
    if(s.prog<0.35){
      const ma=(0.35-s.prog)*2.6;
      ctx.fillStyle=`rgba(255,230,140,${ma})`;
      ctx.beginPath();ctx.arc(s.x1,s.y1,10+s.prog*20,0,6.29);ctx.fill();
      ctx.fillStyle=`rgba(255,255,255,${ma})`;
      ctx.beginPath();ctx.arc(s.x1,s.y1,5,0,6.29);ctx.fill();
    }
    // 着弾スパーク
    if(s.prog>=1){
      const ia=Math.max(0,s.life*3.4);
      ctx.strokeStyle=`rgba(255,240,160,${ia})`;
      ctx.lineWidth=2;
      for(let k=0;k<6;k++){
        const ang=k*1.047+s.seed;
        ctx.beginPath();
        ctx.moveTo(s.x2+Math.cos(ang)*4,s.y2+Math.sin(ang)*4);
        ctx.lineTo(s.x2+Math.cos(ang)*11,s.y2+Math.sin(ang)*11);
        ctx.stroke();
      }
    }
  });
  // リング（照準）
  rings.forEach(rg=>{
    ctx.strokeStyle=`rgba(255,255,255,${rg.life*2})`;
    ctx.lineWidth=3;
    ctx.beginPath();ctx.arc(rg.x,rg.y,rg.r,0,6.29);ctx.stroke();
    ctx.strokeStyle=`rgba(255,215,0,${rg.life*2})`;
    ctx.lineWidth=1.5;
    ctx.beginPath();
    ctx.moveTo(rg.x-rg.r-6,rg.y);ctx.lineTo(rg.x-rg.r+4,rg.y);
    ctx.moveTo(rg.x+rg.r-4,rg.y);ctx.lineTo(rg.x+rg.r+6,rg.y);
    ctx.moveTo(rg.x,rg.y-rg.r-6);ctx.lineTo(rg.x,rg.y-rg.r+4);
    ctx.moveTo(rg.x,rg.y+rg.r-4);ctx.lineTo(rg.x,rg.y+rg.r+6);
    ctx.stroke();
  });
  // パーティクル
  particles.forEach(p=>{
    ctx.fillStyle=p.c.replace('%A',Math.max(0,p.life*2).toFixed(2));
    ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,6.29);ctx.fill();
  });
  // フロートテキスト
  ctx.textAlign='center';
  floats.forEach(f=>{
    ctx.font=`900 ${f.size}px 'M PLUS Rounded 1c',sans-serif`;
    ctx.fillStyle=f.c.replace('%A',Math.max(0,f.life*1.5).toFixed(2));
    ctx.fillText(f.txt,f.x,f.y);
  });
}

// ================= タップ =================
function onTap(e){
  if(!gameRunning)return;
  e.preventDefault();
  const rect=cv.getBoundingClientRect();
  let cx,cy;
  if(e.changedTouches&&e.changedTouches.length){
    cx=e.changedTouches[0].clientX-rect.left;cy=e.changedTouches[0].clientY-rect.top;
  }else{cx=e.clientX-rect.left;cy=e.clientY-rect.top;}
  rings.push({x:cx,y:cy,r:6,life:0.35});
  // 発射！画面下から弾が飛ぶ
  shots.push({
    x1:W/2+(Math.random()-0.5)*30, y1:H+8,
    x2:cx, y2:cy,
    prog:0, life:0.32, seed:Math.random()*6.28,
  });
  sfx('shot');

  // 最前面（後ろの要素）から判定、ボス優先
  let hit=null;
  for(let i=animals.length-1;i>=0;i--){
    const a=animals[i];
    if(Math.hypot(cx-a.x,cy-a.y)<=a.r*1.18){
      if(a.boss){hit=a;break;}
      if(!hit)hit=a;
    }
  }
  if(!hit){ // 空タップ
    if(elapsed>=rushUntil){ // ラッシュ中はノーペナルティ
      combo=0;updateCombo();
      addFloat(cx,cy,'ミス…','rgba(180,200,255,%A)',16);
    }
    sfx('miss');
    return;
  }
  if(hit.fake){
    lives--;combo=0;shakeT=0.25;
    updateHUD();updateCombo();
    addFloat(hit.x,hit.y-hit.r,'❤-1','rgba(255,90,90,%A)',22);
    burst(hit.x,hit.y,'rgba(120,200,120,%A)',8);
    sfx('bad');
    if(lives<=0)gameOver();
    return;
  }
  if(hit.boss){
    hit.hp--;
    $('boss-hp-fill').style.width=(hit.hp/hit.maxHp*100)+'%';
    combo++;comboExpire=elapsed+3;
    const m=multOf();
    const pts=30*m;
    score+=pts;
    burst(hit.x,hit.y,'rgba(255,120,80,%A)',12);
    addFloat(hit.x,hit.y-hit.r,'+'+pts,'rgba(255,180,60,%A)',20);
    shakeT=0.12;
    sfx('bosshit');
    if(hit.hp<=0){
      const bonus=200*(mode==='endless'?level:1);
      score+=bonus;
      animals.splice(animals.indexOf(hit),1);
      boss=null;bossDone=true;
      $('boss-hp').style.display='none';
      burst(hit.x,hit.y,'rgba(255,215,0,%A)',26);
      addFloat(hit.x,hit.y,'👑 +'+bonus,'rgba(255,215,0,%A)',26);
      showBanner('🎉 ボス げきは！',`ボーナス +${bonus}てん`);
      if(mode==='endless')nextBossAt=elapsed+45;
      sfx('bossdown');
    }
    updateHUD();updateCombo();
    return;
  }
  // 通常・ゴールド
  combo++;comboExpire=elapsed+3;
  const m=multOf();
  const base=hit.gold?50:curCfg().pts;
  const pts=base*m;
  score+=pts;
  animals.splice(animals.indexOf(hit),1);
  burst(hit.x,hit.y,hit.gold?'rgba(255,215,0,%A)':'rgba(255,160,120,%A)',hit.gold?18:10);
  addFloat(hit.x,hit.y-hit.r,'+'+pts,hit.gold?'rgba(255,215,0,%A)':'rgba(255,255,255,%A)',hit.gold?24:18);
  if(m>=2)addFloat(hit.x,hit.y+8,'コンボ x'+m,'rgba(255,140,80,%A)',13);
  sfx(hit.gold?'gold':'hit');
  updateHUD();updateCombo();
}
function multOf(){return combo>=15?4:combo>=10?3:combo>=5?2:1;}
function burst(x,y,c,n){
  for(let i=0;i<n;i++){
    const a=Math.random()*6.28,s=1.5+Math.random()*3;
    particles.push({x:x,y:y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-1,r:2+Math.random()*3,c:c,life:0.5+Math.random()*0.3});
  }
}
function addFloat(x,y,txt,c,size){floats.push({x:x,y:y,txt:txt,c:c,size:size,life:0.9});}

// ================= HUD =================
function updateHUD(){
  $('hud-score').textContent='🎯 '+score;
  $('hud-lives').textContent='❤️'.repeat(Math.max(0,lives))+'🤍'.repeat(Math.max(0,3-lives));
}
function updateTimerBar(){
  if(mode!=='stage')return;
  const st=STAGES[stageIdx];
  const p=Math.max(0,timeLeft/st.time*100);
  $('timer-fill').style.width=p+'%';
  $('timer-fill').style.background=p<25?'linear-gradient(90deg,#EF5350,#FF8A80)':'linear-gradient(90deg,#66BB6A,#AED581)';
}
function updateCombo(){
  const box=$('combo-box');
  if(combo<2){box.style.display='none';return;}
  box.style.display='block';
  $('combo-label').textContent='コンボ '+combo;
  $('combo-mult').textContent='x'+multOf();
}
function updateComboGauge(){
  if(combo<2)return;
  const rest=Math.max(0,comboExpire-elapsed)/3;
  $('combo-fill').style.width=(rest*100)+'%';
}
function showBanner(main,sub){
  const el=$('stage-banner');
  el.innerHTML=`<div style="font-size:27px;font-weight:900;color:#fff;text-shadow:0 2px 0 rgba(0,0,0,0.3),0 4px 12px rgba(0,0,0,0.4);white-space:nowrap;">${main}</div>
    <div style="font-size:16px;font-weight:800;color:#FFD700;text-shadow:0 2px 6px rgba(0,0,0,0.5);margin-top:4px;">${sub}</div>`;
  el.classList.add('show');
  clearTimeout(showBanner._t);
  showBanner._t=setTimeout(()=>el.classList.remove('show'),1700);
}

// ================= 終了処理 =================
function stopGame(){
  gameRunning=false;
  clearInterval(timerIv);
  if(raf)cancelAnimationFrame(raf);raf=null;
  $('boss-hp').style.display='none';
  $('rush-banner').classList.remove('show');
  $('combo-box').style.display='none';
}
function stageEnd(){
  stopGame();
  const st=STAGES[stageIdx];
  let stars=1;
  if(score>=st.s2)stars=2;
  if(score>=st.s3)stars=3;
  if(stars>prog.stars[stageIdx]){prog.stars[stageIdx]=stars;saveProg();}
  sfx('clear');
  if(stageIdx>=STAGES.length-1){
    $('ac-stars').textContent='★'.repeat(stars)+'☆'.repeat(3-stars);
    $('ac-sub').innerHTML=`🎯 ${score}てん<br>きみは でんせつの ターゲットマスターだ！`;
    $('ac-ov').classList.add('show');
  }else{
    $('clear-title').textContent=`ステージ${stageIdx+1} クリア！`;
    $('clear-stars').textContent='★'.repeat(stars)+'☆'.repeat(3-stars);
    let sub=`🎯 ${score}てん`;
    if(stars<3)sub+=`<br><span style="font-size:12px;">★${stars+1}は ${stars===1?st.s2:st.s3}てん いじょう！</span>`;
    $('clear-sub').innerHTML=sub;
    $('clear-ov').classList.add('show');
  }
}
function gameOver(){
  stopGame();
  if(mode==='endless'&&score>prog.endlessHi){prog.endlessHi=score;saveProg();}
  const hiTxt=mode==='endless'
    ?`🎯 ${score}てん<br>🏅 さいこう：${prog.endlessHi}てん${score>=prog.endlessHi?'<br>✨しんきろく！✨':''}`
    :`ステージ${stageIdx+1}　🎯 ${score}てん`;
  $('go-sub').innerHTML=hiTxt;
  $('go-ov').classList.add('show');
  sfx('over');
}
function toMap(){
  stopGame();hideOverlays();
  buildMap();updateTitleStars();
  show('map');
  gameUIVisible(false);
  curTheme='meadow';
}

// ================= SFX =================
let audioCtx=null;
function ac(){
  if(!audioCtx){try{audioCtx=new(window.AudioContext||window.webkitAudioContext)();}catch(e){}}
  if(audioCtx&&audioCtx.state==='suspended')audioCtx.resume();
  return audioCtx;
}
function tone(freq,dur,type,vol,delay){
  const c=ac();if(!c)return;
  const o=c.createOscillator(),g=c.createGain();
  o.type=type||'sine';o.frequency.value=freq;
  g.gain.setValueAtTime(vol||0.12,c.currentTime+(delay||0));
  g.gain.exponentialRampToValueAtTime(0.001,c.currentTime+(delay||0)+dur);
  o.connect(g);g.connect(c.destination);
  o.start(c.currentTime+(delay||0));o.stop(c.currentTime+(delay||0)+dur);
}
function sfx(kind){
  try{
    if(kind==='shot'){tone(1400,0.06,'square',0.05);tone(500,0.08,'sawtooth',0.04,0.01);}
    else if(kind==='hit'){tone(660,0.1,'square',0.08);tone(880,0.12,'square',0.06,0.05);}
    else if(kind==='gold'){tone(880,0.1,'sine',0.1);tone(1100,0.1,'sine',0.1,0.07);tone(1320,0.16,'sine',0.1,0.14);}
    else if(kind==='miss'){tone(220,0.12,'sine',0.05);}
    else if(kind==='bad'){tone(160,0.25,'sawtooth',0.09);tone(120,0.3,'sawtooth',0.07,0.1);}
    else if(kind==='boss'){tone(110,0.4,'sawtooth',0.12);tone(146,0.4,'sawtooth',0.1,0.2);}
    else if(kind==='bosshit'){tone(330,0.09,'square',0.1);}
    else if(kind==='bossdown'){[523,659,784,1046].forEach((f,i)=>tone(f,0.2,'square',0.09,i*0.09));}
    else if(kind==='rush'){[784,988,1175,1568].forEach((f,i)=>tone(f,0.14,'sine',0.1,i*0.07));}
    else if(kind==='level'){tone(523,0.12,'square',0.09);tone(784,0.18,'square',0.09,0.1);}
    else if(kind==='clear'){[523,659,784,1046,1318].forEach((f,i)=>tone(f,0.22,'square',0.08,i*0.1));}
    else if(kind==='over'){[392,330,262].forEach((f,i)=>tone(f,0.3,'sine',0.08,i*0.15));}
  }catch(e){}
}

// ================= BGM (WakuwakuMP3BGM guard; action is fixed across stages) =================
let _bgm=null;
function startBGMIfOn(){
  try{
    if(typeof WakuwakuMP3BGM==='undefined')return;
    if(!_bgm)_bgm=new WakuwakuMP3BGM('action');
    if(WakuwakuMP3BGM.loadState()){_bgm.start();$('ui-bgm-btn').textContent='🔊';}
    else $('ui-bgm-btn').textContent='🔇';
  }catch(e){}
}
function toggleCommonBGM(){
  try{
    if(typeof WakuwakuMP3BGM==='undefined')return;
    if(!_bgm)_bgm=new WakuwakuMP3BGM('action');
    const on=!_bgm.enabled;
    if(on)_bgm.start();else _bgm.stop();
    WakuwakuMP3BGM.saveState(on);
    $('ui-bgm-btn').textContent=on?'🔊':'🔇';
  }catch(e){}
}

// ================= もどる =================
function goBack(){
  try{if(_bgm)_bgm.stop();}catch(e){}
  if(window.parent!==window)window.parent.postMessage({type:'goBack'},'*');
}

// ================= 初期化 =================
function init(){
  W=window.innerWidth;H=window.innerHeight;
  cv.width=W;cv.height=H;
  initBg('meadow');
  updateTitleStars();
  $('back-btn').addEventListener('click',goBack);
  $('ui-bgm-btn').addEventListener('click',toggleCommonBGM);
  $('ts-btn').addEventListener('click',()=>{show('map');buildMap();startBGMIfOn();});
  $('map-back').addEventListener('click',()=>{show('ts');updateTitleStars();});
  $('clear-next').addEventListener('click',()=>{hideOverlays();startGame('stage',stageIdx+1);});
  $('clear-map').addEventListener('click',toMap);
  $('go-retry').addEventListener('click',()=>{hideOverlays();startGame(mode,stageIdx);});
  $('go-map').addEventListener('click',toMap);
  $('ac-endless').addEventListener('click',()=>{hideOverlays();startGame('endless',0);});
  $('ac-map').addEventListener('click',toMap);
  cv.addEventListener('touchstart',onTap,{passive:false});
  cv.addEventListener('mousedown',onTap);
  window.addEventListener('resize',()=>{
    W=window.innerWidth;H=window.innerHeight;
    cv.width=W;cv.height=H;initBg(curTheme);
  });
  try{
    if(typeof WakuwakuMP3BGM!=='undefined'&&!WakuwakuMP3BGM.loadState())$('ui-bgm-btn').textContent='🔇';
  }catch(e){}
}
init();
</script>
