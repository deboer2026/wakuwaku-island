<!DOCTYPE html>
<html lang="ja">
<head>
<script src="/games/wakuwaku_ui.js"></script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>いろまぜこうぼう 3D</title>
<link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@700;800;900&family=DotGothic16&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{width:100%;height:100%;overflow:hidden;font-family:'M PLUS Rounded 1c',sans-serif;user-select:none;-webkit-user-select:none;}
body{background:linear-gradient(180deg,#8FD3F4 0%,#C9E7F7 55%,#FDE9D0 100%);}
#wrap{position:fixed;inset:0;overflow:hidden;}
#cv{display:block;position:absolute;inset:0;width:100%;height:100%;z-index:0;touch-action:none;}

/* ============ shared UI atoms ============ */
.btn{font-family:'M PLUS Rounded 1c',sans-serif;font-weight:900;border:none;cursor:pointer;
  transition:transform .12s ease,filter .12s ease;}
.btn:active{transform:scale(.94);filter:brightness(1.1);}
.pill{background:rgba(24,16,52,.62);color:#fff;border:2px solid rgba(255,255,255,.34);
  border-radius:999px;backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);}
.dot{font-family:'DotGothic16',monospace;}

.rainbow-text{
  background:linear-gradient(92deg,#FF5B6E,#FF9F43,#FFE066,#5BD98A,#4FC3F7,#B57BFF,#FF5B6E);
  background-size:280% 100%;
  -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;color:transparent;
  animation:rbSlide 6s linear infinite;
  filter:drop-shadow(2px 3px 0 rgba(40,10,70,.5));
}
@keyframes rbSlide{0%{background-position:0 0}100%{background-position:280% 0}}

/* ============ HUD ============ */
#hud{position:fixed;top:0;left:0;right:0;z-index:60;display:none;
  padding:max(10px,var(--sat,0px)) max(12px,var(--sar,0px)) 8px max(12px,var(--sal,0px));
  background:linear-gradient(180deg,rgba(30,18,60,.72) 0%,rgba(30,18,60,.34) 62%,transparent 100%);
  pointer-events:none;}
#hud .row{display:flex;align-items:center;gap:8px;pointer-events:auto;}
#hud-back{padding:6px 15px;font-size:13px;}
#hud-bgm{width:36px;height:36px;font-size:15px;display:flex;align-items:center;justify-content:center;padding:0;}
#hud-spacer{flex:1;}
#hud-chips{display:flex;gap:7px;justify-content:center;margin-top:7px;pointer-events:none;flex-wrap:wrap;}
.chip{background:rgba(24,16,52,.66);border:2px solid rgba(255,255,255,.28);border-radius:12px;
  padding:3px 11px;display:flex;align-items:center;gap:6px;}
.chip-l{font-size:9px;font-weight:900;color:rgba(255,255,255,.6);letter-spacing:.5px;}
.chip-v{font-size:15px;font-weight:900;color:#FFE066;}
.chip-v.small{font-size:13px;}

/* ============ screens ============ */
.screen{position:fixed;inset:0;z-index:80;display:none;flex-direction:column;align-items:center;
  overflow-x:hidden;
  padding:calc(max(18px,var(--sat,0px))) 16px calc(max(18px,var(--sab,0px)) + 8px);
  overflow-y:auto;-webkit-overflow-scrolling:touch;}
.screen.show{display:flex;}
.screen-scrim{background:linear-gradient(180deg,rgba(22,12,46,.55),rgba(22,12,46,.82));
  backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);}

/* ---- title (hero) ---- */
#sc-title{justify-content:space-between;padding-top:calc(max(58px,var(--sat,0px) + 50px));}
#title-top{width:100%;display:flex;flex-direction:column;align-items:center;position:relative;}

.ribbon{position:relative;z-index:3;font-size:11px;font-weight:900;letter-spacing:5px;
  color:#4A2A86;background:linear-gradient(180deg,#FFF6D8,#FFE39B);
  border:2.5px solid #fff;border-radius:999px;padding:4px 16px 4px 21px;
  box-shadow:0 4px 0 rgba(90,45,20,.35),0 8px 18px rgba(0,0,0,.35);margin-bottom:10px;}

.logo-wrap{position:relative;display:flex;flex-direction:column;align-items:center;}
.logo-splat{position:absolute;width:min(320px,88vw);height:min(320px,88vw);top:46%;left:50%;
  transform:translate(-50%,-50%);z-index:0;opacity:.92;
  animation:splatSpin 34s linear infinite;pointer-events:none;}
@keyframes splatSpin{to{transform:translate(-50%,-50%) rotate(360deg)}}

.lg{position:relative;z-index:2;font-family:'DotGothic16',monospace;line-height:.94;
  font-size:52px;letter-spacing:1px;}
.lg + .lg{margin-top:2px;}
.lg .b,.lg .f{display:block;white-space:nowrap;}
.lg .b{-webkit-text-stroke:12px #331567;color:#331567;
  text-shadow:0 8px 0 #5B2E9E,0 14px 24px rgba(0,0,0,.55);}
.lg .f{position:absolute;left:0;top:0;right:0;
  background:linear-gradient(180deg,#FFFBE6 0%,#FFE066 30%,#FFA83D 58%,#FF6A7A 84%,#E8497F 100%);
  -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;color:transparent;}

.logo-drips{position:relative;z-index:2;margin-top:-6px;width:250px;height:26px;}
.logo-3d{position:absolute;z-index:4;right:-8px;top:-14px;
  font-family:'DotGothic16',monospace;font-size:20px;color:#fff;
  background:linear-gradient(160deg,#FF6A7A,#D6246B);border:3px solid #fff;border-radius:12px;
  padding:2px 9px 3px;transform:rotate(9deg);
  box-shadow:0 4px 0 rgba(120,10,60,.6),0 8px 16px rgba(0,0,0,.4);}
.tw{position:absolute;z-index:3;pointer-events:none;animation:twk 2.4s ease-in-out infinite;}
@keyframes twk{0%,100%{transform:scale(.55);opacity:.45}50%{transform:scale(1.15);opacity:1}}

#title-bottom{width:100%;display:flex;flex-direction:column;align-items:center;gap:11px;
  padding-bottom:4px;}
.sp-badge{display:flex;align-items:center;gap:8px;background:rgba(20,10,44,.62);
  border:2.5px solid rgba(255,255,255,.4);border-radius:999px;padding:5px 14px;
  backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);}
.sp-dots{display:flex;gap:3px;}
.sp-dots i{width:7px;height:7px;border-radius:50%;display:block;}
.sp-l{font-size:10px;font-weight:900;color:rgba(255,255,255,.72);}
.sp-v{font-size:14px;font-weight:900;color:#FFE066;}

#start-wrap{position:relative;width:min(80%,300px);display:flex;justify-content:center;}
#start-ring{position:absolute;inset:-6px;border-radius:32px;border:4px solid rgba(255,224,102,.85);
  animation:ringPulse 1.8s ease-out infinite;pointer-events:none;}
@keyframes ringPulse{0%{transform:scale(.94);opacity:.85}100%{transform:scale(1.14);opacity:0}}
#btn-start{position:relative;width:100%;padding:15px 10px 18px;border-radius:26px;
  font-family:'DotGothic16',monospace;font-size:29px;color:#fff;letter-spacing:2px;
  background:linear-gradient(180deg,#FFB93A 0%,#FF8330 52%,#EF5B18 100%);
  border:4px solid #fff;box-shadow:0 8px 0 #A93A0C,0 15px 28px rgba(0,0,0,.45);
  text-shadow:0 3px 0 rgba(140,50,10,.7);overflow:hidden;
  animation:startBob 1.7s ease-in-out infinite;}
#btn-start::before{content:'';position:absolute;left:7%;right:7%;top:6px;height:34%;border-radius:16px;
  background:linear-gradient(180deg,rgba(255,255,255,.6),rgba(255,255,255,0));pointer-events:none;}
@keyframes startBob{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
#btn-start:active{animation:none;transform:translateY(6px);
  box-shadow:0 2px 0 #A93A0C,0 6px 14px rgba(0,0,0,.4);}

.round-row{display:flex;gap:12px;}
.round-btn{display:flex;flex-direction:column;align-items:center;gap:3px;
  background:rgba(20,10,44,.6);border:3px solid rgba(255,255,255,.42);border-radius:20px;
  padding:8px 15px 7px;color:#fff;box-shadow:0 5px 0 rgba(0,0,0,.32);
  backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);}
.round-btn svg{width:24px;height:24px;display:block;}
.round-btn span{font-size:11px;font-weight:900;}

/* ---- mode select ---- */
.mode-btn{width:100%;display:flex;align-items:center;gap:11px;text-align:left;
  border-radius:20px;padding:11px 12px;margin-bottom:11px;color:#fff;position:relative;overflow:hidden;
  border:3.5px solid rgba(255,255,255,.55);box-shadow:0 6px 0 rgba(0,0,0,.32),0 10px 22px rgba(0,0,0,.3);}
.mode-btn::before{content:'';position:absolute;left:0;right:0;top:0;height:42%;
  background:linear-gradient(180deg,rgba(255,255,255,.34),rgba(255,255,255,0));pointer-events:none;}
.mode-btn .mi{width:50px;height:50px;flex:0 0 50px;border-radius:15px;
  background:rgba(255,255,255,.26);border:2.5px solid rgba(255,255,255,.5);
  display:flex;align-items:center;justify-content:center;position:relative;z-index:1;}
.mode-btn .mi svg{width:36px;height:36px;display:block;}
.mode-btn .mtx{flex:1;min-width:0;position:relative;z-index:1;}
.mode-btn .mt{display:block;font-size:17px;font-weight:900;line-height:1.2;
  text-shadow:0 2px 3px rgba(0,0,0,.35);}
.mode-btn .md{display:block;font-size:10.5px;opacity:.94;line-height:1.4;margin-top:2px;}
.mbar{display:block;height:7px;border-radius:99px;background:rgba(0,0,0,.28);margin-top:6px;overflow:hidden;}
.mbar i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,#FFE066,#FFF6C9);}
.mode-btn .mp{position:relative;z-index:1;text-align:center;font-size:11px;font-weight:900;
  background:rgba(0,0,0,.32);border-radius:11px;padding:5px 8px;line-height:1.35;white-space:nowrap;}
.mode-btn .mp b{font-size:14px;display:block;}

/* ---- stage select ---- */
.sheet{width:100%;max-width:380px;background:linear-gradient(165deg,rgba(48,24,92,.95),rgba(26,13,54,.97));
  border:3.5px solid rgba(181,123,255,.75);border-radius:24px;padding:16px 15px 18px;
  box-shadow:0 12px 40px rgba(0,0,0,.5);margin:auto 0;}
.sheet-h{font-size:20px;font-weight:900;color:#fff;text-align:center;margin-bottom:3px;}
.sheet-s{font-size:11.5px;color:rgba(255,255,255,.72);text-align:center;margin-bottom:13px;line-height:1.6;}
.stage-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:9px;}
.st-btn{aspect-ratio:1;border-radius:16px;display:flex;flex-direction:column;align-items:center;
  justify-content:center;gap:2px;border:3px solid rgba(255,255,255,.4);color:#fff;
  box-shadow:0 4px 0 rgba(0,0,0,.28);position:relative;overflow:hidden;}
.st-btn .sn{font-size:19px;font-weight:900;line-height:1;}
.st-btn .ss{font-size:9px;letter-spacing:.5px;line-height:1;}
.st-btn.locked{background:rgba(255,255,255,.09)!important;border-color:rgba(255,255,255,.18);
  color:rgba(255,255,255,.34);box-shadow:none;}
.st-btn .lk{width:17px;height:17px;}
.back-wide{width:100%;margin-top:14px;border-radius:15px;padding:11px;font-size:14px;color:#fff;
  background:rgba(255,255,255,.15);border:2.5px solid rgba(255,255,255,.34);}

/* ---- play: bottom control dock ---- */
#dock{position:fixed;left:0;right:0;bottom:0;z-index:55;display:none;
  padding:8px max(10px,var(--sar,0px)) calc(max(10px,var(--sab,0px))) max(10px,var(--sal,0px));
  background:linear-gradient(0deg,rgba(28,16,56,.92) 0%,rgba(28,16,56,.72) 58%,transparent 100%);}
#dock-inner{max-width:440px;margin:0 auto;}

#target-bar{display:flex;align-items:center;gap:9px;justify-content:center;margin-bottom:8px;
  background:rgba(18,10,40,.7);border:2.5px solid rgba(255,255,255,.28);border-radius:16px;padding:6px 11px;}
#target-swatch{width:38px;height:38px;border-radius:11px;flex:0 0 38px;border:3px solid rgba(255,255,255,.85);
  box-shadow:0 3px 9px rgba(0,0,0,.45),inset 0 -5px 10px rgba(0,0,0,.16);}
#target-txt{flex:1;min-width:0;}
#target-lbl{font-size:9.5px;font-weight:900;color:rgba(255,255,255,.6);letter-spacing:1px;}
#target-name{font-size:18px;font-weight:900;color:#fff;line-height:1.2;}
#target-hint{font-size:10px;color:#FFE066;font-weight:800;margin-top:1px;min-height:12px;}

#drops-row{display:flex;align-items:center;justify-content:center;gap:6px;margin-bottom:8px;min-height:26px;}
.dslot{width:22px;height:22px;border-radius:50%;border:2.5px dashed rgba(255,255,255,.35);
  background:rgba(255,255,255,.05);transition:transform .18s ease;}
.dslot.on{border-style:solid;border-color:rgba(255,255,255,.9);
  box-shadow:0 0 10px rgba(255,255,255,.5),inset 0 -4px 7px rgba(0,0,0,.2);transform:scale(1.14);}

#paints{display:flex;justify-content:center;gap:8px;margin-bottom:9px;flex-wrap:wrap;}
.paint{width:60px;border-radius:16px;padding:7px 3px 6px;color:#fff;
  border:3px solid rgba(255,255,255,.5);box-shadow:0 5px 0 rgba(0,0,0,.3);
  display:flex;flex-direction:column;align-items:center;gap:3px;background:rgba(255,255,255,.1);}
.paint .pblob{width:30px;height:30px;border-radius:50%;border:2.5px solid rgba(255,255,255,.8);
  box-shadow:inset 0 -6px 9px rgba(0,0,0,.24),0 2px 6px rgba(0,0,0,.3);}
.paint .pnm{font-size:11px;font-weight:900;text-shadow:0 2px 3px rgba(0,0,0,.5);}
.paint.hint{animation:hintPulse .8s ease-in-out infinite;}
@keyframes hintPulse{0%,100%{box-shadow:0 5px 0 rgba(0,0,0,.3),0 0 0 0 rgba(255,224,102,.85);}
  50%{box-shadow:0 5px 0 rgba(0,0,0,.3),0 0 0 11px rgba(255,224,102,0);}}
.paint.dim{opacity:.42;}

#act-row{display:flex;gap:8px;}
.act{flex:1;border-radius:17px;padding:12px 6px;font-size:16px;color:#fff;
  border:3px solid rgba(255,255,255,.5);box-shadow:0 5px 0 rgba(0,0,0,.3);}
#act-mix{background:linear-gradient(160deg,#FF8A3D,#F4511E);}
#act-mix:disabled{background:rgba(255,255,255,.13);border-color:rgba(255,255,255,.2);
  color:rgba(255,255,255,.35);box-shadow:none;}
#act-reset{flex:0 0 108px;background:linear-gradient(160deg,#7E57C2,#5E35B1);font-size:14px;}

/* ---- floating toast (fairy speech) ---- */
#toast{position:fixed;left:50%;transform:translateX(-50%) translateY(10px);z-index:70;
  top:calc(max(76px,var(--sat,0px) + 66px));opacity:0;pointer-events:none;transition:opacity .25s,transform .25s;
  max-width:82vw;}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
#toast .bub{background:rgba(255,255,255,.96);color:#3B2560;border:3px solid #B57BFF;border-radius:18px;
  padding:8px 15px;font-size:14px;font-weight:900;text-align:center;line-height:1.45;
  box-shadow:0 8px 22px rgba(0,0,0,.34);}

/* ---- result overlay ---- */
#sc-result{justify-content:center;}
.res-card{width:100%;max-width:340px;text-align:center;
  background:linear-gradient(160deg,rgba(56,28,102,.96),rgba(28,14,58,.98));
  border:4px solid #FFE066;border-radius:26px;padding:18px 20px 20px;
  box-shadow:0 0 44px rgba(255,224,102,.28),0 14px 40px rgba(0,0,0,.55);}
.res-h{font-size:26px;font-weight:900;margin-bottom:6px;}
.stars{display:flex;justify-content:center;gap:5px;margin:6px 0 10px;}
.stars svg{width:44px;height:44px;animation:starPop .45s cubic-bezier(.3,1.6,.5,1) backwards;}
@keyframes starPop{0%{transform:scale(0) rotate(-40deg);opacity:0}100%{transform:scale(1) rotate(0);opacity:1}}
.res-got{background:rgba(255,255,255,.1);border:2.5px solid rgba(255,255,255,.28);border-radius:16px;
  padding:9px 10px;margin-bottom:12px;}
.res-got-l{font-size:10px;font-weight:900;color:rgba(255,255,255,.62);letter-spacing:1px;margin-bottom:6px;}
.got-row{display:flex;justify-content:center;gap:8px;flex-wrap:wrap;}
.got-one{display:flex;flex-direction:column;align-items:center;gap:2px;animation:starPop .45s cubic-bezier(.3,1.6,.5,1) backwards;}
.got-one .gb{width:34px;height:34px;border-radius:50%;border:2.5px solid #fff;
  box-shadow:0 0 12px rgba(255,255,255,.5),inset 0 -6px 9px rgba(0,0,0,.2);}
.got-one .gn{font-size:9.5px;font-weight:900;color:#fff;}
.res-btns{display:flex;gap:8px;}
.res-btn{flex:1;border-radius:16px;padding:12px 6px;font-size:14.5px;color:#fff;
  border:3px solid rgba(255,255,255,.45);box-shadow:0 5px 0 rgba(0,0,0,.3);}

/* ---- album ---- */
.album-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;}
.al-cell{aspect-ratio:.86;border-radius:14px;background:rgba(255,255,255,.08);
  border:2.5px solid rgba(255,255,255,.2);display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:3px;padding:3px;}
.al-cell.got{background:rgba(255,255,255,.15);border-color:rgba(255,255,255,.55);}
.al-blob{width:30px;height:30px;border-radius:50%;position:relative;
  border:2.5px solid rgba(255,255,255,.85);box-shadow:inset 0 -6px 9px rgba(0,0,0,.22);}
.al-blob.q{background:rgba(255,255,255,.12)!important;border-color:rgba(255,255,255,.24);
  display:flex;align-items:center;justify-content:center;color:rgba(255,255,255,.4);
  font-size:15px;font-weight:900;box-shadow:none;}
.al-nm{font-size:8.5px;font-weight:900;color:#fff;text-align:center;line-height:1.15;}
.al-cell:not(.got) .al-nm{color:rgba(255,255,255,.3);}
.al-rc{font-size:7.5px;color:rgba(255,224,102,.85);font-weight:900;line-height:1;}

/* ---- howto ---- */
.ht-list{counter-reset:ht;}
.ht-item{display:flex;gap:10px;align-items:flex-start;margin-bottom:11px;}
.ht-no{flex:0 0 26px;height:26px;border-radius:50%;background:#B57BFF;color:#fff;
  font-size:13px;font-weight:900;display:flex;align-items:center;justify-content:center;}
.ht-tx{font-size:12.5px;color:rgba(255,255,255,.9);line-height:1.6;padding-top:3px;}

/* ---- loading / webgl fallback ---- */
#loading{position:fixed;inset:0;z-index:200;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:14px;
  background:linear-gradient(180deg,#3A1E6E,#1B0E38);}
#loading .lt{font-size:22px;font-weight:900;}
.spin{width:44px;height:44px;border-radius:50%;border:5px solid rgba(255,255,255,.18);
  border-top-color:#FFE066;animation:sp 1s linear infinite;}
@keyframes sp{to{transform:rotate(360deg)}}
#nogl{position:fixed;inset:0;z-index:210;display:none;flex-direction:column;align-items:center;
  justify-content:center;gap:12px;padding:26px;text-align:center;
  background:linear-gradient(180deg,#3A1E6E,#1B0E38);color:#fff;}
#nogl h2{font-size:20px;font-weight:900;}
#nogl p{font-size:13px;line-height:1.8;color:rgba(255,255,255,.82);}

@media (max-height:700px){
  #sc-title{padding-top:calc(max(44px,var(--sat,0px) + 38px));}
  .lg{font-size:44px;}
  .ribbon{font-size:10px;padding:3px 13px 3px 18px;margin-bottom:7px;}
  .logo-drips{width:212px;height:22px;}
  #btn-start{font-size:25px;padding:12px 10px 15px;}
  .round-btn{padding:6px 13px 5px;}
  #title-bottom{gap:9px;}
  .mode-btn{padding:9px 11px;margin-bottom:9px;}
  .mode-btn .mi{width:44px;height:44px;flex:0 0 44px;}
  .paint{width:54px;}
  .act{padding:10px 6px;font-size:15px;}
}
@media (max-height:580px){
  .lg{font-size:37px;}
  .logo-drips{width:180px;height:18px;}
  #btn-start{font-size:22px;padding:10px 10px 13px;}
  .sp-badge{padding:3px 11px;}
}
@media (max-width:340px){
  .paint{width:52px;}
  .paint .pblob{width:26px;height:26px;}
  .lg{font-size:42px;}
  .logo-drips{width:200px;}
  .round-btn span{font-size:10px;}
}
</style>
</head>
<body>
<div id="wrap">
  <canvas id="cv"></canvas>

  <!-- ===== HUD ===== -->
  <div id="hud">
    <div class="row">
<button id="hud-back" class="btn pill" data-ww-ui="back">もどる</button>
      <div id="hud-spacer"></div>
<button id="hud-bgm" class="btn pill" data-ww-ui="sound">♪</button>
    </div>
    <div id="hud-chips">
      <div class="chip"><span class="chip-l">ステージ</span><span class="chip-v" id="chip-stage">1</span></div>
      <div class="chip"><span class="chip-l">もんだい</span><span class="chip-v" id="chip-q">1/3</span></div>
      <div class="chip"><span class="chip-l">せいれい</span><span class="chip-v small" id="chip-col">0/24</span></div>
    </div>
  </div>

  <!-- ===== toast ===== -->
  <div id="toast"><div class="bub" id="toast-tx"></div></div>

  <!-- ===== bottom dock ===== -->
  <div id="dock">
    <div id="dock-inner">

function recipeKey(counts){
  const ks=BASE_ORDER.filter(k=>(counts[k]|0)>0);
  if(!ks.length)return '';
  let g=0;ks.forEach(k=>{g=gcd(g,counts[k]);});
  if(g<=0)return '';
  return ks.map(k=>k+(counts[k]/g)).join('');
}
const RECIPE_MAP={};
COLORS.forEach(c=>{RECIPE_MAP[recipeKey(c.rec)]=c;});

function countsOf(drops){const c={};drops.forEach(d=>{c[d]=(c[d]|0)+1;});return c;}
function recipeText(rec){
  return BASE_ORDER.filter(k=>rec[k]>0)
    .map(k=>BASE[k].name+(rec[k]>1?('×'+rec[k]):'')).join(' ＋ ');
}
/* approximate paint mix for unknown combinations (visual only) */
function approxMix(drops){
  if(!drops.length)return '#F3F0FA';
  let r=0,g=0,b=0;
  drops.forEach(d=>{const c=hex2rgb(BASE[d].hex);r+=c[0];g+=c[1];b+=c[2];});
  const n=drops.length;r/=n;g/=n;b/=n;
  const dark=1-Math.min(0.22,0.055*(n-1));
  return rgb2hex(r*dark,g*dark,b*dark);
}
/* live pot colour: canonical hex when the mix is a known colour */
function potHexFor(drops){
  if(!drops.length)return '#EFEAF7';
  const known=RECIPE_MAP[recipeKey(countsOf(drops))];
  return known?known.hex:approxMix(drops);
}

function blankSave(){
  const st={};MODES.forEach(m=>{st[m.id]=new Array(m.stages.length).fill(0);});
  return{schemaVersion:4,stars:st,spirits:{}};
}
function loadSave(){
  let p=null;
  try{const raw=SAFE_LS.getItem(SAVE_KEY);if(raw)p=JSON.parse(raw);}catch(e){p=null;}
  const out=blankSave();
  if(p&&typeof p==='object'){
    if(p.stars&&typeof p.stars==='object'){
      MODES.forEach(m=>{
        const src=p.stars[m.id];
        if(Array.isArray(src))for(let i=0;i<m.stages.length;i++){
          const v=Math.floor(Number(src[i]));
          out.stars[m.id][i]=(isFinite(v)&&v>0)?clamp(v,0,3):0;
        }
      });
    }
    if(p.spirits&&typeof p.spirits==='object'){
      COLORS.forEach(c=>{if(p.spirits[c.id])out.spirits[c.id]=true;});
    }
  }
  return out;
}

let _ac=null,_bgm=null;

function ac(){
  if(!_ac){try{_ac=new (window.AudioContext||window.webkitAudioContext)();}catch(e){}}
  if(_ac&&_ac.state==='suspended'){try{_ac.resume();}catch(e){}}
  return _ac;
}
function beep(f,t,dur,vol,wave){
  const c=ac();if(!c)return;
  try{
    const o=c.createOscillator(),g=c.createGain();
    o.type=wave||'sine';o.frequency.setValueAtTime(f,c.currentTime+t);
    g.gain.setValueAtTime(0,c.currentTime+t);
    g.gain.linearRampToValueAtTime(vol||0.14,c.currentTime+t+0.014);
    g.gain.exponentialRampToValueAtTime(0.0011,c.currentTime+t+dur);
    o.connect(g);g.connect(c.destination);
    o.start(c.currentTime+t);o.stop(c.currentTime+t+dur+0.05);
  }catch(e){}
}

    const k=a.dur<=0?1:clamp(a.t/a.dur,0,1);
    try{a.fn(k);}catch(e){}
    if(k>=1){anims.splice(i,1);if(a.done){try{a.done();}catch(e){}}}
  }
}
const easeOut=k=>1-Math.pow(1-k,3);
const easeIn =k=>k*k;
const easeInOut=k=>k<0.5?2*k*k:1-Math.pow(-2*k+2,2)/2;
const easeBack=k=>{const c=1.70158+1;return 1+c*Math.pow(k-1,3)+1.70158*Math.pow(k-1,2);};

function hasWebGL(){
  try{
    const c=document.createElement('canvas');
    return !!(window.WebGLRenderingContext&&(c.getContext('webgl')||c.getContext('experimental-webgl')));
  }catch(e){return false;}
}

/* ---------- material helpers ---------- */
function mat(color,rough,metal,flat){
  return new THREE.MeshStandardMaterial({color:new THREE.Color(color),
    roughness:rough===undefined?0.72:rough,metalness:metal===undefined?0.05:metal,flatShading:!!flat});
}
function glowMat(color,op){
  return new THREE.MeshBasicMaterial({color:new THREE.Color(color),transparent:true,
    opacity:op===undefined?0.85:op,blending:THREE.AdditiveBlending,depthWrite:false});
}
function mesh(geo,material,x,y,z){
  const m=new THREE.Mesh(geo,material);m.position.set(x||0,y||0,z||0);return m;
}
function shadowify(o,cast,receive){
  o.traverse(n=>{if(n.isMesh){n.castShadow=!!cast;n.receiveShadow=!!receive;}});
}

/* ---------- sky ---------- */
function buildSky(){
  const geo=new THREE.SphereGeometry(80,24,16);
  const material=new THREE.ShaderMaterial({
    side:THREE.BackSide,depthWrite:false,
    uniforms:{cTop:{value:new THREE.Color('#5FB6EE')},cMid:{value:new THREE.Color('#BFE6F7')},cBot:{value:new THREE.Color('#FFE3C0')}},
    vertexShader:'varying float vH;void main(){vec4 wp=modelMatrix*vec4(position,1.0);vH=normalize(wp.xyz).y;gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0);}',
    fragmentShader:'varying float vH;uniform vec3 cTop;uniform vec3 cMid;uniform vec3 cBot;void main(){float h=clamp(vH*0.5+0.5,0.0,1.0);vec3 c=mix(cBot,cMid,smoothstep(0.28,0.55,h));c=mix(c,cTop,smoothstep(0.55,0.95,h));gl_FragColor=vec4(c,1.0);}'
  });
  const m=new THREE.Mesh(geo,material);m.frustumCulled=false;return m;
}
function buildClouds(){
  const g=new THREE.Group();

/* floating colour motes */
function buildMotes(){

/* ---------- scene assembly ---------- */
function initScene(){
  const canvas=$('cv');
  renderer=new THREE.WebGLRenderer({canvas:canvas,antialias:true,alpha:false,powerPreference:'high-performance'});
  renderer.setPixelRatio(Math.min(window.devicePixelRatio||1,2));
  renderer.setSize(window.innerWidth,window.innerHeight,false);
  renderer.shadowMap.enabled=true;
  renderer.shadowMap.type=THREE.PCFSoftShadowMap;
  renderer.outputEncoding=THREE.sRGBEncoding;
  renderer.toneMapping=THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure=1.06;

  scene=new THREE.Scene();
  scene.fog=new THREE.Fog(0xCBE6F7,22,70);
  clock=new THREE.Clock();

  camera=new THREE.PerspectiveCamera(41,window.innerWidth/window.innerHeight,0.1,200);
  camera.position.set(0,4.55,9.0);
  camera.lookAt(0,1.30,-0.5);

  scene.add(buildSky());
  cloudGroup=buildClouds();scene.add(cloudGroup);
  motes=buildMotes();scene.add(motes);

  const hemi=new THREE.HemisphereLight(0xD5EEFF,0xFFD9A8,0.92);scene.add(hemi);
  const dir=new THREE.DirectionalLight(0xFFF6E4,1.0);
  dir.position.set(4.5,8.5,5);dir.castShadow=true;
  dir.shadow.mapSize.width=1024;dir.shadow.mapSize.height=1024;
  dir.shadow.camera.near=1;dir.shadow.camera.far=26;
  dir.shadow.camera.left=-7;dir.shadow.camera.right=7;
  dir.shadow.camera.top=7;dir.shadow.camera.bottom=-7;
  dir.shadow.bias=-0.0011;
  scene.add(dir);
  const fill=new THREE.DirectionalLight(0xBFD9FF,0.28);fill.position.set(-5,4,-4);scene.add(fill);

  scene.add(buildIsland());
  const pot=buildPot();scene.add(pot);scene.userData.pot=pot;
  pedestalGroup=buildPedestal();scene.add(pedestalGroup);

  /* bottles arranged in a fan in front of the pot */
  const angles=[-45,-22,0,22,45];
  BASE_ORDER.forEach((id,i)=>{
    const b=buildBottle(id);
    const a=angles[i]*M3,r=1.78;
    b.position.set(Math.sin(a)*r,0.17,Math.cos(a)*r);
    b.rotation.y=a;
    b.userData.home.copy(b.position);
    b.userData.homeRotY=a;
    scene.add(b);bottleMap[id]=b;
  });

  fairy=buildFairy();fairy.position.set(1.32,2.30,1.30);fairy.rotation.y=-0.62;
  shadowify(fairy,true,false);scene.add(fairy);

  customerAnchor=new THREE.Group();customerAnchor.position.set(-1.72,0.17,0.15);
  scene.add(customerAnchor);

  window.addEventListener('resize',onResize,false);
  onResize();

}
function onResize(){
  if(!renderer||!camera)return;
  const w=window.innerWidth,h=window.innerHeight;
  renderer.setPixelRatio(Math.min(window.devicePixelRatio||1,2));
  renderer.setSize(w,h,false);
  camera.aspect=w/h;
  /* keep the pot framed on tall/narrow phones */
  camera.fov=h/w>1.9?48:(h/w>1.55?44:41);
  camera.updateProjectionMatrix();
}

/* ---------- pot colour control ---------- */
function setPotColor(hex,instant){
  const target=new THREE.Color(hex);
  if(instant){
    potColor.copy(target);applyPotColor();return;
  }
  const from=potColor.clone();
  addAnim(0.42,k=>{potColor.copy(from).lerp(target,easeOut(k));applyPotColor();});
}
function applyPotColor(){
  if(!potLiquid)return;
  potLiquid.material.color.copy(potColor);
  potLiquid.material.emissive.copy(potColor).multiplyScalar(0.18);
  if(potGlow)potGlow.color.copy(potColor);
}

/* ---------- particles ---------- */
const bursts=[];
function burst(pos,hex,count,power,size,up){
  const n=count||14;
  const geo=new THREE.SphereGeometry(size||0.06,6,5);
  const material=new THREE.MeshStandardMaterial({color:new THREE.Color(hex),
    emissive:new THREE.Color(hex).multiplyScalar(0.5),roughness:0.3,transparent:true,opacity:1});
  const g=new THREE.Group();g.position.copy(pos);
  const parts=[];
  for(let i=0;i<n;i++){
    const m=new THREE.Mesh(geo,material);
    const a=Math.random()*Math.PI*2,el=rnd(0.2,1.3);
    const sp=(power||1.9)*rnd(0.5,1.15);
    parts.push({m:m,vx:Math.cos(a)*Math.cos(el)*sp,vy:Math.sin(el)*sp*(up===false?0.4:1.25),vz:Math.sin(a)*Math.cos(el)*sp});
    g.add(m);
  }
  scene.add(g);
  bursts.push({g:g,parts:parts,t:0,life:1.15,material:material,geo:geo});
}
function updateBursts(dt){
  for(let i=bursts.length-1;i>=0;i--){
    const b=bursts[i];b.t+=dt;
    const k=b.t/b.life;
    b.parts.forEach(p=>{
      p.vy-=5.2*dt;
      p.m.position.x+=p.vx*dt;p.m.position.y+=p.vy*dt;p.m.position.z+=p.vz*dt;
      p.m.scale.setScalar(Math.max(0.001,1-k));
    });
    b.material.opacity=Math.max(0,1-k);
    if(k>=1){
      scene.remove(b.g);b.geo.dispose();b.material.dispose();bursts.splice(i,1);
    }
  }
}
/* expanding ring */
function ring(pos,hex,maxR,dur){
  const geo=new THREE.TorusGeometry(0.2,0.035,8,30);
  const material=glowMat(hex,0.85);
  const m=new THREE.Mesh(geo,material);m.position.copy(pos);m.rotation.x=Math.PI/2;
  scene.add(m);
  addAnim(dur||0.7,k=>{
    const s=lerp(0.4,(maxR||3.2),easeOut(k));
    m.scale.setScalar(s);material.opacity=0.85*(1-k);
  },()=>{scene.remove(m);geo.dispose();material.dispose();});
}

const GRAY='#B9BEC7';
function paintPart(geo,x,y,z){
  const m=new THREE.Mesh(geo,new THREE.MeshStandardMaterial({color:new THREE.Color(GRAY),
    roughness:0.55,metalness:0.06}));
  m.position.set(x||0,y||0,z||0);
  m.castShadow=true;m.userData.paintable=true;
  return m;
}
function fixedPart(geo,color,x,y,z){
  const m=new THREE.Mesh(geo,mat(color,0.75,0.03));
  m.position.set(x||0,y||0,z||0);m.castShadow=true;return m;
}

function objectPaintables(g){
  const out=[];g.traverse(n=>{if(n.isMesh&&n.userData.paintable)out.push(n);});
  return out;
}
function setObjectColor(g,hex,instant){
  const parts=objectPaintables(g);
  const to=new THREE.Color(hex);
  if(instant){parts.forEach(p=>{p.material.color.copy(to);p.material.emissive.setRGB(0,0,0);});return;}
  const from=parts.map(p=>p.material.color.clone());
  addAnim(0.75,k=>{
    const e=easeOut(k);
    parts.forEach((p,i)=>{
      p.material.color.copy(from[i]).lerp(to,e);
      const fl=Math.sin(k*Math.PI)*0.35;
      p.material.emissive.copy(to).multiplyScalar(fl);
    });
  },()=>{parts.forEach(p=>p.material.emissive.setRGB(0,0,0));});
}

  g.add(mesh(new THREE.SphereGeometry(0.04,8,6),mat(def.id==='buta'?'#E88BA0':'#5D4037',0.6,0),0,0.82,0.35));
  const blush=new THREE.MeshStandardMaterial({color:0xFF9EB5,roughness:0.9,transparent:true,opacity:0.6});
  g.add(mesh(new THREE.SphereGeometry(0.055,8,6),blush,-0.24,0.82,0.2));

  for(let s=-1;s<=1;s+=2){
    const a=mesh(new THREE.SphereGeometry(0.1,10,8),bodyM,s*0.34,0.36,0.06);

}

/* ---------- pedestal object ---------- */
function clearObject(){
  if(G.curObj){disposeDynamic3D(G.curObj);G.curObj=null;}
}
function disposeDynamic3D(root){
  if(!root)return;
  const geos=new Set(),mats=new Set();
  root.traverse(n=>{
    if(!n.isMesh)return;
    if(n.geometry)geos.add(n.geometry);
    if(Array.isArray(n.material))n.material.forEach(m=>{if(m)mats.add(m);});
    else if(n.material)mats.add(n.material);
  });
  if(root.parent)root.parent.remove(root);
  geos.forEach(g=>{try{g.dispose();}catch(e){}});
  mats.forEach(m=>{try{m.dispose();}catch(e){}});
}
function placeObject(kind,instant){
  const old=G.curObj;
  if(old){
    addAnim(0.26,k=>{old.scale.setScalar(Math.max(0.001,1-easeIn(k)));old.rotation.y+=0.2;},
      ()=>{disposeDynamic3D(old);});
  }
  const g=buildObject(kind);
  g.scale.setScalar(0.001);
  objAnchor.add(g);G.curObj=g;
  setObjectColor(g,GRAY,true);
  const delay=old?0.22:0.05;
  addAnim(delay,()=>{},()=>{
    addAnim(0.5,k=>{g.scale.setScalar(0.9*easeBack(k));});
  });
}

/* ---------- pouring ---------- */
const POT_TOP=new THREE.Vector3(0,1.19,0.45);
function pourDrop(baseId){
  if(G.busy||G.phase!=='play')return;
  if(G.drops.length>=TUNE.MAX_DROPS){toast('なべが いっぱい！ やりなおしてね',1500);return;}
  G.drops.push(baseId);
  updateDropsUI();sfxDrop();
  const bottle=bottleMap[baseId];
  if(bottle)bottleHop(bottle);
  const from=bottle
    ? new THREE.Vector3(bottle.userData.home.x,bottle.userData.home.y+0.95,bottle.userData.home.z)
    : new THREE.Vector3(0,2.2,1.6);
  spawnDrop(baseId,from);
}
function bottleHop(bottle){
  if(bottle.userData.anim)return;
  bottle.userData.anim=true;
  const home=bottle.userData.home;
  const dir=home.x>=0?-1:1;
  addAnim(0.46,k=>{
    const s=Math.sin(k*Math.PI);
    bottle.position.set(home.x,home.y+s*0.5,home.z-s*0.28);
    bottle.rotation.z=s*0.55*dir;
  },()=>{
    bottle.position.copy(home);bottle.rotation.z=0;bottle.userData.anim=false;
  });
}
function spawnDrop(baseId,from){
  const hex=BASE[baseId].hex;
  const geo=new THREE.SphereGeometry(0.125,12,10);
  const material=new THREE.MeshStandardMaterial({color:new THREE.Color(hex),
    emissive:new THREE.Color(hex).multiplyScalar(0.45),roughness:0.2,metalness:0.1});
  const m=new THREE.Mesh(geo,material);m.position.copy(from);m.castShadow=true;
  scene.add(m);
  const to=new THREE.Vector3(POT_TOP.x+rnd(-0.28,0.28),POT_TOP.y,POT_TOP.z+rnd(-0.28,0.28));
  const peak=Math.max(from.y,to.y)+0.72;
  addAnim(0.46,k=>{
    const e=k;
    m.position.x=lerp(from.x,to.x,e);
    m.position.z=lerp(from.z,to.z,e);
    const a=1-e,bq=e;
    m.position.y=a*a*from.y+2*a*bq*peak+bq*bq*to.y;
    m.scale.set(1+Math.sin(k*Math.PI)*0.18,1-Math.sin(k*Math.PI)*0.12,1+Math.sin(k*Math.PI)*0.18);
  },()=>{
    scene.remove(m);geo.dispose();material.dispose();
    burst(to.clone(),hex,10,1.5,0.055);
    ring(new THREE.Vector3(POT_TOP.x,POT_TOP.y+0.01,POT_TOP.z),hex,2.0,0.55);
    waveAmp=0.06;
    addAnim(0.55,k=>{waveAmp=lerp(0.06,0.018,k);});
    setPotColor(potHexFor(G.drops),false);
    camShake=0.045;
  });
}

/* ---------- mixing / judging ---------- */
function doMix(){
  if(G.busy||G.phase!=='play'||!G.drops.length)return;
  const token=G.flowToken;
  G.busy=true;updateDropsUI();
  hideToast();
  stirStick.visible=true;sfxStir();
  addAnim(TUNE.MIX_SEC,k=>{
    const a=k*Math.PI*2*3.2;
    stirStick.position.set(Math.cos(a)*0.48,1.0+Math.sin(k*Math.PI)*0.12,Math.sin(a)*0.48);
    stirStick.rotation.z=Math.cos(a)*0.2;
    stirStick.rotation.x=Math.sin(a)*0.2;
    liquidSpin+=0.11;
    waveAmp=0.018+Math.sin(k*Math.PI)*0.05;
  },()=>{
    stirStick.visible=false;waveAmp=0.018;
    if(G.phase==='play'&&token===G.flowToken)judge(token);else G.busy=false;
  });
}
function judge(token){
  if(G.phase!=='play'||token!==G.flowToken){G.busy=false;return;}
  const key=recipeKey(countsOf(G.drops));
  const found=RECIPE_MAP[key]||null;
  const target=COLOR_BY_ID[G.targets[G.q]];
  const hex=found?found.hex:approxMix(G.drops);
  setPotColor(hex,false);

  let discovered=null;
  if(found&&!SAVE.spirits[found.id]){
    SAVE.spirits[found.id]=true;persist();
    discovered=found;G.newSpirits.push(found.id);
    updateChips();
  }
  const correct=!!(found&&found.id===target.id);

  if(correct){
    sfxGood();
    burst(POT_TOP.clone(),hex,26,3.0,0.075);
    ring(new THREE.Vector3(POT_TOP.x,POT_TOP.y+0.02,POT_TOP.z),hex,4.4,0.9);
    camShake=0.1;
    fairyCheer();
    let msg='<span style="color:#E5476B">せいかい！</span> '+found.name+' が できたよ！';
    if(discovered)msg+='<br><span style="font-size:12px;color:#7B4FBF">✦ あたらしい せいれい ゲット！</span>';
    toast(msg,2400);
    if(discovered)setTimeout(()=>{if(G.phase==='play'&&token===G.flowToken)sfxNew();},420);
    /* paint the object */
    setTimeout(()=>{
      if(G.phase!=='play'||token!==G.flowToken)return;
      paintObjectFlow(hex,token);
    },520);
    setTimeout(()=>{
      if(G.phase!=='play'||token!==G.flowToken)return;
      G.q++;
      if(G.q>=G.targets.length)finishStage();else loadQuestion(false);
    },2650);
  }else{
    sfxBad();
    G.misses++;G.qMisses++;
    fairyShake();
    burst(POT_TOP.clone(),hex,12,1.6,0.06,false);
    let msg;
    if(found)msg=found.name+' が できた！<br>おだいは <b>'+target.name+'</b> だよ';
    else msg='ふしぎな いろに なった！<br>もういちど やってみよう';
    if(discovered)msg+='<br><span style="font-size:12px;color:#7B4FBF">✦ せいれい ゲット！</span>';
    toast(msg,2300);
    if(discovered)setTimeout(()=>{if(G.phase==='play'&&token===G.flowToken)sfxNew();},380);
    setTimeout(()=>{
      if(G.phase!=='play'||token!==G.flowToken)return;
      resetPot(true);
      if(G.qMisses>=TUNE.HINT_AFTER_MISSES)showHint();
    },2000);
  }
}
function paintObjectFlow(hex,token){
  if(token!==G.flowToken||G.phase!=='play')return;
  if(!G.curObj)return;
  setObjectColor(G.curObj,hex,false);
  const wp=new THREE.Vector3();objAnchor.getWorldPosition(wp);
  /* paint stream from pot to object */
  for(let i=0;i<10;i++){
    setTimeout(()=>{
      if(!scene||token!==G.flowToken||G.phase!=='play')return;
      const geo=new THREE.SphereGeometry(0.075,8,6);
      const material=new THREE.MeshStandardMaterial({color:new THREE.Color(hex),
        emissive:new THREE.Color(hex).multiplyScalar(0.5),roughness:0.25});
      const m=new THREE.Mesh(geo,material);m.position.copy(POT_TOP);scene.add(m);
      const to=wp.clone().add(new THREE.Vector3(rnd(-0.3,0.3),rnd(0.2,0.8),rnd(-0.3,0.3)));
      const from=POT_TOP.clone();
      const peak=Math.max(from.y,to.y)+0.9;
      addAnim(0.5,k=>{
        const a=1-k;
        m.position.x=lerp(from.x,to.x,k);
        m.position.z=lerp(from.z,to.z,k);
        m.position.y=a*a*from.y+2*a*k*peak+k*k*to.y;
      },()=>{scene.remove(m);geo.dispose();material.dispose();});
    },i*55);
  }
  setTimeout(()=>{
    if(!scene||!objAnchor||token!==G.flowToken||G.phase!=='play')return;
    const wp2=new THREE.Vector3();objAnchor.getWorldPosition(wp2);
    burst(wp2.clone().add(new THREE.Vector3(0,0.5,0)),hex,20,2.4,0.07);
    ring(wp2.clone().add(new THREE.Vector3(0,0.1,0)),'#FFE066',2.6,0.8);
    if(G.curObj)objBounce();
  },640);
  if(G.mode&&G.mode.id==='order'&&G.curCustomer)customerHop();
}
function objBounce(){
  const o=G.curObj;if(!o)return;
  addAnim(0.6,k=>{
    const s=0.9*(1+Math.sin(k*Math.PI*2)*0.13*(1-k));
    o.scale.setScalar(s);
  },()=>{if(o)o.scale.setScalar(0.9);});
}

  G.drops=[];G.busy=false;

  setPotColor('#EFEAF7',false);
  if(!silent)sfxTap();
}

/* ========================= 11. animation loop ========================= */
let _lastT=0,pagePaused=false;
function animate(){
  requestAnimationFrame(animate);
  if(!ready||pagePaused)return;
  const dt=Math.min(clock.getDelta(),TUNE.DT_MAX);
  const t=clock.elapsedTime;

  runAnims(dt);updateBursts(dt);

  /* liquid surface */
  if(potLiquid&&potLiquidBase){
    const arr=potLiquid.geometry.attributes.position.array;
    for(let i=0;i<arr.length;i+=3){
      const x=potLiquidBase[i],z=potLiquidBase[i+2];
      arr[i+1]=Math.sin(t*waveSpeed*2.3+x*4.6+z*3.0)*waveAmp
              +Math.cos(t*1.9+z*5.2)*waveAmp*0.55;
    }
    potLiquid.geometry.attributes.position.needsUpdate=true;
    potLiquid.geometry.computeVertexNormals();
    potLiquid.rotation.y=liquidSpin;
    liquidSpin*=0.985;
  }
  /* fire */
  if(fireGroup){
    fireGroup.children.forEach((f,i)=>{
      const p=Math.sin(t*7.5+f.userData.ph)*0.5+0.5;
      f.scale.set(0.75+p*0.5,0.7+p*0.75,0.75+p*0.5);
      f.material.opacity=0.42+p*0.35;
    });
    const pot=scene.userData.pot;
    if(pot&&pot.userData.fireLight)pot.userData.fireLight.intensity=0.7+Math.sin(t*9)*0.2;
  }
  if(potGlow)potGlow.intensity=0.62+Math.sin(t*2.4)*0.14;

  /* fairy */
  if(fairy){
    const off=fairy.userData.cheerOff||0;
    fairy.position.y=2.30+Math.sin(t*1.5)*0.13+off;
    fairy.userData.wings.forEach((w,i)=>{
      const s=i<2?-1:1;
      w.rotation.z=s*(0.35-(i%2)*0.5)+Math.sin(t*17+i)*0.28;
    });
  }
  /* customer idle */
  if(G.curCustomer&&!anims.length){
    G.curCustomer.position.y=Math.abs(Math.sin(t*1.6))*0.045;
  }
  /* pedestal object idle */
  if(objAnchor){
    objAnchor.rotation.y+=dt*0.42;
    objAnchor.position.y=1.44+Math.sin(t*1.25)*0.045;
  }
  /* clouds */
  if(cloudGroup){
    cloudGroup.children.forEach(c=>{
      c.userData.a+=c.userData.sp*dt;
      c.position.x=Math.cos(c.userData.a)*c.userData.rad;
      c.position.z=Math.sin(c.userData.a)*c.userData.rad;
      c.position.y=c.userData.y+Math.sin(t*0.4+c.userData.ph)*0.28;
    });
  }
  /* motes */
  if(motes){
    const arr=motes.geometry.attributes.position.array;
    const data=motes.userData.data;
    for(let i=0;i<data.length;i++){
      const p=data[i];
      p.y+=p.sp*dt;
      if(p.y>7.5)p.y=-1.2;
      p.a+=dt*0.08;
      arr[i*3]=Math.cos(p.a)*p.r+Math.sin(t*0.9+p.ph)*0.2;
      arr[i*3+1]=p.y;
      arr[i*3+2]=Math.sin(p.a)*p.r+Math.cos(t*0.8+p.ph)*0.2;
    }
    motes.geometry.attributes.position.needsUpdate=true;
  }
  /* camera */
  if(camShake>0.0005){camShake*=0.86;}else camShake=0;
  const sh=camShake;
  if(camMode==='title'){
    const a=t*0.10;
    camera.position.set(Math.sin(a)*8.5,4.15+Math.sin(t*0.42)*0.22,Math.cos(a)*8.5);
    camera.lookAt(0,1.34,0);
    titleHue+=dt*0.075;if(titleHue>1)titleHue-=1;
    potColor.setHSL(titleHue,0.74,0.6);applyPotColor();
  }else{
    camera.position.set(Math.sin(t*0.24)*0.2+rnd(-sh,sh),
                        4.55+Math.sin(t*0.32)*0.08+rnd(-sh,sh),
                        9.0);
    camera.lookAt(0,1.30,-0.5);
  }
  renderer.render(scene,camera);
}

/* ========================= 12. boot ========================= */
function bindUI(){
  $('hud-back').addEventListener('click',onBack);
  $('hud-bgm').addEventListener('click',()=>{toggleBGM();});
  $('act-mix').addEventListener('click',()=>{sfxTap();doMix();});
  $('act-reset').addEventListener('click',()=>{
    if(G.busy)return;
    resetPot(false);clearHint();
    if(G.qMisses>=TUNE.HINT_AFTER_MISSES)showHint();
  });
  $('btn-album').addEventListener('click',()=>{sfxTap();renderAlbum();showScreen('sc-album');});
  $('btn-howto').addEventListener('click',()=>{sfxTap();renderHowto();showScreen('sc-howto');});
  $('album-back').addEventListener('click',()=>{sfxTap();goTitle();});
  $('howto-back').addEventListener('click',()=>{sfxTap();goTitle();});
  $('stage-back').addEventListener('click',()=>{sfxTap();renderModes();showScreen('sc-mode');});
  $('mode-back').addEventListener('click',()=>{sfxTap();goTitle();});
  $('btn-start').addEventListener('click',()=>{sfxTap();renderModes();showScreen('sc-mode');});
  $('res-retry').addEventListener('click',()=>{sfxTap();if(!G.mode){goTitle();return;}startStage(G.stageIdx);});
  $('res-next').addEventListener('click',()=>{
    sfxTap();
    if(!G.mode){goTitle();return;}
    if(G.stageIdx>=G.mode.stages.length-1){
      G.phase='stage';camMode='title';
      clearCustomer();clearObject();
      openStageSelect(MODES.indexOf(G.mode));
    }else startStage(G.stageIdx+1);
  });
  const nb=$('nogl-back');if(nb)nb.addEventListener('click',goBackSite);
  document.addEventListener('touchstart',function once(){ac();document.removeEventListener('touchstart',once);},{passive:true});
  document.addEventListener('click',function once(){ac();document.removeEventListener('click',once);},{passive:true});
  window.addEventListener('message',ev=>{
    const d=ev&&ev.data;
    if(d&&d.type==='pause'&&_bgm){try{_bgm.stop();}catch(e){}}
  });
  document.addEventListener('visibilitychange',()=>{
    pagePaused=document.hidden;
    if(pagePaused){
      if(_bgm){try{_bgm.stop();}catch(e){}}
      return;
    }
    if(clock)clock.getDelta();
    if(_bgm&&typeof WakuwakuMP3BGM!=='undefined'){
      try{if(WakuwakuMP3BGM.loadState())_bgm.start();}catch(e){}
    }
  });
}
function boot(){
  if(typeof THREE==='undefined'||!hasWebGL()){
    $('loading').style.display='none';
    $('nogl').style.display='flex';
    return;
  }
  try{
    initScene();
  }catch(e){
    $('loading').style.display='none';
    $('nogl').style.display='flex';
    return;
  }
  bindUI();
  updateDropsUI();
  syncBgmBtn();
  goTitle();
  $('hud').style.display='block';
  animate();
  setTimeout(()=>{
    const l=$('loading');
    if(l){l.style.transition='opacity .4s';l.style.opacity='0';setTimeout(()=>{l.style.display='none';},420);}
  },420);
}
if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',boot);
else boot();

</script>
