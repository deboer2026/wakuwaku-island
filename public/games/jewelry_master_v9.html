<!DOCTYPE html>
<html lang="ja">
<head>
<script src="/games/wakuwaku_ui.js"></script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>ジュエリーマスター</title>
<link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@400;700;800&family=DotGothic16&family=Cinzel:wght@600;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{width:100%;height:100%;overflow:hidden;}
body{
  font-family:'M PLUS Rounded 1c',sans-serif;background:#07010f;color:#fff;user-select:none;
  -webkit-user-select:none;touch-action:none;
}
#c3d{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;z-index:0;}
.vig{position:fixed;inset:0;z-index:1;pointer-events:none;
  background:radial-gradient(ellipse at 50% 48%,transparent 46%,rgba(0,0,0,0.42) 100%);}

/* ===== 共通UI ===== */
.ui{position:fixed;z-index:10;}
.gold{color:#FFD86B;}
.btn{
  font-family:inherit;font-weight:800;font-size:15px;color:#2a1400;cursor:pointer;
  background:linear-gradient(180deg,#FFE9A6,#FFC93C 45%,#E8A200);
  border:none;border-radius:999px;padding:13px 30px;
  box-shadow:0 4px 0 #9c6a00,0 8px 22px rgba(255,190,60,0.4);
  transition:transform .08s,box-shadow .08s;
}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 #9c6a00,0 4px 12px rgba(255,190,60,0.3);}
.btn.sub{
  background:linear-gradient(180deg,rgba(255,240,200,0.16),rgba(255,215,110,0.08));
  color:#FFE9A6;border:1.5px solid rgba(255,216,107,0.55);
  box-shadow:0 3px 0 rgba(120,80,0,0.5);font-size:13px;padding:10px 22px;
}
.btn:disabled{filter:grayscale(.7) brightness(.65);pointer-events:none;}

/* ===== HUD ===== */
#hud{
  top:0;left:0;right:0;display:none;align-items:center;gap:8px;
  padding:calc(8px + var(--sat,0px)) 12px 8px;
  background:linear-gradient(180deg,rgba(9,2,22,0.94) 55%,rgba(9,2,22,0));
}
#hud.on{display:flex;}
#back-btn{
  font-family:inherit;font-size:12px;font-weight:700;color:#FFD86B;cursor:pointer;
  background:rgba(255,216,107,0.1);border:1.5px solid rgba(255,216,107,0.45);
  border-radius:999px;padding:6px 13px;white-space:nowrap;
}
#hud-day{font-family:'Cinzel',serif;font-size:13px;color:#FFD86B;letter-spacing:.5px;}
#hud-mid{flex:1;text-align:center;font-size:12px;font-weight:800;color:#FFE9A6;}
#hud-life{font-size:15px;letter-spacing:1px;min-width:56px;text-align:right;}
#timer-wrap{
  top:calc(46px + var(--sat,0px));left:14px;right:14px;height:9px;
  background:rgba(255,255,255,0.12);border-radius:999px;overflow:hidden;display:none;
  border:1px solid rgba(255,216,107,0.3);
}
#timer-wrap.on{display:block;}
#timer-bar{height:100%;width:100%;border-radius:999px;
  background:linear-gradient(90deg,#7CFFB2,#FFE066);transition:width .1s linear;}
#timer-bar.warn{background:linear-gradient(90deg,#FF8A65,#FF5252);}

/* ===== 指示バナー ===== */
#task{
  left:50%;transform:translateX(-50%);
  bottom:calc(22px + var(--sab,0px));
  min-width:250px;max-width:min(92vw,430px);text-align:center;
  padding:11px 20px;border-radius:18px;display:none;
  background:linear-gradient(180deg,rgba(30,6,60,0.94),rgba(14,2,34,0.94));
  border:2px solid rgba(255,216,107,0.5);
  box-shadow:0 8px 30px rgba(0,0,0,0.6),inset 0 1px 0 rgba(255,255,255,0.12);
}
#task.on{display:block;animation:taskIn .3s ease-out;}
@keyframes taskIn{from{opacity:0;transform:translateX(-50%) translateY(14px);}to{opacity:1;transform:translateX(-50%) translateY(0);}}
#task-label{font-size:10px;font-weight:800;color:#FFD86B;letter-spacing:2px;margin-bottom:3px;font-family:'Cinzel',serif;}
#task-text{font-size:15px;font-weight:800;line-height:1.4;}
#task-hint{font-size:11px;color:#C9B8E8;margin-top:4px;}

/* ===== 吹き出し ===== */
#bubble{
  left:0;top:0;display:none;max-width:min(72vw,300px);
  padding:11px 15px;border-radius:16px;
  background:linear-gradient(180deg,#fffdf5,#ffeeca);
  color:#3a1d00;font-size:13.5px;font-weight:800;line-height:1.45;
  box-shadow:0 8px 26px rgba(0,0,0,0.5);border:2px solid #FFD86B;
  transform:translate(-50%,-100%);white-space:pre-wrap;
}
#bubble.on{display:block;}
#bubble::after{
  content:'';position:absolute;bottom:-11px;left:50%;transform:translateX(-50%);
  border:11px solid transparent;border-top-color:#ffeeca;border-bottom:0;
}
#bubble .req{color:#B3005E;}

/* ===== フローティング数値 ===== */
#pops{inset:0;pointer-events:none;z-index:12;}
.pop{position:absolute;font-size:22px;font-weight:800;color:#FFE066;
  text-shadow:0 2px 8px rgba(0,0,0,0.8);animation:popUp 1s ease-out forwards;}
@keyframes popUp{0%{opacity:0;transform:translate(-50%,0) scale(.6);}
  25%{opacity:1;transform:translate(-50%,-16px) scale(1.15);}
  100%{opacity:0;transform:translate(-50%,-64px) scale(1);}}

/* ===== みがくゲージ ===== */
#polish{left:50%;transform:translateX(-50%);bottom:calc(96px + var(--sab,0px));
  width:min(78vw,300px);display:none;text-align:center;}
#polish.on{display:block;}
#pol-bg{height:16px;border-radius:999px;background:rgba(0,0,0,0.5);
  border:2px solid rgba(255,216,107,0.6);overflow:hidden;}
#pol-bar{height:100%;width:0%;border-radius:999px;
  background:linear-gradient(90deg,#B388FF,#80D8FF,#FFF9C4);
  box-shadow:0 0 14px rgba(180,220,255,0.8);transition:width .12s;}
#pol-txt{font-size:11px;color:#D8C9FF;margin-top:5px;font-weight:700;}

/* ===== 全画面オーバーレイ ===== */
.ov{
  position:fixed;inset:0;z-index:30;display:none;
  align-items:center;justify-content:center;padding:16px;
  padding-top:calc(16px + var(--sat,0px));padding-bottom:calc(16px + var(--sab,0px));
  background:rgba(6,1,16,0.82);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);
  touch-action:pan-y;overflow-y:auto;
}
.ov.on{display:flex;}
.box{
  width:100%;max-width:400px;text-align:center;
  background:linear-gradient(180deg,#2a0a52,#150430 60%,#0d0222);
  border:2.5px solid rgba(255,216,107,0.6);border-radius:24px;
  padding:22px 18px;box-shadow:0 16px 50px rgba(0,0,0,0.75),inset 0 1px 0 rgba(255,255,255,0.12);
}
.box h2{font-size:20px;color:#FFD86B;margin-bottom:8px;letter-spacing:1px;}
.box p{font-size:13px;line-height:1.6;color:#E4D8FF;}
.rowbtn{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:16px;}

/* ===== タイトル ===== */
#title{inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;
  z-index:20;padding:calc(20px + var(--sat,0px)) 16px calc(20px + var(--sab,0px));}
#title.on{display:flex;}
#t-crest{font-size:11px;letter-spacing:5px;color:#FFD86B;font-family:'Cinzel',serif;opacity:.85;}
#t-name{
  font-family:'DotGothic16',sans-serif;font-size:clamp(30px,9.5vw,46px);line-height:1.1;
  margin:6px 0 2px;letter-spacing:2px;
  background:linear-gradient(180deg,#FFFDF0 8%,#FFE79A 38%,#FFC93C 62%,#B77800 100%);
  -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;
  filter:drop-shadow(0 3px 0 rgba(80,40,0,.55)) drop-shadow(0 0 22px rgba(255,190,60,.5));
}
#t-sub{font-family:'Cinzel',serif;font-size:10.5px;letter-spacing:3.5px;color:#D9C6FF;opacity:.9;}
#t-rule{width:170px;height:1.5px;margin:13px 0 18px;
  background:linear-gradient(90deg,transparent,rgba(255,216,107,.9),transparent);}
#t-btns{display:flex;flex-direction:column;gap:10px;align-items:center;}
#t-tip{margin-top:16px;font-size:10.5px;color:#A99AC6;line-height:1.7;text-align:center;}

/* ===== マップ ===== */
#map{z-index:25;}
#map .box{max-width:430px;}
#map-info{display:flex;justify-content:center;gap:14px;font-size:12px;font-weight:800;margin:2px 0 12px;}
#grade-row{font-size:13px;letter-spacing:3px;color:#FFD86B;margin-bottom:12px;}
#map-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:14px;}
.day{
  aspect-ratio:1;border-radius:14px;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:2px;cursor:pointer;
  background:linear-gradient(180deg,#4a1a86,#2a0b52);
  border:2px solid rgba(255,216,107,0.45);
  box-shadow:0 3px 0 rgba(0,0,0,0.45);
}
.day:active{transform:translateY(2px);}
.day .dn{font-family:'Cinzel',serif;font-size:15px;font-weight:700;color:#FFE9A6;}
.day .ds{font-size:8.5px;letter-spacing:.5px;color:#FFD86B;height:11px;}
.day .dv{font-size:8px;color:#FF9EDB;font-weight:800;}
.day.lock{background:linear-gradient(180deg,#241a35,#150f22);border-color:rgba(255,255,255,0.12);
  color:#6b5e85;cursor:default;}
.day.lock .dn{color:#6b5e85;}
.day.clear{background:linear-gradient(180deg,#6a2fae,#3a1170);}

/* ===== ずかん ===== */
#zukan{z-index:35;background:rgba(4,1,12,0.92);flex-direction:column;gap:0;padding:0;}
#zukan.on{display:flex;}
#zk-head{width:100%;display:flex;align-items:center;gap:8px;
  padding:calc(9px + var(--sat,0px)) 12px 9px;
  background:linear-gradient(180deg,rgba(9,2,22,0.96),rgba(9,2,22,0));}
#zk-title{flex:1;font-family:'Cinzel',serif;font-size:14px;color:#FFD86B;text-align:center;}
#zk-stage{flex:1;width:100%;min-height:0;position:relative;}
#zk-name{position:absolute;left:0;right:0;bottom:8px;text-align:center;
  font-size:19px;font-weight:800;color:#fff;text-shadow:0 2px 10px rgba(0,0,0,.8);}
#zk-rare{position:absolute;left:0;right:0;bottom:-14px;text-align:center;font-size:12px;color:#FFD86B;}
#zk-info{width:100%;max-width:430px;margin:0 auto;padding:6px 16px 4px;
  font-size:12px;line-height:1.6;color:#E4D8FF;text-align:center;min-height:52px;}
#zk-drag{text-align:center;font-size:10px;color:#8d7fb0;padding-bottom:4px;}
#zk-list{width:100%;max-width:430px;margin:0 auto;
  display:grid;grid-template-columns:repeat(5,1fr);gap:6px;
  padding:6px 12px calc(14px + var(--sab,0px));overflow-y:auto;touch-action:pan-y;flex:0 0 auto;max-height:36vh;}
.zk-cell{aspect-ratio:1;border-radius:12px;display:flex;align-items:center;justify-content:center;
  font-size:9px;font-weight:800;text-align:center;line-height:1.15;padding:2px;cursor:pointer;
  background:rgba(255,255,255,0.07);border:1.5px solid rgba(255,255,255,0.13);color:#8d7fb0;}
.zk-cell.got{border-color:rgba(255,216,107,0.65);color:#fff;}
.zk-cell.sel{background:rgba(255,216,107,0.22);border-color:#FFD86B;}

/* ===== おみせグレードアップ ===== */
#shopov .box{max-width:420px;}
#up-list{display:flex;flex-direction:column;gap:8px;margin:12px 0;}
.up{display:flex;align-items:center;gap:10px;padding:9px 11px;border-radius:14px;text-align:left;
  background:rgba(255,255,255,0.06);border:1.5px solid rgba(255,255,255,0.14);}
.up.own{border-color:rgba(124,255,178,0.55);background:rgba(124,255,178,0.09);}
.up-ic{font-size:22px;width:30px;text-align:center;flex:0 0 30px;}
.up-b{flex:1;min-width:0;}
.up-n{font-size:12.5px;font-weight:800;}
.up-d{font-size:10px;color:#B9A9DC;}
.up-btn{font-family:inherit;font-size:11px;font-weight:800;cursor:pointer;white-space:nowrap;
  padding:7px 12px;border-radius:999px;border:none;color:#2a1400;
  background:linear-gradient(180deg,#FFE9A6,#FFC93C);box-shadow:0 2px 0 #9c6a00;}
.up-btn:disabled{filter:grayscale(.8) brightness(.6);}
.up-ok{font-size:11px;font-weight:800;color:#7CFFB2;white-space:nowrap;padding:0 4px;}

/* ===== リアクション ===== */
#react .box{max-width:340px;}
#rx-emo{font-size:44px;line-height:1;margin-bottom:4px;}
#rx-ttl{font-size:22px;font-weight:800;margin-bottom:2px;}
#rx-msg{font-size:13px;color:#E4D8FF;line-height:1.55;white-space:pre-wrap;margin:6px 0 10px;}
#rx-pts{font-family:'Cinzel',serif;font-size:26px;color:#FFD86B;}
#rx-learn{margin-top:10px;padding:9px 12px;border-radius:14px;text-align:left;
  background:rgba(255,216,107,0.1);border:1.5px solid rgba(255,216,107,0.35);
  font-size:11.5px;line-height:1.55;color:#FFE9A6;}
#rx-learn b{color:#fff;}

/* ===== VIPバナー ===== */
#vip{
  left:50%;top:36%;transform:translate(-50%,-50%) scale(.5);opacity:0;
  font-family:'Cinzel',serif;font-size:26px;font-weight:700;letter-spacing:3px;
  color:#FFF3C4;text-shadow:0 0 24px rgba(255,200,60,.95),0 3px 0 rgba(120,60,0,.7);
  pointer-events:none;z-index:28;white-space:nowrap;
}
#vip.on{animation:vipIn 2.2s ease-out forwards;}
@keyframes vipIn{
  0%{opacity:0;transform:translate(-50%,-50%) scale(.5);}
  18%{opacity:1;transform:translate(-50%,-50%) scale(1.12);}
  28%{transform:translate(-50%,-50%) scale(1);}
  78%{opacity:1;transform:translate(-50%,-50%) scale(1);}
  100%{opacity:0;transform:translate(-50%,-50%) scale(1.05);}}

/* ===== フラッシュ / ローディング ===== */
#flash{inset:0;pointer-events:none;z-index:29;background:#fff;opacity:0;}
#load{inset:0;z-index:60;display:flex;align-items:center;justify-content:center;
  flex-direction:column;gap:14px;background:#07010f;}
#load .sp{width:42px;height:42px;border-radius:50%;
  border:4px solid rgba(255,216,107,0.25);border-top-color:#FFD86B;animation:spin 1s linear infinite;}
@keyframes spin{to{transform:rotate(360deg);}}
#load p{font-size:12px;color:#C9B8E8;letter-spacing:1px;}
#nogl{inset:0;z-index:70;display:none;align-items:center;justify-content:center;padding:24px;
  background:#0d0222;text-align:center;}
#nogl.on{display:flex;}

@media (orientation:landscape) and (max-height:480px){
  #t-name{font-size:clamp(24px,6.5vh,34px);}
  #t-rule{margin:8px 0 12px;}
  #task{bottom:calc(12px + var(--sab,0px));padding:8px 18px;}
  #task-text{font-size:13px;}
  #polish{bottom:calc(70px + var(--sab,0px));}
  #zk-list{max-height:30vh;grid-template-columns:repeat(7,1fr);}
}
</style>
</head>
<body>
<canvas id="c3d"></canvas>
<div class="vig"></div>

<!-- ===== HUD ===== -->
<div id="hud" class="ui">
<button id="back-btn" data-ww-ui="back">← マップ</button>
  <div id="hud-day">DAY 1</div>

</div>

  <div id="pol-bg"><div id="pol-bar"></div></div>

</div>
<div id="pops" class="ui"></div>

<div id="flash" class="ui"></div>

<!-- ===== タイトル ===== -->

  <div id="t-crest">◆ ◇ ◆</div>

  <div id="t-sub">ROYAL JEWELRY BOUTIQUE</div>
  <div id="t-rule"></div>
  <div id="t-btns">
    <button class="btn" id="b-start">おみせを ひらく</button>
    <button class="btn sub" id="b-zukan">ほうせきずかん <span id="zk-cnt">0/12</span></button>

<!-- ===== マップ ===== -->
<div id="map" class="ov">
  <div class="box">
    <h2>おうこくの カレンダー</h2>
    <div id="map-info">
      <span class="gold">🪙 <span id="m-coin">0</span></span>

  </div>
</div>

<!-- ===== ひらく前 / 日おわり ===== -->
<div id="dayin" class="ov"><div class="box">
  <h2 id="di-t">DAY 1</h2>

  <div class="rowbtn"><button class="btn" id="b-daygo">おみせを あける</button></div>
</div></div>

<div id="dayend" class="ov"><div class="box">
  <h2 id="de-t">DAY 1 クリア！</h2>
  <div id="de-star" style="font-size:30px;letter-spacing:5px;margin:4px 0 8px;"></div>
  <p id="de-b"></p>
  <div class="rowbtn"><button class="btn" id="b-denext">つぎへ →</button></div>
</div></div>

<!-- ===== リアクション ===== -->

</div></div>

<div id="shopov" class="ov"><div class="box">
  <h2>おみせを グレードアップ</h2>
  <p style="font-size:11.5px;">コインで おみせを ごうかに できるよ！</p>
  <div style="font-size:14px;font-weight:800;color:#FFD86B;margin-top:8px;">🪙 <span id="up-coin">0</span></div>
  <div id="up-list"></div>

</div></div>

  <div id="zk-head">
    <button id="zk-back" class="btn sub" style="padding:7px 15px;">← もどる</button>

</div>

<!-- ===== ローディング / WebGL不可 ===== -->
<div id="load" class="ui"><div class="sp"></div><p>おみせを じゅんびちゅう...</p></div>
<div id="nogl" class="ui"><div class="box">
  <h2>ごめんね</h2>
  <p>この ブラウザでは 3Dが うごかないみたい。<br>ちがう ブラウザで あそんでみてね！</p>
  <div class="rowbtn"><button class="btn" onclick="goBack()">← もどる</button></div>
</div></div>

<script>
'use strict';
/* =========================================================
   ジュエリーマスター v9 — ROYAL JEWELRY BOUTIQUE (Full 3D)
   Three.js r128 / わくわくアイランド
   ========================================================= */

/* ---------- 安全なlocalStorage ---------- */
const SAFE_LS=(function(){
  try{const k='__ww_t__';localStorage.setItem(k,k);localStorage.removeItem(k);return localStorage;}
  catch(e){const m={};return{getItem:k=>Object.prototype.hasOwnProperty.call(m,k)?m[k]:null,
    setItem:(k,v)=>{m[k]=String(v);},removeItem:k=>{delete m[k];}};}
})();
/* GEMS/UPGRADES定義より前でセーブ正規化に使うため、IDだけ先に定数化しておく
   (下のGEMS/UPGRADESの id と必ず一致させること)。 */
const GEM_IDS=['dia','rub','sap','eme','ame','aqu','opa','cit','ros','gar','top','prl'];
const UPGRADE_IDS=['carpet','chand','gcase','shelf','window','fount'];
const SAVE_KEY='jewelry_v9_progress';
/* 旧バージョン(v8)のセーブ。読み取り専用・冪等な一度きりの移行にのみ使う。削除・上書きはしない。 */
const LEGACY_SAVE_KEY='jm8_save';
const LEGACY_HS_KEY='jm_hs';
const LEGACY_COL_KEY='jm_col';
const SCHEMA_VERSION=1;
function safeNumber(value,fallback,min,max){
  const n=Number(value);
  if(!Number.isFinite(n))return fallback;
  return Math.max(min,Math.min(max,n));
}
function defSave(){return{schemaVersion:SCHEMA_VERSION,stars:{},coins:0,gems:[],jewels:0,ups:[],rainbow:false,best:0};}
/* 既知IDの配列だけを残す（壊れた値・未知IDを既定値へ落とす） */
function sanitizeIdArray(arr,knownIds){
  if(!Array.isArray(arr))return[];
  const seen={};const out=[];
  arr.forEach(id=>{ if(typeof id==='string'&&knownIds.indexOf(id)>=0&&!seen[id]){ seen[id]=true; out.push(id); } });
  return out;
}
function sanitizeStars(raw){
  const out={};
  if(raw&&typeof raw==='object'){
    Object.keys(raw).forEach(k=>{ out[k]=Math.round(safeNumber(raw[k],0,0,3)); });
  }
  return out;
}
function normalizeSave(d){
  d.schemaVersion=SCHEMA_VERSION;
  d.coins=Math.round(safeNumber(d.coins,0,0,999999));
  d.jewels=Math.round(safeNumber(d.jewels,0,0,999999));
  d.best=Math.round(safeNumber(d.best,0,0,999999));
  d.rainbow=(d.rainbow===true);
  d.stars=sanitizeStars(d.stars);
  d.gems=sanitizeIdArray(d.gems,GEM_IDS);
  d.ups=sanitizeIdArray(d.ups,UPGRADE_IDS);
  return d;
}
/* 旧セーブ(jm8_save/jm_col/jm_hs)からの一度きり・冪等な移行。v9セーブが既にあれば何もしない。
   旧キーへは一切書き込み・削除を行わない。数値・配列は必ずsafeなものだけを取り込む。 */
function migrateFromLegacyIfNeeded(){
  try{
    if(SAFE_LS.getItem(SAVE_KEY))return null;
    const legacyRaw=SAFE_LS.getItem(LEGACY_SAVE_KEY);
    if(!legacyRaw)return null;
    const legacy=JSON.parse(legacyRaw);
    const d=defSave();
    d.coins=Math.round(safeNumber(legacy.coins,0,0,999999));
    /* v8のstars[N](数値キー) -> v9のstars['dN'](文字列キー)へ変換 */
    if(legacy.stars&&typeof legacy.stars==='object'){
      Object.keys(legacy.stars).forEach(k=>{
        const n=parseInt(k,10);
        if(Number.isFinite(n)&&n>0) d.stars['d'+n]=Math.round(safeNumber(legacy.stars[k],0,0,3));
      });
    }
    let legacyCol=[];
    try{ legacyCol=JSON.parse(SAFE_LS.getItem(LEGACY_COL_KEY)||'[]'); }catch(e){}
    d.gems=sanitizeIdArray(legacyCol,GEM_IDS);
    const legacyBest=parseInt(SAFE_LS.getItem(LEGACY_HS_KEY)||'0',10);
    d.best=Math.round(safeNumber(legacyBest,0,0,999999));
    normalizeSave(d);
    d._migratedFromLegacy=true;
    return d;
  }catch(e){ return null; }
}
let SAVE=(function(){
  let d=defSave();
  try{
    const raw=SAFE_LS.getItem(SAVE_KEY);
    if(raw){
      const s=JSON.parse(raw);
      Object.assign(d,s);
    }else{
      const migrated=migrateFromLegacyIfNeeded();
      if(migrated)d=migrated;
    }
  }catch(e){ d=defSave(); }
  return normalizeSave(d);
})();
function persist(){try{SAFE_LS.setItem(SAVE_KEY,JSON.stringify(SAVE));}catch(e){}}

/* ---------- 環境マップ（手続き生成） ---------- */
function makeEnvMap(){
  const S=64,faces=[];
  const grads=[
    ['#efe0ff','#2a0d4d'],['#ffe9c0','#3a1030'],
    ['#ffffff','#c8b6ff'],['#2a0d4d','#0a0118'],
    ['#ffd9a0','#4a1560'],['#c9e6ff','#1a0836'],
  ];
  for(let i=0;i<6;i++){
    const cv=document.createElement('canvas');cv.width=cv.height=S;
    const g=cv.getContext('2d');
    const lg=g.createLinearGradient(0,0,0,S);
    lg.addColorStop(0,grads[i][0]);lg.addColorStop(1,grads[i][1]);
    g.fillStyle=lg;g.fillRect(0,0,S,S);
    // ハイライト
    const rg=g.createRadialGradient(S*0.35,S*0.28,2,S*0.35,S*0.28,S*0.5);
    rg.addColorStop(0,'rgba(255,255,255,0.95)');rg.addColorStop(1,'rgba(255,255,255,0)');
    g.fillStyle=rg;g.fillRect(0,0,S,S);
    faces.push(cv);
  }
  const t=new THREE.CubeTexture(faces);
  t.needsUpdate=true;
  if(THREE.sRGBEncoding!==undefined)t.encoding=THREE.sRGBEncoding;
  return t;
}
let ENV=null;

/* ---------- スプライト用テクスチャ ---------- */
function texGlow(){
  const S=64,cv=document.createElement('canvas');cv.width=cv.height=S;
  const g=cv.getContext('2d');
  const rg=g.createRadialGradient(S/2,S/2,0,S/2,S/2,S/2);
  rg.addColorStop(0,'rgba(255,255,255,1)');
  rg.addColorStop(0.25,'rgba(255,255,255,0.7)');
  rg.addColorStop(1,'rgba(255,255,255,0)');
  g.fillStyle=rg;g.fillRect(0,0,S,S);
  const t=new THREE.CanvasTexture(cv);if(THREE.sRGBEncoding!==undefined)t.encoding=THREE.sRGBEncoding;return t;
}
function texStar(){
  const S=128,cv=document.createElement('canvas');cv.width=cv.height=S;
  const g=cv.getContext('2d');g.translate(S/2,S/2);
  const rg=g.createRadialGradient(0,0,0,0,0,S*0.18);
  rg.addColorStop(0,'rgba(255,255,255,1)');rg.addColorStop(1,'rgba(255,255,255,0)');
  g.fillStyle=rg;g.beginPath();g.arc(0,0,S*0.18,0,Math.PI*2);g.fill();
  g.strokeStyle='rgba(255,255,255,0.95)';g.lineCap='round';
  for(let i=0;i<4;i++){
    g.save();g.rotate(i*Math.PI/4);
    g.lineWidth=(i%2===0)?5:2.5;
    const len=(i%2===0)?S*0.47:S*0.3;
    const lg=g.createLinearGradient(0,0,0,-len);
    lg.addColorStop(0,'rgba(255,255,255,1)');lg.addColorStop(1,'rgba(255,255,255,0)');
    g.strokeStyle=lg;
    g.beginPath();g.moveTo(0,0);g.lineTo(0,-len);g.stroke();
    g.beginPath();g.moveTo(0,0);g.lineTo(0,len);g.stroke();
    g.restore();
  }
  const t=new THREE.CanvasTexture(cv);if(THREE.sRGBEncoding!==undefined)t.encoding=THREE.sRGBEncoding;return t;
}

function gemMaterial(g,extra){
  const key='gm_'+g.id+(extra||'');
  if(MAT_CACHE[key])return MAT_CACHE[key];
  const m=new THREE.MeshPhongMaterial({
    color:g.c, specular:0xffffff, shininess:140, flatShading:true,
    emissive:g.d, emissiveIntensity:0.32,
    transparent:g.cut!=='sphere', opacity:g.cut==='sphere'?1:0.9,
    envMap:ENV, reflectivity:0.9, combine:THREE.MixOperation,
    side:THREE.DoubleSide, depthWrite:true,

  MAT_CACHE[key]=m;return m;
}

/* ---------- カット別ジオメトリ ---------- */
function heartShape(){
  const s=new THREE.Shape();
  s.moveTo(0,-1.0);
  s.bezierCurveTo(-1.25,-0.15,-0.95,0.85,-0.42,0.85);
  s.bezierCurveTo(-0.16,0.85,-0.02,0.62,0,0.46);
  s.bezierCurveTo(0.02,0.62,0.16,0.85,0.42,0.85);
  s.bezierCurveTo(0.95,0.85,1.25,-0.15,0,-1.0);
  return s;
}
/* 各カットは Group（上部クラウン＋下部パビリオン） */
function buildCutGroup(cut,mat){
  const g=new THREE.Group();
  let crown,pav;
  switch(cut){
    case 'brilliant':
      crown=new THREE.Mesh(new THREE.CylinderGeometry(0.56,1.0,0.30,8),mat);
      crown.position.y=0.15;
      pav=new THREE.Mesh(new THREE.CylinderGeometry(1.0,0.06,1.12,8),mat);
      pav.position.y=-0.56;
      g.add(crown,pav);break;
    case 'cushion':
      crown=new THREE.Mesh(new THREE.CylinderGeometry(0.62,1.0,0.34,4),mat);
      crown.position.y=0.17;crown.rotation.y=Math.PI/4;
      pav=new THREE.Mesh(new THREE.CylinderGeometry(1.0,0.1,1.0,4),mat);
      pav.position.y=-0.5;pav.rotation.y=Math.PI/4;
      g.add(crown,pav);g.scale.set(1,0.95,1);break;
    case 'oval':

    case 'step':

      pav.position.y=-0.59;pav.rotation.y=Math.PI/8;
      g.add(crown,mid,pav);g.scale.set(0.82,1,1.12);break;
    case 'pear':
      crown=new THREE.Mesh(new THREE.CylinderGeometry(0.56,1.0,0.30,8),mat);
      crown.position.y=0.15;
      pav=new THREE.Mesh(new THREE.CylinderGeometry(1.0,0.06,1.05,8),mat);
      pav.position.y=-0.53;
      const tip=new THREE.Mesh(new THREE.ConeGeometry(0.5,0.95,8),mat);
      tip.position.set(0,0.06,0.92);tip.rotation.x=-Math.PI/2;
      g.add(crown,pav,tip);g.scale.set(0.8,1,0.92);break;
    case 'heart':{
      const eg=new THREE.ExtrudeGeometry(heartShape(),{depth:0.42,bevelEnabled:true,
        bevelThickness:0.22,bevelSize:0.16,bevelSegments:2,curveSegments:9,steps:1});
      eg.center();
      const hm=new THREE.Mesh(eg,mat);
      hm.rotation.x=-Math.PI/2;hm.rotation.z=Math.PI;
      g.add(hm);g.scale.set(0.95,0.8,0.95);break;}
    case 'cab':{
      const dome=new THREE.Mesh(new THREE.SphereGeometry(1,14,8,0,Math.PI*2,0,Math.PI/2),mat);
      dome.scale.set(1,0.62,1);
      const base=new THREE.Mesh(new THREE.CylinderGeometry(1,0.9,0.24,14),mat);
      base.position.y=-0.12;
      g.add(dome,base);break;}
    case 'sphere':{
      const sp=new THREE.Mesh(new THREE.SphereGeometry(0.95,20,14),mat);
      g.add(sp);break;}
    default:
      g.add(new THREE.Mesh(new THREE.OctahedronGeometry(1,0),mat));
  }
  return g;
}
/* 宝石メッシュ（きらめきスプライト付き） */
function makeGem(gd,size,withSparkle,lite){
  const wrap=new THREE.Group();
  const mat=gemMaterial(gd);
  const body=buildCutGroup(gd.cut,mat);
  wrap.add(body);
  wrap.userData.body=body;
  wrap.userData.gem=gd;
  if(lite){wrap.scale.setScalar(size||0.16);return wrap;}
  // 内側の輝き
  const core=new THREE.Sprite(new THREE.SpriteMaterial({
    map:TEX_GLOW,color:gd.l,transparent:true,opacity:0.3,
    blending:THREE.AdditiveBlending,depthWrite:false,depthTest:false}));
  core.scale.set(1.85,1.85,1);
  wrap.add(core);wrap.userData.core=core;
  if(withSparkle!==false){
    const st=new THREE.Sprite(new THREE.SpriteMaterial({
      map:TEX_STAR,color:0xffffff,transparent:true,opacity:0,
      blending:THREE.AdditiveBlending,depthWrite:false,depthTest:false}));
    st.scale.set(2.6,2.6,1);st.position.set(0.4,0.46,0.45);
    wrap.add(st);wrap.userData.star=st;
  }
  wrap.scale.setScalar(size||0.16);
  return wrap;
}

/* ---------- 原石（ラフストーン） ---------- */
function makeRough(gd,size){
  const wrap=new THREE.Group();
  wrap.userData.gem=gd;
  // 中の宝石
  const inner=makeGem(gd,1,true);
  inner.scale.setScalar(0.62);
  wrap.add(inner);wrap.userData.inner=inner;
  // 岩の殻（8チャンク）
  const crustMat=new THREE.MeshPhongMaterial({
    color:0x7C6350,specular:0x3a2c22,shininess:6,flatShading:true,
    emissive:gd.d,emissiveIntensity:0.10});
  const chunks=[];
  const geoA=new THREE.DodecahedronGeometry(0.52,0);
  const geoB=new THREE.IcosahedronGeometry(0.5,0);
  for(let i=0;i<8;i++){
    const ph=Math.acos(1-2*(i+0.5)/8);
    const th=Math.PI*(1+Math.sqrt(5))*i;
    const m=new THREE.Mesh(i%2?geoA:geoB,crustMat);
    m.position.set(Math.sin(ph)*Math.cos(th)*0.62,Math.cos(ph)*0.62,Math.sin(ph)*Math.sin(th)*0.62);
    m.scale.set(0.9+Math.random()*0.45,0.8+Math.random()*0.45,0.9+Math.random()*0.45);
    m.rotation.set(Math.random()*3,Math.random()*3,Math.random()*3);
    m.userData.dir=m.position.clone().normalize();
    wrap.add(m);chunks.push(m);
  }
  wrap.userData.chunks=chunks;
  // いろのヒント（露出した結晶）
  const hintMat=gemMaterial(gd);
  for(let i=0;i<3;i++){
    const t=new THREE.Mesh(new THREE.TetrahedronGeometry(0.26,0),hintMat);
    const a=i*2.4+0.5;
    t.position.set(Math.cos(a)*0.5,0.22+i*0.1,Math.sin(a)*0.5);
    t.rotation.set(Math.random()*3,Math.random()*3,Math.random()*3);
    wrap.add(t);
  }
  wrap.scale.setScalar(size||0.3);
  return wrap;
}

/* ---------- だいざ（アクセサリー土台） ---------- */
function makeSetting(accId,gemMesh){
  const g=new THREE.Group();
  const gold=goldMat(),sil=silverMat();
  const seat=new THREE.Group();          // 宝石が乗る位置
  switch(accId){
    case 'ring':{
      const band=new THREE.Mesh(new THREE.TorusGeometry(0.52,0.075,8,26),gold);
      band.rotation.x=Math.PI/2;band.position.y=-0.28;
      g.add(band);
      for(let i=0;i<4;i++){
        const p=new THREE.Mesh(new THREE.CylinderGeometry(0.035,0.045,0.24,5),gold);
        const a=i*Math.PI/2+Math.PI/4;
        p.position.set(Math.cos(a)*0.17,0.06,Math.sin(a)*0.17);
        p.rotation.set(Math.cos(a)*0.28,0,-Math.sin(a)*0.28);
        g.add(p);
      }
      seat.position.y=0.2;break;}
    case 'neck':{
      for(let i=0;i<16;i++){
        const a=Math.PI*0.12+ (Math.PI*0.76)*(i/15);
        const l=new THREE.Mesh(new THREE.TorusGeometry(0.055,0.019,5,9),gold);
        l.position.set(Math.cos(a)*0.72,Math.sin(a)*0.72-0.05,0);
        l.rotation.set(0,i%2?Math.PI/2:0,a);
        g.add(l);
      }
      const frame=new THREE.Mesh(new THREE.TorusGeometry(0.26,0.05,7,18),gold);
      frame.position.y=-0.66;g.add(frame);
      const bail=new THREE.Mesh(new THREE.TorusGeometry(0.08,0.026,6,12),gold);
      bail.position.y=-0.38;g.add(bail);
      seat.position.y=-0.66;seat.position.z=0.02;break;}
    case 'tiara':{
      const arc=new THREE.Mesh(new THREE.TorusGeometry(0.72,0.055,7,24,Math.PI),gold);
      arc.position.y=-0.34;g.add(arc);
      for(let i=0;i<5;i++){
        const a=Math.PI*(0.14+0.18*i);
        const h=(i===2)?0.34:(i===1||i===3)?0.22:0.14;
        const sp=new THREE.Mesh(new THREE.ConeGeometry(0.06,h,5),gold);
        sp.position.set(Math.cos(a)*0.72,Math.sin(a)*0.72-0.34+h/2,0);
        sp.rotation.z=a-Math.PI/2;
        g.add(sp);
        if(i!==2){
          const b=new THREE.Mesh(new THREE.SphereGeometry(0.055,8,6),sil);
          b.position.set(Math.cos(a)*0.72,Math.sin(a)*0.72-0.34+h+0.04,0);
          g.add(b);
        }
      }
      seat.position.set(0,0.55,0);break;}
    case 'brooch':{
      const disc=new THREE.Mesh(new THREE.CylinderGeometry(0.5,0.5,0.07,8),gold);
      disc.rotation.x=Math.PI/2;g.add(disc);
      for(let i=0;i<8;i++){
        const a=i*Math.PI/4;
        const ray=new THREE.Mesh(new THREE.ConeGeometry(0.09,0.42,4),gold);
        ray.position.set(Math.cos(a)*0.62,Math.sin(a)*0.62,-0.02);
        ray.rotation.z=a-Math.PI/2;
        g.add(ray);
      }
      seat.position.z=0.16;break;}
    case 'brace':{
      const band=new THREE.Mesh(new THREE.TorusGeometry(0.6,0.11,9,28),gold);
      band.rotation.x=Math.PI/2;band.position.y=-0.1;
      g.add(band);
      for(let i=0;i<4;i++){
        const a=i*Math.PI/2;
        const st=new THREE.Mesh(new THREE.SphereGeometry(0.08,8,6),sil);
        st.position.set(Math.cos(a)*0.6,-0.1,Math.sin(a)*0.6);
        g.add(st);
      }
      seat.position.y=0.14;break;}
  }
  g.add(seat);
  g.userData.seat=seat;
  if(gemMesh){seat.add(gemMesh);}
  return g;
}

/* キャラのアニメ */
function animChar(ch,t,dt){
  if(!ch)return;
  const P=ch.userData.parts,st=ch.userData.st||'idle';
  const k=ch.userData.key;
  if(k==='fairy'){
    ch.position.y=0.26+Math.sin(t*2.6)*0.07;
    if(P.wings)P.wings.forEach((w,i)=>{w.rotation.y=Math.sin(t*22)*0.5*(i?-1:1);});
  }else{
    ch.position.y=Math.abs(Math.sin(t*1.7))*0.018;
  }
  if(P.head)P.head.rotation.y=Math.sin(t*0.9)*0.1;
  if(st==='idle'){
    if(P.arms)P.arms.forEach((a,i)=>{a.rotation.z=(i?1:-1)*(0.16+Math.sin(t*1.5+i)*0.05);a.rotation.x=0;});
    if(P.mouth)P.mouth.scale.set(1,0.55,0.4);
  }else if(st==='walk'){
    if(P.arms)P.arms.forEach((a,i)=>{a.rotation.x=Math.sin(t*8+i*Math.PI)*0.5;a.rotation.z=(i?1:-1)*0.2;});
    ch.position.y+= Math.abs(Math.sin(t*8))*0.045;
  }else if(st==='happy'){
    const b=Math.abs(Math.sin(t*7));
    ch.position.y=(k==='fairy'?0.3:0)+b*0.17;
    if(P.arms)P.arms.forEach((a,i)=>{a.rotation.z=(i?1:-1)*(2.1+Math.sin(t*11)*0.24);a.rotation.x=0;});
    if(P.mouth)P.mouth.scale.set(1.35,1.25,0.5);
    ch.rotation.z=Math.sin(t*7)*0.06;
  }else if(st==='sad'){
    ch.rotation.x=0.13;
    if(P.arms)P.arms.forEach((a,i)=>{a.rotation.z=(i?1:-1)*0.05;a.rotation.x=0.3;});
    if(P.mouth)P.mouth.scale.set(0.8,0.4,0.4);
    if(P.head)P.head.rotation.x=0.18;
  }
  if(st!=='sad'){ch.rotation.x=0;if(P.head)P.head.rotation.x=0;}
  if(st!=='happy')ch.rotation.z=0;
}

   カメラ / レンダーループ / エフェクト
   ========================================================= */
const CAMV={
  title:{p:new THREE.Vector3(1.85,1.78,2.5), l:new THREE.Vector3(0,1.55,-3.2)},
  play: {p:new THREE.Vector3(0,1.86,1.72), l:new THREE.Vector3(0,1.18,-1.35)},
  work: {p:new THREE.Vector3(0,1.72,0.86), l:new THREE.Vector3(0,1.14,-0.5)},
  polish:{p:new THREE.Vector3(0,1.6,0.62),l:new THREE.Vector3(0,1.30,-0.35)},
  hand: {p:new THREE.Vector3(0,1.8,1.35), l:new THREE.Vector3(0,1.25,-1.1)},
};
let camTarget={p:CAMV.title.p.clone(),l:CAMV.title.l.clone()};
const camLook=new THREE.Vector3();
let camShake=0;
function setCam(name,instant){
  const v=CAMV[name];if(!v)return;
  camTarget.p.copy(v.p);camTarget.l.copy(v.l);
  if(instant&&camera){camera.position.copy(v.p);camLook.copy(v.l);camera.lookAt(camLook);}
}
/* 内容にあわせてカメラ距離を自動計算（スマホ縦画面でも大きく映す） */
function frameAt(cx,cy,cz,radius,pitch){
  if(!camera)return;
  const aspect=Math.max(0.34,window.innerWidth/window.innerHeight);
  const vf=camera.fov*Math.PI/180;
  const tan=Math.tan(vf/2);
  const d=Math.max(radius/tan, radius/(tan*aspect))*1.16;
  const p=(pitch===undefined)?0.52:pitch;
  camTarget.p.set(cx,cy+Math.sin(p)*d,cz+Math.cos(p)*d);
  camTarget.l.set(cx,cy,cz);
}
function framePicks(){
  if(!pickObjs.length||!SHOP.tray)return;
  let mx=0,mz=0,cz=0;
  pickObjs.forEach(o=>{mx=Math.max(mx,Math.abs(o.position.x));cz+=o.position.z;});
  cz/=pickObjs.length;
  pickObjs.forEach(o=>{mz=Math.max(mz,Math.abs(o.position.z-cz));});
  const r=Math.max(mx+0.42,(mz+0.42)*0.85,0.50);
  frameAt(0,SHOP.counterTop+0.32,-0.35+cz,r,0.5);
}
function frameSingle(y,z,r,pitch){
  frameAt(0,SHOP.counterTop+(y===undefined?0.36:y),-0.35+(z||0),r||0.44,pitch);
}
function reframe(){
  if(phase===PH.ROUGH||phase===PH.ACC)framePicks();
  else if(phase===PH.POLISH)frameSingle(0.40,0.12,0.42,0.36);
  else if(phase===PH.HAND)frameSingle(0.46,0.05,0.42,0.34);
}
function fitCam(){
  if(!camera||!renderer)return;
  const w=window.innerWidth,h=window.innerHeight,a=w/h;
  camera.aspect=a;
  camera.fov = a<0.62?70 : a<0.8?62 : a<1.2?54 : 46;
  camera.updateProjectionMatrix();
  renderer.setPixelRatio(Math.min(window.devicePixelRatio||1,2));
  renderer.setSize(w,h,false);
  if(zCam){zCam.aspect=a;zCam.fov=camera.fov;zCam.updateProjectionMatrix();}
  reframe();
}

/* ---------- パーティクル ---------- */
const FX=[];
function spawnSparkles(pos,n,color,scene_){
  const sc=scene_||scene;
  for(let i=0;i<n;i++){
    const s=new THREE.Sprite(new THREE.SpriteMaterial({map:i%3?TEX_GLOW:TEX_STAR,
      color:color||0xFFE9A6,transparent:true,opacity:1,
      blending:THREE.AdditiveBlending,depthWrite:false,depthTest:false}));
    const sz=0.1+Math.random()*0.2;s.scale.set(sz,sz,1);
    s.position.copy(pos);
    const sp=0.9+Math.random()*1.5;
    s.userData.v=new THREE.Vector3((Math.random()-0.5)*sp,Math.random()*sp*0.9+0.35,(Math.random()-0.5)*sp);
    s.userData.life=0.55+Math.random()*0.65;s.userData.age=0;s.userData.sc=sz;
    sc.add(s);FX.push({o:s,sc:sc});
  }
}
function spawnDust(pos,n,color){
  for(let i=0;i<n;i++){
    const s=new THREE.Sprite(new THREE.SpriteMaterial({map:TEX_GLOW,
      color:color||0xBCA894,transparent:true,opacity:0.85,depthWrite:false}));
    const sz=0.05+Math.random()*0.1;s.scale.set(sz,sz,1);
    s.position.copy(pos);
    s.userData.v=new THREE.Vector3((Math.random()-0.5)*1.5,Math.random()*0.9,(Math.random()-0.5)*1.5);
    s.userData.life=0.4+Math.random()*0.35;s.userData.age=0;s.userData.sc=sz;
    scene.add(s);FX.push({o:s,sc:scene});
  }
}
function stepFX(dt){
  for(let i=FX.length-1;i>=0;i--){
    const f=FX[i],o=f.o;
    o.userData.age+=dt;
    const r=o.userData.age/o.userData.life;
    if(r>=1){f.sc.remove(o);if(o.material)o.material.dispose();FX.splice(i,1);continue;}
    o.userData.v.y-=2.6*dt;
    o.position.addScaledVector(o.userData.v,dt);
    o.material.opacity=(1-r)*0.95;
    const s=o.userData.sc*(1+r*0.7);o.scale.set(s,s,1);
  }
}
/* 飛んでいく岩チャンク */
const FLY=[];
function flyChunk(mesh,parent){
  const wp=new THREE.Vector3();mesh.getWorldPosition(wp);
  parent.remove(mesh);
  mesh.position.copy(wp);
  scene.add(mesh);
  const d=mesh.userData.dir||new THREE.Vector3(0,1,0);
  FLY.push({m:mesh,v:new THREE.Vector3(d.x*1.7+(Math.random()-0.5),1.6+Math.random()*0.9,d.z*1.7+(Math.random()-0.5)),
    r:new THREE.Vector3(Math.random()*9-4.5,Math.random()*9-4.5,Math.random()*9-4.5),age:0});
  spawnDust(wp,7);
}
function stepFly(dt){
  for(let i=FLY.length-1;i>=0;i--){
    const f=FLY[i];f.age+=dt;
    f.v.y-=6.4*dt;
    f.m.position.addScaledVector(f.v,dt);
    f.m.rotation.x+=f.r.x*dt;f.m.rotation.y+=f.r.y*dt;f.m.rotation.z+=f.r.z*dt;
    const s=Math.max(0,1-f.age/0.85);
    f.m.scale.setScalar(s*(f.m.userData.baseScale||1));
    if(f.age>0.85){scene.remove(f.m);FLY.splice(i,1);}
  }
}
function flash(a){
  const el=$('flash');el.style.transition='none';el.style.opacity=String(a||0.85);
  requestAnimationFrame(()=>{el.style.transition='opacity .42s ease-out';el.style.opacity='0';});
}
function popText(txt,x,y,color){
  const d=document.createElement('div');
  d.className='pop';d.textContent=txt;
  d.style.left=x+'px';d.style.top=y+'px';
  if(color)d.style.color=color;
  $('pops').appendChild(d);
  setTimeout(()=>d.remove(),1050);
}
function worldToScreen(v3){
  const v=v3.clone().project(camera);
  return{x:(v.x*0.5+0.5)*window.innerWidth,y:(-v.y*0.5+0.5)*window.innerHeight};
}

/* ---------- メインループ ---------- */
let VIEW='shop';   // 'shop' | 'zukan'
let running3d=false;
function loop(){
  requestAnimationFrame(loop);
  if(!renderer)return;
  const dt=Math.min(clock.getDelta(),0.05);
  const t=clock.elapsedTime;
  if(VIEW==='zukan'){stepZukan(t,dt);renderer.render(zScene,zCam);return;}
  if(!scene||!camera)return;

  /* カメラ追従 */
  const k=1-Math.pow(0.0018,dt);
  camera.position.lerp(camTarget.p,k);
  camLook.lerp(camTarget.l,k);
  if(camShake>0){
    camShake=Math.max(0,camShake-dt*3.4);
    camera.position.x+=(Math.random()-0.5)*camShake*0.13;
    camera.position.y+=(Math.random()-0.5)*camShake*0.13;
  }
  camera.lookAt(camLook);

  /* 環境アニメ */
  if(SHOP.flames)SHOP.flames.forEach((f,i)=>{
    const s=0.4+Math.sin(t*7+i*1.3)*0.06;f.scale.set(s,s*1.15,1);
  });
  if(SHOP.chandelier)SHOP.chandelier.rotation.y=Math.sin(t*0.25)*0.09;
  if(SHOP.crystals&&SHOP.crystals.visible){
    SHOP.crystals.rotation.y=t*0.28;
    SHOP.crystals.children.forEach((c,i)=>{c.rotation.x=t*0.9+i;c.rotation.y=t*0.7+i;});
  }
  if(SHOP.showGems)SHOP.showGems.forEach((g,i)=>{g.rotation.y=t*0.7+i;});
  if(SHOP.shelves&&SHOP.shelves.visible)
    SHOP.shelves.children.forEach((c,i)=>{if(c.userData.gem)c.rotation.y=t*0.6+i;});
  if(SHOP.spray&&SHOP.fount.visible)SHOP.spray.forEach((g,i)=>{
    const ph=(t*0.7+g.userData.ph)%(Math.PI*2);
    const a=g.userData.ph;
    g.position.set(Math.cos(a+t*0.5)*(0.2+Math.sin(ph)*0.5),1.0+Math.sin(ph)*0.85,
                   Math.sin(a+t*0.5)*(0.2+Math.sin(ph)*0.5));
    g.rotation.y=t*1.4+i;
  });
  if(SHOP.dusts)SHOP.dusts.forEach(d=>{
    d.position.y+=d.userData.sp*dt;
    d.position.x+=Math.sin(t*0.6+d.userData.ph)*0.0016;
    if(d.position.y>3.9)d.position.y=0.3;
  });
  if(SHOP.outside)SHOP.outside.material.opacity=0.42+Math.sin(t*1.1)*0.09;

  stepGame(t,dt);
  stepFX(dt);stepFly(dt);
  renderer.render(scene,camera);
}

const PH={NONE:'none',ARRIVE:'arrive',TALK:'talk',ROUGH:'rough',POLISH:'polish',
          ACC:'acc',HAND:'hand',REACT:'react'};
let phase=PH.NONE;
let curDay=1,custIdx=0,lives=3,dayScore=0,dayMiss=0,combo=0;
let Q=null;                    // 今のおだい
let charObj=null,pickObjs=[],selRough=null,gemObj=null,jewelObj=null;
let timeLeft=0,timeMax=0,timerOn=false;
let polishP=0,polishChunk=0,polishStart=0;

let LABELS=null;

function ensureLabels(){
  if(LABELS)return LABELS;
  LABELS=document.createElement('div');
  LABELS.style.cssText='position:fixed;inset:0;z-index:11;pointer-events:none;';
  document.body.appendChild(LABELS);
  return LABELS;
}
function clearLabels(){if(LABELS)LABELS.innerHTML='';}
function addLabel(text,obj){
  const d=document.createElement('div');
  d.textContent=text;
  d.style.cssText='position:absolute;transform:translate(-50%,0);white-space:nowrap;'+
    'font-size:11.5px;font-weight:800;color:#FFF3D0;padding:3px 10px;border-radius:999px;'+
    'background:rgba(20,4,44,0.82);border:1.5px solid rgba(255,216,107,0.5);'+
    'text-shadow:0 1px 3px rgba(0,0,0,.8);';
  ensureLabels().appendChild(d);
  d.__obj=obj;
  return d;
}
function updateLabels(){
  if(!LABELS||!LABELS.children.length||!camera)return;

/* ---------- おだい生成 ---------- */
function pickN(arr,n,must){
  const pool=arr.filter(x=>x!==must);
  const out=[must];
  for(let i=0;i<n-1&&pool.length;i++){
    out.push(pool.splice(Math.floor(Math.random()*pool.length),1)[0]);
  }
  for(let i=out.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[out[i],out[j]]=[out[j],out[i]];}
  return out;
}
let pityCount=0;
/* 未取得の宝石が運悪くずっと出ない事態を避ける救済措置。
   6回連続で未発見の宝石が選ばれなかったら、次は必ず未発見のものから選ぶ。 */
function pickQuestGem(){
  const undiscovered=GEMS.filter(g=>SAVE.gems.indexOf(g.id)<0);
  if(undiscovered.length && pityCount>=6){
    pityCount=0;
    return undiscovered[Math.floor(Math.random()*undiscovered.length)];
  }
  const gem=GEMS[Math.floor(Math.random()*GEMS.length)];
  pityCount = (undiscovered.indexOf(gem)>=0) ? 0 : pityCount+1;
  return gem;
}
function makeQuest(){
  const d=DAYS[curDay-1];
  const gem=pickQuestGem();
  const acc=ACCS[Math.floor(Math.random()*Math.min(d.accs,ACCS.length))];
  let mode=d.mode;
  if(mode==='mix')mode=['name','hint2','hint1'][Math.floor(Math.random()*3)];
  const isVip = d.vip && custIdx===d.cust-1;
  const custKey = isVip ? d.vip : CUSTOMERS[Math.floor(Math.random()*4)].key;
  return{
    gem:gem,acc:acc,mode:mode,vip:!!isVip,cust:CUST_BY_KEY[custKey],
    gemChoices:pickN(GEMS,Math.min(d.gems,GEMS.length),gem),
    accChoices:pickN(ACCS.slice(0,d.accs),Math.min(d.accs,4),acc),
  };
}
/* 吹き出し用HTMLを直接組み立てる（データはすべて自前の定数なので安全） */
function requestText(){

  if(Q.mode==='hint2')

           '<br><span style="font-size:11px;color:#7d5a1e;">ヒント：'+GEM_HINT2[Q.gem.id]+'</span>';
  return '「'+GEM_HINT[Q.gem.id]+'」の<br><b class="req">'+a+'</b> を おねがい！';
}

function layout(objs){
  const n=objs.length;
  const portrait=(window.innerWidth/window.innerHeight)<0.92;
  let cols;
  if(!portrait)cols=n;
  else cols=(n<=2)?n:(n<=4)?2:3;
  const rows=Math.ceil(n/cols);
  const sx=0.90,sz=0.80;
  objs.forEach((o,i)=>{
    const r=Math.floor(i/cols),c=i%cols;
    const cnt=Math.min(cols,n-r*cols);
    const x=(c-(cnt-1)/2)*sx;
    const z=(r-(rows-1)/2)*sz;
    o.position.set(x,0.24,z);
    o.userData.ph=i*0.7;
  });
}
function addHit(o,r){
  const h=new THREE.Mesh(new THREE.SphereGeometry(r||0.34,7,6),
    new THREE.MeshBasicMaterial({visible:false}));
  h.userData.hitFor=o;o.add(h);
  return h;
}
function pedestal(color){
  const g=new THREE.Group();

    new THREE.MeshPhongMaterial({color:0x2b1150,shininess:60,specular:0x9977cc}));
  g.add(disc);
  const ring=new THREE.Mesh(new THREE.TorusGeometry(0.29,0.014,6,20),goldMat());
  ring.rotation.x=Math.PI/2;ring.position.y=0.02;g.add(ring);
  const glow=new THREE.Sprite(new THREE.SpriteMaterial({map:TEX_GLOW,color:color||0xFFD86B,
    transparent:true,opacity:0.35,blending:THREE.AdditiveBlending,depthWrite:false}));
  glow.scale.set(0.9,0.9,1);glow.position.y=0.03;g.add(glow);

  polishP=Math.min(100,polishP+amount);

  const chunks=selRough.userData.chunks;
  const want=Math.floor(polishP/100*chunks.length);
  while(polishChunk<want&&polishChunk<chunks.length){
    const c=chunks[polishChunk++];
    if(c.parent){c.userData.baseScale=c.scale.x;flyChunk(c,selRough);}
    sfx('crack');
    camShake=0.35;

  const inner=selRough.userData.inner;
  if(inner)inner.scale.setScalar(0.62+polishP/100*0.55);
  if(polishP>=100)finishPolish();

/* =========================================================
   毎フレームの進行
   ========================================================= */
function stepGame(t,dt){
  phaseT+=dt;
  /* タイマー */
  if(timerOn){
    timeLeft-=dt;
    updTimer();
    if(timeLeft<=0){
      timerOn=false;$('timer-wrap').classList.remove('on');
      const ans=(phase===PH.ROUGH)?('こたえは 「'+Q.gem.name+'」 だったよ')
                                  :('こたえは 「'+Q.acc.name+'」 だったよ');
      missRound('じかん ぎれ！ '+ans);
      return;
    }
  }
  /* フェーズ */
  if(phase===PH.ARRIVE&&charObj)stepArrive(dt);
  else if(phase===PH.TALK)stepTalk(dt);

  /* 台の上のオブジェ */
  pickObjs.forEach((p,i)=>{
    if(p.userData.moveTo){
      p.position.lerp(p.userData.moveTo,1-Math.pow(0.004,dt));
    }
    if(p.userData.shake>0){
      p.userData.shake=Math.max(0,p.userData.shake-dt*2.2);
      p.position.x+=Math.sin(t*48)*p.userData.shake*0.03;
    }
    const rock=p.userData.rock;
    if(rock&&phase===PH.ROUGH){rock.rotation.y=t*0.55+i;rock.position.y=0.30+Math.sin(t*1.7+i)*0.024;}
    if(rock&&phase===PH.POLISH){rock.position.y=0.40+Math.sin(t*2.2)*0.018;}
    const st=p.userData.set;
    if(st&&phase===PH.ACC){st.rotation.y=t*0.75+i;st.position.y=0.42+Math.sin(t*1.6+i)*0.022;}
    if(p.userData.glowPulse!==false){
      const ped=p.children[0];
      if(ped&&ped.userData.glow)ped.userData.glow.material.opacity=0.28+Math.sin(t*2.4+i)*0.12;
    }
  });
  /* 研磨中の宝石 */
  if(phase===PH.POLISH&&selRough){
    selRough.rotation.y+=dt*0.5;
    const inner=selRough.userData.inner;
    if(inner){
      inner.rotation.y=t*1.5;
      if(inner.userData.core)inner.userData.core.material.opacity=0.22+polishP/100*0.32;
    }
  }
  /* 完成宝石のショー */
  if(gemObj){
    gemObj.rotation.y+=dt*1.25;
    gemObj.position.y=(gemObj.userData.float?0.70:0.42)+Math.sin(t*1.9)*0.038;
    if(gemObj.userData.star){
      const s=Math.max(0,Math.sin(t*2.6));
      gemObj.userData.star.material.opacity=s*0.55;
      gemObj.userData.star.scale.setScalar(2.2+s*1.2);
    }
    if(Q&&Q.gem.id==='opa'){
      const h=(t*0.14)%1;
      gemObj.userData.body.children.forEach(c=>{if(c.material.color)c.material.color.setHSL(h,0.62,0.68);});
    }
  }
  if(anim==='gemShow'&&phaseT>1.5){anim=null;startAccPick();}
  /* ジュエリー完成ショー */
  if(jewelObj&&anim==='jewelShow'){
    jewelObj.rotation.y+=dt*1.15;
    const g=jewelObj.userData.finalGem;
    if(g&&g.userData.star){
      const s=Math.max(0,Math.sin(t*2.9));
      g.userData.star.material.opacity=s*0.6;g.userData.star.scale.setScalar(2.3+s*1.3);
    }
    if(phaseT>0.6&&phase===PH.HAND){/* タップ待ち */}
  }
  /* わたす演出 */
  if(anim==='deliver'&&jewelObj){
    const p=Math.min(1,phaseT/1.05);
    const e=1-Math.pow(1-p,3);
    const from=jewelObj.userData.from,to=jewelObj.userData.to;
    jewelObj.position.lerpVectors(from,to,e);
    jewelObj.position.y+=Math.sin(p*Math.PI)*0.55;
    jewelObj.rotation.y+=dt*5.5;
    jewelObj.scale.setScalar(0.3+e*0.06);
    if(p>=1){
      anim=null;
      const wp=jewelObj.position.clone();
      spawnSparkles(wp,26,0xFFF3C4);
      scene.remove(jewelObj);jewelObj=null;
      flash(0.5);
      judge();
    }
  }
  /* キャラアニメ */
  if(charObj)animChar(charObj,t,dt);
  /* 追従UI */
  updateBubblePos();
  updateLabels();
}

/* =========================================================
   にゅうりょく
   ========================================================= */
const ray=new THREE.Raycaster();
const ndc=new THREE.Vector2();
let ptrDown=false,ptrLast={x:0,y:0},ptrMoved=0,ptrStart={x:0,y:0};
function pickAt(x,y){
  if(!camera||!scene)return null;
  ndc.x=(x/window.innerWidth)*2-1;
  ndc.y=-(y/window.innerHeight)*2+1;
  ray.setFromCamera(ndc,camera);
  const hits=ray.intersectObjects(pickObjs,true);
  if(!hits.length)return null;
  let o=hits[0].object;
  while(o&&pickObjs.indexOf(o)<0)o=o.parent;
  return o||null;
}
function onDown(x,y){
  ptrDown=true;ptrMoved=0;ptrLast={x:x,y:y};ptrStart={x:x,y:y};
  if(phase===PH.POLISH)addPolish(2.2);
}
function onMove(x,y){
  if(!ptrDown)return;
  const dx=x-ptrLast.x,dy=y-ptrLast.y;
  const d=Math.sqrt(dx*dx+dy*dy);
  ptrMoved+=d;ptrLast={x:x,y:y};
  if(phase===PH.POLISH&&d>0.5){
    addPolish(d*0.15);
    if(Math.random()<0.24&&selRough){
      const wp=new THREE.Vector3();selRough.getWorldPosition(wp);
      wp.x+=(Math.random()-0.5)*0.3;wp.y+=(Math.random()-0.5)*0.3;
      spawnDust(wp,1,0xD8C8B0);
    }
  }
}
function onUp(x,y){
  if(!ptrDown)return;
  ptrDown=false;
  if(ptrMoved>16)return;                 // ドラッグはタップ扱いしない
  if(phase===PH.ROUGH){
    const o=pickAt(x,y);if(o)onPickRough(o);
    return;
  }
  if(phase===PH.ACC){
    const o=pickAt(x,y);if(o)onPickAcc(o);
    return;
  }
  if(phase===PH.HAND&&jewelObj&&anim==='jewelShow'&&phaseT>0.55){deliver();return;}
}
function bindInput(){
  const el=canvas;
  el.addEventListener('pointerdown',e=>{el.setPointerCapture&&el.setPointerCapture(e.pointerId);onDown(e.clientX,e.clientY);},{passive:true});
  el.addEventListener('pointermove',e=>onMove(e.clientX,e.clientY),{passive:true});
  el.addEventListener('pointerup',e=>onUp(e.clientX,e.clientY),{passive:true});
  el.addEventListener('pointercancel',()=>{ptrDown=false;},{passive:true});
  window.addEventListener('resize',fitCam);
  window.addEventListener('orientationchange',()=>setTimeout(fitCam,220));
}

function maxDay(){
  let m=1;
  for(let i=1;i<=DAYS.length;i++){
    if(SAVE.stars['d'+i])m=Math.min(DAYS.length,i+1);
  }
  return m;
}
function totalStars(){let s=0;for(const k in SAVE.stars)s+=SAVE.stars[k];return s;}
function buildMap(){
  $('m-coin').textContent=SAVE.coins;
  $('m-star').textContent=totalStars()+'/'+MAX_STARS;
  const g=shopGrade();
  $('grade-row').textContent='おみせグレード '+('★'.repeat(g)+'☆'.repeat(UPGRADES.length-g));
  const grid=$('map-grid');grid.innerHTML='';
  const mx=maxDay();
  DAYS.forEach(d=>{
    const el=document.createElement('div');
    const st=SAVE.stars['d'+d.n]||0;
    const lock=d.n>mx;
    el.className='day'+(lock?' lock':(st?' clear':''));

      '<div class="dv">'+(d.vip&&!lock?'♛VIP':'')+'</div>';

    grid.appendChild(el);

}

function buildUpgrades(){
  $('up-coin').textContent=SAVE.coins;

let zGem=null,zRot={y:0,x:0},zVel=0.6,zDrag=false,zLast={x:0,y:0},zCurId=null;
function buildZukanScene(){
  zScene=new THREE.Scene();
  zScene.add(new THREE.AmbientLight(0x8a6ac0,0.8));
  const h=new THREE.HemisphereLight(0xffffff,0x3a1a66,0.7);zScene.add(h);
  const d1=new THREE.DirectionalLight(0xffffff,1.05);d1.position.set(2,3,4);zScene.add(d1);
  const d2=new THREE.DirectionalLight(0xB388FF,0.6);d2.position.set(-3,1,-2);zScene.add(d2);
  const p=new THREE.PointLight(0xFFE9B0,1.1,10,2);p.position.set(0,1.5,2);zScene.add(p);
  zCam=new THREE.PerspectiveCamera(54,1,0.1,60);
  zCam.position.set(0,0.15,3.5);zCam.lookAt(0,0,0);
  // だいざ
  const ped=new THREE.Mesh(new THREE.CylinderGeometry(1.0,1.25,0.2,22),
    new THREE.MeshPhongMaterial({color:0x2b1150,shininess:70,specular:0x9977cc}));
  ped.position.y=-1.35;zScene.add(ped);
  const ring=new THREE.Mesh(new THREE.TorusGeometry(1.02,0.05,8,26),goldMat());
  ring.rotation.x=Math.PI/2;ring.position.y=-1.25;zScene.add(ring);
  const glow=new THREE.Sprite(new THREE.SpriteMaterial({map:TEX_GLOW,color:0xFFD86B,
    transparent:true,opacity:0.4,blending:THREE.AdditiveBlending,depthWrite:false}));
  glow.scale.set(3.2,3.2,1);glow.material.opacity=0.28;glow.position.y=-1.25;zScene.add(glow);
  zScene.userData.glow=glow;
}
function showZukanGem(id){
  const gd=GEM_BY_ID[id];if(!gd)return;
  zCurId=id;
  if(zGem){zScene.remove(zGem);}
  zGem=makeGem(gd,1.05,true);
  zGem.position.y=0.1;
  zScene.add(zGem);
  zRot.y=0;zRot.x=0;
  const got=(id==='rbw')?SAVE.rainbow:SAVE.gems.indexOf(id)>=0;
  $('zk-name').textContent=got?gd.name:'？？？';
  $('zk-info').innerHTML=got
    ? ('<b style="color:#FFD86B;">'+gd.en+'</b>　'+'★'.repeat(gd.rare)+'<br>'+gd.info)
    : 'まだ みつけて いないよ。<br>おみせで つくると ずかんに のるよ！';
  if(zScene.userData.glow)zScene.userData.glow.material.color.setHex(gd.l);
  if(!got){
    zGem.traverse(o=>{
      if(o.material&&o.material.color&&o.material.isSpriteMaterial!==true){
        o.material=o.material.clone();o.material.color.setHex(0x3a3050);
        if(o.material.emissive)o.material.emissive.setHex(0x110a22);
      }
      if(o.isSprite)o.material.opacity*=0.2;
    });
  }
  buildZukanList();
}
function buildZukanList(){
  const list=$('zk-list');list.innerHTML='';
  const all=GEMS.concat(SAVE.rainbow?[RAINBOW]:[]);
  all.forEach(gd=>{
    const got=(gd.id==='rbw')?SAVE.rainbow:SAVE.gems.indexOf(gd.id)>=0;
    const c=document.createElement('div');
    c.className='zk-cell'+(got?' got':'')+(gd.id===zCurId?' sel':'');
    c.textContent=got?gd.name:'？';
    if(got)c.style.background='linear-gradient(180deg,rgba(255,255,255,.14),#'+
      ('000000'+gd.c.toString(16)).slice(-6)+'55)';
    c.addEventListener('click',()=>showZukanGem(gd.id));
    list.appendChild(c);
  });
}
let zukanFrom='title';
function openZukan(from){
  zukanFrom=from||'title';
  $('title').classList.remove('on');hideOv('map');
  VIEW='zukan';
  showOv('zukan');
  showZukanGem(SAVE.gems.length?SAVE.gems[SAVE.gems.length-1]:'dia');

function closeZukan(){
  VIEW='shop';hideOv('zukan');
  if(zGem){zScene.remove(zGem);zGem=null;}

}
function stepZukan(t,dt){
  if(!zGem)return;
  if(!zDrag)zRot.y+=zVel*dt;
  zGem.rotation.y=zRot.y;
  zGem.rotation.x=zRot.x;
  zGem.position.y=0.1+Math.sin(t*1.5)*0.06;
  if(zGem.userData.star){
    const s=Math.max(0,Math.sin(t*2.4));
    zGem.userData.star.material.opacity=s*0.5;
    zGem.userData.star.scale.setScalar(2.4+s*1.2);
  }
  if(zCurId==='opa'||zCurId==='rbw'){
    const h=(t*0.16)%1;
    zGem.userData.body.children.forEach(c=>{if(c.material.color)c.material.color.setHSL(h,0.7,0.66);});
  }
}
function bindZukanDrag(){
  const st=$('zk-stage');
  st.style.touchAction='none';
  st.addEventListener('pointerdown',e=>{zDrag=true;zLast={x:e.clientX,y:e.clientY};});
  st.addEventListener('pointermove',e=>{
    if(!zDrag)return;
    zRot.y+=(e.clientX-zLast.x)*0.011;
    zRot.x=Math.max(-1.1,Math.min(1.1,zRot.x+(e.clientY-zLast.y)*0.009));
    zLast={x:e.clientX,y:e.clientY};
  });
  ['pointerup','pointercancel','pointerleave'].forEach(ev=>
    st.addEventListener(ev,()=>{zDrag=false;}));
}
function updateZukanCount(){
  const n=SAVE.gems.length+(SAVE.rainbow?1:0);
  const el=$('zk-cnt');if(el)el.textContent=n+'/'+(GEMS.length+(SAVE.rainbow?1:0));
}

let AC=null;
function ac(){
  if(AC)return AC;
  try{AC=new (window.AudioContext||window.webkitAudioContext)();}catch(e){AC=null;}
  return AC;
}
function tone(f,t0,dur,vol,type){
  const c=ac();if(!c)return;
  const o=c.createOscillator(),g=c.createGain();
  o.type=type||'sine';o.frequency.setValueAtTime(f,c.currentTime+t0);
  g.gain.setValueAtTime(0,c.currentTime+t0);
  g.gain.linearRampToValueAtTime(vol,c.currentTime+t0+0.012);
  g.gain.exponentialRampToValueAtTime(0.0001,c.currentTime+t0+dur);
  o.connect(g);g.connect(c.destination);
  o.start(c.currentTime+t0);o.stop(c.currentTime+t0+dur+0.02);
}
function noise(t0,dur,vol){
  const c=ac();if(!c)return;
  const n=Math.floor(c.sampleRate*dur);
  const b=c.createBuffer(1,n,c.sampleRate),d=b.getChannelData(0);
  for(let i=0;i<n;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/n,2.2);
  const s=c.createBufferSource();s.buffer=b;
  const g=c.createGain();g.gain.value=vol;
  const f=c.createBiquadFilter();f.type='bandpass';f.frequency.value=1400;
  s.connect(f);f.connect(g);g.connect(c.destination);
  s.start(c.currentTime+t0);
}
function sfxOn(){
  if(typeof WakuwakuMP3BGM==='undefined')return true;
  try{return WakuwakuMP3BGM.loadState();}catch(e){return true;}
}
function sfx(name){
  if(!sfxOn())return;
  switch(name){
    case 'ok':    tone(880,0,0.09,0.16,'triangle');tone(1320,0.06,0.14,0.14,'triangle');break;
    case 'ng':    tone(230,0,0.14,0.16,'sawtooth');tone(160,0.09,0.2,0.13,'sawtooth');break;
    case 'crack': noise(0,0.13,0.2);tone(180+Math.random()*90,0,0.07,0.09,'square');break;
    case 'shine': [784,988,1175,1568].forEach((f,i)=>tone(f,i*0.06,0.4,0.13,'triangle'));break;
    case 'mount': tone(660,0,0.1,0.14,'sine');tone(990,0.07,0.16,0.13,'sine');tone(1320,0.15,0.3,0.11,'triangle');break;
    case 'give':  tone(523,0,0.09,0.13,'sine');tone(784,0.07,0.13,0.12,'sine');break;
    case 'yay':   [523,659,784,1047].forEach((f,i)=>tone(f,i*0.075,0.32,0.14,'triangle'));break;
    case 'clear': [523,659,784,1047,1319].forEach((f,i)=>tone(f,i*0.1,0.45,0.13,'triangle'));break;
    case 'door':  tone(300,0,0.2,0.07,'sine');noise(0.02,0.2,0.05);break;
    case 'fanfare':[392,523,659,784,659,784,1047].forEach((f,i)=>tone(f,i*0.11,0.4,0.14,'square'));break;
    case 'tap':   tone(1000,0,0.05,0.09,'triangle');break;
  }
}
/* ---------- BGM ---------- */
let _bgm=null;
function initBGM(){
  if(typeof WakuwakuMP3BGM==='undefined')return;
  try{
    _bgm=new WakuwakuMP3BGM('magical');
    const on=WakuwakuMP3BGM.loadState();
    _bgm.setEnabled(on);
    if(on)_bgm.start();
  }catch(e){_bgm=null;}
  refreshBgmBtn();
}
function toggleBGM(){
  if(typeof WakuwakuMP3BGM==='undefined')return;
  if(!_bgm){initBGM();return;}
  try{const on=_bgm.toggle();WakuwakuMP3BGM.saveState(on);}catch(e){}
  refreshBgmBtn();
}
function refreshBgmBtn(){
  let on=true;
  try{on=_bgm?_bgm.enabled:(typeof WakuwakuMP3BGM!=='undefined'?WakuwakuMP3BGM.loadState():true);}catch(e){}
  const b=$('bgm-btn');if(b)b.textContent=on?'♪':'♪̸';
  const b2=$('b-bgm2');if(b2)b2.textContent=on?'♪ おんがく：オン':'♪ おんがく：オフ';
}

function boot(){
  if(!initRenderer()){$('load').style.display='none';$('nogl').classList.add('on');return;}

  TEX_GLOW=texGlow();TEX_STAR=texStar();

  },7000);
  loop();
}
