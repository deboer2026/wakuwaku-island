<!DOCTYPE html>
<html lang="ja">
<head>
<script src="/games/wakuwaku_ui.js"></script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>どうぶつかくれんぼ 3D</title>
<link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@700;800;900&family=DotGothic16&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{width:100%;height:100%;overflow:hidden;font-family:'M PLUS Rounded 1c',sans-serif;user-select:none;-webkit-user-select:none;}
body{background:linear-gradient(180deg,#87CEEB,#D8F3DC);transition:background 0.8s;}
body.sky-forest{background:linear-gradient(180deg,#8ED4F0 0%,#C9F0DC 70%,#EAF9E0 100%);}
body.sky-meadow{background:linear-gradient(180deg,#9FDCF5 0%,#FFF3C9 75%,#FFE9D6 100%);}
body.sky-pond{background:linear-gradient(180deg,#7FD0EE 0%,#BDEBF5 60%,#E3F9F0 100%);}
body.sky-beach{background:linear-gradient(180deg,#79C8F2 0%,#BFE9F7 55%,#FFE7C2 100%);}
body.sky-snow{background:linear-gradient(180deg,#A9C6E8 0%,#DCE9F7 60%,#F4F8FF 100%);}
body.sky-night{background:linear-gradient(180deg,#1B2A55 0%,#2E3F73 55%,#4A4E8C 100%);}
body.sky-magic{background:linear-gradient(180deg,#3B2E6E 0%,#6E4E9C 55%,#B79CFF 100%);}
#wrap{position:fixed;inset:0;overflow:hidden;}
#cv{display:block;position:absolute;inset:0;width:100%;height:100%;z-index:0;touch-action:none;}

/* ===== HUD ===== */
#hud{position:fixed;top:0;left:0;right:0;z-index:40;display:none;flex-direction:column;gap:5px;
  padding:max(10px,var(--sat,0px)) max(12px,var(--sar,0px)) 6px max(12px,var(--sal,0px));
  pointer-events:none;}
#hud.on{display:flex;}
#hud button{pointer-events:auto;}
.hud-row{display:flex;justify-content:space-between;align-items:center;gap:8px;}
#hud-left{display:flex;align-items:center;gap:8px;min-width:0;}
#back-btn{background:rgba(0,0,0,0.35);border:1px solid rgba(255,255,255,0.3);border-radius:14px;padding:6px 12px;font-size:13px;font-weight:800;color:#fff;cursor:pointer;font-family:inherit;flex:none;}
#stage-name{font-size:15px;font-weight:900;color:#fff;text-shadow:0 2px 5px rgba(0,0,0,0.45);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
#hud-right{display:flex;gap:6px;align-items:center;flex:none;}
.chip{background:rgba(0,0,0,0.32);border-radius:12px;padding:5px 10px;font-size:14px;font-weight:900;color:#fff;display:flex;align-items:center;gap:4px;}
#ui-bgm-btn{background:rgba(0,0,0,0.3);border:none;border-radius:50%;width:36px;height:36px;font-size:17px;cursor:pointer;display:flex;align-items:center;justify-content:center;}
#found-bar{display:flex;justify-content:center;gap:6px;pointer-events:none;flex-wrap:wrap;}
.an-chip{width:40px;height:40px;border-radius:50%;background:rgba(255,255,255,0.88);display:flex;align-items:center;justify-content:center;font-size:22px;
  box-shadow:0 2px 6px rgba(0,0,0,0.18);filter:grayscale(1) opacity(0.55);transition:filter 0.4s,transform 0.4s;}
.an-chip.got{filter:none;transform:scale(1.12);}
@keyframes chipPop{0%{transform:scale(1)}45%{transform:scale(1.45) rotate(-8deg)}100%{transform:scale(1.12)}}
.an-chip.pop{animation:chipPop 0.55s ease;}

#hint-btn{position:fixed;right:max(14px,var(--sar,0px));bottom:max(18px,var(--sab,0px));z-index:40;display:none;
  background:linear-gradient(180deg,#FFE27A,#FFB84D);border:3px solid #fff;border-radius:50%;width:66px;height:66px;
  font-size:26px;cursor:pointer;box-shadow:0 5px 14px rgba(0,0,0,0.28);font-family:inherit;}
#hint-btn.on{display:block;}
#hint-btn:disabled{filter:grayscale(0.9) opacity(0.6);}
#hint-cnt{position:absolute;top:-4px;right:-4px;background:#FF6B6B;color:#fff;border-radius:50%;width:24px;height:24px;
  font-size:13px;font-weight:900;display:flex;align-items:center;justify-content:center;border:2px solid #fff;}
#guide-tip{position:fixed;left:50%;bottom:max(24px,var(--sab,0px));transform:translateX(-50%);z-index:39;
  background:rgba(0,0,0,0.5);color:#fff;font-size:13px;font-weight:800;border-radius:16px;padding:8px 16px;
  pointer-events:none;opacity:0;transition:opacity 0.5s;white-space:nowrap;}
#guide-tip.on{opacity:1;}

/* ===== toast ===== */
#toast{position:fixed;top:38%;left:50%;transform:translate(-50%,-50%) scale(0.6);z-index:60;pointer-events:none;
  font-family:'DotGothic16',sans-serif;font-size:34px;font-weight:900;color:#fff;
  text-shadow:0 3px 0 #E8862E,0 6px 12px rgba(0,0,0,0.3);opacity:0;transition:all 0.3s;}
#toast.on{opacity:1;transform:translate(-50%,-50%) scale(1);}

/* ===== screens ===== */
.screen{position:fixed;inset:0;z-index:100;display:none;flex-direction:column;align-items:center;justify-content:center;
  padding:calc(max(16px,var(--sat,0px))) 18px calc(max(16px,var(--sab,0px)));overflow-y:auto;}
.screen.on{display:flex;}
#title-screen{background:linear-gradient(180deg,rgba(48,110,66,0.55),rgba(20,60,40,0.72));backdrop-filter:blur(3px);}
.big-title{font-family:'DotGothic16',sans-serif;font-size:32px;font-weight:900;color:#fff;text-shadow:0 3px 0 rgba(0,0,0,0.3);text-align:center;line-height:1.3;}
.badge-3d{display:inline-block;background:linear-gradient(135deg,#FF9CCB,#8E7CFF);color:#fff;border-radius:12px;padding:2px 12px;
  font-size:20px;margin-left:6px;transform:rotate(-4deg);box-shadow:0 3px 8px rgba(0,0,0,0.3);}
.sub-title{font-size:14px;font-weight:800;color:rgba(255,255,255,0.92);margin-top:8px;text-align:center;line-height:1.6;}
#stage-grid{display:grid;grid-template-columns:repeat(2,minmax(130px,160px));gap:12px;margin-top:22px;}
.stage-card{border:none;border-radius:20px;padding:14px 10px 12px;font-family:inherit;cursor:pointer;text-align:center;
  color:#fff;font-weight:900;box-shadow:0 4px 0 rgba(0,0,0,0.22),0 8px 16px rgba(0,0,0,0.2);transition:transform 0.12s;}
.stage-card:active{transform:scale(0.95);}
.stage-card .sc-icon{font-size:30px;display:block;}
.stage-card .sc-name{font-size:14px;display:block;margin-top:4px;text-shadow:0 1px 3px rgba(0,0,0,0.3);}
.stage-card .sc-stars{font-size:14px;display:block;margin-top:3px;letter-spacing:2px;color:#FFE27A;}
.stage-card.locked{filter:grayscale(0.85) brightness(0.75);cursor:default;}
.stage-card.locked:active{transform:none;}

#clear-screen{background:rgba(30,60,40,0.65);backdrop-filter:blur(3px);}
#clear-box{background:#FFFDF4;border-radius:26px;padding:26px 30px;text-align:center;box-shadow:0 10px 30px rgba(0,0,0,0.35);max-width:320px;width:100%;}
#clear-title{font-family:'DotGothic16',sans-serif;font-size:26px;font-weight:900;color:#E8862E;}
#clear-stars{font-size:40px;letter-spacing:6px;margin:10px 0 4px;min-height:48px;}
#clear-stars span{display:inline-block;opacity:0;transform:scale(0);color:#FFB300;}
#clear-stars span.dim{color:#D8D2C4;}
@keyframes starIn{0%{opacity:0;transform:scale(0) rotate(-180deg)}70%{transform:scale(1.35) rotate(10deg)}100%{opacity:1;transform:scale(1)}}
#clear-stars span.in{animation:starIn 0.55s ease forwards;}
#clear-time{font-size:15px;font-weight:900;color:#7a6a4f;margin-bottom:14px;}
.big-btn{display:block;width:100%;border:none;border-radius:18px;padding:13px;font-family:inherit;font-size:17px;font-weight:900;
  color:#fff;cursor:pointer;margin-top:10px;box-shadow:0 4px 0 rgba(0,0,0,0.18);}
.big-btn:active{transform:translateY(2px);box-shadow:0 2px 0 rgba(0,0,0,0.18);}
.btn-next{background:linear-gradient(180deg,#8ED66B,#5FB84A);}
.btn-sel{background:linear-gradient(180deg,#9CC9F5,#6AA5E8);}
#allclear-msg{display:none;font-size:14px;font-weight:900;color:#B4457E;margin-top:6px;line-height:1.6;}
#err-screen{background:rgba(30,50,40,0.9);color:#fff;font-weight:800;font-size:15px;text-align:center;line-height:1.9;z-index:200;}

/* ===== partner select ===== */
#partner-screen{background:linear-gradient(180deg,rgba(48,90,110,0.6),rgba(20,40,60,0.75));backdrop-filter:blur(3px);}
#partner-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px;margin-top:18px;width:min(340px,88vw);}
.pt-card{border:none;border-radius:20px;padding:14px 8px;background:rgba(255,255,255,0.9);cursor:pointer;text-align:center;font-family:inherit;
  box-shadow:0 4px 0 rgba(0,0,0,0.18),0 8px 16px rgba(0,0,0,0.18);transition:transform 0.12s;}
.pt-card:active{transform:scale(0.95);}
.pt-card.sel{outline:4px solid #FFD34D;background:#FFF7DE;}
.pt-card canvas{width:100%;height:80px;display:block;}
.pt-card .pt-name{font-weight:900;font-size:14px;color:#3a3a3a;margin-top:4px;}
.pt-card .pt-flavor{font-size:10px;color:#777;margin-top:2px;line-height:1.4;}
#partner-go{margin-top:20px;}
#topbar-back{position:fixed;left:max(14px,var(--sal,0px));top:max(14px,var(--sat,0px));z-index:110;
  background:rgba(0,0,0,0.35);border:1px solid rgba(255,255,255,0.3);border-radius:14px;padding:7px 14px;
  font-size:13px;font-weight:800;color:#fff;cursor:pointer;font-family:inherit;display:none;}
#topbar-back.on{display:block;}
.partner-preview-row{display:flex;align-items:center;gap:8px;justify-content:center;margin-top:6px;}
#change-partner-btn,#change-partner-btn2{background:rgba(0,0,0,0.28);border:none;border-radius:12px;padding:5px 12px;font-family:inherit;
  font-size:12px;font-weight:800;color:#fff;cursor:pointer;}
#peek-hud{display:none;flex-direction:column;align-items:center;gap:2px;}
#peek-hud.on{display:flex;}
#peek-progress{font-size:14px;font-weight:900;color:#fff;text-shadow:0 2px 5px rgba(0,0,0,0.4);}
#peek-streak{font-size:11px;font-weight:800;color:#FFE27A;}
</style>

<script>
'use strict';
/* ================= SAFE_LS ================= */
const SAFE_LS=(function(){
  try{const t='__t';localStorage.setItem(t,'1');localStorage.removeItem(t);return localStorage;}
  catch(e){const m={};return{getItem:k=>(k in m)?m[k]:null,setItem:(k,v)=>{m[k]=String(v);},removeItem:k=>{delete m[k];}};}
})();
const SAVE_KEY='kakurenbo_v3_progress';
const LEGACY_KEY='kakurenbo_v2_progress';
const VALID_PARTNERS=['neko','usagi','kuma','kitsune'];
const STAGE_COUNT=8; // set after STAGES is defined below; used for normalization

function safeParse(key){
  try{
    const raw=SAFE_LS.getItem(key);
    if(!raw)return null;
    const v=JSON.parse(raw);
    return (v&&typeof v==='object')?v:null;
  }catch(e){return null;}
}
function clampStar(v){v=Math.floor(Number(v));if(!isFinite(v)||v<0)return 0;if(v>3)return 3;return v;}
function clampBest(v){if(v===null||v===undefined)return null;v=Number(v);if(!isFinite(v)||v<=0)return null;return v;}

function normalizeSave(p){
  const out={
    schemaVersion:3,
    migratedFrom:(p&&p.migratedFrom)||null,
    partner:(p&&VALID_PARTNERS.includes(p.partner))?p.partner:'neko',
    stages:{},
    settings:{sound:(p&&p.settings&&typeof p.settings.sound==='boolean')?p.settings.sound:true}
  };
  const src=(p&&typeof p.stages==='object'&&p.stages)?p.stages:{};
  for(let i=0;i<STAGE_COUNT;i++){
    const e=src[i]||{};
    out.stages[i]={
      stars:clampStar(e.stars),
      bestSearchMs:clampBest(e.bestSearchMs),
      bestPeekBest:clampBest(e.bestPeekBest)
    };
  }
  return out;
}

function isV3Shaped(p){
  return !!(p&&typeof p==='object'&&typeof p.stages==='object');
}

function migrateFromV2(v2){
  // v2 real shape: {stars:{idx:0-3}, best:{idx:seconds}} — best only ever populated for search-mode stages.
  const fresh=normalizeSave(null);
  fresh.migratedFrom=LEGACY_KEY;
  const v2stars=(v2&&typeof v2.stars==='object'&&v2.stars)?v2.stars:{};
  const v2best=(v2&&typeof v2.best==='object'&&v2.best)?v2.best:{};
  for(let i=0;i<STAGE_COUNT;i++){
    const st=STAGES[i];
    const stars=clampStar(v2stars[i]);
    fresh.stages[i].stars=stars;
    if(st&&st.mode==='search'){
      const b=clampBest(v2best[i]);
      if(b!==null)fresh.stages[i].bestSearchMs=b;
    }
    // peek-mode v2 'best' was never populated — leave bestPeekBest null, never fabricate.
  }
  return fresh;
}

function loadProg(){
  // 1. existing v3 save wins, never re-import v2 on top of it.
  const v3raw=safeParse(SAVE_KEY);
  if(isV3Shaped(v3raw))return normalizeSave(v3raw);
  // 2. else try migrating from legacy v2 (read-only, never mutated/deleted).
  const v2raw=safeParse(LEGACY_KEY);
  if(v2raw&&(typeof v2raw.stars==='object'||typeof v2raw.best==='object')){
    const migrated=migrateFromV2(v2raw);
    saveProg(migrated);
    return migrated;
  }
  // 3. full defaults.
  const fresh=normalizeSave(null);
  saveProg(fresh);
  return fresh;
}
function saveProg(p){try{SAFE_LS.setItem(SAVE_KEY,JSON.stringify(p))}catch(e){}}

/* ================= BGM / SFX ================= */
let _bgm=null;
function initBGM(){
  if(_bgm)return;
  if(typeof WakuwakuMP3BGM!=='undefined'){
    _bgm=new WakuwakuMP3BGM('nature');
    const on=WakuwakuMP3BGM.loadState();_bgm.setEnabled(on);if(on)_bgm.start();
  }
  syncBgm();
}
function toggleBGM(){if(!_bgm){initBGM();return;}const on=_bgm.toggle();if(typeof WakuwakuMP3BGM!=='undefined')WakuwakuMP3BGM.saveState(on);syncBgm();}
function syncBgm(){document.getElementById('ui-bgm-btn').textContent=(_bgm&&_bgm.enabled)?'🔊':'🔇';}
document.getElementById('ui-bgm-btn').addEventListener('click',toggleBGM);

let _ac=null;
function ac(){if(!_ac){try{_ac=new (window.AudioContext||window.webkitAudioContext)();}catch(e){}}if(_ac&&_ac.state==='suspended')_ac.resume();return _ac;}
function beep(f,t,dur,vol,wave){
  const c=ac();if(!c)return;
  const o=c.createOscillator(),g=c.createGain();
  o.type=wave||'sine';o.frequency.setValueAtTime(f,c.currentTime+t);
  g.gain.setValueAtTime(0,c.currentTime+t);
  g.gain.linearRampToValueAtTime(vol||0.15,c.currentTime+t+0.015);
  g.gain.exponentialRampToValueAtTime(0.001,c.currentTime+t+dur);
  o.connect(g);g.connect(c.destination);
  o.start(c.currentTime+t);o.stop(c.currentTime+t+dur+0.05);
}
function sfxFound(){[523,659,784,1047].forEach((f,i)=>beep(f,i*0.09,0.28,0.16,'triangle'));}
function sfxClear(){[523,659,784,1047,1319,1568].forEach((f,i)=>beep(f,i*0.11,0.4,0.15,'triangle'));}
function sfxPeek(){beep(880,0,0.1,0.07,'sine');beep(1175,0.09,0.12,0.06,'sine');}
function sfxHint(){[1047,1319,1568,1047,1319,1568].forEach((f,i)=>beep(f,i*0.07,0.15,0.08,'sine'));}
function sfxTap(){beep(440,0,0.06,0.05,'square');}

document.getElementById('back-btn').addEventListener('click',()=>{
  if(state==='play'){showMap();}

/* ================= animals ================= */
const ANIMALS={
  neko:  {name:'ねこ',    emoji:'🐱', body:0xF7B267, body2:0xE8975A, belly:0xFFF1DC, ear:'cone'},
  usagi: {name:'うさぎ',  emoji:'🐰', body:0xFFFFFF, body2:0xF3E4E8, belly:0xFFE9F0, ear:'long'},
  kuma:  {name:'くま',    emoji:'🐻', body:0xA9743F, body2:0x8F5F30, belly:0xE8C79A, ear:'round'},
  kitsune:{name:'きつね', emoji:'🦊', body:0xF1913D, body2:0xD97A2B, belly:0xFFF4E3, ear:'cone'},
  panda: {name:'ぱんだ',  emoji:'🐼', body:0xFFFFFF, body2:0x33333B, belly:0xFFFFFF, ear:'round'},
  pengin:{name:'ぺんぎん',emoji:'🐧', body:0x3B4666, body2:0x2C3550, belly:0xFFFFFF, ear:'none'},
  risu:  {name:'りす',    emoji:'🐿️', body:0xCE8944, body2:0xB7712E, belly:0xF3DCB4, ear:'round'},
  hitsuji:{name:'ひつじ', emoji:'🐑', body:0xFDF6EC, body2:0xEFE3D0, belly:0xFDF6EC, ear:'none'}
};

/* ================= partners ================= */
const PARTNERS={
  neko:{name:'ねこ',flavor:'いっしょに たんけんする あいぼう'},
  usagi:{name:'うさぎ',flavor:'いっしょに たんけんする あいぼう'},
  kuma:{name:'くま',flavor:'いっしょに たんけんする あいぼう'},
  kitsune:{name:'きつね',flavor:'いっしょに たんけんする あいぼう'}
};
let partner='neko';

/* ================= stages =================
   Order/name/theme/mode faithfully mirrors kakurenbo_v2.html's 8-stage list
   (search/peek strictly alternating). forest/meadow/pond/beach/snow/night are
   the 6 islands already present in this v3 draft; hills(search) and magic(peek)
   are the 2 new islands added to reach parity with v2. */

/* materials helper */
function lam(c,opt){const m=new THREE.MeshLambertMaterial(Object.assign({color:c},opt||{}));return m;}
function mesh(geo,mat,x,y,z){const m=new THREE.Mesh(geo,mat);m.position.set(x||0,y||0,z||0);m.castShadow=true;m.receiveShadow=true;return m;}

/* ================= camera orbit ================= */
const orbit={theta:0.7,phi:0.86,radius:23,tTheta:0.7,tPhi:0.86,tRadius:23};
const ORB={phiMin:0.42,phiMax:1.22,rMin:14,rMax:32};
let lastInput=0;
function camUpdate(dt){
  orbit.theta+=(orbit.tTheta-orbit.theta)*Math.min(1,dt*9);
  orbit.phi+=(orbit.tPhi-orbit.phi)*Math.min(1,dt*9);
  orbit.radius+=(orbit.tRadius-orbit.radius)*Math.min(1,dt*7);
  if(state==='play'&&performance.now()-lastInput>6000)orbit.tTheta+=dt*0.07;
  const s=Math.sin(orbit.phi),c=Math.cos(orbit.phi);
  camera.position.set(orbit.radius*s*Math.cos(orbit.theta),orbit.radius*c+2.0,orbit.radius*s*Math.sin(orbit.theta));
  camera.lookAt(0,1.4,0);
}

/* ================= input (drag / pinch / tap) ================= */
const ptrs=new Map();
let tapStart=null,pinchD=0;
cv.addEventListener('pointerdown',e=>{
  cv.setPointerCapture&&cv.setPointerCapture(e.pointerId);
  ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});
  lastInput=performance.now();
  if(ptrs.size===1)tapStart={x:e.clientX,y:e.clientY,t:performance.now(),moved:0};
  if(ptrs.size===2){const a=[...ptrs.values()];pinchD=Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y);}
});
cv.addEventListener('pointermove',e=>{
  const p=ptrs.get(e.pointerId);if(!p)return;
  const dx=e.clientX-p.x,dy=e.clientY-p.y;
  p.x=e.clientX;p.y=e.clientY;
  lastInput=performance.now();
  if(tapStart)tapStart.moved+=Math.abs(dx)+Math.abs(dy);
  if(ptrs.size===1){
    orbit.tTheta+=dx*0.0062;
    orbit.tPhi=Math.max(ORB.phiMin,Math.min(ORB.phiMax,orbit.tPhi-dy*0.0045));
  }else if(ptrs.size===2){
    const a=[...ptrs.values()];
    const d=Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y);
    if(pinchD>0)orbit.tRadius=Math.max(ORB.rMin,Math.min(ORB.rMax,orbit.tRadius*(pinchD/d)));
    pinchD=d;
  }
});
function ptrEnd(e){
  ptrs.delete(e.pointerId);
  if(ptrs.size<2)pinchD=0;
  if(tapStart&&ptrs.size===0){
    const dt=performance.now()-tapStart.t;
    if(tapStart.moved<12&&dt<450)onTap(e.clientX,e.clientY);
    tapStart=null;
  }
}
cv.addEventListener('pointerup',ptrEnd);
cv.addEventListener('pointercancel',ptrEnd);
cv.addEventListener('wheel',e=>{
  e.preventDefault();
  orbit.tRadius=Math.max(ORB.rMin,Math.min(ORB.rMax,orbit.tRadius+e.deltaY*0.02));
  lastInput=performance.now();
},{passive:false});

const R_TOP=9;
function buildIslandBase(st){
  const g=new THREE.Group();
  const top=mesh(new THREE.CylinderGeometry(R_TOP,R_TOP*0.94,1.6,14),lam(st.ground),0,-0.8,0);
  top.receiveShadow=true;g.add(top);
  const dirt=mesh(new THREE.CylinderGeometry(R_TOP*0.94,4.2,4.6,14),lam(st.side),0,-3.9,0);g.add(dirt);
  const tip=mesh(new THREE.ConeGeometry(4.2,3.4,14),lam(st.side),0,-7.9,0);
  tip.rotation.x=Math.PI;g.add(tip);
  for(let i=0;i<4;i++){
    const r=0.5+Math.random()*0.7;
    const rock=mesh(new THREE.DodecahedronGeometry(r,0),lam(0x9AA3B0),
      (Math.random()*10-5),-8.5-Math.random()*3,(Math.random()*10-5));
    rock.userData.float={ph:Math.random()*7,amp:0.4+Math.random()*0.4,base:rock.position.y};
    ambient.push(rock);g.add(rock);
  }
  return g;
}
function addCloud(g,x,y,z,s){
  const c=new THREE.Group();
  const m=lam(0xFFFFFF,{transparent:true,opacity:0.92});
  [[0,0,0,1.5],[1.3,0.2,0.3,1.05],[-1.3,0.15,-0.2,1.1],[0.4,0.6,-0.4,0.9]].forEach(p=>{
    const b=new THREE.Mesh(new THREE.SphereGeometry(p[3],10,8),m);b.position.set(p[0],p[1],p[2]);c.add(b);
  });
  c.position.set(x,y,z);c.scale.setScalar(s);
  c.userData.cloud={sp:0.05+Math.random()*0.06,r:Math.hypot(x,z),a:Math.atan2(z,x),y:y};
  ambient.push(c);g.add(c);
}

/* ================= placement ================= */
function polar(r,a){return new THREE.Vector3(Math.cos(a)*r,0,Math.sin(a)*r);}
function placeProps(list){
  const placed=[];
  function tryPlace(builder,rMin,rMax,minDist,scale,big){
    for(let t=0;t<40;t++){
      const r=rMin+Math.random()*(rMax-rMin),a=Math.random()*Math.PI*2;
      const p=polar(r,a);
      let ok=true;
      for(const q of placed){if(p.distanceTo(q.p)<minDist+q.d){ok=false;break;}}
      if(!ok)continue;
      const m=builder(scale);
      m.position.copy(p);m.rotation.y=Math.random()*Math.PI*2;
      world.add(m);
      placed.push({p,d:minDist,big:!!big,mesh:m});
      return m;
    }
    return null;
  }
  const hiders=[];
  for(const it of list){
    for(let i=0;i<it.n;i++){
      const sc=it.s?(it.s[0]+Math.random()*(it.s[1]-it.s[0])):1;
      const m=tryPlace(it.b,it.rMin||3.0,it.rMax||8.2,it.dist||1.4,sc,it.hide);
      if(m&&it.hide)hiders.push(m);
    }
  }
  return hiders;
}

function spawnAnimals(st,hiders){
  const keys=Object.keys(ANIMALS);
  for(let i=keys.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[keys[i],keys[j]]=[keys[j],keys[i]];}
  const chosen=keys.slice(0,st.count);
  const usedH=[...hiders];
  for(let i=usedH.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[usedH[i],usedH[j]]=[usedH[j],usedH[i]];}
  chosen.forEach((key,i)=>{
    const an=buildAnimal(key);
    const h=usedH[i%usedH.length];
    const a=Math.random()*Math.PI*2;
    const off=polar(0.95+Math.random()*0.35,a);
    an.position.copy(h.position).add(off);
    const r=Math.hypot(an.position.x,an.position.z);
    if(r>R_TOP-1.2)an.position.multiplyScalar((R_TOP-1.2)/r);
    an.rotation.y=Math.random()*Math.PI*2;
    an.scale.setScalar(0.92);
    world.add(an);
    animals.push(an);hitTargets.push(an.userData.hit);
  });
  /* found slots around flag */
  chosen.forEach((k,i)=>{
    const a=-Math.PI/2+ (i-(chosen.length-1)/2)*0.75;
    foundSlots.push(polar(1.5,a+Math.PI/2));
  });
  return chosen;
}

/* ================= particles ================= */
function burst(pos,colors,n,spread,up){
  const geo=new THREE.BufferGeometry();
  const P=new Float32Array(n*3),C=new Float32Array(n*3),V=[];
  for(let i=0;i<n;i++){
    P[i*3]=pos.x;P[i*3+1]=pos.y;P[i*3+2]=pos.z;
    const col=new THREE.Color(colors[i%colors.length]);
    C[i*3]=col.r;C[i*3+1]=col.g;C[i*3+2]=col.b;
    V.push(new THREE.Vector3((Math.random()-0.5)*spread,up*(0.6+Math.random()*0.9),(Math.random()-0.5)*spread));
  }
  geo.setAttribute('position',new THREE.BufferAttribute(P,3));
  geo.setAttribute('color',new THREE.BufferAttribute(C,3));
  const mat=new THREE.PointsMaterial({size:0.24,vertexColors:true,transparent:true,opacity:1});
  const pts=new THREE.Points(geo,mat);
  world.add(pts);
  particles.push({pts,V,life:1.3,age:0,grav:-6});
}

/* ================= peek (とびだし) mode =================
   Faithful port of kakurenbo_v2.html's peek loop (holes/pops/decoy/up/gap/need),
   reimplemented as real 3D pop-up targets instead of 2D sprites. Traced from v2:
   - one active pop spawns every stageData.gap*(0.7~1.3) seconds, capped at
     min(3, ceil(holes/3)) concurrently active pops (see v2 updatePeek()).
   - each pop shows the fixed target species ~50% of the time, otherwise a
     decoy species (v2: `showTarget=Math.random()<0.5`).
   - tapping the target while visible = hit (need++), tapping a decoy = miss
     (+time penalty, exactly like v2's `timeLeft=Math.max(0,timeLeft-2)`).
   - tapping empty ground / a pop that already vanished = no penalty (v2 has
     no such penalty branch either — verified, not guessed).
   - streak bonus (new v3 addition, does NOT alter the misses-based star calc). */
let peekHoles=[],peekPops=[],peekTarget=null,peekFound=0,peekNeed=0,peekSpawnTimer=0;
let peekStreak=0,peekBestStreakRun=0,peekTimeLeft=0;

function setupPeekHoles(st,hiders){
  const src=hiders.length?hiders:[{position:new THREE.Vector3(0,0,0)}];
  peekHoles=[];
  for(let i=0;i<st.holes;i++){
    const base=src[i%src.length].position;
    const jitter=(i>=src.length)?new THREE.Vector3((Math.random()-0.5)*1.1,0,(Math.random()-0.5)*1.1):new THREE.Vector3();
    peekHoles.push(base.clone().add(jitter));
  }
  peekPops=[];peekFound=0;peekSpawnTimer=0;peekStreak=0;peekBestStreakRun=0;peekMisses=0;
  peekTimeLeft=st.time;peekNeed=st.need;
  const keys=Object.keys(ANIMALS);
  peekTarget=keys[Math.floor(Math.random()*keys.length)];
}

function spawnPeekPop(st){
  const freeIdx=peekHoles.map((h,i)=>i).filter(i=>!peekPops.some(p=>p.hole===i&&p.phase!=='gone'));
  if(!freeIdx.length)return;
  const hi=freeIdx[Math.floor(Math.random()*freeIdx.length)];
  const showTarget=Math.random()<0.5;
  let key=peekTarget;
  if(!showTarget){
    const others=Object.keys(ANIMALS).filter(k=>k!==peekTarget);
    key=others[Math.floor(Math.random()*others.length)];
  }
  const an=buildAnimal(key);
  an.scale.setScalar(0.62);
  an.userData.ex.visible=false;
  const base=peekHoles[hi];
  an.position.set(base.x,-1.1,base.z);
  world.add(an);
  peekPops.push({mesh:an,hole:hi,isTarget:key===peekTarget,phase:'up',t:0,life:st.up,tapped:false,baseY:base.y});
}

function updatePeekMode(dt){
  if(state!=='play')return;
  const st=STAGES[curStage];
  if(st.mode!=='peek')return;
  peekTimeLeft=Math.max(0,peekTimeLeft-dt);
  document.getElementById('timer').textContent='⏱ '+fmtTime(Math.ceil(peekTimeLeft));
  if(peekTimeLeft<=0){
    if(peekFound<peekNeed)peekFinish(false);
    return;
  }
  peekSpawnTimer-=dt;
  const activeCnt=peekPops.filter(p=>p.phase!=='gone').length;
  const maxActive=Math.min(3,Math.ceil(st.holes/3));
  if(peekSpawnTimer<=0&&activeCnt<maxActive){
    peekSpawnTimer=st.gap*(0.7+Math.random()*0.6);
    spawnPeekPop(st);
  }
  for(let i=peekPops.length-1;i>=0;i--){
    const p=peekPops[i];p.t+=dt;
    const u=p.mesh.userData;
    if(p.phase==='up'){
      const k=Math.min(1,p.t/0.25);
      p.mesh.position.y=p.baseY-1.1+k*1.1;
      if(p.t>0.25){p.phase='stay';p.t=0;}
    }else if(p.phase==='stay'){
      p.mesh.position.y=p.baseY;
      u.inner.scale.y=1+Math.sin((p.t+i)*6)*0.05;
      if(p.t>p.life){p.phase='down';p.t=0;}
    }else if(p.phase==='down'){
      const k=Math.min(1,p.t/0.22);
      p.mesh.position.y=p.baseY-k*1.1;
      if(p.t>0.22){p.phase='gone';}
    }
    if(p.phase==='gone'){
      world.remove(p.mesh);
      p.mesh.traverse(o=>{if(o.geometry)o.geometry.dispose();if(o.material&&o.material.dispose)o.material.dispose();});
      peekPops.splice(i,1);
    }
  }
}
function onPeekTap(nx,ny){
  raycaster.setFromCamera({x:nx,y:ny},camera);
  const meshes=peekPops.filter(p=>p.phase!=='gone'&&!p.tapped).map(p=>p.mesh.userData.hit);
  const hits=raycaster.intersectObjects(meshes,false);
  if(!hits.length){sfxTap();return;}
  const hitMesh=hits[0].object;
  const p=peekPops.find(pp=>pp.mesh.userData.hit===hitMesh);
  if(!p||p.tapped)return;
  p.tapped=true;p.phase='down';p.t=0;
  if(p.isTarget){
    peekFound++;peekStreak++;
    if(peekStreak>peekBestStreakRun)peekBestStreakRun=peekStreak;
    sfxFound();confetti(p.mesh.position);
    toast(peekStreak>=3?('れんぞく '+peekStreak+'かい！✨'):'ナイス！',1000);
    updatePeekHud();
    if(peekFound>=peekNeed){setTimeout(()=>peekFinish(true),500);}
  }else{
    peekMisses++;peekStreak=0;
    peekTimeLeft=Math.max(0,peekTimeLeft-2);
    sfxTap();
    toast('ちがうよ！-2びょう',1000);
    updatePeekHud();
  }
}
function updatePeekHud(){
  document.getElementById('peek-progress').textContent=peekFound+'/'+peekNeed;
  document.getElementById('peek-streak').textContent=peekStreak>=2?('れんぞく'+peekStreak):'';
  document.getElementById('peek-target-ico').textContent=peekTarget?ANIMALS[peekTarget].emoji:'';
}
function clearAllPeekTimers(){
  for(const p of peekPops){
    world.remove(p.mesh);
    p.mesh.traverse(o=>{if(o.geometry)o.geometry.dispose();if(o.material&&o.material.dispose)o.material.dispose();});
  }
  peekPops=[];peekSpawnTimer=0;
}
function peekFinish(success){
  if(state!=='play')return;
  state='clear';
  clearAllPeekTimers();
  if(timerId)clearInterval(timerId);
  const st=STAGES[curStage];
  document.getElementById('clear-title').textContent=success?'とびだし せいこう！':'じかんぎれ…';
  const box=document.getElementById('clear-stars');box.innerHTML='';
  document.getElementById('allclear-msg').style.display='none';
  document.getElementById('btn-next').style.display='none';
  if(success){
    sfxClear();confetti(new THREE.Vector3(0,1.5,0));
    const stars=(peekMisses<=1)?3:(peekMisses<=4?2:1);
    const rec=prog.stages[curStage];
    if(stars>rec.stars)rec.stars=stars;
    const scoreVal=peekFound+peekBestStreakRun*0.1; // higher is better; simple, consistent, no fake baseline
    if(rec.bestPeekBest===null||scoreVal>rec.bestPeekBest)rec.bestPeekBest=scoreVal;
    saveProg(prog);
    for(let i=0;i<3;i++){
      const s=document.createElement('span');
      s.textContent='★';if(i>=stars)s.classList.add('dim');
      box.appendChild(s);
      setTimeout(()=>s.classList.add('in'),400+i*380);
    }
    document.getElementById('btn-next').style.display=(curStage<STAGES.length-1)?'block':'none';
    const allClear=STAGES.every((_,i)=>prog.stages[i].stars>0);
    document.getElementById('allclear-msg').style.display=(allClear&&curStage===STAGES.length-1)?'block':'none';
  }
  document.getElementById('clear-time').textContent='みつけた '+peekFound+'/'+peekNeed+' ／ ミス '+peekMisses;
  setTimeout(()=>{document.getElementById('clear-screen').classList.add('on');},success?800:200);
}

/* ---- tap / find ---- */
function onTap(cx,cy){
  if(state!=='play')return;
  const nx=(cx/window.innerWidth)*2-1,ny=-(cy/window.innerHeight)*2+1;
  const st=STAGES[curStage];
  if(st.mode==='peek'){onPeekTap(nx,ny);return;}
  raycaster.setFromCamera({x:nx,y:ny},camera);
  const hits=raycaster.intersectObjects(hitTargets,false);
  if(hits.length){
    const an=hits[0].object.parent;
    if(an&&an.userData&&!an.userData.found){foundAnimal(an);return;}
  }
  /* miss: empty tap or an already-found spot — feeds the v2 misses-based star formula */
  misses++;
  sfxTap();
}
function foundAnimal(an){
  an.userData.found=true;
  foundCnt++;
  sfxFound();
  confetti(an.position);
  const idx=animals.indexOf(an);
  const chip=document.getElementById('chip-'+idx);
  if(chip){chip.classList.add('got','pop');}
  toast(ANIMALS[an.userData.key].name+' みつけた！',1300);

  const slot=foundSlots[foundCnt-1]||new THREE.Vector3(0,0,2);
  an.userData.anim={type:'jump',t:0,from:an.position.clone(),to:slot.clone()};
  if(foundCnt>=animals.length){
    setTimeout(stageClear,1400);
  }
}
function stageClear(){
  if(state!=='play')return;
  state='clear';
  if(timerId)clearInterval(timerId);
  sfxClear();
  confetti(new THREE.Vector3(0,1.5,0));
  const st=STAGES[curStage];
  /* verified v2 search-mode formula: misses===0 -> 3, <=2 -> 2, else 1 */
  const stars=(misses===0)?3:(misses<=2?2:1);
  const rec=prog.stages[curStage];
  if(stars>rec.stars)rec.stars=stars;
  let bestTxt='';
  if(rec.bestSearchMs===null||elapsed<rec.bestSearchMs){rec.bestSearchMs=elapsed;bestTxt=' 🏆 ベストタイム！';}

  const box=document.getElementById('clear-stars');box.innerHTML='';
  for(let i=0;i<3;i++){
    const s=document.createElement('span');
    s.textContent='★';if(i>=stars)s.classList.add('dim');
    box.appendChild(s);

  document.getElementById('allclear-msg').style.display=(allClear&&curStage===STAGES.length-1)?'block':'none';
  document.getElementById('btn-next').style.display=(curStage<STAGES.length-1)?'block':'none';

}

document.getElementById('hint-btn').addEventListener('click',()=>{
  if(state!=='play'||hints<=0||hintBusy)return;
  const st=STAGES[curStage];
  if(st.mode==='peek'){
    const activePop=peekPops.find(p=>p.isTarget&&p.phase!=='gone'&&!p.tapped);
    hints--;document.getElementById('hint-cnt').textContent=hints;
    if(hints<=0)document.getElementById('hint-btn').disabled=true;
    hintBusy=true;sfxHint();
    if(activePop){
      fountain(activePop.mesh.position);
      showTip('いま とびだしてる ところを タップ！',2600);
    }else{
      /* indicate a hole most likely to spawn next (any currently free slot) */
      const freeIdx=peekHoles.map((h,i)=>i).filter(i=>!peekPops.some(p=>p.hole===i&&p.phase!=='gone'));
      if(freeIdx.length){
        const p=peekHoles[freeIdx[Math.floor(Math.random()*freeIdx.length)]];
        fountain(p);
      }
      showTip('つぎに とびだしそうな ばしょを みてね！',2600);
    }
    setTimeout(()=>{hintBusy=false;},600);
    return;
  }
  const rest=animals.filter(a=>!a.userData.found);
  if(!rest.length)return;
  hints--;
  document.getElementById('hint-cnt').textContent=hints;
  if(hints<=0)document.getElementById('hint-btn').disabled=true;
  hintBusy=true;
  const a=rest[Math.floor(Math.random()*rest.length)];
  sfxHint();
  fountain(a.position);
  setTimeout(()=>fountain(a.position),500);
  setTimeout(()=>fountain(a.position),1000);
  showTip('キラキラの ちかくを さがして！',2600);
  setTimeout(()=>{hintBusy=false;},1100);
});

/* ---- partner previews (live 3D snapshots, cached renderers to avoid context leaks) ---- */
const previewRenderers=new Map();
function getPreviewCtx(canvas){
  if(previewRenderers.has(canvas))return previewRenderers.get(canvas);
  const renderer=new THREE.WebGLRenderer({canvas,alpha:true,antialias:true});
  renderer.setSize(canvas.width,canvas.height,false);
  const scene=new THREE.Scene();
  const cam=new THREE.PerspectiveCamera(38,canvas.width/canvas.height,0.1,20);
  cam.position.set(0,1.25,3.4);cam.lookAt(0,0.9,0);
  scene.add(new THREE.HemisphereLight(0xffffff,0x888888,1.15));
  const d=new THREE.DirectionalLight(0xffffff,0.65);d.position.set(2,4,3);scene.add(d);
  const ctx={renderer,scene,cam,anMesh:null};
  previewRenderers.set(canvas,ctx);
  return ctx;
}
function renderPartnerPreview(canvas,key){
  const ctx=getPreviewCtx(canvas);
  if(ctx.anMesh){ctx.scene.remove(ctx.anMesh);ctx.anMesh.traverse(o=>{if(o.geometry)o.geometry.dispose();if(o.material&&o.material.dispose)o.material.dispose();});}
  const an=buildAnimal(key);
  an.userData.ex.visible=false;an.scale.setScalar(1.35);an.position.y=-0.85;
  ctx.scene.add(an);ctx.anMesh=an;
  ctx.renderer.render(ctx.scene,ctx.cam);
}

/* ================= animation loop ================= */
let lastT=performance.now();
function loop(){
  requestAnimationFrame(loop);
  const now=performance.now();
  const dt=Math.min(0.05,(now-lastT)/1000);lastT=now;
  const t=now/1000;
  camUpdate(dt);
  updatePeekMode(dt);
  if(world)world.position.y=Math.sin(t*0.5)*0.14;
  if(flagMesh)flagMesh.rotation.y=Math.sin(t*2.2)*0.25;
  /* ambient */
  for(const a of ambient){
    if(a.userData.cloud){
      const c=a.userData.cloud;c.a+=c.sp*dt;
      a.position.set(Math.cos(c.a)*c.r,c.y+Math.sin(t*0.7+c.r)*0.3,Math.sin(c.a)*c.r);
    }else if(a.userData.float){
      const f=a.userData.float;
      a.position.y=f.base+Math.sin(t*0.6+f.ph)*f.amp;
      a.rotation.y+=dt*0.15;
    }else if(a.userData.snow){
      const P=a.geometry.attributes.position,sp=a.userData.snow;
      for(let i=0;i<sp.length;i++){
        let y=P.getY(i)-sp[i]*dt;
        if(y<-0.5)y=15;
        P.setY(i,y);P.setX(i,P.getX(i)+Math.sin(t+i)*dt*0.3);
      }
      P.needsUpdate=true;
    }else if(a.userData.fire){
      const P=a.geometry.attributes.position,ph=a.userData.fire;
      for(let i=0;i<ph.length;i++){
        P.setY(i,P.getY(i)+Math.sin(t*1.4+ph[i])*dt*0.5);
        P.setX(i,P.getX(i)+Math.cos(t*0.8+ph[i])*dt*0.3);
      }
      P.needsUpdate=true;
      a.material.opacity=0.55+Math.sin(t*2.5)*0.35;
    }else if(a.userData.bfly){
      const b=a.userData.bfly;b.a+=b.sp*dt;
      a.position.set(Math.cos(b.a)*b.r,b.h+Math.sin(t*1.7+b.r)*0.5,Math.sin(b.a)*b.r);
      a.rotation.y=-b.a;
      const f=Math.sin(t*14)*0.9;
      b.w1.rotation.y=f;b.w2.rotation.y=-f;
    }
  }
  /* animals */
  for(const an of animals){
    const u=an.userData;
    if(u.anim){
      const A=u.anim;A.t+=dt;
      if(A.type==='jump'){
        const k=Math.min(1,A.t/1.1);
        an.position.lerpVectors(A.from,A.to,k);
        an.position.y=Math.sin(k*Math.PI)*2.6*(1-k*0.3)+Math.sin(Math.min(1,k*3)*Math.PI)*0.0;
        u.inner.rotation.y+=dt*9;
        if(k>=1){an.position.y=0;u.inner.rotation.y=0;an.lookAt(an.position.x*2,0.5,an.position.z*2);u.anim={type:'dance',t:0};}
      }else if(A.type==='dance'){
        u.inner.position.y=Math.abs(Math.sin(A.t*5))*0.35;
        u.inner.rotation.z=Math.sin(A.t*5)*0.12;
      }
    }else{
      /* idle breathe + peek */
      u.inner.scale.y=1+Math.sin(t*2.2+u.ph)*0.03;
      u.head.rotation.z=Math.sin(t*1.1+u.ph)*0.07;
      if(u.tail)u.tail.rotation.y=Math.sin(t*3+u.ph)*0.3;
      u.peekT-=dt;
      if(u.peekT<0&&state==='play'){
        u.peekT=4+Math.random()*6;
        u.anim=null;
        u.ex.visible=true;
        const anRef=an;
        (function(uu,aRef){
          let pt=0;
          uu.peekAnim=true;
          const iv=setInterval(()=>{
            pt+=0.05;
            uu.inner.position.y=Math.abs(Math.sin(pt*Math.PI*2))*0.55;
            if(pt>=1){clearInterval(iv);uu.inner.position.y=0;uu.ex.visible=false;uu.peekAnim=false;}
          },50);
        })(u,anRef);
        if(Math.random()<0.7)sfxPeek();
      }
      if(u.ex.visible)u.ex.quaternion.copy(camera.quaternion);
    }
  }
  /* particles */
  for(let i=particles.length-1;i>=0;i--){
    const p=particles[i];p.age+=dt;
    const P=p.pts.geometry.attributes.position;
    for(let j=0;j<p.V.length;j++){
      p.V[j].y+=p.grav*dt;
      P.setX(j,P.getX(j)+p.V[j].x*dt);
      P.setY(j,Math.max(0.05,P.getY(j)+p.V[j].y*dt));
      P.setZ(j,P.getZ(j)+p.V[j].z*dt);
    }
    P.needsUpdate=true;
    p.pts.material.opacity=Math.max(0,1-p.age/p.life);
    if(p.age>=p.life){world.remove(p.pts);p.pts.geometry.dispose();particles.splice(i,1);}
  }
  /* night glow pulse */
  for(const gl of nightGlows){gl.material.emissiveIntensity=0.8+Math.sin(t*3)*0.3;}
  renderer.render(scene,camera);
}

/* ================= boot ================= */
showTitle();
loop();
</script>
