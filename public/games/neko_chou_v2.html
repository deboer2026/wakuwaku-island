<script>
(() => {
'use strict';
const TUNE={SNEAK_SPEED:1.35,NORMAL_SPEED:2.75,RUN_SPEED:4.75,SNEAK_DISTANCE:42,NORMAL_DISTANCE:142,RUN_DISTANCE:300,SNEAK_HOLD_SEC:.6,SNEAK_STAR_COUNT:3,CATCH_RADIUS:1.18,CATCH_COOLDOWN:1.2,ALERT_NORMAL_GAIN:.19,ALERT_RUN_GAIN:.62,ALERT_DECAY:.25,ALERT_MAX:1,CORRECTION_WINDOW:.72,RARE_BASE_RATE:.08,RARE_PITY_SPAWNS:2,MAX_BUTTERFLIES:12,MAX_PARTICLES:50,GRASS_HIGH:1000,GRASS_LOW:400,CAMERA_LERP:.075};
const SAVE_KEY='neko_chou_v2'; const $=id=>document.getElementById(id); const screens=['title','cats','stages','book'];
const STAGES=[
 {name:'はるの おはなばたけ',target:5,theme:'happy',sky:0x9fdcff,ground:0x76c76d,desc:'はじめての そーっと あるき',rare:'gold',unlocked:true},
 {name:'たんぽぽの おか',target:6,theme:'cute',sky:0xbdefff,ground:0x99cf65,desc:'おはなで ひとやすみする ちょうちょ',rare:'gold'},
 {name:'せせらぎの かわべ',target:8,theme:'forest',sky:0x91d3dd,ground:0x6eb79a,desc:'かわと いわの あいだを そっと',rare:'crystal'},
 {name:'ひまわり めいろ',target:8,theme:'magical',sky:0xffb677,ground:0xd6aa45,desc:'ゆうがたの ひまわり かくれんぼ',rare:'gold'}];
const CATS=[{id:'mike',name:'みけねこ',body:0xf5ead5,patch:0x9a6543,eye:0x3e352f},{id:'shiro',name:'しろねこ',body:0xffffff,patch:0xffffff,eye:0x4c9be8},{id:'kuro',name:'くろねこ',body:0x34313a,patch:0x34313a,eye:0xf4c950},{id:'tora',name:'とらねこ',body:0xf3a15b,patch:0xcc6537,eye:0x5b3b29}];
const BOOK=[['sakura','さくらちょう','ふつう','pink'],['lemon','れもんちょう','ふつう','yellow'],['mori','もりのみどりちょう','ふつう','green'],['sora','そらいろちょう','ふつう','blue'],['momo','ももいろちょう','ふつう','pink'],['sumire','すみれちょう','ふつう','purple'],['mikan','みかんちょう','ふつう','orange'],['ribbon','りぼんちょう','めずらしい','pink'],['dots','みずたまちょう','めずらしい','blue'],['leaf','はっぱちょう','めずらしい','green'],['gold','こんじきちょう','レア','gold'],['crystal','みずいろクリスタル','レア','crystal']].map(([id,name,rare,color])=>({id,name,rare,color}));
const SAFE_LS={get(k){try{return localStorage.getItem(k)}catch(e){return null}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}}};
function normalise(raw){let x={};try{x=JSON.parse(raw)||{}}catch(e){} const valid=CATS.some(c=>c.id===x.cat)?x.cat:'mike';const stages=Array.isArray(x.stages)?x.stages.slice(0,4).map(v=>Math.max(0,Math.min(3,Number(v)||0))):[0,0,0,0];const book=Array.isArray(x.book)?x.book.filter(id=>BOOK.some(b=>b.id===id)).slice(0,12):[];const acc=Array.isArray(x.accessories)?x.accessories.filter(id=>['ribbon','flower','bell','hairpin','crown'].includes(id)):[];return{cat:valid,stages,book:[...new Set(book)],accessories:[...new Set(acc)],sound:x.sound!==false,rarePity:Array.isArray(x.rarePity)?x.rarePity.slice(0,4).map(v=>Math.max(0,Number(v)||0)):[0,0,0,0]};}
let save=normalise(SAFE_LS.get(SAVE_KEY));function persist(){SAFE_LS.set(SAVE_KEY,JSON.stringify(save))}persist();
let renderer,scene,camera,clock,cat,catParts=[],ground,raycaster,newTarget=null,playing=false,paused=false,currentStage=0,butterflies=[],particles=[],catching=false,catchFlowToken=0,catchTargetId=null,friendCount=0,sneakCount=0,goalShown=false,runTime=0,mouseDown=false,activePointer=null,lastPointer=null,bgm=null,audio=null,stageIntro=0;
const quality=(navigator.deviceMemory||4)<=2||(navigator.hardwareConcurrency||4)<=4?'low':'high';
function audioUnlock(){if(!audio){try{audio=new (window.AudioContext||window.webkitAudioContext)()}catch(e){}}if(audio&&audio.state==='suspended')audio.resume();}
function beep(freq=500,d=.08,type='sine'){if(!audio)return;const o=audio.createOscillator(),g=audio.createGain();o.type=type;o.frequency.value=freq;g.gain.setValueAtTime(.0001,audio.currentTime);g.gain.exponentialRampToValueAtTime(.08,audio.currentTime+.01);g.gain.exponentialRampToValueAtTime(.0001,audio.currentTime+d);o.connect(g);g.connect(audio.destination);o.start();o.stop(audio.currentTime+d+.03)}
function init(){renderer=new THREE.WebGLRenderer({antialias:quality==='high',alpha:false});renderer.setPixelRatio(Math.min(devicePixelRatio,quality==='high'?2:1.5));renderer.setSize(innerWidth,innerHeight);renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;$('scene').appendChild(renderer.domElement);scene=new THREE.Scene();camera=new THREE.PerspectiveCamera(45,innerWidth/innerHeight,.1,90);camera.position.set(0,8,12);clock=new THREE.Clock();raycaster=new THREE.Raycaster();scene.add(new THREE.HemisphereLight(0xdff5ff,0x5c8a50,.95));const sun=new THREE.DirectionalLight(0xfff2c8,.72);sun.position.set(5,11,4);sun.castShadow=true;sun.shadow.mapSize.set(512,512);scene.add(sun);addWorld();animate();addEvents();updateTitle();}
function mat(color,extra={}){return new THREE.MeshLambertMaterial(Object.assign({color},extra))}
function mesh(g,m,x=0,y=0,z=0){const o=new THREE.Mesh(g,m);o.position.set(x,y,z);o.castShadow=true;o.receiveShadow=true;scene.add(o);return o}
function clearWorld(){for(const o of [...scene.children])if(!o.isLight&&o!==camera)scene.remove(o);butterflies=[];particles=[];cat=null;catParts=[];}
function addWorld(){clearWorld();const s=STAGES[currentStage];scene.background=new THREE.Color(s.sky);scene.fog=new THREE.FogExp2(s.sky,.026);ground=mesh(new THREE.PlaneGeometry(54,43),mat(s.ground),0,0,0);ground.rotation.x=-Math.PI/2;ground.receiveShadow=true;const path=mesh(new THREE.PlaneGeometry(8,43),mat(currentStage===3?0xe8bc56:0xf3dda0),0,.012,0);path.rotation.x=-Math.PI/2;path.receiveShadow=true;makeGrass();makeGarden();makeCat();}
function makeGrass(){const n=quality==='high'?TUNE.GRASS_HIGH:TUNE.GRASS_LOW;const geo=new THREE.ConeGeometry(.045,.42,3);const grass=new THREE.InstancedMesh(geo,mat(0x4aa65d),n);const dummy=new THREE.Object3D();for(let i=0;i<n;i++){dummy.position.set((Math.random()-.5)*51,.19,(Math.random()-.5)*40);dummy.rotation.y=Math.random()*6;dummy.scale.y=.5+Math.random();dummy.updateMatrix();grass.setMatrixAt(i,dummy.matrix)}scene.add(grass);grass.userData.wind=true;}
function makeGarden(){const s=STAGES[currentStage];for(let i=0;i<18;i++){const x=(Math.random()-.5)*39,z=(Math.random()-.5)*33;if(Math.abs(x)<5)continue;if(currentStage===3){const stem=mesh(new THREE.CylinderGeometry(.07,.09,2.2,6),mat(0x56844a),x,1.1,z);stem.castShadow=false;const face=mesh(new THREE.CylinderGeometry(.62,.62,.1,14),mat(0x6f4e27),x,2.22,z);face.rotation.x=Math.PI/2;for(let p=0;p<10;p++){const a=p*Math.PI*2/10;mesh(new THREE.SphereGeometry(.29,7,6),mat(0xffe25e),x+Math.cos(a)*.52,2.22+Math.sin(a)*.52,z).castShadow=false}}else if(currentStage===2&&i<5){const water=mesh(new THREE.CylinderGeometry(1.2,1.7,.1,16),mat(0x76d8df,{transparent:true,opacity:.8}),x,0.04,z);water.castShadow=false}else{const trunk=mesh(new THREE.CylinderGeometry(.13,.2,1.5,6),mat(0x96613d),x,.75,z);trunk.castShadow=false;const crown=mesh(new THREE.SphereGeometry(.86,10,8),mat(currentStage===1?0x9acd4c:0x68b657),x,1.85,z);crown.castShadow=false}}if(currentStage===2){for(let i=-2;i<=2;i++)mesh(new THREE.BoxGeometry(1.4,.15,3),mat(0xa5744a),i*1.45,.14,-4).castShadow=false}if(currentStage===1){for(let i=0;i<9;i++){const x=(i-4)*1.4;mesh(new THREE.CylinderGeometry(.14,.14,.8,7),mat(0x6c9342),x,.4,4+Math.sin(i)*2);mesh(new THREE.SphereGeometry(.34,8,6),mat(0xffdf3d),x,.9,4+Math.sin(i)*2)}}}
function makeCat(){const def=CATS.find(c=>c.id===save.cat),g=new THREE.Group();function part(geo,color,x,y,z){const o=new THREE.Mesh(geo,mat(color));o.position.set(x,y,z);o.castShadow=true;g.add(o);return o}part(new THREE.SphereGeometry(.72,14,12),def.body,0,1.2,0);part(new THREE.SphereGeometry(.88,15,12),def.body,0,2.03,.16);part(new THREE.ConeGeometry(.28,.68,4),def.patch,-.48,2.65,.1).rotation.z=-.15;part(new THREE.ConeGeometry(.28,.68,4),def.patch,.48,2.65,.1).rotation.z=.15;for(const x of [-.47,.47])for(const z of [-.38,.38]){const leg=part(new THREE.CylinderGeometry(.11,.14,.58,7),def.body,x,.67,z);catParts.push(leg)}for(const x of [-.29,.29]){part(new THREE.SphereGeometry(.105,8,7),0xffffff,x,2.17,.88);part(new THREE.SphereGeometry(.055,7,6),def.eye,x,2.17,.96)}part(new THREE.SphereGeometry(.09,7,6),0xdf8699,0,1.95,.98);const tail=part(new THREE.CylinderGeometry(.09,.12,1.1,7),def.patch,.68,1.31,-.3);tail.rotation.z=-.9;g.position.set(0,0,7);g.userData={velocity:new THREE.Vector3(),heading:Math.PI,mode:'idle'};scene.add(g);cat=g;}
function bColor(id){return({pink:0xff8ebd,yellow:0xffd551,green:0x6fce85,blue:0x79c8ff,purple:0xb394ee,orange:0xffa355,gold:0xf1c14d,crystal:0x7ce9f4})[BOOK.find(b=>b.id===id)?.color||'pink']}
function spawnButterfly(forceRare=false){if(butterflies.length>=TUNE.MAX_BUTTERFLIES)return;const stage=STAGES[currentStage];const common=BOOK.filter(b=>b.rare!=='レア'),rare=BOOK.filter(b=>stage.rare==='gold'?b.id==='gold':b.id==='crystal');const must=forceRare||save.rarePity[currentStage]>=TUNE.RARE_PITY_SPAWNS;const spec=must?rare[0]:(Math.random()<TUNE.RARE_BASE_RATE?rare[0]:common[Math.floor(Math.random()*common.length)]);const g=new THREE.Group(),wingGeo=new THREE.SphereGeometry(.26,7,6),wingMat=mat(bColor(spec.id));for(const side of [-1,1]){const w=new THREE.Mesh(wingGeo,wingMat);w.scale.set(.8,1.2,.22);w.position.x=side*.22;g.add(w)}const body=new THREE.Mesh(new THREE.CylinderGeometry(.04,.05,.42,6),mat(0x4d4055));body.rotation.x=Math.PI/2;g.add(body);let x=(Math.random()-.5)*16,z=(Math.random()-.5)*14;if(Math.abs(x)<2)x+=x<0?-3:3;g.position.set(x,1.1+Math.random()*.45,z);g.userData={id:Math.random().toString(36),spec,base:g.position.clone(),phase:Math.random()*6,alert:0,escaped:false,correction:0,spawnAge:0};scene.add(g);butterflies.push(g)}
function prepareStage(index){currentStage=index;friendCount=0;sneakCount=0;goalShown=false;catching=false;catchFlowToken++;newTarget=null;runTime=0;stageIntro=1.35;addWorld();for(let i=0;i<6;i++)spawnButterfly(false);$('stageHud').textContent=index+1;$('targetHud').textContent=STAGES[index].target;$('friendHud').textContent=0;$('hud').style.display='block';$('status').textContent=STAGES[index].name+'　'+STAGES[index].desc;startBgm(STAGES[index].theme);playing=true;paused=false;}
function startBgm(theme){if(typeof WakuwakuBGM==='undefined')return;try{if(!bgm)bgm=new WakuwakuBGM(theme);if(bgm.setTheme)bgm.setTheme(theme);if(save.sound&&bgm.play)bgm.play()}catch(e){}}
function updateTitle(){const has=save.stages.some(Boolean)||save.book.length>0;$('continueBtn').style.display=has?'inline-block':'none';$('titleSound').textContent=save.sound?'おと ♪':'おと ×';}
function show(id){screens.forEach(x=>$(x).classList.remove('show'));$(id).classList.add('show')};function hideAll(){screens.forEach(x=>$(x).classList.remove('show'))}
function showCats(){renderCats();show('cats')}function renderCats(){const root=$('catGrid');root.innerHTML='';for(const c of CATS){const el=document.createElement('button');el.className='card '+(save.cat===c.id?'selected':'');el.dataset.cat=c.id;el.innerHTML='<div class="avatar '+c.id.replace('mike','')+'"></div><b>'+c.name+'</b><small>いっしょに おさんぽ</small>';el.onclick=()=>{save.cat=c.id;persist();renderCats()};root.appendChild(el)}}
function showStages(){renderStages();show('stages')}function renderStages(){const root=$('stageGrid');root.innerHTML='';STAGES.forEach((s,i)=>{const unlocked=i===0||save.stages[i-1]>0;const el=document.createElement('button');el.className='card '+(!unlocked?'lock':'');el.innerHTML='<div class="stageArt s'+(i+1)+'"></div><b>'+(i+1)+'. '+s.name+'</b><span class="stars">'+('★'.repeat(save.stages[i]))+('☆'.repeat(3-save.stages[i]))+'</span><small>'+(!unlocked?'まだ ひみつ':s.target+'ひきと なかよし')+'</small>';if(unlocked)el.onclick=()=>{hideAll();prepareStage(i)};root.appendChild(el)})}
function showBook(){const root=$('bookSlots');root.innerHTML='';$('bookCount').textContent=save.book.length;BOOK.forEach(b=>{const got=save.book.includes(b.id),el=document.createElement('button');el.className='slot '+(!got?'locked':'');el.innerHTML='<div class="butter" style="--wing:'+bColorCss(b.id)+'"><i></i></div><b>'+ (got?b.name:'？？？')+'</b>';if(got)el.onclick=()=>openDetail(b);root.appendChild(el)});show('book')}
function bColorCss(id){return '#'+bColor(id).toString(16).padStart(6,'0')}function openDetail(b){$('detailButter').style.setProperty('--wing',bColorCss(b.id));$('detailName').textContent=b.name;$('detailDesc').textContent='はたを ひらひら。おにわの なかよしだよ。';$('detailRare').textContent='レア度：'+b.rare;$('detail').classList.add('show')}
function setTargetFromEvent(e){const rect=renderer.domElement.getBoundingClientRect(),p=new THREE.Vector2(((e.clientX-rect.left)/rect.width)*2-1,-((e.clientY-rect.top)/rect.height)*2+1);raycaster.setFromCamera(p,camera);const hit=raycaster.intersectObject(ground);if(hit[0]){newTarget=hit[0].point.clone();newTarget.y=0;lastPointer={x:e.clientX,y:e.clientY}}}
function pointerDown(e){audioUnlock();if(!playing||paused||catching)return;mouseDown=true;activePointer=e.pointerId;renderer.domElement.setPointerCapture?.(e.pointerId);setTargetFromEvent(e)}function pointerMove(e){if(mouseDown&&e.pointerId===activePointer)setTargetFromEvent(e)}function pointerEnd(e){if(e.pointerId===activePointer){mouseDown=false;activePointer=null;newTarget=null}}
function catStep(dt){if(!cat||!playing||paused)return;let speed=0,mode='idle';if(mouseDown&&newTarget){const d=new THREE.Vector3().subVectors(newTarget,cat.position);d.y=0;const dist=d.length();if(dist>.08){const held=runTime;mode=held<TUNE.SNEAK_HOLD_SEC?'sneak':dist>TUNE.NORMAL_DISTANCE/40?'run':'normal';speed=mode==='sneak'?TUNE.SNEAK_SPEED:mode==='normal'?TUNE.NORMAL_SPEED:TUNE.RUN_SPEED;d.normalize();cat.position.addScaledVector(d,Math.min(dist,speed*dt));cat.rotation.y=Math.atan2(d.x,d.z);cat.userData.heading=cat.rotation.y}}cat.userData.mode=mode;const ringColor=mode==='sneak'?0x6bcaff:mode==='normal'?0xffd45d:0xff8aa5;if(!cat.userData.ring){const r=new THREE.Mesh(new THREE.RingGeometry(.48,.62,18),new THREE.MeshBasicMaterial({color:ringColor,transparent:true,opacity:.7,side:THREE.DoubleSide}));r.rotation.x=-Math.PI/2;r.position.y=.028;cat.add(r);cat.userData.ring=r}cat.userData.ring.material.color.setHex(ringColor);const scale=1+(mode==='run'?.22:mode==='normal'?.1:0)+Math.sin(performance.now()*.011)*.05;cat.userData.ring.scale.setScalar(scale);cat.position.y=Math.sin(runTime*3)*(speed? .055:.025);catParts.forEach((p,i)=>p.rotation.x=Math.sin(runTime*10+i*Math.PI)*speed*.14);}
function butterflyStep(b,dt){const u=b.userData;u.spawnAge+=dt;const wob=Math.sin(runTime*4+u.phase);b.position.x=u.base.x+Math.sin(runTime*.8+u.phase)*.38;b.position.z=u.base.z+Math.cos(runTime*.95+u.phase)*.32;b.position.y=u.base.y+wob*.17;b.children[0].rotation.z=.5+wob*.4;b.children[1].rotation.z=-.5-wob*.4;const dist=b.position.distanceTo(cat.position);const mode=cat.userData.mode;let gain=0;if(dist<5){if(mode==='normal')gain=TUNE.ALERT_NORMAL_GAIN;if(mode==='run')gain=TUNE.ALERT_RUN_GAIN;if(mode==='sneak')gain=0}u.alert=Math.max(0,Math.min(1,u.alert+(gain?gain:-TUNE.ALERT_DECAY)*dt));if(u.alert>.98){u.correction+=dt;if(u.correction>TUNE.CORRECTION_WINDOW)escapeButterfly(b)}else u.correction=0;if(dist<TUNE.CATCH_RADIUS&&mode!=='run'&&!catching&&u.spawnAge>TUNE.CATCH_COOLDOWN)catchButterfly(b);}
function updateAlert(){const nearest=butterflies.filter(b=>!b.userData.escaped).sort((a,b)=>a.position.distanceTo(cat.position)-b.position.distanceTo(cat.position))[0];const el=$('alert');if(!nearest||nearest.position.distanceTo(cat.position)>6){el.style.display='none';return}const p=nearest.position.clone().project(camera);el.style.display='block';el.style.left=((p.x+1)*.5*innerWidth)+'px';el.style.top=((-p.y+1)*.5*innerHeight)+'px';el.querySelector('em').style.width=(nearest.userData.alert*100)+'%';el.querySelector('i').textContent=nearest.userData.alert>.7?'!':'?'}
function escapeButterfly(b){if(b.userData.escaped)return;b.userData.escaped=true;notice('あっ、びっくり しちゃった！');beep(190,.13,'sawtooth');if(b.userData.spec.rare==='レア')save.rarePity[currentStage]=TUNE.RARE_PITY_SPAWNS;scene.remove(b);butterflies=butterflies.filter(x=>x!==b);setTimeout(()=>{if(playing&&!paused)spawnButterfly(b.userData.spec.rare==='レア')},850)}
function catchButterfly(b){catching=true;catchTargetId=b.userData.id;const token=++catchFlowToken;const wasSneak=cat.userData.mode==='sneak';b.userData.caught=true;notice('なかよし ジャンプ！');beep(740,.09);for(let i=0;i<10;i++)makeParticle(b.position,bColor(b.userData.spec.id));const start=performance.now();function jump(now){if(token!==catchFlowToken)return;const t=Math.min(1,(now-start)/520);cat.position.y=Math.sin(t*Math.PI)*1.15;if(t<1)requestAnimationFrame(jump);else{cat.position.y=0;finishCatch(b,wasSneak,token)}}requestAnimationFrame(jump)}
function finishCatch(b,wasSneak,token){if(token!==catchFlowToken)return;scene.remove(b);butterflies=butterflies.filter(x=>x!==b);friendCount++;if(wasSneak)sneakCount++;if(!save.book.includes(b.userData.spec.id))save.book.push(b.userData.spec.id);if(b.userData.spec.rare==='レア')save.rarePity[currentStage]=0;else save.rarePity[currentStage]++;$('friendHud').textContent=friendCount;notice(b.userData.spec.name+' と なかよし！');beep(940,.12);catching=false;catchTargetId=null;persist();setTimeout(()=>{if(playing&&!paused)spawnButterfly(false)},500);if(friendCount>=STAGES[currentStage].target&&!goalShown){goalShown=true;setTimeout(()=>showGoal(),700)}}
function makeParticle(pos,color){if(particles.length>=TUNE.MAX_PARTICLES)return;const p=new THREE.Mesh(new THREE.SphereGeometry(.05,5,5),mat(color));p.position.copy(pos);p.userData={v:new THREE.Vector3((Math.random()-.5)*2,Math.random()*2,(Math.random()-.5)*2),life:.55};scene.add(p);particles.push(p)}
function showGoal(){if(!playing)return;paused=true;let stars=1;if(sneakCount>=TUNE.SNEAK_STAR_COUNT)stars=2;const rare=STAGES[currentStage].rare==='gold'?'gold':'crystal';if(stars>=2&&save.book.includes(rare))stars=3;save.stages[currentStage]=Math.max(save.stages[currentStage],stars);const acc=[['ribbon',0],['flower',1],['bell',2],['hairpin',3]];for(const [id,n] of acc)if(currentStage===n&&!save.accessories.includes(id))save.accessories.push(id);if(save.book.length===12&&!save.accessories.includes('crown'))save.accessories.push('crown');persist();$('resultStars').textContent='★'.repeat(stars)+'☆'.repeat(3-stars);$('resultText').textContent=friendCount+'ひきと なかよし！　そっと あるけたのは '+sneakCount+'かい。';$('unlockText').textContent=currentStage<3?'つぎの おにわが ひらいたよ！':'ひみつの花園を たのしんでね！';$('nextBtn').style.display=currentStage<3?'inline-block':'none';$('result').classList.add('show')}
function notice(t){$('notice').textContent=t;$('notice').classList.add('show');clearTimeout(notice.timer);notice.timer=setTimeout(()=>$('notice').classList.remove('show'),1400)}
function animate(){requestAnimationFrame(animate);const dt=Math.min(clock.getDelta(),.1);if(playing&&!paused){runTime+=dt;stageIntro=Math.max(0,stageIntro-dt);catStep(dt);butterflies.forEach(b=>butterflyStep(b,dt));particles.forEach(p=>{p.userData.life-=dt;p.position.addScaledVector(p.userData.v,dt);p.userData.v.y-=dt*2;p.material.opacity=Math.max(0,p.userData.life*1.8);p.material.transparent=true});particles=particles.filter(p=>{if(p.userData.life>0)return true;scene.remove(p);return false});updateAlert()}if(cat){const desired=new THREE.Vector3(cat.position.x*.25,7.1,cat.position.z+10.5);camera.position.lerp(desired,TUNE.CAMERA_LERP);camera.lookAt(cat.position.x*.15,1.05,cat.position.z-1)}renderer.render(scene,camera)}
function addEvents(){addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});renderer.domElement.addEventListener('pointerdown',pointerDown);renderer.domElement.addEventListener('pointermove',pointerMove);renderer.domElement.addEventListener('pointerup',pointerEnd);renderer.domElement.addEventListener('pointercancel',pointerEnd);renderer.domElement.addEventListener('pointerleave',e=>{if(e.pointerType==='mouse')pointerEnd(e)});document.addEventListener('visibilitychange',()=>{if(document.hidden&&playing){paused=true;$('pause').classList.add('show')}if(!document.hidden)clock.getDelta()});document.querySelectorAll('[data-close]').forEach(b=>b.onclick=()=>show('title'));
$('startBtn').onclick=showCats;$('continueBtn').onclick=showStages;$('bookBtn').onclick=showBook;$('catOk').onclick=()=>{persist();showStages()};$('backBtn').onclick=()=>parent.postMessage({type:'goBack'},'*');$('titleSound').onclick=toggleSound;$('soundBtn').onclick=toggleSound;$('pauseBtn').onclick=()=>{if(playing){paused=true;$('pause').classList.add('show')}};$('resumeBtn').onclick=()=>{paused=false;$('pause').classList.remove('show');clock.getDelta()};$('restartBtn').onclick=()=>{$('pause').classList.remove('show');prepareStage(currentStage)};$('stageBtn').onclick=()=>{$('pause').classList.remove('show');playing=false;$('hud').style.display='none';showStages()};$('titleBtn').onclick=toTitle;$('nextBtn').onclick=()=>{$('result').classList.remove('show');prepareStage(currentStage+1)};$('moreBtn').onclick=()=>{$('result').classList.remove('show');paused=false;notice('もっと なかよしに なろう！')};$('resultStageBtn').onclick=()=>{$('result').classList.remove('show');toTitle();showStages()};$('detailClose').onclick=()=>$('detail').classList.remove('show');}
function toggleSound(){save.sound=!save.sound;persist();if(bgm){try{save.sound?bgm.play?.():bgm.stop?.()}catch(e){}}$('soundBtn').textContent=save.sound?'♪':'×';updateTitle();audioUnlock();beep(560,.07)}function toTitle(){catchFlowToken++;playing=false;paused=false;butterflies.forEach(b=>scene.remove(b));butterflies=[];$('hud').style.display='none';$('pause').classList.remove('show');$('result').classList.remove('show');show('title');updateTitle();startBgm('cute')}
try{init()}catch(e){document.body.innerHTML='<div style="padding:30px;text-align:center;background:#fff7e9;height:100%;color:#543">このききでは 3Dのおにわを ひらけませんでした。<br>ブラウザを さいしんにして もういちど ためしてね。</div>'}
})();
</script>
