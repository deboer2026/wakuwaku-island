<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>どうぶつパズル</title>
<link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@400;700;800;900&display=swap" rel="stylesheet">
<script src="/games/wakuwaku_bgm.js"></script>
<script src="/games/safe_area.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
html,body{width:100%;height:100%;overflow:hidden;font-family:'M PLUS Rounded 1c',sans-serif;user-select:none;-webkit-user-select:none;}
body{background:#1a0a2e;}
#wrap{position:fixed;inset:0;max-width:480px;margin:0 auto;overflow:hidden;}
canvas#bg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;}
.screen{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;z-index:20;padding:0 18px;padding-top:var(--sat,env(safe-area-inset-top,0px));padding-bottom:var(--sab,env(safe-area-inset-bottom,0px));}
.screen.on{display:flex;}
button{font-family:inherit;cursor:pointer;}

/* ===== TITLE ===== */
.title-frame{background:linear-gradient(145deg,rgba(45,20,80,0.96),rgba(25,10,50,0.98));border:4px solid #FFD54F;border-radius:28px;padding:20px 22px 18px;text-align:center;width:100%;max-width:350px;box-shadow:0 0 0 2px #8d6e00,0 0 44px rgba(255,213,79,0.18),0 14px 44px rgba(0,0,0,0.7);}
.t-cards{display:flex;justify-content:center;gap:7px;margin-bottom:10px;}
.t-card{width:48px;height:48px;border-radius:12px;background:linear-gradient(145deg,#AB47BC,#6A1B9A);border:2.5px solid #E1BEE7;display:flex;align-items:center;justify-content:center;font-size:27px;box-shadow:0 4px 0 #4A148C,0 0 12px rgba(171,71,188,0.4);animation:wig var(--d,1.2s) ease-in-out infinite;}
@keyframes wig{0%,100%{transform:rotate(-4deg) translateY(0)}50%{transform:rotate(4deg) translateY(-7px)}}
.t-label{font-size:12px;font-weight:900;color:rgba(255,213,79,0.7);letter-spacing:4px;margin-bottom:2px;}
.t-text{font-size:33px;font-weight:900;background:linear-gradient(180deg,#FFF176,#FFA000);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;filter:drop-shadow(0 2px 0 rgba(0,0,0,0.5));margin-bottom:8px;}
.t-sub{font-size:12px;font-weight:800;color:#CE93D8;margin-bottom:12px;}
.char-label{font-size:11px;font-weight:900;color:rgba(255,255,255,0.6);margin-bottom:6px;}
.char-row{display:flex;justify-content:center;gap:8px;margin-bottom:14px;}
.char-btn{width:58px;height:64px;border-radius:14px;background:rgba(255,255,255,0.08);border:2.5px solid rgba(255,255,255,0.2);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;transition:all .15s;}
.char-btn .ce{font-size:27px;}
.char-btn .cn{font-size:9px;font-weight:800;color:rgba(255,255,255,0.65);}
.char-btn.sel{background:linear-gradient(145deg,rgba(255,213,79,0.3),rgba(255,160,0,0.2));border-color:#FFD54F;transform:scale(1.08);box-shadow:0 0 14px rgba(255,213,79,0.4);}
.char-btn.sel .cn{color:#FFE082;}
.big-btn{width:100%;padding:14px;border:none;border-radius:18px;background:linear-gradient(180deg,#FFD54F,#FF8F00);color:#4E2600;font-size:19px;font-weight:900;box-shadow:0 5px 0 #BF6000,0 8px 20px rgba(0,0,0,0.4);transition:transform .1s;}
.big-btn:active{transform:translateY(3px);box-shadow:0 2px 0 #BF6000;}
.t-stars{margin-top:10px;font-size:12px;font-weight:800;color:#FFD54F;}

/* ===== STAGE MAP ===== */
.map-frame{background:linear-gradient(145deg,rgba(45,20,80,0.95),rgba(25,10,50,0.97));border:4px solid #FFD54F;border-radius:26px;padding:18px 16px;width:100%;max-width:360px;box-shadow:0 0 0 2px #8d6e00,0 12px 40px rgba(0,0,0,0.6);}
.map-title{text-align:center;font-size:19px;font-weight:900;color:#FFE082;margin-bottom:12px;}
.st-row{display:flex;flex-direction:column;gap:9px;}
.st-btn{display:flex;align-items:center;gap:12px;padding:10px 14px;border-radius:16px;border:2.5px solid rgba(255,255,255,0.25);background:rgba(255,255,255,0.07);transition:all .15s;text-align:left;}
.st-btn:not(.lock):active{transform:scale(0.97);}
.st-btn.lock{opacity:0.45;filter:grayscale(0.7);}
.st-ico{width:46px;height:46px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:26px;flex-shrink:0;box-shadow:0 3px 0 rgba(0,0,0,0.35);}
.st-info{flex:1;}
.st-name{font-size:14px;font-weight:900;color:#fff;}
.st-desc{font-size:10px;font-weight:700;color:rgba(255,255,255,0.55);}
.st-stars{font-size:14px;letter-spacing:1px;flex-shrink:0;}
.map-back{margin-top:12px;width:100%;padding:9px;border:2px solid rgba(255,255,255,0.3);border-radius:14px;background:rgba(0,0,0,0.35);color:#fff;font-size:13px;font-weight:800;}

/* ===== HUD ===== */
#hud{position:absolute;top:0;left:0;right:0;z-index:60;display:none;padding:6px 10px 4px;padding-top:max(8px,var(--sat,env(safe-area-inset-top,0px)));background:linear-gradient(180deg,rgba(10,5,25,0.92),rgba(10,5,25,0.55) 70%,transparent);}
#hud.on{display:block;}
.hud-nav{display:flex;justify-content:space-between;align-items:center;margin-bottom:4px;}
#back-btn{background:rgba(0,0,0,0.55);color:#fff;border:1.5px solid rgba(255,255,255,0.3);border-radius:20px;padding:4px 13px;font-size:12px;font-weight:700;}
#hud-mid{font-size:12px;font-weight:900;color:#CE93D8;}
#bgm-btn{background:rgba(0,0,0,0.55);color:#fff;border:1.5px solid rgba(255,255,255,0.3);border-radius:50%;width:30px;height:30px;font-size:15px;display:flex;align-items:center;justify-content:center;}
#chips{display:flex;justify-content:center;gap:8px;}
.chip{background:rgba(0,0,0,0.6);border:1.5px solid rgba(255,213,79,0.4);border-radius:12px;padding:2px 11px;display:flex;align-items:center;gap:5px;}
.chip-l{font-size:8px;color:rgba(255,255,255,0.55);font-weight:700;}
.chip-v{font-size:15px;font-weight:900;color:#FFD54F;}
#chip-combo{display:none;border-color:rgba(255,110,180,0.55);}
#chip-combo .chip-v{color:#FF80AB;}
#timer-wrap{display:none;margin-top:5px;padding:0 4px;}
#timer-bg{height:9px;background:rgba(255,255,255,0.15);border-radius:5px;overflow:hidden;border:1px solid rgba(255,255,255,0.15);}
#timer-fill{height:100%;border-radius:5px;background:linear-gradient(90deg,#69F0AE,#00C853);transition:width .2s linear,background .3s;}

/* ===== GAME BOARD ===== */
#board-wrap{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;z-index:30;padding:86px 12px 74px;}
#board-wrap.on{display:flex;}
#board{display:grid;gap:7px;width:100%;max-width:420px;}
.card{position:relative;aspect-ratio:3/3.4;perspective:600px;cursor:pointer;}
.card-in{position:absolute;inset:0;transition:transform .3s;transform-style:preserve-3d;}
.card.open .card-in{transform:rotateY(180deg);}
.cf{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:11px;display:flex;align-items:center;justify-content:center;}
.cf-back{background:linear-gradient(145deg,#AB47BC,#6A1B9A);border:2.5px solid #E1BEE7;box-shadow:0 3px 0 #4A148C;font-size:20px;color:rgba(255,255,255,0.5);}
.cf-front{background:linear-gradient(145deg,#FFF8E1,#FFE0B2);border:2.5px solid #FFB300;box-shadow:0 3px 0 #E65100;transform:rotateY(180deg);font-size:var(--cardfs,34px);}
.card.matched .card-in{animation:pop .45s ease;}
.card.matched .cf-front{background:linear-gradient(145deg,#C8E6C9,#81C784);border-color:#2E7D32;box-shadow:0 3px 0 #1B5E20;}
.card.gone{opacity:0.28;pointer-events:none;transform:scale(0.92);transition:all .4s .3s;}
@keyframes pop{0%{transform:rotateY(180deg) scale(1)}45%{transform:rotateY(180deg) scale(1.22)}100%{transform:rotateY(180deg) scale(1)}}
.card.shake .card-in{animation:shk .35s;}
@keyframes shk{0%,100%{transform:rotateY(180deg) translateX(0)}25%{transform:rotateY(180deg) translateX(-5px)}75%{transform:rotateY(180deg) translateX(5px)}}
.card.spec .cf-front{background:linear-gradient(145deg,#FFF9C4,#FFE54F);border-color:#F9A825;}
.card.spin .card-in{animation:spinC .5s ease;}
@keyframes spinC{from{transform:rotateY(180deg) rotate(0)}to{transform:rotateY(180deg) rotate(360deg)}}

/* partner */
#partner{position:absolute;bottom:8px;left:12px;right:12px;z-index:55;display:none;align-items:center;gap:8px;padding-bottom:var(--sab,env(safe-area-inset-bottom,0px));}
#partner.on{display:flex;}
#p-emoji{font-size:38px;filter:drop-shadow(0 3px 4px rgba(0,0,0,0.5));transition:transform .2s;}
#p-emoji.jump{animation:pj .5s ease;}
@keyframes pj{0%,100%{transform:translateY(0)}40%{transform:translateY(-14px) rotate(-8deg)}}
#p-bubble{background:rgba(255,255,255,0.95);border-radius:14px;padding:6px 12px;font-size:12px;font-weight:800;color:#4A148C;box-shadow:0 3px 10px rgba(0,0,0,0.35);opacity:0;transition:opacity .25s;max-width:70%;}
#p-bubble.on{opacity:1;}

/* floating text */
.float-txt{position:absolute;z-index:80;font-weight:900;pointer-events:none;animation:fup 1s ease forwards;text-shadow:0 2px 4px rgba(0,0,0,0.6);}
@keyframes fup{0%{opacity:0;transform:translateY(6px) scale(0.7)}25%{opacity:1;transform:translateY(-4px) scale(1.15)}100%{opacity:0;transform:translateY(-38px) scale(1)}}

/* ===== RESULT ===== */
.res-frame{background:linear-gradient(145deg,rgba(45,20,80,0.97),rgba(25,10,50,0.99));border:4px solid #FFD54F;border-radius:26px;padding:22px 24px;text-align:center;width:100%;max-width:330px;box-shadow:0 0 0 2px #8d6e00,0 14px 44px rgba(0,0,0,0.7);}
#res-title{font-size:26px;font-weight:900;color:#FFE082;margin-bottom:6px;}
#res-stars{font-size:34px;letter-spacing:5px;margin-bottom:8px;min-height:44px;}
#res-stars span{display:inline-block;opacity:0;transform:scale(0);}
#res-stars span.pop{animation:starPop .45s ease forwards;}
@keyframes starPop{0%{opacity:0;transform:scale(0) rotate(-90deg)}70%{opacity:1;transform:scale(1.35) rotate(8deg)}100%{opacity:1;transform:scale(1) rotate(0)}}
#res-msg{font-size:13px;font-weight:800;color:#E1BEE7;margin-bottom:14px;line-height:1.6;}
.res-btns{display:flex;flex-direction:column;gap:9px;}
.res-btn2{padding:10px;border:2px solid rgba(255,255,255,0.35);border-radius:14px;background:rgba(0,0,0,0.35);color:#fff;font-size:13px;font-weight:800;}
#confetti{position:absolute;inset:0;pointer-events:none;z-index:90;}
</style>
</head>
<body>
<div id="wrap">
<canvas id="bg"></canvas>

<div id="hud">
  <div class="hud-nav">
    <button id="back-btn">← もどる</button>
    <div id="hud-mid"></div>
    <button id="bgm-btn">🎵</button>
  </div>
  <div id="chips">
    <div class="chip"><span class="chip-l">スコア</span><span class="chip-v" id="c-score">0</span></div>
    <div class="chip"><span class="chip-l">のこり</span><span class="chip-v" id="c-left">0</span></div>
    <div class="chip" id="chip-combo"><span class="chip-l">コンボ</span><span class="chip-v" id="c-combo">0</span></div>
  </div>
  <div id="timer-wrap"><div id="timer-bg"><div id="timer-fill" style="width:100%"></div></div></div>
</div>

<!-- TITLE -->
<div class="screen on" id="scr-title">
  <div class="title-frame">
    <div class="t-cards">
      <div class="t-card" style="--d:1.1s">🐱</div>
      <div class="t-card" style="--d:1.3s">🐰</div>
      <div class="t-card" style="--d:1.2s">🐼</div>
      <div class="t-card" style="--d:1.4s">🦊</div>
    </div>
    <div class="t-label">WAKUWAKU</div>
    <div class="t-text">どうぶつパズル</div>
    <div class="t-sub">おなじどうぶつを みつけよう！</div>
    <div class="char-label">パートナーをえらんでね</div>
    <div class="char-row" id="char-row"></div>
    <button class="big-btn" id="btn-start">スタート！</button>
    <div class="t-stars" id="t-total"></div>
    <button class="map-back" id="btn-home" style="margin-top:10px;">🏠 サイトへもどる</button>
  </div>
</div>

<!-- STAGE MAP -->
<div class="screen" id="scr-map">
  <div class="map-frame">
    <div class="map-title">🗺️ ステージをえらんでね</div>
    <div class="st-row" id="st-row"></div>
    <button class="map-back" id="btn-map-back">← タイトルへ</button>
  </div>
</div>

<!-- BOARD -->
<div id="board-wrap"><div id="board"></div></div>
<div id="partner"><div id="p-emoji">🐱</div><div id="p-bubble"></div></div>

<!-- RESULT -->
<div class="screen" id="scr-result">
  <div class="res-frame">
    <div id="res-title"></div>
    <div id="res-stars"></div>
    <div id="res-msg"></div>
    <div class="res-btns">
      <button class="big-btn" id="btn-next">つぎのステージへ</button>
      <button class="res-btn2" id="btn-retry">もういちど</button>
      <button class="res-btn2" id="btn-to-map">ステージせんたく</button>
    </div>
  </div>
</div>

<canvas id="confetti"></canvas>
</div>

<script>
'use strict';
/* ================= DATA ================= */
const CHARS=[
  {id:'neko', e:'🐱', n:'ねこ'},
  {id:'usagi',e:'🐰', n:'うさぎ'},
  {id:'panda',e:'🐼', n:'ぱんだ'},
  {id:'kitsune',e:'🦊',n:'きつね'}
];
const POOL=['🐶','🐹','🐻','🐨','🐯','🦁','🐮','🐷','🐸','🐵','🐔','🐧','🦉','🦄','🐢','🐙','🦀','🐳','🦋','🐞'];
const STAGES=[
  {id:1,name:'もりのステージ',ico:'🌳',col:'linear-gradient(145deg,#66BB6A,#2E7D32)',pairs:6,cols:3,time:0,star:false,shuffle:false,
   desc:'6ペア・れんしゅう',bgTop:'#0d2b12',bgBot:'#1b5e20',ptype:'leaf',
   s3:2,s2:5},
  {id:2,name:'うみのステージ',ico:'🌊',col:'linear-gradient(145deg,#42A5F5,#1565C0)',pairs:8,cols:4,time:0,star:true,shuffle:false,
   desc:'8ペア・⭐ボーナス',bgTop:'#071e3d',bgBot:'#0d47a1',ptype:'bubble',
   s3:3,s2:6},
  {id:3,name:'ゆきやまステージ',ico:'⛄',col:'linear-gradient(145deg,#90CAF9,#5C7FA3)',pairs:8,cols:4,time:75,star:true,shuffle:false,
   desc:'8ペア・じかんせいげん！',bgTop:'#1a2740',bgBot:'#3a5a80',ptype:'snow',
   s3:3,s2:6},
  {id:4,name:'さばくステージ',ico:'🌵',col:'linear-gradient(145deg,#FFB74D,#E65100)',pairs:10,cols:4,time:0,star:true,shuffle:true,
   desc:'10ペア・🌀シャッフル',bgTop:'#3d1e05',bgBot:'#7a4010',ptype:'sand',
   s3:4,s2:8},
  {id:5,name:'おしろステージ',ico:'🏰',col:'linear-gradient(145deg,#BA68C8,#6A1B9A)',pairs:10,cols:4,time:110,star:true,shuffle:true,
   desc:'10ペア・ぜんぶのせ！',bgTop:'#1a0a2e',bgBot:'#4a148c',ptype:'star',
   s3:4,s2:8}
];
const SAVE_KEY='puzzle_v3_progress';

/* ================= STATE ================= */
let save={stars:{},char:'neko'};
try{const s=localStorage.getItem(SAVE_KEY);if(s)save=Object.assign(save,JSON.parse(s));}catch(e){}
function persist(){try{localStorage.setItem(SAVE_KEY,JSON.stringify(save));}catch(e){}}

let bgm=null;
function bgmInit(){
  if(bgm||typeof WakuwakuBGM==='undefined')return;
  try{bgm=new WakuwakuBGM('puzzle');if(WakuwakuBGM.loadState())bgm.start();}catch(e){}
  updBgmBtn();
}
function updBgmBtn(){
  const on=(typeof WakuwakuBGM!=='undefined')?WakuwakuBGM.loadState():false;
  document.getElementById('bgm-btn').textContent=on?'🎵':'🔇';
}

/* ================= AUDIO SE ================= */
let ac=null;
function se(type){
  try{
    if(!ac)ac=new (window.AudioContext||window.webkitAudioContext)();
    if(ac.state==='suspended')ac.resume();
    const t=ac.currentTime,o=ac.createOscillator(),g=ac.createGain();
    o.connect(g);g.connect(ac.destination);
    if(type==='flip'){o.type='sine';o.frequency.setValueAtTime(500,t);o.frequency.linearRampToValueAtTime(700,t+0.06);g.gain.setValueAtTime(0.12,t);g.gain.exponentialRampToValueAtTime(0.001,t+0.1);o.start(t);o.stop(t+0.1);}
    else if(type==='match'){[523,659,784].forEach((f,i)=>{const o2=ac.createOscillator(),g2=ac.createGain();o2.connect(g2);g2.connect(ac.destination);o2.type='triangle';o2.frequency.value=f;g2.gain.setValueAtTime(0.13,t+i*0.07);g2.gain.exponentialRampToValueAtTime(0.001,t+i*0.07+0.18);o2.start(t+i*0.07);o2.stop(t+i*0.07+0.2);});}
    else if(type==='miss'){o.type='sawtooth';o.frequency.setValueAtTime(220,t);o.frequency.linearRampToValueAtTime(150,t+0.18);g.gain.setValueAtTime(0.08,t);g.gain.exponentialRampToValueAtTime(0.001,t+0.2);o.start(t);o.stop(t+0.2);}
    else if(type==='bonus'){[784,988,1175,1568].forEach((f,i)=>{const o2=ac.createOscillator(),g2=ac.createGain();o2.connect(g2);g2.connect(ac.destination);o2.type='triangle';o2.frequency.value=f;g2.gain.setValueAtTime(0.12,t+i*0.06);g2.gain.exponentialRampToValueAtTime(0.001,t+i*0.06+0.15);o2.start(t+i*0.06);o2.stop(t+i*0.06+0.17);});}
    else if(type==='shuffle'){o.type='square';o.frequency.setValueAtTime(300,t);o.frequency.linearRampToValueAtTime(600,t+0.25);g.gain.setValueAtTime(0.07,t);g.gain.exponentialRampToValueAtTime(0.001,t+0.3);o.start(t);o.stop(t+0.3);}
    else if(type==='clear'){[523,659,784,1047,1319].forEach((f,i)=>{const o2=ac.createOscillator(),g2=ac.createGain();o2.connect(g2);g2.connect(ac.destination);o2.type='triangle';o2.frequency.value=f;g2.gain.setValueAtTime(0.14,t+i*0.1);g2.gain.exponentialRampToValueAtTime(0.001,t+i*0.1+0.3);o2.start(t+i*0.1);o2.stop(t+i*0.1+0.32);});}
    else if(type==='over'){[400,350,300,250].forEach((f,i)=>{const o2=ac.createOscillator(),g2=ac.createGain();o2.connect(g2);g2.connect(ac.destination);o2.type='sine';o2.frequency.value=f;g2.gain.setValueAtTime(0.1,t+i*0.13);g2.gain.exponentialRampToValueAtTime(0.001,t+i*0.13+0.16);o2.start(t+i*0.13);o2.stop(t+i*0.13+0.18);});}
  }catch(e){}
}

/* ================= BG CANVAS ================= */
const bgC=document.getElementById('bg'),bx=bgC.getContext('2d');
let parts=[],bgTop='#1a0a2e',bgBot='#4a148c',ptype='star';
function bgResize(){bgC.width=bgC.offsetWidth*2;bgC.height=bgC.offsetHeight*2;bx.scale(2,2);}
function setBgTheme(st){
  if(st){bgTop=st.bgTop;bgBot=st.bgBot;ptype=st.ptype;}
  else{bgTop='#1a0a2e';bgBot='#4a148c';ptype='star';}
  parts=[];
  const W=bgC.offsetWidth,H=bgC.offsetHeight;
  for(let i=0;i<26;i++)parts.push({x:Math.random()*W,y:Math.random()*H,s:2+Math.random()*4,v:0.2+Math.random()*0.6,ph:Math.random()*6.28,dx:(Math.random()-0.5)*0.4});
}
function drawPart(p,t){
  bx.save();bx.translate(p.x,p.y);
  bx.globalAlpha=0.5+0.3*Math.sin(t/600+p.ph);
  if(ptype==='leaf'){bx.fillStyle='#81C784';bx.rotate(Math.sin(t/900+p.ph)*0.8);bx.beginPath();bx.ellipse(0,0,p.s*1.4,p.s*0.7,0.6,0,6.28);bx.fill();}
  else if(ptype==='bubble'){bx.strokeStyle='rgba(179,229,252,0.8)';bx.lineWidth=1.5;bx.beginPath();bx.arc(0,0,p.s,0,6.28);bx.stroke();}
  else if(ptype==='snow'){bx.fillStyle='#E3F2FD';bx.beginPath();bx.arc(0,0,p.s*0.7,0,6.28);bx.fill();}
  else if(ptype==='sand'){bx.fillStyle='rgba(255,224,130,0.8)';bx.beginPath();bx.arc(0,0,p.s*0.5,0,6.28);bx.fill();}
  else{bx.fillStyle='#FFF59D';const r=p.s*0.8;bx.beginPath();for(let i=0;i<5;i++){const a=-Math.PI/2+i*1.2566;bx.lineTo(Math.cos(a)*r,Math.sin(a)*r);bx.lineTo(Math.cos(a+0.628)*r*0.45,Math.sin(a+0.628)*r*0.45);}bx.closePath();bx.fill();}
  bx.restore();
}
function bgLoop(t){
  const W=bgC.offsetWidth,H=bgC.offsetHeight;
  const g=bx.createLinearGradient(0,0,0,H);g.addColorStop(0,bgTop);g.addColorStop(1,bgBot);
  bx.fillStyle=g;bx.fillRect(0,0,W,H);
  for(const p of parts){
    p.y+=(ptype==='bubble')?-p.v:p.v;p.x+=p.dx+Math.sin(t/800+p.ph)*0.3;
    if(p.y>H+10)p.y=-10;if(p.y<-10)p.y=H+10;
    if(p.x>W+10)p.x=-10;if(p.x<-10)p.x=W+10;
    drawPart(p,t);
  }
  requestAnimationFrame(bgLoop);
}

/* ================= UI HELPERS ================= */
const $=id=>document.getElementById(id);
function show(id){document.querySelectorAll('.screen').forEach(s=>s.classList.remove('on'));if(id)$(id).classList.add('on');}
function starsOf(n){return save.stars[n]||0;}
function totalStars(){let t=0;for(let i=1;i<=5;i++)t+=starsOf(i);return t;}
function starStr(n){let s='';for(let i=0;i<3;i++)s+=(i<n)?'⭐':'☆';return s;}
function floatTxt(x,y,txt,col,size){
  const d=document.createElement('div');d.className='float-txt';d.textContent=txt;
  d.style.left=x+'px';d.style.top=y+'px';d.style.color=col;d.style.fontSize=(size||18)+'px';
  d.style.transform='translateX(-50%)';
  $('wrap').appendChild(d);setTimeout(()=>d.remove(),1000);
}

/* partner */
const CHEERS=['やったね！','すごい！','その ちょうし！','ナイス！','おぼえてたね！'];
const COMBOS=['コンボ すごい！','れんぞく せいかい！','てんさいだ〜！'];
function partnerSay(txt,jump){
  const b=$('p-bubble');b.textContent=txt;b.classList.add('on');
  if(jump){const e=$('p-emoji');e.classList.remove('jump');void e.offsetWidth;e.classList.add('jump');}
  clearTimeout(partnerSay._t);partnerSay._t=setTimeout(()=>b.classList.remove('on'),1600);
}

/* ================= TITLE / MAP ================= */
function buildTitle(){
  const row=$('char-row');row.innerHTML='';
  CHARS.forEach(c=>{
    const b=document.createElement('button');b.className='char-btn'+(save.char===c.id?' sel':'');
    b.innerHTML='<span class="ce">'+c.e+'</span><span class="cn">'+c.n+'</span>';
    b.onclick=()=>{save.char=c.id;persist();buildTitle();se('flip');};
    row.appendChild(b);
  });
  $('t-total').textContent='あつめたほし: '+totalStars()+' / 15 ⭐';
}
function buildMap(){
  const row=$('st-row');row.innerHTML='';
  STAGES.forEach(st=>{
    const unlocked=st.id===1||starsOf(st.id-1)>0;
    const b=document.createElement('button');b.className='st-btn'+(unlocked?'':' lock');
    b.innerHTML='<div class="st-ico" style="background:'+st.col+'">'+(unlocked?st.ico:'🔒')+'</div>'
      +'<div class="st-info"><div class="st-name">ステージ'+st.id+'　'+st.name+'</div><div class="st-desc">'+st.desc+'</div></div>'
      +'<div class="st-stars">'+starStr(starsOf(st.id))+'</div>';
    if(unlocked)b.onclick=()=>{se('flip');startStage(st);};
    row.appendChild(b);
  });
}

/* ================= GAME ================= */
let cur=null,deck=[],open=[],lock=false,matchedPairs=0,misses=0,score=0,combo=0,maxCombo=0;
let timeLeft=0,timerId=null,startT=0;

function startStage(st){
  cur=st;matchedPairs=0;misses=0;score=0;combo=0;maxCombo=0;open=[];lock=false;
  setBgTheme(st);
  show(null);
  $('hud').classList.add('on');$('board-wrap').classList.add('on');$('partner').classList.add('on');
  $('hud-mid').textContent='ステージ'+st.id+'　'+st.name;
  $('c-score').textContent='0';$('chip-combo').style.display='none';
  const ch=CHARS.find(c=>c.id===save.char)||CHARS[0];
  $('p-emoji').textContent=ch.e;
  partnerSay('がんばろう！',true);
  buildDeck(st);
  // timer
  clearInterval(timerId);
  if(st.time>0){
    timeLeft=st.time;$('timer-wrap').style.display='block';updTimer();
    timerId=setInterval(()=>{
      timeLeft-=0.2;updTimer();
      if(timeLeft<=0){clearInterval(timerId);gameOver();}
    },200);
  }else{$('timer-wrap').style.display='none';}
  startT=Date.now();
}
function updTimer(){
  const r=Math.max(0,timeLeft/cur.time);
  const f=$('timer-fill');f.style.width=(r*100)+'%';
  f.style.background=r>0.5?'linear-gradient(90deg,#69F0AE,#00C853)':r>0.25?'linear-gradient(90deg,#FFEE58,#F9A825)':'linear-gradient(90deg,#FF8A80,#D32F2F)';
}

function buildDeck(st){
  const emos=POOL.slice().sort(()=>Math.random()-.5).slice(0,st.pairs-(st.star?1:0)-(st.shuffle?1:0));
  let cards=[];
  emos.forEach(e=>{cards.push({e:e,kind:'n'},{e:e,kind:'n'});});
  if(st.star)cards.push({e:'⭐',kind:'star'},{e:'⭐',kind:'star'});
  if(st.shuffle)cards.push({e:'🌀',kind:'shuf'},{e:'🌀',kind:'shuf'});
  cards.sort(()=>Math.random()-.5);
  deck=cards;
  $('c-left').textContent=st.pairs;
  const bd=$('board');bd.innerHTML='';
  bd.style.gridTemplateColumns='repeat('+st.cols+',1fr)';
  cards.forEach((c,i)=>{
    const d=document.createElement('div');
    d.className='card'+((c.kind!=='n')?' spec':'');d.dataset.i=i;
    d.innerHTML='<div class="card-in"><div class="cf cf-back">❓</div><div class="cf cf-front">'+c.e+'</div></div>';
    d.onclick=()=>tap(d,i);
    bd.appendChild(d);
  });
  // 絵文字サイズをカード幅に合わせて拡大
  requestAnimationFrame(()=>{
    const first=bd.querySelector('.card');
    if(first)bd.style.setProperty('--cardfs',Math.round(first.offsetWidth*0.6)+'px');
  });
}

function tap(el,i){
  if(lock||el.classList.contains('open')||el.classList.contains('gone'))return;
  bgmInit();
  se('flip');
  el.classList.add('open');
  // shuffle card triggers on flip (before pair check)
  if(deck[i].kind==='shuf'&&!open.length){/* first of pair: trigger after check below */}
  open.push({el:el,i:i});
  if(open.length<2)return;
  lock=true;
  const [a,b]=open;
  if(deck[a.i].e===deck[b.i].e){
    // MATCH
    combo++;maxCombo=Math.max(maxCombo,combo);
    let pts=100*combo;
    const kind=deck[a.i].kind;
    setTimeout(()=>{
      a.el.classList.add('matched');b.el.classList.add('matched');
      if(kind==='star'){
        se('bonus');pts=300*combo;
        if(cur.time>0){timeLeft=Math.min(cur.time,timeLeft+8);updTimer();}
        partnerSay('⭐ボーナス！ +'+(cur.time>0?'じかんも':'')+'てんすう！',true);
      }else if(kind==='shuf'){
        se('match');partnerSay('🌀を きゅうしゅつ！',true);
      }else{
        se('match');
        partnerSay(combo>=3?COMBOS[Math.floor(Math.random()*COMBOS.length)]:CHEERS[Math.floor(Math.random()*CHEERS.length)],true);
      }
      score+=pts;$('c-score').textContent=score;
      const r=a.el.getBoundingClientRect(),w=$('wrap').getBoundingClientRect();
      floatTxt(r.left-w.left+r.width/2,r.top-w.top,'+'+pts,kind==='star'?'#FFD54F':'#69F0AE',kind==='star'?22:18);
      if(combo>=2){$('chip-combo').style.display='flex';$('c-combo').textContent=combo;}
      matchedPairs++;$('c-left').textContent=cur.pairs-matchedPairs;
      setTimeout(()=>{a.el.classList.add('gone');b.el.classList.add('gone');},350);
      open=[];lock=false;
      if(matchedPairs>=cur.pairs)setTimeout(stageClear,700);
    },350);
  }else{
    // MISS
    misses++;combo=0;$('chip-combo').style.display='none';
    const shufTriggered=(deck[a.i].kind==='shuf'||deck[b.i].kind==='shuf');
    setTimeout(()=>{
      se('miss');
      a.el.classList.add('shake');b.el.classList.add('shake');
      setTimeout(()=>{
        a.el.classList.remove('open','shake');b.el.classList.remove('open','shake');
        open=[];lock=false;
        if(shufTriggered)doShuffle();
      },420);
    },550);
  }
}

function doShuffle(){
  se('shuffle');partnerSay('🌀シャッフル！！',true);
  const bd=$('board');
  const els=[...bd.querySelectorAll('.card')];
  // collect indices of face-down (not gone, not open) cards
  const hidden=els.filter(e=>!e.classList.contains('gone')&&!e.classList.contains('open'));
  const idxs=hidden.map(e=>parseInt(e.dataset.i));
  const shuffled=idxs.slice().sort(()=>Math.random()-.5);
  const newVals=shuffled.map(j=>deck[j]);
  hidden.forEach((e,k)=>{
    const i=parseInt(e.dataset.i);
    deck[i]=newVals[k];
    e.querySelector('.cf-front').textContent=deck[i].e;
    e.classList.toggle('spec',deck[i].kind!=='n');
    e.classList.add('spin');setTimeout(()=>e.classList.remove('spin'),520);
  });
}

/* ================= RESULT ================= */
function endCommon(){
  clearInterval(timerId);
  $('hud').classList.remove('on');$('board-wrap').classList.remove('on');$('partner').classList.remove('on');
}
function stageClear(){
  endCommon();se('clear');
  const stars=misses<=cur.s3?3:misses<=cur.s2?2:1;
  if(stars>starsOf(cur.id)){save.stars[cur.id]=stars;persist();}
  const sec=Math.round((Date.now()-startT)/1000);
  $('res-title').textContent=stars===3?'🏆 パーフェクト！':stars===2?'🎉 クリア！':'⭕ クリア！';
  $('res-msg').innerHTML='スコア <b style="color:#FFD54F;font-size:20px">'+score+'</b> てん<br>ミス '+misses+'かい ／ '+sec+'びょう'+(maxCombo>=3?'<br>さいだいコンボ '+maxCombo+'！':'');
  const rs=$('res-stars');rs.innerHTML='';
  for(let i=0;i<3;i++){const sp=document.createElement('span');sp.textContent=i<stars?'⭐':'☆';rs.appendChild(sp);setTimeout(()=>sp.classList.add('pop'),300+i*350);}
  $('btn-next').style.display=(cur.id<5)?'block':'none';
  show('scr-result');
  confettiGo(stars);
}
function gameOver(){
  endCommon();se('over');lock=true;
  $('res-title').textContent='⏰ タイムアップ…';
  $('res-stars').innerHTML='';
  $('res-msg').innerHTML='あと '+(cur.pairs-matchedPairs)+'ペアだった！<br>もういちど ちょうせんしよう！';
  $('btn-next').style.display='none';
  show('scr-result');
}

/* confetti */
const cfC=$('confetti'),cfx=cfC.getContext('2d');let cfs=[],cfOn=false;
function confettiGo(n){
  cfC.width=cfC.offsetWidth*2;cfC.height=cfC.offsetHeight*2;cfx.setTransform(2,0,0,2,0,0);
  const W=cfC.offsetWidth;cfs=[];
  const cols=['#FFD54F','#FF80AB','#69F0AE','#82B1FF','#E1BEE7'];
  for(let i=0;i<n*22;i++)cfs.push({x:Math.random()*W,y:-10-Math.random()*120,v:1.6+Math.random()*2.2,r:Math.random()*6.28,vr:(Math.random()-0.5)*0.25,s:4+Math.random()*5,c:cols[i%cols.length]});
  if(!cfOn){cfOn=true;cfLoop();}
}
function cfLoop(){
  const W=cfC.offsetWidth,H=cfC.offsetHeight;
  cfx.clearRect(0,0,W,H);
  cfs=cfs.filter(p=>p.y<H+20);
  for(const p of cfs){p.y+=p.v;p.r+=p.vr;p.x+=Math.sin(p.y/28)*0.9;
    cfx.save();cfx.translate(p.x,p.y);cfx.rotate(p.r);cfx.fillStyle=p.c;cfx.fillRect(-p.s/2,-p.s/2,p.s,p.s*0.65);cfx.restore();}
  if(cfs.length){requestAnimationFrame(cfLoop);}else{cfOn=false;cfx.clearRect(0,0,W,H);}
}

/* ================= EVENTS ================= */
$('btn-start').onclick=()=>{bgmInit();se('flip');buildMap();show('scr-map');};
$('btn-home').onclick=()=>{if(window.parent!==window)window.parent.postMessage({type:'goBack'},'*');else history.back();};
$('btn-map-back').onclick=()=>{se('flip');buildTitle();show('scr-title');};
$('btn-retry').onclick=()=>{startStage(cur);};
$('btn-to-map').onclick=()=>{setBgTheme(null);buildMap();show('scr-map');};
$('btn-next').onclick=()=>{
  const nx=STAGES.find(s=>s.id===cur.id+1);
  if(nx)startStage(nx);else{setBgTheme(null);buildMap();show('scr-map');}
};
$('back-btn').onclick=()=>{
  endCommon();setBgTheme(null);buildMap();show('scr-map');
};
$('bgm-btn').onclick=()=>{
  if(typeof WakuwakuBGM==='undefined')return;
  if(!bgm){try{bgm=new WakuwakuBGM('puzzle');}catch(e){return;}}
  const next=!WakuwakuBGM.loadState();
  if(next)bgm.start();else bgm.stop();
  WakuwakuBGM.saveState(next);
  updBgmBtn();
};
// goBack from title
document.addEventListener('keydown',e=>{if(e.key==='Escape')window.parent.postMessage({type:'goBack'},'*');});

/* ================= INIT ================= */
window.addEventListener('resize',()=>{bgResize();setBgTheme(cur&&$('board-wrap').classList.contains('on')?cur:null);
  const first=document.querySelector('#board .card');
  if(first)$('board').style.setProperty('--cardfs',Math.round(first.offsetWidth*0.6)+'px');
});
bgResize();setBgTheme(null);requestAnimationFrame(bgLoop);
buildTitle();
updBgmBtn();
</script>
