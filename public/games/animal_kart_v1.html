<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>アニマルカート GP</title>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { width:100%; height:100%; background:#101018; overflow:hidden;
    font-family:'Press Start 2P', monospace; color:#fff; -webkit-user-select:none; user-select:none;
    -webkit-tap-highlight-color:transparent; touch-action:none; }
  #wrap { position:fixed; inset:0; display:flex; align-items:center; justify-content:center; background:#000; }
  #screen { position:relative; width:100%; height:100%; max-width:min(100vw, calc(100vh * 4 / 3));
    max-height:min(100vh, calc(100vw * 3 / 4)); aspect-ratio:4/3; }
  canvas { position:absolute; inset:0; width:100%; height:100%; image-rendering:pixelated;
    image-rendering:crisp-edges; background:#000; display:block; }

  /* overlay controls (fixed to viewport corners) */
  .ctl { position:fixed; bottom:calc(14px + var(--sab, env(safe-area-inset-bottom, 0px))); display:flex; gap:10px; z-index:60; }
  #leftPad { left:calc(14px + var(--sal, env(safe-area-inset-left, 0px))); }
  #rightPad { right:calc(14px + var(--sar, env(safe-area-inset-right, 0px))); }
  .btn { width:62px; height:62px; border-radius:14px; border:3px solid rgba(255,255,255,.65);
    background:rgba(20,24,40,.5); color:#fff; font-family:inherit; font-size:20px;
    display:flex; align-items:center; justify-content:center; touch-action:manipulation; }
  .btn:active { background:rgba(255,255,255,.35); }
  #accelBtn { background:rgba(40,170,70,.55); border-color:#9bffb0; }
  #brakeBtn { background:rgba(190,60,60,.5); border-color:#ffb0b0; font-size:13px; }

  /* fixed home / bgm (project standard) */
  #bgmBtn { position:fixed; top:calc(10px + var(--sat, env(safe-area-inset-top, 0px))); width:42px; height:42px; border-radius:10px;
    border:2px solid rgba(255,255,255,.6); background:rgba(20,24,40,.55); color:#fff;
    font-size:18px; z-index:9999; touch-action:manipulation; display:flex; align-items:center; justify-content:center; }
  #bgmBtn { right:calc(10px + var(--sar, env(safe-area-inset-right, 0px))); }

  /* menu overlays */
  .panel { position:absolute; inset:0; z-index:80; display:flex; flex-direction:column;
    align-items:center; justify-content:center; gap:18px; text-align:center; padding:18px;
    background:linear-gradient(160deg,#1b2550,#3a1f55 60%,#5a2540); }
  .hidden { display:none !important; }
  h1 { font-size:clamp(16px,5vw,30px); line-height:1.5; color:#ffe14d; text-shadow:3px 3px 0 #b03a00, 6px 6px 0 #00000055; }
  .sub { font-size:10px; color:#cfe2ff; line-height:1.8; }
  .menuBtn { font-family:inherit; font-size:clamp(10px,3vw,14px); color:#1b2550; background:#ffe14d;
    border:none; border-bottom:5px solid #b8860b; border-radius:10px; padding:14px 22px; min-width:200px; }
  .menuBtn:active { transform:translateY(2px); border-bottom-width:3px; }
  .courseList { display:flex; flex-direction:column; gap:12px; width:100%; max-width:340px; }
  .courseBtn { font-family:inherit; font-size:11px; color:#fff; border:3px solid #ffffff66;
    border-radius:12px; padding:14px; text-align:left; line-height:1.7; }
  .courseBtn:active { filter:brightness(1.3); }
  .resultRow { font-size:11px; line-height:2.1; }
  .me { color:#ffe14d; }
  .footnote { font-size:8px; color:#8aa0c0; line-height:1.8; }

  /* rotate-to-landscape hint */
  #rotate { position:fixed; inset:0; z-index:99999; display:none; flex-direction:column;
    align-items:center; justify-content:center; gap:18px; text-align:center; padding:24px;
    background:#0c0e16; color:#fff; font-size:14px; line-height:1.9; }
  #rotate .ph { font-size:54px; animation:tilt 1.4s ease-in-out infinite; }
  @keyframes tilt { 0%,100%{transform:rotate(0)} 50%{transform:rotate(90deg)} }
  body.portrait #rotate { display:flex; }
</style>
</head>
<body>
<div id="wrap">
  <div id="screen">
    <canvas id="cv" width="320" height="240"></canvas>

    <!-- driving controls -->
    <div class="ctl hidden" id="leftPad">
      <button class="btn" id="leftBtn">◀</button>
      <button class="btn" id="rightBtn">▶</button>
    </div>
    <div class="ctl hidden" id="rightPad">
      <button class="btn" id="brakeBtn">ブレーキ</button>
      <button class="btn" id="accelBtn">▲</button>
    </div>

    <!-- title -->
    <div class="panel" id="titlePanel">
      <h1>アニマルカート<br>GP</h1>
      <div class="sub">どうぶつたちの<br>レースたいけつ！</div>
      <button class="menuBtn" id="startBtn">スタート</button>
      <div class="footnote">そうさ：▲すすむ ／ ◀▶まがる ／ ブレーキ<br>PCはやじるしキー</div>
    </div>

    <!-- course select -->
    <div class="panel hidden" id="coursePanel">
      <h1 style="font-size:clamp(14px,4vw,22px)">コースをえらぶ</h1>
      <div class="courseList" id="courseList"></div>
    </div>

    <!-- result -->
    <div class="panel hidden" id="resultPanel">
      <h1 style="font-size:clamp(14px,4vw,22px)" id="resultTitle">ゴール！</h1>
      <div id="resultBoard" class="resultRow"></div>
      <div style="display:flex;gap:12px;flex-wrap:wrap;justify-content:center">
        <button class="menuBtn" id="retryBtn" style="min-width:140px">もういちど</button>
        <button class="menuBtn" id="backBtn" style="min-width:140px;background:#9bd0ff;border-bottom-color:#3a6a9a">コースせんたく</button>
      </div>
    </div>
  </div>
</div>

<button id="bgmBtn">🔊</button>

<div id="rotate">
  <div class="ph">📱</div>
  <div>よこむきに<br>してね</div>
</div>

<script src="safe_area.js"></script>
<script src="wakuwaku_bgm.js"></script>
<script>
(() => {
"use strict";
const cv = document.getElementById('cv');
const ctx = cv.getContext('2d');
const W = 320, H = 240;
ctx.imageSmoothingEnabled = false;

// ---------- Mode 7 params ----------
const HORIZON = 92;
const K = 9200;          // depth scale
const FOV = 1.75;
const TEX = 1024;        // texture / world size

// ---------- helpers ----------
const clamp = (v,a,b)=> v<a?a:(v>b?b:v);
const lerp = (a,b,t)=> a+(b-a)*t;
const TAU = Math.PI*2;
function angDiff(a,b){ let d=(b-a)%TAU; if(d>Math.PI)d-=TAU; if(d<-Math.PI)d+=TAU; return d; }

// Catmull-Rom closed loop -> dense centerline
function buildCenterline(controls, N){
  const n=controls.length, out=[];
  for(let s=0;s<n;s++){
    const p0=controls[(s-1+n)%n], p1=controls[s], p2=controls[(s+1)%n], p3=controls[(s+2)%n];
    const seg=Math.ceil(N/n);
    for(let i=0;i<seg;i++){
      const t=i/seg, t2=t*t, t3=t2*t;
      const x=0.5*((2*p1[0])+(-p0[0]+p2[0])*t+(2*p0[0]-5*p1[0]+4*p2[0]-p3[0])*t2+(-p0[0]+3*p1[0]-3*p2[0]+p3[0])*t3);
      const y=0.5*((2*p1[1])+(-p0[1]+p2[1])*t+(2*p0[1]-5*p1[1]+4*p2[1]-p3[1])*t2+(-p0[1]+3*p1[1]-3*p2[1]+p3[1])*t3);
      out.push([x,y]);
    }
  }
  return out;
}
// star-shaped loop from radii (guaranteed non self-intersecting)
function radialControls(cx,cy,radii){
  const n=radii.length, pts=[];
  for(let i=0;i<n;i++){ const a=i/n*TAU; pts.push([cx+Math.cos(a)*radii[i], cy+Math.sin(a)*radii[i]]); }
  return pts;
}

// ---------- courses ----------
const COURSES = [
  { name:'みどりサーキット', diff:'★☆☆ かんたん', road:140,
    radii:[360,380,340,360,380,350,360,375,345,360,380,350],
    pal:{ grass:'#3a9d3a', grass2:'#2f8a2f', road:'#6f6f78', edge:'#34343c', center:'#e8e85a',
          skyTop:'#3f95ff', skyBot:'#bfe8ff' } },
  { name:'サンセットビーチ', diff:'★★☆ ふつう', road:124,
    radii:[300,400,260,380,300,420,250,360,300,410,270,380],
    pal:{ grass:'#e2c578', grass2:'#d2ad5c', road:'#7d7064', edge:'#463a2e', center:'#fff0c0',
          skyTop:'#ff7a3a', skyBot:'#ffd98e' } },
  { name:'こおりサーキット', diff:'★★★ むずかしい', road:110,
    radii:[260,400,230,360,250,420,210,340,250,400,220,360],
    pal:{ grass:'#e0eaf2', grass2:'#ccdcea', road:'#90a4b4', edge:'#4a5a66', center:'#ffffff',
          skyTop:'#5fa8e0', skyBot:'#cfeeff' } },
];

// ---------- racers ----------
const ANIMALS = [
  { name:'ラビィ',  head:'#f2f2f2', ear:'rabbit', kart:'#e03a3a', skin:'#f7d0d0' },
  { name:'コン',    head:'#ef8a3a', ear:'fox',    kart:'#ef8a3a', skin:'#ffd9b0' },
  { name:'ポコ',    head:'#9a6a3a', ear:'round',  kart:'#3aa85a', skin:'#d8b48a' },
  { name:'ミィ',    head:'#a8a8b0', ear:'cat',    kart:'#3a7ae0', skin:'#d8d8e0' },
  { name:'ドン',    head:'#7a5230', ear:'round',  kart:'#f0c020', skin:'#c8a070' },
  { name:'パオ',    head:'#f2f2f2', ear:'panda',  kart:'#9a4ad0', skin:'#dddddd' },
];

function makeSprite(an){
  const s=48, c=document.createElement('canvas'); c.width=s; c.height=s;
  const g=c.getContext('2d'); g.imageSmoothingEnabled=false;
  // shadow
  g.fillStyle='rgba(0,0,0,.25)'; g.beginPath(); g.ellipse(24,44,16,4,0,0,TAU); g.fill();
  // kart body (rear view)
  g.fillStyle=an.kart; g.fillRect(8,28,32,14); g.fillRect(12,24,24,6);
  g.fillStyle='rgba(0,0,0,.2)'; g.fillRect(8,38,32,4);
  // wheels
  g.fillStyle='#222'; g.fillRect(4,30,7,12); g.fillRect(37,30,7,12);
  // head
  g.fillStyle=an.head; g.beginPath(); g.arc(24,18,11,0,TAU); g.fill();
  // ears
  g.fillStyle=an.head;
  if(an.ear==='rabbit'){ g.fillRect(18,2,4,12); g.fillRect(26,2,4,12);
    g.fillStyle=an.skin; g.fillRect(19,4,2,8); g.fillRect(27,4,2,8); }
  else if(an.ear==='fox'){ g.beginPath(); g.moveTo(15,12); g.lineTo(13,1); g.lineTo(22,8); g.closePath(); g.fill();
    g.beginPath(); g.moveTo(33,12); g.lineTo(35,1); g.lineTo(26,8); g.closePath(); g.fill(); }
  else if(an.ear==='cat'){ g.beginPath(); g.moveTo(15,10); g.lineTo(14,2); g.lineTo(21,7); g.closePath(); g.fill();
    g.beginPath(); g.moveTo(33,10); g.lineTo(34,2); g.lineTo(27,7); g.closePath(); g.fill(); }
  else if(an.ear==='panda'){ g.fillStyle='#222'; g.beginPath(); g.arc(15,9,5,0,TAU); g.fill(); g.beginPath(); g.arc(33,9,5,0,TAU); g.fill();
    g.beginPath(); g.arc(18,19,4,0,TAU); g.fill(); g.beginPath(); g.arc(30,19,4,0,TAU); g.fill(); g.fillStyle=an.head; }
  else { g.beginPath(); g.arc(15,9,5,0,TAU); g.fill(); g.beginPath(); g.arc(33,9,5,0,TAU); g.fill(); }
  // eyes
  g.fillStyle='#222'; g.fillRect(20,17,3,3); g.fillRect(26,17,3,3);
  return c;
}
ANIMALS.forEach(a=> a.sprite=makeSprite(a));

// ---------- texture builder ----------
let texData=null, texW=TEX;
let centerline=[], CN=0, cumLen=[], totalLen=0, startHeading=0, roadHalf=48;
let curPal=null;

function buildTexture(course){
  curPal=course.pal;
  roadHalf=course.road/2;
  const ctrl=radialControls(512,512,course.radii);
  centerline=buildCenterline(ctrl,256); CN=centerline.length;
  // arc length
  cumLen=[0]; totalLen=0;
  for(let i=1;i<=CN;i++){
    const a=centerline[i-1], b=centerline[i%CN];
    totalLen+=Math.hypot(b[0]-a[0],b[1]-a[1]); cumLen.push(totalLen);
  }
  startHeading=Math.atan2(centerline[2][0]-centerline[0][0], centerline[2][1]-centerline[0][1]);

  const tc=document.createElement('canvas'); tc.width=TEX; tc.height=TEX;
  const g=tc.getContext('2d');
  // grass
  g.fillStyle=course.pal.grass; g.fillRect(0,0,TEX,TEX);
  g.fillStyle=course.pal.grass2;
  for(let y=0;y<TEX;y+=48) for(let x=((y/48)&1?48:0);x<TEX;x+=96) g.fillRect(x,y,48,48);
  // road path
  const path=new Path2D(); path.moveTo(centerline[0][0],centerline[0][1]);
  for(let i=1;i<CN;i++) path.lineTo(centerline[i][0],centerline[i][1]);
  path.closePath();
  g.lineJoin='round'; g.lineCap='round';
  g.strokeStyle=course.pal.edge; g.lineWidth=course.road+18; g.stroke(path);
  g.strokeStyle=course.pal.road; g.lineWidth=course.road; g.stroke(path);
  // center dashes (speed cue)
  g.strokeStyle=course.pal.center; g.lineWidth=4; g.setLineDash([26,30]); g.stroke(path); g.setLineDash([]);
  // start/finish checker across road
  const p0=centerline[0], p1=centerline[1];
  const ang=Math.atan2(p1[1]-p0[1],p1[0]-p0[0]);
  const px=Math.cos(ang+Math.PI/2), py=Math.sin(ang+Math.PI/2);
  const tx=Math.cos(ang), ty=Math.sin(ang);
  const cols=8, cw=course.road/cols;
  for(let r=0;r<3;r++) for(let cI=0;cI<cols;cI++){
    g.fillStyle=((r+cI)&1)?'#ffffff':'#202020';
    const bx=p0[0]-px*course.road/2 + px*cw*cI - tx*6 + tx*6*r;
    const by=p0[1]-py*course.road/2 + py*cw*cI - ty*6 + ty*6*r;
    g.save(); g.translate(bx,by); g.rotate(ang); g.fillRect(0,0,cw+1,7); g.restore();
  }
  texData=g.getImageData(0,0,TEX,TEX).data;
}

// sky columns
let skyCols=null;
function buildSky(pal){
  skyCols=new Array(HORIZON);
  const t=hexRGB(pal.skyTop), b=hexRGB(pal.skyBot);
  for(let y=0;y<HORIZON;y++){ const k=y/(HORIZON-1);
    skyCols[y]=[ (t[0]+(b[0]-t[0])*k)|0,(t[1]+(b[1]-t[1])*k)|0,(t[2]+(b[2]-t[2])*k)|0 ]; }
}
function hexRGB(h){ return [parseInt(h.slice(1,3),16),parseInt(h.slice(3,5),16),parseInt(h.slice(5,7),16)]; }

// ---------- game state ----------
const frame=ctx.createImageData(W,H);
const fb=frame.data;
let state='title';   // title | select | countdown | race | result
let courseIdx=0, LAPS=3;
let racers=[], player=null;
let raceTime=0, countdown=0, finishOrder=[], input={l:false,r:false,a:false,b:false};

function newRacer(an,isPlayer){
  return { an, isPlayer, x:0,z:0, heading:startHeading, speed:0,
    prog:0, lap:1, finished:false, finishT:0, lane:0, spd:1 };
}

function startRace(idx){
  courseIdx=idx; const course=COURSES[idx];
  buildTexture(course); buildSky(course.pal);
  racers=ANIMALS.map((a,i)=> newRacer(a, i===0));
  player=racers[0];
  // place on start line, staggered behind line
  const p0=centerline[0], p1=centerline[1];
  const ang=Math.atan2(p1[1]-p0[1],p1[0]-p0[0]);
  const px=Math.cos(ang+Math.PI/2), py=Math.sin(ang+Math.PI/2);
  racers.forEach((r,i)=>{
    const row=Math.floor(i/2), col=(i%2)*2-1;
    const lane=col*roadHalf*0.45;
    r.x=p0[0]-Math.cos(ang)*(40+row*34)+px*lane;
    r.z=p0[1]-Math.sin(ang)*(40+row*34)+py*lane;
    r.heading=startHeading; r.speed=0; r.lap=1; r.finished=false;
    r.lane=lane; r.spd= r.isPlayer?1 : 0.93+Math.random()*0.06;
    r.prog=nearestProg(r.x,r.z); r.passedHalf=false;
  });
  raceTime=0; finishOrder=[]; countdown=3.2; state='countdown';
  showPanel(null); document.getElementById('leftPad').classList.remove('hidden');
  document.getElementById('rightPad').classList.remove('hidden');
}

// nearest centerline index (float) for progress
function nearestProg(x,z,hint){
  let best=1e9,bi=0; const span=24, start=hint!==undefined?hint-span:0, end=hint!==undefined?hint+span:CN;
  for(let k=start;k<end;k++){ const i=((k%CN)+CN)%CN; const p=centerline[i];
    const d=(p[0]-x)*(p[0]-x)+(p[1]-z)*(p[1]-z); if(d<best){best=d;bi=i;} }
  if(hint===undefined){} return bi;
}
function onRoad(x,z,i){ const p=centerline[i]; const d=Math.hypot(p[0]-x,p[1]-z); return d<roadHalf+4; }
// invisible wall: keep racer inside the road, but SLIDE along it (no dead stop)
function clampToRoad(r){
  let bi=0,best=1e9;
  for(let i=0;i<CN;i++){ const p=centerline[i]; const dx=p[0]-r.x, dz=p[1]-r.z; const d=dx*dx+dz*dz; if(d<best){best=d;bi=i;} }
  const p=centerline[bi];
  let dx=r.x-p[0], dz=r.z-p[1];
  const dist=Math.hypot(dx,dz)||0.0001;
  const limit=roadHalf-8;
  if(dist>limit){
    const nx=dx/dist, nz=dz/dist;          // outward normal
    r.x=p[0]+nx*limit; r.z=p[1]+nz*limit;   // push back onto edge
    // slide: remove the velocity component pointing into the wall
    let vx=Math.sin(r.heading)*r.speed, vz=Math.cos(r.heading)*r.speed;
    const into=vx*nx+vz*nz;                 // >0 means heading into wall
    if(into>0){ vx-=into*nx; vz-=into*nz; }
    const ns=Math.hypot(vx,vz);
    if(ns>1){ r.heading=Math.atan2(vx,vz); r.speed=ns*0.85; } // keep sliding, mild scrub
    else { r.speed*=0.85; }
  }
}

// ---------- physics ----------
const MAX_ON=235, MAX_OFF=110, ACC=185, BRK=320, FRIC=80;
function updateRacer(r,dt){
  if(r.finished){ r.speed*=0.96; advance(r,dt); return; }
  let steer=0, throttle=0;
  if(r.isPlayer){
    if(input.l)steer-=1; if(input.r)steer+=1;
    if(input.a)throttle=1; if(input.b)throttle=-1;
  } else {
    // AI: aim ahead, slow for curves
    const ahead=14, ti=(r.prog+ahead)|0;
    const tp=centerline[((ti%CN)+CN)%CN];
    const want=Math.atan2(tp[0]-r.x, tp[1]-r.z);
    let dh=angDiff(r.heading, want);
    steer=clamp(dh*2.2,-1,1);
    // curvature look
    const a1=centerline[(((r.prog+8)|0)%CN+CN)%CN], a2=centerline[(((r.prog+22)|0)%CN+CN)%CN];
    const c1=Math.atan2(a1[0]-r.x,a1[1]-r.z), c2=Math.atan2(a2[0]-a1[0],a2[1]-a1[1]);
    const curve=Math.abs(angDiff(c1,c2));
    const targetSpeed=MAX_ON*r.spd*clamp(1-curve*0.9,0.55,1);
    throttle = r.speed<targetSpeed?1:-0.4;
  }
  const i=nearestProg(r.x,r.z); const road=onRoad(r.x,r.z,i);
  const maxS=road?MAX_ON*(r.isPlayer?1:r.spd):MAX_OFF;
  if(throttle>0) r.speed+=ACC*throttle*dt;
  else if(throttle<0) r.speed-=BRK*(-throttle)*dt;
  else r.speed-=FRIC*dt;
  if(r.speed>maxS) r.speed-=(r.speed-maxS)*Math.min(1,dt*3);
  if(r.speed<0) r.speed=0;
  const steerRate=2.0*(0.45+0.55*Math.min(1,r.speed/MAX_ON));
  r.heading+=steer*steerRate*dt;
  advance(r,dt);
}
function advance(r,dt){
  r.x+=Math.sin(r.heading)*r.speed*dt;
  r.z+=Math.cos(r.heading)*r.speed*dt;
  clampToRoad(r);
  // progress + lap
  const ni=nearestProg(r.x,r.z);
  const prev=r.prog;
  if(ni>CN*0.45 && ni<CN*0.7) r.passedHalf=true;
  if(prev>CN*0.7 && ni<CN*0.25){ // crossed start forward
    if(r.passedHalf && !r.finished){
      r.passedHalf=false; r.lap++;
      if(r.lap>LAPS){ r.finished=true; r.finishT=raceTime; finishOrder.push(r); }
    }
  }
  r.prog=ni;
}

// ---------- render ----------
function renderGround(camX,camZ,a){
  const sinA=Math.sin(a), cosA=Math.cos(a);
  // sky
  let fi=0;
  for(let y=0;y<HORIZON;y++){ const c=skyCols[y];
    for(let x=0;x<W;x++){ fb[fi]=c[0];fb[fi+1]=c[1];fb[fi+2]=c[2];fb[fi+3]=255; fi+=4; } }
  // ground
  for(let sy=HORIZON;sy<H;sy++){
    const dy=sy-HORIZON+1;
    const d=K/dy;
    const gX=camX+sinA*d, gZ=camZ+cosA*d;
    const stepLat=d*FOV/W;
    let sX=gX+cosA*(-W/2)*stepLat;
    let sZ=gZ-sinA*(-W/2)*stepLat;
    const dX=cosA*stepLat, dZ=-sinA*stepLat;
    // fog toward horizon
    const fog=clamp((dy)/40,0,1);
    for(let sx=0;sx<W;sx++){
      let tx=sX|0, tz=sZ|0;
      if(tx<0)tx=0; else if(tx>=TEX)tx=TEX-1;
      if(tz<0)tz=0; else if(tz>=TEX)tz=TEX-1;
      const ti=(tz*TEX+tx)*4;
      if(fog>=0.999){ fb[fi]=texData[ti]; fb[fi+1]=texData[ti+1]; fb[fi+2]=texData[ti+2]; }
      else { const sc=skyCols[HORIZON-1];
        fb[fi]=lerp(sc[0],texData[ti],fog)|0;
        fb[fi+1]=lerp(sc[1],texData[ti+1],fog)|0;
        fb[fi+2]=lerp(sc[2],texData[ti+2],fog)|0; }
      fb[fi+3]=255; fi+=4;
      sX+=dX; sZ+=dZ;
    }
  }
  ctx.putImageData(frame,0,0);
}

function project(camX,camZ,a,wx,wz){
  const dx=wx-camX, dz=wz-camZ;
  const sinA=Math.sin(a), cosA=Math.cos(a);
  const fd=dx*sinA+dz*cosA;        // forward depth
  const lat=dx*cosA-dz*sinA;       // right
  if(fd<8) return null;
  const dy=K/fd;
  const sy=HORIZON-1+dy;
  if(sy>=H+60) return null;
  const sx=W/2 + lat/(fd*FOV/W);
  const scale=clamp(K/(fd*38),0.05,3.5);
  return {sx,sy,scale,fd};
}

function drawSprites(camX,camZ,a){
  const list=[];
  for(const r of racers){ if(r.isPlayer) continue;
    const pr=project(camX,camZ,a,r.x,r.z); if(pr) list.push({r,pr}); }
  list.sort((A,B)=>B.pr.fd-A.pr.fd);
  for(const {r,pr} of list){
    const sp=r.an.sprite; const w=48*pr.scale*0.9, h=48*pr.scale*0.9;
    ctx.drawImage(sp, pr.sx-w/2, pr.sy-h, w, h);
  }
}

function drawPlayerKart(){
  const r=player; const sp=r.an.sprite;
  const baseW=120, baseH=120;
  let lean=0; if(input.l)lean=-10; if(input.r)lean=10;
  const x=W/2-baseW/2+lean, y=H-baseH+8;
  ctx.drawImage(sp,x,y,baseW,baseH);
}

function drawHUD(){
  ctx.font='8px "Press Start 2P", monospace'; ctx.textBaseline='top';
  // lap
  ctx.fillStyle='#000'; ctx.fillRect(4,4,86,14); ctx.fillStyle='#ffe14d';
  ctx.fillText('LAP '+Math.min(player.lap,LAPS)+'/'+LAPS,8,7);
  // time
  const tt=raceTime.toFixed(1)+'s';
  ctx.fillStyle='#000'; ctx.fillRect(W-78,4,74,14); ctx.fillStyle='#fff';
  ctx.fillText(tt,W-74,7);
  // position
  const sorted=[...racers].sort((A,B)=> rankScore(B)-rankScore(A));
  const pos=sorted.indexOf(player)+1;
  const sfx=['st','nd','rd','th','th','th'][pos-1];
  ctx.fillStyle='#000'; ctx.fillRect(W-78,20,74,16); ctx.fillStyle='#9bff9b';
  ctx.font='10px "Press Start 2P", monospace'; ctx.fillText(pos+sfx,W-72,23);
  // speed bar
  const sw=70, sh=6, bx=8, by=H-14;
  ctx.fillStyle='#000'; ctx.fillRect(bx-2,by-2,sw+4,sh+4);
  ctx.fillStyle='#3aff7a'; ctx.fillRect(bx,by,sw*clamp(player.speed/MAX_ON,0,1),sh);
  // minimap
  drawMinimap();
}
function rankScore(r){ return (r.lap*CN)+r.prog + (r.finished? 1e6-(r.finishT):0); }

function drawMinimap(){
  const mx=W-58, my=H-58, s=50, sc=s/TEX;
  ctx.fillStyle='rgba(0,0,0,.45)'; ctx.fillRect(mx-3,my-3,s+6,s+6);
  ctx.strokeStyle='#ffffff80'; ctx.lineWidth=2; ctx.beginPath();
  for(let i=0;i<=CN;i+=4){ const p=centerline[i%CN]; const X=mx+p[0]*sc, Y=my+p[1]*sc;
    if(i===0)ctx.moveTo(X,Y); else ctx.lineTo(X,Y); } ctx.stroke();
  for(const r of racers){ ctx.fillStyle=r.isPlayer?'#ffe14d':r.an.kart;
    ctx.fillRect(mx+r.x*sc-1.5,my+r.z*sc-1.5,3,3); }
}

// ---------- loop ----------
let last=performance.now();
function loop(now){
  let dt=(now-last)/1000; last=now; if(dt>0.05)dt=0.05;
  if(!document.body.classList.contains('portrait')){
  if(state==='countdown'){
    countdown-=dt; raceTime=0;
    renderFrame(); drawCountdown();
    if(countdown<=0){ state='race'; beep(880,0.18); }
  } else if(state==='race'){
    raceTime+=dt;
    for(const r of racers) updateRacer(r,dt);
    renderFrame();
    if(player.finished){ endRaceSoon(); }
  }
  }
  requestAnimationFrame(loop);
}
function renderFrame(){
  const cam=player;
  renderGround(cam.x,cam.z,cam.heading);
  drawSprites(cam.x,cam.z,cam.heading);
  drawPlayerKart();
  drawHUD();
}
function drawCountdown(){
  ctx.font='40px "Press Start 2P", monospace'; ctx.textAlign='center'; ctx.textBaseline='middle';
  const n=Math.ceil(countdown-0.2);
  let txt = n>=1? (''+Math.min(n,3)) : 'GO!';
  ctx.fillStyle='#000'; ctx.fillText(txt,W/2+2,H/2-18);
  ctx.fillStyle= txt==='GO!'?'#3aff7a':'#ffe14d'; ctx.fillText(txt,W/2,H/2-20);
  ctx.textAlign='left'; ctx.textBaseline='top';
}
let endTimer=0;
function endRaceSoon(){
  endTimer+=1;
  if(endTimer>90){ // ~1.5s after player finishes, finalize
    // auto-finish remaining racers by current rank
    const remaining=racers.filter(r=>!r.finished).sort((a,b)=>rankScore(b)-rankScore(a));
    remaining.forEach(r=>{ r.finished=true; r.finishT=raceTime+1; finishOrder.push(r); });
    showResult();
  }
}

// ---------- result ----------
function showResult(){
  state='result'; endTimer=0;
  document.getElementById('leftPad').classList.add('hidden');
  document.getElementById('rightPad').classList.add('hidden');
  const order=[...racers].sort((a,b)=> (b.lap-a.lap)|| (a.finishT-b.finishT)|| (rankScore(b)-rankScore(a)));
  const pp=order.indexOf(player)+1;
  document.getElementById('resultTitle').textContent = pp===1?'ゆうしょう！🏆':(pp+'いでした');
  const board=document.getElementById('resultBoard');
  board.innerHTML=order.map((r,i)=>{
    const cls=r.isPlayer?'me':''; const t=r.finishT?('  '+r.finishT.toFixed(1)+'s'):'';
    return `<div class="${cls}">${i+1}. ${r.an.name}${t}</div>`;
  }).join('');
  showPanel('resultPanel');
}

// ---------- audio (shared WakuwakuBGM, racing theme) ----------
let bgm=null, sfx=null;
let bgmOn = (typeof WakuwakuBGM!=='undefined' && WakuwakuBGM.loadState) ? WakuwakuBGM.loadState() : true;
function initAudio(){
  if(typeof WakuwakuBGM!=='undefined' && !bgm){ try{ bgm=new WakuwakuBGM('racing'); }catch(e){} }
  if(!sfx){ try{ sfx=new (window.AudioContext||window.webkitAudioContext)(); }catch(e){} }
  if(bgm && bgmOn){ try{ bgm.start(); }catch(e){} }
}
function beep(freq,dur){
  if(!sfx||!bgmOn) return;
  const o=sfx.createOscillator(),g=sfx.createGain();
  o.type='square'; o.frequency.value=freq; g.gain.value=0.08;
  o.connect(g); g.connect(sfx.destination); o.start();
  g.gain.setTargetAtTime(0,sfx.currentTime+dur*0.6,0.05); o.stop(sfx.currentTime+dur);
}

// ---------- UI wiring ----------
function showPanel(id){
  ['titlePanel','coursePanel','resultPanel'].forEach(p=>{
    document.getElementById(p).classList.toggle('hidden', p!==id);
  });
}
function buildCourseList(){
  const el=document.getElementById('courseList'); el.innerHTML='';
  COURSES.forEach((c,i)=>{
    const b=document.createElement('button'); b.className='courseBtn';
    b.style.background=`linear-gradient(120deg,${c.pal.skyTop},${c.pal.grass})`;
    b.innerHTML=`<b>${c.name}</b><br><span style="font-size:8px">${c.diff}</span>`;
    b.onclick=()=>{ initAudio(); startRace(i); };
    el.appendChild(b);
  });
}
document.getElementById('startBtn').onclick=()=>{ initAudio(); state='select'; showPanel('coursePanel'); };
document.getElementById('retryBtn').onclick=()=>{ startRace(courseIdx); };
document.getElementById('backBtn').onclick=()=>{ state='select'; showPanel('coursePanel');
  document.getElementById('leftPad').classList.add('hidden'); document.getElementById('rightPad').classList.add('hidden'); };
document.getElementById('bgmBtn').onclick=()=>{
  bgmOn=!bgmOn;
  if(bgm){ try{ bgm.toggle(); }catch(e){} }
  if(typeof WakuwakuBGM!=='undefined' && WakuwakuBGM.saveState) WakuwakuBGM.saveState(bgmOn);
  document.getElementById('bgmBtn').textContent=bgmOn?'🔊':'🔇'; };

// touch/mouse controls
function hold(id,key){
  const b=document.getElementById(id);
  const on=e=>{ e.preventDefault(); input[key]=true; };
  const off=e=>{ e.preventDefault(); input[key]=false; };
  b.addEventListener('touchstart',on,{passive:false}); b.addEventListener('touchend',off,{passive:false});
  b.addEventListener('touchcancel',off,{passive:false});
  b.addEventListener('mousedown',on); b.addEventListener('mouseup',off); b.addEventListener('mouseleave',off);
}
hold('leftBtn','l'); hold('rightBtn','r'); hold('accelBtn','a'); hold('brakeBtn','b');

// keyboard
addEventListener('keydown',e=>{
  if(e.key==='ArrowLeft'||e.key==='a')input.l=true;
  if(e.key==='ArrowRight'||e.key==='d')input.r=true;
  if(e.key==='ArrowUp'||e.key==='w')input.a=true;
  if(e.key==='ArrowDown'||e.key==='s')input.b=true;
});
addEventListener('keyup',e=>{
  if(e.key==='ArrowLeft'||e.key==='a')input.l=false;
  if(e.key==='ArrowRight'||e.key==='d')input.r=false;
  if(e.key==='ArrowUp'||e.key==='w')input.a=false;
  if(e.key==='ArrowDown'||e.key==='s')input.b=false;
});

// orientation: prompt landscape on portrait phones
function checkOrient(){
  const portrait = window.innerHeight > window.innerWidth && Math.min(window.innerWidth,window.innerHeight) < 600;
  document.body.classList.toggle('portrait', portrait);
}
addEventListener('resize',checkOrient); addEventListener('orientationchange',checkOrient); checkOrient();

// when embedded in the site, the React wrapper provides the もどる button → hide our 🏠
document.getElementById('bgmBtn').textContent = bgmOn?'🔊':'🔇';

buildCourseList();
showPanel('titlePanel');
requestAnimationFrame(loop);
})();
</script>
