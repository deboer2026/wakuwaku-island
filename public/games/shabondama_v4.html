<link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@700;800;900&family=DotGothic16&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{width:100%;height:100%;overflow:hidden;font-family:'M PLUS Rounded 1c',sans-serif;user-select:none;-webkit-user-select:none;}
body{background:linear-gradient(180deg,#8ED8F5 0%,#BFEAF7 60%,#E7F8FF 100%);transition:background .9s ease;}
body.sky-sea{background:linear-gradient(180deg,#5FC4EE 0%,#A6E4F5 55%,#E4F8FF 100%);}
body.sky-forest{background:linear-gradient(180deg,#8ED4F0 0%,#C9F0DC 68%,#EAF9E0 100%);}
body.sky-meadow{background:linear-gradient(180deg,#9FDCF5 0%,#FFF3C9 72%,#FFE9D6 100%);}
body.sky-cloud{background:linear-gradient(180deg,#B9D9FA 0%,#FBD9EC 60%,#FFF0F6 100%);}
body.sky-lake{background:linear-gradient(180deg,#7FD0EE 0%,#C7EEF6 58%,#EAFBF6 100%);}
body.sky-sunset{background:linear-gradient(180deg,#5B7ACB 0%,#FF9E7A 55%,#FFD9A8 100%);}
body.sky-night{background:linear-gradient(180deg,#16204A 0%,#2C3A72 55%,#5B5FA0 100%);}
body.sky-magic{background:linear-gradient(180deg,#3A2A6E 0%,#7A52B0 52%,#C6A6FF 100%);}
#wrap{position:fixed;inset:0;overflow:hidden;}
#cv{display:block;position:absolute;inset:0;width:100%;height:100%;z-index:0;touch-action:none;}

#hud{position:fixed;top:0;left:0;right:0;z-index:40;display:none;flex-direction:column;gap:6px;
  padding:max(10px,var(--sat,0px)) max(12px,var(--sar,0px)) 6px max(12px,var(--sal,0px));pointer-events:none;}
#hud.on{display:flex;}
#hud button{pointer-events:auto;}
.hud-row{display:flex;justify-content:space-between;align-items:center;gap:8px;}
#hud-left{display:flex;align-items:center;gap:8px;min-width:0;}
.backb{background:rgba(0,0,0,.35);border:1px solid rgba(255,255,255,.3);border-radius:14px;padding:6px 12px;font-size:13px;font-weight:800;color:#fff;cursor:pointer;font-family:inherit;flex:none;}
#stage-name{font-size:14px;font-weight:900;color:#fff;text-shadow:0 2px 5px rgba(0,0,0,.45);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
#hud-right{display:flex;gap:6px;align-items:center;flex:none;}
.chip{background:rgba(0,0,0,.32);border-radius:12px;padding:5px 10px;font-size:14px;font-weight:900;color:#fff;display:flex;align-items:center;gap:4px;white-space:nowrap;}
#ui-bgm-btn{background:rgba(0,0,0,.3);border:none;border-radius:50%;width:34px;height:34px;font-size:16px;cursor:pointer;display:flex;align-items:center;justify-content:center;}
#goal-bg{height:12px;background:rgba(255,255,255,.32);border-radius:7px;overflow:hidden;box-shadow:0 1px 4px rgba(0,0,60,.2);}
#goal-fill{height:100%;width:0%;border-radius:7px;transition:width .25s ease;
  background:linear-gradient(90deg,#FF9CE0,#FFD86B,#8CF0C0,#8FD0FF);background-size:220% 100%;animation:flow 3s linear infinite;}
@keyframes flow{0%{background-position:0 0}100%{background-position:220% 0}}
#goal-label{font-size:11px;font-weight:800;color:#fff;text-shadow:0 1px 4px rgba(0,0,60,.45);margin-top:3px;text-align:center;}

#combo{position:fixed;left:50%;top:30%;transform:translate(-50%,-50%) scale(.4);z-index:38;opacity:0;pointer-events:none;
  font-family:'DotGothic16',sans-serif;font-size:42px;color:#fff;text-shadow:0 0 14px rgba(255,180,255,.9),0 3px 0 rgba(120,60,160,.55);}
#combo.on{animation:cpop .6s ease-out;}
@keyframes cpop{0%{opacity:0;transform:translate(-50%,-50%) scale(.4)}30%{opacity:1;transform:translate(-50%,-50%) scale(1.15)}100%{opacity:0;transform:translate(-50%,-50%) scale(1.32)}}

#flash{position:fixed;inset:0;z-index:35;pointer-events:none;opacity:0;background:radial-gradient(circle at 50% 45%,rgba(255,255,255,.9),rgba(255,255,255,0) 62%);}
#flash.on{animation:fl .45s ease-out;}
@keyframes fl{0%{opacity:.85}100%{opacity:0}}

.ov{position:fixed;inset:0;z-index:60;display:none;flex-direction:column;align-items:center;justify-content:center;
  padding:max(18px,var(--sat,0px)) max(16px,var(--sar,0px)) max(18px,var(--sab,0px)) max(16px,var(--sal,0px));
  overflow-y:auto;-webkit-overflow-scrolling:touch;}
.ov.on{display:flex;}
.ov-in{width:100%;max-width:520px;margin:auto;}
.card{background:rgba(255,255,255,.9);border-radius:24px;padding:20px 18px;box-shadow:0 10px 30px rgba(60,40,110,.25);}
.ttl{font-family:'DotGothic16',sans-serif;font-size:33px;line-height:1.25;text-align:center;color:#fff;
  text-shadow:0 0 16px rgba(160,220,255,.95),0 4px 0 rgba(90,140,200,.6),0 8px 18px rgba(0,40,90,.35);margin-bottom:6px;}
.sub{text-align:center;font-size:13px;font-weight:800;color:#fff;text-shadow:0 2px 6px rgba(0,40,90,.5);margin-bottom:16px;}
.btn{display:block;width:100%;border:none;border-radius:20px;padding:15px;font-family:inherit;font-size:19px;font-weight:900;color:#fff;cursor:pointer;
  background:linear-gradient(180deg,#7ED8FF,#3FA9E8);box-shadow:0 5px 0 #2A80B8,0 8px 18px rgba(0,60,110,.3);margin-top:10px;transition:transform .08s;}
.btn:active{transform:translateY(3px);box-shadow:0 2px 0 #2A80B8;}
.btn.pink{background:linear-gradient(180deg,#FFA6D8,#EE6FB4);box-shadow:0 5px 0 #C44B8E,0 8px 18px rgba(120,0,70,.25);}
.btn.gray{background:linear-gradient(180deg,#CFD8E3,#9EAEC0);box-shadow:0 5px 0 #7A8899;}
</style>

<body>
<style>
/* ===== キャラえらび ===== */
#char-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin:6px 0 4px;}
.char-cell{background:rgba(255,255,255,.86);border:4px solid transparent;border-radius:20px;padding:8px 6px 10px;cursor:pointer;text-align:center;transition:transform .12s,border-color .12s;}
.char-cell.sel{border-color:#FFC94D;transform:translateY(-3px);box-shadow:0 8px 18px rgba(255,180,60,.35);}
.char-cell canvas{width:100%;height:104px;display:block;border-radius:14px;background:linear-gradient(180deg,#E9F7FF,#FFF6FB);}
.char-name{font-size:15px;font-weight:900;color:#4A5A78;margin-top:5px;}
.char-skill{font-size:11px;font-weight:800;color:#7A8AA8;line-height:1.35;margin-top:2px;}

/* ===== マップ ===== */
#map-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:4px;}
.st-cell{position:relative;background:rgba(255,255,255,.88);border-radius:18px;padding:8px 4px 7px;text-align:center;cursor:pointer;border:3px solid transparent;transition:transform .12s;}
.st-cell:active{transform:scale(.95);}
.st-cell.locked{filter:grayscale(1) opacity(.55);cursor:not-allowed;}
.st-cell.boss{border-color:#FFB84D;}
.st-num{font-family:'DotGothic16',sans-serif;font-size:21px;color:#5A6B8C;line-height:1;}
.st-nm{font-size:9.5px;font-weight:800;color:#7A8AA8;margin-top:3px;line-height:1.2;height:2.4em;overflow:hidden;}
.st-star{font-size:11px;letter-spacing:-1px;margin-top:2px;color:#FFC02E;height:14px;}
.st-lock{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:24px;}

/* ===== リザルト ===== */
#res-stars{text-align:center;font-size:44px;letter-spacing:2px;margin:4px 0 10px;color:#FFC02E;text-shadow:0 3px 10px rgba(255,170,0,.4);}
#res-stars span{display:inline-block;opacity:.22;transform:scale(.7);}
#res-stars span.on{opacity:1;transform:scale(1);animation:stPop .5s ease-out backwards;}
#res-stars span.on:nth-child(1){animation-delay:.1s}
#res-stars span.on:nth-child(2){animation-delay:.35s}
#res-stars span.on:nth-child(3){animation-delay:.6s}
@keyframes stPop{0%{transform:scale(2.2) rotate(-30deg);opacity:0}100%{transform:scale(1) rotate(0);opacity:1}}
.res-row{display:flex;justify-content:space-between;font-size:15px;font-weight:800;color:#5A6B8C;padding:6px 4px;border-bottom:1px dashed rgba(120,140,180,.3);}
.res-row b{font-family:'DotGothic16',sans-serif;font-size:19px;color:#3E5170;}
#res-new{text-align:center;font-family:'DotGothic16',sans-serif;font-size:17px;color:#FF6BAE;margin-top:8px;display:none;}
#res-new.on{display:block;animation:cpop2 .8s ease-out;}
@keyframes cpop2{0%{transform:scale(.3);opacity:0}55%{transform:scale(1.2)}100%{transform:scale(1);opacity:1}}

/* ===== ずかん ===== */
#zukan{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-top:6px;}
.zk{background:rgba(255,255,255,.86);border-radius:16px;padding:8px 4px;text-align:center;}
.zk canvas{width:100%;height:64px;display:block;}
.zk .zn{font-size:10.5px;font-weight:900;color:#5A6B8C;margin-top:3px;}
.zk.no{filter:grayscale(1) opacity(.4);}

/* ===== どうぶつ救出トースト ===== */
#toast{position:fixed;left:50%;bottom:calc(18px + var(--sab,0px));transform:translateX(-50%) translateY(20px);z-index:45;
  background:rgba(255,255,255,.94);border-radius:18px;padding:8px 16px;font-size:14px;font-weight:900;color:#4A5A78;
  box-shadow:0 6px 18px rgba(0,40,90,.25);opacity:0;transition:opacity .3s,transform .3s;pointer-events:none;}
#toast.on{opacity:1;transform:translateX(-50%) translateY(0);}

/* ===== チュートリアル ===== */
#tuto{position:fixed;inset:0;z-index:55;display:none;align-items:center;justify-content:center;background:rgba(20,30,60,.5);}
#tuto.on{display:flex;}
#tuto .tcard{background:rgba(255,255,255,.95);border-radius:22px;padding:20px 18px;max-width:340px;margin:16px;text-align:center;}
#tuto h3{font-family:'DotGothic16',sans-serif;font-size:22px;color:#3E5170;margin-bottom:10px;}
#tuto p{font-size:14px;font-weight:800;color:#5A6B8C;line-height:1.7;}
.tline{display:flex;align-items:center;gap:10px;justify-content:flex-start;margin:8px 0;text-align:left;}
.tline canvas{width:46px;height:46px;flex:none;}
.tline span{font-size:13px;font-weight:800;color:#5A6B8C;line-height:1.4;}

#fallback{position:fixed;inset:0;z-index:99;display:none;align-items:center;justify-content:center;background:linear-gradient(180deg,#8ED8F5,#E7F8FF);padding:24px;text-align:center;}
#fallback.on{display:flex;}
#fallback p{font-size:16px;font-weight:800;color:#3E5170;line-height:1.8;}
</style>

  <!-- あそびかた -->

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
'use strict';
/* ================= SAFE_LS ================= */
const SAFE_LS=(function(){
  try{const t='__t';localStorage.setItem(t,'1');localStorage.removeItem(t);return localStorage;}
  catch(e){const m={};return{getItem:k=>(k in m)?m[k]:null,setItem:(k,v)=>{m[k]=String(v);},removeItem:k=>{delete m[k];}};}
})();
const SAVE_KEY='shabondama_v4_progress';
const HS_KEY='shabondama_hs';

/* ================= データ ================= */
const CHARS=[
  {id:'neko',   name:'ねこ',   kind:'cat',    body:0xFFDCB8, belly:0xFFF3E4, accent:0xFF9EC4, skill:'コンボが きれにくい'},
  {id:'usagi',  name:'うさぎ', kind:'rabbit', body:0xFFF2F7, belly:0xFFFFFF, accent:0xFFB3D1, skill:'ハートが 1こ おおい'},
  {id:'kuma',   name:'くま',   kind:'bear',   body:0xC79A6B, belly:0xE8CBA6, accent:0xFFD98A, skill:'おおきなあわが よわくなる'},
  {id:'kitsune',name:'きつね', kind:'fox',    body:0xF6A45C, belly:0xFFF0DC, accent:0xFFD36B, skill:'スコアが 1.2ばい'}
];
const VALID_CHARS=CHARS.map(c=>c.id);

/* ずかん用どうぶつ（あわの なかに いる） */
const ANIMALS=[
  {id:'neko',   name:'ねこ',     kind:'cat',    body:0xFFDCB8, belly:0xFFF3E4},
  {id:'usagi',  name:'うさぎ',   kind:'rabbit', body:0xFFF2F7, belly:0xFFFFFF},
  {id:'kuma',   name:'くま',     kind:'bear',   body:0xC79A6B, belly:0xE8CBA6},
  {id:'kitsune',name:'きつね',   kind:'fox',    body:0xF6A45C, belly:0xFFF0DC},
  {id:'panda',  name:'ぱんだ',   kind:'bear',   body:0xF7F7F7, belly:0xFFFFFF, dark:true},
  {id:'penguin',name:'ぺんぎん', kind:'bird',   body:0x5A6B8C, belly:0xFFFFFF},
  {id:'hiyoko', name:'ひよこ',   kind:'bird',   body:0xFFE066, belly:0xFFF3B8},
  {id:'kaeru',  name:'かえる',   kind:'frog',   body:0x8FD98A, belly:0xE4F7DC},
  {id:'iruka',  name:'いるか',   kind:'dolphin',body:0x7FC8F0, belly:0xE6F7FF}
];

const STAGES=[
  {name:'はじまりのうみ',   sky:'sea',    bgm:'ocean',   scene:'sea',    goal:15, mix:{n:1.0},                              rate:0.92, speed:1.00, star:[90,150,210]},
  {name:'にじのもり',       sky:'forest', bgm:'forest',  scene:'forest', goal:18, mix:{n:1.0,r:0.12},                       rate:0.88, speed:1.06, star:[140,240,340]},
  {name:'おはなのおか',     sky:'meadow', bgm:'happy',   scene:'meadow', goal:20, mix:{n:1.0,r:0.12,s:0.18},                rate:0.84, speed:1.10, star:[160,270,380]},
  {name:'あまいくものうえ', sky:'cloud',  bgm:'sweets',  scene:'cloud',  goal:22, mix:{n:1.0,r:0.12,s:0.18,a:0.12},         rate:0.80, speed:1.14, star:[280,470,660]},
  {name:'きらきらみずうみ', sky:'lake',   bgm:'magical', scene:'lake',   goal:24, mix:{n:1.0,r:0.12,s:0.20,a:0.12,b:0.14},  rate:0.76, speed:1.18, star:[420,700,1000]},
  {name:'ゆうやけのそら',   sky:'sunset', bgm:'sky',     scene:'sunset', goal:26, mix:{n:1.0,r:0.14,s:0.22,a:0.12,b:0.14},  rate:0.68, speed:1.28, star:[560,950,1350]},
  {name:'ほしぞらのしま',   sky:'night',  bgm:'magical', scene:'night',  goal:28, mix:{n:1.0,r:0.14,s:0.26,a:0.12,b:0.16},  rate:0.62, speed:1.36, star:[420,720,1020]},
  {name:'しゃぼんおうこく', sky:'magic',  bgm:'action',  scene:'magic',  goal:1, boss:true, bossHP:12,
                                                                              mix:{n:1.0,s:0.26,r:0.10},                   rate:0.70, speed:1.24, star:[320,560,800]}
];
const STAGE_COUNT=STAGES.length;

/* ================= セーブ ================= */
function clampInt(v,lo,hi,d){v=Math.floor(Number(v));if(!isFinite(v))return d;return v<lo?lo:(v>hi?hi:v);}
function normalizeSave(p){
  const out={
    schemaVersion:4,
    char:(p&&VALID_CHARS.indexOf(p.char)>=0)?p.char:'neko',
    stages:{},
    zukan:{},
    tuto:!!(p&&p.tuto)
  };
  const src=(p&&typeof p.stages==='object'&&p.stages)?p.stages:{};
  for(let i=0;i<STAGE_COUNT;i++){
    const e=src[i]||{};
    out.stages[i]={cleared:!!e.cleared,star:clampInt(e.star,0,3,0),best:clampInt(e.best,0,9999999,0)};
  }
  out.stages[0].unlocked=true;
  const zs=(p&&typeof p.zukan==='object'&&p.zukan)?p.zukan:{};
  ANIMALS.forEach(a=>{out.zukan[a.id]=!!zs[a.id];});
  return out;
}
function loadProg(){
  let raw=null;
  try{raw=SAFE_LS.getItem(SAVE_KEY);}catch(e){}
  let v=null;
  if(raw){try{v=JSON.parse(raw);}catch(e){v=null;}}
  return normalizeSave(v&&typeof v==='object'?v:null);
}
function saveProg(){try{SAFE_LS.setItem(SAVE_KEY,JSON.stringify(PROG));}catch(e){}}
function getHS(){const v=Number(SAFE_LS.getItem(HS_KEY));return isFinite(v)&&v>0?Math.floor(v):0;}
function setHS(v){try{SAFE_LS.setItem(HS_KEY,String(Math.floor(v)));}catch(e){}}
let PROG=loadProg();
function isUnlocked(i){ if(i===0)return true; return !!PROG.stages[i-1].cleared; }

/* ================= BGM ================= */
let _bgm=null,_bgmTheme='';
const MP3_THEME_MAP={happy:'happy-island',cute:'cute-animals',magical:'magical',sky:'adventure',forest:'nature',ocean:'ocean-food',sweets:'cute-animals',action:'action',fruity:'nature',building:'puzzle',quiz:'learning',adventure:'adventure',puzzle:'puzzle',racing:'racing'};
function initBGM(theme){
  if(typeof WakuwakuMP3BGM==='undefined')return;
  theme=MP3_THEME_MAP[theme]||theme;
  try{
    if(_bgm&&_bgmTheme===theme){ if(_bgm.enabled)_bgm.start(); syncBgm(); return; }
    if(_bgm)_bgm.setTheme(theme); else _bgm=new WakuwakuMP3BGM(theme);

/* ================= SFX ================= */
const SFX=(function(){
  let ctx=null,master=null,ok=true;
  function init(){
    if(ctx||!ok)return;
    try{
      ctx=new (window.AudioContext||window.webkitAudioContext)();
      master=ctx.createGain();master.gain.value=0.22;master.connect(ctx.destination);
    }catch(e){ok=false;}
  }
  function resume(){init();if(ctx&&ctx.state==='suspended'){try{ctx.resume();}catch(e){}}}
  function tone(f0,f1,dur,vol,type){
    init();if(!ctx)return;
    const t=ctx.currentTime,o=ctx.createOscillator(),g=ctx.createGain();
    o.type=type||'sine';o.frequency.setValueAtTime(f0,t);
    if(f1&&f1!==f0)o.frequency.exponentialRampToValueAtTime(Math.max(20,f1),t+dur);
    g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(vol,t+0.012);
    g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
    o.connect(g);g.connect(master);o.start(t);o.stop(t+dur+0.03);
  }
  function noise(dur,vol,f){
    init();if(!ctx)return;
    const n=Math.floor(ctx.sampleRate*dur),buf=ctx.createBuffer(1,n,ctx.sampleRate),d=buf.getChannelData(0);
    for(let i=0;i<n;i++){d[i]=(Math.random()*2-1)*Math.pow(1-i/n,2.2);}
    const s=ctx.createBufferSource();s.buffer=buf;
    const bp=ctx.createBiquadFilter();bp.type='bandpass';bp.frequency.value=f||1600;bp.Q.value=1.1;
    const g=ctx.createGain();g.gain.value=vol;
    s.connect(bp);bp.connect(g);g.connect(master);s.start();
  }
  return {
    resume:resume,
    pop:function(pitch){ tone(520+pitch*70,180,0.13,0.30,'sine'); noise(0.10,0.14,2200+pitch*160); },
    rainbow:function(){ [660,880,1174,1568].forEach((f,i)=>setTimeout(()=>tone(f,f*1.02,0.22,0.20,'triangle'),i*55)); noise(0.22,0.16,2600); },
    big:function(){ tone(300,120,0.26,0.30,'triangle'); noise(0.26,0.20,900); },
    hit:function(){ tone(240,190,0.09,0.18,'square'); },
    bad:function(){ tone(220,90,0.30,0.28,'sawtooth'); noise(0.16,0.12,420); },
    animal:function(){ [784,988,1319].forEach((f,i)=>setTimeout(()=>tone(f,f,0.20,0.20,'sine'),i*70)); },
    clear:function(){ [523,659,784,1047,1319].forEach((f,i)=>setTimeout(()=>tone(f,f,0.30,0.20,'triangle'),i*110)); },
    over:function(){ [392,330,262].forEach((f,i)=>setTimeout(()=>tone(f,f*0.98,0.34,0.20,'sine'),i*160)); },
    tap:function(){ tone(880,880,0.05,0.12,'sine'); }
  };
})();

const BUBBLE_VS=[
'varying vec3 vN; varying vec3 vV; varying vec3 vP;',
'uniform float uTime; uniform float uWob;',
'void main(){',
'  vec3 p = position;',
'  float w = sin(p.y*4.2 + uTime*2.3)*0.5 + sin(p.x*5.1 - uTime*1.8)*0.5;',
'  p += normal * w * uWob;',
'  vec4 mv = modelViewMatrix * vec4(p,1.0);',
'  vN = normalize(normalMatrix * normal);',
'  vV = normalize(-mv.xyz);',
'  vP = normalize(position);',
'  gl_Position = projectionMatrix * mv;',
'}'].join('\n');

const BUBBLE_FS=[
'varying vec3 vN; varying vec3 vV; varying vec3 vP;',
'uniform float uTime; uniform vec3 uTint; uniform float uAlpha;',
'uniform float uBands; uniform float uDark; uniform float uPhase; uniform float uGlow;',
'vec3 pal(float t){ return 0.5 + 0.5*cos(6.28318*(vec3(0.00,0.33,0.67)+t)); }',
'void main(){',
'  vec3 N = normalize(vN); vec3 V = normalize(vV);',
'  float f = 1.0 - abs(dot(N,V));',
'  float fr = pow(f, 2.1);',
'  float thick = f*uBands + vP.y*0.62 + vP.x*0.18 + uTime*0.20 + uPhase;',
'  vec3 iri = pal(thick);',
'  iri = mix(iri, uTint, 0.34);',
'  vec3 L = normalize(vec3(0.45,0.92,0.62));',
'  float spec = pow(max(dot(reflect(-V,N),L),0.0), 46.0);',
'  float spec2 = pow(max(dot(reflect(-V,N),normalize(vec3(-0.6,0.5,0.8))),0.0), 18.0);',
'  float rim = pow(f, 1.15);',
'  vec3 col = iri*(0.50 + rim*0.95) + vec3(1.0)*spec*1.1 + vec3(0.85,0.95,1.0)*spec2*0.28;',
'  col = mix(col, col*0.30 + vec3(0.10,0.06,0.14), uDark);',
'  col += uGlow;',
'  float a = uAlpha*(0.14 + fr*1.00) + spec*0.75 + spec2*0.10;',
'  gl_FragColor = vec4(col, clamp(a,0.0,1.0));',
'}'].join('\n');

function radialTex(inner,outer,size){

  const gr=g.createRadialGradient(c.width/2,c.height/2,0,c.width/2,c.height/2,c.width/2);
  gr.addColorStop(0,inner);gr.addColorStop(0.45,outer);gr.addColorStop(1,'rgba(255,255,255,0)');

}

    '  gl_PointSize = aSize * (320.0 / max(0.001,-mv.z));',

function emit(x,y,z,vx,vy,vz,r,g,b,size,life,grav){
  const i=pHead;pHead=(pHead+1)%P_MAX;
  pPos[i*3]=x;pPos[i*3+1]=y;pPos[i*3+2]=z;
  pVel[i*3]=vx;pVel[i*3+1]=vy;pVel[i*3+2]=vz;
  pCol[i*3]=r;pCol[i*3+1]=g;pCol[i*3+2]=b;
  pSize[i]=size;pAlpha[i]=1;pLife[i]=life;pMax[i]=life;pGrav[i]=(grav===undefined?1:grav);
}
function updateParticles(dt){
  for(let i=0;i<P_MAX;i++){
    if(pLife[i]<=0){ if(pAlpha[i]!==0)pAlpha[i]=0; continue; }
    pLife[i]-=dt;
    if(pLife[i]<=0){pAlpha[i]=0;pSize[i]=0;continue;}
    pVel[i*3+1]-=2.4*pGrav[i]*dt;
    pVel[i*3]*=0.985;pVel[i*3+2]*=0.985;
    pPos[i*3]+=pVel[i*3]*dt;pPos[i*3+1]+=pVel[i*3+1]*dt;pPos[i*3+2]+=pVel[i*3+2]*dt;
    pAlpha[i]=Math.max(0,pLife[i]/pMax[i]);
  }
  pGeo.attributes.position.needsUpdate=true;
  pGeo.attributes.aColor.needsUpdate=true;
  pGeo.attributes.aSize.needsUpdate=true;
  pGeo.attributes.aAlpha.needsUpdate=true;
}

function LM(c){return new THREE.MeshLambertMaterial({color:c});}

function mk(geo,mat,x,y,z,sx,sy,sz){
  const m=new THREE.Mesh(geo,mat);m.position.set(x,y,z);
  m.scale.set(sx,sy===undefined?sx:sy,sz===undefined?(sy===undefined?sx:sy):sz);

}
const SHARED_GEO=[SPH,CYL,CON,BOX];
function disposeTree(root){
  root.traverse(function(o){
    if(o.geometry&&SHARED_GEO.indexOf(o.geometry)<0&&o.geometry.dispose)o.geometry.dispose();
    if(o.material){
      const ms=Array.isArray(o.material)?o.material:[o.material];
      ms.forEach(function(m){if(m&&m.dispose&&m!==bubbleProto)m.dispose();});
    }
  });
}

function addStars(n){

    pos[i*3]=Math.cos(a)*r;pos[i*3+1]=4+Math.random()*26;pos[i*3+2]=-14-Math.abs(Math.sin(a))*24;
  }
  const g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.BufferAttribute(pos,3));
  const m=new THREE.PointsMaterial({color:0xFFFFFF,size:0.55,map:TEX_DOT,transparent:true,depthWrite:false,blending:THREE.AdditiveBlending,sizeAttenuation:true});

function updateScenery(t,dt){
  if(waterMesh&&waterBase){
    const a=waterMesh.geometry.attributes.position,ar=a.array;
    for(let i=0;i<ar.length;i+=3){
      const x=waterBase[i],y=waterBase[i+1];
      ar[i+2]=waterBase[i+2]+Math.sin(x*0.24+t*1.1)*0.26+Math.cos(y*0.20+t*0.8)*0.22;
    }
    a.needsUpdate=true;
  }
  for(let i=0;i<driftItems.length;i++){
    const d=driftItems[i];
    if(d.sp){d.o.position.x+=d.sp*dt;if(d.o.position.x>d.range)d.o.position.x=-d.range;}
    if(d.bob){d.o.position.y=d.y0+Math.sin(t*d.bob+i)*0.5;d.o.rotation.y+=dt*0.35;}
  }
  if(starPoints)starPoints.material.opacity=0.75+Math.sin(t*1.6)*0.2;
}

const bubbleGroup=new THREE.Group();scene.add(bubbleGroup);

const pool=[];
for(let i=0;i<POOL_MAX;i++){
  const mat=bubbleProto.clone();
  const mesh=new THREE.Mesh(bubbleGeo,mat);
  mesh.visible=false;
  const spr=new THREE.Sprite(new THREE.SpriteMaterial({map:TEX_GLOW,transparent:true,opacity:0.0,depthWrite:false,blending:THREE.AdditiveBlending}));
  spr.visible=false;mesh.add(spr);
  const spikes=new THREE.Group();spikes.visible=false;
  const sm=LM(0x6B4E94);
  for(let k=0;k<9;k++){
    const th=Math.acos(1-2*(k+0.5)/9), ph=Math.PI*(1+Math.sqrt(5))*k;
    const c=mk(CON,sm,0,0,0,0.20,0.44,0.20);
    const dir=new THREE.Vector3(Math.sin(th)*Math.cos(ph),Math.cos(th),Math.sin(th)*Math.sin(ph));
    c.position.copy(dir).multiplyScalar(0.92);
    c.lookAt(dir.clone().multiplyScalar(3));c.rotateX(Math.PI/2);
    spikes.add(c);
  }
  mesh.add(spikes);
  const inner=new THREE.Group();inner.visible=false;mesh.add(inner);
  bubbleGroup.add(mesh);
  pool.push({mesh:mesh,mat:mat,spr:spr,spikes:spikes,inner:inner,alive:false,type:'n',r:1,hp:1,
             vy:1,sway:0,swayP:0,x0:0,spin:0,pop:0,animal:null,boss:false});
}
function freeBubble(){for(let i=0;i<pool.length;i++)if(!pool[i].alive&&pool[i].pop<=0)return pool[i];return null;}
function clearInner(b){
  while(b.inner.children.length){
    const c=b.inner.children.pop();
    disposeTree(c);
    b.inner.remove(c);
  }
}
function spawnBubble(type,opt){
  const b=freeBubble();if(!b)return null;
  const T=BTYPE[type];opt=opt||{};
  const r=opt.r!==undefined?opt.r:(T.rmin+Math.random()*(T.rmax-T.rmin));
  b.alive=true;b.type=type;b.r=r;b.hp=opt.hp!==undefined?opt.hp:T.hp;b.pop=0;b.boss=!!opt.boss;
  b.x0=opt.x!==undefined?opt.x:(-4.7+Math.random()*9.4);
  const z=opt.z!==undefined?opt.z:(-2.0+Math.random()*3.4);
  const y=opt.y!==undefined?opt.y:-5.0-Math.random()*1.2;
  b.mesh.position.set(b.x0,y,z);
  b.mesh.scale.setScalar(r);
  b.mesh.visible=true;
  b.vy=(opt.vy!==undefined?opt.vy:(0.80+Math.random()*0.45))*(opt.spd||1);
  b.sway=opt.sway!==undefined?opt.sway:(0.35+Math.random()*0.75);
  b.swayP=Math.random()*Math.PI*2;
  b.spin=(Math.random()-0.5)*0.5;
  const u=b.mat.uniforms;
  u.uTint.value.setHex(T.tint);u.uDark.value=T.dark;u.uBands.value=T.bands;
  u.uGlow.value=T.glow;u.uAlpha.value=T.alpha;u.uPhase.value=Math.random();
  u.uWob.value=type==='s'?0.012:0.030;
  b.spikes.visible=(type==='s');
  b.spr.visible=(type!=='s');
  b.spr.material.opacity=type==='s'?0:0.55;
  b.spr.position.set(-0.34,0.40,0.58);b.spr.scale.setScalar(0.72);
  clearInner(b);b.animal=null;
  if(type==='a'){
    const a=ANIMALS[Math.floor(Math.random()*ANIMALS.length)];
    b.animal=a;
    const g=buildAnimal(a);g.scale.setScalar(0.62/Math.max(0.6,r));g.position.y=-0.22;
    b.inner.add(g);b.inner.visible=true;b.inner.scale.setScalar(1);
  }else if(opt.innerBuild){
    b.inner.add(opt.innerBuild());b.inner.visible=true;
  }else{b.inner.visible=false;}
  return b;
}
function killBubble(b){
  b.alive=false;b.mesh.visible=false;b.spikes.visible=false;b.spr.visible=false;
  b.inner.visible=false;clearInner(b);b.animal=null;b.boss=false;b.pop=0;
}

let _pv=null;
function pvRenderer(){
  if(_pv)return _pv;
  try{
    const r=new THREE.WebGLRenderer({antialias:true,alpha:true});
    r.setPixelRatio(Math.min(window.devicePixelRatio||1,2));
    r.setSize(240,240,false);
    const s=new THREE.Scene();
    s.add(new THREE.HemisphereLight(0xffffff,0xA8BCD8,1.2));
    const d=new THREE.DirectionalLight(0xffffff,0.7);d.position.set(2,4,3);s.add(d);
    const c=new THREE.PerspectiveCamera(34,1,0.1,20);c.position.set(0,0.5,3.3);c.lookAt(0,0.32,0);
    _pv={r:r,s:s,c:c,cur:null};
  }catch(e){_pv={r:null};}
  return _pv;
}
function drawAnimalTo(canvas,spec){
  const pv=pvRenderer();if(!pv.r)return;
  if(pv.cur){pv.s.remove(pv.cur);}
  const g=buildAnimal(spec);g.rotation.y=-0.35;pv.s.add(g);pv.cur=g;
  pv.r.render(pv.s,pv.c);
  const ctx=canvas.getContext('2d');
  const w=canvas.width,h=canvas.height;
  ctx.clearRect(0,0,w,h);
  ctx.drawImage(pv.r.domElement,0,0,w,h);
  pv.s.remove(g);pv.cur=null;
  disposeTree(g);
}
function fitCanvas(c,cssH){
  const dpr=Math.min(window.devicePixelRatio||1,2);

function drawBubbleIcon(canvas,type){
  const dpr=Math.min(window.devicePixelRatio||1,2);
  canvas.width=Math.round(46*dpr);canvas.height=Math.round(46*dpr);
  const g=canvas.getContext('2d'),S=canvas.width,cx=S/2,cy=S/2,R=S*0.42;
  g.clearRect(0,0,S,S);
  const cols={n:['#BFE8FF','#FFC9EC','#C9FFE0'],r:['#FF9EE0','#FFE066','#7FE8FF'],
              s:['#7A5AA0','#4A3A6E','#5A4A80'],a:['#FFE2B0','#FFC9A0','#FFF0D8'],b:['#C4FFE8','#9FE8FF','#D8C9FF']}[type];
  if(type==='s'){
    g.fillStyle='#5A4580';
    for(let i=0;i<9;i++){const a=i/9*Math.PI*2;
      g.beginPath();g.moveTo(cx+Math.cos(a)*R*1.42,cy+Math.sin(a)*R*1.42);
      g.lineTo(cx+Math.cos(a-0.22)*R*0.95,cy+Math.sin(a-0.22)*R*0.95);
      g.lineTo(cx+Math.cos(a+0.22)*R*0.95,cy+Math.sin(a+0.22)*R*0.95);g.closePath();g.fill();}
  }
  const gr=g.createRadialGradient(cx-R*0.3,cy-R*0.35,R*0.1,cx,cy,R);
  gr.addColorStop(0,cols[0]);gr.addColorStop(0.55,cols[1]);gr.addColorStop(1,cols[2]);
  g.globalAlpha=type==='s'?0.95:0.85;
  g.beginPath();g.arc(cx,cy,R,0,Math.PI*2);g.fill();g.fillStyle=gr;g.fill();
  g.globalAlpha=1;
  g.strokeStyle='rgba(255,255,255,0.9)';g.lineWidth=S*0.035;
  g.beginPath();g.arc(cx,cy,R,0,Math.PI*2);g.stroke();
  g.fillStyle='rgba(255,255,255,0.95)';
  g.beginPath();g.ellipse(cx-R*0.34,cy-R*0.38,R*0.20,R*0.13,-0.6,0,Math.PI*2);g.fill();
  if(type==='a'){g.fillStyle='rgba(90,70,50,0.55)';
    g.beginPath();g.arc(cx,cy+R*0.05,R*0.34,0,Math.PI*2);g.fill();
    g.beginPath();g.arc(cx-R*0.26,cy-R*0.24,R*0.14,0,Math.PI*2);g.fill();
    g.beginPath();g.arc(cx+R*0.26,cy-R*0.24,R*0.14,0,Math.PI*2);g.fill();}
}

/* ================= 画面：ずかん ================= */
function buildZukan(){
  const g=$('zukan');g.innerHTML='';
  let got=0;
  ANIMALS.forEach(a=>{
    const has=!!PROG.zukan[a.id];if(has)got++;
    const d=document.createElement('div');
    d.className='zk'+(has?'':' no');
    d.innerHTML='<canvas></canvas><div class="zn">'+(has?a.name:'？？？')+'</div>';
    g.appendChild(d);
  });
  $('zk-sub').textContent=got+' / '+ANIMALS.length;
  requestAnimationFrame(()=>{
    Array.prototype.forEach.call(g.children,(d,i)=>{
      const c=d.querySelector('canvas');fitCanvas(c,64);drawAnimalTo(c,ANIMALS[i]);
    });
  });
}

/* ================= チュートリアル ================= */
const TUTO_STEPS={
  0:{h:'あそびかた',lines:[['n','しゃぼんだまを ゆびで タップ！']],p:'なぞると まとめて わって コンボ！'},
  1:{h:'にじいろのあわ',lines:[['r','にじいろは まわりも いっしょに われる！']]},
  2:{h:'とげとげあわ',lines:[['s','とげとげは さわると ハートが へるよ']]},
  3:{h:'どうぶつのあわ',lines:[['a','どうぶつが はいってる！ たすけると ずかんに のるよ']]},
  4:{h:'おおきなあわ',lines:[['b','おおきいあわは なんかい タップしてね']]},
  7:{h:'しゃぼんおうさま',lines:[['b','おうさまを タップして あわを ちいさく しよう！']]}
};
let tutoDone={};
function maybeTuto(stageIdx,cb){
  const st=TUTO_STEPS[stageIdx];
  if(!st||tutoDone[stageIdx]){cb();return;}
  tutoDone[stageIdx]=true;
  $('tuto-h').textContent=st.h;
  const b=$('tuto-body');b.innerHTML='';
  st.lines.forEach(l=>{
    const d=document.createElement('div');d.className='tline';
    const c=document.createElement('canvas');const sp=document.createElement('span');
    sp.textContent=l[1];d.appendChild(c);d.appendChild(sp);b.appendChild(d);
    drawBubbleIcon(c,l[0]);
  });
  if(st.p){const p=document.createElement('p');p.textContent=st.p;p.style.marginTop='8px';b.appendChild(p);}
  $('tuto').classList.add('on');
  $('btn-tuto-ok').onclick=()=>{SFX.tap();$('tuto').classList.remove('on');cb();};
}

/* ================= ボス ================= */
function buildCrownKing(){
  const g=new THREE.Group();
  const k=buildAnimal({kind:'bear',body:0xFFE0B0,belly:0xFFF3E4,id:'king'});
  k.scale.setScalar(0.9);g.add(k);
  const cr=new THREE.Group();cr.position.set(0,0.86,0.02);
  cr.add(mk(CYL,LM(0xFFD24D),0,0,0,0.19,0.13,0.19));
  for(let i=0;i<5;i++){const a=i/5*Math.PI*2;
    cr.add(mk(CON,LM(0xFFD24D),Math.cos(a)*0.16,0.13,Math.sin(a)*0.16,0.055,0.16,0.055));}
  cr.add(mk(SPH,LM(0xFF7FB8),0,0.09,0.19,0.05));
  g.add(cr);
  return g;
}
function spawnBoss(){
  const hp=STAGES[G.stage].bossHP||12;
  G.bossMax=hp;G.bossHP=hp;
  const b=spawnBubble('b',{r:2.3,hp:9999,x:0,y:1.5,z:-1.4,vy:0,sway:0,boss:true,
    innerBuild:function(){const g=buildCrownKing();g.scale.setScalar(0.46);g.position.y=-0.28;return g;}});
  if(!b)return;
  b.mat.uniforms.uBands.value=6.4;b.mat.uniforms.uGlow.value=0.10;
  b.mat.uniforms.uTint.value.setHex(0xFFD8F0);
  b.spr.position.set(-0.30,0.36,0.60);b.spr.scale.setScalar(0.9);
  G.bossB=b;
}
function bossScale(){
  const k=Math.max(0,G.bossHP/G.bossMax);
  return 2.3*(0.52+0.48*k);
}

/* ================= あわの タイプえらび ================= */
function pickType(mix){
  let tot=0;for(const k in mix)tot+=mix[k];
  let x=Math.random()*tot;
  for(const k in mix){x-=mix[k];if(x<=0)return k;}
  return 'n';
}

/* ================= スタート ================= */
function applySkills(){
  const c=charById(PROG.char);
  G.maxLife=3;G.comboHold=1.5;G.mult=1;G.bigHP=3;
  if(c.id==='usagi')G.maxLife=4;
  if(c.id==='neko')G.comboHold=2.6;
  if(c.id==='kitsune')G.mult=1.2;
  if(c.id==='kuma')G.bigHP=2;
}
function resetBubbles(){for(let i=0;i<pool.length;i++){killBubble(pool[i]);}}
function startStage(i){
  WakuwakuAnalytics.startGame({game_id:'/shabondama',game_name:'しゃぼんだまポン',game_category:'casual'});
  WakuwakuAnalytics.stageStart(i+1);
  G.stage=i;
  const S=STAGES[i];
  maybeTuto(i,function(){
    applySkills();
    G.score=0;G.life=G.maxLife;G.popped=0;G.combo=0;G.comboT=0;G.maxCombo=0;
    G.playing=true;G.ending=false;G.spawnT=0.35;G.bossB=null;G.shake=0;
    G.goal=S.goal;
    resetBubbles();
    document.body.className='sky-'+S.sky;
    buildScenery(S.scene);
    setPlayerChar(PROG.char);
    $('stage-name').textContent=S.name;
    updateHUD();
    showOv(null);
    initBGM(S.bgm);
    SFX.resume();
    if(S.boss)spawnBoss();
  });
}
function updateHUD(){
  $('life-n').textContent=G.life;
  $('score-n').textContent=Math.floor(G.score);
  const S=STAGES[G.stage];
  if(S.boss){
    const k=G.bossHP/G.bossMax;
    $('goal-fill').style.width=Math.round((1-k)*100)+'%';
    $('goal-label').textContent='おうさま のこり '+G.bossHP;
  }else{
    const k=Math.min(1,G.popped/G.goal);
    $('goal-fill').style.width=Math.round(k*100)+'%';
    $('goal-label').textContent='あと '+Math.max(0,G.goal-G.popped)+' こ';
  }
}
function showCombo(n){
  const c=$('combo');c.textContent=n+' コンボ！';
  c.classList.remove('on');void c.offsetWidth;c.classList.add('on');
}

/* ================= あわを わる ================= */
function addScore(v){
  const m=1+Math.min(G.combo,15)*0.10;
  G.score+=Math.round(v*m*G.mult);
}
function bumpCombo(){
  G.combo++;G.comboT=G.comboHold;
  if(G.combo>G.maxCombo)G.maxCombo=G.combo;
  if(G.combo>=3&&G.combo%3===0)showCombo(G.combo);
  charHop=0.30;
}
function popNormal(b,chain){
  const p=b.mesh.position,T=BTYPE[b.type];
  burst(p.x,p.y,p.z,b.r,b.type==='r'||b.type==='b',null);
  spawnRing(p.x,p.y,p.z,b.r*0.9,b.r*3.0,b.type==='r'?0xFFD8FF:0xFFFFFF,0.42);
  bumpCombo();addScore(T.score);G.popped++;
  if(b.type==='r'){SFX.rainbow();flash();}
  else if(b.type==='b'){SFX.big();}
  else SFX.pop(Math.min(6,G.combo*0.5));
  if(b.type==='a'&&b.animal){
    const a=b.animal;
    SFX.animal();
    if(!PROG.zukan[a.id]){PROG.zukan[a.id]=true;saveProg();toast('🎉 '+a.name+' を ずかんに とうろく！');}
    else toast('💖 '+a.name+' を たすけた！');
    if(G.life<G.maxLife){G.life++;}
    for(let i=0;i<16;i++)emit(p.x,p.y,p.z,(Math.random()-0.5)*2.4,1.2+Math.random()*2.2,(Math.random()-0.5)*2.4,1,0.95,0.7,0.09,0.8,0.7);
  }
  const wasRainbow=(b.type==='r');
  b.alive=false;b.pop=0.15;b.spikes.visible=false;b.inner.visible=false;
  if(wasRainbow&&!chain){
    const cx=p.x,cy=p.y,cz=p.z;
    for(let i=0;i<pool.length;i++){
      const o=pool[i];
      if(!o.alive||o.boss||o.type==='s')continue;
      const dx=o.mesh.position.x-cx,dy=o.mesh.position.y-cy,dz=o.mesh.position.z-cz;
      if(dx*dx+dy*dy+dz*dz<12.5){ popNormal(o,true); }
    }
  }
}
function hitBubble(b){
  if(G.ending)return;
  if(b.boss){
    G.bossHP--;SFX.hit();G.shake=0.16;
    const p=b.mesh.position;
    burst(p.x,p.y,p.z,1.0,false,[1,0.85,1]);
    spawnRing(p.x,p.y,p.z,1.4,3.2,0xFFD8FF,0.36);
    bumpCombo();addScore(30);
    if(G.bossHP<=0){ defeatBoss(b); }
    updateHUD();return;
  }
  if(b.type==='s'){
    const p=b.mesh.position;
    G.life--;G.combo=0;G.shake=0.30;SFX.bad();
    burst(p.x,p.y,p.z,b.r,false,[0.55,0.35,0.7]);
    spawnRing(p.x,p.y,p.z,b.r,b.r*2.4,0x9A6BC4,0.36);
    b.alive=false;b.pop=0.12;b.spikes.visible=false;
    updateHUD();
    if(G.life<=0)gameOver();
    return;
  }
  if(b.type==='b'&&b.hp>1){
    b.hp--;SFX.hit();
    const p=b.mesh.position;
    spawnRing(p.x,p.y,p.z,b.r*0.8,b.r*1.8,0xFFFFFF,0.30);
    for(let i=0;i<8;i++)emit(p.x,p.y,p.z,(Math.random()-0.5)*2,0.6+Math.random(),(Math.random()-0.5)*2,0.8,1,0.95,0.07,0.4,0.9);
    b.mat.uniforms.uAlpha.value+=0.14;
    b.r*=0.90;b.mesh.scale.setScalar(b.r);
    bumpCombo();addScore(15);
    updateHUD();return;
  }
  popNormal(b,false);
  updateHUD();
  if(!STAGES[G.stage].boss&&G.popped>=G.goal)stageClear();
}
function defeatBoss(b){
  const p=b.mesh.position.clone();
  G.ending=true;flash();SFX.clear();
  for(let k=0;k<5;k++){
    setTimeout(()=>{
      burst(p.x+(Math.random()-0.5)*2.4,p.y+(Math.random()-0.5)*2.4,p.z,2.0,true,null);
      spawnRing(p.x,p.y,p.z,1.0,7.0,0xFFE8FF,0.7);
    },k*140);
  }
  b.alive=false;b.pop=0.4;b.inner.visible=false;G.bossB=null;
  setTimeout(()=>stageClear(),900);
}

/* ================= クリア / ゲームオーバー ================= */
function stageClear(){
  if(G.ending&&!STAGES[G.stage].boss)return;
  G.ending=true;G.playing=false;
  SFX.clear();flash();
  const S=STAGES[G.stage],st=PROG.stages[G.stage];
  let star=0;
  if(G.score>=S.star[2])star=3;else if(G.score>=S.star[1])star=2;else if(G.score>=S.star[0])star=1;
  if(star<1)star=1;
  st.cleared=true;
  if(star>st.star)st.star=star;
  if(G.score>st.best)st.best=Math.floor(G.score);
  saveProg();
  const hs=getHS();let isNew=false;
  if(G.score>hs){setHS(G.score);isNew=true;}
  setTimeout(()=>showResult(true,star,isNew),700);
}
function gameOver(){
  if(G.ending)return;
  G.ending=true;G.playing=false;SFX.over();
  const hs=getHS();let isNew=false;
  if(G.score>hs){setHS(G.score);isNew=true;}
  const st=PROG.stages[G.stage];
  if(G.score>st.best){st.best=Math.floor(G.score);saveProg();}
  setTimeout(()=>showResult(false,0,isNew),700);
}
function showResult(cleared,star,isNew){
  if(cleared)WakuwakuAnalytics.stageComplete({game_id:'/shabondama',game_name:'しゃぼんだまポン',game_category:'casual',stage_id:G.stage+1,stars:star,score:Math.floor(G.score),result:'complete'});
  $('res-ttl').textContent=cleared?'クリア！':'また あそぼう！';
  const sp=$('res-stars').children;
  for(let i=0;i<3;i++)sp[i].classList.toggle('on',i<star);
  $('r-pop').textContent=G.popped;
  $('r-combo').textContent=G.maxCombo;
  $('r-score').textContent=Math.floor(G.score);
  $('res-new').classList.toggle('on',!!isNew);
  const last=(G.stage>=STAGE_COUNT-1);
  if(cleared&&last)WakuwakuAnalytics.gameComplete({game_id:'/shabondama',game_name:'しゃぼんだまポン',game_category:'casual',stage_id:G.stage+1,stars:star,score:Math.floor(G.score),result:'complete'});
  $('btn-next').style.display=(cleared&&!last)?'block':'none';
  $('btn-retry').textContent=cleared?'↻ もういちど':'↻ リトライ';
  showOv('ov-res');
  initBGM('cute');
}

/* ================= 入力 ================= */
let dragging=false,lastHX=-999,lastHY=-999;
function screenOf(b){
  const v=b.mesh.position;
  const d=camera.position.distanceTo(v);
  const q=v.clone().project(camera);
  return {x:(q.x*0.5+0.5)*W, y:(-q.y*0.5+0.5)*H, d:d,
          rpx:(b.boss?bossScale():b.r)*(H*0.5)/(Math.tan(camera.fov*Math.PI/360)*Math.max(0.2,d))};
}
function tryHit(px,py){
  if(!G.playing||G.ending)return;
  /* ゆびに いちばん ちかい あわを えらぶ（かさなりは てまえゆうせん） */
  const cand=[];
  for(let i=0;i<pool.length;i++){
    const b=pool[i];if(!b.alive)continue;
    const s=screenOf(b);
    if(s.rpx<3)continue;
    const dx=px-s.x,dy=py-s.y,dist=Math.sqrt(dx*dx+dy*dy);
    const hitR=(b.type==='s')?s.rpx*0.86:Math.max(s.rpx*1.12,s.rpx+14);
    if(dist<=hitR)cand.push({b:b,k:dist/hitR,d:s.d});
  }
  if(!cand.length)return;
  cand.sort((a,c)=>a.k-c.k);
  let best=cand[0];
  for(let i=1;i<cand.length;i++){
    if(cand[i].k-cand[0].k>0.22)break;
    if(cand[i].d<best.d)best=cand[i];
  }
  hitBubble(best.b);
}
function pos(e){
  const r=cv.getBoundingClientRect();
  return {x:e.clientX-r.left,y:e.clientY-r.top};
}
cv.addEventListener('pointerdown',e=>{
  SFX.resume();
  if(!G.playing)return;
  dragging=true;const p=pos(e);lastHX=p.x;lastHY=p.y;tryHit(p.x,p.y);
  try{cv.setPointerCapture(e.pointerId);}catch(err){}
},{passive:true});
cv.addEventListener('pointermove',e=>{
  if(!dragging||!G.playing)return;
  const p=pos(e);
  const dx=p.x-lastHX,dy=p.y-lastHY;
  if(dx*dx+dy*dy<64)return;
  lastHX=p.x;lastHY=p.y;tryHit(p.x,p.y);
},{passive:true});
function endDrag(){dragging=false;}
cv.addEventListener('pointerup',endDrag,{passive:true});
cv.addEventListener('pointercancel',endDrag,{passive:true});
cv.addEventListener('contextmenu',e=>e.preventDefault());

/* ================= メインループ ================= */
const camBase=new THREE.Vector3(0,1.0,10.2);
let last=performance.now();
function aliveCount(){let n=0;for(let i=0;i<pool.length;i++)if(pool[i].alive&&!pool[i].boss)n++;return n;}
function doSpawn(S,dt){
  G.spawnT-=dt;
  if(G.spawnT>0)return;
  G.spawnT=S.rate*(0.72+Math.random()*0.56);
  if(aliveCount()>=13)return;
  const t=pickType(S.mix);
  const o={spd:S.speed};
  if(t==='b')o.hp=G.bigHP;
  spawnBubble(t,o);
}
function updateBubbles(dt){
  for(let i=0;i<pool.length;i++){
    const b=pool[i];
    if(b.pop>0&&!b.alive){
      b.pop-=dt;
      const k=Math.max(0,b.pop/0.15);
      b.mesh.scale.setScalar(b.r*(1+(1-k)*0.65));
      b.mat.uniforms.uAlpha.value=BTYPE[b.type].alpha*k;
      if(b.pop<=0){b.mat.uniforms.uAlpha.value=BTYPE[b.type].alpha;killBubble(b);}
      continue;
    }
    if(!b.alive)continue;
    b.mat.uniforms.uTime.value+=dt;
    b.mesh.rotation.y+=b.spin*dt;
    if(b.boss){
      const s=bossScale();
      b.r=s;b.mesh.scale.setScalar(s);
      b.mesh.position.x=Math.sin(G.t*0.55)*1.7;
      b.mesh.position.y=1.5+Math.sin(G.t*0.9)*0.42;
      continue;
    }
    b.mesh.position.y+=b.vy*dt;
    b.mesh.position.x=b.x0+Math.sin(G.t*b.sway*1.6+b.swayP)*0.62;
    if(b.mesh.position.y>6.4)killBubble(b);
  }
}
function tick(now){
  requestAnimationFrame(tick);
  let dt=(now-last)/1000;last=now;
  if(dt>0.1)dt=0.1;
  G.t+=dt;
  bubbleProto.uniforms.uTime.value=G.t;

  if(G.playing&&!G.ending){
    const S=STAGES[G.stage];
    doSpawn(S,dt);
    if(G.comboT>0){G.comboT-=dt;if(G.comboT<=0)G.combo=0;}
  }
  updateBubbles(dt);
  updateParticles(dt);
  updateRings(dt);
  updateScenery(G.t,dt);

  if(charHop>0){charHop-=dt;}
  if(charHolder){
    const h=Math.max(0,charHop)/0.30;
    charHolder.children.forEach(c=>{
      c.position.y=Math.sin(G.t*2.2)*0.03+h*0.16;
      c.rotation.z=Math.sin(G.t*1.7)*0.04-h*0.10;
    });
  }
  if(G.shake>0)G.shake=Math.max(0,G.shake-dt*1.4);
  const sh=G.shake;
  camera.position.set(
    camBase.x+Math.sin(G.t*0.16)*0.30+(Math.random()-0.5)*sh*2.4,
    camBase.y+Math.sin(G.t*0.23)*0.13+(Math.random()-0.5)*sh*2.0,
    camBase.z);
  camera.lookAt(0,1.0,0);
  renderer.render(scene,camera);
}
requestAnimationFrame(tick);
