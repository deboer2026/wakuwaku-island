<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>ジュエリーマスター</title>
<link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@400;700;800&family=Cinzel:wght@700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:'M PLUS Rounded 1c',sans-serif;background:#080015;min-height:100vh;overflow:hidden;color:#fff;user-select:none;display:flex;flex-direction:column;align-items:center;}
.bg{position:fixed;inset:0;z-index:0;background:linear-gradient(180deg,#0d0025 0%,#1a0040 40%,#0d001a 100%);}
.bg-glow{position:fixed;inset:0;z-index:0;pointer-events:none;background:radial-gradient(ellipse at 15% 20%,rgba(150,0,255,0.12) 0%,transparent 55%),radial-gradient(ellipse at 85% 80%,rgba(255,100,0,0.1) 0%,transparent 55%);}
/* HUD */
#hud{position:fixed;top:0;left:0;right:0;z-index:200;display:flex;justify-content:space-between;align-items:center;padding:max(10px,env(safe-area-inset-top,10px)) 12px 8px;background:linear-gradient(180deg,rgba(10,0,32,0.97) 60%,rgba(10,0,32,0.82));border-bottom:2px solid rgba(255,215,0,0.35);box-shadow:0 2px 16px rgba(0,0,0,0.6);}
#hud-score{font-family:'Cinzel',serif;font-size:14px;color:#FFD700;text-shadow:0 0 10px rgba(255,215,0,0.5);}
#hud-combo{font-size:11px;color:#E040FB;font-weight:800;min-width:70px;text-align:center;}
#hud-lives{font-size:14px;min-width:52px;text-align:right;}
#back-btn{font-size:12px;color:#FFD700;background:rgba(255,215,0,0.08);border:1.5px solid rgba(255,215,0,0.5);border-radius:20px;padding:5px 14px;min-width:60px;cursor:pointer;font-family:inherit;font-weight:700;}
/* ゲーム画面 */
#game{position:relative;z-index:1;width:100%;max-width:480px;height:100vh;display:flex;flex-direction:column;padding-top:44px;overflow:hidden;}
/* ショップシーン */
#shop-scene{position:relative;width:100%;flex:0 0 42%;overflow:hidden;}
#shop-bg-svg{position:absolute;inset:0;width:100%;height:100%;}
/* ガラスカウンター */
#glass-counter{
  position:absolute;bottom:0;left:0;right:0;height:36%;
  z-index:5;pointer-events:none;
}
/* ドア */
#door{position:absolute;top:8%;right:10%;width:48px;height:74px;z-index:6;
  background:linear-gradient(135deg,#2d1060,#1a0840);
  border:2px solid rgba(255,215,0,0.35);border-radius:4px 4px 0 0;
  box-shadow:inset -2px 0 8px rgba(0,0,0,0.5);
  transition:transform 0.5s ease;transform-origin:left center;}
#door.open{transform:perspective(200px) rotateY(-50deg);}
.door-knob{position:absolute;right:6px;top:50%;transform:translateY(-50%);width:6px;height:6px;background:#FFD700;border-radius:50%;box-shadow:0 0 4px rgba(255,215,0,0.8);}
.door-panel{position:absolute;inset:4px;border:1px solid rgba(255,215,0,0.15);border-radius:2px;}
.door-window{position:absolute;top:6px;left:6px;right:6px;height:22px;background:rgba(180,220,255,0.08);border:1px solid rgba(255,215,0,0.1);border-radius:2px;}
@keyframes gemFloat{0%,100%{transform:translateY(0);}50%{transform:translateY(-4px);}}
/* キャラクター */
#customer{position:absolute;bottom:38%;left:-160px;transition:left 0.65s cubic-bezier(0.34,1.56,0.64,1);display:flex;flex-direction:column;align-items:center;z-index:10;}
#customer.arrive{left:10%;}
#customer.leave{left:-180px;transition:left 0.5s ease-in;}
#cust-svg-wrap{transition:all 0.3s;transform:scale(0.68);transform-origin:bottom center;}
/* キャラアニメーション */
@keyframes charIdle{0%,100%{transform:translateY(0);}50%{transform:translateY(-6px);}}
@keyframes charHappy{0%,100%{transform:scale(1) rotate(0);}25%{transform:scale(1.18) rotate(-6deg);}75%{transform:scale(1.15) rotate(6deg);}}
@keyframes charAngry{0%,100%{transform:translateX(0);}25%{transform:translateX(-8px);}75%{transform:translateX(8px);}}
@keyframes charWalk{from{transform:translateY(0) rotate(-4deg);}to{transform:translateY(-8px) rotate(4deg);}}
.anim-idle{animation:charIdle 2.8s ease-in-out infinite;}
.anim-happy{animation:charHappy 0.65s ease-in-out infinite;}
.anim-angry{animation:charAngry 0.45s ease-in-out infinite;}
.anim-walk{animation:charWalk 0.5s ease-in-out infinite alternate;}
/* 吹き出し */
#bubble-wrap{position:absolute;bottom:calc(38% + 50px);left:0;right:0;display:flex;justify-content:center;z-index:20;padding:0 10px;pointer-events:none;opacity:0;transition:opacity 0.3s;}
#bubble-wrap.show{opacity:1;}
#bubble{background:linear-gradient(135deg,rgba(255,255,255,0.97),rgba(240,230,255,0.97));color:#150030;border-radius:14px;padding:8px 14px;font-size:12px;font-weight:700;max-width:80%;text-align:center;line-height:1.6;box-shadow:0 4px 20px rgba(0,0,0,0.4);border:1px solid rgba(255,215,0,0.2);position:relative;}
#bubble::after{content:'▼';position:absolute;bottom:-13px;left:28%;color:rgba(255,255,255,0.97);font-size:13px;}
#bubble-text::after{content:'|';animation:blink 0.7s infinite;}
@keyframes blink{0%,100%{opacity:1;}50%{opacity:0;}}
#bubble-text.done::after{display:none;}
#handoff-area{position:absolute;bottom:calc(34% - 8px);left:50%;transform:translateX(-50%);z-index:30;pointer-events:none;opacity:0;transition:opacity 0.4s;}
#handoff-area.show{opacity:1;}
#handoff-gem{animation:handoffFloat 1s ease-in-out infinite;}
@keyframes handoffFloat{0%,100%{transform:translateY(0);}50%{transform:translateY(-6px);}}
/* 制作エフェクト */
#craft-effect{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:40;pointer-events:none;opacity:0;transition:opacity 0.3s;background:rgba(8,0,21,0.75);}
#craft-effect.show{opacity:1;}
#craft-emoji{font-size:60px;animation:craftSpin 0.3s ease-in-out infinite alternate;}
@keyframes craftSpin{from{transform:rotate(-18deg);}to{transform:rotate(18deg);}}
#craft-bar-wrap{width:60%;margin-top:12px;}
#craft-bar-bg{height:8px;background:rgba(255,255,255,0.1);border-radius:4px;overflow:hidden;}
#craft-bar{height:100%;width:0%;background:linear-gradient(90deg,#9C27B0,#FFD700);border-radius:4px;}
#bottom-panel{flex:1;background:linear-gradient(180deg,#0a0020,#06000f);border-top:2px solid rgba(255,215,0,0.15);display:flex;flex-direction:column;padding:6px 10px 8px;gap:6px;overflow:hidden;}
.panel-title{font-size:18px;font-weight:800;color:rgba(255,215,0,0.9);letter-spacing:2px;flex-shrink:0;}
#acc-row{display:flex;gap:4px;overflow-x:auto;flex-shrink:0;padding-bottom:1px;scrollbar-width:none;}
#acc-row::-webkit-scrollbar{display:none;}
.acc-btn{display:flex;flex-direction:column;align-items:center;gap:3px;background:rgba(255,255,255,0.05);border:1.5px solid rgba(255,255,255,0.1);border-radius:10px;padding:8px 8px;cursor:pointer;transition:all 0.15s;min-width:64px;flex-shrink:0;font-family:inherit;color:white;}
.acc-btn:hover{background:rgba(255,215,0,0.1);border-color:rgba(255,215,0,0.25);transform:translateY(-2px);}
.acc-btn.sel{background:rgba(255,215,0,0.18);border-color:#FFD700;box-shadow:0 0 12px rgba(255,215,0,0.25);transform:translateY(-2px);}
.acc-btn.hint{border-color:#66BB6A;background:rgba(76,175,80,0.1);}
.acc-em{font-size:24px;line-height:1;}
.acc-nm{font-size:11px;font-weight:700;white-space:nowrap;}
#gem-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:3px;flex:1;overflow-y:auto;scrollbar-width:none;}
#gem-grid::-webkit-scrollbar{display:none;}
.gem-btn{display:flex;flex-direction:column;align-items:center;gap:1px;border-radius:9px;padding:4px 2px 3px;cursor:pointer;transition:all 0.15s;border:1.5px solid transparent;font-family:inherit;color:white;}
.gem-btn:hover{transform:scale(1.05);filter:brightness(1.2);}
.gem-btn.sel{border-color:#FFD700;box-shadow:0 0 12px rgba(255,215,0,0.5);transform:scale(1.05);}
.gem-btn.hint{border-color:#66BB6A;box-shadow:0 0 9px rgba(76,175,80,0.4);}
.gem-nm{font-size:9px;font-weight:700;text-align:center;line-height:1.2;opacity:0.9;}
#complete-btn{flex-shrink:0;background:linear-gradient(135deg,#FF8F00,#FFD700,#FF8F00);background-size:200%;color:#0d0025;border:none;border-radius:11px;padding:8px;font-size:13px;font-weight:800;cursor:pointer;font-family:'Cinzel',serif;letter-spacing:2px;box-shadow:0 3px 14px rgba(255,215,0,0.35);animation:shimmer 2.5s infinite linear;transition:all 0.2s;}
@keyframes shimmer{0%{background-position:0%}100%{background-position:200%}}
#complete-btn:hover{transform:scale(1.02);}
#complete-btn:disabled{background:rgba(255,255,255,0.07);color:rgba(255,255,255,0.2);box-shadow:none;animation:none;cursor:not-allowed;transform:none;}
/* リアクション */
#reaction-ov{position:fixed;inset:0;z-index:100;display:flex;flex-direction:column;align-items:center;justify-content:center;pointer-events:none;opacity:0;transition:opacity 0.4s;}
#reaction-ov.show{opacity:1;pointer-events:all;background:rgba(8,0,21,0.78);backdrop-filter:blur(4px);}
#reaction-box{background:linear-gradient(160deg,#1c0840,#080015);border:1px solid rgba(255,215,0,0.35);border-radius:24px;padding:20px 24px;text-align:center;max-width:300px;width:88%;box-shadow:0 20px 60px rgba(0,0,0,0.6);position:relative;}
#rx-char{display:flex;justify-content:center;margin-bottom:8px;}
#rx-title{font-family:'Cinzel',serif;font-size:20px;font-weight:700;margin-bottom:4px;}
#rx-score{font-family:'Cinzel',serif;font-size:34px;font-weight:700;color:#FFD700;margin:4px 0;text-shadow:0 0 16px rgba(255,215,0,0.5);}
#rx-msg{font-size:12px;color:rgba(255,255,255,0.65);margin-bottom:4px;line-height:1.7;}
#rx-gem-info{background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.07);border-radius:10px;padding:8px 12px;margin:8px 0 14px;font-size:11px;color:rgba(255,255,255,0.7);line-height:1.6;text-align:left;}
#rx-next{background:linear-gradient(135deg,#6A1B9A,#9C27B0);color:white;border:none;border-radius:12px;padding:10px 26px;font-size:14px;font-weight:700;cursor:pointer;font-family:inherit;transition:all 0.2s;}
#rx-next:hover{transform:scale(1.04);}
/* GO */
#go-ov{position:fixed;inset:0;background:rgba(4,0,15,0.96);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:300;opacity:0;pointer-events:none;transition:opacity 0.4s;backdrop-filter:blur(8px);}
#go-ov.show{opacity:1;pointer-events:all;}
#go-box{text-align:center;padding:28px;max-width:300px;width:90%;}
#final-score{font-family:'Cinzel',serif;font-size:52px;font-weight:700;color:#FFD700;text-shadow:0 0 28px rgba(255,215,0,0.5);margin:8px 0;}
#hs-lbl{font-size:12px;color:#E040FB;font-weight:700;margin-bottom:4px;}
#replay-btn{background:linear-gradient(135deg,#FF8F00,#FFD700);color:#0d0025;border:none;border-radius:14px;padding:13px 34px;font-size:17px;font-weight:800;cursor:pointer;font-family:'Cinzel',serif;margin-top:14px;box-shadow:0 6px 22px rgba(255,215,0,0.38);transition:all 0.2s;}
#replay-btn:hover{transform:scale(1.04);}
/* スタート */
#start-scr{position:fixed;inset:0;background:linear-gradient(160deg,#060010,#130028,#060010);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:400;text-align:center;padding:24px;}
.start-chars{display:flex;gap:8px;align-items:flex-end;justify-content:center;margin-bottom:16px;}
#start-title{font-family:'Cinzel',serif;font-size:28px;font-weight:700;color:#FFD700;text-shadow:0 0 36px rgba(255,215,0,0.5);margin-bottom:5px;letter-spacing:3px;}
#start-sub{font-size:12px;color:rgba(255,255,255,0.42);margin-bottom:24px;}
#start-btn{background:linear-gradient(135deg,#FF6F00,#FFD700,#FF6F00);background-size:200%;color:#0d0025;border:none;border-radius:16px;padding:15px 42px;font-size:19px;font-weight:800;cursor:pointer;font-family:'Cinzel',serif;box-shadow:0 8px 32px rgba(255,215,0,0.42);animation:shimmer 2.5s infinite linear;transition:transform 0.2s;letter-spacing:2px;}
#start-btn:hover{transform:scale(1.05);}
#howto{margin-top:16px;background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.07);border-radius:14px;padding:12px 16px;font-size:12px;line-height:1.9;color:rgba(255,255,255,0.52);max-width:270px;text-align:left;}
#howto strong{color:#FFD700;}
.eff{position:fixed;font-size:22px;font-weight:800;pointer-events:none;z-index:500;font-family:'Cinzel',serif;animation:effPop 1s ease-out forwards;text-shadow:0 0 16px currentColor;}
@keyframes effPop{0%{transform:translate(-50%,-50%) scale(0.4);opacity:1;}55%{transform:translate(-50%,-90px) scale(1.12);opacity:1;}100%{transform:translate(-50%,-160px) scale(0.9);opacity:0;}}
.ptcl{position:fixed;pointer-events:none;z-index:0;animation:ptfall linear infinite;opacity:0;}
@keyframes ptfall{0%{transform:translateY(-10px) rotate(0deg);opacity:0.45;}100%{transform:translateY(105vh) rotate(720deg);opacity:0;}}


#common-bgm-btn{
  position:fixed;
  top:max(10px,env(safe-area-inset-top,10px));
  right:10px;z-index:1000;
  background:rgba(0,0,0,0.45);
  border:1.5px solid rgba(255,255,255,0.35);
  border-radius:50%;width:40px;height:40px;
  font-size:18px;cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  color:white;
}

/* === safe-area & common buttons === */
:root {
  --sat: env(safe-area-inset-top, 0px);
  --sab: env(safe-area-inset-bottom, 0px);
}
#ui-home-btn, #ui-bgm-btn {
  position: fixed;
  top: max(12px, env(safe-area-inset-top, 12px));
  z-index: 9999;
  width: 40px; height: 40px;
  background: rgba(0,0,0,0.5);
  border: 1.5px solid rgba(255,255,255,0.4);
  border-radius: 50%;
  font-size: 20px;
  cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  touch-action: manipulation;
  -webkit-tap-highlight-color: transparent;
}
#ui-home-btn { left: 12px; }
#ui-bgm-btn  { right: 12px; }

/* === 横向き対応 === */
@media (orientation: landscape) {
  body { overflow-y: auto; }
  #hud, #ui-home-btn, #ui-bgm-btn {
    top: max(6px, env(safe-area-inset-top, 6px));
  }
  #back-btn {
    bottom: max(8px, env(safe-area-inset-bottom, 8px));
  }
}
@media (orientation: landscape) and (max-height: 500px) {
  /* 横向き時にゲームエリアを縮小・スクロール対応 */
  canvas { max-height: 100vh; }
  #game-area { overflow-y: auto; }
  body { background: #000; }
  #game {
    width: auto;
    height: 100vh;
    aspect-ratio: 9/16;
    margin: 0 auto;
  }
}
</style>
</head>
<body>

<div class="bg"></div><div class="bg-glow"></div>
<div id="ptcl-wrap"></div>

<!-- スタート -->
<div id="start-scr">
  <div class="start-chars" id="start-chars"></div>
  <div id="start-title">ジュエリーマスター</div>
  <div id="start-sub">ほうせきやさんの てんいんに なろう！</div>
  <button id="start-btn" onclick="startGame()">✨ はじめる</button>
  <div id="howto">
    <strong>あそびかた</strong><br>
    1️⃣ おきゃくさんが やってくるよ！<br>
    2️⃣ リクエストを きいてあげよう<br>
    3️⃣ ほうせきと アクセサリーを えらぼう<br>
    4️⃣「かんせい！」を おそう<br>
    ⚡ はやいほど ボーナスてんが もらえるよ！
  </div>
</div>

<!-- HUD -->
<div id="hud">
  <button id="back-btn" onclick="goBack()">← もどる</button>
  <div id="hud-score">⭐ 0</div>
  <div id="hud-combo"></div>
  <div id="hud-lives">❤️❤️❤️</div>
</div>

<div id="game">
  <div id="shop-scene">

    <!-- ショップ背景SVG（壁・棚・宝石ディスプレイ） -->
    <svg id="shop-bg-svg" viewBox="0 0 480 280" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid slice">
      <defs>
        <!-- 壁グラデ -->
        <linearGradient id="wallGrad" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#12003a"/>
          <stop offset="55%" stop-color="#220868"/>
          <stop offset="100%" stop-color="#130040"/>
        </linearGradient>
        <!-- 床グラデ -->
        <linearGradient id="floorGrad" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#0e0030"/>
          <stop offset="100%" stop-color="#080018"/>
        </linearGradient>
        <!-- ガラス反射グラデ -->
        <linearGradient id="glassTop" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="rgba(255,255,255,0.18)"/>
          <stop offset="40%" stop-color="rgba(200,220,255,0.06)"/>
          <stop offset="100%" stop-color="rgba(180,200,255,0.02)"/>
        </linearGradient>
        <linearGradient id="glassSide" x1="0" y1="0" x2="1" y2="0">
          <stop offset="0%" stop-color="rgba(255,215,0,0.15)"/>
          <stop offset="50%" stop-color="rgba(255,255,255,0.08)"/>
          <stop offset="100%" stop-color="rgba(255,215,0,0.15)"/>
        </linearGradient>
        <!-- 棚グラデ -->
        <linearGradient id="shelfGrad" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#2a0a60"/>
          <stop offset="100%" stop-color="#160440"/>
        </linearGradient>
        <!-- ゴールド棚板 -->
        <linearGradient id="shelfBoard" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#FFD700"/>
          <stop offset="50%" stop-color="#FFA000"/>
          <stop offset="100%" stop-color="#FF6F00"/>
        </linearGradient>
        <!-- スポットライト -->
        <radialGradient id="spotlight1" cx="25%" cy="0%" r="60%">
          <stop offset="0%" stop-color="rgba(255,220,120,0.18)"/>
          <stop offset="100%" stop-color="rgba(255,200,80,0)"/>
        </radialGradient>
        <radialGradient id="spotlight2" cx="75%" cy="0%" r="60%">
          <stop offset="0%" stop-color="rgba(180,150,255,0.14)"/>
          <stop offset="100%" stop-color="rgba(150,100,255,0)"/>
        </radialGradient>
        <!-- ガラス内部グロー -->
        <radialGradient id="caseGlow" cx="50%" cy="50%" r="50%">
          <stop offset="0%" stop-color="rgba(200,220,255,0.12)"/>
          <stop offset="100%" stop-color="rgba(100,150,255,0)"/>
        </radialGradient>
        <!-- 宝石グラデ各種 -->
        <linearGradient id="gDia" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#90CAF9"/><stop offset="100%" stop-color="#1565C0"/></linearGradient>
        <linearGradient id="gRub" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#EF9A9A"/><stop offset="100%" stop-color="#B71C1C"/></linearGradient>
        <linearGradient id="gEme" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#A5D6A7"/><stop offset="100%" stop-color="#1B5E20"/></linearGradient>
        <linearGradient id="gAme" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#CE93D8"/><stop offset="100%" stop-color="#4A148C"/></linearGradient>
        <linearGradient id="gSap" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#82B1FF"/><stop offset="100%" stop-color="#0D47A1"/></linearGradient>
        <linearGradient id="gCit" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#FFE082"/><stop offset="100%" stop-color="#E65100"/></linearGradient>
        <linearGradient id="gRos" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#F48FB1"/><stop offset="100%" stop-color="#880E4F"/></linearGradient>
        <linearGradient id="gTop" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#FFCC80"/><stop offset="100%" stop-color="#BF360C"/></linearGradient>
        <!-- キラキラフィルタ -->
        <filter id="gemGlow"><feGaussianBlur in="SourceAlpha" stdDeviation="2" result="blur"/><feOffset dx="0" dy="1" result="offset"/><feMerge><feMergeNode in="offset"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
        <filter id="softGlow"><feGaussianBlur stdDeviation="3" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
      </defs>

      <!-- 壁 -->
      <rect width="480" height="280" fill="url(#wallGrad)"/>
      <!-- スポットライト -->
      <ellipse cx="120" cy="0" rx="160" ry="140" fill="url(#spotlight1)"/>
      <ellipse cx="360" cy="0" rx="160" ry="140" fill="url(#spotlight2)"/>

// ===== 状態 =====
const PHASE={ARRIVE:'arrive',TALK:'talk',SELECT:'select',CRAFT:'craft',HANDOFF:'handoff'};
let phase=PHASE.ARRIVE;
let score=0,lives=3,combo=0,currentQ=null,selGem=null,selAcc=null;
let timerIv=null,timerLeft=100,running=false;
const $=id=>document.getElementById(id);

// ===== 初期化 =====
function init(){
  buildGems(); buildAccs(); buildParticles(); buildStartChars();
}

function buildStartChars(){
  const row=$('start-chars');
  ['princess','prince','fairy'].forEach((k,i)=>{
    const d=document.createElement('div');
    const scale=i===1?1.1:0.75;
    d.style.cssText=`transform:scale(${scale});transform-origin:bottom center;animation:charIdle 2.8s ease-in-out ${i*0.4}s infinite;`;
    d.innerHTML=CHAR_SVGS[k].idle;
    row.appendChild(d);
  });
}

function buildGems(){
  const p=$('gem-grid');p.innerHTML='';
  GEMS.forEach(g=>{
    const btn=document.createElement('button');
    btn.className='gem-btn';btn.id='gem-'+g.id;
    btn.style.background=`linear-gradient(160deg,${g.c3}99,${g.c3}44)`;
    btn.innerHTML=`<div style="width:24px;height:24px;">${mkGem(g,24)}</div><div class="gem-nm">${g.name}</div>`;
    btn.onclick=()=>onSelGem(g.id);
    p.appendChild(btn);
  });
}

function buildAccs(){
  const p=$('acc-row');p.innerHTML='';
  ACCS.forEach(a=>{
    const btn=document.createElement('button');
    btn.className='acc-btn';btn.id='acc-'+a.id;
    btn.innerHTML=`<div class="acc-em">${a.emoji}</div><div class="acc-nm">${a.name}</div>`;
    btn.onclick=()=>onSelAcc(a.id);
    p.appendChild(btn);
  });
}

function buildParticles(){
  const c=$('ptcl-wrap');
  ['💎','✨','⭐','💫','🌟','💍'].forEach((em,i)=>{
    const p=document.createElement('div');p.className='ptcl';p.textContent=em;
    p.style.cssText=`left:${i*18+5}%;font-size:${9+Math.random()*7}px;animation-duration:${9+Math.random()*9}s;animation-delay:${-Math.random()*14}s;`;
    c.appendChild(p);
  });
}

// ===== ゲーム開始 =====
function startGame(){
  $('start-scr').style.display='none';
  score=0;lives=3;combo=0;running=true;roundNum=0;
  updateHUD();startRound();
}

function startRound(){
  const cust=CUSTOMERS[Math.floor(Math.random()*CUSTOMERS.length)];
  const gem=GEMS[Math.floor(Math.random()*GEMS.length)];
  const acc=ACCS[Math.floor(Math.random()*ACCS.length)];
  currentQ={cust,gem,acc};
  selGem=null;selAcc=null;
  document.querySelectorAll('.gem-btn,.acc-btn').forEach(b=>b.classList.remove('sel','hint'));
  $('complete-btn').disabled=true;
  hideAllOverlays();
  doArrive();
}

// ===== フェーズ =====
function setCharAnim(anim){
  const wrap=$('cust-svg-wrap');
  wrap.className='';
  void wrap.offsetWidth;
  wrap.classList.add('anim-'+anim);
}

function setCharSVG(state){
  const {key}=currentQ.cust;
  $('cust-svg-wrap').innerHTML=CHAR_SVGS[key][state]||CHAR_SVGS[key].idle;
}

function doArrive(){
  phase=PHASE.ARRIVE;
  hideBubble();
  setCharSVG('idle');
  setCharAnim('walk');
  const custEl=$('customer');
  custEl.className='';
  $('door').classList.add('open');
  setTimeout(()=>{
    custEl.classList.add('arrive');
    setTimeout(()=>{
      setCharAnim('idle');
      $('door').classList.remove('open');
      setTimeout(()=>doTalk(),400);
    },650);
  },300);
}

function doTalk(){
  phase=PHASE.TALK;
  const {cust,gem,acc}=currentQ;
  const greet=cust.greet[Math.floor(Math.random()*cust.greet.length)];
  typeText(greet,()=>{
    setTimeout(()=>{
      $('bubble-text').innerHTML=
        `<span style="font-size:10px;opacity:0.65;">リクエスト</span><br>
         <span style="display:inline-block;background:linear-gradient(135deg,${gem.c3},${gem.c2});color:white;border-radius:7px;padding:4px 12px;margin:2px 1px 0;font-size:14px;font-weight:900;">💎 ${gem.name}</span>を つけた<br>
         <span style="display:inline-block;background:linear-gradient(135deg,#E65100,#FF8F00);color:white;border-radius:7px;padding:4px 12px;margin:2px;font-size:14px;font-weight:900;">${acc.emoji} ${acc.name}</span>が ほしい！`;
      $('bubble-text').classList.add('done');
      setTimeout(()=>doSelect(),1000);
    },700);
  });
}

function doSelect(){
  phase=PHASE.SELECT;
  startTimer();
}

function startTimer(){
  clearInterval(timerIv);timerLeft=100;
  const s=Date.now();
  timerIv=setInterval(()=>{
    timerLeft=Math.max(0,100-((Date.now()-s)/20000*100));
    if(timerLeft<=0){clearInterval(timerIv);combo=0;loseLife(true);}
  },100);
}

function onSelGem(id){
  if(phase!==PHASE.SELECT&&phase!==PHASE.TALK)return;
  selGem=id;
  document.querySelectorAll('.gem-btn').forEach(b=>b.classList.remove('sel'));
  $('gem-'+id).classList.add('sel');
  $('complete-btn').disabled=!(selGem&&selAcc);
}
function onSelAcc(id){
  if(phase!==PHASE.SELECT&&phase!==PHASE.TALK)return;
  selAcc=id;
  document.querySelectorAll('.acc-btn').forEach(b=>b.classList.remove('sel'));
  $('acc-'+id).classList.add('sel');
  $('complete-btn').disabled=!(selGem&&selAcc);
}

function onComplete(){
  if(!running||phase!==PHASE.SELECT)return;
  clearInterval(timerIv);
  doCraft();
}

function doCraft(){
  phase=PHASE.CRAFT;
  hideBubble();
  $('craft-effect').classList.add('show');
  $('craft-bar').style.width='0%';
  let w=0;
  const iv=setInterval(()=>{
    w+=3.5;$('craft-bar').style.width=Math.min(w,100)+'%';
    if(w>=100){clearInterval(iv);$('craft-effect').classList.remove('show');setTimeout(()=>doHandoff(),200);}
  },40);
}

function doHandoff(){
  phase=PHASE.HANDOFF;
  const {gem,acc}=currentQ;
  $('handoff-gem').innerHTML=`<div style="display:flex;flex-direction:column;align-items:center;gap:4px;">
    <div style="font-size:34px;">${acc.emoji}</div>
    <div style="width:30px;height:30px;">${mkGem(gem,30)}</div>
  </div>`;
  $('handoff-area').classList.add('show');
  setTimeout(()=>{
    $('handoff-area').classList.remove('show');
    const gOK=selGem===currentQ.gem.id, aOK=selAcc===currentQ.acc.id;
    doReact(gOK&&aOK);
  },1300);
}

function doReact(ok){
  const {cust,gem,acc}=currentQ;
  if(ok){
    combo++;
    const tb=Math.floor(timerLeft/10)*10;
    const cb=combo>1?(combo-1)*50:0;
    const pts=100+tb+cb;
    score+=pts;
    setCharSVG('happy');setCharAnim('happy');
    showEff('⭐ +'+pts,true);
    const msg=cust.happy[Math.floor(Math.random()*cust.happy.length)];
    typeText(msg,()=>setTimeout(()=>showReaction(true,pts,tb,cb),700));
  } else {
    combo=0;
    if(selGem!==gem.id)$('gem-'+gem.id).classList.add('hint');
    if(selAcc!==acc.id)$('acc-'+acc.id).classList.add('hint');
    setCharSVG('angry');setCharAnim('angry');
    showEff('💔',false);
    const msg=cust.angry[Math.floor(Math.random()*cust.angry.length)];
    typeText(msg,()=>setTimeout(()=>{showReaction(false,0,0,0);loseLife(false);},600));
  }
  updateHUD();
}

function showReaction(ok,pts,tb,cb){
  const {cust,gem}=currentQ;
  $('rx-char').innerHTML=`<div style="animation:${ok?'charHappy':'charAngry'} 0.65s ease-in-out infinite;">${CHAR_SVGS[cust.key][ok?'happy':'angry']}</div>`;
  $('rx-title').textContent=ok?(combo>=3?'スーパーコンボ！✨':'せいかい！✨'):'ざんねん...';
  $('rx-title').style.color=ok?'#FFD700':'#FF5252';
  const rs=$('rx-score');rs.textContent=ok?'+'+pts:'';rs.style.display=ok?'block':'none';
  let msg='';
  if(ok){if(tb>0)msg+=`⚡ タイムボーナス +${tb}<br>`;if(cb>0)msg+=`🔥 ${combo}コンボ +${cb}<br>`;}
  else msg=`こたえ：${gem.name}の${acc_name()}`;
  $('rx-msg').innerHTML=msg;
  $('rx-gem-info').innerHTML=`<div style="display:flex;gap:8px;align-items:center;margin-bottom:4px;">
    <div style="width:26px;height:26px;">${mkGem(gem,26)}</div>
    <strong>${gem.name} ${'★'.repeat(gem.rare)}</strong></div>${gem.info}`;
  $('reaction-ov').classList.add('show');
}

function acc_name(){return currentQ?currentQ.acc.name:'';}

function nextRound(){
  if(lives<=0){gameOver();return;}
  roundNum++;
  if(roundNum>=10){allClear();return;}
  $('reaction-ov').classList.remove('show');
  hideBubble();
  const custEl=$('customer');
  setCharAnim('walk');
  custEl.classList.add('leave');
  setTimeout(()=>{custEl.className='';setTimeout(()=>startRound(),200);},500);
}

function loseLife(timeout){
  lives=Math.max(0,lives-1);updateHUD();
  if(lives<=0)setTimeout(gameOver,1600);
  else if(timeout)setTimeout(startRound,700);
}

function hideAllOverlays(){
  $('reaction-ov').classList.remove('show');
  $('craft-effect').classList.remove('show');
  $('handoff-area').classList.remove('show');
  hideBubble();
}

function showBubble(){$('bubble-wrap').classList.add('show');}
function hideBubble(){$('bubble-wrap').classList.remove('show');}

function typeText(text,cb){
  showBubble();
  $('bubble-text').innerHTML='';$('bubble-text').classList.remove('done');
  const lines=text.split('\n');let li=0,ci=0;
  function next(){
    if(li>=lines.length){if(cb)cb();return;}
    if(ci<lines[li].length){
      $('bubble-text').innerHTML=lines.slice(0,li).join('<br>')+(li>0?'<br>':'')+lines[li].slice(0,ci+1);
      ci++;setTimeout(next,38);
    } else {li++;ci=0;setTimeout(next,li<lines.length?100:200);}
  }
  next();
}

function showEff(text,ok){
  const el=document.createElement('div');el.className='eff';
  el.textContent=text;el.style.color=ok?'#FFD700':'#FF5252';
  el.style.cssText+=';left:50%;top:40%;';
  document.body.appendChild(el);setTimeout(()=>el.remove(),1100);
}

function updateHUD(){
  $('hud-score').textContent='⭐ '+score.toLocaleString();
  $('hud-combo').textContent=combo>=2?`🔥 ${combo}コンボ！`:'';
  $('hud-lives').textContent='❤️'.repeat(lives)+'🖤'.repeat(3-lives);
}

function gameOver(){
  running=false;clearInterval(timerIv);
  $('final-score').textContent=score.toLocaleString();
  const hs=parseInt(localStorage.getItem('jm_hs')||'0');
  const lbl=$('hs-lbl');
  if(score>hs){localStorage.setItem('jm_hs',score);lbl.textContent='🏆 ハイスコア こうしん！';lbl.style.color='#FFD700';}
  else{lbl.textContent='ハイスコア：'+hs.toLocaleString();lbl.style.color='rgba(255,255,255,0.35)';}
  $('go-ov').classList.add('show');
}

function allClear(){
  running=false;clearInterval(timerIv);
  $('reaction-ov').classList.remove('show');
  const hs=parseInt(localStorage.getItem('jm_hs')||'0');
  if(score>hs)localStorage.setItem('jm_hs',score);
  // all-clear-ovを表示
  const ov=document.getElementById('all-clear-ov');
  if(ov){
    document.getElementById('ac-score').textContent=score.toLocaleString();
    document.getElementById('ac-hs').textContent=score>hs?'🏆 ハイスコア こうしん！':'ハイスコア：'+hs.toLocaleString();
    ov.style.display='flex';
    ov.classList.add('show');
  } else {
    // フォールバック：gameOver画面使用
    $('final-score').textContent=score.toLocaleString();
    const lbl=$('hs-lbl');
    lbl.textContent=score>hs?'🏆 ハイスコア こうしん！':'ハイスコア：'+hs.toLocaleString();
    lbl.style.color=score>hs?'#FFD700':'rgba(255,255,255,0.35)';
    $('go-ov').classList.add('show');
  }
}

function restartGame(){
  $('go-ov').classList.remove('show');
  score=0;lives=3;combo=0;running=true;roundNum=0;
  $('customer').className='';updateHUD();startRound();
}

  else history.back();
}

var _bgmEnabled=(function(){var s=localStorage.getItem('wakuwaku_bgm');return s!==null?s==='on':true;})();
function toggleCommonBGM(){
  _bgmEnabled=!_bgmEnabled;
  localStorage.setItem('wakuwaku_bgm',_bgmEnabled?'on':'off');
  var btn=document.getElementById('ui-bgm-btn');
  if(btn)btn.textContent=_bgmEnabled?'🔊':'🔇';
  if(window.Tone)Tone.getDestination().mute=!_bgmEnabled;
  if(window._masterGain)_masterGain.gain.value=_bgmEnabled?1:0;
}

// === BGM (Web Audio API) ===
(function(){
  var _ctx=null, _gain=null, _playing=false, _stopped=false;
  var _notes=[[784,0.3],[880,0.3],[988,0.3],[1047,0.6],[988,0.3],[880,0.3],[784,0.6],[698,0.3],[784,0.3],[880,0.3],[988,0.6],[880,0.3],[784,0.3],[698,0.9]];
  var _ni=0;

  function _initBGM(){
    if(_ctx)return;
    try{
      _ctx=new(window.AudioContext||window.webkitAudioContext)();
      _gain=_ctx.createGain();
      _gain.gain.value=0.09;
      _gain.connect(_ctx.destination);
      window._masterGain=_gain;
    }catch(e){}
  }

  function _playNote(freq,dur,time){
    if(!_ctx||_stopped)return;
    var o=_ctx.createOscillator();
    var g=_ctx.createGain();
    o.type='sine';
    o.frequency.value=freq;
    g.gain.setValueAtTime(0.09,time);
    g.gain.exponentialRampToValueAtTime(0.001,time+dur*0.9);
    o.connect(g);g.connect(_gain);
    o.start(time);o.stop(time+dur);
  }

  function _loop(){
    if(_stopped||!_ctx||!_gain)return;
    var t=_ctx.currentTime+0.05;
    _notes.forEach(function(n,i){
      var offset=0;
      for(var j=0;j<i;j++)offset+=_notes[j][1];
      _playNote(n[0],n[1],t+offset);
    });
    var total=_notes.reduce(function(s,n){return s+n[1];},0);
    _loopTimer=setTimeout(_loop,(total-0.1)*1000);
  }
  var _loopTimer=null;

  function startBGM(){
    if(_playing)return;
    _initBGM();
    if(!_ctx)return;
    _stopped=false;_playing=true;
    if(_ctx.state==='suspended')_ctx.resume();
    _loop();
  }

  function stopBGM(){
    _stopped=true;_playing=false;
    if(_loopTimer){clearTimeout(_loopTimer);_loopTimer=null;}
    if(_gain)_gain.gain.value=0;
  }

  function resumeBGM(){
    if(_playing)return;
    _stopped=false;_playing=true;
    if(_gain)_gain.gain.value=0.09;
    if(_ctx&&_ctx.state==='suspended')_ctx.resume();
    _loop();
  }

  // ページ表示後にBGM開始（タップ後）
  function _tryStart(){
    startBGM();
    document.removeEventListener('touchstart',_tryStart);
    document.removeEventListener('click',_tryStart);
  }
  document.addEventListener('touchstart',_tryStart,{once:true});
  document.addEventListener('click',_tryStart,{once:true});

  // toggleCommonBGMを上書き
  window.toggleCommonBGM=function(){
    _bgmEnabled=!_bgmEnabled;
  localStorage.setItem('wakuwaku_bgm',_bgmEnabled?'on':'off');
    var btn=document.getElementById('ui-bgm-btn');
    if(btn)btn.textContent=_bgmEnabled?'🔊':'🔇';
    if(_bgmEnabled)resumeBGM();else stopBGM();
  };

  window._startBGM=startBGM;
  window._stopBGM=stopBGM;
})();
</script>
