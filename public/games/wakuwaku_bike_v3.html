<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>New わくわくバイク</title>
<style>
  :root{
    --sky1:#bdeaff; --sky2:#e9f8ff; --grass:#8fd66a; --grassDk:#6fc24c;
    --road:#9aa3ad; --roadLine:#fff; --accent:#ff7ab8; --accent2:#ffd34d;
    --ink:#3a2b3f; --panel:#fff;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;}
  html,body{margin:0;height:100%;overflow:hidden;font-family:"Hiragino Maru Gothic ProN","Yu Gothic",system-ui,sans-serif;background:#0b1230;}
  #wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;
    padding:var(--sat,env(safe-area-inset-top,0px)) var(--sar,env(safe-area-inset-right,0px)) var(--sab,env(safe-area-inset-bottom,0px)) var(--sal,env(safe-area-inset-left,0px));}
  canvas{display:block;background:linear-gradient(#bdeaff,#e9f8ff);touch-action:none;}

  /* overlays */
  .screen{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:12px;text-align:center;color:#fff;
    background:linear-gradient(160deg,#0d1a3a 0%,#1a2d5a 35%,#2a1040 70%,#1a0030 100%);
    padding:16px;overflow:hidden;}
  .screen::before{content:'';position:absolute;inset:0;pointer-events:none;
    background:radial-gradient(ellipse 90% 60% at 50% 10%,rgba(255,120,80,.15),transparent 70%),
               radial-gradient(ellipse 60% 40% at 80% 80%,rgba(80,160,255,.1),transparent 60%);}
  @keyframes speedLine{0%{transform:translateX(0)}100%{transform:translateX(200%)}}
  .spline{position:absolute;left:-100%;height:2px;background:linear-gradient(90deg,transparent,rgba(255,200,0,.4),transparent);
    animation:speedLine var(--d,1.2s) linear infinite;animation-delay:var(--dl,0s);pointer-events:none;}
  @keyframes bikeFloat{0%,100%{transform:translateY(0) rotate(-2deg)}50%{transform:translateY(-8px) rotate(2deg)}}
  .bike-hero{font-size:clamp(44px,13vw,66px);animation:bikeFloat 2s ease-in-out infinite;
    filter:drop-shadow(0 8px 20px rgba(255,120,0,.5));position:relative;z-index:1;}
  @keyframes flagWave{0%,100%{transform:rotate(-5deg)}50%{transform:rotate(5deg)}}
  .flag-deco{display:flex;gap:8px;align-items:center;position:relative;z-index:1;}
  .flag-deco span{font-size:20px;animation:flagWave var(--d,1s) ease-in-out infinite;animation-delay:var(--dl,0s);}
  .sub{color:rgba(255,255,255,.85);font-size:clamp(12px,3.2vw,16px);margin-top:-2px;position:relative;z-index:1;}
  h1{font-size:clamp(24px,6.6vw,42px);margin:0;color:#FFD700;
    text-shadow:2px 2px 0 #FF6D00,0 0 30px rgba(255,200,0,.6),4px 4px 0 #8B4500;position:relative;z-index:1;}
  .hidden{display:none!important;}
  .btn{border:none;border-radius:999px;padding:13px 26px;font-size:clamp(16px,4.4vw,20px);font-weight:800;
    color:#fff;background:linear-gradient(#ff8ec4,#ff5fa2);box-shadow:0 5px 0 #d23d83,0 8px 14px rgba(0,0,0,.2);
    cursor:pointer;transition:transform .05s;font-family:inherit;}
  .btn:active{transform:translateY(3px);box-shadow:0 2px 0 #d23d83;}
  .btn.alt{background:linear-gradient(#ffe27a,#ffc83d);box-shadow:0 5px 0 #d99a1f;color:#7a5300;}
  .chars{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;max-width:440px;position:relative;z-index:1;}
  .char{width:70px;border-radius:16px;background:rgba(255,255,255,.95);border:3px solid #ffd6ea;
    display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;
    box-shadow:0 3px 8px rgba(0,0,0,.25);padding:5px 0 3px;}
  .char .ce{font-size:30px;line-height:1.1;}
  .char .cn{font-size:10px;font-weight:800;color:#7a5a70;}
  .char.sel{border-color:#FFD700;background:#fff8dc;transform:scale(1.1);box-shadow:0 0 14px rgba(255,215,0,.7);}
  .rival-line{display:flex;align-items:center;gap:6px;position:relative;z-index:1;
    background:rgba(0,0,0,.3);border-radius:999px;padding:6px 16px;font-size:clamp(12px,3.2vw,15px);font-weight:800;}
  .rival-line .re{font-size:22px;}
  .diff{display:flex;gap:12px;position:relative;z-index:1;}

  /* result */
  .res-emoji{font-size:50px;position:relative;z-index:1;}
  .rank-big{font-size:clamp(34px,10vw,56px);font-weight:900;position:relative;z-index:1;
    color:#FFD700;text-shadow:2px 2px 0 #8B4500,0 0 24px rgba(255,200,0,.55);}
  .podium{display:flex;flex-direction:column;gap:6px;position:relative;z-index:1;min-width:230px;}
  .prow{display:flex;align-items:center;gap:10px;background:rgba(255,255,255,.12);border-radius:12px;
    padding:6px 14px;font-weight:800;font-size:clamp(14px,3.8vw,17px);}
  .prow.me{background:rgba(255,215,0,.28);border:2px solid #FFD700;}
  .prow .pe{font-size:24px;}
  .prow .pn{flex:1;text-align:left;}

  /* HUD + controls */
  #hud{position:absolute;top:8px;left:0;right:0;display:flex;justify-content:space-between;align-items:center;
    padding:0 12px;pointer-events:none;font-weight:800;color:#3a2b3f;}
  .hud-pill{background:rgba(255,255,255,.85);border-radius:999px;padding:4px 11px;font-size:13px;box-shadow:0 2px 6px rgba(0,0,0,.12);}
  #rankPill{font-size:clamp(18px,5vw,24px);padding:5px 15px;font-weight:900;
    background:linear-gradient(#fff,#ffe9a0);border:2px solid #FFD700;color:#8a5a00;}
  #heatBox{position:absolute;left:14px;bottom:118px;width:120px;height:14px;background:rgba(255,255,255,.7);
    border-radius:999px;overflow:hidden;box-shadow:0 2px 6px rgba(0,0,0,.15);pointer-events:none;}
  #heatBar{height:100%;width:0;background:linear-gradient(90deg,#7ee37e,#ffd34d,#ff5a5a);transition:width .08s;}
  #heatLbl{position:absolute;left:18px;bottom:136px;font-size:12px;font-weight:800;color:#3a2b3f;pointer-events:none;
    text-shadow:0 1px 3px rgba(255,255,255,.8);}

  .pad{position:absolute;bottom:18px;display:flex;gap:10px;}
  #padL{left:16px;flex-direction:column;}
  #padR{right:16px;}
  .ctl{width:64px;height:64px;border-radius:18px;border:none;font-size:26px;font-weight:900;color:#fff;
    background:rgba(58,43,63,.55);box-shadow:0 4px 0 rgba(0,0,0,.25);cursor:pointer;}
  .ctl:active{transform:translateY(2px);}
  #go{width:90px;height:90px;border-radius:26px;background:linear-gradient(#7ee37e,#3fbf5f);box-shadow:0 5px 0 #2a8c43;font-size:22px;}
  #turbo{width:76px;height:90px;border-radius:26px;background:linear-gradient(#ffd34d,#ff9d2e);box-shadow:0 5px 0 #d97a16;color:#5a3a00;font-size:18px;}
  @media (max-width:380px){.ctl{width:54px;height:54px;font-size:22px}#go{width:78px;height:78px}#turbo{width:64px;height:78px}}

  /* ===== Landscape compaction (short height) ===== */
  @media (max-height:480px){
    .screen{ gap:5px !important; padding:6px 16px !important; justify-content:center; overflow-y:auto; }
    .bike-hero{ font-size:30px !important; animation:none; }
    .flag-deco{ display:none; }
    .spline{ display:none; }
    h1{ font-size:20px !important; }
    .sub{ font-size:11px !important; margin:0 !important; }
    .chars{ gap:5px !important; max-width:620px; }
    .char{ width:58px; padding:3px 0 2px; }
    .char .ce{ font-size:24px; }
    .char .cn{ font-size:9px; }
    .rival-line{ padding:4px 12px; }
    .diff{ gap:8px !important; }
    .diff button{ padding:8px 20px !important; font-size:15px !important; }
    .podium{ gap:4px; }
    .prow{ padding:4px 12px; }
    .rank-big{ font-size:26px !important; }
    .res-emoji{ font-size:32px !important; }
  }
</style>
    <script src="/games/safe_area.js"></script>
</head>
<body>
<div id="wrap">
  <canvas id="cv"></canvas>

  <!-- TITLE -->
  <div id="title" class="screen">
    <div class="spline" style="top:15%;width:60%;--d:1.1s;--dl:0s"></div>
    <div class="spline" style="top:25%;width:80%;--d:1.4s;--dl:.2s"></div>
    <div class="spline" style="top:38%;width:50%;--d:1.0s;--dl:.5s"></div>
    <div class="spline" style="top:55%;width:70%;--d:1.3s;--dl:.1s"></div>
    <div class="spline" style="top:68%;width:55%;--d:1.2s;--dl:.4s"></div>
    <div class="spline" style="top:80%;width:75%;--d:1.5s;--dl:.3s"></div>
    <div class="bike-hero">🏍️</div>
    <h1>わくわくバイク</h1>
    <div class="flag-deco">
      <span style="--d:1.0s;--dl:0s">🏁</span>
      <span style="--d:1.2s;--dl:.15s">⭐</span>
      <span style="--d:0.9s;--dl:.3s">🏁</span>
      <span style="--d:1.3s;--dl:.05s">💨</span>
      <span style="--d:1.1s;--dl:.25s">🏁</span>
    </div>
    <div class="sub">だれが えらばれるかな？👇</div>
    <div class="chars" id="charList"></div>
    <div class="rival-line"><span>ライバル</span><span id="rivalIcons" class="re">❓❓❓</span><span>と レース！</span></div>
    <div class="diff">
      <button class="btn alt" data-diff="easy">かんたん</button>
      <button class="btn" data-diff="hard">チャレンジ</button>
    </div>
    <div class="sub" style="font-size:11px;opacity:.7">↑↓レーン / →すすむ / スペース ダッシュ</div>
  </div>

  <!-- HUD -->
  <div id="hud" class="hidden">
    <span class="hud-pill" id="rankPill">4位</span>
    <span class="hud-pill" id="timePill">0.0 秒</span>
    <span class="hud-pill" id="coinPill">🪙 0</span>
  </div>
  <div id="heatLbl" class="hidden">げんき</div>
  <div id="heatBox" class="hidden"><div id="heatBar"></div></div>

  <div id="padL" class="pad hidden">
    <button class="ctl" id="up">▲</button>
    <button class="ctl" id="down">▼</button>
  </div>
  <div id="padR" class="pad hidden">
    <button class="ctl" id="turbo">ダッシュ</button>
    <button class="ctl" id="go">GO</button>
  </div>

  <!-- RESULT -->
  <div id="result" class="screen hidden">
    <div class="res-emoji" id="resEmoji">🎉</div>
    <h1 id="resTitle">ゴール！</h1>
    <div class="rank-big" id="resRank"></div>
    <div class="podium" id="podium"></div>
    <div class="sub" id="resCoin"></div>
    <button class="btn" id="again">もういちど</button>
    <button class="btn alt" id="toTitle">さいしょから</button>
  </div>
</div>

<script>
(()=>{
"use strict";
const cv=document.getElementById('cv'), ctx=cv.getContext('2d');
let W=0,H=0,DPR=1;
function resize(){
  DPR=Math.min(window.devicePixelRatio||1,2);
  W=window.innerWidth; H=window.innerHeight;
  cv.width=W*DPR; cv.height=H*DPR; cv.style.width=W+'px'; cv.style.height=H+'px';
  ctx.setTransform(DPR,0,0,DPR,0,0);
}
window.addEventListener('resize',resize); resize();
if(!CanvasRenderingContext2D.prototype.roundRect){
  CanvasRenderingContext2D.prototype.roundRect=function(x,y,w,h,r){
    this.moveTo(x+r,y); this.arcTo(x+w,y,x+w,y+h,r); this.arcTo(x+w,y+h,x,y+h,r);
    this.arcTo(x,y+h,x,y,r); this.arcTo(x,y,x+w,y,r); this.closePath(); return this; };
}

/* ---------- audio ---------- */
const AudioFX=(()=>{
  let ac=null,master=null,bgmTimer=null,muted=false;
  function ensure(){ if(!ac){ ac=new (window.AudioContext||window.webkitAudioContext)(); master=ac.createGain(); master.gain.value=.5; master.connect(ac.destination);} if(ac.state==='suspended')ac.resume(); }
  function tone(f,d,type='square',v=.3,slideTo){ if(muted)return; ensure();
    const o=ac.createOscillator(),g=ac.createGain(); o.type=type; o.frequency.value=f;
    if(slideTo)o.frequency.linearRampToValueAtTime(slideTo,ac.currentTime+d);
    g.gain.setValueAtTime(v,ac.currentTime); g.gain.exponentialRampToValueAtTime(.0001,ac.currentTime+d);
    o.connect(g); g.connect(master); o.start(); o.stop(ac.currentTime+d); }
  const coin=()=>{tone(880,.08,'square',.25);setTimeout(()=>tone(1320,.1,'square',.22),60);};
  const jump=()=>tone(300,.18,'sawtooth',.25,720);
  const land=()=>tone(520,.1,'triangle',.3,180);
  const crash=()=>{tone(160,.3,'sawtooth',.35,60);};
  const beep=()=>tone(440,.15,'square',.3);
  const beepGo=()=>tone(880,.4,'square',.35);
  const pass=()=>{tone(660,.09,'square',.28);setTimeout(()=>tone(990,.12,'square',.25),70);};
  const passed=()=>tone(330,.18,'triangle',.25,240);
  const rocket=()=>{[523,784,1046,1568].forEach((f,i)=>setTimeout(()=>tone(f,.12,'square',.28),i*60));};
  const goal=()=>{[523,659,784,1046].forEach((f,i)=>setTimeout(()=>tone(f,.18,'square',.3),i*120));};
  const mel=[392,392,440,392,523,494, 392,392,440,392,587,523];
  let mi=0;
  function startBGM(){ if(bgmTimer)return; ensure();
    bgmTimer=setInterval(()=>{ if(muted)return; const f=mel[mi%mel.length]; tone(f,.16,'triangle',.12); if(mi%2===0)tone(f/2,.2,'sine',.08); mi++; },230); }
  function stopBGM(){ if(bgmTimer){clearInterval(bgmTimer);bgmTimer=null;} }
  function setMute(m){ muted=m; }
  return {coin,jump,land,crash,beep,beepGo,pass,passed,rocket,goal,startBGM,stopBGM,setMute,ensure};
})();

/* ---------- characters ---------- */
const CHARS=[
  {e:'🐰',n:'うさぴょん',c:'#ff5fa2'},
  {e:'🐶',n:'わんた',c:'#4d8df0'},
  {e:'🐱',n:'にゃーこ',c:'#ff9d2e'},
  {e:'🐻',n:'くまごろう',c:'#8d6e63'},
  {e:'🐼',n:'ぱんぱん',c:'#455a64'},
  {e:'🦊',n:'こんきち',c:'#ff7043'},
  {e:'🤴',n:'プリンス',c:'#7e57c2'},
  {e:'👸',n:'プリンセス',c:'#ec407a'},
];
let chosenIdx=0;
const charList=document.getElementById('charList');
function pickRivals(){
  const pool=CHARS.map((c,i)=>i).filter(i=>i!==chosenIdx);
  // shuffle
  for(let i=pool.length-1;i>0;i--){const j=(Math.random()*(i+1))|0;[pool[i],pool[j]]=[pool[j],pool[i]];}
  return pool.slice(0,3);
}
let rivalIdx=[];
function refreshRivalPreview(){
  rivalIdx=pickRivals();
  document.getElementById('rivalIcons').textContent=rivalIdx.map(i=>CHARS[i].e).join('');
}
CHARS.forEach((c,i)=>{ const d=document.createElement('div'); d.className='char'+(i===0?' sel':'');
  d.innerHTML=`<span class="ce">${c.e}</span><span class="cn">${c.n}</span>`;
  d.onclick=()=>{ document.querySelectorAll('.char').forEach(e=>e.classList.remove('sel')); d.classList.add('sel'); chosenIdx=i; AudioFX.ensure(); refreshRivalPreview(); };
  charList.appendChild(d); });
refreshRivalPreview();

/* ---------- game state ---------- */
const G={ running:false, mode:'easy', phase:'count' };
let player, rivals, world, keys={}, lastT=0;
let goPressedAt=null, rocketDone=false;

function makeLevel(mode,stage){
  const goal = (mode==='easy'? 1400 : 2300) + (stage-1)*300;
  const items=[];
  let x = 300;
  const rnd=(a,b)=>a+Math.random()*(b-a);
  while(x<goal-200){
    const r=Math.random();
    if(r<0.42){ items.push({type:'ramp',x, lane:1, big: mode==='hard'&&Math.random()<.4}); x+=rnd(mode==='easy'?260:200, 360); }
    else if(r<0.72){ items.push({type:'rock',x, lane:(Math.random()*3)|0}); x+=rnd(185,300); }
    else { items.push({type:'coin',x, lane:(Math.random()*3)|0}); x+=rnd(90,170); }
  }
  items.push({type:'goal',x:goal,lane:1});
  return {goal,items};
}

function makeRacer(char,color,name,isPlayer,mode,startLane){
  return {
    char,color,name,isPlayer,
    x:0, lane:startLane, _ly:null,
    speed:0, maxSpeed: mode==='easy'?4.6:5.8,
    accel:7, friction:2.2,
    air:false, jumpY:0, vy:0, tilt:0,
    heat:0, overheat:0, stumble:0,
    finished:false, finRank:0, finTime:0,
    // AI
    aiBase:1, aiReact: mode==='easy'?0.75:0.92, aiTimer:Math.random(),
  };
}

function startGame(mode){
  G.mode=mode; G.running=true; G.phase='count';
  world={ scroll:0, level:makeLevel(mode,1), coins:0, time:0, stage:1, mode,
          countT:-3.6, finishOrder:[], stageRanks:[] };
  buildRacers(mode);
  document.getElementById('title').classList.add('hidden');
  document.getElementById('result').classList.add('hidden');
  ['hud','heatBox','heatLbl','padL','padR'].forEach(id=>document.getElementById(id).classList.remove('hidden'));
  goPressedAt=null; rocketDone=false; prevRank=1; countBeeped={}; flashes=[];
  AudioFX.ensure();
  lastT=performance.now();
  requestAnimationFrame(loop);
}

function buildRacers(mode){
  const me=CHARS[chosenIdx];
  player=makeRacer(me.e,me.c,me.n,true,mode,1);
  const bases = mode==='easy'? [0.82,0.90,0.97] : [0.92,1.0,1.06];
  rivals = rivalIdx.map((ci,k)=>{
    const c=CHARS[ci];
    const r=makeRacer(c.e,c.c,c.n,false,mode,k); // lanes 0,1,2
    r.aiBase=bases[k]+Math.random()*0.04;
    return r;
  });
}

function allRacers(){ return [player,...rivals]; }

/* lane visual offsets */
function laneScreenY(lane){ const base=H*0.62; return base - lane*44; }
function laneScale(lane){ return 1 - lane*0.08; }

/* ---------- input ---------- */
const press=(k,v)=>{
  if(k==='go'&&v&&!keys.go&&world){
    if(G.phase==='count') goPressedAt=world.countT;
    else if(G.phase==='race'&&world.time<0.4) goPressedAt=world.time;
  }
  keys[k]=v;
};
addEventListener('keydown',e=>{ if(['ArrowUp','ArrowDown','ArrowRight','ArrowLeft',' '].includes(e.key))e.preventDefault();
  if(e.key==='ArrowUp')onUp(); if(e.key==='ArrowDown')onDown();
  if(e.key==='ArrowRight'||e.key==='z'||e.key==='Z')press('go',true);
  if(e.key===' '||e.key==='x'||e.key==='X')press('turbo',true); });
addEventListener('keyup',e=>{ if(e.key==='ArrowRight'||e.key==='z'||e.key==='Z')press('go',false);
  if(e.key===' '||e.key==='x'||e.key==='X')press('turbo',false); });

function bindHold(id,key){ const el=document.getElementById(id);
  const dn=e=>{e.preventDefault();press(key,true);}; const up=e=>{e.preventDefault();press(key,false);};
  el.addEventListener('touchstart',dn,{passive:false}); el.addEventListener('touchend',up); el.addEventListener('touchcancel',up);
  el.addEventListener('mousedown',dn); el.addEventListener('mouseup',up); el.addEventListener('mouseleave',up); }
bindHold('go','go'); bindHold('turbo','turbo');

function onUp(){ if(!player||G.phase!=='race')return; if(player.air){player.tilt=Math.min(1,player.tilt+0.5);} else if(player.lane<2){player.lane++;} }
function onDown(){ if(!player||G.phase!=='race')return; if(player.air){player.tilt=Math.max(-1,player.tilt-0.5);} else if(player.lane>0){player.lane--;} }
function tap(id,fn){ const el=document.getElementById(id);
  el.addEventListener('touchstart',e=>{e.preventDefault();fn();},{passive:false}); el.addEventListener('click',e=>{e.preventDefault();fn();}); }
tap('up',onUp); tap('down',onDown);

/* ---------- loop ---------- */
function loop(now){
  if(!G.running)return;
  let dt=(now-lastT)/1000; lastT=now; if(dt>0.05)dt=0.05;
  update(dt); render();
  requestAnimationFrame(loop);
}

/* ---------- countdown ---------- */
let countBeeped={};
function updateCountdown(dt){
  const prev=world.countT;
  world.countT+=dt;
  const t=world.countT;
  // beeps at -3,-2,-1, GO at 0
  [-3,-2,-1].forEach(m=>{ if(prev<m&&t>=m&&!countBeeped[m]){countBeeped[m]=1;AudioFX.beep();} });
  if(prev<0&&t>=0&&!countBeeped.go){ countBeeped.go=1; AudioFX.beepGo(); AudioFX.startBGM(); }
  if(t>=0){
    G.phase='race';
    // rocket start check
    if(goPressedAt!=null && goPressedAt>=-0.05){ /* pressed after GO handled below in race */ }
  }
}

/* ---------- rank ---------- */
let prevRank=4;
function calcRank(){
  const rs=allRacers();
  let ahead=0;
  for(const r of rs){ if(r!==player){
    if(r.finished&&!player.finished)ahead++;
    else if(!r.finished&&!player.finished&&r.x>player.x)ahead++;
    else if(r.finished&&player.finished&&r.finRank<player.finRank)ahead++;
  }}
  if(player.finished)return player.finRank;
  return ahead+1;
}

/* ---------- physics shared ---------- */
function racerPhysics(r,dt,accelOn,turboOn){
  if(r.overheat>0){ r.overheat-=dt; accelOn=false; turboOn=false; }
  if(r.stumble>0){ r.stumble-=dt; }
  const top = (turboOn && r.overheat<=0)? r.maxSpeed*1.45 : r.maxSpeed;
  if(r.stumble>0){ r.speed=0; }
  else{
    if(accelOn){ r.speed += r.accel*dt; }
    else { r.speed -= r.friction*dt; }
  }
  r.speed=Math.max(0,Math.min(r.speed,top));
  r.x += r.speed*15*dt; // level units (=120px/s per speed /8)

  // air
  if(r.air){
    r.vy += 26*dt;
    r.jumpY += r.vy*dt;
    if(r.jumpY>=0){
      r.air=false; r.jumpY=0;
      if(r.isPlayer){
        const lvAng=Math.abs(r.tilt);
        if(r.tilt < -0.45){ r.stumble=1.0; r.speed*=0.3; AudioFX.crash(); flash('💥',r); }
        else if(lvAng<0.35 || (r.tilt>0.2 && r.tilt<0.85)){ r.speed=Math.min(top,r.speed+0.9); AudioFX.land(); flash('✨',r); }
        else { AudioFX.land(); }
      } else {
        // rivals: mostly clean landing; small tumble chance gives kids openings
        if(Math.random() < (world.mode==='easy'?0.22:0.10)){ r.stumble=0.9; r.speed*=0.3; }
      }
      r.tilt=0; r.vy=0;
    }
  }
  return top;
}

function itemCollisions(r){
  const lv=world.level;
  for(const it of lv.items){
    if(it.type==='goal'){
      if(!r.finished && r.x >= it.x - 3){
        r.finished=true;
        world.finishOrder.push(r);
        r.finRank=world.finishOrder.length;
        r.finTime=world.time;
        if(r.isPlayer) playerFinished();
      }
      continue;
    }
    if(Math.abs(it.x - r.x) < 6){
      if(it.type==='ramp' && !r.air && r.stumble<=0){
        r.air=true; r.vy = -(22 + r.speed*2.8) * (it.big?1.4:1);
        if(r.isPlayer){AudioFX.jump();}
        // no done flag: every racer can use the ramp
      } else if(it.type==='coin' && r.isPlayer && !it.done){
        if(it.lane===r.lane || r.air){
          world.coins++; it.done=true; AudioFX.coin();
          r.heat=Math.max(0,r.heat-0.22); // coin cools you down!
          flash('🧊 かいふく',r);
        }
      } else if(it.type==='rock' && r.lastRock!==it){
        if(!r.air && it.lane===r.lane && r.stumble<=0){
          r.lastRock=it;
          r.stumble= r.isPlayer?1.1:0.9; r.speed=0;
          if(r.isPlayer){ AudioFX.crash(); flash('💥 ストップ！',r); }
        }
      }
    }
  }
}

/* ---------- AI ---------- */
function updateRival(r,dt){
  if(r.finished){ racerPhysics(r,dt,false,false); return; }
  // rubber band: keep the race close
  const gap = r.x - player.x;
  let mult = r.aiBase;
  if(gap > 22) mult *= 0.72;         // too far ahead → ease off a lot
  else if(gap > 10) mult *= 0.88;
  else if(gap < -22) mult *= 1.25;   // far behind → catch up
  else if(gap < -10) mult *= 1.1;
  const target = r.maxSpeed*mult;

  // accel logic: accelerate if below target
  const accelOn = r.speed < target && r.stumble<=0;
  // occasional turbo when behind & cool
  const turboOn = gap<-6 && r.heat<0.5 && Math.random()<0.4;
  if(turboOn && r.overheat<=0 && !r.air){ r.heat+=dt*0.55; } else { r.heat=Math.max(0,r.heat-dt*0.4); }
  if(r.heat>=1&&r.overheat<=0){ r.overheat=1.2; r.heat=0.8; }

  // rock avoidance: look ahead
  r.aiTimer-=dt;
  if(r.aiTimer<=0){
    r.aiTimer=0.18;
    if(!r.air){
      for(const it of world.level.items){
        if(it.type!=='rock') continue;
        const d=it.x - r.x;
        if(d>2 && d<45 && it.lane===r.lane){
          if(Math.random()<r.aiReact){
            // dodge to a free lane
            const opts=[r.lane-1,r.lane+1].filter(l=>l>=0&&l<=2);
            r.lane=opts[(Math.random()*opts.length)|0];
          }
          break;
        }
      }
    }
  }
  // cap speed to target when above (simulate throttle-off)
  racerPhysics(r,dt,accelOn,turboOn);
  if(r.speed>target && r.stumble<=0) r.speed=Math.max(target, r.speed - 3*dt);
  itemCollisions(r);
}

/* ---------- update ---------- */
function update(dt){
  const p=player;

  if(G.phase==='count'){
    updateCountdown(dt);
    // smooth lane y even while waiting
    allRacers().forEach(r=>{
      const ty=laneScreenY(r.lane);
      r._ly=(r._ly==null)?ty:r._ly+(ty-r._ly)*Math.min(1,dt*10);
    });
    return;
  }

  world.time+=dt;

  // rocket start: fresh GO press within -0.05s..+0.35s of the GO signal
  if(!rocketDone){
    if(goPressedAt!=null && goPressedAt>=-0.05 && goPressedAt<=0.35){
      rocketDone=true;
      p.speed=p.maxSpeed*1.25; AudioFX.rocket(); flash('🚀 ロケットスタート！',p);
    } else if(goPressedAt!=null && goPressedAt<-0.05){
      rocketDone=true; flash('はやすぎ！💦',p);
      goPressedAt=null; // allow nothing further; normal start
    } else if(world.time>0.4){
      rocketDone=true; // window closed
    }
  }

  // player lane smooth
  const targetY=laneScreenY(p.lane);
  p._ly = (p._ly==null)?targetY:p._ly + (targetY-p._ly)*Math.min(1,dt*10);

  // player control
  let accelOn = keys.go || keys.turbo;
  const turboOn = !!keys.turbo;
  if(turboOn && p.overheat<=0 && !p.air){ p.heat+=dt*0.55; }
  else { p.heat-=dt*0.4; }
  p.heat=Math.max(0,Math.min(1,p.heat));
  if(p.heat>=1 && p.overheat<=0){ p.overheat=1.4; p.heat=0.9; AudioFX.crash(); }
  racerPhysics(p,dt,accelOn,turboOn);
  itemCollisions(p);

  // rivals
  for(const r of rivals){
    const ty=laneScreenY(r.lane);
    r._ly=(r._ly==null)?ty:r._ly+(ty-r._ly)*Math.min(1,dt*10);
    updateRival(r,dt);
  }

  // rank change feedback
  const rank=calcRank();
  if(rank<prevRank){ AudioFX.pass(); flash(rank===1?'👑 トップ！':'ぬかした！✨',p); }
  else if(rank>prevRank){ AudioFX.passed(); flash('ぬかされた！💨',p); }
  prevRank=rank;

  // HUD
  const medal=['🥇','🥈','🥉',''][rank-1]||'';
  document.getElementById('rankPill').textContent=medal+rank+'位';
  document.getElementById('timePill').textContent=world.time.toFixed(1)+' 秒';
  document.getElementById('coinPill').textContent='🪙 '+world.coins;
  document.getElementById('heatBar').style.width=(p.heat*100)+'%';
}

  let icon='';for(const [mark,name] of marks)if(txt.includes(mark)){icon=name;txt=txt.replace(mark,'').trim();break;}
  flashes.push({txt,icon,x:r.isPlayer?playerScreenX():rivalScreenX(r),y:(r._ly||H*0.5)-60,t:0});
}

      const bob=Math.sin(world.time*6+it.x)*4;
      const r=16*sc;
      const cg=ctx.createRadialGradient(sxi,ly-10+bob,0,sxi,ly-10+bob,r*2);
      cg.addColorStop(0,'rgba(255,220,0,.45)'); cg.addColorStop(1,'rgba(255,220,0,0)');
      ctx.fillStyle=cg; ctx.beginPath(); ctx.arc(sxi,ly-10+bob,r*2,0,Math.PI*2); ctx.fill();
      drawCoinShape(sxi,ly-10+bob,r*.72);
    } else if(it.type==='goal'){
      const gx=sxi;
      ctx.fillStyle='rgba(255,255,255,.7)'; ctx.fillRect(gx-3,ly-160,6,165);
      const fseg=10, fsize=50;
      for(let fr=0;fr<4;fr++) for(let fc=0;fc<4;fc++){
        ctx.fillStyle=(fr+fc)%2?'#222':'#fff';
        ctx.fillRect(gx+fc*fseg-fsize/2, ly-160+fr*fseg, fseg, fseg);
      }
      ctx.strokeStyle='#333'; ctx.lineWidth=2;
      ctx.strokeRect(gx-fsize/2, ly-160, fsize, fseg*4);
      drawCheckeredFlag(gx,ly-10,16);
      ctx.fillStyle='#FFD700'; ctx.font='bold 22px sans-serif'; ctx.textAlign='center';
      ctx.strokeStyle='#8B4500'; ctx.lineWidth=4; ctx.lineJoin='round';
      ctx.strokeText('GOAL!',gx,ly-170);
      ctx.fillText('GOAL!',gx,ly-170);
    }
  }
  ctx.textAlign='left'; ctx.globalAlpha=1;

  // racers: draw far lanes first
  const drawList=allRacers().slice().sort((a,b)=>b.lane-a.lane);
  for(const r of drawList){
    const rx = r.isPlayer? playerScreenX() : rivalScreenX(r);
    if(rx<-80||rx>W+80) continue;
    const baseY=r._ly||laneScreenY(r.lane);
    drawBike(rx, baseY + (r.air?r.jumpY:0), r);
  }

  // turbo speed lines for player
  if(keys.turbo&&p.overheat<=0&&G.phase==='race'){
    const baseY=p._ly||laneScreenY(p.lane);
    ctx.strokeStyle='rgba(255,255,255,.6)'; ctx.lineWidth=3;
    for(let i=0;i<5;i++){const yy=baseY-40+i*16+(i*7); ctx.beginPath(); ctx.moveTo(playerScreenX()-30-i*8,yy); ctx.lineTo(playerScreenX()-70-i*14,yy); ctx.stroke();}
  }

  // progress bar with racer icons
  drawProgress();

  // flashes
  flashes=flashes.filter(f=>f.t<0.8);
  for(const f of flashes){ f.t+=0.016; ctx.globalAlpha=1-f.t/0.8;
    ctx.font='bold 22px sans-serif'; ctx.textAlign='center';
    ctx.fillStyle='#fff'; ctx.strokeStyle='rgba(0,0,0,.5)'; ctx.lineWidth=4; ctx.lineJoin='round';
    const fy=f.y-f.t*40,tx=f.x+(f.icon?12:0);if(f.icon)drawFlashIcon(f.icon,f.x-(f.txt?Math.max(24,f.txt.length*5):0),fy-7,10);
    if(f.txt){ctx.strokeText(f.txt,tx,fy);ctx.fillText(f.txt,tx,fy);}ctx.globalAlpha=1; }
  ctx.textAlign='left';

  // overheat warning
  if(p.overheat>0){ ctx.fillStyle='rgba(255,80,80,.9)'; ctx.font='bold 22px sans-serif'; ctx.textAlign='center';
    ctx.fillText('つかれた…',W/2,H*0.32);drawFlashIcon('sweat',W/2+70,H*0.32-7,9);ctx.textAlign='left'; }

  // countdown overlay
  if(G.phase==='count') drawCountdown();
}

function drawProgress(){
  const bw=Math.min(W*0.6,380), bx=(W-bw)/2, by=44;
  ctx.fillStyle='rgba(255,255,255,.65)';
  ctx.beginPath(); ctx.roundRect(bx,by,bw,10,5); ctx.fill();
  ctx.fillStyle='rgba(0,0,0,.15)';
  ctx.fillRect(bx+bw-3,by-3,3,16);
  ctx.textAlign='center';drawCheckeredFlag(bx+bw,by-8,8);
  const goal=world.level.goal;
  // rivals first, player on top
  for(const r of [...rivals,player]){
    const t=Math.min(1,r.x/goal);
    const ix=bx+t*bw;
    if(r.isPlayer){
      ctx.fillStyle='rgba(255,215,0,.9)';
      ctx.beginPath(); ctx.arc(ix,by+5,14,0,7); ctx.fill();
    }
    drawRacerHead(ix,by+6,r.isPlayer?8:7,Math.max(0,CHARS.findIndex(c=>c.e===r.char)));
  }
  ctx.textAlign='left';
}

function drawCountdown(){
  const t=world.countT;
  ctx.fillStyle='rgba(0,0,0,.35)'; ctx.fillRect(0,0,W,H);
  // signal lights
  const cx=W/2, cy=H*0.3;
  const n = t<-2? 1 : t<-1? 2 : t<0? 3 : 4;
  ctx.fillStyle='rgba(30,30,40,.9)';
  ctx.beginPath(); ctx.roundRect(cx-88,cy-30,176,60,16); ctx.fill();
  for(let i=0;i<3;i++){
    const on = n>i;
    const col = n===4? '#39e75f' : (on? (i<2?'#ff4040':'#ffd340') : '#444');
    ctx.fillStyle=col;
    ctx.beginPath(); ctx.arc(cx-50+i*50,cy,18,0,7); ctx.fill();
    if(on){ ctx.fillStyle='rgba(255,255,255,.35)'; ctx.beginPath(); ctx.arc(cx-56+i*50,cy-6,6,0,7); ctx.fill(); }
  }
  ctx.textAlign='center';
  ctx.font='bold 52px sans-serif'; ctx.lineJoin='round';
  const label = t<-2? '3' : t<-1? '2' : t<0? '1' : 'GO!';
  ctx.fillStyle= t<0? '#fff':'#39e75f';
  ctx.strokeStyle='rgba(0,0,0,.55)'; ctx.lineWidth=8;
  ctx.strokeText(label,cx,cy+110); ctx.fillText(label,cx,cy+110);
  if(t>-1&&t<0.5){
    ctx.font='bold 17px sans-serif'; ctx.fillStyle='#ffe27a';
    ctx.strokeStyle='rgba(0,0,0,.5)'; ctx.lineWidth=5;
    ctx.strokeText('GO!のしゅんかんに ボタン',cx,cy+150);
    ctx.fillText('GO!のしゅんかんに ボタン',cx,cy+150);drawRocketShape(cx+128,cy+143,8);
  }
  ctx.textAlign='left';
}

function cloud(x,y,r){ ctx.beginPath(); ctx.arc(x,y,r,0,7); ctx.arc(x+r,y+6,r*0.8,0,7); ctx.arc(x-r,y+6,r*0.7,0,7); ctx.fill(); }

/* roadside scenery */
function drawRoadside(px, roadTopY){
  const spacing=18;
  const startIdx=Math.floor(px/spacing)-1;
  for(let i=startIdx; i<startIdx+12; i++){
    const objX = i*spacing;
    const rel = objX - px;
    const screenX = W*0.26 + rel*8;
    if(screenX<-60 || screenX>W+60) continue;
    const baseY = roadTopY - 4;
    const kind = ((i%5)+5)%5;
    const sc = 0.85 + ((((i*13)%5)+5)%5)*0.06;
    drawScenery(kind, screenX, baseY, sc, ((i%97)+97)%97);
  }
}
function drawScenery(kind,x,y,sc,seed){
  ctx.save();
  ctx.translate(x,y);
  ctx.scale(sc,sc);
  if(kind===0 || kind===1){
    ctx.fillStyle='#6b4423';
    ctx.fillRect(-5,-18,10,22);
    ctx.fillStyle= kind===0?'#2e8b40':'#37a14a';
    ctx.beginPath(); ctx.arc(0,-30,22,0,7); ctx.fill();
    ctx.beginPath(); ctx.arc(-15,-22,16,0,7); ctx.fill();
    ctx.beginPath(); ctx.arc(15,-22,16,0,7); ctx.fill();
    ctx.fillStyle='rgba(255,255,255,.18)';
    ctx.beginPath(); ctx.arc(-6,-36,10,0,7); ctx.fill();
  } else if(kind===2){
    ctx.fillStyle='#8d6e63'; ctx.fillRect(-3,-10,6,16);
    ctx.fillStyle='#1976d2'; ctx.fillRect(-22,-40,44,30);
    ctx.fillStyle='#fff'; ctx.fillRect(-19,-37,38,24);
    if(seed%4===0)drawCheckeredFlag(0,-25,10);
    else if(seed%4===1){ctx.fillStyle='#EF5350';ctx.fillRect(-7,-34,14,18);ctx.strokeStyle='#FFF';ctx.lineWidth=2;ctx.strokeRect(-4,-31,8,6);ctx.beginPath();ctx.moveTo(7,-31);ctx.quadraticCurveTo(14,-28,11,-17);ctx.stroke();}
    else if(seed%4===2){ctx.fillStyle='#F5C16C';ctx.beginPath();ctx.arc(0,-29,10,Math.PI,0);ctx.fill();ctx.fillStyle='#66BB6A';ctx.fillRect(-10,-29,20,3);ctx.fillStyle='#8D4B20';ctx.fillRect(-9,-26,18,7);ctx.fillStyle='#F5C16C';ctx.beginPath();ctx.arc(0,-19,10,0,Math.PI);ctx.fill();}
    else{ctx.fillStyle='#42A5F5';ctx.beginPath();ctx.moveTo(-12,-31);ctx.lineTo(2,-31);ctx.lineTo(2,-38);ctx.lineTo(14,-25);ctx.lineTo(2,-12);ctx.lineTo(2,-19);ctx.lineTo(-12,-19);ctx.closePath();ctx.fill();}
    ctx.textBaseline='alphabetic';
  } else if(kind===3){
    for(let k=-1;k<=1;k++){
      const bob=Math.sin(world.time*5+k+seed)*3;
      drawRacerHead(k*22,-10+bob,10,(seed+k+6)%6);
    }
    ctx.fillStyle='#ff5fa2'; ctx.fillRect(-34,-34,68,10);
    ctx.fillStyle='#fff'; ctx.font='bold 8px sans-serif'; ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.fillText('GANBARE!',0,-29);
    ctx.textBaseline='alphabetic';
  } else {
    ctx.fillStyle='#ffab91'; ctx.fillRect(-20,-34,40,38);
    ctx.fillStyle='#d84315';
    ctx.beginPath(); ctx.moveTo(-24,-34); ctx.lineTo(0,-52); ctx.lineTo(24,-34); ctx.closePath(); ctx.fill();
    ctx.fillStyle='#4fc3f7'; ctx.fillRect(-14,-26,11,11); ctx.fillRect(4,-26,11,11);
    ctx.fillStyle='#6d4c41'; ctx.fillRect(-6,-14,12,18);
  }
  ctx.restore();
}

function drawBike(x,y,r){
  ctx.save(); ctx.translate(x,y);
  const ang = r.air? (-r.tilt*0.5) : (r.stumble>0? Math.sin(world.time*30)*0.15 : 0);
  ctx.rotate(ang);
  // wheels
  ctx.fillStyle='#333';
  ctx.beginPath(); ctx.arc(-16,4,12,0,7); ctx.fill();
  ctx.beginPath(); ctx.arc(18,4,12,0,7); ctx.fill();
  ctx.fillStyle='#bbb'; ctx.beginPath(); ctx.arc(-16,4,5,0,7); ctx.fill(); ctx.beginPath(); ctx.arc(18,4,5,0,7); ctx.fill();
  // body (racer color)
  ctx.fillStyle=r.color; ctx.beginPath();
  ctx.moveTo(-16,2); ctx.lineTo(6,-10); ctx.lineTo(22,-6); ctx.lineTo(18,4); ctx.lineTo(-16,4); ctx.closePath(); ctx.fill();
  ctx.fillStyle='#ffd34d'; ctx.fillRect(-4,-9,12,5);
  // rider
  drawRacerHead(0,-18,14,Math.max(0,CHARS.findIndex(c=>c.e===r.char)));
  // name tag for player
  if(r.isPlayer){
    ctx.fillStyle='#fff';ctx.strokeStyle='rgba(0,0,0,.5)';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(-7,-51);ctx.lineTo(7,-51);ctx.lineTo(0,-42);ctx.closePath();ctx.fill();ctx.stroke();
  }
  ctx.textAlign='left';
  ctx.restore();
}

/* ---------- finish ---------- */
const RANK_PTS=[0,5,3,2,1];
function playerFinished(){
  // let the frame finish, then show clear screen shortly after
  setTimeout(showStageResult,700);
}
function showStageResult(){
  G.running=false; AudioFX.stopBGM(); AudioFX.goal();
  // racers who haven't finished: assign remaining ranks by current x
  const unfinished=allRacers().filter(r=>!r.finished).sort((a,b)=>b.x-a.x);
  unfinished.forEach(r=>{ r.finished=true; world.finishOrder.push(r); r.finRank=world.finishOrder.length; });
  const myRank=player.finRank;
  world.stageRanks.push(myRank);

  const MAX_STAGE=3;
  ['hud','heatBox','heatLbl','padL','padR'].forEach(id=>document.getElementById(id).classList.add('hidden'));

  if(world.stage < MAX_STAGE){
    const medal=['🥇','🥈','🥉','😢'][myRank-1];
    const sc=document.createElement('div');
    sc.id='stageClear';
    sc.style.cssText='position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;background:rgba(0,0,0,.78);color:#fff;font-family:inherit;z-index:50;text-align:center;padding:12px;';
    sc.innerHTML=`
      <div style="font-size:50px">${medal}</div>
      <div style="font-size:30px;font-weight:900;color:#FFD700;text-shadow:2px 2px 0 #8B4500">${myRank}位で ゴール！</div>
      <div style="font-size:15px;color:rgba(255,255,255,.85)">ステージ${world.stage} ／ タイム ${player.finTime.toFixed(1)}秒 ／ 🪙×${world.coins}</div>
      <div style="font-size:13px;color:#88ccff">つぎのコースで ぎゃくてんだ！</div>
      <button style="background:linear-gradient(145deg,#FF9800,#E65100);color:#fff;border:none;border-radius:40px;padding:13px 40px;font-size:19px;font-weight:900;cursor:pointer;box-shadow:0 5px 0 #BF360C;font-family:inherit"
        onclick="nextStage()">つぎへ ▶</button>`;
    document.querySelector('#wrap').appendChild(sc);
    return;
  }
  // Final: podium + total points
  const total=world.stageRanks.reduce((s,r)=>s+RANK_PTS[r],0);
  const podium=document.getElementById('podium');
  podium.innerHTML='';
  const order=world.finishOrder;
  order.forEach(r=>{
    const row=document.createElement('div');
    row.className='prow'+(r.isPlayer?' me':'');
    const m=['🥇','🥈','🥉','4位'][r.finRank-1];
    row.innerHTML=`<span>${m}</span><span class="pe">${r.char}</span><span class="pn">${r.name}${r.isPlayer?'（きみ）':''}</span>`;
    podium.appendChild(row);
  });
  const myFinal=world.stageRanks[world.stageRanks.length-1];
  document.getElementById('resRank').textContent=['🥇','🥈','🥉','😢'][myFinal-1]+' '+myFinal+'位';
  document.getElementById('resCoin').textContent='🪙 '+world.coins+' まい ／ せいせき: '+world.stageRanks.join('位 → ')+'位';
  let em,title;
  if(total>=13){ em='🏆'; title='チャンピオン！'; }
  else if(total>=9){ em='🎉'; title='だいかつやく！'; }
  else if(total>=6){ em='😊'; title='よくがんばった！'; }
  else { em='💪'; title='つぎは かてるよ！'; }
  document.getElementById('resEmoji').textContent=em;
  document.getElementById('resTitle').textContent=title;
  document.getElementById('result').classList.remove('hidden');
}

window.nextStage = function nextStage(){
  const sc=document.getElementById('stageClear'); if(sc)sc.remove();
  world.stage++;
  world.time=0; world.finishOrder=[];
  world.level=makeLevel(world.mode, world.stage);
  buildRacers(world.mode);
  // slight difficulty ramp
  allRacers().forEach(r=>{ r.maxSpeed += (world.stage-1)*0.35; });
  prevRank=1; countBeeped={}; goPressedAt=null; rocketDone=false; flashes=[];
  world.countT=-3.6; G.phase='count';
  ['hud','heatBox','heatLbl','padL','padR'].forEach(id=>document.getElementById(id).classList.remove('hidden'));
  G.running=true; lastT=performance.now();
  requestAnimationFrame(loop);
}

/* ---------- buttons ---------- */
document.querySelectorAll('[data-diff]').forEach(b=>b.onclick=()=>{ prevRank=4; countBeeped={}; startGame(b.dataset.diff); });
document.getElementById('again').onclick=()=>{ prevRank=4; countBeeped={}; refreshRivalPreview(); startGame(G.mode); };
document.getElementById('toTitle').onclick=()=>{ document.getElementById('result').classList.add('hidden'); document.getElementById('title').classList.remove('hidden'); refreshRivalPreview(); };

})();
</script>
