<!doctype html>
<html lang="ja">
<head>
<script src="/games/wakuwaku_ui.js"></script>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>かたちあわせ</title>
<link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@700;800;900&family=DotGothic16&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="/games/safe_area.js"></script>
<script src="/games/wakuwaku_bgm_mp3.js"></script>
<style>
:root{
  --cream:#FFF6E3; --paper:#FFFDF5; --wood:#D89A5C; --deep:#9C6231; --ink:#4A3B32;
  --mint:#57C9AE; --sky:#6FBEEA; --sun:#FFC84D; --coral:#FF8A7A; --grape:#A98CE0;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#2A1C14;
  font-family:'M PLUS Rounded 1c','Hiragino Maru Gothic ProN',sans-serif;color:var(--ink);
  -webkit-user-select:none;user-select:none;touch-action:none;overscroll-behavior:none}
#app{position:relative;width:100%;height:100svh;overflow:hidden;
  background:linear-gradient(180deg,#F6D9A8 0%,#E9BE86 55%,#D9A469 100%)}
canvas#gl{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;overscroll-behavior:none;-webkit-user-select:none;user-select:none;z-index:1}

/* ---------- screens ---------- */
.screen{position:absolute;inset:0;z-index:20;display:flex;flex-direction:column;align-items:center;
  justify-content:center;padding:calc(16px + var(--sat,0px)) 16px calc(16px + var(--sab,0px));
  transition:opacity .3s ease,transform .3s ease;overflow:hidden}
.screen.off{opacity:0;pointer-events:none;transform:scale(1.04)}
#title{background:radial-gradient(ellipse at 50% 26%,rgba(255,247,230,.42),rgba(216,154,92,.20) 52%,rgba(120,72,38,.30))}
#map,#chars,#result,#shelf{background:radial-gradient(ellipse at 50% 18%,rgba(255,253,245,.72),rgba(232,196,150,.72) 60%,rgba(140,88,46,.62))}

/* ---------- title ---------- */
#title{overflow:hidden;justify-content:flex-start;padding-top:calc(22px + var(--sat,0px))}
@media(max-height:620px){ #title{justify-content:center} }
.drift{position:absolute;inset:0;pointer-events:none;overflow:hidden;z-index:0}
.drift svg{position:absolute;bottom:-70px;opacity:.5;animation:drift linear infinite}
@keyframes drift{
  0%{transform:translateY(0) rotate(0);opacity:0}
  12%{opacity:.55}
  88%{opacity:.4}
  100%{transform:translateY(-118svh) rotate(320deg);opacity:0}}
.title-card{position:relative;z-index:1;width:min(94vw,540px);text-align:center}

.ribbon{position:relative;display:inline-block;margin-bottom:12px;padding:6px 26px;border-radius:9px;
  font-size:clamp(11px,2.9vw,14px);font-weight:900;letter-spacing:.1em;color:#fff;
  background:linear-gradient(180deg,#FF9E8A,#F4705C);
  box-shadow:0 4px 0 #C74B39,0 8px 14px rgba(90,40,20,.3)}
.ribbon::before,.ribbon::after{content:'';position:absolute;top:6px;width:0;height:0;
  border-top:11px solid transparent;border-bottom:11px solid transparent}
.ribbon::before{left:-11px;border-right:12px solid #D2543F}
.ribbon::after{right:-11px;border-left:12px solid #D2543F}

.blocks{display:flex;justify-content:center;gap:clamp(3px,1.1vw,7px);margin:2px 0 4px}
.blk{display:inline-flex;align-items:center;justify-content:center;
  width:clamp(40px,12.4vw,68px);height:clamp(46px,14vw,76px);border-radius:15px;
  font-family:'DotGothic16',sans-serif;font-size:clamp(27px,8.4vw,46px);color:#FFFDF5;
  border:3px solid rgba(255,255,255,.95);
  background:linear-gradient(170deg,var(--c1),var(--c2));
  box-shadow:0 7px 0 var(--c3),0 12px 20px rgba(70,38,16,.34),inset 0 3px 0 rgba(255,255,255,.45);
  transform:rotate(var(--r));animation:blkbob 2.6s ease-in-out infinite;animation-delay:calc(var(--i)*.11s);
  text-shadow:0 3px 0 rgba(0,0,0,.18)}
@keyframes blkbob{0%,100%{transform:rotate(var(--r)) translateY(0)}50%{transform:rotate(var(--r)) translateY(-8px)}}
.blk:nth-child(1){--c1:#FF8A80;--c2:#F0554A;--c3:#BE382F;--r:-4deg;--i:0}
.blk:nth-child(2){--c1:#FFD778;--c2:#F5AB2E;--c3:#C47D12;--r:3deg;--i:1}
.blk:nth-child(3){--c1:#7BDCA6;--c2:#43B678;--c3:#2C8A57;--r:-2deg;--i:2}
.blk:nth-child(4){--c1:#7CC1F0;--c2:#3E8FCC;--c3:#2A6A9C;--r:4deg;--i:3}
.blk:nth-child(5){--c1:#C2A8F0;--c2:#8E6FCE;--c3:#6A4CA4;--r:-3deg;--i:4}
.blk:nth-child(6){--c1:#FFA5D2;--c2:#E170AB;--c3:#B34E85;--r:2deg;--i:5}

.subtitle{font-weight:900;font-size:clamp(13px,3.5vw,18px);color:#7A4B24;margin-top:10px;
  text-shadow:0 2px 0 #FFF3DC,0 3px 6px rgba(255,255,255,.7)}
.hi{display:inline-flex;gap:9px;align-items:center;margin:12px 0 16px;
  background:linear-gradient(180deg,#FFFDF5,#FFECC9);
  border:2px solid #fff;border-radius:99px;padding:7px 20px;font-size:13px;font-weight:900;color:#8A5A2E;
  box-shadow:0 5px 0 rgba(120,72,38,.24),0 8px 14px rgba(90,50,20,.18)}
.hi i{width:14px;height:14px;background:linear-gradient(180deg,#FFE08A,#F0A128);
  border:2px solid #C9922B;border-radius:4px;display:block;animation:blkbob 1.8s ease-in-out infinite}
.hi b{font-family:'DotGothic16',sans-serif;font-size:17px;color:#E07B18}

/* hero start button */
.hero{position:relative;overflow:hidden;min-height:76px;
  background:linear-gradient(180deg,#FFE9A8,#FFC24D);border:3px solid #fff;color:#8A3F0C;
  box-shadow:0 8px 0 #D08A21,0 15px 26px rgba(90,50,20,.34);
  animation:heroPulse 2.4s ease-in-out infinite}
@keyframes heroPulse{0%,100%{transform:scale(1)}50%{transform:scale(1.035)}}
.hero:active{animation:none}
.hero::after{content:'';position:absolute;top:-60%;left:-45%;width:32%;height:230%;pointer-events:none;
  background:linear-gradient(90deg,rgba(255,255,255,0),rgba(255,255,255,.8),rgba(255,255,255,0));
  transform:rotate(18deg);animation:shine 3.4s ease-in-out infinite}
@keyframes shine{0%{left:-45%}55%{left:125%}100%{left:125%}}
.hero strong{font-size:26px;letter-spacing:.06em}
.hero small{opacity:.8}
.play-dot{display:inline-block;width:0;height:0;vertical-align:2px;margin-right:9px;
  border-left:15px solid #8A3F0C;border-top:9px solid transparent;border-bottom:9px solid transparent}

/* ---------- buttons ---------- */
.big-btn,.soft-btn,.stage,.char{font-family:inherit;font-weight:900;border:0;cursor:pointer}
.big-btn{width:min(90vw,340px);min-height:64px;border-radius:24px;font-size:19px;color:#8A4B18;
  background:linear-gradient(180deg,#FFFDF5,#FFE2B4);border:2px solid #fff;
  box-shadow:0 7px 0 #C98A4B,0 12px 22px rgba(80,48,22,.28);transition:transform .12s}
.big-btn strong{font-size:23px;display:block}
.big-btn small{display:block;font-size:12px;opacity:.72;margin-top:2px}
.big-btn:active,.soft-btn:active,.stage:active,.char:active{transform:translateY(4px);box-shadow:none}
.title-actions{display:grid;gap:12px;justify-items:center}
.mini-row{display:flex;gap:10px;margin-top:14px;justify-content:center;flex-wrap:wrap}
.soft-btn{min-height:44px;border-radius:18px;padding:9px 16px;font-size:13px;color:#7A4B24;
  background:rgba(255,253,245,.88);border:2px solid #fff;box-shadow:0 3px 0 rgba(120,72,38,.2)}

/* ---------- panel ---------- */
.panel{width:min(94vw,600px);max-height:calc(100svh - 28px - var(--sat,0px) - var(--sab,0px));overflow:auto;
  border:3px solid rgba(255,255,255,.9);border-radius:28px;padding:18px;text-align:center;
  background:linear-gradient(150deg,rgba(255,253,245,.96),rgba(255,232,201,.96));
  box-shadow:0 15px 34px rgba(74,45,22,.3)}
.panel h2{margin:0 0 6px;font-size:clamp(22px,6vw,32px);color:#8A4B18;font-family:'DotGothic16',sans-serif}
.panel p{margin:0 0 8px;font-weight:800;font-size:13px;color:#9A7048}

/* ---------- chars ---------- */
.char-grid{display:grid;grid-template-columns:repeat(2,minmax(120px,1fr));gap:12px;margin:14px 0}
.char{min-height:142px;border:3px solid #fff;border-radius:22px;padding-bottom:8px;font-size:15px;color:#7A4B24;
  background:linear-gradient(160deg,#FFFDF5,#FFF0D6);box-shadow:0 5px 0 #DDB98C;overflow:hidden}
.char svg{width:100%;height:92px;display:block}
.char small{display:block;font-size:10px;color:#A9835A;font-weight:800;margin-top:2px}
.char.sel{outline:3px solid var(--sun);outline-offset:-3px}

/* ---------- map ---------- */
.stage-list{display:grid;gap:9px;margin:12px 0}
.stage{display:flex;align-items:center;gap:11px;padding:9px 12px;text-align:left;border:2px solid #fff;
  border-radius:19px;color:#7A4B24;background:linear-gradient(140deg,#FFFDF5,#FFEFCF);box-shadow:0 4px 0 #DDB98C}
.stage.lock{filter:saturate(.15);opacity:.5;cursor:not-allowed}
.stage-num{width:40px;height:40px;flex:0 0 40px;border-radius:12px;display:grid;place-items:center;
  background:linear-gradient(180deg,#FFC84D,#F0A128);color:#fff;font-size:18px;
  box-shadow:inset 0 -3px rgba(150,90,20,.3)}
.stage b{display:block;font-size:15px}
.stage small{font-weight:800;font-size:11px;color:#A9835A}
.stage em{margin-left:auto;font-style:normal;color:#F0A128;font-size:15px;letter-spacing:1px;white-space:nowrap}
.mode-tag{display:inline-block;font-size:10px;padding:1px 7px;border-radius:8px;color:#fff;margin-right:5px;vertical-align:1px}
.m-fit{background:var(--sky)} .m-sort{background:var(--mint)} .m-shadow{background:var(--grape)}

/* ---------- shelf (collection) ---------- */
.shelf-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:10px;margin:12px 0}
.toy{border:2px solid #fff;border-radius:16px;padding:6px 4px 7px;background:linear-gradient(160deg,#FFFDF5,#FFF0D6);
  box-shadow:0 4px 0 #DDB98C;font-size:11px;font-weight:900;color:#7A4B24}
.toy svg{width:100%;height:54px;display:block}
.toy.locked{filter:grayscale(1) opacity(.42)}
.toy.locked span{color:#9C8570}

/* ---------- nav / hud ---------- */
#nav{position:absolute;z-index:14;top:calc(9px + var(--sat,0px));left:11px;right:11px;
  display:none;justify-content:space-between;pointer-events:none}
#nav>*{pointer-events:auto}
#nav button{border:2px solid #fff;border-radius:20px;padding:8px 13px;background:rgba(255,253,245,.93);
  color:#7A4B24;font:900 13px inherit;box-shadow:0 3px 0 rgba(120,72,38,.2);cursor:pointer}
#hud{position:absolute;z-index:13;left:50%;transform:translateX(-50%);top:calc(9px + var(--sat,0px));
  display:none;gap:8px;align-items:center;pointer-events:none}
.chip{min-width:86px;padding:5px 12px;border:2px solid #fff;border-radius:18px;text-align:center;color:#7A4B24;
  background:rgba(255,253,245,.93);box-shadow:0 3px 0 rgba(120,72,38,.18)}
.chip span{display:block;font-size:10px;font-weight:900;color:#A9835A}
.chip b{font-size:19px;font-family:'DotGothic16',sans-serif}

#task{position:absolute;z-index:12;left:50%;transform:translateX(-50%);top:calc(58px + var(--sat,0px));
  display:none;padding:7px 20px;border-radius:99px;border:2px solid #fff;font-size:15px;font-weight:900;
  color:#7A4B24;background:rgba(255,253,245,.93);box-shadow:0 4px 0 rgba(120,72,38,.2);white-space:nowrap}

/* ---------- toast / fx ---------- */
.toast{position:absolute;z-index:16;font-size:22px;font-weight:900;color:#fff;pointer-events:none;
  text-shadow:0 3px #C9782B,0 0 12px rgba(255,200,80,.8);animation:toast 1s forwards;
  transform:translate(-50%,-50%)}
@keyframes toast{to{transform:translate(-50%,-50%) translateY(-72px) scale(1.3);opacity:0}}
#cheer{position:absolute;z-index:15;inset:0;display:grid;place-items:center;pointer-events:none;opacity:0;
  font-family:'DotGothic16',sans-serif;font-size:clamp(34px,10vw,62px);color:#FFFDF5;
  text-shadow:0 5px 0 var(--sun),0 9px 0 rgba(150,90,20,.5),0 0 26px rgba(255,220,140,.9)}
#cheer.show{animation:cheer 1.1s ease-out}
@keyframes cheer{0%{opacity:0;transform:scale(.4)}22%{opacity:1;transform:scale(1.12)}72%{opacity:1;transform:scale(1)}100%{opacity:0;transform:scale(1.25)}}
.confetti{position:absolute;inset:0;overflow:hidden;pointer-events:none;border-radius:28px}
.confetti i{position:absolute;top:-16px;width:9px;height:14px;border-radius:4px;animation:fall 3s linear infinite}
@keyframes fall{to{transform:translateY(120svh) rotate(560deg)}}
.stars-big{font-size:40px;letter-spacing:5px;color:#F0A128;text-shadow:0 3px #B9721C}
.reward{margin:8px auto 4px;width:132px;height:110px}
.reward svg{width:100%;height:100%;display:block;animation:pop .7s cubic-bezier(.2,1.5,.4,1)}
@keyframes pop{0%{transform:scale(0) rotate(-25deg)}100%{transform:scale(1) rotate(0)}}
.result-actions{display:grid;gap:9px;margin-top:12px}

/* ---------- fallback ---------- */
#fallback{position:absolute;inset:0;z-index:60;display:none;place-items:center;padding:24px;text-align:center;
  background:linear-gradient(180deg,#FFF6E3,#E4BC8C);color:#7A4B24;font-weight:900}
@media(min-width:720px){ .screen{width:720px;left:50%;right:auto;transform:translateX(-50%)}
  .screen.off{transform:translateX(-50%) scale(1.04)} }
</style>
</head>
<body>
<main id="app">
<canvas id="gl"></canvas>

<div id="nav"><button id="back" data-ww-ui="back">← もどる</button><button id="music" data-ww-ui="sound">おと ♪</button></div>
<div id="hud">
  <div class="chip"><span>のこり</span><b id="left">0</b></div>
  <div class="chip"><span>ぴったり</span><b id="combo">0</b></div>
</div>
<div id="task">まるを さがそう！</div>
<div id="cheer">ぴったり！</div>

<!-- ===== title ===== -->
<section class="screen" id="title">
  <div class="drift" id="drift"></div>
  <div class="title-card">
    <div class="ribbon">おもちゃ こうじょうへ ようこそ</div>
    <div class="blocks"><span class="blk">か</span><span class="blk">た</span><span class="blk">ち</span><span class="blk">あ</span><span class="blk">わ</span><span class="blk">せ</span></div>
    <div class="subtitle">かたちを はめて<br>じぶんだけの おもちゃを つくろう！</div>
    <div class="hi"><i></i> あつめた おもちゃ <b id="hiCount">0</b> / 10</div>
    <div class="title-actions">
      <button class="big-btn hero" id="start"><strong><span class="play-dot"></span>はじめる</strong><small>ゆびで つまんで はこぼう</small></button>
    </div>
    <div class="mini-row">
      <button class="soft-btn" id="toShelf">おもちゃだな</button>
      <button class="soft-btn" id="titleMusic">おと ♪</button>
      <button class="soft-btn" id="goBack">← もどる</button>
    </div>
  </div>
</section>

<!-- ===== characters ===== -->
<section class="screen off" id="chars">
  <div class="panel">
    <h2>だれと つくる？</h2>
    <p>すきな なかまを えらんでね</p>
    <div class="char-grid" id="charGrid"></div>
    <button class="soft-btn" data-home>← もどる</button>
  </div>
</section>

<!-- ===== map ===== -->
<section class="screen off" id="map">
  <div class="panel">
    <h2>こうじょうの おしごと</h2>
    <p>どの おしごとを する？</p>
    <div class="stage-list" id="stages"></div>
    <div class="mini-row">
      <button class="soft-btn" id="mapShelf">おもちゃだな</button>
      <button class="soft-btn" data-home>← もどる</button>
    </div>
  </div>
</section>

<!-- ===== shelf ===== -->
<section class="screen off" id="shelf">
  <div class="panel">
    <h2>おもちゃだな</h2>
    <p>おしごとを クリアすると あつまるよ</p>
    <div class="shelf-grid" id="shelfGrid"></div>
    <button class="soft-btn" id="shelfBack">← もどる</button>
  </div>
</section>

<!-- ===== result ===== -->
<section class="screen off" id="result">
  <div class="confetti" id="confetti"></div>
  <div class="panel">
    <h2 id="resultTitle">できあがり！</h2>
    <div class="stars-big" id="resultStars">★★★</div>
    <div class="reward" id="rewardArt"></div>
    <p id="rewardName">つみき が できた！</p>
    <div class="result-actions">
      <button class="big-btn" id="nextStage"><strong>つぎの おしごと</strong></button>
      <button class="soft-btn" id="retry">もういちど</button>
      <button class="soft-btn" id="toMap">おしごとを えらぶ</button>
    </div>
  </div>
</section>

<div id="fallback">
  <div>
    <p style="font-size:19px">ごめんね、この ブラウザでは<br>あそべないみたい…</p>
    <p style="font-size:13px;margin-top:10px">べつの ブラウザで ひらいてみてね</p>
    <button class="soft-btn" style="margin-top:14px" onclick="parent.postMessage({type:'goBack'},'*')">← もどる</button>
  </div>
</div>
</main>
<script>
(function(){
'use strict';

/* ============================================================
   かたちあわせ v2  —  おもちゃこうじょう (Three.js r128)
   ============================================================ */

var $ = function(id){ return document.getElementById(id); };
var TAU = Math.PI * 2;
var clamp = function(v,a,b){ return v<a?a:(v>b?b:v); };
var lerp  = function(a,b,t){ return a+(b-a)*t; };
var rand  = function(a,b){ return a+Math.random()*(b-a); };
var pick  = function(arr){ return arr[(Math.random()*arr.length)|0]; };

/* ---------- storage ---------- */
var SAFE_LS = (function(){
  try{ var k='__ww_ka_test__'; localStorage.setItem(k,k); localStorage.removeItem(k); return localStorage; }
  catch(e){ var m={}; return { getItem:function(k){return m[k]||null;}, setItem:function(k,v){m[k]=String(v);} }; }
})();
var KEY = 'katachi_v2_progress';
var STAGE_COUNT = 10;
function defaultSave(){ return { schemaVersion:2, stars:{}, unlocked:1, buddy:0 }; }
function normalizeSave(o){
  var out = defaultSave();
  if(!o || typeof o !== 'object' || Array.isArray(o)) return out;
  if(o.stars && typeof o.stars === 'object' && !Array.isArray(o.stars)){
    for(var i=0;i<STAGE_COUNT;i++){
      var v = o.stars[i];
      if(typeof v === 'number' && isFinite(v)) out.stars[i] = clamp(Math.round(v), 0, 3);
    }
  }
  out.unlocked = (typeof o.unlocked === 'number' && isFinite(o.unlocked))
    ? clamp(Math.round(o.unlocked), 1, STAGE_COUNT) : 1;
  out.buddy = (typeof o.buddy === 'number' && isFinite(o.buddy))
    ? clamp(Math.round(o.buddy), 0, 3) : 0;
  return out;
}
function loadSave(){
  try{ return normalizeSave(JSON.parse(SAFE_LS.getItem(KEY))); }catch(e){}
  return defaultSave();
}
function persist(){ try{ SAFE_LS.setItem(KEY, JSON.stringify(save)); }catch(e){} }
var save = loadSave();

/* ---------- shapes ---------- */
var KINDS = ['circle','triangle','square','star','heart','diamond','hexagon'];
var SHAPE_NAME = { circle:'まる', triangle:'さんかく', square:'しかく', star:'ほし',
                   heart:'ハート', diamond:'ダイヤ', hexagon:'ろっかく' };
var SHAPE_COL  = { circle:0xFF6B6B, triangle:0x5BC98C, square:0x5AA9E6, star:0xFFC84D,
                   heart:0xFF8FC6, diamond:0xA98CE0, hexagon:0xFF9F5A };

/* ---------- buddies ---------- */
var BUDDIES = [
  { id:'kuma', name:'くまの コロ',  sub:'ちからもち',   fur:0xC58A5A, accent:0xFFE0B2, cheek:0xFFA7A7 },
  { id:'neko', name:'ねこの ミケ',  sub:'すばしっこい', fur:0xFFD9A0, accent:0xFF9F5A, cheek:0xFFB3B3 },
  { id:'usa',  name:'うさぎの ラビ', sub:'ぴょんぴょん', fur:0xFFF3E6, accent:0xFFB6D5, cheek:0xFFC2D6 },
  { id:'robo', name:'ロボの ピコ',  sub:'はかせ',       fur:0x9EDCD0, accent:0x5AA9E6, cheek:0xFFD166 }
];

/* ---------- audio blips ---------- */
var actx = null;
function blip(freq, dur, vol, type){
  try{
    if(!actx) actx = new (window.AudioContext || window.webkitAudioContext)();
    if(actx.state === 'suspended') actx.resume();
    var o = actx.createOscillator(), g = actx.createGain();
    o.type = type || 'triangle';
    o.frequency.value = freq;
    o.connect(g); g.connect(actx.destination);
    g.gain.setValueAtTime(vol || 0.14, actx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, actx.currentTime + (dur || 0.1));
    o.start(); o.stop(actx.currentTime + (dur || 0.1));
  }catch(e){}
}

var SHARED_GEO = new Set();
var SHARED_MAT = new Set();

var MAT_CACHE = {};
function toyMat(color, shiny){
  var key = color + '_' + (shiny ? 1 : 0);
  if(!MAT_CACHE[key]){
    MAT_CACHE[key] = new THREE.MeshPhongMaterial({
      color: color, shininess: shiny ? 70 : 18,
      specular: shiny ? 0x9a8a70 : 0x2a2018, flatShading: false
    });
    SHARED_MAT.add(MAT_CACHE[key]);
  }
  return MAT_CACHE[key];
}
function mesh(geo, mat, x, y, z){
  var m = new THREE.Mesh(geo, mat);
  m.position.set(x||0, y||0, z||0);
  return m;
}

/* ---------- shape outlines ---------- */
function polyShape(pts, round){
  var s = new THREE.Shape();
  s.moveTo(pts[0][0], pts[0][1]);
  for(var i=1;i<pts.length;i++) s.lineTo(pts[i][0], pts[i][1]);
  s.closePath();
  return s;
}
function shapeOutline(kind){
  var s, i, a, r, pts;
  if(kind === 'circle'){
    s = new THREE.Shape(); s.absarc(0,0,1,0,TAU,false); return s;
  }
  if(kind === 'square'){
    s = new THREE.Shape(); var k=0.88, c=0.2;
    s.moveTo(-k+c, -k);
    s.lineTo(k-c,-k); s.quadraticCurveTo(k,-k,k,-k+c);
    s.lineTo(k,k-c);  s.quadraticCurveTo(k,k,k-c,k);
    s.lineTo(-k+c,k); s.quadraticCurveTo(-k,k,-k,k-c);
    s.lineTo(-k,-k+c);s.quadraticCurveTo(-k,-k,-k+c,-k);
    return s;
  }
  if(kind === 'triangle') return polyShape([[0,1.05],[0.95,-0.66],[-0.95,-0.66]]);
  if(kind === 'diamond')  return polyShape([[0,1.12],[0.82,0],[0,-1.12],[-0.82,0]]);
  if(kind === 'hexagon'){
    pts = [];
    for(i=0;i<6;i++){ a = Math.PI/2 + i*TAU/6; pts.push([Math.cos(a)*1.0, Math.sin(a)*1.0]); }
    return polyShape(pts);
  }
  if(kind === 'star'){
    pts = [];
    for(i=0;i<10;i++){ r = (i%2===0)?1.08:0.5; a = Math.PI/2 + i*Math.PI/5; pts.push([Math.cos(a)*r, Math.sin(a)*r]); }
    return polyShape(pts);
  }
  /* heart */
  s = new THREE.Shape();
  s.moveTo(0, -0.98);
  s.bezierCurveTo(-0.55,-0.45, -1.15,-0.05, -1.05,0.5);
  s.bezierCurveTo(-0.98,0.98, -0.32,1.06, 0,0.55);
  s.bezierCurveTo(0.32,1.06, 0.98,0.98, 1.05,0.5);
  s.bezierCurveTo(1.15,-0.05, 0.55,-0.45, 0, -0.98);
  return s;
}

var GEO_SOLID = {}, GEO_FLAT = {};
function solidGeo(kind){
  if(!GEO_SOLID[kind]){
    var g = new THREE.ExtrudeGeometry(shapeOutline(kind), {
      depth:0.34, bevelEnabled:true, bevelThickness:0.07, bevelSize:0.07,
      bevelSegments:3, curveSegments:22, steps:1
    });
    g.center();
    g.rotateX(-Math.PI/2);
    GEO_SOLID[kind] = g;
    SHARED_GEO.add(g);
  }
  return GEO_SOLID[kind];
}
function flatGeo(kind){
  if(!GEO_FLAT[kind]){
    var g = new THREE.ShapeGeometry(shapeOutline(kind), 22);
    g.center();
    g.rotateX(-Math.PI/2);
    GEO_FLAT[kind] = g;
    SHARED_GEO.add(g);
  }
  return GEO_FLAT[kind];
}

/* ピースの つやハイライトは 1マテリアルを 使い回す */
var CAP_MAT = null;
function capMat(){
  if(!CAP_MAT){
    CAP_MAT = new THREE.MeshBasicMaterial({ color:0xffffff, transparent:true, opacity:0.17, depthWrite:false });
    SHARED_MAT.add(CAP_MAT);
  }
  return CAP_MAT;
}

/* a playable 3D shape piece */
function makePiece(kind, scale){
  var g = new THREE.Group();
  var body = mesh(solidGeo(kind), toyMat(SHAPE_COL[kind], true));
  body.castShadow = true;
  g.add(body);
  /* glossy highlight cap */
  var cap = mesh(flatGeo(kind), capMat(), 0, 0.185, 0);
  cap.scale.setScalar(0.74);
  g.add(cap);
  g.scale.setScalar(scale);
  g.userData = { kind:kind, size:scale, body:body };
  return g;
}

  function gear(x,y,r,col,dir){

    g.add(mesh(new THREE.CylinderGeometry(r, r, 0.3, 24), toyMat(col)));
    for(var i=0;i<10;i++){
      var a = i*TAU/10;
      var t = mesh(new THREE.BoxGeometry(r*0.3, 0.3, r*0.34), toyMat(col),
                   Math.cos(a)*r, 0, Math.sin(a)*r);
      t.rotation.y = -a;
      g.add(t);
    }
    g.add(mesh(new THREE.CylinderGeometry(r*0.22, r*0.22, 0.36, 14), toyMat(0xF0DCC0)));
    g.rotation.x = Math.PI/2;
    g.position.set(x, y, -10.6);
    g.userData.spin = dir;
    gears.push(g);
    room.add(g);
  }
  gear(-7.6, 9.6, 1.5, 0xC98A4B, 0.5);
  gear(-5.0, 10.4, 1.0, 0xE0A96A, -0.75);
  gear( 7.6, 9.4, 1.3, 0xC98A4B, -0.55);
  room.userData.gears = gears;

  /* hanging lamps */
  var lamps = [];
  for(var L=-1; L<=1; L++){
    var lamp = new THREE.Group();
    lamp.add(mesh(new THREE.CylinderGeometry(0.05,0.05,3.4,8), toyMat(0x8A6B4A), 0, 1.7, 0));
    var shade = mesh(new THREE.ConeGeometry(1.0, 0.85, 18, 1, true), new THREE.MeshPhongMaterial({
      color:0xFF8A7A, side:THREE.DoubleSide, shininess:40
    }), 0, 0.1, 0);
    lamp.add(shade);
    lamp.add(mesh(new THREE.SphereGeometry(0.26,12,10), new THREE.MeshBasicMaterial({color:0xFFF0C0}), 0, -0.18, 0));
    lamp.position.set(L*5.4, 8.2, -6.2);
    lamp.userData.phase = L;
    lamps.push(lamp);
    room.add(lamp);
  }
  room.userData.lamps = lamps;

  /* bunting */
  var bunt = new THREE.Group();
  for(var f=0; f<13; f++){
    var t = f/12, px = -9 + t*18, py = 10.6 - Math.sin(t*Math.PI)*1.0;
    var flag = mesh(new THREE.ConeGeometry(0.34, 0.75, 3),
                    toyMat([0xFF6B6B,0xFFC84D,0x5BC98C,0x5AA9E6,0xFF8FC6][f%5]), px, py-0.4, -9.4);
    flag.rotation.x = Math.PI;
    bunt.add(flag);
  }
  room.add(bunt);

  return room;
}

/* ============================================================
   チューニングち（じっさいの こどもテストで ちょうせいする かのうせいが たかい あたい）
   ============================================================ */
var TUNE = {
  FIT_DROP_RADIUS: 1.05,   /* かたはめ: あなの近くと みなす きょり */
  SORT_DROP_RADIUS: 1.45,  /* しわけ: はこの近くと みなす きょり */
  SORT_SPAWN_SEC: 0.55,    /* しわけ: ベルトに つぎの かたちが でてくる かんかく(びょう) */
  SHADOW_TILT: 0.22,       /* かげあわせ: シルエットの さいだい かたむき(ラジアン) */
  PARTICLE_MAX: 180,       /* どうじに でる きらきらの じょうげん */
  BIG_SIZE: 0.62,          /* おおきい ピースの サイズ */
  SMALL_SIZE: 0.42,        /* ちいさい ピースの サイズ */
  LIFT_Y: 1.18             /* ドラッグちゅうに ピースが うく たかさ */
};

/* ============================================================
   layout helpers
   ============================================================ */
var BOARD_TOP = 0.5, TRAY_TOP = 0.44, LIFT_Y = TUNE.LIFT_Y;
var BIG = TUNE.BIG_SIZE, SMALL = TUNE.SMALL_SIZE;

var GEO_XY = {};
function flatGeoXY(kind){
  if(!GEO_XY[kind]){ var g = new THREE.ShapeGeometry(shapeOutline(kind), 22); g.center(); GEO_XY[kind] = g; SHARED_GEO.add(g); }
  return GEO_XY[kind];
}
function gridSpots(n, cols){
  var rows = Math.ceil(n/cols), spots = [], i, r, inRow, startX;
  var sx = 1.62, sz = rows >= 4 ? 1.26 : 1.42;
  var z0 = -0.45 - (rows-1)*sz;
  var placed = 0;
  for(r=0; r<rows; r++){
    inRow = Math.min(cols, n - placed);
    startX = -(inRow-1)*sx/2;
    for(i=0;i<inRow;i++) spots.push({ x:startX + i*sx, z:z0 + r*sz });
    placed += inRow;
  }
  return spots;
}
function boxPts(hw, y0, y1, z0, z1){
  var out = [];
  [-hw, hw].forEach(function(x){
    [y0, y1].forEach(function(y){
      [z0, z1].forEach(function(z){ out.push(new THREE.Vector3(x, y, z)); });
    });
  });
  return out;
}
function shuffle(a){
  for(var i=a.length-1;i>0;i--){ var j=(Math.random()*(i+1))|0, t=a[i]; a[i]=a[j]; a[j]=t; }
  return a;
}

/* ============================================================
   game state
   ============================================================ */
var MENU_PTS = [];
var G = {
  stage:0, cfg:null, mode:'fit', active:false,
  holes:[], pieces:[], tray:[], queue:[], bins:[], candidates:[],
  dragging:null, dragOffset:new THREE.Vector3(), dragPointerId:null,
  remain:0, done:0, misses:0, target:null, silhouette:null, board:null
};

/* 画面遷移(新ステージ/マップへ戻る/リザルト等)のたびに更新する。
   古いsetTimeoutは実行時にこれと一致しなければ何もしない。 */
var flowToken = 0;

/* stageGroup配下の geometry / material のうち、共有キャッシュに
   登録されていないものだけを破棄する（キャッシュは誤って壊さない） */
function disposeGroup(group){
  group.traverse(function(obj){
    if(!obj.isMesh) return;
    if(obj.geometry && !SHARED_GEO.has(obj.geometry)) obj.geometry.dispose();
    var mats = Array.isArray(obj.material) ? obj.material : (obj.material ? [obj.material] : []);
    mats.forEach(function(m){
      if(SHARED_MAT.has(m)) return;
      if(m.map) m.map.dispose();
      m.dispose();
    });
  });
}
function clearSparks(){
  for(var i=sparks.length-1;i>=0;i--){ if(sparks[i].m) scene.remove(sparks[i].m); }
  sparks.length = 0;
}

function clearStage(){
  flowToken++;
  cancelDrag();
  if(stageGroup){
    /* buddyModelは使い回すので破棄対象から外す */
    if(buddyModel && buddyModel.parent === stageGroup) stageGroup.remove(buddyModel);
    disposeGroup(stageGroup);
    scene.remove(stageGroup);
  }
  clearSparks();
  stageGroup = new THREE.Group();
  scene.add(stageGroup);
  G.holes = []; G.pieces = []; G.tray = []; G.queue = [];
  G.bins = []; G.candidates = []; G.dragging = null;
  G.silhouette = null; G.board = null; G.fitPts = [];
  G.orbit = null; G.balloons = [];
}

/* ---------- shared props ---------- */
function makeTrayPlatform(){
  var tw = G.traySx * (G.trayMax - 1) + 1.65;
  var td = 1.55, cz = G.trayZ0;
  var t = mesh(new THREE.BoxGeometry(tw, 0.44, td), toyMat(0xCB9257), 0, 0.22, cz);
  t.receiveShadow = true;
  stageGroup.add(t);
  stageGroup.add(mesh(new THREE.BoxGeometry(tw + 0.26, 0.2, td + 0.26), toyMat(0x9C6231), 0, 0.1, cz));
  stageGroup.add(mesh(new THREE.BoxGeometry(tw, 0.2, 0.16), toyMat(0x8A5A2E), 0, 0.53, cz + td/2));
  G.trayFront = cz + td/2 + 0.5;
}
function trayPos(i){
  var n = G.tray.length, sx = G.traySx;
  return { x: -(n - 1) * sx / 2 + i * sx, z: G.trayZ0 };
}

/* ============================================================
   MODE: fit  (はめる)
   ============================================================ */
function buildFit(cfg){
  var aspect = window.innerWidth / window.innerHeight;
  var narrow = aspect < 0.85;
  var cols = narrow ? Math.min(2, cfg.cols) : cfg.cols;
  G.trayMax = narrow ? 3 : 4;
  G.traySx  = narrow ? 1.56 : 1.5;
  G.trayZ0  = 2.45;
  var spots = gridSpots(cfg.n, cols);
  var kinds = [], i;
  for(i=0;i<cfg.n;i++) kinds.push(cfg.kinds[i % cfg.kinds.length]);
  shuffle(kinds);
  var sizes = [];
  for(i=0;i<cfg.n;i++) sizes.push(cfg.sizes ? (i%2 ? SMALL : BIG) : BIG);
  shuffle(sizes);

  /* board */
  var maxZ = -9, minZ = 9, maxX = 0;
  spots.forEach(function(s){ if(s.z>maxZ)maxZ=s.z; if(s.z<minZ)minZ=s.z; if(Math.abs(s.x)>maxX)maxX=Math.abs(s.x); });
  var bw = maxX*2 + 1.5, bd = (maxZ-minZ) + 1.5, bz = (maxZ+minZ)/2;
  var board = mesh(new THREE.BoxGeometry(bw, BOARD_TOP, bd), toyMat(0xF3DCB6), 0, BOARD_TOP/2, bz);
  board.receiveShadow = true; board.castShadow = true;
  stageGroup.add(board);
  G.board = board;
  /* raised trim around the board */
  var frame = mesh(new THREE.BoxGeometry(bw+0.42, 0.34, bd+0.42), toyMat(0xC9782B), 0, 0.17, bz);
  frame.castShadow = true; frame.receiveShadow = true;
  stageGroup.add(frame);
  stageGroup.add(mesh(new THREE.BoxGeometry(bw+0.62, 0.16, bd+0.62), toyMat(0x9C6231), 0, 0.08, bz));
  /* corner studs */
  [[-1,-1],[1,-1],[-1,1],[1,1]].forEach(function(c){
    stageGroup.add(mesh(new THREE.CylinderGeometry(0.13,0.13,0.12,10), toyMat(0xFFD166,true),
      c[0]*(bw/2+0.12), 0.36, bz + c[1]*(bd/2+0.12)));
  });

  /* holes */
  spots.forEach(function(s, idx){
    var kind = kinds[idx], sc = sizes[idx];
    var h = new THREE.Group();
    h.position.set(s.x, 0, s.z);
    var glow = mesh(flatGeo(kind), new THREE.MeshBasicMaterial({
      color:0xFFE9A8, transparent:true, opacity:0, depthWrite:false
    }), 0, BOARD_TOP+0.008, 0);
    glow.scale.setScalar(sc*1.42);
    var rim = mesh(flatGeo(kind), toyMat(0x9C6231), 0, BOARD_TOP+0.014, 0);
    rim.scale.setScalar(sc*1.16);
    var pit = mesh(flatGeo(kind), new THREE.MeshBasicMaterial({color:0x3A2A1E}), 0, BOARD_TOP+0.022, 0);
    pit.scale.setScalar(sc);
    h.add(glow); h.add(rim); h.add(pit);
    h.userData = { kind:kind, size:sc, filled:false, glow:glow, rim:rim, pulse:Math.random()*TAU };
    stageGroup.add(h);
    G.holes.push(h);
  });

  makeTrayPlatform();

  /* pieces (same multiset as holes, shuffled order) */
  var bag = [];
  spots.forEach(function(s, idx){ bag.push({ kind:kinds[idx], size:sizes[idx] }); });
  shuffle(bag);
  G.queue = bag;
  refillTray();
  G.remain = cfg.n;
  var buddyZ = bz - bd/2 - 1.35;
  G.buddySpot = { x:0, z: buddyZ, ry:0, s:0.92 };
  var trayHw = G.traySx * (G.trayMax - 1) / 2 + 0.85;
  G.fitPts = boxPts(bw/2 + 0.35, 0.1, 0.75, bz - bd/2 - 0.3, bz + bd/2 + 0.3)
    .concat(boxPts(trayHw, 0.1, 0.85, G.trayZ0 - 0.95, G.trayFront))
    .concat([ new THREE.Vector3(-0.85, 2.55, buddyZ), new THREE.Vector3(0.85, 2.55, buddyZ) ]);
  setTask('かたちを あなに はめよう！');
}

function refillTray(){
  var cap = G.trayMax || 4;
  while(G.tray.length < Math.min(cap, G.queue.length + G.tray.length) && G.queue.length){
    var d = G.queue.shift();
    var p = makePiece(d.kind, d.size);
    p.userData.home = new THREE.Vector3(0, TRAY_TOP + d.size*0.26, G.trayZ0);
    p.userData.state = 'tray';
    p.userData.rest = 'tray';
    p.userData.wob = Math.random()*TAU;
    stageGroup.add(p);
    G.tray.push(p);
    G.pieces.push(p);
  }
  layoutTray();
}
function layoutTray(){
  G.tray.forEach(function(p, i){
    var q = trayPos(i);
    p.userData.home.set(q.x, TRAY_TOP + p.userData.size*0.26, q.z);
  });
}

/* ============================================================
   MODE: sort  (しわける)
   ============================================================ */
function buildSort(cfg){
  var beltLen = 7.2;
  var belt = mesh(new THREE.BoxGeometry(2.9, 0.34, beltLen), toyMat(0x5A4A3C), 0, 0.3, -1.6);
  belt.receiveShadow = true;
  stageGroup.add(belt);
  var rollers = [];
  for(var z=-5.0; z<=1.8; z+=0.62){
    var r = mesh(new THREE.CylinderGeometry(0.2,0.2,3.0,14), toyMat(0xC9B79E), 0, 0.5, z);
    r.rotation.z = Math.PI/2;
    rollers.push(r);
    stageGroup.add(r);
  }
  stageGroup.userData.rollers = rollers;
  /* side rails */
  for(var sx=0; sx<2; sx++){
    var d = sx? 1 : -1;
    stageGroup.add(mesh(new THREE.BoxGeometry(0.2, 0.5, beltLen), toyMat(0xB87B42), d*1.6, 0.5, -1.6));
  }
  /* legs */
  [-4.4, -0.6, 1.4].forEach(function(z){
    stageGroup.add(mesh(new THREE.BoxGeometry(0.26,0.6,0.26), toyMat(0x8A5A2E), -1.4, 0.0, z));
    stageGroup.add(mesh(new THREE.BoxGeometry(0.26,0.6,0.26), toyMat(0x8A5A2E),  1.4, 0.0, z));
  });

  /* bins */
  var binDefs = [], i;
  if(cfg.bySize){
    binDefs = [ { label:'big', kind:cfg.kinds[0], scale:1.0 }, { label:'small', kind:cfg.kinds[0], scale:0.58 } ];
  } else {
    for(i=0;i<cfg.bins;i++) binDefs.push({ label:cfg.kinds[i], kind:cfg.kinds[i], scale:1.0 });
  }
  var bx = binDefs.length === 2 ? [-1.75, 1.75] : [-2.3, 0, 2.3];
  binDefs.forEach(function(bd, idx){
    var b = new THREE.Group();
    b.position.set(bx[idx], 0, 2.85);
    var col = cfg.bySize ? (bd.label==='big' ? 0xFFC84D : 0x9EDCD0) : SHAPE_COL[bd.kind];
    var box = mesh(new THREE.BoxGeometry(1.55, 0.95, 1.25), toyMat(0xE0B382), 0, 0.48, 0);
    box.receiveShadow = true; box.castShadow = true;
    b.add(box);
    b.add(mesh(new THREE.BoxGeometry(1.68, 0.16, 1.38), toyMat(col, true), 0, 1.0, 0));
    /* icon plate facing camera */
    var plate = mesh(new THREE.BoxGeometry(1.3, 0.86, 0.08), toyMat(0xFFFBF2), 0, 0.52, 0.66);
    b.add(plate);
    var icon = mesh(flatGeoXY(bd.kind), toyMat(col, true), 0, 0.52, 0.73);
    icon.scale.setScalar(0.31 * bd.scale);
    b.add(icon);
    b.userData = { def:bd, wob:0 };
    stageGroup.add(b);
    G.bins.push(b);
  });

  /* queue of shapes */
  var bag = [];
  for(i=0;i<cfg.n;i++){
    var kind = cfg.kinds[i % cfg.kinds.length];
    var sc = cfg.bySize ? (i%2 ? BIG : SMALL) : BIG;
    bag.push({ kind:kind, size:sc });
  }
  shuffle(bag);
  G.queue = bag;
  G.remain = cfg.n;
  G.beltSpeed = cfg.speed;
  G.spawnTimer = 0;
  G.buddySpot = { x:0, z:-6.5, ry:0, s:0.9 };
  var binHw = bx[bx.length-1] + 0.95;
  G.fitPts = boxPts(1.85, 0.2, 0.95, -5.4, 1.4)
    .concat(boxPts(binHw, 0.05, 1.15, 2.2, 3.55))
    .concat([ new THREE.Vector3(-0.85, 2.5, -6.5), new THREE.Vector3(0.85, 2.5, -6.5) ]);
  setTask(cfg.bySize ? 'おおきさで わけよう！' : 'おなじ かたちの はこへ！');
}

function spawnBeltPiece(){
  if(!G.queue.length) return;
  var onBelt = G.pieces.filter(function(p){ return p.userData.state === 'belt'; });
  if(onBelt.length >= 3) return;
  var frontZ = -5.2;
  for(var i=0;i<onBelt.length;i++) if(onBelt[i].position.z < frontZ + 1.2) return;
  var d = G.queue.shift();
  var p = makePiece(d.kind, d.size);
  p.position.set(0, 0.47 + d.size*0.26, -5.2);
  p.userData.state = 'belt';
  p.userData.rest = 'belt';
  p.userData.wob = Math.random()*TAU;
  stageGroup.add(p);
  G.pieces.push(p);
}

/* ============================================================

function buildShadow(cfg){

  panel.receiveShadow = true;
  stageGroup.add(panel);
  stageGroup.add(mesh(new THREE.BoxGeometry(5.0, 0.28, 0.42), toyMat(0xB87B42), 0, 4.45, -3.2));
  stageGroup.add(mesh(new THREE.BoxGeometry(5.0, 0.28, 0.42), toyMat(0xB87B42), 0, 0.78, -3.2));
  stageGroup.add(mesh(new THREE.BoxGeometry(0.28, 3.9, 0.42), toyMat(0xB87B42), -2.42, 2.6, -3.2));
  stageGroup.add(mesh(new THREE.BoxGeometry(0.28, 3.9, 0.42), toyMat(0xB87B42),  2.42, 2.6, -3.2));
  /* easel legs */
  [-1.75, 1.75].forEach(function(lx){
    var leg = mesh(new THREE.BoxGeometry(0.26, 1.05, 0.26), toyMat(0x9C6231), lx, 0.42, -3.1);
    leg.castShadow = true; stageGroup.add(leg);
    var foot = mesh(new THREE.BoxGeometry(0.5, 0.2, 1.0), toyMat(0x8A5A2E), lx, 0.1, -2.85);
    stageGroup.add(foot);
  });
  stageGroup.add(mesh(new THREE.BoxGeometry(3.9, 0.18, 0.24), toyMat(0x9C6231), 0, 0.5, -2.95));

  var sil = mesh(flatGeoXY('circle'), new THREE.MeshBasicMaterial({ color:0x33261C }), 0, 2.6, -3.02);
  sil.scale.setScalar(1.15);
  stageGroup.add(sil);
  G.silhouette = sil;

  /* pedestal table */
  var table = mesh(new THREE.BoxGeometry(5.6, 0.45, 1.9), toyMat(0xE0B382), 0, 0.22, 1.7);
  table.receiveShadow = true;
  stageGroup.add(table);
  stageGroup.add(mesh(new THREE.BoxGeometry(5.9, 0.2, 2.2), toyMat(0xB87B42), 0, 0.05, 1.7));

  G.remain = cfg.n;
  G.round = 0;
  G.buddySpot = { x:2.75, z:-1.1, ry:-0.55, s:0.86 };
  G.fitPts = boxPts(2.65, 0.35, 4.65, -3.45, -2.75)
    .concat(boxPts(3.05, 0.05, 1.05, 0.7, 2.75))
    .concat([ new THREE.Vector3(3.5, 2.3, -1.1), new THREE.Vector3(2.0, 0.1, -1.1) ]);
  setTask('かげと おなじ かたちは どれ？');
  nextShadowRound();
}

function nextShadowRound(){
  var cfg = G.cfg;
  G.candidates.forEach(function(c){
    stageGroup.remove(c);
    var ci = G.pieces.indexOf(c);
    if(ci >= 0) G.pieces.splice(ci, 1);
  });
  G.candidates = [];
  var pool = shuffle(cfg.kinds.slice()).slice(0, cfg.choices);
  if(pool.length < cfg.choices){
    var extra = shuffle(KINDS.filter(function(k){ return pool.indexOf(k)<0; }));
    while(pool.length < cfg.choices) pool.push(extra.pop());
  }
  var answer = pick(pool);
  G.target = answer;
  G.silhouette.geometry = flatGeoXY(answer);
  G.silhouette.rotation.z = rand(-TUNE.SHADOW_TILT, TUNE.SHADOW_TILT);

  shuffle(pool);
  var span = pool.length, sx = span >= 4 ? 1.42 : 1.72;
  pool.forEach(function(kind, i){
    var p = makePiece(kind, 0.56);
    p.position.set(-(span-1)*sx/2 + i*sx, 0.45 + 0.2, 1.7);
    p.userData.state = 'candidate';
    p.userData.spin = rand(0.25, 0.55) * (Math.random()<0.5?-1:1);
    p.userData.wob = Math.random()*TAU;
    stageGroup.add(p);
    G.candidates.push(p);
  });
}

/* ============================================================
   stage lifecycle
   ============================================================ */
function setTask(text){ var t = $('task'); t.textContent = text; t.style.display = 'block'; }

function startStage(idx){
  G.stage = idx;
  G.cfg = STAGES[idx];
  G.mode = G.cfg.mode;
  G.done = 0; G.misses = 0;
  clearStage();
  if(G.mode === 'fit')    buildFit(G.cfg);
  if(G.mode === 'sort')   buildSort(G.cfg);
  if(G.mode === 'shadow') buildShadow(G.cfg);
  if(buddyModel){
    var bp = G.buddySpot || { x:0, z:-4, ry:0, s:1 };
    buddyModel.position.set(bp.x, 0, bp.z);
    buddyModel.rotation.y = bp.ry;
    buddyModel.scale.setScalar(bp.s);
    stageGroup.add(buddyModel);
  }
  updateHud();
  $('hud').style.display = 'flex';
  $('nav').style.display = 'flex';
  G.active = true;
  hideScreens();
  fitCamera();
}
function updateHud(){
  $('left').textContent  = Math.max(0, G.remain - G.done);
  $('combo').textContent = G.done;
}
function cheer(text){
  var c = $('cheer');
  c.textContent = text;
  c.classList.remove('show');
  void c.offsetWidth;
  c.classList.add('show');
}
function toast(text, clientX, clientY){
  var t = document.createElement('div');
  t.className = 'toast';
  t.textContent = text;
  t.style.left = clientX + 'px';
  t.style.top  = clientY + 'px';
  $('app').appendChild(t);
  setTimeout(function(){ if(t.parentNode) t.parentNode.removeChild(t); }, 1000);
}
/* きらきら粒子: geometryは1つ共有、materialは色ごとにキャッシュ */
var SPARK_GEO = new THREE.SphereGeometry(0.075, 8, 6);
SHARED_GEO.add(SPARK_GEO);
var SPARK_MAT_CACHE = {};
function sparkMat(color){
  if(!SPARK_MAT_CACHE[color]){
    SPARK_MAT_CACHE[color] = new THREE.MeshBasicMaterial({ color:color });
    SHARED_MAT.add(SPARK_MAT_CACHE[color]);
  }
  return SPARK_MAT_CACHE[color];
}
function addSpark(entry){
  if(sparks.length >= TUNE.PARTICLE_MAX){
    var old = sparks.shift();
    if(old.m) scene.remove(old.m);
  }
  sparks.push(entry);
}
function burst(pos, color, count){
  var n = count || 14;
  for(var i=0;i<n;i++){
    addSpark({
      p: pos.clone(),
      v: new THREE.Vector3(rand(-1.8,1.8), rand(1.4,3.4), rand(-1.8,1.8)),
      life: rand(0.45,0.8), max:0.8, col: color, m:null
    });
  }
}

function scoreOne(worldPos, color){
  G.done++;
  updateHud();
  burst(worldPos, color, 16);
  chime();
  if(G.done % 3 === 0) cheer('ぴったり！');
  if(buddyModel) buddyModel.userData.bounce = 1;
  if(G.done >= G.remain){
    var tok = flowToken;
    setTimeout(function(){ if(tok === flowToken) finishStage(); }, 780);
  }
}

function finishStage(){
  G.active = false;
  $('hud').style.display = 'none';
  $('task').style.display = 'none';
  var stars = G.misses <= 1 ? 3 : (G.misses <= 4 ? 2 : 1);
  var prev = save.stars[G.stage] || 0;
  save.stars[G.stage] = Math.max(prev, stars);
  if(save.unlocked < Math.min(STAGES.length, G.stage + 2)) save.unlocked = Math.min(STAGES.length, G.stage + 2);
  persist();
  fanfare();
  showResult(stars);
}

/* ============================================================
   input
   ============================================================ */
function ndcFrom(e){
  var r = renderer.domElement.getBoundingClientRect();
  ndc.x = ((e.clientX - r.left) / r.width) * 2 - 1;
  ndc.y = -((e.clientY - r.top) / r.height) * 2 + 1;
  return r;
}
function ownerPiece(obj){
  while(obj){ if(obj.userData && obj.userData.kind && obj.userData.body) return obj; obj = obj.parent; }
  return null;
}
function planePoint(){
  var hit = new THREE.Vector3();
  rayc.setFromCamera(ndc, camera);
  return rayc.ray.intersectPlane(dragPlane, hit) ? hit : null;
}

function onDown(e){
  if(!G.active || !ready) return;
  e.preventDefault();
  ndcFrom(e);
  rayc.setFromCamera(ndc, camera);

  if(G.mode === 'shadow'){
    var hits = rayc.intersectObjects(G.candidates, true);
    if(!hits.length) return;
    var p = ownerPiece(hits[0].object);
    if(!p) return;
    if(p.userData.kind === G.target){
      p.userData.state = 'won';
      scoreOne(p.position.clone(), SHAPE_COL[p.userData.kind]);
      toast('せいかい！', e.clientX, e.clientY);
      if(G.done < G.remain){
        var tok = flowToken;
        setTimeout(function(){ if(tok === flowToken) nextShadowRound(); }, 620);
      }
    } else {
      G.misses++;
      p.userData.shake = 0.5;
      nope();
      toast('んー？', e.clientX, e.clientY);
    }
    return;
  }

  var pool = G.pieces.filter(function(q){
    return q.userData.state === 'tray' || q.userData.state === 'belt' || q.userData.state === 'return';
  });
  if(!pool.length) return;
  var hit2 = rayc.intersectObjects(pool, true);
  if(!hit2.length) return;
  var piece = ownerPiece(hit2[0].object);
  if(!piece) return;
  /* 既に別ポインタでドラッグ中なら、二重ドラッグを避けるため無視する */
  if(G.dragging) return;
  G.dragging = piece;
  G.dragPointerId = e.pointerId;
  piece.userData.state = 'drag';
  piece.userData.from = piece.position.clone();
  var pt = planePoint();
  /* つまんだ位置と ピース中心の ずれを おぼえておく(相対ドラッグ) */
  if(pt){
    G.dragOffset.copy(piece.position).sub(pt);
    G.dragOffset.y = 0;
  } else {
    G.dragOffset.set(0,0,0);
  }
  piece.userData.target = piece.position.clone();
  try{ if(renderer.domElement.setPointerCapture) renderer.domElement.setPointerCapture(e.pointerId); }catch(err){}
  blip(520, 0.06, 0.1);
}

function onMove(e){
  if(!G.dragging) return;
  if(G.dragPointerId != null && e.pointerId !== G.dragPointerId) return;
  e.preventDefault();
  ndcFrom(e);
  var pt = planePoint();
  if(pt){
    G.dragging.userData.target.set(pt.x + G.dragOffset.x, G.dragging.userData.target.y, pt.z + G.dragOffset.z);
  }
}

/* ドラッグを安全に中断する（pointercancel / blur / hidden / 画面遷移など） */
function cancelDrag(){
  var piece = G.dragging;
  if(piece){
    piece.userData.state = 'return';
  }
  if(G.dragPointerId != null){
    try{ if(renderer && renderer.domElement.releasePointerCapture) renderer.domElement.releasePointerCapture(G.dragPointerId); }catch(err){}
  }
  G.dragging = null;
  G.dragPointerId = null;
}

function onUp(e){
  var piece = G.dragging;
  if(!piece) return;
  if(G.dragPointerId != null && e && e.pointerId !== undefined && e.pointerId !== G.dragPointerId) return;
  try{ if(renderer && renderer.domElement.releasePointerCapture && G.dragPointerId != null) renderer.domElement.releasePointerCapture(G.dragPointerId); }catch(err){}
  G.dragging = null;
  G.dragPointerId = null;
  var px = piece.position.x, pz = piece.position.z;

  if(G.mode === 'fit'){
    var best = null, bd = 1e9;
    G.holes.forEach(function(h){
      if(h.userData.filled) return;
      var d = Math.hypot(h.position.x - px, h.position.z - pz);
      if(d < bd){ bd = d; best = h; }
    });
    if(best && bd < TUNE.FIT_DROP_RADIUS &&
       best.userData.kind === piece.userData.kind &&
       Math.abs(best.userData.size - piece.userData.size) < 0.05){
      best.userData.filled = true;
      best.userData.glow.material.opacity = 0;
      piece.userData.state = 'placed';
      piece.userData.target = new THREE.Vector3(best.position.x, BOARD_TOP - 0.055 + piece.userData.size*0.26, best.position.z);
      var ti = G.tray.indexOf(piece);
      if(ti >= 0) G.tray.splice(ti, 1);
      layoutTray();
      refillTray();
      scoreOne(piece.userData.target.clone(), SHAPE_COL[piece.userData.kind]);
      if(e) toast('ぴったり！', e.clientX, e.clientY);
      return;
    }
    if(best && bd < TUNE.FIT_DROP_RADIUS){ G.misses++; nope(); best.userData.shake = 0.45; }
    piece.userData.state = 'return';
    return;
  }

  if(G.mode === 'sort'){
    var bestB = null, bdb = 1e9;
    G.bins.forEach(function(b){
      var d = Math.hypot(b.position.x - px, b.position.z - pz);
      if(d < bdb){ bdb = d; bestB = b; }
    });
    if(bestB && bdb < TUNE.SORT_DROP_RADIUS){
      var def = bestB.userData.def, ok;
      if(G.cfg.bySize) ok = (def.label === 'big') === (piece.userData.size > (BIG+SMALL)/2);
      else ok = def.kind === piece.userData.kind;
      if(ok){
        piece.userData.state = 'binned';
        piece.userData.target = new THREE.Vector3(bestB.position.x, 0.62, bestB.position.z);
        bestB.userData.wob = 0.6;
        scoreOne(new THREE.Vector3(bestB.position.x, 1.2, bestB.position.z), SHAPE_COL[piece.userData.kind]);
        if(e) toast('OK！', e.clientX, e.clientY);
        return;
      }
      G.misses++; nope(); bestB.userData.wob = -0.5;
    }
    piece.userData.home = new THREE.Vector3(0, 0.47 + piece.userData.size*0.26, 0.75);
    piece.userData.state = 'return';
    return;
  }
}

/* ============================================================
   camera
   ============================================================ */
function fitCamera(){
  if(!camera || !renderer) return;
  var w = window.innerWidth, h = window.innerHeight, aspect = w / h;
  camera.aspect = aspect;

  var pts = (G.active && G.fitPts && G.fitPts.length) ? G.fitPts : MENU_PTS;
  if(!pts || !pts.length) pts = MENU_PTS = boxPts(3.3, 0.0, 2.9, -3.0, 3.0);
  var cz = 0, cy = 0, i;
  for(i=0;i<pts.length;i++){ cz += pts[i].z; cy += pts[i].y; }
  cz /= pts.length; cy /= pts.length;
  var center = new THREE.Vector3(0, cy, cz);

  /* tilt: taller screens use a more oblique angle so depth fills the height */
  var t = clamp((aspect - 0.45) / 1.15, 0, 1);
  var upness = (G.mode === 'shadow') ? lerp(0.34, 0.46, t) : lerp(0.58, 0.78, t);
  var dir = new THREE.Vector3(0, upness, Math.sqrt(Math.max(0.02, 1 - upness*upness))).normalize();

  /* usable band in NDC (top reserved for HUD + task banner) */
  var mx  = 1 - 2 * 16 / w;
  var reserve = G.active ? 126 : h * (aspect < 0.9 ? (h < 620 ? 0.20 : 0.47) : 0.24);
  var top = 1 - 2 * reserve / h;
  var bot = -1 + 2 * 26 / h;

  var dist = 16, dy = 0, v = new THREE.Vector3();
  function place(d, off){
    camera.position.copy(center).addScaledVector(dir, d);
    camera.position.y += off;
    camera.lookAt(center.x, center.y + off, center.z);
    camera.updateProjectionMatrix();
    camera.updateMatrixWorld(true);
    camera.matrixWorldInverse.copy(camera.matrixWorld).invert();
  }
  function bounds(){
    var b = { x:0, lo:9, hi:-9 };
    for(var j=0;j<pts.length;j++){
      v.copy(pts[j]).project(camera);
      if(Math.abs(v.x) > b.x) b.x = Math.abs(v.x);
      if(v.y < b.lo) b.lo = v.y;
      if(v.y > b.hi) b.hi = v.y;
    }
    return b;
  }
  var tanV = Math.tan(camera.fov * Math.PI / 360);
  for(i=0;i<8;i++){
    place(dist, dy);
    var b = bounds();
    var need = Math.max(b.x / mx, (b.hi - b.lo) / (top - bot));
    dist = clamp(dist * need, 6, 46);
    place(dist, dy);
    var b2 = bounds();
    dy += ((b2.hi + b2.lo) / 2 - (top + bot) / 2) * dist * tanV / Math.max(0.3, dir.z);
  }
  place(dist * 1.04, dy);
  camera.userData.baseX = camera.position.x;
}
function resize(){
  if(!renderer) return;
  var w = window.innerWidth, h = window.innerHeight;
  renderer.setSize(w, h, false);
  camera.aspect = w / h;
  fitCamera();
}

/* ============================================================
   render loop
   ============================================================ */
function tick(now){
  requestAnimationFrame(tick);
  if(!ready) return;
  var dt = lastTime ? Math.min(0.1, (now - lastTime) / 1000) : 0.016;
  lastTime = now; elapsed += dt;
  var k = 1 - Math.exp(-17 * dt);

  /* room ambience */
  if(scene.userData.room){
    var gs = scene.userData.room.userData.gears || [];
    for(var i=0;i<gs.length;i++) gs[i].rotation.z += gs[i].userData.spin * dt;
    var lp = scene.userData.room.userData.lamps || [];
    for(var j=0;j<lp.length;j++) lp[j].rotation.z = Math.sin(elapsed*0.9 + lp[j].userData.phase) * 0.05;
  }

  /* menu showpiece */
  if(G.mode === 'menu'){
    if(G.orbit) G.orbit.rotation.y += dt * 0.22;
    if(G.balloons) for(var bl=0; bl<G.balloons.length; bl++){
      var bo = G.balloons[bl];
      bo.position.y += Math.sin(elapsed * 0.9 + bo.userData.ph) * dt * 0.5;
      bo.rotation.z = Math.sin(elapsed * 0.7 + bo.userData.ph) * 0.09;
    }
    if(Math.random() < dt * 3.2){
      var ang = Math.random() * TAU, rr = 1.2 + Math.random() * 1.9;
      addSpark({ p:new THREE.Vector3(Math.cos(ang)*rr, 1.1, Math.sin(ang)*rr),
                    v:new THREE.Vector3(rand(-0.35,0.35), rand(1.5,2.6), rand(-0.35,0.35)),
                    life:0.85, max:0.85, col:pick([0xFFD166,0xFFF0C0,0xFF8FC6,0x8FD9C6]), m:null });
    }
  }

  /* buddy */
  if(buddyModel){
    var ud = buddyModel.userData;
    ud.bounce = Math.max(0, ud.bounce - dt*2.2);
    buddyModel.position.y = Math.abs(Math.sin(elapsed*2.2)) * 0.06 + ud.bounce * 0.42;
    buddyModel.rotation.z = Math.sin(elapsed*3.1) * 0.03 + ud.bounce * 0.14;
  }

  /* pieces */
  if(G.mode === 'sort' && G.active){
    G.spawnTimer -= dt;
    if(G.spawnTimer <= 0){ spawnBeltPiece(); G.spawnTimer = TUNE.SORT_SPAWN_SEC; }
    var belt = G.pieces.filter(function(p){ return p.userData.state === 'belt' && !p.userData.home; })
                       .sort(function(a,b){ return b.position.z - a.position.z; });
    belt.forEach(function(p, i){
      var stop = 0.75 - i * 1.25;
      p.position.z = Math.min(stop, p.position.z + G.beltSpeed * dt * 1.6);
      p.position.x += (0 - p.position.x) * k;
      p.position.y = 0.47 + p.userData.size*0.26;
      p.rotation.y += dt * 0.35;
    });
    var rl = stageGroup.userData.rollers || [];
    for(var r=0;r<rl.length;r++) rl[r].rotation.x -= dt * 4;
  }

  for(var pi=0; pi<G.pieces.length; pi++){
    var p = G.pieces[pi], st = p.userData.state;
    if(st === 'drag'){
      var t = p.userData.target;
      p.position.x += (t.x - p.position.x) * k;
      p.position.z += (t.z - p.position.z) * k;
      p.position.y += (LIFT_Y - p.position.y) * k;
      p.rotation.z = (t.x - p.position.x) * 0.32;
      p.rotation.x = -(t.z - p.position.z) * 0.28;
      p.rotation.y += dt * 0.8;
    } else if(st === 'tray' || st === 'return'){
      var home = p.userData.home;
      if(home){
        p.position.x += (home.x - p.position.x) * k;
        p.position.z += (home.z - p.position.z) * k;
        p.position.y += (home.y + Math.sin(elapsed*2 + p.userData.wob)*0.045 - p.position.y) * k;
      } else {
        p.position.y += (0.47 + p.userData.size*0.26 - p.position.y) * k;
      }
      p.rotation.x += (0 - p.rotation.x) * k;
      p.rotation.z += (0 - p.rotation.z) * k;
      p.rotation.y += (0 - p.rotation.y) * k * 0.5;
      if(st === 'return' && (!home || p.position.distanceTo(home) < 0.14)){
        p.userData.state = p.userData.rest || 'tray';
        if(p.userData.rest === 'belt') p.userData.home = null;
      }
    } else if(st === 'placed' || st === 'binned'){
      var tg = p.userData.target;
      p.position.x += (tg.x - p.position.x) * k;
      p.position.z += (tg.z - p.position.z) * k;
      p.position.y += (tg.y - p.position.y) * k;
      p.rotation.x += (0 - p.rotation.x) * k;
      p.rotation.z += (0 - p.rotation.z) * k;
      p.rotation.y += (0 - p.rotation.y) * k;
      if(st === 'binned'){
        p.scale.setScalar(Math.max(0.001, p.scale.x - dt * p.userData.size * 1.4));
      }
    } else if(st === 'candidate'){
      p.rotation.y += p.userData.spin * dt;
      p.position.y = 0.65 + Math.sin(elapsed*1.8 + p.userData.wob) * 0.06;
      if(p.userData.shake > 0){
        p.userData.shake -= dt;
        p.position.x += Math.sin(elapsed*45) * 0.03;
      }
    } else if(st === 'won'){
      p.rotation.y += dt * 7;
      p.position.y += dt * 2.4;
      p.scale.setScalar(Math.max(0.001, p.scale.x - dt * 0.9));
    }
  }

  /* hole highlight */
  if(G.mode === 'fit'){
    var dragKind = G.dragging ? G.dragging.userData : null;
    for(var hi=0; hi<G.holes.length; hi++){
      var h = G.holes[hi], hu = h.userData;
      var want = 0;
      if(!hu.filled && dragKind && dragKind.kind === hu.kind && Math.abs(dragKind.size - hu.size) < 0.05){
        hu.pulse += dt * 6;
        want = 0.45 + Math.sin(hu.pulse) * 0.28;
      }
      hu.glow.material.opacity += (want - hu.glow.material.opacity) * k;
      if(hu.shake > 0){
        hu.shake -= dt;
        h.rotation.y = Math.sin(elapsed*40) * 0.09;
      } else h.rotation.y += (0 - h.rotation.y) * k;
    }
  }

  /* bins wobble */
  for(var bi=0; bi<G.bins.length; bi++){
    var b = G.bins[bi];
    if(b.userData.wob !== 0){
      b.userData.wob *= (1 - dt*3.4);
      if(Math.abs(b.userData.wob) < 0.01) b.userData.wob = 0;
      b.position.y = Math.abs(b.userData.wob) * 0.35;
      b.rotation.z = b.userData.wob * 0.12;
    }
  }

  /* sparks */
  for(var si = sparks.length - 1; si >= 0; si--){
    var s = sparks[si];
    s.p.addScaledVector(s.v, dt);
    s.v.y -= dt * 6.2;
    s.life -= dt;
    if(s.life <= 0){ if(s.m) scene.remove(s.m); sparks.splice(si,1); continue; }
    if(!s.m){
      s.m = mesh(SPARK_GEO, sparkMat(s.col));
      scene.add(s.m);
    }
    s.m.position.copy(s.p);
    s.m.scale.setScalar(clamp(s.life / s.max, 0.05, 1) * 1.3);
  }

  camera.position.x += (Math.sin(elapsed*0.24) * 0.11 - (camera.position.x - camera.userData.baseX)) * 0.02;
  renderer.render(scene, camera);
}

/* ============================================================
   init
   ============================================================ */
function init(){
  var canvas = $('gl');
  try{
    renderer = new THREE.WebGLRenderer({ canvas:canvas, antialias:true });
    if(!renderer.context && !renderer.getContext()) throw new Error('no gl');
  }catch(err){
    $('fallback').style.display = 'grid';
    canvas.style.display = 'none';
    return;
  }
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
  renderer.outputEncoding = THREE.sRGBEncoding;
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 1.02;
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  renderer.setClearColor(0xE9BE86, 1);

  scene = new THREE.Scene();
  scene.fog = new THREE.Fog(0xE0B98C, 16, 34);
  camera = new THREE.PerspectiveCamera(42, 1, 0.1, 120);
  camera.userData = { baseX:0 };
  rayc = new THREE.Raycaster();
  ndc = new THREE.Vector2();
  dragPlane = new THREE.Plane(new THREE.Vector3(0,1,0), -LIFT_Y);

  scene.add(new THREE.HemisphereLight(0xFFF0D2, 0x8A5A2E, 0.72));
  sunLight = new THREE.DirectionalLight(0xFFF2D6, 1.0);
  sunLight.position.set(4.5, 11, 7);
  sunLight.castShadow = true;
  sunLight.shadow.mapSize.width = 1024;
  sunLight.shadow.mapSize.height = 1024;
  sunLight.shadow.camera.near = 1;
  sunLight.shadow.camera.far = 32;
  sunLight.shadow.camera.left = -9;
  sunLight.shadow.camera.right = 9;
  sunLight.shadow.camera.top = 9;
  sunLight.shadow.camera.bottom = -9;
  sunLight.shadow.bias = -0.0016;
  scene.add(sunLight);
  var fill = new THREE.DirectionalLight(0xFFCE96, 0.26);
  fill.position.set(-6, 5, 4);
  scene.add(fill);

  var room = buildRoom();
  scene.add(room);
  scene.userData.room = room;

  stageGroup = new THREE.Group();
  scene.add(stageGroup);
  buddyModel = buildBuddy(BUDDIES[save.buddy || 0]);
  buddyModel.position.set(0, 0, 1.6);
  stageGroup.add(buddyModel);

  ready = true;
  resize();
  window.addEventListener('resize', resize);
  window.addEventListener('orientationchange', function(){ setTimeout(resize, 220); });
  document.addEventListener('visibilitychange', function(){
    lastTime = 0;
    if(document.hidden) cancelDrag();
  });
  window.addEventListener('blur', cancelDrag);
  canvas.addEventListener('pointerdown', onDown, { passive:false });
  canvas.addEventListener('contextmenu', function(e){ e.preventDefault(); });
  window.addEventListener('pointermove', onMove, { passive:false });
  window.addEventListener('pointerup', onUp);
  window.addEventListener('pointercancel', function(e){
    if(!G.dragging) return;
    if(G.dragPointerId != null && e.pointerId !== G.dragPointerId) return;
    cancelDrag();
  });
  requestAnimationFrame(tick);
}

/* ============================================================
   screens / UI
   ============================================================ */
var SCREEN_IDS = ['title','chars','map','shelf','result'];
function hideScreens(){
  SCREEN_IDS.forEach(function(id){ $(id).classList.add('off'); });
}
function showScreen(id){
  G.active = false;
  cancelDrag();
  $('hud').style.display = 'none';
  $('task').style.display = 'none';
  $('nav').style.display = 'none';
  SCREEN_IDS.forEach(function(s){ $(s).classList.toggle('off', s !== id); });
  showcase();
}
/* decorative idle scene behind the menus */
function showcase(){
  if(!ready) return;
  G.mode = 'menu';
  clearStage();
  MENU_PTS = boxPts(3.7, 0.0, 3.5, -3.5, 3.5);

  /* tiered podium */
  var base = mesh(new THREE.CylinderGeometry(1.95, 2.18, 0.3, 32), toyMat(0x9C6231), 0, 0.15, 0);
  base.receiveShadow = true; stageGroup.add(base);
  var tier = mesh(new THREE.CylinderGeometry(1.62, 1.84, 0.38, 32), toyMat(0xE0A05A), 0, 0.49, 0);
  tier.receiveShadow = true; tier.castShadow = true; stageGroup.add(tier);
  var top = mesh(new THREE.CylinderGeometry(1.18, 1.34, 0.26, 32), toyMat(0xF3DCB6), 0, 0.81, 0);
  top.receiveShadow = true; top.castShadow = true; stageGroup.add(top);
  /* colour studs around the rim */
  var studCols = [0xFF6B6B,0xFFC84D,0x5BC98C,0x5AA9E6,0xA98CE0,0xFF8FC6];
  for(var st=0; st<12; st++){
    var sa = st / 12 * TAU;
    stageGroup.add(mesh(new THREE.CylinderGeometry(0.13,0.13,0.13,12), toyMat(studCols[st%6], true),
      Math.cos(sa)*1.7, 0.56, Math.sin(sa)*1.7));
  }

  /* soft spotlight cone */
  var coneMat = new THREE.MeshBasicMaterial({
    color:0xFFF0C0, transparent:true, opacity:0.14, side:THREE.DoubleSide, depthWrite:false
  });
  var cone = mesh(new THREE.ConeGeometry(2.35, 5.6, 26, 1, true), coneMat, 0, 3.85, 0);
  stageGroup.add(cone);

  if(buddyModel){
    buddyModel.position.set(0, 0.94, 0.05);
    buddyModel.rotation.y = 0;
    buddyModel.scale.setScalar(1.32);
    stageGroup.add(buddyModel);
  }

  /* orbiting shapes */
  var orbit = new THREE.Group();
  stageGroup.add(orbit);
  G.orbit = orbit;
  KINDS.forEach(function(kind, i){
    var a = i / KINDS.length * TAU;
    var p = makePiece(kind, 0.5);
    p.position.set(Math.cos(a)*3.15, 1.75 + Math.sin(i*1.9)*0.62, Math.sin(a)*3.15);
    p.userData.state = 'candidate';
    p.userData.spin = 0.45 + i*0.05;
    p.userData.wob = i * 0.9;
    orbit.add(p);
    G.pieces.push(p);
    G.candidates.push(p);
  });

  /* a few balloons for height */
  [[-3.0, 2.9, -1.1, 0xFF8FC6],[3.05, 3.3, -0.7, 0x5AA9E6],[0.5, 3.7, -2.4, 0xFFC84D]].forEach(function(b, i){
    var g = new THREE.Group();
    var ball = mesh(new THREE.SphereGeometry(0.52, 18, 14), toyMat(b[3], true), 0, 0, 0);
    ball.scale.set(1, 1.22, 1);
    g.add(ball);
    g.add(mesh(new THREE.ConeGeometry(0.13, 0.2, 8), toyMat(b[3]), 0, -0.66, 0));
    g.add(mesh(new THREE.CylinderGeometry(0.02, 0.02, 1.5, 6), toyMat(0xE0C8A0), 0, -1.5, 0));
    g.position.set(b[0], b[1], b[2]);
    g.userData.ph = i * 2.1;
    stageGroup.add(g);
    G.balloons = G.balloons || [];
    G.balloons.push(g);
  });

  fitCamera();
}

/* ---------- drifting shapes behind the title ---------- */
var DRIFT_SVG = {
  circle:'<circle cx="20" cy="20" r="17"/>',
  square:'<rect x="4" y="4" width="32" height="32" rx="7"/>',
  triangle:'<path d="M20 3 L37 34 L3 34 Z"/>',
  star:'<path d="M20 2 L25 15 L39 16 L28 25 L32 38 L20 30 L8 38 L12 25 L1 16 L15 15 Z"/>',
  heart:'<path d="M20 36 C4 24 3 14 10 9 C15 5 19 9 20 12 C21 9 25 5 30 9 C37 14 36 24 20 36 Z"/>',
  diamond:'<path d="M20 2 L36 20 L20 38 L4 20 Z"/>',
  hexagon:'<path d="M20 2 L35 11 L35 29 L20 38 L5 29 L5 11 Z"/>'
};
function hex6(n){ var h = n.toString(16); while(h.length < 6) h = '0' + h; return h; }
function buildDrift(){
  var host = $('drift');
  if(!host || host.childElementCount) return;
  var kinds = KINDS.slice(), html = '';
  for(var i=0;i<14;i++){
    var kind = kinds[i % kinds.length];
    var size = 22 + Math.random()*30;
    html += '<svg viewBox="0 0 40 40" width="' + size.toFixed(0) + '" height="' + size.toFixed(0) + '" ' +
      'fill="#' + hex6(SHAPE_COL[kind]) + '" ' +
      'style="left:' + (Math.random()*94).toFixed(1) + '%;' +
      'animation-duration:' + (11 + Math.random()*9).toFixed(1) + 's;' +
      'animation-delay:-' + (Math.random()*18).toFixed(1) + 's">' + DRIFT_SVG[kind] + '</svg>';
  }
  host.innerHTML = html;
}

/* ---------- title ---------- */
function refreshTitle(){
  var got = 0;
  for(var i=0;i<STAGES.length;i++) if((save.stars[i]||0) > 0) got++;
  $('hiCount').textContent = got;
}

/* ---------- characters ---------- */
function buildCharUI(){
  var g = $('charGrid');
  g.innerHTML = '';
  BUDDIES.forEach(function(b, i){
    var btn = document.createElement('button');
    btn.className = 'char' + (save.buddy === i ? ' sel' : '');
    btn.innerHTML = BUDDY_SVG[i] + b.name + '<small>' + b.sub + '</small>';
    btn.onclick = function(){
      save.buddy = i; persist();
      if(buddyModel && buddyModel.parent){ buddyModel.parent.remove(buddyModel); disposeGroup(buddyModel); }
      buddyModel = buildBuddy(BUDDIES[i]);
      blip(660, 0.1, 0.14);
      buildStageUI();
      showScreen('map');
    };
    g.appendChild(btn);
  });
}

/* ---------- map ---------- */
function buildStageUI(){
  var g = $('stages');
  g.innerHTML = '';
  STAGES.forEach(function(st, i){
    var locked = i >= save.unlocked;
    var btn = document.createElement('button');
    btn.className = 'stage' + (locked ? ' lock' : '');
    btn.disabled = locked;
    var stars = save.stars[i] || 0;
    btn.innerHTML =
      '<span class="stage-num">' + (i+1) + '</span>' +
      '<span><b>' + st.name + '</b><small><em class="mode-tag ' + MODE_CLASS[st.mode] + '">' +
      MODE_LABEL[st.mode] + '</em> ' + TOYS[i].name + ' が もらえる</small></span>' +
      '<em>' + (locked ? 'かぎ' : ('★'.repeat(stars) + '☆'.repeat(3-stars))) + '</em>';
    btn.onclick = function(){ if(!locked){ blip(700,0.09,0.14); startStage(i); } };
    g.appendChild(btn);
  });
}

/* ---------- shelf ---------- */
function buildShelfUI(){
  var g = $('shelfGrid');
  g.innerHTML = '';
  TOYS.forEach(function(t, i){
    var got = (save.stars[i] || 0) > 0;
    var d = document.createElement('div');
    d.className = 'toy' + (got ? '' : ' locked');
    d.innerHTML = t.svg + '<span>' + (got ? t.name : '？？？') + '</span>';
    g.appendChild(d);
  });
}

/* ---------- result ---------- */
function showResult(stars){
  var toy = TOYS[G.stage];
  $('resultStars').textContent = '★'.repeat(stars) + '☆'.repeat(3 - stars);
  $('rewardArt').innerHTML = toy.svg;
  $('rewardName').textContent = toy.name + ' が できた！';
  var last = G.stage >= STAGES.length - 1;
  $('resultTitle').textContent = last ? 'ぜんぶ できた！' : 'できあがり！';
  $('nextStage').style.display = last ? 'none' : 'block';
  var c = $('confetti');
  c.innerHTML = '';
  var cols = ['#FF6B6B','#FFC84D','#5BC98C','#5AA9E6','#FF8FC6','#A98CE0'];
  for(var i=0;i<28;i++){
    var e = document.createElement('i');
    e.style.left = (Math.random()*100) + '%';
    e.style.background = cols[i % cols.length];
    e.style.animationDelay = (Math.random()*2.4) + 's';
    e.style.animationDuration = (2.4 + Math.random()*1.6) + 's';
    c.appendChild(e);
  }
  refreshTitle();
  buildStageUI();
  buildShelfUI();
  showScreen('result');
}

/* ============================================================
   BGM
   ============================================================ */
var bgm = null, bgmOn = false;
function bgmLabel(){
  var t = bgmOn ? 'おと ♪' : 'おと ×';
  $('music').textContent = t;
  $('titleMusic').textContent = t;
}
function toggleMusic(){
  try{
    if(!bgm && typeof WakuwakuMP3BGM !== 'undefined') bgm = new WakuwakuMP3BGM('puzzle');
    if(!bgm){ bgmOn = !bgmOn; bgmLabel(); return; }
    if(typeof bgm.toggle === 'function'){ bgmOn = !!bgm.toggle(); }
    else if(bgmOn){ bgm.stop && bgm.stop(); bgmOn = false; }
    else { bgm.start && bgm.start(); bgmOn = true; }
    if(typeof WakuwakuMP3BGM !== 'undefined' && typeof WakuwakuMP3BGM.saveState === 'function') WakuwakuMP3BGM.saveState(bgmOn);
  }catch(e){}
  bgmLabel();
}
function autoStartBgm(){
  try{
    if(typeof WakuwakuMP3BGM === 'undefined') return;
    var want = (typeof WakuwakuMP3BGM.loadState === 'function') ? WakuwakuMP3BGM.loadState() : false;
    if(!want) return;
    if(!bgm) bgm = new WakuwakuMP3BGM('puzzle');
    bgm.start && bgm.start();
    bgmOn = true;
    bgmLabel();
  }catch(e){}
}

/* ============================================================
   wiring
   ============================================================ */
$('start').onclick = function(){ blip(760,0.1,0.15); buildCharUI(); showScreen('chars'); autoStartBgm(); };
$('titleMusic').onclick = toggleMusic;
$('music').onclick = toggleMusic;
$('goBack').onclick = function(){ try{ parent.postMessage({ type:'goBack' }, '*'); }catch(e){} };
$('toShelf').onclick = function(){ buildShelfUI(); showScreen('shelf'); };
$('mapShelf').onclick = function(){ buildShelfUI(); showScreen('shelf'); };
$('shelfBack').onclick = function(){ buildStageUI(); showScreen(save.unlocked > 1 ? 'map' : 'title'); };
$('back').onclick = function(){ buildStageUI(); showScreen('map'); };
$('retry').onclick = function(){ startStage(G.stage); };
$('toMap').onclick = function(){ buildStageUI(); showScreen('map'); };
$('nextStage').onclick = function(){
  var n = G.stage + 1;
  if(n < STAGES.length && n < save.unlocked) startStage(n);
  else { buildStageUI(); showScreen('map'); }
};
var homeBtns = document.querySelectorAll('[data-home]');
for(var hb=0; hb<homeBtns.length; hb++){
  homeBtns[hb].onclick = function(){ refreshTitle(); showScreen('title'); };
}

/* ============================================================
   boot
   ============================================================ */
buildDrift();
refreshTitle();
buildCharUI();
buildStageUI();
buildShelfUI();
bgmLabel();
init();
if(ready) showcase();

})();
</script>
