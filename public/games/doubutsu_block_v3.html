<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>どうぶつブロック</title>
<link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@700;800;900&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;}
html,body{height:100%;overflow:hidden;font-family:'M PLUS Rounded 1c',sans-serif;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent;touch-action:none;}
body{background:#1a0f2e;display:flex;justify-content:center;}
#app{position:relative;width:100%;max-width:430px;height:100vh;height:100dvh;display:flex;flex-direction:column;overflow:hidden;}
canvas{display:block;}
#bg-canvas{position:absolute;inset:0;z-index:0;width:100%;height:100%;}

/* ===== タイトル ===== */
#title-screen{position:absolute;inset:0;z-index:50;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:calc(env(safe-area-inset-top,0px) + 10px) 16px calc(env(safe-area-inset-bottom,0px) + 16px);}
#title-logo{position:relative;text-align:center;margin-bottom:6px;animation:logoBob 2.2s ease-in-out infinite;}
@keyframes logoBob{0%,100%{transform:translateY(0) rotate(-1.5deg);}50%{transform:translateY(-10px) rotate(1.5deg);}}
#title-logo .t1{font-size:44px;font-weight:900;color:#fff;text-shadow:0 4px 0 #e91e8c,0 8px 0 rgba(0,0,0,.25),0 0 26px rgba(255,150,220,.7);letter-spacing:2px;}
#title-logo .t2{font-size:26px;font-weight:900;color:#ffe066;text-shadow:0 3px 0 #d68910,0 6px 12px rgba(0,0,0,.4);margin-top:-2px;letter-spacing:6px;}
#title-sub{font-size:13px;font-weight:800;color:rgba(255,255,255,.85);background:rgba(0,0,0,.3);padding:5px 16px;border-radius:20px;margin-bottom:14px;}
#demo-row{display:flex;gap:8px;margin-bottom:18px;}
.demo-cell{width:52px;height:52px;border-radius:13px;animation:demoBounce 1.4s ease-in-out infinite;box-shadow:0 5px 0 rgba(0,0,0,.25);}
.demo-cell:nth-child(2){animation-delay:.15s;}
.demo-cell:nth-child(3){animation-delay:.3s;}
.demo-cell:nth-child(4){animation-delay:.45s;}
.demo-cell:nth-child(5){animation-delay:.6s;}
@keyframes demoBounce{0%,100%{transform:translateY(0) scale(1);}40%{transform:translateY(-14px) scale(1.06);}}
#hs-line{color:#ffe066;font-size:14px;font-weight:900;margin-bottom:16px;text-shadow:0 2px 4px rgba(0,0,0,.5);}
#start-btn{font-family:inherit;font-size:24px;font-weight:900;color:#5d2e00;background:linear-gradient(180deg,#ffe45c,#ffb300);border:none;border-radius:40px;padding:16px 58px;cursor:pointer;box-shadow:0 7px 0 #c77800,0 12px 24px rgba(0,0,0,.4);animation:btnPulse 1.5s ease-in-out infinite;}
@keyframes btnPulse{0%,100%{transform:scale(1);}50%{transform:scale(1.07);}}
#start-btn:active{transform:translateY(5px);box-shadow:0 2px 0 #c77800;}
#howto-btn{margin-top:14px;font-family:inherit;font-size:14px;font-weight:800;color:#fff;background:rgba(255,255,255,.15);border:2px solid rgba(255,255,255,.5);border-radius:26px;padding:9px 26px;cursor:pointer;}
#howto{position:absolute;inset:0;z-index:60;background:rgba(10,5,30,.9);display:none;flex-direction:column;align-items:center;justify-content:center;padding:24px;text-align:center;}
#howto.show{display:flex;}
#howto h2{color:#ffe066;font-size:24px;margin-bottom:16px;}
#howto p{color:#fff;font-size:15px;font-weight:700;line-height:2.1;margin-bottom:20px;}
#howto button{font-family:inherit;font-size:18px;font-weight:900;color:#5d2e00;background:#ffe45c;border:none;border-radius:30px;padding:12px 44px;cursor:pointer;box-shadow:0 5px 0 #c77800;}

/* ===== HUD ===== */
#hud{position:relative;z-index:10;flex-shrink:0;display:none;align-items:center;gap:6px;padding:calc(env(safe-area-inset-top,0px) + 6px) 10px 5px;}
#hud.show{display:flex;}
#back-btn{background:rgba(0,0,0,.35);border:1.5px solid rgba(255,255,255,.3);border-radius:10px;padding:5px 11px;color:#fff;font-size:13px;font-weight:800;cursor:pointer;font-family:inherit;}
.hud-box{background:rgba(0,0,0,.4);border:1.5px solid rgba(255,255,255,.22);border-radius:10px;padding:4px 10px;font-size:12px;font-weight:900;color:#fff;white-space:nowrap;}
#hud-score{color:#ffe066;min-width:86px;text-align:center;}
#hud-stage{color:#8be9fd;}
#fever-wrap{flex:1;height:16px;background:rgba(0,0,0,.45);border-radius:9px;border:1.5px solid rgba(255,255,255,.25);overflow:hidden;position:relative;}
#fever-bar{height:100%;width:0%;background:linear-gradient(90deg,#ff6ec7,#ffd166,#6ef3ff);transition:width .25s;border-radius:8px;}
#fever-label{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:900;color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.7);}

/* ===== メイン ===== */
#main{position:relative;z-index:5;flex:1;display:none;min-height:0;padding:4px 8px;}
#main.show{display:flex;}
#board-wrap{position:relative;margin:0 auto;height:100%;display:flex;align-items:center;}
#game-canvas{border-radius:14px;box-shadow:0 0 0 3px rgba(255,255,255,.28),0 10px 30px rgba(0,0,0,.5);}
#side{display:flex;flex-direction:column;gap:8px;padding:6px 0 0 8px;align-items:center;}
#next-label{font-size:11px;font-weight:900;color:rgba(255,255,255,.8);}
#next-canvas{background:rgba(0,0,0,.35);border-radius:10px;border:1.5px solid rgba(255,255,255,.22);}
#mascot{width:64px;height:64px;margin-top:auto;transition:transform .2s;}
#mascot.cheer{animation:mascotJump .5s ease;}
@keyframes mascotJump{0%,100%{transform:translateY(0);}45%{transform:translateY(-16px) rotate(-8deg);}}
#goal-box{background:rgba(0,0,0,.35);border:1.5px solid rgba(255,255,255,.22);border-radius:10px;padding:5px 8px;font-size:11px;font-weight:900;color:#a5ffb0;text-align:center;line-height:1.5;}

/* ===== コントロール ===== */
#controls{position:relative;z-index:10;flex-shrink:0;display:none;justify-content:center;gap:12px;padding:6px 12px calc(env(safe-area-inset-bottom,0px) + 10px);}
#controls.show{display:flex;}
.ctl-btn{width:64px;height:56px;border:none;border-radius:16px;font-size:24px;cursor:pointer;background:linear-gradient(180deg,rgba(255,255,255,.28),rgba(255,255,255,.12));box-shadow:0 4px 0 rgba(0,0,0,.35);color:#fff;font-family:inherit;font-weight:900;}
.ctl-btn:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(0,0,0,.35);}
#btn-rot{background:linear-gradient(180deg,#ff9ad5,#e91e8c);box-shadow:0 4px 0 #a80f60;}
#btn-drop{background:linear-gradient(180deg,#7ee8fa,#2196c9);box-shadow:0 4px 0 #14607f;}

/* ===== ポップアップ ===== */
#popup-layer{position:absolute;inset:0;z-index:30;pointer-events:none;overflow:hidden;}
.chain-pop{position:absolute;left:50%;transform:translateX(-50%);font-size:30px;font-weight:900;color:#ffe066;text-shadow:0 3px 0 #d68910,0 0 18px rgba(255,220,80,.8);animation:chainUp 1s ease forwards;white-space:nowrap;}
@keyframes chainUp{0%{opacity:0;transform:translateX(-50%) scale(.4);}25%{opacity:1;transform:translateX(-50%) scale(1.2);}45%{transform:translateX(-50%) scale(1);}100%{opacity:0;transform:translateX(-50%) translateY(-46px) scale(1);}}
#stage-pop{position:absolute;inset:0;z-index:40;display:none;flex-direction:column;align-items:center;justify-content:center;background:rgba(20,5,40,.72);}
#stage-pop.show{display:flex;}
#stage-pop .big{font-size:36px;font-weight:900;color:#ffe066;text-shadow:0 4px 0 #d68910,0 0 26px rgba(255,220,80,.8);animation:btnPulse 1s ease-in-out infinite;}
#stage-pop .sub{font-size:16px;font-weight:800;color:#fff;margin-top:8px;}

/* ===== ゲームオーバー ===== */
#over-screen{position:absolute;inset:0;z-index:55;display:none;flex-direction:column;align-items:center;justify-content:center;background:rgba(12,4,28,.9);padding:20px;}
#over-screen.show{display:flex;}
#over-screen h2{font-size:34px;font-weight:900;color:#fff;text-shadow:0 4px 0 #e91e8c;margin-bottom:10px;}
#over-stars{font-size:34px;letter-spacing:6px;margin-bottom:8px;}
#over-score{font-size:22px;font-weight:900;color:#ffe066;margin-bottom:4px;}
#over-best{font-size:14px;font-weight:800;color:rgba(255,255,255,.75);margin-bottom:20px;}
#over-msg{font-size:15px;font-weight:800;color:#a5ffb0;margin-bottom:18px;}
.over-btn{font-family:inherit;font-size:19px;font-weight:900;border:none;border-radius:32px;padding:13px 40px;cursor:pointer;margin:5px;}
#retry-btn{color:#5d2e00;background:linear-gradient(180deg,#ffe45c,#ffb300);box-shadow:0 5px 0 #c77800;}
#home-btn{color:#fff;background:rgba(255,255,255,.15);border:2px solid rgba(255,255,255,.5);}
#fever-flash{position:absolute;inset:0;z-index:20;pointer-events:none;opacity:0;background:radial-gradient(circle,transparent 40%,rgba(255,110,199,.28));}
#fever-flash.on{animation:feverGlow 1s ease-in-out infinite;}
@keyframes feverGlow{0%,100%{opacity:.3;}50%{opacity:.9;}}
</style>
</head>
<body>
<div id="app">
<canvas id="bg-canvas"></canvas>
<div id="fever-flash"></div>

<div id="title-screen">
  <div id="title-logo"><div class="t1">どうぶつ</div><div class="t2">ブロック</div></div>
  <div id="title-sub">ならべて けして だいれんさ!</div>
  <div id="demo-row"></div>
  <div id="hs-line">🏆 ハイスコア: <span id="hs-num">0</span></div>
  <button id="start-btn">スタート!</button>
  <button id="howto-btn">あそびかた</button>
</div>

<div id="howto">
  <h2>あそびかた</h2>
  <p>どうぶつが 3つずつ おちてくるよ<br>
  ◀▶ で うごかして<br>
  🔃 で くるっと かいてん!<br>
  おなじ どうぶつを<br>
  たて・よこ・ななめに 3つ ならべると きえるよ✨<br>
  れんさで ゲージをためて フィーバー!</p>
  <button id="howto-close">わかった!</button>
</div>

<div id="hud">
  <button id="back-btn">← もどる</button>
  <div class="hud-box" id="hud-score">0</div>
  <div class="hud-box" id="hud-stage">ステージ1</div>
  <div id="fever-wrap"><div id="fever-bar"></div><div id="fever-label">フィーバーゲージ</div></div>
</div>

<div id="main">
  <div id="board-wrap"><canvas id="game-canvas"></canvas></div>
  <div id="side">
    <div id="next-label">つぎ</div>
    <canvas id="next-canvas" width="56" height="150"></canvas>
    <div id="goal-box">あと<br><span id="goal-num">20</span>ひき</div>
    <svg id="mascot" viewBox="0 0 100 100"></svg>
  </div>
</div>

<div id="controls">
  <button class="ctl-btn" id="btn-left">◀</button>
  <button class="ctl-btn" id="btn-rot">🔃</button>
  <button class="ctl-btn" id="btn-drop">⬇</button>
  <button class="ctl-btn" id="btn-right">▶</button>
</div>

<div id="popup-layer"></div>
<div id="stage-pop"><div class="big" id="stage-pop-big"></div><div class="sub" id="stage-pop-sub"></div></div>

<div id="over-screen">
  <h2>おしまい!</h2>
  <div id="over-stars"></div>
  <div id="over-score"></div>
  <div id="over-best"></div>
  <div id="over-msg"></div>
  <div><button class="over-btn" id="retry-btn">もういちど!</button><button class="over-btn" id="home-btn">ホームへ</button></div>
</div>
</div>

<script>
'use strict';
const SAFE_LS = (function () {
  try {
    const testKey = "__ww_storage_test__";
    localStorage.setItem(testKey, testKey);
    localStorage.removeItem(testKey);
    return localStorage;
  } catch (e) {
    const memory = {};

    return {
      getItem(key) {
        return Object.prototype.hasOwnProperty.call(memory, key)
          ? memory[key]
          : null;
      },

      setItem(key, value) {
        memory[key] = String(value);
      },

      removeItem(key) {
        delete memory[key];
      }
    };
  }
})();
/* ================= 基本設定 ================= */
const COLS=7, ROWS=13, HIDDEN=1;
const TYPES=5;
const ANIMALS=[
 {name:'ねこ',  c1:'#ffb74d',c2:'#f57c00'},
 {name:'かえる',c1:'#aed581',c2:'#558b2f'},
 {name:'うさぎ',c1:'#f8bbd0',c2:'#e91e8c'},
 {name:'ぱんだ',c1:'#f5f5f5',c2:'#616161'},
 {name:'ひよこ',c1:'#fff176',c2:'#f9a825'}
];
const PRAISE=['','','すごい!','やったー!!','てんさい!!!','スーパー!!!','でんせつ!!!'];
const STAGE_THEMES=[
 {sky:['#7ec8ff','#c5ecff'],hill:'#7cc47f',deco:'day'},
 {sky:['#ff9e6d','#ffd9a0'],hill:'#8d6e63',deco:'sunset'},
 {sky:['#1a2a6c','#3a4db0'],hill:'#2e3d57',deco:'night'},
 {sky:['#b3e5fc','#e1f5fe'],hill:'#eceff1',deco:'snow'},
 {sky:['#ffc1e3','#ffe6f2'],hill:'#a5d6a7',deco:'sakura'}
];
const HS_KEY='doubutsu_block_hs';

let grid=[], piece=null, nextStack=null;
let score=0, cleared=0, stage=1, goal=20;
let fallTimer=0, fallInterval=850, lockTimer=0;
let gameRunning=false, animating=false, gameOverFlag=false;
let fever=0, feverOn=false, feverEnd=0;
let raf=0, lastT=0;
let clearAnim=null; // {cells:[{x,y,type}], t}
let particles=[];
let totalChainsMax=0;

/* ================= Canvas ================= */
const bgCv=document.getElementById('bg-canvas'), bgCx=bgCv.getContext('2d');
const cv=document.getElementById('game-canvas'), cx=cv.getContext('2d');
const nextCv=document.getElementById('next-canvas'), nextCx=nextCv.getContext('2d');
let CELL=34, dpr=Math.min(window.devicePixelRatio||1,2);

function layout(){
  const app=document.getElementById('app');
  bgCv.width=app.clientWidth*dpr; bgCv.height=app.clientHeight*dpr;
  bgCx.setTransform(dpr,0,0,dpr,0,0);
  const mainH=document.getElementById('main').clientHeight-8;
  const availW=app.clientWidth-96;
  CELL=Math.floor(Math.min(availW/COLS, mainH/(ROWS-HIDDEN)));
  cv.style.width=CELL*COLS+'px'; cv.style.height=CELL*(ROWS-HIDDEN)+'px';
  cv.width=CELL*COLS*dpr; cv.height=CELL*(ROWS-HIDDEN)*dpr;
  cx.setTransform(dpr,0,0,dpr,0,0);
  nextCv.width=56*dpr; nextCv.height=150*dpr;
  nextCv.style.width='56px'; nextCv.style.height='150px';
  nextCx.setTransform(dpr,0,0,dpr,0,0);
  drawBG(); drawNext(); render();
}
window.addEventListener('resize',()=>setTimeout(layout,80));

/* ================= 背景 ================= */
let bgDecos=[];
function makeBGDecos(){
  bgDecos=[];
  for(let i=0;i<26;i++)bgDecos.push({x:Math.random(),y:Math.random()*0.8,r:1+Math.random()*2.4,s:Math.random()*6.28});
}
function drawBG(t){
  const w=bgCv.width/dpr,h=bgCv.height/dpr;
  const th=STAGE_THEMES[(stage-1)%STAGE_THEMES.length];
  const g=bgCx.createLinearGradient(0,0,0,h);
  g.addColorStop(0,th.sky[0]); g.addColorStop(1,th.sky[1]);
  bgCx.fillStyle=g; bgCx.fillRect(0,0,w,h);
  // 装飾
  const tm=(t||0)/1000;
  bgCx.save();
  for(const d of bgDecos){
    const x=d.x*w, y=d.y*h;
    if(th.deco==='night'){
      bgCx.globalAlpha=0.5+0.5*Math.sin(tm*2+d.s);
      bgCx.fillStyle='#fff'; bgCx.beginPath(); bgCx.arc(x,y,d.r,0,7); bgCx.fill();
    }else if(th.deco==='snow'){
      bgCx.globalAlpha=0.85; bgCx.fillStyle='#fff';
      bgCx.beginPath(); bgCx.arc(x,(y+tm*22)%h,d.r+0.6,0,7); bgCx.fill();
    }else if(th.deco==='sakura'){
      bgCx.globalAlpha=0.8; bgCx.fillStyle='#ff8fc0';
      bgCx.beginPath(); bgCx.ellipse((x+tm*12)%w,(y+tm*16)%h,d.r+1.4,d.r*0.7,d.s+tm,0,7); bgCx.fill();
    }else{
      bgCx.globalAlpha=0.55; bgCx.fillStyle='#fff';
      const cxp=(x+tm*7)%(w+80)-40;
      bgCx.beginPath(); bgCx.arc(cxp,y*0.5+20,d.r*5,0,7);
      bgCx.arc(cxp+d.r*5,y*0.5+16,d.r*4,0,7);
      bgCx.arc(cxp-d.r*5,y*0.5+18,d.r*4,0,7); bgCx.fill();
    }
  }
  bgCx.restore();
  // 丘
  bgCx.fillStyle=th.hill;
  bgCx.beginPath(); bgCx.moveTo(0,h);
  for(let x=0;x<=w;x+=8)bgCx.lineTo(x,h-40-Math.sin(x*0.02)*18);
  bgCx.lineTo(w,h); bgCx.fill();
}

/* ================= どうぶつ描画 ================= */
function rr(c,x,y,w,h,r){c.beginPath();c.moveTo(x+r,y);c.arcTo(x+w,y,x+w,y+h,r);c.arcTo(x+w,y+h,x,y+h,r);c.arcTo(x,y+h,x,y,r);c.arcTo(x,y,x+w,y,r);c.closePath();}
function drawAnimal(c,px,py,s,type,scale){
  const a=ANIMALS[type]; scale=scale===undefined?1:scale;
  c.save(); c.translate(px+s/2,py+s/2); c.scale(scale,scale); c.translate(-s/2,-s/2);
  const m=s*0.06;
  // 本体
  const g=c.createLinearGradient(0,m,0,s-m);
  g.addColorStop(0,a.c1); g.addColorStop(1,shade(a.c1,-18));
  c.fillStyle=g; rr(c,m,m,s-m*2,s-m*2,s*0.26); c.fill();
  c.strokeStyle=a.c2; c.lineWidth=Math.max(1.5,s*0.045); c.stroke();
  // ハイライト
  c.fillStyle='rgba(255,255,255,.45)';
  rr(c,m+s*0.08,m+s*0.07,s*0.5,s*0.16,s*0.08); c.fill();
  const cxm=s/2, cym=s*0.56, u=s*0.05;
  c.fillStyle=a.c2;
  // 耳(タイプ別)
  if(type===0){ // ねこ 三角耳
    tri(c,cxm-6*u,m+2.4*u,3.4*u); tri(c,cxm+6*u,m+2.4*u,3.4*u);
  }else if(type===1){ // かえる 目玉が上
    c.beginPath();c.arc(cxm-4.6*u,m+2.8*u,2.8*u,0,7);c.arc(cxm+4.6*u,m+2.8*u,2.8*u,0,7);c.fill();
    c.fillStyle='#fff';c.beginPath();c.arc(cxm-4.6*u,m+2.8*u,1.9*u,0,7);c.arc(cxm+4.6*u,m+2.8*u,1.9*u,0,7);c.fill();
  }else if(type===2){ // うさぎ 長耳
    ear(c,cxm-4*u,m+1*u,2.2*u,6*u); ear(c,cxm+4*u,m+1*u,2.2*u,6*u);
  }else if(type===3){ // ぱんだ 丸耳(黒)
    c.fillStyle='#333';
    c.beginPath();c.arc(cxm-6*u,m+3*u,2.6*u,0,7);c.arc(cxm+6*u,m+3*u,2.6*u,0,7);c.fill();
  }else{ // ひよこ とさか
    c.fillStyle='#ff8f00';
    tri(c,cxm,m+1.6*u,2.6*u);
  }
  // 目
  c.fillStyle='#3b2b20';
  const ey=type===1?cym-0.5*u:cym-1.6*u;
  c.beginPath();c.arc(cxm-3.4*u,ey,1.15*u,0,7);c.arc(cxm+3.4*u,ey,1.15*u,0,7);c.fill();
  c.fillStyle='#fff';
  c.beginPath();c.arc(cxm-3.0*u,ey-0.4*u,0.4*u,0,7);c.arc(cxm+3.8*u,ey-0.4*u,0.4*u,0,7);c.fill();
  // ぱんだ目のふち
  if(type===3){c.strokeStyle='#333';c.lineWidth=1.6*u;c.beginPath();c.arc(cxm-3.4*u,ey,1.7*u,0,7);c.moveTo(cxm+5.1*u,ey);c.arc(cxm+3.4*u,ey,1.7*u,0,7);c.stroke();}
  // ほっぺ
  c.fillStyle='rgba(255,110,150,.5)';
  c.beginPath();c.arc(cxm-5.4*u,cym+1*u,1.3*u,0,7);c.arc(cxm+5.4*u,cym+1*u,1.3*u,0,7);c.fill();
  // 口/くちばし
  if(type===4){c.fillStyle='#ff8f00';tri(c,cxm,cym+1.2*u,1.6*u,true);}
  else{c.strokeStyle='#3b2b20';c.lineWidth=Math.max(1.2,0.5*u);c.beginPath();c.arc(cxm-1.1*u,cym+1*u,1.1*u,0.15,2.8);c.arc(cxm+1.1*u,cym+1*u,1.1*u,0.3,3.0);c.stroke();}
  c.restore();
}
function tri(c,x,y,r,down){c.beginPath();if(down){c.moveTo(x-r,y-r*0.6);c.lineTo(x+r,y-r*0.6);c.lineTo(x,y+r);}else{c.moveTo(x-r,y+r);c.lineTo(x+r,y+r);c.lineTo(x,y-r);}c.closePath();c.fill();}
function ear(c,x,y,w,h){c.beginPath();c.ellipse(x,y,w,h,0,0,7);c.fill();}
function shade(hex,amt){
  const n=parseInt(hex.slice(1),16);
  let r=(n>>16)+amt,g2=((n>>8)&255)+amt,b=(n&255)+amt;
  r=Math.max(0,Math.min(255,r));g2=Math.max(0,Math.min(255,g2));b=Math.max(0,Math.min(255,b));
  return '#'+((r<<16)|(g2<<8)|b).toString(16).padStart(6,'0');
}

/* ================= サウンド ================= */
let AC=null,bgmTimer=null,bgmStep=0,muted=false;
function ac(){if(!AC)AC=new (window.AudioContext||window.webkitAudioContext)();if(AC.state==='suspended')AC.resume();return AC;}
function beep(f,dur,type,vol,when){
  if(muted)return;try{const a=ac(),o=a.createOscillator(),g=a.createGain();
  o.type=type||'square';o.frequency.value=f;
  const t0=a.currentTime+(when||0);
  g.gain.setValueAtTime(vol||0.08,t0);g.gain.exponentialRampToValueAtTime(0.001,t0+dur);
  o.connect(g);g.connect(a.destination);o.start(t0);o.stop(t0+dur+0.02);}catch(e){}
}
function sMove(){beep(360,0.05,'square',0.04);}
function sRot(){beep(520,0.06,'triangle',0.06);}
function sDrop(){beep(200,0.09,'square',0.07);}
function sClear(n){for(let i=0;i<3;i++)beep(500+n*80+i*140,0.12,'triangle',0.08,i*0.06);}
function sFever(){[523,659,784,1047].forEach((f,i)=>beep(f,0.16,'triangle',0.1,i*0.09));}
function sStage(){[392,523,659,784].forEach((f,i)=>beep(f,0.18,'triangle',0.1,i*0.11));}
function sOver(){[494,440,392,330].forEach((f,i)=>beep(f,0.24,'triangle',0.09,i*0.16));}
const MELODY=[523,0,659,0,784,659,523,0, 587,0,698,0,880,698,587,0, 523,0,659,784,1047,0,784,659, 587,523,494,523,587,659,523,0];
function startBGM(){
  stopBGM();
  bgmTimer=setInterval(()=>{
    const f=MELODY[bgmStep%MELODY.length];
    if(f)beep(f,0.14,'triangle',feverOn?0.06:0.045);
    if(bgmStep%2===0)beep(f?f/2:131,0.1,'sine',0.03);
    bgmStep++;
  },feverOn?130:180);
}
function stopBGM(){if(bgmTimer){clearInterval(bgmTimer);bgmTimer=null;}}

/* ================= ゲームロジック ================= */
function newGrid(){grid=Array.from({length:ROWS},()=>Array(COLS).fill(-1));}
function randStack(){return [rt(),rt(),rt()];function rt(){return Math.floor(Math.random()*TYPES);}}
function spawn(){
  const sx=3;
  // 生成列が塞がっている、または最上段がほぼ埋まっていたら詰み→ゲームオーバー
  if(grid[HIDDEN][sx]!==-1||grid[HIDDEN+1][sx]!==-1)return false;
  let topFilled=0;
  for(let x=0;x<COLS;x++)if(grid[HIDDEN][x]!==-1)topFilled++;
  if(topFilled>=COLS-1)return false;
  piece={x:sx,y:-1,orient:0,stack:nextStack||randStack()};
  nextStack=randStack();
  drawNext();
  return true;
}
// orient 0=たて, 1=よこ
function cellsOf(x,y,orient,stack){
  if(orient===0)return[{x:x,y:y,t:stack[0]},{x:x,y:y-1,t:stack[1]},{x:x,y:y-2,t:stack[2]}];
  return[{x:x-1,y:y,t:stack[0]},{x:x,y:y,t:stack[1]},{x:x+1,y:y,t:stack[2]}];
}
function canPlace(x,y,orient){
  for(const c of cellsOf(x,y,orient,[0,0,0])){
    if(c.x<0||c.x>=COLS||c.y>=ROWS)return false;
    if(c.y>=0&&grid[c.y][c.x]!==-1)return false;
  }
  return true;
}
function colLandY(cx2,fromY){
  let y=fromY;
  while(y+1<ROWS&&(y+1<0||grid[y+1][cx2]===-1))y++;
  return y;
}
function lockPiece(){
  const y=Math.round(piece.y);
  for(const c of cellsOf(piece.x,y,piece.orient,piece.stack)){
    if(c.y>=0&&c.y<ROWS)grid[c.y][c.x]=c.t;
  }
  sDrop();
  piece=null;
  applyGravity();
  resolveMatches(1);
}
function findMatches(){
  const mark=new Set();
  const dirs=[[1,0],[0,1],[1,1],[1,-1]];
  for(let y=0;y<ROWS;y++)for(let x=0;x<COLS;x++){
    const t=grid[y][x]; if(t===-1)continue;
    for(const[dx,dy]of dirs){
      let n=1;
      while(inB(x+n*dx,y+n*dy)&&grid[y+n*dy][x+n*dx]===t)n++;
      if(n>=3)for(let k=0;k<n;k++)mark.add((y+k*dy)*COLS+(x+k*dx));
    }
  }
  return mark;
  function inB(x,y){return x>=0&&x<COLS&&y>=0&&y<ROWS;}
}
function resolveMatches(chain){
  const m=findMatches();
  if(m.size===0){
    animating=false;
    if(gameRunning&&!piece){
      if(cleared>=goal){stageUp();return;}
      if(!spawn()){doGameOver();return;}
    }
    return;
  }
  animating=true;
  const cells=[...m].map(k=>({x:k%COLS,y:Math.floor(k/COLS),type:grid[Math.floor(k/COLS)][k%COLS]}));
  clearAnim={cells,t:0,chain};
  sClear(chain);
  // スコア
  const base=cells.length*100*chain*(feverOn?2:1);
  score+=base; cleared+=cells.length;
  totalChainsMax=Math.max(totalChainsMax,chain);
  addFever(8+chain*5+cells.length);
  updateHUD();
  if(chain>=2)chainPop(chain,base);
  cheerMascot();
  spawnParticles(cells);
  setTimeout(()=>{
    for(const c of cells)grid[c.y][c.x]=-1;
    clearAnim=null;
    applyGravity();
    setTimeout(()=>resolveMatches(chain+1),120);
  },330);
}
function applyGravity(){
  for(let x=0;x<COLS;x++){
    let w=ROWS-1;
    for(let y=ROWS-1;y>=0;y--){
      if(grid[y][x]!==-1){grid[w][x]=grid[y][x];if(w!==y)grid[y][x]=-1;w--;}
    }
  }
}
function stageUp(){
  gameRunning=false;
  sStage();
  stage++;
  goal=15+stage*10;
  cleared=0;
  fallInterval=Math.max(300,850-(stage-1)*70);
  makeBGDecos();
  const pop=document.getElementById('stage-pop');
  document.getElementById('stage-pop-big').textContent='ステージ '+(stage-1)+' クリア!🎉';
  document.getElementById('stage-pop-sub').textContent='つぎは ステージ '+stage+' だよ!';
  pop.classList.add('show');
  updateHUD();
  setTimeout(()=>{
    pop.classList.remove('show');
    newGrid();
    gameRunning=true;
    spawn();
  },2200);
}
function addFever(n){
  if(feverOn)return;
  fever=Math.min(100,fever+n);
  if(fever>=100)startFever();
  document.getElementById('fever-bar').style.width=fever+'%';
}
function startFever(){
  feverOn=true; feverEnd=performance.now()+9000;
  sFever();
  document.getElementById('fever-flash').classList.add('on');
  document.getElementById('fever-label').textContent='🌟フィーバー! スコア2ばい!🌟';
  startBGM();
  chainPop(0,0,'フィーバー!!');
}
function endFever(){
  feverOn=false; fever=0;
  document.getElementById('fever-flash').classList.remove('on');
  document.getElementById('fever-bar').style.width='0%';
  document.getElementById('fever-label').textContent='フィーバーゲージ';
  startBGM();
}
function chainPop(chain,pts,txt){
  const layer=document.getElementById('popup-layer');
  const d=document.createElement('div');
  d.className='chain-pop';
  d.style.top=(30+Math.random()*25)+'%';
  d.textContent=txt||(chain+'れんさ! '+(PRAISE[Math.min(chain,PRAISE.length-1)]||''));
  layer.appendChild(d);
  setTimeout(()=>d.remove(),1000);
}
function spawnParticles(cells){
  for(const c of cells){
    for(let i=0;i<5;i++){
      particles.push({
        x:c.x*CELL+CELL/2, y:(c.y-HIDDEN)*CELL+CELL/2,
        vx:(Math.random()-0.5)*160, vy:-60-Math.random()*140,
        life:0.7, c:ANIMALS[c.type].c1
      });
    }
  }
}
function cheerMascot(){
  const m=document.getElementById('mascot');
  m.classList.remove('cheer'); void m.offsetWidth; m.classList.add('cheer');
}

/* ================= 入力 ================= */
function move(dx){
  if(!piece||animating||!gameRunning)return;
  if(canPlace(piece.x+dx,Math.ceil(piece.y),piece.orient)){piece.x+=dx;sMove();render();}
}
function cycle(){ // 回転:たて⇔よこ + 順番も1つ送る
  if(!piece||animating||!gameRunning)return;
  const no=piece.orient===0?1:0;
  const y=Math.ceil(piece.y);
  for(const kick of [0,-1,1,-2,2]){
    if(canPlace(piece.x+kick,y,no)){
      piece.x+=kick; piece.orient=no;
      piece.stack.unshift(piece.stack.pop());
      sRot(); render(); return;
    }
  }
  // 回転できないときは順番だけ入替
  piece.stack.unshift(piece.stack.pop());
  sRot(); render();
}
function hardDrop(){
  if(!piece||animating||!gameRunning)return;
  let y=Math.ceil(piece.y);
  while(canPlace(piece.x,y+1,piece.orient))y++;
  piece.y=y;
  score+=5; lockPiece(); updateHUD(); render();
}
function bindHold(id,fn){
  const el=document.getElementById(id);let iv=null;
  const start=e=>{e.preventDefault();fn();iv=setInterval(fn,150);};
  const end=()=>{if(iv){clearInterval(iv);iv=null;}};
  el.addEventListener('touchstart',start,{passive:false});
  el.addEventListener('touchend',end);el.addEventListener('touchcancel',end);
  el.addEventListener('mousedown',start);
  el.addEventListener('mouseup',end);el.addEventListener('mouseleave',end);
}
function setupInput(){
  bindHold('btn-left',()=>move(-1));
  bindHold('btn-right',()=>move(1));
  document.getElementById('btn-rot').addEventListener('pointerdown',e=>{e.preventDefault();cycle();});
  document.getElementById('btn-drop').addEventListener('pointerdown',e=>{e.preventDefault();hardDrop();});
  // スワイプ
  let sx=0,sy=0,st=0,moved=false;
  cv.addEventListener('touchstart',e=>{const t=e.touches[0];sx=t.clientX;sy=t.clientY;st=Date.now();moved=false;},{passive:true});
  cv.addEventListener('touchmove',e=>{
    const t=e.touches[0],dx=t.clientX-sx;
    if(Math.abs(dx)>CELL*0.9){move(dx>0?1:-1);sx=t.clientX;moved=true;}
  },{passive:true});
  cv.addEventListener('touchend',e=>{
    const t=e.changedTouches[0],dy=t.clientY-sy;
    if(dy>60){hardDrop();return;}
    if(!moved&&Date.now()-st<300)cycle();
  });
  if(!('ontouchstart'in window))cv.addEventListener('click',()=>cycle());
  document.addEventListener('keydown',e=>{
    if(!gameRunning)return;
    if(e.key==='ArrowLeft')move(-1);
    else if(e.key==='ArrowRight')move(1);
    else if(e.key==='ArrowUp'||e.key===' '){e.preventDefault();cycle();}
    else if(e.key==='ArrowDown'){e.preventDefault();hardDrop();}
  });
}

/* ================= 描画 ================= */
function render(){
  if(!grid.length)return;
  const w=CELL*COLS,h=CELL*(ROWS-HIDDEN);
  cx.clearRect(0,0,w,h);
  // 盤面パネル
  cx.fillStyle='rgba(255,255,255,.16)';
  cx.fillRect(0,0,w,h);
  cx.strokeStyle='rgba(255,255,255,.14)';cx.lineWidth=1;
  for(let x=1;x<COLS;x++){cx.beginPath();cx.moveTo(x*CELL,0);cx.lineTo(x*CELL,h);cx.stroke();}
  for(let y=1;y<ROWS-HIDDEN;y++){cx.beginPath();cx.moveTo(0,y*CELL);cx.lineTo(w,y*CELL);cx.stroke();}
  // 固定ブロック
  const clearSet=new Set(clearAnim?clearAnim.cells.map(c=>c.y*COLS+c.x):[]);
  for(let y=HIDDEN;y<ROWS;y++)for(let x=0;x<COLS;x++){
    const t=grid[y][x];if(t===-1)continue;
    if(clearSet.has(y*COLS+x)){
      const p=clearAnim.t;
      const sc=1+Math.sin(p*Math.PI)*0.25;
      cx.save();cx.globalAlpha=1-p*0.9;
      drawAnimal(cx,x*CELL,(y-HIDDEN)*CELL,CELL,t,sc);
      cx.restore();
    }else drawAnimal(cx,x*CELL,(y-HIDDEN)*CELL,CELL,t);
  }
  // ゴースト着地マーク(各セルの落下先)
  if(piece&&!animating){
    const y0=Math.ceil(piece.y);
    const cells=cellsOf(piece.x,y0,piece.orient,piece.stack);
    cx.save();cx.globalAlpha=0.28;
    cx.strokeStyle='#fff';cx.lineWidth=2.5;cx.setLineDash([6,5]);
    if(piece.orient===0){
      const ly=colLandY(piece.x,y0);
      for(let i=0;i<3;i++){
        const gy=ly-i;if(gy<HIDDEN)continue;
        rr(cx,piece.x*CELL+2,(gy-HIDDEN)*CELL+2,CELL-4,CELL-4,CELL*0.24);cx.stroke();
      }
    }else{
      for(const c of cells){
        const gy=colLandY(c.x,y0);if(gy<HIDDEN)continue;
        rr(cx,c.x*CELL+2,(gy-HIDDEN)*CELL+2,CELL-4,CELL-4,CELL*0.24);cx.stroke();
      }
    }
    cx.restore();
    // ピース
    for(const c of cells){
      if(c.y<HIDDEN-1)continue;
      drawAnimal(cx,c.x*CELL,(c.y-HIDDEN)*CELL,CELL,c.t);
    }
    if(feverOn){
      cx.save();cx.strokeStyle='rgba(255,110,199,.9)';cx.lineWidth=3;
      for(const c of cells){if(c.y<HIDDEN)continue;
        rr(cx,c.x*CELL+1,(c.y-HIDDEN)*CELL+1,CELL-2,CELL-2,CELL*0.24);cx.stroke();}
      cx.restore();
    }
  }
  // パーティクル
  for(const p of particles){
    cx.save();cx.globalAlpha=Math.max(0,p.life/0.7);
    cx.fillStyle=p.c;cx.beginPath();cx.arc(p.x,p.y,4,0,7);cx.fill();cx.restore();
  }
}
function drawNext(){
  nextCx.clearRect(0,0,56,150);
  if(!nextStack)return;
  for(let i=0;i<3;i++)drawAnimal(nextCx,8,8+ (2-i)*46,40,nextStack[i]);
}
function updateHUD(){
  document.getElementById('hud-score').textContent=score.toLocaleString();
  document.getElementById('hud-stage').textContent='ステージ'+stage;
  document.getElementById('goal-num').textContent=Math.max(0,goal-cleared);
  document.getElementById('fever-bar').style.width=fever+'%';
}

/* ================= マスコット ================= */
function drawMascotSVG(){
  const a=ANIMALS[2];
  document.getElementById('mascot').innerHTML=
   '<ellipse cx="50" cy="62" rx="30" ry="26" fill="'+a.c1+'" stroke="'+a.c2+'" stroke-width="3"/>'+
   '<ellipse cx="38" cy="26" rx="8" ry="20" fill="'+a.c1+'" stroke="'+a.c2+'" stroke-width="3"/>'+
   '<ellipse cx="62" cy="26" rx="8" ry="20" fill="'+a.c1+'" stroke="'+a.c2+'" stroke-width="3"/>'+
   '<circle cx="41" cy="58" r="4" fill="#3b2b20"/><circle cx="59" cy="58" r="4" fill="#3b2b20"/>'+
   '<circle cx="42.5" cy="56.5" r="1.4" fill="#fff"/><circle cx="60.5" cy="56.5" r="1.4" fill="#fff"/>'+
   '<circle cx="32" cy="68" r="4" fill="rgba(255,110,150,.55)"/><circle cx="68" cy="68" r="4" fill="rgba(255,110,150,.55)"/>'+
   '<path d="M46 68 Q50 72 54 68" stroke="#3b2b20" stroke-width="2.5" fill="none" stroke-linecap="round"/>';
}

/* ================= ループ ================= */
function loop(t){
  raf=requestAnimationFrame(loop);
  const dt=Math.min(0.05,(t-lastT)/1000);lastT=t;
  drawBG(t);
  // パーティクル更新
  for(const p of particles){p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=380*dt;p.life-=dt;}
  particles=particles.filter(p=>p.life>0);
  if(clearAnim)clearAnim.t=Math.min(1,clearAnim.t+dt*3);
  if(feverOn&&t>feverEnd)endFever();
  if(gameRunning&&piece&&!animating){
    fallTimer+=dt*1000;
    const iv=feverOn?fallInterval*0.85:fallInterval;
    if(fallTimer>=iv){
      fallTimer=0;
      if(canPlace(piece.x,Math.ceil(piece.y)+1,piece.orient))piece.y+=1;
      else{lockTimer+=iv;if(lockTimer>=iv){lockTimer=0;lockPiece();}}
    }
  }
  render();
}

/* ================= 画面遷移 ================= */
function startGame(){
  ac();
  document.getElementById('title-screen').style.display='none';
  document.getElementById('over-screen').classList.remove('show');
  document.getElementById('hud').classList.add('show');
  document.getElementById('main').classList.add('show');
  document.getElementById('controls').classList.add('show');
  score=0;stage=1;goal=20;cleared=0;fever=0;feverOn=false;
  fallInterval=850;gameOverFlag=false;totalChainsMax=0;
  newGrid();makeBGDecos();
  setTimeout(()=>{layout();gameRunning=true;spawn();updateHUD();startBGM();},60);
}
function doGameOver(){
  gameRunning=false;gameOverFlag=true;
  stopBGM();sOver();
  const best=parseInt(SAFE_LS.getItem(HS_KEY)||'0');
  const isNew=score>best;
  if(isNew)SAFE_LS.setItem(HS_KEY,String(score));
  const stars=score>=30000?3:score>=12000?2:score>=4000?1:0;
  document.getElementById('over-stars').textContent='⭐'.repeat(stars)+'☆'.repeat(3-stars);
  document.getElementById('over-score').textContent='スコア: '+score.toLocaleString();
  document.getElementById('over-best').textContent=isNew?'🎉 ハイスコア こうしん!':'ベスト: '+Math.max(best,score).toLocaleString();
  document.getElementById('over-msg').textContent=totalChainsMax>=3?'さいだい '+totalChainsMax+'れんさ! すごい!':'れんさを ねらってみよう!';
  document.getElementById('over-screen').classList.add('show');
}
function goBack(){
  stopBGM();cancelAnimationFrame(raf);gameRunning=false;
  if(window.parent!==window)window.parent.postMessage({type:'goBack'},'*');
  else history.back();
}

/* ================= 初期化 ================= */
function init(){
  newGrid();
  drawMascotSVG();
  // タイトルデモ
  const row=document.getElementById('demo-row');
  for(let i=0;i<5;i++){
    const c=document.createElement('canvas');
    c.width=52*dpr;c.height=52*dpr;c.className='demo-cell';
    c.style.width='52px';c.style.height='52px';
    const ctx2=c.getContext('2d');ctx2.setTransform(dpr,0,0,dpr,0,0);
    drawAnimal(ctx2,0,0,52,i%TYPES);
    row.appendChild(c);
  }
  document.getElementById('hs-num').textContent=parseInt(SAFE_LS.getItem(HS_KEY)||'0').toLocaleString();
  document.getElementById('start-btn').addEventListener('click',startGame);
  document.getElementById('retry-btn').addEventListener('click',startGame);
  document.getElementById('home-btn').addEventListener('click',goBack);
  document.getElementById('back-btn').addEventListener('click',goBack);
  document.getElementById('howto-btn').addEventListener('click',()=>document.getElementById('howto').classList.add('show'));
  document.getElementById('howto-close').addEventListener('click',()=>document.getElementById('howto').classList.remove('show'));
  setupInput();
  makeBGDecos();
  setTimeout(layout,50);
  lastT=performance.now();
  raf=requestAnimationFrame(loop);
}
init();
</script>
