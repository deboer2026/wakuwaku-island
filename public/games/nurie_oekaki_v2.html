<html lang="ja">
<head>
<script src="/games/wakuwaku_ui.js"></script>

<title>ぬりえ・おえかき｜わくわくアイランド</title>
<script src="/games/wakuwaku_bgm.js"></script>
<script src="/games/safe_area.js"></script>
<style>
:root{
  --sky:#A9DDF3;--cream:#FFF6E2;--grass:#9BE59B;--peach:#FFB3C6;--butter:#FFD97D;
  --lilac:#C6B4F0;--ink:#4A3B32;--blue:#84C7EB;--mint:#BCECCF;--coral:#FF967F;
  --sat:env(safe-area-inset-top,0px);--sab:env(safe-area-inset-bottom,0px);
  --sal:env(safe-area-inset-left,0px);--sar:env(safe-area-inset-right,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--sky);color:var(--ink);font-family:"M PLUS Rounded 1c","Hiragino Maru Gothic ProN",system-ui,sans-serif;touch-action:none;overscroll-behavior:none}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:4px solid var(--lilac);outline-offset:2px}
#app{position:fixed;inset:0;overflow:hidden;background:linear-gradient(#BDE8F8 0 56%,#DDF1C6 56% 100%)}
.screen{position:absolute;inset:0;display:none;z-index:10}.screen.on{display:flex}
.decor{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.cloud{position:absolute;background:rgba(255,246,226,.88);border:3px solid rgba(74,59,50,.12);border-radius:999px}.cloud:before,.cloud:after{content:"";position:absolute;background:inherit;border-radius:50%}.cloud:before{width:46%;height:140%;left:12%;bottom:0}.cloud:after{width:36%;height:115%;right:15%;bottom:0}
.c1{width:150px;height:42px;left:-30px;top:10%;animation:drift 15s linear infinite alternate}.c2{width:118px;height:34px;right:-20px;top:18%;animation:drift 19s linear infinite alternate-reverse}.c3{width:90px;height:28px;left:55%;top:5%;animation:drift 17s linear infinite alternate}
@keyframes drift{to{transform:translateX(45px)}}
.hill{position:absolute;left:-12%;right:-12%;height:36vh;bottom:-10vh;background:#A6DF92;border-radius:50% 50% 0 0/38% 38% 0 0}
.topbar{position:absolute;left:0;right:0;top:0;height:calc(64px + var(--sat));padding:calc(9px + var(--sat)) max(10px,var(--sar)) 8px max(10px,var(--sal));display:flex;align-items:flex-end;justify-content:space-between;gap:8px;z-index:50;pointer-events:none}.topbar>*{pointer-events:auto}
.pill{min-width:58px;height:48px;border:3px solid var(--ink);border-radius:999px;background:var(--cream);box-shadow:0 4px 0 var(--ink);font-weight:1000;font-size:15px;padding:0 15px}.pill:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
.top-title{max-width:58vw;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;background:rgba(255,246,226,.94);border:3px solid var(--ink);border-radius:999px;padding:9px 16px;font-weight:1000;font-size:15px}
.card{background:rgba(255,246,226,.97);border:4px solid var(--ink);border-radius:30px;box-shadow:0 8px 0 rgba(74,59,50,.24)}
#title{align-items:center;justify-content:center;padding:calc(18px + var(--sat)) calc(16px + var(--sar)) calc(18px + var(--sab)) calc(16px + var(--sal))}
.title-card{width:min(95vw,610px);padding:20px 18px 18px;position:relative;overflow:hidden}.title-badge{position:absolute;right:-44px;top:20px;transform:rotate(34deg);padding:7px 48px;background:var(--butter);border:3px solid var(--ink);font-weight:1000;font-size:12px}.title-sound,.title-back{position:absolute;top:12px;min-width:42px;height:38px;border:3px solid var(--ink);border-radius:999px;background:var(--cream);font-weight:1000}.title-sound{left:12px}.title-back{left:61px}.logo{text-align:center;font-size:clamp(31px,7vw,48px);font-weight:1000;line-height:1.05}.logo small{display:block;font-size:.44em;margin-top:9px;color:#775A4C}.hero-strip{display:flex;justify-content:center;gap:12px;align-items:flex-end;height:82px;margin:8px 0}.hero-dot{width:62px;height:62px;border:3px solid var(--ink);border-radius:22px;position:relative;animation:bob 1.8s ease-in-out infinite;background:var(--peach)}.hero-dot:nth-child(2){background:var(--butter);animation-delay:.25s}.hero-dot:nth-child(3){background:var(--lilac);animation-delay:.5s}.hero-dot:nth-child(4){background:var(--mint);animation-delay:.75s}@keyframes bob{50%{transform:translateY(-8px) rotate(2deg)}}.hero-dot:before,.hero-dot:after{content:"";position:absolute;top:21px;width:7px;height:9px;border-radius:50%;background:var(--ink)}.hero-dot:before{left:16px}.hero-dot:after{right:16px}.hero-mouth{position:absolute;left:50%;bottom:13px;width:22px;height:10px;border-bottom:3px solid var(--ink);border-radius:50%;transform:translateX(-50%)}
.mode-grid{display:grid;grid-template-columns:1fr 1fr;gap:11px;margin-top:10px}.mode{min-height:112px;border:3px solid var(--ink);border-radius:22px;box-shadow:0 5px 0 var(--ink);font-weight:1000;padding:10px;display:flex;align-items:center;gap:10px;text-align:left;background:var(--peach)}.mode:nth-child(2){background:var(--blue)}.mode:nth-child(3){background:var(--butter)}.mode:nth-child(4){background:var(--lilac)}.mode:active{transform:translateY(4px);box-shadow:0 1px 0 var(--ink)}.mode-ico{flex:0 0 56px;width:56px;height:56px;border:3px solid var(--ink);border-radius:18px;background:var(--cream);display:grid;place-items:center;position:relative}.mode-ico .blob{width:30px;height:34px;border:3px solid var(--ink);border-radius:50% 46% 50% 42%;background:var(--peach)}.mode-ico .pen{width:12px;height:40px;border:3px solid var(--ink);border-radius:5px;background:var(--coral);transform:rotate(38deg)}.mode-ico .sheet{width:34px;height:38px;border:3px solid var(--ink);border-radius:8px;background:var(--cream);box-shadow:7px 6px 0 var(--blue)}.mode-ico .crowd{width:39px;height:25px;position:relative}.crowd:before,.crowd:after,.crowd{border:3px solid var(--ink);border-radius:50%;background:var(--mint)}.crowd:before,.crowd:after{content:"";position:absolute;width:25px;height:25px;top:-9px}.crowd:before{left:-13px;background:var(--peach)}.crowd:after{right:-13px;background:var(--butter)}.mode strong{display:block;font-size:20px;line-height:1.15}.mode span{display:block;font-size:12px;line-height:1.35;margin-top:4px}.title-foot{text-align:center;font-size:12px;font-weight:900;opacity:.72;margin-top:12px}

#templateSelect,#bodySelect{align-items:center;justify-content:center;padding:calc(76px + var(--sat)) 12px calc(14px + var(--sab))}.select-card{width:min(97vw,760px);height:min(86vh,720px);padding:14px;display:flex;flex-direction:column;min-height:0}.select-head{text-align:center;font-size:25px;font-weight:1000;margin:2px 0 8px}.tabs{display:flex;gap:7px;overflow-x:auto;padding:2px 2px 8px}.tab{flex:0 0 auto;min-width:86px;height:46px;border:3px solid var(--ink);border-radius:999px;background:var(--cream);box-shadow:0 3px 0 var(--ink);font-weight:1000}.tab.on{background:var(--butter)}
.template-grid{flex:1;min-height:0;overflow:auto;display:grid;grid-template-columns:repeat(4,1fr);gap:9px;padding:4px 2px 6px}.tpl{min-height:132px;border:3px solid var(--ink);border-radius:20px;background:#FFEBD2;box-shadow:0 4px 0 var(--ink);padding:7px;font-weight:1000;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px}.tpl:nth-child(3n+2){background:#E0F1F7}.tpl:nth-child(3n){background:#E9E1F7}.tpl:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}.tpl svg{width:100%;height:88px}.tpl-label{font-size:14px}.tpl-world{font-size:10px;opacity:.72}
.body-grid{flex:1;min-height:0;overflow:auto;display:grid;grid-template-columns:repeat(4,1fr);gap:10px;padding:4px}.body-btn{min-height:150px;border:3px solid var(--ink);border-radius:20px;background:#FFEBD2;box-shadow:0 4px 0 var(--ink);padding:8px;font-weight:1000}.body-btn:nth-child(2n){background:#E2F1FA}.body-btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}.body-preview{width:70px;height:95px;margin:auto;position:relative}.bp-head{position:absolute;width:46px;height:40px;left:12px;top:4px;border:3px solid var(--ink);border-radius:50%;background:var(--peach)}.bp-body{position:absolute;width:44px;height:46px;left:13px;top:41px;border:3px solid var(--ink);border-radius:40% 40% 45% 45%;background:var(--mint)}.bp-ear{position:absolute;width:14px;height:30px;top:-10px;border:3px solid var(--ink);border-radius:50%;background:var(--butter)}.bp-ear.l{left:8px}.bp-ear.r{right:8px}.bp-wing{position:absolute;width:28px;height:34px;top:44px;border:3px solid var(--ink);border-radius:50%;background:var(--lilac)}.bp-wing.l{left:-9px;transform:rotate(-25deg)}.bp-wing.r{right:-9px;transform:rotate(25deg)}.bp-tail{position:absolute;width:28px;height:16px;right:-12px;top:58px;border:3px solid var(--ink);border-radius:50%;background:var(--butter)}.bp-robot .bp-head{border-radius:8px}.bp-robot .bp-body{border-radius:8px}.bp-round .bp-body{width:54px;height:54px;left:8px;border-radius:50%}.bp-fish .bp-body{width:58px;height:38px;left:4px;top:45px;border-radius:50%}.bp-fish .bp-head{width:38px;height:38px;left:16px}.body-name{font-size:14px;margin-top:5px}

#studio,#freeStudio,#nurieStudio{flex-direction:column;padding-top:calc(64px + var(--sat));background:linear-gradient(#D9EFF9,#FFF0D6)}.studio-wrap{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;padding:7px}.paper{position:relative;width:min(94vw,560px);height:min(61vh,565px);background:var(--cream);border:4px solid var(--ink);border-radius:24px;box-shadow:0 7px 0 rgba(74,59,50,.2);overflow:hidden}.draw-canvas,.guide-canvas{position:absolute;inset:0;width:100%;height:100%}.guide-canvas{pointer-events:none}.paper-hint{position:absolute;left:50%;top:10px;transform:translateX(-50%);padding:5px 12px;border:2px solid var(--ink);border-radius:999px;background:rgba(255,246,226,.9);font-size:12px;font-weight:1000;white-space:nowrap;pointer-events:none}.dock{background:rgba(255,246,226,.98);border-top:4px solid var(--ink);padding:7px max(8px,var(--sar)) calc(8px + var(--sab)) max(8px,var(--sal));display:flex;flex-direction:column;gap:7px}.palette{display:flex;gap:7px;overflow-x:auto;padding:2px 3px}.sw{flex:0 0 46px;width:46px;height:46px;border:3px solid var(--ink);border-radius:50%;box-shadow:0 3px 0 rgba(74,59,50,.3)}.sw.on{outline:4px solid var(--butter);transform:scale(1.07)}.tool-row{display:flex;gap:7px;overflow-x:auto;padding:2px 2px 4px}.tool{flex:0 0 auto;min-height:46px;border:3px solid var(--ink);border-radius:15px;background:var(--cream);box-shadow:0 3px 0 var(--ink);padding:6px 12px;font-size:13px;font-weight:1000}.tool.on{background:var(--butter)}.tool.magic{background:linear-gradient(90deg,var(--peach),var(--butter),var(--mint),var(--blue),var(--lilac));font-size:16px;min-width:135px}.tool:active{transform:translateY(2px);box-shadow:0 1px 0 var(--ink)}.tool.locked{opacity:.5;filter:saturate(.4)}
#nurieStage{position:absolute;inset:8px;display:grid;place-items:center}.nurie-svg{width:100%;height:100%;max-width:520px;max-height:520px}.fillable{cursor:pointer;transition:fill .1s ease}.outline{stroke:var(--ink);stroke-width:4;stroke-linecap:round;stroke-linejoin:round}

#magic{z-index:90;align-items:center;justify-content:center;background:radial-gradient(circle at center,#FFF1B5 0,#D9C9FA 44%,#91D1EC 100%)}.magic-box{text-align:center}.magic-ring{width:min(66vw,310px);aspect-ratio:1;border:6px solid var(--ink);border-radius:50%;background:rgba(255,246,226,.62);display:grid;place-items:center;margin:auto;position:relative;box-shadow:0 0 0 12px rgba(255,217,125,.34)}.magic-ring:before,.magic-ring:after{content:"";position:absolute;inset:-24px;border:5px dashed rgba(74,59,50,.52);border-radius:50%;animation:spin 4s linear infinite}.magic-ring:after{inset:-45px;animation-direction:reverse;animation-duration:7s}@keyframes spin{to{transform:rotate(360deg)}}.magic-core{width:82px;height:82px;background:var(--butter);clip-path:polygon(50% 0,61% 34%,98% 35%,68% 57%,79% 94%,50% 73%,21% 94%,32% 57%,2% 35%,39% 35%);animation:pulse .65s ease-in-out infinite alternate}@keyframes pulse{to{transform:scale(1.25) rotate(8deg)}}.magic-text{font-size:30px;font-weight:1000;margin-top:18px;text-shadow:0 3px 0 var(--cream)}

#world,#parade{z-index:20;background:var(--sky)}.world-canvas,.parade-canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none}.world-hud{position:absolute;left:0;right:0;top:0;padding:calc(9px + var(--sat)) max(10px,var(--sar)) 0 max(10px,var(--sal));display:flex;justify-content:space-between;align-items:flex-start;gap:8px;z-index:35;pointer-events:none}.world-hud>*{pointer-events:auto}.counter{height:48px;display:flex;align-items:center;gap:7px;border:3px solid var(--ink);border-radius:999px;background:var(--cream);box-shadow:0 3px 0 var(--ink);padding:0 13px;font-weight:1000}.star-mini{width:20px;height:20px;background:var(--butter);clip-path:polygon(50% 0,61% 35%,98% 35%,68% 57%,79% 94%,50% 72%,21% 94%,32% 57%,2% 35%,39% 35%)}.world-msg{position:absolute;left:50%;top:calc(72px + var(--sat));transform:translateX(-50%);z-index:40;background:rgba(255,246,226,.95);border:3px solid var(--ink);border-radius:999px;padding:8px 16px;font-weight:1000;font-size:14px;white-space:nowrap}.world-msg.pop{animation:msgpop .55s ease}@keyframes msgpop{0%{transform:translateX(-50%) scale(.7)}55%{transform:translateX(-50%) scale(1.16)}100%{transform:translateX(-50%) scale(1)}}.world-controls{position:absolute;left:0;right:0;bottom:0;z-index:40;padding:8px max(10px,var(--sar)) calc(12px + var(--sab)) max(10px,var(--sal));display:flex;justify-content:center;gap:9px;align-items:flex-end}.action{min-width:116px;min-height:58px;border:4px solid var(--ink);border-radius:20px;background:var(--butter);box-shadow:0 5px 0 var(--ink);font-size:17px;font-weight:1000}.action:nth-child(2){background:var(--peach)}.action:nth-child(3){background:var(--mint)}.action:active{transform:translateY(4px);box-shadow:0 1px 0 var(--ink)}.move-help{position:absolute;left:50%;bottom:calc(84px + var(--sab));transform:translateX(-50%);background:rgba(255,246,226,.86);border:2px solid var(--ink);border-radius:999px;padding:6px 13px;font-size:12px;font-weight:1000;z-index:30;white-space:nowrap}
.result-card{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%) scale(.9);width:min(90vw,410px);padding:24px;z-index:60;text-align:center;display:none}.result-card.on{display:block;animation:resultIn .45s ease forwards}@keyframes resultIn{to{transform:translate(-50%,-50%) scale(1)}}.result-stars{font-size:48px;letter-spacing:6px;color:#E4A72F;text-shadow:0 3px 0 var(--ink)}.result-title{font-size:26px;font-weight:1000;margin:6px 0}.result-sub{font-size:14px;font-weight:900;line-height:1.5}.result-actions{display:flex;gap:8px;justify-content:center;margin-top:14px}.result-actions .tool{font-size:14px;background:var(--mint)}

#gallery{align-items:center;justify-content:center;padding:calc(76px + var(--sat)) 12px calc(14px + var(--sab));background:linear-gradient(#CDEBF7,#F9EBD5)}.gallery-card{width:min(96vw,760px);height:min(86vh,720px);padding:14px;display:flex;flex-direction:column;min-height:0}.gallery-head{display:flex;justify-content:center;align-items:center;gap:9px;margin-bottom:7px}.gallery-title{font-size:25px;font-weight:1000}.gallery-count{background:var(--butter);border:3px solid var(--ink);border-radius:999px;padding:5px 11px;font-weight:1000}.gallery-grid{flex:1;min-height:0;overflow:auto;display:grid;grid-template-columns:repeat(4,1fr);gap:9px;padding:3px}.slot{position:relative;aspect-ratio:1;border:3px solid var(--ink);border-radius:18px;background:#E9DFF8;overflow:hidden;box-shadow:0 3px 0 var(--ink)}.slot.empty{background:repeating-linear-gradient(45deg,#F5E9D7,#F5E9D7 10px,#EFDCC5 10px,#EFDCC5 20px);opacity:.58}.slot img{width:100%;height:100%;object-fit:cover}.slot button{position:absolute;left:7px;right:7px;bottom:7px;height:38px;border:2px solid var(--ink);border-radius:999px;background:var(--cream);font-weight:1000}.gallery-actions{display:flex;gap:8px;justify-content:center;padding-top:9px;flex-wrap:wrap}.gallery-actions .tool{font-size:14px}.gallery-actions .parade{background:var(--lilac);font-size:15px}
.parade-title{position:absolute;left:50%;top:calc(16px + var(--sat));transform:translateX(-50%);z-index:40;border:3px solid var(--ink);background:var(--cream);border-radius:999px;padding:9px 17px;font-size:18px;font-weight:1000}.parade-controls{position:absolute;left:0;right:0;bottom:0;padding:8px max(10px,var(--sar)) calc(12px + var(--sab)) max(10px,var(--sal));display:flex;justify-content:center;gap:8px;z-index:40}.parade-controls .action{min-width:108px}.empty-parade{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);padding:20px;width:min(88vw,420px);text-align:center;font-size:18px;font-weight:1000;line-height:1.6}
.toast{position:fixed;left:50%;bottom:calc(96px + var(--sab));transform:translate(-50%,20px);opacity:0;z-index:150;background:var(--cream);border:3px solid var(--ink);border-radius:999px;padding:8px 15px;font-size:13px;font-weight:1000;pointer-events:none;transition:.2s}.toast.on{opacity:1;transform:translate(-50%,0)}
@media(max-width:620px){.template-grid,.body-grid,.gallery-grid{grid-template-columns:repeat(3,1fr)}.tpl{min-height:122px}.action{min-width:94px}.world-controls{gap:6px}.mode{min-height:104px}.mode strong{font-size:18px}.mode-ico{flex-basis:50px;width:50px;height:50px}}
@media(max-width:420px){.template-grid,.body-grid,.gallery-grid{grid-template-columns:repeat(2,1fr)}.title-card{padding:18px 12px 14px}.hero-strip{height:68px}.hero-dot{width:52px;height:52px}.mode{min-height:92px;padding:8px}.mode strong{font-size:17px}.mode span{font-size:11px}.mode-ico{flex-basis:44px;width:44px;height:44px}.paper{height:min(58vh,500px)}.action{font-size:14px;min-width:84px;min-height:54px}.move-help{bottom:calc(78px + var(--sab))}}
@media (max-height:500px) and (min-width:600px){#title{padding:8px 16px}.title-card{padding:10px 14px;max-height:calc(100vh - 16px)}.title-badge{display:none}.logo{font-size:30px}.logo small{margin-top:3px}.hero-strip{height:43px;margin:3px 0}.hero-dot{width:38px;height:38px;border-radius:14px}.hero-dot:before,.hero-dot:after{top:12px;width:5px;height:6px}.hero-dot:before{left:9px}.hero-dot:after{right:9px}.hero-mouth{bottom:7px;width:14px;height:7px}.mode-grid{gap:7px;margin-top:5px}.mode{min-height:64px;padding:6px;gap:7px}.mode-ico{flex-basis:34px;width:34px;height:34px;border-radius:11px}.mode-ico .blob{width:20px;height:22px}.mode-ico .pen{height:26px;width:9px}.mode-ico .sheet{width:20px;height:24px}.mode strong{font-size:15px}.mode span{font-size:10px;margin-top:1px}.title-foot{display:none}}
</style>
</head>
<body>
<div id="app">
  <div class="decor"><div class="cloud c1"></div><div class="cloud c2"></div><div class="cloud c3"></div><div class="hill"></div></div>

  <section id="title" class="screen on">
    <div class="card title-card">
      <div class="title-badge">NEW</div><button class="title-sound" id="titleMusic" aria-label="おとの オンオフ">おと</button><button class="title-back" id="titleBack">もどる</button>
      <div class="logo">ぬりえ・おえかき<small>おえかきが うごきだす！</small></div>
      <div class="hero-strip"><div class="hero-dot"><i class="hero-mouth"></i></div><div class="hero-dot"><i class="hero-mouth"></i></div><div class="hero-dot"><i class="hero-mouth"></i></div><div class="hero-dot"><i class="hero-mouth"></i></div></div>
      <div class="mode-grid">
        <button class="mode" id="goNurie"><span class="mode-ico"><i class="blob"></i></span><span><strong>ぬりえ</strong><span>24しゅるい<br>ぬって うごかそう</span></span></button>
        <button class="mode" id="goChar"><span class="mode-ico"><i class="pen"></i></span><span><strong>キャラづくり</strong><span>8タイプ<br>かいて うごかそう</span></span></button>
        <button class="mode" id="goFree"><span class="mode-ico"><i class="sheet"></i></span><span><strong>じゆうおえかき</strong><span>なんでも かこう<br>えが ふわふわ</span></span></button>
        <button class="mode" id="goGallery"><span class="mode-ico"><i class="crowd"></i></span><span><strong>わたしのずかん</strong><span>さくひんを みる<br>みんなで パレード</span></span></button>
      </div>
      <div class="title-foot">じょうず・へたは ありません。すきな いろで あそぼう！</div>
    </div>
  </section>

  <section id="templateSelect" class="screen">
    <div class="topbar"><button class="pill" data-back="title">もどる</button><div class="top-title">どれを ぬる？</div><button class="pill" id="tplGallery">ずかん</button></div>
    <div class="card select-card">
      <div class="select-head">ぬりえを えらぼう</div>
      <div class="tabs" id="templateTabs"></div>
      <div class="template-grid" id="templateGrid"></div>
    </div>
  </section>

  <section id="bodySelect" class="screen">
    <div class="topbar"><button class="pill" data-back="title">もどる</button><div class="top-title">どんな キャラ？</div><button class="pill" id="bodyGallery">ずかん</button></div>
    <div class="card select-card">
      <div class="select-head">からだを えらぼう</div>

let galleryFrom='title';function openGallery(from){galleryFrom=from;renderGallery();show('gallery')}
function renderWorkPreview(canvas,item){const c=canvas.getContext('2d'),w=canvas.width,h=canvas.height;c.fillStyle='#FFF6E2';c.fillRect(0,0,w,h);if(item.mode==='nurie'){const cs=Object.values(item.fills||{});c.fillStyle=cs[0]||'#FFB3C6';c.beginPath();c.arc(w*.5,h*.42,Math.min(w,h)*.27,0,Math.PI*2);c.fill();c.fillStyle=cs[1]||'#FFD97D';c.beginPath();c.ellipse(w*.5,h*.72,w*.28,h*.16,0,0,Math.PI*2);c.fill()}else{const sx=w/(item.mode==='char'?360:420),sy=h/(item.mode==='char'?420:420);for(const s of item.strokes||[]){const [x1,y1,x2,y2,t,col]=s;c.save();c.lineCap='round';c.lineJoin='round';c.lineWidth=(t==='marker'?20:t==='brush'?13:8)*(sx+sy)/2;c.strokeStyle=t==='eraser'?'#FFF6E2':col;c.globalAlpha=t==='marker'?.52:1;c.beginPath();c.moveTo(x1*sx,y1*sy);c.lineTo(x2*sx,y2*sy);c.stroke();c.restore()}if(item.mode==='char'){c.strokeStyle='#4A3B32';c.lineWidth=3;c.beginPath();c.arc(w*.5,h*.33,w*.2,0,Math.PI*2);c.stroke();c.strokeRect(w*.33,h*.5,w*.34,h*.27)}}}
function renderGallery(){const host=$('galleryGrid');host.innerHTML='';$('galleryCount').textContent=gallery.length;for(let i=0;i<TUNE.maxGallery;i++){const item=gallery[i],d=document.createElement('div');d.className='slot'+(item?'':' empty');if(item){const preview=document.createElement('canvas');preview.width=220;preview.height=220;preview.setAttribute('aria-label','保存した さくひん');renderWorkPreview(preview,item);d.appendChild(preview);const b=document.createElement('button');b.textContent='このこで あそぶ';b.onclick=()=>playSaved(item);d.appendChild(b)}host.appendChild(d)}}
function replayStrokes(c,w,h,strokes){fillPaper(c,w,h);for(const s of strokes||[]){const [x1,y1,x2,y2,t,col]=s;c.save();c.lineCap='round';c.lineJoin='round';c.lineWidth=t==='marker'?20:t==='brush'?13:t==='eraser'?28:8;c.globalAlpha=t==='marker'?.52:1;c.strokeStyle=t==='eraser'?'#FFF6E2':col;c.beginPath();c.moveTo(x1,y1);c.lineTo(x2,y2);c.stroke();c.restore()}}
async function playSaved(item){const d=normalRecord(item);if(!d)return;currentMode=d.mode;worldType=d.world;if(d.mode==='char'){currentBody=BODIES.find(b=>b.id===d.body)||BODIES[0];replayStrokes(actx,360,420,d.strokes);drawGuide(currentBody);worldSource={mode:'char',canvas:art,body:currentBody.id}}else if(d.mode==='free'){replayStrokes(fctx,420,420,d.strokes);worldSource={mode:'free',canvas:free}}else{currentTpl=TEMPLATES.find(t=>t.id===d.template)||TEMPLATES[0];$('nurieStage').innerHTML=templateSvg(currentTpl);$$('#nurieStage .fillable').forEach((el,i)=>el.setAttribute('fill',d.fills['r'+i]||'#FFF6E2'));const svg=$('nurieStage').querySelector('svg').outerHTML;worldSource={mode:'nurie',img:await svgToImage(svg),svg,template:currentTpl.id}}show('world');startWorld()}
$('galleryBack').onclick=()=>show(galleryFrom||'title');$('galleryHome').onclick=()=>show('title');$('newCharBtn').onclick=()=>show('bodySelect');$('newNurieBtn').onclick=()=>show('templateSelect');

const pc=$('paradeCanvas'),pctx=pc.getContext('2d');let PW=0,PH=0,PDPR=1,paradeRun=false,paradeItems=[],paradePhase=0,paradeDanceT=0,paradeJumpT=0,paradeLast=0;
function resizeParade(){PW=innerWidth;PH=innerHeight;PDPR=Math.min(devicePixelRatio||1,2);pc.width=PW*PDPR;pc.height=PH*PDPR;pc.style.width=PW+'px';pc.style.height=PH+'px';pctx.setTransform(PDPR,0,0,PDPR,0,0)}addEventListener('resize',resizeParade);resizeParade();
async function openParade(){show('parade');resizeParade();$('emptyParade').style.display=gallery.length<3?'block':'none';paradeItems=gallery.slice(0,6).map(item=>{const cv=document.createElement('canvas');cv.width=220;cv.height=220;renderWorkPreview(cv,item);return{mode:'record',canvas:cv,recordMode:item.mode,body:item.body||'normal'}});paradePhase=0;paradeRun=true;paradeLast=performance.now();requestAnimationFrame(paradeLoop)}
function paradeLoop(now){if(!paradeRun||!$('parade').classList.contains('on'))return;const dt=Math.min(.05,(now-paradeLast)/1000);paradeLast=now;paradePhase+=dt;if(paradeDanceT>0)paradeDanceT-=dt;if(paradeJumpT>0)paradeJumpT-=dt;pctx.clearRect(0,0,PW,PH);const g=pctx.createLinearGradient(0,0,0,PH);g.addColorStop(0,'#A9DDF3');g.addColorStop(.63,'#DFF2FA');g.addColorStop(.631,'#9BE59B');g.addColorStop(1,'#9BE59B');pctx.fillStyle=g;pctx.fillRect(0,0,PW,PH);for(let i=0;i<12;i++){pctx.fillStyle=i%2?'#FFB3C6':'#FFD97D';pctx.beginPath();pctx.arc((i*103)%PW,PH*.69+(i%3)*15,5,0,Math.PI*2);pctx.fill()}if(paradeItems.length>=1){const n=paradeItems.length,spacing=Math.min(150,(PW-50)/Math.max(1,n)),start=PW/2-spacing*(n-1)/2;paradeItems.forEach((it,i)=>{const x=start+i*spacing,y=PH*.66-(paradeJumpT>0?Math.sin(Math.min(1,paradeJumpT/.7)*Math.PI)*55:0);drawCurrentCharacter(pctx,x,y,.78,it,paradePhase+i*.15,paradeDanceT,0)})}requestAnimationFrame(paradeLoop)}
$('paradeBtn').onclick=openParade;$('paradeBack').onclick=()=>{paradeRun=false;show('gallery')};$('paradeDance').onclick=()=>{if(gallery.length<3){toast('あと '+Math.max(0,3-gallery.length)+'こ つくろう！');return}paradeDanceT=2.8;magicSound()};$('paradeJump').onclick=()=>{if(gallery.length<3){toast('あと '+Math.max(0,3-gallery.length)+'こ つくろう！');return}paradeJumpT=.7;good()};

document.addEventListener('visibilitychange',()=>{if(document.hidden){stopBgm();worldRunning=false;paradeRun=false}else if(audioOn)startBgm()});
addEventListener('keydown',e=>{const k=e.key.toLowerCase();if($('world').classList.contains('on')){if(['arrowleft','a'].includes(k)){e.preventDefault();targetX=Math.max(55,targetX-66)}if(['arrowright','d'].includes(k)){e.preventDefault();targetX=Math.min(WW-55,targetX+66)}if(k===' '){e.preventDefault();doAction()}}if(e.key==='Escape'){if($('world').classList.contains('on'))$('worldBack').click();else if($('parade').classList.contains('on'))$('paradeBack').click();else show('title')}});
function goParent(){try{parent.postMessage({type:'goBack'},'*')}catch(_){}}
$('titleBack').onclick=goParent;
</script>
