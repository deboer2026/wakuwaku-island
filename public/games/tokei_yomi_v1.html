<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>とけいよみ</title>
<link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@400;700;800;900&display=swap" rel="stylesheet">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'M PLUS Rounded 1c', sans-serif; overflow: hidden; background: #0d0030; }
#game-wrap { width: 100vw; height: 100svh; max-width: 480px; margin: 0 auto; position: relative; overflow: hidden; }
canvas#bg { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }

/* HUD */
#hud {
  position: fixed; top: 0; left: 50%; transform: translateX(-50%);
  width: 100%; max-width: 480px; z-index: 100; box-sizing: border-box;
  padding: 8px 12px; padding-top: max(12px, var(--sat, env(safe-area-inset-top, 0px))); display: none;
  background: linear-gradient(180deg, rgba(10,0,40,0.93) 0%, rgba(10,0,40,0.6) 70%, transparent);
}
.hud-nav { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; }
#back-btn { background: rgba(0,0,0,0.55); color: white; border: 1.5px solid rgba(255,255,255,0.3); border-radius: 20px; padding: 5px 14px; font-size: 12px; font-weight: 700; cursor: pointer; font-family: inherit; }
#ui-bgm-btn { background: rgba(0,0,0,0.55); color: white; border: 1.5px solid rgba(255,255,255,0.3); border-radius: 50%; width: 32px; height: 32px; font-size: 16px; cursor: pointer; display: flex; align-items: center; justify-content: center; }
#status-bar { display: flex; justify-content: center; gap: 10px; align-items: center; margin-bottom: 6px; }
.hud-chip { background: rgba(0,0,0,0.6); border: 1.5px solid rgba(255,215,0,0.35); border-radius: 12px; padding: 3px 12px; display: flex; align-items: center; gap: 6px; }
.hud-chip-label { font-size: 9px; color: rgba(255,255,255,0.5); font-weight: 700; }
.hud-chip-val { font-size: 16px; font-weight: 900; color: #FFD700; }
#progress-bg { height: 6px; background: rgba(255,255,255,0.1); border-radius: 3px; overflow: hidden; max-width: 320px; margin: 0 auto; }
#progress-fill { height: 100%; border-radius: 3px; transition: width .4s ease; background: linear-gradient(90deg,#4CAF50,#FFD700); width:0%; }

.screen { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 20; padding: 0 20px; }

/* TITLE / SELECT FRAME (shared) */
.title-frame {
  background: linear-gradient(145deg, rgba(30,0,70,0.97), rgba(15,0,45,0.99));
  border: 4px solid #FFD700; border-radius: 28px; padding: 22px 26px; text-align: center;
  width: 100%; max-width: 340px;
  box-shadow: 0 0 0 2px #8B6914, 0 0 40px rgba(255,215,0,0.15), 0 12px 40px rgba(0,0,0,0.7);
}
.title-clock-row { display: flex; justify-content: center; gap: 8px; margin-bottom: 12px; }
.t-clock {
  width: 44px; height: 44px; border-radius: 12px; display: flex; align-items: center; justify-content: center;
  font-size: 24px; box-shadow: 0 4px 0 rgba(0,0,0,0.4), 0 0 12px var(--glow,rgba(255,255,255,0.2));
  animation: numBounce var(--d,1.2s) ease-in-out infinite; background: linear-gradient(145deg,#FFD700,#F57F17);
}
@keyframes numBounce { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-8px)} }
.title-label { font-size: 12px; font-weight: 900; color: rgba(255,215,0,0.65); letter-spacing: 4px; margin-bottom: 4px; }
.title-text {
  font-size: 34px; font-weight: 900;
  background: linear-gradient(180deg, #FFE566, #FF9800);
  -webkit-background-clip: text; -webkit-text-fill-color: transparent;
  filter: drop-shadow(2px 3px 0 rgba(0,0,0,0.5)); margin-bottom: 6px;
}
.title-sub { font-size: 13px; color: rgba(255,255,255,0.72); line-height: 1.9; margin-bottom: 14px; }
.hi-badge { background: rgba(255,215,0,0.12); border: 1.5px solid rgba(255,215,0,0.4); color: #FFD700; font-size: 13px; font-weight: 700; padding: 5px 18px; border-radius: 20px; margin-bottom: 16px; display: inline-block; }
.big-btn {
  background: linear-gradient(145deg, #FF9800, #E65100);
  color: #fff; border: none; border-radius: 50px; padding: 15px 48px; font-size: 21px; font-weight: 900;
  cursor: pointer; position: relative; overflow: hidden;
  box-shadow: 0 6px 0 #BF360C, 0 8px 20px rgba(0,0,0,0.35);
  touch-action: manipulation; font-family: inherit;
}
.big-btn::before { content:''; position:absolute; top:0; left:0; right:0; height:50%; border-radius:50px 50px 0 0; background:rgba(255,255,255,0.18); }
.big-btn:active { transform:translateY(5px); box-shadow:0 1px 0 #BF360C; }

/* Select buttons (diff / mode) */
.select-btn {
  width: 100%; text-align: left; display: flex; align-items: center; gap: 12px;
  border: none; border-radius: 18px; padding: 14px 18px; margin-bottom: 10px; cursor: pointer;
  font-family: inherit; color: #fff; touch-action: manipulation;
  box-shadow: 0 5px 0 rgba(0,0,0,0.35);
}
.select-btn:active { transform: translateY(4px); box-shadow: none; }
.select-btn .sb-icon { font-size: 28px; }
.select-btn .sb-text { display:flex; flex-direction:column; align-items:flex-start; }
.select-btn .sb-title { font-size: 17px; font-weight: 900; }
.select-btn .sb-sub { font-size: 11px; opacity: .85; font-weight: 700; }
.diff-easy { background: linear-gradient(135deg,#1B5E20,#4CAF50); box-shadow: 0 5px 0 #1B5E20; }
.diff-mid { background: linear-gradient(135deg,#E65100,#FF9800); box-shadow: 0 5px 0 #BF360C; }
.diff-hard { background: linear-gradient(135deg,#880E4F,#E91E63); box-shadow: 0 5px 0 #880E4F; }
.mode-choice { background: linear-gradient(135deg,#0D47A1,#2196F3); box-shadow: 0 5px 0 #0D47A1; }
.mode-match { background: linear-gradient(135deg,#4A148C,#9C27B0); box-shadow: 0 5px 0 #2d004a; }
.back-link { background: none; border: none; color: rgba(255,255,255,.55); font-size: 13px; font-weight: 700; font-family: inherit; cursor: pointer; padding: 8px; margin-top: 4px; }

/* GAME AREA */
#game-area {
  position: absolute; inset: 0; z-index: 10; display: none;
  flex-direction: column; align-items: center;
  padding: 92px 12px 12px; gap: 12px;
}

/* Clock SVG (shared) */
.clock-wrap { width: 210px; height: 210px; position: relative; touch-action: none; }
.clock-face-bg { fill: radial-gradient(); }
svg.clockface { width: 100%; height: 100%; overflow: visible; }
.face-circle { fill: url(#faceGrad); stroke: #FFD700; stroke-width: 4; }
.tick { stroke: rgba(255,255,255,0.55); stroke-width: 2; }
.tick.major { stroke: #FFD700; stroke-width: 3.5; }
.num-label { fill: #FFE9A8; font-size: 15px; font-weight: 900; text-anchor: middle; dominant-baseline: central; font-family: 'M PLUS Rounded 1c', sans-serif; }
.hand { stroke-linecap: round; }
.hour-hand { stroke: #FFD700; stroke-width: 7; }
.minute-hand { stroke: #40C4FF; stroke-width: 5; }
.hand.dim { opacity: .28; }
.hand.grabbable { cursor: grab; }
.grip { fill: rgba(255,255,255,0.01); cursor: grab; touch-action: none; }
.center-dot { fill: #FFD700; stroke: #8B6914; stroke-width: 1.5; }

/* Choice mode question label */
#q-instruction { font-size: 12px; font-weight: 700; color: rgba(255,215,0,0.7); letter-spacing: 1px; text-align:center; }

/* Choices */
#choices { display: flex; flex-direction: column; gap: 10px; width: 100%; max-width: 300px; }
.choice-btn {
  background: linear-gradient(160deg,rgba(255,255,255,0.13),rgba(255,255,255,0.06));
  border: 2px solid rgba(255,255,255,0.25); border-radius: 16px; padding: 13px; font-size: 19px; font-weight: 900;
  color: #fff; cursor: pointer; font-family: inherit; touch-action: manipulation;
}
.choice-btn:active { transform: scale(0.96); }
.choice-btn.correct { background: rgba(76,175,80,0.4); border-color: #4CAF50; color: #C8E6C9; }
.choice-btn.wrong { background: rgba(244,67,54,0.35); border-color: #F44336; color: #FFCDD2; }
.choice-btn.reveal { background: rgba(76,175,80,0.25); border-color: rgba(76,175,80,0.6); }
.choice-btn:disabled { pointer-events: none; }

/* Match mode */
#target-display { text-align: center; }
#target-label { font-size: 12px; color: rgba(255,255,255,.6); font-weight: 700; margin-bottom: 4px; }
#target-time { font-size: 34px; font-weight: 900; color: #FFD700; text-shadow: 2px 2px 0 #8B6914; }
#match-submit {
  background: linear-gradient(145deg, #9C27B0, #4A148C);
  color: #fff; border: none; border-radius: 50px; padding: 13px 40px; font-size: 17px; font-weight: 900;
  cursor: pointer; box-shadow: 0 5px 0 #2d004a; font-family: inherit; touch-action: manipulation;
}
#match-submit:active { transform: translateY(4px); box-shadow: 0 1px 0 #2d004a; }
#match-hint { font-size: 11px; color: rgba(255,255,255,.45); text-align:center; }

/* Feedback & flash */
#feedback-overlay { position:fixed; inset:0; pointer-events:none; z-index:50; display:flex; align-items:center; justify-content:center; opacity:0; transition:opacity .15s; }
#feedback-text { font-size:90px; filter:drop-shadow(0 4px 12px rgba(0,0,0,.3)); }
#flash { position:fixed; inset:0; z-index:45; pointer-events:none; opacity:0; }

/* Result */
#result-overlay { position:absolute; inset:0; z-index:30; display:none; flex-direction:column; align-items:center; justify-content:center; background:rgba(5,0,20,0.93); }
.result-frame {
  background: linear-gradient(145deg, rgba(30,0,70,0.97), rgba(15,0,45,0.99));
  border: 4px solid #FFD700; border-radius: 28px; padding: 26px; text-align: center;
  box-shadow: 0 0 0 2px #8B6914, 0 0 40px rgba(255,215,0,0.2), 0 12px 40px rgba(0,0,0,0.7);
  width: 100%; max-width: 320px;
}
.result-trophy { font-size: 64px; margin-bottom: 6px; animation: tBounce .6s ease; }
@keyframes tBounce { 0%{transform:scale(0) rotate(-10deg)} 60%{transform:scale(1.2)} 100%{transform:scale(1)} }
.result-title { font-size: 28px; font-weight: 900; color: #FFD700; text-shadow: 2px 2px 0 #8B6914; margin-bottom: 10px; }
.result-score-wrap { background: rgba(0,0,0,0.35); border-radius: 16px; padding: 12px 20px; margin-bottom: 12px; }
.result-score-label { font-size: 14px; color: rgba(255,255,255,.6); font-weight: 700; }
.result-score-num { font-size: 50px; font-weight: 900; color: #FFD700; line-height: 1; display: block; }
.result-hi { font-size: 13px; color: rgba(255,255,255,.5); margin-bottom: 18px; font-weight: 700; }
.result-hi.new { color: #FFD700; font-size: 16px; }
.result-btns { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
.btn-retry { background:linear-gradient(145deg,#FF9800,#E65100); color:#fff; border:none; border-radius:50px; padding:12px 22px; font-size:15px; font-weight:700; cursor:pointer; box-shadow:0 5px 0 #BF360C; font-family:inherit; }
.btn-title { background:linear-gradient(145deg,#9C27B0,#4A148C); color:#fff; border:none; border-radius:50px; padding:12px 22px; font-size:15px; font-weight:700; cursor:pointer; box-shadow:0 5px 0 #2d004a; font-family:inherit; }
.btn-retry:active,.btn-title:active { transform:translateY(4px); box-shadow:none; }

.particle { position:fixed; pointer-events:none; z-index:48; font-size:20px; animation:pFly var(--dur,.9s) ease forwards; }
@keyframes pFly { 0%{opacity:1;transform:translate(0,0) scale(1)} 100%{opacity:0;transform:translate(var(--tx,0),var(--ty,-80px)) scale(.2)} }
.pop-word { position:fixed; font-weight:900; pointer-events:none; z-index:49; font-size:22px; animation:pWord .9s ease forwards; }
@keyframes pWord { 0%{opacity:0;transform:translateY(10px) scale(.6)} 25%{opacity:1;transform:translateY(-8px) scale(1.2)} 100%{opacity:0;transform:translateY(-60px) scale(.9)} }
</style>
<script src="/games/safe_area.js"></script>
</head>
<body>
<div id="game-wrap">
<canvas id="bg"></canvas>

<!-- TITLE -->
<div id="title-screen" class="screen">
  <div class="title-frame">
    <div class="title-clock-row">
      <div class="t-clock" style="--d:1.0s">🕐</div>
      <div class="t-clock" style="--d:1.3s;animation-delay:.15s">🕒</div>
      <div class="t-clock" style="--d:1.1s;animation-delay:.05s">🕕</div>
      <div class="t-clock" style="--d:1.4s;animation-delay:.25s">🕘</div>
    </div>
    <div class="title-label">✦ とけいよみ ✦</div>
    <div class="title-text">とけいよみ！</div>
    <p class="title-sub">とけいの はりを よんだり<br>あわせたり して あそぼう！</p>
    <div id="hi-title" class="hi-badge">🏆 ハイスコア: 0もん</div>
    <button class="big-btn" onclick="showDiffScreen()">▶ スタート！</button>
  </div>
</div>

<!-- DIFFICULTY SELECT -->
<div id="diff-screen" class="screen" style="display:none;">
  <div class="title-frame">
    <div class="title-label">✦ なにを れんしゅうする？ ✦</div>
    <div style="height:14px;"></div>
    <button class="select-btn diff-easy" onclick="selectDiff('easy')">
      <span class="sb-icon">🕐</span>
      <span class="sb-text"><span class="sb-title">なんじ</span><span class="sb-sub">3じ・7じ など</span></span>
    </button>
    <button class="select-btn diff-mid" onclick="selectDiff('mid')">
      <span class="sb-icon">🕜</span>
      <span class="sb-text"><span class="sb-title">なんじはん</span><span class="sb-sub">3じはん・7じはん など</span></span>
    </button>
    <button class="select-btn diff-hard" onclick="selectDiff('hard')">
      <span class="sb-icon">🕞</span>
      <span class="sb-text"><span class="sb-title">なんじなんぷん</span><span class="sb-sub">3じ25ふん など</span></span>
    </button>
    <button class="back-link" onclick="showTitleScreen()">◀ もどる</button>
  </div>
</div>

<!-- MODE SELECT -->
<div id="mode-screen" class="screen" style="display:none;">
  <div class="title-frame">
    <div class="title-label">✦ あそびかたを えらぶ ✦</div>
    <div style="height:14px;"></div>
    <button class="select-btn mode-choice" onclick="selectMode('choice')">
      <span class="sb-icon">👆</span>
      <span class="sb-text"><span class="sb-title">せんたくモード</span><span class="sb-sub">とけいを みて えらぶ</span></span>
    </button>
    <button class="select-btn mode-match" onclick="selectMode('match')">
      <span class="sb-icon">✋</span>
      <span class="sb-text"><span class="sb-title">あわせるモード</span><span class="sb-sub">はりを うごかす</span></span>
    </button>
    <button class="back-link" onclick="showDiffScreen()">◀ もどる</button>
  </div>
</div>

<!-- HUD -->
<div id="hud">
  <div class="hud-nav">
    <button id="back-btn" onclick="goBack()">🏠 もどる</button>
    <div id="ui-bgm-btn">🔊</div>
  </div>
  <div id="status-bar">
    <div class="hud-chip"><span class="hud-chip-label">せいかい</span><span class="hud-chip-val" id="q-disp">0</span></div>
    <div class="hud-chip"><span class="hud-chip-label">もんだい</span><span class="hud-chip-val" id="qnum-disp">1/8</span></div>
  </div>
  <div id="progress-bg"><div id="progress-fill"></div></div>
</div>

<!-- GAME: CHOICE MODE -->
<div id="game-area">
  <div id="choice-area" style="display:none; flex-direction:column; align-items:center; gap:14px; width:100%;">
    <div id="q-instruction">なんじか よんでね</div>
    <div class="clock-wrap" id="choice-clock-wrap"></div>
    <div id="choices"></div>
  </div>

  <!-- GAME: MATCH MODE -->
  <div id="match-area" style="display:none; flex-direction:column; align-items:center; gap:14px; width:100%;">
    <div id="target-display">
      <div id="target-label">この じかんに あわせてね</div>
      <div id="target-time">3じ</div>
    </div>
    <div class="clock-wrap" id="match-clock-wrap"></div>
    <div id="match-hint">はりを ゆびで うごかそう</div>
    <button id="match-submit" onclick="onMatchSubmit()">✅ きめた！</button>
  </div>
</div>

<!-- FEEDBACK -->
<div id="feedback-overlay"><div id="feedback-text">⭕</div></div>
<div id="flash"></div>

<!-- RESULT -->
<div id="result-overlay">
  <div class="result-frame">
    <div class="result-trophy" id="r-trophy">🏆</div>
    <div class="result-title" id="r-title">すごい！</div>
    <div class="result-score-wrap">
      <div class="result-score-label">せいかい</div>
      <span class="result-score-num" id="r-score">0</span>
      <div class="result-score-label">/ 8 もん</div>
    </div>
    <div class="result-hi" id="r-hi"></div>
    <div class="result-btns">
      <button class="btn-retry" onclick="startGame()">もういちど</button>
      <button class="btn-title" onclick="goTitle()">タイトルへ</button>
    </div>
  </div>
</div>
</div>

<script>
/* ===== Canvas BG (shared visual language) ===== */
const cvs=document.getElementById('bg'),ctx=cvs.getContext('2d');
let W,H,stars=[],fireworks=[];
function initC(){
  W=cvs.offsetWidth;H=cvs.offsetHeight;cvs.width=W;cvs.height=H;
  stars=[];
  for(let i=0;i<80;i++)stars.push({x:Math.random()*W,y:Math.random()*H,r:.5+Math.random()*1.8,ph:Math.random()*Math.PI*2,sp:.4+Math.random()*1.2});
  fireworks=[];
  const cols=['#FFD700','#FF4081','#40C4FF','#69F0AE','#FF6D00','#E040FB'];
  for(let i=0;i<8;i++)fireworks.push({x:W*(.1+Math.random()*.8),y:H*(.05+Math.random()*.5),col:cols[i%cols.length],ph:Math.random()*Math.PI*2,sp:.2+Math.random()*.3,r:2+Math.random()*4,alpha:.06+Math.random()*.1});
}
function drawBg(t){
  ctx.clearRect(0,0,W,H);
  const g=ctx.createLinearGradient(0,0,0,H);
  g.addColorStop(0,'#0d0030');g.addColorStop(.5,'#1a0050');g.addColorStop(1,'#0d0030');
  ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  ctx.strokeStyle='rgba(150,100,255,0.05)';ctx.lineWidth=1;
  for(let x=0;x<W;x+=40){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,H);ctx.stroke();}
  for(let y=0;y<H;y+=40){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke();}
  const ts=t/1000;
  stars.forEach(s=>{const tw=(Math.sin(ts*s.sp+s.ph)+1)/2;ctx.fillStyle=`rgba(220,200,255,${tw*.7})`;ctx.beginPath();ctx.arc(s.x,s.y,s.r*(0.5+tw*.5),0,Math.PI*2);ctx.fill();});
  fireworks.forEach(f=>{
    const bob=Math.sin(ts*f.sp+f.ph)*15;
    ctx.beginPath();ctx.arc(f.x,f.y+bob,f.r,0,Math.PI*2);
    const hex=f.col.replace('#','');
    const r=parseInt(hex.slice(0,2),16),g2=parseInt(hex.slice(2,4),16),b=parseInt(hex.slice(4,6),16);
    ctx.fillStyle=`rgba(${r},${g2},${b},${f.alpha})`;ctx.fill();
  });
}
let raf;function bgLoop(t){drawBg(t);raf=requestAnimationFrame(bgLoop);}
initC();requestAnimationFrame(bgLoop);window.addEventListener('resize',initC);

/* ===== Game State ===== */
const TOTAL_Q=8;
let diff='easy', mode='choice';
let qIndex=0, correctCount=0, currentTarget=null, locked=false;
let dragState={hourIdx:0, minuteIdx:0, dragging:null};

function getHi(){return parseInt(localStorage.getItem('tokei_hi_v1')||'0');}
function saveHi(v){localStorage.setItem('tokei_hi_v1',v);}
function updateHiBadge(){document.getElementById('hi-title').textContent='🏆 ハイスコア: '+getHi()+'もん';}

function showTitleScreen(){
  hideAllScreens();
  document.getElementById('title-screen').style.display='flex';
  updateHiBadge();
}
function showDiffScreen(){ hideAllScreens(); document.getElementById('diff-screen').style.display='flex'; }
function showModeScreen(){ hideAllScreens(); document.getElementById('mode-screen').style.display='flex'; }
function hideAllScreens(){
  document.getElementById('title-screen').style.display='none';
  document.getElementById('diff-screen').style.display='none';
  document.getElementById('mode-screen').style.display='none';
  document.getElementById('result-overlay').style.display='none';
}
function selectDiff(d){ diff=d; showModeScreen(); }
function selectMode(m){ mode=m; startGame(); }

/* ===== Clock rendering ===== */
function buildClockSVG(id, interactive){
  const svgNS='http://www.w3.org/2000/svg';
  const wrap=document.getElementById(id);
  wrap.innerHTML='';
  const svg=document.createElementNS(svgNS,'svg');
  svg.setAttribute('class','clockface');
  svg.setAttribute('viewBox','0 0 200 200');
  svg.innerHTML=`
    <defs>
      <radialGradient id="faceGrad-${id}" cx="35%" cy="30%" r="75%">
        <stop offset="0%" stop-color="#4a148c"/>
        <stop offset="100%" stop-color="#1a0040"/>
      </radialGradient>
    </defs>
    <circle class="face-circle" cx="100" cy="100" r="90" style="fill:url(#faceGrad-${id})"></circle>
  `;
  // ticks + numbers
  for(let i=0;i<12;i++){
    const ang=i*30*Math.PI/180;
    const isMajor=(i%3===0);
    const r1=isMajor?72:78, r2=86;
    const x1=100+Math.sin(ang)*r1, y1=100-Math.cos(ang)*r1;
    const x2=100+Math.sin(ang)*r2, y2=100-Math.cos(ang)*r2;
    const tick=document.createElementNS(svgNS,'line');
    tick.setAttribute('x1',x1);tick.setAttribute('y1',y1);tick.setAttribute('x2',x2);tick.setAttribute('y2',y2);
    tick.setAttribute('class','tick'+(isMajor?' major':''));
    svg.appendChild(tick);
    const num=i===0?12:i;
    const nr=60;
    const nx=100+Math.sin(ang)*nr, ny=100-Math.cos(ang)*nr;
    const t=document.createElementNS(svgNS,'text');
    t.setAttribute('x',nx);t.setAttribute('y',ny);t.setAttribute('class','num-label');
    t.textContent=num;
    svg.appendChild(t);
  }
  // hands
  const hourHand=document.createElementNS(svgNS,'line');
  hourHand.setAttribute('id',id+'-hour');hourHand.setAttribute('class','hand hour-hand');
  hourHand.setAttribute('x1',100);hourHand.setAttribute('y1',100);hourHand.setAttribute('x2',100);hourHand.setAttribute('y2',52);
  svg.appendChild(hourHand);
  const minHand=document.createElementNS(svgNS,'line');
  minHand.setAttribute('id',id+'-minute');minHand.setAttribute('class','hand minute-hand');
  minHand.setAttribute('x1',100);minHand.setAttribute('y1',100);minHand.setAttribute('x2',100);minHand.setAttribute('y2',28);
  svg.appendChild(minHand);
  const cdot=document.createElementNS(svgNS,'circle');
  cdot.setAttribute('cx',100);cdot.setAttribute('cy',100);cdot.setAttribute('r',7);cdot.setAttribute('class','center-dot');
  svg.appendChild(cdot);
  if(interactive){
    const hourGrip=document.createElementNS(svgNS,'circle');
    hourGrip.setAttribute('id',id+'-hourgrip');hourGrip.setAttribute('cx',100);hourGrip.setAttribute('cy',52);hourGrip.setAttribute('r',16);hourGrip.setAttribute('class','grip');
    svg.appendChild(hourGrip);
    const minGrip=document.createElementNS(svgNS,'circle');
    minGrip.setAttribute('id',id+'-minutegrip');minGrip.setAttribute('cx',100);minGrip.setAttribute('cy',28);minGrip.setAttribute('r',16);minGrip.setAttribute('class','grip');
    svg.appendChild(minGrip);
  }
  wrap.appendChild(svg);
  return svg;
}
function setHandAngle(id,which,deg){
  const el=document.getElementById(id+'-'+which);
  if(el)el.setAttribute('transform','rotate('+deg+' 100 100)');
}
function setGripPos(id,which,deg,len){
  const g=document.getElementById(id+'-'+which+'grip');
  if(!g)return;
  const rad=deg*Math.PI/180;
  g.setAttribute('cx',100+Math.sin(rad)*len);
  g.setAttribute('cy',100-Math.cos(rad)*len);
}

/* ===== Time helpers ===== */
function formatLabel(hour,minute){
  if(minute===0)return hour+'じ';
  if(minute===30)return hour+'じはん';
  return hour+'じ'+minute+'ふん';
}
function randInt(min,max){return min+Math.floor(Math.random()*(max-min+1));}

function genTarget(){
  const hour=randInt(1,12);
  let minute=0;
  if(diff==='mid')minute=30;
  else if(diff==='hard')minute=randInt(0,11)*5;
  return {hour,minute};
}

/* ===== Choice mode ===== */
function genChoices(target){
  const set=new Set();
  const labels=[formatLabel(target.hour,target.minute)];
  set.add(labels[0]);
  let tries=0;
  while(labels.length<3 && tries<40){
    tries++;
    let h=target.hour, m=target.minute;
    if(diff==='easy'){
      h=((target.hour-1+randInt(1,4))%12)+1; m=0;
    } else if(diff==='mid'){
      if(Math.random()<0.5){ m=0; } else { h=((target.hour-1+randInt(1,4))%12)+1; m=30; }
    } else {
      if(Math.random()<0.5){ let delta=[-15,-10,-5,5,10,15][randInt(0,5)]; m=((target.minute+delta)%60+60)%60; m=Math.round(m/5)*5; if(m===target.minute)continue; }
      else { h=((target.hour-1+randInt(1,3))%12)+1; }
    }
    const lbl=formatLabel(h,m);
    if(!set.has(lbl)){set.add(lbl);labels.push(lbl);}
  }
  while(labels.length<3){
    const h=randInt(1,12);
    const lbl=formatLabel(h,target.minute);
    if(!set.has(lbl)){set.add(lbl);labels.push(lbl);}
  }
  for(let i=labels.length-1;i>0;i--){const j=randInt(0,i);[labels[i],labels[j]]=[labels[j],labels[i]];}
  return labels;
}

function renderChoiceQuestion(){
  const svg=buildClockSVG('choice-clock-wrap',false);
  const hourDeg=(currentTarget.hour%12)*30 + currentTarget.minute*0.5;
  const minDeg=currentTarget.minute*6;
  setHandAngle('choice-clock-wrap','hour',hourDeg);
  setHandAngle('choice-clock-wrap','minute',minDeg);
  const choices=genChoices(currentTarget);
  const wrap=document.getElementById('choices');
  wrap.innerHTML='';
  choices.forEach(label=>{
    const b=document.createElement('button');
    b.className='choice-btn';
    b.textContent=label;
    b.addEventListener('click',()=>onChoiceTap(b,label));
    wrap.appendChild(b);
  });
}
function onChoiceTap(btn,label){
  if(locked)return;
  locked=true;
  const correctLabel=formatLabel(currentTarget.hour,currentTarget.minute);
  const isCorrect=label===correctLabel;
  document.querySelectorAll('.choice-btn').forEach(b=>{
    b.disabled=true;
    if(b.textContent===correctLabel)b.classList.add(isCorrect&&b===btn?'correct':'reveal');
  });
  if(isCorrect){
    btn.classList.add('correct');
    correctCount++;
    showFeedback('⭕');flash('rgba(76,175,80,0.3)');burst();pop('✨ せいかい！','#FFD700');
  } else {
    btn.classList.add('wrong');
    showFeedback('❌');flash('rgba(244,67,54,0.25)');pop('おしい！','#FF8A65');
  }
  updateHud();
  setTimeout(()=>{hideFeedback();nextQuestion();},1000);
}

/* ===== Match mode ===== */
function renderMatchQuestion(){
  buildClockSVG('match-clock-wrap',true);
  document.getElementById('target-time').textContent=formatLabel(currentTarget.hour,currentTarget.minute);
  const hourDraggable = true;
  const minuteDraggable = (diff==='hard');
  dragState.hourIdx = 0;
  dragState.minuteIdx = 0;
  applyMatchHands();
  setupGrip('match-clock-wrap','hour',hourDraggable);
  setupGrip('match-clock-wrap','minute',minuteDraggable);
}

function hourSnapDeg(idx){
  const base=idx*30;
  return diff==='mid'? base+15 : base;
}
function minuteSnapDeg(idx){ return idx*30; }

function applyMatchHands(){
  const hourDeg=hourSnapDeg(dragState.hourIdx);
  let minDeg;
  if(diff==='easy') minDeg=0;
  else if(diff==='mid') minDeg=180;
  else minDeg=minuteSnapDeg(dragState.minuteIdx);
  setHandAngle('match-clock-wrap','hour',hourDeg);
  setHandAngle('match-clock-wrap','minute',minDeg);
  setGripPos('match-clock-wrap','hour',hourDeg,52);
  if(diff==='hard')setGripPos('match-clock-wrap','minute',minDeg,28);
}
function setupGrip(id,which,draggable){
  const grip=document.getElementById(id+'-'+which+'grip');
  const hand=document.getElementById(id+'-'+which);
  if(!grip)return;
  grip.style.display=draggable?'block':'none';
  hand.classList.toggle('dim', which==='minute' && !draggable);
  if(!draggable){ grip.onpointerdown=null; return; }
  grip.classList.add('grabbable');
  grip.onpointerdown=(e)=>{
    e.preventDefault();
    dragState.dragging=which;
    grip.setPointerCapture(e.pointerId);
  };
  grip.onpointermove=(e)=>{
    if(dragState.dragging!==which)return;
    const svg=document.querySelector('#'+id+' svg');
    const rect=svg.getBoundingClientRect();
    const cx=rect.left+rect.width/2, cy=rect.top+rect.height/2;
    const dx=e.clientX-cx, dy=e.clientY-cy;
    let angle=Math.atan2(dx,-dy)*180/Math.PI;
    angle=(angle+360)%360;
    if(which==='hour'){
      const offset=diff==='mid'?15:0;
      let idx=Math.round((angle-offset)/30);
      idx=((idx%12)+12)%12;
      dragState.hourIdx=idx;
    } else {
      let idx=Math.round(angle/30);
      idx=((idx%12)+12)%12;
      dragState.minuteIdx=idx;
    }
    applyMatchHands();
  };
  grip.onpointerup=(e)=>{ dragState.dragging=null; try{grip.releasePointerCapture(e.pointerId);}catch(err){} };
}

function onMatchSubmit(){
  if(locked)return;
  locked=true;
  const targetHourIdx=currentTarget.hour%12;
  const targetMinuteIdx=Math.round(currentTarget.minute/5)%12;
  let isCorrect;
  if(diff==='easy') isCorrect = dragState.hourIdx===targetHourIdx;
  else if(diff==='mid') isCorrect = dragState.hourIdx===targetHourIdx;
  else isCorrect = dragState.hourIdx===targetHourIdx && dragState.minuteIdx===targetMinuteIdx;

  if(isCorrect){
    correctCount++;
    showFeedback('⭕');flash('rgba(76,175,80,0.3)');burst();pop('✨ せいかい！','#FFD700');
  } else {
    // snap to correct to show the answer
    dragState.hourIdx=targetHourIdx;
    dragState.minuteIdx=targetMinuteIdx;
    applyMatchHands();
    showFeedback('❌');flash('rgba(244,67,54,0.25)');pop('せいかいは '+formatLabel(currentTarget.hour,currentTarget.minute),'#FF8A65');
  }
  updateHud();
  setTimeout(()=>{hideFeedback();nextQuestion();},1200);
}

/* ===== Flow ===== */
function startGame(){
  qIndex=0;correctCount=0;locked=false;
  hideAllScreens();
  document.getElementById('hud').style.display='block';
  document.getElementById('game-area').style.display='flex';
  document.getElementById('choice-area').style.display = mode==='choice'?'flex':'none';
  document.getElementById('match-area').style.display = mode==='match'?'flex':'none';
  updateHud();
  nextQuestion();
}
function nextQuestion(){
  if(qIndex>=TOTAL_Q){ endGame(); return; }
  qIndex++;
  locked=false;
  currentTarget=genTarget();
  updateHud();
  if(mode==='choice') renderChoiceQuestion();
  else renderMatchQuestion();
}
function updateHud(){
  document.getElementById('q-disp').textContent=correctCount;
  document.getElementById('qnum-disp').textContent=Math.min(qIndex,TOTAL_Q)+'/'+TOTAL_Q;
  document.getElementById('progress-fill').style.width=(Math.min(qIndex,TOTAL_Q)/TOTAL_Q*100)+'%';
}
function endGame(){
  document.getElementById('hud').style.display='none';
  document.getElementById('game-area').style.display='none';
  document.getElementById('result-overlay').style.display='flex';
  const hi=getHi(),isNew=correctCount>hi;if(isNew)saveHi(correctCount);
  updateHiBadge();
  document.getElementById('r-score').textContent=correctCount;
  const hiEl=document.getElementById('r-hi');
  let trophy,title;
  if(correctCount>=7){trophy='🏆';title='とけいめいじん！';}
  else if(correctCount>=4){trophy='⭐';title='ナイス！';}
  else{trophy='🕐';title='もういちど！';}
  document.getElementById('r-trophy').textContent=trophy;
  document.getElementById('r-title').textContent=title;
  hiEl.textContent=isNew?'🏆 ニューレコード！':'ハイスコア: '+hi+'もん';
  hiEl.className='result-hi'+(isNew?' new':'');
  if(correctCount>=4)for(let i=0;i<12;i++)setTimeout(burst,i*120);
}
function goTitle(){ showTitleScreen(); }

/* ===== FX helpers ===== */
function showFeedback(t){document.getElementById('feedback-text').textContent=t;document.getElementById('feedback-overlay').style.opacity='1';}
function hideFeedback(){document.getElementById('feedback-overlay').style.opacity='0';}
function flash(c){const f=document.getElementById('flash');f.style.transition='';f.style.background=c;f.style.opacity='1';setTimeout(()=>{f.style.transition='opacity .3s';f.style.opacity='0';},100);}
function burst(){
  const items=['⭐','✨','🌟','💫','🎉','🕐'];
  const cx=window.innerWidth/2,cy=window.innerHeight*.4;
  for(let i=0;i<10;i++){
    const el=document.createElement('div');el.className='particle';
    el.textContent=items[Math.floor(Math.random()*items.length)];
    const a=(i/10)*Math.PI*2,d=65+Math.random()*55;
    el.style.cssText=`left:${cx}px;top:${cy}px;--tx:${Math.cos(a)*d}px;--ty:${Math.sin(a)*d-50}px;--dur:${.6+Math.random()*.4}s;animation-delay:${Math.random()*.06}s`;
    document.body.appendChild(el);setTimeout(()=>el.remove(),1100);
  }
}
function pop(text,color){
  const el=document.createElement('div');el.className='pop-word';el.textContent=text;el.style.color=color;
  el.style.cssText+=`;left:${window.innerWidth/2-90}px;top:${window.innerHeight*.35}px;width:180px;text-align:center;text-shadow:2px 2px 4px rgba(0,0,0,.5)`;
  document.body.appendChild(el);setTimeout(()=>el.remove(),1000);
}
function goBack(){if(window.parent!==window)window.parent.postMessage({type:'goBack'},'*');else history.back();}

updateHiBadge();
</script>
