<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>こっきクイズ</title>
<link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@700;800;900&display=swap" rel="stylesheet">
<style>
:root{--sat:env(safe-area-inset-top,0px);--sab:env(safe-area-inset-bottom,0px);}

*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;overflow:hidden;font-family:'M PLUS Rounded 1c',sans-serif;user-select:none;}
body{background:#0a1628;display:flex;flex-direction:column;align-items:center;}
#app{width:100%;max-width:480px;height:100vh;display:flex;flex-direction:column;overflow:hidden;position:relative;}

/* ===== タイトル ===== */
#title-screen{
  position:absolute;inset:0;z-index:100;
  background:linear-gradient(160deg,#050d1e,#0a1a35,#050d1e);
  display:flex;flex-direction:column;align-items:center;justify-content:flex-end;
  overflow:hidden;
}
#title-globe{
  position:absolute;top:0;left:0;right:0;height:55%;
  display:flex;align-items:center;justify-content:center;
  flex-direction:column;gap:8px;
}
.title-flag-row{
  display:flex;gap:8px;
  animation:marquee 12s linear infinite;
  white-space:nowrap;
}
.title-flag-row:nth-child(2){animation-duration:15s;animation-direction:reverse;}
.title-flag-row:nth-child(3){animation-duration:10s;}
@keyframes marquee{0%{transform:translateX(0);}100%{transform:translateX(-50%);}}
.tflag{font-size:36px;filter:drop-shadow(0 2px 6px rgba(0,0,0,0.5));}
#title-card{
  position:relative;z-index:10;width:100%;
  display:flex;flex-direction:column;align-items:center;
  padding-bottom:28px;
}
.diff-btn{
  width:100%;padding:14px;border:none;border-radius:14px;
  font-size:15px;font-weight:900;cursor:pointer;font-family:inherit;
  margin-bottom:8px;transition:transform 0.15s;
  display:flex;align-items:center;justify-content:space-between;
}
.diff-btn:active{transform:scale(0.97);}
.diff-easy{background:linear-gradient(135deg,#1B5E20,#4CAF50);color:white;}
.diff-mid{background:linear-gradient(135deg,#E65100,#FF9800);color:white;}
.diff-hard{background:linear-gradient(135deg,#880E4F,#E91E63);color:white;}
.diff-tag{font-size:11px;opacity:0.8;font-weight:700;}

/* ===== ゲーム画面 ===== */
#game-screen{
  flex:1;display:flex;flex-direction:column;
  background:linear-gradient(180deg,#050d1e 0%,#0a1a35 100%);
}

/* HUD */
#hud{
  flex-shrink:0;padding:max(10px, env(safe-area-inset-top, 0px)) 14px 6px;
  background:linear-gradient(180deg,rgba(0,0,0,0.5),transparent);
  display:flex;align-items:center;gap:8px;flex-wrap:wrap;
}
.hud-back{background:none;border:1px solid rgba(255,255,255,0.2);border-radius:9px;padding:4px 10px;color:rgba(255,255,255,0.6);font-size:11px;font-weight:700;cursor:pointer;font-family:inherit;}
.hud-box{background:rgba(255,255,255,0.07);border:1px solid rgba(255,255,255,0.12);border-radius:9px;padding:4px 10px;font-size:12px;font-weight:800;color:white;}
#hud-score{color:#FFD700;}
#hud-combo{color:#FF8A65;display:none;}
/* プログレスバー */
#progress-wrap{flex-shrink:0;padding:0 14px 6px;}
#progress-bg{height:6px;background:rgba(255,255,255,0.1);border-radius:3px;overflow:hidden;}
#progress-fill{height:100%;border-radius:3px;transition:width 0.4s ease;background:linear-gradient(90deg,#4CAF50,#FFD700);}

/* 問題エリア */
#question-area{
  flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:0 16px;min-height:0;
}

/* 国旗カード */
#flag-card{
  width:100%;max-width:340px;
  background:linear-gradient(160deg,rgba(255,255,255,0.08),rgba(255,255,255,0.04));
  border:1.5px solid rgba(255,255,255,0.15);
  border-radius:24px;
  padding:20px 16px 16px;
  box-shadow:0 8px 32px rgba(0,0,0,0.4);
  margin-bottom:16px;
  text-align:center;
  position:relative;
  overflow:hidden;
}
#flag-card::before{
  content:'';position:absolute;inset:0;
  background:radial-gradient(circle at 50% 0%,rgba(255,255,255,0.08),transparent 70%);
}
/* 国旗 */
#flag-display{
  font-size:96px;line-height:1;
  filter:drop-shadow(0 4px 12px rgba(0,0,0,0.4));
  margin-bottom:12px;
  transition:transform 0.3s;
}
/* 国を表すもの（建造物・動物・景色） */
#country-hints{
  display:flex;gap:8px;justify-content:center;flex-wrap:wrap;
  margin-bottom:10px;
}
.hint-item{
  background:none;border-radius:0;
  padding:4px 6px;
  display:flex;flex-direction:column;align-items:center;gap:2px;
  border:none;
}
.hint-emoji{font-size:28px;filter:drop-shadow(0 2px 4px rgba(0,0,0,0.4));}
.hint-label{font-size:8px;font-weight:700;color:rgba(255,255,255,0.45);letter-spacing:0.5px;}
/* 問題番号・ステージ */
#question-label{
  font-size:11px;font-weight:800;color:rgba(255,215,0,0.7);
  letter-spacing:1px;position:relative;z-index:1;
}

/* 選択肢 */
#choices{
  width:100%;max-width:340px;
  display:grid;grid-template-columns:1fr 1fr;
  gap:8px;
}
.choice-btn{
  background:linear-gradient(160deg,rgba(255,255,255,0.13),rgba(255,255,255,0.06));
  border:2px solid rgba(255,255,255,0.28);
  border-radius:16px;padding:13px 8px;
  font-size:14px;font-weight:900;color:white;
  cursor:pointer;transition:all 0.12s;
  font-family:inherit;text-align:center;
  line-height:1.3;
  box-shadow:0 3px 10px rgba(0,0,0,0.3), inset 0 1px 0 rgba(255,255,255,0.15);
  position:relative;
}
.choice-btn:active{transform:scale(0.94);box-shadow:0 1px 4px rgba(0,0,0,0.3);}
.choice-btn.correct{background:rgba(76,175,80,0.35);border-color:#4CAF50;color:#A5D6A7;}
.choice-btn.wrong{background:rgba(244,67,54,0.3);border-color:#F44336;color:#EF9A9A;}
.choice-btn.reveal{background:rgba(76,175,80,0.2);border-color:rgba(76,175,80,0.5);}
.choice-btn:disabled{cursor:default;}

/* 結果バッジ */
#answer-badge{
  position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);
  z-index:50;pointer-events:none;display:none;
  font-size:52px;
  animation:badgePop 0.4s ease-out forwards;
}
@keyframes badgePop{0%{transform:translate(-50%,-50%) scale(0.3);opacity:0;}60%{transform:translate(-50%,-50%) scale(1.2);}100%{transform:translate(-50%,-50%) scale(1);opacity:1;}}

/* ===== ステージクリア・ゲームオーバー ===== */
.ov{
  position:absolute;inset:0;z-index:200;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  background:rgba(5,13,30,0.92);backdrop-filter:blur(10px);
  opacity:0;pointer-events:none;transition:opacity 0.3s;
}
.ov.show{opacity:1;pointer-events:all;}
.ov-box{
  background:linear-gradient(160deg,#0d1f3a,#050d1e);
  border:1.5px solid rgba(255,215,0,0.35);border-radius:24px;
  padding:24px 28px;text-align:center;max-width:300px;width:88%;
  box-shadow:0 20px 60px rgba(0,0,0,0.7);
}
.ov-emoji{font-size:44px;margin-bottom:8px;}
.ov-title{font-size:22px;font-weight:900;color:#FFD700;margin-bottom:6px;}
.ov-sub{font-size:12px;color:rgba(255,255,255,0.55);margin-bottom:12px;line-height:1.8;}
.ov-score{font-size:34px;font-weight:900;color:#FFD700;margin:6px 0;}
.btn-gold{background:linear-gradient(135deg,#FF8F00,#FFD700);color:#0d0025;border:none;border-radius:13px;padding:12px 26px;font-size:15px;font-weight:900;cursor:pointer;font-family:inherit;margin:4px;box-shadow:0 4px 14px rgba(255,215,0,0.4);}
.btn-ghost{background:rgba(255,255,255,0.08);border:1px solid rgba(255,255,255,0.2);border-radius:13px;padding:10px 20px;font-size:13px;font-weight:700;color:rgba(255,255,255,0.7);cursor:pointer;font-family:inherit;margin:4px;}

/* スコアポップ */
@keyframes scoreFloat{0%{transform:translateY(0);opacity:1;}100%{transform:translateY(-55px);opacity:0;}}
.score-pop{position:absolute;font-size:18px;font-weight:900;pointer-events:none;z-index:60;animation:scoreFloat 0.8s ease-out forwards;white-space:nowrap;}

@keyframes shimmer{0%{background-position:0%}100%{background-position:200%}}
</style>
</head>
<body>
<div id="app">

<!-- タイトル -->
<div id="title-screen">
  <div id="title-globe">
    <!-- 流れる国旗 -->
    <div class="title-flag-row" id="flagrow1"></div>
    <div class="title-flag-row" id="flagrow2"></div>
    <div class="title-flag-row" id="flagrow3"></div>
  </div>
  <div id="title-card">
    <div style="text-align:center;padding:0 20px 16px;background:linear-gradient(0deg,rgba(5,13,30,0.97) 50%,transparent);width:100%;">
      <div style="font-size:38px;font-weight:900;background:linear-gradient(180deg,#fff,#FFE066 35%,#FF8C00);-webkit-background-clip:text;-webkit-text-fill-color:transparent;filter:drop-shadow(0 0 18px rgba(255,215,0,0.5));letter-spacing:2px;margin-bottom:2px;">こっきクイズ</div>
      <div style="font-size:10px;font-weight:700;color:rgba(255,215,0,0.55);letter-spacing:4px;">✦ FLAG QUIZ ✦</div>
    </div>
    <div style="background:linear-gradient(160deg,rgba(13,31,58,0.97),rgba(5,13,30,0.98));border:1.5px solid rgba(255,215,0,0.28);border-radius:22px;padding:16px 18px 18px;max-width:320px;width:90%;box-shadow:0 20px 60px rgba(0,0,0,0.7);">
      <div style="font-size:12px;font-weight:800;color:rgba(255,215,0,0.7);text-align:center;margin-bottom:12px;letter-spacing:1px;">✦ むずかしさを えらんでね ✦</div>
      <button class="diff-btn diff-easy" onclick="startGame('easy')">
        <span>🌍 かんたん</span>
        <span class="diff-tag">10カ国・ゆうめいな国</span>
      </button>
      <button class="diff-btn diff-mid" onclick="startGame('mid')">
        <span>🌎 ふつう</span>
        <span class="diff-tag">30カ国・いろんな地域</span>
      </button>
      <button class="diff-btn diff-hard" onclick="startGame('hard')">
        <span>🌏 むずかしい</span>
        <span class="diff-tag">50カ国・マニアむけ</span>
      </button>
      <div id="title-hs" style="font-size:11px;text-align:center;color:rgba(255,215,0,0.5);margin-top:10px;"></div>
    </div>
  </div>
</div>

<!-- ゲーム画面 -->
<div id="game-screen" style="display:none;">
  <div id="hud">
    <button class="hud-back" onclick="showTitle()">← もどる</button>
    <div class="hud-box" id="hud-stage">ステージ 1</div>
    <div class="hud-box" id="hud-score">⭐ 0</div>
    <div class="hud-box" id="hud-combo">🔥 コンボ</div>
  </div>
  <div id="progress-wrap">
    <div id="progress-bg"><div id="progress-fill" style="width:0%"></div></div>
  </div>
  <div id="question-area">
    <div id="flag-card">
      <div id="question-label">ステージ1 - 1もんめ</div>
      <div id="flag-display">🇯🇵</div>
      <div id="country-hints"></div>
      <div id="answer-badge"></div>
    </div>
    <div id="choices"></div>
  </div>
</div>

<!-- ステージクリア -->
<div class="ov" id="stage-clear-ov">
  <div class="ov-box">
    <div class="ov-emoji" id="sc-emoji">🎉</div>
    <div class="ov-title" id="sc-title">ステージ1 クリア！</div>
    <div class="ov-sub" id="sc-sub"></div>
    <div class="ov-score" id="sc-score"></div>
    <button class="btn-gold" id="sc-next-btn">つぎへ ▶</button>
  </div>
</div>

<!-- 全クリア -->
<div class="ov" id="all-clear-ov">
  <div class="ov-box">
    <div class="ov-emoji">🏆</div>
    <div class="ov-title">ぜんもん せいかい！！</div>
    <div class="ov-sub" id="ac-sub"></div>
    <div class="ov-score" id="ac-score"></div>
    <div id="ac-hs" style="font-size:11px;color:rgba(255,215,0,0.6);margin-bottom:10px;"></div>
    <button class="btn-gold" onclick="restartGame()">もういちど</button>
    <button class="btn-ghost" onclick="showTitle()">タイトルへ</button>
  </div>
</div>

<!-- ゲームオーバー -->
<div class="ov" id="gameover-ov">
  <div class="ov-box">
    <div class="ov-emoji">😢</div>
    <div class="ov-title">ざんねん！</div>
    <div class="ov-sub" id="go-sub"></div>
    <div class="ov-score" id="go-score"></div>
    <button class="btn-gold" onclick="restartGame()">もういちど</button>
    <button class="btn-ghost" onclick="showTitle()">タイトルへ</button>
  </div>
</div>

// ===== ゲーム状態 =====
let difficulty='easy';
let questionPool=[];
let currentStage=0;
let stageQuestions=[];
let currentQ=0;
let score=0;
let combo=0;
let wrongCount=0;
let answered=false;
const QUESTIONS_PER_STAGE=5;
const MAX_WRONG=3; // 3ミスでゲームオーバー

// ===== タイトル初期化 =====
function initTitle(){
  const allFlags=COUNTRIES.map(c=>c.flag);
  // 流れる国旗3列
  for(let row=1;row<=3;row++){
    const el=document.getElementById('flagrow'+row);
    const shuffled=[...allFlags].sort(()=>Math.random()-0.5);
    // 2倍にしてループ
    el.innerHTML=[...shuffled,...shuffled].map(f=>`<span class="tflag">${f}</span>`).join('');
  }
  updateHsTitle();
}

function updateHsTitle(){
  const hs=getHs();
  const el=document.getElementById('title-hs');
  if(hs>0)el.textContent=`ハイスコア：⭐${hs}`;
}

// ===== ゲーム開始 =====
function startGame(diff){
  difficulty=diff;
  // 難易度に応じた国プール（低難易度は上位を含む）
  let pool;
  if(diff==='easy') pool=COUNTRIES.filter(c=>c.cat==='easy');
  else if(diff==='mid') pool=COUNTRIES.filter(c=>c.cat==='easy'||c.cat==='mid');
  else pool=[...COUNTRIES];

  // シャッフル
  questionPool=[...pool].sort(()=>Math.random()-0.5);
  currentStage=0;score=0;combo=0;wrongCount=0;

  document.getElementById('title-screen').style.display='none';
  document.getElementById('game-screen').style.display='flex';
  ['stage-clear-ov','all-clear-ov','gameover-ov'].forEach(id=>document.getElementById(id).classList.remove('show'));

  setupStage();
}

function setupStage(){
  const start=currentStage*QUESTIONS_PER_STAGE;
  stageQuestions=questionPool.slice(start,start+QUESTIONS_PER_STAGE);
  if(stageQuestions.length<QUESTIONS_PER_STAGE){
    // 足りない場合はプールから補充（シャッフルして追加）
    const extra=[...questionPool].sort(()=>Math.random()-0.5);
    while(stageQuestions.length<QUESTIONS_PER_STAGE){
      stageQuestions.push(extra[stageQuestions.length%extra.length]);
    }
  }
  currentQ=0;
  wrongCount=0; // ステージごとにミスをリセット
  document.getElementById('hud-stage').textContent=`ステージ ${currentStage+1}`;
  showQuestion();
}

function showQuestion(){
  if(currentQ>=stageQuestions.length){
    stageClear();return;
  }
  answered=false;
  const q=stageQuestions[currentQ];
  const total=stageQuestions.length;

  // プログレス
  document.getElementById('progress-fill').style.width=`${(currentQ/total)*100}%`;
  document.getElementById('question-label').textContent=`ステージ${currentStage+1} - ${currentQ+1}もんめ／${total}もん`;

  // 国旗
  const flagEl=document.getElementById('flag-display');
  flagEl.textContent=q.flag;
  flagEl.style.transform='scale(0.5)';
  setTimeout(()=>flagEl.style.transition='transform 0.3s', 0);
  setTimeout(()=>flagEl.style.transform='scale(1)', 10);

  // ヒント（建造物・動物・景色）
  const hintsEl=document.getElementById('country-hints');
  hintsEl.innerHTML=q.hints.map(h=>`
    <div class="hint-item">
      <div class="hint-emoji">${h.e}</div>
      <div class="hint-label">${h.l}</div>
    </div>
  `).join('');

  // 答えバッジ非表示
  document.getElementById('answer-badge').style.display='none';

  // 選択肢生成（正解1+不正解3）
  const pool=difficulty==='easy'?COUNTRIES.filter(c=>c.cat==='easy'):
             difficulty==='mid'?COUNTRIES.filter(c=>c.cat==='easy'||c.cat==='mid'):
             COUNTRIES;
  const wrong=pool.filter(c=>c.name!==q.name).sort(()=>Math.random()-0.5).slice(0,3);
  const choices=[q,...wrong].sort(()=>Math.random()-0.5);

  const choicesEl=document.getElementById('choices');
  choicesEl.innerHTML='';
  choices.forEach(c=>{
    const btn=document.createElement('button');
    btn.className='choice-btn';
    btn.textContent=c.name;
    btn.onclick=()=>onAnswer(c.name===q.name, btn, q.name, choicesEl);
    choicesEl.appendChild(btn);
  });

  updateHUD();
}

function onAnswer(correct, btn, correctName, choicesEl){
  if(answered)return;
  answered=true;

  if(correct){
    combo++;
    const bonus=combo>=3?50:combo>=2?20:0;
    const pts=100+bonus;
    score+=pts;
    btn.classList.add('correct');
    showAnswerBadge('⭕');
    showScorePop(`+${pts}${bonus>0?` 🔥コンボ！`:''}`, btn);
    updateComboHud();
  } else {
    combo=0;
    wrongCount++;
    btn.classList.add('wrong');
    // 正解を表示
    Array.from(choicesEl.children).forEach(b=>{
      if(b.textContent===correctName)b.classList.add('reveal');
    });
    showAnswerBadge('❌');
    updateComboHud();
    if(wrongCount>=MAX_WRONG){
      // ゲームオーバー
      setTimeout(()=>gameOver(),1200);
      return;
    }
  }

  // 全ボタン無効化
  Array.from(choicesEl.children).forEach(b=>b.disabled=true);

  setTimeout(()=>{
    currentQ++;
    showQuestion();
  },1300);
}

function showAnswerBadge(emoji){
  const el=document.getElementById('answer-badge');
  el.textContent=emoji;
  el.style.display='block';
  el.style.animation='none';el.offsetHeight;
  el.style.animation='badgePop 0.4s ease-out forwards';
  setTimeout(()=>el.style.display='none',1200);
}

function showScorePop(text, refEl){
  const el=document.createElement('div');
  el.className='score-pop';
  el.textContent=text;
  el.style.color='#FFD700';
  const rect=refEl.getBoundingClientRect();
  el.style.left=rect.left+'px';
  el.style.top=(rect.top-10)+'px';
  document.getElementById('app').appendChild(el);
  setTimeout(()=>el.remove(),850);
}

function updateComboHud(){
  const el=document.getElementById('hud-combo');
  if(combo>=2){el.style.display='';el.textContent=`🔥 ${combo}コンボ`;}
  else el.style.display='none';
}

function updateHUD(){
  document.getElementById('hud-score').textContent=`⭐ ${score}`;
}

// ===== ステージクリア =====
function stageClear(){
  document.getElementById('progress-fill').style.width='100%';
  const stageScore=score;
  const perfect=wrongCount===0;
  document.getElementById('sc-emoji').textContent=perfect?'🌟':'🎉';
  document.getElementById('sc-title').textContent=`ステージ ${currentStage+1} クリア！`;
  document.getElementById('sc-sub').innerHTML=perfect?'かんぺき！ぜんもんせいかい！':'よくできました！';
  document.getElementById('sc-score').textContent=`⭐ ${score} てん`;

  // 次ステージあるか
  const nextStart=(currentStage+1)*QUESTIONS_PER_STAGE;
  const hasNext=nextStart<questionPool.length||(questionPool.length>=QUESTIONS_PER_STAGE);
  const totalStages=Math.ceil(questionPool.length/QUESTIONS_PER_STAGE);

  if(currentStage+1>=totalStages){
    // 全クリア
    setTimeout(()=>allClear(),400);
  } else {
    const btn=document.getElementById('sc-next-btn');
    btn.textContent=`ステージ ${currentStage+2} へ ▶`;
    btn.onclick=()=>{
      document.getElementById('stage-clear-ov').classList.remove('show');
      currentStage++;wrongCount=0;
      setupStage();
    };
    document.getElementById('stage-clear-ov').classList.add('show');
  }
}

function allClear(){
  const hs=getHs();const isNew=score>hs;
  if(isNew)saveHs(score);
  document.getElementById('stage-clear-ov').classList.remove('show');
  const diff={easy:'かんたん',mid:'ふつう',hard:'むずかしい'}[difficulty];
  document.getElementById('ac-sub').innerHTML=`【${diff}】ぜんステージ クリア！<br>コンボボーナスも かんぺき！`;
  document.getElementById('ac-score').textContent=`⭐ ${score} てん`;
  document.getElementById('ac-hs').textContent=isNew?'🏆 ハイスコアこうしん！':`ハイスコア：⭐${hs}`;
  document.getElementById('all-clear-ov').classList.add('show');
}

function gameOver(){
  const hs=getHs();const isNew=score>hs;
  if(isNew)saveHs(score);
  document.getElementById('go-sub').innerHTML=`ステージ${currentStage+1}・${currentQ}もんめで ミス${wrongCount}かい`;
  document.getElementById('go-score').textContent=`⭐ ${score} てん${isNew?' 🏆':''}`;
  document.getElementById('gameover-ov').classList.add('show');
}

function restartGame(){
  ['stage-clear-ov','all-clear-ov','gameover-ov'].forEach(id=>document.getElementById(id).classList.remove('show'));
  startGame(difficulty);
}

function showTitle(){
  document.getElementById('game-screen').style.display='none';
  document.getElementById('title-screen').style.display='flex';
  ['stage-clear-ov','all-clear-ov','gameover-ov'].forEach(id=>document.getElementById(id).classList.remove('show'));
  updateHsTitle();
}

function getHs(){return parseInt(localStorage.getItem('flag_quiz_hs')||'0');}
function saveHs(s){localStorage.setItem('flag_quiz_hs',s);}

// 初期化
initTitle();
function goHome(){
  if(window.parent!==window)window.parent.postMessage({type:'goHome'},'*');
  else window.location.href='/';
}
</script>
