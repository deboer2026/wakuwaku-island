<!DOCTYPE html>
<html lang="ja">
<head>
<script src="/games/wakuwaku_ui.js"></script>
<script src="/games/analytics_bridge.js"></script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>くだものキャッチ 3D</title>
<link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@700;800;900&family=DotGothic16&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{width:100%;height:100%;overflow:hidden;font-family:'M PLUS Rounded 1c',sans-serif;user-select:none;-webkit-user-select:none;}
body{background:linear-gradient(180deg,#8ED4F0,#DFF6D8);transition:background .8s;}
body.sky-apple{background:linear-gradient(180deg,#9BDCF7 0%,#D9F2C9 72%,#F3FBE4 100%);}
body.sky-orange{background:linear-gradient(180deg,#8FD4F5 0%,#FFE7B8 74%,#FFF6E0 100%);}
body.sky-grape{background:linear-gradient(180deg,#7FB9E8 0%,#CFC0F0 68%,#EBE2FB 100%);}
body.sky-melon{background:linear-gradient(180deg,#6FC8EE 0%,#BEEBF3 58%,#FFE9C0 100%);}
body.sky-snow{background:linear-gradient(180deg,#A6C6E8 0%,#DCEBF8 62%,#F6FAFF 100%);}
body.sky-rainbow{background:linear-gradient(180deg,#4E3E86 0%,#8A63C4 45%,#F7A7C9 78%,#FFE6B0 100%);}
body.sky-endless{background:linear-gradient(180deg,#79CBF2 0%,#CDEFDD 66%,#FFF3D6 100%);}

#wrap{position:fixed;inset:0;overflow:hidden;}
#cv{display:block;position:absolute;inset:0;width:100%;height:100%;z-index:0;touch-action:none;}

/* ============ HUD ============ */
#hud{position:fixed;top:0;left:0;right:0;z-index:40;display:none;flex-direction:column;gap:6px;
  padding:max(10px,var(--sat,0px)) max(12px,var(--sar,0px)) 6px max(12px,var(--sal,0px));pointer-events:none;}
#hud.on{display:flex;}
#hud button{pointer-events:auto;}
.hud-row{display:flex;justify-content:space-between;align-items:center;gap:8px;}
#hud-left{display:flex;align-items:center;gap:8px;min-width:0;}
#hud-right{display:flex;gap:6px;align-items:center;flex:none;}
#back-btn{background:rgba(0,0,0,.35);border:1px solid rgba(255,255,255,.3);border-radius:14px;padding:6px 12px;font-size:13px;font-weight:800;color:#fff;cursor:pointer;font-family:inherit;flex:none;}
#stage-name{font-size:15px;font-weight:900;color:#fff;text-shadow:0 2px 5px rgba(0,0,0,.45);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.chip{background:rgba(0,0,0,.32);border-radius:12px;padding:5px 10px;font-size:14px;font-weight:900;color:#fff;display:flex;align-items:center;gap:4px;white-space:nowrap;}
#ui-bgm-btn{background:rgba(0,0,0,.3);border:none;border-radius:50%;width:36px;height:36px;font-size:17px;cursor:pointer;display:flex;align-items:center;justify-content:center;}
#hearts{display:flex;gap:3px;font-size:19px;line-height:1;}
#hearts span{transition:transform .3s,filter .3s;}
#hearts span.off{filter:grayscale(1) opacity(.35);transform:scale(.8);}
@keyframes hbeat{0%,100%{transform:scale(1)}40%{transform:scale(1.5)}}
#hearts span.hit{animation:hbeat .4s ease;}

/* goal bar */
#goal-wrap{display:flex;align-items:center;gap:8px;pointer-events:none;}
#goal-bar{flex:1;height:14px;background:rgba(0,0,0,.28);border-radius:9px;overflow:hidden;border:2px solid rgba(255,255,255,.55);}
#goal-fill{height:100%;width:0%;background:linear-gradient(90deg,#FFD86B,#FF8A5B);transition:width .25s;}
#goal-txt{font-size:13px;font-weight:900;color:#fff;text-shadow:0 2px 4px rgba(0,0,0,.45);flex:none;}

/* combo */
#combo{position:fixed;left:50%;top:26%;transform:translate(-50%,-50%) scale(.5);z-index:45;pointer-events:none;
  font-family:'DotGothic16',sans-serif;font-size:30px;font-weight:900;color:#fff;opacity:0;transition:all .22s;
  text-shadow:0 3px 0 #E8862E,0 6px 14px rgba(0,0,0,.35);}
#combo.on{opacity:1;transform:translate(-50%,-50%) scale(1);}

/* floating score popups */
#pops{position:fixed;inset:0;z-index:44;pointer-events:none;overflow:hidden;}
.pop{position:absolute;font-family:'DotGothic16',sans-serif;font-size:22px;font-weight:900;color:#fff;
  text-shadow:0 2px 0 #D8721F,0 4px 8px rgba(0,0,0,.3);transform:translate(-50%,-50%);animation:popUp .9s ease-out forwards;}
.pop.bad{color:#FFD2D2;text-shadow:0 2px 0 #B03A3A,0 4px 8px rgba(0,0,0,.3);}
.pop.rainbow{background:linear-gradient(90deg,#FF7BAC,#FFD86B,#8CE99A,#74C0FC,#B197FC);-webkit-background-clip:text;background-clip:text;color:transparent;text-shadow:none;filter:drop-shadow(0 2px 3px rgba(0,0,0,.35));}
@keyframes popUp{0%{opacity:0;transform:translate(-50%,-50%) scale(.5)}20%{opacity:1;transform:translate(-50%,-90%) scale(1.15)}100%{opacity:0;transform:translate(-50%,-190%) scale(.95)}}

/* toast */
#toast{position:fixed;top:40%;left:50%;transform:translate(-50%,-50%) scale(.6);z-index:60;pointer-events:none;
  font-family:'DotGothic16',sans-serif;font-size:32px;font-weight:900;color:#fff;text-align:center;line-height:1.4;
  text-shadow:0 3px 0 #E8862E,0 6px 12px rgba(0,0,0,.3);opacity:0;transition:all .3s;}
#toast.on{opacity:1;transform:translate(-50%,-50%) scale(1);}

/* flash */
#flash{position:fixed;inset:0;z-index:55;pointer-events:none;background:#fff;opacity:0;transition:opacity .35s;}
#flash.on{opacity:.65;transition:opacity 0s;}
#rainbow-veil{position:fixed;inset:0;z-index:35;pointer-events:none;opacity:0;transition:opacity .4s;
  background:linear-gradient(120deg,rgba(255,123,172,.22),rgba(255,216,107,.22),rgba(140,233,154,.22),rgba(116,192,252,.22),rgba(177,151,252,.22));}
#rainbow-veil.on{opacity:1;}

/* ============ screens ============ */
.screen{position:fixed;inset:0;z-index:70;display:none;flex-direction:column;align-items:center;justify-content:center;justify-content:safe center;
  padding:max(18px,var(--sat,0px)) max(18px,var(--sar,0px)) max(18px,var(--sab,0px)) max(18px,var(--sal,0px));
  overflow-y:auto;-webkit-overflow-scrolling:touch;}
.screen.on{display:flex;}
.screen.dim{background:rgba(20,26,46,.72);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);}
.panel{background:rgba(255,255,255,.94);border-radius:26px;padding:22px 20px;max-width:520px;width:100%;
  box-shadow:0 12px 34px rgba(0,0,0,.28);border:4px solid #fff;text-align:center;}
.title-big{font-family:'DotGothic16',sans-serif;font-size:clamp(30px,8.5vw,52px);font-weight:900;color:#fff;line-height:1.2;
  text-shadow:0 3px 0 #E8862E,0 6px 0 #C25E14,0 10px 20px rgba(0,0,0,.3);margin-bottom:6px;text-align:center;}
.title-sub{font-size:15px;font-weight:800;color:#fff;text-shadow:0 2px 6px rgba(0,0,0,.4);margin-bottom:20px;text-align:center;}
.btn{font-family:inherit;font-weight:900;border:none;cursor:pointer;border-radius:20px;color:#fff;touch-action:manipulation;-webkit-tap-highlight-color:transparent;
  padding:15px 30px;font-size:19px;box-shadow:0 5px 0 rgba(0,0,0,.18),0 8px 18px rgba(0,0,0,.2);
  transition:transform .12s,box-shadow .12s;}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 rgba(0,0,0,.18);}
.btn.primary{background:linear-gradient(180deg,#FFB05C,#FF7B3D);}
.btn.green{background:linear-gradient(180deg,#8BD97F,#4FAE58);}
.btn.blue{background:linear-gradient(180deg,#7FC4F5,#4A90D9);}
.btn.pink{background:linear-gradient(180deg,#FF9FC4,#E8639B);}
.btn.gray{background:linear-gradient(180deg,#C3C8D4,#8F97A8);}
.btn.small{padding:11px 20px;font-size:15px;border-radius:15px;}
.btn-col{display:flex;flex-direction:column;gap:13px;align-items:center;width:100%;max-width:300px;}
.sec-title{font-family:'DotGothic16',sans-serif;font-size:23px;font-weight:900;color:#5B4630;margin-bottom:14px;}

/* char select */
.char-grid{display:flex;gap:16px;justify-content:center;flex-wrap:wrap;margin-bottom:20px;}
.char-card{background:linear-gradient(180deg,#FFF8EC,#FFE9CE);border:4px solid #fff;border-radius:22px;padding:12px 10px 14px;touch-action:manipulation;
  width:132px;cursor:pointer;box-shadow:0 5px 14px rgba(0,0,0,.16);transition:transform .18s,border-color .18s;}
.char-card.sel{border-color:#FF9A3D;transform:translateY(-6px) scale(1.05);box-shadow:0 10px 22px rgba(255,154,61,.4);}
.char-card canvas{width:100px;height:100px;display:block;margin:0 auto 6px;}
.char-name{font-size:16px;font-weight:900;color:#5B4630;}

/* mode select */
.mode-card{display:flex;align-items:center;gap:14px;background:linear-gradient(180deg,#FFF8EC,#FFEBD6);border:4px solid #fff;touch-action:manipulation;
  border-radius:20px;padding:14px 16px;cursor:pointer;box-shadow:0 5px 14px rgba(0,0,0,.15);width:100%;text-align:left;
  font-family:inherit;transition:transform .14s;}
.mode-card:active{transform:scale(.97);}
.mode-ico{font-size:34px;flex:none;}
.mode-t{font-size:19px;font-weight:900;color:#5B4630;}
.mode-d{font-size:12.5px;font-weight:700;color:#8A7358;line-height:1.5;}

/* stage map */
#map-list{display:flex;flex-direction:column;gap:11px;width:100%;max-width:460px;}
.st-card{display:flex;align-items:center;gap:12px;border-radius:20px;padding:12px 14px;border:4px solid #fff;touch-action:manipulation;
  box-shadow:0 5px 14px rgba(0,0,0,.16);cursor:pointer;font-family:inherit;text-align:left;width:100%;transition:transform .14s;}
.st-card:active{transform:scale(.975);}
.st-card.locked{filter:grayscale(.85) opacity(.62);cursor:not-allowed;}
.st-num{width:42px;height:42px;border-radius:50%;background:rgba(255,255,255,.9);display:flex;align-items:center;justify-content:center;
  font-family:'DotGothic16',sans-serif;font-size:20px;font-weight:900;color:#5B4630;flex:none;}
.st-mid{flex:1;min-width:0;}
.st-t{font-size:16.5px;font-weight:900;color:#4A3924;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.st-d{font-size:12px;font-weight:700;color:#6E5A40;}
.st-stars{font-size:16px;letter-spacing:1px;flex:none;}
.st-stars .off{filter:grayscale(1) opacity(.35);}

/* result */
.res-stars{font-size:44px;letter-spacing:6px;margin:6px 0 12px;}
.res-stars .off{filter:grayscale(1) opacity(.3);}
@keyframes starPop{0%{transform:scale(0) rotate(-40deg);opacity:0}60%{transform:scale(1.4) rotate(8deg);opacity:1}100%{transform:scale(1) rotate(0);opacity:1}}
.res-stars span.anim{display:inline-block;animation:starPop .5s ease both;}
.res-row{display:flex;justify-content:space-between;align-items:center;font-size:15px;font-weight:800;color:#5B4630;
  padding:7px 4px;border-bottom:2px dashed rgba(140,110,80,.25);}
.res-row:last-of-type{border-bottom:none;}
.res-row b{font-family:'DotGothic16',sans-serif;font-size:20px;color:#E8722A;}
.res-btns{display:flex;gap:10px;justify-content:center;margin-top:16px;flex-wrap:wrap;}

/* countdown */
#count{position:fixed;inset:0;z-index:65;display:none;align-items:center;justify-content:center;pointer-events:none;}
#count.on{display:flex;}
#count-n{font-family:'DotGothic16',sans-serif;font-size:120px;font-weight:900;color:#fff;
  text-shadow:0 5px 0 #E8862E,0 10px 26px rgba(0,0,0,.4);animation:cdPop .85s ease-out;}
@keyframes cdPop{0%{transform:scale(2.4);opacity:0}25%{transform:scale(1);opacity:1}75%{transform:scale(1);opacity:1}100%{transform:scale(.6);opacity:0}}

/* how to play hint */
#howto{position:fixed;left:50%;bottom:max(22px,var(--sab,0px));transform:translateX(-50%);z-index:41;
  background:rgba(0,0,0,.5);color:#fff;font-size:14px;font-weight:800;border-radius:18px;padding:9px 18px;
  pointer-events:none;opacity:0;transition:opacity .5s;white-space:normal;text-align:center;
  max-width:min(92vw,420px);width:max-content;}
#howto.on{opacity:1;}

/* fruit legend on map */
.legend{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:14px;font-size:12px;font-weight:800;color:#6E5A40;}
.legend div{background:rgba(255,255,255,.75);border-radius:12px;padding:5px 10px;}

/* ===== title screen (rich) ===== */
#sc-title{justify-content:center;justify-content:safe center;}
.t-deco{position:absolute;inset:0;pointer-events:none;overflow:hidden;z-index:-1;}
.t-deco span{position:absolute;bottom:-14vh;font-size:clamp(20px,5.5vw,30px);opacity:.5;
  animation:tFloat linear infinite;filter:drop-shadow(0 3px 5px rgba(0,0,0,.2));}
@keyframes tFloat{0%{transform:translateY(0) rotate(0deg)}100%{transform:translateY(-125vh) rotate(360deg)}}
.t-board{position:relative;background:linear-gradient(180deg,#F9CE92,#D89A55);
  border:6px solid #A5652F;border-radius:28px;padding:16px 28px 20px;
  box-shadow:0 11px 0 #8A4F22,0 20px 38px rgba(0,0,0,.34);animation:tBob 3.2s ease-in-out infinite;}
@keyframes tBob{0%,100%{transform:translateY(0) rotate(-1.2deg)}50%{transform:translateY(-9px) rotate(1.2deg)}}
.t-board::before{content:'';position:absolute;inset:9px;border:3px dashed rgba(255,255,255,.5);
  border-radius:19px;pointer-events:none;}
.t-topline{font-size:11.5px;font-weight:900;color:#7A4418;letter-spacing:3px;margin-bottom:3px;}
.t-name{font-family:'DotGothic16',sans-serif;font-size:clamp(29px,8.6vw,50px);font-weight:900;color:#fff;
  line-height:1.14;text-shadow:0 3px 0 #E8862E,0 6px 0 #C25E14,0 11px 18px rgba(0,0,0,.32);}
.t-badge{position:absolute;top:-18px;right:-14px;width:58px;height:58px;border-radius:50%;
  background:linear-gradient(180deg,#FFE894,#FFA93D);border:4px solid #fff;color:#7A4418;
  font-family:'DotGothic16',sans-serif;font-size:21px;font-weight:900;
  display:flex;align-items:center;justify-content:center;transform:rotate(13deg);
  box-shadow:0 5px 12px rgba(0,0,0,.3);}
.t-stats{display:flex;gap:8px;margin:15px 0 3px;flex-wrap:wrap;justify-content:center;}
.t-stat{background:rgba(255,255,255,.92);border-radius:14px;padding:6px 13px;font-size:13px;font-weight:900;
  color:#6B4A26;box-shadow:0 3px 8px rgba(0,0,0,.16);}
#nowebgl{position:fixed;inset:0;z-index:90;display:none;align-items:center;justify-content:center;padding:24px;
  background:linear-gradient(160deg,#2a2140,#4a2f5a);color:#fff;text-align:center;font-weight:800;line-height:1.9;font-size:15px;}
#nowebgl.on{display:flex;}
</style>
</head>

  <!-- stage map -->

      <div id="res-rows"></div>
      <div class="res-btns" id="res-btns"></div>
    </div>
  </div>

  <div id="nowebgl">😢 この ブラウザでは 3Dが うごきません。<br>べつの ブラウザで あそんでね。</div>
</div>

<script>
'use strict';

/* ==================== SAFE_LS ==================== */
const SAFE_LS=(function(){
  try{const t='__kdt';localStorage.setItem(t,'1');localStorage.removeItem(t);return localStorage;}
  catch(e){const m={};return{getItem:k=>(k in m)?m[k]:null,setItem:(k,v)=>{m[k]=String(v);},removeItem:k=>{delete m[k];}};}
})();
const SAVE_KEY='kudamono_v3_progress';
const VALID_CHARA=['princess','prince'];

/* ==================== STAGES ==================== */
const ALL_F=['apple','orange','grape','melon','peach','strawberry','banana','cherry'];

function safeParse(k){try{const r=SAFE_LS.getItem(k);if(!r)return null;const v=JSON.parse(r);return (v&&typeof v==='object')?v:null;}catch(e){return null;}}
function clampStar(v){v=Math.floor(Number(v));if(!isFinite(v)||v<0)return 0;return v>3?3:v;}
function normalizeSave(p){
  const out={schemaVersion:1,
    chara:(p&&VALID_CHARA.indexOf(p.chara)>=0)?p.chara:'princess',
    stages:{}, endlessBest:0,
    settings:{sound:(p&&p.settings&&typeof p.settings.sound==='boolean')?p.settings.sound:true}};
  for(let i=1;i<=STAGES.length;i++){
    const s=(p&&p.stages&&p.stages[i])||null;
    out.stages[i]={star:s?clampStar(s.star):0};
  }
  const b=p&&Number(p.endlessBest);
  out.endlessBest=(isFinite(b)&&b>0)?Math.floor(b):0;
  return out;
}
let SAVE=normalizeSave(safeParse(SAVE_KEY));
function persist(){try{SAFE_LS.setItem(SAVE_KEY,JSON.stringify(SAVE));}catch(e){}}
function unlockedUpTo(){
  let u=1;
  for(let i=1;i<=STAGES.length;i++){ if(SAVE.stages[i].star>0) u=Math.min(STAGES.length,i+1); }
  return u;
}

let AC=null;
function ac(){ if(!AC){ try{AC=new (window.AudioContext||window.webkitAudioContext)();}catch(e){AC=null;} } if(AC&&AC.state==='suspended'){try{AC.resume();}catch(e){}} return AC; }
function beep(freq,dur,type,vol,slideTo){
  const c=ac(); if(!c)return;
  try{
    const o=c.createOscillator(),g=c.createGain();
    o.type=type||'square'; o.frequency.setValueAtTime(freq,c.currentTime);
    if(slideTo)o.frequency.exponentialRampToValueAtTime(Math.max(40,slideTo),c.currentTime+dur);
    g.gain.setValueAtTime(0.0001,c.currentTime);
    g.gain.exponentialRampToValueAtTime(vol||0.16,c.currentTime+0.012);
    g.gain.exponentialRampToValueAtTime(0.0001,c.currentTime+dur);
    o.connect(g); g.connect(c.destination); o.start(); o.stop(c.currentTime+dur+0.03);
  }catch(e){}
}
function seCatch(combo){ const base=520+Math.min(combo,12)*38; beep(base,0.11,'square',0.14,base*1.5); }

let _bgm=null;

function initBGM(){
  if(_bgm)return;
  if(typeof WakuwakuMP3BGM!=='undefined'){
    try{
      _bgm=new WakuwakuMP3BGM('cute-animals');
      _bgmThemeName='cute-animals';
      const on=(typeof WakuwakuMP3BGM.loadState==='function')?WakuwakuMP3BGM.loadState():SAVE.settings.sound;
      _bgm.setEnabled(on); if(on)_bgm.start();
      SAVE.settings.sound=on; persist();
    }catch(e){_bgm=null;_bgmThemeName=null;}
  }
  syncBgmIcon();
fillTitleStats();
}
function toggleBGM(){
  if(!_bgm){initBGM(); if(!_bgm){SAVE.settings.sound=!SAVE.settings.sound;persist();syncBgmIcon();return;} }
  let on=true;
  try{ on=_bgm.toggle(); if(typeof WakuwakuMP3BGM!=='undefined'&&typeof WakuwakuMP3BGM.saveState==='function')WakuwakuMP3BGM.saveState(on); }catch(e){}
  SAVE.settings.sound=on; persist(); syncBgmIcon();
fillTitleStats();
}
/* くだものキャッチは全ステージで cute-animals を使用する。 */
function bgmTheme(){
  const t='cute-animals';
  if(typeof WakuwakuMP3BGM==='undefined')return;
  if(_bgm&&_bgmThemeName===t)return; // 同じテーマなら作り直さない
  const wasOn=_bgm?(typeof _bgm.enabled==='boolean'?_bgm.enabled:SAVE.settings.sound):SAVE.settings.sound;
  try{ if(_bgm&&typeof _bgm.stop==='function')_bgm.stop(); }catch(e){}
  try{
    _bgm=new WakuwakuMP3BGM(t);
    _bgmThemeName=t;
    _bgm.setEnabled(wasOn);
    if(wasOn)_bgm.start();
  }catch(e){ _bgm=null; _bgmThemeName=null; }
  SAVE.settings.sound=wasOn; persist();
  syncBgmIcon();
}
function syncBgmIcon(){
  let on=SAVE.settings.sound;
  if(_bgm&&typeof _bgm.isEnabled==='function'){ try{on=_bgm.isEnabled();}catch(e){} }
  else if(_bgm&&typeof _bgm.enabled==='boolean'){ on=_bgm.enabled; }
  const ic=on?'🔊':'🔇';
  const a=document.getElementById('ui-bgm-btn'); if(a)a.textContent=ic;
  const b=document.getElementById('btn-title-bgm'); if(b)b.textContent=ic+' おんがく';

const LANE_MAX=7.2, PLAYER_Z=0, SPAWN_Z=-24, CATCH_Y=1.45, GRAV=17;

/* レーン幅は画角から動的に算出（縦画面では狭く）。判定半径も比例させて難易度を端末間で揃える */
let LANE=7.2, CATCH_R=1.62, BAD_R=1.10, RING_END=1.80;
function frameCamera(attract,now){
  if(!ok3d)return;
  const w=window.innerWidth||360, h=window.innerHeight||640;
  const wide=(w/h)>1.18;
  const sway=attract?Math.sin((now||0)*0.00035)*(wide?0.75:0.35):0;
  camera.position.x=attract?sway:playerX*0.06;
  camera.position.y=wide?4.4:5.2;
  camera.position.z=wide?14.5:15.5;
  camera.lookAt(attract?sway*0.12:playerX*0.02,wide?1.7:1.8,wide?-12.0:-10.0);
}
function applyLane(){
  if(!ok3d)return;
  const oldPos=camera.position.clone(), oldQuat=camera.quaternion.clone();
  frameCamera(false,0);
  camera.position.x=0;
  camera.lookAt(0,(window.innerWidth/window.innerHeight)>1.18?1.7:1.8,(window.innerWidth/window.innerHeight)>1.18?-12.0:-10.0);
  camera.updateMatrixWorld(true);
  const dir=new THREE.Vector3(0.94,-0.35,0.5).unproject(camera).sub(camera.position).normalize();
  let x=LANE_MAX+1;
  if(Math.abs(dir.z)>1e-4){
    const t=(PLAYER_Z-camera.position.z)/dir.z;
    x=Math.abs(camera.position.x+dir.x*t);
  }
  camera.position.copy(oldPos); camera.quaternion.copy(oldQuat); camera.updateMatrixWorld(true);
  LANE=Math.max(3.4,Math.min(LANE_MAX,x-0.60));
  CATCH_R=Math.max(1.05,LANE*0.225); // かごより少し広め（せまい画面ほど寛容に）
  BAD_R=LANE*0.153;                  // にがてものは小さめ判定＝よけやすい
  RING_END=CATCH_R/0.90;
  targetX=Math.max(-LANE,Math.min(LANE,targetX));
  // 端末回転などでレーンが狭まった場合、飛行中アイテムの落下点も内側へ寄せる
  const lim=LANE-0.5;
  for(let i=0;i<items.length;i++){
    const it=items[i];
    if(it.tx>lim)it.tx=lim; else if(it.tx<-lim)it.tx=-lim;
    if(it.marker)it.marker.position.x=it.tx;
  }
}

function resize(){
  const w=window.innerWidth||360, h=window.innerHeight||640;
  if(!ok3d)return;
  const s=Math.min(1,720/Math.max(1,w));
  renderer.setPixelRatio(1);
  renderer.setSize(Math.max(1,Math.round(w*s)),Math.max(1,Math.round(h*s)),false);
  camera.aspect=w/h;
  camera.fov=(w/h>1.18)?48:58;
  camera.updateProjectionMatrix();
  frameCamera(true,performance.now());
  applyLane();
}
window.addEventListener('resize',resize);

const matCache={};
function M(color){
  const k='m'+color;
  if(!matCache[k])matCache[k]=new THREE.MeshLambertMaterial({color:color});
  return matCache[k];
}
function box(w,h,d,c){return new THREE.Mesh(new THREE.BoxGeometry(w,h,d),M(c));}
function sph(r,c,sg,hg){return new THREE.Mesh(new THREE.SphereGeometry(r,sg||10,hg||8),M(c));}
function cyl(rt,rb,h,c,sg){return new THREE.Mesh(new THREE.CylinderGeometry(rt,rb,h,sg||10),M(c));}

function clearStageDeco(){
  if(!stageDecoGroup)return;
  for(let i=stageDecoGroup.children.length-1;i>=0;i--){
    const c=stageDecoGroup.children[i];
    c.traverse(o=>{ if(o.geometry&&o.geometry.dispose)o.geometry.dispose(); });
    stageDecoGroup.remove(c);

}

/* ==================== PARTICLES ==================== */
const PCOUNT=90;
let particles=[];
function initParticles(){
  if(!ok3d)return;
  const geo=new THREE.BoxGeometry(0.16,0.16,0.16);
  for(let i=0;i<PCOUNT;i++){
    const m=new THREE.Mesh(geo,new THREE.MeshBasicMaterial({color:0xffffff}));
    m.visible=false; scene.add(m);
    particles.push({m:m,life:0,vx:0,vy:0,vz:0,rs:0});
  }
}
let pIdx=0;
function burst(x,y,z,color,n,pow){
  if(!ok3d)return;
  n=n||8; pow=pow||1;
  for(let i=0;i<n;i++){
    const p=particles[pIdx]; pIdx=(pIdx+1)%PCOUNT;
    p.m.visible=true; p.m.position.set(x,y,z);
    p.m.material.color.setHex(color);
    const s=0.6+Math.random()*0.9; p.m.scale.set(s,s,s);
    p.vx=(Math.random()*2-1)*3.4*pow;
    p.vy=(1.5+Math.random()*3.4)*pow;
    p.vz=(Math.random()*2-1)*2.4*pow;
    p.rs=(Math.random()*2-1)*9;
    p.life=0.62+Math.random()*0.32;
  }
}
function updateParticles(dt){
  for(let i=0;i<particles.length;i++){
    const p=particles[i];
    if(p.life<=0)continue;
    p.life-=dt;
    if(p.life<=0){p.m.visible=false;continue;}
    p.vy-=17*dt;
    p.m.position.x+=p.vx*dt; p.m.position.y+=p.vy*dt; p.m.position.z+=p.vz*dt;
    p.m.rotation.x+=p.rs*dt; p.m.rotation.z+=p.rs*dt;
    const s=Math.max(0.05,p.life*1.3); p.m.scale.set(s,s,s);
  }
}

let decos=[], decoT=0;
function updateAttract(dt,now){
  decoT-=dt;
  if(decoT<=0&&decos.length<9){
    decoT=0.40+Math.random()*0.35;
    const id=ALL_F[Math.floor(Math.random()*ALL_F.length)];
    const m=makeFruit(id);
    m.position.set((Math.random()*2-1)*9.5, 8.0+Math.random()*1.5, -17+Math.random()*13);
    scene.add(m);
    decos.push({m:m,vy:0,col:FDEF[id].c,rot:(Math.random()*2-1)*2.6});
  }
  for(let i=decos.length-1;i>=0;i--){
    const d=decos[i];
    d.vy-=9.5*dt;
    d.m.position.y+=d.vy*dt;
    d.m.rotation.x+=d.rot*dt; d.m.rotation.z+=d.rot*0.55*dt;
    if(d.m.position.y<=0.45){
      burst(d.m.position.x,0.5,d.m.position.z,d.col,6,0.5);
      scene.remove(d.m); decos.splice(i,1);
    }
  }
}
function clearDecos(){ decos.forEach(d=>scene.remove(d.m)); decos=[]; }

  g.position.y=0.06; g.visible=false;
  g.renderOrder=2; ring.renderOrder=2; disc.renderOrder=2;
  g.userData={ring:ring,disc:disc};
  scene.add(g); markers.push(g); return g;
}
function spawnItem(){
  if(!ok3d)return;
  const st=G.stage;
  const tx=(Math.random()*2-1)*(LANE-0.5);
  const fall=st.fall[0]+Math.random()*(st.fall[1]-st.fall[0]);
  const r=Math.random();
  let kind='fruit', id=null, mesh=null, col=0xffffff, pts=10;

  if(G.hearts<3 && r<0.035){
    kind='heart'; mesh=makeHeartItem(); col=0xFF6B8A;
  } else if(r<0.075){
    kind='rainbow'; mesh=makeRainbow(); col=0xFFD86B; pts=30;
  } else if(Math.random()<st.bad){
    kind='bad'; id=(Math.random()<0.5)?'iga':'kinoko'; mesh=makeBad(id); col=(id==='iga')?0x9E8C48:0x9B4FD6;
  } else {
    const list=st.fruits; id=list[Math.floor(Math.random()*list.length)];
    mesh=makeFruit(id); col=FDEF[id].c; pts=FDEF[id].pts;
  }

  const sy=SPAWN_Y[0]+Math.random()*(SPAWN_Y[1]-SPAWN_Y[0]);
  const sx=tx*0.45+(Math.random()*2-1)*0.9;

  mesh.position.set(sx,sy,SPAWN_Z);
  scene.add(mesh);

  const mk=getMarker();
  if(mk){
    mk.visible=true; mk.position.set(tx,0.06,PLAYER_Z);
    const rc=(kind==='bad')?0xFF4B4B:(kind==='rainbow')?0xFFE066:(kind==='heart')?0xFF8FB0:0xFFFFFF;
    mk.userData.ring.material.color.setHex(rc);
    mk.userData.disc.material.color.setHex(col);
  }

  items.push({mesh:mesh,kind:kind,id:id,col:col,pts:pts,sx:sx,tx:tx,sy:sy,t:0,fall:fall,
    marker:mk,dead:false,rot:(Math.random()*2-1)*3.2});
}

function popText(x3,y3,z3,txt,cls){
  if(!ok3d)return;
  const v=new THREE.Vector3(x3,y3,z3).project(camera);
  const sx=(v.x*0.5+0.5)*window.innerWidth;
  const sy=(-v.y*0.5+0.5)*window.innerHeight;
  const d=document.createElement('div');
  d.className='pop'+(cls?' '+cls:''); d.textContent=txt;
  d.style.left=sx+'px'; d.style.top=sy+'px';
  elPops.appendChild(d);
  setTimeout(()=>{ if(d.parentNode)d.parentNode.removeChild(d); },950);
}

function removeItem(it){
  it.dead=true;
  if(it.marker)it.marker.visible=false;
  scene.remove(it.mesh);
}

function onCatch(it){
  const px=it.tx, py=CATCH_Y, pz=PLAYER_Z;
  if(it.kind==='heart'){
    G.hearts=Math.min(3,G.hearts+1); syncHearts(true);
    burst(px,py,pz,0xFF6B8A,14,1.2); popText(px,py+0.8,pz,'❤️ +1');
    seHeart(); toast('❤️ かいふく！',800);
  } else if(it.kind==='rainbow'){
    G.count++; G.combo++;
    G.rainbow=6.0; elVeil.classList.add('on');
    burst(px,py,pz,0xFFD86B,20,1.5);
    popText(px,py+0.8,pz,'2ばい！','rainbow');
    seRainbow(); toast('🌈 にじの くだもの！<br>てんすう 2ばい！',1200);
    addScore(30,px,py,pz,true);
  } else {
    G.combo++;
    G.count++;
    const mult=(G.rainbow>0)?2:1;
    const bonus=1+Math.min(G.combo,12)*0.1;
    const pts=Math.round(it.pts*bonus*mult);
    addScore(pts,px,py,pz,mult>1);
    burst(px,py,pz,it.col,10,1);
    seCatch(G.combo);
    if(G.combo>=3){ elCombo.textContent=G.combo+' コンボ！'; elCombo.classList.add('on');
      clearTimeout(elCombo._t); elCombo._t=setTimeout(()=>elCombo.classList.remove('on'),820); }
  }
  basketSquash=1; hopT=0.34;
  removeItem(it);
  syncGoal();
}
function addScore(pts,x,y,z,rb){
  G.score+=pts;
  elScoreV.textContent=G.score;
  popText(x,y+0.7,z,'+'+pts,rb?'rainbow':'');
}
function onBadHit(it){
  G.hearts--; G.combo=0;
  syncHearts(true);
  burst(it.tx,CATCH_Y,PLAYER_Z,it.col,16,1.3);
  popText(it.tx,CATCH_Y+0.8,PLAYER_Z,'いたっ！','bad');
  seBad(); flash(); shake=0.55;
  elCombo.classList.remove('on');
  removeItem(it);
  if(G.hearts<=0){ endGame(false); }
}
function onMiss(it){
  if(it.kind==='fruit'){ G.combo=0; elCombo.classList.remove('on'); }
  burst(it.tx,it.mesh.position.y,PLAYER_Z,it.col,7,0.6);
  removeItem(it);
}

function syncHearts(anim){
  const hs=elHearts.children;
  for(let i=0;i<hs.length;i++){
    hs[i].classList.toggle('off',i>=G.hearts);
    if(anim&&i===G.hearts){ hs[i].classList.add('hit'); setTimeout(()=>hs[i].classList.remove('hit'),420); }

function syncGoal(){
  if(G.mode==='endless'){

/* ==================== INPUT ==================== */
let dragging=false, lastPX=0;
function onDown(e){
  if(!G.running)return;
  if(e.cancelable)e.preventDefault();
  dragging=true; lastPX=e.clientX;
  try{ if(cv.setPointerCapture&&e.pointerId!=null)cv.setPointerCapture(e.pointerId); }catch(_e){}
}
function onMove(e){
  if(!dragging||!G.running)return;
  if(e.cancelable)e.preventDefault();
  const x=e.clientX, dx=x-lastPX; lastPX=x;
  const scale=(LANE*2)/(Math.max(240,window.innerWidth)*0.72);
  targetX=Math.max(-LANE,Math.min(LANE,targetX+dx*scale));
}
function onUp(e){
  dragging=false;
  try{ if(cv.releasePointerCapture&&e&&e.pointerId!=null&&cv.hasPointerCapture(e.pointerId))cv.releasePointerCapture(e.pointerId); }catch(_e){}
}
cv.addEventListener('pointerdown',onDown,{passive:false});
window.addEventListener('pointermove',onMove,{passive:false});
window.addEventListener('pointerup',onUp);
window.addEventListener('pointercancel',onUp);

const keys={};
window.addEventListener('keydown',e=>{
  if(e.key==='ArrowLeft'||e.key==='a')keys.l=1;
  if(e.key==='ArrowRight'||e.key==='d')keys.r=1;
});
window.addEventListener('keyup',e=>{
  if(e.key==='ArrowLeft'||e.key==='a')keys.l=0;
  if(e.key==='ArrowRight'||e.key==='d')keys.r=0;
});

/* ==================== GAME FLOW ==================== */
function startStage(n){
  G.mode='story';
  const st=STAGES[n-1];
  G.stage={n:st.n,name:st.name,goal:st.goal,time:st.time,iv:st.iv,fall:st.fall,bad:st.bad,fruits:st.fruits,boss:!!st.boss};
  G.goal=st.goal; G.time=st.time;
  setStageLook(st.leaf,st.ground,st.sky);
  setStageDeco(st.n);
  setupBoss(!!st.boss);
  elStageName.textContent=st.n+'. '+st.name;
  bgmTheme();
  beginRun();
}
function startEndless(){
  G.mode='endless';
  G.stage={n:0,name:ENDLESS.name,goal:9999,time:0,iv:[1.0,1.3],fall:[2.85,3.30],bad:0.06,fruits:ALL_F,boss:false};
  G.goal=9999; G.time=0; G.level=1;
  setStageLook(ENDLESS.leaf,ENDLESS.ground,ENDLESS.sky);
  setStageDeco(0);
  setupBoss(false);
  elStageName.textContent='♾️ エンドレス';
  bgmTheme();
  beginRun();
}
function setupBoss(on){
  if(!ok3d)return;
  if(on){
    if(!boss){ boss=makeBoss(); scene.add(boss); }
    boss.visible=true; boss.position.set(0,3.2,-21); boss.rotation.set(0,0,0);
    boss.userData.fell=false; boss.userData.throwT=0;
    boss.userData.arm1.rotation.x=0; boss.userData.arm2.rotation.x=0;
  } else if(boss){ boss.visible=false; }
}
function clearItems(){
  items.forEach(it=>{ if(!it.dead){ if(it.marker)it.marker.visible=false; scene.remove(it.mesh);} });
  items=[];
  markers.forEach(m=>m.visible=false);
}
function beginRun(){
  WakuwakuAnalytics.startGame({game_id:'/kudamono-catch',game_name:'くだものキャッチ',game_category:'action'});
  ensureChara(SAVE.chara);
  clearItems(); clearDecos();
  G.score=0; G.count=0; G.hearts=3; G.combo=0; G.rainbow=0; G.spawnT=0; G.elapsed=0; G.level=1;
  playerX=0; targetX=0;
  elScoreV.textContent='0';
  elVeil.classList.remove('on');
  elCombo.classList.remove('on');
  syncHearts(false);
  $('chip-time').style.display=(G.mode==='endless')?'none':'flex';
  elTimeV.textContent=G.time;
  if(G.mode==='endless'){ elGoalTxt.textContent='レベル 1'; elGoalFill.style.width='0%'; }
  else { elGoalTxt.textContent='0 / '+G.goal; elGoalFill.style.width='0%'; }
  hideScreens();
  elHud.classList.add('on');
  G.running=false;
  countdown(()=>{
    G.running=true;
    G.nextIv=0.6;
    if(G.mode==='story'&&G.stage.boss)elHowto.textContent='👑 ザルが なげてくる くだものを あつめよう！';
    else if(G.stage.bad>0)elHowto.textContent='🌰 とげとげ・きのこは よけてね！';
    else elHowto.textContent='ゆびで よこに うごかして キャッチ！';
    elHowto.classList.add('on');
    setTimeout(()=>elHowto.classList.remove('on'),4200);
  });
}
let _countdownTid=null;
function cancelCountdown(){
  G.countingDown=false;
  if(_countdownTid){ clearTimeout(_countdownTid); _countdownTid=null; }
  elCount.classList.remove('on');
}
function countdown(cb){
  G.countingDown=true;
  elCount.classList.add('on');
  const seq=['3','2','1','スタート！'];
  let i=0;
  const step=()=>{
    if(!G.countingDown)return; // 途中でもどるが押されたら以後の開始を止める
    if(i>=seq.length){ G.countingDown=false; elCount.classList.remove('on'); cb(); return; }
    elCountN.textContent=seq[i];
    elCountN.style.fontSize=(i<3)?'120px':'62px';
    elCountN.style.animation='none';
    void elCountN.offsetWidth;
    elCountN.style.animation='';
    seTick();
    i++;
    _countdownTid=setTimeout(step,750);
  };
  step();
}
function endGame(win){
  if(!G.running)return;
  G.running=false;
  elHud.classList.remove('on');
  elVeil.classList.remove('on');
  elCombo.classList.remove('on');
  setTimeout(()=>{ clearItems(); },250);
  if(G.mode==='endless'){
    const isBest=G.score>SAVE.endlessBest;
    if(isBest){ SAVE.endlessBest=G.score; persist(); }
    seFail();
    showResult({title:'おしまい！',stars:0,rows:[
      ['とったかず',G.count+' こ'],['スコア',G.score],['ベスト',SAVE.endlessBest]
    ],newBest:isBest,mode:'endless'});
    return;
  }
  const star=win?Math.max(1,G.hearts):0;
  if(win){
    const cur=SAVE.stages[G.stage.n].star;
    if(star>cur){ SAVE.stages[G.stage.n].star=star; }
    persist();
    seClear();
    if(G.stage.boss && boss){ boss.userData.fell=true; }
  } else { seFail(); }
  showResult({
    title:win?(G.stage.boss?'🎉 ザルに かった！':'ステージクリア！'):'ざんねん…',
    stars:star,
    rows:[['とったかず',G.count+' / '+G.goal],['スコア',G.score],['のこりハート','❤️×'+Math.max(0,G.hearts)]],
    win:win, mode:'story'
  });
}

function showResult(o){
  $('res-title').textContent=o.title;
  const sc=$('res-stars'); sc.innerHTML='';
  if(o.mode==='story'){
    for(let i=0;i<3;i++){
      const s=document.createElement('span');
      s.textContent='⭐'; if(i>=o.stars)s.className='off';
      sc.appendChild(s);
      if(i<o.stars){ setTimeout(()=>{ s.classList.add('anim'); beep(700+i*180,0.16,'triangle',0.16); },380+i*280); }
    }
  } else {
    sc.innerHTML=o.newBest?'🏆':'♾️';
  }
  const rows=$('res-rows'); rows.innerHTML='';
  o.rows.forEach(r=>{
    const d=document.createElement('div'); d.className='res-row';
    d.innerHTML='<span>'+r[0]+'</span><b>'+r[1]+'</b>';
    rows.appendChild(d);
  });
  if(o.newBest){ const d=document.createElement('div'); d.className='res-row';
    d.innerHTML='<span style="color:#E8722A">🏆 ハイスコア こうしん！</span><b></b>'; rows.appendChild(d); }
  const bt=$('res-btns'); bt.innerHTML='';
  const mk=(txt,cls,fn)=>{ const b=document.createElement('button'); b.className='btn small '+cls; b.textContent=txt; b.onclick=fn; bt.appendChild(b); };
  if(o.mode==='endless'){
    mk('もういちど','primary',()=>{seTap();startEndless();});
    mk('メニューへ','gray',()=>{seTap();show('sc-mode');});
  } else {
    if(o.win && G.stage.n<STAGES.length) mk('つぎへ ▶','green',()=>{seTap();startStage(G.stage.n+1);});
    mk('もういちど','primary',()=>{seTap();startStage(G.stage.n);});
    mk('ステージせんたく','gray',()=>{seTap();buildMap();show('sc-map');});
  }
  show('sc-result');
}

const ST_COLORS=['#FFD9C4','#FFE7B8','#E4D6FA','#CFF0E8','#E4EFFA','#F5D8F0'];

/* ==================== CHARA PREVIEW (2D vector) ==================== */
function drawCharaCard(canvas,kind){
  if(!canvas)return;
  const x=canvas.getContext('2d'); if(!x)return;
  const W=canvas.width,H=canvas.height;
  x.clearRect(0,0,W,H);
  const isP=(kind==='princess');
  const dress=isP?'#FF9CC4':'#6FA8E8';
  const hair=isP?'#F7C86B':'#6B4A2F';
  const cx=W/2;
  // basket
  x.fillStyle='#C98A46'; x.beginPath();
  x.moveTo(cx-46,H-52); x.lineTo(cx+46,H-52); x.lineTo(cx+34,H-16); x.lineTo(cx-34,H-16); x.closePath(); x.fill();
  x.fillStyle='#E0A860'; x.fillRect(cx-52,H-60,104,12);
  // dress
  x.fillStyle=dress; x.beginPath();
  if(isP){ x.moveTo(cx-20,H-118); x.lineTo(cx+20,H-118); x.lineTo(cx+44,H-52); x.lineTo(cx-44,H-52); }
  else { x.moveTo(cx-24,H-118); x.lineTo(cx+24,H-118); x.lineTo(cx+28,H-52); x.lineTo(cx-28,H-52); }
  x.closePath(); x.fill();
  // arms
  x.strokeStyle='#FFD9B8'; x.lineWidth=11; x.lineCap='round';
  x.beginPath(); x.moveTo(cx-24,H-110); x.lineTo(cx-42,H-64); x.stroke();
  x.beginPath(); x.moveTo(cx+24,H-110); x.lineTo(cx+42,H-64); x.stroke();
  // head
  x.fillStyle=hair; x.beginPath(); x.arc(cx,H-140,32,0,Math.PI*2); x.fill();
  x.fillStyle='#FFD9B8'; x.beginPath(); x.arc(cx,H-136,27,0,Math.PI*2); x.fill();
  x.fillStyle=hair; x.beginPath(); x.arc(cx,H-152,29,Math.PI,Math.PI*2); x.fill();
  if(isP){ x.beginPath(); x.arc(cx-31,H-134,13,0,Math.PI*2); x.fill();
           x.beginPath(); x.arc(cx+31,H-134,13,0,Math.PI*2); x.fill(); }
  // eyes
  x.fillStyle='#33261C';
  x.beginPath(); x.ellipse(cx-10,H-134,4,6,0,0,Math.PI*2); x.fill();
  x.beginPath(); x.ellipse(cx+10,H-134,4,6,0,0,Math.PI*2); x.fill();
  x.fillStyle='#FF9CA8';
  x.beginPath(); x.ellipse(cx-19,H-125,6,4,0,0,Math.PI*2); x.fill();
  x.beginPath(); x.ellipse(cx+19,H-125,6,4,0,0,Math.PI*2); x.fill();
  x.strokeStyle='#C4576B'; x.lineWidth=2.4;
  x.beginPath(); x.arc(cx,H-128,7,0.25*Math.PI,0.75*Math.PI); x.stroke();
  // crown
  x.fillStyle='#FFCF45';
  x.beginPath();
  x.moveTo(cx-24,H-166); x.lineTo(cx-24,H-180); x.lineTo(cx-12,H-170); x.lineTo(cx,H-186);
  x.lineTo(cx+12,H-170); x.lineTo(cx+24,H-180); x.lineTo(cx+24,H-166);
  x.closePath(); x.fill();
  x.fillStyle='#FF7BAC'; x.beginPath(); x.arc(cx,H-172,4,0,Math.PI*2); x.fill();
}

/* ==================== ANIMATION LOOP ==================== */
let last=performance.now(), acc=0;
function loop(now){
  requestAnimationFrame(loop);
  if(!ok3d)return;
  let dt=(now-last)/1000; last=now;
  if(dt>0.1)dt=0.1;

  // clouds drift
  if(cloudGroup){ cloudGroup.children.forEach((c,i)=>{ c.position.x+=(0.35+i*0.05)*dt; if(c.position.x>36)c.position.x=-36; }); }

  if(G.running){
    // timer
    if(G.mode==='story'){
      G.time-=dt;
      if(G.time<=0){ G.time=0; elTimeV.textContent='0'; endGame(false); }
      else elTimeV.textContent=Math.ceil(G.time);
    }
    G.elapsed+=dt;
    if(G.rainbow>0){ G.rainbow-=dt; if(G.rainbow<=0)elVeil.classList.remove('on'); }

    // endless ramp
    if(G.mode==='endless'){
      const lv=1+Math.floor(G.count/10);
      if(lv!==G.level){ G.level=lv; syncGoal(); toast('レベル '+lv+'！',800); beep(880,0.14,'triangle',0.15); }
      const k=Math.min(1,(G.level-1)/11);
      G.stage.iv=[1.02-0.5*k,1.32-0.6*k];
      G.stage.fall=[2.85-0.85*k,3.30-1.0*k];
      G.stage.bad=0.06+0.18*k;
    }

    // spawn
    G.spawnT+=dt;
    if(G.spawnT>=G.nextIv){
      G.spawnT=0;
      const iv=G.stage.iv;
      G.nextIv=iv[0]+Math.random()*(iv[1]-iv[0]);
      spawnItem();
      if(G.stage.boss&&boss){ boss.userData.throwT=0.34; }
    }
  }

  // player move
  if(!G.attract){
    if(keys.l)targetX=Math.max(-LANE,targetX-11*dt);
    if(keys.r)targetX=Math.min(LANE,targetX+11*dt);
  }
  const prevX=playerX;
  playerX+=(targetX-playerX)*Math.min(1,15*dt);
  const vel=(playerX-prevX)/Math.max(dt,0.0001);
  if(chara){
    const u=chara.userData;
    if(G.attract){
      targetX+=(0-targetX)*Math.min(1,2.4*dt);
      chara.position.x=playerX;
      chara.position.y=Math.abs(Math.sin(now*0.0024))*0.05;
      chara.rotation.y=Math.sin(now*0.0007)*0.42;
      chara.rotation.z=Math.sin(now*0.0011)*0.05;
      u.l1.rotation.x=0; u.l2.rotation.x=0; u.legs.position.y=0;
      u.basket.rotation.z=Math.sin(now*0.0016)*0.15;
      u.basket.scale.set(1,1,1);
      hopT=0; basketSquash=0;
    } else {
      if(hopT>0)hopT-=dt;
      const hop=(hopT>0)?Math.sin(hopT/0.34*Math.PI)*0.28:0;
      chara.position.x=playerX;
      chara.position.y=hop;
      chara.rotation.z=-Math.max(-0.22,Math.min(0.22,vel*0.022));
      chara.rotation.y=Math.max(-0.16,Math.min(0.16,vel*0.016));
      walkPhase+=Math.abs(vel)*dt*2.6;
      const sw=Math.sin(walkPhase)*0.5;
      u.l1.rotation.x=sw; u.l2.rotation.x=-sw;
      u.legs.position.y=Math.abs(Math.sin(walkPhase))*0.06;
      u.basket.rotation.z=0;
      if(basketSquash>0){ basketSquash-=dt*4; if(basketSquash<0)basketSquash=0; }
      const sq=1+basketSquash*0.22;
      u.basket.scale.set(sq,1/sq,sq);
    }
    if(shadowMesh){
      shadowMesh.position.x=playerX;
      const k=1-chara.position.y*0.9;
      shadowMesh.scale.set(k,k,1);
      shadowMesh.material.opacity=0.28*k;
    }
  }
  if(G.attract)updateAttract(dt,now);

  // items
  for(let i=items.length-1;G.running&&i>=0;i--){
    const it=items[i];
    if(it.dead){ items.splice(i,1); continue; }
    it.t+=dt;
    const p=Math.min(1,it.t/it.fall);
    it.mesh.position.x=it.sx+(it.tx-it.sx)*p;
    it.mesh.position.z=SPAWN_Z+(PLAYER_Z-SPAWN_Z)*p;
    const ey=0.46*p+0.54*p*p; // ゆるやかに加速して落ちる（上に打ち上がらない）
    it.mesh.position.y=it.sy+(CATCH_Y-it.sy)*ey;
    it.mesh.rotation.x+=it.rot*dt;
    it.mesh.rotation.y+=it.rot*0.7*dt;
    if(it.kind==='rainbow'){ it.mesh.rotation.z+=4*dt; const s=1+Math.sin(now*0.008)*0.12; it.mesh.scale.set(s,s,s); }
    if(it.marker){
      // 着地時のリング外周(0.90*1.80=1.62) = キャッチ判定半径と一致させて分かりやすく
      const k=RING_END*(2.0-1.0*p); // 着地時のリング外周＝キャッチ判定半径
      it.marker.scale.set(k,1,k);
      const pulse=(it.kind==='bad')?(0.75+Math.sin(now*0.018)*0.25):1;
      it.marker.userData.ring.material.opacity=(0.42+0.53*p)*pulse;
      it.marker.userData.disc.material.opacity=(0.14+0.34*p)*pulse;
    }
    if(p>=1){
      const d=Math.abs(playerX-it.tx);
      if(it.kind==='bad'){
        if(d<=BAD_R)onBadHit(it); else onMiss(it);
      } else {
        if(d<=CATCH_R)onCatch(it); else onMiss(it);
      }
      items.splice(i,1);
    }
  }

  // boss anim
  if(boss&&boss.visible){
    const u=boss.userData;
    if(u.fell){
      boss.rotation.z+=3.4*dt; boss.position.y-=5*dt; boss.position.z+=2*dt;
      if(boss.position.y<-8)boss.visible=false;
    } else {
      boss.position.y=3.2+Math.sin(now*0.002)*0.22;
      if(u.throwT>0){ u.throwT-=dt;
        u.arm1.rotation.x=-Math.sin(Math.max(0,u.throwT)/0.34*Math.PI)*1.5;
        u.arm2.rotation.x=-Math.sin(Math.max(0,u.throwT)/0.34*Math.PI)*1.5;
      } else { u.arm1.rotation.x*=0.86; u.arm2.rotation.x*=0.86; }
      u.head.rotation.y=Math.sin(now*0.0015)*0.3;
    }
  }

  updateParticles(dt);

  // camera: keep the character upright and the orchard/ground visible on both wide and portrait screens
  if(shake>0){ shake-=dt*1.8; if(shake<0)shake=0; }
  const sx=(Math.random()*2-1)*shake*0.22, sy2=(Math.random()*2-1)*shake*0.18;
  frameCamera(G.attract,now);
  camera.position.x+=sx; camera.position.y+=sy2;

  renderer.render(scene,camera);
}

}

    G.running=false; elHud.classList.remove('on'); clearItems();
    if(G.mode==='endless')show('sc-mode'); else { buildMap(); show('sc-map'); }
  }
  else goHome();
};

  else if(!document.hidden&&_bgm&&SAVE.settings.sound){ try{_bgm.start&&_bgm.start();}catch(e){} }
});
