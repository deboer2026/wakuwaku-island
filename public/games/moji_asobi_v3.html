<!DOCTYPE html>
<html lang="ja">
<head>
<script src="/games/wakuwaku_ui.js"></script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>もじのもり3D - ひらがな・カタカナ・ABC</title>
<link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@700;800;900&family=DotGothic16&display=swap" rel="stylesheet">
<style>
/* ===== もじクエスト3D 共通スタイル ===== */
/* moji_engine.css - もじクエスト3D 共通スタイル
   テーマ色は各HTMLの :root で上書きする */
:root{
  --ink:#4A3B32;
  --paper:#FFFCF6;
  --acc:#F5A93F;
  --acc2:#E8586A;
  --panel:rgba(255,252,246,.94);
  --hud:rgba(50,44,60,.44);
  --btn1:#F5A93F;
  --btn2:#E8873F;
  --slot:#FFF3DC;
  --slotb:#E2CFAE;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{width:100%;height:100%;overflow:hidden;user-select:none;-webkit-user-select:none;
  font-family:'M PLUS Rounded 1c','Hiragino Maru Gothic ProN',sans-serif;color:var(--ink);}
body{background:var(--bg0,#BFE8F5);}

#cv{display:block;position:fixed;inset:0;width:100%;height:100%;z-index:0;touch-action:none;}

/* ============ ローディング / フォールバック ============ */
#loading,#fallback{position:fixed;inset:0;z-index:200;display:none;flex-direction:column;
  align-items:center;justify-content:center;gap:14px;background:var(--bg0,#BFE8F5);text-align:center;padding:24px;}
#loading.on,#fallback.on{display:flex;}
.spin{width:44px;height:44px;border-radius:50%;border:5px solid rgba(255,255,255,.55);
  border-top-color:var(--acc);animation:sp 1s linear infinite;}
@keyframes sp{to{transform:rotate(360deg)}}
#loading p,#fallback p{font-weight:800;font-size:15px;color:var(--ink);line-height:1.7;}

/* ============ HUD ============ */
#hud{position:fixed;top:0;left:0;right:0;z-index:40;display:none;
  padding:max(8px,var(--sat,0px)) max(10px,var(--sar,0px)) 0 max(10px,var(--sal,0px));
  pointer-events:none;}
#hud.on{display:block;}
#hud button{pointer-events:auto;}
.hud-row{display:flex;align-items:center;justify-content:space-between;gap:8px;}
.hud-l{display:flex;gap:6px;align-items:center;min-width:0;}
.hud-r{display:flex;gap:6px;align-items:center;flex:none;}
.hbtn{background:var(--hud);border:1px solid rgba(255,255,255,.3);border-radius:13px;
  padding:6px 11px;font-size:13px;font-weight:800;color:#FFFCF6;cursor:pointer;font-family:inherit;flex:none;}
.hround{background:var(--hud);border:1px solid rgba(255,255,255,.3);border-radius:50%;
  width:32px;height:32px;font-size:15px;cursor:pointer;display:flex;align-items:center;justify-content:center;color:#FFFCF6;}
#hud-stage{font-size:12.5px;font-weight:900;color:#FFFCF6;text-shadow:0 2px 6px rgba(30,20,10,.6);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}

/* ============ しつもん パネル ============ */
#qpanel{position:fixed;left:50%;transform:translateX(-50%);
  top:calc(max(8px,var(--sat,0px)) + 44px);z-index:38;width:min(94vw,470px);
  background:var(--panel);border-radius:22px;padding:10px 12px 12px;
  box-shadow:0 8px 24px rgba(60,40,20,.22);display:none;}
#qpanel.on{display:block;}
.qrow{display:flex;align-items:center;gap:11px;}
#q-icon{flex:none;width:96px;height:96px;border-radius:16px;background:#FFFCF6;box-shadow:0 2px 8px rgba(80,60,30,.14);}
.qright{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px;}
#q-slots{display:flex;flex-wrap:wrap;gap:5px;}
.slot{width:40px;height:46px;border-radius:11px;background:var(--slot);
  border:2.5px dashed var(--slotb);display:flex;align-items:center;justify-content:center;
  font-size:26px;font-weight:900;color:var(--ink);transition:transform .16s ease,background .16s ease;}
.slot.sm{width:31px;height:37px;font-size:20px;border-radius:9px;}
.slot.fill{background:var(--acc);border:2.5px solid var(--acc);color:#FFFCF6;
  box-shadow:0 3px 0 rgba(0,0,0,.12);animation:pop .28s ease-out;}
.slot.next{border-color:var(--acc2);border-style:solid;background:#FFFCF6;
  animation:nx 1.5s ease-in-out infinite;}
@keyframes nx{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
@keyframes pop{0%{transform:scale(.4)}60%{transform:scale(1.15)}100%{transform:scale(1)}}
.slot.shake{animation:sk .35s ease;}
@keyframes sk{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.qmeta{display:flex;align-items:center;justify-content:space-between;gap:8px;}
#q-sub{font-size:12px;font-weight:800;color:#8A7A6A;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
#q-prog{font-size:12px;font-weight:900;color:var(--acc2);flex:none;}

/* ============ そうさ ボタン ============ */
#playbar{position:fixed;left:50%;transform:translateX(-50%);z-index:38;
  bottom:calc(max(12px,var(--sab,0px)) + 6px);display:none;gap:10px;}
#playbar.on{display:flex;}
.pbtn{border:none;border-radius:18px;padding:11px 20px;font-family:inherit;
  font-size:15px;font-weight:900;color:#FFFCF6;cursor:pointer;
  box-shadow:0 4px 0 rgba(0,0,0,.16),0 8px 18px rgba(50,30,10,.2);}
.pbtn:active{transform:translateY(2px);box-shadow:0 2px 0 rgba(0,0,0,.16);}
.pbtn.a{background:linear-gradient(180deg,var(--btn1),var(--btn2));}
.pbtn.b{background:linear-gradient(180deg,#9BA8C4,#7A88A8);}

/* ============ おおきな せいかい えんしゅつ ============ */
#big-wrap{position:fixed;inset:0;z-index:70;display:none;align-items:center;justify-content:center;
  flex-direction:column;gap:10px;pointer-events:none;}
#big-wrap.on{display:flex;animation:bigin .45s cubic-bezier(.2,1.3,.4,1);}
@keyframes bigin{0%{opacity:0;transform:scale(.5)}100%{opacity:1;transform:scale(1)}}
#big-icon{width:190px;height:190px;filter:drop-shadow(0 10px 26px rgba(40,25,10,.35));}
#big-text{font-family:'DotGothic16',sans-serif;font-size:38px;color:#FFFCF6;
  text-shadow:0 0 18px rgba(255,210,130,.95),0 4px 0 rgba(150,80,30,.6);}
#big-sub{font-size:17px;font-weight:900;color:#FFFCF6;text-shadow:0 2px 8px rgba(60,30,0,.6);letter-spacing:.06em;}

/* ============ オーバーレイ がめん ============ */
.sc{position:fixed;inset:0;z-index:60;display:none;flex-direction:column;
  padding:max(14px,var(--sat,0px)) max(12px,var(--sar,0px)) max(14px,var(--sab,0px)) max(12px,var(--sal,0px));
  overflow-y:auto;-webkit-overflow-scrolling:touch;}
.sc.on{display:flex;}
.sc-in{width:100%;max-width:520px;margin:auto;}
.ttl{font-family:'DotGothic16',sans-serif;font-size:clamp(28px,8.5vw,42px);line-height:1.22;
  text-align:center;color:#FFFCF6;margin-bottom:6px;
  text-shadow:0 0 18px var(--glowc,rgba(255,210,130,.9)),0 4px 0 rgba(120,70,30,.6),0 9px 20px rgba(60,35,0,.35);}
.sub{text-align:center;font-size:13.5px;font-weight:800;color:#FFFCF6;
  text-shadow:0 2px 7px rgba(50,30,10,.6);margin-bottom:16px;line-height:1.6;}
.card{background:var(--panel);border-radius:24px;padding:16px 14px;
  box-shadow:0 10px 30px rgba(70,45,20,.26);}
.btn{display:block;width:100%;border:none;border-radius:20px;padding:14px;font-family:inherit;
  font-size:18px;font-weight:900;color:#FFFCF6;cursor:pointer;margin-top:10px;
  background:linear-gradient(180deg,var(--btn1),var(--btn2));
  box-shadow:0 5px 0 rgba(0,0,0,.16),0 10px 22px rgba(50,30,10,.22);}
.btn:active{transform:translateY(2px);box-shadow:0 3px 0 rgba(0,0,0,.16);}
.btn.g{background:linear-gradient(180deg,#9BA8C4,#7A88A8);font-size:16px;padding:12px;}
.btn.p{background:linear-gradient(180deg,#8FD07A,#5FA84E);}

/* ---- あいぼう ---- */
#partner-list{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;}
.pcard{min-width:0;}
.pcard{background:#FFFCF6;border:3px solid #E6DAC6;border-radius:18px;padding:8px 4px 7px;
  cursor:pointer;font-family:inherit;display:flex;flex-direction:column;align-items:center;gap:3px;
  transition:transform .14s ease,border-color .14s ease;}
.pcard.sel{border-color:var(--acc);background:#FFF6E4;transform:translateY(-3px);
  box-shadow:0 6px 0 rgba(0,0,0,.08);}
.pface{display:block;max-width:100%;height:auto;}
.pname{font-size:11px;font-weight:900;color:var(--ink);line-height:1.2;text-align:center;}

/* ---- モード ---- */
#mode-list{display:flex;flex-direction:column;gap:11px;}
.mcard{border:none;border-radius:22px;padding:14px 16px;cursor:pointer;font-family:inherit;
  display:flex;align-items:center;gap:14px;color:#FFFCF6;text-align:left;
  box-shadow:0 6px 0 rgba(0,0,0,.14),0 10px 24px rgba(40,25,10,.2);}
.mcard:active{transform:translateY(2px);box-shadow:0 4px 0 rgba(0,0,0,.14);}
.mbig{font-family:'DotGothic16',sans-serif;font-size:34px;line-height:1;flex:none;
  text-shadow:0 3px 0 rgba(0,0,0,.18);min-width:64px;text-align:center;}
.mname{font-size:19px;font-weight:900;flex:1;text-shadow:0 2px 4px rgba(0,0,0,.2);}
.mstar{font-size:13px;font-weight:900;flex:none;opacity:.92;}

/* ---- ステージ ---- */
#stage-list{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px;}
.scard{min-width:0;}
.scard{background:#FFFCF6;border:3px solid #E6DAC6;border-radius:18px;padding:9px 7px;
  cursor:pointer;font-family:inherit;display:flex;flex-direction:column;align-items:center;gap:3px;
  position:relative;}
.scard:active{transform:translateY(2px);}
.scard.lock{background:#EFE9DE;border-color:#DDD2C0;opacity:.75;cursor:default;}
.sno{position:absolute;top:5px;left:8px;font-family:'DotGothic16',sans-serif;
  font-size:15px;color:var(--acc2);}
.sicon{display:block;max-width:100%;height:auto;}
.sname{font-size:12.5px;font-weight:900;text-align:center;line-height:1.25;color:var(--ink);}
.sstar{font-size:13px;color:var(--acc);letter-spacing:1px;}

/* ---- リザルト ---- */
#res-stars{display:flex;justify-content:center;gap:10px;margin:6px 0 12px;}
.rstar{width:52px;height:52px;font-size:40px;line-height:52px;text-align:center;
  color:#D8CDBA;transform:scale(.6);transition:transform .35s cubic-bezier(.2,1.5,.4,1),color .3s;}
.rstar.on{color:var(--acc);transform:scale(1);text-shadow:0 0 16px rgba(245,169,63,.85);}
#res-allclear{display:none;text-align:center;font-size:14px;font-weight:900;
  color:var(--acc2);margin-top:10px;line-height:1.6;}

/* ---- ずかん ---- */
.dexh{font-size:15px;font-weight:900;color:var(--ink);margin:12px 0 7px;
  padding-left:9px;border-left:5px solid var(--acc);}
.dexgrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:7px;}
.dexc{min-width:0;}
.dexc{background:#FFFCF6;border:2.5px solid #E6DAC6;border-radius:14px;padding:6px 3px 5px;
  cursor:pointer;font-family:inherit;display:flex;flex-direction:column;align-items:center;gap:2px;}
.dexc.no{background:#EFE9DE;border-color:#DDD2C0;cursor:default;}
.dexc canvas{display:block;max-width:100%;height:auto;}
.dexlb{font-size:10.5px;font-weight:900;color:var(--ink);line-height:1.2;text-align:center;
  word-break:break-all;}
.dexc.no .dexlb{color:#A99B88;}
#dex-count{text-align:center;font-size:14px;font-weight:900;color:var(--acc2);margin-bottom:4px;}

@media (max-height:620px){
  .slot{width:34px;height:39px;font-size:22px;}
  .slot.sm{width:27px;height:32px;font-size:17px;}
  #qpanel{padding:8px 10px 10px;}
}

/* ============ よこむき (スマホ) コンパクト ============ */
@media (orientation:landscape) and (max-height:520px){
  #hud{padding-top:max(4px,var(--sat,0px));}
  .hbtn{padding:4px 9px;font-size:12px;border-radius:11px;}
  .hround{width:27px;height:27px;font-size:13px;}
  #hud-stage{font-size:11.5px;}
  #qpanel{top:calc(max(4px,var(--sat,0px)) + 34px);width:min(96vw,600px);
    padding:6px 10px 7px;border-radius:16px;}
  .qrow{gap:9px;}
  #q-slots.compact .slot{width:30px;height:34px;font-size:20px;border-radius:8px;border-width:2px;}
  #q-slots.compact .slot.sm{width:25px;height:29px;font-size:16px;border-radius:7px;}
  .qmeta{margin-top:1px;}
  #q-sub,#q-prog{font-size:11px;}
  #playbar{bottom:calc(max(6px,var(--sab,0px)) + 2px);gap:8px;}
  .pbtn{padding:7px 15px;font-size:13px;border-radius:14px;}
  #big-icon{width:120px !important;height:120px !important;}
  #big-text{font-size:28px;}
  #big-sub{font-size:14px;}
  .ttl{font-size:clamp(22px,5.5vh,32px);}
  .sub{font-size:12px;margin-bottom:10px;}
  .btn{padding:10px;font-size:16px;border-radius:16px;margin-top:8px;}
}

/* ヒントで うすく もじを だす */
.slot.ghost{color:rgba(74,59,50,.32);border-color:var(--acc2);border-style:solid;
  background:#FFF9EE;animation:gh 1.1s ease-in-out infinite;}
@keyframes gh{0%,100%{opacity:.75}50%{opacity:1}}
#q-icon{cursor:pointer;}

/* 空のオーバーレイが 3Dキャンバスの タップを うばわないように */
.sc:empty{display:none !important;pointer-events:none;}

/* ============ リッチ タイトル ============ */
#sc-title .sc-in{position:relative;}
.logo{font-family:'DotGothic16',sans-serif;text-align:center;line-height:1.02;margin:0 0 4px;}
.logo .ch{display:inline-block;font-size:clamp(38px,12.5vw,64px);color:#FFFCF6;
  text-shadow:
    3px 0 0 var(--logoInk),-3px 0 0 var(--logoInk),0 3px 0 var(--logoInk),0 -3px 0 var(--logoInk),
    2px 2px 0 var(--logoInk),-2px 2px 0 var(--logoInk),2px -2px 0 var(--logoInk),-2px -2px 0 var(--logoInk),
    0 7px 0 var(--logoShade), 0 0 26px var(--logoGlow), 0 14px 26px rgba(30,20,0,.35);
  animation:logoIn .55s cubic-bezier(.2,1.6,.4,1) backwards, logoFloat 3.2s ease-in-out infinite;
  animation-delay:calc(var(--i) * .07s), calc(var(--i) * .12s);}
.logo .br{display:block;height:0;}
@keyframes logoIn{0%{opacity:0;transform:translateY(-38px) scale(.5) rotate(-12deg)}100%{opacity:1;transform:none}}
@keyframes logoFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
.tagwrap{text-align:center;}
.tagline{display:inline-block;font-size:13px;font-weight:900;color:#FFFCF6;
  background:rgba(60,45,30,.34);border:1.5px solid rgba(255,255,255,.4);
  border-radius:999px;padding:6px 16px;line-height:1.5;margin:8px auto 4px;
  text-shadow:0 2px 6px rgba(40,25,10,.5);}
.sparks{position:absolute;inset:-18px 0 auto;height:210px;pointer-events:none;overflow:hidden;}
.sparks i{position:absolute;font-style:normal;font-size:15px;color:#FFFCF6;opacity:0;
  text-shadow:0 0 10px var(--logoGlow);animation:tw 2.6s ease-in-out infinite;}
@keyframes tw{0%,100%{opacity:0;transform:scale(.4) rotate(0)}45%{opacity:1;transform:scale(1.15) rotate(22deg)}}
.btn.big{font-size:22px;padding:18px;border-radius:24px;position:relative;overflow:hidden;
  animation:bp 2.1s ease-in-out infinite;}
@keyframes bp{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
.btn.big::after{content:'';position:absolute;top:0;left:-60%;width:45%;height:100%;
  background:linear-gradient(100deg,transparent,rgba(255,255,255,.55),transparent);
  animation:shine 3.4s ease-in-out infinite;}
@keyframes shine{0%{left:-60%}55%{left:120%}100%{left:120%}}
.btn.big:active{animation:none;transform:translateY(2px);}
.badgewrap{text-align:center;margin-top:10px;}
.starbadge{display:inline-flex;align-items:center;gap:6px;background:rgba(255,252,246,.92);
  border-radius:999px;padding:5px 14px;font-size:13px;font-weight:900;color:var(--ink);
  box-shadow:0 4px 12px rgba(40,30,10,.22);}
.starbadge b{color:var(--acc);font-size:15px;}
/* タイトルの ぶんは 下よりに置いて 3Dの もじを 見せる */
#sc-title .sc-in{margin-top:auto;margin-bottom:8vh;}
</style>
<style>
:root{
  --bg0:#BFE8F5;
  --acc:#5FA84E;
  --acc2:#E8873F;
  --btn1:#7FC96A;
  --btn2:#4F9A44;
  --glowc:rgba(200,255,180,.9);
  --slot:#F0F8E4;
  --slotb:#BFD9A8;
  --logoInk:#2F6B32;
  --logoShade:#1F4A24;
  --logoGlow:rgba(180,255,160,.9);
}
</style>
</head>
<body>
<canvas id="cv"></canvas>

<div id="loading" class="on"><div class="spin"></div><p>もりを じゅんびちゅう…</p></div>
<div id="fallback"><p>このブラウザでは 3Dが つかえません。<br>べつの ブラウザで ためしてね。</p></div>

<!-- ===== HUD ===== -->
<div id="hud">
  <div class="hud-row">
    <div class="hud-l">
      <button class="hbtn" id="btn-hud-back">◀ もどる</button>
      <span id="hud-stage"></span>
    </div>
    <div class="hud-r">
      <button class="hround" id="bgm-btn">🔊</button>
      <button class="hround" id="btn-hud-home" aria-label="もどる">←</button>
    </div>
  </div>
</div>

<!-- ===== しつもん ===== -->
<div id="qpanel">
  <div class="qrow">
    <canvas id="q-icon"></canvas>
    <div class="qright">
      <div id="q-slots"></div>
      <div class="qmeta"><span id="q-sub"></span><span id="q-prog"></span></div>
    </div>
  </div>
</div>

<div id="playbar">
  <button class="pbtn a" id="btn-say">🔈 もういちど</button>
  <button class="pbtn b" id="btn-hint">💡 ヒント</button>
</div>

<div id="big-wrap">
  <canvas id="big-icon"></canvas>
  <div id="big-text"></div>
  <div id="big-sub"></div>
</div>

<!-- ===== タイトル ===== -->
<section class="sc" id="sc-title"><div class="sc-in">
  <div class="sparks" id="sparks"></div>
  <h1 class="logo" id="logo" data-text="もじのもり">もじのもり</h1>
  <div class="tagwrap"><span class="tagline">ひらがな・カタカナ・ABC<br>3Dの もりで もじを あつめよう！</span></div>
  <button class="btn big" id="btn-start">▶ ぼうけんに でる</button>
  <button class="btn g" id="btn-dex-title">📖 ことば ずかん</button>
  <div class="badgewrap" id="badge-wrap" style="display:none"><span class="starbadge" id="star-badge"></span></div>
</div></section>

<!-- ===== あいぼう ===== -->
<section class="sc" id="sc-partner"><div class="sc-in">
  <h1 class="ttl">あいぼう</h1>
  <p class="sub">いっしょに ぼうけんする なかまを えらんでね</p>
  <div class="card"><div id="partner-list"></div></div>
  <button class="btn" id="btn-partner-ok">きめた！</button>
  <button class="btn g" id="btn-partner-back">◀ もどる</button>
</div></section>

<!-- ===== モード ===== -->
<section class="sc" id="sc-mode"><div class="sc-in">
  <h1 class="ttl">なにで あそぶ？</h1>
  <p class="sub">すきな もじを えらんでね</p>
  <div id="mode-list"></div>
  <button class="btn g" id="btn-mode-back">◀ もどる</button>
</div></section>

<!-- ===== ステージ ===== -->
<section class="sc" id="sc-stage"><div class="sc-in">
  <h1 class="ttl" id="stage-title"></h1>
  <p class="sub">どこから あそぶ？</p>
  <div class="card"><div id="stage-list"></div></div>
  <button class="btn g" id="btn-stage-back">◀ もどる</button>
</div></section>

<!-- ===== プレイ中は 3Dキャンバスのみ (オーバーレイを置かない) ===== -->

<!-- ===== リザルト ===== -->
<section class="sc" id="sc-result"><div class="sc-in">
  <h1 class="ttl" id="res-title"></h1>
  <p class="sub" id="res-sub"></p>
  <div class="card">
    <div id="res-stars">
      <div class="rstar" id="res-star1">★</div>
      <div class="rstar" id="res-star2">★</div>
      <div class="rstar" id="res-star3">★</div>
    </div>

 * すべて 100x100 の座標系で中央に描く。draw(g) を呼ぶ前に scale 済みであること。

(function (global) {
  'use strict';

  var INK = '#4A3B32';

  function E(g, x, y, rx, ry, rot) {
    g.beginPath();
    if (g.ellipse) g.ellipse(x, y, rx, ry, rot || 0, 0, Math.PI * 2);

  }
  function RR(g, x, y, w, h, r) {
    var m = Math.min(w, h) / 2; if (r > m) r = m;
    g.beginPath();
    g.moveTo(x + r, y);
    g.lineTo(x + w - r, y); g.quadraticCurveTo(x + w, y, x + w, y + r);
    g.lineTo(x + w, y + h - r); g.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
    g.lineTo(x + r, y + h); g.quadraticCurveTo(x, y + h, x, y + h - r);

    var eg = new T.SphereGeometry(0.15, 12, 10);
    var e1 = new T.Mesh(eg, dark); e1.position.set(-0.32, 0.12, 0.82); head.add(e1);
    var e2 = new T.Mesh(eg, dark); e2.position.set(0.32, 0.12, 0.82); head.add(e2);
    var sg = new T.SphereGeometry(0.055, 8, 6);
    var wm = new T.MeshBasicMaterial({ color: 0xFFFFFF });
    var s1 = new T.Mesh(sg, wm); s1.position.set(-0.28, 0.18, 0.94); head.add(s1);
    var s2 = new T.Mesh(sg, wm); s2.position.set(0.36, 0.18, 0.94); head.add(s2);
    /* はな */
    var nz = new T.Mesh(new T.SphereGeometry(0.11, 10, 8), dark);
    nz.position.set(0, -0.12, 1.06); nz.scale.set(1.3, 0.9, 0.9); head.add(nz);

    /* みみ */
    var ear = spec.ear;
    if (ear === 'round') {
      var er = new T.SphereGeometry(0.36, 14, 12);
      var r1 = new T.Mesh(er, body); r1.position.set(-0.72, 0.68, -0.05); r1.scale.z = 0.6; head.add(r1);
      var r2 = new T.Mesh(er, body); r2.position.set(0.72, 0.68, -0.05); r2.scale.z = 0.6; head.add(r2);
    } else if (ear === 'pointy') {
      var pg = new T.ConeGeometry(0.3, 0.75, 8);
      var p1 = new T.Mesh(pg, body); p1.position.set(-0.52, 1.0, 0); p1.rotation.z = 0.28; head.add(p1);
      var p2 = new T.Mesh(pg, body); p2.position.set(0.52, 1.0, 0); p2.rotation.z = -0.28; head.add(p2);
    } else if (ear === 'long') {
      var lg = new T.CylinderGeometry(0.13, 0.2, 1.35, 9);
      var l1 = new T.Mesh(lg, body); l1.position.set(-0.36, 1.34, -0.05); l1.rotation.z = 0.2; head.add(l1);
      var l2 = new T.Mesh(lg, body); l2.position.set(0.36, 1.34, -0.05); l2.rotation.z = -0.2; head.add(l2);
    } else if (ear === 'antenna') {
      var ag = new T.CylinderGeometry(0.055, 0.055, 0.8, 6);
      var a1 = new T.Mesh(ag, dark); a1.position.set(0, 1.28, 0); head.add(a1);
      var ab = new T.Mesh(new T.SphereGeometry(0.2, 12, 10), acc);
      ab.position.set(0, 1.72, 0); head.add(ab);
      G.userData.blink = ab;
    }

    /* アクセサリ */
    if (spec.accType === 'crown') {
      var cr = new T.Mesh(new T.CylinderGeometry(0.55, 0.62, 0.3, 10), acc);
      cr.position.set(0, 1.02, 0); head.add(cr);
    } else if (spec.accType === 'star') {
      var st = new T.Mesh(new T.OctahedronGeometry(0.3, 0), acc);
      st.position.set(0.62, 1.1, 0); head.add(st);
      G.userData.spin = st;
    } else if (spec.accType === 'scarf') {
      var sc = new T.Mesh(new T.TorusGeometry(0.62, 0.16, 8, 18), acc);
      sc.position.set(0, 1.55, 0); sc.rotation.x = Math.PI / 2; G.add(sc);
    }

    /* て */
    var hg = new T.SphereGeometry(0.28, 12, 10);
    var h1 = new T.Mesh(hg, body); h1.position.set(-1.02, 0.95, 0.2); G.add(h1);
    var h2 = new T.Mesh(hg, body); h2.position.set(1.02, 0.95, 0.2); G.add(h2);
    G.userData.hands = [h1, h2];
    G.userData.head = head;
    return G;
  }

  /* ================= クリスタル ================= */
  var GEO = null;
  function geos() {
    if (GEO) return GEO;
    var T = global.THREE;
    GEO = {
      shell: new T.SphereGeometry(1.12, 22, 18),
      plate: new T.PlaneGeometry(1.62, 1.62)
    };
    return GEO;
  }
  function makeCrystal(ch, idx) {
    var T = global.THREE;
    var G = new T.Group();

    /* うしろの ひかり */
    var glow = new T.Sprite(new T.SpriteMaterial({
      map: glowTexture(), color: TH.glow || 0xFFE9A8, transparent: true,
      opacity: 0.22, blending: T.AdditiveBlending, depthWrite: false
    }));
    glow.scale.setScalar(2.7); glow.position.z = -1.25;
    glow.renderOrder = 0;
    G.add(glow);

    /* ガラスの から */
    var shell = new T.Mesh(geos().shell,
      new T.MeshPhongMaterial({
        color: TH.shell || 0x9BE0F0, transparent: true, opacity: 0.26,
        shininess: 100, specular: 0xFFFFFF, side: T.DoubleSide,
        depthWrite: false                    /* ← 中の もじを かくさない */
      }));
    shell.renderOrder = 1;
    G.add(shell);

    /* もじの ばん */
    var plate = new T.Mesh(geos().plate,
      new T.MeshBasicMaterial({
        map: charTexture(ch, TH.plateA || '#7FC7E8', TH.plateB || '#5FA8E8'),
        transparent: false, alphaTest: 0.5,  /* 不透明パス = かくれない */
        side: T.DoubleSide, depthWrite: true
      }));
    plate.renderOrder = 2;
    plate.position.z = 1.18;
    G.add(plate);

    G.userData = {
      ch: ch, shell: shell, plate: plate, glow: glow,
      ph: rnd(0, 6.3), taken: false, hint: 0, idx: idx,
      base: new T.Vector3(), pop: 0
    };
    return G;
  }

  var layoutExtent = { x: 8, y: 6 };
  function colsFor(n) {
    /* たてがめんは 3れつ / よこがめんは ひろく つかう */
    var portrait = global.innerHeight > global.innerWidth;
    if (portrait) return n <= 3 ? n : 3;
    return n <= 4 ? n : (n <= 10 ? 4 : 5);
  }
  function layoutCrystals(n) {
    /* 前方の たまご型クラスタに はいち */
    var out = [];
    var cols = colsFor(n);
    var rows = Math.ceil(n / cols);
    var gx = 3.15, gy = 2.85;
    for (var i = 0; i < n; i++) {
      var r = Math.floor(i / cols), c = i % cols;
      var inRow = Math.min(cols, n - r * cols);
      var x = (c - (inRow - 1) / 2) * gx;
      var y = ((rows - 1) / 2 - r) * gy;
      var z = -Math.abs(x) * 0.28 - Math.abs(y) * 0.12;
      out.push(new global.THREE.Vector3(x, y + 0.4, z));
    }
    var mx = 0, my = 0;
    for (var k = 0; k < out.length; k++) {
      mx = Math.max(mx, Math.abs(out[k].x));
      my = Math.max(my, Math.abs(out[k].y - 0.4));
    }
    layoutExtent.x = mx * 2 + 2.5;
    layoutExtent.y = my * 2 + 2.5;
    return out;
  }

  /* ================= パーティクル ================= */
  var particles = [];
  function burst(pos, color, n) {
    var T = global.THREE;
    n = n || 18;
    for (var i = 0; i < n; i++) {
      var sp = new T.Sprite(new T.SpriteMaterial({
        map: glowTexture(), color: color, transparent: true,
        opacity: 1, blending: T.AdditiveBlending, depthWrite: false
      }));
      sp.position.copy(pos);
      sp.scale.setScalar(rnd(0.3, 0.85));
      fxGroup.add(sp);
      particles.push({
        o: sp, life: 1,
        v: new T.Vector3(rnd(-1, 1), rnd(-0.4, 1.5), rnd(-0.6, 0.9)).multiplyScalar(rnd(2.5, 6))
      });
    }
  }
  function updateParticles(dt) {
    for (var i = particles.length - 1; i >= 0; i--) {
      var p = particles[i];
      p.life -= dt * 1.35;
      if (p.life <= 0) { fxGroup.remove(p.o); p.o.material.dispose(); particles.splice(i, 1); continue; }
      p.o.position.addScaledVector(p.v, dt);
      p.v.y -= dt * 4.5;
      p.o.material.opacity = clamp(p.life, 0, 1);
      p.o.scale.setScalar(clamp(p.life, 0, 1) * 0.9 + 0.15);
    }
  }

  /* ================= 3D しょきか ================= */
  function init3D(canvas) {
    var T = global.THREE;
    renderer = new T.WebGLRenderer({ canvas: canvas, antialias: true, alpha: false });
    renderer.setPixelRatio(Math.min(global.devicePixelRatio || 1, 2));
    renderer.setSize(global.innerWidth, global.innerHeight, false);

    scene = new T.Scene();
    camera = new T.PerspectiveCamera(52, global.innerWidth / global.innerHeight, 0.1, 200);
    camera.position.set(0, 1.2, 11.5);
    camera.lookAt(0, 0.6, 0);
    clock = new T.Clock();

    worldGroup = new T.Group(); scene.add(worldGroup);
    crystalGroup = new T.Group(); scene.add(crystalGroup);
    fxGroup = new T.Group(); scene.add(fxGroup);
    partnerGroup = new T.Group(); scene.add(partnerGroup);

    /* ライト */
    scene.add(new T.HemisphereLight(TH.hemiSky || 0xDFF3FF, TH.hemiGround || 0x6A8A5A, 0.95));
    var dir = new T.DirectionalLight(0xFFFFFF, 0.75);
    dir.position.set(6, 12, 8); scene.add(dir);
    var rim = new T.DirectionalLight(TH.rim || 0xFFD9A8, 0.4);
    rim.position.set(-8, 4, -6); scene.add(rim);

    if (CFG.world === 'space') buildSpace(); else buildForest();

    raycaster = new T.Raycaster();
    pointer = new T.Vector2();
    ready3D = true;
    onResize();
  }

  function onResize() {
    if (!ready3D) return;
    var w = global.innerWidth, h = global.innerHeight;
    renderer.setPixelRatio(Math.min(global.devicePixelRatio || 1, 2));
    renderer.setSize(w, h, false);
    camera.aspect = w / h;
    /* たてながでも クリスタルが おさまるように */
    camera.fov = h > w ? 62 : 50;
    camera.updateProjectionMatrix();
    relayoutCrystals();
    fitCrystals();
    if (ST.word) renderQuestion();
  }

  /* がめんの むきが かわったら ならびなおす */
  function relayoutCrystals() {
    if (!crystals.length) return;
    var pos = layoutCrystals(crystals.length);
    for (var i = 0; i < crystals.length; i++) {
      crystals[i].userData.base.copy(pos[i]);
    }
  }

  /* 画面の あいている ぶぶんに ぴったり おさめる */
  var LOOK_Y = 0.5;      /* camera.lookAt の たかさ */
  var CAM_SWAY = 0.3;    /* カメラの ゆれ ぶんの よゆう */
  function fitCrystals() {
    if (!crystalGroup || !camera) return;
    var w = global.innerWidth, h = global.innerHeight;
    var dist = camera.position.z;                  /* クリスタルは z≒0 */
    var halfH = Math.tan(camera.fov * Math.PI / 360) * dist;
    var halfW = halfH * camera.aspect;
    var portrait = h > w;
    var compact = !portrait && h < 520;
    var topPx = portrait ? 200 : (compact ? 118 : 152);  /* しつもんパネルの したはし */
    var botPx = portrait ? 104 : (compact ? 60 : 96);    /* そうさボタンの うえはし */
    var availPx = Math.max(h * 0.3, h - topPx - botPx);

    /* px → ワールド単位 */
    var perPx = halfH / (h / 2);
    var availY = availPx * perPx - CAM_SWAY * 2;
    var availX = halfW * 2 * 0.94 - CAM_SWAY * 2;

    var s = Math.min(availX / layoutExtent.x, availY / layoutExtent.y, 1.15);
    s = clamp(s, 0.3, 1.15);
    crystalGroup.scale.setScalar(s);

    /* あいた りょういきの まんなかへ */
    var targetPx = topPx + availPx / 2;
    var targetY = LOOK_Y + (h / 2 - targetPx) * perPx;
    crystalGroup.position.y = targetY - 0.4 * s;
  }

  /* ================= チューニングち(じっき テストで ちょうせいする かのうせいが たかい あたい) ================= */
  var TUNE = {
    HINT_IDLE_SEC: 12,      /* このびょう ほうちしたら ヒントを だす */
    HINT_MISS_COUNT: 2,     /* このかいすう まちがえたら ヒントを だす */
    STAR_STAGGER_MS: 300,   /* クリア演出: ほしが 1つずつ つく かんかく */
    WORD_ADVANCE_MS: 1900   /* ことば かんせい えんしゅつから つぎの もんだいへ すすむまでの じかん */
  };

  /* ================= ゲーム じょうたい ================= */
  var ST = {
    mode: null,        /* modeキー */
    stage: 0,          /* 0-index */
    wordIdx: 0,
    word: null,        /* {icon, text, read, lang} */
    letters: [],       /* もじ配列 */
    filled: 0,
    misses: 0,
    stageMiss: 0,
    hintTimer: 0,
    locked: false,
    partner: null
  };

  function modeDef(key) {
    for (var i = 0; i < CFG.modes.length; i++) if (CFG.modes[i].key === key) return CFG.modes[i];
    return CFG.modes[0];
  }
  function stageKey(mode, st) { return mode + ':' + st; }
  function starOf(mode, st) { return SV.stars[stageKey(mode, st)] || 0; }
  function unlockedUpto(mode) {
    var md = modeDef(mode), n = md.stages.length, i;
    for (i = 0; i < n; i++) if (!starOf(mode, i)) return i;
    return n - 1;
  }
  function totalStars(mode) {
    var md = modeDef(mode), s = 0;
    for (var i = 0; i < md.stages.length; i++) s += starOf(mode, i);
    return s;
  }

  /* ================= もんだい じゅんび ================= */
  function splitWord(txt) { return txt.split(''); }

  function distractors(md, need, count) {
    var pool = [], i;
    for (i = 0; i < md.pool.length; i++) {
      if (need.indexOf(md.pool[i]) < 0) pool.push(md.pool[i]);
    }
    pool = shuffle(pool);
    var out = [];
    for (i = 0; i < count && i < pool.length; i++) out.push(pool[i]);
    return out;
  }

  function setupWord() {
    var md = modeDef(ST.mode);
    var st = md.stages[ST.stage];
    ST.word = st.words[ST.wordIdx];
    ST.letters = splitWord(ST.word.text);
    ST.filled = 0;
    ST.misses = 0;
    ST.hintTimer = 0;
    ST.locked = false;

    /* クリスタルの もじを つくる */
    var need = ST.letters.slice();
    var extra = clamp(2 + Math.floor(ST.stage / 2), 2, 5);
    var total = clamp(need.length + extra, need.length + 2, 10);
    var uniq = [];
    for (var u = 0; u < need.length; u++) if (uniq.indexOf(need[u]) < 0) uniq.push(need[u]);
    var chars = need.concat(distractors(md, uniq, total - need.length));
    chars = shuffle(chars);

    /* クリスタル せいせい */
    clearCrystals();
    var pos = layoutCrystals(chars.length);
    for (var i = 0; i < chars.length; i++) {
      var c = makeCrystal(chars[i], i);
      c.position.copy(pos[i]);
      c.userData.base.copy(pos[i]);
      c.scale.setScalar(0.01);
      c.userData.pop = -i * 0.045;
      crystalGroup.add(c);
      crystals.push(c);
    }
    fitCrystals();
    renderQuestion();
    speakWord(false);
  }

  function clearCrystals() {
    for (var i = 0; i < crystals.length; i++) {
      var c = crystals[i];
      c.userData.plate.material.dispose();
      c.userData.shell.material.dispose();
      c.userData.glow.material.dispose();
      crystalGroup.remove(c);
    }
    crystals = [];
  }

  function speakWord(force) {
    var md = modeDef(ST.mode);
    if (!ST.word) return;
    Voice.speak(ST.word.read || ST.word.text, md.lang, md.rate || 0.8);
  }

  /* ================= もんだい ひょうじ (DOM) ================= */
  function isCompact() {
    return global.innerWidth > global.innerHeight && global.innerHeight < 520;
  }
  function drawIconInto(cvId, iconName, size) {
    var cv = $(cvId); if (!cv) return;
    var dpr = Math.min(global.devicePixelRatio || 1, 2);
    cv.width = size * dpr; cv.height = size * dpr;
    cv.style.width = size + 'px'; cv.style.height = size + 'px';
    var g = cv.getContext('2d');
    g.setTransform(dpr, 0, 0, dpr, 0, 0);
    g.clearRect(0, 0, size, size);
    if (global.MojiIcons) global.MojiIcons.draw(g, iconName, size, 0.05);
  }

  function renderQuestion() {
    var md = modeDef(ST.mode);
    var compact = isCompact();
    drawIconInto('q-icon', ST.word.icon, compact ? 54 : 96);
    var slots = $('q-slots');
    if (!slots) return;
    slots.innerHTML = '';
    slots.className = compact ? 'compact' : '';
    hintShown = false;
    var long = ST.letters.length >= 6;
    for (var i = 0; i < ST.letters.length; i++) {
      var d = document.createElement('div');
      d.className = 'slot' + (long ? ' sm' : '') + (i < ST.filled ? ' fill' : '');
      if (i === ST.filled) d.className += ' next';
      d.textContent = i < ST.filled ? ST.letters[i] : '';
      slots.appendChild(d);
    }
    var sub = $('q-sub');
    if (sub) sub.textContent = md.subLabel ? (ST.word.sub || '') : '';
    var pg = $('q-prog');
    if (pg) pg.textContent = (ST.wordIdx + 1) + ' / ' + md.stages[ST.stage].words.length;
  }

  /* ================= タップ ================= */
  function pointerFromEvent(ev) {
    var t = (ev.changedTouches && ev.changedTouches[0]) || ev;
    pointer.x = (t.clientX / global.innerWidth) * 2 - 1;
    pointer.y = -(t.clientY / global.innerHeight) * 2 + 1;
  }

  function onTap(ev) {
    MQ.unlockAudio();
    if (!ready3D) return;
    if (current === 'title') { titleTap(ev); return; }
    if (!running || ST.locked) return;
    pointerFromEvent(ev);
    raycaster.setFromCamera(pointer, camera);
    var hits = raycaster.intersectObjects(crystalGroup.children, true);
    if (!hits.length) return;
    var g = hits[0].object;
    while (g && !g.userData.ch) g = g.parent;
    if (!g || g.userData.taken) return;
    tapCrystal(g);
  }

  /* タイトルの クリスタルは タップで キラキラ */
  function titleTap(ev){
    pointerFromEvent(ev);
    raycaster.setFromCamera(pointer, camera);
    var hits = raycaster.intersectObjects(crystalGroup.children, true);
    if (!hits.length) return;
    var g = hits[0].object;
    while (g && !g.userData.ch) g = g.parent;
    if (!g) return;
    SFX.pick();
    burst(g.getWorldPosition(new global.THREE.Vector3()), TH.sparkOk || 0xFFE9A8, 10);
    cheer(0.8);
  }

  function tapCrystal(c) {
    var want = ST.letters[ST.filled];
    if (c.userData.ch === want) {
      c.userData.taken = true;
      ST.filled++;
      ST.hintTimer = 0;
      hintShown = false;
      SFX.pick();
      burst(c.getWorldPosition(new global.THREE.Vector3()), TH.sparkOk || 0xFFE9A8, 12);
      cheer(0.5);
      renderQuestion();
      if (ST.filled >= ST.letters.length) completeWord();
    } else {
      ST.misses++;
      ST.stageMiss++;
      SFX.wrong();
      c.userData.shake = 0.5;
      flashSlot();
      if (ST.misses >= TUNE.HINT_MISS_COUNT) { ST.hintTimer = 99; showHintSlot(); }
    }
  }

  var hintShown = false;
  function showHintSlot() {
    if (hintShown) return;
    hintShown = true;
    var slots = $('q-slots');
    if (!slots) return;
    var n = slots.children[ST.filled];
    if (!n || n.classList.contains('fill')) return;
    n.textContent = ST.letters[ST.filled];
    n.classList.add('ghost');
  }

  function flashSlot() {
    var slots = $('q-slots');
    if (!slots) return;
    var n = slots.children[ST.filled];
    if (!n) return;
    n.classList.remove('shake');
    void n.offsetWidth;
    n.classList.add('shake');
  }

  function cheer(power) {
    if (!ST.partner) return;
    ST.partner.userData.cheer = power;
  }

  /* ================= せいかい えんしゅつ ================= */
  function completeWord() {
    ST.locked = true;
    SFX.correct();
    cheer(1);
    var T = global.THREE;
    /* ぜんぶの クリスタルから ひかりを */
    for (var i = 0; i < crystals.length; i++) {
      burst(crystals[i].getWorldPosition(new T.Vector3()), TH.sparkOk || 0xFFE9A8, 6);
    }
    /* ずかんに とうろく */
    SV.dex[ST.mode + ':' + ST.word.text] = 1;
    MQ.saveNow();

    /* おおきな え を みせる */
    var big = $('big-wrap');
    if (big) {
      drawIconInto('big-icon', ST.word.icon, 190);
      var bt = $('big-text'); if (bt) bt.textContent = ST.word.text;
      var bs = $('big-sub'); if (bs) bs.textContent = ST.word.sub || '';
      big.classList.remove('on'); void big.offsetWidth; big.classList.add('on');
    }
    var md = modeDef(ST.mode);
    setTimeout(function () { Voice.speak(ST.word.read || ST.word.text, md.lang, 0.75); }, 180);

    setTimeout(function () {
      if (big) big.classList.remove('on');
      ST.wordIdx++;
      if (ST.wordIdx >= md.stages[ST.stage].words.length) stageClear();
      else setupWord();
    }, TUNE.WORD_ADVANCE_MS);
  }

  /* ================= ステージ クリア ================= */
  function stageClear() {
    running = false;
    clearCrystals();
    SFX.clear();
    var stars = ST.stageMiss === 0 ? 3 : (ST.stageMiss <= 3 ? 2 : 1);
    var key = stageKey(ST.mode, ST.stage);
    if ((SV.stars[key] || 0) < stars) SV.stars[key] = stars;
    SV.lastMode = ST.mode;
    MQ.saveNow();

    var md = modeDef(ST.mode);
    var t = $('res-title'); if (t) t.textContent = md.stages[ST.stage].name;
    var sub = $('res-sub');
    if (sub) sub.textContent = ST.stageMiss === 0 ? (CFG.text.perfect || 'ぜんぶ せいかい！') : (CFG.text.good || 'よく できました！');
    for (var i = 1; i <= 3; i++) {
      var el = $('res-star' + i);
      if (!el) continue;
      el.classList.remove('on');
      if (i <= stars) (function (e, n) { setTimeout(function () { e.classList.add('on'); SFX.star(n); }, 260 + n * TUNE.STAR_STAGGER_MS); })(el, i);
    }
    var nx = $('res-next');
    var last = ST.stage >= md.stages.length - 1;
    if (nx) nx.style.display = last ? 'none' : 'block';
    var msg = $('res-allclear');
    if (msg) msg.style.display = last ? 'block' : 'none';
    goScreen('result');
  }

  /* ================= がめん せいぎょ ================= */
  var SCREENS = ['title', 'partner', 'mode', 'stage', 'result', 'dex'];
  var current = 'title';

  function goScreen(name) {
    current = name;
    for (var i = 0; i < SCREENS.length; i++) {
      var el = $('sc-' + SCREENS[i]);
      if (el) el.classList.toggle('on', SCREENS[i] === name);
    }
    var hud = $('hud');
    if (hud) hud.classList.toggle('on', name === 'play');
    var qp = $('qpanel');
    if (qp) qp.classList.toggle('on', name === 'play');
    var pb = $('playbar');
    if (pb) pb.classList.toggle('on', name === 'play');
    if (partnerGroup) partnerGroup.visible = (name === 'play' || name === 'partner' || name === 'result' || name === 'title');
    if (crystalGroup) crystalGroup.visible = (name === 'play' || name === 'title');
    if (name === 'title') { buildLogo(); titleCrystals(); cheer(1); }
    if (name !== 'play') Voice.stop();
  }

  /* ================= あいぼう せんたく ================= */
  function renderPartnerPick() {
    var box = $('partner-list');
    if (!box) return;
    box.innerHTML = '';
    for (var i = 0; i < CFG.partners.length; i++) {
      (function (i) {
        var p = CFG.partners[i];
        var b = document.createElement('button');
        b.className = 'pcard' + (SV.partner === i ? ' sel' : '');
        var cv = document.createElement('canvas');
        cv.className = 'pface';
        b.appendChild(cv);
        var nm = document.createElement('div');
        nm.className = 'pname'; nm.textContent = p.name;
        b.appendChild(nm);
        b.onclick = function () {
          SFX.tap(); MQ.unlockAudio();
          SV.partner = i; MQ.saveNow();
          setPartner(i);
          renderPartnerPick();
        };
        box.appendChild(b);
        drawPartnerFace(cv, p);
      })(i);
    }
  }

  /* あいぼうの かおを 2Dで (カードよう) */
  function drawPartnerFace(cv, p) {
    var size = 78, dpr = Math.min(global.devicePixelRatio || 1, 2);
    cv.width = size * dpr; cv.height = size * dpr;
    cv.style.width = size + 'px'; cv.style.height = size + 'px';
    var g = cv.getContext('2d');
    g.setTransform(dpr, 0, 0, dpr, 0, 0);
    var S = size, cx = S / 2, cy = S * 0.56, r = S * 0.32;
    var body = '#' + ('000000' + p.body.toString(16)).slice(-6);
    var belly = '#' + ('000000' + p.belly.toString(16)).slice(-6);
    var accc = '#' + ('000000' + (p.acc || 0xF5C24E).toString(16)).slice(-6);
    var INK = '#4A3B32';
    g.lineJoin = 'round'; g.lineCap = 'round';
    function fs(col, lw) { g.fillStyle = col; g.fill(); g.strokeStyle = INK; g.lineWidth = lw || 2.6; g.stroke(); }
    /* みみ */
    if (p.ear === 'round') {
      g.beginPath(); g.arc(cx - r * 0.82, cy - r * 0.72, r * 0.4, 0, 6.3); fs(body);
      g.beginPath(); g.arc(cx + r * 0.82, cy - r * 0.72, r * 0.4, 0, 6.3); fs(body);
    } else if (p.ear === 'pointy') {
      g.beginPath(); g.moveTo(cx - r * 0.9, cy - r * 0.3); g.lineTo(cx - r * 0.7, cy - r * 1.5); g.lineTo(cx - r * 0.1, cy - r * 0.75); g.closePath(); fs(body);
      g.beginPath(); g.moveTo(cx + r * 0.9, cy - r * 0.3); g.lineTo(cx + r * 0.7, cy - r * 1.5); g.lineTo(cx + r * 0.1, cy - r * 0.75); g.closePath(); fs(body);
    } else if (p.ear === 'long') {
      g.beginPath(); g.ellipse(cx - r * 0.42, cy - r * 1.24, r * 0.2, r * 0.62, 0.12, 0, 6.3); fs(body);
      g.beginPath(); g.ellipse(cx + r * 0.42, cy - r * 1.24, r * 0.2, r * 0.62, -0.12, 0, 6.3); fs(body);
    } else if (p.ear === 'antenna') {
      g.beginPath(); g.moveTo(cx, cy - r * 0.9); g.lineTo(cx, cy - r * 1.6);
      g.strokeStyle = INK; g.lineWidth = 3; g.stroke();
      g.beginPath(); g.arc(cx, cy - r * 1.78, r * 0.22, 0, 6.3); fs(accc, 2.2);
    }
    /* あたま */
    g.beginPath(); g.arc(cx, cy, r, 0, 6.3); fs(body);
    /* くち もと */
    g.beginPath(); g.ellipse(cx, cy + r * 0.34, r * 0.46, r * 0.34, 0, 0, 6.3); fs(belly, 2.2);
    /* め */
    g.fillStyle = INK;
    g.beginPath(); g.arc(cx - r * 0.36, cy - r * 0.1, r * 0.13, 0, 6.3); g.fill();
    g.beginPath(); g.arc(cx + r * 0.36, cy - r * 0.1, r * 0.13, 0, 6.3); g.fill();
    g.fillStyle = '#fff';
    g.beginPath(); g.arc(cx - r * 0.31, cy - r * 0.16, r * 0.05, 0, 6.3); g.fill();
    g.beginPath(); g.arc(cx + r * 0.41, cy - r * 0.16, r * 0.05, 0, 6.3); g.fill();
    /* はな */
    g.fillStyle = INK;
    g.beginPath(); g.ellipse(cx, cy + r * 0.22, r * 0.1, r * 0.075, 0, 0, 6.3); g.fill();
    /* にっこり */
    g.beginPath(); g.moveTo(cx - r * 0.18, cy + r * 0.4);
    g.quadraticCurveTo(cx, cy + r * 0.58, cx + r * 0.18, cy + r * 0.4);
    g.strokeStyle = INK; g.lineWidth = 2.2; g.stroke();
    /* かんむり */
    if (p.accType === 'crown') {
      g.beginPath();
      g.moveTo(cx - r * 0.5, cy - r * 0.86); g.lineTo(cx - r * 0.38, cy - r * 1.3);
      g.lineTo(cx, cy - r * 0.98); g.lineTo(cx + r * 0.38, cy - r * 1.3);
      g.lineTo(cx + r * 0.5, cy - r * 0.86); g.closePath(); fs(accc, 2.2);
    } else if (p.accType === 'star') {
      var pts = [];
      for (var i = 0; i < 10; i++) {
        var a = -Math.PI / 2 + i * Math.PI / 5, rr = i % 2 ? r * 0.1 : r * 0.26;
        pts.push([cx + r * 0.78 + Math.cos(a) * rr, cy - r * 0.86 + Math.sin(a) * rr]);
      }
      g.beginPath(); g.moveTo(pts[0][0], pts[0][1]);
      for (var k = 1; k < pts.length; k++) g.lineTo(pts[k][0], pts[k][1]);
      g.closePath(); fs(accc, 2);
    }
  }

  function setPartner(i) {
    if (ST.partner) { partnerGroup.remove(ST.partner); }
    ST.partner = buildPartner(CFG.partners[i]);
    ST.partner.position.set(0, -5.75, 2.6);
    ST.partner.scale.setScalar(0.72);
    partnerGroup.add(ST.partner);
  }

  /* ================= モード / ステージ せんたく ================= */
  function renderModes() {
    var box = $('mode-list'); if (!box) return;
    box.innerHTML = '';
    for (var i = 0; i < CFG.modes.length; i++) {
      (function (m) {
        var b = document.createElement('button');
        b.className = 'mcard';
        b.style.background = m.color;
        var big = document.createElement('div');
        big.className = 'mbig'; big.textContent = m.sample;
        b.appendChild(big);
        var nm = document.createElement('div');
        nm.className = 'mname'; nm.textContent = m.name;
        b.appendChild(nm);
        var st = document.createElement('div');
        st.className = 'mstar';
        st.textContent = '★ ' + totalStars(m.key) + ' / ' + (m.stages.length * 3);
        b.appendChild(st);
        b.onclick = function () {
          SFX.tap(); MQ.unlockAudio();
          ST.mode = m.key; SV.lastMode = m.key; MQ.saveNow();
          renderStages(); goScreen('stage');
        };
        box.appendChild(b);
      })(CFG.modes[i]);
    }
  }

  function renderStages() {
    var md = modeDef(ST.mode);
    var t = $('stage-title'); if (t) t.textContent = md.name;
    var box = $('stage-list'); if (!box) return;
    box.innerHTML = '';
    var open = unlockedUpto(ST.mode);
    for (var i = 0; i < md.stages.length; i++) {
      (function (i) {
        var s = md.stages[i];
        var locked = i > open;
        var b = document.createElement('button');
        b.className = 'scard' + (locked ? ' lock' : '');
        var no = document.createElement('div');
        no.className = 'sno'; no.textContent = (i + 1);
        b.appendChild(no);
        var ic = document.createElement('canvas');
        ic.className = 'sicon';
        b.appendChild(ic);
        var nm = document.createElement('div');
        nm.className = 'sname'; nm.textContent = locked ? '？？？' : s.name;
        b.appendChild(nm);
        var stv = starOf(ST.mode, i);
        var sr = document.createElement('div');
        sr.className = 'sstar';
        sr.textContent = locked ? '🔒' : ['☆☆☆', '★☆☆', '★★☆', '★★★'][stv];
        b.appendChild(sr);
        /* canvas は ロックの ありなしに かかわらず かならず サイズを きめる
           (きめないと 300x150 の きどうちで レイアウトが くずれる) */
        var size = 46, dpr = Math.min(global.devicePixelRatio || 1, 2);
        ic.width = size * dpr; ic.height = size * dpr;
        ic.style.width = size + 'px'; ic.style.height = size + 'px';
        if (!locked) {
          b.onclick = function () {
            SFX.tap(); MQ.unlockAudio();
            startStage(i);
          };
          var g = ic.getContext('2d');
          g.setTransform(dpr, 0, 0, dpr, 0, 0);
          if (global.MojiIcons) global.MojiIcons.draw(g, s.words[0].icon, size, 0.04);
        }
        box.appendChild(b);
      })(i);
    }
  }

  function startStage(i) {
    ST.stage = i;
    ST.wordIdx = 0;
    ST.stageMiss = 0;
    var md = modeDef(ST.mode);
    var t = $('hud-stage');
    if (t) t.textContent = (i + 1) + '. ' + md.stages[i].name;
    goScreen('play');
    running = true;
    setupWord();
  }

  /* ================= ずかん ================= */
  function renderDex() {
    var box = $('dex-list'); if (!box) return;
    box.innerHTML = '';
    var got = 0, all = 0;
    for (var m = 0; m < CFG.modes.length; m++) {
      var md = CFG.modes[m];
      var h = document.createElement('div');
      h.className = 'dexh'; h.textContent = md.name;
      box.appendChild(h);
      var grid = document.createElement('div');
      grid.className = 'dexgrid';
      box.appendChild(grid);
      for (var s = 0; s < md.stages.length; s++) {
        for (var w = 0; w < md.stages[s].words.length; w++) {
          (function (md, word) {
            all++;
            var have = !!SV.dex[md.key + ':' + word.text];
            if (have) got++;
            var d = document.createElement('button');
            d.className = 'dexc' + (have ? '' : ' no');
            var cv = document.createElement('canvas');
            d.appendChild(cv);
            var lb = document.createElement('div');
            lb.className = 'dexlb';
            lb.textContent = have ? word.text : '???';
            d.appendChild(lb);
            grid.appendChild(d);
            if (have) {
              var size = 52, dpr = Math.min(global.devicePixelRatio || 1, 2);
              cv.width = size * dpr; cv.height = size * dpr;
              cv.style.width = size + 'px'; cv.style.height = size + 'px';
              var g = cv.getContext('2d');
              g.setTransform(dpr, 0, 0, dpr, 0, 0);
              if (global.MojiIcons) global.MojiIcons.draw(g, word.icon, size, 0.04);
              d.onclick = function () {
                MQ.unlockAudio(); SFX.tap();
                Voice.speak(word.read || word.text, md.lang, 0.75);
              };
            } else {
              var size2 = 52, dpr2 = Math.min(global.devicePixelRatio || 1, 2);
              cv.width = size2 * dpr2; cv.height = size2 * dpr2;
              cv.style.width = size2 + 'px'; cv.style.height = size2 + 'px';
            }
          })(md, md.stages[s].words[w]);
        }
      }
    }
    var c = $('dex-count');
    if (c) c.textContent = got + ' / ' + all;
  }

  /* ================= メインループ ================= */
  var tAcc = 0;
  var _wp = null, _dir = null;
  function loop() {
    requestAnimationFrame(loop);
    if (!ready3D) return;
    if (!_wp) { _wp = new global.THREE.Vector3(); _dir = new global.THREE.Vector3(); }
    var dt = Math.min(clock.getDelta(), 0.1);
    tAcc += dt;
    var t = tAcc;

    /* かんきょう */
    for (var e = 0; e < envAnim.length; e++) envAnim[e].fn(envAnim[e].o, t);

    /* カメラ ゆらぎ */
    camAngle = lerp(camAngle, camTargetAngle, 1 - Math.pow(0.001, dt));
    var sway = current === 'play' ? 0.055 : 0.16;
    camera.position.x = Math.sin(t * 0.18 + camAngle) * sway * 8;
    camera.position.y = 1.2 + Math.sin(t * 0.24) * 0.22;
    camera.position.z = 11.5;
    camera.lookAt(0, 0.5, 0);

    /* クリスタル */
    for (var i = 0; i < crystals.length; i++) {
      var c = crystals[i], u = c.userData;
      /* とうじょう */
      if (u.pop < 1) {
        u.pop += dt * 2.6;
        var p = clamp(u.pop, 0, 1);
        var ease = p < 0 ? 0 : 1 - Math.pow(1 - p, 3);
        var over = 1 + Math.sin(clamp(p, 0, 1) * Math.PI) * 0.16;
        c.scale.setScalar(Math.max(0.01, ease * over));
      }
      if (u.taken) {
        c.scale.multiplyScalar(Math.pow(0.0009, dt));
        if (c.scale.x < 0.02) c.visible = false;
        continue;
      }
      /* ふわふわ */
      c.position.y = u.base.y + Math.sin(t * 1.15 + u.ph) * 0.19;
      c.position.x = u.base.x + Math.cos(t * 0.85 + u.ph) * 0.09;
      u.shell.rotation.y += dt * 0.55;
      u.shell.rotation.x = Math.sin(t * 0.5 + u.ph) * 0.25;
      /* いつも カメラを むき、ガラスの そとがわに でる */
      u.plate.quaternion.copy(camera.quaternion);
      c.getWorldPosition(_wp);
      _dir.subVectors(camera.position, _wp).normalize();
      u.plate.position.set(_dir.x * 1.18, _dir.y * 1.18, _dir.z * 1.18);
      /* まちがえた ゆれ */
      if (u.shake > 0) {
        u.shake -= dt * 2.2;
        c.position.x += Math.sin(t * 55) * u.shake * 0.22;
      }
      /* ヒント */
      var isNext = (u.ch === ST.letters[ST.filled]);
      if (ST.hintTimer > 0 && isNext) {
        var pulse = 0.5 + Math.sin(t * 6.5) * 0.5;
        u.glow.material.opacity = 0.25 + pulse * 0.45;
        u.glow.scale.setScalar(2.7 + pulse * 0.9);
      } else {
        u.glow.material.opacity = 0.2 + Math.sin(t * 1.6 + u.ph) * 0.07;
        u.glow.scale.setScalar(2.7);
      }
    }

    /* ヒント タイマー (12びょう なにもしないと ひかる) */
    if (running && !ST.locked) {
      if (ST.hintTimer < 99) ST.hintTimer += dt;
      if (ST.hintTimer > TUNE.HINT_IDLE_SEC && ST.hintTimer < 99) { ST.hintTimer = 99; showHintSlot(); }
    }

    /* あいぼう */
    if (ST.partner) {
      var pu = ST.partner.userData;
      ST.partner.position.y = -5.75 + Math.sin(t * 1.6) * 0.1;
      if (pu.head) pu.head.rotation.z = Math.sin(t * 1.1) * 0.07;
      if (pu.spin) pu.spin.rotation.y += dt * 1.6;
      if (pu.blink) {
        var bs = 1 + Math.sin(t * 3.2) * 0.14;
        pu.blink.scale.setScalar(bs);
      }
      if (pu.cheer > 0) {
        pu.cheer -= dt * 1.6;
        var cp = clamp(pu.cheer, 0, 1);
        ST.partner.position.y += Math.abs(Math.sin(t * 16)) * cp * 0.7;
        if (pu.hands) {
          pu.hands[0].position.y = 0.95 + cp * 0.7;
          pu.hands[1].position.y = 0.95 + cp * 0.7;
        }
      } else if (pu.hands) {
        pu.hands[0].position.y = lerp(pu.hands[0].position.y, 0.95, 0.1);
        pu.hands[1].position.y = lerp(pu.hands[1].position.y, 0.95, 0.1);
      }
      ST.partner.rotation.y = Math.sin(t * 0.6) * 0.18;
    }

    updateParticles(dt);
    renderer.render(scene, camera);
  }

  /* ================= はいせん ================= */
  function bind() {
    var cv = $('cv');
    if (cv) {
      cv.addEventListener('pointerdown', onTap, { passive: true });
    }
    global.addEventListener('resize', onResize);

    function on(id, fn) { var e = $(id); if (e) e.onclick = function () { MQ.unlockAudio(); SFX.tap(); fn(); }; }

    on('btn-start', function () {
      if (SV.partner === undefined || SV.partner === null) SV.partner = 0;
      renderPartnerPick(); goScreen('partner');
    });
    on('btn-dex-title', function () { renderDex(); goScreen('dex'); });
    on('btn-partner-ok', function () { renderModes(); goScreen('mode'); });
    on('btn-partner-back', function () { goScreen('title'); });
    on('btn-mode-back', function () { renderPartnerPick(); goScreen('partner'); });
    on('btn-stage-back', function () { renderModes(); goScreen('mode'); });
    on('btn-dex-back', function () { goScreen('title'); });
    on('btn-hud-back', function () {
      running = false; clearCrystals(); renderStages(); goScreen('stage');
    });
    on('btn-hud-home', function () { MQ.goBack(); });
    on('btn-say', function () { speakWord(true); });
    on('btn-hint', function () { ST.hintTimer = 99; showHintSlot(); });
    on('res-next', function () {
      var md = modeDef(ST.mode);
      if (ST.stage < md.stages.length - 1) startStage(ST.stage + 1);
      else { renderStages(); goScreen('stage'); }
    });
    on('res-retry', function () { startStage(ST.stage); });
    on('res-back', function () { renderStages(); goScreen('stage'); });
    on('res-dex', function () { renderDex(); goScreen('dex'); });

    var qi = $('q-icon');
    if (qi) qi.onclick = function () { MQ.unlockAudio(); speakWord(true); };

    var bb = $('bgm-btn');
    if (bb) bb.onclick = function () { MQ.toggleBGM(); };
    MQ.syncBgmBtn();
  }

  /* ================= リッチ タイトル ================= */
  function buildLogo(){
    var el=$('logo'); if(!el)return;
    var raw=el.getAttribute('data-text')||el.textContent;
    el.setAttribute('data-text',raw);
    el.innerHTML='';
    var n=0;
    for(var i=0;i<raw.length;i++){
      var c=raw.charAt(i);
      if(c==='|'){ var br=document.createElement('span'); br.className='br'; el.appendChild(br); continue; }
      var sp=document.createElement('span');
      sp.className='ch'; sp.textContent=c;
      sp.style.setProperty('--i', n++);
      el.appendChild(sp);
    }
    var sk=$('sparks');
    if(sk && !sk.children.length){
      var pos=[[8,18],[24,6],[46,24],[68,8],[86,20],[16,54],[78,52],[52,62]];
      for(var k=0;k<pos.length;k++){
        var it=document.createElement('i');
        it.textContent = k%3===0 ? '\u2726' : (k%3===1 ? '\u2727' : '\u30FB');
        it.style.left=pos[k][0]+'%'; it.style.top=pos[k][1]+'%';
        it.style.animationDelay=(k*0.33)+'s';
        it.style.fontSize=(11+(k%3)*5)+'px';
        sk.appendChild(it);
      }
    }
    var bd=$('star-badge');
    if(bd){
      var got=0,max=0;
      for(var m=0;m<CFG.modes.length;m++){
        got+=totalStars(CFG.modes[m].key);
        max+=CFG.modes[m].stages.length*3;
      }
      bd.innerHTML='<b>\u2605</b> あつめた ほし '+got+' / '+max;
      var bw=$('badge-wrap'); if(bw)bw.style.display = got>0 ? 'block' : 'none';
    }
  }

  /* タイトルの デモ クリスタル */
  function titleCrystals(){
    var demo=(CFG.titleChars||'あアAa').split('');
    clearCrystals();
    var pos=layoutCrystals(demo.length);
    for(var i=0;i<demo.length;i++){
      var c=makeCrystal(demo[i],i);
      c.position.copy(pos[i]); c.userData.base.copy(pos[i]);
      c.scale.setScalar(0.01); c.userData.pop=-i*0.12;
      crystalGroup.add(c); crystals.push(c);
    }
    fitCrystals();
    /* ロゴ・ボタンと かさならないよう 上のほうへ */
    crystalGroup.scale.multiplyScalar(0.66);
    crystalGroup.position.y += 4.3;
  }

  /* ================= ブート ================= */
  function boot() {
    MQ.loadSave();
    var cv = $('cv');
    if (!hasWebGL() || typeof global.THREE === 'undefined') {
      var fb = $('fallback'); if (fb) fb.classList.add('on');
      var ld = $('loading'); if (ld) ld.classList.remove('on');
      return;
    }
    init3D(cv);
    setPartner(MQ.safeInt(SV.partner, 0, CFG.partners.length - 1, 0));
    bind();
    goScreen('title');
    var ld = $('loading'); if (ld) ld.classList.remove('on');
    loop();
  }

  /* フォントが そろってから (テクスチャの もじが きれいに なる) */
  function start() {
    var done = false;
    function go() { if (done) return; done = true; boot(); }
    try {
      if (document.fonts && document.fonts.ready) {
        document.fonts.ready.then(go);
        setTimeout(go, 2500);
      } else { go(); }
    } catch (e) { go(); }
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', start);
  } else { start(); }

  global.MQ.debug = {
    state: ST, crystals: function () { return crystals; },
    goScreen: goScreen, startStage: startStage,
    tapCrystal: tapCrystal, modeDef: modeDef, setPartner: setPartner,
    setupWord: setupWord, stageClear: stageClear,
    __scene: function(){ return scene; }, __cam: function(){ return camera; }
  };
})(window);
</script>
