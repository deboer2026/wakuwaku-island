<title>まほうのめいろ</title>

<style>
*{margin:0;padding:0;box-sizing:border-box;}
html,body{height:100%;overflow:hidden;}
body{
  font-family:'M PLUS Rounded 1c',sans-serif;
  background:linear-gradient(180deg,#0d0620 0%,#1a0a2e 60%,#0d1a0a 100%);
  display:flex;flex-direction:column;align-items:center;
  height:100%;user-select:none;
  -webkit-tap-highlight-color:transparent;
}

/* ===== HUD ===== */
#hud{
  position:fixed;top:0;left:50%;transform:translateX(-50%);
  width:100%;max-width:480px;z-index:10;
  display:grid;
  grid-template-columns:auto 1fr auto;
  grid-template-rows:auto auto;
  gap:4px 6px;
  padding:max(10px,var(--sat,env(safe-area-inset-top,0px))) 10px 6px;
  pointer-events:none;
}
#hud button,#hud #ui-bgm-btn{pointer-events:auto;}
#back-btn{
  background:rgba(10,5,30,0.6);border:1px solid rgba(255,255,255,0.2);
  color:rgba(255,255,255,0.85);font-family:inherit;font-weight:700;
  font-size:12px;padding:5px 10px;border-radius:10px;
  touch-action:manipulation;
}
.hud-spacer{}
#ui-bgm-btn{
  font-size:18px;padding:3px 8px;border-radius:10px;
  border:1px solid rgba(255,255,255,0.2);background:rgba(10,5,30,0.6);
  touch-action:manipulation;cursor:pointer;
}
.hud-status-row{
  grid-column:1 / -1;
  display:flex;gap:5px;justify-content:center;flex-wrap:wrap;
}
.hud-box{
  background:rgba(10,5,30,0.65);
  border:1px solid rgba(255,255,255,0.15);
  border-radius:10px;padding:3px 9px;
  font-size:12px;font-weight:800;color:#fff;
  white-space:nowrap;
}
#hud-stage{color:#FFD700;}
#hud-gates{display:flex;gap:5px;align-items:center;}
.gate-ind{
  width:16px;height:16px;border-radius:4px;
  display:inline-flex;align-items:center;justify-content:center;
  font-size:9px;font-weight:900;color:#fff;
  transform:rotate(45deg);
  transition:box-shadow .3s, opacity .3s;
}
.gate-ind span{transform:rotate(-45deg);}
.gate-ind.open{opacity:.45;box-shadow:none;}

/* ===== 3Dキャンバス ===== */
#c3d{position:fixed;inset:0;z-index:1;display:block;touch-action:none;}

/* ===== コントローラ ===== */
#controls{
  position:fixed;bottom:0;left:50%;transform:translateX(-50%);
  width:100%;max-width:480px;z-index:10;
  display:grid;
  grid-template-areas:". up ." "left down right";
  grid-template-columns:1fr 1fr 1fr;
  gap:6px;padding:6px 40px calc(10px + var(--sab,env(safe-area-inset-bottom,0px)));
}
.ctrl-btn{
  font-size:26px;padding:10px 0;border-radius:14px;
  background:rgba(20,10,50,0.55);
  border:1px solid rgba(255,255,255,0.22);
  touch-action:manipulation;
  box-shadow:0 3px 0 rgba(0,0,0,0.35);
  backdrop-filter:blur(2px);
}
.ctrl-btn:active{transform:translateY(2px);box-shadow:0 1px 0 rgba(0,0,0,0.35);}
.ctrl-up{grid-area:up;}.ctrl-left{grid-area:left;}
.ctrl-down{grid-area:down;}.ctrl-right{grid-area:right;}

/* ===== オーバーレイ共通 ===== */
.overlay{
  position:fixed;inset:0;z-index:100;
  background:rgba(5,0,20,0.85);backdrop-filter:blur(3px);
  display:none;align-items:center;justify-content:center;
  flex-direction:column;padding:20px;text-align:center;color:#fff;
}
.overlay.show{display:flex;}
.ov-emoji{font-size:56px;margin-bottom:8px;}
.ov-title{font-size:26px;font-weight:900;color:#FFD700;margin-bottom:8px;
  text-shadow:0 0 16px rgba(255,215,0,0.5);}
.ov-sub{font-size:14px;line-height:1.7;opacity:.9;margin-bottom:14px;}
.ov-score{font-size:18px;font-weight:900;margin-bottom:14px;}
.btn-gold{
  font-family:inherit;font-size:18px;font-weight:900;
  padding:13px 40px;border-radius:999px;border:none;
  background:linear-gradient(180deg,#FFE082,#FFB300);
  color:#5D4037;box-shadow:0 4px 0 #C68400, 0 6px 18px rgba(255,180,0,0.4);
  touch-action:manipulation;
}
.btn-gold:active{transform:translateY(3px);box-shadow:0 1px 0 #C68400;}

/* ===== タイトル画面 ===== */
#title-ov{background:none;backdrop-filter:none;padding:0;}
#title-bg{position:absolute;inset:0;z-index:0;overflow:hidden;}
#title-content{
  position:relative;z-index:1;width:100%;max-width:420px;height:100%;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:12px;padding:max(16px,var(--sat,0px)) 18px max(16px,var(--sab,0px));
}
#title-logo{
  font-size:38px;font-weight:900;letter-spacing:2px;
  background:linear-gradient(180deg,#FFF9C4 20%,#FFD54F 55%,#FF9800 100%);
  -webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 0 14px rgba(255,200,60,0.55)) drop-shadow(0 3px 0 rgba(90,40,0,0.55));
  animation:logoFloat 3s ease-in-out infinite;
  text-align:center;line-height:1.15;
}
@keyframes logoFloat{0%,100%{transform:translateY(0);}50%{transform:translateY(-6px);}}
#title-sub{font-size:13px;color:#D1C4E9;font-weight:800;text-shadow:0 0 8px rgba(150,100,255,0.5);}

#howto{
  width:100%;background:rgba(20,8,50,0.72);
  border:1px solid rgba(180,140,255,0.35);
  border-radius:16px;padding:10px 12px;
  display:flex;flex-direction:column;gap:6px;
}
#howto-title{font-size:12px;font-weight:900;color:#B39DDB;letter-spacing:1px;}
#demo-strip{
  display:flex;align-items:center;justify-content:center;gap:8px;
  font-size:22px;padding:4px 0;
}
.demo-gem{
  width:26px;height:26px;border-radius:6px;transform:rotate(45deg);
  background:linear-gradient(135deg,#81D4FA,#29B6F6);
  box-shadow:0 0 10px rgba(79,195,247,0.8);
  animation:demoGemStep 3s ease-in-out infinite;
}
.demo-arrow{color:#FFF176;font-size:16px;font-weight:900;}
.demo-gate{
  width:30px;height:34px;border-radius:8px;position:relative;
  background:linear-gradient(180deg,rgba(79,195,247,0.85),rgba(41,121,255,0.85));
  box-shadow:0 0 12px rgba(79,195,247,0.7);
  display:flex;align-items:center;justify-content:center;
  animation:demoGateOpen 3s ease-in-out infinite;
  overflow:hidden;
}
.demo-gate::before{content:'✦';color:#fff;font-size:14px;}
@keyframes demoGemStep{0%,38%{filter:brightness(1);}45%,60%{filter:brightness(2);}70%,100%{filter:brightness(1);}}
@keyframes demoGateOpen{
  0%,44%{transform:scaleY(1);opacity:1;}
  55%,78%{transform:scaleY(.12);opacity:.35;}
  90%,100%{transform:scaleY(1);opacity:1;}
}
#howto-text{font-size:12px;color:#EDE7F6;line-height:1.7;font-weight:700;}
#howto-text b{color:#81D4FA;}

.option-label{font-size:12px;font-weight:900;color:#B39DDB;letter-spacing:1px;}
#char-grid{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;}
.char-opt{
  font-size:26px;width:48px;height:48px;border-radius:14px;
  background:rgba(255,255,255,0.08);border:2px solid rgba(255,255,255,0.15);
  display:flex;align-items:center;justify-content:center;
  cursor:pointer;touch-action:manipulation;transition:transform .15s;
}
.char-opt.sel{
  background:rgba(255,215,0,0.18);border-color:#FFD700;
  box-shadow:0 0 14px rgba(255,215,0,0.5);transform:scale(1.12);
}
#start-btn{
  font-size:20px;padding:15px 54px;margin-top:2px;
  animation:startPulse 1.6s ease-in-out infinite;
}
.diff-btn{
  font-family:inherit;font-size:14px;font-weight:900;
  padding:9px 18px;border-radius:12px;cursor:pointer;
  background:rgba(255,255,255,0.08);border:2px solid rgba(255,255,255,0.15);
  color:#fff;touch-action:manipulation;transition:transform .15s;
}
.diff-btn.sel{
  background:rgba(255,215,0,0.18);border-color:#FFD700;
  box-shadow:0 0 14px rgba(255,215,0,0.5);transform:scale(1.08);
}
@keyframes startPulse{0%,100%{transform:scale(1);}50%{transform:scale(1.06);}}

/* トースト */
#toast{
  position:fixed;left:50%;top:18%;transform:translateX(-50%);
  z-index:90;background:rgba(20,8,50,0.92);
  border:1px solid rgba(180,140,255,0.5);border-radius:14px;
  color:#fff;font-size:13px;font-weight:800;line-height:1.6;
  padding:10px 16px;text-align:center;max-width:88%;
  opacity:0;pointer-events:none;transition:opacity .4s;
  box-shadow:0 4px 20px rgba(0,0,0,0.5);
}
#toast.show{opacity:1;}

.coin-pop{
  position:fixed;z-index:80;font-size:20px;font-weight:900;color:#FFD700;
  pointer-events:none;animation:pop .65s ease-out forwards;
}
@keyframes pop{0%{transform:translateY(0);opacity:1;}100%{transform:translateY(-36px);opacity:0;}}

/* v7 visual refresh: the maze rules stay unchanged; only presentation is brighter. */
body{background:linear-gradient(180deg,#a8e7ff 0%,#dff7ff 48%,#bfe98e 100%);color:#35245e;}
#c3d{filter:saturate(1.08) contrast(1.02);}
#hud{gap:7px;padding:calc(8px + env(safe-area-inset-top)) calc(10px + env(safe-area-inset-right)) 8px calc(10px + env(safe-area-inset-left));}
#back-btn,.hud-box,#ui-bgm-btn{background:linear-gradient(180deg,rgba(255,255,255,.97),rgba(244,238,255,.94));color:#473072;border:2px solid rgba(126,87,194,.28);box-shadow:0 4px 0 rgba(74,50,120,.18),0 5px 18px rgba(57,63,112,.15);}
.hud-box{border-radius:18px;padding:7px 11px;text-shadow:none;}
#controls{padding-bottom:calc(12px + env(safe-area-inset-bottom));}
.ctrl-btn{background:linear-gradient(160deg,rgba(255,255,255,.97),rgba(226,245,255,.93));border:3px solid rgba(91,114,192,.34);color:#4d4a9b;box-shadow:0 5px 0 rgba(64,65,130,.22),0 8px 20px rgba(46,57,104,.14);text-shadow:none;}
.ctrl-btn:active{transform:translateY(4px) scale(.96);box-shadow:0 1px 0 rgba(64,65,130,.22);}
.overlay{background:radial-gradient(circle at 50% 25%,rgba(255,255,255,.98),rgba(228,246,255,.95) 42%,rgba(203,226,255,.94));color:#3b2b68;}
#title-ov{background:linear-gradient(180deg,#83d8ff 0%,#c4efff 46%,#aee07c 100%);}
#title-bg{filter:saturate(.75) brightness(1.5) hue-rotate(150deg);opacity:.52;}
#title-content{background:rgba(255,255,255,.18);backdrop-filter:blur(2px);}
#title-logo{color:#fff;text-shadow:0 4px 0 #7d55bd,0 8px 20px rgba(72,43,120,.35);filter:none;}
#title-sub,#howto,.option-label{color:#3d2e68;text-shadow:none;}
#howto{background:rgba(255,255,255,.84);border-color:rgba(126,87,194,.28);box-shadow:0 8px 24px rgba(72,70,140,.12);}
#howto-text{color:#4b3a70!important;opacity:1!important}.demo-hero{width:19px;height:19px;border-radius:50%;background:#d39a58;color:transparent;box-shadow:0 -6px 0 -3px #d39a58}.demo-goal{color:#d99522;font-weight:900}
.char-opt{font-size:0;background:linear-gradient(160deg,#fff,#eef7ff);border-color:#b7a5df;box-shadow:0 4px 0 #b6a5da;overflow:hidden;position:relative;}
.char-opt.sel{border-color:#ffbd42;box-shadow:0 4px 0 #d88b15,0 0 0 4px rgba(255,218,91,.3);}
.char-face{position:absolute;left:50%;top:54%;width:34px;height:30px;transform:translate(-50%,-50%);border-radius:48% 48% 45% 45%;background:var(--fur);box-shadow:inset 0 -4px 0 rgba(80,50,30,.08);}
.char-face:before,.char-face:after{content:"";position:absolute;top:-9px;width:14px;height:17px;background:var(--fur);z-index:-1;}
.char-face:before{left:1px;transform:rotate(-24deg);border-radius:80% 20% 55% 35%;}.char-face:after{right:1px;transform:rotate(24deg);border-radius:20% 80% 35% 55%;}
.char-eye{position:absolute;top:10px;width:5px;height:7px;border-radius:50%;background:#342b51;box-shadow:inset 1px 1px #fff}.char-eye.l{left:8px}.char-eye.r{right:8px}.char-nose{position:absolute;left:50%;top:18px;width:6px;height:4px;transform:translateX(-50%);border-radius:50%;background:#e87383}.char-muzzle{position:absolute;left:50%;bottom:3px;width:14px;height:9px;transform:translateX(-50%);border-radius:50%;background:rgba(255,255,255,.55)}
.ov-title{color:#6c43a7;text-shadow:0 3px 0 #fff;}.ov-sub,.ov-score{color:#4c3b74;}.ov-score{background:#fff;border:2px solid #d8c9f4;}
.magic-burst{width:104px;height:104px;position:relative;margin-bottom:8px;animation:float 1.8s ease-in-out infinite}.magic-burst:before{content:"";position:absolute;inset:8px;background:linear-gradient(135deg,#ffe36e,#ff9f56);clip-path:polygon(50% 0,61% 34%,98% 35%,68% 56%,79% 94%,50% 72%,21% 94%,32% 56%,2% 35%,39% 34%);filter:drop-shadow(0 6px 8px rgba(255,150,35,.35))}.magic-burst:after{content:"";position:absolute;inset:33px;border-radius:50%;background:#fff5b5;box-shadow:0 0 0 8px rgba(255,255,255,.5)}
@media(max-height:560px){#title-content{gap:5px}.char-opt{width:48px;height:44px}.char-face{transform:translate(-50%,-50%) scale(.82)}#howto{padding:6px 10px}.magic-burst{width:72px;height:72px}}
@media(max-height:560px) and (orientation:landscape){
  #controls{left:14px;transform:none;width:270px;padding:4px 8px calc(7px + env(safe-area-inset-bottom));gap:4px}.ctrl-btn{font-size:19px;padding:5px 0;border-width:2px;border-radius:12px}#hud{padding-top:6px}.hud-box{padding:5px 8px}
  #title-content{gap:3px;padding:5px 12px;max-width:620px}#title-logo{font-size:26px;line-height:1}#title-sub{font-size:10px}#howto{padding:4px 8px;gap:2px;max-width:560px}#howto-title{font-size:10px}#demo-strip{font-size:16px;padding:0}.demo-gem{width:18px;height:18px}.demo-gate{width:21px;height:23px}#howto-text{font-size:9px;line-height:1.35}.option-label{font-size:10px}.char-opt{width:39px;height:36px}.char-face{transform:translate(-50%,-50%) scale(.72)}.diff-btn{font-size:11px;padding:4px 13px}#start-btn{font-size:15px;padding:8px 34px;margin:0}
}
</style>
</head>

  </div>

  <div id="title-content">
    <div id="title-logo">まほうの<br>めいろ</div>
    <div id="title-sub">✨ 3Dのめいろを スイッチで とびらをひらいて すすもう！ ✨</div>

// ===== 迷路生成 =====
function genMaze(n){
  const g=Array.from({length:n},()=>Array(n).fill(1));
  function carve(x,y){
    const dirs=[[0,-2],[0,2],[-2,0],[2,0]].sort(()=>Math.random()-0.5);
    for(const[dx,dy]of dirs){
      const nx=x+dx,ny=y+dy;
      if(nx>0&&nx<n-1&&ny>0&&ny<n-1&&g[ny][nx]===1){
        g[y+dy/2][x+dx/2]=0;g[ny][nx]=0;carve(nx,ny);
      }
    }
  }
  g[1][1]=0;carve(1,1);return g;
}
function getPaths(m,n){
  const r=[];
  for(let y=0;y<n;y++)for(let x=0;x<n;x++)if(m[y][x]===0)r.push({x,y});
  return r;
}
function solutionPath(m,n){
  const prev={},seen=new Set(['1,1']);
  let q=[[1,1]];
  while(q.length){
    const[x,y]=q.shift();
    if(x===n-2&&y===n-2)break;
    for(const[dx,dy]of[[0,1],[0,-1],[1,0],[-1,0]]){
      const nx=x+dx,ny=y+dy,k=nx+','+ny;
      if(m[ny]?.[nx]===0&&!seen.has(k)){
        seen.add(k);prev[k]=[x,y];q.push([nx,ny]);
      }
    }
  }
  const path=[];let cur=[n-2,n-2];
  while(cur){
    path.unshift({x:cur[0],y:cur[1]});
    cur=prev[cur[0]+','+cur[1]];
    if(cur&&cur[0]===1&&cur[1]===1){path.unshift({x:1,y:1});break;}
  }
  return path;
}
function solvable(m,n,gs,sws){
  const gMap={},sMap={};
  gs.forEach(g=>gMap[g.x+','+g.y]=g.c);
  sws.forEach(s=>sMap[s.x+','+s.y]=s.c);
  const seen=new Set(['1,1,0']);
  let q=[[1,1,0]];
  while(q.length){
    const[x,y,mask]=q.shift();
    if(x===n-2&&y===n-2)return true;
    for(const[dx,dy]of[[0,1],[0,-1],[1,0],[-1,0]]){
      const nx=x+dx,ny=y+dy;
      if(m[ny]?.[nx]!==0)continue;
      const gc=gMap[nx+','+ny];
      if(gc!==undefined&&!((mask>>gc)&1))continue;
      let nm=mask;
      const sc=sMap[nx+','+ny];
      if(sc!==undefined)nm=mask^(1<<sc);
      const k=nx+','+ny+','+nm;
      if(!seen.has(k)){seen.add(k);q.push([nx,ny,nm]);}
    }
  }
  return false;
}
function reachSet(m,n,gs,openColors){
  const gMap={};gs.forEach(g=>gMap[g.x+','+g.y]=g.c);
  const seen=new Set(['1,1']);let q=[[1,1]];
  while(q.length){
    const[x,y]=q.shift();
    for(const[dx,dy]of[[0,1],[0,-1],[1,0],[-1,0]]){
      const nx=x+dx,ny=y+dy,k=nx+','+ny;
      if(m[ny]?.[nx]!==0||seen.has(k))continue;
      const gc=gMap[k];
      if(gc!==undefined&&!openColors.has(gc))continue;
      seen.add(k);q.push([nx,ny]);
    }
  }
  return seen;
}
function placePuzzle(m,n,cfg){
  const path=solutionPath(m,n);
  const onSol=new Set(path.map(p=>p.x+','+p.y));
  const need=cfg.colors*cfg.gpc;
  const lo=Math.max(1,Math.floor(path.length*0.2)),hi=Math.floor(path.length*0.92);
  if(hi-lo<need)return{gates:[],switches:[]};
  for(let attempt=0;attempt<60;attempt++){
    const idxs=new Set();
    while(idxs.size<need)idxs.add(lo+Math.floor(Math.random()*(hi-lo)));
    const sorted=[...idxs].sort((a,b)=>a-b);
    const gs=sorted.map((pi,i)=>({x:path[pi].x,y:path[pi].y,c:Math.floor(i/cfg.gpc)}));
    const gset=new Set(gs.map(g=>g.x+','+g.y));
    const sws=[],used=new Set(),open=new Set();
    let ok=true;
    for(let c=0;c<cfg.colors;c++){
      const reach=reachSet(m,n,gs,open);
      const cand=[...reach].map(k=>{const[x,y]=k.split(',').map(Number);return{x,y};})
        .filter(p=>!(p.x===1&&p.y===1)&&!(p.x===n-2&&p.y===n-2)
          &&!gset.has(p.x+','+p.y)&&!used.has(p.x+','+p.y));
      const side=cand.filter(p=>!onSol.has(p.x+','+p.y));
      const from=(side.length?side:cand);
      if(!from.length){ok=false;break;}
      const pick=from[Math.floor(Math.random()*from.length)];
      sws.push({x:pick.x,y:pick.y,c});used.add(pick.x+','+pick.y);
      open.add(c);
    }
    if(!ok)continue;
    if(solvable(m,n,gs,sws))return{gates:gs,switches:sws};
  }
  return{gates:[],switches:[]};
}
function placeEnemies(m,n,cnt){
  const occupied=new Set([
    ...gates.map(g=>g.x+','+g.y),
    ...switches.map(s=>s.x+','+s.y),
  ]);
  const paths=getPaths(m,n).filter(p=>
    !(p.x<=2&&p.y<=2)&&!(p.x>=n-3&&p.y>=n-3)&&
    !occupied.has(p.x+','+p.y));
  const list=[];
  [...paths].sort(()=>Math.random()-0.5).slice(0,cnt).forEach((p,i)=>{
    const canH=m[p.y]?.[p.x-1]===0&&m[p.y]?.[p.x+1]===0;
    const canV=m[p.y-1]?.[p.x]===0&&m[p.y+1]?.[p.x]===0;
    const dir=(canH&&canV)?(Math.random()<0.5?'h':'v'):canH?'h':'v';
    let range=1;
    if(dir==='h'){let l=p.x,r=p.x;while(l>1&&m[p.y][l-1]===0)l--;while(r<n-2&&m[p.y][r+1]===0)r++;range=Math.max(1,Math.floor((r-l)/2));}
    else{let t=p.y,b=p.y;while(t>1&&m[t-1][p.x]===0)t--;while(b<n-2&&m[b+1][p.x]===0)b++;range=Math.max(1,Math.floor((b-t)/2));}
    list.push({x:p.x,y:p.y,ox:p.x,oy:p.y,dir,range,step:0,ds:1,kind:ENEMY_TYPES[i%ENEMY_TYPES.length]});
  });
  return list;
}
function placeCoins(m,n,cnt,epos){
  const occupied=new Set([
    ...gates.map(g=>g.x+','+g.y),
    ...switches.map(s=>s.x+','+s.y),
    ...epos.map(e=>e.x+','+e.y),
  ]);
  const paths=getPaths(m,n).filter(p=>
    !(p.x===1&&p.y===1)&&!(p.x===n-2&&p.y===n-2)&&
    !occupied.has(p.x+','+p.y));
  return [...paths].sort(()=>Math.random()-0.5).slice(0,cnt).map(p=>({...p,got:false}));
}
function gateAt(x,y){return gates.find(g=>g.x===x&&g.y===y);}
function switchAt(x,y){return switches.find(s=>s.x===x&&s.y===y);}
function isBlocked(x,y){
  if(maze[y]?.[x]!==0)return true;
  const g=gateAt(x,y);
  return !!(g&&!gateOpen[g.c]);
}

// ===== ピンチ＆ホイールでズーム =====
(function(){
  const cv=document.getElementById('c3d');
  let pinchDist=0;
  cv.addEventListener('touchstart',e=>{
    if(e.touches.length===2){
      pinchDist=Math.hypot(
        e.touches[0].clientX-e.touches[1].clientX,
        e.touches[0].clientY-e.touches[1].clientY);
    }
  },{passive:true});
  cv.addEventListener('touchmove',e=>{
    if(e.touches.length===2&&pinchDist>0){
      e.preventDefault();
      const d=Math.hypot(
        e.touches[0].clientX-e.touches[1].clientX,
        e.touches[0].clientY-e.touches[1].clientY);
      zoom=Math.min(ZOOM_MAX,Math.max(ZOOM_MIN,zoom*(pinchDist/d)));
      pinchDist=d;
    }
  },{passive:false});
  cv.addEventListener('touchend',()=>{pinchDist=0;});
  cv.addEventListener('wheel',e=>{
    e.preventDefault();
    zoom=Math.min(ZOOM_MAX,Math.max(ZOOM_MIN,zoom*(e.deltaY>0?1.08:0.93)));
  },{passive:false});
})();

  enemySprites=[];coinMeshes=[];gateMeshes=[];switchMeshes=[];

  // 床
  const floorGeo=new THREE.PlaneGeometry(sz*CELL,sz*CELL);
  const floorMat=new THREE.MeshLambertMaterial({color:0x8fd36f});
  const floor=new THREE.Mesh(floorGeo,floorMat);
  floor.rotation.x=-Math.PI/2;
  stageGroup.add(floor);
  // 遠景の魔法庭園。少数の共有ジオメトリで軽量に保つ。
  const trunkGeo=new THREE.CylinderGeometry(.09,.12,.55,6),trunkMat=mat(0x9a6842);
  const crownGeo=new THREE.ConeGeometry(.34,.72,7),crownMat=mat(0x3fae54);
  const decoCount=Math.min(14,Math.max(8,Math.floor(sz/2)));
  for(let i=0;i<decoCount;i++){
    const side=i%4,along=-sz/2+(i/decoCount)*sz;
    const x=side<2?(side===0?-sz/2-.75:sz/2+.75):along;
    const z=side>=2?(side===2?-sz/2-.75:sz/2+.75):along;
    const tr=mesh(trunkGeo,trunkMat,x,.275,z),cr=mesh(crownGeo,crownMat,x,.88,z);
    stageGroup.add(tr,cr);
  }
  // 床タイル模様（市松）
  const tileGeo=new THREE.PlaneGeometry(CELL*0.96,CELL*0.96);
  const tileMat=new THREE.MeshLambertMaterial({color:0xe8dfbd});
  for(let y=0;y<sz;y++)for(let x=0;x<sz;x++){
    if(maze[y][x]===0&&(x+y)%2===0){
      const t=new THREE.Mesh(tileGeo,tileMat);
      t.rotation.x=-Math.PI/2;
      t.position.set(w(x),0.005,w(y));
      stageGroup.add(t);
    }
  }

  // 壁（InstancedMesh）
  let wallCount=0;
  for(let y=0;y<sz;y++)for(let x=0;x<sz;x++)if(maze[y][x]===1)wallCount++;
  const wallGeo=new THREE.BoxGeometry(CELL,WALL_H,CELL);
  const wallMat=new THREE.MeshLambertMaterial({color:0x438f48});
  const walls=new THREE.InstancedMesh(wallGeo,wallMat,wallCount);
  const dummy=new THREE.Object3D();
  let wi=0;
  for(let y=0;y<sz;y++)for(let x=0;x<sz;x++){
    if(maze[y][x]!==1)continue;
    dummy.position.set(w(x),WALL_H/2,w(y));
    dummy.updateMatrix();
    walls.setMatrixAt(wi++,dummy.matrix);
  }
  stageGroup.add(walls);
  // 壁の天面（明るい縁でレトロ感）
  const capGeo=new THREE.PlaneGeometry(CELL*0.92,CELL*0.92);
  const capMat=new THREE.MeshLambertMaterial({color:0x4fa953});
  const caps=new THREE.InstancedMesh(capGeo,capMat,wallCount);
  wi=0;
  for(let y=0;y<sz;y++)for(let x=0;x<sz;x++){
    if(maze[y][x]!==1)continue;
    dummy.position.set(w(x),WALL_H+0.006,w(y));
    dummy.rotation.x=-Math.PI/2;
    dummy.updateMatrix();
    caps.setMatrixAt(wi++,dummy.matrix);
  }
  dummy.rotation.x=0;
  stageGroup.add(caps);

  // とびら
  gates.forEach(g=>{
    const col=GATE_COLORS[g.c];
    const geo=new THREE.BoxGeometry(CELL*0.86,WALL_H*0.95,CELL*0.86);
    const mat=new THREE.MeshLambertMaterial({
      color:col.main,transparent:true,opacity:0.75,
      emissive:col.dark,emissiveIntensity:0.5,
    });
    const mesh=new THREE.Mesh(geo,mat);
    mesh.position.set(w(g.x),WALL_H*0.475,w(g.y));
    stageGroup.add(mesh);
    // 魔法の紋章（軽量な立体宝石）
    const star=new THREE.Mesh(new THREE.OctahedronGeometry(.18),new THREE.MeshLambertMaterial({color:0xffffff,emissive:col.main,emissiveIntensity:.8,transparent:true}));
    star.position.set(w(g.x),WALL_H*0.55,w(g.y));
    stageGroup.add(star);
    gateMeshes.push({mesh,star,g,openT:0});
  });

  // スイッチ（クリスタル：八面体）
  switches.forEach(s=>{
    const col=GATE_COLORS[s.c];
    const geo=new THREE.OctahedronGeometry(0.26);
    const mat=new THREE.MeshLambertMaterial({
      color:col.main,emissive:col.main,emissiveIntensity:0.55,
      transparent:true,opacity:0.95,
    });
    const mesh=new THREE.Mesh(geo,mat);
    mesh.position.set(w(s.x),0.36,w(s.y));
    stageGroup.add(mesh);
    // 台座
    const base=new THREE.Mesh(
      new THREE.CylinderGeometry(0.3,0.34,0.08,8),
      new THREE.MeshLambertMaterial({color:0xd9c58f}));
    base.position.set(w(s.x),0.04,w(s.y));
    stageGroup.add(base);
    switchMeshes.push({mesh,s,hitT:0});
  });

  // コイン
  coins.forEach(c=>{
    const geo=new THREE.CylinderGeometry(0.2,0.2,0.05,16);
    const mat=new THREE.MeshLambertMaterial({color:0xFFD700,emissive:0xAA7700,emissiveIntensity:0.6});
    const mesh=new THREE.Mesh(geo,mat);
    mesh.rotation.z=Math.PI/2;
    mesh.position.set(w(c.x),0.35,w(c.y));
    stageGroup.add(mesh);
    coinMeshes.push({mesh,c});
  });

  // ゴール（金色の魔法アーチ）
  goalSprite=makeGoal();
  goalSprite.position.set(w(gx),0,w(gy));
  stageGroup.add(goalSprite);
  goalRing=new THREE.Mesh(
    new THREE.TorusGeometry(0.34,0.045,10,28),
    new THREE.MeshLambertMaterial({color:0x76FF03,emissive:0x33aa00,emissiveIntensity:0.8}));
  goalRing.rotation.x=-Math.PI/2;
  goalRing.position.set(w(gx),0.03,w(gy));
  stageGroup.add(goalRing);

  // プレイヤー
  playerSprite=makeAnimal(CHARS[selChar]);
  playerSprite.position.set(w(px),0,w(py));
  stageGroup.add(playerSprite);

  // 敵
  enemies.forEach(e=>{
    const sp=makeEnemy(e.kind);
    sp.position.set(w(e.x),0,w(e.y));
    stageGroup.add(sp);
    enemySprites.push({sp,e});
  });

  // カメラを即座に配置
  camTarget.set(w(px),0,w(py));
  camera.position.set(w(px),7.2*zoom,w(py)+5.6*zoom);
  camera.lookAt(camTarget);
}

// ===== アニメーションループ =====
let lastT=0;
function loop(t){
  requestAnimationFrame(loop);
  const dt=Math.min((t-lastT)/1000,0.05);lastT=t;
  if(!stageGroup){renderer&&renderer.render(scene,camera);return;}

  // プレイヤー追従（なめらか移動）
  const tx=w(px),tz=w(py);
  playerSprite.position.x+=(tx-playerSprite.position.x)*Math.min(1,dt*14);
  playerSprite.position.z+=(tz-playerSprite.position.z)*Math.min(1,dt*14);
  const walk=Math.sin(t*.012);
  playerSprite.position.y=.02+Math.abs(walk)*.035+(clearJoyT>0?Math.abs(Math.sin(t*.018))*.18:0);
  if(playerSprite.userData.head)playerSprite.userData.head.rotation.z=walk*.035;
  if(playerSprite.userData.tail)playerSprite.userData.tail.rotation.y=walk*.25;
  setOpacity(playerSprite,invincible&&Math.floor(t/120)%2?0.25:1);
  if(clearJoyT>0)clearJoyT=Math.max(0,clearJoyT-dt);

  // 敵追従
  enemySprites.forEach(o=>{
    const ex=w(o.e.x),ez=w(o.e.y);
    o.sp.position.x+=(ex-o.sp.position.x)*Math.min(1,dt*8);
    o.sp.position.z+=(ez-o.sp.position.z)*Math.min(1,dt*8);
    o.sp.position.y=.02+Math.sin(t*0.005+o.e.ox)*0.05+(o.e.kind==='bat'?.28:0);
    o.sp.rotation.y=Math.sin(t*.002+o.e.ox)*.15;
  });

  // コイン回転
  coinMeshes.forEach(o=>{
    if(o.c.got){o.mesh.visible=false;return;}
    o.mesh.rotation.y+=dt*3;
    o.mesh.position.y=0.35+Math.sin(t*0.004+o.c.x)*0.05;
  });

  // クリスタル回転＆パルス
  switchMeshes.forEach(o=>{
    o.mesh.rotation.y+=dt*2;
    const pulse=1+Math.sin(t*0.005)*0.08+(o.hitT>0?o.hitT*0.6:0);
    o.mesh.scale.setScalar(pulse);
    if(o.hitT>0)o.hitT=Math.max(0,o.hitT-dt*3);
  });

  // とびら開閉アニメ
  gateMeshes.forEach(o=>{
    const target=gateOpen[o.g.c]?1:0;
    o.openT+=(target-o.openT)*Math.min(1,dt*8);
    const s=1-o.openT*0.92;
    o.mesh.scale.y=Math.max(0.08,s);
    o.mesh.position.y=WALL_H*0.475*Math.max(0.08,s);
    o.mesh.material.opacity=0.75-o.openT*0.55;
    o.star.material.opacity=1-o.openT;
    o.star.position.y=WALL_H*0.55*Math.max(0.15,s);
  });

  // ゴール演出
  if(goalRing){goalRing.rotation.z+=dt*1.5;goalRing.scale.setScalar(1+Math.sin(t*0.004)*0.12);}
  if(goalSprite)goalSprite.position.y=Math.sin(t*0.003)*0.025;

  // カメラ追従（zoomでピンチ拡大縮小）
  camTarget.x+=(tx-camTarget.x)*Math.min(1,dt*5);
  camTarget.z+=(tz-camTarget.z)*Math.min(1,dt*5);
  const camY=7.2*zoom,camZ=5.6*zoom;
  scene.fog.near=9*zoom;scene.fog.far=22*zoom;
  camera.position.x+=((camTarget.x)-camera.position.x)*Math.min(1,dt*5);
  camera.position.y+=((camY)-camera.position.y)*Math.min(1,dt*5);
  camera.position.z+=((camTarget.z+camZ)-camera.position.z)*Math.min(1,dt*5);
  camera.lookAt(camTarget.x,0.2,camTarget.z);
  if(moonHolder)moonHolder.position.set(camTarget.x,0,camTarget.z);

  renderer.render(scene,camera);
}

// ===== HUD =====
function updateGateHUD(){
  const el=document.getElementById('hud-gates');
  const nColors=STAGES[stageIdx].colors;
  if(!gates.length){el.style.display='none';return;}
  el.style.display='flex';
  el.innerHTML='';
  for(let c=0;c<nColors;c++){
    const col=GATE_COLORS[c];
    const d=document.createElement('div');
    d.className='gate-ind'+(gateOpen[c]?' open':'');
    d.style.background=`linear-gradient(135deg,${col.css},${col.cssDark})`;
    d.style.boxShadow=gateOpen[c]?'none':`0 0 8px ${col.glow}`;
    const sp=document.createElement('span');
    sp.textContent=gateOpen[c]?'':'✕';
    d.appendChild(sp);
    el.appendChild(d);
  }
}

// ===== ステージ =====
function setupStage(idx){
  const cfg=STAGES[idx];sz=cfg.size;
  maze=genMaze(sz);
  px=1;py=1;gx=sz-2;gy=sz-2;
  const puzzle=placePuzzle(maze,sz,cfg);
  gates=puzzle.gates;switches=puzzle.switches;
  gateOpen=GATE_COLORS.map(()=>false);
  enemies=placeEnemies(maze,sz,cfg.enemies);
  coins=placeCoins(maze,sz,cfg.coins,enemies);
  buildStage3D();updateGateHUD();
  clearInterval(enemyIv);
  enemyIv=setInterval(moveEnemies,cfg.speed);
  startTime=Date.now()-totalTime*1000;
  clearInterval(timerIv);
  timerIv=setInterval(()=>{
    totalTime=Math.floor((Date.now()-startTime)/1000);
    const m=Math.floor(totalTime/60),s=totalTime%60;
    document.getElementById('hud-time').textContent=`⏱ ${m}:${String(s).padStart(2,'0')}`;
  },500);
  document.getElementById('hud-stage').textContent=`⚔️ ステージ ${idx+1}/${STAGES.length}`;
  updateHUD();
  playing=true;
  if(gates.length&&!tutorialShown){
    tutorialShown=true;
    showToast('◆ クリスタルをふむと<br>おなじいろの ✦とびらが ひらくよ！',3200);
  }
}

let toastTimer=null;
function showToast(html,ms){
  const t=document.getElementById('toast');
  t.innerHTML=html;t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer=setTimeout(()=>t.classList.remove('show'),ms);
}

// ===== 敵移動 =====
function moveEnemies(){
  if(!playing)return;
  enemies.forEach(e=>{
    e.step+=e.ds;
    if(Math.abs(e.step)>=e.range)e.ds*=-1;
    const nx=e.dir==='h'?e.ox+e.step:e.ox;
    const ny=e.dir==='v'?e.oy+e.step:e.oy;
    if(!isBlocked(nx,ny)){e.x=nx;e.y=ny;}
    else{e.ds*=-1;e.step+=e.ds*2;}
  });
  checkEnemy();
}

// ===== 移動 =====
function tryMove(dx,dy){
  if(moving||!playing)return;
  const nx=px+dx,ny=py+dy;
  if(nx<0||nx>=sz||ny<0||ny>=sz)return;
  if(isBlocked(nx,ny)){
    const g=gateAt(nx,ny);
    if(g&&!gateOpen[g.c]){
      sfx('locked');
      const col=GATE_COLORS[g.c];
      showToast(`✦ ${col.name}のとびらだ！<br>◆ ${col.name}のクリスタルを さがそう`,1800);
    }
    return;
  }
  moving=true;px=nx;py=ny;
  if(playerSprite)playerSprite.rotation.y=Math.atan2(dx,dy);
  checkSwitch();checkCoin();checkEnemy();checkGoal();
  setTimeout(()=>{moving=false;},110);
}

function checkSwitch(){
  const s=switchAt(px,py);
  if(!s)return;
  gateOpen[s.c]=!gateOpen[s.c];
  sfx(gateOpen[s.c]?'open':'close');
  updateGateHUD();
  const o=switchMeshes.find(o=>o.s===s);
  if(o)o.hitT=1;
  const col=GATE_COLORS[s.c];
  showToast(gateOpen[s.c]
    ?`✨ ${col.name}のとびらが ひらいた！`
    :`${col.name}のとびらが しまった…`,1400);
}

function checkCoin(){
  const c=coins.find(c=>!c.got&&c.x===px&&c.y===py);
  if(c){c.got=true;totalCoins++;updateHUD();showCoinPop();sfx('coin');}
}
function showCoinPop(){
  const el=document.createElement('div');el.className='coin-pop';el.textContent='+🪙';
  el.style.left=(window.innerWidth/2-12)+'px';
  el.style.top=(window.innerHeight/2-40)+'px';
  document.body.appendChild(el);setTimeout(()=>el.remove(),650);
}

function checkEnemy(){
  if(invincible||!playing)return;
  if(enemies.some(e=>e.x===px&&e.y===py)){
    lives--;updateHUD();sfx('hit');
    if(lives<=0){setTimeout(gameOver,300);return;}
    invincible=true;clearTimeout(invTimer);
    invTimer=setTimeout(()=>{invincible=false;},2000);
  }
}

function checkGoal(){
  if(px===gx&&py===gy)setTimeout(stageClear,100);
}

function updateHUD(){
  document.getElementById('hud-coins').textContent=`🪙 ${totalCoins}`;
  document.getElementById('hud-lives').textContent='❤️'.repeat(lives)+'🖤'.repeat(3-lives);
}

// ===== クリア/ゲームオーバー =====
function stageClear(){
  playing=false;
  clearJoyT=1.4;
  clearInterval(enemyIv);clearInterval(timerIv);sfx('clear');
  const got=coins.filter(c=>c.got).length,all=coins.length;
  const stars=got===all?'⭐⭐⭐':got>0?'⭐⭐':'⭐';
  document.getElementById('clear-title').textContent=`ステージ ${stageIdx+1} クリア！`;
  document.getElementById('clear-sub').innerHTML=`${stars}<br>コイン：🪙 ${got}/${all}　タイム：${fmt(totalTime)}`;
  document.getElementById('clear-score').textContent=`🪙 ${totalCoins} まい`;
  const nb=document.getElementById('next-btn');
  if(stageIdx>=STAGES.length-1){nb.textContent='🏆 ぜんぶ クリア！';nb.onclick=allClear;}
  else{nb.textContent='つぎへ ▶';nb.onclick=nextStage;}
  // ローポリ主人公の喜びジャンプを見せてから結果を表示する。
  setTimeout(()=>document.getElementById('clear-ov').classList.add('show'),520);
}

function fmt(s){return `${Math.floor(s/60)}:${String(s%60).padStart(2,'0')}`;}

function nextStage(){
  document.getElementById('clear-ov').classList.remove('show');
  stageIdx++;setupStage(stageIdx);
}

function gameOver(){
  playing=false;
  clearInterval(enemyIv);clearInterval(timerIv);
  document.getElementById('go-score').textContent=`🪙 ${totalCoins} まい`;
  document.getElementById('go-ov').classList.add('show');
}

function allClear(){
  document.getElementById('clear-ov').classList.remove('show');
  const hs=parseInt(SAFE_LS.getItem('meiro_hs_'+diff)||'0');
  const isNew=totalCoins>hs;
  if(isNew)SAFE_LS.setItem('meiro_hs_'+diff,totalCoins);
  document.getElementById('ac-score').textContent=`🪙 ${totalCoins} まい | ${fmt(totalTime)}`;
  document.getElementById('ac-hs').textContent=isNew?'🏆 ハイスコア こうしん！':`ハイスコア：🪙 ${hs} まい`;
  document.getElementById('ac-ov').classList.add('show');
}

function startGame(){
  document.getElementById('title-ov').classList.remove('show');
  stageIdx=0;lives=3;totalCoins=0;totalTime=0;updateHUD();
  setupStage(0);
}
function restartGame(){
  ['go-ov','ac-ov','clear-ov'].forEach(id=>document.getElementById(id).classList.remove('show'));
  stageIdx=0;lives=3;totalCoins=0;totalTime=0;updateHUD();
  setupStage(0);
}
function showTitle(){
  playing=false;
  clearInterval(enemyIv);clearInterval(timerIv);
  document.getElementById('go-ov').classList.remove('show');
  document.getElementById('title-ov').classList.add('show');
}

function goBack(){
  clearInterval(enemyIv);clearInterval(timerIv);
  if(window.parent!==window)window.parent.postMessage({type:'goBack'},'*');
  else history.back();
}

// ===== SFX =====
let _ac=null;
function sfx(kind){
  try{
    if(!_ac)_ac=new(window.AudioContext||window.webkitAudioContext)();
    const t=_ac.currentTime;
    const o=_ac.createOscillator(),g=_ac.createGain();
    o.connect(g);g.connect(_ac.destination);
    const P={
      tap:   [[600,.05]],
      coin:  [[880,.06],[1320,.08]],
      open:  [[523,.07],[659,.07],[784,.1]],
      close: [[659,.07],[523,.1]],
      locked:[[220,.09],[196,.12]],
      hit:   [[180,.15]],
      clear: [[523,.1],[659,.1],[784,.1],[1047,.2]],
    }[kind]||[[440,.08]];
    let tt=t;
    P.forEach(([f,d])=>{o.frequency.setValueAtTime(f,tt);tt+=d;});
    o.type=kind==='hit'||kind==='locked'?'square':'triangle';
    g.gain.setValueAtTime(.12,t);
    g.gain.exponentialRampToValueAtTime(.001,tt+.02);
    o.start(t);o.stop(tt+.03);
  }catch(e){}
}

// ===== 操作 =====
['up','down','left','right'].forEach(dir=>{
  const btn=document.getElementById('btn-'+dir);
  const mv={up:[0,-1],down:[0,1],left:[-1,0],right:[1,0]}[dir];
  btn.addEventListener('touchstart',e=>{e.preventDefault();tryMove(...mv);},{passive:false});
  btn.addEventListener('mousedown',()=>tryMove(...mv));
});
window.addEventListener('keydown',e=>{
  const m={ArrowUp:[0,-1],ArrowDown:[0,1],ArrowLeft:[-1,0],ArrowRight:[1,0]}[e.key];
  if(m){e.preventDefault();tryMove(...m);}
});

init3D();

// === 共通UI ===
function goHome(){
  if(window.parent!==window){window.parent.postMessage({type:'goHome'},'*');}
  else{window.location.href='/';}
}
// ── BGM (WakuwakuBGM library) ──────────────────────
let _bgm = null;
function _startBGM() {
  if (_bgm) return;
  if (typeof WakuwakuBGM === 'undefined') return;
  _bgm = new WakuwakuBGM('adventure');
  const on = WakuwakuBGM.loadState();
  _bgm.setEnabled(on);
  if (on) _bgm.start();
  _syncBgmBtn();
}
function toggleCommonBGM() {
  if (!_bgm) { _startBGM(); return; }
  const on = _bgm.toggle();
  WakuwakuBGM.saveState(on);
  _syncBgmBtn();
}
function _syncBgmBtn() {
  const on = _bgm ? _bgm.enabled : (typeof WakuwakuBGM!=='undefined'&&WakuwakuBGM.loadState());
  document.querySelectorAll('#bgm-btn,#ui-bgm-btn,#bgm-toggle,#sound-btn,.bgm-btn')
    .forEach(b => { b.textContent = on ? '🔊' : '🔇'; });
}
(function(){
  function _first(){ _startBGM(); }
  document.addEventListener('click', _first, { once: true });
  document.addEventListener('touchstart', _first, { once: true });
})();
