<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ゆめいろヘアサロン</title>
<style>
:root{
  --bg1:#FFE4F0;--bg2:#FFF3F9;--ink:#4A2A5C;--card:#FFFFFF;--shadow:#E9B9D0;
  --pink:#FF5FA2;--pinkd:#D63D82;--mint:#36CFA8;--mintd:#1E9E7E;--sun:#FFC23A;--sund:#D99A12;--lilac:#9C7BFF;--sky:#5EC4FF;
  --glass1:#DDF3FF;--glass2:#FFFFFF;
  --disp:"Hiragino Maru Gothic ProN","Yu Gothic UI",system-ui,sans-serif;
  --body:"Hiragino Maru Gothic ProN","Yu Gothic UI",system-ui,sans-serif;
  color-scheme:light;box-sizing:border-box;
  --sat:env(safe-area-inset-top,0px);--sab:env(safe-area-inset-bottom,0px);
  padding-top:var(--sat);padding-bottom:var(--sab);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){--bg1:#2A1938;--bg2:#321F44;--ink:#FFEAF6;--card:#3E2853;--shadow:#1B0F26;--glass1:#26304E;--glass2:#3B4370;color-scheme:dark}
}
:root[data-theme="dark"]{--bg1:#2A1938;--bg2:#321F44;--ink:#FFEAF6;--card:#3E2853;--shadow:#1B0F26;--glass1:#26304E;--glass2:#3B4370;color-scheme:dark}
*,*::before,*::after{box-sizing:border-box}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{height:100%;margin:0;overflow:hidden;position:relative;
  background:repeating-linear-gradient(90deg,var(--bg1) 0 38px,var(--bg2) 38px 76px);
  color:var(--ink);font-family:var(--body);font-weight:800;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
button{font-family:inherit;font-weight:800;color:inherit;cursor:pointer;border:none;-webkit-tap-highlight-color:transparent}
button:focus-visible{outline:4px solid var(--sky);outline-offset:3px}
[hidden]{display:none!important}
.screen{position:absolute;inset:0;display:none}
.mirror-bg{background:radial-gradient(circle at 30% 22%,var(--glass2),var(--glass1))}

/* ---------- title ---------- */
#title{overflow:hidden;text-align:center}
#title.on{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:clamp(10px,2.2vh,20px);padding:70px 16px 20px}
.awning{position:absolute;left:0;right:0;top:0;height:54px;background:repeating-linear-gradient(90deg,var(--pink) 0 44px,#fff 44px 88px);z-index:2}
.awning::after{content:"";position:absolute;left:0;right:0;bottom:-21px;height:22px;
  background:radial-gradient(circle at 22px 0,var(--pink) 21px,transparent 22px) 0 0/88px 22px,
             radial-gradient(circle at 22px 0,#fff 21px,transparent 22px) 44px 0/88px 22px}
.sign{margin:0;font-family:var(--disp);font-weight:400;line-height:1.05;position:relative;z-index:3}
.sign .row{display:block;white-space:nowrap}
.sign .row1{font-size:clamp(34px,10vw,64px)}
.sign .row2{font-size:clamp(40px,12.5vw,82px)}
.sign span.ch{display:inline-block;animation:hop 1.8s ease-in-out infinite;animation-delay:calc(var(--i) * -0.15s);
  text-shadow:3px 3px 0 #fff,-3px -3px 0 #fff,3px -3px 0 #fff,-3px 3px 0 #fff,0 4px 0 #fff,0 -4px 0 #fff,4px 0 0 #fff,-4px 0 0 #fff,0 10px 0 var(--ink)}
@keyframes hop{0%,100%{transform:translateY(0) rotate(var(--r))}50%{transform:translateY(-8px) rotate(calc(var(--r) * -1))}}
.tmirror{width:clamp(140px,38vw,240px);aspect-ratio:400/460;border-radius:48% 48% 42% 42%/40% 40% 32% 32%;
  border:9px solid var(--sun);overflow:hidden;box-shadow:0 9px 0 var(--shadow);position:relative;z-index:3}
.tmirror svg{width:100%;height:100%;display:block}
.boing{animation:boing .5s cubic-bezier(.3,1.6,.5,1)}
@keyframes boing{0%{transform:scale(.85)}100%{transform:scale(1)}}
.tbtns{display:flex;flex-direction:column;align-items:center;gap:16px;position:relative;z-index:3}
.big{font-family:var(--disp);font-weight:400;font-size:clamp(26px,7vw,40px);padding:.38em 1.5em .42em;border-radius:999px;
  background:var(--pink);color:#fff;box-shadow:0 8px 0 var(--pinkd);transition:transform .08s,box-shadow .08s;position:relative}
.big:active{transform:translateY(6px);box-shadow:0 2px 0 var(--pinkd)}
.big.alt{background:var(--mint);box-shadow:0 8px 0 var(--mintd)}
.big.alt:active{box-shadow:0 2px 0 var(--mintd)}
.big.mid{font-size:clamp(20px,5.4vw,28px);padding:.35em 1.2em}
#playBtn{animation:breathe 1.6s ease-in-out infinite}
@keyframes breathe{0%,100%{scale:1}50%{scale:1.06}}
.badge{position:absolute;right:-10px;top:-14px;background:var(--sun);color:#4A2A5C;font-family:var(--body);font-weight:800;font-size:13px;
  padding:3px 9px;border-radius:999px;box-shadow:0 3px 0 var(--sund);animation:hop 1s ease-in-out infinite;--r:6deg}
.tstats{position:relative;z-index:3;display:flex;gap:8px;flex-wrap:wrap;justify-content:center;font-size:clamp(14px,3.8vw,18px)}
.pill{background:var(--card);border-radius:999px;padding:6px 14px;box-shadow:0 4px 0 var(--shadow);white-space:nowrap}
.icon{width:46px;height:46px;border-radius:50%;background:var(--card);box-shadow:0 4px 0 var(--shadow);font-size:23px;display:grid;place-items:center;flex:none}
.icon:active{transform:translateY(3px);box-shadow:0 1px 0 var(--shadow)}
.tsets{position:absolute;right:12px;top:66px;z-index:4;display:flex;gap:8px}
.floaties{position:absolute;inset:0;pointer-events:none;z-index:1}
.fl{position:absolute;bottom:-60px;left:var(--x);width:var(--s);height:var(--s);border-radius:50%;
  background:radial-gradient(circle at 32% 30%,#fff 0 18%,rgba(255,255,255,.35) 19% 60%,rgba(94,196,255,.35) 100%);
  border:2px solid rgba(255,255,255,.8);animation:rise var(--d) linear infinite;animation-delay:var(--dl)}
@keyframes rise{to{transform:translate(var(--w),-115vh)}}

/* ---------- game ---------- */
#game.on{display:grid;grid-template-columns:minmax(0,1fr);grid-template-rows:auto 1fr auto;height:100%;min-width:0}
.bar{display:flex;align-items:center;gap:8px;padding:10px 12px 4px}
.bar .pill{font-size:clamp(14px,3.8vw,18px)}
.bar .grow{flex:1}
.stage{min-width:0;min-height:0;display:flex;flex-direction:column;gap:8px;padding:6px 12px 10px}
.order{min-width:0;width:100%;max-width:100%;display:flex;align-items:center;gap:10px;background:var(--card);border-radius:22px;padding:6px 8px 6px 6px;box-shadow:0 5px 0 var(--shadow);flex:none;cursor:pointer}
.order-mid{flex:1;min-width:0}
.order-t{font-family:var(--disp);font-weight:400;font-size:clamp(13px,3.6vw,18px);color:var(--pink);margin-bottom:3px}
.order svg{width:clamp(58px,16vw,84px);flex:none;display:block;aspect-ratio:400/460;border-radius:16px}
.chips{display:flex;flex-wrap:wrap;gap:4px}
.chip{font-size:clamp(10px,2.7vw,13px);padding:3px 7px;border-radius:999px;background:var(--bg1);opacity:.75;white-space:nowrap}
@media (max-width:360px){.chip .lbl{display:none}.order-t{font-size:13px}.order svg{width:52px}#game .bar{gap:4px;padding:6px 6px 2px}#game .bar .icon{width:38px;height:38px;font-size:20px}#game .bar .pill{font-size:12px;padding:5px 8px}}
.chip.ok{background:var(--mint);color:#fff;opacity:1}
.chip.bonus{background:var(--sun);color:#4A2A5C;opacity:1}
.mwrap{flex:1;min-width:0;min-height:0;position:relative;display:grid;place-items:center;container-type:size;padding:10px;touch-action:none}
.mirror{position:relative;aspect-ratio:400/460;height:100%;height:min(100cqh,100cqw * 460 / 400);max-height:100%;max-width:100%}
.glass{position:absolute;inset:0;border-radius:48% 48% 42% 42%/40% 40% 32% 32%;border:10px solid var(--sun);overflow:hidden;box-shadow:0 10px 0 var(--shadow)}
.glass svg{width:100%;height:100%;display:block}
.bulb{position:absolute;width:14px;height:14px;margin:-7px 0 0 -7px;border-radius:50%;background:#FFF7CF;
  box-shadow:0 0 10px 4px #FFE27A;animation:twk 1.4s ease-in-out infinite alternate;animation-delay:calc(var(--i) * -0.23s);z-index:2;pointer-events:none}
@keyframes twk{from{opacity:.45;transform:scale(.8)}to{opacity:1;transform:scale(1.1)}}
.enter{animation:enter .7s cubic-bezier(.3,1.4,.5,1)}
@keyframes enter{from{transform:translateX(70%) rotate(8deg);opacity:0}to{transform:none;opacity:1}}
.wobble{animation:wob .4s}
@keyframes wob{25%{transform:rotate(-3deg)}75%{transform:rotate(3deg)}}
.eyes{transform-box:fill-box;transform-origin:center;animation:blink 4s infinite}
@keyframes blink{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.1)}}
.twinkle{animation:twk .8s ease-in-out infinite alternate}
.popin{animation:popin .45s cubic-bezier(.3,1.7,.5,1)}
@keyframes popin{from{transform:scale(.3)}to{transform:scale(1)}}
.say{position:absolute;right:4px;top:4px;width:max-content;max-width:min(70%,300px);background:#fff;color:#4A2A5C;border-radius:20px;padding:8px 12px;
  font-size:clamp(14px,3.8vw,19px);box-shadow:0 5px 0 rgba(0,0,0,.12);opacity:0;transform:scale(.4);transform-origin:20% 100%;
  transition:opacity .2s,transform .3s cubic-bezier(.3,1.7,.5,1);z-index:6;pointer-events:none;border:3px solid var(--pink)}
.say.show{opacity:1;transform:scale(1)}
.done{flex:none;font-family:var(--disp);font-weight:400;font-size:clamp(17px,4.8vw,24px);white-space:nowrap;
  padding:.45em .8em;margin-bottom:6px;border-radius:999px;background:var(--mint);color:#fff;box-shadow:0 7px 0 var(--mintd)}
.done:active{transform:translateY(5px);box-shadow:0 2px 0 var(--mintd)}
.done.ready{animation:breathe .9s ease-in-out infinite;background:var(--pink);box-shadow:0 7px 0 var(--pinkd)}

.controls{padding:0 10px 10px;min-width:0}
.panel{min-height:96px;background:var(--card);border-radius:26px;box-shadow:0 5px 0 var(--shadow);display:flex;flex-wrap:nowrap;
  align-items:center;justify-content:center;gap:8px;padding:8px 10px;margin-bottom:10px}
.panel:has(.tip){flex-wrap:wrap}
.panel.scroll{justify-content:flex-start;overflow-x:auto;overflow-y:hidden;touch-action:pan-x;scrollbar-width:none;padding-bottom:12px}
.panel.scroll::-webkit-scrollbar{display:none}
.tip{display:flex;align-items:center;gap:10px;font-size:clamp(15px,4.2vw,20px)}
.tipicon{font-size:36px;animation:hop 1s ease-in-out infinite;--r:8deg;display:inline-block}
.len{display:flex;gap:4px;width:100%;justify-content:center}
.len span{font-size:12px;padding:3px 10px;border-radius:999px;background:var(--bg1)}
.len span.on{background:var(--sky);color:#fff}
.opt{background:var(--bg2);border-radius:18px;padding:6px 2px 4px;flex:1 1 0;min-width:0;max-width:76px;display:flex;flex-direction:column;align-items:center;gap:2px;
  box-shadow:0 4px 0 var(--shadow);transition:transform .1s;position:relative}
.panel.scroll .opt{flex:0 0 62px;max-width:none}
.opt:active{transform:translateY(3px)}
.opt small{font-size:clamp(9px,2.6vw,12px);white-space:nowrap;letter-spacing:-.04em}
.opt.on{background:var(--sun);color:#4A2A5C;transform:translateY(-3px)}
.opt .dot{width:clamp(28px,8vw,40px);aspect-ratio:1;border-radius:50%;border:4px solid #fff;box-shadow:0 2px 6px rgba(0,0,0,.2)}
.opt svg{width:clamp(38px,11vw,52px);height:auto;aspect-ratio:1}
.opt .em{font-size:clamp(24px,7.5vw,34px);line-height:1.2}
.tools{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.tool{background:var(--card);border-radius:18px;box-shadow:0 5px 0 var(--shadow);padding:6px 0 4px;display:flex;flex-direction:column;align-items:center;
  transition:transform .12s;min-width:0;overflow:hidden}
.tool .em{font-size:clamp(24px,7vw,34px);line-height:1.2}
.tool small{font-size:clamp(8.5px,2.45vw,12px);white-space:nowrap;letter-spacing:-.06em}
.tool.on{background:var(--sun);color:#4A2A5C;transform:translateY(-5px)}
.tool:active{transform:translateY(2px)}

@media (orientation:landscape){
  #game.on{grid-template-columns:1fr minmax(300px,38%);grid-template-rows:auto 1fr}
  .bar{grid-column:1/-1}
  .stage{flex-direction:row;padding:4px 4px 12px 12px}
  .order{flex-direction:column;justify-content:center;width:clamp(110px,16vw,190px);padding:8px;text-align:center}
  .order svg{width:100%}
  .chips{justify-content:center}
  .done{margin:4px 0 6px}
  .controls{grid-column:2;grid-row:2;display:flex;flex-direction:column;justify-content:center;padding:0 16px 16px 4px}
  .panel{min-height:150px;flex-wrap:wrap}
  .panel.scroll{flex-wrap:wrap;justify-content:center;overflow:visible;touch-action:manipulation}
  .panel.scroll .opt{flex:0 0 calc(25% - 8px)}
  .opt{flex:0 0 calc(33% - 8px);max-width:none}
  .tools{grid-template-columns:repeat(4,1fr);gap:10px}
  .tool{padding:10px 0 6px}
  .tool small{font-size:12px;letter-spacing:0}
}
@media (orientation:landscape) and (max-height:540px){
  .bar{padding:6px 12px 2px}
  .bar .icon{width:40px;height:40px;font-size:20px}
  .order{width:110px;padding:6px;gap:4px}
  .order svg{width:62%}
  .order-t{display:none}
  .chip{font-size:10px;padding:2px 6px}
  .done{font-size:17px}
  .controls{padding:0 12px 10px 0}
  .panel,.panel.scroll{min-height:0;padding:6px;gap:6px;margin-bottom:8px;flex-wrap:nowrap}
  .panel.scroll{justify-content:flex-start;overflow-x:auto;touch-action:pan-x}
  .panel:has(.tip){flex-wrap:wrap}
  .tip{font-size:14px}.tipicon{font-size:26px}
  .opt{flex:1 1 0;max-width:64px}
  .panel.scroll .opt{flex:0 0 50px}
  .opt .dot{width:26px}.opt svg{width:34px}.opt .em{font-size:22px}
  .tools{gap:6px}
  .tool{padding:4px 0 2px}
  .tool .em{font-size:22px}
  .tool small{font-size:10px}
}

/* ---------- shop ---------- */
#shop.on{display:flex;flex-direction:column;height:100%}
.shop-title{font-family:var(--disp);font-weight:400;font-size:clamp(22px,6vw,30px);color:var(--pink)}
.shopbody{flex:1;min-height:0;overflow-y:auto;padding:4px 14px 24px;touch-action:pan-y;-webkit-overflow-scrolling:touch}
.shop-h{font-family:var(--disp);font-weight:400;font-size:clamp(17px,4.6vw,22px);margin:16px 4px 10px}
.sgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(40vw,150px),1fr));gap:12px}
.sitem{background:var(--card);border-radius:22px;box-shadow:0 5px 0 var(--shadow);padding:10px 8px;display:flex;flex-direction:column;align-items:center;gap:6px}
.sitem svg{width:78%;aspect-ratio:1;border-radius:18px}
.sitem .nm{font-size:15px}
.buy{font-size:16px;padding:6px 16px;border-radius:999px;background:var(--sun);color:#4A2A5C;box-shadow:0 4px 0 var(--sund)}
.buy:active{transform:translateY(3px);box-shadow:0 1px 0 var(--sund)}
.buy.no{background:var(--bg1);color:var(--ink);box-shadow:0 4px 0 var(--shadow)}
.owned{font-size:14px;color:#fff;background:var(--mint);border-radius:999px;padding:6px 14px}
.toast{position:fixed;left:0;right:0;margin:auto;top:calc(var(--sat,env(safe-area-inset-top,0px)) + 70px);transform-origin:50% 0}

/* ---------- result ---------- */
.overlay{position:fixed;inset:0;background:rgba(74,42,92,.55);display:grid;place-items:center;z-index:40;padding:16px}
.rcard{background:var(--card);border-radius:32px;padding:16px 20px 20px;text-align:center;width:min(92vw,440px);box-shadow:0 10px 0 var(--shadow);
  animation:popin .5s cubic-bezier(.3,1.6,.5,1);max-height:100%;overflow:auto}
.rstars{font-size:clamp(40px,12vw,58px);letter-spacing:4px;height:1.2em}
.rstars span{display:inline-block;filter:grayscale(1);opacity:.3;transition:.2s}
.rstars span.lit{filter:none;opacity:1;animation:popin .45s cubic-bezier(.3,1.9,.5,1)}
.rpics{display:flex;justify-content:center;align-items:flex-end;gap:12px;margin:4px 0}
.rpics figure{margin:0;font-size:13px}
.rpics svg{display:block;aspect-ratio:400/460;margin:0 auto 4px}
#rTarget{width:min(22vw,86px);border:4px solid var(--lilac);border-radius:16px}
#rPic{width:min(42vw,170px);border:7px solid var(--sun);border-radius:24px}
.rmsg{font-family:var(--disp);font-weight:400;font-size:clamp(18px,5vw,24px);margin:6px 0 2px;line-height:1.4}
.rnote{font-size:14px;margin:0 0 2px;color:var(--mintd)}
.rtip{font-size:14px;margin:0 0 2px;color:var(--lilac)}
.rcoin{font-size:clamp(24px,7vw,32px);margin:4px 0 8px}
.rrank{background:linear-gradient(90deg,var(--pink),var(--lilac));color:#fff;border-radius:16px;padding:8px;margin:0 0 12px;animation:popin .5s cubic-bezier(.3,1.7,.5,1)}
.rbtns{display:flex;flex-direction:column;align-items:center;gap:12px}
.rbtns .big{font-size:clamp(20px,5.6vw,28px)}
.subrow{display:flex;gap:14px;justify-content:center;flex-wrap:wrap}
.sub{background:none;text-decoration:underline;font-size:16px;padding:6px}
.sub.hot{color:var(--pink)}
.ask{font-family:var(--disp);font-weight:400;font-size:clamp(20px,5.6vw,26px);margin:6px 0 18px}
.askbtns{display:flex;gap:14px;justify-content:center}
.askbtns .big{font-size:clamp(18px,5vw,24px);padding:.4em 1.1em}

@media (orientation:landscape) and (max-height:540px){
  #title.on{padding:60px 16px 12px 34vw;gap:10px}
  .sign .row1{font-size:clamp(26px,8vh,52px)}
  .sign .row2{font-size:clamp(32px,10vh,66px)}
  .tmirror{position:absolute;left:5vw;top:50%;translate:0 -40%;width:min(24vw,46vh)}
  .tbtns{flex-direction:row;gap:14px}
  .big{font-size:clamp(20px,6.5vh,32px)}
  .rcard{width:min(94vw,620px);display:grid;grid-template-columns:auto 1fr;gap:2px 16px;align-items:center;padding:12px 16px}
  .rpics{grid-row:1/span 8;grid-column:1}
  #rPic{width:min(22vw,130px)}#rTarget{width:60px}
  .rstars{font-size:36px}
  .rmsg{font-size:18px;margin:2px 0}
  .rcoin{font-size:22px;margin:0 0 4px}
  .rrank{padding:4px;margin:0 0 6px;font-size:14px}
  .rbtns{gap:2px}
}

/* ---------- fx ---------- */
#fx{position:fixed;inset:0;pointer-events:none;z-index:60;overflow:hidden}
.fxp{position:absolute;font-size:var(--fs,22px);animation:burst var(--dur,.8s) ease-out forwards;transform:translate(-50%,-50%)}
@keyframes burst{from{transform:translate(-50%,-50%) scale(.3);opacity:1}70%{opacity:1}
  to{transform:translate(calc(-50% + var(--dx)),calc(-50% + var(--dy))) scale(1) rotate(var(--rot));opacity:0}}
.bit{width:5px;height:22px;border-radius:4px;animation-timing-function:cubic-bezier(.3,0,.8,1)}
.coinfly{animation-timing-function:cubic-bezier(.5,0,.7,1)}
.conf{position:absolute;top:-24px;width:11px;height:15px;border-radius:3px;animation:fall var(--dur) linear forwards;animation-delay:var(--dl)}
@keyframes fall{to{transform:translate(var(--dx),112vh) rotate(var(--rot))}}
#cursor{position:fixed;left:0;top:0;font-size:48px;pointer-events:none;z-index:70;display:none;filter:drop-shadow(0 4px 4px rgba(0,0,0,.25))}
.bubin{transform-box:fill-box;transform-origin:center;animation:popin .3s cubic-bezier(.3,1.8,.5,1)}
.bubout{transform-box:fill-box;transform-origin:center;animation:bubout .25s forwards}
@keyframes bubout{to{transform:scale(1.6);opacity:0}}
@media (prefers-reduced-motion:reduce){
  .sign span.ch,#playBtn,.fl,.bulb,.done.ready,.tipicon,.badge{animation:none}
}
</style>
<script src="/games/safe_area.js"></script>
<script src="/games/wakuwaku_bgm.js"></script>
<script src="/games/analytics_bridge.js"></script>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
  <linearGradient id="gRainbow" gradientUnits="userSpaceOnUse" x1="0" y1="50" x2="0" y2="440">
    <stop offset="0" stop-color="#FF6B8B"/><stop offset=".2" stop-color="#FFB347"/><stop offset=".4" stop-color="#FFE066"/>
    <stop offset=".6" stop-color="#6EE7A8"/><stop offset=".8" stop-color="#5EC4FF"/><stop offset="1" stop-color="#A47BFF"/></linearGradient>
  <linearGradient id="gSilver" gradientUnits="userSpaceOnUse" x1="100" y1="80" x2="300" y2="420">
    <stop offset="0" stop-color="#FFFFFF"/><stop offset=".5" stop-color="#CDD3DE"/><stop offset="1" stop-color="#97A0B0"/></linearGradient>
</defs></svg>

<!-- ===== title ===== -->
<section id="title" class="screen" aria-label="スタートがめん">
  <div class="awning"></div>
  <div class="floaties" id="floaties"></div>
  <div class="tsets"><button class="icon" data-voice aria-label="よみあげ">🗣️</button><button class="icon" data-sound aria-label="おと">🔊</button></div>
  <h1 class="sign" id="sign"></h1>
  <div class="tmirror mirror-bg"><svg id="tPic" viewBox="0 0 400 460"></svg></div>
  <div class="tbtns">
    <button class="big" id="playBtn">あそぶ！</button>
    <button class="big alt mid" id="shopBtn">🛍️ おみせ<span class="badge" id="shopBadge" hidden>かえるよ！</span></button>
  </div>
  <div class="tstats" id="tStats"></div>
</section>

<!-- ===== shop ===== -->
<section id="shop" class="screen" aria-label="おみせ">
  <header class="bar">
    <button class="icon" id="shopBack" aria-label="もどる">🏠</button>
    <div class="shop-title">おみせ</div>
    <div class="grow"></div>
    <div class="pill">🪙 <b id="sCoin">0</b></div>
  </header>
  <div class="shopbody" id="shopBody"></div>
  <div class="say toast" id="sToast"></div>
</section>

<!-- ===== game ===== -->
<section id="game" class="screen" aria-label="ゲーム">
  <header class="bar">
    <button class="icon" id="homeBtn" aria-label="タイトルへ">🏠</button>
    <div class="pill">🪙 <b id="coinN">0</b></div>
    <div class="pill">💇 <b id="custN">1</b>にんめ</div>
    <div class="grow"></div>
    <button class="icon" data-voice aria-label="よみあげ">🗣️</button>
    <button class="icon" data-sound aria-label="おと">🔊</button>
  </header>
  <main class="stage" id="stage">
    <div class="order" id="order" role="button" aria-label="おねがいを もういちど きく">
      <svg id="orderPic" class="mirror-bg" viewBox="0 0 400 460"></svg>
      <div class="order-mid">
        <div class="order-t">おねがい！ 🔈</div>
        <div class="chips" id="chips"></div>
      </div>
      <button class="done" id="doneBtn">できた！</button>
    </div>
    <div class="mwrap">
      <div class="mirror" id="mirror">
        <div class="glass mirror-bg" id="glass">
          <svg id="sv" viewBox="0 0 400 460"><g id="char"></g><g id="bubbles"></g></svg>
        </div>
      </div>
      <div class="say" id="say"></div>
    </div>
  </main>
  <section class="controls">
    <div class="panel" id="panel"></div>
    <nav class="tools" id="tools"></nav>
  </section>
</section>

<!-- ===== result ===== -->
<div class="overlay" id="result" hidden>
  <div class="rcard">
    <div class="rstars" id="rStars"><span>⭐</span><span>⭐</span><span>⭐</span></div>
    <div class="rpics">
      <figure><svg id="rTarget" class="mirror-bg" viewBox="0 0 400 460"></svg>おねがい</figure>
      <figure><svg id="rPic" class="mirror-bg" viewBox="0 0 400 460"></svg>できあがり</figure>
    </div>
    <p class="rmsg" id="rMsg"></p>
    <p class="rnote" id="rNote"></p>
    <p class="rtip" id="rTip"></p>

    <div class="rrank" id="rRank" hidden></div>
    <div class="rbtns">
      <button class="big" id="nextBtn">つぎの おきゃくさん</button>
      <div class="subrow">
        <button class="sub hot" id="rShop" hidden>🛍️ おみせで かえるよ！</button>
        <button class="sub" id="toTitle">タイトルへ もどる</button>
      </div>
    </div>
  </div>
</div>

<div class="overlay" id="confirm" hidden>
  <div class="rcard">
    <p class="ask">タイトルに もどる？</p>
    <div class="askbtns"><button class="big alt" id="stayBtn">あそぶ</button><button class="big" id="leaveBtn">もどる</button></div>
  </div>
</div>

<div id="fx"></div>
<div id="cursor"></div>

<script>
const SAFE_LS = (function () {
  try {
    const testKey = "__ww_storage_test__";
    localStorage.setItem(testKey, testKey);
    localStorage.removeItem(testKey);
    return localStorage;
  } catch (e) {
    const memory = Object.create(null);
    return {
      getItem(key) { return Object.prototype.hasOwnProperty.call(memory, key) ? memory[key] : null; },
      setItem(key, value) { memory[key] = String(value); },
      removeItem(key) { delete memory[key]; }
    };
  }
})();

const $=s=>document.querySelector(s);
const $$=s=>[...document.querySelectorAll(s)];
const ri=n=>Math.floor(Math.random()*n);
const pick=a=>a[ri(a.length)];
const KEY='wakuwaku-dressup-v3-yumeiro-salon';

/* ---------- data ---------- */
const COLORS=[
  {id:'brown',c:'#9A5B34',n:'ちゃいろ'},{id:'black',c:'#3B2B35',n:'くろ'},{id:'gold',c:'#F5BE36',n:'きんいろ'},
  {id:'pink',c:'#FF86C2',n:'ピンク'},{id:'blue',c:'#56C6FF',n:'みずいろ'},{id:'purple',c:'#A47BFF',n:'むらさき'},
  {id:'silver',c:'url(#gSilver)',css:'linear-gradient(135deg,#FFFFFF,#CDD3DE,#97A0B0)',n:'ぎんいろ',price:30},
  {id:'rainbow',c:'url(#gRainbow)',css:'linear-gradient(135deg,#FF6B8B,#FFB347,#FFE066,#6EE7A8,#5EC4FF,#A47BFF)',n:'にじいろ',price:60}];
const STYLES=[{id:'straight',n:'さらさら'},{id:'curly',n:'くるくる'},{id:'twin',n:'ツインテール'},{id:'bun',n:'おだんご'},{id:'pony',n:'ポニーテール'}];
const ACCS=[
  {id:'ribbon',e:'🎀',n:'リボン'},{id:'crown',e:'👑',n:'かんむり'},{id:'flower',e:'🌸',n:'おはな'},{id:'star',e:'⭐',n:'ほし'},
  {id:'heart',e:'💗',n:'ハート',price:20},{id:'cherry',e:'🍒',n:'さくらんぼ',price:25},
  {id:'hat',e:'👒',n:'ぼうし',price:35,verb:'を かぶってね'},{id:'glasses',e:'👓',n:'めがね',price:45,verb:'を かけてね'},
  {id:'none',e:'✖️',n:'なし'}];
const LENS=['みじかい','ふつう','ながい'];
const LENP=['みじかくて','ふつうの ながさで','ながくて'];
const CUSTOMERS=[
  {id:'hina',name:'ひなちゃん',skin:'#FFDCC6'},{id:'riku',name:'りくくん',skin:'#EDB892'},{id:'aoi',name:'あおいちゃん',skin:'#C98E6B'},
  {id:'mimi',name:'ミミちゃん',skin:'#FFF3F7',ears:'rabbit',earIn:'#FFB3CC'},{id:'nyao',name:'ニャオくん',skin:'#FFE2B8',ears:'cat',earIn:'#FFAE8A'},
  {id:'kuma',name:'くまたろう',skin:'#D9A47A',ears:'bear',earIn:'#F4CDA9'},{id:'runa',name:'ルナちゃん',skin:'#E9E2FF',ears:'cat',earIn:'#FFB3D9'},
  {id:'fox',name:'コンちゃん',skin:'#FFC78A',ears:'cat',earIn:'#FFF4E6',price:40},
  {id:'sheep',name:'メエちゃん',skin:'#FFF6E8',ears:'sheep',earIn:'#F7D2BE',price:40},
  {id:'panda',name:'パンパン',skin:'#FFFFFF',ears:'bear',earOut:'#2E2A33',earIn:'#2E2A33',patch:true,price:55}];
const TOOLS=[
  {id:'shampoo',e:'🫧',n:'あわあわ',tip:'あたまを ごしごし こすってね'},
  {id:'dryer',e:'💨',n:'ドライヤー',tip:'こすって あわを ふきとばそう'},
  {id:'cut',e:'✂️',n:'はさみ',tip:'かみを タップで ちょきん！'},
  {id:'grow',e:'🪄',n:'のびーる',tip:'タップで かみが のびるよ'},
  {id:'color',e:'🎨',n:'いろ',tip:'すきな いろを えらんでね'},
  {id:'style',e:'💇',n:'かたち',tip:'かみの かたちを えらんでね'},
  {id:'acc',e:'🎀',n:'かざり',tip:'かざりを えらんでね'}];
const RANKS=[[0,'みならい'],[3,'スタイリスト'],[8,'にんきスタイリスト'],[15,'スーパースタイリスト'],[25,'カリスマびようし']];
const PRAISE=['いいね！','すてき〜！','わあ！','それそれ！','かわいい！'];
const MSG={3:['だいせいこう！ ゆめみたい！','かんぺき！ だいすき！'],2:['かわいい！ ありがとう！','すてき！ きにいったよ！'],1:['あたらしい かみがた、うれしい！','すてきに なったね！ また くるね！']};
const rankOf=n=>RANKS.filter(r=>n>=r[0]).pop()[1];
const colorFill=id=>COLORS.find(c=>c.id===id).c;
const colorCss=id=>{const c=COLORS.find(x=>x.id===id);return c.css||c.c};
const nameOf=(list,id)=>list.find(x=>x.id===id).n;

let save={coins:0,served:0,sound:true,voice:true,owned:[]};
try{const v=SAFE_LS.getItem(KEY);if(v)save={...save,...JSON.parse(v)}}catch(e){}
if(!Array.isArray(save.owned))save.owned=[];
try{if(typeof WakuwakuBGM!=='undefined'&&WakuwakuBGM.loadState)save.sound=WakuwakuBGM.loadState()}catch(e){}
function persist(){
  try{SAFE_LS.setItem(KEY,JSON.stringify(save))}catch(e){}
  try{if(typeof WakuwakuBGM!=='undefined'&&WakuwakuBGM.saveState)WakuwakuBGM.saveState(save.sound)}catch(e){}
}
const owns=k=>save.owned.includes(k);
const availColors=()=>COLORS.filter(c=>!c.price||owns('col:'+c.id));
const availAccs=()=>ACCS.filter(a=>!a.price||owns('acc:'+a.id));
const availCust=()=>CUSTOMERS.filter(c=>!c.price||owns('cust:'+c.id));
const SHOP=[
  ...ACCS.filter(a=>a.price).map(a=>({key:'acc:'+a.id,kind:'acc',id:a.id,name:a.n,price:a.price})),
  ...COLORS.filter(c=>c.price).map(c=>({key:'col:'+c.id,kind:'col',id:c.id,name:c.n,price:c.price})),
  ...CUSTOMERS.filter(c=>c.price).map(c=>({key:'cust:'+c.id,kind:'cust',id:c.id,name:c.name,price:c.price}))];
const canBuySomething=()=>SHOP.some(s=>!owns(s.key)&&s.price<=save.coins);

/* ---------- sound ---------- */
let AC=null;
function ac(){if(!AC){try{AC=new(window.AudioContext||window.webkitAudioContext)()}catch(e){}}if(AC&&AC.state==='suspended')AC.resume();return AC}
function tone(f,d=.15,type='sine',v=.15,t0=0,f2){
  if(!save.sound)return;const a=ac();if(!a)return;const t=a.currentTime+t0;
  const o=a.createOscillator(),g=a.createGain();o.type=type;o.frequency.setValueAtTime(f,t);
  if(f2)o.frequency.exponentialRampToValueAtTime(f2,t+d);
  g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(v,t+.01);g.gain.exponentialRampToValueAtTime(.0001,t+d);
  o.connect(g).connect(a.destination);o.start(t);o.stop(t+d+.03);
}
function noise(d=.08,v=.2,freq=3000,type='highpass',t0=0){
  if(!save.sound)return;const a=ac();if(!a)return;const t=a.currentTime+t0;
  const b=a.createBuffer(1,Math.floor(a.sampleRate*d),a.sampleRate),ch=b.getChannelData(0);
  for(let i=0;i<ch.length;i++)ch[i]=Math.random()*2-1;
  const s=a.createBufferSource();s.buffer=b;const fl=a.createBiquadFilter();fl.type=type;fl.frequency.value=freq;
  const g=a.createGain();g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);
  s.connect(fl).connect(g).connect(a.destination);s.start(t);
}
const SFX={
  tap:()=>tone(660,.08,'triangle',.12),
  pop:()=>tone(500+Math.random()*300,.09,'sine',.1,0,1400),
  snip:()=>{noise(.05,.3,4000);noise(.05,.25,5000,'highpass',.08)},
  sparkle:()=>[1047,1319,1568,2093].forEach((f,i)=>tone(f,.2,'triangle',.08,i*.06)),
  ding:()=>{tone(1319,.25,'sine',.15);tone(1760,.35,'sine',.1,.08)},
  boop:()=>tone(240,.2,'square',.05,0,170),
  whoosh:()=>noise(.2,.1,900,'lowpass'),
  coin:()=>{tone(988,.08,'square',.05);tone(1319,.22,'square',.05,.08)},
  fanfare:()=>[523,659,784,1047,784,1047].forEach((f,i)=>tone(f,i===5?.6:.16,'triangle',.14,i*.13)),
  color:()=>tone(380,.3,'sine',.12,0,950),
  star:i=>tone([784,988,1319][i],.3,'triangle',.14),
  clap:()=>{for(let i=0;i<8;i++)noise(.05,.18,1500,'bandpass',i*.11+Math.random()*.04)}
};

/* ---------- voice ---------- */
const HAS_TTS='speechSynthesis' in window;
let JA=null;
function loadVoices(){try{JA=speechSynthesis.getVoices().find(v=>/^ja/i.test(v.lang))||null}catch(e){}}
if(HAS_TTS){loadVoices();try{speechSynthesis.addEventListener('voiceschanged',loadVoices)}catch(e){}}
const EMOJI=/[\u{1F000}-\u{1FAFF}\u{2600}-\u{27BF}\u{2B00}-\u{2BFF}\u{FE0F}\u{200D}〜♪✔！]/gu;
function speak(t){
  if(!save.voice||!HAS_TTS)return;
  const txt=t.replace(EMOJI,' ').replace(/\s+/g,' ').trim();if(!txt)return;
  try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(txt);u.lang='ja-JP';if(JA)u.voice=JA;u.rate=1;u.pitch=1.25;speechSynthesis.speak(u)}catch(e){}
}
function requestText(t){
  const a=ACCS.find(x=>x.id===t.acc);
  return `${LENP[t.length]} ${nameOf(STYLES,t.style)}の、${nameOf(COLORS,t.color)}の かみに して、${a.n}${a.verb||'を つけてね'}`;
}
function syncToggles(){
  $$('[data-sound]').forEach(b=>b.textContent=save.sound?'🔊':'🔈');
  $$('[data-voice]').forEach(b=>{b.textContent=save.voice?'🗣️':'🙊';b.hidden=!HAS_TTS});
}
document.addEventListener('click',e=>{
  if(e.target.closest('[data-sound]')){save.sound=!save.sound;persist();syncToggles();SFX.tap()}
  else if(e.target.closest('[data-voice]')){save.voice=!save.voice;persist();syncToggles();SFX.tap();if(save.voice)speak('よみあげ オン');else if(HAS_TTS)try{speechSynthesis.cancel()}catch(e){}}
});

/* ---------- drawing ---------- */
function backPath(B){
  if(B<300)return `M92 215 C92 92 308 92 308 215 L308 ${B} Q200 ${B+22} 92 ${B} Z`;
  return `M92 215 C92 92 308 92 308 215 L308 ${B} Q290 ${B+16} 262 ${B} L258 300 Q200 300 142 300 L138 ${B} Q110 ${B+16} 92 ${B} Z`;
}
function curls(B,split){
  const c=(x,y,r=21)=>`<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="${r}"/>`;let s='';
  for(let a=200;a<=340;a+=14){const t=a*Math.PI/180;s+=c(200+112*Math.cos(t),200+100*Math.sin(t))}
  for(let y=200;y<=B;y+=24){s+=c(92,y)+c(308,y)}
  if(split){for(let x=96;x<=140;x+=22)s+=c(x,B);for(let x=260;x<=304;x+=22)s+=c(x,B)}
  else for(let x=100;x<=300;x+=25)s+=c(x,B,18);
  return s;
}
function tail(sx,L){const x=sx<0?86:314;
  return `<path d="M${x} 188 C${x+sx*62} 200 ${x+sx*50} ${190+L} ${x+sx*12} ${204+L} C${x-sx*22} ${190+L*.7} ${x-sx*12} 214 ${x} 188 Z"/>`}
function earsSVG(c){const f=c.earOut||c.skin,i=c.earIn||'#FFB3C7';
  if(c.ears==='cat')return `<path d="M106 168 L118 66 L180 120 Z" fill="${f}"/><path d="M119 150 L126 92 L162 124 Z" fill="${i}"/><path d="M294 168 L282 66 L220 120 Z" fill="${f}"/><path d="M281 150 L274 92 L238 124 Z" fill="${i}"/>`;
  if(c.ears==='rabbit')return `<g transform="rotate(-12 160 120)"><ellipse cx="160" cy="58" rx="25" ry="64" fill="${f}"/><ellipse cx="160" cy="62" rx="11" ry="46" fill="${i}"/></g><g transform="rotate(12 240 120)"><ellipse cx="240" cy="58" rx="25" ry="64" fill="${f}"/><ellipse cx="240" cy="62" rx="11" ry="46" fill="${i}"/></g>`;
  if(c.ears==='bear')return `<circle cx="120" cy="116" r="32" fill="${f}"/><circle cx="120" cy="116" r="16" fill="${i}"/><circle cx="280" cy="116" r="32" fill="${f}"/><circle cx="280" cy="116" r="16" fill="${i}"/>`;
  if(c.ears==='sheep')return `<g transform="rotate(28 66 196)"><ellipse cx="66" cy="196" rx="40" ry="17" fill="${f}"/><ellipse cx="70" cy="196" rx="26" ry="9" fill="${i}"/></g><g transform="rotate(-28 334 196)"><ellipse cx="334" cy="196" rx="40" ry="17" fill="${f}"/><ellipse cx="330" cy="196" rx="26" ry="9" fill="${i}"/></g>`;
  return '';
}
function faceSVG(c,face){
  const ec=c.patch?'#FFFFFF':'#3A2340',hl=c.patch?'#3A2340':'#FFFFFF';
  let s=`<circle cx="200" cy="222" r="90" fill="${c.skin}"/>`;
  if(c.patch)s+=`<ellipse cx="166" cy="230" rx="24" ry="29" fill="#2E2A33" transform="rotate(-24 166 230)"/><ellipse cx="234" cy="230" rx="24" ry="29" fill="#2E2A33" transform="rotate(24 234 230)"/>`;
  if(c.ears)s+=`<ellipse cx="200" cy="252" rx="8" ry="6" fill="${c.patch?'#2E2A33':'#E07A9A'}"/>`;
  if(face==='happy')s+=`<g fill="none" stroke="${ec}" stroke-width="7" stroke-linecap="round"><path d="M154 232 Q168 212 182 232"/><path d="M218 232 Q232 212 246 232"/></g>`;
  else s+=`<g class="eyes"><ellipse cx="168" cy="228" rx="10" ry="13" fill="${ec}"/><ellipse cx="232" cy="228" rx="10" ry="13" fill="${ec}"/><circle cx="171" cy="223" r="4" fill="${hl}"/><circle cx="235" cy="223" r="4" fill="${hl}"/></g>`;
  s+=`<ellipse cx="146" cy="258" rx="15" ry="9" fill="#FF8FB1" opacity=".55"/><ellipse cx="254" cy="258" rx="15" ry="9" fill="#FF8FB1" opacity=".55"/>`;
  if(face==='happy')s+=`<path d="M180 266 Q200 300 220 266 Z" fill="#D9416E"/>`;
  else if(face==='wow')s+=`<ellipse cx="200" cy="276" rx="9" ry="11" fill="#D9416E"/>`;
  else s+=`<path d="M188 270 Q200 282 212 270" fill="none" stroke="#3A2340" stroke-width="5" stroke-linecap="round"/>`;
  return s;
}
function starPts(cx,cy,R,r){let p=[];for(let i=0;i<10;i++){const a=-Math.PI/2+i*Math.PI/5,d=i%2?r:R;p.push((cx+d*Math.cos(a)).toFixed(1)+','+(cy+d*Math.sin(a)).toFixed(1))}return p.join(' ')}
function accSVG(a){
  switch(a){
  case 'ribbon':return `<g transform="translate(262 128) rotate(15)"><path d="M0 0 L-40 -24 L-36 26 Z" fill="#FF4F9A"/><path d="M0 0 L40 -24 L36 26 Z" fill="#FF4F9A"/><circle r="12" fill="#FF8CC0"/></g>`;
  case 'crown':return `<g transform="translate(200 96)"><path d="M-50 18 L-54 -26 L-27 0 L0 -38 L27 0 L54 -26 L50 18 Z" fill="#FFC93C" stroke="#E0A10F" stroke-width="5" stroke-linejoin="round"/><circle cx="0" cy="3" r="8" fill="#FF5FA2"/><circle cx="-31" cy="8" r="5" fill="#5EC4FF"/><circle cx="31" cy="8" r="5" fill="#5EC4FF"/></g>`;
  case 'flower':{let s='<g transform="translate(266 136)">';for(let i=0;i<5;i++){const t=i*72*Math.PI/180-Math.PI/2;s+=`<circle cx="${(17*Math.cos(t)).toFixed(1)}" cy="${(17*Math.sin(t)).toFixed(1)}" r="15" fill="#FFA9CF"/>`}return s+'<circle r="11" fill="#FFD43B"/></g>'}
  case 'star':return `<polygon points="${starPts(262,130,30,13)}" fill="#FFD43B" stroke="#F0A800" stroke-width="4" stroke-linejoin="round"/>`;
  case 'heart':return `<g transform="translate(262 134) rotate(12)"><path d="M0 22 C-40 0 -28 -34 0 -14 C28 -34 40 0 0 22 Z" fill="#FF4F7B" stroke="#E0285A" stroke-width="3"/><circle cx="-12" cy="-10" r="5" fill="#fff" opacity=".8"/></g>`;
  case 'cherry':return `<g transform="translate(262 124)"><path d="M-12 14 Q-4 -18 10 -24 Q8 -4 14 14" fill="none" stroke="#3E9E4A" stroke-width="4" stroke-linecap="round"/><path d="M10 -24 q12 -6 18 4 q-12 4 -18 -4z" fill="#4CC25E"/><circle cx="-12" cy="20" r="13" fill="#E8243C"/><circle cx="14" cy="20" r="13" fill="#E8243C"/><circle cx="-16" cy="15" r="4" fill="#fff" opacity=".8"/><circle cx="10" cy="15" r="4" fill="#fff" opacity=".8"/></g>`;
  case 'hat':return `<g><ellipse cx="200" cy="118" rx="132" ry="22" fill="#FFC86B" stroke="#E9A23B" stroke-width="3"/><path d="M128 120 Q130 44 200 42 Q270 44 272 120 Z" fill="#FFB84D"/><rect x="129" y="100" width="142" height="16" fill="#FF5FA2"/><circle cx="256" cy="106" r="13" fill="#fff"/><circle cx="256" cy="106" r="5" fill="#FFD43B"/></g>`;
  case 'glasses':return `<g fill="rgba(190,235,255,.35)" stroke="#E0457B" stroke-width="6"><circle cx="168" cy="228" r="25"/><circle cx="232" cy="228" r="25"/></g><path d="M193 224 Q200 216 207 224" fill="none" stroke="#E0457B" stroke-width="6" stroke-linecap="round"/>`;
  }
  return '';
}
const BANGS='M106 207 C100 104 300 104 294 207 Q276 170 248 184 Q225 150 200 180 Q175 150 152 184 Q124 170 106 207 Z';
function charSVG(st,o={}){
  const c=o.cust||CUSTOMERS[0],col=colorFill(st.color),B=[262,335,420][st.length],L=[70,125,195][st.length];let s='';
  if(o.cape!==false)s+=`<path d="M76 470 Q84 330 200 318 Q316 330 324 470 Z" fill="#7FE3CC"/><path d="M104 470 Q114 358 200 348 Q286 358 296 470" fill="none" stroke="#fff" stroke-width="9" stroke-dasharray="1 22" stroke-linecap="round" opacity=".9"/><rect x="178" y="288" width="44" height="42" rx="14" fill="${c.skin}"/>`;
  s+=earsSVG(c);
  s+=`<g fill="${col}">`;
  if(st.style==='twin')s+=`<path d="${backPath(250)}"/>`+tail(-1,L)+tail(1,L);
  else if(st.style==='bun')s+=`<path d="${backPath(250)}"/><circle cx="200" cy="${[96,88,80][st.length]}" r="${[30,40,50][st.length]}"/>`;
  else if(st.style==='pony')s+=`<path d="${backPath(250)}"/><path d="M294 126 C374 128 370 ${140+L} 338 ${158+L} C306 ${140+L*.7} 328 160 294 126 Z"/>`;
  else{s+=`<path d="${backPath(B)}"/>`;if(st.style==='curly')s+=curls(B,st.length>0)}
  s+='</g>';
  if(st.style==='twin')s+=`<circle cx="88" cy="192" r="11" fill="#FF5FA2"/><circle cx="312" cy="192" r="11" fill="#FF5FA2"/>`;
  if(st.style==='pony')s+=`<circle cx="298" cy="130" r="11" fill="#FF5FA2"/>`;
  s+=faceSVG(c,o.face||'normal');
  s+=`<path d="${BANGS}" fill="${col}"/>`;
  if(st.style==='curly')s+=`<g fill="${col}"><circle cx="138" cy="160" r="22"/><circle cx="200" cy="146" r="24"/><circle cx="262" cy="160" r="22"/></g>`;
  if(st.style==='bun')s+=`<ellipse cx="200" cy="${[124,126,128][st.length]}" rx="24" ry="8" fill="#FF5FA2"/>`;
  s+=`<path d="M138 152 Q165 126 205 122" fill="none" stroke="#fff" stroke-opacity=".45" stroke-width="9" stroke-linecap="round"/>`;
  s+=accSVG(st.acc);
  if(o.pika)s+=`<g class="twinkle" fill="#FFF7B0" stroke="#FFC23A" stroke-width="2"><polygon points="${starPts(70,150,16,6)}"/><polygon points="${starPts(338,210,13,5)}"/><polygon points="${starPts(318,90,10,4)}"/></g>`;
  return s;
}

/* ---------- fx ---------- */
const FX=$('#fx');
function fx(x,y,html,{dx=0,dy=0,rot=0,dur=.8,fs=22,cls='fxp',bg}={}){
  const d=document.createElement('div');d.className=cls;d.innerHTML=html;
  d.style.cssText=`left:${x}px;top:${y}px;--dx:${dx}px;--dy:${dy}px;--rot:${rot}deg;--dur:${dur}s;--fs:${fs}px`;
  if(bg)d.style.background=bg;FX.appendChild(d);setTimeout(()=>d.remove(),dur*1000+200);return d;
}
function sparkle(x,y,n=10,set=['✨','⭐','💖','🌟']){
  for(let i=0;i<n;i++){const a=Math.random()*Math.PI*2,r=40+Math.random()*70;
    fx(x,y,pick(set),{dx:Math.cos(a)*r,dy:Math.sin(a)*r,rot:Math.random()*180,dur:.7+Math.random()*.4,fs:16+Math.random()*16})}
}
function hairBits(x,y,bg){for(let i=0;i<9;i++)fx(x,y,'',{cls:'fxp bit',dx:(Math.random()-.5)*110,dy:120+Math.random()*140,rot:Math.random()*400,dur:1+Math.random()*.4,bg})}
function confetti(n){const cs=['#FF5FA2','#FFC23A','#36CFA8','#5EC4FF','#9C7BFF','#FF9F5A'];
  for(let i=0;i<n;i++){const d=document.createElement('div');d.className='conf';
    d.style.cssText=`left:${Math.random()*100}vw;background:${pick(cs)};--dx:${(Math.random()-.5)*200}px;--rot:${Math.random()*900}deg;--dur:${2+Math.random()*1.6}s;--dl:${Math.random()*.6}s`;
    FX.appendChild(d);setTimeout(()=>d.remove(),4500)}}
function claps(el){const r=el.getBoundingClientRect();
  for(let i=0;i<8;i++){const left=i%2===0;fx(left?r.left+10:r.right-10,r.top+r.height*(.25+Math.random()*.5),'👏',{dx:(left?-1:1)*(30+Math.random()*50),dy:-40-Math.random()*60,rot:(Math.random()-.5)*60,dur:1,fs:30})}}
function center(el){const r=el.getBoundingClientRect();return[r.left+r.width/2,r.top+r.height/2]}
function anim(el,c){el.classList.remove(c);void el.getBoundingClientRect();el.classList.add(c)}
const timers={};
function bubble(el,t,ms=1600,voice=true){el.textContent=t;el.classList.remove('show');void el.offsetWidth;el.classList.add('show');
  clearTimeout(timers[el.id]);timers[el.id]=setTimeout(()=>el.classList.remove('show'),ms);if(voice)speak(t)}
const say=(t,ms,voice)=>bubble($('#say'),t,ms,voice);

function showScreen(id){['title','game','shop'].forEach(s=>$('#'+s).classList.toggle('on',s===id));

/* ---------- title ---------- */
function buildTitle(){
  const cs=['#FF5FA2','#FFB01F','#36CFA8','#5EC4FF','#9C7BFF'];let i=0;
  const row=(t,k)=>`<span class="row ${k}">`+[...t].map(ch=>`<span class="ch" style="--i:${i};--r:${(i%2?3:-3)}deg;color:${cs[i++%cs.length]}">${ch}</span>`).join('')+'</span>';
  $('#sign').innerHTML=row('ゆめいろ','row1')+row('ヘアサロン','row2');
  let f='';for(let k=0;k<14;k++)f+=`<span class="fl" style="--x:${Math.random()*100}%;--s:${14+Math.random()*34}px;--d:${7+Math.random()*7}s;--dl:${-Math.random()*12}s;--w:${(Math.random()-.5)*80}px"></span>`;
  $('#floaties').innerHTML=f;
}
let tTimer=null;
function titleTick(){const st={length:ri(3),color:pick(availColors()).id,style:pick(STYLES).id,acc:pick(availAccs()).id};
  $('#tPic').innerHTML=charSVG(st,{cust:pick(availCust()),face:'happy'});anim($('.tmirror'),'boing')}
function showTitle(){

/* ---------- shop ---------- */
const PREVIEW_CUST={skin:'#FFDCC6'};
function shopPreview(it){
  if(it.kind==='acc')return charSVG({length:1,color:'brown',style:'straight',acc:it.id},{cust:PREVIEW_CUST,face:'happy',cape:false});
  if(it.kind==='col')return charSVG({length:2,color:it.id,style:'curly',acc:'none'},{cust:PREVIEW_CUST,face:'happy',cape:false});
  return charSVG({length:1,color:'brown',style:'straight',acc:'none'},{cust:CUSTOMERS.find(c=>c.id===it.id),face:'happy',cape:false});
}
function renderShop(){
  $('#sCoin').textContent=save.coins;
  const groups=[['acc','🎀 かざり'],['col','🎨 かみの いろ'],['cust','🐾 あたらしい おきゃくさん']];
  $('#shopBody').innerHTML=groups.map(([k,h])=>`<h2 class="shop-h">${h}</h2><div class="sgrid">`+
    SHOP.filter(s=>s.kind===k).map(s=>`<div class="sitem" data-card="${s.key}"><svg class="mirror-bg" viewBox="10 0 380 380">${shopPreview(s)}</svg><div class="nm">${s.name}</div>`+
      (owns(s.key)?`<div class="owned">✔ もってるよ</div>`:`<button class="buy ${save.coins<s.price?'no':''}" data-buy="${s.key}">🪙 ${s.price}</button>`)+`</div>`).join('')+'</div>').join('');
}
function openShop(){SFX.tap();showScreen('shop');renderShop();$('#shopBody').scrollTop=0;
  setTimeout(()=>bubble($('#sToast'),'ほしい ものを タップしてね！',1800),300)}
$('#shopBody').addEventListener('click',e=>{
  const b=e.target.closest('[data-buy]');if(!b)return;
  const it=SHOP.find(s=>s.key===b.dataset.buy);if(!it||owns(it.key))return;
  if(save.coins<it.price){SFX.boop();anim(b,'wobble');bubble($('#sToast'),`コインが あと ${it.price-save.coins}まい ひつようだよ`,2000);return}
  save.coins-=it.price;save.owned.push(it.key);persist();
  const[x,y]=center(b);SFX.fanfare();confetti(40);sparkle(x,y,14);
  renderShop();anim($(`[data-card="${it.key}"]`),'popin');
  bubble($('#sToast'),`${it.name}を ゲット！`,2000);
});
$('#shopBtn').addEventListener('click',()=>{ac();openShop()});
$('#shopBack').addEventListener('click',()=>{SFX.tap();showTitle()});

/* ---------- game ---------- */
let G={};
const KEYS=['length','color','style','acc'];
const CHIP={length:['✂️','ながさ'],color:['🎨','いろ'],style:['💇','かたち'],acc:['🎀','かざり']};
function calcMatch(){const m={};KEYS.forEach(k=>m[k]=G.cur[k]===G.target[k]);return m}
function buildBulbs(){let h='';const n=14;for(let i=0;i<n;i++){const a=i/n*Math.PI*2;
  h+=`<span class="bulb" style="--i:${i};left:${50+51*Math.cos(a)}%;top:${50+51*Math.sin(a)}%"></span>`}
  $('#mirror').insertAdjacentHTML('beforeend',h)}

function startGame(){
  try{if(typeof WakuwakuAnalytics!=='undefined')WakuwakuAnalytics.startGame()}catch(e){}
  ac();SFX.sparkle();
  showScreen('game');speak('いらっしゃいませ');$('#coinN').textContent=save.coins;G={};newCustomer();
}
function newCustomer(){
  clearResultTimers();
  const custs=availCust();let c;do{c=pick(custs)}while(G.cust&&c.id===G.cust.id&&custs.length>1);
  const cols=availColors(),accs=availAccs().filter(a=>a.id!=='none');
  const t={length:ri(3),color:pick(cols).id,style:pick(STYLES).id,acc:pick(accs).id};
  if(t.style==='bun'&&['hat','crown'].includes(t.acc))t.acc=pick(accs.filter(x=>!['hat','crown'].includes(x.id))).id;
  const cur={acc:'none'};
  cur.length=Math.random()<.8?(t.length+1+ri(2))%3:t.length;
  cur.color=Math.random()<.85?pick(cols.filter(x=>x.id!==t.color)).id:t.color;
  cur.style=Math.random()<.8?pick(STYLES.filter(x=>x.id!==t.style)).id:t.style;
  G={cust:c,target:t,cur,bubbles:[],maxB:0,pika:false,face:'normal',tool:'shampoo',hinted:false,acted:false,busy:false};
  G.matched=calcMatch();
  $('#bubbles').innerHTML='';
  $('#custN').textContent=save.served+1;
  $('#orderPic').innerHTML=charSVG(t,{cust:c,face:'happy'});
  renderChar();updateChips();renderTools();renderPanel();
  anim($('#glass'),'enter');anim($('#order'),'popin');
  setTimeout(()=>{say(`${c.name}だよ！ こんな かみがたに してね！`,2600,false);speak(`${c.name}だよ。${requestText(t)}`)},650);
}
function renderChar(){$('#char').innerHTML=charSVG(G.cur,{cust:G.cust,face:G.face,pika:G.pika})}
let faceT;
function flashFace(f,ms=700){G.face=f;renderChar();clearTimeout(faceT);faceT=setTimeout(()=>{G.face='normal';renderChar()},ms)}
function updateChips(){
  const m=calcMatch();let fresh=null;
  KEYS.forEach(k=>{if(m[k]&&!G.matched[k])fresh=k});
  G.matched=m;
  $('#chips').innerHTML=KEYS.map(k=>`<span class="chip ${m[k]?'ok':''}" data-k="${k}">${m[k]?'✔ ':''}${CHIP[k][0]}<span class="lbl"> ${CHIP[k][1]}</span></span>`).join('')+(G.pika?'<span class="chip bonus">✨<span class="lbl"> ぴかぴか</span></span>':'');
  const all=KEYS.every(k=>m[k]);
  if(fresh){const el=$(`.chip[data-k="${fresh}"]`);anim(el,'popin');setTimeout(SFX.ding,120);
    const [x,y]=center(el);sparkle(x,y,6);flashFace('happy',900);
    setTimeout(()=>say(all?'ぜんぶ おなじ！ 「できた」を おしてね！':pick(PRAISE),all?2600:1500),250)}
  $('#doneBtn').classList.toggle('ready',all);
}
function renderTools(){
  $('#tools').innerHTML=TOOLS.map(t=>`<button class="tool ${G.tool===t.id?'on':''}" data-tool="${t.id}" aria-pressed="${G.tool===t.id}"><span class="em">${t.e}</span><small>${t.n}</small></button>`).join('');
}
function renderPanel(){
  const t=G.tool,tl=TOOLS.find(x=>x.id===t),p=$('#panel');let h='',n=0;
  if(t==='color'){const l=availColors();n=l.length;h=l.map(c=>`<button class="opt ${G.cur.color===c.id?'on':''}" data-color="${c.id}"><span class="dot" style="background:${c.css||c.c}"></span><small>${c.n}</small></button>`).join('')}
  else if(t==='style'){n=STYLES.length;h=STYLES.map(s=>`<button class="opt ${G.cur.style===s.id?'on':''}" data-style="${s.id}"><svg viewBox="10 20 390 400">${charSVG({...G.cur,style:s.id,acc:'none'},{cust:{skin:'#FFE0CC'},cape:false})}</svg><small>${s.n}</small></button>`).join('')}
  else if(t==='acc'){const l=availAccs();n=l.length;h=l.map(a=>`<button class="opt ${G.cur.acc===a.id?'on':''}" data-acc="${a.id}"><span class="em">${a.e}</span><small>${a.n}</small></button>`).join('')}
  else{h=`<div class="tip"><span class="tipicon">${tl.e}</span><span>${tl.tip}</span></div>`;
    if(t==='cut'||t==='grow')h+=`<div class="len">${LENS.map((x,i)=>`<span class="${i===G.cur.length?'on':''}">${x}</span>`).join('')}</div>`}
  const keep=p.scrollLeft;
  p.innerHTML=h;p.classList.toggle('scroll',n>6);p.scrollLeft=keep;
}

/* ---------- touch on head ---------- */
const sv=$('#sv'),hit=$('.mwrap'),cursor=$('#cursor');
function svgPt(e){const p=sv.createSVGPoint();p.x=e.clientX;p.y=e.clientY;return p.matrixTransform(sv.getScreenCTM().inverse())}
const onHead=p=>((p.x-200)/138)**2+((p.y-195)/128)**2<1;
const onChar=p=>p.x>30&&p.x<370&&p.y>30&&p.y<450;
let down=false,lastSnd=0,lastWind=0;
function moveCursor(e){cursor.style.transform=`translate(${e.clientX-20}px,${e.clientY-70}px)`}
hit.addEventListener('pointerdown',e=>{
  down=true;try{hit.setPointerCapture(e.pointerId)}catch(_){}
  cursor.textContent=TOOLS.find(t=>t.id===G.tool).e;cursor.style.display='block';moveCursor(e);act(e,true)});
hit.addEventListener('pointermove',e=>{if(!down)return;moveCursor(e);act(e,false)});
['pointerup','pointercancel','lostpointercapture'].forEach(n=>hit.addEventListener(n,()=>{down=false;cursor.style.display='none'}));
function act(e,first){
  const p=svgPt(e),t=G.tool;
  if(t==='shampoo'){if(onHead(p))addBubble(p)}
  else if(t==='dryer')blow(p,e);
  else if(first&&t==='cut'){if(onChar(p))cut(e)}
  else if(first&&t==='grow'){if(onChar(p))grow(e)}
  else if(first){SFX.tap();say('したの ボタンで えらんでね👇')}
}
function addBubble(p){
  const near=G.bubbles.some(b=>(b.x-p.x)**2+(b.y-p.y)**2<16*16);
  if(near||G.bubbles.length>=70)return;
  const r=10+Math.random()*12;
  const g=document.createElementNS('http://www.w3.org/2000/svg','g');
  g.setAttribute('transform',`translate(${p.x.toFixed(1)} ${p.y.toFixed(1)})`);
  g.innerHTML=`<g class="bubin"><circle r="${r.toFixed(1)}" fill="rgba(255,255,255,.88)" stroke="#9FDCFF" stroke-width="2.5"/><circle cx="${(-r/3).toFixed(1)}" cy="${(-r/3).toFixed(1)}" r="${(r/4).toFixed(1)}" fill="#fff"/></g>`;
  $('#bubbles').appendChild(g);G.bubbles.push({x:p.x,y:p.y,el:g});G.acted=true;
  G.maxB=Math.max(G.maxB,G.bubbles.length);
  const now=performance.now();if(now-lastSnd>90){SFX.pop();lastSnd=now}
  if(G.bubbles.length===15)say('きもちいい〜♪');
  if(G.maxB>=28&&!G.hinted){G.hinted=true;setTimeout(()=>say('あわあわ！ つぎは 💨ドライヤーで ふきとばしてね',2600),400)}
}
function blow(p,e){
  const now=performance.now();
  if(now-lastWind>220){SFX.whoosh();lastWind=now;fx(e.clientX,e.clientY,'💨',{dx:(Math.random()-.5)*60,dy:-40,dur:.6,fs:26})}
  let hitB=false;
  G.bubbles=G.bubbles.filter(b=>{if((b.x-p.x)**2+(b.y-p.y)**2<50*50){hitB=true;b.el.firstChild.setAttribute('class','bubout');setTimeout(()=>b.el.remove(),260);return false}return true});
  if(hitB&&now-lastSnd>80){SFX.pop();lastSnd=now}
  if(G.maxB>=20&&G.bubbles.length===0&&!G.pika){
    G.pika=true;renderChar();updateChips();SFX.sparkle();const[x,y]=center($('#glass'));sparkle(x,y,16);
    say('ぴかぴか！ ありがとう✨',1800);flashFace('happy',1200);
  }
}
function cut(e){
  if(G.cur.length===0){SFX.boop();say('もう みじかいよ！');anim($('#glass'),'wobble');return}
  G.cur.length--;G.acted=true;SFX.snip();hairBits(e.clientX,e.clientY,colorCss(G.cur.color));
  flashFace('wow');updateChips();renderPanel();
}
function grow(e){
  if(G.cur.length===2){SFX.boop();say('もう ながいよ！');anim($('#glass'),'wobble');return}
  G.cur.length++;G.acted=true;SFX.sparkle();sparkle(e.clientX,e.clientY,8,['✨','🌟','💫']);
  flashFace('wow');updateChips();renderPanel();
}

/* ---------- buttons ---------- */
$('#tools').addEventListener('click',e=>{const b=e.target.closest('.tool');if(!b)return;

$('#panel').addEventListener('click',e=>{const b=e.target.closest('.opt');if(!b)return;
  const[x,y]=center($('#glass'));let nm='';
  if(b.dataset.color){G.cur.color=b.dataset.color;nm=nameOf(COLORS,G.cur.color);SFX.color();sparkle(x,y-40,10,['🎨','✨','💧'])}
  else if(b.dataset.style){G.cur.style=b.dataset.style;nm=nameOf(STYLES,G.cur.style);SFX.sparkle();sparkle(x,y-40,8,['💫','✨'])}
  else if(b.dataset.acc){G.cur.acc=b.dataset.acc;nm=nameOf(ACCS,G.cur.acc);SFX.sparkle();if(G.cur.acc!=='none')sparkle(x+40,y-80,8)}
  G.acted=true;const before=KEYS.filter(k=>G.matched[k]).length;
  flashFace('wow',600);updateChips();renderPanel();
  if(KEYS.filter(k=>G.matched[k]).length<=before)speak(nm);
});
$('#order').addEventListener('click',e=>{if(e.target.closest('#doneBtn'))return;
  SFX.tap();anim($('#orderPic'),'popin');speak(requestText(G.target))});

let RT=[];
function later(fn,ms){RT.push(setTimeout(fn,ms))}
function clearResultTimers(){RT.forEach(t=>{clearTimeout(t);clearInterval(t)});RT=[]}
$('#doneBtn').addEventListener('click',finish);
function finish(){
  if(G.busy)return;
  if(!G.acted){SFX.boop();anim($('#doneBtn'),'wobble');say('まだ なにも してないよ〜',1800);return}
  G.busy=true;
  const m=calcMatch(),n=KEYS.filter(k=>m[k]).length;
  const stars=n===4?3:n>=2?2:1,gain=stars*10+(G.pika?5:0);
  const before=rankOf(save.served);save.served++;save.coins+=gain;persist();const after=rankOf(save.served);
  try{if(typeof WakuwakuAnalytics!=='undefined')WakuwakuAnalytics.stageComplete(String(save.served),'complete',stars)}catch(e){}
  $('#rTarget').innerHTML=charSVG(G.target,{cust:G.cust,face:'normal'});
  $('#rPic').innerHTML=charSVG(G.cur,{cust:G.cust,face:'happy',pika:G.pika});
  const msg=pick(MSG[stars]);
  $('#rMsg').textContent=msg;
  $('#rNote').textContent=G.pika?'✨ ぴかぴかボーナス +5':'';
  $('#rTip').textContent=stars<3?'つぎは 「おねがい」と おなじに できるかな？':'';
  $('#rCoin').textContent='0';
  $('#rRank').hidden=true;$('#rShop').hidden=true;
  [...$('#rStars').children].forEach(s=>s.classList.remove('lit'));
  $('#result').hidden=false;
  for(let i=0;i<stars;i++)later(()=>{$('#rStars').children[i].classList.add('lit');SFX.star(i)},450+i*420);
  later(()=>{
    SFX.fanfare();SFX.clap();confetti(stars===3?120:70);claps($('.rcard'));speak(msg);
    let c=0;const step=Math.max(1,Math.round(gain/10));
    const iv=setInterval(()=>{c=Math.min(gain,c+step);$('#rCoin').textContent=c;SFX.coin();if(c>=gain)clearInterval(iv)},90);RT.push(iv);
    const[x,y]=center($('#rCoin'));const[tx,ty]=center($('#coinN'));
    for(let i=0;i<6;i++)later(()=>fx(x,y,'🪙',{cls:'fxp coinfly',dx:tx-x,dy:ty-y,dur:.8,fs:28}),i*90);
    later(()=>{$('#coinN').textContent=save.coins;anim($('#coinN').parentElement,'popin');$('#rShop').hidden=!canBuySomething()},900);
    if(before!==after)later(()=>{$('#rRank').textContent=`🎉 ランクアップ！ 「${after}」に なったよ！`;$('#rRank').hidden=false;SFX.sparkle();speak(`ランクアップ！ ${after}に なったよ`)},2200);
  },450+stars*420);
}
$('#nextBtn').addEventListener('click',()=>{SFX.tap();$('#result').hidden=true;$('#coinN').textContent=save.coins;newCustomer()});
$('#toTitle').addEventListener('click',()=>{SFX.tap();showTitle()});
$('#rShop').addEventListener('click',()=>{clearResultTimers();openShop()});
$('#homeBtn').addEventListener('click',()=>{SFX.tap();if(G.acted&&!G.busy)$('#confirm').hidden=false;else showTitle()});
$('#stayBtn').addEventListener('click',()=>{SFX.tap();$('#confirm').hidden=true});
$('#leaveBtn').addEventListener('click',()=>{SFX.tap();showTitle()});
$('#playBtn').addEventListener('click',startGame);
document.addEventListener('keydown',e=>{if(e.key!=='Escape')return;if(!$('#confirm').hidden){$('#confirm').hidden=true;return}try{if(window.parent!==window)window.parent.postMessage({type:'goBack'},window.location.origin)}catch(err){}});
document.addEventListener('gesturestart',e=>e.preventDefault());
document.addEventListener('dblclick',e=>e.preventDefault());

try{if(typeof WakuwakuAnalytics!=='undefined')WakuwakuAnalytics.configure({game_id:'dressup-v3',game_name:'ゆめいろヘアサロン',game_category:'そうぞう'})}catch(e){}
buildTitle();buildBulbs();syncToggles();showTitle();
</script>
</body>
</html>
