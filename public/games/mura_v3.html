  #backBtn{margin-right:auto;}
  #bgmBtn,#backBtn,#invBtn{cursor:pointer;}
  #missionBar{position:absolute; top:calc(52px + var(--sat,0px)); left:50%; transform:translateX(-50%); z-index:10; background:rgba(255,255,255,.94); border:2.5px solid var(--gold); border-radius:14px; padding:6px 14px; font-size:13px; font-weight:900; max-width:min(92vw,460px); text-align:center; box-shadow:0 3px 0 rgba(0,0,0,.12); transition:transform .25s;}

  @keyframes mflash{0%{transform:translateX(-50%) scale(1);}40%{transform:translateX(-50%) scale(1.12);}100%{transform:translateX(-50%) scale(1);}}
  .mprog{color:var(--accent-dark);}

  .card.dis{opacity:.45; pointer-events:none;}
  .card .big{font-size:26px; display:block; margin-bottom:2px;}
  .card small{display:block; font-weight:700; font-size:11px; opacity:.7;}

  .cut-zone{position:absolute; top:0; bottom:0; background:rgba(139,195,74,.55);}
  .cut-marker{position:absolute; top:0; bottom:0; width:8px; background:var(--bad); border-radius:4px;}
  .tap-btn{display:block; width:100%; margin-top:12px; background:var(--pink); color:#fff; border:3px solid #d4548f; border-radius:16px; padding:14px 0; font-size:18px; font-weight:900; box-shadow:0 5px 0 #d4548f; font-family:inherit; cursor:pointer;}
  .tap-btn:active{transform:translateY(3px); box-shadow:0 2px 0 #d4548f;}
  .cut-count{font-size:13px; font-weight:900; margin-top:8px; text-align:center;}
  .pan-gauge{position:relative; height:34px; background:#f0e6d6; border-radius:99px; overflow:hidden; border:2px solid #d9c6a2; margin-top:4px;}
  .pan-fill{position:absolute; top:0; bottom:0; left:0; width:0%; background:linear-gradient(90deg,#ffe082,#ff9800,#e53935); border-radius:99px;}
  .pan-zone{position:absolute; top:0; bottom:0; background:rgba(139,195,74,.55);}

  #startOv{position:absolute; inset:0; z-index:50; background:linear-gradient(#bfe9ff,#dff5c8); display:flex; flex-direction:column; align-items:center; justify-content:center; gap:14px; text-align:center; padding:20px;}

  .genBtn{width:132px; padding:16px 8px; border-radius:20px; border:4px solid #fff; font-family:inherit; font-weight:900; font-size:17px; cursor:pointer; box-shadow:0 5px 0 rgba(0,0,0,.15);}

/* v1/v2 の "mura_progress" と同じ寛容な Object.assign マージパターンを踏襲。
   d（読み込んだ生データ）を defaultState() の上にマージし、配列/オブジェクト型の
   フィールドは個別に安全側マージする。壊れたJSON・欠損フィールドはすべて既定値で補う。 */
function mergeIntoDefaults(d){
  S = Object.assign(defaultState(), d);
  S.inv = Object.assign(defaultState().inv, d.inv || {});
  S.friends = Object.assign(defaultState().friends, d.friends || {});
  const sourcePlots = Array.isArray(d.plots) ? d.plots : [];
  const normalizedPlots = makeDefaultPlots(d.level || 1);
  PLOT_DEFS.forEach((def,i)=>{
    const old = sourcePlots[i];
    if(!old) return;
    if(old.id){
      normalizedPlots[i] = Object.assign(normalizedPlots[i], old, { id:def.id, areaId:def.areaId, type:def.type });
    } else if(i < 6 && old.crop){
      normalizedPlots[i] = Object.assign(normalizedPlots[i], {
        unlocked:true, cropId:old.crop, plantedAt:old.plantedAt||Date.now(),
        wateredAt:old.wateredAt||0, boost:old.boost||0, quality:old.quality||0
      });
    }
  });
  S.plots = normalizedPlots;
  if(!Array.isArray(S.dishes)) S.dishes = [];
  if(!Array.isArray(S.orders)) S.orders = [];
  if(!Array.isArray(S.decos)) S.decos = [];
  const wdef = defaultState().wardrobe;
  S.wardrobe = Object.assign({}, wdef, d.wardrobe || {});
  if(!Array.isArray(S.wardrobe.owned)) S.wardrobe.owned = wdef.owned.slice();
  wdef.owned.forEach(id => { if(S.wardrobe.owned.indexOf(id) < 0) S.wardrobe.owned.push(id); });
  /* Phase 2: residents/buildings/interiors はキー単位でマージし、
     Phase 1のみのセーブ（これらのキーが存在しない）でも欠損なく既定値が補われるようにする。
     既存の friends（仲良し度・移住状態の実体）はそのまま維持し、二重の状態源を作らない。 */
  const rdef = defaultState().residents;
  S.residents = {};
  Object.keys(rdef).forEach(id=>{ S.residents[id] = Object.assign({}, rdef[id], (d.residents && d.residents[id]) || {}); });
  const bdef = defaultState().buildings;
  S.buildings = Object.assign({}, bdef, d.buildings || {});
  if(!S.interiors || typeof S.interiors !== "object") S.interiors = {};
  if(!S.currentArea) S.currentArea = "village";
  const pdef = defaultState().progression;
  S.progression = Object.assign({}, pdef, d.progression || {});
  if(!Array.isArray(S.progression.harvestedCrops)) S.progression.harvestedCrops = [];
  if(!Array.isArray(S.progression.cookedRecipes)) S.progression.cookedRecipes = [];
  S.progression.farmingRank = Math.max(S.progression.farmingRank||1, rankFromXp(S.progression.farmingXp||0, FARM_RANK_XP));
  S.progression.cookingRank = Math.max(S.progression.cookingRank||1, rankFromXp(S.progression.cookingXp||0, COOK_RANK_XP));
  S.recipeProgress = (d.recipeProgress && typeof d.recipeProgress === "object") ? d.recipeProgress : {};
  Object.keys(RECIPES).forEach(id=>{
    const rp = S.recipeProgress[id] || {};
    const legacyBest = S.dishes.filter(x=>x && x.id===id).reduce((n,x)=>Math.max(n,x.stars||0),0);
    S.recipeProgress[id] = { bestStars:Math.max(rp.bestStars||0, legacyBest), timesCooked:rp.timesCooked||0 };
  });
  S.schemaVersion = 5;
}
/* 旧セーブ（mura_progress）からの移行。読み取り専用・冪等（v3セーブが既にあれば何もしない）。 */
function migrateFromLegacyIfNeeded(){
  try{
    const v3raw = SAFE_LS.getItem(SAVE_KEY);
    if(v3raw) return false; // 既にv3セーブがある → 二重移行しない（冪等性ガード）
    const legacyRaw = SAFE_LS.getItem(LEGACY_SAVE_KEY);
    if(!legacyRaw) return false;
    const d = JSON.parse(legacyRaw);
    mergeIntoDefaults(d || {});
    S._migratedFromLegacy = true;
    S._migratedAt = Date.now();
    save(); // v3キーに書き出す。legacyキーには一切書き込まない・削除しない。
    return true;
  }catch(e){ return false; }
}
function load(){
  try{
    const raw = SAFE_LS.getItem(SAVE_KEY);
    if(!raw){
      if(migrateFromLegacyIfNeeded()) return;
      return;
    }
    const d = JSON.parse(raw);
    mergeIntoDefaults(d);
  }catch(e){ S = defaultState(); }
}

function calcLevel(total){ let lv=1; for(let i=2;i<=MAX_LV;i++){ if(total>=LEVELS[i]) lv=i; } return lv; }
function rankFromXp(xp, table){ let rank=1; for(let i=2;i<table.length;i++){ if(xp>=table[i]) rank=i; } return rank; }
function maxPlots(){ return S.plots.filter(p=>p && p.unlocked).length; }
function syncLegacyPlotUnlocks(){
  PLOT_DEFS.forEach((def,i)=>{ if(def.legacyLevel && S.level >= def.legacyLevel) S.plots[i].unlocked = true; });
}
function hasWell(){ return S.level >= 3; }
function hasKoya(){ return S.level >= 5; }
function addFarmingXp(n, firstCrop){
  const p = S.progression;
  p.farmingXp += n;
  if(firstCrop && p.harvestedCrops.indexOf(firstCrop)<0){ p.harvestedCrops.push(firstCrop); p.farmingXp += 4; }
  const next = rankFromXp(p.farmingXp, FARM_RANK_XP);
  if(next > p.farmingRank){ p.farmingRank = next; toast("🌱 のうぎょうランク " + next + "！"); refreshPlotLocks(); }
}
function addCookingXp(n, firstRecipe){
  const p = S.progression;
  p.cookingXp += n;
  if(firstRecipe && p.cookedRecipes.indexOf(firstRecipe)<0){ p.cookedRecipes.push(firstRecipe); p.cookingXp += 4; }
  const next = rankFromXp(p.cookingXp, COOK_RANK_XP);
  if(next > p.cookingRank) { p.cookingRank = next; toast("🍳 りょうりランク " + next + "！"); }
}
function addCrowns(n){
  S.crowns += n; S.totalCrowns += n;
  const newLv = calcLevel(S.totalCrowns);
  if(newLv > S.level){
    const msgs = [];
    for(let l=S.level+1; l<=newLv; l++){ if(LEVEL_MSG[l]) msgs.push("むらLv." + l + "！ " + LEVEL_MSG[l]); }
    S.level = newLv;
    syncLegacyPlotUnlocks();
    rebuildLevelBuildings();
    if(msgs.length){ showRewardModal("🎉 レベルアップ！", msgs.join("<br>")); sfx.crown(); }
    setTimeout(checkStateMission, 60);
    spawnBurst(player ? player.position : null, 0xffc93c, 26);
  }
  renderStatus();
}
function curMission(){
  if(S.mIdx < MISSIONS.length) return MISSIONS[S.mIdx];
  return REPEAT_MISSIONS[(S.mIdx - MISSIONS.length) % REPEAT_MISSIONS.length];
}
function missionBanner(flash){
  const m = curMission();
  const el = document.getElementById("missionBar");
  const prog = (m.ev && m.n > 1) ? ' <span class="mprog">（' + S.mProg + '/' + m.n + '）</span>' : '';
  el.innerHTML = "⭐ " + m.text + prog + ' <span class="mprog">＋👑' + m.reward + '</span>';
  if(flash){ el.classList.remove("flash"); void el.offsetWidth; el.classList.add("flash"); }
}
function completeMission(){
  const m = curMission();
  S.mIdx++; S.mProg = 0;
  addCrowns(m.reward);
  save();
  sfx.mission();
  showRewardModal("⭐ ミッションクリア！", m.text + "<br><b>👑 " + m.reward + "こ ゲット！</b>");

  setTimeout(checkStateMission, 80);
}
function missionEvent(ev){
  const m = curMission();
  if(m.ev !== ev) return;
  S.mProg++;
  if(S.mProg >= (m.n||1)) completeMission();
  else { save(); missionBanner(true); }
}
function checkStateMission(){
  const m = curMission();
  if(m.st && m.st()) completeMission();
}
/* 旧セーブ向け：状態系ミッションのサイレント追いつき（mura_v1.html missionCatchup() と同等） */
function missionCatchup(){
  let guard = 0;
  while(guard++ < 30){
    const m = curMission();
    if(m.st && m.st()){
      S.mIdx++; S.mProg = 0;
      S.crowns += m.reward; S.totalCrowns += m.reward;
    } else break;
  }
  S.level = calcLevel(S.totalCrowns);
}

/* ================= 注文 ================= */
function recipeUnlocked(id){
  const r = RECIPES[id];
  if(r.needKomugi && !S.komugiUnlocked) return false;
  if(S.level < r.lv) return false;
  if((S.progression.cookingRank||1) < (r.cookingRank||1)) return false;
  return Object.keys(r.need).every(item=>{
    const crop=CROPS[item];
    if(!crop) return true;
    if((S.progression.farmingRank||1)<(crop.unlockRank||1)) return false;
    return S.plots.some(p=>p&&p.unlocked&&p.type===crop.category);
  });
}
function canCook(id){ const r=RECIPES[id]; return Object.keys(r.need).every(k => (S.inv[k]||0) >= r.need[k]); }
function availableRecipeIds(){ return Object.keys(RECIPES).filter(recipeUnlocked); }
function makeOrder(excludeAnimal){
  let as = Object.keys(ANIMALS).filter(a => a !== excludeAnimal);
  const animal = as[Math.floor(Math.random()*as.length)];
  const rs = availableRecipeIds();
  const resident = RESIDENTS[animal];
  const favorites = resident ? [resident.favoriteDish].concat(resident.phase3Favorites||[]).filter(id=>rs.indexOf(id)>=0) : [];
  const dish = favorites.length && Math.random()<0.55 ? favorites[Math.floor(Math.random()*favorites.length)] : rs[Math.floor(Math.random()*rs.length)];
  return { animal, dish };
}
function ensureOrders(){
  S.orders = S.orders.filter(o => o && ANIMALS[o.animal] && RECIPES[o.dish]);
  while(S.orders.length < 2){
    S.orders.push(makeOrder(S.orders.length ? S.orders[0].animal : null));
  }
  if(S.orders[0].animal === S.orders[1].animal) S.orders[1] = makeOrder(S.orders[0].animal);
  S.orders = S.orders.map(o => recipeUnlocked(o.dish) ? o : makeOrder(null));
  if(S.orders[0].animal === S.orders[1].animal) S.orders[1] = makeOrder(S.orders[0].animal);
}
function orderOf(animalId){
  for(let i=0;i<S.orders.length;i++){ if(S.orders[i].animal===animalId) return i; }
  return -1;
}
function bestDishIdx(recipeId){
  let best=-1, bs=-1;
  S.dishes.forEach((d,i)=>{ if(d.id===recipeId && d.stars>bs){ best=i; bs=d.stars; } });
  return best;
}
function pendingEggs(){
  if(!hasKoya()) return 0;
  const now = Date.now();
  if(!S.lastEggAt){ S.lastEggAt = now; return 0; }
  return Math.min(EGG_MAX, Math.floor((now - S.lastEggAt) / (EGG_INTERVAL*1000)));
}
function collectEggs(){
  const n = pendingEggs();
  if(n <= 0){ toast("🐔 たまごは まだみたい…"); return; }
  S.inv.egg += n;
  S.lastEggAt = Date.now();
  sfx.harvest(); save(); renderStatus();
  toast("🥚 たまごを " + n + "こ あつめた！");
  spawnBurst(coopPos, 0xfff59d, 14);
  missionEvent("egg");
}
function cropRatio(p){
  if(!p || !p.cropId || !CROPS[p.cropId]) return 0;
  const total = CROPS[p.cropId].growMs;
  const elapsed = Date.now() - p.plantedAt + (p.boost || 0);
  return Math.min(1, elapsed / total);
}

/* ================= SFX / BGM ================= */
let audioCtx = null;
function ensureAudio(){ if(!audioCtx){ try{ audioCtx = new (window.AudioContext||window.webkitAudioContext)(); }catch(e){} } if(audioCtx && audioCtx.state==="suspended") audioCtx.resume(); }
function beep(freq, dur, type, vol, when){
  if(!audioCtx) return;
  const o=audioCtx.createOscillator(), g=audioCtx.createGain();
  o.type=type||"sine"; o.frequency.value=freq;
  const t=audioCtx.currentTime+(when||0);
  g.gain.setValueAtTime(0.0001,t);
  g.gain.exponentialRampToValueAtTime(vol||0.15,t+0.015);
  g.gain.exponentialRampToValueAtTime(0.0001,t+(dur||0.15));
  o.connect(g); g.connect(audioCtx.destination);
  o.start(t); o.stop(t+(dur||0.15)+0.05);
}

function cropUnlockedForPlot(cropId, plot){
  const cr = CROPS[cropId];
  if(!cr || !plot || cr.category !== plot.type) return false;
  if(cropId === "komugi" && !S.komugiUnlocked) return false;
  if(S.level < (cr.lv||1)) return false;
  return (S.progression.farmingRank||1) >= (cr.unlockRank||1);
}
function openPlotUnlockModal(idx){
  const def = PLOT_DEFS[idx], p = S.plots[idx];
  if(!def || !p || p.unlocked) return;
  const rankOk = (S.progression.farmingRank||1) >= (def.unlockRank||1);
  const label = def.type==="orchard" ? "くだものばたけ" : def.type==="herb" ? "ハーブばたけ" : "ついかの はたけ";
  openModal('<h2>🔒 '+label+'</h2><p style="text-align:center;font-weight:900;line-height:1.7">のうぎょうランク '+(def.unlockRank||1)+' で かいほう<br>ひつよう：👑 '+(def.cost||0)+'</p>'+
    '<button class="mBtn" id="mUnlock"'+(rankOk && S.crowns >= (def.cost||0) ? '' : ' disabled')+'>かいほうする！</button><button class="mBtn sub" id="mClose">まだにする</button>');
  document.getElementById("mClose").addEventListener("click", closeModal);
  const b = document.getElementById("mUnlock");
  if(b) b.addEventListener("click", ()=>{
    if(!rankOk || S.crowns < (def.cost||0) || p.unlocked) return;
    S.crowns -= def.cost||0; p.unlocked = true; save(); renderStatus(); refreshPlotLocks(); closeModal();
    toast("✨ "+label+"を かいほう！"); spawnBurst(plotPos(idx), 0xffd54f, 18);
  });
}
function openSeedModal(idx){
  const plot = S.plots[idx];
  let h = '<h2>🌱 なにを うえる？</h2><p style="text-align:center;font-weight:900;margin:0 0 8px">のうぎょうランク '+S.progression.farmingRank+'　👑 '+S.crowns+'</p><div class="cardGrid">';
  Object.keys(CROPS).filter(c=>CROPS[c].category===plot.type).forEach(c=>{
    const cr = CROPS[c];
    const locked = !cropUnlockedForPlot(c, plot);
    const price = cr.seedPrice||0;
    const buyable = !locked && S.crowns >= price;
    const sub = locked ? ("🔒 ランク"+cr.unlockRank) : ((price?"たね 👑"+price+" / ":"")+"そだつまで "+cr.time+"びょう");
    h += '<div class="card'+(buyable?'':' dis')+'" data-c="'+c+'"><span class="big">'+CROP_ICON[c]+'</span>'+cr.name+'<small>'+sub+'</small></div>';
  });
  h += '</div><button class="mBtn sub" id="mClose">やめる</button>';
  openModal(h);
  document.getElementById("mClose").addEventListener("click", closeModal);
  modalEl.querySelectorAll(".card[data-c]").forEach(el=>{
    el.addEventListener("click", ()=>{
      const crop = el.getAttribute("data-c");
      const cr = CROPS[crop];
      if(!cropUnlockedForPlot(crop, plot)){ toast("まだ うえられないよ"); return; }
      if(S.crowns < (cr.seedPrice||0)){ toast("👑が たりないみたい…"); return; }
      S.crowns -= cr.seedPrice||0;
      Object.assign(plot, { cropId:crop, plantedAt:Date.now(), wateredAt:0, boost:0, quality:0 });
      addFarmingXp(1);
      sfx.plant(); save(); closeModal();
      toast("🌱 " + CROPS[crop].name + "の たねを まいたよ！");
      missionEvent("plant");
      if(crop === "corn") missionEvent("plant_corn");

function interactPlot(idx){
  const p = S.plots[idx];
  if(!p) return;
  if(!p.unlocked){ openPlotUnlockModal(idx); return; }
  if(!p.cropId){ openSeedModal(idx); return; }
  const r = cropRatio(p);
  if(r >= 1){
    const cropId = p.cropId, cr = CROPS[cropId];
    const quality = p.wateredAt ? 2 : 1;
    const got = cr.yield + (Math.random() < (quality===2 ? 0.45 : 0.2) ? 1 : 0);
    S.inv[cropId] = (S.inv[cropId]||0) + got;
    addFarmingXp(2 + (quality===2 ? 1 : 0), cropId);
    if(cr.perennial){
      p.plantedAt = Date.now(); p.wateredAt = 0; p.boost = 0; p.quality = quality; p.harvestCount = (p.harvestCount||0)+1;
    } else {
      Object.assign(p, { cropId:null, plantedAt:0, wateredAt:0, boost:0, quality });
    }
    sfx.harvest(); save(); renderStatus();
    toast(CROP_ICON[cropId]+" "+cr.name+"を "+got+"こ しゅうかく！"+(quality===2?" ✨":""));
    spawnBurst(plotPos(idx), 0xa5d6a7, 12);
    for(let i=0;i<got;i++) missionEvent("harvest");
  } else {
    const firstWater = !p.wateredAt;
    p.wateredAt = Date.now();
    p.boost = (p.boost||0) + Math.round(CROPS[p.cropId].growMs*0.3);
    if(firstWater) addFarmingXp(1);
    sfx.water(); save();
    toast("💧 みずを あげた！ ぐんぐん そだつよ！");
    spawnBurst(plotPos(idx), 0x81d4fa, 8);
  }
}
function useWell(){
  let n=0;
  S.plots.forEach(p=>{ if(p && p.unlocked && p.cropId && cropRatio(p)<1){ const first=!p.wateredAt; p.wateredAt=Date.now(); p.boost=(p.boost||0)+Math.round(CROPS[p.cropId].growMs*0.3); if(first) addFarmingXp(1); n++; } });
  if(n){ sfx.water(); toast("⛲ みんなに みずを あげた！"); save(); spawnBurst(wellPos, 0x81d4fa, 20); }
  else toast("みずを あげる さくもつが ないみたい");
  completeQuestByType("well");
}

function startCooking(recipeId){
  if(mini) return;

  if(!canCook(recipeId)){ toast("ざいりょうが たりないみたい…"); return; }

}
function stepInfo(type){
  return {
    cut:["🔪 ざいりょうを きろう！","トン！",3],
    mix:["🥣 ぐるぐる まぜよう！","まぜる！",5],
    knead:["🍞 しっかり こねよう！","こねる！",6],
    decorate:["✨ きれいに もりつけ！","かざる！",4]
  }[type];
}
function startCookingStep(){
  if(!mini) return;
  cookStop();
  if(mini.stepIndex>=mini.steps.length){ finishCook(); return; }
  const type=mini.steps[mini.stepIndex].type;
  if(type==="heat" || type==="stir") startGaugeStep(type); else startRhythmStep(type);
}
function startRhythmStep(type){
  const info=stepInfo(type)||stepInfo("mix"), zoneW=hasKamado()?32:24, zoneL=50-zoneW/2;
  Object.assign(mini,{phase:type,hits:0,taps:0,pos:0,dir:1,zoneL,zoneW});
  openModal('<h2>'+info[0]+'</h2><div class="mini-stage"><div class="mini-label">みどりの ところで '+info[2]+'かい！</div><div class="cut-bar"><div class="cut-zone" style="left:'+zoneL+'%;width:'+zoneW+'%"></div><div class="cut-marker" id="cutMarker"></div></div><div class="cut-count" id="cutCount">0 / '+info[2]+'</div><button class="tap-btn" id="cutTap">'+info[1]+'</button></div>');
  const marker=document.getElementById("cutMarker"), speed=1.25+mini.stepIndex*0.08;
  function loop(){ if(!mini||mini.phase!==type)return; mini.pos+=speed*mini.dir; if(mini.pos>=96){mini.pos=96;mini.dir=-1;} if(mini.pos<=0){mini.pos=0;mini.dir=1;} marker.style.left=mini.pos+"%"; mini.raf=requestAnimationFrame(loop); }
  mini.raf=requestAnimationFrame(loop);
  document.getElementById("cutTap").addEventListener("click",()=>{
    if(!mini||mini.phase!==type)return;
    mini.taps++; const center=mini.pos+2, good=center>=mini.zoneL&&center<=mini.zoneL+mini.zoneW;
    if(good){mini.hits++;sfx.plant();}else sfx.no();
    document.getElementById("cutCount").textContent=mini.taps+" / "+info[2]+(good?"　✨":"　💦");
    if(mini.taps>=info[2]){ cookStop(); const rate=mini.hits/info[2]; completeCookingStep(rate>=0.8?3:rate>=0.4?2:1,false); }
  });
}
function startGaugeStep(type){
  const isHeat=type==="heat", zoneStart=hasKamado()?55:60, zoneEnd=hasKamado()?90:86;
  Object.assign(mini,{phase:type,gaugePct:0,gaugeDir:1,zoneStart,zoneEnd,running:true});
  openModal('<h2>'+(isHeat?'🔥 じっくり やこう！':'🍳 しゃきしゃき いためよう！')+'</h2><div class="mini-stage"><div class="mini-label">みどりの ところで ストップ！'+(isHeat?' こがさないでね':'')+'</div><div class="pan-gauge"><div class="pan-zone" style="left:'+zoneStart+'%;width:'+(zoneEnd-zoneStart)+'%"></div><div class="pan-fill" id="panFill"></div></div><button class="tap-btn" id="panStop">ストップ！</button></div>');
  const fill=document.getElementById("panFill");
  function loop(){
    if(!mini||mini.phase!==type||!mini.running)return;
    mini.gaugePct+=0.82*mini.gaugeDir;
    if(!isHeat && mini.gaugePct>=100){mini.gaugePct=100;mini.gaugeDir=-1;}
    if(!isHeat && mini.gaugePct<=0){mini.gaugePct=0;mini.gaugeDir=1;}
    fill.style.width=Math.max(0,Math.min(100,mini.gaugePct))+"%";
    if(isHeat && mini.gaugePct>=100){mini.running=false;completeCookingStep(1,true);return;}
    mini.raf=requestAnimationFrame(loop);
  }
  mini.raf=requestAnimationFrame(loop);
  document.getElementById("panStop").addEventListener("click",()=>{
    if(!mini||!mini.running)return; mini.running=false; cookStop();
    const d=mini.gaugePct<zoneStart?zoneStart-mini.gaugePct:mini.gaugePct>zoneEnd?mini.gaugePct-zoneEnd:0;
    completeCookingStep(d===0?3:d<=18?2:1,false);
  });
}
function completeCookingStep(score,burnt){
  if(!mini)return;
  mini.scores.push(score); if(burnt)mini.burnt=true; mini.stepIndex++;
  mini.timer=setTimeout(startCookingStep,320);
}
function finishCook(){
  if(!mini)return;
  const recipeId=mini.recipeId, r=RECIPES[recipeId], scores=mini.scores.slice(), burnt=mini.burnt;
  const average=scores.reduce((a,b)=>a+b,0)/Math.max(1,scores.length);
  const stars=burnt?1:(average>=2.6?3:average>=1.7?2:1);
  S.dishes.push({id:recipeId,stars}); if(S.dishes.length>30)S.dishes.shift();
  const rp=S.recipeProgress[recipeId]||(S.recipeProgress[recipeId]={bestStars:0,timesCooked:0});
  rp.bestStars=Math.max(rp.bestStars,stars); rp.timesCooked++;
  addCookingXp(2+(stars>=2?1:0)+(stars===3?2:0),recipeId);
  mini=null; save(); renderStatus(); sfx.cook();
  const kg=interiorGroups["interior:kitchen"], burstPos=(S.currentArea==="interior:kitchen"&&kg&&kg.userData.dishTableTop)?kg.userData.dishTableTop:kitchenPos;
  spawnBurst(burstPos,stars===3?0xffd54f:0xffcc80,stars===3?30:16); showCookingDisplay(recipeId,stars);
  const detail=scores.map((n,i)=>(i+1)+"こめ:"+"⭐".repeat(n)).join("　");
  const msg=burnt?"ちょっと こげちゃった！ つぎは だいじょうぶ！":"⭐".repeat(stars)+"<br>どうぶつに とどけてあげよう！";
  showRewardModal((DISH_ICON[recipeId]||"🍽️")+" できあがり！",r.name+"<br>"+msg+'<br><small>'+detail+'</small>');
  missionEvent("cook"); if(recipeId==="omelet"||recipeId==="cake")missionEvent("cook_lv5");
}

/* ---- どうぶつ ---- */
/* 住民ごとの会話：初対面/通常/中間/仲良し最大 のステージを friendship から判定し、
   RESIDENTS[id].dialogue から個別の台詞を選ぶ（全住民共通の使い回しをやめた）。 */
function pickResidentLine(animalId){
  const r = RESIDENTS[animalId];
  const f = S.friends[animalId] || 0;
  const rs = S.residents[animalId] || {};
  if(!rs.metOnce) return r.dialogue.firstMeet;
  if(f >= 5) return r.dialogue.maxFriend;
  if(f >= 3) return r.dialogue.midFriend;
  const arr = r.dialogue.normal;
  return arr[Math.floor(Math.random()*arr.length)];
}
function talkAnimal(animalId){
  ensureOrders();
  sfx.talk();
  const a = ANIMALS[animalId];
  const r = RESIDENTS[animalId];
  const oi = orderOf(animalId);
  const heart = '<p style="text-align:center;margin:4px 0"><span class="hearts">'+("❤️".repeat(Math.min(5,S.friends[animalId]||0))||"🤍")+'</span></p>';
  let h = '<h2>'+a.icon+' '+a.name+'</h2>'+heart;
  if(oi >= 0){
    const dish = S.orders[oi].dish;
    const di = bestDishIdx(dish);
    h += '<p style="text-align:center;font-weight:900;font-size:16px;line-height:1.7">「'+RECIPES[dish].name+'を おねがい！」</p>';
    if(di >= 0){
      h += '<button class="mBtn" id="mGive">'+(DISH_ICON[dish]||"🍽️")+' とどける！</button>';
    } else {
      h += '<p style="text-align:center;font-weight:900;opacity:.7">キッチンで つくって きてあげよう！</p>';
    }
  } else {
    h += '<p style="text-align:center;font-weight:900;font-size:16px;line-height:1.7">「'+pickResidentLine(animalId)+'」</p>';
  }
  /* 個別依頼：inv/dish タイプのみここで受け渡し可能（find/well は別トリガー） */
  const rs = S.residents[animalId];
  const q = r.quest;
  if(q && rs && !rs.questDone && (q.type==="inv" || q.type==="dish")){
    const ok = q.type==="inv" ? (S.inv[q.item]||0) >= q.count : bestDishIdx(q.item) >= 0;
    h += '<p style="text-align:center;font-weight:900;font-size:13px;margin:6px 0 0;opacity:.85">📋 '+q.text+'</p>';
    if(ok) h += '<button class="mBtn" id="mQuest">わたす</button>';
  }
  h += '<button class="mBtn sub" id="mClose">またね</button>';
  openModal(h);

function fulfillQuest(animalId){
  const q = RESIDENTS[animalId].quest;
  if(q.type==="inv") S.inv[q.item] -= q.count;
  else if(q.type==="dish"){ const di=bestDishIdx(q.item); if(di>=0) S.dishes.splice(di,1); }
  completeQuest(animalId);
}
function completeQuest(animalId){
  const rs = S.residents[animalId];
  if(!rs || rs.questDone) return;
  rs.questDone = true;
  const q = RESIDENTS[animalId].quest;
  S.crowns += q.reward.crowns; S.totalCrowns += q.reward.crowns;
  if((S.friends[animalId]||0) < 5) S.friends[animalId] = Math.min(5, (S.friends[animalId]||0) + q.reward.friendship);
  if(S.friends[animalId] === 5) rebuildFriendHouses();
  const ig = interiorGroups["interior:resident_"+animalId];
  if(ig && ig.userData.giftShelf) ig.userData.giftShelf.visible = true;
  save(); renderStatus(); sfx.crown();
  closeModal();
  showRewardModal("📋 おねがい かんりょう！", ANIMALS[animalId].icon+" "+ANIMALS[animalId].name+"<br>👑 "+q.reward.crowns+"こ ゲット！<br>🎁 "+q.giftLabel+"を もらった！");
}
function completeQuestByType(type){
  Object.keys(RESIDENTS).forEach(id=>{
    const q = RESIDENTS[id].quest;
    const rs = S.residents[id];
    if(q && q.type===type && rs && !rs.questDone) completeQuest(id);
  });
}
function deliver(animalId, oi){
  const dish = S.orders[oi].dish;
  const di = bestDishIdx(dish);
  if(di < 0){ closeModal(); return; }
  const stars = S.dishes[di].stars;
  S.dishes.splice(di, 1);
  const resident = RESIDENTS[animalId];
  const favorites = [resident.favoriteDish].concat(resident.phase3Favorites||[]);
  const isFavorite = favorites.indexOf(dish) >= 0;
  const reward = 10 + stars * 3 + (isFavorite?2:0) + (stars===3?2:0);
  let becameResident = false;
  if((S.friends[animalId]||0) < 5){
    S.friends[animalId]++;
    if(S.friends[animalId] === 5){ becameResident = true; rebuildFriendHouses(); }
  }
  let gotPiece = false;
  S.pity++;
  if(!S.treasureReady && S.mapPieces < 4){
    if(Math.random() < 0.35 || S.pity >= 3){
      S.mapPieces++; S.pity = 0; gotPiece = true;
      if(S.mapPieces >= 4){ S.treasureReady = true; placeTreasure(); }
    }
  }
  S.orders[oi] = makeOrder(S.orders[1-oi] ? S.orders[1-oi].animal : null);
  if(isFavorite) addCookingXp(1);
  addCrowns(reward);
  save();
  sfx.crown();
  const anm = animalMeshes[animalId];
  if(anm) spawnBurst(anm.group.position, 0xff9ecb, 18);
  let extra = "";
  if(isFavorite) extra += "<br>💛 だいこうぶつ！ とっても うれしそう！";
  if(stars===3) extra += "<br>✨ さいこうの できばえに びっくり！";
  if(becameResident) extra += "<br>🏠 " + ANIMALS[animalId].name + "が むらに ひっこしてきた！";
  if(gotPiece) extra += "<br>🗺️ ちずの かけらを もらった！（" + S.mapPieces + "/4）";
  if(S.treasureReady) extra += "<br>✨ ちずが かんせい！ ❌じるしを さがして ほろう！";
  showRewardModal("💝 ありがとう！", "⭐".repeat(stars) + " の " + RECIPES[dish].name + "を とどけた！<br><b>👑 " + reward + "こ ゲット！</b>" + extra);
  missionEvent("deliver");
  if(gotPiece) missionEvent("piece");
  updateAnimalMarks();
  setTimeout(checkStateMission, 80);
}

const WORLD_R = 46;
function terrainHeight(x, z){
  const d = Math.sqrt(x*x + z*z);
  let h = 0;
  if(d > 24) h += (d-24) * 0.11;
  h += Math.sin(x*0.24) * Math.cos(z*0.21) * 0.32 * Math.min(1, Math.max(0, (d-14)/12));
  return h;
}
(function buildGround(){
  const seg = 72;
  const g = new THREE.PlaneGeometry(WORLD_R*2.4, WORLD_R*2.4, seg, seg);
  g.rotateX(-Math.PI/2);
  const pos = g.attributes.position;
  const colors = [];
  const c1 = new THREE.Color(0x9fdc7e), c2 = new THREE.Color(0x7cc95f), c3 = new THREE.Color(0xb8e698);
  for(let i=0;i<pos.count;i++){
    const x = pos.getX(i), z = pos.getZ(i);
    pos.setY(i, terrainHeight(x, z));
    const n = (Math.sin(x*0.7)*Math.cos(z*0.8)+1)/2;
    const c = c1.clone().lerp(n>0.6?c3:c2, Math.abs(n-0.5)*1.4);
    colors.push(c.r, c.g, c.b);
  }
  g.setAttribute("color", new THREE.Float32BufferAttribute(colors, 3));
  g.computeVertexNormals();
  const m = new THREE.Mesh(g, new THREE.MeshLambertMaterial({ vertexColors:true }));
  m.receiveShadow = true;
  scene.add(m);
})();

/* ---- 小道 ---- */
function addPath(x1,z1,x2,z2,w){
  const dx=x2-x1, dz=z2-z1, len=Math.sqrt(dx*dx+dz*dz);
  const g=new THREE.PlaneGeometry(w||1.6, len, 1, Math.max(2,Math.round(len/2)));
  g.rotateX(-Math.PI/2);
  const m=new THREE.Mesh(g, mat(0xb89a68));
  m.position.set((x1+x2)/2, 0, (z1+z2)/2);
  m.rotation.y = Math.atan2(dx, dz);
  const pos=m.geometry.attributes.position;
  m.updateMatrixWorld();
  for(let i=0;i<pos.count;i++){
    const v=new THREE.Vector3(pos.getX(i),0,pos.getZ(i)).applyMatrix4(m.matrixWorld);
    pos.setY(i, terrainHeight(v.x, v.z) - m.position.y + 0.05);
  }
  m.geometry.computeVertexNormals();
  m.receiveShadow = true;
  scene.add(m);
}

(function scatter(){
  const spots = [];
  function ok(x,z,min){
    if(Math.abs(x+23) < 6) return false;               /* 川 */
    if(Math.sqrt(x*x+z*z) < 7) return false;            /* 広場 */
    if(x>7 && x<19 && z>2 && z<12) return false;        /* はたけ */
    for(const s of spots){ if((s.x-x)**2+(s.z-z)**2 < min*min) return false; }
    return true;
  }
  let tries=0;
  while(spots.length < 34 && tries++ < 500){
    const a = Math.random()*Math.PI*2, d = 12 + Math.random()*28;
    const x = Math.cos(a)*d, z = Math.sin(a)*d;
    if(!ok(x,z,3.4)) continue;
    spots.push({x,z});
    addTree(x, z, Math.random()<0.14 ? "sakura" : (Math.random()<0.4?"dark":"green"));
  }
  addTree(-5.5, 6.5, "sakura");
  for(let i=0;i<40;i++){
    const a=Math.random()*Math.PI*2, d=5+Math.random()*26;
    const x=Math.cos(a)*d, z=Math.sin(a)*d;
    if(Math.abs(x+23)<6) continue;
    addFlower(x,z);
  }
  for(let i=0;i<10;i++){
    const a=Math.random()*Math.PI*2, d=14+Math.random()*22;
    const x=Math.cos(a)*d, z=Math.sin(a)*d;
    if(Math.abs(x+23)<6.5) continue;
    addRock(x,z);
  }
})();

const plotBase = [];
const plotCropGroups = [];
const PLOT_ORIGIN = { x: 10.4, z: 5.2 };
const PLOT_COORDS = [
  [10.4,5.2],[13.5,5.2],[16.6,5.2],[10.4,8.3],[13.5,8.3],[16.6,8.3],
  [28,8],[31.1,8],[34.2,8],[28,11.1],[31.1,11.1],[34.2,11.1],
  [28,15.2],[32,15.2],[36,15.2],[39.1,15.2]
];
function plotXZ(i){ const p=PLOT_COORDS[i]||[PLOT_ORIGIN.x,PLOT_ORIGIN.z]; return {x:p[0],z:p[1]}; }
function plotPos(i){ const p = plotXZ(i); return new THREE.Vector3(p.x, terrainHeight(p.x,p.z)+0.6, p.z); }
function rebuildPlots(){
  for(let i=0;i<PLOT_DEFS.length;i++){
    if(!plotBase[i]){
      const p = plotXZ(i);
      const g = new THREE.Group();
      const def = PLOT_DEFS[i];
      const baseColor = def.type==="orchard" ? 0x6f9f54 : def.type==="herb" ? 0xb78658 : 0x9a6b45;
      const soilMat = mat(baseColor);
      const soil = new THREE.Mesh(new THREE.BoxGeometry(def.type==="orchard"?3.1:2.5, 0.3, def.type==="orchard"?3.1:2.5), soilMat);
      soil.position.y = 0.15; soil.receiveShadow = true; g.add(soil);
      for(let r=0;r<(def.type==="orchard"?0:3);r++){
        const ridge = new THREE.Mesh(new THREE.BoxGeometry(2.3, 0.1, 0.34), mat(0x8a5c3a));
        ridge.position.set(0, 0.32, -0.75 + r*0.75); g.add(ridge);
      }
      if(def.type==="orchard"){
        const ring = new THREE.Mesh(new THREE.TorusGeometry(1.22,0.07,5,16),mat(0xd7b26d));
        ring.rotation.x=Math.PI/2; ring.position.y=0.35; g.add(ring);
      } else if(def.type==="herb"){
        for(const x of [-1.15,1.15]){ const edge=new THREE.Mesh(new THREE.BoxGeometry(0.12,0.28,2.5),mat(0xd7b26d)); edge.position.set(x,0.38,0); g.add(edge); }
      }
      const lock = new THREE.Group();
      const lockBody = new THREE.Mesh(new THREE.BoxGeometry(0.65,0.55,0.18),mat(0x87919a)); lockBody.position.y=0.75; lock.add(lockBody);
      const lockArc = new THREE.Mesh(new THREE.TorusGeometry(0.22,0.07,5,10,Math.PI),mat(0xc5cbd1)); lockArc.position.y=1.03; lock.add(lockArc);
      lock.userData.isLockMarker=true; g.add(lock);
      placeOnGround(g, p.x, p.z);
      g.userData.soilMat=soilMat; g.userData.lockMarker=lock; g.userData.baseColor=baseColor;
      plotBase[i] = g;
      const cg = new THREE.Group();
      g.add(cg);
      plotCropGroups[i] = cg;
    }
  }
  refreshPlotLocks();
}
function refreshPlotLocks(){
  PLOT_DEFS.forEach((def,i)=>{
    const g=plotBase[i], p=S.plots[i]; if(!g||!p) return;
    g.userData.lockMarker.visible=!p.unlocked;
    g.userData.soilMat.color.setHex(p.unlocked?g.userData.baseColor:0x697278);
  });
}
function buildCropMesh(crop, ratio){
  const g = new THREE.Group();
  const s = 0.35 + ratio*0.65;
  function leafBunch(y){
    for(let k=0;k<3;k++){
      const lf = new THREE.Mesh(new THREE.ConeGeometry(0.1, 0.42, 5), mat(0x5da653));
      lf.position.set(Math.cos(k*2.1)*0.1, y+0.2, Math.sin(k*2.1)*0.1);
      lf.rotation.z = Math.cos(k*2.1)*0.5; lf.rotation.x = -Math.sin(k*2.1)*0.5;
      g.add(lf);
    }
  }
  if(crop === "apple"){
    const trunk = new THREE.Mesh(new THREE.CylinderGeometry(0.13,0.18,1.1,7),mat(0x875b38)); trunk.position.y=0.55; g.add(trunk);
    const crown = new THREE.Mesh(new THREE.SphereGeometry(0.68,9,7),mat(0x579b50)); crown.scale.set(1,0.78,1); crown.position.y=1.35; g.add(crown);
    if(ratio>=1){ for(let k=0;k<5;k++){ const a=new THREE.Mesh(new THREE.SphereGeometry(0.1,6,5),mat(0xe74c4c)); a.position.set(Math.cos(k*1.26)*0.47,1.25+(k%2)*0.25,Math.sin(k*1.26)*0.47); g.add(a); } }
  } else if(ratio < 0.35){
    const sp = new THREE.Mesh(new THREE.ConeGeometry(0.09, 0.3, 5), mat(0x7cc95f));
    sp.position.y = 0.15; g.add(sp);
  } else if(crop === "ninjin"){
    leafBunch(0.05);
    if(ratio>=1){ const top=new THREE.Mesh(new THREE.CylinderGeometry(0.14,0.1,0.14,7),mat(0xf28a3c)); top.position.y=0.08; g.add(top); }
  } else if(crop === "tomato"){
    const bush = new THREE.Mesh(new THREE.SphereGeometry(0.32*s, 7, 6), mat(0x5da653));
    bush.position.y = 0.3*s + 0.1; g.add(bush);
    if(ratio>=1){ for(let k=0;k<3;k++){ const t=new THREE.Mesh(new THREE.SphereGeometry(0.11,6,5),mat(0xef5350)); t.position.set(Math.cos(k*2.1)*0.24, 0.34+Math.sin(k)*0.1, Math.sin(k*2.1)*0.24); g.add(t);} }
  } else if(crop === "ichigo"){
    const bush = new THREE.Mesh(new THREE.SphereGeometry(0.26*s, 7, 6), mat(0x74c46a));
    bush.position.y = 0.2*s + 0.06; g.add(bush);
    if(ratio>=1){ for(let k=0;k<3;k++){ const b=new THREE.Mesh(new THREE.ConeGeometry(0.09,0.15,6),mat(0xe05572)); b.rotation.x=Math.PI; b.position.set(Math.cos(k*2.1)*0.2, 0.16, Math.sin(k*2.1)*0.2); g.add(b);} }
  } else if(crop === "corn"){
    const stalk = new THREE.Mesh(new THREE.CylinderGeometry(0.07, 0.1, 1.1*s, 6), mat(0x5da653));
    stalk.position.y = 0.55*s; g.add(stalk);
    leafBunch(0.3*s);
    if(ratio>=1){ const cob=new THREE.Mesh(new THREE.SphereGeometry(0.16,7,6),mat(0xffd24d)); cob.scale.set(1,1.7,1); cob.position.set(0.14,0.65,0); g.add(cob); }
  } else if(crop === "komugi"){
    for(let k=0;k<5;k++){
      const st = new THREE.Mesh(new THREE.CylinderGeometry(0.03,0.03,0.85*s,4), mat(ratio>=1?0xe8c25a:0x9fdc7e));
      st.position.set(Math.cos(k*1.26)*0.16, 0.42*s, Math.sin(k*1.26)*0.16);
      st.rotation.z = Math.cos(k)*0.12;
      g.add(st);
      if(ratio>=1){ const ear=new THREE.Mesh(new THREE.SphereGeometry(0.06,5,4),mat(0xffd24d)); ear.scale.set(1,1.9,1); ear.position.set(Math.cos(k*1.26)*0.2, 0.85*s, Math.sin(k*1.26)*0.16); g.add(ear); }
    }
  } else if(crop === "potato"){
    leafBunch(0.12);
    if(ratio>=1){ for(let k=0;k<3;k++){ const t=new THREE.Mesh(new THREE.SphereGeometry(0.13,7,5),mat(0xc59a62)); t.scale.set(1.25,0.8,1); t.position.set((k-1)*0.2,0.1,(k%2)*0.16); g.add(t); } }
  } else if(crop === "pumpkin"){
    const vine=new THREE.Mesh(new THREE.TorusGeometry(0.28*s,0.035,5,12),mat(0x4f9f55)); vine.rotation.x=Math.PI/2; vine.position.y=0.08; g.add(vine);
    if(ratio>=1){ const p=new THREE.Mesh(new THREE.SphereGeometry(0.25,8,6),mat(0xf39c35)); p.scale.y=0.78; p.position.y=0.22; g.add(p); }
  } else if(crop === "onion"){
    leafBunch(0.15);
    if(ratio>=1){ const b=new THREE.Mesh(new THREE.SphereGeometry(0.2,8,6),mat(0xf0d59a)); b.scale.y=0.9; b.position.y=0.16; g.add(b); }
  } else if(crop === "cabbage"){
    for(let k=0;k<5;k++){ const lf=new THREE.Mesh(new THREE.SphereGeometry(0.18*s,7,5),mat(k%2?0x77ba65:0x9bd586)); lf.scale.set(1.4,0.45,0.8); lf.position.set(Math.cos(k*1.26)*0.16,0.16,Math.sin(k*1.26)*0.16); lf.rotation.y=k*1.26; g.add(lf); }
  } else if(crop === "herb"){
    for(let k=0;k<6;k++){ const st=new THREE.Mesh(new THREE.CylinderGeometry(0.025,0.03,0.5*s,5),mat(0x4f9f63)); st.position.set((k%3-1)*0.13,0.25*s,Math.floor(k/3)*0.16-0.08); g.add(st); const lf=new THREE.Mesh(new THREE.SphereGeometry(0.08,6,4),mat(0x78c58a)); lf.scale.set(1.5,0.55,1); lf.position.set(st.position.x,0.52*s,st.position.z); g.add(lf); }
  }
  return g;
}
const plotState = [];
function refreshCrops(){
  for(let i=0;i<PLOT_DEFS.length;i++){
    const cg = plotCropGroups[i];
    if(!cg) continue;
    const p = S.plots[i];
    const key = p && p.cropId ? (p.cropId + "|" + Math.floor(cropRatio(p)*10) + "|" + (p.harvestCount||0)) : "empty";
    if(plotState[i] === key) continue;
    plotState[i] = key;
    while(cg.children.length){ const old=cg.children[0]; cg.remove(old); disposeTree(old); }
    if(!p || !p.unlocked || !p.cropId) continue;
    const r = cropRatio(p);
    const positions = [[-0.7,-0.75],[0.15,-0.75],[-0.7,0],[0.15,0],[-0.7,0.75],[0.15,0.75],[0.85,-0.4],[0.85,0.4]];
    const cropCount = p.type==="orchard" ? 1 : p.type==="herb" ? 7 : 5;
    for(let k=0;k<cropCount;k++){
      const cm = buildCropMesh(p.cropId, r);
      cm.position.set(positions[k][0]+0.28, 0.32, positions[k][1]);
      cg.add(cm);
    }
  }
}

let treasureMark = null;
function placeTreasure(){
  removeTreasure();
  let x=0, z=0, tries=0;
  do{
    const a = Math.random()*Math.PI*2, d = 13 + Math.random()*9;
    x = Math.cos(a)*d; z = Math.sin(a)*d; tries++;

function dayPhase(){ return (performance.now()/1000 % DAY_LEN) / DAY_LEN; }
function updateSky(){
  const t = dayPhase();
  /* 0-0.55 昼 / 0.55-0.65 ゆうやけ / 0.65-0.92 よる / 0.92-1 あさやけ */
  let sky, fogC, sunI, hemiI, nightK;
  const c = new THREE.Color();
  if(t < 0.55){ sky = skyDay; fogC = fogDay; sunI = 1.0; hemiI = 0.62; nightK = 0; }
  else if(t < 0.65){ const k=(t-0.55)/0.1; sky=c.copy(skyDay).lerp(skyDusk,k); fogC=fogDay.clone().lerp(fogNight,k*0.5); sunI=1.0-k*0.6; hemiI=0.62-k*0.24; nightK=k*0.5; }
  else if(t < 0.9){ const k=Math.min(1,(t-0.65)/0.08); sky=c.copy(skyDusk).lerp(skyNight,k); fogC=fogNight; sunI=0.4-k*0.25; hemiI=0.38-k*0.14; nightK=0.5+k*0.5; }
  else { const k=(t-0.9)/0.1; sky=c.copy(skyNight).lerp(skyDay,k); fogC=fogNight.clone().lerp(fogDay,k); sunI=0.15+k*0.85; hemiI=0.24+k*0.38; nightK=1-k; }
  renderer.setClearColor(sky);
  if(scene.fog) scene.fog.color.copy(fogC);
  const indoors = S.currentArea !== "village";
  sun.intensity = indoors ? 0.18 : sunI;
  hemi.intensity = indoors ? 0.28 : hemiI;
  stars.material.opacity = Math.max(0, nightK - 0.25) * 1.1;
  const ang = t * Math.PI * 2 - Math.PI/2;
  sunBall.position.set(Math.cos(ang)*80, Math.sin(ang)*55 + 8, -40);
  moon.position.set(-Math.cos(ang)*80, -Math.sin(ang)*55 + 8, -40);
  sun.position.set(Math.cos(ang)*30, Math.max(6, Math.sin(ang)*30 + 6), 12);
  const winGlow = nightK > 0.4 ? 0.9 : 0;
  windowMats.forEach(m=>{ m.emissive.setHex(0xffe08a); m.emissiveIntensity = winGlow; });
  fireflies.forEach(f=>{ f.m.material.opacity = Math.max(0, nightK-0.35) * (0.5 + 0.5*Math.sin(performance.now()/300 + f.phase)); });
}

function disposeTree(obj){
  if(!obj) return;
  obj.traverse ? obj.traverse(disposeOne) : disposeOne(obj);

    if(o.geometry && o.geometry.dispose) o.geometry.dispose();
    if(o.material && o.material.dispose) o.material.dispose();
  }
}

const stickZone = document.getElementById("stickZone");
const stickBase = document.getElementById("stickBase");
const stickNub = document.getElementById("stickNub");
let stickActive = false, stickId = null, stickOrigin = {x:0,y:0}, stickVec = {x:0,y:0};
function stickStart(x, y, id){
  stickActive = true; stickId = id;
  stickOrigin = { x, y };
  stickBase.style.display = "block"; stickNub.style.display = "block";
  stickBase.style.left = (x-55)+"px"; stickBase.style.top = (y-55)+"px";
  stickNub.style.left = (x-26)+"px"; stickNub.style.top = (y-26)+"px";
  stickVec = {x:0, y:0};
}
function stickMove(x, y){
  let dx = x - stickOrigin.x, dy = y - stickOrigin.y;
  const len = Math.sqrt(dx*dx+dy*dy), max = 46;
  if(len > max){ dx = dx/len*max; dy = dy/len*max; }
  stickNub.style.left = (stickOrigin.x + dx - 26) + "px";
  stickNub.style.top = (stickOrigin.y + dy - 26) + "px";
  stickVec = { x: dx/max, y: dy/max };
}
function stickEnd(){
  stickActive = false; stickId = null; stickVec = {x:0,y:0};
  stickBase.style.display = "none"; stickNub.style.display = "none";
}
stickZone.addEventListener("touchstart", (e)=>{
  ensureAudio(); initBgm();
  const t = e.changedTouches[0];
  stickStart(t.clientX, t.clientY, t.identifier);
  e.preventDefault();
}, {passive:false});
window.addEventListener("touchmove", (e)=>{
  if(!stickActive) return;
  for(const t of e.changedTouches){ if(t.identifier===stickId){ stickMove(t.clientX, t.clientY); e.preventDefault(); } }
}, {passive:false});
window.addEventListener("touchend", (e)=>{
  for(const t of e.changedTouches){ if(t.identifier===stickId) stickEnd(); }
});
window.addEventListener("touchcancel", stickEnd);
/* マウス（PC確認用） */
stickZone.addEventListener("mousedown", (e)=>{ ensureAudio(); initBgm(); stickStart(e.clientX, e.clientY, "m"); });
window.addEventListener("mousemove", (e)=>{ if(stickActive && stickId==="m") stickMove(e.clientX, e.clientY); });
window.addEventListener("mouseup", ()=>{ if(stickId==="m") stickEnd(); });

function inputVec(){
  let x = stickVec.x, y = stickVec.y;
  if(keys["arrowleft"]||keys["a"]) x -= 1;
  if(keys["arrowright"]||keys["d"]) x += 1;
  if(keys["arrowup"]||keys["w"]) y -= 1;
  if(keys["arrowdown"]||keys["s"]) y += 1;
  const len = Math.sqrt(x*x+y*y);
  if(len > 1){ x/=len; y/=len; }
  return {x, y};
}

const interiorGroups = {};
let savedVillageVisibility = null;
let savedFogRef = null;
const InteriorSystem = {
  build(interiorId){
    if(interiorGroups[interiorId]) return interiorGroups[interiorId];
    const g = buildInteriorContent(interiorId);
    interiorGroups[interiorId] = g;
    return g;
  },
  enter(interiorId){
    if(!INTERIORS[interiorId] || S.currentArea === interiorId) return;
    const cfg = INTERIORS[interiorId];
    this.build(interiorId);
    const g = interiorGroups[interiorId];
    /* 村の全オブジェクトを非表示にし、対象の室内グループだけ表示する */
    savedVillageVisibility = [];
    scene.children.forEach(o=>{
      if(o === player || o === petMesh) return;
      if(o.userData && o.userData.isInterior) return;
      if(o instanceof THREE.Light) return; /* hemi/sun はグローバル照明なので村を隠しても消さない */
      savedVillageVisibility.push({ o, vis:o.visible });
      o.visible = false;
    });
    g.visible = true;
    savedFogRef = scene.fog;
    scene.fog = null; /* 室内はfogの影響を受けない（近距離が白飛びしないように） */
    S.outdoorPos = { x:player.position.x, z:player.position.z, ry:player.rotation.y };
    player.position.set(g.userData.entrance.x, 0.05, g.userData.entrance.z);
    player.rotation.y = Math.PI;
    S.currentArea = interiorId;
    if(cfg.buildingId){ S.buildings[cfg.buildingId] = S.buildings[cfg.buildingId] || {visited:false}; S.buildings[cfg.buildingId].visited = true; }
    if(cfg.residentId){
      S.interiors[interiorId] = S.interiors[interiorId] || { visited:false };
      S.interiors[interiorId].visited = true;
      maybeFriendshipEvent(cfg.residentId);
    }
    save();
    sfx.talk();
  },
  exit(){
    const interiorId = S.currentArea;
    const cfg = INTERIORS[interiorId];
    if(!cfg) return;
    if(interiorId === "interior:kitchen") clearCookingDisplay();
    if(interiorGroups[interiorId]) interiorGroups[interiorId].visible = false;
    if(savedVillageVisibility){ savedVillageVisibility.forEach(e=>{ e.o.visible = e.vis; }); savedVillageVisibility = null; }
    scene.fog = savedFogRef;
    S.currentArea = "village";
    const dp = cfg.doorPos;
    const ex = dp.x, ez = dp.z + 1.8;
    player.position.set(ex, terrainHeight(ex, ez), ez);
    player.rotation.y = S.outdoorPos ? S.outdoorPos.ry : 0;
    save();
  },
  update(dt, now){
    const interiorId = S.currentArea;
    if(interiorId === "village") return;
    const g = interiorGroups[interiorId];
    if(!g) return;
    if(g.userData.residentMesh) g.userData.residentMesh.position.y = Math.abs(Math.sin(now/500))*0.04;
  }
};
/* 仲良しイベント：移住済み(friendship>=5)かつ個別依頼クリア後、自宅への初回入室で一度だけ発生 */
function maybeFriendshipEvent(id){
  const rs = S.residents[id];
  if(!rs || rs.eventSeen) return;
  if((S.friends[id]||0) < 5 || !rs.questDone) return;
  rs.eventSeen = true;
  save();
  const r = RESIDENTS[id];
  showRewardModal("💛 なかよしイベント！", ANIMALS[id].icon+" "+ANIMALS[id].name+"<br>「"+r.dialogue.homeOnly[1]+"」<br>いっしょに おちゃを のんで、なかよく なった きがした！");
}

/* ================= インタラクション ================= */
const actBtn = document.getElementById("actBtn");
let actTarget = null;
function findInteract(){
  if(!player) return null;
  const p = player.position;
  const cands = [];
  function push(type, pos, dist, label, cls, data){
    const d = Math.sqrt((p.x-pos.x)**2 + (p.z-pos.z)**2);
    if(d < dist) cands.push({ type, d, label, cls, data });
  }
  if(S.currentArea !== "village") return findInteriorInteract(push, cands);
  for(let i=0;i<PLOT_DEFS.length;i++){
    const pp = plotXZ(i);
    const pl = S.plots[i];
    let label = pl && pl.unlocked ? "たねを まく" : "はたけを かいほう";
    if(pl && pl.unlocked && pl.cropId) label = cropRatio(pl) >= 1 ? "しゅうかく！" : "みずを あげる";
    const icon = pl && pl.type==="orchard" ? "🍎 " : pl && pl.type==="herb" ? "🌿 " : "🌱 ";
    push("plot", pp, PLOT_DEFS[i].type==="orchard"?2.7:2.3, icon + label, "", i);
  }
  push("door", playerHousePos, 2.6, "🚪 " + INTERIORS["interior:player"].label, "", "interior:player");
  push("door", kitchenPos, 2.9, "🍳 " + INTERIORS["interior:kitchen"].label, "", "interior:kitchen");
  push("door", shopPos, 2.8, "🛍️ " + INTERIORS["interior:boutique"].label, "", "interior:boutique");
  if(wellGroup) push("well", wellPos, 2.4, "⛲ みんなに みず", "", null);
  if(coopGroup){
    const n = pendingEggs();
    push("coop", coopPos, 2.8, n>0 ? ("🥚 たまご ×"+n) : "🐔 にわとりごや", "", null);
  }
  Object.keys(animalMeshes).forEach(id=>{
    push("animal", animalMeshes[id].group.position, 2.2, ANIMALS[id].icon + " はなす", "talk", id);
    if(builtFriendHouses[id]){
      const home = ANIMAL_HOME[id];
      push("door", home, 2.6, "🚪 " + INTERIORS["interior:resident_"+id].label, "", "interior:resident_"+id);
    }
  });
  if(treasureMark) push("treasure", treasureMark.position, 2.2, "⛏️ ほる！", "", null);
  if(!cands.length) return null;
  cands.sort((a,b)=>a.d-b.d);
  return cands[0];
}
/* 室内では村と別の候補セット（家具・住民・出口）を使う */
function findInteriorInteract(push, cands){
  const interiorId = S.currentArea;
  const cfg = INTERIORS[interiorId];
  const g = interiorGroups[interiorId];
  if(!cfg || !g) return null;
  push("exit", g.userData.entrance, 1.6, "🚪 そとに でる", "", null);
  if(cfg.kind === "player" && g.userData.mirrorPos){
    push("mirror", g.userData.mirrorPos, 1.4, "🪞 きせかえを みる", "", null);
  } else if(cfg.kind === "kitchen" && g.userData.stovePos){
    push("stove", g.userData.stovePos, 1.5, "🍳 りょうりする", "", null);
  } else if(cfg.kind === "boutique" && g.userData.rackPos){
    push("rack", g.userData.rackPos, 1.6, "🛍️ おかいもの", "", null);
  } else if(cfg.kind === "resident"){
    const id = cfg.residentId;
    if(g.userData.residentMesh) push("animal", g.userData.residentMesh.position, 1.8, ANIMALS[id].icon + " はなす", "talk", id);
    if(g.userData.bookshelfPos){
      const rs = S.residents[id];
      if(rs && !rs.questDone) push("bookshelf", g.userData.bookshelfPos, 1.4, "📚 ほんだなを しらべる", "", id);
    }
  }
  if(!cands.length) return null;
  cands.sort((a,b)=>a.d-b.d);
  return cands[0];
}
function doAction(){
  if(!actTarget) return;
  ensureAudio(); initBgm();
  const t = actTarget;
  if(t.type === "plot") interactPlot(t.data);
  else if(t.type === "well") useWell();
  else if(t.type === "coop") collectEggs();
  else if(t.type === "animal") talkAnimal(t.data);
  else if(t.type === "treasure") digTreasure();
  else if(t.type === "door") InteriorSystem.enter(t.data);
  else if(t.type === "exit") InteriorSystem.exit();
  else if(t.type === "mirror") openShopModal();
  else if(t.type === "stove") openKitchenModal();
  else if(t.type === "rack") openShopModal();
  else if(t.type === "bookshelf") completeQuest(t.data);
}
actBtn.addEventListener("click", doAction);

/* ================= ループ ================= */
const camTarget = new THREE.Vector3();
let lastIndoorCameraMode = null;
let camAngle = 0;
let walkPhase = 0, stepTimer = 0;
const fxTrail = [];
let lastTime = performance.now();
function tick(now){
  requestAnimationFrame(tick);
  const dt = Math.min(0.05, (now - lastTime)/1000);
  lastTime = now;

  /* --- プレイヤー移動 --- */
  if(player && !modalOpen){
    const iv = inputVec();
    const mvLen = Math.sqrt(iv.x*iv.x + iv.y*iv.y);
    if(mvLen > 0.08){
      /* カメラ基準の移動 */
      const fw = new THREE.Vector3();
      camera.getWorldDirection(fw); fw.y = 0; fw.normalize();
      const right = new THREE.Vector3(fw.z, 0, -fw.x);
      const move = new THREE.Vector3()
        .addScaledVector(right, -iv.x)
        .addScaledVector(fw, -iv.y);
      move.normalize().multiplyScalar(4.6 * mvLen * dt);
      let nx = player.position.x + move.x;
      let nz = player.position.z + move.z;
      if(S.currentArea === "village"){
        /* 世界の端と川（村の当たり判定） */
        const nd = Math.sqrt(nx*nx + nz*nz);
        if(nd > 42){ nx = nx/nd*42; nz = nz/nd*42; }
        if(nx < -19.5 && !(nz > 0.5 && nz < 3.6)) nx = Math.max(nx, -19.5);  /* 橋以外は川に入れない */
        if(nx < -26.5) nx = -26.5;
        player.position.x = nx; player.position.z = nz;
        const onBridge = (nx < -18 && nx > -28 && nz > 0.5 && nz < 3.6);
        player.position.y = onBridge ? 0.72 : terrainHeight(nx, nz);
      } else {
        /* 室内の当たり判定：小さな部屋の範囲でクランプ（村の判定は使わない） */
        const mx = ROOM_W/2 - 0.5, mz = ROOM_D/2 - 0.4;
        nx = Math.max(-mx, Math.min(mx, nx));
        nz = Math.max(-mz, Math.min(mz, nz));
        player.position.x = nx; player.position.z = nz;
        player.position.y = 0.05;
      }
      const targetRot = Math.atan2(move.x, move.z);
      let dr = targetRot - player.rotation.y;
      while(dr > Math.PI) dr -= Math.PI*2;
      while(dr < -Math.PI) dr += Math.PI*2;
      player.rotation.y += dr * Math.min(1, dt*12);
      walkPhase += dt * 11 * mvLen;
      player.position.y += Math.abs(Math.sin(walkPhase)) * 0.07;
      stepTimer -= dt;
      if(stepTimer <= 0){ sfx.step(); stepTimer = 0.28; }
      /* FXトレイル */
      const fx = S.wardrobe.fx;
      if(fx && fx !== "fx_none" && Math.random() < 0.35){
        const col = fx==="fx_heart" ? 0xff8fb3 : fx==="fx_star" ? 0xffd54f : fx==="fx_niji" ? [0xff8a80,0xffd54f,0x80d8ff,0xba9df5][Math.floor(Math.random()*4)] : 0xfff59d;
        const m = new THREE.Mesh(new THREE.SphereGeometry(0.06, 5, 4), new THREE.MeshBasicMaterial({ color:col, transparent:true, opacity:0.9 }));
        m.position.copy(player.position); m.position.y += 0.3 + Math.random()*0.4;
        scene.add(m);
        fxTrail.push({ m, life:1 });
      }
    } else {
      walkPhase = 0;
    }
    /* にじいろのふく */
    if(player.userData.rainbowMat){
      player.userData.rainbowMat.color.setHSL((now/2400)%1, 0.65, 0.62);
    }
    if(player.userData.rainbowShoeMat){
      player.userData.rainbowShoeMat.color.setHSL((now/1800)%1, 0.7, 0.6);
    }
    /* あたまの浮遊アイテム */
  }

  /* --- ペット追従 --- */
  if(petMesh && player){
    const tgt = new THREE.Vector3(
      player.position.x - Math.sin(player.rotation.y)*0.75,
      player.position.y + 1.55 + Math.sin(now/400)*0.09,
      player.position.z - Math.cos(player.rotation.y)*0.75
    );
    petMesh.position.lerp(tgt, Math.min(1, dt*4.5));
    petMesh.rotation.y = player.rotation.y;
    if(petWings) petWings.children.forEach((w,i)=>{ w.rotation.z = Math.sin(now/70)*(i?0.7:-0.7); });
    if(petMesh.userData.spin) petMesh.rotation.y = now/500;
  }

  /* --- どうぶつAI（村のみ更新。室内では停止） --- */
  if(S.currentArea === "village")
  Object.keys(animalMeshes).forEach(id=>{
    const a = animalMeshes[id];
    const g = a.group;
    if(a.wait > 0){ a.wait -= dt; }
    else {
      const dx = a.target.x - g.position.x, dz = a.target.z - g.position.z;
      const d = Math.sqrt(dx*dx + dz*dz);
      if(d < 0.3){
        a.wait = 1.5 + Math.random()*3.5;
        const home = ANIMAL_HOME[id];
        const resident = (S.friends[id]||0) >= 5;
        const cx = resident ? home.x : home.x*0.55, cz = resident ? home.z : home.z*0.55;
        const ang = Math.random()*Math.PI*2, dist = 2 + Math.random()*5;
        let tx = cx + Math.cos(ang)*dist, tz = cz + Math.sin(ang)*dist;
        if(tx < -17) tx = -17;
        a.target.set(tx, 0, tz);
      } else {
        const sp = a.speed * dt;
        g.position.x += dx/d*sp; g.position.z += dz/d*sp;
        g.position.y = terrainHeight(g.position.x, g.position.z) + Math.abs(Math.sin(now/130 + id.length))*0.05;
        const tr = Math.atan2(dx, dz);
        let dr = tr - g.rotation.y;
        while(dr > Math.PI) dr -= Math.PI*2;
        while(dr < -Math.PI) dr += Math.PI*2;
        g.rotation.y += dr * Math.min(1, dt*7);
      }
    }
    /* プレイヤーの方を見る */
    if(player){
      const pd = g.position.distanceTo(player.position);
      if(pd < 4){
        const look = Math.atan2(player.position.x-g.position.x, player.position.z-g.position.z);
        let dr = look - g.rotation.y;
        while(dr > Math.PI) dr -= Math.PI*2;
        while(dr < -Math.PI) dr += Math.PI*2;
        g.rotation.y += dr * Math.min(1, dt*5);
      }
    }
    const u = g.userData;
    if(u.mark.visible){ u.mark.position.y = 1.75 + Math.sin(now/300)*0.09; u.markDot.position.y = 1.5 + Math.sin(now/300)*0.09; }
  });

  /* --- カメラ（室内は開いた上方から部屋全体を見る共通ドールハウス視点） --- */
  if(player){
    const indoors = S.currentArea !== "village";
    if(lastIndoorCameraMode !== indoors){
      camera.fov = indoors ? INTERIOR_CAMERA.fov : 60;
      camera.updateProjectionMatrix();
      lastIndoorCameraMode = indoors;
    }
    if(indoors){
      camTarget.lerp(new THREE.Vector3(
        player.position.x * INTERIOR_CAMERA.targetScale,
        INTERIOR_CAMERA.targetY,
        player.position.z * INTERIOR_CAMERA.targetScale
      ), Math.min(1, dt*5));
      const camPos = new THREE.Vector3(
        INTERIOR_CAMERA.position.x,
        INTERIOR_CAMERA.position.y,
        INTERIOR_CAMERA.position.z
      );
      const fromTarget = camPos.clone().sub(camTarget);
      if(fromTarget.length() < INTERIOR_CAMERA.minDistance){
        camPos.copy(camTarget).add(fromTarget.normalize().multiplyScalar(INTERIOR_CAMERA.minDistance));
      }
      camera.position.lerp(camPos, Math.min(1, dt*4));
    } else {
      camTarget.lerp(new THREE.Vector3(player.position.x, player.position.y + 1.2, player.position.z), Math.min(1, dt*5));
      const camPos = new THREE.Vector3(
        camTarget.x + Math.sin(camAngle)*8.5,
        camTarget.y + 5.2,
        camTarget.z + Math.cos(camAngle)*8.5
      );
      camera.position.lerp(camPos, Math.min(1, dt*4));
    }
    camera.lookAt(camTarget);
    sun.target.position.copy(player.position);
  }

  /* --- 室内更新 --- */
  InteriorSystem.update(dt, now);

  /* --- 環境（村の演出は村にいる時だけ） --- */
  updateSky();
  if(S.currentArea === "village"){
  swayTrees.forEach(t=>{ t.leaves.rotation.z = Math.sin(now/1300 + t.phase)*0.045; });
  clouds.forEach(c=>{ c.g.position.x += c.speed*dt; if(c.g.position.x > 70) c.g.position.x = -70; });
  if(waterMesh){
    const pos = waterMesh.geometry.attributes.position;
    for(let i=0;i<pos.count;i++){
      const x = pos.getX(i), z = pos.getZ(i);
      pos.setY(i, Math.sin(now/500 + z*0.4 + x*0.6)*0.06);
    }
    pos.needsUpdate = true;
  }
  if(fountainWater) fountainWater.position.y = 1.55 + Math.sin(now/250)*0.12;
  if(treasureMark) treasureMark.children[2].scale.setScalar(1 + Math.sin(now/280)*0.18);
  fireflies.forEach(f=>{
    f.m.position.x = f.base.x + Math.sin(now/900 + f.phase)*0.8;
    f.m.position.y = f.base.y + Math.sin(now/700 + f.phase*2)*0.4;
    f.m.position.z = f.base.z + Math.cos(now/800 + f.phase)*0.8;
  });
  if(Math.random() < dt*1.6) spawnSmoke();
  for(let i=smokes.length-1;i>=0;i--){
    const s = smokes[i];
    s.life -= dt*0.45;
    s.m.position.y += dt*0.9;
    s.m.position.x += dt*0.3;
    s.m.scale.setScalar(1 + (1-s.life)*1.4);
    s.m.material.opacity = s.life*0.6;
    if(s.life <= 0){ scene.remove(s.m); disposeTree(s.m); smokes.splice(i,1); }
  }
  /* --- さくもつ更新（間引き） --- */
  if(Math.floor(now/500) !== Math.floor((now-dt*1000)/500)) refreshCrops();
  /* きらきら（収穫可能） */
  for(let i=0;i<PLOT_DEFS.length;i++){
    const p = S.plots[i];
    if(p && p.unlocked && p.cropId && cropRatio(p) >= 1 && Math.random() < dt*2.2){
      const pp = plotPos(i);
      pp.x += (Math.random()-0.5)*1.8; pp.z += (Math.random()-0.5)*1.8;
      const m = new THREE.Mesh(new THREE.OctahedronGeometry(0.06), new THREE.MeshBasicMaterial({ color:0xfff59d, transparent:true, opacity:1 }));
      m.position.copy(pp);
      scene.add(m);
      fxTrail.push({ m, life:0.8 });
    }
  }
  } /* --- 村限定の演出ここまで --- */
  /* bursts/fxTrailの残留処理は村・室内どちらでも継続して減衰・破棄する */
  for(let i=bursts.length-1;i>=0;i--){
    const b = bursts[i];
    b.life -= dt*1.4;
    b.vy -= dt*7;
    b.m.position.x += b.vx*dt; b.m.position.y += b.vy*dt; b.m.position.z += b.vz*dt;
    b.m.material.opacity = Math.max(0, b.life);
    if(b.life <= 0){ scene.remove(b.m); disposeTree(b.m); bursts.splice(i,1); }
  }
  for(let i=fxTrail.length-1;i>=0;i--){
    const f = fxTrail[i];
    f.life -= dt*1.5;
    f.m.position.y += dt*0.5;
    f.m.material.opacity = Math.max(0, f.life*0.9);
    if(f.life <= 0){ scene.remove(f.m); disposeTree(f.m); fxTrail.splice(i,1); }
  }

  /* --- アクションボタン --- */
  if(!modalOpen){
    const t = findInteract();
    actTarget = t;
    if(t){
      actBtn.style.display = "block";
      actBtn.textContent = t.label;
      actBtn.className = t.cls || "";
    } else {
      actBtn.style.display = "none";
    }
  } else {
    actBtn.style.display = "none";
  }

  renderer.render(scene, camera);
}

/* ================= 起動 ================= */
/* 「おかえりなさい」：帰還時の追いつき通知（mura_v1.html startWelcome() と同等の判定）
   注意：save() は毎回 lastSeen を現在時刻へ上書きするため、離脱時間の判定は
   bootWorld() が save() を呼ぶ「前」の lastSeen 値を引数で受け取って行う。 */
function showWelcomeBack(prevLastSeen){
  const readyCount = S.plots.filter(p => p && cropRatio(p) >= 1).length;
  const eggs = pendingEggs();
  const away = Date.now() - (prevLastSeen || Date.now());
  if((readyCount > 0 || eggs > 0) && away > 60*1000){
    let lines = [];
    if(readyCount > 0) lines.push("🥕 さくもつが " + readyCount + "こ そだったよ！");
    if(eggs > 0) lines.push("🥚 たまごが うまれてるよ！");
    showRewardModal("🏡 おかえりなさい！", lines.join("<br>") + "<br>しゅうかくしに いこう！");
  } else if(S.totalCrowns === 0){
    toast("スティックで うごいて、ボタンで しらべよう！");
  }
}
function bootWorld(prevLastSeen){
  missionCatchup();
  ensureOrders();
  renderStatus();
  missionBanner(false);
  rebuildLevelBuildings();
  rebuildDecos();
  rebuildFriendHouses();
  rebuildPlayerLook();
  initAnimals();
  if(S.treasureReady) placeTreasure();
  updateAnimalMarks();
  /* 再読み込み時に室内にいた場合は、その室内エリアへ復元する（入口付近に配置） */
  if(S.currentArea && S.currentArea !== "village" && INTERIORS[S.currentArea]){
    const target = S.currentArea;
    S.currentArea = "village";
    InteriorSystem.enter(target);
  }
  save();
  setTimeout(checkStateMission, 400);
  setTimeout(()=>showWelcomeBack(prevLastSeen), 600);
}
(function init(){
  load();
  /* save() は毎回 lastSeen を現在時刻へ上書きするため、復帰判定用に
     load() 直後（まだ一度も save() していない時点）の値を確保しておく。
     以後 startBtn クリック時の save() や bootWorld() 内の save() が
     何度呼ばれても、この値だけは離脱前の本来の lastSeen を保つ。 */
  const prevLastSeen = S.lastSeen;
  const ov = document.getElementById("startOv");
  const startBtn = document.getElementById("startBtn");
  let picked = S.gender;
  if(S.gender){
    document.getElementById("genRow").style.display = "none";
    startBtn.style.display = "inline-block";
  }
  function pick(g, el){
    picked = g;
    document.querySelectorAll(".genBtn").forEach(b=>b.style.outline="none");
    el.style.outline = "4px solid #ffc93c";
    startBtn.style.display = "inline-block";
  }
  document.getElementById("gPrincess").addEventListener("click", function(){ pick("princess", this); });
  document.getElementById("gPrince").addEventListener("click", function(){ pick("prince", this); });
  startBtn.addEventListener("click", ()=>{
    ensureAudio(); initBgm();
    S.gender = picked || "princess";
    save();
    ov.style.display = "none";
    bootWorld(prevLastSeen);
  });
  /* 世界は先に組んでおく（背景として見える） */
  requestAnimationFrame(tick);
})();
</script>
