<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>うさぎとにんじん 〜キャッチ〜</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DotGothic16&family=M+PLUS+Rounded+1c:wght@400;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --sat:env(safe-area-inset-top,0px); --sab:env(safe-area-inset-bottom,0px);
    --sal:env(safe-area-inset-left,0px); --sar:env(safe-area-inset-right,0px);
    --sky-top:#bfe9ff; --sky-bot:#d9f6ff;
    --grass-top:#a9d977; --grass-bot:#7cbf4e;
    --cream:#fff6e6; --cream-line:#f0d9a8;
    --ink:#5a4326; --ink-soft:#8a7350;
    --pink:#ff9ec4; --pink-deep:#ff6fa8;
    --carrot:#ff8a3d; --gold:#ffd24d;
    --shadow:rgba(74,59,38,.18);
  }
  *{box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent;}
  html,body{height:100%; overflow:hidden;}
  body{font-family:"M PLUS Rounded 1c",sans-serif; background:#7cbf4e; color:var(--ink);
    user-select:none; -webkit-user-select:none; touch-action:none;}
  #game{position:fixed; inset:0; display:flex; align-items:center; justify-content:center;}
  canvas{display:block; width:100%; height:100%; touch-action:none;}

  .layer{position:absolute; inset:0; display:flex; flex-direction:column;
    align-items:center; justify-content:center; text-align:center;
    padding:max(var(--sat),16px) 20px max(var(--sab),16px); pointer-events:none;}
  .layer.show{pointer-events:auto;}
  .layer:not(.show){display:none;}
  .panel{background:var(--cream); border:4px solid var(--ink); border-radius:22px;
    box-shadow:0 8px 0 var(--shadow), inset 0 0 0 4px var(--cream-line);
    padding:26px 26px 30px; max-width:380px; width:100%;}
  .title{font-family:"DotGothic16",sans-serif; font-size:clamp(22px,7vw,32px);
    line-height:1.35; color:var(--ink); text-shadow:2px 2px 0 var(--gold); margin-bottom:4px;}
  .subtitle{font-family:"DotGothic16",sans-serif; font-size:clamp(12px,3.6vw,15px);
    color:var(--pink-deep); margin-bottom:18px;}
  .lead{font-size:14px; color:var(--ink-soft); line-height:1.7; margin:2px 0 18px;}
  .modes{display:flex; flex-direction:column; gap:12px;}
  .btn{font-family:"DotGothic16",sans-serif; border:3px solid var(--ink); border-radius:16px;
    padding:14px 18px; font-size:18px; color:var(--ink); cursor:pointer;
    box-shadow:0 5px 0 var(--shadow); transition:transform .06s ease, box-shadow .06s ease;
    display:flex; align-items:center; justify-content:center; gap:10px;}
  .btn:active{transform:translateY(4px); box-shadow:0 1px 0 var(--shadow);}
  .btn .em{font-size:22px;}
  .btn .sub{font-family:"M PLUS Rounded 1c"; font-size:12px; color:var(--ink-soft); font-weight:700;}
  .btn-easy{background:#cdeeff;}
  .btn-hard{background:#ffd7e6;}
  .btn-play{background:var(--gold); width:100%; margin-top:6px;}
  .btn-ghost{background:transparent; box-shadow:none; border-color:transparent; color:var(--ink-soft); font-size:14px; padding:8px;}

  #hud{position:absolute; left:0; right:0; top:max(var(--sat),10px);
    display:none; align-items:center; justify-content:space-between;
    padding:0 max(var(--sal),12px) 0 max(var(--sar),12px); pointer-events:none;}
  #hud.show{display:flex;}
  .chip{background:var(--cream); border:3px solid var(--ink); border-radius:14px;
    box-shadow:0 4px 0 var(--shadow); padding:6px 14px; display:flex; align-items:center; gap:7px;
    font-family:"DotGothic16",sans-serif; font-size:18px; color:var(--ink);}
  .chip small{font-family:"M PLUS Rounded 1c"; font-size:11px; font-weight:700; color:var(--ink-soft);}
  #timeChip.low{color:var(--pink-deep); animation:pulse .5s infinite alternate;}
  @keyframes pulse{to{transform:scale(1.08);}}

  .corner{position:absolute; pointer-events:auto; background:var(--cream); border:3px solid var(--ink);
    border-radius:50%; width:46px; height:46px; display:flex; align-items:center; justify-content:center;
    font-size:22px; box-shadow:0 4px 0 var(--shadow); cursor:pointer;}
  .corner:active{transform:translateY(3px); box-shadow:0 1px 0 var(--shadow);}
  #backBtn{top:max(var(--sat),10px); left:max(var(--sal),12px);}
  #soundBtn{bottom:max(var(--sab),12px); right:max(var(--sar),12px);}

  .result-score{font-family:"DotGothic16",sans-serif; font-size:46px; color:var(--carrot);
    text-shadow:2px 2px 0 var(--gold); margin:6px 0;}
  .result-score small{font-size:18px; color:var(--ink);}
  .stars{font-size:26px; letter-spacing:4px; margin:2px 0 14px; min-height:30px;}
  .praise{font-family:"DotGothic16",sans-serif; color:var(--pink-deep); font-size:18px; margin-bottom:6px;}

  .hint{position:absolute; left:50%; transform:translateX(-50%); bottom:max(var(--sab),18px);
    background:rgba(255,246,230,.92); border:3px solid var(--ink); border-radius:14px;
    padding:8px 16px; font-size:13px; font-weight:700; color:var(--ink);
    box-shadow:0 4px 0 var(--shadow); pointer-events:none; opacity:0; transition:opacity .4s ease;}
  .hint.show{opacity:1;}
</style>
</head>
<body>
<div id="game">
  <canvas id="cv"></canvas>

  <div class="layer show" id="titleLayer">
    <div class="panel">
      <div class="title">うさぎとにんじん</div>
      <div class="subtitle">〜 キャッチ 〜</div>
      <p class="lead">うえから にんじんが おちてくるよ！<br>うさぎを うごかして カゴで うけとめよう！</p>
      <div class="modes">
        <button class="btn btn-easy" data-mode="easy">
          <span class="em">🥕</span><span>かんたん<br><span class="sub">ゆっくり・カゴおおきい</span></span>
        </button>
        <button class="btn btn-hard" data-mode="hard">
          <span class="em">⚡</span><span>チャレンジ<br><span class="sub">はやい・いしをよけて</span></span>
        </button>
      </div>
    </div>
  </div>

  <div id="hud">
    <div class="chip"><span>🥕</span><span id="scoreVal">0</span><small>とれた</small></div>
    <div class="chip" id="timeChip"><span>⏰</span><span id="timeVal">60</span><small>びょう</small></div>
  </div>
  <div class="corner" id="backBtn" style="display:none">↩</div>
  <div class="corner" id="soundBtn" style="display:none">🔊</div>
  <div class="hint" id="hint">うさぎを よこに うごかしてね！</div>

  <div class="layer" id="resultLayer">
    <div class="panel">
      <div class="praise" id="praise">よくできました！</div>
      <div class="result-score"><span id="finalScore">0</span><small> こ</small></div>
      <div class="stars" id="stars"></div>
      <div class="modes">
        <button class="btn btn-play" id="retryBtn">🐰 もういちど</button>
        <button class="btn btn-ghost" id="toTitleBtn">モードをえらぶ</button>
      </div>
    </div>
  </div>
</div>

<script src="/games/safe_area.js"></script>
<script>
(()=>{
"use strict";

/* ===== Canvas ===== */
const cv=document.getElementById('cv'), ctx=cv.getContext('2d');
let W=0,H=0,U=0,DPR=1;
function resize(){
  DPR=Math.min(window.devicePixelRatio||1,2.5);
  const r=cv.getBoundingClientRect(); W=r.width; H=r.height; U=Math.min(W,H);
  cv.width=Math.round(W*DPR); cv.height=Math.round(H*DPR);
  ctx.setTransform(DPR,0,0,DPR,0,0); buildDecor();
}
window.addEventListener('resize',resize);

/* ===== Audio ===== */
const audio=(()=>{
  let actx=null,master=null,on=true,t=null,step=0;
  function ensure(){ if(actx)return;
    actx=new (window.AudioContext||window.webkitAudioContext)();
    master=actx.createGain(); master.gain.value=0.5; master.connect(actx.destination);}
  function blip(f,d,type='sine',v=0.3){ if(!actx||!on)return;
    const o=actx.createOscillator(),g=actx.createGain();
    o.type=type; o.frequency.value=f;
    g.gain.setValueAtTime(0,actx.currentTime);
    g.gain.linearRampToValueAtTime(v,actx.currentTime+0.01);
    g.gain.exponentialRampToValueAtTime(0.0001,actx.currentTime+d);
    o.connect(g); g.connect(master); o.start(); o.stop(actx.currentTime+d);}
  const mel=[587,784,659,880,784,988,880,659];
  function startBgm(){ if(!actx)return; stopBgm(); step=0;
    t=setInterval(()=>{ if(!on)return;
      blip(mel[step%mel.length],0.18,'triangle',0.10);
      if(step%2===0) blip(mel[step%mel.length]/2,0.22,'sine',0.06); step++;},240);}
  function stopBgm(){ if(t){clearInterval(t); t=null;} }
  return{ init(){ensure(); if(actx&&actx.state==='suspended')actx.resume();},
    good(){ blip(880,0.08,'square',0.22); setTimeout(()=>blip(1320,0.12,'square',0.2),60);},
    gold(){ [880,1175,1568].forEach((f,i)=>setTimeout(()=>blip(f,0.12,'square',0.22),i*70));},
    bad(){ blip(200,0.18,'sawtooth',0.25); },
    start(){ this.init(); startBgm(); },
    end(){ stopBgm(); blip(660,0.15,'triangle',0.2); setTimeout(()=>blip(880,0.2,'triangle',0.2),140);},
    toggle(){ on=!on; if(!on)stopBgm(); else if(state==='playing')startBgm(); return on;},
    get on(){return on;} };
})();

/* ===== Decor ===== */
let flowers=[];
function buildDecor(){ flowers=[];
  const n=Math.round((W*H)/120000)+5;
  for(let i=0;i<n;i++) flowers.push({x:Math.random()*W, y:H*0.86+Math.random()*H*0.12,
    s:0.7+Math.random()*0.6, c:['#fff','#ffd24d','#ff9ec4'][Math.floor(Math.random()*3)]});
}

/* ===== Config / State ===== */
const CFG={
  easy:{ time:60, spawn:1.0, fall:[0.42,0.60], basketW:0.34, gold:0.06, rock:0 },
  hard:{ time:45, spawn:0.62, fall:[0.66,0.95], basketW:0.22, gold:0.08, rock:0.22 }
};
let mode='easy', cfg=CFG.easy, state='title';
let score=0, timeLeft=0, last=0, spawnT=0, hintShown=false, stun=0;

const basket={x:0, y:0, w:0, vx:0};
let items=[], particles=[];

function startGame(m){
  mode=m; cfg=CFG[m]; score=0; timeLeft=cfg.time; spawnT=0.4; stun=0;
  basket.y=H*0.80; basket.w=cfg.basketW*U; basket.x=W*0.5;
  pointer.x=W*0.5; pointer.active=false;
  items=[]; particles=[];
  state='playing';
  document.getElementById('titleLayer').classList.remove('show');
  document.getElementById('resultLayer').classList.remove('show');
  document.getElementById('hud').classList.add('show');
  document.getElementById('backBtn').style.display='flex';
  document.getElementById('soundBtn').style.display='flex';
  updateHud();
  hintShown=true; const h=document.getElementById('hint'); h.classList.add('show');
  setTimeout(()=>h.classList.remove('show'),2600);
  audio.start(); last=performance.now();
}
function endGame(){
  state='result'; audio.end();
  document.getElementById('hud').classList.remove('show');
  document.getElementById('backBtn').style.display='none';
  document.getElementById('soundBtn').style.display='none';
  document.getElementById('hint').classList.remove('show');
  document.getElementById('finalScore').textContent=score;
  const tiers = mode==='easy' ? [25,16,8] : [18,11,5];
  let st=1; if(score>=tiers[0])st=3; else if(score>=tiers[1])st=2;
  document.getElementById('stars').textContent='⭐'.repeat(st)+'☆'.repeat(3-st);
  document.getElementById('praise').textContent=['がんばったね！','じょうずだね！','キャッチめいじん！'][st-1];
  document.getElementById('resultLayer').classList.add('show');
}
function updateHud(){
  document.getElementById('scoreVal').textContent=score;
  const t=Math.ceil(timeLeft); document.getElementById('timeVal').textContent=t;
  document.getElementById('timeChip').classList.toggle('low',t<=10);
}

/* ===== Input (horizontal) ===== */
const pointer={x:0,active:false};
function setPointer(e){ const r=cv.getBoundingClientRect(); const p=e.touches?e.touches[0]:e;
  pointer.x=p.clientX-r.left; pointer.active=true;
  if(hintShown){ document.getElementById('hint').classList.remove('show'); hintShown=false; } }
cv.addEventListener('pointerdown',e=>{audio.init(); setPointer(e);});
cv.addEventListener('pointermove',e=>{ if(state==='playing') setPointer(e); });
cv.addEventListener('pointerup',()=>{ pointer.active=false; });
let keyL=false,keyR=false;
window.addEventListener('keydown',e=>{ if(e.key==='ArrowLeft')keyL=true; if(e.key==='ArrowRight')keyR=true; });
window.addEventListener('keyup',e=>{ if(e.key==='ArrowLeft')keyL=false; if(e.key==='ArrowRight')keyR=false; });

/* ===== Spawn ===== */
function spawn(){
  const r=Math.random(); let type='carrot';
  if(r<cfg.rock) type='rock';
  else if(r<cfg.rock+cfg.gold) type='gold';
  const m=U*0.08;
  items.push({ x:m+Math.random()*(W-2*m), y:-U*0.08, type,
    vy:(cfg.fall[0]+Math.random()*(cfg.fall[1]-cfg.fall[0]))*H,
    rot:Math.random()*6.28, rotv:(Math.random()-0.5)*3, sway:Math.random()*6.28 });
}

/* ===== Update ===== */
function update(dt){
  if(state!=='playing') return;
  timeLeft-=dt;
  if(timeLeft<=0){ timeLeft=0; updateHud(); endGame(); return; }

  // basket move
  if(stun>0) stun-=dt;
  const spd=1.6*U;
  let target=pointer.active?pointer.x:basket.x;
  if(keyL) target=basket.x-spd*dt*30;
  if(keyR) target=basket.x+spd*dt*30;
  if(stun<=0){
    const dx=target-basket.x, mv=Math.sign(dx)*Math.min(Math.abs(dx),spd*dt);
    basket.x+=mv;
  }
  const half=basket.w/2+U*0.02;
  basket.x=Math.max(half,Math.min(W-half,basket.x));

  // spawn
  spawnT-=dt;
  if(spawnT<=0){ spawn(); spawnT=cfg.spawn*(0.75+Math.random()*0.5); }

  // items
  const catchY=basket.y, hw=basket.w/2;
  for(const it of items){
    it.y+=it.vy*dt; it.rot+=it.rotv*dt; it.sway+=dt*3;
    const r=U*0.05;
    if(!it.done && it.y+r>=catchY && it.y-r<catchY+U*0.10 && Math.abs(it.x-basket.x)<hw+r*0.4){
      it.done=true;
      if(it.type==='rock'){ audio.bad(); stun=0.45; shake=8;
        for(let i=0;i<6;i++) particles.push(P('puff',it.x,catchY));
      }else{
        const pts = it.type==='gold'?3:1; score+=pts;
        if(it.type==='gold'){ audio.gold(); } else audio.good();
        const n=it.type==='gold'?14:8;
        for(let i=0;i<n;i++) particles.push(P('star',it.x,catchY,it.type==='gold'));
        particles.push(Ppop(it.x,catchY-U*0.05,'+'+pts,it.type==='gold'));
        updateHud();
      }
    }
    if(it.y-U*0.06>H) it.done=true;
  }
  items=items.filter(it=>!it.done);

  for(const p of particles){ p.age+=dt;
    if(p.kind==='pop') p.y-=34*dt;
    else { p.x+=p.vx*dt; p.y+=p.vy*dt; p.vy+=220*dt; } }
  particles=particles.filter(p=>p.age<p.life);
  if(shake>0) shake=Math.max(0,shake-dt*40);
}
let shake=0;
function P(kind,x,y,gold){ if(kind==='star'){ const a=Math.random()*6.28,s=40+Math.random()*120;
    return{kind,x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-30,life:0.7,age:0,r:U*0.018+Math.random()*U*0.014,gold};}
  return{kind:'puff',x,y,vx:(Math.random()-.5)*80,vy:-Math.random()*60,life:0.5,age:0,r:U*0.02};}
function Ppop(x,y,val,gold){ return{kind:'pop',x,y,val,gold,life:0.8,age:0}; }

/* ===== Draw ===== */
function getCss(v){ return getComputedStyle(document.documentElement).getPropertyValue(v).trim(); }
function drawBg(){
  let g=ctx.createLinearGradient(0,0,0,H*0.85);
  g.addColorStop(0,getCss('--sky-top')); g.addColorStop(1,getCss('--sky-bot'));
  ctx.fillStyle=g; ctx.fillRect(0,0,W,H);
  ctx.fillStyle='rgba(255,255,255,.85)';
  cloud(W*0.22,H*0.16,U*0.07); cloud(W*0.74,H*0.10,U*0.055); cloud(W*0.5,H*0.24,U*0.045);
  g=ctx.createLinearGradient(0,H*0.82,0,H);
  g.addColorStop(0,getCss('--grass-top')); g.addColorStop(1,getCss('--grass-bot'));
  ctx.fillStyle=g;
  ctx.beginPath(); ctx.moveTo(0,H*0.85); ctx.quadraticCurveTo(W*0.5,H*0.82,W,H*0.85);
  ctx.lineTo(W,H); ctx.lineTo(0,H); ctx.closePath(); ctx.fill();
  for(const f of flowers){ const r=U*0.011*f.s; ctx.fillStyle=f.c;
    for(let k=0;k<5;k++){const a=k/5*6.28; ctx.beginPath(); ctx.arc(f.x+Math.cos(a)*r,f.y+Math.sin(a)*r,r,0,6.28); ctx.fill();}
    ctx.fillStyle='#ffd24d'; ctx.beginPath(); ctx.arc(f.x,f.y,r*0.7,0,6.28); ctx.fill(); }
}
function cloud(x,y,r){ ctx.beginPath();
  ctx.arc(x,y,r,0,6.28); ctx.arc(x+r,y+r*0.2,r*0.8,0,6.28);
  ctx.arc(x-r,y+r*0.2,r*0.8,0,6.28); ctx.arc(x,y+r*0.3,r*1.1,0,6.28); ctx.fill(); }

function drawCarrotShape(s,gold){
  ctx.fillStyle='#5fb83f';
  for(const lx of [-0.5,0,0.5]){ ctx.save(); ctx.translate(lx*s*0.5,-s*0.7); ctx.rotate(lx*0.5);
    ctx.beginPath(); ctx.ellipse(0,0,s*0.22,s*0.55,0,0,6.28); ctx.fill(); ctx.restore(); }
  ctx.fillStyle=gold?getCss('--gold'):getCss('--carrot');
  ctx.beginPath(); ctx.moveTo(-s*0.55,-s*0.45);
  ctx.quadraticCurveTo(s*0.55,-s*0.5,s*0.45,-s*0.35);
  ctx.quadraticCurveTo(s*0.2,s*0.9,0,s*1.05);
  ctx.quadraticCurveTo(-s*0.2,s*0.9,-s*0.55,-s*0.45); ctx.closePath(); ctx.fill();
  ctx.strokeStyle=gold?'rgba(180,140,30,.5)':'rgba(220,110,30,.5)'; ctx.lineWidth=s*0.05;
  for(const ry of [-0.1,0.25,0.55]){ ctx.beginPath(); ctx.moveTo(-s*0.3,ry*s); ctx.lineTo(s*0.3,ry*s); ctx.stroke(); }
  // happy eyes
  ctx.fillStyle='#fff';
  ctx.beginPath(); ctx.arc(-s*0.16,0,s*0.15,0,6.28); ctx.arc(s*0.16,0,s*0.15,0,6.28); ctx.fill();
  ctx.fillStyle='#3a2a14';
  ctx.beginPath(); ctx.arc(-s*0.16,0,s*0.07,0,6.28); ctx.arc(s*0.16,0,s*0.07,0,6.28); ctx.fill();
  ctx.fillStyle='rgba(255,120,120,.5)';
  ctx.beginPath(); ctx.arc(-s*0.3,s*0.18,s*0.07,0,6.28); ctx.arc(s*0.3,s*0.18,s*0.07,0,6.28); ctx.fill();
}
function drawItem(it){
  const s=U*0.052, sway=Math.sin(it.sway)*U*0.01;
  ctx.save(); ctx.translate(it.x+sway,it.y); ctx.rotate(Math.sin(it.rot)*0.25);
  if(it.type==='rock'){
    ctx.fillStyle='#9b9388';
    ctx.beginPath(); ctx.ellipse(0,0,s*0.8,s*0.65,0,0,6.28); ctx.fill();
    ctx.fillStyle='#7d756a'; ctx.beginPath(); ctx.ellipse(s*0.2,s*0.15,s*0.28,s*0.2,0,0,6.28); ctx.fill();
    ctx.fillStyle='#b8b0a4'; ctx.beginPath(); ctx.ellipse(-s*0.25,-s*0.2,s*0.22,s*0.16,0,0,6.28); ctx.fill();
  } else {
    if(it.type==='gold'){ ctx.shadowColor='rgba(255,210,77,.9)'; ctx.shadowBlur=U*0.03; }
    drawCarrotShape(s,it.type==='gold'); ctx.shadowBlur=0;
  }
  ctx.restore();
}

function drawRabbitBasket(){
  const bx=basket.x, by=basket.y, w=basket.w, s=U*0.07;
  const hop=Math.sin(performance.now()/220)*s*0.05;
  // shadow
  ctx.fillStyle='rgba(74,59,38,.16)';
  ctx.beginPath(); ctx.ellipse(bx,by+s*0.95,w*0.6,s*0.28,0,0,6.28); ctx.fill();
  // rabbit (behind basket)
  ctx.save(); ctx.translate(bx,by-s*0.55-hop);
  ctx.fillStyle='#fff';
  for(const ex of [-0.34,0.34]){ ctx.save(); ctx.translate(ex*s,-s*0.5); ctx.rotate(ex*0.25);
    ctx.beginPath(); ctx.ellipse(0,-s*0.4,s*0.16,s*0.46,0,0,6.28); ctx.fill();
    ctx.fillStyle=getCss('--pink'); ctx.beginPath(); ctx.ellipse(0,-s*0.4,s*0.08,s*0.30,0,0,6.28); ctx.fill();
    ctx.fillStyle='#fff'; ctx.restore(); }
  ctx.beginPath(); ctx.arc(0,0,s*0.5,0,6.28); ctx.fill();
  // crown
  ctx.fillStyle=getCss('--gold');
  ctx.beginPath(); ctx.moveTo(-s*0.28,-s*0.4); ctx.lineTo(-s*0.28,-s*0.62);
  ctx.lineTo(-s*0.1,-s*0.46); ctx.lineTo(0,-s*0.68); ctx.lineTo(s*0.1,-s*0.46);
  ctx.lineTo(s*0.28,-s*0.62); ctx.lineTo(s*0.28,-s*0.4); ctx.closePath(); ctx.fill();
  ctx.fillStyle=getCss('--pink-deep'); ctx.beginPath(); ctx.arc(0,-s*0.56,s*0.045,0,6.28); ctx.fill();
  // face
  ctx.fillStyle='#3a2a14';
  ctx.beginPath(); ctx.arc(-s*0.17,0,s*0.07,0,6.28); ctx.arc(s*0.17,0,s*0.07,0,6.28); ctx.fill();
  ctx.fillStyle='#fff'; ctx.beginPath(); ctx.arc(-s*0.14,-s*0.03,s*0.025,0,6.28); ctx.arc(s*0.2,-s*0.03,s*0.025,0,6.28); ctx.fill();
  ctx.fillStyle=getCss('--pink-deep'); ctx.beginPath(); ctx.arc(0,s*0.13,s*0.045,0,6.28); ctx.fill();
  ctx.fillStyle='rgba(255,150,180,.5)';
  ctx.beginPath(); ctx.arc(-s*0.3,s*0.12,s*0.09,0,6.28); ctx.arc(s*0.3,s*0.12,s*0.09,0,6.28); ctx.fill();
  ctx.restore();
  // basket (front)
  ctx.save(); ctx.translate(bx,by);
  const bw=w, bh=s*1.0;
  ctx.fillStyle='#c98a4a';
  ctx.beginPath(); ctx.moveTo(-bw*0.5,0); ctx.lineTo(bw*0.5,0);
  ctx.lineTo(bw*0.38,bh); ctx.lineTo(-bw*0.38,bh); ctx.closePath(); ctx.fill();
  // weave
  ctx.strokeStyle='rgba(120,75,30,.55)'; ctx.lineWidth=s*0.05;
  for(let i=1;i<4;i++){ const y=bh*i/4; ctx.beginPath(); ctx.moveTo(-bw*0.5+bw*0.02*i,y); ctx.lineTo(bw*0.5-bw*0.02*i,y); ctx.stroke(); }
  for(let i=-2;i<=2;i++){ ctx.beginPath(); ctx.moveTo(bw*0.16*i,0); ctx.lineTo(bw*0.12*i,bh); ctx.stroke(); }
  // rim
  ctx.fillStyle='#e0a463';
  ctx.beginPath(); ctx.ellipse(0,0,bw*0.5,s*0.13,0,0,6.28); ctx.fill();
  ctx.fillStyle='#b5783a';
  ctx.beginPath(); ctx.ellipse(0,0,bw*0.5,s*0.13,0,Math.PI,6.28); ctx.fill();
  ctx.restore();
}

function drawParticles(){
  for(const p of particles){ const k=1-p.age/p.life;
    if(p.kind==='star'){ ctx.save(); ctx.translate(p.x,p.y); ctx.rotate(p.age*6); ctx.globalAlpha=k;
      ctx.fillStyle=p.gold?getCss('--gold'):(Math.random()<0.5?'#fff':getCss('--gold'));
      star(0,0,p.r,p.r*0.45,5); ctx.restore(); ctx.globalAlpha=1; }
    else if(p.kind==='puff'){ ctx.globalAlpha=k*0.6; ctx.fillStyle='#cfc6b6';
      ctx.beginPath(); ctx.arc(p.x,p.y,p.r*(1+p.age*2),0,6.28); ctx.fill(); ctx.globalAlpha=1; }
    else if(p.kind==='pop'){ ctx.globalAlpha=k;
      ctx.fillStyle=p.gold?getCss('--gold'):getCss('--carrot');
      ctx.font=`800 ${U*0.06}px "DotGothic16"`; ctx.textAlign='center';
      ctx.strokeStyle='#fff'; ctx.lineWidth=4; ctx.strokeText(p.val,p.x,p.y); ctx.fillText(p.val,p.x,p.y);
      ctx.globalAlpha=1; } }
}
function star(cx,cy,or_,ir,pts){ ctx.beginPath();
  for(let i=0;i<pts*2;i++){ const r=i%2?ir:or_,a=i/(pts*2)*6.28-1.57; ctx.lineTo(cx+Math.cos(a)*r,cy+Math.sin(a)*r);}
  ctx.closePath(); ctx.fill(); }

function render(){
  ctx.save();
  if(shake>0) ctx.translate((Math.random()-.5)*shake,(Math.random()-.5)*shake);
  ctx.clearRect(-20,-20,W+40,H+40);
  drawBg();
  if(state==='playing'){
    for(const it of items) drawItem(it);
    drawRabbitBasket();
    drawParticles();
  }
  ctx.restore();
}

/* ===== Loop ===== */
function loop(now){ let dt=(now-last)/1000; last=now; if(dt>0.05)dt=0.05;
  update(dt); render(); requestAnimationFrame(loop); }

/* ===== Buttons ===== */
document.querySelectorAll('[data-mode]').forEach(b=>b.addEventListener('click',()=>{audio.init(); startGame(b.dataset.mode);}));
document.getElementById('retryBtn').addEventListener('click',()=>startGame(mode));
document.getElementById('toTitleBtn').addEventListener('click',()=>{ state='title';
  document.getElementById('resultLayer').classList.remove('show');
  document.getElementById('titleLayer').classList.add('show'); });
document.getElementById('soundBtn').addEventListener('click',function(){ this.textContent=audio.toggle()?'🔊':'🔇'; });
document.getElementById('backBtn').addEventListener('click',()=>{
  try{ if(window.parent!==window){ window.parent.postMessage({type:'goBack'},'*'); return; } }catch(e){}
  if(window.history.length>1) window.history.back();
  else { state='title';
    document.getElementById('hud').classList.remove('show');
    document.getElementById('backBtn').style.display='none';
    document.getElementById('soundBtn').style.display='none';
    document.getElementById('titleLayer').classList.add('show'); audio.end(); }
});

/* ===== Boot ===== */
resize();
requestAnimationFrame(loop); last=performance.now();
})();
</script>
