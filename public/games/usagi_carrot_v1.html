<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>うさぎとにんじん 〜おいかけっこ〜</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DotGothic16&family=M+PLUS+Rounded+1c:wght@400;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --sat:env(safe-area-inset-top,0px); --sab:env(safe-area-inset-bottom,0px);
    --sal:env(safe-area-inset-left,0px); --sar:env(safe-area-inset-right,0px);
    --sky-top:#bfe9ff; --sky-bot:#d9f6ff;
    --grass-top:#a9d977; --grass-bot:#7cbf4e; --grass-dark:#5fa83c;
    --cream:#fff6e6; --cream-line:#f0d9a8;
    --ink:#5a4326; --ink-soft:#8a7350;
    --pink:#ff9ec4; --pink-deep:#ff6fa8;
    --carrot:#ff8a3d; --gold:#ffd24d;
    --shadow:rgba(74,59,38,.18);
  }
  *{box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent;}
  html,body{height:100%; overflow:hidden;}
  body{
    font-family:"M PLUS Rounded 1c",sans-serif;
    background:#7cbf4e;
    color:var(--ink);
    user-select:none; -webkit-user-select:none;
    touch-action:none;
  }
  #game{
    position:fixed; inset:0;
    display:flex; align-items:center; justify-content:center;
  }
  canvas{display:block; width:100%; height:100%; touch-action:none;}

  /* ---- UI overlays ---- */
  .layer{
    position:absolute; inset:0;
    display:flex; flex-direction:column;
    align-items:center; justify-content:center;
    text-align:center;
    padding:max(var(--sat),16px) 20px max(var(--sab),16px);
    pointer-events:none;
  }
  .layer.show{pointer-events:auto;}
  .layer:not(.show){display:none;}

  .panel{
    background:var(--cream);
    border:4px solid var(--ink);
    border-radius:22px;
    box-shadow:0 8px 0 var(--shadow), inset 0 0 0 4px var(--cream-line);
    padding:26px 26px 30px;
    max-width:380px; width:100%;
  }
  .title{
    font-family:"DotGothic16",sans-serif;
    font-size:clamp(22px,7vw,32px);
    line-height:1.35; color:var(--ink);
    text-shadow:2px 2px 0 var(--gold);
    margin-bottom:4px;
  }
  .subtitle{
    font-family:"DotGothic16",sans-serif;
    font-size:clamp(12px,3.6vw,15px);
    color:var(--pink-deep); margin-bottom:18px;
  }
  .lead{font-size:14px; color:var(--ink-soft); line-height:1.7; margin:2px 0 18px;}
  .modes{display:flex; flex-direction:column; gap:12px;}
  .btn{
    font-family:"DotGothic16",sans-serif;
    border:3px solid var(--ink); border-radius:16px;
    padding:14px 18px; font-size:18px; color:var(--ink);
    cursor:pointer; box-shadow:0 5px 0 var(--shadow);
    transition:transform .06s ease, box-shadow .06s ease;
    display:flex; align-items:center; justify-content:center; gap:10px;
  }
  .btn:active{transform:translateY(4px); box-shadow:0 1px 0 var(--shadow);}
  .btn .em{font-size:22px;}
  .btn .sub{font-family:"M PLUS Rounded 1c"; font-size:12px; color:var(--ink-soft); font-weight:700;}
  .btn-easy{background:#cdeeff;}
  .btn-hard{background:#ffd7e6;}
  .btn-play{background:var(--gold); width:100%; margin-top:6px;}
  .btn-ghost{background:transparent; box-shadow:none; border-color:transparent; color:var(--ink-soft); font-size:14px; padding:8px;}

  /* top bar (HUD) */
  #hud{
    position:absolute; left:0; right:0;
    top:max(var(--sat),10px);
    display:none; align-items:center; justify-content:space-between;
    padding:0 max(var(--sal),12px) 0 max(var(--sar),12px);
    pointer-events:none;
  }
  #hud.show{display:flex;}
  .chip{
    background:var(--cream); border:3px solid var(--ink); border-radius:14px;
    box-shadow:0 4px 0 var(--shadow);
    padding:6px 14px; display:flex; align-items:center; gap:7px;
    font-family:"DotGothic16",sans-serif; font-size:18px; color:var(--ink);
  }
  .chip small{font-family:"M PLUS Rounded 1c"; font-size:11px; font-weight:700; color:var(--ink-soft);}
  #timeChip.low{color:var(--pink-deep); animation:pulse .5s infinite alternate;}
  @keyframes pulse{to{transform:scale(1.08);}}

  /* floating corner buttons */
  .corner{
    position:absolute; pointer-events:auto;
    background:var(--cream); border:3px solid var(--ink);
    border-radius:50%; width:46px; height:46px;
    display:flex; align-items:center; justify-content:center;
    font-size:22px; box-shadow:0 4px 0 var(--shadow); cursor:pointer;
  }
  .corner:active{transform:translateY(3px); box-shadow:0 1px 0 var(--shadow);}
  #backBtn{top:max(var(--sat),10px); left:max(var(--sal),12px);}
  #soundBtn{bottom:max(var(--sab),12px); right:max(var(--sar),12px);}

  .result-score{
    font-family:"DotGothic16",sans-serif; font-size:46px; color:var(--carrot);
    text-shadow:2px 2px 0 var(--gold); margin:6px 0;
  }
  .result-score small{font-size:18px; color:var(--ink);}
  .stars{font-size:26px; letter-spacing:4px; margin:2px 0 14px; min-height:30px;}
  .praise{font-family:"DotGothic16",sans-serif; color:var(--pink-deep); font-size:18px; margin-bottom:6px;}

  .hint{
    position:absolute; left:50%; transform:translateX(-50%);
    bottom:max(var(--sab),18px);
    background:rgba(255,246,230,.92); border:3px solid var(--ink); border-radius:14px;
    padding:8px 16px; font-size:13px; font-weight:700; color:var(--ink);
    box-shadow:0 4px 0 var(--shadow); pointer-events:none;
    opacity:0; transition:opacity .4s ease;
  }
  .hint.show{opacity:1;}
</style>
</head>
<body>
<div id="game">
  <canvas id="cv"></canvas>

  <!-- TITLE -->
  <div class="layer show" id="titleLayer">
    <div class="panel">
      <div class="title">うさぎとにんじん</div>
      <div class="subtitle">〜 おいかけっこ 〜</div>
      <p class="lead">ゆびで うさぎを うごかして<br>にげる にんじんを つかまえよう！</p>
      <div class="modes">
        <button class="btn btn-easy" data-mode="easy">
          <span class="em">🥕</span>
          <span>かんたん<br><span class="sub">ゆっくり・60びょう</span></span>
        </button>
        <button class="btn btn-hard" data-mode="hard">
          <span class="em">⚡</span>
          <span>チャレンジ<br><span class="sub">すばやい・45びょう</span></span>
        </button>
      </div>
    </div>
  </div>

  <!-- HUD -->
  <div id="hud">
    <div class="chip"><span>🥕</span><span id="scoreVal">0</span><small>とれた</small></div>
    <div class="chip" id="timeChip"><span>⏰</span><span id="timeVal">60</span><small>びょう</small></div>
  </div>
  <div class="corner" id="backBtn" style="display:none">↩</div>
  <div class="corner" id="soundBtn" style="display:none">🔊</div>
  <div class="hint" id="hint">うさぎを うごかして おいかけよう！</div>

  <!-- RESULT -->
  <div class="layer" id="resultLayer">
    <div class="panel">
      <div class="praise" id="praise">よくできました！</div>
      <div class="result-score"><span id="finalScore">0</span><small> こ</small></div>
      <div class="stars" id="stars"></div>
      <div class="modes">
        <button class="btn btn-play" id="retryBtn">🐰 もういちど</button>
        <button class="btn btn-ghost" id="toTitleBtn">モードをえらぶ</button>
      </div>
    </div>
  </div>
</div>

<script src="/games/safe_area.js"></script>
<script>
(()=>{
"use strict";

/* ============ Canvas & sizing ============ */
const cv = document.getElementById('cv');
const ctx = cv.getContext('2d');
let W=0,H=0,U=0,DPR=1;

function resize(){
  DPR = Math.min(window.devicePixelRatio||1, 2.5);
  const r = cv.getBoundingClientRect();
  W = r.width; H = r.height;
  U = Math.min(W,H);
  cv.width = Math.round(W*DPR);
  cv.height = Math.round(H*DPR);
  ctx.setTransform(DPR,0,0,DPR,0,0);
  buildDecor();
}
window.addEventListener('resize', resize);

/* ============ Audio (self-contained) ============ */
const audio = (()=>{
  let actx=null, master=null, on=true, bgmTimer=null, step=0;
  function ensure(){
    if(actx) return;
    actx = new (window.AudioContext||window.webkitAudioContext)();
    master = actx.createGain(); master.gain.value=0.5; master.connect(actx.destination);
  }
  function blip(freq,dur,type='sine',vol=0.3){
    if(!actx||!on) return;
    const o=actx.createOscillator(), g=actx.createGain();
    o.type=type; o.frequency.value=freq;
    g.gain.setValueAtTime(0,actx.currentTime);
    g.gain.linearRampToValueAtTime(vol,actx.currentTime+0.01);
    g.gain.exponentialRampToValueAtTime(0.0001,actx.currentTime+dur);
    o.connect(g); g.connect(master);
    o.start(); o.stop(actx.currentTime+dur);
  }
  // simple cheerful loop
  const mel=[523,659,784,659,587,784,880,784];
  function startBgm(){
    if(!actx) return;
    stopBgm(); step=0;
    bgmTimer=setInterval(()=>{
      if(!on) return;
      blip(mel[step%mel.length], 0.18, 'triangle', 0.10);
      if(step%2===0) blip(mel[step%mel.length]/2, 0.22, 'sine', 0.06);
      step++;
    },240);
  }
  function stopBgm(){ if(bgmTimer){clearInterval(bgmTimer); bgmTimer=null;} }
  return {
    init(){ ensure(); if(actx&&actx.state==='suspended') actx.resume(); },
    catch_(){ blip(880,0.09,'square',0.25); setTimeout(()=>blip(1320,0.12,'square',0.22),70); },
    start(){ this.init(); startBgm(); },
    end(){ stopBgm(); blip(660,0.15,'triangle',0.2); setTimeout(()=>blip(880,0.2,'triangle',0.2),140); },
    toggle(){ on=!on; if(!on) stopBgm(); else if(state==='playing') startBgm(); return on; },
    get on(){return on;}
  };
})();

/* ============ Decor (flowers) ============ */
let flowers=[];
function buildDecor(){
  flowers=[];
  const n = Math.round((W*H)/90000)+6;
  for(let i=0;i<n;i++){
    flowers.push({
      x:Math.random()*W,
      y:H*0.34 + Math.random()*H*0.66,
      s:0.7+Math.random()*0.7,
      c: ['#ffffff','#ffd24d','#ff9ec4','#fff3b0'][Math.floor(Math.random()*4)]
    });
  }
  flowers.sort((a,b)=>a.y-b.y);
}

/* ============ Entities ============ */
const rabbit = {x:0,y:0,vx:0,vy:0,face:1,hop:0,moving:false};
let carrots=[];
let particles=[];

const CFG = {
  easy:{ time:60, rabbit:0.70, carrot:0.46, panic:0.30, juke:0.35, catchR:0.085, count:1, addEvery:99, maxCarrots:1 },
  hard:{ time:45, rabbit:0.80, carrot:0.66, panic:0.34, juke:0.85, catchR:0.058, count:1, addEvery:4,  maxCarrots:3 }
};

let mode='easy', cfg=CFG.easy;
let state='title';            // title | playing | result
let score=0, timeLeft=0, last=0, hintShown=false;

function newCarrot(awayFrom){
  let x,y,tries=0;
  do{
    x = W*(0.12+Math.random()*0.76);
    y = H*(0.40+Math.random()*0.52);
    tries++;
  }while(awayFrom && Math.hypot(x-awayFrom.x,y-awayFrom.y) < U*0.42 && tries<20);
  return {x,y,vx:0,vy:0,wob:Math.random()*6.28,lean:0,jukeSign:Math.random()<0.5?1:-1,jukeT:0};
}

function startGame(m){
  mode=m; cfg=CFG[m];
  score=0; timeLeft=cfg.time;
  rabbit.x=W*0.5; rabbit.y=H*0.62; rabbit.vx=rabbit.vy=0; rabbit.hop=0;
  pointer.x=rabbit.x; pointer.y=rabbit.y; pointer.active=false;
  carrots=[]; for(let i=0;i<cfg.count;i++) carrots.push(newCarrot(rabbit));
  particles=[];
  state='playing';
  document.getElementById('titleLayer').classList.remove('show');
  document.getElementById('resultLayer').classList.remove('show');
  document.getElementById('hud').classList.add('show');
  document.getElementById('backBtn').style.display='flex';
  document.getElementById('soundBtn').style.display='flex';
  updateHud();
  hintShown=true; const h=document.getElementById('hint'); h.classList.add('show');
  setTimeout(()=>h.classList.remove('show'),2600);
  audio.start();
  last=performance.now();
}

function endGame(){
  state='result';
  audio.end();
  document.getElementById('hud').classList.remove('show');
  document.getElementById('backBtn').style.display='none';
  document.getElementById('soundBtn').style.display='none';
  document.getElementById('hint').classList.remove('show');
  const fs=document.getElementById('finalScore'); fs.textContent=score;
  // stars + praise tuned per mode
  const tiers = mode==='easy' ? [12,8,4] : [9,6,3];
  let st=1; if(score>=tiers[0]) st=3; else if(score>=tiers[1]) st=2;
  document.getElementById('stars').textContent='⭐'.repeat(st)+'☆'.repeat(3-st);
  const praises=['がんばったね！','じょうずだね！','うさぎはかせ！'];
  document.getElementById('praise').textContent = praises[st-1];
  document.getElementById('resultLayer').classList.add('show');
}

function updateHud(){
  document.getElementById('scoreVal').textContent=score;
  const t=Math.ceil(timeLeft);
  document.getElementById('timeVal').textContent=t;
  document.getElementById('timeChip').classList.toggle('low', t<=10);
}

/* ============ Input ============ */
const pointer={x:0,y:0,active:false};
function setPointer(e){
  const r=cv.getBoundingClientRect();
  const p = e.touches? e.touches[0]: e;
  pointer.x=p.clientX-r.left; pointer.y=p.clientY-r.top;
  pointer.active=true;
  if(hintShown){ document.getElementById('hint').classList.remove('show'); hintShown=false; }
}
cv.addEventListener('pointerdown',e=>{audio.init(); setPointer(e);});
cv.addEventListener('pointermove',e=>{ if(state==='playing') setPointer(e); });
cv.addEventListener('pointerup',()=>{ pointer.active=false; });
cv.addEventListener('pointerleave',()=>{ pointer.active=false; });

/* ============ Update ============ */
function update(dt){
  if(state!=='playing') return;
  timeLeft-=dt;
  if(timeLeft<=0){ timeLeft=0; updateHud(); endGame(); return; }

  // rabbit toward pointer
  const rSpd = cfg.rabbit*U;
  if(pointer.active){
    const dx=pointer.x-rabbit.x, dy=pointer.y-rabbit.y;
    const d=Math.hypot(dx,dy);
    if(d>2){
      const mv=Math.min(rSpd*dt, d);
      rabbit.x+=dx/d*mv; rabbit.y+=dy/d*mv;
      if(Math.abs(dx)>2) rabbit.face = dx<0?-1:1;
      rabbit.moving = d>6;
    } else rabbit.moving=false;
  } else rabbit.moving=false;
  rabbit.hop += dt*(rabbit.moving?16:6);
  // keep in field
  const m=U*0.06;
  rabbit.x=Math.max(m,Math.min(W-m,rabbit.x));
  rabbit.y=Math.max(H*0.30,Math.min(H-m,rabbit.y));

  if(rabbit.moving && Math.random()<0.4){
    particles.push({type:'dust',x:rabbit.x,y:rabbit.y+U*0.05,vx:(Math.random()-.5)*20,vy:10,life:0.4,age:0,r:U*0.02});
  }

  // carrots flee
  const cSpd=cfg.carrot*U, panic=cfg.panic*U;
  for(const c of carrots){
    c.wob+=dt*8;
    const dx=rabbit.x-c.x, dy=rabbit.y-c.y;
    const d=Math.hypot(dx,dy)||1;
    let ax=0,ay=0, speed;
    if(d<panic){
      // flee away
      ax=-dx/d; ay=-dy/d;
      // juke perpendicular when close
      c.jukeT-=dt;
      if(c.jukeT<=0){ c.jukeSign=Math.random()<0.5?1:-1; c.jukeT=0.4+Math.random()*0.5; }
      ax += (-dy/d)*c.jukeSign*cfg.juke;
      ay += ( dx/d)*c.jukeSign*cfg.juke;
      speed = cSpd * (1 - d/panic*0.25);
    } else {
      // wander
      ax=Math.cos(c.wob*0.5); ay=Math.sin(c.wob*0.37);
      speed = cSpd*0.32;
    }
    // wall avoidance
    const wm=U*0.10;
    if(c.x<wm) ax+=1.2; if(c.x>W-wm) ax-=1.2;
    if(c.y<H*0.34+wm) ay+=1.2; if(c.y>H-wm) ay-=1.2;
    const al=Math.hypot(ax,ay)||1;
    c.x+=ax/al*speed*dt; c.y+=ay/al*speed*dt;
    c.lean += ((ax/al)*0.5 - c.lean)*Math.min(1,dt*8);
    c.x=Math.max(U*0.05,Math.min(W-U*0.05,c.x));
    c.y=Math.max(H*0.32,Math.min(H-U*0.05,c.y));

    // catch?
    if(Math.hypot(rabbit.x-c.x,rabbit.y-c.y) < cfg.catchR*U + U*0.04){
      score++; audio.catch_();
      for(let i=0;i<10;i++){
        const a=Math.random()*6.28, sp=40+Math.random()*120;
        particles.push({type:'star',x:c.x,y:c.y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp-30,life:0.7,age:0,r:U*0.02+Math.random()*U*0.015});
      }
      particles.push({type:'pop',x:c.x,y:c.y-U*0.06,life:0.8,age:0,val:'+1'});
      // respawn / grow
      const newPos=newCarrot(rabbit);
      c.x=newPos.x; c.y=newPos.y; c.vx=c.vy=0;
      if(carrots.length<cfg.maxCarrots && score%cfg.addEvery===0){
        carrots.push(newCarrot(rabbit));
      }
      updateHud();
    }
  }

  // particles
  for(const p of particles){
    p.age+=dt;
    if(p.type!=='pop'){ p.x+=p.vx*dt; p.y+=p.vy*dt; p.vy+=200*dt; }
    else { p.y-=30*dt; }
  }
  particles=particles.filter(p=>p.age<p.life);

  if(Math.floor(timeLeft)!==Math.floor(timeLeft+dt)) updateHud();
}

/* ============ Draw ============ */
function drawBg(){
  // sky
  let g=ctx.createLinearGradient(0,0,0,H*0.36);
  g.addColorStop(0,getCss('--sky-top')); g.addColorStop(1,getCss('--sky-bot'));
  ctx.fillStyle=g; ctx.fillRect(0,0,W,H*0.36);
  // clouds
  ctx.fillStyle='rgba(255,255,255,.8)';
  cloud(W*0.2,H*0.10,U*0.07); cloud(W*0.72,H*0.16,U*0.055);
  // meadow
  g=ctx.createLinearGradient(0,H*0.30,0,H);
  g.addColorStop(0,getCss('--grass-top')); g.addColorStop(1,getCss('--grass-bot'));
  ctx.fillStyle=g;
  ctx.beginPath();
  ctx.moveTo(0,H*0.34);
  ctx.quadraticCurveTo(W*0.5,H*0.30,W,H*0.34);
  ctx.lineTo(W,H); ctx.lineTo(0,H); ctx.closePath(); ctx.fill();
  // flowers
  for(const f of flowers){
    const r=U*0.012*f.s;
    ctx.fillStyle=f.c;
    for(let k=0;k<5;k++){
      const a=k/5*6.28;
      ctx.beginPath(); ctx.arc(f.x+Math.cos(a)*r, f.y+Math.sin(a)*r, r, 0, 6.28); ctx.fill();
    }
    ctx.fillStyle='#ffd24d';
    ctx.beginPath(); ctx.arc(f.x,f.y,r*0.7,0,6.28); ctx.fill();
  }
}
function cloud(x,y,r){
  ctx.beginPath();
  ctx.arc(x,y,r,0,6.28); ctx.arc(x+r,y+r*0.2,r*0.8,0,6.28);
  ctx.arc(x-r,y+r*0.2,r*0.8,0,6.28); ctx.arc(x,y+r*0.3,r*1.1,0,6.28);
  ctx.fill();
}

function drawShadow(x,y,r){
  ctx.fillStyle='rgba(74,59,38,.16)';
  ctx.beginPath(); ctx.ellipse(x,y,r,r*0.4,0,0,6.28); ctx.fill();
}

function drawCarrot(c){
  const s=U*0.055;
  const hop=Math.sin(c.wob)*s*0.10;
  drawShadow(c.x, c.y+s*1.0, s*0.7);
  ctx.save();
  ctx.translate(c.x, c.y+hop);
  ctx.rotate(c.lean*0.5);
  // leaves
  ctx.fillStyle='#5fb83f';
  for(const lx of [-0.5,0,0.5]){
    ctx.save(); ctx.translate(lx*s*0.5,-s*0.7); ctx.rotate(lx*0.5);
    ctx.beginPath(); ctx.ellipse(0,0,s*0.22,s*0.55,0,0,6.28); ctx.fill();
    ctx.restore();
  }
  // body
  ctx.fillStyle=getCss('--carrot');
  ctx.beginPath();
  ctx.moveTo(-s*0.55,-s*0.45);
  ctx.quadraticCurveTo(s*0.55,-s*0.5, s*0.45,-s*0.35);
  ctx.quadraticCurveTo(s*0.2,s*0.9, 0,s*1.05);
  ctx.quadraticCurveTo(-s*0.2,s*0.9,-s*0.55,-s*0.45);
  ctx.closePath(); ctx.fill();
  // ridges
  ctx.strokeStyle='rgba(220,110,30,.5)'; ctx.lineWidth=s*0.05;
  for(const ry of [-0.1,0.25,0.55]){ ctx.beginPath(); ctx.moveTo(-s*0.3,ry*s); ctx.lineTo(s*0.3,ry*s); ctx.stroke(); }
  // eyes (looking back, worried)
  ctx.fillStyle='#fff';
  ctx.beginPath(); ctx.arc(-s*0.16,-s*0.1,s*0.16,0,6.28); ctx.arc(s*0.16,-s*0.1,s*0.16,0,6.28); ctx.fill();
  ctx.fillStyle='#3a2a14';
  const lookx = c.lean*0.18;
  ctx.beginPath(); ctx.arc(-s*0.16+lookx,-s*0.08,s*0.08,0,6.28); ctx.arc(s*0.16+lookx,-s*0.08,s*0.08,0,6.28); ctx.fill();
  // cheeks
  ctx.fillStyle='rgba(255,120,120,.5)';
  ctx.beginPath(); ctx.arc(-s*0.3,s*0.12,s*0.08,0,6.28); ctx.arc(s*0.3,s*0.12,s*0.08,0,6.28); ctx.fill();
  ctx.restore();
}

function drawRabbit(){
  const s=U*0.072;
  const hop = rabbit.moving ? Math.abs(Math.sin(rabbit.hop))*s*0.18 : Math.sin(rabbit.hop)*s*0.04;
  drawShadow(rabbit.x, rabbit.y+s*0.85, s*0.8);
  ctx.save();
  ctx.translate(rabbit.x, rabbit.y-hop);
  ctx.scale(rabbit.face,1);
  // ears
  ctx.fillStyle='#fff';
  for(const ex of [-0.32,0.32]){
    ctx.save(); ctx.translate(ex*s,-s*0.55); ctx.rotate(ex*0.3);
    ctx.beginPath(); ctx.ellipse(0,-s*0.45,s*0.18,s*0.5,0,0,6.28); ctx.fill();
    ctx.fillStyle=getCss('--pink');
    ctx.beginPath(); ctx.ellipse(0,-s*0.45,s*0.09,s*0.34,0,0,6.28); ctx.fill();
    ctx.fillStyle='#fff'; ctx.restore();
  }
  // body
  ctx.fillStyle='#fff';
  ctx.beginPath(); ctx.ellipse(0,s*0.35,s*0.6,s*0.55,0,0,6.28); ctx.fill();
  // head
  ctx.beginPath(); ctx.arc(0,-s*0.15,s*0.52,0,6.28); ctx.fill();
  // crown (princess)
  ctx.fillStyle=getCss('--gold');
  ctx.beginPath();
  ctx.moveTo(-s*0.3,-s*0.55);
  ctx.lineTo(-s*0.3,-s*0.78); ctx.lineTo(-s*0.12,-s*0.62);
  ctx.lineTo(0,-s*0.85); ctx.lineTo(s*0.12,-s*0.62);
  ctx.lineTo(s*0.3,-s*0.78); ctx.lineTo(s*0.3,-s*0.55);
  ctx.closePath(); ctx.fill();
  ctx.fillStyle=getCss('--pink-deep');
  ctx.beginPath(); ctx.arc(0,-s*0.72,s*0.05,0,6.28); ctx.fill();
  // eyes
  ctx.fillStyle='#3a2a14';
  ctx.beginPath(); ctx.arc(-s*0.18,-s*0.15,s*0.08,0,6.28); ctx.arc(s*0.18,-s*0.15,s*0.08,0,6.28); ctx.fill();
  // eye shine
  ctx.fillStyle='#fff';
  ctx.beginPath(); ctx.arc(-s*0.15,-s*0.18,s*0.03,0,6.28); ctx.arc(s*0.21,-s*0.18,s*0.03,0,6.28); ctx.fill();
  // nose + cheeks
  ctx.fillStyle=getCss('--pink-deep');
  ctx.beginPath(); ctx.arc(0,-s*0.02,s*0.05,0,6.28); ctx.fill();
  ctx.fillStyle='rgba(255,150,180,.5)';
  ctx.beginPath(); ctx.arc(-s*0.32,-s*0.02,s*0.1,0,6.28); ctx.arc(s*0.32,-s*0.02,s*0.1,0,6.28); ctx.fill();
  ctx.restore();
}

function drawParticles(){
  for(const p of particles){
    const k=1-p.age/p.life;
    if(p.type==='star'){
      ctx.save(); ctx.translate(p.x,p.y); ctx.rotate(p.age*6); ctx.globalAlpha=k;
      ctx.fillStyle=Math.random()<0.5?getCss('--gold'):'#fff';
      star(0,0,p.r,p.r*0.45,5); ctx.restore(); ctx.globalAlpha=1;
    }else if(p.type==='dust'){
      ctx.globalAlpha=k*0.5; ctx.fillStyle='#e8dcc0';
      ctx.beginPath(); ctx.arc(p.x,p.y,p.r*(1+p.age*2),0,6.28); ctx.fill(); ctx.globalAlpha=1;
    }else if(p.type==='pop'){
      ctx.globalAlpha=k; ctx.fillStyle=getCss('--carrot');
      ctx.font=`800 ${U*0.06}px "DotGothic16"`; ctx.textAlign='center';
      ctx.strokeStyle='#fff'; ctx.lineWidth=4; ctx.strokeText(p.val,p.x,p.y);
      ctx.fillText(p.val,p.x,p.y); ctx.globalAlpha=1;
    }
  }
}
function star(cx,cy,or_,ir,pts){
  ctx.beginPath();
  for(let i=0;i<pts*2;i++){
    const r=i%2?ir:or_, a=i/(pts*2)*6.28-1.57;
    ctx.lineTo(cx+Math.cos(a)*r, cy+Math.sin(a)*r);
  }
  ctx.closePath(); ctx.fill();
}

function render(){
  ctx.clearRect(0,0,W,H);
  drawBg();
  if(state==='playing'){
    // draw by y for depth
    const list=[...carrots.map(c=>({y:c.y,d:()=>drawCarrot(c)})), {y:rabbit.y,d:drawRabbit}];
    list.sort((a,b)=>a.y-b.y);
    for(const o of list) o.d();
    drawParticles();
  }
}

/* ============ Loop ============ */
function loop(now){
  let dt=(now-last)/1000; last=now;
  if(dt>0.05) dt=0.05;
  update(dt);
  render();
  requestAnimationFrame(loop);
}

/* ============ Helpers ============ */
function getCss(v){ return getComputedStyle(document.documentElement).getPropertyValue(v).trim(); }

/* ============ Buttons ============ */
document.querySelectorAll('[data-mode]').forEach(b=>{
  b.addEventListener('click',()=>{ audio.init(); startGame(b.dataset.mode); });
});
document.getElementById('retryBtn').addEventListener('click',()=>startGame(mode));
document.getElementById('toTitleBtn').addEventListener('click',()=>{
  state='title';
  document.getElementById('resultLayer').classList.remove('show');
  document.getElementById('titleLayer').classList.add('show');
});
document.getElementById('soundBtn').addEventListener('click',function(){
  this.textContent = audio.toggle() ? '🔊':'🔇';
});
document.getElementById('backBtn').addEventListener('click',()=>{
  // wrapper(postMessage) + standalone fallback
  try{ if(window.parent!==window){ window.parent.postMessage({type:'goBack'},'*'); return; } }catch(e){}
  if(window.history.length>1) window.history.back();
  else { state='title';
    document.getElementById('hud').classList.remove('show');
    document.getElementById('backBtn').style.display='none';
    document.getElementById('soundBtn').style.display='none';
    document.getElementById('titleLayer').classList.add('show');
    audio.end();
  }
});

/* ============ Boot ============ */
resize();
// place a couple of carrots on title for ambience
rabbit.x=W*0.5; rabbit.y=H*0.62;
requestAnimationFrame(loop);
last=performance.now();
})();
</script>
</body>
</html>
