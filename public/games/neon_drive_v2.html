<!DOCTYPE html>
<html lang="ja">
<head>
<script src="/games/wakuwaku_ui.js"></script>
<script src="/games/wakuwaku_bgm_mp3.js"></script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>きらきらドライブ — 6つのコースを たびしよう</title>
<script src="/games/safe_area.js"></script>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { width:100%; height:100%; overflow:hidden; background:#07051a; touch-action:none; }
  #game { position:fixed; inset:0; }
  canvas { display:block; }

  :root{
    --sat0: var(--sat, 0px); --sab0: var(--sab, 0px);
    --sal0: var(--sal, 0px); --sar0: var(--sar, 0px);
    --ink:#f2f8ff;
  }
  .ui { font-family:'M PLUS Rounded 1c','Hiragino Maru Gothic ProN','Yu Gothic',system-ui,sans-serif;
        color:var(--ink); user-select:none; -webkit-user-select:none; -webkit-tap-highlight-color:transparent; }

  /* ================= HUD ================= */
  #hud { position:fixed; inset:0; pointer-events:none; display:none; }

  /* 進行バー（左上の おんがくボタンと かさならない いちに） */
  #progWrap { position:fixed; left:50%; transform:translateX(-50%);
              top:calc(60px + var(--sat0)); width:min(88vw,460px); }
  #progTrack { position:relative; height:14px; border-radius:9px;
               background:rgba(10,14,40,.55); border:2px solid rgba(255,255,255,.5);
               box-shadow:0 2px 8px rgba(0,0,0,.35), inset 0 1px rgba(255,255,255,.25); }
  #progFill { position:absolute; left:0; top:0; bottom:0; width:0%; border-radius:7px;
              background:linear-gradient(90deg,#7df9ff,#b388ff,#ff8fd6); transition:width .18s linear; }
  #progCar { position:absolute; top:-13px; left:0; font-size:22px; transform:translateX(-50%);
             transition:left .18s linear; filter:drop-shadow(0 2px 3px rgba(0,0,0,.5)); }
  #progGoal { position:absolute; top:-14px; right:-10px; font-size:20px;
              filter:drop-shadow(0 2px 3px rgba(0,0,0,.5)); }
  #courseName { text-align:center; margin-top:7px; font-size:12px; font-weight:800; letter-spacing:2px;
                color:#dceaff; text-shadow:0 2px 6px rgba(0,0,0,.7); }

  /* 左下：ほし・ともだち・ゲージ をまとめる */
  #leftHud { position:fixed; left:calc(12px + var(--sal0)); bottom:calc(14px + var(--sab0));
             display:flex; flex-direction:column; align-items:flex-start; gap:6px; }
  .pill { display:flex; align-items:center; gap:6px; padding:5px 13px 5px 9px;
          border-radius:20px; background:rgba(12,16,44,.55); border:2px solid rgba(255,255,255,.42);
          font-size:17px; font-weight:800; box-shadow:0 2px 8px rgba(0,0,0,.3); }
  #starPill { color:#ffe14d; text-shadow:0 0 10px rgba(255,170,0,.8); }
  #friendPill { color:#ffd0ec; }

  /* 右上：ハート */
  #hearts { position:fixed; right:calc(12px + var(--sar0)); top:calc(12px + var(--sat0));
            font-size:26px; letter-spacing:2px; filter:drop-shadow(0 2px 5px rgba(0,0,0,.55)); }

  /* 右下：スピード */
  #speed { position:fixed; right:calc(16px + var(--sar0)); bottom:calc(14px + var(--sab0)); text-align:right; }
  #speedNum { font-size:46px; font-weight:800; color:#bff2ff; line-height:1; font-style:italic;
              text-shadow:0 0 12px #23c8ff, 0 3px 6px rgba(0,0,0,.5); }
  #speedUnit { font-size:11px; letter-spacing:3px; color:#9fc4e0; font-weight:700; }

  /* にじいろゲージ */
  #gaugeWrap { width:138px; }
  #gaugeTrack { height:12px; border-radius:8px; background:rgba(10,14,40,.55);
                border:2px solid rgba(255,255,255,.42); overflow:hidden; }
  #gaugeFill { height:100%; width:0%; border-radius:6px;
               background:linear-gradient(90deg,#ff6b6b,#ffd166,#7dff8a,#5ecdff,#c77dff); transition:width .2s; }
  #gaugeLabel { margin-top:4px; font-size:10px; font-weight:800; letter-spacing:2px; color:#cfe4ff;
                text-shadow:0 2px 4px rgba(0,0,0,.6); }
  #gaugeWrap.full #gaugeTrack { border-color:#ffe14d; box-shadow:0 0 14px rgba(255,220,80,.8); }

  /* センター演出 */
  #combo, #praise { position:fixed; left:50%; white-space:nowrap; font-weight:800;
                    transform:translateX(-50%) scale(0); transition:transform .13s cubic-bezier(.2,1.7,.5,1); }
  #combo { top:26%; font-size:32px; font-style:italic; color:#ffe14d;
           text-shadow:0 0 12px #ff9d00, 0 3px 8px rgba(0,0,0,.6); }
  #praise { top:36%; font-size:30px; color:#a8ffd0; text-shadow:0 0 14px #00ff9d, 0 3px 8px rgba(0,0,0,.6); }
  #combo.pop, #praise.pop { transform:translateX(-50%) scale(1); }
  #rainbowMsg { position:fixed; left:50%; top:46%; transform:translateX(-50%); font-size:24px; font-weight:800;
                opacity:0; transition:opacity .2s; white-space:nowrap;
                background:linear-gradient(90deg,#ff6b6b,#ffd166,#7dff8a,#5ecdff,#c77dff);
                -webkit-background-clip:text; background-clip:text; color:transparent;
                filter:drop-shadow(0 0 10px rgba(255,255,255,.7)); }

  /* カウントダウン */
  #countdown { position:fixed; inset:0; display:none; align-items:center; justify-content:center;
               font-size:min(34vw,190px); font-weight:800; font-style:italic; color:#fff;
               text-shadow:0 0 30px #56d6ff, 0 6px 16px rgba(0,0,0,.6); pointer-events:none; z-index:12; }
  #countdown.tick { animation:cdPop .62s ease-out; }
  @keyframes cdPop { 0%{transform:scale(1.9);opacity:0;} 25%{transform:scale(1);opacity:1;} 100%{transform:scale(.7);opacity:0;} }

  /* 操作ガイド */
  #guide { position:fixed; left:50%; bottom:19%; transform:translateX(-50%); z-index:11;
           display:none; text-align:center; pointer-events:none; }
  #guideHand { font-size:44px; animation:swipe 1.9s ease-in-out infinite;
               filter:drop-shadow(0 3px 6px rgba(0,0,0,.6)); }
  @keyframes swipe { 0%,100%{transform:translateX(-52px);} 50%{transform:translateX(52px);} }
  #guideText { margin-top:2px; font-size:15px; font-weight:800; color:#fff;
               text-shadow:0 2px 8px rgba(0,0,0,.8); }

  /* ================= 画面 ================= */
  .screen { position:fixed; inset:0; z-index:10; display:none; flex-direction:column;
            align-items:center; justify-content:center; text-align:center;
            padding:calc(14px + var(--sat0)) 16px calc(14px + var(--sab0));
            background:radial-gradient(ellipse at 50% 62%, rgba(52,22,102,.62), rgba(6,4,20,.94) 72%); }
  .screen.on { display:flex; }
  .scroller { width:100%; max-height:100%; overflow-y:auto; -webkit-overflow-scrolling:touch;
              display:flex; flex-direction:column; align-items:center; }

  .title-sub { font-size:13px; letter-spacing:8px; color:#ffb8e2; font-weight:800;
               text-shadow:0 0 12px #ff2fb0; margin-bottom:6px; }
  .title-main { font-size:min(15vw,74px); font-weight:800; line-height:1.06; letter-spacing:1px;
                background:linear-gradient(180deg,#ffffff 0%,#9fe9ff 40%,#ff9ad8 100%);
                -webkit-background-clip:text; background-clip:text; color:transparent;
                filter:drop-shadow(0 0 20px rgba(80,200,255,.65)); }
  .title-en { font-size:11px; letter-spacing:6px; color:#8fb8d8; margin-top:6px; font-weight:700; }

  .btn { margin-top:22px; padding:15px 44px; font-family:inherit; font-size:19px; font-weight:800;
         letter-spacing:3px; color:#20143a; border:none; border-radius:999px; cursor:pointer;
         background:linear-gradient(180deg,#a9f4ff,#63cfff 55%,#ff9ad8);
         box-shadow:0 6px 0 rgba(60,30,120,.55), 0 10px 26px rgba(0,190,255,.4);
         transition:transform .08s, box-shadow .08s; }
  .btn:active { transform:translateY(4px); box-shadow:0 2px 0 rgba(60,30,120,.55), 0 5px 14px rgba(0,190,255,.35); }
  .btn.sub { font-size:15px; padding:11px 28px; letter-spacing:2px;
             background:linear-gradient(180deg,#e8eeff,#b9c8ee); box-shadow:0 5px 0 rgba(50,40,90,.5); }

  .hint { margin-top:20px; font-size:13.5px; line-height:2; color:#d7e8f8; font-weight:600; }
  .hint b { font-weight:800; }

  .sec-title { font-size:16px; font-weight:800; letter-spacing:5px; color:#ffe14d;
               text-shadow:0 0 12px #ff9d00; margin-bottom:16px; }

  /* キャラ選択 */
  .sel-grid { display:flex; gap:11px; flex-wrap:wrap; justify-content:center; max-width:470px; }
  .sel-card { width:104px; padding:11px 6px 13px; border-radius:20px; cursor:pointer;
              background:linear-gradient(180deg,rgba(46,36,92,.85),rgba(24,18,54,.85));
              border:3px solid rgba(120,100,190,.6); transition:transform .1s, border-color .12s, box-shadow .12s; }
  .sel-card:active { transform:scale(.94); }
  .sel-card.pick { border-color:#ffe14d; box-shadow:0 0 20px rgba(255,205,70,.55); transform:translateY(-3px); }
  .sel-portrait { width:66px; height:66px; margin:0 auto 5px; border-radius:50%; padding:5px;
                  background:radial-gradient(circle at 50% 36%, rgba(255,255,255,.22), rgba(0,0,0,.25)); }
  .sel-portrait svg { width:100%; height:100%; display:block; }
  .sel-name { font-size:15px; font-weight:800; }
  .sel-desc { font-size:10px; color:#a9cbe6; margin-top:2px; font-weight:700; }

  /* コース選択 */
  .course-grid { display:flex; flex-direction:column; gap:10px; width:min(94vw,430px); }
  .course-card { display:flex; align-items:center; gap:11px; padding:10px 13px; border-radius:20px;
                 background:linear-gradient(100deg,rgba(44,34,88,.9),rgba(22,16,50,.9));
                 border:3px solid rgba(120,100,190,.55); cursor:pointer; text-align:left;
                 transition:transform .09s, border-color .12s, box-shadow .12s; }
  .course-card:active { transform:scale(.975); }
  .course-card.open { border-color:#7df9ff; box-shadow:0 0 16px rgba(60,220,255,.32); }
  .course-card.random.open { border-color:#ffe14d; box-shadow:0 0 18px rgba(255,205,70,.35); }
  .course-card.locked { opacity:.52; filter:grayscale(.55); cursor:default; }
  .cc-thumb { width:60px; height:44px; border-radius:12px; flex:0 0 auto; overflow:hidden;
              border:2px solid rgba(255,255,255,.35); }
  .cc-thumb svg { width:100%; height:100%; display:block; }
  .cc-body { flex:1 1 auto; min-width:0; }
  .cc-name { font-size:16px; font-weight:800; }
  .cc-sub { font-size:10.5px; color:#a9cbe6; font-weight:700; margin-top:2px; }
  .cc-right { flex:0 0 auto; text-align:right; }
  .cc-stars { font-size:15px; color:#ffe14d; letter-spacing:1px; }
  .cc-lock { font-size:20px; }
  .cc-friends { font-size:10px; color:#ffb8e2; font-weight:800; margin-top:2px; }

  /* リザルト */
  #goalTitle { font-size:min(11vw,50px); font-weight:800;
               background:linear-gradient(180deg,#fff6c9,#ffd54a 55%,#ff9ad8);
               -webkit-background-clip:text; background-clip:text; color:transparent;
               filter:drop-shadow(0 0 18px rgba(255,190,60,.65)); }
  #goalWhere { font-size:13px; font-weight:800; letter-spacing:2px; color:#bfd8f0; margin-top:2px; }
  #goalStars { font-size:52px; letter-spacing:6px; margin:6px 0 2px; min-height:60px; }
  #goalStars span { display:inline-block; transform:scale(0); transition:transform .34s cubic-bezier(.2,1.8,.5,1);
                    color:#3a2f5e; text-shadow:none; }
  #goalStars span.on { transform:scale(1); color:#ffe14d; text-shadow:0 0 18px #ff9d00; }
  .res-row { display:flex; gap:16px; justify-content:center; margin-top:8px; flex-wrap:wrap; }
  .res-item { min-width:88px; padding:8px 12px; border-radius:16px; background:rgba(18,14,44,.62);
              border:2px solid rgba(255,255,255,.28); }
  .res-k { font-size:10px; letter-spacing:2px; color:#a9cbe6; font-weight:800; }
  .res-v { font-size:22px; font-weight:800; margin-top:1px; }
  #goalMsg { margin-top:14px; font-size:15px; font-weight:800; color:#a8ffd0;
             text-shadow:0 0 12px rgba(0,220,140,.6); }
  #goalUnlock { margin-top:8px; font-size:13px; font-weight:800; color:#ffe14d; display:none; }
  .btn-row { display:flex; gap:10px; flex-wrap:wrap; justify-content:center; align-items:center; }

  /* 図鑑（ともだち） */
  .zoo { display:flex; gap:8px; flex-wrap:wrap; justify-content:center; max-width:400px; margin-top:4px; }
  .zoo-cell { width:44px; height:44px; border-radius:12px; background:rgba(18,14,44,.6);
              border:2px solid rgba(255,255,255,.22); display:flex; align-items:center; justify-content:center; }
  .zoo-cell svg { width:34px; height:34px; }
  .zoo-cell.off { opacity:.28; filter:grayscale(1); }

  #flash { position:fixed; inset:0; background:#fff; opacity:0; pointer-events:none; z-index:6; }
  #vignette { position:fixed; inset:0; pointer-events:none; z-index:4; opacity:0; transition:opacity .25s;
              box-shadow:inset 0 0 110px 26px rgba(255,120,180,.5); }

  @media (max-height:460px){
    #progWrap { top:calc(52px + var(--sat0)); width:min(66vw,380px); }
    #speedNum { font-size:34px; }
    .pill { font-size:15px; padding:4px 11px 4px 8px; }
    #gaugeWrap { width:118px; }
  }

  #bgmBtn { position:fixed; z-index:90; width:44px; height:44px; border-radius:15px; cursor:pointer;
            left:calc(10px + var(--sal0)); top:calc(8px + var(--sat0));
            border:2px solid rgba(255,255,255,.78); background:rgba(255,255,255,.9);
            color:#315178; font-size:17px; font-weight:800; }
</style>
</head>
<body>
<div id="game"></div>
<div id="flash"></div>
<div id="vignette"></div>
<div id="webglFail" class="ui" style="display:none;position:fixed;inset:0;z-index:999;background:#150b38;
     flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px;">
  <div style="font-size:44px;margin-bottom:14px;">🚗</div>
  <div style="font-size:19px;font-weight:800;line-height:1.9;">この たんまつでは<br>あそべません</div>
</div>

<!-- ================= HUD ================= -->
<div id="hud" class="ui">
  <div id="progWrap">
    <div id="progTrack">
      <div id="progFill"></div>
      <div id="progCar">🚗</div>
      <div id="progGoal">🏁</div>
    </div>
    <div id="courseName"></div>
  </div>
  <div id="leftHud">
    <div class="pill" id="starPill"><span>⭐</span><span id="starNum">0</span></div>
    <div class="pill" id="friendPill"><span>🐾</span><span id="friendNum">0 / 3</span></div>
    <div id="gaugeWrap">
      <div id="gaugeTrack"><div id="gaugeFill"></div></div>
      <div id="gaugeLabel">にじいろゲージ</div>
    </div>
  </div>
  <div id="hearts">💗💗💗</div>
  <div id="speed"><div id="speedNum">0</div><div id="speedUnit">km/h</div></div>
  <div id="combo"></div>
  <div id="praise"></div>
  <div id="rainbowMsg">にじいろパワー！ むてきだよ！</div>
</div>

<div id="countdown" class="ui"></div>
<div id="guide" class="ui">
  <div id="guideHand">👆</div>
  <div id="guideText">ゆびで なぞって うんてん！</div>
</div>

<!-- ================= タイトル ================= -->
<div id="titleScreen" class="screen ui on">
  <div class="title-sub">6つの けしきを たびしよう</div>
  <div class="title-main">きらきら<br>ドライブ</div>
  <div class="title-en">NEON DRIVE</div>
  <button class="btn" id="startBtn">はじめる</button>
  <div class="hint">
    ゆびで がめんを なぞって うんてん 🚗<br>
    <b style="color:#ffe14d">⭐ほし</b> を あつめて
    <b style="color:#ffb8e2">まいごの どうぶつ</b> を たすけよう<br>
    ぶつかっても だいじょうぶ。ゴールまで はしれるよ！
  </div>
</div>

<!-- ================= キャラ選択 ================= -->
<div id="charScreen" class="screen ui">
  <div class="scroller">
    <div class="sec-title">だれで はしる？</div>
    <div class="sel-grid" id="selGrid"></div>
    <button class="btn" id="charOkBtn">これで いく！</button>
  </div>
</div>

<!-- ================= コース選択 ================= -->
<div id="courseScreen" class="screen ui">
  <div class="scroller">
    <div class="sec-title">どこへ いく？</div>
    <div class="course-grid" id="courseGrid"></div>
    <div class="sec-title" style="margin-top:20px;font-size:13px;letter-spacing:3px;">たすけた ともだち</div>
    <div class="zoo" id="zoo"></div>
    <div class="btn-row" style="margin-top:18px;">
      <button class="btn sub" id="backToCharBtn">キャラをかえる</button>
    </div>
  </div>
</div>

<!-- ================= ゴール ================= -->
<div id="goalScreen" class="screen ui">
  <div class="scroller">
    <div id="goalTitle">ゴール！</div>
    <div id="goalWhere"></div>
    <div id="goalStars"><span>★</span><span>★</span><span>★</span></div>
    <div class="res-row">
      <div class="res-item"><div class="res-k">ほし</div><div class="res-v" id="rStar">0</div></div>
      <div class="res-item"><div class="res-k">ともだち</div><div class="res-v" id="rFriend">0</div></div>
      <div class="res-item"><div class="res-k">スコア</div><div class="res-v" id="rScore">0</div></div>
    </div>
    <div id="goalMsg"></div>
    <div id="goalUnlock"></div>
    <div class="btn-row" style="margin-top:20px;">
      <button class="btn" id="nextBtn">つぎへ！</button>
      <button class="btn sub" id="retryBtn">もういっかい</button>
      <button class="btn sub" id="mapBtn">コースをえらぶ</button>
    </div>
  </div>
</div>

<button id="bgmBtn" class="ui" aria-label="おんがく">♪</button>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function(){
"use strict";

/* ============================================================
   きらきらドライブ v2  —  NEON DRIVE : ISLAND JOURNEY
   6つのコースを たびする 3Dドライブ（ゲームオーバーなし）
   ============================================================ */

/* ---------- WebGL 非対応／読み込み失敗のフォールバック ---------- */
function showWebglFail(){
  var fail = document.getElementById('webglFail');
  if (fail) fail.style.display = 'flex';
  var g = document.getElementById('game');
  if (g) g.style.display = 'none';
}
function hasWebGL(){
  try {
    var c = document.createElement('canvas');
    return !!(window.WebGLRenderingContext &&
      (c.getContext('webgl') || c.getContext('experimental-webgl')));
  } catch(e){ return false; }
}
if (typeof THREE === 'undefined' || !hasWebGL()){
  showWebglFail();
  return;
}

/* ---------- localStorage 安全ラッパー ---------- */
var SAFE_LS = (function(){
  try { var k='__kkd2'; localStorage.setItem(k,'1'); localStorage.removeItem(k); return localStorage; }
  catch(e){ var m={}; return {
    getItem:function(k){ return (k in m) ? m[k] : null; },
    setItem:function(k,v){ m[k]=String(v); },
    removeItem:function(k){ delete m[k]; } }; }
})();

var SAVE_KEY = 'kirakira_drive_v2';
var save = { char:'rabbit', course:{}, friends:{}, best:0 };
try {
  var raw = SAFE_LS.getItem(SAVE_KEY);
  if (raw) {
    var p = JSON.parse(raw);
    if (p && typeof p === 'object') {
      if (typeof p.char === 'string') save.char = p.char;
      if (p.course && typeof p.course === 'object') save.course = p.course;
      if (p.friends && typeof p.friends === 'object') save.friends = p.friends;
      if (typeof p.best === 'number') save.best = p.best;
    }
  }
} catch(e){}
function persist(){ try { SAFE_LS.setItem(SAVE_KEY, JSON.stringify(save)); } catch(e){} }

/* ============================================================
   レンダラ / シーン / カメラ
   ============================================================ */
var container = document.getElementById('game');
var renderer;
try {
  renderer = new THREE.WebGLRenderer({ antialias:true, powerPreference:'high-performance' });
} catch(e){
  showWebglFail();
  return;
}
renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
container.appendChild(renderer.domElement);

var scene = new THREE.Scene();
scene.fog = new THREE.Fog(0x120a30, 55, 285);

var camera = new THREE.PerspectiveCamera(70, window.innerWidth/window.innerHeight, 0.1, 900);
camera.position.set(0, 5.0, 10.5);

function onResize(){
  camera.aspect = window.innerWidth/window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
}
window.addEventListener('resize', onResize, { passive:true });
window.addEventListener('orientationchange', function(){ setTimeout(onResize, 120); }, { passive:true });

/* ---------- ライト（合計 1.55／PointLight は 2つまで） ---------- */
var hemi = new THREE.HemisphereLight(0x8fa8ff, 0x241a3a, 0.85);
scene.add(hemi);
var keyLight = new THREE.DirectionalLight(0xbfd4ff, 0.70);
keyLight.position.set(-26, 52, -34);
scene.add(keyLight);
var playerGlow = new THREE.PointLight(0x39d8ff, 1.5, 34);
scene.add(playerGlow);
var itemGlow = new THREE.PointLight(0xffd44d, 0.0, 26);
scene.add(itemGlow);

/* ============================================================
   コース定義
   ============================================================ */

function paintSky(top, mid, bot){
  var ctx = skyCanvas.getContext('2d');
  var g = ctx.createLinearGradient(0, 0, 0, 256);
  g.addColorStop(0.00, top);
  g.addColorStop(0.52, mid);

  skyTex.needsUpdate = true;

/* 路面テクスチャ（レーン線・ひかるライン を1枚に焼く＝描画回数を へらす） */
var roadCanvas = document.createElement('canvas');
roadCanvas.width = 256; roadCanvas.height = 512;
var roadTex = new THREE.CanvasTexture(roadCanvas);
roadTex.wrapS = roadTex.wrapT = THREE.RepeatWrapping;
roadTex.anisotropy = 4;
function paintRoad(baseHex, glowHex){
  var g = roadCanvas.getContext('2d');
  var base = '#' + ('000000' + baseHex.toString(16)).slice(-6);
  var glow = '#' + ('000000' + glowHex.toString(16)).slice(-6);
  g.fillStyle = base; g.fillRect(0,0,256,512);
  /* ざらつき */
  for (var i=0;i<900;i++){
    g.fillStyle = 'rgba(255,255,255,' + (0.012 + Math.random()*0.03) + ')';
    g.fillRect(Math.random()*256, Math.random()*512, 2, 2);
  }
  /* レーンの てんせん（x = 中央・左右） */
  g.fillStyle = 'rgba(223,242,255,0.85)';
  var lanesPx = [128*(1-4/10.5), 128, 128*(1+4/10.5)];
  for (var l=0;l<3;l++){
    for (var y=0;y<512;y+=102){
      g.fillRect(lanesPx[l]-2, y, 4, 44);
    }
  }
  /* ひかる よこライン */
  g.fillStyle = glow;
  g.globalAlpha = 0.42;
  g.fillRect(0, 118, 256, 9);
  g.fillRect(0, 374, 256, 9);
  g.globalAlpha = 1;
  roadTex.needsUpdate = true;
}
var roadMat  = new THREE.MeshLambertMaterial({ map:roadTex });
var edgeMatL = new THREE.MeshBasicMaterial({ color:0xff2fb0 });
var edgeMatR = new THREE.MeshBasicMaterial({ color:0x00e5ff });
var archMat  = new THREE.MeshBasicMaterial({ color:0x7df9ff, transparent:true, opacity:0.9 });
var poleMat  = new THREE.MeshLambertMaterial({ color:0x2e2a4a });
/* 【修正】使い回す共有マテリアルには印を付け、コース切替時に誤って dispose しないようにする */
[roadMat, edgeMatL, edgeMatR, archMat, poleMat].forEach(function(m){ m.userData.shared = true; });

var roadSegs = [];
(function buildRoad(){
  var roadGeo  = new THREE.PlaneGeometry(ROAD_W+4, SEG_LEN);
  var edgeGeo  = new THREE.BoxGeometry(0.4, 0.55, SEG_LEN);
  var poleGeo  = new THREE.BoxGeometry(0.45, 10, 0.45);
  var archGeo  = new THREE.BoxGeometry(ROAD_W+7, 0.55, 0.55);

  for (var s=0; s<SEG_COUNT; s++){
    var seg = new THREE.Group();
    var road = new THREE.Mesh(roadGeo, roadMat);
    road.rotation.x = -Math.PI/2;
    seg.add(road);

    var eL = new THREE.Mesh(edgeGeo, edgeMatL); eL.position.set(-ROAD_W/2-1.4, 0.28, 0); seg.add(eL);
    var eR = new THREE.Mesh(edgeGeo, edgeMatR); eR.position.set( ROAD_W/2+1.4, 0.28, 0); seg.add(eR);

    if (s % 3 === 0){
      var arch = new THREE.Mesh(archGeo, archMat);
      arch.position.set(0, 9.4, -SEG_LEN/2+5);
      seg.add(arch);
      var pL = new THREE.Mesh(poleGeo, poleMat); pL.position.set(-(ROAD_W/2+2.8), 5, -SEG_LEN/2+5); seg.add(pL);
      var pR = new THREE.Mesh(poleGeo, poleMat); pR.position.set( (ROAD_W/2+2.8), 5, -SEG_LEN/2+5); seg.add(pR);
    }
    seg.position.z = -s * SEG_LEN;
    roadGroup.add(seg);
    roadSegs.push(seg);
  }
})();

/* ============================================================
   風景（コースごとに つくりかえる）
   ============================================================ */
var decoGroup = new THREE.Group(); scene.add(decoGroup);
var decoItems = [];   /* {obj, spin, bob} */

function disposeMaterial(mat){
  if (!mat) return;
  if (Array.isArray(mat)) { mat.forEach(disposeMaterial); return; }
  if (mat.userData && mat.userData.shared) return;
  if (mat.map) mat.map.dispose();
  mat.dispose();
}
function clearDeco(){
  for (var i=decoGroup.children.length-1; i>=0; i--){
    var c = decoGroup.children[i];
    decoGroup.remove(c);
    c.traverse(function(o){
      if (o.geometry) o.geometry.dispose();
      if (o.material) disposeMaterial(o.material);
    });
  }
  decoItems.length = 0;
}

var NEON_COLORS = [0xff2fb0, 0x00e5ff, 0xffe14d, 0x9d4dff, 0x37ff8b, 0xff8a3d];

function addDeco(obj, opt){
  decoGroup.add(obj);
  decoItems.push({ obj:obj, spin:(opt&&opt.spin)||0, bob:(opt&&opt.bob)||0,
                   baseY:obj.position.y, ph:Math.random()*6.28 });
}

/* --- ビル（ファサードは テクスチャ1枚＝メッシュ1つ） --- */
var FACADES = [];
(function(){
  for (var v=0; v<5; v++){
    var cv = document.createElement('canvas');
    cv.width = 64; cv.height = 128;
    var g = cv.getContext('2d');
    g.fillStyle = '#0e0b1e'; g.fillRect(0,0,64,128);
    var cols = 4, rows = 16;
    for (var r=0; r<rows; r++){
      for (var c=0; c<cols; c++){
        if (Math.random() < 0.38) continue;
        var warm = Math.random() < 0.7;
        g.fillStyle = warm ? 'rgba(255,217,138,' + (0.55+Math.random()*0.45) + ')'
                           : 'rgba(125,249,255,' + (0.5+Math.random()*0.45) + ')';
        g.fillRect(4 + c*15, 4 + r*7.6, 9, 4.6);
      }
    }
    var t = new THREE.CanvasTexture(cv);
    t.wrapS = t.wrapT = THREE.RepeatWrapping;
    var facadeMat = new THREE.MeshLambertMaterial({ map:t });
    facadeMat.userData.shared = true;
    FACADES.push(facadeMat);
  }
})();
var BLD_GEO = new THREE.BoxGeometry(1, 1, 1);

  var g = new THREE.Group();

/* ---------- テーマ別 配置 ---------- */
function buildWorld(course, tm, weather){
  clearDeco();
  applyTime(tm);
  if (weather === 'hoshi'){
    skyStars.visible = true;
    skyStars.material.opacity = Math.max(0.6, tm.starOp);
    skyStars.material.size = 3.4;
  } else {
    skyStars.material.size = 2.4;
  }
  paintRoad(course.road, course.edgeR);
  edgeMatL.color.setHex(course.edgeL);
  edgeMatR.color.setHex(course.edgeR);

/* まるみのある ボディ（Box + 角のスフィアで やわらかく） */
function addRoundedBody(car, mat, w, h, d, y){
  var core = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), mat);
  core.position.y = y; car.add(core);
  var r = Math.min(h, w) * 0.5;
  for (var sx=-1; sx<=1; sx+=2){
    for (var sz=-1; sz<=1; sz+=2){
      var b = new THREE.Mesh(GEO.round, mat);
      b.scale.set(r, h*0.5, r);
      b.position.set(sx*(w/2 - r*0.5), y, sz*(d/2 - r*0.5));
      car.add(b);
    }
  }
  return core;
}

var GEO_BOX = new THREE.BoxGeometry(1,1,1);
function makeCar(bodyColor, neonColor, isPlayer, earType, innerColor){
  var car = new THREE.Group();
  var bodyMat = new THREE.MeshLambertMaterial({ color:bodyColor });

  if (isPlayer){
    addRoundedBody(car, bodyMat, 2.05, 0.62, 4.4, 0.58);
    var hoodF = new THREE.Mesh(GEO_BOX, bodyMat);
    hoodF.scale.set(1.9, 0.3, 1.2); hoodF.position.set(0, 0.92, -1.5); car.add(hoodF);
    var glassF = new THREE.Mesh(GEO_BOX, MAT_GLASS);
    glassF.scale.set(1.6, 0.5, 0.14); glassF.position.set(0, 1.14, -0.95);
    glassF.rotation.x = -0.28; car.add(glassF);
    for (var gs=-1; gs<=1; gs+=2){
      var gside = new THREE.Mesh(GEO_BOX, MAT_GLASS);
      gside.scale.set(0.12, 0.42, 1.7); gside.position.set(gs*0.83, 1.14, 0.24); car.add(gside);
    }
  } else {
    var lower = new THREE.Mesh(GEO_BOX, bodyMat);
    lower.scale.set(2.05, 0.7, 4.4); lower.position.y = 0.6; car.add(lower);
  }

  var cabin = new THREE.Mesh(GEO_BOX, bodyMat);
  cabin.scale.set(1.72, 0.62, 2.3); cabin.position.set(0, 1.12, 0.2); car.add(cabin);
  var roof = new THREE.Mesh(GEO.round, isPlayer ? bodyMat : MAT_GLASS);
  roof.scale.set(0.88, 0.26, 1.18); roof.position.set(0, 1.42, 0.2); car.add(roof);

  var wheelN = isPlayer ? 4 : 2;
  for (var wi=0; wi<wheelN; wi++){
    var wx = (wi%2 ? 1 : -1) * 1.0;
    var wz = isPlayer ? ((wi<2 ? -1 : 1) * 1.42) : 1.42;
    var t = new THREE.Mesh(GEO.wheel, MAT_DARK);
    t.rotation.z = Math.PI/2; t.position.set(wx, 0.44, wz); car.add(t);
    if (isPlayer){
      var hb = new THREE.Mesh(GEO.hub, MAT_HUB);
      hb.rotation.z = Math.PI/2; hb.position.set(wx*1.02, 0.44, wz); car.add(hb);
    }
  }

  var tail = new THREE.Mesh(GEO_BOX, MAT_TAIL);
  tail.scale.set(1.85, 0.24, 0.12); tail.position.set(0, 0.82, 2.24); car.add(tail);
  if (isPlayer){
    for (var hs=-1; hs<=1; hs+=2){
      var head = new THREE.Mesh(GEO_BOX, MAT_HEAD);
      head.scale.set(0.62, 0.24, 0.12); head.position.set(hs*0.62, 0.78, -2.24); car.add(head);
    }
  }
  var neon = new THREE.Mesh(GEO_BOX, new THREE.MeshBasicMaterial({ color:neonColor }));
  neon.scale.set(2.3, 0.09, 4.5); neon.position.y = 0.19; car.add(neon);
  car.userData.neonMesh = neon;
  car.userData.bodyMat = bodyMat;

  if (isPlayer){
    /* ヘッドライトの ひかりの すじ */
    for (var bs=-1; bs<=1; bs+=2){
      var beam = new THREE.Mesh(new THREE.ConeGeometry(1.5, 16, 10, 1, true), MAT_BEAM);
      beam.rotation.x = Math.PI/2;
      beam.position.set(bs*0.62, 0.72, -10.2);
      car.add(beam);
    }
    var earMat  = new THREE.MeshLambertMaterial({ color:bodyColor });
    var innMat  = new THREE.MeshBasicMaterial({ color: (innerColor!=null ? innerColor : 0xffb0d8) });
    var blkMat  = new THREE.MeshLambertMaterial({ color:0x24222c });
    var et = earType || 'cat';
    for (var sx2=-1; sx2<=1; sx2+=2){
      if (et === 'rabbit'){
        var ear = new THREE.Mesh(new THREE.CylinderGeometry(0.17, 0.22, 1.3, 8), earMat);
        ear.position.set(sx2*0.42, 2.2, -0.45); ear.rotation.z = sx2*0.12; car.add(ear);
        var inn = new THREE.Mesh(new THREE.CylinderGeometry(0.08, 0.12, 0.98, 8), innMat);
        inn.position.set(sx2*0.44, 2.24, -0.4); inn.rotation.z = sx2*0.12; car.add(inn);
      } else if (et === 'panda'){
        var e2 = new THREE.Mesh(new THREE.SphereGeometry(0.36, 12, 10), blkMat);
        e2.position.set(sx2*0.66, 1.82, -0.35); car.add(e2);
      } else if (et === 'fox'){
        var e3 = new THREE.Mesh(new THREE.ConeGeometry(0.36, 0.9, 4), earMat);
        e3.position.set(sx2*0.62, 1.95, -0.4); e3.rotation.y = Math.PI/4; e3.rotation.z = sx2*0.2; car.add(e3);
        var i3 = new THREE.Mesh(new THREE.ConeGeometry(0.17, 0.5, 4), innMat);
        i3.position.set(sx2*0.62, 1.88, -0.36); i3.rotation.y = Math.PI/4; car.add(i3);
      } else if (et === 'bear'){
        var e5 = new THREE.Mesh(new THREE.SphereGeometry(0.34, 12, 10), earMat);
        e5.position.set(sx2*0.68, 1.8, -0.35); car.add(e5);
        var i5 = new THREE.Mesh(new THREE.SphereGeometry(0.18, 10, 8), innMat);
        i5.position.set(sx2*0.72, 1.8, -0.5); car.add(i5);
      } else {
        var e4 = new THREE.Mesh(new THREE.ConeGeometry(0.36, 0.74, 4), earMat);
        e4.position.set(sx2*0.58, 1.88, -0.42); e4.rotation.y = Math.PI/4; car.add(e4);
        var i4 = new THREE.Mesh(new THREE.ConeGeometry(0.19, 0.42, 4), innMat);
        i4.position.set(sx2*0.58, 1.83, -0.38); i4.rotation.y = Math.PI/4; car.add(i4);
      }
    }
    var tl = new THREE.Mesh(new THREE.CylinderGeometry(0.1, 0.17, 1.5, 8), earMat);
    tl.position.set(0.5, 1.2, 2.7); tl.rotation.x = -0.7; car.add(tl);
    car.userData.tail = tl;
  }
  return car;
}

function makeStarGeo(){
  var shape = new THREE.Shape();
  var outer = 0.92, inner = 0.4, N = 5;
  for (var i=0;i<N*2;i++){
    var r = (i%2===0) ? outer : inner;
    var a = (i/(N*2))*Math.PI*2 - Math.PI/2;
    var x = Math.cos(a)*r, y = Math.sin(a)*r;
    if (i===0) shape.moveTo(x,y); else shape.lineTo(x,y);
  }
  shape.closePath();
  return new THREE.ExtrudeGeometry(shape, { depth:0.26, bevelEnabled:false });
}

function makeAnimal(species, mainHex, subHex){
  var g = new THREE.Group();
  var mainMat = new THREE.MeshLambertMaterial({ color:new THREE.Color(mainHex) });
  var subMat  = new THREE.MeshLambertMaterial({ color:new THREE.Color(subHex) });
  var eyeMat  = new THREE.MeshBasicMaterial({ color:0x2e2438 });

  var body = new THREE.Mesh(GEO.round, mainMat);
  body.scale.set(0.62, 0.56, 0.62); body.position.y = 0.5; g.add(body);
  var head = new THREE.Mesh(GEO.round, mainMat);
  head.scale.set(0.5, 0.47, 0.5); head.position.set(0, 1.16, -0.06); g.add(head);
  var muzzle = new THREE.Mesh(GEO.round, subMat);
  muzzle.scale.set(0.26, 0.2, 0.22); muzzle.position.set(0, 1.05, -0.44); g.add(muzzle);
  for (var e=-1; e<=1; e+=2){
    var eye = new THREE.Mesh(GEO.round, eyeMat);
    eye.scale.setScalar(0.075); eye.position.set(e*0.2, 1.24, -0.4); g.add(eye);
  }
  for (var s=-1; s<=1; s+=2){
    if (species === 'rabbit'){
      var er = new THREE.Mesh(new THREE.CylinderGeometry(0.09, 0.12, 0.78, 7), mainMat);
      er.position.set(s*0.18, 1.85, -0.02); er.rotation.z = s*0.2; g.add(er);
      var ir = new THREE.Mesh(new THREE.CylinderGeometry(0.045, 0.06, 0.6, 7), subMat);
      ir.position.set(s*0.2, 1.88, -0.07); ir.rotation.z = s*0.2; g.add(ir);
    } else if (species === 'cat'){
      var ec = new THREE.Mesh(new THREE.ConeGeometry(0.2, 0.4, 4), mainMat);
      ec.position.set(s*0.3, 1.62, -0.04); ec.rotation.y = Math.PI/4; g.add(ec);
    } else if (species === 'fox'){
      var ef = new THREE.Mesh(new THREE.ConeGeometry(0.21, 0.52, 4), mainMat);
      ef.position.set(s*0.31, 1.68, -0.04); ef.rotation.y = Math.PI/4; ef.rotation.z = s*0.14; g.add(ef);
    } else if (species === 'panda'){
      var ep = new THREE.Mesh(GEO.round, new THREE.MeshLambertMaterial({ color:0x2c2830 }));
      ep.scale.setScalar(0.2); ep.position.set(s*0.34, 1.52, -0.02); g.add(ep);
    } else if (species === 'bear'){
      var eb = new THREE.Mesh(GEO.round, mainMat);
      eb.scale.setScalar(0.19); eb.position.set(s*0.34, 1.5, -0.02); g.add(eb);
    } else { /* bird */
      var wg = new THREE.Mesh(GEO.round, subMat);
      wg.scale.set(0.1, 0.3, 0.42); wg.position.set(s*0.6, 0.55, 0.02); g.add(wg);
    }
  }
  if (species === 'bird'){
    var beak = new THREE.Mesh(new THREE.ConeGeometry(0.12, 0.28, 5), new THREE.MeshBasicMaterial({ color:0xffb347 }));
    beak.rotation.x = -Math.PI/2; beak.position.set(0, 1.08, -0.6); g.add(beak);
  } else {
    var nose = new THREE.Mesh(GEO.round, new THREE.MeshBasicMaterial({ color:0x4a3a48 }));
    nose.scale.setScalar(0.06); nose.position.set(0, 1.06, -0.62); g.add(nose);
  }
  return g;
}

function setAnimalIn(group, fdef, scale){
  for (var i=group.children.length-1; i>=0; i--){
    var c = group.children[i];
    if (c.userData && c.userData.isAnimal){
      group.remove(c);
      c.traverse(function(o){
        if (o.geometry && o.geometry !== GEO.round) o.geometry.dispose();
        if (o.material) disposeMaterial(o.material);
      });
    }
  }
  var a = makeAnimal(fdef.species, fdef.main, fdef.sub);
  a.userData.isAnimal = true;
  a.scale.setScalar(scale);
  group.add(a);
  return a;
}

  g.setAttribute('color',    new THREE.BufferAttribute(pCol, 3));
  particles = new THREE.Points(g, new THREE.PointsMaterial({
    size:0.55, vertexColors:true, transparent:true, opacity:0.95, depthWrite:false }));
  scene.add(particles);
})();
var _c = new THREE.Color();
function burst(x, y, z, n, colorHex, power, gravity){
  for (var k=0;k<n;k++){
    var i = pHead; pHead = (pHead+1) % PCOUNT;
    pPos[i*3] = x; pPos[i*3+1] = y; pPos[i*3+2] = z;
    var a = Math.random()*Math.PI*2, u = Math.random()*2-1, s = Math.sqrt(1-u*u);
    var sp = (0.4 + Math.random()) * (power || 6);
    pVel[i*3]   = Math.cos(a)*s*sp;
    pVel[i*3+1] = Math.abs(u)*sp*0.9 + 1.5;
    pVel[i*3+2] = Math.sin(a)*s*sp;
    _c.setHex(colorHex);
    if (colorHex === -1) _c.setHSL(Math.random(), 0.85, 0.65);
    pCol[i*3] = _c.r; pCol[i*3+1] = _c.g; pCol[i*3+2] = _c.b;
    pLife[i] = 0.7 + Math.random()*0.55;
    pGrav[i] = (gravity == null ? 11 : gravity);
  }
}
function updateParticles(dt, worldSpeed){
  var moved = false;
  for (var i=0;i<PCOUNT;i++){
    if (pLife[i] <= 0){ continue; }
    pLife[i] -= dt;
    if (pLife[i] <= 0){ pPos[i*3+1] = -999; moved = true; continue; }
    pVel[i*3+1] -= pGrav[i]*dt;
    pPos[i*3]   += pVel[i*3]*dt;
    pPos[i*3+1] += pVel[i*3+1]*dt;
    pPos[i*3+2] += pVel[i*3+2]*dt + worldSpeed;
    moved = true;
  }
  if (moved) particles.geometry.attributes.position.needsUpdate = true;
  particles.geometry.attributes.color.needsUpdate = true;
}

function setWeather(mode){
  precipMode = mode;

  if (!cfg){ precip.visible = false; return; }
  precip.visible = true;
  precip.material.color.setHex(cfg.color);
  precip.material.size = cfg.size;
  precip.material.opacity = cfg.opacity;
  var p = precip.geometry.attributes.position;
  for (var i=0;i<PRECIP_N;i++){
    precipVel[i] = cfg.vmin + Math.random()*(cfg.vmax - cfg.vmin);
    p.setX(i, (Math.random()-0.5)*92);
    p.setY(i, Math.random()*42);
    p.setZ(i, -Math.random()*245);
  }
  p.needsUpdate = true;
}
function updatePrecip(dt, worldSpeed, now){
  var cfg = PRECIP_CFG[precipMode];
  if (!cfg || !precip.visible) return;
  var p = precip.geometry.attributes.position;
  for (var i=0;i<PRECIP_N;i++){
    var y = p.getY(i) - precipVel[i]*dt;
    var z = p.getZ(i) + worldSpeed*cfg.zmul;
    if (y < -1 || z > 22){ y = 36 + Math.random()*10; z = -235 - Math.random()*20; }
    p.setY(i, y); p.setZ(i, z);
    if (cfg.sway) p.setX(i, p.getX(i) + Math.sin(now*0.0013 + i)*cfg.sway);
  }
  p.needsUpdate = true;
}

function launchFirework(){
  for (var f=0; f<fireworks.length; f++){
    var fw = fireworks[f];
    if (fw.life > 0) continue;
    fw.ox = (Math.random()-0.5)*180;
    fw.oy = 55 + Math.random()*55;
    fw.oz = -180 - Math.random()*160;
    for (var i=0;i<fw.N;i++){
      var a = Math.random()*Math.PI*2, u = Math.random()*2-1, s = Math.sqrt(1-u*u);
      var sp = 14 + Math.random()*12;
      fw.dir[i*3]   = Math.cos(a)*s*sp;
      fw.dir[i*3+1] = u*sp;
      fw.dir[i*3+2] = Math.sin(a)*s*sp;
    }
    fw.pts.material.color.setHSL(Math.random(), 0.9, 0.66);
    fw.pts.visible = true;
    fw.life = 1.7;
    return;
  }

function updateFireworks(dt){
  for (var f=0; f<fireworks.length; f++){
    var fw = fireworks[f];
    if (fw.life <= 0) continue;
    fw.life -= dt;
    if (fw.life <= 0){ fw.pts.visible = false; continue; }
    var t = 1.7 - fw.life;
    var p = fw.pts.geometry.attributes.position;
    for (var i=0;i<fw.N;i++){
      p.array[i*3]   = fw.ox + fw.dir[i*3]*t;
      p.array[i*3+1] = fw.oy + fw.dir[i*3+1]*t - 3.4*t*t;
      p.array[i*3+2] = fw.oz + fw.dir[i*3+2]*t;
    }
    p.needsUpdate = true;
    fw.pts.material.opacity = Math.max(0, fw.life/1.7);
  }
}

var audioCtx = null, engineOsc = null, engineGain = null, bgm = null, sfxMuted = false;

function initAudio(){
  if (audioCtx) return;
  try {
    var AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    audioCtx = new AC();
    engineOsc = audioCtx.createOscillator();
    engineOsc.type = 'sawtooth';
    engineOsc.frequency.value = 55;
    var filt = audioCtx.createBiquadFilter();
    filt.type = 'lowpass'; filt.frequency.value = 320;
    engineGain = audioCtx.createGain();
    engineGain.gain.value = 0;
    engineOsc.connect(filt); filt.connect(engineGain); engineGain.connect(audioCtx.destination);
    engineOsc.start();
  } catch(e){ audioCtx = null; }
  startMusic();
}
function resumeAudio(){
  if (audioCtx && audioCtx.state === 'suspended') { try { audioCtx.resume(); } catch(e){} }
}
function startMusic(){
  if (bgm || typeof WakuwakuMP3BGM === 'undefined') return;
  try {
    bgm = new WakuwakuMP3BGM('racing-fast');
    bgm.setEnabled(WakuwakuMP3BGM.loadState());
    if (bgm.enabled) bgm.start();
    sfxMuted = !bgm.enabled;
    bgmBtn.textContent = bgm.enabled ? '\u266a' : '\u2715';
  } catch(e){ bgm = null; }
}
function tone(freq, dur, type, vol, delay){
  if (!audioCtx || sfxMuted) return;
  try {
    var t = audioCtx.currentTime + (delay||0);
    var o = audioCtx.createOscillator(), g = audioCtx.createGain();
    o.type = type; o.frequency.value = freq;
    g.gain.setValueAtTime(vol, t);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(audioCtx.destination);
    o.start(t); o.stop(t + dur);
  } catch(e){}
}

/* ---------- コース開始 ---------- */
function startCourse(idx, fromRandom){
  state.courseIdx = idx;
  state.course = COURSES[idx];
  state.fromRandom = !!fromRandom;
  /* まいかい 時間帯と 天気が かわる */
  state.time = TIMES[pickOne(state.course.times)] || TIMES.yoru;
  state.weather = pickOne(state.course.weather) || 'hare';
  buildWorld(state.course, state.time, state.weather);
  setWeather(state.weather);
  resetRun();
  showScreen(null);
  el.hud.style.display = 'block';
  el.courseName.textContent = state.time.name + 'の ' + state.course.name;
  state.phase = 'countdown';
  state.cdTimer = 0.6; state.cdNum = 3;
  el.countdown.style.display = 'flex';
  el.countdown.textContent = '3';
  el.countdown.classList.remove('tick'); void el.countdown.offsetWidth; el.countdown.classList.add('tick');
  initAudio(); resumeAudio();
  sfxTick(false);
}

function resetRun(){
  var c = state.course;
  state.speed = 0.30; state.score = 0; state.combo = 0; state.comboTimer = 0;
  state.spawnTimer = 1.6; state.starTimer = 1.1; state.orbTimer = 16; state.heartTimer = 20;
  state.distance = 0; state.hearts = 3; state.invincible = 0; state.rainbow = 0;
  state.gauge = 0; state.starGot = 0; state.starSeen = 0; state.friendGot = 0;
  state.hitCount = 0; state.shake = 0; state.goalT = 0;
  state.targetX = 0;
  state.guideT = 3.4;

  player.position.set(0,0,0); player.rotation.set(0,0,0);
  player.visible = true;
  player.userData.bodyMat.color.setHex(player.userData.baseBody);
  player.userData.neonMesh.material.color.setHex(player.userData.baseNeon);
  playerGlow.color.setHex(0x39d8ff);

  for (var i=0;i<traffic.length;i++){ traffic[i].visible=false; traffic[i].userData.active=false; }
  for (var s=0;s<stars.length;s++){ stars[s].visible=false; stars[s].userData.active=false; }
  for (var o=0;o<rainbowOrbs.length;o++){ rainbowOrbs[o].visible=false; rainbowOrbs[o].userData.active=false; }
  for (var h=0;h<heartItems.length;h++){ heartItems[h].visible=false; heartItems[h].userData.active=false; }
  for (var l=0;l<lostSlots.length;l++){ lostSlots[l].visible=false; lostSlots[l].userData.active=false; }
  for (var p=0;p<paradeSlots.length;p++){ paradeSlots[p].visible=false; }
  for (var t=0;t<trailX.length;t++) trailX[t] = 0;
  for (var q=0;q<PCOUNT;q++){ pLife[q]=0; pPos[q*3+1]=-999; }
  particles.geometry.attributes.position.needsUpdate = true;

  goalGate.visible = false;
  goalGate.position.z = -9999;

  /* まいごの どうぶつ の 出現位置（距離ベース／3ひき） */
  state.courseFriends = friendsOfCourse(c.id);
  state.lostPlan = [ c.dist*0.24, c.dist*0.52, c.dist*0.79 ];
  state.lostNext = 0;

  el.starNum.textContent = '0';

function spawnTraffic(){
  var car = null;
  for (var i=0;i<traffic.length;i++) if (!traffic[i].userData.active){ car = traffic[i]; break; }
  if (!car) return;
  var lane = LANES[(Math.random()*LANES.length)|0];
  car.userData.active = true;
  car.userData.speed = 0.22 + Math.random()*0.26;
  car.userData.nearMissed = false;
  car.userData.wob = Math.random()*6.28;
  car.userData.lane = lane;
  car.position.set(lane, 0, -255 - Math.random()*70);
  car.rotation.set(0,0,0);
  car.visible = true;
}
function spawnStarRow(){
  var lane = LANES[(Math.random()*LANES.length)|0];
  var n = 3 + ((Math.random()*3)|0);
  var wave = Math.random() < 0.45;
  var placed = 0;
  for (var i=0;i<stars.length && placed<n;i++){
    var s = stars[i];
    if (s.userData.active) continue;
    s.userData.active = true; s.visible = true;
    var x = lane + (wave ? Math.sin(placed*0.9)*2.6 : 0);
    s.position.set(Math.max(-HALF_X, Math.min(HALF_X, x)), 1.6, -250 - placed*7);
    placed++;
    state.starSeen++;
  }
}
function spawnOrb(){
  for (var i=0;i<rainbowOrbs.length;i++){
    var o = rainbowOrbs[i];
    if (o.userData.active) continue;
    o.userData.active = true; o.visible = true;
    o.position.set(LANES[(Math.random()*LANES.length)|0], 1.7, -258);
    return;
  }
}
function spawnHeart(){
  for (var i=0;i<heartItems.length;i++){
    var h = heartItems[i];
    if (h.userData.active) continue;
    h.userData.active = true; h.visible = true;
    h.position.set(LANES[(Math.random()*LANES.length)|0], 1.7, -258);
    return;
  }
}
function spawnLost(){
  var fd = state.courseFriends[state.lostNext];
  if (!fd) return;
  var slot = null;
  for (var i=0;i<lostSlots.length;i++) if (!lostSlots[i].userData.active){ slot = lostSlots[i]; break; }
  if (!slot) return;
  slot.userData.active = true;
  slot.userData.fid = fd.id;
  slot.userData.fdef = fd;
  setAnimalIn(slot, fd, 0.72);
  slot.visible = true;
  slot.position.set(LANES[(Math.random()*LANES.length)|0], 0, -256);
  state.lostNext++;
}

/* ---------- ゴール ---------- */
function ratingOf(){
  var starRatio = state.starSeen > 0 ? state.starGot / state.starSeen : 0;
  var pts = starRatio*58 + (state.friendGot/3)*32 + (state.hitCount === 0 ? 10 : (state.hitCount<=2 ? 5 : 0));
  if (pts >= 82) return 3;
  if (pts >= 52) return 2;
  return 1;
}
var WEATHER_NAME = { ame:'あめ', yuki:'ゆき', hanabira:'はなびら', hoshi:'ほしぞら' };
var GOAL_MSG = ['また いっしょに はしろうね！','よく がんばったね！','すごい！めいドライバー！','パーフェクト！でんせつの ドライバー！'];

function finishCourse(){
  state.phase = 'goal';
  el.vignette.style.opacity = 0;
  sfxGoal();
  for (var b=0;b<7;b++){
    burst(player.position.x + (Math.random()-0.5)*10, 3 + Math.random()*5, player.position.z - 6 - Math.random()*8,
          22, -1, 9, 7);
  }
  var rate = ratingOf();
  var c = state.course;
  var prev = save.course[c.id] || 0;
  var isNew = rate > prev;
  if (isNew) save.course[c.id] = rate;
  if (state.score > save.best) save.best = state.score;
  persist();

  setTimeout(function(){
    el.hud.style.display = 'none';
    el.rStar.textContent = state.starGot;
    el.rFriend.textContent = state.friendGot + ' / 3';
    el.rScore.textContent = state.score;
    el.goalMsg.textContent = GOAL_MSG[rate];
    el.goalTitle.textContent = 'ゴール！';
    el.goalWhere.textContent = state.time.name + 'の ' + c.name
      + (WEATHER_NAME[state.weather] ? '（' + WEATHER_NAME[state.weather] + '）' : '');
    var wasLast = (state.courseIdx >= COURSES.length-1);
    var justOpened = (!wasLast && !save.course[COURSES[state.courseIdx+1].id] && prev === 0);
    el.goalUnlock.style.display = justOpened ? 'block' : 'none';
    if (justOpened) el.goalUnlock.textContent = '🎉 あたらしい コース「' + COURSES[state.courseIdx+1].name + '」が あそべるよ！';
    el.nextBtn.style.display = wasLast ? 'none' : 'inline-block';
    var spans = el.goalStars.children;
    for (var i=0;i<3;i++) spans[i].classList.remove('on');
    showScreen(el.goalScr);
    for (var k=0;k<rate;k++){
      (function(kk){ setTimeout(function(){
        spans[kk].classList.add('on');
        tone(660 + kk*220, 0.24, 'triangle', 0.14);
      }, 420 + kk*330); })(k);
    }
    renderCourses();
  }, 1500);
}

/* 【修正】絶対座標追従 → 相対ドラッグ。指を置いた場所へ瞬間移動させず、
   動かした量ぶんだけ くるまが うごく。画面はしに 指がよっても破綻しない。 */
var drag = { active:false, pointerId:null, startClientX:0, startX:0 };
function clampHalfX(x){ return Math.max(-HALF_X, Math.min(HALF_X, x)); }
container.addEventListener('pointerdown', function(e){
  drag.active = true;
  drag.pointerId = e.pointerId;
  drag.startClientX = e.clientX;
  drag.startX = state.targetX;
  input.pointerX = drag.startX;
  try { container.setPointerCapture(e.pointerId); } catch(err){}
  state.guideT = 0; el.guide.style.display = 'none';
});
container.addEventListener('pointermove', function(e){
  if (!drag.active || e.pointerId !== drag.pointerId) return;
  var dx = e.clientX - drag.startClientX;
  var scale = (2 * HALF_X) / Math.max(1, window.innerWidth);
  input.pointerX = clampHalfX(drag.startX + dx * scale);
});
function endDrag(e){
  if (drag.pointerId !== null && e && e.pointerId !== undefined && e.pointerId !== drag.pointerId) return;
  drag.active = false;
  drag.pointerId = null;
  input.pointerX = null;
}
container.addEventListener('pointerup', endDrag);
container.addEventListener('pointercancel', endDrag);

var RAINBOW_HEX = [0xff6b6b, 0xffd166, 0x7dff8a, 0x5ecdff, 0xc77dff];
var lastT = performance.now();
var fwTimer = 0;

function loop(now){
  requestAnimationFrame(loop);
  var dt = Math.min((now - lastT)/1000, 0.1);
  lastT = now;
  var worldSpeed = 0;

  /* ---- カウントダウン ---- */
  if (state.phase === 'countdown'){
    state.cdTimer -= dt;
    if (state.cdTimer <= 0){
      state.cdNum--;
      if (state.cdNum < 0){
        el.countdown.style.display = 'none';
        state.phase = 'run';
        /* 【不具合5】すでに画面を触っていたら ガイドは出さない */
        el.guide.style.display = (state.guideT > 0) ? 'block' : 'none';
      } else {
        el.countdown.textContent = (state.cdNum === 0) ? 'GO!' : String(state.cdNum);
        el.countdown.classList.remove('tick'); void el.countdown.offsetWidth; el.countdown.classList.add('tick');
        state.cdTimer = 0.6;
        sfxTick(state.cdNum === 0);
      }
    }
  }

  /* ---- 走行 ---- */
  if (state.phase === 'run' || state.phase === 'goal'){
    var c = state.course;
    var slow = (state.hearts <= 0) ? 0.74 : 1.0;
    var maxSpeed = (state.rainbow > 0 ? 1.72 : 1.44) * currentChar.spd * c.baseSpeed * slow;
    if (state.phase === 'goal'){
      state.speed = Math.max(0.15, state.speed - dt*0.55);
    } else {
      state.speed = state.speed < maxSpeed
        ? Math.min(state.speed + dt*0.05, maxSpeed)
        : Math.max(state.speed - dt*0.6, maxSpeed);
    }
    worldSpeed = state.speed * 92 * dt;
    if (state.phase === 'run') state.distance += worldSpeed;

    /* ハンドル */
    if (state.phase === 'run'){
      if (input.pointerX !== null){
        state.targetX += (input.pointerX - state.targetX) * Math.min(dt*11*currentChar.steer, 1);
      } else {
        var steer = (input.right?1:0) - (input.left?1:0);
        state.targetX += steer * dt * 15 * currentChar.steer;
      }
      state.targetX = Math.max(-HALF_X, Math.min(HALF_X, state.targetX));
    }
    var dx = state.targetX - player.position.x;
    player.position.x += dx * Math.min(dt*10*currentChar.steer, 1);
    player.rotation.z = -dx * 0.09;
    player.rotation.y = -dx * 0.07;
    if (player.userData.tail) player.userData.tail.rotation.z = Math.sin(now*0.006)*0.5;

    /* トレイル（パレード用） */
    for (var ti=trailX.length-1; ti>0; ti--) trailX[ti] = trailX[ti-1];
    trailX[0] = player.position.x;

    /* 無敵／にじいろ */
    if (state.invincible > 0){
      state.invincible -= dt;
      player.visible = (((now/90)|0) % 2 === 0);
      if (state.invincible <= 0) player.visible = true;
    }
    if (state.rainbow > 0){
      state.rainbow -= dt;
      var rc = RAINBOW_HEX[((now/110)|0) % RAINBOW_HEX.length];
      player.userData.neonMesh.material.color.setHex(rc);
      player.userData.bodyMat.color.setHex(rc);
      playerGlow.color.setHex(rc);
      el.rainbowMsg.style.opacity = 1;
      if (Math.random() < 0.6) burst(player.position.x, 0.8, player.position.z + 2.4, 1, -1, 2.2, 3);
      if (state.rainbow <= 0){
        player.userData.neonMesh.material.color.setHex(player.userData.baseNeon);
        player.userData.bodyMat.color.setHex(player.userData.baseBody);
        playerGlow.color.setHex(0x39d8ff);
        el.rainbowMsg.style.opacity = 0;
      }
    }

    /* スクロール */
    for (var si=0; si<roadSegs.length; si++){
      var seg = roadSegs[si];
      seg.position.z += worldSpeed;
      if (seg.position.z > SEG_LEN) seg.position.z -= ROAD_SPAN;
    }
    for (var di=0; di<decoItems.length; di++){
      var d = decoItems[di];
      d.obj.position.z += worldSpeed;
      if (d.obj.position.z > 42) d.obj.position.z -= ROAD_SPAN;
      if (d.spin && d.obj.userData.wheel) d.obj.userData.wheel.rotation.z += d.spin*dt;
      if (d.bob) d.obj.position.y = d.baseY + Math.sin(now*0.0011 + d.ph)*d.bob*3.2;
    }

    /* スピードライン */
    var sp = speedLines.geometry.attributes.position;
    for (var pi=0; pi<sp.count; pi++){
      var z = sp.getZ(pi) + worldSpeed*2.3;
      if (z > 10) z = -230;
      sp.setZ(pi, z);
    }
    sp.needsUpdate = true;
    speedLines.material.opacity = Math.min(0.75, 0.16 + state.speed*0.38);

    /* 天気（ゆき・あめ・はなびら・ほしぞら） */
    updatePrecip(dt, worldSpeed, now);
    if (state.weather === 'hoshi'){
      skyStars.material.opacity = 0.72 + Math.sin(now*0.0016)*0.24;
    }

    /* 花火 */
    if (c.deco === 'fest' || c.deco === 'rainbow'){
      fwTimer -= dt;
      if (fwTimer <= 0){ launchFirework(); fwTimer = 0.8 + Math.random()*1.3; }
    }
    updateFireworks(dt);

    /* ---- ゴール判定 ---- */
    var remain = c.dist - state.distance;
    if (state.phase === 'run'){
      if (remain < 260 && !goalGate.visible){
        goalGate.visible = true;
        goalGate.position.z = -remain;
      }
      if (goalGate.visible) goalGate.position.z += worldSpeed;
      if (goalGate.visible && goalGate.position.z > 1.5){
        finishCourse();
      }
      var prog = Math.max(0, Math.min(1, state.distance / c.dist));
      el.progFill.style.width = (prog*100).toFixed(1) + '%';
      el.progCar.style.left   = (prog*100).toFixed(1) + '%';
    } else if (goalGate.visible){
      goalGate.position.z += worldSpeed;
    }

    /* ---- スポーン ---- */
    var nearGoal = (c.dist - state.distance) < 300;
    if (state.phase === 'run' && !nearGoal){
      state.spawnTimer -= dt;
      if (state.spawnTimer <= 0){
        spawnTraffic();
        state.spawnTimer = Math.max(0.5, (1.7 - state.speed*0.6) * c.trafficRate) * (0.72 + Math.random()*0.6);
      }
      state.starTimer -= dt;
      if (state.starTimer <= 0){ spawnStarRow(); state.starTimer = 2.2 + Math.random()*2.2; }
      state.orbTimer -= dt;
      if (state.orbTimer <= 0){ spawnOrb(); state.orbTimer = 20 + Math.random()*10; }
      state.heartTimer -= dt;
      if (state.heartTimer <= 0){
        if (state.hearts < 3) spawnHeart();
        state.heartTimer = 16 + Math.random()*8;
      }
      if (state.lostNext < state.lostPlan.length && state.distance >= state.lostPlan[state.lostNext]){
        spawnLost();
      }
    }

    var px = player.position.x, pz = player.position.z;

    /* ---- ほかの くるま ---- */
    for (var ci=0; ci<traffic.length; ci++){
      var car = traffic[ci];
      if (!car.userData.active) continue;
      car.position.z += worldSpeed - car.userData.speed*92*dt;
      car.position.x = car.userData.lane + Math.sin(now*0.0009 + car.userData.wob)*0.32;

      var zd = Math.abs(car.position.z - pz);
      var xd = Math.abs(car.position.x - px);
      if (state.phase === 'run' && zd < 4.0 && xd < 2.0){
        if (state.rainbow > 0){
          car.userData.active = false; car.visible = false;
          state.score += 300;
          burst(car.position.x, 1.2, car.position.z, 16, -1, 8, 9);
          showPraise('ドーン！'); sfxNear();
        } else if (state.invincible <= 0){
          state.hitCount++;
          if (state.hearts > 0) state.hearts--;
          updateHearts();
          sfxHit();
          state.shake = 0.85;
          state.combo = 0;
          state.speed *= 0.55;
          car.userData.active = false; car.visible = false;
          burst(car.position.x, 1.2, car.position.z, 10, 0xffc2c2, 5, 10);
          state.invincible = currentChar.tough ? 2.6 : 2.0;
          showPraise(state.hearts > 0 ? 'だいじょうぶ！' : 'ゆっくり いこう！');
        }
      } else if (state.phase === 'run' && !car.userData.nearMissed &&
                 car.position.z > pz + 2 && xd < 3.6){
        car.userData.nearMissed = true;
        state.combo++;
        state.comboTimer = 3.0;
        state.score += 100 * Math.min(state.combo, 8);
        showCombo(state.combo);
        sfxNear();
      }
      if (car.position.z > 28){ car.userData.active = false; car.visible = false; }
    }

    /* ---- ほし ---- */
    for (var sI=0; sI<stars.length; sI++){
      var st = stars[sI];
      if (!st.userData.active) continue;
      st.position.z += worldSpeed;
      st.userData.core.rotation.y += dt*3.2;
      st.position.y = 1.6 + Math.sin(now*0.004 + st.position.z*0.2)*0.28;
      st.lookAt(camera.position.x, st.position.y, camera.position.z);
      st.userData.core.rotation.y += 0;
      var zds = Math.abs(st.position.z - pz), xds = Math.abs(st.position.x - px);
      if (state.phase === 'run' && zds < 3.2 && xds < 2.1){
        st.userData.active = false; st.visible = false;
        state.starGot++; state.score += 50;
        el.starNum.textContent = state.starGot;
        burst(st.position.x, st.position.y, st.position.z, 7, 0xffe14d, 4.5, 8);
        sfxStar();
        if (state.rainbow <= 0){
          state.gauge = Math.min(GAUGE_MAX, state.gauge + 1);
          el.gaugeFill.style.width = (state.gauge/GAUGE_MAX*100) + '%';
          el.gaugeWrap.classList.toggle('full', state.gauge >= GAUGE_MAX);
          if (state.gauge >= GAUGE_MAX){
            state.gauge = 0;
            el.gaugeFill.style.width = '0%';
            el.gaugeWrap.classList.remove('full');
            state.rainbow = 6.5;
            state.score += 200;
            sfxRainbow(); showPraise('にじいろパワー！');
            burst(px, 1.4, pz, 30, -1, 8, 8);
          }
        }
        if (state.starGot % 8 === 0) showPraise(PRAISES[(Math.random()*PRAISES.length)|0]);
      }
      if (st.position.z > 22){ st.userData.active = false; st.visible = false; }
    }

    /* ---- にじたま ---- */
    for (var oI=0; oI<rainbowOrbs.length; oI++){
      var orb = rainbowOrbs[oI];
      if (!orb.userData.active) continue;
      orb.position.z += worldSpeed;
      orb.rotation.y += dt*3.6; orb.rotation.x += dt*1.8;
      orb.position.y = 1.7 + Math.sin(now*0.005)*0.4;
      orb.material.color.setHex(RAINBOW_HEX[((now/100)|0) % RAINBOW_HEX.length]);
      var zdo = Math.abs(orb.position.z - pz), xdo = Math.abs(orb.position.x - px);
      if (state.phase === 'run' && zdo < 3.5 && xdo < 2.3){
        orb.userData.active = false; orb.visible = false;
        state.rainbow = 6.5; state.score += 200;
        burst(orb.position.x, orb.position.y, orb.position.z, 26, -1, 8, 8);
        sfxRainbow(); showPraise('にじいろパワー！');
      }
      if (orb.position.z > 22){ orb.userData.active = false; orb.visible = false; }
    }

    /* ---- ハート ---- */
    for (var hI=0; hI<heartItems.length; hI++){
      var ht = heartItems[hI];
      if (!ht.userData.active) continue;
      ht.position.z += worldSpeed;
      ht.rotation.y += dt*2.4;
      ht.position.y = 1.7 + Math.sin(now*0.006)*0.3;
      var zdh = Math.abs(ht.position.z - pz), xdh = Math.abs(ht.position.x - px);
      if (state.phase === 'run' && zdh < 3.4 && xdh < 2.2){
        ht.userData.active = false; ht.visible = false;
        if (state.hearts < 3) state.hearts++;
        updateHearts(); sfxHeart();
        burst(ht.position.x, ht.position.y, ht.position.z, 12, 0xff8fc8, 5, 8);
        showPraise('げんき かいふく！');
      }
      if (ht.position.z > 22){ ht.userData.active = false; ht.visible = false; }
    }

    /* ---- まいごの どうぶつ ---- */
    for (var lI=0; lI<lostSlots.length; lI++){
      var lost = lostSlots[lI];
      if (!lost.userData.active) continue;
      lost.position.z += worldSpeed;
      lost.userData.ring.rotation.z += dt*1.6;
      lost.position.y = Math.sin(now*0.0035)*0.16;
      var zdl = Math.abs(lost.position.z - pz), xdl = Math.abs(lost.position.x - px);
      if (state.phase === 'run' && zdl < 4.0 && xdl < 2.6){
        lost.userData.active = false; lost.visible = false;
        var fdef = lost.userData.fdef;
        save.friends[fdef.id] = 1; persist();
        var slotP = paradeSlots[state.friendGot];
        if (slotP){ setAnimalIn(slotP, fdef, 0.62); slotP.visible = true; }
        state.friendGot++;
        state.score += 500;
        el.friendNum.textContent = state.friendGot + ' / 3';
        burst(lost.position.x, 1.4, lost.position.z, 24, -1, 7, 8);
        sfxFriend();
        showPraise(fdef.name + 'を たすけた！');
      }
      if (lost.position.z > 24){ lost.userData.active = false; lost.visible = false; }
    }

    /* ---- パレード ---- */
    for (var pI=0; pI<paradeSlots.length; pI++){
      var ps = paradeSlots[pI];
      if (!ps.visible) continue;
      /* カメラ(z=10.4)より手前に入らないよう 間隔をつめ、左右にずらして 3ひきとも見えるように */
      var lag = (pI+1)*16;
      var offX = (pI === 0) ? -1.7 : (pI === 1 ? 1.7 : 0);
      ps.position.x = trailX[Math.min(trailX.length-1, lag)] + offX;
      ps.position.z = pz + 3.9 + pI*2.1;
      ps.position.y = 0.15 + Math.abs(Math.sin(now*0.011 + pI*1.7))*0.4;
      ps.rotation.y = Math.PI + Math.sin(now*0.004 + pI)*0.2;
    }

    /* ---- コンボ ---- */
    if (state.comboTimer > 0){
      state.comboTimer -= dt;
      if (state.comboTimer <= 0){ state.combo = 0; el.combo.classList.remove('pop'); }
    }

    /* ---- ガイド ---- */
    if (state.guideT > 0){
      state.guideT -= dt;
      if (state.guideT <= 0) el.guide.style.display = 'none';
    }

    if (state.phase === 'run') state.score += Math.round(worldSpeed*1.1);
    el.speedNum.textContent = Math.round(58 + state.speed*152);

    if (engineOsc && audioCtx && engineGain){
      engineOsc.frequency.value = 50 + state.speed*92 + Math.sin(now*0.02)*3;
      engineGain.gain.value = sfxMuted ? 0 : (0.04 + state.speed*0.018);
    }

    /* アイテムライト */
    itemGlow.intensity = state.rainbow > 0 ? 1.1 : 0.0;
    if (state.rainbow > 0) itemGlow.position.set(px, 2.2, pz);
  }

  updateParticles(dt, worldSpeed);

  /* ---- カメラ ---- */
  var camX = player.position.x * 0.5;
  camera.position.x += (camX - camera.position.x) * Math.min(dt*5.5, 1);
  camera.position.y = 4.9;
  camera.position.z = 10.4;
  var wantFov = 68 + state.speed*17 + (state.rainbow > 0 ? 4 : 0);
  camera.fov += (wantFov - camera.fov) * Math.min(dt*3, 1);
  camera.updateProjectionMatrix();
  if (state.shake > 0){
    state.shake = Math.max(0, state.shake - dt*2.4);
    camera.position.x += (Math.random()-0.5)*state.shake;
    camera.position.y += (Math.random()-0.5)*state.shake;
  }
  camera.lookAt(player.position.x*0.5, 1.7, -32);
  playerGlow.position.set(player.position.x, 1.6, player.position.z);
  skyDome.position.set(camera.position.x, 0, camera.position.z);
  skyStars.position.set(camera.position.x, 0, camera.position.z);
  celestial.lookAt(camera.position);
  celestialHalo.lookAt(camera.position);

  renderer.render(scene, camera);
}

/* ---------- 起動 ---------- */
state.time = TIMES[pickOne(COURSES[0].times)];
state.weather = 'hare';
buildWorld(COURSES[0], state.time, state.weather);
setWeather('hare');
renderCourses();
showScreen(el.title);
requestAnimationFrame(loop);

})();

</script>
</body>
