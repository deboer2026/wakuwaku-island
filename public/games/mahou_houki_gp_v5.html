<!DOCTYPE html>
<html lang="ja">
<head>
<script src="/games/wakuwaku_ui.js"></script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>まほうほうきGP</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DotGothic16&display=swap" rel="stylesheet">
<script src="/games/safe_area.js"></script>
<style>
  :root{ --sat:env(safe-area-inset-top,0px); --sab:env(safe-area-inset-bottom,0px);
         --sal:env(safe-area-inset-left,0px); --sar:env(safe-area-inset-right,0px); }
  *{ margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body{ width:100%; height:100%; overflow:hidden; background:#0a1230;
    font-family:'DotGothic16',sans-serif; user-select:none; -webkit-user-select:none; touch-action:none; }
  #wrap{ position:fixed; inset:0; display:flex; align-items:center; justify-content:center;
    background:radial-gradient(circle at 50% 25%, #16265a, #060a1c); }
  canvas{ display:block; touch-action:none; box-shadow:0 0 0 3px #ffffff22,0 12px 50px #000a; border-radius:8px; }
  .ui-btn{ position:fixed; z-index:9999; width:46px; height:46px; border:none; border-radius:13px;
    font-size:23px; cursor:pointer; touch-action:manipulation; background:linear-gradient(#fff,#e8ecff);
    color:#333; box-shadow:0 4px 0 #00000044,inset 0 2px 0 #fff; font-family:inherit;
    display:flex; align-items:center; justify-content:center; }
  .ui-btn:active{ transform:translateY(3px); box-shadow:0 1px 0 #00000044; }
  #homeBtn{ top:calc(var(--sat) + 10px); left:calc(var(--sal) + 10px); }
  #bgmBtn{ top:calc(var(--sat) + 10px); right:calc(var(--sar) + 10px); }
  #bgmBtn.off{ background:#9a93b5; color:#574f73; }
  #rot{ position:fixed; top:calc(var(--sat)+64px); left:50%; transform:translateX(-50%);
    z-index:99990; background:rgba(10,18,45,0.85); color:#fff; pointer-events:none;
    display:none; align-items:center; gap:8px; font-size:14px; text-align:center;
    padding:6px 14px; border-radius:999px; border:1px solid #ffffff55; }
  #rot .ic{ font-size:18px; }
  #err{ position:fixed; left:8px; right:8px; top:64px; z-index:100000; display:none;
    background:#3a0d0d; color:#ffd2d2; font:13px/1.4 monospace; padding:10px 12px;
    border-radius:8px; white-space:pre-wrap; border:1px solid #ff6b6b; }
</style>
</head>
<body>
<div id="wrap"><canvas id="cv"></canvas></div>
<button id="homeBtn" class="ui-btn" aria-label="ホーム">🏠</button>
<button id="bgmBtn" class="ui-btn" aria-label="BGM">🔊</button>
<div id="rot"><span class="ic">📱</span><span>よこむきにすると大きく遊べるよ</span></div>
<div id="err"></div>

<script>
const SAFE_LS = (function () {
  try {
    const testKey = '__ww_storage_test__';
    localStorage.setItem(testKey, testKey);
    localStorage.removeItem(testKey);
    return localStorage;
  } catch (e) {
    const memory = {};
    return {
      getItem(key) {
        return Object.prototype.hasOwnProperty.call(memory, key) ? memory[key] : null;
      },
      setItem(key, value) {
        memory[key] = String(value);
      },
      removeItem(key) {
        delete memory[key];
      }
    };
  }
})();
(function(){
  "use strict";
  function fatal(msg){ const d=document.getElementById('err'); if(d){ d.style.display='block'; d.textContent='⚠ '+msg; } }
  window.addEventListener('error',e=>fatal((e.message||'error')+'  @line '+(e.lineno||'?')));
  window.addEventListener('unhandledrejection',e=>fatal('promise: '+(e.reason&&e.reason.message||e.reason)));
try{
  const LW=800, LH=480, cx=LW/2;
  const horizon=Math.round(LH*0.42);
  const focal=340, camY=1.2;
  const cv=document.getElementById('cv'), ctx=cv.getContext('2d');
  let scale=1, dpr=Math.min(window.devicePixelRatio||1,2);

  const BUFW=256, BUFH=150;
  const gcv=document.createElement('canvas'); gcv.width=BUFW; gcv.height=BUFH;
  const gctx=gcv.getContext('2d'); const gimg=gctx.createImageData(BUFW,BUFH); const gdat=gimg.data;

  function viewport(){
    const w=document.getElementById('wrap');
    let aw=window.innerWidth||0, ah=window.innerHeight||0;
    if(w){ aw=Math.max(aw, w.clientWidth||0); ah=Math.max(ah, w.clientHeight||0); }
    if(!aw||!ah){ aw=aw||800; ah=ah||480; }
    return [aw,ah];
  }
  function resize(){
    const [aw,ah]=viewport();
    document.getElementById('rot').style.display = (ah>aw*1.02)?'flex':'none';
    scale=Math.min(aw/LW, ah/LH);
    cv.style.width=(LW*scale)+'px'; cv.style.height=(LH*scale)+'px';
    cv.width=Math.max(1,Math.round(LW*scale*dpr)); cv.height=Math.max(1,Math.round(LH*scale*dpr));
    ctx.setTransform(scale*dpr,0,0,scale*dpr,0,0);
  }

  /* ============ AUDIO ============ */
  let actx=null,master=null,bgmOn=true,bgmTimer=null,step=0;
  function initAudio(){ if(actx)return; try{ actx=new(window.AudioContext||window.webkitAudioContext)();
    master=actx.createGain(); master.gain.value=0.5; master.connect(actx.destination);}catch(e){} }
  function blip(f,d,t,v){ if(!actx)return; const o=actx.createOscillator(),g=actx.createGain();
    o.type=t||'square'; o.frequency.value=f; g.gain.value=0;
    g.gain.linearRampToValueAtTime(v||0.2,actx.currentTime+0.01);
    g.gain.exponentialRampToValueAtTime(0.0001,actx.currentTime+d);
    o.connect(g); g.connect(master); o.start(); o.stop(actx.currentTime+d); }
  const sfx={
    ring:()=>{blip(700,0.08,'triangle',0.22);setTimeout(()=>blip(1050,0.12,'triangle',0.22),60);},
    gold:()=>[784,988,1175,1568].forEach((f,i)=>setTimeout(()=>blip(f,0.1,'triangle',0.22),i*55)),
    star:()=>{blip(1320,0.09,'sine',0.18);setTimeout(()=>blip(1760,0.12,'sine',0.16),50);},
    hit:()=>{blip(160,0.22,'sawtooth',0.22);},
    sel:()=>{blip(880,0.08,'square',0.14);},
    win:()=>[523,659,784,1046].forEach((f,i)=>setTimeout(()=>blip(f,0.18,'triangle',0.25),i*120)),
    fanfare:()=>[523,659,784,1046,784,1046,1318].forEach((f,i)=>setTimeout(()=>blip(f,0.2,'triangle',0.24),i*130)),
    end:()=>{blip(330,0.2,'sawtooth',0.2);setTimeout(()=>blip(196,0.3,'sawtooth',0.2),140);} };
  const MELS=[
    {mel:[659,784,880,659,587,523,587,659], bass:[165,165,196,196,131,131,147,147]},
    {mel:[587,698,784,880,784,698,587,523], bass:[147,147,175,175,131,131,117,117]},
    {mel:[523,622,698,831,698,622,523,466], bass:[131,131,156,156,104,104,117,117]} ];
  let melIdx=0;
  function tick(){ if(!actx||!bgmOn)return; const m=MELS[melIdx];
    blip(m.mel[step%8],0.26,'triangle',0.09); blip(m.bass[step%8],0.28,'sine',0.10); step++; }
  function startBgm(){ if(!bgmTimer) bgmTimer=setInterval(tick,250); }
  function stopBgm(){ if(bgmTimer){clearInterval(bgmTimer);bgmTimer=null;} }
  const bgmBtn=document.getElementById('bgmBtn');
  bgmBtn.addEventListener('click',()=>{ bgmOn=!bgmOn; bgmBtn.classList.toggle('off',!bgmOn);
    bgmBtn.textContent=bgmOn?'🔊':'🔇'; if(bgmOn){initAudio();startBgm();}else stopBgm(); });
  document.getElementById('homeBtn').addEventListener('click',()=>{ try{window.parent.postMessage({type:'goHome'},'*');}catch(e){} });

  /* safe-area の反映は共通スクリプト /games/safe_area.js が担う（--sat/--sab/--sal/--sar） */

  /* ============ DATA ============ */
  const CHARS=[
    {name:'うさひめ',  body:'#ffffff', dress:'#ff6fae', ear:'rabbit',  spd:1.00, turn:1.00, desc:'バランスがた'},
    {name:'ねこまじょ',body:'#5a5a78', dress:'#8a5cf0', ear:'cat',     spd:1.07, turn:0.94, desc:'スピードがた'},
    {name:'くまおうじ',body:'#c98a4b', dress:'#4a7cf0', ear:'bear',    spd:0.94, turn:1.10, desc:'まがりやすい'},
    {name:'ぺんぺん',  body:'#4a5a78', dress:'#3fcf9a', ear:'penguin', spd:1.02, turn:1.03, desc:'カーブとくい'} ];
  const STAGES=[
    {name:'そらの くさはら', icon:'sun', pattern:'slalom', rings:12, spdMul:1.00,
     sky:['#4b86ff','#8fc0ff','#cfe8ff'], night:false, sun:'#fff3b0',
     g1:[106,211,106], g2:[79,184,79], flower:[255,224,120], fog:[190,225,255], deco:'tree'},
    {name:'ゆうやけ ビーチ', icon:'sunset', pattern:'spiral', rings:14, spdMul:1.06,
     sky:['#ff8a4b','#ffb87a','#ffe4bc'], night:false, sun:'#fff0a0',
     g1:[97,200,222], g2:[68,172,200], flower:[255,255,255], fog:[255,210,170], deco:'palm'},
    {name:'ほしぞらの よる', icon:'moon', pattern:'zigzag', rings:16, spdMul:1.12,
     sky:['#141a4d','#2a2f6e','#4a4f96'], night:true, sun:'#f4f0d8',
     g1:[118,98,188], g2:[92,76,158], flower:[190,240,255], fog:[56,56,105], deco:'crystal'} ];
  const cfg={ easy:{spd:6, turn:1.25, time:32, add:2.6, R:1.6},
              hard:{spd:9, turn:1.45, time:24, add:2.0, R:1.25} };

  /* ============ STATE ============ */
  let state='title', diff='easy', charIdx=0, stageIdx=0;
  let camX=0,camZ=0,head=0,bank=0, rings=[], stars=[], clouds=[], decos=[];
  let timeLeft=30,score=0,totalScore=0,got=0,total=12, boost=0, shake=0, hitFlash=0;
  let stageStars=[0,0,0], resultStars=0, resultBonus=0, resultT=0;
  let keyL=false,keyR=false, ptr=null, tAnim=0;
  const parts=[];
  let bestScore=0; try{ bestScore=parseInt(SAFE_LS.getItem('houki_best_v5')||'0',10)||0; }catch(e){}

  function courseX(pat,z){
    if(pat==='slalom') return 7*Math.sin(z*0.05)+2.5*Math.sin(z*0.13);
    if(pat==='spiral') return 10*Math.sin(z*0.032)+1.5*Math.sin(z*0.09);
    const p=(z%64)/64; const tri=p<0.5?p*2:2-p*2; return (tri*2-1)*8.5;
  }
  function buildCourse(){
    const st=STAGES[stageIdx]; rings=[]; stars=[]; clouds=[]; decos=[];
    total=st.rings; let z=9;
    for(let i=0;i<total;i++){
      const x=courseX(st.pattern,z);
      rings.push({x,z,hue:(i*40)%360,got:false,gold:((i+1)%5===0)});
      if(i<total-1){
        const nz=z+7+(i%3);
        const mz=(z+nz)/2, mx=courseX(st.pattern,mz);
        if(i%2===0) stars.push({x:mx+(i%4===0?1.6:-1.6), z:mz, got:false});
        if(diff==='hard' && i%4===2) clouds.push({x:mx+(i%8<4?2.6:-2.6), z:mz, hit:false});
        z=nz;
      } else z+=8;
    }
    for(let i=0;i<26;i++){ const dz=6+i*4.5+((i*7)%3);
      const side=(i%2?1:-1)*(6.5+((i*13)%40)/10);
      decos.push({x:courseX(st.pattern,dz)+side, z:dz, v:((i*31)%3)}); }
  }
  function startStage(){
    const c=cfg[diff];
    camX=0;camZ=0;head=0;bank=0;boost=0;shake=0;hitFlash=0;
    buildCourse(); timeLeft=c.time; score=0; got=0;
    melIdx=stageIdx%MELS.length;
    state='play'; initAudio(); if(bgmOn) startBgm();
  }
  function startGame(d){ diff=d; stageIdx=0; totalScore=0; stageStars=[0,0,0]; startStage(); }
  function spawn(hue,n,gold){ const cnt=n||14;
    for(let i=0;i<cnt;i++) parts.push({x:cx+(Math.random()-0.5)*40,y:LH*0.5,
      vx:(Math.random()-0.5)*(gold?360:260),vy:(Math.random()-0.8)*(gold?340:260),life:gold?0.9:0.6,hue}); }

  /* ============ INPUT ============ */
  function lx(cX){ const r=cv.getBoundingClientRect(); return (cX-r.left)/(scale||1); }
  function ly(cY){ const r=cv.getBoundingClientRect(); return (cY-r.top)/(scale||1); }
  function inBox(X,Y,b){ return X>=b[0]&&X<=b[0]+b[2]&&Y>=b[1]&&Y<=b[1]+b[3]; }
  const selBoxes=[[38,150,168,190],[224,150,168,190],[410,150,168,190],[596,150,168,190]];
  const diffBoxes={easy:[200,392,180,60], hard:[420,392,180,60]};
  const endBoxes={retry:[200,320,180,62], title:[420,320,180,62]};
  function down(e){ initAudio(); const t=e.touches?e.touches[0]:e; const X=lx(t.clientX), Y=ly(t.clientY);
    if(state==='title'){ state='select'; sfx.sel(); e.preventDefault(); return; }
    if(state==='select'){
      for(let i=0;i<4;i++) if(inBox(X,Y,selBoxes[i])){ charIdx=i; sfx.sel(); }
      if(inBox(X,Y,diffBoxes.easy)) startGame('easy');
      else if(inBox(X,Y,diffBoxes.hard)) startGame('hard');
      e.preventDefault(); return; }
    if(state==='result'){ stageIdx++;
      if(stageIdx>=STAGES.length) state='final'; else startStage();
      sfx.sel(); e.preventDefault(); return; }
    if(state==='end'){
      if(inBox(X,Y,endBoxes.retry)){ startStage(); }
      else if(inBox(X,Y,endBoxes.title)){ state='title'; stopBgm(); }
      e.preventDefault(); return; }
    if(state==='final'){ state='title'; e.preventDefault(); return; }
    ptr=X; e.preventDefault(); }
  function move(e){ if(ptr===null)return; const t=e.touches?e.touches[0]:e; ptr=lx(t.clientX); e.preventDefault(); }
  function up(){ ptr=null; }
  cv.addEventListener('mousedown',down); cv.addEventListener('mousemove',(e)=>{if(e.buttons)move(e);}); window.addEventListener('mouseup',up);
  cv.addEventListener('touchstart',down,{passive:false}); cv.addEventListener('touchmove',move,{passive:false}); cv.addEventListener('touchend',up);
  window.addEventListener('keydown',e=>{ if(e.key==='ArrowLeft')keyL=true; if(e.key==='ArrowRight')keyR=true; });
  window.addEventListener('keyup',e=>{ if(e.key==='ArrowLeft')keyL=false; if(e.key==='ArrowRight')keyR=false; });

  /* ============ UPDATE ============ */
  let turnIn=0;
  function finishStage(){
    resultStars = timeLeft>=8?3 : timeLeft>=4?2 : 1;
    resultBonus = Math.round(timeLeft*20);
    score += resultBonus;
    stageStars[stageIdx]=resultStars;
    totalScore += score;
    if(stageIdx===STAGES.length-1){
      if(totalScore>bestScore){ bestScore=totalScore; try{SAFE_LS.setItem('houki_best_v5',''+bestScore);}catch(e){} } }
    resultT=0; state='result'; stopBgm(); sfx.win();
  }
  function update(dt){ if(state!=='play')return;
    const c=cfg[diff], ch0=CHARS[charIdx], st=STAGES[stageIdx];
    let ti=0; if(keyL)ti-=1; if(keyR)ti+=1;
    if(ptr!==null) ti=Math.max(-1,Math.min(1,(ptr-cx)/(LW*0.32)));
    turnIn+=(ti-turnIn)*Math.min(1,dt*10);
    head+=turnIn*c.turn*ch0.turn*dt;
    bank+=(-turnIn*0.5-bank)*Math.min(1,dt*8);
    if(boost>0) boost-=dt;
    const spd=c.spd*ch0.spd*st.spdMul*(boost>0?1.55:1);
    camX+=Math.sin(head)*spd*dt; camZ+=Math.cos(head)*spd*dt;
    timeLeft-=dt; if(timeLeft<=0){ timeLeft=0; state='end'; stopBgm(); sfx.end(); return; }
    if(shake>0) shake-=dt*3; if(hitFlash>0) hitFlash-=dt*2;
    const sh=Math.sin(head), chh=Math.cos(head);
    for(const r of rings){ if(r.got)continue; const dx=r.x-camX, dz=r.z-camZ;
      const rz=dx*sh+dz*chh, rx=dx*chh-dz*sh;
      if(rz>0&&rz<1.6&&Math.abs(rx)<c.R+0.4){ r.got=true; got++;
        if(r.gold){ score+=300; timeLeft+=c.add*2; boost=1.1; sfx.gold(); spawn(48,22,true); }
        else{ score+=100; timeLeft+=c.add; sfx.ring(); spawn(r.hue); } } }
    for(const s of stars){ if(s.got)continue; const dx=s.x-camX, dz=s.z-camZ;
      const rz=dx*sh+dz*chh, rx=dx*chh-dz*sh;
      if(rz>0&&rz<1.5&&Math.abs(rx)<1.2){ s.got=true; score+=50; sfx.star(); spawn(52,8); } }
    for(const cl of clouds){ if(cl.hit)continue; const dx=cl.x-camX, dz=cl.z-camZ;
      const rz=dx*sh+dz*chh, rx=dx*chh-dz*sh;
      if(rz>0&&rz<1.5&&Math.abs(rx)<1.3){ cl.hit=true; timeLeft=Math.max(0.5,timeLeft-2); shake=1; hitFlash=1; sfx.hit(); } }
    if(got>=total){ finishStage(); return; }
    for(let i=parts.length-1;i>=0;i--){ const p=parts[i]; p.x+=p.vx*dt; p.y+=p.vy*dt; p.vy+=300*dt; p.life-=dt; if(p.life<=0)parts.splice(i,1); } }

  /* ============ DRAW: WORLD ============ */
  function drawGround(){ const st=STAGES[stageIdx]; try{
    const sh=Math.sin(head), chh=Math.cos(head);
    const rowH=(LH-horizon)/BUFH, colW=LW/BUFW; let o=0;
    const A=st.g1, B=st.g2, F=st.fog, FL=st.flower;
    for(let j=0;j<BUFH;j++){ const sy=horizon+(j+0.5)*rowH; const denom=sy-horizon; const rz=camY*focal/denom;
      const fog=Math.min(1, rz/55);
      for(let i=0;i<BUFW;i++){ const sx=(i+0.5)*colW; const rx=(sx-cx)*rz/focal;
        const wx=camX+rx*chh+rz*sh, wz=camZ-rx*sh+rz*chh;
        const cell=((Math.floor(wx)+Math.floor(wz))&1); let R,G,Bc;
        if(cell){R=A[0];G=A[1];Bc=A[2];}else{R=B[0];G=B[1];Bc=B[2];}
        const fx=wx-Math.floor(wx)-0.5, fz=wz-Math.floor(wz)-0.5;
        if(fx*fx+fz*fz<0.02 && ((Math.floor(wx)*7+Math.floor(wz)*13)&3)===0){R=FL[0];G=FL[1];Bc=FL[2];}
        R+=(F[0]-R)*fog; G+=(F[1]-G)*fog; Bc+=(F[2]-Bc)*fog;
        gdat[o++]=R; gdat[o++]=G; gdat[o++]=Bc; gdat[o++]=255; } }
    gctx.putImageData(gimg,0,0);
    ctx.imageSmoothingEnabled=false; ctx.drawImage(gcv,0,0,BUFW,BUFH,0,horizon,LW,LH-horizon); ctx.imageSmoothingEnabled=true;
  }catch(e){ const g=ctx.createLinearGradient(0,horizon,0,LH);
    g.addColorStop(0,'rgb('+st.g1.join(',')+')'); g.addColorStop(1,'rgb('+st.g2.join(',')+')');
    ctx.fillStyle=g; ctx.fillRect(0,horizon,LW,LH-horizon); } }
  function cloudShape(x,y,r){ ctx.beginPath(); ctx.arc(x,y,r,0,7); ctx.arc(x+r,y+6,r*0.8,0,7); ctx.arc(x-r*0.9,y+8,r*0.7,0,7); ctx.fill(); }
  function drawStarIcon(x,y,r,color,alpha){ ctx.save();ctx.translate(x,y);ctx.globalAlpha=alpha===undefined?1:alpha;ctx.fillStyle=color;ctx.beginPath();
    for(let i=0;i<10;i++){const a=-Math.PI/2+i*Math.PI/5,rr=i%2===0?r:r*.45,px=Math.cos(a)*rr,py=Math.sin(a)*rr;if(i===0)ctx.moveTo(px,py);else ctx.lineTo(px,py);}ctx.closePath();ctx.fill();ctx.restore(); }
  function drawSparkle(x,y,r,color){ ctx.save();ctx.translate(x,y);ctx.fillStyle=color;ctx.beginPath();ctx.moveTo(0,-r);ctx.lineTo(r*.25,-r*.25);ctx.lineTo(r,0);ctx.lineTo(r*.25,r*.25);ctx.lineTo(0,r);ctx.lineTo(-r*.25,r*.25);ctx.lineTo(-r,0);ctx.lineTo(-r*.25,-r*.25);ctx.closePath();ctx.fill();ctx.restore(); }
  function drawRingIcon(x,y,r){ ctx.save();ctx.strokeStyle='#ffe06b';ctx.lineWidth=Math.max(2,r*.28);ctx.beginPath();ctx.ellipse(x,y,r,r*.82,0,0,7);ctx.stroke();ctx.strokeStyle='#fff2a0';ctx.lineWidth=Math.max(1,r*.09);ctx.beginPath();ctx.ellipse(x,y-r*.08,r,r*.82,0,0,7);ctx.stroke();ctx.restore(); }
  function drawArrowIcon(x,y,r,dir){ ctx.save();ctx.translate(x,y);ctx.scale(dir,1);ctx.fillStyle='#fff';ctx.beginPath();ctx.moveTo(-r,0);ctx.lineTo(r*.45,-r*.72);ctx.lineTo(r*.45,r*.72);ctx.closePath();ctx.fill();ctx.restore(); }
  function drawStageIcon(icon,x,y,r){ ctx.save();ctx.translate(x,y);
    if(icon==='sun'){ctx.fillStyle='#FFD54F';ctx.beginPath();ctx.arc(0,0,r*.55,0,7);ctx.fill();ctx.strokeStyle='#FFD54F';ctx.lineWidth=Math.max(1.5,r*.13);for(let i=0;i<8;i++){const a=i*Math.PI/4;ctx.beginPath();ctx.moveTo(Math.cos(a)*r*.72,Math.sin(a)*r*.72);ctx.lineTo(Math.cos(a)*r,Math.sin(a)*r);ctx.stroke();}}
    else if(icon==='sunset'){ctx.fillStyle='#FF8A65';ctx.beginPath();ctx.arc(0,r*.18,r*.62,Math.PI,0);ctx.fill();ctx.strokeStyle='#FFE0B2';ctx.lineWidth=Math.max(1.5,r*.12);ctx.beginPath();ctx.moveTo(-r,r*.2);ctx.lineTo(r,r*.2);ctx.moveTo(-r*.75,r*.5);ctx.lineTo(r*.75,r*.5);ctx.stroke();}

    textC('のこりタイム ボーナス +'+resultBonus,268,24,'#8fe',1);
    textC('スコア '+score,308,30,'#fff',1);
    const nx=(stageIdx+1<STAGES.length)?('つぎは '+STAGES[stageIdx+1].name+'！'):'けっかはっぴょうへ！';
    const p2=0.6+0.4*Math.abs(Math.sin(tAnim*3));
    ctx.globalAlpha=p2; textC('タップで '+nx,380,24,'#ffe',1); ctx.globalAlpha=1; }

  function drawEnd(){
    ctx.fillStyle='rgba(8,12,30,0.65)'; ctx.fillRect(0,0,LW,LH);
    textC('じかんぎれ！',150,50,'#ff9d9d',1);
    textC('リング '+got+'/'+total+'   スコア '+score,225,26,'#fff',1);
    btn(endBoxes.retry,'もういちど','#3fcf7a');
    btn(endBoxes.title,'タイトルへ','#7a8acf'); }

  function drawFinal(){
    const g=ctx.createLinearGradient(0,0,0,LH);
    g.addColorStop(0,'#2a2f6e'); g.addColorStop(1,'#5a4ad0');
    ctx.fillStyle=g; ctx.fillRect(0,0,LW,LH);
    for(let i=0;i<24;i++){ const t2=(tAnim*90+i*61)%(LH+40);
      ctx.fillStyle='hsl('+((i*47)%360)+',85%,65%)';
      ctx.fillRect((i*127)%LW, t2-20, 6,6); }
    const ts=stageStars[0]+stageStars[1]+stageStars[2];
    const title = ts>=9?'スーパーチャンピオン！' : ts>=7?'チャンピオン！' : 'ナイスフライト！';
    textC('けっかはっぴょう',82,36,'#ffe06b',1);
    if(ts>=9)drawTrophy(cx,119,24);else drawSparkle(cx,116,18,'#ffe06b');textC(title,150,42,'#fff',1);
    for(let i=0;i<3;i++){ const st=STAGES[i];
      const y=218+i*46;
      ctx.font='24px DotGothic16'; ctx.textAlign='left'; ctx.textBaseline='middle';
      drawStageIcon(st.icon,160,y,12);ctx.fillStyle='#fff'; ctx.fillText(st.name, 190, y);
      for(let j=0;j<3;j++)drawStarIcon(535+j*34,y,12,j<stageStars[i]?'#ffd24d':'rgba(255,255,255,.25)'); }
    textC('トータルスコア '+totalScore,376,30,'#8fe',1);
    if(totalScore>=bestScore&&bestScore>0){drawSparkle(cx-120,414,10,'#ffd24d');drawSparkle(cx+120,414,10,'#ffd24d');textC('ベストこうしん！',414,22,'#ffd24d',1);}
    else if(bestScore>0) textC('ベスト '+bestScore,414,20,'#cde',0);
    const p2=0.6+0.4*Math.abs(Math.sin(tAnim*3));
    ctx.globalAlpha=p2; textC('タップで タイトルへ',450,20,'#ffe',1); ctx.globalAlpha=1; }

  /* ============ LOOP ============ */
  let last=0, errShown=false;
  function loop(ts){ try{
    const dt=Math.min(0.033,(ts-last)/1000||0); last=ts; tAnim+=dt;
    if(state==='title'){ drawTitle(); }
    else if(state==='select'){ drawSelect(); }
    else if(state==='final'){ drawFinal(); }
    else { drawSky(); drawGround(); drawWorldObjects(); drawParts(); drawBroom(); hud();
      if(state==='play') update(dt);
      else if(state==='result'){ resultT+=dt; drawResult(); }
      else if(state==='end') drawEnd(); }
  }catch(e){ if(!errShown){ errShown=true; fatal('loop: '+e.message); } }
    requestAnimationFrame(loop); }

  function boot(){ resize(); requestAnimationFrame(loop); }
  window.addEventListener('resize',resize);
  try{ new ResizeObserver(resize).observe(document.getElementById('wrap')); }catch(e){}
  if(document.readyState==='complete') boot(); else window.addEventListener('load',boot);
  if(document.fonts&&document.fonts.ready) document.fonts.ready.then(resize);
}catch(e){ fatal('init: '+e.message); }
})();
</script>
</body>
</html>
