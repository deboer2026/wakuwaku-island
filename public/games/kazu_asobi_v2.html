<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>かずあそび</title>
<link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@400;700;800;900&display=swap" rel="stylesheet">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'M PLUS Rounded 1c', sans-serif; overflow: hidden; background: #0d0030; }
#game-wrap { width: 100vw; height: 100svh; max-width: 480px; margin: 0 auto; position: relative; overflow: hidden; }
canvas#bg { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }

/* HUD */
#hud {
  position: fixed; top: 0; left: 50%; transform: translateX(-50%);
  width: 100%; max-width: 480px; z-index: 100; box-sizing: border-box;
  padding: max(10px, env(safe-area-inset-top)) 12px 8px; display: none;
  background: linear-gradient(180deg, rgba(10,0,40,0.93) 0%, rgba(10,0,40,0.6) 70%, transparent);
}
.hud-nav { display: flex; justify-content: space-between; align-items: center; margin-bottom: 4px; }
#back-btn { background: rgba(0,0,0,0.55); color: white; border: 1.5px solid rgba(255,255,255,0.3); border-radius: 20px; padding: 5px 14px; font-size: 12px; font-weight: 700; cursor: pointer; font-family: inherit; }
#ui-bgm-btn { background: rgba(0,0,0,0.55); color: white; border: 1.5px solid rgba(255,255,255,0.3); border-radius: 50%; width: 32px; height: 32px; font-size: 16px; cursor: pointer; display: flex; align-items: center; justify-content: center; }
#status-bar { display: flex; justify-content: center; gap: 10px; pointer-events: none; }
.hud-chip { background: rgba(0,0,0,0.6); border: 1.5px solid rgba(255,215,0,0.35); border-radius: 12px; padding: 3px 12px; display: flex; align-items: center; gap: 6px; }
.hud-chip-label { font-size: 9px; color: rgba(255,255,255,0.5); font-weight: 700; }
.hud-chip-val { font-size: 16px; font-weight: 900; color: #FFD700; }
/* Timer chip special */
#timer-chip { border-color: rgba(255,120,50,0.5); }
#timer-chip .hud-chip-val { color: #FF8A65; transition: color .3s; }
#timer-chip.urgent .hud-chip-val { color: #FF1744; animation: timerPulse .5s ease-in-out infinite; }
@keyframes timerPulse { 0%,100%{transform:scale(1)} 50%{transform:scale(1.15)} }

.screen { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 20; padding: 0 20px; }

/* TITLE */
.title-frame {
  background: linear-gradient(145deg, rgba(30,0,70,0.97), rgba(15,0,45,0.99));
  border: 4px solid #FFD700; border-radius: 28px; padding: 22px 26px; text-align: center;
  width: 100%; max-width: 340px;
  box-shadow: 0 0 0 2px #8B6914, 0 0 40px rgba(255,215,0,0.15), 0 12px 40px rgba(0,0,0,0.7);
}
.title-num-row { display: flex; justify-content: center; gap: 7px; margin-bottom: 12px; }
.t-num {
  width: 44px; height: 44px; border-radius: 12px; display: flex; align-items: center; justify-content: center;
  font-size: 24px; font-weight: 900; color: white;
  box-shadow: 0 4px 0 rgba(0,0,0,0.4), 0 0 12px var(--glow,rgba(255,255,255,0.2));
  animation: numBounce var(--d,1.2s) ease-in-out infinite;
}
@keyframes numBounce { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-8px)} }
.title-label { font-size: 12px; font-weight: 900; color: rgba(255,215,0,0.65); letter-spacing: 4px; margin-bottom: 4px; }
.title-text {
  font-size: 38px; font-weight: 900;
  background: linear-gradient(180deg, #FFE566, #FF9800);
  -webkit-background-clip: text; -webkit-text-fill-color: transparent;
  filter: drop-shadow(2px 3px 0 rgba(0,0,0,0.5)); margin-bottom: 6px;
}
.title-sub { font-size: 13px; color: rgba(255,255,255,0.72); line-height: 1.9; margin-bottom: 14px; }
.hi-badge { background: rgba(255,215,0,0.12); border: 1.5px solid rgba(255,215,0,0.4); color: #FFD700; font-size: 13px; font-weight: 700; padding: 5px 18px; border-radius: 20px; margin-bottom: 16px; display: inline-block; }
.big-btn {
  background: linear-gradient(145deg, #FF9800, #E65100);
  color: #fff; border: none; border-radius: 50px; padding: 15px 48px; font-size: 21px; font-weight: 900;
  cursor: pointer; position: relative; overflow: hidden;
  box-shadow: 0 6px 0 #BF360C, 0 8px 20px rgba(0,0,0,0.35);
  touch-action: manipulation; font-family: inherit;
}
.big-btn::before { content:''; position:absolute; top:0; left:0; right:0; height:50%; border-radius:50px 50px 0 0; background:rgba(255,255,255,0.18); }
.big-btn:active { transform:translateY(5px); box-shadow:0 1px 0 #BF360C; }

/* GAME AREA */
#game-area {
  position: absolute; inset: 0; z-index: 10; display: none;
  flex-direction: column; align-items: center;
  padding: 80px 12px 12px; gap: 10px;
}

/* Number display */
#num-display-wrap { display: flex; flex-direction: column; align-items: center; gap: 4px; }
#q-instruction { font-size: 12px; font-weight: 700; color: rgba(255,215,0,0.7); letter-spacing: 1px; }
.num-orb-outer {
  width: 110px; height: 110px; border-radius: 50%;
  background: conic-gradient(#FFD700, #FF9800, #FFE566, #FF9800, #FFD700);
  padding: 5px;
  box-shadow: 0 0 0 3px rgba(255,255,255,0.6), 0 0 30px rgba(255,215,0,0.5), 0 6px 20px rgba(0,0,0,0.5);
  /* rotation removed: 6 and 9 look same when spinning */
}

.num-orb-inner {
  width: 100%; height: 100%; border-radius: 50%;
  background: radial-gradient(circle at 35% 35%, #4a148c, #1a0040);
  display: flex; align-items: center; justify-content: center;
}
#big-number {
  font-size: 64px; font-weight: 900; color: #FFD700;
  text-shadow: 0 0 20px rgba(255,215,0,0.8), 3px 3px 0 #8B6914;
  line-height: 1; animation: numGlow 1.5s ease-in-out infinite alternate;
}
@keyframes numGlow { from{text-shadow:0 0 10px rgba(255,215,0,.6),3px 3px 0 #8B6914} to{text-shadow:0 0 30px rgba(255,215,0,1),3px 3px 0 #8B6914} }

/* Tap counter dots */
#tap-dots { display: flex; gap: 5px; justify-content: center; flex-wrap: wrap; min-height: 22px; }
.tap-dot { width: 18px; height: 18px; border-radius: 50%; border: 2px solid rgba(255,255,255,0.3); background: rgba(255,255,255,0.1); transition: all .2s; }
.tap-dot.filled { background: #FFD700; border-color: #FF9800; box-shadow: 0 0 8px rgba(255,215,0,0.7); animation: dotFill .2s ease; }
@keyframes dotFill { 0%{transform:scale(0)} 60%{transform:scale(1.3)} 100%{transform:scale(1)} }

/* Animal grid */
#animal-grid { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; width: 100%; max-width: 360px; }
.animal-btn {
  cursor: pointer; border-radius: 18px; touch-action: manipulation; position: relative; overflow: hidden;
  background: linear-gradient(145deg, rgba(40,10,80,0.9), rgba(20,5,50,0.95));
  border: 2.5px solid rgba(200,150,255,0.3);
  box-shadow: 0 4px 0 rgba(0,0,0,0.5), 0 0 10px rgba(150,100,255,0.1);
  transition: transform .1s;
  display: flex; align-items: center; justify-content: center;
}
.animal-btn::before { content:''; position:absolute; top:0; left:0; right:0; height:45%; border-radius:16px 16px 0 0; background:rgba(255,255,255,0.06); }
.animal-btn:active { transform: scale(0.92); }
.animal-btn.tapped {
  background: linear-gradient(145deg, rgba(80,20,150,0.95), rgba(50,10,100,0.98));
  border-color: #FFD700;
  box-shadow: 0 4px 0 #8B6914, 0 0 20px rgba(255,215,0,0.4);
}
.animal-btn.tapped::after { content:'✓'; position:absolute; top:3px; right:6px; font-size:11px; color:#FFD700; font-weight:900; }
.animal-btn.wrong-tap { animation: wShake .3s; border-color:#f44336; }
@keyframes wShake { 0%,100%{transform:translateX(0)} 25%{transform:translateX(-5px)} 75%{transform:translateX(5px)} }

/* Submit button */
#submit-btn {
  background: linear-gradient(145deg, #9C27B0, #4A148C);
  color: #fff; border: none; border-radius: 50px; padding: 13px 44px; font-size: 18px; font-weight: 900;
  cursor: pointer; position: relative; overflow: hidden;
  box-shadow: 0 5px 0 #2d004a; opacity: 0.35; pointer-events: none; transition: opacity .25s, box-shadow .1s;
  font-family: inherit;
}
#submit-btn::before { content:''; position:absolute; top:0; left:0; right:0; height:50%; border-radius:50px 50px 0 0; background:rgba(255,255,255,0.15); }
#submit-btn.active { opacity: 1; pointer-events: auto; box-shadow: 0 5px 0 #2d004a, 0 0 20px rgba(156,39,176,0.5); animation: btnPulse 1s ease-in-out infinite; }
@keyframes btnPulse { 0%,100%{box-shadow:0 5px 0 #2d004a,0 0 20px rgba(156,39,176,.5)} 50%{box-shadow:0 5px 0 #2d004a,0 0 35px rgba(156,39,176,.8)} }
#submit-btn:active { transform:translateY(4px); box-shadow:0 1px 0 #2d004a; }

/* Feedback & flash */
#feedback-overlay { position:fixed; inset:0; pointer-events:none; z-index:50; display:flex; align-items:center; justify-content:center; opacity:0; transition:opacity .15s; }
#feedback-text { font-size:90px; filter:drop-shadow(0 4px 12px rgba(0,0,0,.3)); }
#flash { position:fixed; inset:0; z-index:45; pointer-events:none; opacity:0; }

/* Result */
#result-overlay { position:absolute; inset:0; z-index:30; display:none; flex-direction:column; align-items:center; justify-content:center; background:rgba(5,0,20,0.93); }
.result-frame {
  background: linear-gradient(145deg, rgba(30,0,70,0.97), rgba(15,0,45,0.99));
  border: 4px solid #FFD700; border-radius: 28px; padding: 26px; text-align: center;
  box-shadow: 0 0 0 2px #8B6914, 0 0 40px rgba(255,215,0,0.2), 0 12px 40px rgba(0,0,0,0.7);
  width: 100%; max-width: 320px;
}
.result-trophy { font-size: 64px; margin-bottom: 6px; animation: tBounce .6s ease; }
@keyframes tBounce { 0%{transform:scale(0) rotate(-10deg)} 60%{transform:scale(1.2)} 100%{transform:scale(1)} }
.result-title { font-size: 30px; font-weight: 900; color: #FFD700; text-shadow: 2px 2px 0 #8B6914; margin-bottom: 10px; }
.result-score-wrap { background: rgba(0,0,0,0.35); border-radius: 16px; padding: 12px 20px; margin-bottom: 12px; }
.result-score-label { font-size: 14px; color: rgba(255,255,255,.6); font-weight: 700; }
.result-score-num { font-size: 58px; font-weight: 900; color: #FFD700; line-height: 1; display: block; }
.result-hi { font-size: 13px; color: rgba(255,255,255,.5); margin-bottom: 18px; font-weight: 700; }
.result-hi.new { color: #FFD700; font-size: 16px; }
.result-btns { display: flex; gap: 10px; justify-content: center; }
.btn-retry { background:linear-gradient(145deg,#FF9800,#E65100); color:#fff; border:none; border-radius:50px; padding:12px 24px; font-size:16px; font-weight:700; cursor:pointer; box-shadow:0 5px 0 #BF360C; font-family:inherit; }
.btn-title { background:linear-gradient(145deg,#9C27B0,#4A148C); color:#fff; border:none; border-radius:50px; padding:12px 24px; font-size:16px; font-weight:700; cursor:pointer; box-shadow:0 5px 0 #2d004a; font-family:inherit; }
.btn-retry:active,.btn-title:active { transform:translateY(4px); box-shadow:none; }

.particle { position:fixed; pointer-events:none; z-index:48; font-size:20px; animation:pFly var(--dur,.9s) ease forwards; }
@keyframes pFly { 0%{opacity:1;transform:translate(0,0) scale(1)} 100%{opacity:0;transform:translate(var(--tx,0),var(--ty,-80px)) scale(.2)} }
.pop-word { position:fixed; font-weight:900; pointer-events:none; z-index:49; font-size:24px; animation:pWord .9s ease forwards; }
@keyframes pWord { 0%{opacity:0;transform:translateY(10px) scale(.6)} 25%{opacity:1;transform:translateY(-8px) scale(1.2)} 100%{opacity:0;transform:translateY(-60px) scale(.9)} }
</style>
<script src="/games/wakuwaku_bgm.js"></script>
</head>
<body>
<div id="game-wrap">
<canvas id="bg"></canvas>

<!-- TITLE -->
<div id="title-screen" class="screen">
  <div class="title-frame">
    <div class="title-num-row">
      <div class="t-num" style="background:linear-gradient(145deg,#F44336,#B71C1C);--glow:#F4433688;--d:1.0s">1</div>
      <div class="t-num" style="background:linear-gradient(145deg,#FF9800,#E65100);--glow:#FF980088;--d:1.3s;animation-delay:.15s">2</div>
      <div class="t-num" style="background:linear-gradient(145deg,#FFD700,#F57F17);--glow:#FFD70088;--d:1.1s;animation-delay:.05s">3</div>
      <div class="t-num" style="background:linear-gradient(145deg,#4CAF50,#1B5E20);--glow:#4CAF5088;--d:1.4s;animation-delay:.25s">4</div>
      <div class="t-num" style="background:linear-gradient(145deg,#2196F3,#0D47A1);--glow:#2196F388;--d:1.2s;animation-delay:.1s">5</div>
    </div>
    <div class="title-label">✦ かずあそび ✦</div>
    <div class="title-text">かずあそび！</div>
    <p class="title-sub">かずをみて おなじかずだけ<br>どうぶつをタップしよう！</p>
    <div id="hi-title" class="hi-badge">🏆 ハイスコア: 0もん</div>
    <button class="big-btn" onclick="startGame()">▶ スタート！</button>
  </div>
</div>

<!-- HUD -->
<div id="hud">
  <div class="hud-nav">
    <button id="back-btn" onclick="goBack()">🏠 もどる</button>
    <div id="ui-bgm-btn">🔊</div>
  </div>
  <div id="status-bar">
    <div class="hud-chip"><span class="hud-chip-label">せいかい</span><span class="hud-chip-val" id="q-disp">0</span></div>
    <div class="hud-chip" id="timer-chip"><span class="hud-chip-label">のこり</span><span class="hud-chip-val" id="time-disp">30</span></div>
  </div>
</div>

<!-- GAME -->
<div id="game-area">
  <div id="num-display-wrap">
    <div id="q-instruction">この かずだけ タップ！</div>
    <div class="num-orb-outer">
      <div class="num-orb-inner"><div id="big-number">5</div></div>
    </div>
  </div>
  <div id="tap-dots"></div>
  <div id="animal-grid"></div>
  <button id="submit-btn" onclick="onSubmit()">✨ きめる！</button>
</div>

<!-- FEEDBACK -->
<div id="feedback-overlay"><div id="feedback-text">⭕</div></div>
<div id="flash"></div>

<!-- RESULT -->
<div id="result-overlay" style="display:none;">
  <div class="result-frame">
    <div class="result-trophy" id="r-trophy">🏆</div>
    <div class="result-title" id="r-title">すごい！</div>
    <div class="result-score-wrap">
      <div class="result-score-label">せいかい</div>
      <span class="result-score-num" id="r-score">0</span>
      <div class="result-score-label">もん</div>
    </div>
    <div class="result-hi" id="r-hi"></div>
    <div class="result-btns">
      <button class="btn-retry" onclick="startGame()">もういちど</button>
      <button class="btn-title" onclick="goTitle()">タイトルへ</button>
    </div>
  </div>
</div>
</div>

<script>
/* ===== Canvas BG ===== */
const cvs=document.getElementById('bg'),ctx=cvs.getContext('2d');
let W,H,stars=[],fireworks=[];
function initC(){
  W=cvs.offsetWidth;H=cvs.offsetHeight;cvs.width=W;cvs.height=H;
  stars=[];
  for(let i=0;i<80;i++)stars.push({x:Math.random()*W,y:Math.random()*H,r:.5+Math.random()*1.8,ph:Math.random()*Math.PI*2,sp:.4+Math.random()*1.2});
  fireworks=[];
  const cols=['#FFD700','#FF4081','#40C4FF','#69F0AE','#FF6D00','#E040FB'];
  for(let i=0;i<8;i++)fireworks.push({x:W*(.1+Math.random()*.8),y:H*(.05+Math.random()*.5),col:cols[i%cols.length],ph:Math.random()*Math.PI*2,sp:.2+Math.random()*.3,r:2+Math.random()*4,alpha:.06+Math.random()*.1});
}
function drawBg(t){
  ctx.clearRect(0,0,W,H);
  const g=ctx.createLinearGradient(0,0,0,H);
  g.addColorStop(0,'#0d0030');g.addColorStop(.5,'#1a0050');g.addColorStop(1,'#0d0030');
  ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  // Subtle grid
  ctx.strokeStyle='rgba(150,100,255,0.05)';ctx.lineWidth=1;
  for(let x=0;x<W;x+=40){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,H);ctx.stroke();}
  for(let y=0;y<H;y+=40){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke();}
  // Stars
  const ts=t/1000;
  stars.forEach(s=>{const tw=(Math.sin(ts*s.sp+s.ph)+1)/2;ctx.fillStyle=`rgba(220,200,255,${tw*.7})`;ctx.beginPath();ctx.arc(s.x,s.y,s.r*(0.5+tw*.5),0,Math.PI*2);ctx.fill();});
  // Floating glow orbs
  fireworks.forEach(f=>{
    const bob=Math.sin(ts*f.sp+f.ph)*15;
    ctx.beginPath();ctx.arc(f.x,f.y+bob,f.r,0,Math.PI*2);
    const hex=f.col.replace('#','');
    const r=parseInt(hex.slice(0,2),16),g2=parseInt(hex.slice(2,4),16),b=parseInt(hex.slice(4,6),16);
    ctx.fillStyle=`rgba(${r},${g2},${b},${f.alpha})`;ctx.fill();
  });
}
let raf;function bgLoop(t){drawBg(t);raf=requestAnimationFrame(bgLoop);}
initC();requestAnimationFrame(bgLoop);window.addEventListener('resize',initC);

/* ===== Game ===== */
const ANIMALS=['🐱','🐶','🐰','🐸','🐼','🦊','🐧','🐮','🐷','🦁','🐯','🐨','🐻','🦒','🐘'];
let correctCount=0,timeLeft=30,running=false,timerInt,targetNum=0,currentAnimal='',tappedSet=new Set(),locked=false;
let W2=480;

function getHi(){return parseInt(localStorage.getItem('kazu_hi2')||'0');}
function saveHi(v){localStorage.setItem('kazu_hi2',v);}
function updateHiBadge(){document.getElementById('hi-title').textContent='🏆 ハイスコア: '+getHi()+'もん';}

function startGame(){
  correctCount=0;timeLeft=30;running=true;locked=false;
  document.getElementById('title-screen').style.display='none';
  document.getElementById('result-overlay').style.display='none';
  document.getElementById('hud').style.display='block';
  document.getElementById('game-area').style.display='flex';
  document.getElementById('q-disp').textContent='0';
  document.getElementById('time-disp').textContent='30';
  document.getElementById('timer-chip').classList.remove('urgent');
  clearInterval(timerInt);
  timerInt=setInterval(()=>{
    timeLeft--;
    document.getElementById('time-disp').textContent=timeLeft;
    if(timeLeft<=10)document.getElementById('timer-chip').classList.add('urgent');
    if(timeLeft<=0)endGame();
  },1000);
  nextQ();
}
function goTitle(){
  running=false;clearInterval(timerInt);
  document.getElementById('result-overlay').style.display='none';
  document.getElementById('hud').style.display='none';
  document.getElementById('game-area').style.display='none';
  document.getElementById('title-screen').style.display='flex';
  updateHiBadge();
}

function nextQ(){
  locked=false;tappedSet.clear();
  targetNum=1+Math.floor(Math.random()*8);
  currentAnimal=ANIMALS[Math.floor(Math.random()*ANIMALS.length)];
  const total=Math.min(targetNum+2+Math.floor(Math.random()*4),14);
  document.getElementById('big-number').textContent=targetNum;
  // Dot counter
  const dots=document.getElementById('tap-dots');dots.innerHTML='';
  for(let i=0;i<targetNum;i++){const d=document.createElement('div');d.className='tap-dot';d.id='dot-'+i;dots.appendChild(d);}
  updateSubmitBtn();
  renderGrid(total);
}

function renderGrid(total){
  const ag=document.getElementById('animal-grid');ag.innerHTML='';
  const cols=total<=6?3:4;
  const wrap=document.querySelector('#game-area');
  const maxW=Math.min(wrap.offsetWidth-24,360);
  const btnW=Math.floor((maxW-(cols-1)*8)/cols);
  const btnH=Math.floor(btnW*.9);
  const emojiSize=Math.round(btnW*.50);
  for(let i=0;i<total;i++){
    const b=document.createElement('button');b.className='animal-btn';
    b.style.width=btnW+'px';b.style.height=btnH+'px';
    b.innerHTML=`<span style="font-size:${emojiSize}px;line-height:1;position:relative;z-index:1">${currentAnimal}</span>`;
    b.dataset.idx=i;
    b.addEventListener('click',()=>onTap(b,i));
    b.addEventListener('touchend',e=>{e.preventDefault();onTap(b,i);},{passive:false});
    ag.appendChild(b);
  }
}

function onTap(btn,idx){
  if(locked)return;
  if(tappedSet.has(idx)){
    tappedSet.delete(idx);btn.classList.remove('tapped');
  } else {
    if(tappedSet.size>=targetNum){
      btn.classList.add('wrong-tap');setTimeout(()=>btn.classList.remove('wrong-tap'),350);
      pop(`${targetNum}つだよ！`,'#FF8A65');return;
    }
    tappedSet.add(idx);btn.classList.add('tapped');
  }
  updateDots();updateSubmitBtn();
}
function updateDots(){
  const filled=tappedSet.size;
  for(let i=0;i<targetNum;i++){const d=document.getElementById('dot-'+i);if(d)d.classList.toggle('filled',i<filled);}
}
function updateSubmitBtn(){
  const b=document.getElementById('submit-btn');
  if(tappedSet.size===targetNum){b.classList.add('active');}
  else{b.classList.remove('active');}
}
function onSubmit(){
  if(locked||tappedSet.size!==targetNum)return;
  locked=true;correctCount++;
  document.getElementById('q-disp').textContent=correctCount;
  showFeedback('⭕');flash('rgba(156,39,176,0.3)');burst();pop('✨ せいかい！','#FFD700');
  setTimeout(()=>{hideFeedback();nextQ();},800);
}

function showFeedback(t){document.getElementById('feedback-text').textContent=t;document.getElementById('feedback-overlay').style.opacity='1';}
function hideFeedback(){document.getElementById('feedback-overlay').style.opacity='0';}
function flash(c){const f=document.getElementById('flash');f.style.transition='';f.style.background=c;f.style.opacity='1';setTimeout(()=>{f.style.transition='opacity .3s';f.style.opacity='0';},100);}
function burst(){
  const items=['⭐','✨','🌟','💫','🎉','🔢'];
  const cx=window.innerWidth/2,cy=window.innerHeight*.4;
  for(let i=0;i<10;i++){
    const el=document.createElement('div');el.className='particle';
    el.textContent=items[Math.floor(Math.random()*items.length)];
    const a=(i/10)*Math.PI*2,d=65+Math.random()*55;
    el.style.cssText=`left:${cx}px;top:${cy}px;--tx:${Math.cos(a)*d}px;--ty:${Math.sin(a)*d-50}px;--dur:${.6+Math.random()*.4}s;animation-delay:${Math.random()*.06}s`;
    document.body.appendChild(el);setTimeout(()=>el.remove(),1100);
  }
}
function pop(text,color){
  const el=document.createElement('div');el.className='pop-word';el.textContent=text;el.style.color=color;
  el.style.cssText+=`;left:${window.innerWidth/2-80}px;top:${window.innerHeight*.35}px;text-shadow:2px 2px 4px rgba(0,0,0,.5)`;
  document.body.appendChild(el);setTimeout(()=>el.remove(),1000);
}
function endGame(){
  running=false;clearInterval(timerInt);
  document.getElementById('hud').style.display='none';
  document.getElementById('game-area').style.display='none';
  document.getElementById('result-overlay').style.display='flex';
  const hi=getHi(),isNew=correctCount>hi;if(isNew)saveHi(correctCount);
  updateHiBadge();
  document.getElementById('r-score').textContent=correctCount;
  const hiEl=document.getElementById('r-hi');
  let trophy,title;
  if(correctCount>=12){trophy='🏆';title='かずのてんさい！';}
  else if(correctCount>=6){trophy='⭐';title='ナイス！';}
  else{trophy='🔢';title='もういちど！';}
  document.getElementById('r-trophy').textContent=trophy;
  document.getElementById('r-title').textContent=title;
  hiEl.textContent=isNew?'🏆 ニューレコード！':'ハイスコア: '+hi+'もん';
  hiEl.className='result-hi'+(isNew?' new':'');
  if(correctCount>=6)for(let i=0;i<12;i++)setTimeout(burst,i*120);
}
function goBack(){if(window.parent!==window)window.parent.postMessage({type:'goBack'},'*');else history.back();}
updateHiBadge();
</script>

<script>
// ── BGM (WakuwakuBGM library) ──────────────────────
let _bgm = null;

function _startBGM() {
  if (_bgm) return;
  _bgm = new WakuwakuBGM('happy');
  const on = WakuwakuBGM.loadState();
  _bgm.setEnabled(on);
  if (on) _bgm.start();
  _syncBgmBtn();
}

function toggleCommonBGM() {
  if (!_bgm) { _startBGM(); return; }
  const on = _bgm.toggle();
  WakuwakuBGM.saveState(on);
  _syncBgmBtn();
}

function _syncBgmBtn() {
  const on = _bgm ? _bgm.enabled : WakuwakuBGM.loadState();
  const btns = document.querySelectorAll(
    '#bgm-btn,#ui-bgm-btn,#bgm-toggle,#sound-btn,.bgm-btn'
  );
  btns.forEach(b => { b.textContent = on ? '🔊' : '🔇'; });
}

(function(){
  function _first(){ _startBGM(); }
  document.addEventListener('click', _first, { once: true });
  document.addEventListener('touchstart', _first, { once: true });
})();
// ── End BGM ────────────────────────────────────────
</script>
</body>
</html>
