<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>きがえしよう！</title>
<link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@400;700;800;900&family=Cinzel:wght@700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:'M PLUS Rounded 1c',sans-serif;background:#080018;min-height:100vh;overflow-x:hidden;color:white;user-select:none;}

/* 背景 */
.bg{position:fixed;inset:0;z-index:0;background:linear-gradient(160deg,#080018 0%,#14002e 50%,#080018 100%);}
#stars{position:fixed;inset:0;z-index:0;pointer-events:none;}
.star{position:absolute;border-radius:50%;background:white;animation:twinkle ease-in-out infinite;}
@keyframes twinkle{0%,100%{opacity:0.15;transform:scale(1);}50%{opacity:0.7;transform:scale(1.4);}}

/* メイン */
#app{position:relative;z-index:1;width:100%;max-width:480px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;}

/* ヘッダー */
#header{padding:12px 16px 6px;display:flex;justify-content:space-between;align-items:center;flex-shrink:0;}
.header-title{font-family:'Cinzel',serif;font-size:18px;font-weight:700;background:linear-gradient(90deg,#FFD700,#FF80AB,#A78BFA);-webkit-background-clip:text;-webkit-text-fill-color:transparent;}
.close-btn{width:34px;height:34px;border-radius:50%;background:rgba(255,255,255,0.1);border:none;color:white;font-size:16px;cursor:pointer;}

/* キャラタブ */
#char-tabs{display:flex;gap:8px;padding:0 16px 8px;flex-shrink:0;}
.char-tab{flex:1;padding:9px;border-radius:14px;border:2px solid rgba(255,255,255,0.12);background:rgba(255,255,255,0.05);color:rgba(255,255,255,0.55);font-family:inherit;font-size:14px;font-weight:800;cursor:pointer;transition:all 0.2s;}
.char-tab.active{background:rgba(255,215,0,0.15);border-color:#FFD700;color:#FFD700;}

/* キャラ表示 */
#char-display{
  flex:0 0 auto;height:200px;
  display:flex;justify-content:center;align-items:flex-end;
  padding-bottom:8px;position:relative;
}
#char-display::before{content:'';position:absolute;bottom:8px;left:50%;transform:translateX(-50%);width:140px;height:18px;background:radial-gradient(ellipse,rgba(255,215,0,0.18),transparent);border-radius:50%;}
#char-svg-wrap{animation:charFloat 3s ease-in-out infinite;filter:drop-shadow(0 6px 18px rgba(255,215,0,0.25));}
@keyframes charFloat{0%,100%{transform:translateY(0);}50%{transform:translateY(-10px);}}

/* カテゴリ */
#cat-row{display:flex;gap:6px;overflow-x:auto;padding:6px 16px 8px;scrollbar-width:none;flex-shrink:0;}
#cat-row::-webkit-scrollbar{display:none;}
.cat-btn{
  display:flex;align-items:center;gap:5px;
  padding:7px 14px;border-radius:20px;
  border:1.5px solid rgba(255,255,255,0.12);
  background:rgba(255,255,255,0.06);
  color:rgba(255,255,255,0.65);
  font-family:inherit;font-size:12px;font-weight:800;
  cursor:pointer;white-space:nowrap;transition:all 0.15s;
  flex-shrink:0;
}
.cat-btn.active{border-color:#FFD700;background:rgba(255,215,0,0.18);color:#FFD700;}

/* アイテムグリッド */
#item-grid{
  display:grid;grid-template-columns:repeat(3,1fr);
  gap:8px;padding:4px 16px 16px;
  flex:1;overflow-y:auto;
  scrollbar-width:thin;scrollbar-color:rgba(255,215,0,0.2) transparent;
}
.item-btn{
  display:flex;flex-direction:column;align-items:center;gap:4px;
  border-radius:16px;padding:10px 6px 8px;
  cursor:pointer;transition:all 0.18s;
  border:2px solid rgba(255,255,255,0.08);
  font-family:inherit;color:white;
  position:relative;overflow:hidden;
  min-height:90px;
}
.item-btn::before{
  content:'';position:absolute;inset:0;
  background:linear-gradient(180deg,rgba(255,255,255,0.08),transparent);
  border-radius:14px;
}
.item-btn:hover{transform:scale(1.04);filter:brightness(1.15);}
.item-btn.selected{
  border-color:var(--sel-color,#FFD700);
  box-shadow:0 0 16px rgba(255,215,0,0.35);
  transform:scale(1.04);
}
.item-btn.none-btn{
  border-style:dashed;
  background:rgba(255,255,255,0.04) !important;
}
.item-check{
  position:absolute;top:5px;right:5px;
  width:16px;height:16px;border-radius:50%;
  background:#FFD700;color:#000;
  font-size:9px;display:flex;align-items:center;justify-content:center;
  font-weight:900;z-index:2;
}
.item-icon{
  font-size:28px;line-height:1;
  position:relative;z-index:1;
  filter:drop-shadow(0 2px 4px rgba(0,0,0,0.4));
}
.item-name{
  font-size:10px;font-weight:800;
  text-align:center;
  position:relative;z-index:1;
  line-height:1.2;
  text-shadow:0 1px 3px rgba(0,0,0,0.5);
}
/* アイテムSVGバッジ（宝石風） */
.item-gem-wrap{
  width:44px;height:44px;
  display:flex;align-items:center;justify-content:center;
  position:relative;z-index:1;
}


#common-bgm-btn{
  position:fixed;
  top:max(10px,env(safe-area-inset-top,10px));
  right:10px;z-index:1000;
  background:rgba(0,0,0,0.45);
  border:1.5px solid rgba(255,255,255,0.35);
  border-radius:50%;width:40px;height:40px;
  font-size:18px;cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  color:white;
}

/* === safe-area & common buttons === */
:root {
  --sat: env(safe-area-inset-top, 0px);
  --sab: env(safe-area-inset-bottom, 0px);
}
#ui-home-btn, #ui-bgm-btn {
  position: fixed;
  top: max(12px, env(safe-area-inset-top, 12px));
  z-index: 9999;
  width: 40px; height: 40px;
  background: rgba(0,0,0,0.5);
  border: 1.5px solid rgba(255,255,255,0.4);
  border-radius: 50%;
  font-size: 20px;
  cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  touch-action: manipulation;
  -webkit-tap-highlight-color: transparent;
}
#ui-home-btn { left: 12px; }
#ui-bgm-btn  { right: 12px; }

/* === 横向き対応 === */
@media (orientation: landscape) {
  body { overflow-y: auto; }
  #hud, #ui-home-btn, #ui-bgm-btn {
    top: max(6px, env(safe-area-inset-top, 6px));
  }
  #back-btn {
    bottom: max(8px, env(safe-area-inset-bottom, 8px));
  }
}
@media (orientation: landscape) and (max-height: 500px) {
  /* 横向き時にゲームエリアを縮小・スクロール対応 */
  canvas { max-height: 100vh; }
  #game-area { overflow-y: auto; }
}
</style>
</head>

    <button class="close-btn">✕</button>
  </div>
  <div id="char-tabs">
    <button class="char-tab active" onclick="switchChar('princess')">👸 プリンセス</button>
    <button class="char-tab" onclick="switchChar('prince')">🤴 プリンス</button>
  </div>
  <div id="char-display"><div id="char-svg-wrap"></div></div>
  <div id="cat-row"></div>
  <div id="item-grid"></div>

// 星
const sc=document.getElementById('stars');
for(let i=0;i<50;i++){
  const s=document.createElement('div');s.className='star';
  const sz=Math.random()*2+0.8;
  s.style.cssText=`width:${sz}px;height:${sz}px;left:${Math.random()*100}%;top:${Math.random()*100}%;animation-duration:${2+Math.random()*3}s;animation-delay:${-Math.random()*4}s;`;
  sc.appendChild(s);
}

// ===== SVG宝石ヘルパー =====
function gemSVG(c1,c2,c3,stroke,size=38){
  const id='g'+Math.random().toString(36).slice(2,7);
  return `<svg width="${size}" height="${size}" viewBox="0 0 40 40">
  <defs>
    <linearGradient id="${id}" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="${c1}"/>
      <stop offset="50%" stop-color="${c2}"/>
      <stop offset="100%" stop-color="${c3}"/>
    </linearGradient>
    <filter id="f${id}"><feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="${c2}" flood-opacity="0.7"/></filter>
  </defs>
  <ellipse cx="20" cy="37" rx="12" ry="2.5" fill="rgba(0,0,0,0.3)"/>
  <polygon points="20,2 37,13 31,36 9,36 3,13" fill="${c3}" opacity="0.2"/>
  <polygon points="20,2 37,13 31,36 9,36 3,13" fill="url(#${id})" stroke="${stroke}" stroke-width="0.7" filter="url(#f${id})"/>
  <polygon points="20,2 37,13 20,21" fill="rgba(255,255,255,0.22)"/>
  <polygon points="9,36 20,21 31,36" fill="rgba(0,0,0,0.2)"/>
  <circle cx="13" cy="10" r="4" fill="rgba(255,255,255,0.7)"/>
  <circle cx="13" cy="10" r="2" fill="rgba(255,255,255,0.95)"/>
  <circle cx="28" cy="16" r="1.5" fill="rgba(255,255,255,0.35)"/>
</svg>`;
}

// ===== 状態 =====
let currentChar='princess';
let currentCat='crown';
let equipped={
  princess:{crown:'ribbon',dress:'pink',acc:'necklace',shoes:'heel',prop:'wand',pet:'unicorn'},
  prince:{crown:'crown',suit:'blue',acc:'medal',shoes:'boot',prop:'sword',pet:'dragon'},
};

// ===== レンダリング =====
function renderChar(){
  const eq=equipped[currentChar];
  document.getElementById('char-svg-wrap').innerHTML=
    currentChar==='princess'?buildPrincessSVG(eq):buildPrinceSVG(eq);
}

function renderCats(){
  const row=document.getElementById('cat-row');
  row.innerHTML='';
  CATS[currentChar].forEach(cat=>{
    const btn=document.createElement('button');
    btn.className='cat-btn'+(cat.id===currentCat?' active':'');
    btn.style.setProperty('--active-color',cat.color);
    btn.innerHTML=`<span>${cat.emoji}</span>${cat.label}`;
    if(cat.id===currentCat){btn.style.borderColor=cat.color;btn.style.color=cat.color;btn.style.background=cat.color+'28';}
    btn.onclick=()=>{currentCat=cat.id;renderCats();renderItems();};
    row.appendChild(btn);
  });
}

function renderItems(){
  const grid=document.getElementById('item-grid');
  grid.innerHTML='';
  const catDef=CATS[currentChar].find(c=>c.id===currentCat);
  const items=ITEMS[currentChar]?.[currentCat]||[];
  const eq=equipped[currentChar];

  items.forEach(item=>{
    const btn=document.createElement('button');
    const isSel=eq[currentCat]===(item.id||null);
    btn.className='item-btn'+(isSel?' selected':'')+(item.id===null?' none-btn':'');
    btn.style.background=item.bg||'rgba(255,255,255,0.06)';
    if(isSel){
      btn.style.setProperty('--sel-color',item.selColor||'#FFD700');
      btn.style.borderColor=item.selColor||'#FFD700';
      btn.style.boxShadow=`0 0 16px ${item.selColor||'#FFD700'}44`;
    }

    let iconHTML='';
    if(item.icon){
      iconHTML=`<div class="item-gem-wrap">${item.icon()}</div>`;
    } else if(item.color){
      // ドレス/スーツ色：カラーサークル
      const c=item.color;
      if(c==='rainbow'){
        iconHTML=`<div style="width:44px;height:44px;border-radius:50%;background:conic-gradient(#FF5252,#FF9800,#FFEB3B,#4CAF50,#2196F3,#9C27B0,#FF5252);box-shadow:0 2px 8px rgba(0,0,0,0.4);flex-shrink:0;"></div>`;
      } else {
        iconHTML=`<div style="width:44px;height:44px;border-radius:50%;background:radial-gradient(circle at 35% 35%,${lighten(c)},${c});box-shadow:0 2px 8px ${c}66;flex-shrink:0;border:2px solid ${c}88;"></div>`;
      }
    }

    btn.innerHTML=`${iconHTML}<div class="item-name">${item.name}</div>${isSel?'<div class="item-check">✓</div>':''}`;
    btn.onclick=()=>{
      equipped[currentChar][currentCat]=item.id;
      renderChar();renderItems();
    };
    grid.appendChild(btn);
  });
}

function lighten(hex){
  // 簡易明度UP
  try{
    let r=parseInt(hex.slice(1,3),16),g=parseInt(hex.slice(3,5),16),b=parseInt(hex.slice(5,7),16);
    r=Math.min(255,r+60);g=Math.min(255,g+60);b=Math.min(255,b+60);
    return `rgb(${r},${g},${b})`;
  }catch(e){return hex;}
}

function switchChar(char){
  currentChar=char;
  currentCat=CATS[char][0].id;
  document.querySelectorAll('.char-tab').forEach((t,i)=>t.classList.toggle('active',(i===0&&char==='princess')||(i===1&&char==='prince')));
  renderChar();renderCats();renderItems();
}

renderChar();renderCats();renderItems();



// === 共通UI ===
function goHome(){
  if(window.parent!==window){window.parent.postMessage({type:'goHome'},'*');}
  else{window.location.href='/';}
}
var _bgmEnabled=true;
function toggleCommonBGM(){
  _bgmEnabled=!_bgmEnabled;
  var btn=document.getElementById('ui-bgm-btn');
  if(btn)btn.textContent=_bgmEnabled?'🔊':'🔇';
  if(window.Tone)Tone.getDestination().mute=!_bgmEnabled;
  if(window._masterGain)_masterGain.gain.value=_bgmEnabled?1:0;
}

// === BGM (Web Audio API) ===
(function(){
  var _ctx=null, _gain=null, _playing=false, _stopped=false;
  var _notes=[[659,0.3],[698,0.3],[784,0.3],[880,0.3],[784,0.3],[698,0.3],[659,0.6],[587,0.3],[659,0.3],[698,0.3],[784,0.3],[698,0.3],[659,0.3],[587,0.9]];
  var _ni=0;

  function _initBGM(){
    if(_ctx)return;
    try{
      _ctx=new(window.AudioContext||window.webkitAudioContext)();
      _gain=_ctx.createGain();
      _gain.gain.value=0.1;
      _gain.connect(_ctx.destination);
      window._masterGain=_gain;
    }catch(e){}
  }

  function _playNote(freq,dur,time){
    if(!_ctx||_stopped)return;
    var o=_ctx.createOscillator();
    var g=_ctx.createGain();
    o.type='sine';
    o.frequency.value=freq;
    g.gain.setValueAtTime(0.1,time);
    g.gain.exponentialRampToValueAtTime(0.001,time+dur*0.9);
    o.connect(g);g.connect(_gain);
    o.start(time);o.stop(time+dur);
  }

  function _loop(){
    if(_stopped||!_ctx||!_gain)return;
    var t=_ctx.currentTime+0.05;
    _notes.forEach(function(n,i){
      var offset=0;
      for(var j=0;j<i;j++)offset+=_notes[j][1];
      _playNote(n[0],n[1],t+offset);
    });
    var total=_notes.reduce(function(s,n){return s+n[1];},0);
    _loopTimer=setTimeout(_loop,(total-0.1)*1000);
  }
  var _loopTimer=null;

  function startBGM(){
    if(_playing)return;
    _initBGM();
    if(!_ctx)return;
    _stopped=false;_playing=true;
    if(_ctx.state==='suspended')_ctx.resume();
    _loop();
  }

  function stopBGM(){
    _stopped=true;_playing=false;
    if(_loopTimer){clearTimeout(_loopTimer);_loopTimer=null;}
    if(_gain)_gain.gain.value=0;
  }

  function resumeBGM(){
    if(_playing)return;
    _stopped=false;_playing=true;
    if(_gain)_gain.gain.value=0.1;
    if(_ctx&&_ctx.state==='suspended')_ctx.resume();
    _loop();
  }

  // ページ表示後にBGM開始（タップ後）
  function _tryStart(){
    startBGM();
    document.removeEventListener('touchstart',_tryStart);
    document.removeEventListener('click',_tryStart);
  }
  document.addEventListener('touchstart',_tryStart,{once:true});
  document.addEventListener('click',_tryStart,{once:true});

  // toggleCommonBGMを上書き
  window.toggleCommonBGM=function(){
    _bgmEnabled=!_bgmEnabled;
    var btn=document.getElementById('ui-bgm-btn');
    if(btn)btn.textContent=_bgmEnabled?'🔊':'🔇';
    if(_bgmEnabled)resumeBGM();else stopBGM();
  };

  window._startBGM=startBGM;
  window._stopBGM=stopBGM;
})();
</script>

  <!-- 共通UIボタン -->
  <button id="ui-home-btn" onclick="goHome()">🏠</button>
  <button id="ui-bgm-btn" onclick="toggleCommonBGM()">🔊</button>
</body>
