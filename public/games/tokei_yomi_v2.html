<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#2A1B4A">
<title>とけいよみ - とけいのまち いちにちぼうけん</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DotGothic16&family=M+PLUS+Rounded+1c:wght@700;900&display=swap" rel="stylesheet">
<style>
:root{
  --sat:0px; --sab:0px; --sal:0px; --sar:0px;
  --ink:#4A3B32;
  --gold:#FFD76A; --gold-d:#E8A33D;
  --pink:#FFB3C7; --mint:#9FE3D0; --lav:#C9B6F5; --sky:#A8D8F5;
  --panel:rgba(28,18,52,0.94);
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
html,body{
  margin:0; padding:0; width:100%; height:100%; overflow:hidden;
  background:#1A1030; color:#fff;
  font-family:'M PLUS Rounded 1c',system-ui,sans-serif;
  overscroll-behavior:none; touch-action:none;
  -webkit-user-select:none; user-select:none;
}
#cv{position:fixed; inset:0; width:100%; height:100%; display:block; touch-action:none;}

/* ---------- 共通パーツ ---------- */
.btn{
  font-family:inherit; font-weight:900; cursor:pointer; border:none;
  border-radius:18px; color:#3A2A18; transition:transform .08s ease, filter .12s ease;
  background:linear-gradient(180deg,var(--gold),var(--gold-d));
  box-shadow:0 5px 0 #A9701F, 0 8px 18px rgba(0,0,0,.42);
}
.btn:active{transform:translateY(4px); box-shadow:0 1px 0 #A9701F, 0 3px 10px rgba(0,0,0,.4);}
.btn.ghost{
  background:linear-gradient(180deg,rgba(255,255,255,.22),rgba(255,255,255,.10));
  color:#fff; box-shadow:0 4px 0 rgba(0,0,0,.35), inset 0 0 0 2px rgba(255,255,255,.28);
}
.panel{
  background:linear-gradient(150deg,rgba(46,28,86,.97),rgba(22,12,46,.99));
  border:4px solid var(--gold); border-radius:28px;
  box-shadow:0 0 0 2px #8B6914, 0 0 46px rgba(255,215,106,.16), 0 14px 44px rgba(0,0,0,.7);
}

/* ---------- 画面 ---------- */
.screen{
  position:fixed; inset:0; z-index:20;
  display:none; flex-direction:column; align-items:center; justify-content:center;
  padding:calc(var(--sat) + 12px) calc(var(--sar) + 16px) calc(var(--sab) + 12px) calc(var(--sal) + 16px);
}
.screen.on{display:flex;}

/* タイトル */
#s-title .panel{width:100%; max-width:360px; padding:26px 22px; text-align:center;}
.t-kicker{font-size:11px; letter-spacing:5px; color:rgba(255,215,106,.75); font-weight:900; margin-bottom:6px;}
.t-main{
  font-family:'DotGothic16',monospace; font-size:38px; line-height:1.15;
  background:linear-gradient(180deg,#FFF0A8,#FF9B3D);
  -webkit-background-clip:text; background-clip:text; -webkit-text-fill-color:transparent;
  filter:drop-shadow(0 3px 0 rgba(0,0,0,.45)); margin:0 0 4px;
}
.t-sub{font-size:13px; color:rgba(255,255,255,.72); font-weight:700; margin-bottom:18px;}
#btn-start{width:100%; padding:15px; font-size:21px; margin-bottom:10px;}
.t-row{display:flex; gap:9px;}
.t-row .btn{flex:1; padding:11px; font-size:13px;}

/* 相棒えらび */
#s-buddy .panel{width:100%; max-width:380px; padding:20px 18px;}
.sec-title{font-size:19px; font-weight:900; text-align:center; color:var(--gold); margin:0 0 14px;}
.buddy-grid{display:grid; grid-template-columns:1fr 1fr; gap:11px;}
.buddy-card{
  border-radius:20px; padding:11px 8px 9px; text-align:center; cursor:pointer;
  background:linear-gradient(170deg,rgba(255,255,255,.17),rgba(255,255,255,.06));
  border:3px solid rgba(255,255,255,.24); transition:transform .1s, border-color .15s;
}
.buddy-card:active{transform:scale(.95);}
.buddy-card.sel{border-color:var(--gold); background:linear-gradient(170deg,rgba(255,215,106,.34),rgba(255,215,106,.12));}
.buddy-card canvas{width:78px; height:78px; display:block; margin:0 auto 4px;}
.buddy-name{font-size:14px; font-weight:900;}
#btn-buddy-go{width:100%; padding:13px; font-size:18px; margin-top:14px;}

/* ステージセレクト */
#s-map{justify-content:flex-start; overflow-y:auto; overscroll-behavior:contain; touch-action:pan-y;}
#s-map .panel{width:100%; max-width:400px; padding:18px 16px; margin:auto 0;}
.map-list{display:flex; flex-direction:column; gap:9px;}
.map-row{
  display:flex; align-items:center; gap:11px; padding:10px 12px; border-radius:18px; cursor:pointer;
  background:linear-gradient(120deg,rgba(255,255,255,.15),rgba(255,255,255,.05));
  border:2.5px solid rgba(255,255,255,.2); transition:transform .1s;
}
.map-row:active{transform:scale(.98);}
.map-row.lock{opacity:.42; cursor:default;}
.map-icon{width:46px; height:46px; border-radius:14px; flex:0 0 auto; box-shadow:inset 0 -4px 0 rgba(0,0,0,.2);}
.map-txt{flex:1; min-width:0;}
.map-time{font-family:'DotGothic16',monospace; font-size:17px; color:var(--gold); line-height:1.1;}
.map-name{font-size:13px; font-weight:700; color:rgba(255,255,255,.9);}
.map-stars{font-size:15px; letter-spacing:1px; color:var(--gold); flex:0 0 auto;}
.map-stars .off{color:rgba(255,255,255,.22);}
#s-map .t-row{margin-top:14px;}

/* ずかん */
#s-book{justify-content:flex-start; overflow-y:auto; overscroll-behavior:contain; touch-action:pan-y;}
#s-book .panel{width:100%; max-width:400px; padding:18px 16px; margin:auto 0;}
.book-grid{display:grid; grid-template-columns:repeat(4,1fr); gap:8px;}
.book-cell{
  aspect-ratio:1/1; border-radius:16px; display:flex; align-items:center; justify-content:center;
  background:rgba(255,255,255,.07); border:2.5px solid rgba(255,255,255,.16); overflow:hidden;
}
.book-cell.got{background:linear-gradient(160deg,rgba(255,215,106,.3),rgba(255,215,106,.08)); border-color:var(--gold);}
.book-cell canvas{width:100%; height:100%;}
.book-q{font-size:24px; font-weight:900; color:rgba(255,255,255,.25);}
.book-count{text-align:center; font-size:13px; font-weight:900; color:rgba(255,255,255,.75); margin-bottom:12px;}

/* ---------- プレイHUD ---------- */
#hud{
  position:fixed; z-index:12; left:0; right:0;
  top:calc(var(--sat) + 8px);
  padding:0 calc(var(--sar) + 12px) 0 calc(var(--sal) + 12px);
  display:none; flex-direction:column; gap:7px; pointer-events:none;
}
#hud.on{display:flex;}
/* みぎうえは おやフレームの HomeChip が うかぶ ため あけておく */
.hud-top{display:flex; align-items:center; gap:8px; padding-right:88px;}
.chip{
  pointer-events:auto; background:rgba(14,8,32,.72); border:2px solid rgba(255,255,255,.22);
  border-radius:16px; padding:5px 12px; font-size:12px; font-weight:900; cursor:pointer;
  backdrop-filter:blur(6px); color:#fff;
}
.chip.round{width:36px; height:36px; padding:0; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:15px;}
.hud-sp{flex:1;}
.hud-prog{
  pointer-events:none; background:rgba(14,8,32,.7); border:2px solid rgba(255,215,106,.34);
  border-radius:16px; padding:4px 13px; font-family:'DotGothic16',monospace; font-size:14px; color:var(--gold);
}
#bar-bg{height:7px; margin-right:88px; background:rgba(0,0,0,.42); border-radius:4px; overflow:hidden; max-width:340px; width:100%; margin:0 auto; pointer-events:none;}
#bar-fill{height:100%; width:0%; border-radius:4px; background:linear-gradient(90deg,#7BE38F,var(--gold)); transition:width .4s ease;}

/* 問題文バナー */
#qbar{
  position:fixed; z-index:12; left:0; right:0; top:calc(var(--sat) + 62px);
  display:none; justify-content:center; padding:0 16px; pointer-events:none;
}
#qbar.on{display:flex;}
#qtext{
  background:linear-gradient(160deg,rgba(46,28,86,.95),rgba(22,12,46,.97));
  border:3px solid var(--gold); border-radius:20px; padding:9px 20px; max-width:400px;
  font-size:17px; font-weight:900; text-align:center; line-height:1.35;
  box-shadow:0 6px 22px rgba(0,0,0,.55);
}
#qtext b{color:var(--gold); font-family:'DotGothic16',monospace; font-size:21px;}

/* 回答エリア */
#ans{
  position:fixed; z-index:12; left:0; right:0; bottom:calc(var(--sab) + 14px);
  display:none; justify-content:center; padding:0 calc(var(--sar) + 14px) 0 calc(var(--sal) + 14px);
}
#ans.on{display:flex;}
#ans-inner{width:100%; max-width:400px;}
.ans-grid{display:grid; grid-template-columns:1fr 1fr; gap:10px;}
.ans-btn{
  padding:15px 6px; font-size:20px; border-radius:20px;
  font-family:'DotGothic16',monospace; letter-spacing:1px;
}
.ans-btn.ok{background:linear-gradient(180deg,#8CE6A0,#3FA85C)!important; box-shadow:0 5px 0 #24713B!important; color:#fff!important;}
.ans-btn.ng{background:linear-gradient(180deg,#FF9A9A,#D9463F)!important; box-shadow:0 5px 0 #932722!important; color:#fff!important;}
.ans-btn:disabled{cursor:default; opacity:.85;}
/* 3択とけい */
.clock-grid{display:grid; grid-template-columns:repeat(3,1fr); gap:9px;}
.clock-pick{
  border-radius:20px; padding:7px 4px 6px; cursor:pointer; text-align:center;
  background:linear-gradient(170deg,rgba(255,255,255,.92),rgba(226,216,244,.9));
  border:3.5px solid rgba(255,255,255,.5); box-shadow:0 5px 0 rgba(0,0,0,.35);
  transition:transform .1s;
}
.clock-pick:active{transform:scale(.95);}
.clock-pick.ok{border-color:#3FA85C; box-shadow:0 5px 0 #24713B, 0 0 22px rgba(90,230,130,.7);}
.clock-pick.ng{border-color:#D9463F; box-shadow:0 5px 0 #932722; opacity:.6;}
.clock-pick canvas{width:100%; height:auto; display:block;}
/* 針あわせ */
#hint-drag{
  text-align:center; font-size:13px; font-weight:900; color:rgba(255,255,255,.8);
  margin-bottom:9px; text-shadow:0 2px 6px rgba(0,0,0,.8);
}
#btn-submit{width:100%; padding:15px; font-size:20px;}

/* ---------- 結果 / 判定演出 ---------- */
#judge{
  position:fixed; inset:0; z-index:30; display:none; align-items:center; justify-content:center; pointer-events:none;
}
#judge.on{display:flex;}
#judge-txt{
  font-family:'DotGothic16',monospace; font-size:60px; font-weight:900;
  animation:pop .5s cubic-bezier(.2,1.7,.5,1);
  filter:drop-shadow(0 5px 0 rgba(0,0,0,.5));
}
@keyframes pop{0%{transform:scale(.2) rotate(-12deg); opacity:0;} 60%{transform:scale(1.18) rotate(3deg);} 100%{transform:scale(1) rotate(0);}}

#s-clear .panel{width:100%; max-width:350px; padding:24px 20px; text-align:center;}
.clr-title{font-family:'DotGothic16',monospace; font-size:30px; color:var(--gold); margin:0 0 8px;}
.clr-stars{font-size:44px; letter-spacing:6px; color:var(--gold); margin-bottom:6px; min-height:52px;}
.clr-stars .off{color:rgba(255,255,255,.2);}
.clr-stars span{display:inline-block; animation:pop .45s cubic-bezier(.2,1.7,.5,1) both;}
.clr-msg{font-size:14px; font-weight:700; color:rgba(255,255,255,.85); margin-bottom:14px; line-height:1.5;}
.clr-sticker{margin:0 auto 14px; display:none; align-items:center; justify-content:center; gap:10px;}
.clr-sticker.on{display:flex;}
.clr-sticker .clr-sticker-item{width:110px; height:110px; flex:0 0 auto; animation:pop .6s cubic-bezier(.2,1.7,.5,1) both;}
.clr-sticker.two .clr-sticker-item{width:92px; height:92px;}
.clr-sticker canvas{width:100%; height:100%; display:block;}
.clr-got{font-size:12px; font-weight:900; color:var(--gold); margin-bottom:12px;}
#s-clear .t-row{margin-top:2px;}
#s-clear .t-row .btn{padding:13px 8px; font-size:14px;}

/* とけいのおしえ (ステージ導入) */
#s-intro .panel{width:100%; max-width:340px; padding:22px 20px; text-align:center;}
.intro-time{font-family:'DotGothic16',monospace; font-size:34px; color:var(--gold); margin:0 0 4px;}
.intro-place{font-size:19px; font-weight:900; margin-bottom:12px;}
.intro-tip{
  font-size:14px; font-weight:700; line-height:1.6; color:rgba(255,255,255,.88);
  background:rgba(0,0,0,.28); border-radius:16px; padding:12px 14px; margin-bottom:16px;
}
.intro-tip b{color:var(--gold);}
#btn-intro-go{width:100%; padding:14px; font-size:19px;}

/* WebGLフォールバック */
#fallback{
  position:fixed; inset:0; z-index:99; display:none; align-items:center; justify-content:center;
  background:#1A1030; padding:28px; text-align:center; font-size:16px; font-weight:700; line-height:1.7;
}
#fallback.on{display:flex;}

@media (max-height:620px){
  .t-main{font-size:31px;} #btn-start{padding:12px; font-size:18px;}
  .buddy-card canvas{width:62px; height:62px;}
  #qtext{font-size:15px; padding:7px 15px;} #qtext b{font-size:18px;}
  .ans-btn{padding:12px 5px; font-size:17px;}
  .clr-stars{font-size:36px; min-height:42px;} .clr-sticker{width:88px; height:88px;}
}
</style>
</head>
<body>
<canvas id="cv"></canvas>

<!-- HUD -->
<div id="hud">
  <div class="hud-top">
    <button class="chip" id="chip-back">もどる</button>
    <button class="chip round" id="chip-bgm">♪</button>
    <div class="hud-sp"></div>
    <div class="hud-prog" id="chip-prog">1 / 5</div>
    <div class="hud-sp"></div>
  </div>
  <div id="bar-bg"><div id="bar-fill"></div></div>
</div>

<div id="qbar"><div id="qtext"></div></div>

<div id="ans"><div id="ans-inner"></div></div>

<div id="judge"><div id="judge-txt"></div></div>

<!-- タイトル -->
<div class="screen on" id="s-title">
  <div class="panel">
    <div class="t-kicker">TOKEI YOMI</div>
    <h1 class="t-main">とけいのまち<br>いちにちぼうけん</h1>
    <div class="t-sub">とけいを よんで 1にちを すすもう！</div>
    <button class="btn" id="btn-start">はじめる</button>
    <div class="t-row">
      <button class="btn ghost" id="btn-book">ずかん</button>
      <button class="btn ghost" id="btn-bgm2">おと ON</button>
    </div>
  </div>
</div>

<!-- 相棒えらび -->
<div class="screen" id="s-buddy">
  <div class="panel">
    <h2 class="sec-title">あいぼうを えらんでね</h2>
    <div class="buddy-grid" id="buddy-grid"></div>
    <button class="btn" id="btn-buddy-go">これに きめた！</button>
  </div>
</div>

<!-- ステージセレクト -->
<div class="screen" id="s-map">
  <div class="panel">
    <h2 class="sec-title">いちにちの ぼうけん</h2>
    <div class="map-list" id="map-list"></div>
    <div class="t-row">
      <button class="btn ghost" id="btn-map-book">ずかん</button>
      <button class="btn ghost" id="btn-map-title">タイトル</button>
    </div>
  </div>
</div>

<!-- ステージ導入 -->
<div class="screen" id="s-intro">
  <div class="panel">
    <div class="intro-time" id="intro-time"></div>
    <div class="intro-place" id="intro-place"></div>
    <div class="intro-tip" id="intro-tip"></div>
    <button class="btn" id="btn-intro-go">スタート！</button>
  </div>
</div>

<!-- クリア -->
<div class="screen" id="s-clear">
  <div class="panel">
    <h2 class="clr-title" id="clr-title">クリア！</h2>
    <div class="clr-stars" id="clr-stars"></div>
    <div class="clr-sticker" id="clr-sticker"></div>
    <div class="clr-got" id="clr-got"></div>
    <div class="clr-msg" id="clr-msg"></div>
    <div class="t-row">
      <button class="btn ghost" id="btn-clr-retry">もういちど</button>
      <button class="btn" id="btn-clr-next">つぎへ</button>
    </div>
  </div>
</div>

<!-- ずかん -->
<div class="screen" id="s-book">
  <div class="panel">
    <h2 class="sec-title">おもいで ずかん</h2>
    <div class="book-count" id="book-count"></div>
    <div class="book-grid" id="book-grid"></div>
    <div class="t-row" style="margin-top:14px">
      <button class="btn ghost" id="btn-book-close">とじる</button>
    </div>
  </div>
</div>

<div id="fallback"><p>このブラウザでは 3Dが つかえません。<br>べつの ブラウザで あそんでみてね。</p></div>

<script src="/games/wakuwaku_bgm.js"></script>
<script src="/games/safe_area.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
'use strict';
/* =======================================================================
   とけいよみ v2 — とけいのまち いちにちぼうけん
   Three.js r128 / 8ステージ / 3問題形式 / おもいでずかん
   ======================================================================= */

try{ window.parent && window.parent.postMessage({type:'requestSafeArea'},'*'); }catch(e){}

/* ================= ストレージ ================= */
var SAFE_LS=(function(){
  var ok=true;
  try{ localStorage.setItem('__t','1'); localStorage.removeItem('__t'); }catch(e){ ok=false; }
  var mem={};
  return {
    getItem:function(k){ if(ok){ try{ return localStorage.getItem(k); }catch(e){} } return (k in mem)?mem[k]:null; },
    setItem:function(k,v){ if(ok){ try{ localStorage.setItem(k,String(v)); return; }catch(e){} } mem[k]=String(v); }
  };
})();
var SAVE_KEY='tokei_v2_progress';

var SV={ buddy:0, stars:[0,0,0,0,0,0,0,0], stickers:{} };
function loadSave(){
  try{
    var raw=SAFE_LS.getItem(SAVE_KEY);
    if(!raw) return;
    var o=JSON.parse(raw);
    if(o && typeof o==='object'){
      if(typeof o.buddy==='number' && o.buddy>=0 && o.buddy<4) SV.buddy=o.buddy;
      if(Object.prototype.toString.call(o.stars)==='[object Array]'){
        for(var i=0;i<8;i++){ var v=Number(o.stars[i]); SV.stars[i]=(v>=0&&v<=3)?(v|0):0; }
      }
      if(o.stickers && typeof o.stickers==='object'){
        /* こわれた キー・はんいがい の index を ずかんへ まぜない (0〜15のみ ゆうこう) */
        var clean={};
        for(var si=0;si<16;si++){
          if(o.stickers[si]===1 || o.stickers[si]===true) clean[si]=1;
        }
        SV.stickers=clean;
      }
    }
  }catch(e){}
}
function saveNow(){ try{ SAFE_LS.setItem(SAVE_KEY,JSON.stringify(SV)); }catch(e){} }
loadSave();

/* ================= あいぼう ================= */
/* body / belly / ear型 / なまえ */
var BUDDIES=[
  { name:'ミィ',    body:0xF7C5A0, belly:0xFFF0E2, accent:0xFF9BB5, ear:'cat',    id:'cat' },
  { name:'ポチ',    body:0xE8DCC8, belly:0xFFFBF2, accent:0x8FC7F5, ear:'dog',    id:'dog' },
  { name:'ミミ',    body:0xF3E4F7, belly:0xFFFBFF, accent:0xC9A6F0, ear:'rabbit', id:'rabbit' },
  { name:'クマきち',body:0xC9A17A, belly:0xF2DCC2, accent:0x9FE0B8, ear:'bear',   id:'bear' }
];

/* ================= ステージ ================= */
/* step: 針の刻み(分)  hourRange: 出題する「時」の候補 */
var STAGES=[
  { h:6,  m:0,  place:'あさ 6じ・おきる',   short:'おきる',     step:60, hours:[6,7,8],    sky:['#FFD9A8','#FF9E7A','#6E5B9E'], amb:0xFFD9B0, sun:0xFFC98A, sunPos:[-6,7,4],  ground:0x8E7BB5, room:'bed_m',  bgm:'cute',
    tip:'みじかい はりが <b>じ</b>、ながい はりが <b>ふん</b>だよ。ながい はりが <b>12</b>のときは ちょうどの じかん！' },
  { h:7,  m:0,  place:'あさ 7じ・あさごはん', short:'あさごはん', step:60, hours:[6,7,8,9],  sky:['#CFF0FF','#9FD8F7','#6BB2E8'], amb:0xE8F4FF, sun:0xFFF3D0, sunPos:[-5,8,5],  ground:0xC9A882, room:'kitchen',bgm:'happy',
    tip:'みじかい はりが さす <b>すうじ</b>が「じ」。<br>6と7の あいだなら まだ <b>6じ</b>だよ。' },
  { h:8,  m:30, place:'あさ 8じ・がっこうへ', short:'がっこう',   step:30, hours:[7,8,9],    sky:['#BDE8FF','#8FD0F5','#5FA8E0'], amb:0xEAF6FF, sun:0xFFFFE8, sunPos:[4,9,4],   ground:0x8FCF7F, room:'street', bgm:'adventure',
    tip:'ながい はりが <b>6</b>を さすと <b>30ぷん</b>（はん）。<br>とけいの したがわ だね。' },

function $(id){ return document.getElementById(id); }
function randInt(a,b){ return a+Math.floor(Math.random()*(b-a+1)); }
function shuffle(a){ for(var i=a.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)); var t=a[i]; a[i]=a[j]; a[j]=t; } return a; }
function clamp(v,a,b){ return v<a?a:(v>b?b:v); }

/* 12じかんひょうき: 13→1 */
function h12(h){ var v=h%12; return v===0?12:v; }
/* 「◯じ◯ふん」 */
function labelOf(h,m){
  var hh=h12(h);
  if(m===0) return hh+'じ';
  if(m===30) return hh+'じはん';
  return hh+'じ'+m+'ふん';
}
/* よみあげ（ごぜん/ごご つき） */
function labelFull(h,m){
  var pre=(h<12)?'あさ':((h<18)?'ひる':'よる');
  return pre+' '+labelOf(h,m);
}

/* しゅつだい じかん せいせい: そのステージの ばめんに しぜんな「じ」の こうほ からのみ えらぶ */
function genTime(st){
  var m;
  if(st.step>=60) m=0;
  else m=randInt(0,Math.floor(59/st.step))*st.step;
  var pool=(st.hours&&st.hours.length)?st.hours:[randInt(1,12)];
  var h=pool[randInt(0,pool.length-1)];
  return {h:h,m:m};
}
/* ステージ こてい の じこく (さいしょの もんだい よう)。24じかん値を とけいひょうじ よう 12じかんへ せいきか */
function stageOwnTime(st){ return {h:h12(st.h),m:st.m}; }
function sameTime(a,b){ return a.h===b.h && a.m===b.m; }

<script>
/* =======================================================================
   Three.js セットアップ
   ======================================================================= */
var cv=$('cv');
var renderer=null,scene=null,camera=null,W=1,H=1;

function hasWebGL(){
  try{ var c=document.createElement('canvas');
    return !!(window.WebGLRenderingContext&&(c.getContext('webgl')||c.getContext('experimental-webgl')));
  }catch(e){ return false; }
}
/* WebGLまたはThree.jsが つかえない ときは fallbackだけ みせて、
   このあとの Three.js しょきかを すべて スキップする（うんこーと えらーを ださない） */
var THREE_OK=hasWebGL()&&(typeof THREE!=='undefined');
if(!THREE_OK){
  $('fallback').className='on';
}

if(THREE_OK){
  renderer=new THREE.WebGLRenderer({canvas:cv,antialias:true,alpha:false});
  renderer.setPixelRatio(Math.min(window.devicePixelRatio||1,2));
  renderer.shadowMap.enabled=true;
  renderer.shadowMap.type=THREE.PCFSoftShadowMap;
  scene=new THREE.Scene();
  camera=new THREE.PerspectiveCamera(50,1,0.1,140);
}

var CLOCK_Y=1.95, CLOCK_R=1.25;

/* あすぺくとに あわせて カメラきょり を きめる */
function fitCamera(){
  var aspect=W/H;
  var t=Math.tan(25*Math.PI/180);
  var needH=5.35, needW=3.86;
  var dH=needH/(2*t);
  var dW=needW/(2*t*Math.max(aspect,0.25));
  var d=Math.max(dH,dW);
  d=clamp(d,4.6,9.4);
  /* やや あおり ぎみ: ゆか を へらして はいけい を みせる */
  camera.position.set(0,CLOCK_Y-0.72,d);
  camera.lookAt(0,CLOCK_Y+0.02,0);
}
function resize(){
  if(!THREE_OK||!renderer) return;
  W=Math.max(1,window.innerWidth); H=Math.max(1,window.innerHeight);
  renderer.setSize(W,H,false);
  camera.aspect=W/H;
  fitCamera();
  camera.updateProjectionMatrix();
  if(typeof placeBuddy==='function') placeBuddy();
}
window.addEventListener('resize',resize);
window.addEventListener('orientationchange',function(){ setTimeout(resize,220); });

/* ================= メッシュ ヘルパー ================= */
function mat(col,shine){
  if(shine) return new THREE.MeshPhongMaterial({color:col,shininess:52,specular:0x555555});
  return new THREE.MeshLambertMaterial({color:col});
}
function box(w,h,d,col,x,y,z,shine){
  var m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),mat(col,shine));
  m.position.set(x||0,y||0,z||0); m.castShadow=true; m.receiveShadow=true; return m;
}
function cyl(rt,rb,h,seg,col,x,y,z,shine){
  var m=new THREE.Mesh(new THREE.CylinderGeometry(rt,rb,h,seg||16),mat(col,shine));
  m.position.set(x||0,y||0,z||0); m.castShadow=true; m.receiveShadow=true; return m;
}
function sph(r,col,x,y,z,shine,seg){
  var m=new THREE.Mesh(new THREE.SphereGeometry(r,seg||16,(seg||16)/2),mat(col,shine));
  m.position.set(x||0,y||0,z||0); m.castShadow=true; m.receiveShadow=true; return m;
}
function cone(r,h,seg,col,x,y,z){
  var m=new THREE.Mesh(new THREE.ConeGeometry(r,h,seg||12),mat(col,false));
  m.position.set(x||0,y||0,z||0); m.castShadow=true; m.receiveShadow=true; return m;
}
function plane(w,h,col,x,y,z){
  var m=new THREE.Mesh(new THREE.PlaneGeometry(w,h),new THREE.MeshLambertMaterial({color:col,side:THREE.DoubleSide}));
  m.position.set(x||0,y||0,z||0); m.receiveShadow=true; return m;
}

/* ================= そら (グラデーション背景) ================= */
var skyMesh=null;
function makeSkyTexture(cols){
  var c=document.createElement('canvas'); c.width=8; c.height=256;
  var g=c.getContext('2d');
  /* カメラ FOV では そらの ごく いちぶ しか みえない ため
     グラデーションを みえる おび (v 0.30-0.72) に あつめる */
  var grd=g.createLinearGradient(0,0,0,256);
  grd.addColorStop(0,cols[0]); grd.addColorStop(0.30,cols[0]);
  grd.addColorStop(0.52,cols[1]);
  grd.addColorStop(0.72,cols[2]); grd.addColorStop(1,cols[2]);
  g.fillStyle=grd; g.fillRect(0,0,8,256);
  var t=new THREE.CanvasTexture(c);
  t.minFilter=THREE.LinearFilter; t.magFilter=THREE.LinearFilter;
  return t;
}
function setSky(cols){
  if(skyMesh){ scene.remove(skyMesh); if(skyMesh.material.map) skyMesh.material.map.dispose(); skyMesh.material.dispose(); skyMesh.geometry.dispose(); }
  var geo=new THREE.SphereGeometry(64,20,14);
  var m=new THREE.MeshBasicMaterial({map:makeSkyTexture(cols),side:THREE.BackSide,depthWrite:false});
  skyMesh=new THREE.Mesh(geo,m);
  scene.add(skyMesh);
  scene.fog=new THREE.Fog(new THREE.Color(cols[1]).getHex(),16,52);
}

/* =======================================================================
   3D とけい
   ======================================================================= */
var clockGrp=null, handH=null, handM=null, faceTex=null;
/* つまみ の ちゅうしんからの きょり (はり の さきっぽ) */
var GRIP_H=CLOCK_R*0.56*0.84, GRIP_M=CLOCK_R*0.83*0.84;

/* もじばん を Canvas で えがく (すうじは fillText / えもじは つかわない) */
function buildFaceTexture(){
  var S=512, c=document.createElement('canvas'); c.width=S; c.height=S;
  var g=c.getContext('2d'), cx=S/2, cy=S/2;

  /* ベース */
  var grd=g.createRadialGradient(cx-60,cy-70,20,cx,cy,S*0.52);
  grd.addColorStop(0,'#FFFFFF'); grd.addColorStop(0.62,'#FDF6E6'); grd.addColorStop(1,'#EEDFC2');
  g.fillStyle=grd; g.beginPath(); g.arc(cx,cy,S*0.5,0,Math.PI*2); g.fill();

  /* そとわく の うすいリング */
  g.strokeStyle='rgba(180,150,100,0.35)'; g.lineWidth=6;
  g.beginPath(); g.arc(cx,cy,S*0.455,0,Math.PI*2); g.stroke();

  /* 5ふん ごとの ぬりわけ (よみやすさ) */
  for(var s=0;s<12;s++){
    if(s%2===0) continue;
    var a0=(s*30-90)*Math.PI/180, a1=((s+1)*30-90)*Math.PI/180;
    g.fillStyle='rgba(140,190,235,0.10)';
    g.beginPath(); g.moveTo(cx,cy);
    g.arc(cx,cy,S*0.45,a0,a1); g.closePath(); g.fill();
  }

  /* めもり */
  for(var i=0;i<60;i++){
    var ang=(i*6-90)*Math.PI/180;
    var big=(i%5===0);
    var r1=S*(big?0.385:0.415), r2=S*0.448;
    g.strokeStyle=big?'#4A3B32':'rgba(74,59,50,0.42)';
    g.lineWidth=big?9:3.5; g.lineCap='round';
    g.beginPath();
    g.moveTo(cx+Math.cos(ang)*r1,cy+Math.sin(ang)*r1);
    g.lineTo(cx+Math.cos(ang)*r2,cy+Math.sin(ang)*r2);
    g.stroke();
  }

  /* すうじ 1-12 */
  g.textAlign='center'; g.textBaseline='middle';
  for(var n=1;n<=12;n++){
    var a=(n*30-90)*Math.PI/180;
    var x=cx+Math.cos(a)*S*0.325, y=cy+Math.sin(a)*S*0.325;
    g.font='900 '+Math.round(S*0.115)+'px "M PLUS Rounded 1c", sans-serif';
    g.fillStyle='rgba(255,255,255,0.9)'; g.fillText(String(n),x,y+3);
    g.fillStyle='#3A2C22'; g.fillText(String(n),x,y);
  }

  /* ふん の ちいさい すうじ (5,10,...) — よみかた の たすけ */
  for(var k=1;k<=12;k++){
    var ak=(k*30-90)*Math.PI/180;
    var xk=cx+Math.cos(ak)*S*0.212, yk=cy+Math.sin(ak)*S*0.212;
    g.font='900 '+Math.round(S*0.052)+'px "M PLUS Rounded 1c", sans-serif';
    g.fillStyle='rgba(70,120,190,0.62)';
    g.fillText(String((k*5)%60),xk,yk);
  }

  var t=new THREE.CanvasTexture(c);
  t.anisotropy=4; t.minFilter=THREE.LinearFilter; t.magFilter=THREE.LinearFilter;
  return t;
}

function buildHand(len,w,thick,col,tipRound){
  var grp=new THREE.Group();
  var m=new THREE.Mesh(new THREE.BoxGeometry(w,len,thick),new THREE.MeshPhongMaterial({color:col,shininess:70,specular:0x777777,emissive:col,emissiveIntensity:0.30}));
  m.position.y=len*0.5-len*0.16;
  m.castShadow=true;
  grp.add(m);
  /* おしり の おもり */
  var tail=new THREE.Mesh(new THREE.BoxGeometry(w*0.8,len*0.19,thick),new THREE.MeshPhongMaterial({color:col,shininess:70}));
  tail.position.y=-len*0.22; tail.castShadow=true;
  grp.add(tail);
  if(tipRound){
    /* つまみ: こどもが つかむ ばしょ を はっきり みせる */
    var knob=new THREE.Mesh(new THREE.SphereGeometry(w*1.02,14,10),
      new THREE.MeshPhongMaterial({color:col,shininess:90,specular:0xAAAAAA,emissive:col,emissiveIntensity:0.30}));
    knob.position.y=len*0.84-len*0.16; knob.scale.z=0.62; knob.castShadow=true;
    grp.add(knob);
    var ring=new THREE.Mesh(new THREE.SphereGeometry(w*0.44,10,8),
      new THREE.MeshBasicMaterial({color:0xFFFFFF}));
    ring.position.set(0,len*0.84-len*0.16,thick*0.62); ring.scale.z=0.4;
    grp.add(ring);
  }
  return grp;
}

function buildClock(){
  var g=new THREE.Group();

  /* ほんたい */
  var body=new THREE.Mesh(new THREE.CylinderGeometry(CLOCK_R,CLOCK_R,0.30,48),
    new THREE.MeshPhongMaterial({color:0xFFF6E4,shininess:30}));
  body.rotation.x=Math.PI/2; body.castShadow=true; body.receiveShadow=true;
  g.add(body);

  /* もじばん */
  faceTex=buildFaceTexture();
  /* じこはっこう を すこし もたせ、よるの シーンでも もじばんが よめる ように */
  var face=new THREE.Mesh(new THREE.CircleGeometry(CLOCK_R*0.985,48),
    new THREE.MeshLambertMaterial({
      map:faceTex, emissive:0xFFFFFF, emissiveMap:faceTex, emissiveIntensity:0.38
    }));
  face.position.z=0.152; face.receiveShadow=true;
  g.add(face);

  /* ゴールドの ふち */
  var rim=new THREE.Mesh(new THREE.TorusGeometry(CLOCK_R*1.005,0.115,12,52),
    new THREE.MeshPhongMaterial({color:0xF2C25A,shininess:110,specular:0xFFF0C0}));
  rim.position.z=0.06; rim.castShadow=true;
  g.add(rim);
  var rim2=new THREE.Mesh(new THREE.TorusGeometry(CLOCK_R*1.005,0.075,10,52),
    new THREE.MeshPhongMaterial({color:0xE0A63C,shininess:80}));
  rim2.position.z=-0.10;
  g.add(rim2);

  /* かざり (うえの ベル と あし) */
  var bellL=sph(0.20,0xF2C25A,-0.62,CLOCK_R*0.95,-0.02,true,12);
  var bellR=sph(0.20,0xF2C25A, 0.62,CLOCK_R*0.95,-0.02,true,12);
  g.add(bellL); g.add(bellR);
  var footL=cyl(0.085,0.10,0.30,10,0xE0A63C,-0.58,-CLOCK_R*0.98,-0.02,true); footL.rotation.z=0.30;
  var footR=cyl(0.085,0.10,0.30,10,0xE0A63C, 0.58,-CLOCK_R*0.98,-0.02,true); footR.rotation.z=-0.30;
  g.add(footL); g.add(footR);

  /* はり */
  handH=buildHand(CLOCK_R*0.56,0.135,0.05,0x3E4A8E,true);
  handH.position.z=0.20;
  handM=buildHand(CLOCK_R*0.83,0.095,0.05,0xD9463F,true);
  handM.position.z=0.255;
  g.add(handH); g.add(handM);

  /* まんなか の キャップ */
  var cap=new THREE.Mesh(new THREE.CylinderGeometry(0.115,0.115,0.10,16),
    new THREE.MeshPhongMaterial({color:0xF2C25A,shininess:120}));
  cap.rotation.x=Math.PI/2; cap.position.z=0.30;
  g.add(cap);

  g.position.set(0,CLOCK_Y,0);
  return g;
}

/* はり の かくど を セット (h:1-12, m:0-59) */
function applyHands(h,m,smooth){
  if(!handH) return;
  var hh=h%12;
  var degH=(hh*30)+(m*0.5);
  var degM=m*6;
  var tH=-degH*Math.PI/180, tM=-degM*Math.PI/180;
  if(smooth){ handH.userData.tgt=tH; handM.userData.tgt=tM; }
  else { handH.rotation.z=tH; handM.rotation.z=tM; handH.userData.tgt=tH; handM.userData.tgt=tM; }
}

/* =======================================================================

function buildBuddy(idx){
  var B=BUDDIES[idx]||BUDDIES[0];

  g.add(belly);

  var head=new THREE.Group();
  head.position.set(0,1.02,0);
  var hd=sph(0.375,B.body,0,0,0,false,18);
  hd.scale.set(1.04,0.98,0.98);
  head.add(hd);
  var muzz=sph(0.19,B.belly,0,-0.09,0.29,false,12);
  muzz.scale.set(1.1,0.82,0.75);
  head.add(muzz);
  var nose=sph(0.062,0x5A4038,0,-0.055,0.44,true,10);
  head.add(nose);
  var eyeL=sph(0.068,0x2A2028,-0.145,0.055,0.325,true,10);

  head.add(eyeL); head.add(eyeR);
  var glL=sph(0.026,0xFFFFFF,-0.168,0.086,0.372,false,8);
  var glR=sph(0.026,0xFFFFFF, 0.118,0.086,0.372,false,8);
  head.add(glL); head.add(glR);

  /* みみ */
  if(B.ear==='cat'){
    var eL=cone(0.135,0.26,4,B.body,-0.22,0.36,-0.02); eL.rotation.z=0.25;
    var eR=cone(0.135,0.26,4,B.body, 0.22,0.36,-0.02); eR.rotation.z=-0.25;
    head.add(eL); head.add(eR);
    var iL=cone(0.075,0.14,4,B.accent,-0.22,0.37,0.05); iL.rotation.z=0.25;

    head.add(dL); head.add(dR);
  } else if(B.ear==='rabbit'){
    var rL=cyl(0.075,0.095,0.56,10,B.body,-0.155,0.53,-0.02); rL.rotation.z=0.16;
    var rR=cyl(0.075,0.095,0.56,10,B.body, 0.155,0.53,-0.02); rR.rotation.z=-0.16;
    head.add(rL); head.add(rR);
    var rrL=cyl(0.042,0.055,0.42,8,B.accent,-0.152,0.55,0.045); rrL.rotation.z=0.16;
    var rrR=cyl(0.042,0.055,0.42,8,B.accent, 0.152,0.55,0.045); rrR.rotation.z=-0.16;

  g.add(cyl(0.13,0.13,0.34,12,0xFF9FB5,1.78,1.99,-4.72));
  g.add(cyl(0.13,0.13,0.34,12,0xA8E8C0,2.18,1.99,-4.72));
  g.add(cyl(0.13,0.13,0.34,12,0xFFE07A,2.58,1.99,-4.72));
  addWindow(g,2.35,3.70,-5.98,0xFFFFFF,0x8FB8D8);
}

/* あいぼう を がめん はばに あわせて ひだりしたに おく */
var BUDDY_Z=1.45;
function placeBuddy(){
  if(!buddyObj) return;
  var dist=Math.max(1.2,camera.position.z-BUDDY_Z);
  var t=Math.tan(25*Math.PI/180);
  var visW=2*dist*t*(W/H);
  var x=-visW*0.5*0.70;
  x=clamp(x,-3.0,-0.80);
  var sc=clamp(visW/2.60,0.62,1.00)*0.86;
  buddyObj.position.set(x,0,BUDDY_Z);
  buddyObj.scale.setScalar(sc);
}

var SCENE_FN={ bed_m:sceneBedMorning, bed_n:sceneBedNight, kitchen:sceneKitchen,
  street:sceneStreet, class:sceneClass, snack:sceneSnack, park:scenePark, bath:sceneBath };

/* ---------- ワールド こうちく ---------- */
function buildWorld(stIdx){
  var st=STAGES[stIdx];
  animProps=[];
  disposeGroup(worldGrp);
  worldGrp=new THREE.Group();

  setSky(st.sky);

  if(ambLight) scene.remove(ambLight);
  if(sunLight) scene.remove(sunLight);
  ambLight=new THREE.HemisphereLight(st.amb,st.ground,0.95);
  scene.add(ambLight);
  sunLight=new THREE.DirectionalLight(st.sun,0.80);
  sunLight.position.set(st.sunPos[0],st.sunPos[1],st.sunPos[2]);
  sunLight.castShadow=true;
  sunLight.shadow.mapSize.width=1024; sunLight.shadow.mapSize.height=1024;
  var cam=sunLight.shadow.camera;
  cam.left=-9; cam.right=9; cam.top=9; cam.bottom=-9; cam.near=0.5; cam.far=34;
  scene.add(sunLight);

  var fn=SCENE_FN[st.room]||sceneBedMorning;
  fn(worldGrp);

  /* あいぼう */
  buddyObj=buildBuddy(SV.buddy);
  buddyObj.rotation.y=0.34;
  worldGrp.add(buddyObj);
  placeBuddy();

  scene.add(worldGrp);
}

/* ---------- ミニとけい (3たく よう) ---------- */
function drawMiniClock(cvs,h,m){
  var S=cvs.width, g=cvs.getContext('2d'), cx=S/2, cy=S/2, R=S*0.44;
  g.clearRect(0,0,S,S);
  /* ふち */
  g.fillStyle='#E8C25A'; g.beginPath(); g.arc(cx,cy,R*1.10,0,Math.PI*2); g.fill();
  g.fillStyle='#FFF9EC'; g.beginPath(); g.arc(cx,cy,R,0,Math.PI*2); g.fill();
  /* めもり */
  for(var i=0;i<12;i++){
    var a=(i*30-90)*Math.PI/180;
    g.strokeStyle='#4A3B32'; g.lineWidth=S*0.026; g.lineCap='round';
    g.beginPath();
    g.moveTo(cx+Math.cos(a)*R*0.80,cy+Math.sin(a)*R*0.80);
    g.lineTo(cx+Math.cos(a)*R*0.93,cy+Math.sin(a)*R*0.93);
    g.stroke();
  }
  for(var k=0;k<60;k++){
    if(k%5===0) continue;
    var ak=(k*6-90)*Math.PI/180;
    g.strokeStyle='rgba(74,59,50,0.32)'; g.lineWidth=S*0.010;
    g.beginPath();
    g.moveTo(cx+Math.cos(ak)*R*0.86,cy+Math.sin(ak)*R*0.86);
    g.lineTo(cx+Math.cos(ak)*R*0.93,cy+Math.sin(ak)*R*0.93);
    g.stroke();
  }
  /* すうじ */
  g.textAlign='center'; g.textBaseline='middle';
  g.font='900 '+Math.round(S*0.135)+'px "M PLUS Rounded 1c", sans-serif';
  g.fillStyle='#3A2C22';
  var nums=[12,3,6,9];
  var pos=[[0,-1],[1,0],[0,1],[-1,0]];
  for(var n=0;n<4;n++){
    g.fillText(String(nums[n]),cx+pos[n][0]*R*0.66,cy+pos[n][1]*R*0.66+S*0.008);
  }
  /* はり */
  function hand(deg,len,wid,col){
    var a=(deg-90)*Math.PI/180;
    g.strokeStyle=col; g.lineWidth=wid; g.lineCap='round';
    g.beginPath(); g.moveTo(cx-Math.cos(a)*R*0.10,cy-Math.sin(a)*R*0.10);
    g.lineTo(cx+Math.cos(a)*len,cy+Math.sin(a)*len); g.stroke();
  }
  hand((h%12)*30+m*0.5,R*0.50,S*0.052,'#3E4A8E');
  hand(m*6,R*0.76,S*0.036,'#D9463F');
  g.fillStyle='#E8C25A'; g.beginPath(); g.arc(cx,cy,S*0.038,0,Math.PI*2); g.fill();
}

/* ---------- あいぼう かおアイコン ---------- */
function drawBuddyFace(cvs,idx){

  g.clearRect(0,0,S,S);

  /* みみ */
  g.fillStyle=body;
  if(B.ear==='cat'){
    g.beginPath(); g.moveTo(cx-R*0.86,cy-R*0.62); g.lineTo(cx-R*0.46,cy-R*1.42); g.lineTo(cx-R*0.10,cy-R*0.86); g.closePath(); g.fill();
    g.beginPath(); g.moveTo(cx+R*0.86,cy-R*0.62); g.lineTo(cx+R*0.46,cy-R*1.42); g.lineTo(cx+R*0.10,cy-R*0.86); g.closePath(); g.fill();
    g.fillStyle=acc;

    g.beginPath(); g.moveTo(cx+R*0.70,cy-R*0.72); g.lineTo(cx+R*0.48,cy-R*1.16); g.lineTo(cx+R*0.28,cy-R*0.82); g.closePath(); g.fill();

    g.beginPath(); g.ellipse(cx+R*0.94,cy-R*0.06,R*0.30,R*0.62,-0.30,0,Math.PI*2); g.fill();
  } else if(B.ear==='rabbit'){
    g.beginPath(); g.ellipse(cx-R*0.42,cy-R*1.26,R*0.22,R*0.66,0.14,0,Math.PI*2); g.fill();
    g.beginPath(); g.ellipse(cx+R*0.42,cy-R*1.26,R*0.22,R*0.66,-0.14,0,Math.PI*2); g.fill();
    g.fillStyle=acc;
    g.beginPath(); g.ellipse(cx-R*0.42,cy-R*1.24,R*0.11,R*0.46,0.14,0,Math.PI*2); g.fill();
    g.beginPath(); g.ellipse(cx+R*0.42,cy-R*1.24,R*0.11,R*0.46,-0.14,0,Math.PI*2); g.fill();
  } else {
    g.beginPath(); g.arc(cx-R*0.80,cy-R*0.72,R*0.34,0,Math.PI*2); g.fill();
    g.beginPath(); g.arc(cx+R*0.80,cy-R*0.72,R*0.34,0,Math.PI*2); g.fill();
    g.fillStyle=acc;
    g.beginPath(); g.arc(cx-R*0.80,cy-R*0.72,R*0.19,0,Math.PI*2); g.fill();
    g.beginPath(); g.arc(cx+R*0.80,cy-R*0.72,R*0.19,0,Math.PI*2); g.fill();
  }
  /* あたま */
  g.fillStyle=body; g.beginPath(); g.arc(cx,cy,R,0,Math.PI*2); g.fill();
  /* はな まわり */
  g.fillStyle=belly; g.beginPath(); g.ellipse(cx,cy+R*0.32,R*0.48,R*0.34,0,0,Math.PI*2); g.fill();
  /* め */
  g.fillStyle='#2A2028';
  g.beginPath(); g.arc(cx-R*0.36,cy-R*0.10,R*0.115,0,Math.PI*2); g.fill();
  g.beginPath(); g.arc(cx+R*0.36,cy-R*0.10,R*0.115,0,Math.PI*2); g.fill();
  g.fillStyle='#FFFFFF';
  g.beginPath(); g.arc(cx-R*0.32,cy-R*0.15,R*0.042,0,Math.PI*2); g.fill();
  g.beginPath(); g.arc(cx+R*0.40,cy-R*0.15,R*0.042,0,Math.PI*2); g.fill();
  /* はな */
  g.fillStyle='#5A4038';
  g.beginPath(); g.ellipse(cx,cy+R*0.20,R*0.10,R*0.075,0,0,Math.PI*2); g.fill();
  /* くち */
  g.strokeStyle='#5A4038'; g.lineWidth=R*0.055; g.lineCap='round';
  g.beginPath(); g.arc(cx-R*0.13,cy+R*0.32,R*0.15,0,Math.PI); g.stroke();
  g.beginPath(); g.arc(cx+R*0.13,cy+R*0.32,R*0.15,0,Math.PI); g.stroke();
  /* ほっぺ */
  g.fillStyle='rgba(255,140,160,0.42)';
  g.beginPath(); g.arc(cx-R*0.66,cy+R*0.22,R*0.17,0,Math.PI*2); g.fill();
  g.beginPath(); g.arc(cx+R*0.66,cy+R*0.22,R*0.17,0,Math.PI*2); g.fill();
}

/* ---------- おもいで シール ---------- */
function drawSticker(cvs,idx){
  var S=cvs.width, g=cvs.getContext('2d'), cx=S/2, cy=S/2, R=S*0.34;
  var d=STICKERS[idx]; if(!d) return;
  g.clearRect(0,0,S,S);

  /* シールの だいざ */
  g.save();
  var grd=g.createRadialGradient(cx-S*0.10,cy-S*0.12,S*0.04,cx,cy,S*0.46);
  grd.addColorStop(0,'#FFFFFF'); grd.addColorStop(1,'#FFE9C0');
  g.fillStyle=grd;
  g.beginPath();
  for(var i=0;i<24;i++){
    var a=i/24*Math.PI*2, rr=S*0.44+(i%2?S*0.028:0);
    var x=cx+Math.cos(a)*rr, y=cy+Math.sin(a)*rr;
    if(i===0) g.moveTo(x,y); else g.lineTo(x,y);
  }
  g.closePath(); g.fill();
  g.strokeStyle='#F0C468'; g.lineWidth=S*0.022; g.stroke();
  g.restore();

  var C=d.col;
  g.lineCap='round'; g.lineJoin='round';

  if(d.kind==='sun'||d.kind==='sunset'){
    var sky=(d.kind==='sunset');
    g.fillStyle=sky?'#FFB07A':'#FFE38A';
    g.beginPath(); g.arc(cx,cy+(sky?R*0.24:0),R*0.56,0,Math.PI*2); g.fill();
    g.strokeStyle=C; g.lineWidth=S*0.032;
    for(var s=0;s<10;s++){
      var sa=s/10*Math.PI*2;
      g.beginPath();
      g.moveTo(cx+Math.cos(sa)*R*0.72,cy+(sky?R*0.24:0)+Math.sin(sa)*R*0.72);
      g.lineTo(cx+Math.cos(sa)*R*0.98,cy+(sky?R*0.24:0)+Math.sin(sa)*R*0.98);
      g.stroke();
    }
    if(sky){ g.fillStyle='#8FBF7A'; g.fillRect(cx-R*1.05,cy+R*0.62,R*2.1,R*0.44); }
  } else if(d.kind==='alarm'){
    g.fillStyle=C; g.beginPath(); g.arc(cx-R*0.62,cy-R*0.60,R*0.24,0,Math.PI*2); g.fill();
    g.beginPath(); g.arc(cx+R*0.62,cy-R*0.60,R*0.24,0,Math.PI*2); g.fill();
    g.beginPath(); g.arc(cx,cy,R*0.78,0,Math.PI*2); g.fill();
    g.fillStyle='#FFFDF2'; g.beginPath(); g.arc(cx,cy,R*0.62,0,Math.PI*2); g.fill();
    g.strokeStyle='#4A3B32'; g.lineWidth=S*0.028;
    g.beginPath(); g.moveTo(cx,cy); g.lineTo(cx,cy-R*0.40); g.stroke();
    g.beginPath(); g.moveTo(cx,cy); g.lineTo(cx+R*0.32,cy+R*0.14); g.stroke();
  } else if(d.kind==='bread'){
    g.fillStyle=C;
    g.beginPath(); g.moveTo(cx-R*0.72,cy+R*0.62); g.lineTo(cx-R*0.72,cy-R*0.18);
    g.quadraticCurveTo(cx-R*0.72,cy-R*0.86,cx,cy-R*0.86);
    g.quadraticCurveTo(cx+R*0.72,cy-R*0.86,cx+R*0.72,cy-R*0.18);
    g.lineTo(cx+R*0.72,cy+R*0.62); g.closePath(); g.fill();
    g.fillStyle='#FFF0D0';
    g.beginPath(); g.moveTo(cx-R*0.52,cy+R*0.46); g.lineTo(cx-R*0.52,cy-R*0.10);
    g.quadraticCurveTo(cx-R*0.52,cy-R*0.62,cx,cy-R*0.62);
    g.quadraticCurveTo(cx+R*0.52,cy-R*0.62,cx+R*0.52,cy-R*0.10);
    g.lineTo(cx+R*0.52,cy+R*0.46); g.closePath(); g.fill();
  } else if(d.kind==='milk'){
    g.fillStyle='#F2F2F5';

    g.lineTo(cx,cy-R*0.86); g.lineTo(cx+R*0.46,cy-R*0.30); g.lineTo(cx+R*0.46,cy+R*0.78);
    g.closePath(); g.fill();
    g.fillStyle='#8FC7F5'; g.fillRect(cx-R*0.46,cy+R*0.16,R*0.92,R*0.30);
    g.fillStyle='#4A88C4'; g.beginPath(); g.arc(cx,cy-R*0.16,R*0.20,0,Math.PI*2); g.fill();
  } else if(d.kind==='bag'){

    g.quadraticCurveTo(cx-R*0.74,cy-R*0.62,cx-R*0.46,cy-R*0.62);

  } else if(d.kind==='note'){
    g.fillStyle=C; g.fillRect(cx-R*0.60,cy-R*0.80,R*1.20,R*1.60);

    g.fillStyle='#FF9FB5'; g.beginPath(); g.arc(cx,cy-R*0.20,R*0.13,0,Math.PI*2); g.fill();
  } else if(d.kind==='cake'){
    g.fillStyle='#F5E0C0'; g.fillRect(cx-R*0.66,cy-R*0.10,R*1.32,R*0.80);
    g.fillStyle=C;

    g.fillStyle='#E8465C'; g.beginPath(); g.arc(cx,cy-R*0.62,R*0.16,0,Math.PI*2); g.fill();
    g.strokeStyle='#5FBF6E'; g.lineWidth=S*0.020;
    g.beginPath(); g.moveTo(cx+R*0.10,cy-R*0.72); g.lineTo(cx+R*0.28,cy-R*0.86); g.stroke();
  } else if(d.kind==='juice'){
    g.fillStyle='rgba(255,255,255,0.85)';
    g.beginPath(); g.moveTo(cx-R*0.44,cy-R*0.72); g.lineTo(cx+R*0.44,cy-R*0.72);
    g.lineTo(cx+R*0.32,cy+R*0.76); g.lineTo(cx-R*0.32,cy+R*0.76); g.closePath(); g.fill();
    g.fillStyle=C;
    g.beginPath(); g.moveTo(cx-R*0.40,cy-R*0.40); g.lineTo(cx+R*0.40,cy-R*0.40);
    g.lineTo(cx+R*0.31,cy+R*0.72); g.lineTo(cx-R*0.31,cy+R*0.72); g.closePath(); g.fill();
    g.strokeStyle='#E8465C'; g.lineWidth=S*0.042;
    g.beginPath(); g.moveTo(cx+R*0.14,cy-R*0.62); g.lineTo(cx+R*0.44,cy-R*1.00); g.stroke();
  } else if(d.kind==='ball'){
    g.fillStyle='#FFFFFF'; g.beginPath(); g.arc(cx,cy,R*0.82,0,Math.PI*2); g.fill();

    g.beginPath(); g.arc(cx,cy,R*0.21,0,Math.PI*2); g.fill();

  } else if(d.kind==='duck'){

    g.beginPath(); g.arc(cx+R*0.10,cy,R*0.78,0,Math.PI*2); g.fill();
    g.globalCompositeOperation='destination-out';
    g.beginPath(); g.arc(cx+R*0.52,cy-R*0.24,R*0.66,0,Math.PI*2); g.fill();
    g.globalCompositeOperation='source-over';
    g.fillStyle='#FFF6C8';
    g.beginPath(); g.arc(cx+R*0.66,cy+R*0.60,R*0.10,0,Math.PI*2); g.fill();
    g.beginPath(); g.arc(cx+R*0.84,cy-R*0.62,R*0.075,0,Math.PI*2); g.fill();
  } else if(d.kind==='star'){
    g.fillStyle=C; g.beginPath();
    for(var sp=0;sp<10;sp++){
      var sa2=sp/10*Math.PI*2-Math.PI/2, rr2=(sp%2===0)?R*0.92:R*0.40;
      var sx=cx+Math.cos(sa2)*rr2, sy=cy+Math.sin(sa2)*rr2;
      if(sp===0) g.moveTo(sx,sy); else g.lineTo(sx,sy);
    }
    g.closePath(); g.fill();
    g.strokeStyle='#E8A33D'; g.lineWidth=S*0.022; g.stroke();
    g.fillStyle='rgba(255,255,255,0.65)';
    g.beginPath(); g.arc(cx-R*0.16,cy-R*0.22,R*0.16,0,Math.PI*2); g.fill();
  }
}
</script>
<script>
/* =======================================================================
   BGM
   ======================================================================= */
var bgm=null, bgmTheme='';
function initBGM(theme){
  if(typeof WakuwakuBGM==='undefined') return;
  try{
    if(bgm && bgmTheme===theme){ if(bgm.enabled) bgm.start(); return; }
    if(bgm){ try{ bgm.stop(); }catch(e){} }
    bgm=new WakuwakuBGM(theme); bgmTheme=theme;
    if(bgm.enabled) bgm.start();
  }catch(e){ bgm=null; }
}
function bgmToggle(){
  if(!bgm) return;
  try{
    var on=!bgm.enabled;
    bgm.setEnabled(on);
    if(on) bgm.start(); else bgm.stop();
    if(typeof WakuwakuBGM!=='undefined' && typeof WakuwakuBGM.saveState==='function'){
      WakuwakuBGM.saveState(on);
    }
  }catch(e){}
  updateBgmLabel();
}
function updateBgmLabel(){
  var on=bgm?bgm.enabled:false;
  var b2=$('btn-bgm2'); if(b2) b2.textContent=on?'おと ON':'おと OFF';
  var c=$('chip-bgm'); if(c) c.style.opacity=on?'1':'0.42';
}
/* こうかおん (BGM の しくみを つかわず かんたんに) */
var sfxCtx=null;
function sfx(kind){
  if(bgm && !bgm.enabled) return;
  try{
    if(!sfxCtx){ var AC=window.AudioContext||window.webkitAudioContext; if(!AC) return; sfxCtx=new AC(); }
    if(sfxCtx.state==='suspended') sfxCtx.resume();
    var seq = kind==='ok' ? [[784,0,0.10],[1047,0.09,0.10],[1319,0.18,0.20]]
            : kind==='ng' ? [[330,0,0.14],[247,0.13,0.22]]
            : kind==='star' ? [[1047,0,0.09],[1319,0.08,0.09],[1568,0.16,0.09],[2093,0.24,0.26]]
            : [[600,0,0.07]];
    for(var i=0;i<seq.length;i++){
      (function(s){
        var o=sfxCtx.createOscillator(), g=sfxCtx.createGain();
        o.type='triangle'; o.frequency.value=s[0];
        var t0=sfxCtx.currentTime+s[1];
        g.gain.setValueAtTime(0.0001,t0);
        g.gain.exponentialRampToValueAtTime(0.16,t0+0.012);
        g.gain.exponentialRampToValueAtTime(0.0001,t0+s[2]);
        o.connect(g); g.connect(sfxCtx.destination);
        o.start(t0); o.stop(t0+s[2]+0.03);
      })(seq[i]);
    }
  }catch(e){}
}

/* =======================================================================
   がめん せいぎょ
   ======================================================================= */
var SCREENS=['s-title','s-buddy','s-map','s-intro','s-clear','s-book'];
function showScreen(id){
  for(var i=0;i<SCREENS.length;i++){
    var el=$(SCREENS[i]); if(el) el.className='screen'+(SCREENS[i]===id?' on':'');
  }
  var play=(id===null);
  $('hud').className=play?'on':'';
  $('qbar').className=(play&&G.qType)?'on':'';
  $('ans').className=(play&&G.qType)?'on':'';
}
function hidePlayUI(){ $('hud').className=''; $('qbar').className=''; $('ans').className=''; }

/* =======================================================================
   ゲーム じょうたい
   ======================================================================= */
var G={
  stage:0, qIdx:0, qTotal:5, miss:0,
  qType:null, target:null, shown:null,
  answered:false, dragging:null, tmpH:12, tmpM:0,
  playing:false, pendingBuddy:0
};

/* 5もん の しゅつだい パターン */
var QPAT=[
  ['A','A','C','B','A'],
  ['A','C','A','B','C'],
  ['A','B','C','A','B'],
  ['C','A','B','A','B'],
  ['A','B','C','B','A'],
  ['B','A','C','A','B'],
  ['A','C','B','A','B'],
  ['B','C','A','B','A']
];

function stageUnlocked(i){ return i===0 || SV.stars[i-1]>0; }

/* ---------- ステージ かいし ---------- */
function startStage(i){
  G.stage=i; G.qIdx=0; G.miss=0; G.qType=null; G.answered=false;
  buildWorld(i);
  var st=STAGES[i];
  applyHands(h12(st.h),st.m,false);
  initBGM(st.bgm);
  updateBgmLabel();
  $('intro-time').textContent=labelOf(st.h,st.m);
  $('intro-place').textContent=st.place.split('・')[1]||st.short;
  $('intro-tip').innerHTML=st.tip;
  showScreen('s-intro');
}

function beginQuestions(){
  G.playing=true;
  G.qIdx=0; G.miss=0;
  showScreen(null);
  nextQuestion();
}

function updateHud(){
  var shown=Math.min(G.qIdx+1,G.qTotal);
  $('chip-prog').textContent=shown+' / '+G.qTotal;
  $('bar-fill').style.width=(Math.min(G.qIdx,G.qTotal)/G.qTotal*100)+'%';
}

/* ---------- もんだい せいせい ---------- */
function nextQuestion(){
  if(G.qIdx>=G.qTotal){ finishStage(); return; }
  G.answered=false; G.dragging=null;
  var st=STAGES[G.stage];
  var type=(QPAT[G.stage]||QPAT[0])[G.qIdx]||'A';
  G.qType=type;
  updateHud();

  var t=(G.qIdx===0)?stageOwnTime(st):genTime(st);
  G.target=t;

  if(type==='A') setupTypeA(st,t);
  else if(type==='B') setupTypeB(st,t);
  else setupTypeC(st,t);

  $('qbar').className='on';
  $('ans').className='on';
}

/* --- A: とけいを よむ (4たく) --- */
function setupTypeA(st,t){
  if(clockGrp) clockGrp.visible=true;
  applyHands(t.h,t.m,true);
  $('qtext').innerHTML='いま <b>なんじ</b>かな？';

  var opts=[{h:t.h,m:t.m}];
  var guard=0;
  while(opts.length<4 && guard<200){
    guard++;
    var c=genTime(st);
    /* にている まちがい を まぜる */
    if(guard%3===0){ c={h:t.h,m:(t.m+st.step)%60}; if(st.step>=60) c={h:(t.h%12)+1,m:0}; }
    if(guard%5===0){ c={h:(t.h%12)+1,m:t.m}; }
    var dup=false;
    for(var i=0;i<opts.length;i++){ if(sameTime(opts[i],c)) dup=true; }
    if(!dup) opts.push(c);
  }
  shuffle(opts);

  var html='<div class="ans-grid">';
  for(var k=0;k<opts.length;k++){
    html+='<button class="btn ans-btn" data-h="'+opts[k].h+'" data-m="'+opts[k].m+'">'+labelOf(opts[k].h,opts[k].m)+'</button>';
  }
  html+='</div>';
  $('ans-inner').innerHTML=html;
  var btns=$('ans-inner').querySelectorAll('.ans-btn');
  for(var b=0;b<btns.length;b++){
    btns[b].addEventListener('click',onAnswerA);
  }
}
function onAnswerA(ev){
  if(G.answered) return;
  G.answered=true;
  var el=ev.currentTarget;
  var h=Number(el.getAttribute('data-h')), m=Number(el.getAttribute('data-m'));
  var ok=(h===G.target.h && m===G.target.m);
  var btns=$('ans-inner').querySelectorAll('.ans-btn');
  for(var i=0;i<btns.length;i++){
    btns[i].disabled=true;
    var bh=Number(btns[i].getAttribute('data-h')), bm=Number(btns[i].getAttribute('data-m'));
    if(bh===G.target.h && bm===G.target.m) btns[i].className='btn ans-btn ok';
    else if(btns[i]===el) btns[i].className='btn ans-btn ng';
  }
  resolveAnswer(ok);
}

/* せいかいとは ちがう ゆうこうな めもりを えらぶ (30ぷんステージでも かならず ちがう いちから はじまる) */
function pickWrongMinute(targetM,step){
  if(step>=60) return 0;
  var vals=[];
  for(var m=0;m<60;m+=step){ if(m!==targetM) vals.push(m); }
  if(!vals.length) return targetM;
  return vals[randInt(0,vals.length-1)];
}
/* --- B: はりを あわせる --- */
function setupTypeB(st,t){
  if(clockGrp) clockGrp.visible=true;
  /* スタートいち は こたえ から はなす */
  var sh=(t.h+randInt(3,8))%12; if(sh===0) sh=12;
  var sm=pickWrongMinute(t.m,st.step);
  G.tmpH=sh; G.tmpM=sm;
  applyHands(sh,sm,true);
  $('qtext').innerHTML='はりを うごかして<br><b>'+labelOf(t.h,t.m)+'</b> に してね！';
  $('ans-inner').innerHTML=
    '<div id="hint-drag">はりの まるい ところを ゆびで まわそう</div>'+
    '<button class="btn" id="btn-submit">できた！</button>';
  $('btn-submit').addEventListener('click',onSubmitB);
}
function onSubmitB(){
  if(G.answered) return;
  G.answered=true;
  var ok=(G.tmpH===G.target.h && G.tmpM===G.target.m);
  var sb=$('btn-submit');
  if(sb) sb.disabled=true;
  if(!ok){
    /* せいかいを みせる */
    setTimeout(function(){ applyHands(G.target.h,G.target.m,true); },420);
  }
  resolveAnswer(ok);
}

/* --- C: 3つの とけい から えらぶ --- */
function setupTypeC(st,t){
  if(clockGrp) clockGrp.visible=false;
  $('qtext').innerHTML='<b>'+labelOf(t.h,t.m)+'</b> の とけいは どれ？';

  var opts=[{h:t.h,m:t.m}];
  var guard=0;
  while(opts.length<3 && guard<200){
    guard++;
    var c=genTime(st);
    if(guard%2===0){ c={h:(t.h%12)+1,m:t.m}; }
    if(guard%4===0 && st.step<60){ c={h:t.h,m:(t.m+st.step*randInt(1,2))%60}; }
    var dup=false;
    for(var i=0;i<opts.length;i++){ if(sameTime(opts[i],c)) dup=true; }
    if(!dup) opts.push(c);
  }
  shuffle(opts);

  var html='<div class="clock-grid">';
  for(var k=0;k<opts.length;k++){
    html+='<div class="clock-pick" data-h="'+opts[k].h+'" data-m="'+opts[k].m+'">'+
          '<canvas width="200" height="200"></canvas></div>';
  }
  html+='</div>';
  $('ans-inner').innerHTML=html;
  var cells=$('ans-inner').querySelectorAll('.clock-pick');
  for(var c2=0;c2<cells.length;c2++){
    drawMiniClock(cells[c2].querySelector('canvas'),
      Number(cells[c2].getAttribute('data-h')),Number(cells[c2].getAttribute('data-m')));
    cells[c2].addEventListener('click',onAnswerC);
  }
}
function onAnswerC(ev){
  if(G.answered) return;
  G.answered=true;
  var el=ev.currentTarget;
  var h=Number(el.getAttribute('data-h')), m=Number(el.getAttribute('data-m'));
  var ok=(h===G.target.h && m===G.target.m);
  var cells=$('ans-inner').querySelectorAll('.clock-pick');
  for(var i=0;i<cells.length;i++){
    var bh=Number(cells[i].getAttribute('data-h')), bm=Number(cells[i].getAttribute('data-m'));
    if(bh===G.target.h && bm===G.target.m) cells[i].className='clock-pick ok';
    else if(cells[i]===el) cells[i].className='clock-pick ng';
  }
  /* 3Dとけい で せいかい を みせる */
  if(clockGrp){
    clockGrp.visible=true;
    clockGrp.scale.setScalar(0.001);
    clockGrp.userData.popIn=1;
    applyHands(G.target.h,G.target.m,false);
  }
  resolveAnswer(ok);
}

/* ---------- はんてい ---------- */
function resolveAnswer(ok){
  if(!ok) G.miss++;
  sfx(ok?'ok':'ng');
  if(buddyObj) buddyObj.userData.react=ok?1.0:-1.0;
  var j=$('judge'), jt=$('judge-txt');
  jt.textContent=ok?'せいかい！':'おしい！';
  jt.style.color=ok?'#8CE6A0':'#FFC46A';
  j.className='on';
  jt.style.animation='none';
  void jt.offsetWidth;
  jt.style.animation='';
  setTimeout(function(){
    j.className='';
    G.qIdx++;
    updateHud();
    setTimeout(nextQuestion,180);
  },ok?900:1350);
}

/* ---------- ステージ クリア ---------- */
function finishStage(){
  G.playing=false; G.qType=null;
  hidePlayUI();
  var stars=(G.miss===0)?3:((G.miss===1)?2:1);
  var prev=SV.stars[G.stage]||0;
  if(stars>prev) SV.stars[G.stage]=stars;

  /* シール（つうじょう＋★3ボーナスの さいだい2まいを どうじに あつめる） */
  var gotIdxs=[];
  var base=G.stage*2;
  if(!SV.stickers[base]){ SV.stickers[base]=1; gotIdxs.push(base); }
  if(stars===3 && !SV.stickers[base+1]){ SV.stickers[base+1]=1; gotIdxs.push(base+1); }
  saveNow();

  $('clr-title').textContent=(stars===3)?'かんぺき！':'クリア！';
  var sh='';
  for(var i=0;i<3;i++){
    sh+='<span style="animation-delay:'+(0.14+i*0.22)+'s" class="'+(i<stars?'':'off')+'">★</span>';
  }
  $('clr-stars').innerHTML=sh;

  var sc=$('clr-sticker');
  if(gotIdxs.length>0){
    sc.className='clr-sticker on'+(gotIdxs.length>1?' two':'');
    sc.innerHTML='';
    for(var gi=0;gi<gotIdxs.length;gi++){
      var wrap=document.createElement('div');
      wrap.className='clr-sticker-item';
      wrap.style.animationDelay=(gi*0.16)+'s';
      var cvv=document.createElement('canvas');
      cvv.width=220; cvv.height=220;
      wrap.appendChild(cvv);
      sc.appendChild(wrap);
      drawSticker(cvv,gotIdxs[gi]);
    }
    if(gotIdxs.length>1){
      $('clr-got').textContent='シールを 2まい ゲット！';
    } else {
      $('clr-got').textContent='「'+STICKERS[gotIdxs[0]].n+'」の シールを ゲット！';
    }
  } else {
    sc.className='clr-sticker';
    sc.innerHTML='';
    $('clr-got').textContent='';
  }

  var msg;
  if(stars===3) msg='ぜんもん せいかい！<br>とけいマスターだね！';
  else if(stars===2) msg='とっても じょうず！<br>もういちど やると ★3 かも？';
  else msg='さいごまで がんばったね！<br>くりかえすと きっと できるよ。';
  $('clr-msg').innerHTML=msg;

  var isLast=(G.stage>=STAGES.length-1);
  $('btn-clr-next').textContent=isLast?'ちずへ':'つぎへ';

  setTimeout(function(){ sfx('star'); },260);
  showScreen('s-clear');
}

/* =======================================================================
   ステージセレクト / ずかん
   ======================================================================= */
function renderMap(){
  var html='';
  for(var i=0;i<STAGES.length;i++){
    var st=STAGES[i], un=stageUnlocked(i);
    var stars='';
    for(var s=0;s<3;s++) stars+='<span class="'+(s<(SV.stars[i]||0)?'':'off')+'">★</span>';
    var c1=st.sky[0], c2=st.sky[1];
    html+='<div class="map-row'+(un?'':' lock')+'" data-i="'+i+'">'+
      '<div class="map-icon" style="background:linear-gradient(150deg,'+c1+','+c2+')"></div>'+
      '<div class="map-txt">'+
        '<div class="map-time">'+(un?labelOf(st.h,st.m):'？？')+'</div>'+
        '<div class="map-name">'+(un?st.short:'まだ ひみつ')+'</div>'+
      '</div>'+
      '<div class="map-stars">'+stars+'</div>'+
    '</div>';
  }
  $('map-list').innerHTML=html;
  var rows=$('map-list').querySelectorAll('.map-row');
  for(var r=0;r<rows.length;r++){
    rows[r].addEventListener('click',function(ev){
      var i=Number(ev.currentTarget.getAttribute('data-i'));
      if(!stageUnlocked(i)) return;
      sfx('tap');
      startStage(i);
    });
  }
}

function renderBook(){
  var got=0;
  for(var k in SV.stickers){ if(SV.stickers[k]) got++; }
  $('book-count').textContent=got+' / '+STICKERS.length+' まい あつめたよ';
  var html='';
  for(var i=0;i<STICKERS.length;i++){
    if(SV.stickers[i]) html+='<div class="book-cell got"><canvas width="150" height="150" data-i="'+i+'"></canvas></div>';
    else html+='<div class="book-cell"><span class="book-q">？</span></div>';
  }
  $('book-grid').innerHTML=html;
  var cvs=$('book-grid').querySelectorAll('canvas');
  for(var c=0;c<cvs.length;c++){ drawSticker(cvs[c],Number(cvs[c].getAttribute('data-i'))); }
}

function renderBuddyPick(){
  var html='';
  for(var i=0;i<BUDDIES.length;i++){
    html+='<div class="buddy-card'+(i===G.pendingBuddy?' sel':'')+'" data-i="'+i+'">'+
      '<canvas width="180" height="180"></canvas>'+
      '<div class="buddy-name">'+BUDDIES[i].name+'</div></div>';
  }
  $('buddy-grid').innerHTML=html;
  var cards=$('buddy-grid').querySelectorAll('.buddy-card');
  for(var c=0;c<cards.length;c++){
    drawBuddyFace(cards[c].querySelector('canvas'),Number(cards[c].getAttribute('data-i')));
    cards[c].addEventListener('click',function(ev){
      G.pendingBuddy=Number(ev.currentTarget.getAttribute('data-i'));
      sfx('tap');
      renderBuddyPick();
    });
  }
}
</script>
<script>
/* =======================================================================
   はりの ドラッグそうさ
   ======================================================================= */
var hitPlane=null, raycaster=null, ptr=null;
if(THREE_OK){ raycaster=new THREE.Raycaster(); ptr=new THREE.Vector2(); }

function makeHitPlane(){
  var m=new THREE.Mesh(new THREE.PlaneGeometry(CLOCK_R*2.4,CLOCK_R*2.4),
    new THREE.MeshBasicMaterial({visible:false}));
  m.position.z=0.32;
  return m;
}

function pointerToLocal(ev){
  if(!THREE_OK||!raycaster||!clockGrp) return null;
  var r=cv.getBoundingClientRect();
  ptr.x=((ev.clientX-r.left)/r.width)*2-1;
  ptr.y=-((ev.clientY-r.top)/r.height)*2+1;
  raycaster.setFromCamera(ptr,camera);
  var hits=raycaster.intersectObject(hitPlane,false);
  if(!hits.length) return null;
  var p=hits[0].point.clone();
  clockGrp.worldToLocal(p);
  return p;
}
/* とけい かくど (0=12のいち, とけいまわり) */
function localToDeg(p){
  var d=Math.atan2(p.x,p.y)*180/Math.PI;
  if(d<0) d+=360;
  return d;
}

/* いま つかんでいる1本の pointerId だけを おいかける（マルチタッチの まざりを ふせぐ） */
var activePointerId=null;
function onDown(ev){
  if(!THREE_OK || !G.playing || G.qType!=='B' || G.answered) return;
  if(activePointerId!==null) return;
  var p=pointerToLocal(ev);
  if(!p) return;
  var r=Math.sqrt(p.x*p.x+p.y*p.y);
  if(r>CLOCK_R*1.05) return;
  ev.preventDefault();
  activePointerId=ev.pointerId;
  try{ cv.setPointerCapture(ev.pointerId); }catch(e){}
  /* どちらの はり？ = つまみ に ちかい ほう */
  var radH=((G.tmpH%12)*30+G.tmpM*0.5)*Math.PI/180;
  var radM=(G.tmpM*6)*Math.PI/180;
  var hx=Math.sin(radH)*GRIP_H, hy=Math.cos(radH)*GRIP_H;
  var mx=Math.sin(radM)*GRIP_M, my=Math.cos(radM)*GRIP_M;
  var dH=Math.sqrt((p.x-hx)*(p.x-hx)+(p.y-hy)*(p.y-hy));
  var dM=Math.sqrt((p.x-mx)*(p.x-mx)+(p.y-my)*(p.y-my));
  var NEAR=CLOCK_R*0.40;
  if(dH<NEAR||dM<NEAR) G.dragging=(dH<=dM)?'H':'M';
  else G.dragging=(r>CLOCK_R*0.60)?'M':'H';
  onMove(ev);
}
function onMove(ev){
  if(!THREE_OK || !G.dragging || G.qType!=='B' || G.answered) return;
  if(activePointerId!==null && ev.pointerId!==activePointerId) return;
  var p=pointerToLocal(ev);
  if(!p) return;
  ev.preventDefault();
  var deg=localToDeg(p);
  var st=STAGES[G.stage];
  if(G.dragging==='H'){
    var hr=Math.round(deg/30)%12;
    G.tmpH=(hr===0)?12:hr;
  } else {
    var step=(st.step>=60)?60:st.step;
    var mn=Math.round(deg/6);
    if(step>=60){ G.tmpM=0; }
    else { G.tmpM=(Math.round(mn/step)*step)%60; }
  }
  applyHands(G.tmpH,G.tmpM,true);
}
function onUp(ev){
  if(ev && activePointerId!==null && ev.pointerId!==activePointerId) return;
  if(ev){ try{ cv.releasePointerCapture(ev.pointerId); }catch(e){} }
  activePointerId=null;
  G.dragging=null;
}

cv.addEventListener('pointerdown',onDown,{passive:false});
cv.addEventListener('pointermove',onMove,{passive:false});
cv.addEventListener('pointerup',onUp);
cv.addEventListener('pointercancel',onUp);

/* =======================================================================
   レンダーループ
   ======================================================================= */
var clock3=THREE_OK?new THREE.Clock():null;
var titleMode=true;

function lerpAngle(cur,tgt,k){
  var d=tgt-cur;
  while(d>Math.PI) d-=Math.PI*2;
  while(d<-Math.PI) d+=Math.PI*2;
  return cur+d*k;
}

function tick(){
  if(!THREE_OK) return;
  requestAnimationFrame(tick);
  var dt=Math.min(clock3.getDelta(),0.1);
  var t=clock3.getElapsedTime();

  /* はり の なめらか いどう */
  if(handH && handH.userData.tgt!==undefined){
    handH.rotation.z=lerpAngle(handH.rotation.z,handH.userData.tgt,Math.min(1,dt*13));
    handM.rotation.z=lerpAngle(handM.rotation.z,handM.userData.tgt,Math.min(1,dt*13));
  }

  /* とけい の ゆれ / ポップイン */
  if(clockGrp){
    if(clockGrp.userData.popIn){
      var s=clockGrp.scale.x+(1-clockGrp.scale.x)*Math.min(1,dt*9);
      if(s>0.995){ s=1; clockGrp.userData.popIn=0; }
      clockGrp.scale.setScalar(s);
    }
    if(titleMode){
      clockGrp.rotation.y=Math.sin(t*0.42)*0.30;
      clockGrp.position.y=CLOCK_Y+Math.sin(t*1.05)*0.075;
    } else {
      clockGrp.rotation.y+= (0-clockGrp.rotation.y)*Math.min(1,dt*5);
      clockGrp.position.y=CLOCK_Y+Math.sin(t*1.3)*0.030;
    }
  }

  /* しーん アニメ */
  for(var i=0;i<animProps.length;i++){
    var a=animProps[i];
    if(a.kind==='drift'){
      a.o.position.x+=a.sp*dt;
      if(a.o.position.x>a.lim) a.o.position.x=-a.lim;
    } else if(a.kind==='twinkle'){
      var v=0.55+0.45*Math.sin(t*2.2+a.ph);
      if(a.o.material) a.o.material.color.setRGB(1,0.98,0.80+0.20*v);
      a.o.scale.setScalar(0.75+0.45*v);
    } else if(a.kind==='swing'){
      a.o.rotation.x=Math.sin(t*1.35)*0.34;
    } else if(a.kind==='float'){
      a.o.position.y=a.y0+Math.sin(t*1.6+a.ph)*0.085;
      a.o.rotation.y=Math.sin(t*0.8+a.ph)*0.28;
    }
  }

  /* あいぼう */
  if(buddyObj){
    var ud=buddyObj.userData;
    var bob=Math.sin(t*2.1)*0.045;
    if(ud.react>0){
      ud.react-=dt*1.25;
      var j=Math.abs(Math.sin(t*11))*0.30*Math.max(0,ud.react);
      buddyObj.position.y=j;
      if(ud.head) ud.head.rotation.z=Math.sin(t*13)*0.16*Math.max(0,ud.react);
      if(ud.armL) ud.armL.position.y=0.58+j*0.9;
      if(ud.armR) ud.armR.position.y=0.58+j*0.9;
      if(ud.react<=0) ud.react=0;
    } else if(ud.react<0){
      ud.react+=dt*1.25;
      if(ud.head) ud.head.rotation.y=Math.sin(t*9)*0.30*Math.min(1,-ud.react);
      buddyObj.position.y=0;
      if(ud.react>=0){ ud.react=0; if(ud.head) ud.head.rotation.y=0; }
    } else {
      buddyObj.position.y=0;
      if(ud.head){ ud.head.rotation.z=0; ud.head.rotation.y=Math.sin(t*0.55)*0.14; ud.head.position.y=1.02+bob; }
      if(ud.armL) ud.armL.position.y=0.58+bob*0.6;
      if(ud.armR) ud.armR.position.y=0.58-bob*0.6;
    }
  }

  renderer.render(scene,camera);
}

$('btn-map-book').addEventListener('click',function(){ sfx('tap'); bookFrom='s-map'; renderBook(); showScreen('s-book'); });
$('btn-book-close').addEventListener('click',function(){ sfx('tap'); showScreen(bookFrom); });
$('btn-map-title').addEventListener('click',function(){
  sfx('tap'); titleMode=true; showScreen('s-title'); showRealTime();
});
$('btn-intro-go').addEventListener('click',function(){ sfx('tap'); titleMode=false; beginQuestions(); });
$('chip-back').addEventListener('click',function(){
  sfx('tap'); G.playing=false; G.qType=null; hidePlayUI();
  if(clockGrp){ clockGrp.visible=true; clockGrp.scale.setScalar(1); }
  renderMap(); showScreen('s-map');
});
$('btn-clr-retry').addEventListener('click',function(){ sfx('tap'); startStage(G.stage); });
$('btn-clr-next').addEventListener('click',function(){
  sfx('tap');
  if(G.stage>=STAGES.length-1){ renderMap(); showScreen('s-map'); }
  else { startStage(G.stage+1); }
});
$('chip-bgm').addEventListener('click',function(){ bgmToggle(); });
$('btn-bgm2').addEventListener('click',function(){
  if(!bgm) initBGM('cute');
  bgmToggle();
});

/* さいしょの タップで オーディオを かいきん */
function unlockAudio(){
  try{
    if(!bgm) initBGM('cute');
    if(bgm && bgm.enabled) bgm.start();
    if(sfxCtx && sfxCtx.state==='suspended') sfxCtx.resume();
  }catch(e){}
  updateBgmLabel();
  window.removeEventListener('pointerdown',unlockAudio);
}
window.addEventListener('pointerdown',unlockAudio);

/* =======================================================================
   しょきか
   ======================================================================= */
function showRealTime(){
  var now=new Date();
  applyHands(h12(now.getHours()),now.getMinutes(),true);
}

function init(){
  clockGrp=buildClock();
  hitPlane=makeHitPlane();
  clockGrp.add(hitPlane);
  scene.add(clockGrp);

  buildWorld(0);
  resize();
  showRealTime();
  updateBgmLabel();
  showScreen('s-title');
  tick();
}
/* もじばん など Canvas への fillText は Webフォントの よみこみ かんりょうを
   まってから おこなう（にどおきどうは しない） */
var booted=false;
function boot(){
  if(booted) return;
  booted=true;
  if(!THREE_OK) return;
  init();
}
if(document.fonts && document.fonts.ready){
  document.fonts.ready.then(boot)['catch'](boot);
} else {
  boot();
}
