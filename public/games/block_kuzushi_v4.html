<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>おしろブロックくずし</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DotGothic16&display=swap" rel="stylesheet">
<style>
  :root{
    --sat: env(safe-area-inset-top, 0px);
    --sab: env(safe-area-inset-bottom, 0px);
    --sal: env(safe-area-inset-left, 0px);
    --sar: env(safe-area-inset-right, 0px);
  }
  *{ margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body{
    width:100%; height:100%; overflow:hidden;
    background:#120a26; font-family:'DotGothic16',sans-serif;
    user-select:none; -webkit-user-select:none; touch-action:none;
  }
  #wrap{ position:fixed; inset:0; display:flex; align-items:center; justify-content:center;
    background:radial-gradient(circle at 50% 20%, #2a1a52, #0e0820); }
  canvas{ display:block; touch-action:none;
    box-shadow:0 0 0 3px #ffffff22, 0 12px 50px #000a; border-radius:10px; }
  .ui-btn{
    position:fixed; z-index:9999; width:48px; height:48px; border:none; border-radius:14px;
    font-size:24px; line-height:1; cursor:pointer; touch-action:manipulation;
    background:linear-gradient(#fff,#e8ecff); color:#333;
    box-shadow:0 4px 0 #00000044, inset 0 2px 0 #fff; font-family:inherit;
    display:flex; align-items:center; justify-content:center;
  }
  .ui-btn:active{ transform:translateY(3px); box-shadow:0 1px 0 #00000044; }
  #homeBtn{ top:calc(var(--sat) + 10px); left:calc(var(--sal) + 10px); }
  #bgmBtn{ top:calc(var(--sat) + 10px); right:calc(var(--sar) + 10px); }
  #bgmBtn.off{ background:#9a93b5; color:#574f73; }
</style>
</head>
<body>
<div id="wrap"><canvas id="cv"></canvas></div>
<button id="homeBtn" class="ui-btn" aria-label="ホーム">🏠</button>
<button id="bgmBtn" class="ui-btn" aria-label="BGM">🔊</button>
<script src="/games/safe_area.js"></script>
<script src="/games/wakuwaku_bgm.js"></script>
<script>
(function(){
  "use strict";
  const SAFE_LS = (function () {
    try {
      const testKey = "__ww_storage_test__";
      localStorage.setItem(testKey, testKey);
      localStorage.removeItem(testKey);
      return localStorage;
    } catch (e) {
      const memory = {};

      return {
        getItem(key) {
          return Object.prototype.hasOwnProperty.call(memory, key)
            ? memory[key]
            : null;
        },

        setItem(key, value) {
          memory[key] = String(value);
        },

        removeItem(key) {
          delete memory[key];
        }
      };
    }
  })();
  const LW = 480, LH = 720;
  const cv = document.getElementById('cv');
  const ctx = cv.getContext('2d');
  let scale = 1, dpr = Math.min(window.devicePixelRatio||1, 2);

  function resize(){
    const aw = window.innerWidth, ah = window.innerHeight;
    scale = Math.min(aw/LW, ah/LH);
    cv.style.width = (LW*scale)+'px';
    cv.style.height = (LH*scale)+'px';
    cv.width = Math.round(LW*scale*dpr);
    cv.height = Math.round(LH*scale*dpr);
    ctx.setTransform(scale*dpr,0,0,scale*dpr,0,0);
    ctx.imageSmoothingEnabled = true;
  }
  window.addEventListener('resize', resize); resize();

  /* ---------- SFX ---------- */
  let AC = null;
  function ac(){ if(!AC){ try{ AC = new (window.AudioContext||window.webkitAudioContext)(); }catch(e){} } return AC; }
  function blip(f, d, type, vol){
    const a = ac(); if(!a) return;
    try{
      const o=a.createOscillator(), g=a.createGain();
      o.type=type||'square'; o.frequency.value=f;
      g.gain.setValueAtTime(vol||0.15, a.currentTime);
      g.gain.exponentialRampToValueAtTime(0.0001, a.currentTime+d);
      o.connect(g); g.connect(a.destination);
      o.start(); o.stop(a.currentTime+d);
    }catch(e){}
  }
  const sfx = {
    hit:  ()=>blip(520,0.06,'square',0.13),
    hard: ()=>blip(300,0.07,'square',0.15),
    gold: ()=>blip(180,0.06,'square',0.12),
    pad:  ()=>blip(400,0.05,'triangle',0.16),
    wall: ()=>blip(260,0.04,'triangle',0.1),
    item: ()=>{blip(700,0.08,'triangle',0.2);setTimeout(()=>blip(950,0.12,'triangle',0.2),80);},
    chest:()=>{blip(600,0.07,'triangle',0.18);setTimeout(()=>blip(800,0.07,'triangle',0.18),70);setTimeout(()=>blip(1050,0.1,'triangle',0.18),140);},
    miss: ()=>{blip(300,0.15,'sawtooth',0.14);setTimeout(()=>blip(200,0.2,'sawtooth',0.12),120);},
    clear:()=>{[660,830,990,1320].forEach((f,i)=>setTimeout(()=>blip(f,0.14,'triangle',0.2),i*110));},
    boss: ()=>blip(150,0.12,'sawtooth',0.16),
    bhit: ()=>blip(440,0.08,'sawtooth',0.15),
    win:  ()=>{[520,660,780,1040,1320].forEach((f,i)=>setTimeout(()=>blip(f,0.16,'triangle',0.22),i*130));},
    sel:  ()=>blip(760,0.06,'triangle',0.18)
  };

  /* ---------- BGM ---------- */
  let bgm = null, bgmOn = true;
  function initBgm(){
    if(typeof WakuwakuBGM !== 'undefined'){
      try{
        bgm = new WakuwakuBGM('sky');
        bgmOn = WakuwakuBGM.loadState();
      }catch(e){ bgm=null; }
    }
    updateBgmBtn();
  }
  function startBgm(){ if(bgm && bgmOn){ try{ bgm.start(); }catch(e){} } }
  function stopBgm(){ if(bgm){ try{ bgm.stop(); }catch(e){} } }
  function updateBgmBtn(){
    const b=document.getElementById('bgmBtn');
    b.textContent = bgmOn ? '🔊' : '🔇';
    b.classList.toggle('off', !bgmOn);
  }
  document.getElementById('bgmBtn').addEventListener('click', ()=>{
    bgmOn = !bgmOn;
    if(typeof WakuwakuBGM !== 'undefined'){ try{ WakuwakuBGM.saveState(bgmOn); }catch(e){} }
    if(bgmOn){ startBgm(); } else { stopBgm(); }
    updateBgmBtn();
  });
  document.getElementById('homeBtn').addEventListener('click', ()=>{
    stopBgm();
    if(window.parent!==window) window.parent.postMessage({type:'goBack'},'*');
    else history.back();
  });
  initBgm();

  /* ---------- 進捗 ---------- */
  const SAVE_KEY = 'block_v4_progress';
  function loadProg(){
    try{
      const p = JSON.parse(SAFE_LS.getItem(SAVE_KEY)||'{}');
      return { stars: Array.isArray(p.stars)?p.stars:[0,0,0,0,0], char: p.char|0 };
    }catch(e){ return { stars:[0,0,0,0,0], char:0 }; }
  }
  function saveProg(){
    try{ SAFE_LS.setItem(SAVE_KEY, JSON.stringify(prog)); }catch(e){}
  }
  let prog = loadProg();
  function unlockedStages(){
    let n=1;
    for(let i=0;i<4;i++){ if(prog.stars[i]>0) n=i+2; else break; }
    return Math.min(n,5);
  }

  /* ---------- ステージ定義 ---------- */
  const STAGES = [
    { name:'くさはらのしろ', sky1:'#8fd7ff', sky2:'#d9f7d0', ground:'#7ec96b', accent:'#4caf50',
      block:['#a5d66f','#7cb84a'], hard:['#8a6f4d','#6b543a'],
      boss:{ name:'スライムキング', hp:12, col1:'#7ee07e', col2:'#3f9e3f' } },
    { name:'ゆきのしろ', sky1:'#a9c8f5', sky2:'#e8f2ff', ground:'#e6f0fa', accent:'#64b5f6',
      block:['#bcdcf7','#8ab7e0'], hard:['#7f9bc2','#5c76a0'],
      boss:{ name:'ゆきだるまおう', hp:16, col1:'#ffffff', col2:'#bcd6ee' } },
    { name:'おかしのしろ', sky1:'#ffd7ec', sky2:'#fff2d9', ground:'#f7b3d0', accent:'#f06292',
      block:['#ffb1cf','#f57fab'], hard:['#c98862','#a56a48'],
      boss:{ name:'ケーキゴーレム', hp:20, col1:'#ffd0e2', col2:'#c76a92' } },
    { name:'うみのしろ', sky1:'#66c6e8', sky2:'#bdf0ef', ground:'#4fb3c9', accent:'#26a69a',
      block:['#79d9d0','#43ada4'], hard:['#5e84a8','#43617e'],
      boss:{ name:'タコのまじゅつし', hp:24, col1:'#e88bd0', col2:'#a84f92' } },
    { name:'まおうのしろ', sky1:'#4a3a7a', sky2:'#241a45', ground:'#3a2f5e', accent:'#9575cd',
      block:['#a48ae0','#7a5fc0'], hard:['#5f5378','#453a5c'],
      boss:{ name:'ドラゴンキング', hp:30, col1:'#e05a5a', col2:'#8e2f2f' } }
  ];
  const ROUNDS = 3; // ボス前のラウンド数

  /* ---------- キャラクター ---------- */
  const CHARS = [
    { name:'ねこナイト',   desc:'バランスがた',      col:'#ffb74d', ear:'cat',    padBonus:0,  lifeBonus:1, slow:1,    itemUp:0 },
    { name:'うさぎガード', desc:'たてが おおきい',   col:'#f8bbd0', ear:'rabbit', padBonus:18, lifeBonus:0, slow:1,    itemUp:0 },
    { name:'ぱんだへいし', desc:'ボールが ゆっくり', col:'#eeeeee', ear:'panda',  padBonus:0,  lifeBonus:0, slow:0.88, itemUp:0 },
    { name:'かえるまほう', desc:'アイテム いっぱい', col:'#aed581', ear:'frog',   padBonus:0,  lifeBonus:0, slow:1,    itemUp:0.12 }
  ];

  /* ---------- 状態 ---------- */
  let state = 'title';   // title / charsel / map / play / roundclear / stageclear / over / win
  let stageIdx = 0, roundIdx = 0; // roundIdx: 0..2 通常, 3 ボス
  let score = 0, lives = 3;
  let charIdx = prog.char|0;
  let frame = 0;
  let shake = 0;
  let popups = [];   // {x,y,text,col,t}
  let parts = [];    // particles
  let flash = 0;

  const PLAY_TOP = 96;
  const paddle = { x: LW/2-50, y: LH-92, w:100, baseW:100, wideT:0, shrinkT:0 };
  let balls = [];    // {x,y,vx,vy,stuck,pierceT}
  let blocks = [];   // {x,y,w,h,hp,type} type:1 normal,2 hard,3 gold,4 chest,5 star
  let drops = [];    // {x,y,vy,kind}
  let boss = null;   // {x,y,w,h,hp,maxHp,dir,atkT,hitT}
  let bossShots = []; // {x,y,vy}

  function ballSpeed(){
    return (4.6 + stageIdx*0.55 + roundIdx*0.18) * CHARS[charIdx].slow;
  }
  function paddleW(){
    let w = paddle.baseW + CHARS[charIdx].padBonus;
    if(paddle.wideT>0) w += 44;
    if(paddle.shrinkT>0) w -= 30;
    return Math.max(56, w);
  }

  /* ---------- ブロック配置 ---------- */
  function makeBlocks(){
    blocks = [];
    const cols = 8, bw = 52, bh = 24, gap = 4;
    const ox = (LW - cols*(bw+gap) + gap)/2;
    const oy = PLAY_TOP + 26;
    const pat = (stageIdx*ROUNDS + roundIdx) % 6;
    const rows = 5 + Math.min(stageIdx,2);
    function put(c,r,type){
      let hp = type===2?2 : type===3?-1 : 1;
      blocks.push({ x:ox+c*(bw+gap), y:oy+r*(bh+gap), w:bw, h:bh, hp:hp, type:type, wob:Math.random()*6.28 });
    }
    function baseType(c,r){
      // ステージが進むほど かたいブロック増加
      const hardP = 0.08 + stageIdx*0.07 + roundIdx*0.03;
      return Math.random()<hardP ? 2 : 1;
    }
    for(let r=0;r<rows;r++){
      for(let c=0;c<cols;c++){
        let on = true;
        if(pat===1 && (c+r)%2===1) on=false;                          // チェッカー
        if(pat===2 && Math.abs(c-3.5) > r+0.6) on=false;              // ピラミッド
        if(pat===3 && Math.abs(c-3.5)+Math.abs(r-2) > 4.2) on=false;  // ダイヤ
        if(pat===4 && ((r%2===0&&c<2)||(r%2===1&&c>5))) on=false;     // ジグザグ
        if(pat===5 && r===2 && c>1 && c<6) on=false;                  // トンネル
        if(!on) continue;
        put(c,r, baseType(c,r));
      }
    }
    // 金ブロック（こわれない）: ステージ2以降に少し
    if(stageIdx>=1){
      const nGold = stageIdx; // 1〜4個
      let placed=0, guard=0;
      while(placed<nGold && guard++<40){
        const b = blocks[Math.floor(Math.random()*blocks.length)];
        if(b && b.type===1){ b.type=3; b.hp=-1; placed++; }
      }
    }
    // 宝箱: 2〜3個
    const nChest = 2 + (roundIdx===2?1:0);
    let placed=0, guard=0;
    while(placed<nChest && guard++<60){
      const b = blocks[Math.floor(Math.random()*blocks.length)];
      if(b && b.type===1){ b.type=4; placed++; }
    }
    // 星ブロック: 1〜2個（ボーナス点）
    placed=0; guard=0;
    while(placed<2 && guard++<40){
      const b = blocks[Math.floor(Math.random()*blocks.length)];
      if(b && b.type===1){ b.type=5; placed++; }
    }
  }

  function makeBossRound(){
    blocks = [];
    const st = STAGES[stageIdx];
    boss = {
      x: LW/2, y: PLAY_TOP + 74, w: 120, h: 84,
      hp: st.boss.hp, maxHp: st.boss.hp,
      dir: 1, atkT: 140, hitT: 0, spd: 1.1 + stageIdx*0.25
    };
    bossShots = [];
    // ボスの護衛の金ブロック
    const bw=52, bh=24;
    for(let i=0;i<2+stageIdx;i++){
      const gx = 40 + Math.random()*(LW-80-bw);
      blocks.push({ x:gx, y:PLAY_TOP+160+Math.random()*40, w:bw, h:bh, hp:-1, type:3, wob:0 });
    }
  }

  function resetBall(){
    balls = [{ x:paddle.x+paddleW()/2, y:paddle.y-12, vx:0, vy:0, stuck:true, pierceT:0 }];
    drops = []; bossShots = [];
  }

  function startStage(s){
    stageIdx = s; roundIdx = 0;
    score = 0;
    lives = 3 + CHARS[charIdx].lifeBonus;
    paddle.wideT=0; paddle.shrinkT=0;
    boss = null;
    makeBlocks(); resetBall();
    state = 'play';
    startBgm();
  }
  function nextRound(){
    roundIdx++;
    paddle.wideT=0; paddle.shrinkT=0;
    if(roundIdx < ROUNDS){ makeBlocks(); boss=null; }
    else { makeBossRound(); sfx.boss(); }
    resetBall();
    state = 'play';
  }
  function stageCleared(){
    const st = lives>=3?3 : lives===2?2 : 1;
    if(st > (prog.stars[stageIdx]|0)){ prog.stars[stageIdx]=st; }
    prog.char = charIdx;
    saveProg();
    sfx.win();
    state = (stageIdx===4) ? 'win' : 'stageclear';
    stopBgm();
  }

  /* ---------- アイテム ---------- */
  // kind: 0 wide, 1 multi, 2 pierce, 3 slow, 4 life
  function dropItem(x,y,fromChest){
    const p = Math.random();
    let kind;
    if(fromChest){
      kind = p<0.3?0 : p<0.55?1 : p<0.75?2 : p<0.92?3 : 4;
    } else {
      const rate = 0.10 + CHARS[charIdx].itemUp;
      if(Math.random()>rate) return;
      kind = p<0.4?0 : p<0.65?3 : p<0.85?1 : 2;
    }
    drops.push({ x:x, y:y, vy:2.1, kind:kind });
  }
  function applyItem(kind){
    sfx.item();
    if(kind===0){ paddle.wideT = 600; popup(paddle.x+paddleW()/2, paddle.y-24, 'たてビッグ！', '#ffd54f'); }
    if(kind===1){
      const src = balls[0] || {x:LW/2,y:LH/2};
      const sp = ballSpeed();
      for(let i=0;i<2;i++){
        const a = -Math.PI/2 + (i===0?-0.5:0.5);
        balls.push({ x:src.x, y:src.y, vx:Math.cos(a)*sp, vy:Math.sin(a)*sp, stuck:false, pierceT:0 });
      }
      popup(src.x, src.y, 'ボールふえた！', '#4fc3f7');
    }
    if(kind===2){ balls.forEach(b=>b.pierceT=360); popup(paddle.x+paddleW()/2, paddle.y-24, 'つらぬきボール！', '#ce93d8'); }
    if(kind===3){
      balls.forEach(b=>{ b.vx*=0.72; b.vy*=0.72; });
      popup(paddle.x+paddleW()/2, paddle.y-24, 'ゆっくり〜', '#a5d6a7');
    }
    if(kind===4){ lives=Math.min(lives+1,5); popup(paddle.x+paddleW()/2, paddle.y-24, 'ライフアップ！', '#ef9a9a'); }
  }

  /* ---------- エフェクト ---------- */
  function popup(x,y,text,col){ popups.push({x:x,y:y,text:text,col:col,t:60}); }
  function burst(x,y,col,n){
    for(let i=0;i<(n||8);i++){
      const a=Math.random()*6.28, s=1+Math.random()*3;
      parts.push({x:x,y:y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-1,col:col,t:30+Math.random()*20,sz:2+Math.random()*3});
    }
  }

  /* ---------- 入力 ---------- */
  let ptrX = null;
  function toGame(e){
    const r = cv.getBoundingClientRect();
    const t = e.touches ? e.touches[0] : e;
    return { x:(t.clientX-r.left)/scale, y:(t.clientY-r.top)/scale };
  }
  function onDown(e){
    e.preventDefault();
    const p = toGame(e);
    if(ac() && AC.state==='suspended'){ try{AC.resume();}catch(err){} }

    if(state==='title'){ state='charsel'; sfx.sel(); startBgm(); return; }
    if(state==='charsel'){ charselTap(p); return; }
    if(state==='map'){ mapTap(p); return; }
    if(state==='roundclear'){ nextRound(); sfx.sel(); return; }
    if(state==='stageclear'||state==='over'||state==='win'){ overlayTap(p); return; }
    if(state==='play'){
      ptrX = p.x;
      balls.forEach(b=>{ if(b.stuck){ b.stuck=false; const sp=ballSpeed(); b.vx=(Math.random()*2-1)*sp*0.35; b.vy=-sp; } });
    }
  }
  function onMove(e){
    if(state!=='play') return;
    e.preventDefault();
    const p = toGame(e);
    ptrX = p.x;
  }
  cv.addEventListener('touchstart', onDown, {passive:false});
  cv.addEventListener('touchmove', onMove, {passive:false});
  cv.addEventListener('mousedown', onDown);
  cv.addEventListener('mousemove', e=>{ if(e.buttons||state==='play') onMove(e); });

  /* ---------- タップ判定（画面別） ---------- */
  function charselTap(p){
    for(let i=0;i<4;i++){
      const cx = 60 + (i%2)*190, cy = 220 + Math.floor(i/2)*190;
      if(p.x>cx-10 && p.x<cx+170 && p.y>cy-10 && p.y<cy+160){
        charIdx=i; sfx.sel();
        prog.char=i; saveProg();
        state='map';
        return;
      }
    }
  }
  const MAP_NODES = [
    {x:100,y:560},{x:290,y:490},{x:150,y:390},{x:330,y:300},{x:240,y:180}
  ];
  function mapTap(p){
    const un = unlockedStages();
    for(let i=0;i<5;i++){
      const n=MAP_NODES[i];
      if(Math.hypot(p.x-n.x,p.y-n.y)<44 && i<un){
        sfx.sel(); startStage(i); return;
      }
    }
    // キャラへんこうボタン
    if(p.x>LW/2-90 && p.x<LW/2+90 && p.y>640 && p.y<686){ sfx.sel(); state='charsel'; }
  }
  function overlayTap(p){
    if(state==='stageclear'){
      if(p.y>430 && p.y<486){ sfx.sel(); state='map'; }           // マップへ
      else if(p.y>500 && p.y<556){ sfx.sel(); startStage(Math.min(stageIdx+1,4)); } // つぎへ
    } else if(state==='over'){
      if(p.y>430 && p.y<486){ sfx.sel(); startStage(stageIdx); }  // もういちど
      else if(p.y>500 && p.y<556){ sfx.sel(); state='map'; }
    } else if(state==='win'){
      sfx.sel(); state='map';
    }
  }

  /* ---------- 更新 ---------- */
  function update(){
    frame++;
    if(shake>0) shake*=0.85;
    if(flash>0) flash-=0.06;
    popups = popups.filter(p=>{ p.t--; p.y-=0.7; return p.t>0; });
    parts = parts.filter(p=>{ p.t--; p.x+=p.vx; p.y+=p.vy; p.vy+=0.12; return p.t>0; });

    if(state!=='play') return;

    // パドル
    if(ptrX!==null){
      const target = ptrX - paddleW()/2;
      paddle.x += (target - paddle.x)*0.5;
    }
    paddle.x = Math.max(6, Math.min(LW-6-paddleW(), paddle.x));
    if(paddle.wideT>0) paddle.wideT--;
    if(paddle.shrinkT>0) paddle.shrinkT--;

    // ボール
    for(let bi=balls.length-1; bi>=0; bi--){
      const b = balls[bi];
      if(b.stuck){ b.x = paddle.x+paddleW()/2; b.y = paddle.y-12; continue; }
      if(b.pierceT>0) b.pierceT--;
      b.x += b.vx; b.y += b.vy;

      if(b.x<10){ b.x=10; b.vx=Math.abs(b.vx); sfx.wall(); }
      if(b.x>LW-10){ b.x=LW-10; b.vx=-Math.abs(b.vx); sfx.wall(); }
      if(b.y<PLAY_TOP-40){ b.y=PLAY_TOP-40; b.vy=Math.abs(b.vy); sfx.wall(); }

      // パドル
      const pw = paddleW();
      if(b.vy>0 && b.y>paddle.y-10 && b.y<paddle.y+16 && b.x>paddle.x-8 && b.x<paddle.x+pw+8){
        const rel = ((b.x-paddle.x)/pw)*2-1;   // -1..1
        const ang = -Math.PI/2 + rel*1.05;
        const sp = Math.hypot(b.vx,b.vy);
        b.vx = Math.cos(ang)*sp; b.vy = Math.sin(ang)*sp;
        b.y = paddle.y-11;
        sfx.pad(); burst(b.x, paddle.y, '#fff8', 4);
      }

      // ブロック
      for(let i=blocks.length-1;i>=0;i--){
        const bl = blocks[i];
        if(b.x>bl.x-8 && b.x<bl.x+bl.w+8 && b.y>bl.y-8 && b.y<bl.y+bl.h+8){
          const pierce = b.pierceT>0 && bl.type!==3;
          if(!pierce){
            const oxl=Math.abs(b.x-bl.x), oxr=Math.abs(b.x-(bl.x+bl.w));
            const oyt=Math.abs(b.y-bl.y), oyb=Math.abs(b.y-(bl.y+bl.h));
            const m=Math.min(oxl,oxr,oyt,oyb);
            if(m===oxl) b.vx=-Math.abs(b.vx);
            else if(m===oxr) b.vx=Math.abs(b.vx);
            else if(m===oyt) b.vy=-Math.abs(b.vy);
            else b.vy=Math.abs(b.vy);
          }
          if(bl.type===3){ sfx.gold(); shake=2; break; }
          bl.hp--;
          if(bl.hp<=0){
            const st=STAGES[stageIdx];
            if(bl.type===4){ sfx.chest(); dropItem(bl.x+bl.w/2, bl.y+bl.h/2, true); score+=50; burst(bl.x+bl.w/2,bl.y+bl.h/2,'#ffd54f',12); }
            else if(bl.type===5){ sfx.item(); score+=100; popup(bl.x+bl.w/2,bl.y,'+100','#fff176'); burst(bl.x+bl.w/2,bl.y+bl.h/2,'#fff176',12); }
            else { sfx.hit(); score+=10*(bl.type===2?2:1); dropItem(bl.x+bl.w/2, bl.y+bl.h/2, false); burst(bl.x+bl.w/2,bl.y+bl.h/2, st.block[0],8); }
            blocks.splice(i,1);
          } else { sfx.hard(); burst(b.x,b.y,'#fff',4); }
          shake = 3;
          if(!pierce) break;
        }
      }

      // ボス
      if(boss && b.y>boss.y-boss.h/2-8 && b.y<boss.y+boss.h/2+8 &&
         b.x>boss.x-boss.w/2-8 && b.x<boss.x+boss.w/2+8){
        if(boss.hitT<=0){
          boss.hp--; boss.hitT=18; sfx.bhit();
          score+=30; shake=5;
          burst(b.x,b.y,STAGES[stageIdx].boss.col1,12);
          if(boss.hp<=0){
            burst(boss.x,boss.y,STAGES[stageIdx].boss.col2,40);
            popup(boss.x,boss.y,'やった〜！','#ffd54f');
            boss=null; bossShots=[];
            stageCleared();
            return;
          }
        }
        b.vy = (b.y<boss.y)? -Math.abs(b.vy) : Math.abs(b.vy);
      }

      // 落下
      if(b.y>LH+20){
        balls.splice(bi,1);
        if(balls.length===0){
          lives--; sfx.miss(); shake=6; flash=0.5;
          if(lives<=0){ state='over'; stopBgm(); }
          else resetBall();
        }
      }
    }

    // 通常ラウンドクリア判定
    if(!boss && state==='play'){
      const remain = blocks.some(b=>b.hp>0);
      if(!remain){
        sfx.clear();
        score += 200;
        state='roundclear';
      }
    }

    // ボス行動
    if(boss){
      if(boss.hitT>0) boss.hitT--;
      boss.x += boss.dir*boss.spd;
      if(boss.x<boss.w/2+20){ boss.x=boss.w/2+20; boss.dir=1; }
      if(boss.x>LW-boss.w/2-20){ boss.x=LW-boss.w/2-20; boss.dir=-1; }
      boss.atkT--;
      if(boss.atkT<=0){
        boss.atkT = Math.max(90, 170-stageIdx*15);
        bossShots.push({ x:boss.x, y:boss.y+boss.h/2, vy:2.4+stageIdx*0.3 });
        sfx.boss();
      }
      for(let i=bossShots.length-1;i>=0;i--){
        const s=bossShots[i]; s.y+=s.vy;
        const pw=paddleW();
        if(s.y>paddle.y-6 && s.y<paddle.y+20 && s.x>paddle.x && s.x<paddle.x+pw){
          bossShots.splice(i,1);
          paddle.shrinkT = 300; shake=5; sfx.miss();
          popup(paddle.x+pw/2, paddle.y-24, 'たてがちいさく…', '#ef9a9a');
        } else if(s.y>LH+20) bossShots.splice(i,1);
      }
    }

    // アイテム落下
    for(let i=drops.length-1;i>=0;i--){
      const d=drops[i]; d.y+=d.vy;
      const pw=paddleW();
      if(d.y>paddle.y-6 && d.y<paddle.y+22 && d.x>paddle.x-10 && d.x<paddle.x+pw+10){
        applyItem(d.kind); drops.splice(i,1);
      } else if(d.y>LH+20) drops.splice(i,1);
    }
  }

  /* ---------- 描画ヘルパー ---------- */
  function textC(t,y,size,col,shadow){
    ctx.font = size+"px 'DotGothic16'";
    ctx.textAlign='center';
    if(shadow){ ctx.fillStyle='#0006'; ctx.fillText(t, LW/2+3, y+3); }
    ctx.fillStyle=col; ctx.fillText(t, LW/2, y);
  }
  function rrect(x,y,w,h,r){
    ctx.beginPath();
    ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r);
    ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath();
  }
  function btn(y, label, col){
    ctx.save();
    rrect(LW/2-100, y, 200, 52, 14);
    ctx.fillStyle=col||'#ffca28'; ctx.fill();
    ctx.strokeStyle='#0003'; ctx.lineWidth=3; ctx.stroke();
    ctx.font="22px 'DotGothic16'"; ctx.fillStyle='#4a3a1a'; ctx.textAlign='center';
    ctx.fillText(label, LW/2, y+34);
    ctx.restore();
  }
  function star(x,y,r,col){
    ctx.save(); ctx.translate(x,y); ctx.beginPath();
    for(let i=0;i<10;i++){
      const a=-Math.PI/2 + i*Math.PI/5, rr=(i%2===0)?r:r*0.45;
      ctx.lineTo(Math.cos(a)*rr, Math.sin(a)*rr);
    }
    ctx.closePath(); ctx.fillStyle=col; ctx.fill(); ctx.restore();
  }
  function heart(x,y,s,col){
    ctx.save(); ctx.translate(x,y); ctx.scale(s,s);
    ctx.beginPath();
    ctx.moveTo(0,3);
    ctx.bezierCurveTo(-6,-4,-12,2,0,10);
    ctx.bezierCurveTo(12,2,6,-4,0,3);
    ctx.fillStyle=col; ctx.fill(); ctx.restore();
  }

  /* ---------- どうぶつ描画（ベクター） ---------- */
  function drawAnimalHead(x,y,r,ci,face){
    const c = CHARS[ci];
    ctx.save(); ctx.translate(x,y);
    // 耳
    ctx.fillStyle = c.ear==='panda' ? '#333' : c.col;
    if(c.ear==='cat'){
      ctx.beginPath(); ctx.moveTo(-r*0.8,-r*0.4); ctx.lineTo(-r*0.5,-r*1.25); ctx.lineTo(-r*0.1,-r*0.7); ctx.fill();
      ctx.beginPath(); ctx.moveTo(r*0.8,-r*0.4); ctx.lineTo(r*0.5,-r*1.25); ctx.lineTo(r*0.1,-r*0.7); ctx.fill();
    } else if(c.ear==='rabbit'){
      rrect(-r*0.62,-r*1.9,r*0.42,r*1.4,r*0.2); ctx.fill();
      rrect(r*0.2,-r*1.9,r*0.42,r*1.4,r*0.2); ctx.fill();
    } else if(c.ear==='panda'){
      ctx.beginPath(); ctx.arc(-r*0.62,-r*0.66,r*0.4,0,6.29); ctx.fill();
      ctx.beginPath(); ctx.arc(r*0.62,-r*0.66,r*0.4,0,6.29); ctx.fill();
    }
    // 顔
    ctx.beginPath(); ctx.arc(0,0,r,0,6.29);
    ctx.fillStyle = c.ear==='panda' ? '#fff' : c.col; ctx.fill();
    ctx.strokeStyle='#0002'; ctx.lineWidth=2; ctx.stroke();
    if(c.ear==='frog'){
      ctx.fillStyle=c.col;
      ctx.beginPath(); ctx.arc(-r*0.5,-r*0.8,r*0.34,0,6.29); ctx.fill();
      ctx.beginPath(); ctx.arc(r*0.5,-r*0.8,r*0.34,0,6.29); ctx.fill();
      ctx.fillStyle='#fff';
      ctx.beginPath(); ctx.arc(-r*0.5,-r*0.84,r*0.2,0,6.29); ctx.fill();
      ctx.beginPath(); ctx.arc(r*0.5,-r*0.84,r*0.2,0,6.29); ctx.fill();
      ctx.fillStyle='#333';
      ctx.beginPath(); ctx.arc(-r*0.5,-r*0.84,r*0.09,0,6.29); ctx.fill();
      ctx.beginPath(); ctx.arc(r*0.5,-r*0.84,r*0.09,0,6.29); ctx.fill();
    }
    if(c.ear==='panda'){
      ctx.fillStyle='#333';
      ctx.beginPath(); ctx.ellipse(-r*0.4,-r*0.1,r*0.24,r*0.3,-0.3,0,6.29); ctx.fill();
      ctx.beginPath(); ctx.ellipse(r*0.4,-r*0.1,r*0.24,r*0.3,0.3,0,6.29); ctx.fill();
    }
    // 目・口
    if(c.ear!=='frog'){
      ctx.fillStyle= c.ear==='panda' ? '#fff' : '#3a2a1a';
      const ey = c.ear==='panda' ? -r*0.1 : -r*0.08;
      if(c.ear==='panda'){
        ctx.beginPath(); ctx.arc(-r*0.4,ey,r*0.08,0,6.29); ctx.fill();
        ctx.beginPath(); ctx.arc(r*0.4,ey,r*0.08,0,6.29); ctx.fill();
      } else {
        ctx.beginPath(); ctx.arc(-r*0.35,ey,r*0.1,0,6.29); ctx.fill();
        ctx.beginPath(); ctx.arc(r*0.35,ey,r*0.1,0,6.29); ctx.fill();
      }
    }
    ctx.strokeStyle='#3a2a1a'; ctx.lineWidth=2;
    ctx.beginPath();
    if(face==='happy'){ ctx.arc(0,r*0.25,r*0.28,0.15,Math.PI-0.15); }
    else { ctx.arc(0,r*0.32,r*0.18,0.2,Math.PI-0.2); }
    ctx.stroke();
    // ほっぺ
    ctx.fillStyle='#ff9e9e55';
    ctx.beginPath(); ctx.arc(-r*0.62,r*0.22,r*0.16,0,6.29); ctx.fill();
    ctx.beginPath(); ctx.arc(r*0.62,r*0.22,r*0.16,0,6.29); ctx.fill();
    ctx.restore();
  }

  function drawPaddle(){
    const pw = paddleW();
    const px = paddle.x, py = paddle.y;
    ctx.save();
    // 盾（当たり面）
    const grd = ctx.createLinearGradient(px,py,px,py+16);
    grd.addColorStop(0, paddle.shrinkT>0 ? '#c9a0a0' : '#ffe082');
    grd.addColorStop(1, paddle.shrinkT>0 ? '#9e6b6b' : '#e0a83a');
    rrect(px,py,pw,16,8); ctx.fillStyle=grd; ctx.fill();
    ctx.strokeStyle='#7a5a20'; ctx.lineWidth=2.5; ctx.stroke();
    // 盾のかざり
    ctx.fillStyle='#fff8';
    for(let i=0;i<Math.floor(pw/34);i++){
      ctx.beginPath(); ctx.arc(px+20+i*34, py+8, 3, 0, 6.29); ctx.fill();
    }
    if(paddle.wideT>0){
      ctx.strokeStyle='#fff176aa'; ctx.lineWidth=3;
      rrect(px-3,py-3,pw+6,22,10); ctx.stroke();
    }
    // どうぶつ（盾の下から顔出す）
    const bob = Math.sin(frame*0.15)*2;
    drawAnimalHead(px+pw/2, py+34+bob, 17, charIdx, 'happy');
    // 手（盾を持つ）
    ctx.fillStyle=CHARS[charIdx].ear==='panda'?'#333':CHARS[charIdx].col;
    ctx.beginPath(); ctx.arc(px+pw/2-16, py+18, 5, 0, 6.29); ctx.fill();
    ctx.beginPath(); ctx.arc(px+pw/2+16, py+18, 5, 0, 6.29); ctx.fill();
    ctx.restore();
  }

  /* ---------- ボス描画 ---------- */
  function drawBoss(){
    if(!boss) return;
    const st = STAGES[stageIdx].boss;
    const bx=boss.x, by=boss.y + Math.sin(frame*0.06)*5;
    ctx.save();
    if(boss.hitT>0 && boss.hitT%6<3) ctx.globalAlpha=0.5;
    // 本体（ステージごとに形をかえる）
    if(stageIdx===0){ // スライムキング
      ctx.beginPath();
      ctx.moveTo(bx-boss.w/2, by+boss.h/2);
      ctx.quadraticCurveTo(bx-boss.w/2, by-boss.h/2, bx, by-boss.h/2);
      ctx.quadraticCurveTo(bx+boss.w/2, by-boss.h/2, bx+boss.w/2, by+boss.h/2);
      ctx.closePath();
      const g=ctx.createLinearGradient(bx,by-boss.h/2,bx,by+boss.h/2);
      g.addColorStop(0,st.col1); g.addColorStop(1,st.col2);
      ctx.fillStyle=g; ctx.fill();
    } else if(stageIdx===1){ // ゆきだるま
      ctx.fillStyle=st.col1;
      ctx.beginPath(); ctx.arc(bx,by+16,boss.w/2.6,0,6.29); ctx.fill();
      ctx.beginPath(); ctx.arc(bx,by-24,boss.w/3.6,0,6.29); ctx.fill();
      ctx.strokeStyle=st.col2; ctx.lineWidth=2;
      ctx.beginPath(); ctx.arc(bx,by+16,boss.w/2.6,0,6.29); ctx.stroke();
      ctx.beginPath(); ctx.arc(bx,by-24,boss.w/3.6,0,6.29); ctx.stroke();
    } else if(stageIdx===2){ // ケーキゴーレム
      ctx.fillStyle=st.col2;
      rrect(bx-boss.w/2, by-8, boss.w, boss.h/2+8, 10); ctx.fill();
      ctx.fillStyle=st.col1;
      rrect(bx-boss.w/2.8, by-boss.h/2, boss.w/1.4, boss.h/2, 10); ctx.fill();
      // クリーム
      ctx.fillStyle='#fff';
      for(let i=0;i<5;i++){ ctx.beginPath(); ctx.arc(bx-boss.w/2+10+i*(boss.w-20)/4, by-6, 8, 0, 6.29); ctx.fill(); }
      // さくらんぼ
      ctx.fillStyle='#e53935'; ctx.beginPath(); ctx.arc(bx, by-boss.h/2-6, 8, 0, 6.29); ctx.fill();
    } else if(stageIdx===3){ // タコまじゅつし
      ctx.fillStyle=st.col1;
      ctx.beginPath(); ctx.arc(bx,by-10,boss.w/2.8,Math.PI,0); ctx.fill();
      rrect(bx-boss.w/2.8, by-10, boss.w/1.4, 20, 4); ctx.fill();
      for(let i=0;i<5;i++){
        const lx=bx-boss.w/2.8+8+i*(boss.w/1.4-16)/4;
        const wig=Math.sin(frame*0.12+i)*6;
        ctx.beginPath(); ctx.moveTo(lx,by+8);
        ctx.quadraticCurveTo(lx+wig, by+30, lx, by+44);
        ctx.strokeStyle=st.col1; ctx.lineWidth=9; ctx.lineCap='round'; ctx.stroke();
      }
      // とんがりぼうし
      ctx.fillStyle='#5e35b1';
      ctx.beginPath(); ctx.moveTo(bx-24,by-boss.h/2+14); ctx.lineTo(bx,by-boss.h/2-22); ctx.lineTo(bx+24,by-boss.h/2+14); ctx.closePath(); ctx.fill();
      star(bx, by-boss.h/2-2, 6, '#ffd54f');
    } else { // ドラゴン
      const g=ctx.createLinearGradient(bx,by-boss.h/2,bx,by+boss.h/2);
      g.addColorStop(0,st.col1); g.addColorStop(1,st.col2);
      ctx.fillStyle=g;
      ctx.beginPath(); ctx.ellipse(bx,by,boss.w/2,boss.h/2.2,0,0,6.29); ctx.fill();
      // つばさ
      const fl=Math.sin(frame*0.15)*8;
      ctx.beginPath(); ctx.moveTo(bx-boss.w/2+6,by-6);
      ctx.quadraticCurveTo(bx-boss.w/1.2, by-40+fl, bx-boss.w/1.6, by-4); ctx.closePath(); ctx.fill();
      ctx.beginPath(); ctx.moveTo(bx+boss.w/2-6,by-6);
      ctx.quadraticCurveTo(bx+boss.w/1.2, by-40+fl, bx+boss.w/1.6, by-4); ctx.closePath(); ctx.fill();
      // つの
      ctx.fillStyle='#ffe082';
      ctx.beginPath(); ctx.moveTo(bx-16,by-boss.h/2.4); ctx.lineTo(bx-10,by-boss.h/1.5); ctx.lineTo(bx-4,by-boss.h/2.4); ctx.closePath(); ctx.fill();
      ctx.beginPath(); ctx.moveTo(bx+16,by-boss.h/2.4); ctx.lineTo(bx+10,by-boss.h/1.5); ctx.lineTo(bx+4,by-boss.h/2.4); ctx.closePath(); ctx.fill();
    }
    // 目（共通・かわいく）
    ctx.globalAlpha=1;
    ctx.fillStyle='#fff';
    ctx.beginPath(); ctx.arc(bx-18,by-14,9,0,6.29); ctx.fill();
    ctx.beginPath(); ctx.arc(bx+18,by-14,9,0,6.29); ctx.fill();
    ctx.fillStyle='#222';
    const lookX = boss.dir*3;
    ctx.beginPath(); ctx.arc(bx-18+lookX,by-13,4.5,0,6.29); ctx.fill();
    ctx.beginPath(); ctx.arc(bx+18+lookX,by-13,4.5,0,6.29); ctx.fill();
    // 王冠（1面のみ）
    if(stageIdx===0){
      ctx.fillStyle='#ffd54f';
      ctx.beginPath();
      ctx.moveTo(bx-20,by-boss.h/2+2);
      ctx.lineTo(bx-20,by-boss.h/2-16); ctx.lineTo(bx-10,by-boss.h/2-4);
      ctx.lineTo(bx,by-boss.h/2-18); ctx.lineTo(bx+10,by-boss.h/2-4);
      ctx.lineTo(bx+20,by-boss.h/2-16); ctx.lineTo(bx+20,by-boss.h/2+2);
      ctx.closePath(); ctx.fill();
    }
    ctx.restore();
    // HPバー
    const hw = 200, hx = LW/2-hw/2, hy = PLAY_TOP+4;
    rrect(hx,hy,hw,12,6); ctx.fillStyle='#0006'; ctx.fill();
    rrect(hx+2,hy+2,(hw-4)*Math.max(boss.hp,0)/boss.maxHp,8,4);
    ctx.fillStyle='#ef5350'; ctx.fill();
    ctx.font="13px 'DotGothic16'"; ctx.fillStyle='#fff'; ctx.textAlign='center';
    ctx.fillText(st.name, LW/2, hy+28);
    // ボスショット
    bossShots.forEach(s=>{
      ctx.fillStyle='#7e57c2';
      ctx.beginPath(); ctx.arc(s.x,s.y,7,0,6.29); ctx.fill();
      ctx.fillStyle='#fff6';
      ctx.beginPath(); ctx.arc(s.x-2,s.y-2,2.5,0,6.29); ctx.fill();
    });
  }

  /* ---------- 背景 ---------- */
  function drawBg(){
    const st = STAGES[stageIdx];
    const g = ctx.createLinearGradient(0,0,0,LH);
    g.addColorStop(0, st.sky1); g.addColorStop(1, st.sky2);
    ctx.fillStyle=g; ctx.fillRect(0,0,LW,LH);
    // お城シルエット（うすく）
    ctx.save(); ctx.globalAlpha=0.15; ctx.fillStyle='#333';
    castle(LW/2, LH-40, 1.6);
    ctx.restore();
    // 地面
    ctx.fillStyle=st.ground+'55';
    ctx.fillRect(0,LH-36,LW,36);
    // ステージ別 かざり
    if(stageIdx===1){ // 雪
      for(let i=0;i<20;i++){
        const sx=(i*97+frame*0.5)%LW, sy=(i*173+frame*(0.6+i%3*0.2))%LH;
        ctx.fillStyle='#fff9'; ctx.beginPath(); ctx.arc(sx,sy,2+(i%3),0,6.29); ctx.fill();
      }
    }
    if(stageIdx===4){ // 星空
      for(let i=0;i<26;i++){
        const sx=(i*89)%LW, sy=(i*53)%(LH*0.6);
        const tw = 0.4+0.6*Math.abs(Math.sin(frame*0.03+i));
        ctx.fillStyle='rgba(255,255,220,'+tw+')';
        ctx.fillRect(sx,sy,2,2);
      }
    }
  }
  function castle(cx, baseY, s){
    ctx.save(); ctx.translate(cx,baseY); ctx.scale(s,s);
    ctx.fillRect(-70,-80,140,80);
    ctx.fillRect(-95,-110,34,110);
    ctx.fillRect(61,-110,34,110);
    ctx.beginPath(); ctx.moveTo(-95,-110); ctx.lineTo(-78,-146); ctx.lineTo(-61,-110); ctx.fill();
    ctx.beginPath(); ctx.moveTo(61,-110); ctx.lineTo(78,-146); ctx.lineTo(95,-110); ctx.fill();
    ctx.fillRect(-16,-124,32,44);
    ctx.beginPath(); ctx.moveTo(-16,-124); ctx.lineTo(0,-158); ctx.lineTo(16,-124); ctx.fill();
    for(let i=0;i<5;i++) ctx.fillRect(-66+i*28,-92,14,12);
    ctx.restore();
  }

  /* ---------- 画面描画 ---------- */
  function drawBlocks(){
    const st=STAGES[stageIdx];
    blocks.forEach(b=>{
      ctx.save();
      const wy = b.type===5 ? Math.sin(frame*0.1+b.wob)*2 : 0;
      ctx.translate(b.x, b.y+wy);
      if(b.type===3){ // 金
        const g=ctx.createLinearGradient(0,0,0,b.h);
        g.addColorStop(0,'#ffe082'); g.addColorStop(0.5,'#d4a017'); g.addColorStop(1,'#ffe082');
        rrect(0,0,b.w,b.h,5); ctx.fillStyle=g; ctx.fill();
        ctx.strokeStyle='#8a6d1a'; ctx.lineWidth=2; ctx.stroke();
        ctx.fillStyle='#fff8'; ctx.fillRect(6,4,b.w-12,3);
      } else if(b.type===4){ // 宝箱
        rrect(0,4,b.w,b.h-4,4); ctx.fillStyle='#a1642f'; ctx.fill();
        rrect(0,0,b.w,10,4); ctx.fillStyle='#c68347'; ctx.fill();
        ctx.strokeStyle='#6a3f18'; ctx.lineWidth=2;
        rrect(0,0,b.w,b.h,4); ctx.stroke();
        ctx.fillStyle='#ffd54f'; ctx.fillRect(b.w/2-4, 6, 8, 10);
      } else if(b.type===5){ // 星
        rrect(0,0,b.w,b.h,5); ctx.fillStyle='#fff3c4'; ctx.fill();
        ctx.strokeStyle='#e0b93a'; ctx.lineWidth=2; ctx.stroke();
        star(b.w/2, b.h/2, 9, '#ffca28');
      } else {
        const cols = b.type===2 ? st.hard : st.block;
        const g=ctx.createLinearGradient(0,0,0,b.h);
        g.addColorStop(0,cols[0]); g.addColorStop(1,cols[1]);
        rrect(0,0,b.w,b.h,5); ctx.fillStyle=g; ctx.fill();
        ctx.strokeStyle='#0003'; ctx.lineWidth=2; ctx.stroke();
        ctx.fillStyle='#ffffff44'; ctx.fillRect(4,3,b.w-8,4);
        if(b.type===2 && b.hp===2){ // ヒビなし2HP→レンガもよう
          ctx.strokeStyle='#00000022'; ctx.lineWidth=1.5;
          ctx.beginPath(); ctx.moveTo(b.w/2,2); ctx.lineTo(b.w/2,b.h-2);
          ctx.moveTo(2,b.h/2); ctx.lineTo(b.w-2,b.h/2); ctx.stroke();
        }
        if(b.type===2 && b.hp===1){ // ヒビ
          ctx.strokeStyle='#00000055'; ctx.lineWidth=2;
          ctx.beginPath(); ctx.moveTo(b.w*0.3,3); ctx.lineTo(b.w*0.45,b.h*0.5); ctx.lineTo(b.w*0.32,b.h-3);
          ctx.moveTo(b.w*0.45,b.h*0.5); ctx.lineTo(b.w*0.7,b.h*0.6); ctx.stroke();
        }
      }
      ctx.restore();
    });
  }
  function drawDrops(){
    drops.forEach(d=>{
      ctx.save(); ctx.translate(d.x,d.y);
      const bob=Math.sin(frame*0.2)*1.5;
      if(d.kind===0){ // 盾ビッグ = 小さな盾
        rrect(-11,-8+bob,22,14,5); ctx.fillStyle='#ffe082'; ctx.fill();
        ctx.strokeStyle='#a97c22'; ctx.lineWidth=2; ctx.stroke();
      } else if(d.kind===1){ // ボール分裂 = 3つの玉
        ctx.fillStyle='#4fc3f7';
        ctx.beginPath(); ctx.arc(-6,3+bob,5,0,6.29); ctx.fill();
        ctx.beginPath(); ctx.arc(6,3+bob,5,0,6.29); ctx.fill();
        ctx.beginPath(); ctx.arc(0,-5+bob,5,0,6.29); ctx.fill();
      } else if(d.kind===2){ // 貫通 = ダイヤ
        ctx.fillStyle='#ce93d8';
        ctx.beginPath(); ctx.moveTo(0,-10+bob); ctx.lineTo(9,bob); ctx.lineTo(0,10+bob); ctx.lineTo(-9,bob); ctx.closePath(); ctx.fill();
        ctx.strokeStyle='#8e5aa0'; ctx.lineWidth=2; ctx.stroke();
      } else if(d.kind===3){ // スロー = かたつむり風うずまき
        ctx.strokeStyle='#81c784'; ctx.lineWidth=3.5; ctx.lineCap='round';
        ctx.beginPath();
        for(let a=0;a<4.6;a+=0.2) ctx.lineTo(Math.cos(a)*a*2, bob+Math.sin(a)*a*2);
        ctx.stroke();
      } else { // ライフ = ハート
        heart(0,bob-4,1.4,'#ef5350');
      }
      ctx.restore();
    });
  }
  function drawBalls(){
    balls.forEach(b=>{
      ctx.save();
      if(b.pierceT>0){
        ctx.fillStyle='#ce93d8';
        ctx.beginPath(); ctx.arc(b.x,b.y,9,0,6.29); ctx.fill();
        ctx.strokeStyle='#fff'; ctx.lineWidth=2; ctx.stroke();
      } else {
        const g=ctx.createRadialGradient(b.x-3,b.y-3,1,b.x,b.y,9);
        g.addColorStop(0,'#fff'); g.addColorStop(1,'#ffca28');
        ctx.fillStyle=g;
        ctx.beginPath(); ctx.arc(b.x,b.y,8,0,6.29); ctx.fill();
        ctx.strokeStyle='#b8860b'; ctx.lineWidth=1.5; ctx.stroke();
      }
      if(b.stuck){
        ctx.font="14px 'DotGothic16'"; ctx.fillStyle='#fff'; ctx.textAlign='center';
        ctx.fillText('タップではっしゃ！', b.x, b.y-24);
      }
      ctx.restore();
    });
  }
  function drawHUD(){
    ctx.save();
    ctx.fillStyle='#00000055'; ctx.fillRect(0,PLAY_TOP-40,LW,36);
    ctx.font="16px 'DotGothic16'"; ctx.textAlign='left'; ctx.fillStyle='#fff';
    const rl = roundIdx<ROUNDS ? 'ラウンド '+(roundIdx+1) : 'ボスせん！';
    ctx.fillText('ステージ'+(stageIdx+1)+'  '+rl, 14, PLAY_TOP-15);
    ctx.textAlign='right';
    ctx.fillText('スコア '+score, LW-14, PLAY_TOP-15);
    for(let i=0;i<lives;i++) heart(LW/2-30+i*20, PLAY_TOP-24, 1.3, '#ef5350');
    ctx.restore();
  }

  function drawTitle(){
    // 空
    const g = ctx.createLinearGradient(0,0,0,LH);
    g.addColorStop(0,'#7ec8f7'); g.addColorStop(0.7,'#ffd9ec'); g.addColorStop(1,'#ffeccf');
    ctx.fillStyle=g; ctx.fillRect(0,0,LW,LH);
    // 雲
    for(let i=0;i<4;i++){
      const cxp=((i*140+frame*0.3)%(LW+120))-60, cyp=70+i*54;
      ctx.fillStyle='#ffffffcc';
      ctx.beginPath(); ctx.arc(cxp,cyp,22,0,6.29); ctx.arc(cxp+24,cyp+4,17,0,6.29); ctx.arc(cxp-24,cyp+6,15,0,6.29); ctx.fill();
    }
    // お城
    ctx.fillStyle='#b39ddb'; castle(LW/2, LH-140, 1.5);
    ctx.fillStyle='#9575cd';
    // 地面
    ctx.fillStyle='#a5d66f'; ctx.fillRect(0,LH-140,LW,140);
    ctx.fillStyle='#8fc75a';
    for(let i=0;i<8;i++){ ctx.beginPath(); ctx.arc(i*70+20, LH-140, 26, Math.PI,0); ctx.fill(); }
    // タイトルボード
    ctx.save();
    ctx.translate(LW/2, 190 + Math.sin(frame*0.04)*5);
    rrect(-190,-64,380,128,20);
    ctx.fillStyle='#fff'; ctx.fill();
    ctx.strokeStyle='#e0a83a'; ctx.lineWidth=6; ctx.stroke();
    ctx.font="40px 'DotGothic16'"; ctx.textAlign='center';
    ctx.fillStyle='#5c4a9e';
    ctx.fillText('おしろ', 0, -14);
    ctx.fillStyle='#e0679e';
    ctx.fillText('ブロックくずし', 0, 34);
    ctx.restore();
    // 王冠
    ctx.fillStyle='#ffd54f';
    ctx.save(); ctx.translate(LW/2, 96 + Math.sin(frame*0.04)*5);
    ctx.beginPath();
    ctx.moveTo(-30,14); ctx.lineTo(-30,-12); ctx.lineTo(-15,2); ctx.lineTo(0,-18);
    ctx.lineTo(15,2); ctx.lineTo(30,-12); ctx.lineTo(30,14); ctx.closePath(); ctx.fill();
    ctx.restore();
    // どうぶつたちが跳ねる
    for(let i=0;i<4;i++){
      const ax = 90+i*100;
      const ay = LH-190 - Math.abs(Math.sin(frame*0.07+i*1.2))*26;
      drawAnimalHead(ax, ay, 22, i, 'happy');
    }
    // ボールが跳ねまわる
    const bx = LW/2 + Math.sin(frame*0.05)*140;
    const by = 330 + Math.abs(Math.sin(frame*0.09))*60;
    const bg2=ctx.createRadialGradient(bx-3,by-3,1,bx,by,10);
    bg2.addColorStop(0,'#fff'); bg2.addColorStop(1,'#ffca28');
    ctx.fillStyle=bg2; ctx.beginPath(); ctx.arc(bx,by,9,0,6.29); ctx.fill();
    // スタート
    if(Math.floor(frame/30)%2===0) textC('タップしてスタート！', 470, 24, '#5c4a9e', true);
    // ハイスコア的表示: 合計星
    const total = prog.stars.reduce((a,b)=>a+b,0);
    textC('あつめた ほし ★'+total+' / 15', 512, 16, '#7a6a3a', false);
  }

  function drawCharsel(){
    const g=ctx.createLinearGradient(0,0,0,LH);
    g.addColorStop(0,'#e8d9ff'); g.addColorStop(1,'#fff2d9');
    ctx.fillStyle=g; ctx.fillRect(0,0,LW,LH);
    textC('なかまを えらんでね！', 140, 30, '#5c4a9e', true);
    for(let i=0;i<4;i++){
      const cx = 60 + (i%2)*190, cy = 220 + Math.floor(i/2)*190;
      const sel = i===charIdx;
      ctx.save();
      rrect(cx-10,cy-10,170,160,16);
      ctx.fillStyle = sel ? '#fff' : '#ffffffaa'; ctx.fill();
      ctx.strokeStyle = sel ? '#ffb300' : '#0002'; ctx.lineWidth = sel?5:2; ctx.stroke();
      drawAnimalHead(cx+75, cy+48, 30, i, 'happy');
      ctx.font="17px 'DotGothic16'"; ctx.textAlign='center';
      ctx.fillStyle='#4a3a6e'; ctx.fillText(CHARS[i].name, cx+75, cy+108);
      ctx.font="12px 'DotGothic16'"; ctx.fillStyle='#8a7aa0';
      ctx.fillText(CHARS[i].desc, cx+75, cy+130);
      ctx.restore();
    }
    textC('タップすると マップへ すすむよ', 640, 15, '#8a7aa0', false);
  }

  function drawMap(){
    const g=ctx.createLinearGradient(0,0,0,LH);
    g.addColorStop(0,'#8fd7ff'); g.addColorStop(1,'#d9f7d0');
    ctx.fillStyle=g; ctx.fillRect(0,0,LW,LH);
    textC('ステージマップ', 130, 30, '#3a5a2a', true);
    const un = unlockedStages();
    // 道
    ctx.strokeStyle='#ffffffaa'; ctx.lineWidth=10; ctx.lineCap='round';
    ctx.setLineDash([2,16]);
    ctx.beginPath();
    MAP_NODES.forEach((n,i)=>{ i===0?ctx.moveTo(n.x,n.y):ctx.lineTo(n.x,n.y); });
    ctx.stroke(); ctx.setLineDash([]);
    // ノード
    for(let i=0;i<5;i++){
      const n=MAP_NODES[i], open=i<un;
      ctx.save();
      ctx.beginPath(); ctx.arc(n.x,n.y,38,0,6.29);
      ctx.fillStyle = open ? '#fff' : '#c9c2d6'; ctx.fill();
      ctx.strokeStyle = open ? STAGES[i].accent : '#9a93ad'; ctx.lineWidth=5; ctx.stroke();
      if(open){
        ctx.fillStyle=STAGES[i].accent;
        castleMini(n.x, n.y+16, 0.5, STAGES[i].accent);
        ctx.font="15px 'DotGothic16'"; ctx.textAlign='center'; ctx.fillStyle='#4a3a6e';
        ctx.fillText(i+1, n.x, n.y-46);
        for(let s=0;s<3;s++){
          star(n.x-20+s*20, n.y+52, 8, s<(prog.stars[i]|0)?'#ffca28':'#00000022');
        }
      } else {
        lockMini(n.x, n.y+8, '#6a6480');
      }
      ctx.restore();
      // ステージ名
      if(open){
        ctx.font="13px 'DotGothic16'"; ctx.textAlign='center'; ctx.fillStyle='#3a5a2a';
        ctx.fillText(STAGES[i].name, n.x, n.y+78);
      }
    }
    btn(640, 'なかまを かえる', '#b3e5fc');
  }
  function castleMini(cx,cy,s,col){
    ctx.save(); ctx.translate(cx,cy); ctx.scale(s,s); ctx.fillStyle=col;
    ctx.fillRect(-30,-36,60,36);
    ctx.fillRect(-42,-50,16,50); ctx.fillRect(26,-50,16,50);
    ctx.beginPath(); ctx.moveTo(-42,-50); ctx.lineTo(-34,-66); ctx.lineTo(-26,-50); ctx.fill();
    ctx.beginPath(); ctx.moveTo(26,-50); ctx.lineTo(34,-66); ctx.lineTo(42,-50); ctx.fill();
    ctx.restore();
  }
  function lockMini(cx,cy,col){
    ctx.save();
    ctx.strokeStyle=col; ctx.fillStyle=col; ctx.lineWidth=4; ctx.lineCap='round';
    ctx.beginPath(); ctx.arc(cx,cy-5,8,Math.PI,0); ctx.stroke();
    ctx.beginPath(); ctx.roundRect(cx-11,cy-5,22,17,3); ctx.fill();
    ctx.fillStyle='#c9c2d6';
    ctx.beginPath(); ctx.arc(cx,cy+2,2.5,0,Math.PI*2); ctx.fill();
    ctx.fillRect(cx-1.5,cy+2,3,6);
    ctx.restore();
  }

  function drawOverlay(){
    ctx.fillStyle='#000000aa'; ctx.fillRect(0,0,LW,LH);
    if(state==='roundclear'){
      textC('ラウンドクリア！', 300, 40, '#ffd54f', true);
      textC('スコア '+score, 360, 22, '#fff', false);
      const nxt = roundIdx+1<ROUNDS ? 'つぎのラウンドへ' : 'ボスがでるぞ…！';
      if(Math.floor(frame/30)%2===0) textC('タップで '+nxt, 440, 20, '#fff', false);
    }
    if(state==='stageclear'){
      textC('ステージクリア！', 250, 40, '#ffd54f', true);
      const st = lives>=3?3 : lives===2?2 : 1;
      for(let s=0;s<3;s++) star(LW/2-56+s*56, 330, 24, s<st?'#ffca28':'#ffffff33');
      textC('スコア '+score, 390, 22, '#fff', false);
      btn(430, 'マップへ', '#b3e5fc');
      btn(500, 'つぎのステージ！', '#ffca28');
    }
    if(state==='over'){
      textC('ざんねん…', 260, 40, '#ef9a9a', true);
      textC('スコア '+score, 330, 22, '#fff', false);
      drawAnimalHead(LW/2, 380, 26, charIdx, 'sad');
      btn(430, 'もういちど！', '#ffca28');
      btn(500, 'マップへ', '#b3e5fc');
    }
    if(state==='win'){
      textC('だいぼうけん', 220, 36, '#ffd54f', true);
      textC('クリア〜！！', 270, 44, '#ffd54f', true);
      for(let i=0;i<4;i++){
        const ay = 380 - Math.abs(Math.sin(frame*0.08+i))*22;
        drawAnimalHead(100+i*94, ay, 24, i, 'happy');
      }
      const total = prog.stars.reduce((a,b)=>a+b,0);
      textC('あつめた ほし ★'+total+' / 15', 460, 20, '#fff', false);
      if(Math.floor(frame/30)%2===0) textC('タップでマップへ', 530, 18, '#fff', false);
      // 紙ふぶき
      if(frame%4===0) burst(Math.random()*LW, 120, ['#ef5350','#ffca28','#4fc3f7','#aed581'][Math.floor(Math.random()*4)], 3);
    }
  }

  /* ---------- メインループ ---------- */
  function draw(){
    ctx.save();
    if(shake>0.4) ctx.translate((Math.random()-0.5)*shake*2,(Math.random()-0.5)*shake*2);

    if(state==='title'){ drawTitle(); }
    else if(state==='charsel'){ drawCharsel(); }
    else if(state==='map'){ drawMap(); }
    else {
      drawBg();
      drawBlocks();
      if(boss) drawBoss();
      drawDrops();
      drawPaddle();
      drawBalls();
      drawHUD();
      if(state!=='play') drawOverlay();
    }
    // パーティクル・ポップアップ（全画面共通）
    parts.forEach(p=>{ ctx.globalAlpha=Math.min(1,p.t/20); ctx.fillStyle=p.col; ctx.fillRect(p.x,p.y,p.sz,p.sz); });
    ctx.globalAlpha=1;
    popups.forEach(p=>{
      ctx.globalAlpha=Math.min(1,p.t/20);
      ctx.font="18px 'DotGothic16'"; ctx.textAlign='center';
      ctx.fillStyle='#0008'; ctx.fillText(p.text,p.x+2,p.y+2);
      ctx.fillStyle=p.col; ctx.fillText(p.text,p.x,p.y);
    });
    ctx.globalAlpha=1;
    if(flash>0){ ctx.fillStyle='rgba(255,80,80,'+flash*0.3+')'; ctx.fillRect(0,0,LW,LH); }
    ctx.restore();
  }

  function loop(){
    update();
    draw();
    requestAnimationFrame(loop);
  }
  loop();
})();
</script>
</body>
</html>
