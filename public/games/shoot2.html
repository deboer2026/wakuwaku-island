<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>まほうシューティング</title>
<link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@700;800;900&display=swap" rel="stylesheet">
<style>
:root {
  --sat: env(safe-area-inset-top, 0px);
  --sab: env(safe-area-inset-bottom, 0px);
}

*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{width:100%;height:100%;overflow:hidden;background:#050010;font-family:'M PLUS Rounded 1c',sans-serif;user-select:none;}
#wrap{position:fixed;inset:0;overflow:hidden;}
canvas{position:absolute;top:0;left:0;display:block;}
#dl{position:absolute;top:0;left:0;width:100%;height:100%;pointer-events:none;overflow:hidden;z-index:6;}
.o{position:absolute;line-height:1;pointer-events:none;}
#hud{position:absolute;top:0;left:0;right:0;z-index:20;padding:max(8px, env(safe-area-inset-top, 0px)) 12px 6px;background:linear-gradient(180deg,rgba(5,0,20,0.92),transparent);display:flex;justify-content:space-between;align-items:center;pointer-events:none;}
#sc{font-size:18px;font-weight:900;color:#FFD700;}
#wv{font-size:13px;font-weight:800;color:#CE93D8;}
#lv{font-size:16px;letter-spacing:2px;}
#back{position:absolute;bottom:20px;left:12px;z-index:20;background:rgba(0,0,0,0.5);border:1px solid rgba(255,255,255,0.2);border-radius:18px;padding:8px 16px;color:rgba(255,255,255,0.7);font-size:13px;font-weight:700;cursor:pointer;font-family:inherit;pointer-events:all;}
#bhpw{position:absolute;top:52px;left:12px;right:12px;z-index:20;display:none;}
#bhpl{font-size:10px;font-weight:800;color:#EF9A9A;margin-bottom:2px;}
#bhpb{height:10px;background:rgba(255,255,255,0.1);border-radius:5px;overflow:hidden;border:1px solid rgba(255,100,100,0.3);}
#bhpf{height:100%;background:linear-gradient(90deg,#FF5252,#FF8A65);border-radius:4px;transition:width 0.1s;}
#pwdisp{position:absolute;top:52px;right:12px;z-index:20;font-size:11px;font-weight:800;background:rgba(0,0,0,0.5);border-radius:10px;padding:3px 8px;display:none;}
#wbanner{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);z-index:30;pointer-events:none;text-align:center;display:none;}
#wbtext{font-size:28px;font-weight:900;background:linear-gradient(180deg,#fff,#FFE066 40%,#FF8C00);-webkit-background-clip:text;-webkit-text-fill-color:transparent;filter:drop-shadow(0 0 20px rgba(255,215,0,0.6));white-space:nowrap;}
#wsub{font-size:14px;color:rgba(255,255,255,0.7);margin-top:4px;}
@keyframes pop{0%{transform:translateY(0);opacity:1;}100%{transform:translateY(-55px);opacity:0;}}
.sp{position:absolute;font-size:14px;font-weight:900;pointer-events:none;z-index:25;animation:pop 0.8s ease-out forwards;white-space:nowrap;}
@keyframes expl{0%{transform:scale(0.5);opacity:1;}100%{transform:scale(2);opacity:0;}}
.ex{position:absolute;pointer-events:none;z-index:24;animation:expl 0.5s ease-out forwards;}
.ov{position:absolute;inset:0;z-index:100;display:flex;flex-direction:column;align-items:center;justify-content:center;background:rgba(5,0,20,0.88);backdrop-filter:blur(8px);opacity:0;pointer-events:none;transition:opacity 0.3s;}
.ov.show{opacity:1;pointer-events:all;}
.ob{background:linear-gradient(160deg,#1c0840,#080015);border:1.5px solid rgba(255,215,0,0.4);border-radius:22px;padding:22px 28px;text-align:center;max-width:290px;width:90%;}
.ot{font-size:22px;font-weight:900;color:#FFD700;margin:8px 0 6px;}
.os{font-size:12px;color:rgba(255,255,255,0.55);margin-bottom:12px;line-height:1.8;}
.osc{font-size:32px;font-weight:900;color:#FFD700;margin:6px 0;}
.bg{background:linear-gradient(135deg,#FF8F00,#FFD700);color:#0d0025;border:none;border-radius:12px;padding:11px 24px;font-size:15px;font-weight:900;cursor:pointer;font-family:inherit;margin:4px;}
.gg{background:rgba(255,255,255,0.08);border:1px solid rgba(255,255,255,0.2);border-radius:12px;padding:9px 18px;font-size:13px;font-weight:700;color:rgba(255,255,255,0.7);cursor:pointer;font-family:inherit;margin:4px;}
/* タイトル */
#ts{position:absolute;inset:0;z-index:200;overflow:hidden;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;}
#tsvg{position:absolute;inset:0;z-index:0;width:100%;height:100%;pointer-events:none;}
#tc{position:relative;z-index:10;width:100%;display:flex;flex-direction:column;align-items:center;padding-bottom:28px;}
@keyframes sh{0%{background-position:0%}100%{background-position:200%}}
@keyframes fs{0%,100%{transform:translateY(0);}50%{transform:translateY(-8px);}}
</style>
</head>
<body>
<div id="wrap">
  <canvas id="cv"></canvas>
  <div id="dl"></div>
  <div id="hud"><div id="sc">⭐ 0</div><div id="wv">Wave 1</div><div id="lv">❤️❤️❤️❤️❤️</div></div>
  <div id="bhpw"><div id="bhpl">👹 ボス</div><div id="bhpb"><div id="bhpf" style="width:100%"></div></div></div>
  <div id="pwdisp"></div>
  <div id="wbanner"><div id="wbtext"></div><div id="wsub"></div></div>
  <button id="back" onclick="goBack()">← もどる</button>

  <!-- タイトル -->
  <div id="ts">
    <svg id="tsvg" viewBox="0 0 390 800" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid slice">
      <defs>
        <linearGradient id="tg" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#050008"/><stop offset="40%" stop-color="#0d0025"/><stop offset="100%" stop-color="#1a0030"/></linearGradient>
        <radialGradient id="mn" cx="50%" cy="50%" r="50%"><stop offset="0%" stop-color="#FFF9C4"/><stop offset="100%" stop-color="#F9A825"/></radialGradient>
        <radialGradient id="mg" cx="50%" cy="50%" r="50%"><stop offset="0%" stop-color="rgba(255,240,150,0.35)"/><stop offset="100%" stop-color="rgba(255,215,0,0)"/></radialGradient>
        <filter id="gl"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
        <filter id="gl2"><feGaussianBlur stdDeviation="2" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
      </defs>
      <rect width="390" height="800" fill="url(#tg)"/>
      <circle cx="25" cy="35" r="1.2" fill="white" opacity="0.8"/><circle cx="85" cy="18" r="1.5" fill="white" opacity="0.9"/>
      <circle cx="155" cy="52" r="1" fill="white" opacity="0.7"/><circle cx="225" cy="15" r="1.8" fill="white" opacity="0.9"/>
      <circle cx="285" cy="45" r="1.2" fill="white" opacity="0.8"/><circle cx="355" cy="25" r="1" fill="white" opacity="0.7"/>
      <circle cx="45" cy="105" r="1" fill="white" opacity="0.6"/><circle cx="135" cy="82" r="1.2" fill="white" opacity="0.75"/>
      <circle cx="305" cy="68" r="1" fill="white" opacity="0.65"/><circle cx="385" cy="92" r="1.3" fill="white" opacity="0.8"/>
      <line x1="50" y1="60" x2="90" y2="80" stroke="white" stroke-width="1.5" opacity="0.4" stroke-linecap="round"/>
      <circle cx="330" cy="90" r="55" fill="url(#mg)"/>
      <circle cx="330" cy="90" r="28" fill="url(#mn)" filter="url(#gl)"/>
      <circle cx="322" cy="82" r="8" fill="rgba(255,255,255,0.3)"/>
      <rect x="80" y="480" width="230" height="180" rx="4" fill="#1a0840" opacity="0.95"/>
      <rect x="80" y="480" width="230" height="180" rx="4" fill="none" stroke="rgba(255,215,0,0.2)" stroke-width="1.5"/>
      <path d="M170,660 L170,595 Q195,565 220,595 L220,660Z" fill="#080015"/>
      <rect x="97" y="498" width="16" height="22" rx="8 8 0 0" fill="rgba(255,180,0,0.2)"/>
      <rect x="120" y="498" width="16" height="22" rx="8 8 0 0" fill="rgba(255,180,0,0.15)"/>
      <rect x="258" y="498" width="16" height="22" rx="8 8 0 0" fill="rgba(255,180,0,0.2)"/>
      <rect x="280" y="498" width="16" height="22" rx="8 8 0 0" fill="rgba(255,180,0,0.12)"/>
      <rect x="55" y="432" width="50" height="228" rx="4" fill="#160638"/>
      <rect x="50" y="420" width="62" height="18" rx="3" fill="#160638"/>
      <line x1="80" y1="420" x2="80" y2="388" stroke="#6D4C41" stroke-width="3" stroke-linecap="round"/>
      <polygon points="80,388 102,394 80,400" fill="#C62828" filter="url(#gl2)"/>
      <rect x="64" y="450" width="20" height="26" rx="10 10 0 0" fill="rgba(255,200,0,0.18)"/>
      <rect x="285" y="432" width="50" height="228" rx="4" fill="#160638"/>
      <rect x="280" y="420" width="62" height="18" rx="3" fill="#160638"/>
      <line x1="310" y1="420" x2="310" y2="388" stroke="#6D4C41" stroke-width="3" stroke-linecap="round"/>
      <polygon points="310,388 288,394 310,400" fill="#1565C0" filter="url(#gl2)"/>
      <rect x="296" y="450" width="20" height="26" rx="10 10 0 0" fill="rgba(255,200,0,0.2)"/>
      <rect x="155" y="382" width="80" height="102" rx="4" fill="#1c0848"/>
      <rect x="155" y="382" width="80" height="102" rx="4" fill="none" stroke="rgba(255,215,0,0.28)" stroke-width="1.5"/>
      <rect x="174" y="400" width="42" height="16" rx="3" fill="#160638"/>
      <rect x="172" y="405" width="22" height="28" rx="11 11 0 0" fill="rgba(255,215,0,0.2)"/>
      <line x1="195" y1="382" x2="195" y2="348" stroke="#8D6E63" stroke-width="3.5" stroke-linecap="round"/>
      <polygon points="195,348 220,355 195,362" fill="#FFD700" filter="url(#gl)"/>
      <rect x="76" y="472" width="5" height="13" rx="1" fill="#795548"/>
      <ellipse cx="78" cy="470" rx="5" ry="7" fill="#FF6F00" filter="url(#gl2)"/>
      <rect x="309" y="472" width="5" height="13" rx="1" fill="#795548"/>
      <ellipse cx="311" cy="470" rx="5" ry="7" fill="#FF6F00" filter="url(#gl2)"/>
      <rect x="0" y="655" width="390" height="145" fill="#0a0020"/>
      <circle cx="195" cy="655" r="75" fill="none" stroke="rgba(255,215,0,0.06)" stroke-width="1"/>
      <circle cx="195" cy="655" r="50" fill="none" stroke="rgba(255,215,0,0.04)" stroke-width="1"/>
    </svg>
    <div id="tc">
      <div style="text-align:center;padding:0 20px 14px;background:linear-gradient(0deg,rgba(5,0,20,0.97) 55%,transparent);width:100%;">
        <div style="font-size:34px;font-weight:900;background:linear-gradient(180deg,#fff,#FFE066 35%,#FF8C00);-webkit-background-clip:text;-webkit-text-fill-color:transparent;filter:drop-shadow(0 0 18px rgba(255,215,0,0.5));letter-spacing:2px;margin-bottom:2px;">まほうの</div>
        <div style="font-size:34px;font-weight:900;background:linear-gradient(180deg,#fff,#FFE066 35%,#FF8C00);-webkit-background-clip:text;-webkit-text-fill-color:transparent;filter:drop-shadow(0 0 18px rgba(255,215,0,0.5));letter-spacing:2px;margin-bottom:6px;">シューティング</div>
        <div style="font-size:10px;font-weight:700;color:rgba(255,215,0,0.55);letter-spacing:4px;">✦ FANTASY SHOOTING ✦</div>
      </div>
      <div style="background:linear-gradient(160deg,rgba(20,5,50,0.97),rgba(8,0,24,0.98));border:1.5px solid rgba(255,215,0,0.3);border-radius:20px;padding:14px 18px 16px;max-width:300px;width:90%;box-shadow:0 20px 60px rgba(0,0,0,0.8);">
        <div style="font-size:11px;font-weight:700;color:rgba(255,215,0,0.65);letter-spacing:1px;margin-bottom:6px;text-align:center;">✦ キャラを えらんでね ✦</div>
        <div id="csel" style="display:flex;gap:6px;justify-content:center;flex-wrap:wrap;margin-bottom:10px;"></div>
        <div style="display:flex;flex-direction:column;gap:5px;margin-bottom:12px;">
          <div style="display:flex;align-items:center;gap:8px;background:rgba(255,255,255,0.04);border-radius:8px;padding:6px 10px;"><span style="font-size:18px;">🪄</span><div><div style="font-size:11px;font-weight:800;color:#CE93D8;">タップで うごく・じどうしゃげき！</div><div style="font-size:9px;color:rgba(255,255,255,0.4);">ゆびのいちに うごくよ</div></div></div>
          <div style="display:flex;align-items:center;gap:8px;background:rgba(255,255,255,0.04);border-radius:8px;padding:6px 10px;"><span style="font-size:18px;">👾</span><div><div style="font-size:11px;font-weight:800;color:#EF9A9A;">ウェーブを クリアしよう！</div><div style="font-size:9px;color:rgba(255,255,255,0.4);">4ウェーブごとにボス出現！</div></div></div>
          <div style="display:flex;align-items:center;gap:8px;background:rgba(255,255,255,0.04);border-radius:8px;padding:6px 10px;"><span style="font-size:18px;">💎</span><div><div style="font-size:11px;font-weight:800;color:#80DEEA;">パワーアップ3しゅるい！</div><div style="font-size:9px;color:rgba(255,255,255,0.4);">れんしゃ・ひろがりだん・むてき</div></div></div>
        </div>
        <div id="ths" style="font-size:11px;text-align:center;color:rgba(255,215,0,0.55);margin-bottom:8px;"></div>
        <button id="sbtn" style="width:100%;background:linear-gradient(135deg,#9C27B0,#CE93D8,#9C27B0);background-size:200%;animation:sh 2.5s infinite linear;color:white;border:none;border-radius:12px;padding:13px;font-size:17px;font-weight:900;cursor:pointer;font-family:inherit;letter-spacing:2px;box-shadow:0 4px 16px rgba(156,39,176,0.5);pointer-events:all;">🪄 スタート！</button>
      </div>
    </div>
  </div>

  <!-- GO -->
  <div class="ov" id="goscr">
    <div class="ob"><div style="font-size:44px;">💀</div><div class="ot">ゲームオーバー</div><div class="os" id="gosub"></div><div class="osc" id="gosc"></div><button class="bg" onclick="startGame()">もういちど</button><button class="gg" onclick="showTitle()">タイトルへ</button></div>
  </div>
  <!-- Clear -->
  <div class="ov" id="clscr">
    <div class="ob"><div style="font-size:44px;">🏆</div><div class="ot">ぜんぶ クリア！！</div><div class="os" id="clsub"></div><div class="osc" id="clsc"></div><button class="bg" onclick="startGame()">もういちど</button><button class="gg" onclick="showTitle()">タイトルへ</button></div>
  </div>
</div>

<script>
const CHARS=['🧙','🧝','🧚','🧜','🦸','🧞'];
const ETYPES=[
  {e:'🐙',hp:1,sc:10,spd:1.2,sh:false},
  {e:'🦂',hp:2,sc:20,spd:1.0,sh:true},
  {e:'🐛',hp:1,sc:10,spd:1.5,sh:false},
  {e:'🦑',hp:3,sc:30,spd:0.8,sh:true},
  {e:'🦇',hp:2,sc:20,spd:1.8,sh:false},
];
const BTYPES=[{e:'🐉',hp:30,sc:300,n:'ドラゴン'},{e:'👺',hp:45,sc:400,n:'おに'},{e:'🧙',hp:60,sc:500,n:'まじゅつし'}];
const PWTYPES=[
  {e:'💎',t:'rapid',l:'れんしゃ！',c:'#80DEEA',d:8000},
  {e:'⭐',t:'spread',l:'ひろがりだん！',c:'#FFD700',d:7000},
  {e:'🛡️',t:'shield',l:'むてき！',c:'#A5D6A7',d:5000},
];

let W,H,selC=0,PEMO='🧙';
let score,wave,lives,maxLives=5;
let running=false,overed=false;
let px,py,tx,ty;
let bullets=[],ebullets=[],enemies=[],pups=[],parts=[];
let boss=null,bossHp=0,bossMxHp=0;
let stimer=0,siv=12,pwt=null,pwtype=null;
let wclearing=false,wkilled=0,wtotal=0;
let bgstars=[];
let raf=null;
// DOM
const cv=document.getElementById('cv');
const ctx=cv.getContext('2d');
const dl=document.getElementById('dl');
let pel=null,eels={},bel=null,pels={};

function resize(){
  W=window.innerWidth;H=window.innerHeight;
  cv.width=W;cv.height=H;
  cv.style.width=W+'px';cv.style.height=H+'px';
}

function initStars(){
  bgstars=[];
  for(let i=0;i<80;i++)bgstars.push({x:Math.random()*W,y:Math.random()*H,r:Math.random()*1.2+0.3,s:Math.random()*0.3+0.1,a:Math.random()*0.6+0.3});
}

function buildCSel(){
  const w=document.getElementById('csel');w.innerHTML='';
  CHARS.forEach((c,i)=>{
    const b=document.createElement('button');
    b.style.cssText=`width:50px;height:50px;border-radius:12px;background:${i===selC?'rgba(255,215,0,0.2)':'rgba(255,255,255,0.06)'};border:2px solid ${i===selC?'#FFD700':'rgba(255,255,255,0.1)'};display:flex;align-items:center;justify-content:center;font-size:28px;cursor:pointer;touch-action:manipulation;`;
    b.textContent=c;
    const fn=()=>{selC=i;PEMO=CHARS[i];buildCSel();};
    b.onclick=fn;b.addEventListener('touchend',e=>{e.preventDefault();fn();},{passive:false});
    w.appendChild(b);
  });
}

function init(){
  resize();
  initStars();
  buildCSel();
  const hs=getHs();
  document.getElementById('ths').textContent=hs>0?`ハイスコア：⭐${hs}`:'';
  document.getElementById('sbtn').addEventListener('click',startGame);
  document.getElementById('sbtn').addEventListener('touchend',e=>{e.preventDefault();startGame();},{passive:false});
  cv.addEventListener('touchstart',e=>{e.preventDefault();tx=e.touches[0].clientX;ty=e.touches[0].clientY;},{passive:false});
  cv.addEventListener('touchmove',e=>{e.preventDefault();tx=e.touches[0].clientX;ty=e.touches[0].clientY;},{passive:false});
  cv.addEventListener('mousemove',e=>{if(running){tx=e.clientX;ty=e.clientY;}});
  window.addEventListener('resize',()=>{resize();initStars();});
}

function startGame(){
  document.getElementById('ts').style.display='none';
  document.getElementById('goscr').classList.remove('show');
  document.getElementById('clscr').classList.remove('show');
  score=0;wave=1;lives=maxLives;overed=false;running=true;
  px=W/2;py=H*0.82;tx=px;ty=py;
  bullets=[];ebullets=[];enemies=[];pups=[];parts=[];
  boss=null;pwtype=null;wclearing=false;wkilled=0;wtotal=0;
  stimer=0;siv=12;
  clearTimeout(pwt);
  updateHUD();spawnWave(1);
  if(raf)cancelAnimationFrame(raf);
  let last=0;
  (function loop(ts){
    if(!running)return;
    if(ts-last>14){last=ts;update();draw();}
    raf=requestAnimationFrame(loop);
  })(0);
}

function showTitle(){
  cancelAnimationFrame(raf);running=false;
  document.getElementById('ts').style.display='flex';
  document.getElementById('goscr').classList.remove('show');
  document.getElementById('clscr').classList.remove('show');
  dl.innerHTML='';pel=null;bel=null;eels={};pels={};
}

function spawnWave(w){
  wclearing=false;wkilled=0;wtotal=0;
  enemies=[];ebullets=[];
  const isBoss=w%4===0;
  showBanner(w,isBoss);
  setTimeout(()=>{
    if(!running)return;
    if(isBoss)spawnBoss(w);
    else spawnEnemies(w);
  },2000);
}

function spawnBoss(w){
  const bt=BTYPES[Math.floor(w/4-1)%BTYPES.length];
  const hp=bt.hp+Math.floor(w/4)*10;
  boss={x:W/2,y:H*0.14,e:bt.e,size:60,hp,mhp:hp,sc:bt.sc,vx:1.5,st:0,ph:0};
  bossHp=hp;bossMxHp=hp;
  document.getElementById('bhpw').style.display='block';updateBHp();
}

function spawnEnemies(w){
  const cnt=6+Math.floor(w/2)*2;
  const et=ETYPES[Math.min(Math.floor((w-1)/2),ETYPES.length-1)];
  wtotal=cnt;
  for(let i=0;i<cnt;i++){
    const fx=Math.random()*5|0;
    let ex,ey;
    if(fx===0){ex=(W/(cnt+1))*(i+1);ey=H*0.04+i%2*H*0.05;}
    else if(fx===1){const m=cnt/2;ex=W/2+(i-m)*42;ey=H*0.04+Math.abs(i-m)*H*0.04;}
    else if(fx===2){ex=(W/(cnt+1))*(i+1);ey=H*0.04+Math.sin(i*0.8)*H*0.05;}
    else if(fx===3){const a=(i/cnt)*Math.PI*2,r=75+i*7;ex=W/2+Math.cos(a)*r;ey=H*0.14+Math.sin(a)*r*0.35;}
    else{ex=50+Math.random()*(W-100);ey=H*0.04+Math.random()*H*0.14;}
    enemies.push({x:Math.max(30,Math.min(W-30,ex)),y:ey,vx:(Math.random()-0.5)*et.spd*0.8,vy:et.spd*(0.4+Math.random()*0.3),e:et.e,hp:et.hp+(w>5?1:0),sc:et.sc,size:36,sh:et.sh,st:Math.random()*120,siv:100+Math.random()*60,_id:Math.random(),dead:false});
  }
}

function update(){
  // プレイヤー移動
  const dx=tx-px,dy=ty-py,dist=Math.sqrt(dx*dx+dy*dy);
  if(dist>3){const spd=Math.min(dist,12);px+=dx/dist*spd;py+=dy/dist*spd;}
  px=Math.max(20,Math.min(W-20,px));
  py=Math.max(H*0.18,Math.min(H*0.92,py));

  // 自弾発射
  stimer++;
  if(stimer>=siv){
    stimer=0;
    if(pwtype==='rapid'){fire(px,py,-0.15,'#80DEEA');fire(px,py,0.15,'#80DEEA');}
    else if(pwtype==='spread'){fire(px,py,0,'#FFD700');fire(px-15,py-5,-0.35,'#FFD700');fire(px+15,py-5,0.35,'#FFD700');}
    else fire(px,py,0,'#CE93D8');
  }

  // 弾
  bullets.forEach(b=>{b.x+=b.vx;b.y+=b.vy;});
  bullets=bullets.filter(b=>b.y>-20&&b.x>-20&&b.x<W+20);
  ebullets.forEach(b=>{b.x+=b.vx;b.y+=b.vy;});
  ebullets=ebullets.filter(b=>b.y<H+20&&b.y>-20&&b.x>-20&&b.x<W+20);

  // 敵
  enemies.forEach(e=>{
    e.x+=e.vx;e.y+=e.vy;
    if(e.x<20||e.x>W-20)e.vx*=-1;
    if(e.y>H*0.85){e.y=-e.size;e.x=50+Math.random()*(W-100);e.vy=Math.abs(e.vy);}
    if(e.sh){e.st++;if(e.st>=e.siv){e.st=0;const adx=px-e.x,ady=py-e.y,al=Math.sqrt(adx*adx+ady*ady);ebullets.push({x:e.x,y:e.y,vx:adx/al*2.5,vy:ady/al*2.5,r:5,c:'#FF5252'});}}
  });

  // ボス
  if(boss){
    boss.x+=boss.vx;
    if(boss.x<50||boss.x>W-50)boss.vx*=-1;
    boss.y=H*0.14+Math.sin(Date.now()/800)*18;
    boss.st++;
    const biv=boss.ph>=2?38:boss.ph===1?52:72;
    if(boss.st>=biv){
      boss.st=0;
      const adx=px-boss.x,ady=py-boss.y,al=Math.sqrt(adx*adx+ady*ady);
      if(boss.ph===0)ebullets.push({x:boss.x,y:boss.y+30,vx:adx/al*3,vy:ady/al*3,r:8,c:'#FF5252'});
      else if(boss.ph===1){for(let a=-1;a<=1;a++){const ang=Math.atan2(ady,adx)+a*0.28;ebullets.push({x:boss.x,y:boss.y+30,vx:Math.cos(ang)*3,vy:Math.sin(ang)*3,r:7,c:'#FF7043'});}}
      else{for(let i=0;i<5;i++){const ang=(i/5)*Math.PI*2;ebullets.push({x:boss.x,y:boss.y,vx:Math.cos(ang)*2.8,vy:Math.sin(ang)*2.8,r:7,c:'#FF5252'});}}
    }
  }

  // パワーアップ
  pups.forEach(p=>p.y+=1.5);
  pups=pups.filter(p=>p.y<H+40);

  // 当たり判定：自弾vs敵
  bullets.forEach(b=>{
    if(b.hit)return;
    enemies.forEach(e=>{
      if(e.dead||b.hit)return;
      if(Math.abs(b.x-e.x)<e.size*0.5&&Math.abs(b.y-e.y)<e.size*0.5){
        b.hit=true;e.hp--;
        addParts(e.x,e.y,'hit');
        if(e.hp<=0){e.dead=true;score+=e.sc;wkilled++;expl(e.x,e.y);if(Math.random()<0.15)spawnPw(e.x,e.y);spop(`+${e.sc}`,e.x,e.y,'#FFD700');}
      }
    });
    if(boss&&!b.hit){
      if(Math.abs(b.x-boss.x)<boss.size*0.55&&Math.abs(b.y-boss.y)<boss.size*0.55){
        b.hit=true;boss.hp--;addParts(boss.x,boss.y,'hit');updateBHp();
        if(boss.hp<=bossMxHp*0.5&&boss.ph<1)boss.ph=1;
        if(boss.hp<=bossMxHp*0.25&&boss.ph<2)boss.ph=2;
        if(boss.hp<=0){score+=boss.sc;expl(boss.x,boss.y,true);spop(`+${boss.sc}🎉`,boss.x,boss.y,'#FFD700');boss=null;document.getElementById('bhpw').style.display='none';wclearing=true;setTimeout(nextWave,2000);}
      }
    }
  });
  bullets=bullets.filter(b=>!b.hit);
  enemies=enemies.filter(e=>!e.dead);

  // 敵弾vsプレイヤー
  if(!plt){
    ebullets.forEach(b=>{
      if(b.hit)return;
      if(Math.abs(b.x-px)<22&&Math.abs(b.y-py)<22){b.hit=true;if(pwtype!=='shield')hitP();else addParts(b.x,b.y,'shield');}
    });
    ebullets=ebullets.filter(b=>!b.hit);
    enemies.forEach(e=>{
      if(e.dead)return;
      if(Math.abs(e.x-px)<26&&Math.abs(e.y-py)<26){e.dead=true;if(pwtype!=='shield')hitP();expl(e.x,e.y);}
    });
  }

  // パワーアップ取得
  pups=pups.filter(p=>{
    if(Math.abs(p.x-px)<30&&Math.abs(p.y-py)<30){actPw(p);return false;}
    return true;
  });

  // ウェーブ完了
  if(!wclearing&&!boss&&wtotal>0&&wkilled>=wtotal&&running){wclearing=true;setTimeout(nextWave,1500);}

  // パーティクル
  parts.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=0.15;p.l--;p.a=p.l/p.ml;});
  parts=parts.filter(p=>p.l>0);
  bgstars.forEach(s=>{s.y+=s.s;if(s.y>H){s.y=0;s.x=Math.random()*W;}});

  updateHUD();updateDOM();ensurePlayer();
}

let plt=false,ptimer=null;
function hitP(){
  lives--;updateHUD();addParts(px,py,'hit');
  if(lives<=0){endGame(false);return;}
  plt=true;clearTimeout(ptimer);
  ptimer=setTimeout(()=>{plt=false;},2500);
}

function nextWave(){
  if(!running)return;
  wave++;
  if(wave>9){endGame(true);return;}
  enemies=[];ebullets=[];spawnWave(wave);
}

function fire(x,y,vxo,c){
  const spd=pwtype==='rapid'?14:10;
  bullets.push({x,y,vx:vxo*spd,vy:-spd,r:5,c,hit:false});
}

function spawnPw(x,y){
  const p=PWTYPES[Math.floor(Math.random()*PWTYPES.length)];
  pups.push({x,y,e:p.e,t:p.t,l:p.l,lbl:p.l_||p.l,c:p.c,_id:Math.random(),...p});
}

function actPw(p){
  pwtype=p.t;clearTimeout(pwt);
  const el=document.getElementById('pwdisp');
  el.style.display='block';el.textContent=p.l;el.style.color=p.c;
  pwt=setTimeout(()=>{pwtype=null;el.style.display='none';},p.d);
  addParts(px,py,'power');spop(p.l,px,py,p.c);
}

// 描画
function draw(){
  ctx.clearRect(0,0,W,H);
  const bg=ctx.createLinearGradient(0,0,0,H);
  bg.addColorStop(0,'#050008');bg.addColorStop(0.5,'#0d0025');bg.addColorStop(1,'#1a0030');
  ctx.fillStyle=bg;ctx.fillRect(0,0,W,H);
  bgstars.forEach(s=>{ctx.save();ctx.globalAlpha=s.a;ctx.fillStyle='white';ctx.beginPath();ctx.arc(s.x,s.y,s.r,0,Math.PI*2);ctx.fill();ctx.restore();});
  // 自弾
  bullets.forEach(b=>{ctx.save();const g=ctx.createRadialGradient(b.x,b.y,0,b.x,b.y,b.r*2);g.addColorStop(0,b.c);g.addColorStop(1,'rgba(0,0,0,0)');ctx.fillStyle=g;ctx.fillRect(b.x-b.r*2,b.y-b.r*2,b.r*4,b.r*4);ctx.fillStyle=b.c;ctx.beginPath();ctx.arc(b.x,b.y,b.r,0,Math.PI*2);ctx.fill();ctx.restore();});
  // 敵弾
  ebullets.forEach(b=>{ctx.save();ctx.shadowBlur=8;ctx.shadowColor=b.c;ctx.fillStyle=b.c;ctx.beginPath();ctx.arc(b.x,b.y,b.r,0,Math.PI*2);ctx.fill();ctx.restore();});
  // パーティクル
  parts.forEach(p=>{ctx.save();ctx.globalAlpha=p.a;ctx.fillStyle=p.c;ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,Math.PI*2);ctx.fill();ctx.restore();});
}

// DOM管理
function ensurePlayer(){
  if(!pel){pel=document.createElement('div');pel.className='o';pel.style.fontSize='40px';pel.style.animation='fs 2s ease-in-out infinite';pel.style.zIndex='10';dl.appendChild(pel);}
  pel.textContent=PEMO;
  pel.style.left=(px-20)+'px';pel.style.top=(py-20)+'px';
  pel.style.opacity=plt&&Math.floor(Date.now()/100)%2===0?'0.3':'1';
  pel.style.filter=pwtype==='shield'?'drop-shadow(0 0 12px #A5D6A7)':'drop-shadow(0 0 8px #CE93D8)';
}

function updateDOM(){
  const eids=new Set(enemies.map(e=>e._id));
  Object.keys(eels).forEach(k=>{if(!eids.has(parseFloat(k))){eels[k]?.remove();delete eels[k];}});
  enemies.forEach(e=>{
    if(!eels[e._id]){const el=document.createElement('div');el.className='o';el.style.fontSize=e.size+'px';el.textContent=e.e;dl.appendChild(el);eels[e._id]=el;}
    eels[e._id].style.left=(e.x-e.size/2)+'px';eels[e._id].style.top=(e.y-e.size/2)+'px';
  });
  if(boss){
    if(!bel){bel=document.createElement('div');bel.className='o';bel.style.filter='drop-shadow(0 0 16px rgba(255,80,80,0.7))';dl.appendChild(bel);}
    bel.style.fontSize=boss.size+'px';bel.textContent=boss.e;bel.style.left=(boss.x-boss.size/2)+'px';bel.style.top=(boss.y-boss.size/2)+'px';
  } else if(bel){bel.remove();bel=null;}
  const pids=new Set(pups.map(p=>p._id));
  Object.keys(pels).forEach(k=>{if(!pids.has(parseFloat(k))){pels[k]?.remove();delete pels[k];}});
  pups.forEach(p=>{
    if(!pels[p._id]){const el=document.createElement('div');el.className='o';el.style.fontSize='28px';el.style.filter=`drop-shadow(0 0 10px ${p.c})`;el.style.animation='fs 0.8s ease-in-out infinite';el.textContent=p.e;dl.appendChild(el);pels[p._id]=el;}
    pels[p._id].style.left=(p.x-14)+'px';pels[p._id].style.top=(p.y-14)+'px';
  });
}

function showBanner(w,isBoss){
  const el=document.getElementById('wbanner');
  document.getElementById('wbtext').textContent=isBoss?`👹 ボスウェーブ！`:`⚔️ Wave ${w}`;
  document.getElementById('wsub').textContent=isBoss?'ボスをたおせ！':`てきが やってくる！`;
  el.style.display='block';setTimeout(()=>el.style.display='none',1800);
}
function expl(x,y,big=false){
  const el=document.createElement('div');el.className='ex';el.style.left=(x-20)+'px';el.style.top=(y-20)+'px';el.style.fontSize=big?'52px':'36px';el.textContent=big?'💥✨':'💥';
  document.getElementById('wrap').appendChild(el);setTimeout(()=>el.remove(),600);
}
function spop(t,x,y,c){
  const el=document.createElement('div');el.className='sp';el.textContent=t;el.style.color=c;el.style.left=(x-20)+'px';el.style.top=(y-20)+'px';
  document.getElementById('wrap').appendChild(el);setTimeout(()=>el.remove(),850);
}
function addParts(x,y,type){
  const cs={hit:['#EF9A9A','#FF5252'],power:['#CE93D8','#FFD700'],shield:['#A5D6A7','white']}[type]||['white'];
  for(let i=0;i<8;i++){const a=Math.random()*Math.PI*2,s=2+Math.random()*3;parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-1.5,r:2+Math.random()*3,c:cs[i%cs.length],l:18,ml:18,a:1});}
}
function updateHUD(){
  document.getElementById('sc').textContent=`⭐ ${score}`;
  document.getElementById('wv').textContent=`Wave ${wave}`;
  document.getElementById('lv').textContent='❤️'.repeat(lives)+'🖤'.repeat(maxLives-lives);
}
function updateBHp(){if(!boss)return;document.getElementById('bhpf').style.width=`${Math.max(0,(boss.hp/bossMxHp)*100)}%`;}
function endGame(cl){
  running=false;overed=true;cancelAnimationFrame(raf);clearTimeout(pwt);clearTimeout(ptimer);
  const hs=getHs(),isNew=score>hs;
  if(isNew)localStorage.setItem('shooting_hs2',score);
  Object.values(eels).forEach(e=>e?.remove());Object.values(pels).forEach(e=>e?.remove());
  if(bel){bel.remove();bel=null;}if(pel){pel.remove();pel=null;}eels={};pels={};
  if(cl){
    document.getElementById('clsub').innerHTML=`スコア：<b style="color:#FFD700">${score}</b>　Wave${wave}クリア！`;
    document.getElementById('clsc').textContent=isNew?'🏆 ハイスコアこうしん！':'';
    document.getElementById('clscr').classList.add('show');
  } else {
    document.getElementById('gosub').innerHTML=`スコア：<b style="color:#FFD700">${score}</b>　Wave${wave}`;
    document.getElementById('gosc').textContent=isNew?'🏆 ハイスコアこうしん！':'';
    document.getElementById('goscr').classList.add('show');
  }
}
function getHs(){return parseInt(localStorage.getItem('shooting_hs2')||'0');}
function goBack(){cancelAnimationFrame(raf);running=false;if(window.parent!==window)window.parent.postMessage({type:'goBack'}
function goHome(){
  if(window.parent !== window){
    window.parent.postMessage({type:'goHome'},'*');
  } else {
    window.location.href='/';
  }
},'*');else history.back();}

setTimeout(init,80);
</script>
