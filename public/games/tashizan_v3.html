<!DOCTYPE html>
<html lang="ja">
<head>
<script src="/games/wakuwaku_ui.js"></script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>たしざんトレイン 3D</title>
<link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@700;800;900&family=DotGothic16&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{width:100%;height:100%;overflow:hidden;font-family:'M PLUS Rounded 1c',sans-serif;user-select:none;-webkit-user-select:none;}
body{background:linear-gradient(180deg,#8ED4F0,#DFF6E3);transition:background .9s ease;}
body.sky-meadow{background:linear-gradient(180deg,#8FD8F5 0%,#CFEFD8 72%,#EAF8DF 100%);}
body.sky-forest{background:linear-gradient(180deg,#79C7E8 0%,#BEE7CE 68%,#DDF2D6 100%);}
body.sky-lake{background:linear-gradient(180deg,#7ECBF0 0%,#BFE9F5 62%,#E6F8F2 100%);}
body.sky-beach{background:linear-gradient(180deg,#6FC4F2 0%,#C4E9F8 55%,#FFE7BE 100%);}
body.sky-town{background:linear-gradient(180deg,#8CC9F0 0%,#D6EAF7 65%,#F3F0E4 100%);}
body.sky-snow{background:linear-gradient(180deg,#A6C6E6 0%,#DCEAF8 60%,#F6FAFF 100%);}
body.sky-sunset{background:linear-gradient(180deg,#6A63B6 0%,#F09A7A 55%,#FFD9A8 100%);}
body.sky-night{background:linear-gradient(180deg,#16214C 0%,#2C3A72 55%,#4B4E92 100%);}
body.sky-candy{background:linear-gradient(180deg,#F7A8D2 0%,#FFD3E6 55%,#FFF0C9 100%);}
body.sky-galaxy{background:linear-gradient(180deg,#150F3A 0%,#3B2A78 50%,#7B5BC0 100%);}

#wrap{position:fixed;inset:0;overflow:hidden;}
#cv{display:block;position:absolute;inset:0;width:100%;height:100%;z-index:0;touch-action:none;}

/* ============ shared UI ============ */
.screen{position:absolute;inset:0;z-index:40;display:none;flex-direction:column;align-items:center;justify-content:center;
  padding:calc(14px + var(--sat,0px)) 16px calc(14px + var(--sab,0px));}
.screen.on{display:flex;}
.btn{font-family:inherit;border:none;cursor:pointer;font-weight:900;color:#fff;border-radius:999px;
  background:linear-gradient(180deg,#FFB74D,#F57C00);box-shadow:0 5px 0 #C55A00,0 8px 18px rgba(0,0,0,.25);
  padding:13px 34px;font-size:19px;transition:transform .1s;}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 #C55A00;}
.btn.blue{background:linear-gradient(180deg,#64B5F6,#1976D2);box-shadow:0 5px 0 #0D47A1,0 8px 18px rgba(0,0,0,.25);}
.btn.blue:active{box-shadow:0 1px 0 #0D47A1;}
.btn.green{background:linear-gradient(180deg,#81C784,#388E3C);box-shadow:0 5px 0 #1B5E20,0 8px 18px rgba(0,0,0,.25);}
.btn.green:active{box-shadow:0 1px 0 #1B5E20;}
.btn.small{padding:9px 20px;font-size:14px;}
.panel{background:rgba(255,255,255,.94);border-radius:26px;padding:20px 18px;width:min(360px,92vw);
  box-shadow:0 8px 0 rgba(0,0,0,.12),0 16px 34px rgba(0,0,0,.24);text-align:center;}
.ttl{font-family:'DotGothic16',sans-serif;color:#2E4A7D;}

/* ============ title ============ */
#title-screen{justify-content:flex-end;padding-bottom:calc(24px + var(--sab,0px));background:linear-gradient(180deg,rgba(0,0,0,0) 40%,rgba(0,0,0,.18));}
#title-logo{width:min(360px,92vw);text-align:center;margin-bottom:auto;margin-top:calc(6vh + var(--sat,0px));}
#title-logo .t-sub{font-family:'DotGothic16',sans-serif;font-size:13px;letter-spacing:3px;color:#fff;
  text-shadow:0 2px 6px rgba(0,0,0,.45);margin-bottom:4px;}
#title-logo .t-main{font-family:'DotGothic16',sans-serif;font-size:min(46px,11vw);color:#fff;line-height:1.15;
  text-shadow:0 3px 0 #1B5E9E,0 6px 0 #14477A,0 10px 20px rgba(0,0,0,.45);}
#title-logo .t-tag{margin-top:8px;font-size:13px;font-weight:800;color:#fff;text-shadow:0 2px 5px rgba(0,0,0,.5);}
#title-menu{display:flex;flex-direction:column;align-items:center;gap:11px;}
#title-sub-row{display:flex;gap:10px;}
.title-stat{margin-top:10px;font-size:12px;font-weight:800;color:#fff;text-shadow:0 2px 5px rgba(0,0,0,.5);}

/* ============ course select ============ */
#course-screen,#map-screen,#zukan-screen,#loco-screen{background:rgba(18,34,58,.62);backdrop-filter:blur(4px);}
.sheet{width:min(380px,94vw);max-height:88vh;overflow-y:auto;-webkit-overflow-scrolling:touch;
  background:rgba(255,255,255,.95);border-radius:26px;padding:16px 14px calc(16px + var(--sab,0px));
  box-shadow:0 10px 30px rgba(0,0,0,.35);}
.sheet-h{font-family:'DotGothic16',sans-serif;font-size:19px;color:#2E4A7D;text-align:center;margin-bottom:4px;}
.sheet-sub{font-size:11.5px;color:#6a7a90;text-align:center;margin-bottom:12px;font-weight:700;}
.course-card{display:flex;align-items:center;gap:12px;width:100%;border:none;cursor:pointer;font-family:inherit;text-align:left;
  border-radius:20px;padding:12px;margin-bottom:11px;background:#fff;box-shadow:0 4px 0 rgba(0,0,0,.13),0 8px 16px rgba(0,0,0,.13);}
.course-card:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(0,0,0,.13);}
.course-card.locked{opacity:.55;filter:grayscale(.6);}
.cc-badge{width:56px;height:56px;border-radius:16px;flex:0 0 56px;display:flex;align-items:center;justify-content:center;
  font-family:'DotGothic16',sans-serif;font-size:22px;color:#fff;text-shadow:0 2px 3px rgba(0,0,0,.3);}
.cc-name{font-size:16px;font-weight:900;color:#2E4A7D;}
.cc-desc{font-size:11.5px;color:#6a7a90;font-weight:700;margin-top:2px;line-height:1.5;}
.cc-prog{font-size:11px;color:#F57C00;font-weight:900;margin-top:3px;}

/* ============ station map ============ */
#map-line{position:relative;padding:6px 2px 2px;}
.st-row{display:flex;align-items:center;gap:10px;margin-bottom:8px;}
.st-rail{width:22px;flex:0 0 22px;display:flex;flex-direction:column;align-items:center;align-self:stretch;}
.st-dot{width:16px;height:16px;border-radius:50%;background:#B0BEC5;border:3px solid #fff;box-shadow:0 1px 3px rgba(0,0,0,.3);}
.st-dot.done{background:#FFC107;}
.st-dot.cur{background:#4CAF50;animation:dotPulse 1.1s ease-in-out infinite;}
@keyframes dotPulse{0%,100%{transform:scale(1)}50%{transform:scale(1.25)}}
.st-line{flex:1;width:4px;background:#CFD8DC;}
.st-btn{flex:1;border:none;cursor:pointer;font-family:inherit;text-align:left;border-radius:16px;padding:9px 12px;
  background:#fff;box-shadow:0 3px 0 rgba(0,0,0,.11);display:flex;align-items:center;justify-content:space-between;gap:8px;}
.st-btn:active{transform:translateY(2px);box-shadow:0 1px 0 rgba(0,0,0,.11);}
.st-btn.locked{opacity:.5;filter:grayscale(.7);}
.st-nm{font-size:14px;font-weight:900;color:#2E4A7D;}
.st-hint{font-size:10.5px;color:#7b8aa0;font-weight:700;margin-top:1px;}
.st-stars{font-size:13px;letter-spacing:1px;white-space:nowrap;}

/* ============ HUD ============ */
#hud{position:absolute;top:0;left:0;right:0;z-index:30;display:none;
  padding:calc(8px + var(--sat,0px)) 12px 8px;
  background:linear-gradient(180deg,rgba(10,26,48,.55),rgba(10,26,48,.16) 70%,transparent);}
#hud.on{display:block;}
.hud-row{display:flex;align-items:center;justify-content:space-between;gap:8px;}
.hud-btn{background:rgba(0,0,0,.42);color:#fff;border:2px solid rgba(255,255,255,.36);border-radius:999px;
  min-width:34px;height:34px;padding:0 12px;font-size:13px;font-weight:900;cursor:pointer;font-family:inherit;
  display:flex;align-items:center;justify-content:center;}
#hud-mid{text-align:center;flex:1;}
#hud-station{font-family:'DotGothic16',sans-serif;font-size:14px;color:#fff;text-shadow:0 2px 4px rgba(0,0,0,.5);}
#hud-prog{font-size:11px;font-weight:800;color:rgba(255,255,255,.85);text-shadow:0 1px 3px rgba(0,0,0,.5);}
#hud-hearts{margin-top:5px;text-align:center;font-size:14px;letter-spacing:2px;}

/* ============ question banner ============ */
#q-banner{position:absolute;left:50%;transform:translateX(-50%);top:calc(74px + var(--sat,0px));z-index:28;
  display:none;background:rgba(255,255,255,.93);border-radius:999px;padding:6px 20px;
  font-size:15px;font-weight:900;color:#2E4A7D;box-shadow:0 4px 12px rgba(0,0,0,.22);white-space:nowrap;}
#q-banner.on{display:block;animation:bannerIn .4s ease;}
#q-banner span{display:inline-block;vertical-align:middle;font-family:'DotGothic16',sans-serif;}
#q-banner .eq-a,#q-banner .eq-b,#q-banner .eq-q{min-width:34px;height:34px;line-height:34px;border-radius:11px;
  color:#fff;font-size:22px;text-align:center;margin:0 2px;padding:0 4px;}
#q-banner .eq-a{background:#E9A23B;}
#q-banner .eq-b{background:#4FA84F;}
#q-banner .eq-q{background:#3B79C4;}
#q-banner .eq-op{font-size:19px;color:#546C8C;margin:0 3px;}
@keyframes bannerIn{from{opacity:0;transform:translateX(-50%) translateY(-10px)}to{opacity:1;transform:translateX(-50%) translateY(0)}}

/* ============ answer dock ============ */
#dock{position:absolute;left:0;right:0;bottom:0;z-index:30;display:none;
  padding:10px 12px calc(12px + var(--sab,0px));
  background:linear-gradient(0deg,rgba(10,26,48,.55),rgba(10,26,48,.12) 70%,transparent);}
#dock.on{display:block;}
#dock-tip{text-align:center;font-size:11.5px;font-weight:800;color:#fff;text-shadow:0 1px 4px rgba(0,0,0,.55);margin-bottom:7px;}
#choices{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;}
.ch{width:66px;height:66px;border-radius:20px;border:none;cursor:pointer;font-family:'DotGothic16',sans-serif;
  font-size:30px;color:#fff;background:linear-gradient(180deg,#64B5F6,#1565C0);
  box-shadow:0 5px 0 #0D3E7A,0 9px 18px rgba(0,0,0,.3);transition:transform .1s;}
.ch:active{transform:translateY(4px);box-shadow:0 1px 0 #0D3E7A;}
.ch.ok{background:linear-gradient(180deg,#A5D6A7,#2E7D32);box-shadow:0 5px 0 #1B5E20;animation:chOk .5s ease;}
.ch.ng{background:linear-gradient(180deg,#EF9A9A,#C62828);box-shadow:0 5px 0 #8E1616;animation:chNg .45s ease;}
@keyframes chOk{0%{transform:scale(1)}45%{transform:scale(1.22)}100%{transform:scale(1)}}
@keyframes chNg{0%,100%{transform:translateX(0)}20%{transform:translateX(-8px)}40%{transform:translateX(8px)}60%{transform:translateX(-5px)}80%{transform:translateX(5px)}}
#hint-btn{display:block;margin:9px auto 0;background:rgba(255,255,255,.9);color:#2E4A7D;border:none;border-radius:999px;
  padding:7px 20px;font-size:12.5px;font-weight:900;font-family:inherit;cursor:pointer;box-shadow:0 3px 0 rgba(0,0,0,.16);}
#hint-btn:active{transform:translateY(2px);box-shadow:0 1px 0 rgba(0,0,0,.16);}

/* ============ overlays ============ */
#flash{position:absolute;inset:0;z-index:35;pointer-events:none;opacity:0;}
#toast{position:absolute;left:50%;top:44%;transform:translate(-50%,-50%);z-index:60;pointer-events:none;
  font-family:'DotGothic16',sans-serif;font-size:34px;color:#fff;text-shadow:0 3px 0 rgba(0,0,0,.35),0 0 22px rgba(255,255,255,.7);
  opacity:0;transition:opacity .2s;}
#toast.on{opacity:1;animation:toastPop .55s ease;}
@keyframes toastPop{0%{transform:translate(-50%,-50%) scale(.4)}55%{transform:translate(-50%,-50%) scale(1.18)}100%{transform:translate(-50%,-50%) scale(1)}}
.fx{position:absolute;z-index:37;pointer-events:none;font-size:20px;animation:fxFly var(--dur,.9s) ease-out forwards;}
@keyframes fxFly{0%{opacity:1;transform:translate(0,0) scale(.5)}100%{opacity:0;transform:translate(var(--tx),var(--ty)) scale(1.3)}}

/* ============ result ============ */
#result-screen{background:rgba(14,30,54,.66);backdrop-filter:blur(4px);}
#r-title{font-family:'DotGothic16',sans-serif;font-size:26px;color:#2E4A7D;margin-bottom:2px;}
#r-station{font-size:12px;font-weight:800;color:#7b8aa0;margin-bottom:10px;}
#r-stars{font-size:38px;letter-spacing:4px;margin-bottom:8px;}
#r-stars span{display:inline-block;opacity:.22;filter:grayscale(1);}
#r-stars span.on{opacity:1;filter:none;animation:starPop .5s ease backwards;}
@keyframes starPop{0%{transform:scale(0) rotate(-40deg)}60%{transform:scale(1.45)}100%{transform:scale(1)}}
#r-msg{font-size:13.5px;font-weight:800;color:#455a75;line-height:1.7;margin-bottom:10px;}
#r-unlock{display:none;background:linear-gradient(180deg,#FFF8E1,#FFE9B0);border:2.5px dashed #F0B429;border-radius:18px;
  padding:10px;margin-bottom:12px;}
#r-unlock.on{display:block;animation:unlockIn .6s ease;}
@keyframes unlockIn{0%{transform:scale(.7);opacity:0}60%{transform:scale(1.07)}100%{transform:scale(1);opacity:1}}
#r-unlock-h{font-size:11px;font-weight:900;color:#B07300;letter-spacing:2px;}
#r-unlock-cv{display:block;margin:2px auto 0;}
#r-unlock-n{font-size:15px;font-weight:900;color:#6B4A00;}
#r-btns{display:flex;gap:9px;justify-content:center;flex-wrap:wrap;}

/* ============ zukan ============ */
#zukan-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-bottom:12px;}
.zk{border-radius:16px;padding:6px 3px 7px;background:#F4F8FC;box-shadow:inset 0 0 0 2px #E0E9F2;text-align:center;}
.zk.got{background:linear-gradient(180deg,#FFFDF4,#FFF3D2);box-shadow:inset 0 0 0 2.5px #F5C842;}
.zk canvas{display:block;margin:0 auto;}
.zk-n{font-size:10.5px;font-weight:900;color:#2E4A7D;margin-top:1px;}
.zk-q{font-family:'DotGothic16',sans-serif;font-size:28px;color:#C3CFDD;line-height:54px;}

/* ============ loco garage ============ */
#loco-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:12px;}
.lc{border:none;cursor:pointer;font-family:inherit;border-radius:18px;padding:8px 6px 9px;background:#fff;
  box-shadow:0 3px 0 rgba(0,0,0,.12);text-align:center;}
.lc:active{transform:translateY(2px);box-shadow:0 1px 0 rgba(0,0,0,.12);}
.lc.sel{box-shadow:0 0 0 3px #4CAF50,0 3px 0 rgba(0,0,0,.12);}
.lc.locked{opacity:.5;filter:grayscale(.7);}
.lc canvas{display:block;margin:0 auto;}
.lc-n{font-size:12px;font-weight:900;color:#2E4A7D;}
.lc-req{font-size:10px;font-weight:800;color:#E07B00;}

/* ============ error / loading ============ */
#err-screen{background:rgba(20,40,60,.92);color:#fff;font-weight:800;font-size:15px;text-align:center;line-height:2;z-index:200;}
#load-screen{background:linear-gradient(180deg,#8ED4F0,#DFF6E3);z-index:150;}
#load-screen .ld-t{font-family:'DotGothic16',sans-serif;font-size:20px;color:#2E4A7D;margin-bottom:12px;}
.ld-track{width:180px;height:8px;border-radius:8px;background:rgba(255,255,255,.6);overflow:hidden;}
.ld-fill{height:100%;width:40%;border-radius:8px;background:linear-gradient(90deg,#FFB74D,#F57C00);animation:ldSlide 1.1s ease-in-out infinite;}
@keyframes ldSlide{0%{margin-left:-40%}100%{margin-left:100%}}
</style>
</head>
<body class="sky-meadow">
<div id="wrap">
  <canvas id="cv"></canvas>

  <div id="hud">
    <div class="hud-row">
      <button class="hud-btn" id="btn-back">もどる</button>
      <div id="hud-mid">
        <div id="hud-station">はじまりえき</div>
        <div id="hud-prog">1 / 3 もんめ</div>
      </div>
      <button class="hud-btn" id="btn-bgm">♪</button>
    </div>
    <div id="hud-hearts"></div>
  </div>

  <div id="q-banner">あわせて なんびき？</div>

  <div id="dock">
    <div id="dock-tip">どうぶつを タップすると かぞえられるよ</div>
    <div id="choices"></div>
    <button id="hint-btn">ヒントを みる</button>
  </div>

  <div id="flash"></div>
  <div id="toast"></div>

  <!-- TITLE -->
  <div class="screen on" id="title-screen">
    <div id="title-logo">
      <div class="t-sub">わくわくアイランド</div>
      <div class="t-main">たしざん<br>トレイン</div>
      <div class="t-tag">どうぶつを のせて しゅっぱつ！</div>
    </div>
    <div id="title-menu">
      <button class="btn" id="btn-start">あそぶ</button>
      <div id="title-sub-row">
        <button class="btn blue small" id="btn-zukan">なかまずかん</button>
        <button class="btn green small" id="btn-loco">きかんしゃ</button>
      </div>
      <div class="title-stat" id="title-stat">あつめた ほし 0 / 72</div>
    </div>
  </div>

  <!-- COURSE SELECT -->
  <div class="screen" id="course-screen">
    <div class="sheet">
      <div class="sheet-h">ろせんを えらぼう</div>
      <div class="sheet-sub">すすむほど おおきな かずに ちょうせん！</div>
      <div id="course-list"></div>
      <button class="btn small blue" id="btn-course-back" style="width:100%;margin-top:2px;">タイトルへ</button>
    </div>
  </div>

  <!-- STATION MAP -->
  <div class="screen" id="map-screen">
    <div class="sheet">
      <div class="sheet-h" id="map-h">こひつじせん</div>
      <div class="sheet-sub" id="map-sub">えきを えらんで しゅっぱつ！</div>
      <div id="map-line"></div>
      <button class="btn small blue" id="btn-map-back" style="width:100%;margin-top:6px;">ろせんへ</button>
    </div>
  </div>

  <!-- RESULT -->
  <div class="screen" id="result-screen">
    <div class="panel">
      <div id="r-title">とうちゃく！</div>
      <div id="r-station">はじまりえき</div>
      <div id="r-stars"><span>★</span><span>★</span><span>★</span></div>
      <div id="r-msg"></div>
      <div id="r-unlock">
        <div id="r-unlock-h">なかまが ふえた！</div>
        <canvas id="r-unlock-cv" width="120" height="96"></canvas>
        <div id="r-unlock-n"></div>
      </div>
      <div id="r-btns">
        <button class="btn small green" id="btn-next">つぎのえき</button>
        <button class="btn small" id="btn-retry">もういちど</button>
        <button class="btn small blue" id="btn-tomap">ろせんず</button>
      </div>
    </div>
  </div>

  <!-- ZUKAN -->
  <div class="screen" id="zukan-screen">
    <div class="sheet">
      <div class="sheet-h">なかまずかん</div>
      <div class="sheet-sub" id="zukan-sub">0 / 12 ひき</div>
      <div id="zukan-grid"></div>
      <button class="btn small blue" id="btn-zukan-back" style="width:100%;">とじる</button>
    </div>
  </div>

  <!-- LOCO -->
  <div class="screen" id="loco-screen">
    <div class="sheet">
      <div class="sheet-h">きかんしゃ こうかん</div>
      <div class="sheet-sub" id="loco-sub">ほしを あつめると ふえるよ</div>
      <div id="loco-grid"></div>
      <button class="btn small blue" id="btn-loco-back" style="width:100%;">とじる</button>
    </div>
  </div>

  <div class="screen" id="err-screen">3Dの よみこみに しっぱいしました。<br>でんぱの よいところで もういちど ためしてね。</div>
  <div class="screen on" id="load-screen">
    <div class="ld-t">せんろを つないでいます…</div>
    <div class="ld-track"><div class="ld-fill"></div></div>
  </div>
</div>

<script src="/games/safe_area.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
'use strict';
/* ============================================================
   たしざんトレイン 3D  (tashizan_v3)
   わくわくアイランド / Three.js r128
   ============================================================ */

/* ================= safe localStorage ================= */
var SAFE_LS=(function(){
  try{var t='__ttt';localStorage.setItem(t,'1');localStorage.removeItem(t);return localStorage;}
  catch(e){var m={};return{getItem:function(k){return (k in m)?m[k]:null;},setItem:function(k,v){m[k]=String(v);},removeItem:function(k){delete m[k];}};}
})();
var SAVE_KEY='tashizan_v3_progress';

/* ================= data ================= */
var ANIMALS=[
  {key:'neko',   name:'ねこ',    body:0xF2A64B, muzzle:0xFFF1DC, ear:'tri',   tail:'thin'},

/* ================= save ================= */
function blankSave(){
  var st=[],i,j,row;
  for(i=0;i<COURSES.length;i++){row=[];for(j=0;j<8;j++)row.push(0);st.push(row);}
  return {schemaVersion:3, stars:st, loco:'red'};
}
function clampStar(v){v=Math.floor(Number(v));if(!isFinite(v)||v<0)return 0;if(v>3)return 3;return v;}
function loadSave(){
  var raw=null;
  try{raw=SAFE_LS.getItem(SAVE_KEY);}catch(e){raw=null;}
  var p=null;
  if(raw){try{p=JSON.parse(raw);}catch(e){p=null;}}
  var out=blankSave();
  if(p&&typeof p==='object'){
    if(Object.prototype.toString.call(p.stars)==='[object Array]'){
      for(var i=0;i<out.stars.length;i++){
        var src=p.stars[i];
        if(Object.prototype.toString.call(src)!=='[object Array]')continue;
        for(var j=0;j<8;j++)out.stars[i][j]=clampStar(src[j]);
      }
    }
    for(var k=0;k<LOCOS.length;k++){if(LOCOS[k].key===p.loco){out.loco=p.loco;break;}}
  }
  return out;
}
function persist(){try{SAFE_LS.setItem(SAVE_KEY,JSON.stringify(save));}catch(e){}}

function totalStars(){
  var n=0,i,j;
  for(i=0;i<save.stars.length;i++)for(j=0;j<save.stars[i].length;j++)n+=save.stars[i][j];
  return n;
}
function clearedCount(){
  var n=0,i,j;
  for(i=0;i<save.stars.length;i++)for(j=0;j<save.stars[i].length;j++)if(save.stars[i][j]>0)n++;
  return n;
}
function unlockedAnimals(){return Math.min(ANIMALS.length,Math.floor(clearedCount()/2));}
function courseUnlocked(ci){
  if(ci===0)return true;
  var prev=save.stars[ci-1],n=0,j;
  for(j=0;j<prev.length;j++)if(prev[j]>0)n++;
  return n>=5;
}
function stationUnlocked(ci,si){
  if(!courseUnlocked(ci))return false;
  if(si===0)return true;
  return save.stars[ci][si-1]>0;
}
function locoUnlocked(l){return totalStars()>=l.req;}

/* ================= question generator ================= */
function randInt(a,b){return a+Math.floor(Math.random()*(b-a+1));}
function makeQuestion(ci,si){
  var a,b,sum,minS,maxS,guard=0;
  if(ci===0){maxS=Math.min(5,3+Math.floor(si/2));minS=2;}
  else if(ci===1){maxS=Math.min(10,6+Math.floor(si*0.6));minS=4;}
  else{maxS=Math.min(20,13+si);minS=11;}
  do{
    sum=randInt(minS,maxS);
    if(ci===2){b=randInt(2,Math.min(9,sum-3));a=sum-b;}
    else{a=randInt(1,sum-1);b=sum-a;}
    guard++;
  }while(guard<80&&(a<1||b<1||a>13||b>13));
  if(a<1||b<1){a=1;b=Math.max(1,sum-1);}
  return {a:a,b:b,ans:a+b};
}
function makeChoices(ans,n,cap){
  var set=[ans],guard=0;
  while(set.length<n&&guard<200){
    guard++;
    var d=randInt(1,3);
    var c=Math.random()<0.5?ans+d:ans-d;
    if(c<0||c>cap)continue;
    if(set.indexOf(c)>=0)continue;
    set.push(c);
  }
  guard=0;
  while(set.length<n&&guard<200){guard++;var v=randInt(0,cap);if(set.indexOf(v)<0)set.push(v);}
  for(var i=set.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=set[i];set[i]=set[j];set[j]=t;}
  return set;
}

/* matCache/texCacheの共有物は disposeGroup() で絶対にdisposeしない */
var SHARED_MAT=new Set();
var SHARED_TEX=new Set();
var matCache={};
function M(c,opt){
  var key=c+'|'+(opt||'');
  if(matCache[key])return matCache[key];
  var m=new THREE.MeshLambertMaterial({color:c});
  if(opt==='t'){m.transparent=true;m.opacity=0.62;}
  if(opt==='e'){m=new THREE.MeshBasicMaterial({color:c});}
  matCache[key]=m;SHARED_MAT.add(m);return m;
}
function box(w,h,d,c){return new THREE.Mesh(new THREE.BoxGeometry(w,h,d),M(c));}
function cyl(rt,rb,h,c,seg){return new THREE.Mesh(new THREE.CylinderGeometry(rt,rb,h,seg||12),M(c));}
function sph(r,c,s1,s2){return new THREE.Mesh(new THREE.SphereGeometry(r,s1||12,s2||10),M(c));}
function cone(r,h,c,seg){return new THREE.Mesh(new THREE.ConeGeometry(r,h,seg||10),M(c));}

/* ================= digit plate texture ================= */
var texCache={};
function digitTex(txt,bg,fg){
  var key=txt+'|'+bg+'|'+fg;
  if(texCache[key])return texCache[key];
  var c=document.createElement('canvas');c.width=160;c.height=160;
  var x=c.getContext('2d');
  x.fillStyle=bg;
  if(x.roundRect){x.beginPath();x.roundRect(6,6,148,148,28);x.fill();}
  else{x.fillRect(6,6,148,148);}
  x.strokeStyle='rgba(255,255,255,0.85)';x.lineWidth=7;
  if(x.roundRect){x.beginPath();x.roundRect(12,12,136,136,24);x.stroke();}
  /* digits only: never emoji, which silently fail to rasterise in iOS WebView */
  x.fillStyle=fg;x.textAlign='center';x.textBaseline='middle';
  x.font='bold 94px sans-serif';
  x.fillText(String(txt),80,88);
  var t=new THREE.CanvasTexture(c);
  t.anisotropy=1;
  texCache[key]=t;SHARED_TEX.add(t);return t;
}
function plateMesh(txt,bg,fg,size){
  var s=size||1.0;
  var m=new THREE.Mesh(new THREE.PlaneGeometry(s,s),new THREE.MeshBasicMaterial({map:digitTex(txt,bg,fg),transparent:true}));
  return m;
}

  if(a.wool){

  var head=sph(0.265,bodyC,12,10);head.position.set(0,0.80,0.06);head.castShadow=true;g.add(head);

  if(!a.beak){var nz=sph(0.036,0x59404A,7,6);nz.position.set(0,0.775,a.muzzle?0.325:0.28);g.add(nz);}
  /* ears */
  var earC=a.earColor||bodyC;

function disposeGroup(g){
  /* NOTE: animal clones share geometry/material with their prototype - never dispose those */
  if(g.userData&&g.userData.base!==undefined)return;
  g.traverse(function(o){
    if(o.userData&&o.userData.base!==undefined)return;
    if(o.geometry&&o.geometry.dispose)o.geometry.dispose();
    if(o.material){
      var mats=Array.isArray(o.material)?o.material:[o.material];
      mats.forEach(function(m){
        if(SHARED_MAT.has(m))return;
        if(m.map&&!SHARED_TEX.has(m.map))m.map.dispose();
        m.dispose();
      });
    }
  });
}
function clearWorld(){
  while(world.children.length){

/* ================= animal placement ================= */
function padSlots(n,padZ){
  /* rows of at most 5 = a natural counting group; back rows are staggered
     half a step sideways so nothing hides behind anything on screen. */
  var out=[];
  var rows=Math.ceil(n/5);
  var perRow=Math.ceil(n/rows);
  var idx=0,r,c;
  var zSpan=1.56;
  for(r=0;r<rows;r++){
    var inRow=Math.min(perRow,n-idx);
    if(inRow<=0)break;
    var step=(inRow>1)?(2.44/(inRow-1)):0;
    var stagger=(rows>1&&(r%2===1))?(step*0.32):0;
    for(c=0;c<inRow;c++){
      var x=(inRow===1)?0:(-1.22+step*c);
      x+=stagger;
      if(x>1.30)x=1.30;
      var z=padZ+(rows===1?0:(zSpan/2-(zSpan/(rows-1))*r));
      out.push({x:x,y:0.16,z:z});
      idx++;
    }
  }
  return out;
}
function spawnAnimals(side,count,keyPool,padZ){
  var slots=padSlots(count,padZ);
  var arr=[];
  for(var i=0;i<count;i++){
    var key=keyPool[i%keyPool.length];
    var m=getAnimal(key);
    var sc=count>10?0.44:(count>6?0.5:0.56);
    m.scale.setScalar(0.001);
    m.position.set(slots[i].x,slots[i].y,slots[i].z);
    m.rotation.y=0.15-Math.random()*0.3;
    m.userData={base:sc,hop:0,idx:i,side:side,home:{x:slots[i].x,y:slots[i].y,z:slots[i].z}};
    world.add(m);
    arr.push(m);
    tweenScale(m,sc,0.34,i*0.055);
  }
  animalSlots[side]=arr;
  return arr;
}
function clearAnimals(){
  var sides=['a','b'],i,j;
  for(i=0;i<SIDES.length;i++){
    var arr=animalSlots[SIDES[i]];
    for(j=0;j<arr.length;j++)world.remove(arr[j]);
    animalSlots[sides[i]]=[];
  }
}

/* ================= tween ================= */
var tweens=[];
function tweenScale(obj,to,dur,delay){
  tweens.push({obj:obj,kind:'scale',from:obj.scale.x,to:to,t:-(delay||0),dur:dur||0.3});
}
function tweenPos(obj,to,dur,delay,arc,done){
  tweens.push({obj:obj,kind:'pos',from:obj.position.clone(),to:to,t:-(delay||0),dur:dur||0.5,arc:arc||0,done:done});
}
function tweenVal(from,to,dur,cb,done){
  tweens.push({kind:'val',from:from,to:to,t:0,dur:dur,cb:cb,done:done});
}
function stepTweens(dt){
  for(var i=tweens.length-1;i>=0;i--){
    var tw=tweens[i];
    tw.t+=dt;
    if(tw.t<0)continue;
    var k=Math.min(1,tw.t/tw.dur);
    var e=1-Math.pow(1-k,3);
    if(tw.kind==='scale'){
      var s=tw.from+(tw.to-tw.from)*e;
      if(k<1&&tw.to>tw.from)s=tw.from+(tw.to-tw.from)*(e*1.12-0.12*e*e*e);
      tw.obj.scale.setScalar(Math.max(0.0001,s));
    }else if(tw.kind==='pos'){
      tw.obj.position.lerpVectors(tw.from,tw.to,e);
      if(tw.arc)tw.obj.position.y+=Math.sin(k*Math.PI)*tw.arc;
    }else if(tw.kind==='val'){
      tw.cb(tw.from+(tw.to-tw.from)*e);
    }
    if(k>=1){
      if(tw.done)tw.done();
      tweens.splice(i,1);
    }
  }
}

/* ================= sfx ================= */
var actx=null;
function ac(){
  if(actx)return actx;
  try{var C=window.AudioContext||window.webkitAudioContext;if(!C)return null;actx=new C();}catch(e){actx=null;}
  return actx;
}
function beep(freq,dur,type,vol,delay){
  var c=ac();if(!c)return;
  try{
    if(c.state==='suspended'&&c.resume)c.resume();
    var t=c.currentTime+(delay||0);
    var o=c.createOscillator(),g=c.createGain();
    o.type=type||'triangle';o.frequency.setValueAtTime(freq,t);
    g.gain.setValueAtTime(0.0001,t);
    g.gain.exponentialRampToValueAtTime(vol||0.12,t+0.02);
    g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
    o.connect(g);g.connect(c.destination);
    o.start(t);o.stop(t+dur+0.05);
  }catch(e){}
}

/* えき開始/離脱のたびに更新する。古いsetTimeout/Tween完了callbackは
   実行時にこれと一致しなければ何もしない（もどる連打などでの割り込み防止） */
var flowToken=0;
function cancelFlow(){
  flowToken++;
  tweens.length=0;
  hintRunning=false;
  departing=false;
  locked=true;
}

function poolForStation(ci,si){
  var n=unlockedAnimals();
  var avail=[];
  for(var i=0;i<Math.max(2,n);i++)avail.push(ANIMALS[i%ANIMALS.length].key);
  var seed=(ci*8+si);
  var a=avail[seed%avail.length];
  var b=avail[(seed+3)%avail.length];
  if(b===a)b=avail[(seed+1)%avail.length];
  return [a,b];
}

function startStation(ci,si){
  cancelFlow();
  curC=ci;curS=si;qIdx=0;misses=0;departing=false;trainOffset=0;
  state='play';
  setScreen(null);
  buildWorld(COURSES[ci].stations[si].theme);
  placeCamera();
  show('hud',true);show('dock',true);
  initBgm(COURSES[ci].bgm);
  $('hud-station').textContent=COURSES[ci].stations[si].name;
  nextQuestion();
}

function updateHud(){
  $('hud-prog').textContent=(qIdx+1)+' / '+Q_PER_STATION+' もんめ';
  var h='';
  for(var i=0;i<Q_PER_STATION;i++)h+=(i<qIdx?'●':'○');
  $('hud-hearts').textContent=h;
}

function nextQuestion(){
  locked=true;hintRunning=false;
  clearAnimals();
  curQ=makeQuestion(curC,curS);
  curPool=poolForStation(curC,curS);
  updateHud();
  spawnAnimals('a',curQ.a,[curPool[0]],2.55);
  spawnAnimals('b',curQ.b,[curPool[1]],-1.05);
  setPlate(plateA,curQ.a,'#E9A23B');
  setPlate(plateB,curQ.b,'#4FA84F');
  setPlate(plateQ,'?','#3B79C4');
  showEquation(curQ.a,curQ.b,null);
  buildChoices();
  $('dock-tip').textContent='どうぶつを タップすると かぞえられるよ';
  (function(tok){setTimeout(function(){if(tok===flowToken)locked=false;},TUNE.ANSWER_UNLOCK_MS);})(flowToken);
}

function setPlate(mesh,txt,bg){
  if(!mesh)return;
  mesh.material.map=digitTex(String(txt),bg,'#FFFFFF');
  mesh.material.needsUpdate=true;
}

function showEquation(a,b,ans){
  var el=$('q-banner');
  el.innerHTML='<span class="eq-a">'+a+'</span><span class="eq-op">＋</span>'+
               '<span class="eq-b">'+b+'</span><span class="eq-op">＝</span>'+
               '<span class="eq-q">'+(ans===null||ans===undefined?'？':ans)+'</span>';
  el.classList.add('on');
}

function buildChoices(){
  var n=COURSES[curC].choices;
  var cap=curC===2?22:(curC===1?13:8);
  var list=makeChoices(curQ.ans,n,cap);
  var g=$('choices');g.innerHTML='';
  for(var i=0;i<list.length;i++){
    (function(v){
      var b=document.createElement('button');
      b.className='ch';b.textContent=v;
      b.addEventListener('click',function(){onAnswer(b,v);});
      g.appendChild(b);
    })(list[i]);
  }
}

function onAnswer(btn,v){
  if(locked||departing)return;
  locked=true;
  if(v===curQ.ans){
    btn.classList.add('ok');
    setPlate(plateQ,curQ.ans,'#2E9E5B');
    showEquation(curQ.a,curQ.b,curQ.ans);
    sfxOk();
    toast('せいかい！');
    flash('rgba(120,220,140,0.35)');
    confetti();
    departTrain();
  }else{
    misses++;
    btn.classList.add('ng');
    sfxNg();
    toast('もういちど！');
    flash('rgba(255,170,120,0.28)');
    camShake=0.35;
    $('dock-tip').textContent='ゆっくり かぞえてみよう';
    (function(tok){
      setTimeout(function(){
        if(tok!==flowToken)return;
        btn.classList.remove('ng');
        locked=false;
        runHint();
      },TUNE.WRONG_RETRY_MS);
    })(flowToken);
  }
}

/* ---- boarding + departure ---- */
function departTrain(){
  departing=true;
  var tok=flowToken;
  var all=animalSlots.a.concat(animalSlots.b);
  for(var i=0;i<all.length;i++){
    (function(m,i){
      var targetX=(i<animalSlots.a.length)?(-0.25+(Math.random()-0.5)*1.6):(2.95+(Math.random()-0.5)*1.6);
      var dest=new THREE.Vector3(targetX,0.85,-6.3+(Math.random()-0.5)*0.7);
      tweenPos(m,dest,TUNE.BOARD_DURATION,0.24+i*TUNE.BOARD_STAGGER,1.4);
      tweens.push({obj:m,kind:'scale',from:m.userData.base,to:m.userData.base*0.9,t:-(0.24+i*TUNE.BOARD_STAGGER),dur:TUNE.BOARD_DURATION});
    })(all[i],i);
  }
  var wait=0.4+all.length*TUNE.BOARD_STAGGER+0.7;
  tweenVal(0,1,wait,function(){},function(){
    if(tok!==flowToken)return;
    sfxWhistle();
    puffSmoke();
    tweenVal(0,TUNE.TRAIN_DEPART_DISTANCE,TUNE.TRAIN_DEPART_DURATION,function(v){trainOffset=v;},function(){
      if(tok!==flowToken)return;
      clearAnimals();
      trainOffset=0;
      qIdx++;
      if(qIdx>=Q_PER_STATION){finishStation();}
      else{departing=false;nextQuestion();}
    });
  });
}
function puffSmoke(){
  for(var i=0;i<smokeParts.length;i++){smokeParts[i].t=-smokeParts[i].delay;}
}

/* ---- hint: count animals one by one ---- */
function runHint(){
  if(hintRunning)return;
  hintRunning=true;
  var tok=flowToken;
  var all=animalSlots.a.concat(animalSlots.b);
  var i=0;
  function step(){
    if(tok!==flowToken||!hintRunning||state!=='play'){hintRunning=false;return;}
    if(i>=all.length){
      hintRunning=false;
      $('dock-tip').textContent='ぜんぶで なんびき かな？';
      return;
    }
    var m=all[i];
    m.userData.hop=0.55;
    beep(520+i*38,0.1,'triangle',0.08,0);
    countBadge(m,i+1);
    i++;
    setTimeout(step,TUNE.HINT_STEP_MS);
  }
  step();
}
function countBadge(mesh,num){
  var p=toScreen(new THREE.Vector3(mesh.position.x,mesh.position.y+1.0,mesh.position.z));
  var el=document.createElement('div');
  el.className='fx';
  el.style.left=p.x+'px';el.style.top=p.y+'px';
  el.style.setProperty('--tx','0px');el.style.setProperty('--ty','-46px');
  el.style.setProperty('--dur','0.95s');
  el.style.fontFamily="'DotGothic16',sans-serif";
  el.style.fontSize='26px';el.style.color='#fff';
  el.style.textShadow='0 2px 0 rgba(0,0,0,.4),0 0 12px rgba(255,255,255,.8)';
  el.textContent=num;
  document.body.appendChild(el);
  setTimeout(function(){if(el.parentNode)el.parentNode.removeChild(el);},1000);
}

/* ---- tap animal to count ---- */
var raycaster=new THREE.Raycaster();
var ndc=new THREE.Vector2();
function pickAnimal(cx,cy){
  ndc.x=(cx/window.innerWidth)*2-1;
  ndc.y=-(cy/window.innerHeight)*2+1;
  raycaster.setFromCamera(ndc,camera);
  var all=animalSlots.a.concat(animalSlots.b);
  var hits=raycaster.intersectObjects(all,true);
  if(!hits.length)return null;
  var o=hits[0].object;
  while(o&&all.indexOf(o)<0)o=o.parent;
  return o||null;
}
function onTapWorld(cx,cy){
  if(state!=='play'||departing)return;
  var m=pickAnimal(cx,cy);
  if(!m)return;
  m.userData.hop=0.6;
  sfxTap();
  var all=animalSlots.a.concat(animalSlots.b);
  countBadge(m,all.indexOf(m)+1);
}
if(window.PointerEvent){
  cv.addEventListener('pointerdown',function(e){e.preventDefault();onTapWorld(e.clientX,e.clientY);},{passive:false});
}else{
  cv.addEventListener('touchstart',function(e){
    var t=e.changedTouches&&e.changedTouches[0];
    if(t)onTapWorld(t.clientX,t.clientY);
  },{passive:true});
  cv.addEventListener('mousedown',function(e){onTapWorld(e.clientX,e.clientY);});
}

function confetti(){

/* ================= station finish ================= */
function finishStation(){
  var stars=misses===0?3:(misses===1?2:1);
  var before=unlockedAnimals();
  if(stars>save.stars[curC][curS])save.stars[curC][curS]=stars;
  persist();
  var after=unlockedAnimals();
  state='result';
  show('hud',false);show('dock',false);
  $('q-banner').classList.remove('on');
  sfxClear();
  $('r-title').textContent='とうちゃく！';
  $('r-station').textContent=COURSES[curC].stations[curS].name;
  var sp=$('r-stars').children;
  for(var i=0;i<sp.length;i++){
    sp[i].className='';
    if(i<stars){(function(el,i){setTimeout(function(){el.className='on';},180+i*230);})(sp[i],i);}
  }
  var msg;
  if(stars===3)msg='ぜんもん せいかい！\nかんぺきな うんてんしゅだね';
  else if(stars===2)msg='もうすこしで ぜんもん せいかい！\nつぎも がんばろう';
  else msg='さいごまで よく がんばったね！\nもういちど ちょうせんしてみよう';
  $('r-msg').textContent=msg;
  var un=$('r-unlock');
  un.classList.remove('on');
  if(after>before){
    var a=ANIMALS[after-1];
    $('r-unlock-n').textContent=a.name;
    un.classList.add('on');
    setTimeout(function(){renderThumb($('r-unlock-cv'),function(){return getAnimal(a.key);},1.05);},60);
  }
  $('btn-next').style.display=(curS<7)?'':'none';
  setScreen('result-screen');
  refreshTitleStat();
}

/* ================= thumbnails (single shared renderer) ================= */
var thumbRenderer=null,thumbScene=null,thumbCam=null,thumbHolder=null;
function initThumb(){
  if(thumbRenderer)return true;
  try{
    var c=document.createElement('canvas');c.width=180;c.height=144;
    thumbRenderer=new THREE.WebGLRenderer({canvas:c,alpha:true,antialias:true});
    thumbRenderer.setPixelRatio(1);
    thumbRenderer.setSize(180,144,false);
    thumbScene=new THREE.Scene();
    thumbCam=new THREE.PerspectiveCamera(38,180/144,0.1,40);
    thumbScene.add(new THREE.HemisphereLight(0xffffff,0x9aa9b8,1.15));
    var d=new THREE.DirectionalLight(0xffffff,0.6);d.position.set(2,4,3);thumbScene.add(d);
    thumbHolder=new THREE.Group();thumbScene.add(thumbHolder);
  }catch(e){thumbRenderer=null;return false;}
  return true;
}
function renderThumb(target,factory,zoom){
  if(!target)return;
  if(!initThumb())return;
  while(thumbHolder.children.length)thumbHolder.remove(thumbHolder.children[0]);
  var obj;
  try{obj=factory();}catch(e){return;}
  thumbHolder.add(obj);
  var bs=new THREE.Box3().setFromObject(obj);
  var c=bs.getCenter(new THREE.Vector3());
  var sz=bs.getSize(new THREE.Vector3());
  var r=Math.max(sz.x,sz.y,sz.z)*0.62/(zoom||1);
  var dist=r/Math.tan(THREE.MathUtils.degToRad(19))+1.0;
  thumbCam.position.set(c.x+dist*0.42,c.y+dist*0.34,c.z+dist*0.86);
  thumbCam.lookAt(c);
  thumbRenderer.render(thumbScene,thumbCam);
  try{
    var ctx=target.getContext('2d');
    ctx.clearRect(0,0,target.width,target.height);
    ctx.drawImage(thumbRenderer.domElement,0,0,target.width,target.height);
  }catch(e){}
}

/* ================= main loop ================= */
var lastT=(typeof performance!=='undefined'&&performance.now)?performance.now():Date.now();
var elapsed=0;
var SIDES=['a','b'];
function nowMs(){return (typeof performance!=='undefined'&&performance.now)?performance.now():Date.now();}
/* バックグラウンド復帰時に、とまっていた あいだの おおきな deltaTime を
   もちこまないよう lastT を リセットする(dt<=TUNE.DT_MAX clampとあわせて安定化) */
document.addEventListener('visibilitychange',function(){
  if(!document.hidden)lastT=nowMs();
});

function loop(){
  requestAnimationFrame(loop);
  var t=nowMs();
  var dt=(t-lastT)/1000;lastT=t;
  if(dt>TUNE.DT_MAX)dt=TUNE.DT_MAX;
  elapsed+=dt;

  stepTweens(dt);

  /* animal idle + hop */
  var i,j;
  for(i=0;i<SIDES.length;i++){
    var arr=animalSlots[SIDES[i]];
    for(j=0;j<arr.length;j++){
      var m=arr[j];
      var ud=m.userData;
      if(!ud)continue;
      if(ud.hop>0){
        ud.hop-=dt*1.9;
        if(ud.hop<0)ud.hop=0;
        m.position.y=ud.home.y+Math.sin((1-ud.hop)*Math.PI)*0.42*Math.min(1,ud.hop*2.4+0.35);
      }
      m.rotation.y=Math.sin(elapsed*1.3+j*0.7)*0.13;
    }
  }

  /* plates face camera + bob */
  var plates=[plateA,plateB,plateQ];
  for(i=0;i<plates.length;i++){
    if(!plates[i])continue;
    plates[i].quaternion.copy(camera.quaternion);
    var pb=(plates[i].userData&&plates[i].userData.baseY)||1.5;
    plates[i].position.y=pb+Math.sin(elapsed*2.0+i)*0.06;
  }

  /* train position */
  if(trainGroup)trainGroup.position.x=trainOffset;

  /* smoke */
  for(i=0;i<smokeParts.length;i++){
    var sp=smokeParts[i];
    if(sp.t<3){
      sp.t+=dt;
      if(sp.t<0){sp.m.visible=false;continue;}
      var k=Math.min(1,sp.t/1.5);
      sp.m.visible=true;
      sp.m.position.set(trainOffset-4.85,2.1+k*2.6,-6.3+Math.sin(k*3)*0.2);
      sp.m.scale.setScalar(0.5+k*1.5);
      sp.m.material.opacity=Math.max(0,0.55*(1-k));
      if(k>=1){sp.m.visible=false;sp.t=99;}
    }
  }

  /* camera shake */
  if(camShake>0){
    camShake-=dt*1.4;if(camShake<0)camShake=0;
    placeCamera();
    camera.position.x+=Math.sin(elapsed*47)*camShake*0.06;
    camera.position.y+=Math.cos(elapsed*39)*camShake*0.05;
    camera.lookAt(CAM_TARGET);
  }else if(state==='title'){
    placeCamera();
    camera.position.x+=Math.sin(elapsed*0.34)*0.5;
    camera.position.y+=Math.sin(elapsed*0.26)*0.18;
    camera.lookAt(CAM_TARGET);
  }

  renderer.render(scene,camera);
}

/* ================= boot ================= */
resize();
goTitle();
$('load-screen').classList.remove('on');
loop();

/* expose for headless tests */
window.__TT={
  makeQuestion:makeQuestion, makeChoices:makeChoices, COURSES:COURSES, ANIMALS:ANIMALS,
  LOCOS:LOCOS, THEMES:THEMES, save:function(){return save;}, totalStars:totalStars,
  startStation:startStation, onAnswer:onAnswer, padSlots:padSlots,
  state:function(){return state;}, cur:function(){return {c:curC,s:curS,q:qIdx,m:misses,Q:curQ};},
  buildAnimal:buildAnimal, buildLoco:buildLoco, unlockedAnimals:unlockedAnimals,
  tick:function(dt){stepTweens(dt);}, tweenCount:function(){return tweens.length;},
  scene:scene, camera:camera, world:world, placeCamera:placeCamera,
  buildWorld:buildWorld, spawnAnimals:spawnAnimals, setPlate:setPlate,
  refs:function(){return {padA:padA,padB:padB,plateA:plateA,plateB:plateB,plateQ:plateQ,train:trainGroup,slots:animalSlots};},
  courseUnlocked:courseUnlocked, stationUnlocked:stationUnlocked, loadSave:loadSave
};
