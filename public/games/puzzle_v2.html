<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>どうぶつパズル</title>
<link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@700;800;900&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{width:100%;height:100%;overflow:hidden;font-family:'M PLUS Rounded 1c',sans-serif;user-select:none;}
body{background:linear-gradient(135deg,#1a0a2e,#16213e,#0f3460);}
#wrap{position:fixed;inset:0;display:flex;flex-direction:column;overflow:hidden;}

/* HUD */
#hud{flex-shrink:0;padding:8px 14px 5px;
  background:linear-gradient(180deg,rgba(0,0,0,0.5),transparent);
  display:flex;justify-content:space-between;align-items:center;}
#hud-stage{font-size:13px;font-weight:800;color:#CE93D8;text-shadow:0 0 8px rgba(206,147,216,0.4);}
#hud-score{font-size:18px;font-weight:900;color:#FFD700;text-shadow:0 0 10px rgba(255,215,0,0.4);}
#hud-life{font-size:15px;}

/* タイマーバー */
#timer-wrap{flex-shrink:0;padding:0 14px 5px;}
#timer-label{font-size:10px;font-weight:800;color:rgba(255,255,255,0.7);margin-bottom:2px;display:flex;justify-content:space-between;}
#timer-bg{height:8px;background:rgba(255,255,255,0.15);border-radius:4px;overflow:hidden;}
#timer-fill{height:100%;border-radius:4px;transition:width 0.1s linear, background 0.3s;background:linear-gradient(90deg,#9C27B0,#E040FB);}

/* ゲームエリア */
#game-area{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:8px 10px;min-height:0;}

/* カードグリッド */
#card-grid{display:grid;gap:8px;width:100%;max-width:420px;perspective:1000px;}

/* カード */
.card{position:relative;cursor:pointer;border-radius:16px;
  aspect-ratio:1;touch-action:manipulation;
  transform-style:preserve-3d;transition:transform 0.4s ease;
  -webkit-tap-highlight-color:transparent;
  perspective:600px;}
.card.flip{transform:rotateY(180deg);}
.card-front,.card-back{position:absolute;inset:0;border-radius:16px;
  backface-visibility:hidden;-webkit-backface-visibility:hidden;
  display:flex;align-items:center;justify-content:center;}
/* 裏面（？マーク） */
.card-back{
  background:linear-gradient(135deg,#6A1B9A,#9C27B0,#CE93D8);
  border:2.5px solid rgba(255,255,255,0.25);
  box-shadow:0 4px 16px rgba(106,27,154,0.5),inset 0 1px 0 rgba(255,255,255,0.2);
  font-size:28px;font-weight:900;color:rgba(255,255,255,0.8);}
/* 表面（動物） */
.card-front{
  transform:rotateY(180deg);
  border:2.5px solid rgba(255,255,255,0.3);
  box-shadow:0 4px 16px rgba(0,0,0,0.3);
  font-size:44px;}
.card.matched .card-front{
  background:linear-gradient(135deg,rgba(76,175,80,0.4),rgba(129,199,132,0.4));
  border-color:#66BB6A;
  box-shadow:0 0 20px rgba(76,175,80,0.5);}
.card.wrong .card-front{
  background:linear-gradient(135deg,rgba(244,67,54,0.3),rgba(239,154,154,0.3));
  border-color:#EF5350;}

/* もどる */
#back-btn{position:absolute;bottom:14px;left:12px;z-index:20;
  background:rgba(0,0,0,0.4);border:1px solid rgba(255,255,255,0.2);
  border-radius:16px;padding:6px 14px;color:rgba(255,255,255,0.75);
  font-size:12px;font-weight:700;cursor:pointer;font-family:inherit;}

/* コンボ */
#combo-disp{position:absolute;top:75px;right:14px;z-index:20;
  font-size:14px;font-weight:900;color:#FFD700;
  text-shadow:0 0 10px rgba(255,215,0,0.6);display:none;pointer-events:none;}

/* ステージバナー */
#stage-banner{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);
  z-index:30;pointer-events:none;display:none;text-align:center;}
@keyframes bannerPop{0%{transform:translate(-50%,-50%) scale(0.3);opacity:0;}
  55%{transform:translate(-50%,-50%) scale(1.15);}
  100%{transform:translate(-50%,-50%) scale(1);opacity:1;}}

/* マッチエフェクト */
@keyframes matchBurst{0%{transform:translate(-50%,-50%) scale(0.5);opacity:1;}
  100%{transform:translate(-50%,-50%) scale(2.5);opacity:0;}}
.match-burst{position:absolute;border-radius:50%;pointer-events:none;z-index:25;
  animation:matchBurst 0.5s ease-out forwards;}
@keyframes scoreFloat{0%{transform:translateX(-50%) translateY(0);opacity:1;}
  100%{transform:translateX(-50%) translateY(-60px);opacity:0;}}
.sc-pop{position:absolute;font-size:18px;font-weight:900;color:#FFD700;
  text-shadow:0 2px 8px rgba(0,0,0,0.5);pointer-events:none;z-index:26;
  animation:scoreFloat 0.85s ease-out forwards;white-space:nowrap;}

/* オーバーレイ */
.ov{position:absolute;inset:0;z-index:100;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  background:rgba(15,5,40,0.9);backdrop-filter:blur(12px);
  opacity:0;pointer-events:none;transition:opacity 0.3s;}
.ov.show{opacity:1;pointer-events:all;}
.ob{background:linear-gradient(160deg,#1a0a3a,#0d0520);
  border:1.5px solid rgba(206,147,216,0.4);border-radius:24px;
  padding:22px 28px;text-align:center;max-width:300px;width:90%;
  box-shadow:0 20px 60px rgba(0,0,0,0.7);}
.ot{font-size:22px;font-weight:900;color:#CE93D8;margin:8px 0 6px;}
.os{font-size:12px;color:rgba(206,147,216,0.6);margin-bottom:12px;line-height:1.8;}
.osc{font-size:32px;font-weight:900;color:#FFD700;margin:6px 0;}
.btn-p{background:linear-gradient(135deg,#6A1B9A,#CE93D8);color:white;
  border:none;border-radius:12px;padding:12px 26px;font-size:15px;font-weight:900;
  cursor:pointer;font-family:inherit;margin:4px;box-shadow:0 4px 14px rgba(106,27,154,0.5);}
.btn-gh{background:rgba(255,255,255,0.08);border:1px solid rgba(255,255,255,0.2);
  border-radius:12px;padding:10px 20px;font-size:13px;font-weight:700;
  color:rgba(255,255,255,0.7);cursor:pointer;font-family:inherit;margin:4px;}

/* タイトル */
#ts{position:absolute;inset:0;z-index:200;overflow:hidden;
  display:flex;flex-direction:column;align-items:center;justify-content:flex-end;}
#tc{position:relative;z-index:10;width:100%;
  display:flex;flex-direction:column;align-items:center;padding-bottom:26px;}
@keyframes sh{0%{background-position:0%}100%{background-position:200%}}
@keyframes cardFlip{0%,100%{transform:rotateY(0);}50%{transform:rotateY(180deg);}}
@keyframes float{0%,100%{transform:translateY(0);}50%{transform:translateY(-10px);}}
</style>
</head>
<body>
<div id="wrap">
  <div id="hud">
    <div id="hud-stage">ステージ 1</div>
    <div id="hud-score">⭐ 0</div>
    <div id="hud-life">❤️❤️❤️</div>
  </div>
  <div id="timer-wrap">
    <div id="timer-label"><span id="timer-text">60びょう</span><span id="pairs-text">0/4 ペア</span></div>
    <div id="timer-bg"><div id="timer-fill" style="width:100%"></div></div>
  </div>
  <div id="game-area">
    <div id="card-grid"></div>
  </div>
  <div id="combo-disp"></div>
  <div id="stage-banner"></div>
  <button id="back-btn" onclick="goBack()">← もどる</button>

  <!-- タイトル -->
  <div id="ts">
    <canvas id="tcv" style="position:absolute;inset:0;z-index:0;width:100%;height:100%;"></canvas>
    <div id="tc">
      <div style="text-align:center;padding:0 20px 14px;background:linear-gradient(0deg,rgba(15,5,40,0.97) 50%,transparent);width:100%;position:relative;z-index:10;">
        <div style="font-size:38px;font-weight:900;background:linear-gradient(180deg,#fff,#CE93D8 35%,#9C27B0);-webkit-background-clip:text;-webkit-text-fill-color:transparent;filter:drop-shadow(0 0 18px rgba(206,147,216,0.5));letter-spacing:2px;margin-bottom:2px;">どうぶつ</div>
        <div style="font-size:38px;font-weight:900;background:linear-gradient(180deg,#fff,#FFE066 35%,#FF8C00);-webkit-background-clip:text;-webkit-text-fill-color:transparent;filter:drop-shadow(0 0 18px rgba(255,215,0,0.5));letter-spacing:2px;margin-bottom:5px;">パズル</div>
        <div style="font-size:10px;font-weight:700;color:rgba(206,147,216,0.55);letter-spacing:4px;">✦ ANIMAL PUZZLE ✦</div>
      </div>
      <div style="background:linear-gradient(160deg,rgba(26,10,58,0.97),rgba(13,5,32,0.98));border:1.5px solid rgba(206,147,216,0.3);border-radius:22px;padding:14px 18px 16px;max-width:300px;width:90%;box-shadow:0 20px 60px rgba(0,0,0,0.8);position:relative;z-index:10;">
        <div style="display:flex;flex-direction:column;gap:5px;margin-bottom:12px;">
          <div style="display:flex;align-items:center;gap:8px;background:rgba(206,147,216,0.08);border-radius:9px;padding:6px 10px;">
            <span style="font-size:18px;">🃏</span><div><div style="font-size:11px;font-weight:800;color:#CE93D8;">おなじ どうぶつを みつけよう！</div><div style="font-size:9px;color:rgba(206,147,216,0.5);">カードをめくって ペアをさがそう</div></div>
          </div>
          <div style="display:flex;align-items:center;gap:8px;background:rgba(206,147,216,0.08);border-radius:9px;padding:6px 10px;">
            <span style="font-size:18px;">⏱️</span><div><div style="font-size:11px;font-weight:800;color:#FFD700;">じかんいないに ぜんぶみつけよう！</div><div style="font-size:9px;color:rgba(206,147,216,0.5);">ステージが すすむとカードが ふえるよ</div></div>
          </div>
          <div style="display:flex;align-items:center;gap:8px;background:rgba(206,147,216,0.08);border-radius:9px;padding:6px 10px;">
            <span style="font-size:18px;">🔥</span><div><div style="font-size:11px;font-weight:800;color:#FF8A65;">れんぞくで コンボ！</div><div style="font-size:9px;color:rgba(206,147,216,0.5);">つづけてペアを みつけると ボーナス</div></div>
          </div>
        </div>
        <div id="ths" style="font-size:11px;text-align:center;color:rgba(206,147,216,0.55);margin-bottom:8px;"></div>
        <button id="sbtn" style="width:100%;background:linear-gradient(135deg,#4A0072,#9C27B0,#CE93D8,#9C27B0,#4A0072);background-size:200%;animation:sh 2.5s infinite linear;color:white;border:none;border-radius:13px;padding:13px;font-size:17px;font-weight:900;cursor:pointer;font-family:inherit;letter-spacing:2px;box-shadow:0 4px 16px rgba(106,27,154,0.5);pointer-events:all;">🃏 スタート！</button>
      </div>
    </div>
  </div>

  <!-- ステージクリア -->
  <div class="ov" id="clear-ov">
    <div class="ob">
      <div style="font-size:44px;" id="clear-emoji">🎉</div>
      <div class="ot" id="clear-title">ステージ1 クリア！</div>
      <div class="os" id="clear-sub"></div>
      <div class="osc" id="clear-score"></div>
      <button class="btn-p" id="next-btn">つぎへ ▶</button>
    </div>
  </div>
  <!-- 全クリア -->
  <div class="ov" id="ac-ov">
    <div class="ob">
      <div style="font-size:44px;">🏆</div>
      <div class="ot">ぜんぶ クリア！！</div>
      <div class="os" id="ac-sub"></div>
      <div class="osc" id="ac-score"></div>
      <button class="btn-p" onclick="startGame()">もういちど</button>
      <button class="btn-gh" onclick="showTitle()">タイトルへ</button>
    </div>
  </div>
  <!-- ゲームオーバー -->
  <div class="ov" id="go-ov">
    <div class="ob">
      <div style="font-size:44px;">⏰</div>
      <div class="ot">じかんぎれ！</div>
      <div class="os" id="go-sub"></div>
      <div class="osc" id="go-score"></div>
      <button class="btn-p" onclick="startGame()">もういちど</button>
      <button class="btn-gh" onclick="showTitle()">タイトルへ</button>
    </div>
  </div>
</div>

<script>
// ===== ステージ設定 =====
const STAGES=[
  {num:1, pairs:4,  time:60, cols:4, rows:2, name:'はじまり！'},
  {num:2, pairs:6,  time:70, cols:4, rows:3, name:'なれてきた？'},
  {num:3, pairs:8,  time:80, cols:4, rows:4, name:'もっとやるよ！'},
  {num:4, pairs:10, time:90, cols:4, rows:5, name:'むずかしくなるよ！'},
  {num:5, pairs:12, time:100,cols:4, rows:6, name:'さいきょう！'},
];

const ANIMALS=[
  '🐱','🐰','🦊','🐸','🐼','🐶','🐭','🐹','🐨','🐯',
  '🦁','🐮','🐷','🐸','🐙','🦋','🐠','🦜','🐧','🦒',
  '🦓','🐘','🦏','🦛','🐬','🦈','🐊','🦕','🦖','🦅',
];

// カード背面のデザインパターン
const BACK_PATTERNS=['✦','★','♦','◆','✿'];

// ===== 状態 =====
let stageIdx=0,score=0,combo=0,comboTimer=null;
let cards=[]; // {emoji, id, matched, flipped}
let flipped=[]; // 現在めくられているカードのindex（最大2枚）
let locked=false; // 判定中はタップ不可
let timeLeft=60,timerIv=null;
let gameRunning=false;
let matchedPairs=0,totalPairs=0;
let W,H;

// ===== タイトル =====
const tcv=document.getElementById('tcv');
const tctx=tcv.getContext('2d');

function initTitle(){
  W=window.innerWidth;H=window.innerHeight;
  tcv.width=W;tcv.height=H;
  drawTitleBg();
  updateHsDisp();
  document.getElementById('sbtn').addEventListener('click',startGame);
  document.getElementById('sbtn').addEventListener('touchend',e=>{e.preventDefault();startGame();},{passive:false});
  window.addEventListener('resize',()=>{W=window.innerWidth;H=window.innerHeight;tcv.width=W;tcv.height=H;drawTitleBg();});
}

function drawTitleBg(){
  const w=tcv.width,h=tcv.height;
  tctx.clearRect(0,0,w,h);
  // 背景グラデ
  const bg=tctx.createLinearGradient(0,0,w,h);
  bg.addColorStop(0,'#1a0a2e');bg.addColorStop(0.5,'#16213e');bg.addColorStop(1,'#0f3460');
  tctx.fillStyle=bg;tctx.fillRect(0,0,w,h);
  // 星
  [[0.1,0.05,1.1],[0.25,0.02,1.4],[0.42,0.08,1],[0.6,0.03,1.5],[0.75,0.06,1.2],[0.9,0.02,1],
   [0.15,0.12,0.9],[0.55,0.1,1.1],[0.82,0.09,1],[0.35,0.15,1.3]].forEach(([rx,ry,r])=>{
    tctx.globalAlpha=0.6;tctx.fillStyle='white';
    tctx.beginPath();tctx.arc(w*rx,h*ry,r,0,Math.PI*2);tctx.fill();
  });
  tctx.globalAlpha=1;
  // カード背景のみCanvasで描画（絵文字はDOMで重ねる）
  const cw=Math.min(w*0.14,64),ch=cw*1.3;
  const positions=[[0.08,0.18],[0.22,0.12],[0.38,0.20],[0.55,0.11],[0.70,0.19],[0.84,0.13],[0.14,0.32],[0.78,0.30]];
  positions.forEach(([rx,ry])=>{
    const cx=w*rx,cy=h*ry;
    const cg=tctx.createLinearGradient(cx,cy,cx+cw,cy+ch);
    cg.addColorStop(0,'#6A1B9A');cg.addColorStop(1,'#9C27B0');
    tctx.fillStyle=cg;
    roundRect(tctx,cx,cy,cw,ch,10);tctx.fill();
    tctx.strokeStyle='rgba(255,255,255,0.3)';tctx.lineWidth=2;
    roundRect(tctx,cx,cy,cw,ch,10);tctx.stroke();
  });
  // グロー
  const gl=tctx.createRadialGradient(w/2,h*0.35,0,w/2,h*0.35,w*0.4);
  gl.addColorStop(0,'rgba(156,39,176,0.15)');gl.addColorStop(1,'rgba(156,39,176,0)');
  tctx.fillStyle=gl;tctx.fillRect(0,0,w,h);
  // DOM絵文字オーバーレイ
  buildTitleCards(cw,ch,positions);
}

function buildTitleCards(cw,ch,positions){
  // 既存のタイトルカード絵文字DOMを削除
  document.querySelectorAll('.title-card-emoji').forEach(e=>e.remove());
  const demoAnimals=['🐱','🦊','🐰','🐸','🐼','🐶','🐯','🦁'];
  const fs=Math.round(cw*0.65);
  positions.forEach(([rx,ry],i)=>{
    const cx=W*rx+cw/2, cy=H*ry+ch/2;
    const el=document.createElement('div');
    el.className='title-card-emoji';
    el.textContent=demoAnimals[i%demoAnimals.length];
    el.style.cssText=`position:absolute;left:${cx}px;top:${cy}px;transform:translate(-50%,-50%);font-size:${fs}px;pointer-events:none;z-index:5;`;
    document.getElementById('ts').appendChild(el);
  });
}

function roundRect(c,x,y,w,h,r){
  c.beginPath();c.moveTo(x+r,y);c.lineTo(x+w-r,y);c.quadraticCurveTo(x+w,y,x+w,y+r);
  c.lineTo(x+w,y+h-r);c.quadraticCurveTo(x+w,y+h,x+w-r,y+h);
  c.lineTo(x+r,y+h);c.quadraticCurveTo(x,y+h,x,y+h-r);
  c.lineTo(x,y+r);c.quadraticCurveTo(x,y,x+r,y);c.closePath();
}

// ===== ゲーム開始 =====
function startGame(){
  document.getElementById('ts').style.display='none';
  ['clear-ov','go-ov','ac-ov'].forEach(id=>document.getElementById(id).classList.remove('show'));
  stageIdx=0;score=0;
  gameRunning=true;
  setupStage();
}

function showTitle(){
  clearInterval(timerIv);gameRunning=false;
  document.getElementById('ts').style.display='flex';
  ['clear-ov','go-ov','ac-ov'].forEach(id=>document.getElementById(id).classList.remove('show'));
}

function setupStage(){
  const st=STAGES[stageIdx];
  totalPairs=st.pairs;matchedPairs=0;combo=0;flipped=[];locked=false;
  timeLeft=st.time;clearInterval(timerIv);clearTimeout(comboTimer);
  buildCards(st);
  updateHUD();updateTimerBar();
  showStageBanner(st.name,st.num);
  setTimeout(()=>{
    if(!gameRunning)return;
    timerIv=setInterval(()=>{
      timeLeft--;updateTimerBar();
      if(timeLeft<=0){clearInterval(timerIv);endGameOver();}
    },1000);
  },1800);
}

// ===== カード生成 =====
function buildCards(st){
  const grid=document.getElementById('card-grid');
  grid.innerHTML='';
  // グリッドレイアウト
  grid.style.gridTemplateColumns=`repeat(${st.cols},1fr)`;
  // カードデータ生成
  const animalSet=ANIMALS.slice(0,st.pairs);
  const emojiPairs=[...animalSet,...animalSet].sort(()=>Math.random()-0.5);
  cards=emojiPairs.map((e,i)=>({emoji:e,id:i,matched:false,flipped:false,el:null}));
  // DOM生成
  cards.forEach((c,i)=>{
    const div=document.createElement('div');
    div.className='card';
    div.innerHTML=`
      <div class="card-back">${BACK_PATTERNS[stageIdx%BACK_PATTERNS.length]}</div>
      <div class="card-front" style="background:${cardBgColor(c.emoji)};">${c.emoji}</div>
    `;
    div.addEventListener('click',()=>onCardTap(i));
    div.addEventListener('touchend',e=>{e.preventDefault();onCardTap(i);},{passive:false});
    grid.appendChild(div);
    c.el=div;
  });
  // カードサイズ調整（DOM確定後）
  requestAnimationFrame(()=>adjustCardSize(st));
}

function cardBgColor(emoji){
  const colors=['linear-gradient(135deg,#1a0a2e,#2d1a4e)','linear-gradient(135deg,#0d1a3a,#1a2d5a)','linear-gradient(135deg,#0a2a1a,#1a4a2a)','linear-gradient(135deg,#2a1a0a,#4a2a0a)'];
  return colors[emoji.codePointAt(0)%colors.length];
}

function adjustCardSize(st){
  const area=document.getElementById('game-area');
  const grid=document.getElementById('card-grid');
  const aw=area.offsetWidth-20;
  const ah=area.offsetHeight-20;
  const maxW=Math.floor((aw-st.cols*8)/st.cols);
  const maxH=Math.floor((ah-st.rows*8)/st.rows);
  const size=Math.min(maxW,maxH,90);
  // カードフォントサイズ調整
  const fs=Math.round(size*0.52);
  const bfs=Math.round(size*0.38);
  document.querySelectorAll('.card-front').forEach(el=>el.style.fontSize=fs+'px');
  document.querySelectorAll('.card-back').forEach(el=>el.style.fontSize=bfs+'px');
}

// ===== カードタップ =====
function onCardTap(idx){
  if(!gameRunning||locked)return;
  const c=cards[idx];
  if(c.matched||c.flipped)return;
  if(flipped.length>=2)return;
  // カードをめくる
  c.flipped=true;
  c.el.classList.add('flip');
  flipped.push(idx);
  if(flipped.length===2){
    locked=true;
    const [a,b]=flipped;
    if(cards[a].emoji===cards[b].emoji){
      // マッチ！
      setTimeout(()=>{
        cards[a].matched=true;cards[b].matched=true;
        cards[a].el.classList.add('matched');cards[b].el.classList.add('matched');
        combo++;clearTimeout(comboTimer);
        comboTimer=setTimeout(()=>{combo=0;updateComboDisp();},2000);
        const mult=combo>=4?3:combo>=2?2:1;
        const pts=50*mult+Math.ceil(timeLeft/2);
        score+=pts;
        matchedPairs++;
        showMatchEffect(cards[a].el,pts,combo);
        updateHUD();updateComboDisp();
        flipped=[];locked=false;
        if(matchedPairs>=totalPairs){
          clearInterval(timerIv);
          setTimeout(()=>stageClear(),600);
        }
      },300);
    } else {
      // ミス
      cards[a].el.classList.add('wrong');cards[b].el.classList.add('wrong');
      setTimeout(()=>{
        cards[a].flipped=false;cards[b].flipped=false;
        cards[a].el.classList.remove('flip','wrong');cards[b].el.classList.remove('flip','wrong');
        combo=0;updateComboDisp();
        flipped=[];locked=false;
      },900);
    }
  }
}

// ===== マッチエフェクト =====
function showMatchEffect(el,pts,combo){
  const rect=el.getBoundingClientRect();
  const cx=rect.left+rect.width/2;
  const cy=rect.top+rect.height/2;
  // バースト
  const burst=document.createElement('div');
  burst.className='match-burst';
  const sz=rect.width*1.5;
  burst.style.cssText=`left:${cx}px;top:${cy}px;width:${sz}px;height:${sz}px;background:radial-gradient(circle,rgba(255,215,0,0.7),rgba(255,215,0,0));`;
  document.getElementById('wrap').appendChild(burst);
  setTimeout(()=>burst.remove(),520);
  // スコアポップ
  const pop=document.createElement('div');
  pop.className='sc-pop';
  pop.textContent=`+${pts}${combo>=2?` 🔥${combo}コンボ！`:''}`;
  pop.style.left=cx+'px';pop.style.top=cy+'px';
  document.getElementById('wrap').appendChild(pop);
  setTimeout(()=>pop.remove(),900);
}

// ===== ステージバナー =====
function showStageBanner(name,num){
  const el=document.getElementById('stage-banner');
  el.innerHTML=`<div style="font-size:28px;font-weight:900;color:#CE93D8;text-shadow:0 2px 10px rgba(206,147,216,0.6);white-space:nowrap;">ステージ ${num}</div><div style="font-size:18px;font-weight:800;color:#FFD700;">${name}</div>`;
  el.style.display='block';el.style.animation='none';el.offsetHeight;
  el.style.animation='bannerPop 0.5s ease-out forwards';
  setTimeout(()=>el.style.display='none',2000);
}

// ===== クリア・ゲームオーバー =====
function stageClear(){
  if(!gameRunning)return;
  const st=STAGES[stageIdx];
  const isLast=stageIdx>=STAGES.length-1;
  const timeBonus=timeLeft*5;
  score+=timeBonus;
  document.getElementById('clear-emoji').textContent=isLast?'🌟':'🎉';
  document.getElementById('clear-title').textContent=`ステージ ${st.num} クリア！`;
  document.getElementById('clear-sub').innerHTML=`ぜんぶみつけた！<br>タイムボーナス +${timeBonus}てん`;
  document.getElementById('clear-score').textContent=`⭐ ${score} てん`;
  const btn=document.getElementById('next-btn');
  if(isLast){
    btn.textContent='🏆 ぜんぶクリア！';
    btn.onclick=()=>endAllClear();
  } else {
    btn.textContent=`ステージ ${st.num+1} へ ▶`;
    btn.onclick=()=>{document.getElementById('clear-ov').classList.remove('show');stageIdx++;setupStage();};
  }
  document.getElementById('clear-ov').classList.add('show');
}

function endAllClear(){
  const hs=getHs(),isNew=score>hs;if(isNew)saveHs(score);
  document.getElementById('clear-ov').classList.remove('show');
  document.getElementById('ac-sub').innerHTML='ぜんステージ クリア！';
  document.getElementById('ac-score').textContent=`⭐ ${score} てん${isNew?' 🏆':''}`;
  document.getElementById('ac-ov').classList.add('show');
}

function endGameOver(){
  clearInterval(timerIv);
  if(!gameRunning)return;
  gameRunning=false;
  const hs=getHs(),isNew=score>hs;if(isNew)saveHs(score);
  document.getElementById('go-sub').innerHTML=`ステージ${STAGES[stageIdx].num}　${matchedPairs}/${totalPairs}ペア`;
  document.getElementById('go-score').textContent=`⭐ ${score} てん${isNew?' 🏆':''}`;
  document.getElementById('go-ov').classList.add('show');
}

// ===== HUD =====
function updateHUD(){
  document.getElementById('hud-stage').textContent=`ステージ ${STAGES[stageIdx].num}`;
  document.getElementById('hud-score').textContent=`⭐ ${score}`;
  document.getElementById('pairs-text').textContent=`${matchedPairs}/${totalPairs} ペア`;
}
function updateTimerBar(){
  const st=STAGES[stageIdx];
  const pct=(timeLeft/st.time)*100;
  const fill=document.getElementById('timer-fill');
  fill.style.width=pct+'%';
  fill.style.background=pct>50?'linear-gradient(90deg,#9C27B0,#E040FB)':pct>25?'linear-gradient(90deg,#FF9800,#FFD700)':'linear-gradient(90deg,#F44336,#FF5722)';
  document.getElementById('timer-text').textContent=`${timeLeft}びょう`;
}
function updateComboDisp(){
  const el=document.getElementById('combo-disp');
  if(combo>=2){el.style.display='block';el.textContent=`🔥 ${combo}コンボ！`;}
  else el.style.display='none';
}

function getHs(){return parseInt(localStorage.getItem('puzzle_hs2')||'0');}
function saveHs(s){localStorage.setItem('puzzle_hs2',s);}
function updateHsDisp(){const hs=getHs();document.getElementById('ths').textContent=hs>0?`ハイスコア：⭐${hs}`:''}

function goBack(){
  clearInterval(timerIv);gameRunning=false;
  if(window.parent!==window)window.parent.postMessage({type:'goBack'},'*');
  else history.back();
}

initTitle();
</script>
