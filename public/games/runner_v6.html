<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>どうぶつランナー</title>
<link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@700;800;900&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;}
html,body{height:100%;overflow:hidden;font-family:'M PLUS Rounded 1c',sans-serif;user-select:none;-webkit-tap-highlight-color:transparent;}
body{background:#1a2a4a;display:flex;flex-direction:column;align-items:center;}

/* ゲームエリア */
#game-wrap{
  position:relative;width:100%;max-width:480px;height:100vh;min-height:100vh;
  overflow:hidden;
}

/* 背景レイヤー（CSS） */
#bg-layer{position:absolute;inset:0;z-index:0;}
#cloud-layer{position:absolute;inset:0;z-index:1;pointer-events:none;}
#bg-city{position:absolute;bottom:0;left:0;right:0;z-index:2;pointer-events:none;}

/* ゲームキャンバス（地面・障害物） */
#game-canvas{position:absolute;inset:0;z-index:3;}

/* DOMキャラ・アイテムレイヤー */
#dom-layer{position:absolute;inset:0;z-index:4;pointer-events:none;overflow:hidden;}
.dom-obj{
  position:absolute;
  font-size:inherit;line-height:1;
  pointer-events:none;
  filter:drop-shadow(0 3px 5px rgba(0,0,0,0.4));
}
.dom-player{
  transition:none;
  z-index:10;
}
/* パワーアップ中 */
.powered{
  filter:drop-shadow(0 0 8px rgba(255,215,0,0.8)) drop-shadow(0 3px 5px rgba(0,0,0,0.4));
  animation:powerGlow 0.3s ease-in-out infinite alternate;
}
@keyframes powerGlow{0%{transform:scale(1);}100%{transform:scale(1.15);}}

/* HUD */
#hud{position:fixed;top:0;left:0;right:0;z-index:100;
  display:flex;justify-content:space-between;align-items:center;
  padding:max(10px,env(safe-area-inset-top)) 12px 8px;
  background:linear-gradient(180deg,rgba(0,0,0,0.75) 0%,rgba(0,0,0,0.4) 70%,transparent 100%);
  box-sizing:border-box;}
.hud-score{font-size:20px;font-weight:900;color:white;text-shadow:0 2px 4px rgba(0,0,0,0.5);}
.hud-coins{font-size:14px;font-weight:800;color:#FFD700;}
.hud-lives{font-size:16px;letter-spacing:2px;}
#back-btn{background:rgba(0,0,0,0.5);color:white;border:1px solid rgba(255,255,255,0.3);
  border-radius:20px;padding:6px 14px;font-size:13px;font-weight:700;
  cursor:pointer;pointer-events:all;font-family:inherit;}

/* ジャンプボタン */
#jump-btn{
  position:absolute;bottom:calc(12% - 20px);right:12px;z-index:20;
  width:80px;height:80px;border-radius:50%;
  background:rgba(255,255,255,0.15);
  border:3px solid rgba(255,255,255,0.3);
  font-size:32px;display:flex;align-items:center;justify-content:center;
  cursor:pointer;transition:all 0.1s;
  -webkit-tap-highlight-color:transparent;
  touch-action:manipulation;
}
#jump-btn:active{background:rgba(255,215,0,0.3);border-color:#FFD700;transform:scale(0.92);}

/* コンボ表示 */
#combo-display{
  position:absolute;top:90px;left:50%;transform:translateX(-50%);
  z-index:21;font-size:22px;font-weight:900;color:#FFD700;
  text-shadow:0 0 15px rgba(255,215,0,0.7);
  opacity:0;transition:opacity 0.3s;pointer-events:none;
  white-space:nowrap;
}
#combo-display.show{opacity:1;}

/* パワーアップ表示 */
#power-display{
  position:absolute;top:90px;right:12px;z-index:21;
  font-size:12px;font-weight:800;color:#FFD700;
  background:rgba(0,0,0,0.5);border-radius:10px;padding:3px 8px;
  opacity:0;transition:opacity 0.3s;pointer-events:none;
}
#power-display.show{opacity:1;}

/* スコアポップ */
@keyframes scorePop{0%{transform:translateY(0);opacity:1;}100%{transform:translateY(-50px);opacity:0;}}
.score-pop{
  position:absolute;font-size:16px;font-weight:900;
  pointer-events:none;z-index:25;
  animation:scorePop 0.8s ease-out forwards;
  text-shadow:0 2px 4px rgba(0,0,0,0.5);
  white-space:nowrap;
}

/* ステージ名表示 */
#stage-display{
  position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);
  z-index:22;font-size:28px;font-weight:900;color:white;
  text-shadow:0 0 20px rgba(255,255,255,0.5);
  opacity:0;transition:opacity 0.5s;pointer-events:none;
  white-space:nowrap;
}
#stage-display.show{opacity:1;}

/* オーバーレイ共通 */
.overlay{
  position:absolute;inset:0;z-index:30;
  display:flex;flex-direction:column;align-items:center;justify-content:flex-end;
  background:none;
  opacity:0;pointer-events:none;transition:opacity 0.3s;
}
.overlay.show{opacity:1;pointer-events:all;}

/* タイトル画面 */
#title-screen{
  position:absolute;inset:0;z-index:35;
  display:flex;flex-direction:column;align-items:center;justify-content:flex-end;
  overflow:hidden;
}
#title-bg{position:absolute;inset:0;z-index:0;}
#title-content{position:relative;z-index:10;width:100%;padding-bottom:32px;display:flex;flex-direction:column;align-items:center;pointer-events:all;}

/* ゲームオーバー・クリア */
.ov-box{
  background:linear-gradient(160deg,rgba(10,20,40,0.97),rgba(5,10,20,0.98));
  border:1.5px solid rgba(255,215,0,0.35);border-radius:22px;
  padding:22px 26px;max-width:300px;width:88%;text-align:center;
  box-shadow:0 20px 60px rgba(0,0,0,0.7);margin-bottom:20px;
}
.ov-emoji{font-size:44px;margin-bottom:8px;}
.ov-title{font-size:22px;font-weight:900;color:#FFD700;margin-bottom:6px;}
.ov-sub{font-size:13px;color:rgba(255,255,255,0.6);margin-bottom:14px;line-height:1.7;}
.ov-score{font-size:34px;font-weight:900;color:#FFD700;margin:6px 0;text-shadow:0 0 16px rgba(255,215,0,0.5);}
.btn-gold{background:linear-gradient(135deg,#FF8F00,#FFD700);color:#0d0025;border:none;border-radius:13px;padding:12px 26px;font-size:16px;font-weight:900;cursor:pointer;font-family:inherit;box-shadow:0 4px 14px rgba(255,215,0,0.4);margin:4px;transition:transform 0.15s;}
.btn-gold:active{transform:scale(0.95);}
.btn-ghost{background:rgba(255,255,255,0.08);border:1px solid rgba(255,255,255,0.2);border-radius:13px;padding:10px 20px;font-size:14px;font-weight:700;color:rgba(255,255,255,0.7);cursor:pointer;font-family:inherit;margin:4px;}

/* ハイスコア */
.hs-badge{font-size:11px;color:rgba(255,215,0,0.6);font-weight:700;margin-bottom:8px;}

@keyframes shimmer{0%{background-position:0%}100%{background-position:200%}}
@keyframes charRun{0%,100%{transform:translateY(0) rotate(-3deg);}50%{transform:translateY(-3px) rotate(3deg);}}
@keyframes floatObj{0%,100%{transform:translateY(0);}50%{transform:translateY(-5px);}}


#common-bgm-btn{
  position:fixed;
  top:max(10px,env(safe-area-inset-top,10px));
  right:10px;z-index:1000;
  background:rgba(0,0,0,0.45);
  border:1.5px solid rgba(255,255,255,0.35);
  border-radius:50%;width:40px;height:40px;
  font-size:18px;cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  color:white;
}

/* === safe-area & common buttons === */
:root {
  --sat: env(safe-area-inset-top, 0px);
  --sab: env(safe-area-inset-bottom, 0px);
}
#ui-bgm-btn {
  width: 40px; height: 40px;
  background: rgba(0,0,0,0.5);
  border: 1.5px solid rgba(255,255,255,0.4);
  border-radius: 50%;
  font-size: 20px;
  cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  touch-action: manipulation;
  -webkit-tap-highlight-color: transparent;
  flex-shrink: 0;
}
#status-bar {
  position: fixed;
  top: calc(max(10px, env(safe-area-inset-top)) + 44px);
  left: 0; right: 0;
  display: flex;
  justify-content: center;
  align-items: center;
  gap: 16px;
  padding: 4px 12px;
  z-index: 99;
  pointer-events: none;
}

/* === 横向き対応 === */
@media (orientation: landscape) {
  body { overflow-y: auto; }
  #hud { top: max(6px, env(safe-area-inset-top, 6px)); }
  #status-bar { top: calc(max(6px, env(safe-area-inset-top, 6px)) + 40px); }
}
@media (orientation: landscape) and (max-height: 500px) {
  /* 横向き時にゲームエリアを縮小・スクロール対応 */
  canvas { max-height: 100vh; }
  #game-area { overflow-y: auto; }
  body { background: #000; }
  #game-wrap {
    width: auto;
    height: 100vh;
    aspect-ratio: 9/16;
    margin: 0 auto;
  }
}
</style>
<script src="/games/wakuwaku_bgm.js"></script>

const CHARS=['🐱','🐰','🦊','🐸','🐧','🐼','🐶'];

const COIN_EMOJI='🪙';
const STAR_EMOJI='⭐';
const POWERUPS=[

  {emoji:'🌟',type:'double',   label:'2ばいコイン！',color:'#FFD700'},
  {emoji:'🐢',type:'slow',     label:'スロー！',color:'#A5D6A7'},
];
const STAGES=[
  {name:'🌞 ひるま',    skyTop:'#1a3a6a',skyBot:'#2a6a3a',groundColor:'#3a6a28',roadColor:'#4a5a30',treeColor:'#2d6a20',cloudColor:'rgba(255,255,255,0.85)'},
  {name:'🌅 ゆうがた',  skyTop:'#4a1a0a',skyBot:'#7a3a0a',groundColor:'#4a3a20',roadColor:'#5a4a28',treeColor:'#1a3a15',cloudColor:'rgba(255,200,150,0.7)'},
  {name:'🌙 よる',      skyTop:'#050010',skyBot:'#0a1a28',groundColor:'#1a2a15',roadColor:'#2a3a1a',treeColor:'#0d1a0d',cloudColor:'rgba(150,150,200,0.5)'},
  {name:'🚀 うちゅう',  skyTop:'#000005',skyBot:'#050020',groundColor:'#0a0a1a',roadColor:'#1a1a2a',treeColor:'#050515',cloudColor:'rgba(100,100,255,0.4)'},
];

// ===== 状態 =====
let selChar=0;
let score=0, coinCount=0, lives=3;
let combo=0, comboTimer=null;
let stageIdx=0, stageScore=0;
let powerType=null, powerTimer=null;
let gameRunning=false, gameOver=false;
let raf=null;

// 物理
const GRAVITY=0.38;
const JUMP_V=-12.0;
const GROUND_RATIO=0.88; // 画面高さの88%を地面にする（下部に配置）
let groundY=0;
let playerX=80, playerY=0;
let velY=0, jumpCount=0;
let isOnGround=false;

// スピード
let speed=4.5;
const SPEED_MAX=11;
const SPEED_INC=0.0015;

// 障害物・コイン・パワーアップ
let obstacles=[];
let coins=[];
let powers=[];
// 背景要素（木・雲・星）
let bgTrees=[];
let bgClouds=[];
let bgStars=[];
// パーティクル
let particles=[];

// スポーン間隔
let obstacleTimer=0, obstacleInterval=130;
let coinTimer=0, coinInterval=60;
let powerTimer2=0, powerInterval=400;

// DOM要素
let playerEl=null;
const domLayer=document.getElementById('dom-layer');
const canvas=document.getElementById('game-canvas');
const ctx=canvas.getContext('2d');

// ===== 初期化 =====
function init(){
  canvas.width=window.innerWidth;
  canvas.height=window.innerHeight;
  groundY=canvas.height*GROUND_RATIO;
  playerY=groundY;

  buildCharSelect();
  updateHsDisp();
  setupInput();
  drawTitleBg();
  window.addEventListener('resize',onResize);
}

function onResize(){
  canvas.width=window.innerWidth;
  canvas.height=window.innerHeight;
  groundY=canvas.height*GROUND_RATIO;
}

// ===== キャラ選択 =====
function buildCharSelect(){
  const wrap=document.getElementById('char-select');
  wrap.innerHTML='';
  CHARS.forEach((c,i)=>{
    const btn=document.createElement('button');
    btn.style.cssText=`
      width:52px;height:52px;border-radius:12px;
      background:${i===selChar?'rgba(255,215,0,0.2)':'rgba(255,255,255,0.06)'};
      border:2px solid ${i===selChar?'#FFD700':'rgba(255,255,255,0.1)'};
      display:flex;align-items:center;justify-content:center;
      font-size:28px;cursor:pointer;transition:all 0.15s;
      box-shadow:${i===selChar?'0 0 10px rgba(255,215,0,0.3)':'none'};
      -webkit-tap-highlight-color:transparent;
      touch-action:manipulation;
      pointer-events:all;
      position:relative;z-index:50;
    `;
    btn.textContent=c;
    const select=()=>{selChar=i;buildCharSelect();};
    btn.onclick=select;
    btn.addEventListener('touchend',e=>{e.preventDefault();select();},{passive:false});
    wrap.appendChild(btn);
  });
}

// ===== ゲーム開始 =====
function startGame(){
  document.getElementById('title-screen').style.display='none';
  document.getElementById('go-screen').classList.remove('show');

  score=0;coinCount=0;lives=3;combo=0;stageIdx=0;stageScore=0;
  speed=4.5;powerType=null;gameOver=false;gameRunning=true;
  playerY=groundY;velY=0;jumpCount=0;isOnGround=true;
  obstacles=[];coins=[];powers=[];particles=[];
  bgTrees=[];bgClouds=[];bgStars=[];
  obstacleTimer=0;coinTimer=0;powerTimer2=0;

  clearTimeout(powerTimer);clearTimeout(comboTimer);

  initBgElements();
  spawnPlayer();
  updateHUD();
  updateBgStyle();

  if(raf)cancelAnimationFrame(raf);
  loop();
}

function restartGame(){startGame();}
function showTitle(){
  cancelAnimationFrame(raf);gameRunning=false;
  document.getElementById('go-screen').classList.remove('show');
  document.getElementById('title-screen').style.display='flex';
  domLayer.innerHTML='';
  playerEl=null;
}

// ===== プレイヤーDOM =====
function spawnPlayer(){
  if(playerEl)playerEl.remove();
  playerEl=document.createElement('div');
  playerEl.className='dom-obj dom-player';
  playerEl.style.fontSize=`${Math.round(canvas.height*0.07)}px`;
  playerEl.textContent=CHARS[selChar];
  playerEl.style.animation='charRun 0.25s ease-in-out infinite';
  domLayer.appendChild(playerEl);
  updatePlayerPos();
}

function updatePlayerPos(){
  if(!playerEl)return;
  const size=canvas.height*0.07;
  playerEl.style.left=`${playerX-size*0.5}px`;
  playerEl.style.top=`${playerY-size}px`;
}

// ===== 背景要素初期化 =====
function initBgElements(){
  // 木
  for(let i=0;i<8;i++){
    bgTrees.push({
      x:50+i*(canvas.width/7),
      y:groundY,
      h:canvas.height*(0.12+Math.random()*0.08),
      spd:speed*0.4,
      layer:Math.random()<0.5?0:1,
    });
  }
  // 雲
  for(let i=0;i<5;i++){
    bgClouds.push({
      x:Math.random()*canvas.width,
      y:canvas.height*(0.05+Math.random()*0.25),
      w:60+Math.random()*80,
      spd:speed*0.2,
    });
  }
  // 星（夜・宇宙用）
  for(let i=0;i<40;i++){
    bgStars.push({x:Math.random()*canvas.width,y:Math.random()*canvas.height*0.7});
  }
}

// ===== 背景CSS更新 =====
function updateBgStyle(){
  const st=STAGES[stageIdx];
  // bg-layerを全画面グラデーションで塗る（地面色まで含む）
  document.getElementById('bg-layer').style.background=
    `linear-gradient(180deg,${st.skyTop} 0%,${st.skyBot} 55%,${st.groundColor} 80%,${st.groundColor} 100%)`;
}

// ===== 背景SVG（シティ）描画 =====
function drawTitleBg(){}// タイトルのSVGは静的

// ===== ジャンプ =====
function jump(){
  if(!gameRunning||gameOver)return;
  if(jumpCount<2){
    velY=JUMP_V*(jumpCount===1?0.8:1);
    jumpCount++;
    isOnGround=false;
    // ジャンプエフェクト
    addParticles(playerX,playerY,'jump');
  }
}

// ===== メインループ =====
function loop(){
  if(!gameRunning)return;
  update();
  draw();
  raf=requestAnimationFrame(loop);
}

function update(){
  if(gameOver)return;

  // スピードアップ
  if(powerType!=='slow'){
    speed=Math.min(SPEED_MAX,speed+SPEED_INC);
  }
  stageScore+=speed;

  // ステージ遷移（距離ベース）
  const stageThreshold=3000;
  const newStage=Math.min(STAGES.length-1,Math.floor(stageScore/stageThreshold));
  if(newStage>stageIdx){
    stageIdx=newStage;
    updateBgStyle();
    showStageLabel(STAGES[stageIdx].name);
  }

  // プレイヤー物理
  // 頂点付近で重力を少し和らげる（滞空感UP）
  const peakGravity=velY<0&&velY>-6?GRAVITY*0.35:GRAVITY;
  velY+=peakGravity;
  playerY+=velY;
  // 地面
  if(playerY>=groundY){
    playerY=groundY;velY=0;jumpCount=0;isOnGround=true;
  }
  // 天井（画面高さの15%より上には行かない）
  if(playerY<canvas.height*0.18){
    playerY=canvas.height*0.15;velY=Math.max(0,velY);
  }
  updatePlayerPos();

  // 背景スクロール
  const bgSpd=speed;
  bgTrees.forEach(t=>{
    t.x-=bgSpd*(t.layer===0?0.35:0.55);
    if(t.x<-80)t.x=canvas.width+80;
  });
  bgClouds.forEach(c=>{
    c.x-=bgSpd*0.18;
    if(c.x<-120)c.x=canvas.width+60;
  });

  // スポーン
  obstacleTimer++;
  if(obstacleTimer>=obstacleInterval){
    obstacleTimer=0;
    obstacleInterval=Math.max(60,90-stageIdx*8)+Math.random()*40;
    // ランダムで高障害物（ジャンプ必須）or 低障害物（くぐれない）
    const isHigh=Math.random()<0.3;
    obstacles.push({
      x:canvas.width+30,
      y:isHigh?groundY-canvas.height*0.14:groundY,
      emoji:OBSTACLES[Math.floor(Math.random()*OBSTACLES.length)],
      w:canvas.height*0.065,
      isHigh,
    });
  }
  coinTimer++;
  if(coinTimer>=coinInterval){
    coinTimer=0;
    coinInterval=40+Math.random()*30;
    // コインをランダムな高さに
    const coinH=Math.random()<0.4?canvas.height*0.15:0;
    const isStar=Math.random()<0.2;
    coins.push({
      x:canvas.width+20,
      y:groundY-canvas.height*0.06-coinH,
      emoji:isStar?STAR_EMOJI:COIN_EMOJI,
      isStar,w:canvas.height*0.05,
      phase:Math.random()*Math.PI*2,
    });
  }
  powerTimer2++;
  if(powerTimer2>=powerInterval){
    powerTimer2=0;
    powerInterval=350+Math.random()*200;
    const pw=POWERUPS[Math.floor(Math.random()*POWERUPS.length)];
    powers.push({x:canvas.width+20,y:groundY-canvas.height*0.1,emoji:pw.emoji,type:pw.type,label:pw.label,color:pw.color,w:canvas.height*0.055});
  }

  // 障害物更新
  const spd=powerType==='slow'?speed*0.5:speed;
  obstacles.forEach(o=>{o.x-=spd;});
  obstacles=obstacles.filter(o=>o.x>-60);

  // コイン更新
  coins.forEach(c=>{
    c.x-=spd;
    c.phase+=0.1;
  });
  coins=coins.filter(c=>c.x>-40);

  // パワーアップ更新
  powers.forEach(p=>{p.x-=spd;});
  powers=powers.filter(p=>p.x>-40);

  // 当たり判定
  const pw2=canvas.height*0.055, ph=canvas.height*0.065;
  // 障害物
  if(powerType!=='invincible'){
    obstacles.forEach(o=>{
      const ow=o.w;
      if(Math.abs(playerX-o.x)<pw2*0.7&&Math.abs(playerY-o.y)<ph*0.7){
        hitObstacle(o);
      }
    });
  }
  // コイン
  coins=coins.filter(c=>{
    if(Math.abs(playerX-c.x)<pw2&&Math.abs(playerY-c.y)<ph){
      collectCoin(c);return false;
    }
    return true;
  });
  // パワーアップ
  powers=powers.filter(p=>{
    if(Math.abs(playerX-p.x)<pw2&&Math.abs(playerY-p.y)<ph){
      activatePower(p);return false;
    }
    return true;
  });

  // パーティクル
  particles.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=0.2;p.life--;p.alpha=p.life/p.maxLife;});
  particles=particles.filter(p=>p.life>0);

  // スコア
  score=Math.floor(stageScore/10);
  document.getElementById('score-disp').textContent=`⭐ ${score}`;
}

// ===== 当たり判定処理 =====
function hitObstacle(o){
  o.x=-999; // 消す
  lives--;
  updateHUD();
  addParticles(playerX,playerY,'hit');
  if(lives<=0){
    endGame();return;
  }
  // 無敵時間
  powerType='invincible';
  if(playerEl)playerEl.style.opacity='0.5';
  clearTimeout(powerTimer);
  powerTimer=setTimeout(()=>{
    if(powerType==='invincible'){powerType=null;if(playerEl)playerEl.style.opacity='1';}
  },1500);
}

function collectCoin(c){
  const val=c.isStar?5:1;
  const mult=powerType==='double'?2:1;
  coinCount+=val*mult;
  combo++;
  document.getElementById('coin-disp').textContent=`🪙 ${coinCount}`;
  addParticles(c.x,c.y,'coin');
  showScorePop(`+${val*mult}🪙`,c.x,c.y,c.isStar?'#FFD700':'#A5D6A7');
  // コンボ
  clearTimeout(comboTimer);
  if(combo>=3){
    const comboEl=document.getElementById('combo-display');
    comboEl.textContent=`🔥 ${combo}コンボ！`;
    comboEl.classList.add('show');
  }
  comboTimer=setTimeout(()=>{
    combo=0;
    document.getElementById('combo-display').classList.remove('show');
  },1500);
}

function activatePower(p){
  powerType=p.type;
  clearTimeout(powerTimer);
  document.getElementById('power-display').textContent=p.label;
  document.getElementById('power-display').style.color=p.color;
  document.getElementById('power-display').classList.add('show');
  if(playerEl){
    playerEl.className='dom-obj dom-player powered';
    playerEl.style.opacity='1';
  }
  powerTimer=setTimeout(()=>{
    powerType=null;
    document.getElementById('power-display').classList.remove('show');
    if(playerEl)playerEl.className='dom-obj dom-player';
  },5000);
  addParticles(playerX,playerY,'power');
  showScorePop(p.label,playerX,playerY,p.color);
}

// ===== 描画 =====
function draw(){
  const W=canvas.width, H=canvas.height;
  ctx.clearRect(0,0,W,H);

  // 夜・宇宙の星
  if(stageIdx>=2){
    ctx.fillStyle='white';
    bgStars.forEach(s=>{
      ctx.globalAlpha=stageIdx===3?0.8:0.5;
      ctx.beginPath();ctx.arc(s.x,s.y,1,0,Math.PI*2);ctx.fill();
    });
    ctx.globalAlpha=1;
    // 宇宙の惑星
    if(stageIdx===3){
      ctx.save();
      const pg=ctx.createRadialGradient(W*0.75,H*0.15,0,W*0.75,H*0.15,40);
      pg.addColorStop(0,'#CE93D8');pg.addColorStop(1,'rgba(100,0,150,0)');
      ctx.fillStyle=pg;ctx.fillRect(W*0.6,0,W*0.4,H*0.35);
      ctx.fillStyle='#B39DDB';ctx.beginPath();ctx.arc(W*0.75,H*0.15,22,0,Math.PI*2);ctx.fill();
      ctx.fillStyle='rgba(255,255,255,0.2)';ctx.beginPath();ctx.arc(W*0.72,H*0.12,7,0,Math.PI*2);ctx.fill();
    }
  }

  // 雲
  const st=STAGES[stageIdx];
  bgClouds.forEach(c=>{
    ctx.save();ctx.globalAlpha=0.85;
    ctx.fillStyle=st.cloudColor;
    ctx.beginPath();ctx.ellipse(c.x,c.y,c.w,c.w*0.4,0,0,Math.PI*2);ctx.fill();
    ctx.beginPath();ctx.ellipse(c.x-c.w*0.3,c.y+2,c.w*0.55,c.w*0.35,0,0,Math.PI*2);ctx.fill();
    ctx.beginPath();ctx.ellipse(c.x+c.w*0.3,c.y+2,c.w*0.5,c.w*0.32,0,0,Math.PI*2);ctx.fill();
    ctx.restore();
  });

  // 木（背景）
  bgTrees.forEach(t=>{
    if(t.layer===0){
      const opacity=stageIdx>=2?0.4:0.7;
      ctx.save();ctx.globalAlpha=opacity;
      ctx.fillStyle=st.treeColor;
      ctx.beginPath();ctx.ellipse(t.x,t.y-t.h*0.55,t.h*0.28,t.h*0.45,0,0,Math.PI*2);ctx.fill();
      ctx.fillStyle='#4a2800';ctx.fillRect(t.x-4,t.y-t.h*0.12,8,t.h*0.15);
      ctx.restore();
    }
  });

  // 地面
  const grd=ctx.createLinearGradient(0,groundY,0,H);
  grd.addColorStop(0,st.groundColor);grd.addColorStop(1,'rgba(0,0,0,0.5)');
  ctx.fillStyle=grd;ctx.fillRect(0,groundY,W,H-groundY);
  // 道路ライン
  ctx.fillStyle=st.roadColor;ctx.fillRect(0,groundY,W,8);
  ctx.fillStyle='rgba(255,255,255,0.12)';
  for(let x=0;x<W;x+=60){
    ctx.fillRect(x,groundY+3,30,2);
  }

  // 木（前景）
  bgTrees.forEach(t=>{
    if(t.layer===1){
      ctx.save();ctx.globalAlpha=stageIdx>=2?0.5:0.9;
      ctx.fillStyle=st.treeColor;
      ctx.beginPath();ctx.ellipse(t.x,t.y-t.h*0.55,t.h*0.3,t.h*0.48,0,0,Math.PI*2);ctx.fill();
      ctx.fillStyle='rgba(0,0,0,0.3)';ctx.fillRect(t.x-5,t.y-t.h*0.14,10,t.h*0.17);
      ctx.restore();
    }
  });

  // 障害物DOM更新（Canvasから除去→DOMで描画）
  updateObstacleDOM();
  updateCoinDOM();
  updatePowerDOM();

  // パーティクル
  particles.forEach(p=>{
    ctx.save();ctx.globalAlpha=p.alpha;
    ctx.fillStyle=p.color;
    ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,Math.PI*2);ctx.fill();
    ctx.restore();
  });
}

// ===== DOMオブジェクト管理 =====
let obstacleEls={}, coinEls={}, powerEls={};

function updateObstacleDOM(){
  // 不要なものを削除
  Object.keys(obstacleEls).forEach(k=>{
    if(!obstacles.find(o=>o._id===parseInt(k))){
      obstacleEls[k]?.remove();delete obstacleEls[k];
    }
  });
  obstacles.forEach(o=>{
    if(!o._id)o._id=Math.random();
    const k=o._id;
    if(!obstacleEls[k]){
      const el=document.createElement('div');
      el.className='dom-obj';
      el.style.fontSize=`${Math.round(o.w)}px`;
      el.textContent=o.emoji;
      domLayer.appendChild(el);
      obstacleEls[k]=el;
    }
    const el=obstacleEls[k];
    el.style.left=`${o.x-o.w*0.5}px`;
    el.style.top=`${o.y-o.w}px`;
  });
}

function updateCoinDOM(){
  Object.keys(coinEls).forEach(k=>{
    if(!coins.find(c=>c._id===parseInt(k))){
      coinEls[k]?.remove();delete coinEls[k];
    }
  });
  coins.forEach(c=>{
    if(!c._id)c._id=Math.random();
    const k=c._id;
    if(!coinEls[k]){
      const el=document.createElement('div');
      el.className='dom-obj';
      el.style.fontSize=`${Math.round(c.w)}px`;
      el.textContent=c.emoji;
      el.style.animation='floatObj 1s ease-in-out infinite';
      domLayer.appendChild(el);
      coinEls[k]=el;
    }
    const el=coinEls[k];
    const bob=Math.sin(c.phase)*4;
    el.style.left=`${c.x-c.w*0.5}px`;
    el.style.top=`${c.y-c.w+bob}px`;
  });
}

function updatePowerDOM(){
  Object.keys(powerEls).forEach(k=>{
    if(!powers.find(p=>p._id===parseInt(k))){
      powerEls[k]?.remove();delete powerEls[k];
    }
  });
  powers.forEach(p=>{
    if(!p._id)p._id=Math.random();
    const k=p._id;
    if(!powerEls[k]){
      const el=document.createElement('div');
      el.className='dom-obj';
      el.style.fontSize=`${Math.round(p.w)}px`;
      el.textContent=p.emoji;
      el.style.animation='floatObj 0.8s ease-in-out infinite';
      el.style.filter=`drop-shadow(0 0 8px ${p.color}) drop-shadow(0 3px 5px rgba(0,0,0,0.4))`;
      domLayer.appendChild(el);
      powerEls[k]=el;
    }
    const el=powerEls[k];
    el.style.left=`${p.x-p.w*0.5}px`;
    el.style.top=`${p.y-p.w}px`;
  });
}

// ===== パーティクル =====
function addParticles(x,y,type){
  const colors={
    jump:['#90CAF9','#B2EBF2','white'],
    hit: ['#EF9A9A','#FF5252','#FF8A65'],
    coin:['#FFD700','#FFEE58','#FFF176'],
    power:['#CE93D8','#FFD700','#80DEEA'],
  }[type]||['white'];
  for(let i=0;i<8;i++){
    const angle=Math.random()*Math.PI*2;
    const spd=2+Math.random()*3;
    particles.push({
      x,y,
      vx:Math.cos(angle)*spd,
      vy:Math.sin(angle)*spd-2,
      r:2+Math.random()*3,
      color:colors[Math.floor(Math.random()*colors.length)],
      life:20,maxLife:20,alpha:1,
    });
  }
}

// ===== スコアポップ =====
function showScorePop(text,x,y,color='#FFD700'){
  const el=document.createElement('div');
  el.className='score-pop';
  el.textContent=text;
  el.style.left=`${x-20}px`;el.style.top=`${y-30}px`;
  el.style.color=color;
  document.getElementById('game-wrap').appendChild(el);
  setTimeout(()=>el.remove(),850);
}

// ===== ステージ名 =====
function showStageLabel(name){
  const el=document.getElementById('stage-display');
  el.textContent=name;
  el.classList.add('show');
  setTimeout(()=>el.classList.remove('show'),2500);
}

// ===== HUD =====
function updateHUD(){
  document.getElementById('lives-disp').textContent='❤️'.repeat(lives)+'🖤'.repeat(3-lives);
  document.getElementById('coin-disp').textContent=`🪙 ${coinCount}`;
}

// ===== ゲーム終了 =====
function endGame(){
  gameRunning=false;gameOver=true;
  cancelAnimationFrame(raf);
  // ハイスコア
  const hs=getHs();
  const isNew=score>hs;
  if(isNew)localStorage.setItem('runner_hs',score);
  document.getElementById('go-sub').innerHTML=
    `スコア：<b style="color:#FFD700;font-size:18px">${score}</b>　コイン：🪙${coinCount}`;
  document.getElementById('go-score').textContent=isNew?'🏆 ハイスコアこうしん！':'';
  document.getElementById('go-hs').textContent=`ハイスコア：${Math.max(score,hs)}`;
  document.getElementById('go-screen').classList.add('show');
  // 全DOM削除
  Object.values(obstacleEls).forEach(e=>e?.remove());
  Object.values(coinEls).forEach(e=>e?.remove());
  Object.values(powerEls).forEach(e=>e?.remove());
  obstacleEls={};coinEls={};powerEls={};
}

// ===== ハイスコア =====
function getHs(){return parseInt(localStorage.getItem('runner_hs')||'0');}
function updateHsDisp(){
  const hs=getHs();
  document.getElementById('hs-disp').textContent=hs>0?`ハイスコア：⭐${hs}`:'';
}

// ===== 入力 =====
function setupInput(){
  // タップ
  document.getElementById('game-wrap').addEventListener('touchstart',e=>{
    if(document.getElementById('title-screen').style.display!=='none')return;
    if(e.target.closest('#jump-btn')||e.target.closest('#back-btn'))return;
    e.preventDefault();jump();
  },{passive:false});
  document.getElementById('jump-btn').addEventListener('touchstart',e=>{e.preventDefault();jump();},{passive:false});
  document.getElementById('jump-btn').addEventListener('mousedown',jump);
  document.getElementById('game-wrap').addEventListener('mousedown',e=>{
    if(e.target.closest('#jump-btn')||e.target.closest('#back-btn'))return;
    jump();
  });
  // キーボード
  window.addEventListener('keydown',e=>{
    if(e.code==='Space'||e.code==='ArrowUp'){e.preventDefault();jump();}
  });
  // スタートボタン
  document.getElementById('start-btn').addEventListener('click',startGame);
  document.getElementById('start-btn').addEventListener('touchend',e=>{e.preventDefault();startGame();});
}

let _bgm = null;

function _startBGM() {
  if (_bgm) return;
  _bgm = new WakuwakuBGM('adventure');
  const on = WakuwakuBGM.loadState();
  _bgm.setEnabled(on);
  if (on) _bgm.start();
  _syncBgmBtn();
}

function toggleCommonBGM() {
  if (!_bgm) { _startBGM(); return; }
  const on = _bgm.toggle();
  WakuwakuBGM.saveState(on);
  _syncBgmBtn();
}

function _syncBgmBtn() {
  const on = _bgm ? _bgm.enabled : WakuwakuBGM.loadState();
  const btns = document.querySelectorAll(
    '#bgm-btn,#ui-bgm-btn,#bgm-toggle,#sound-btn,.bgm-btn'
  );
  btns.forEach(b => { b.textContent = on ? '🔊' : '🔇'; });
}

// First interaction triggers BGM start
(function(){
  function _first(){ _startBGM(); }
  document.addEventListener('click', _first, { once: true });
  document.addEventListener('touchstart', _first, { once: true });
})();
// ── End BGM ────────────────────────────────────────
</script>
