<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>まほうのめいろ</title>
<link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@700;800;900&display=swap" rel="stylesheet">
<style>
:root{--sat:env(safe-area-inset-top,0px);--sab:env(safe-area-inset-bottom,0px);}

*{margin:0;padding:0;box-sizing:border-box;}
html,body{height:100%;overflow:hidden;}
body{
  font-family:'M PLUS Rounded 1c',sans-serif;
  background:linear-gradient(180deg,#0d0620 0%,#1a0a2e 50%,#0d1a0a 100%);
  display:flex;flex-direction:column;align-items:center;
  height:100%;user-select:none;
  -webkit-tap-highlight-color:transparent;
}

/* HUD */
#hud{
  width:100%;max-width:480px;flex-shrink:0;
  display:grid;grid-template-columns:auto 1fr 1fr;grid-template-rows:auto auto;
  gap:4px;padding:max(6px, env(safe-area-inset-top, 0px)) 10px 4px;
}
#back-btn{
  grid-column:1;grid-row:1/3;align-self:center;
  background:none;border:1px solid rgba(255,255,255,0.2);
  border-radius:12px;padding:6px 10px;
  color:rgba(255,255,255,0.6);font-size:11px;font-weight:700;
  cursor:pointer;font-family:inherit;
}
.hud-box{
  background:rgba(0,0,0,0.5);border:1px solid rgba(255,215,0,0.35);
  border-radius:10px;padding:4px 10px;font-size:12px;font-weight:800;
  display:flex;align-items:center;justify-content:center;gap:4px;
}
#hud-stage{color:#FFD700;grid-column:2;grid-row:1;}
#hud-time{color:#80DEEA;grid-column:3;grid-row:1;}
#hud-coins{color:#FFD700;grid-column:2;grid-row:2;}
#hud-lives{grid-column:3;grid-row:2;font-size:14px;}

/* 迷路エリア */
#game-wrap{
  flex:1;display:flex;align-items:center;justify-content:center;
  width:100%;padding:4px;min-height:0;
}
#maze{
  display:grid;
  border:2px solid rgba(255,215,0,0.4);
  border-radius:6px;
  box-shadow:0 0 24px rgba(255,215,0,0.12),0 0 48px rgba(100,50,200,0.2);
  overflow:hidden;
  flex-shrink:0;
}
.cell{
  display:flex;align-items:center;justify-content:center;
  position:relative;font-size:inherit;line-height:1;
}
.cell.wall{
  background:#2d1060;
  box-shadow:inset 0 2px 0 rgba(255,255,255,0.08),inset 0 -1px 0 rgba(0,0,0,0.3);
}
.cell.wall::after{
  content:'';position:absolute;inset:0;
  background:repeating-linear-gradient(0deg,transparent,transparent 48%,rgba(0,0,0,0.15) 48%,rgba(0,0,0,0.15) 52%);
}
.cell.path{background:#142214;}
.cell.path:nth-child(odd){background:#162616;}

/* セル内要素 */
.cell-inner{
  position:relative;z-index:2;
  width:100%;height:100%;
  display:flex;align-items:center;justify-content:center;
  font-size:inherit;
}
/* プレイヤー */
.cell.player .cell-inner::before{
  content:'';position:absolute;inset:-20%;
  background:radial-gradient(circle,rgba(100,200,255,0.4),transparent 70%);
  border-radius:50%;
  animation:playerGlow 1.5s ease-in-out infinite;
}
@keyframes playerGlow{0%,100%{opacity:0.5;}50%{opacity:1;}}
.cell.invincible{animation:blink 0.15s step-end infinite;}
@keyframes blink{0%,100%{opacity:1;}50%{opacity:0.2;}}

/* ゴール */
.cell.goal .cell-inner::before{
  content:'';position:absolute;inset:-30%;
  background:radial-gradient(circle,rgba(255,215,0,0.35),transparent 70%);
  border-radius:50%;
  animation:goalGlow 1s ease-in-out infinite;
}
@keyframes goalGlow{0%,100%{transform:scale(1);}50%{transform:scale(1.2);}}

/* コイン */
.cell.coin .cell-inner{
  animation:coinBob 1.2s ease-in-out infinite;
}
@keyframes coinBob{0%,100%{transform:translateY(0);}50%{transform:translateY(-15%);}}
.cell.coin .cell-inner::before{
  content:'';position:absolute;inset:-10%;
  background:radial-gradient(circle,rgba(255,215,0,0.3),transparent 70%);
  border-radius:50%;
}

/* 敵 */
.cell.enemy .cell-inner{
  animation:enemyBob 0.8s ease-in-out infinite alternate;
}
@keyframes enemyBob{0%{transform:scale(0.9);}100%{transform:scale(1.1);}}
.cell.enemy .cell-inner::before{
  content:'';position:absolute;inset:-10%;
  background:radial-gradient(circle,rgba(255,50,50,0.3),transparent 70%);
  border-radius:50%;
}

/* 操作ボタン */
#controls{
  width:100%;max-width:260px;flex-shrink:0;
  display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(2,1fr);
  gap:6px;padding:6px 10px 10px;
}
.ctrl-btn{
  background:rgba(255,255,255,0.08);
  border:1.5px solid rgba(255,255,255,0.15);
  border-radius:14px;color:white;
  font-size:20px;cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  height:50px;transition:all 0.1s;
  touch-action:manipulation;
}
.ctrl-btn:active{background:rgba(255,215,0,0.25);border-color:rgba(255,215,0,0.6);transform:scale(0.9);}
.ctrl-up{grid-column:2;grid-row:1;}
.ctrl-left{grid-column:1;grid-row:2;}
.ctrl-down{grid-column:2;grid-row:2;}
.ctrl-right{grid-column:3;grid-row:2;}

/* オーバーレイ */
.overlay{
  position:fixed;inset:0;z-index:100;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  background:rgba(10,4,20,0.88);backdrop-filter:blur(6px);
  opacity:0;pointer-events:none;transition:opacity 0.3s;
}
.overlay.show{opacity:1;pointer-events:all;}
.ov-box{
  background:linear-gradient(160deg,#1c0840,#080015);
  border:1.5px solid rgba(255,215,0,0.4);border-radius:24px;
  padding:24px 28px;text-align:center;max-width:300px;width:88%;
  box-shadow:0 20px 60px rgba(0,0,0,0.6);
}
.ov-emoji{font-size:48px;margin-bottom:8px;}
.ov-title{font-size:22px;font-weight:900;color:#FFD700;margin-bottom:6px;}
.ov-sub{font-size:13px;color:rgba(255,255,255,0.6);margin-bottom:14px;line-height:1.7;}
.ov-score{font-size:36px;font-weight:900;color:#FFD700;margin:8px 0;text-shadow:0 0 18px rgba(255,215,0,0.5);}
.btn-gold{
  background:linear-gradient(135deg,#FF8F00,#FFD700);color:#1a0030;
  border:none;border-radius:14px;padding:12px 26px;
  font-size:16px;font-weight:900;cursor:pointer;font-family:inherit;
  box-shadow:0 4px 14px rgba(255,215,0,0.4);margin:4px;transition:transform 0.15s;
}
.btn-gold:hover{transform:scale(1.04);}
.btn-ghost{
  background:rgba(255,255,255,0.08);border:1px solid rgba(255,255,255,0.2);
  border-radius:14px;padding:10px 20px;font-size:14px;font-weight:700;
  color:rgba(255,255,255,0.7);cursor:pointer;font-family:inherit;margin:4px;
}
.char-grid{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin:10px 0;}
.char-opt{
  width:54px;height:54px;border-radius:12px;font-size:28px;
  background:rgba(255,255,255,0.06);border:2px solid rgba(255,255,255,0.12);
  display:flex;align-items:center;justify-content:center;cursor:pointer;transition:all 0.15s;
}
.char-opt.sel{background:rgba(255,215,0,0.2);border-color:#FFD700;box-shadow:0 0 10px rgba(255,215,0,0.3);}

/* コインエフェクト */
@keyframes coinPop{0%{transform:translateY(0);opacity:1;}100%{transform:translateY(-50px);opacity:0;}}
.coin-pop{
  position:fixed;font-size:18px;font-weight:900;color:#FFD700;
  pointer-events:none;z-index:200;
  animation:coinPop 0.6s ease-out forwards;
}
@keyframes shimmer{0%{background-position:0%}100%{background-position:200%}}
</style>
</head>

        filter:drop-shadow(0 0 20px rgba(255,215,0,0.5));
        line-height:1.1;margin-bottom:4px;
      ">まほうの めいろ</div>
      <div style="
        font-size:12px;font-weight:700;color:rgba(255,215,0,0.6);
        letter-spacing:4px;margin-bottom:16px;
      ">✦ FANTASY MAZE ✦</div>
    </div>

    <!-- カード部分 -->
    <div style="
      background:linear-gradient(160deg,rgba(28,8,64,0.95),rgba(8,0,21,0.97));
      border:1.5px solid rgba(255,215,0,0.35);
      border-radius:24px;padding:18px 20px 20px;
      max-width:320px;width:88%;
      box-shadow:0 20px 60px rgba(0,0,0,0.7),inset 0 1px 0 rgba(255,255,255,0.06);
    ">
      <!-- あそびかた -->
      <div style="
        display:flex;flex-direction:column;gap:7px;
        margin-bottom:16px;
      ">
        <div style="display:flex;align-items:center;gap:10px;background:rgba(255,255,255,0.04);border-radius:12px;padding:8px 12px;">
          <span style="font-size:22px;">🪙</span>
          <div>
            <div style="font-size:12px;font-weight:800;color:#FFD700;">コインを あつめよう</div>
            <div style="font-size:10px;color:rgba(255,255,255,0.5);">ぜんぶ とると ⭐⭐⭐ ゲット！</div>
          </div>
        </div>
        <div style="display:flex;align-items:center;gap:10px;background:rgba(255,255,255,0.04);border-radius:12px;padding:8px 12px;">
          <span style="font-size:22px;">🏁</span>
          <div>
            <div style="font-size:12px;font-weight:800;color:#80DEEA;">ゴールを めざそう</div>
            <div style="font-size:10px;color:rgba(255,255,255,0.5);">3つの ステージを クリア！</div>
          </div>
        </div>
        <div style="display:flex;align-items:center;gap:10px;background:rgba(255,255,255,0.04);border-radius:12px;padding:8px 12px;">
          <span style="font-size:22px;">👾</span>
          <div>
            <div style="font-size:12px;font-weight:800;color:#FF8A65;">てきに きをつけて！</div>
            <div style="font-size:10px;color:rgba(255,255,255,0.5);">さわると ❤️ がへるよ！</div>
          </div>
        </div>
      </div>

      <!-- キャラ選択 -->
      <div style="font-size:11px;color:rgba(255,215,0,0.7);font-weight:800;letter-spacing:1px;margin-bottom:8px;text-align:center;">✦ キャラを えらんでね ✦</div>
      <div class="char-grid" id="char-grid" style="margin-bottom:14px;"></div>

      <!-- スタートボタン -->
      <button class="btn-gold" onclick="startGame()" style="
        width:100%;font-size:18px;padding:14px;
        background:linear-gradient(135deg,#FF8F00,#FFD700,#FF8F00);
        background-size:200%;animation:shimmer 2.5s infinite linear;
        letter-spacing:2px;
      ">✨ はじめる！</button>
    </div>
  </div>
</div>

<!-- クリア -->
<div class="overlay" id="clear-ov">
  <div class="ov-box">
    <div class="ov-emoji" id="clear-emoji">🎉</div>
    <div class="ov-title" id="clear-title">クリア！</div>
    <div class="ov-sub" id="clear-sub"></div>
    <div class="ov-score" id="clear-score"></div>
    <button class="btn-gold" id="next-btn">つぎへ ▶</button>
  </div>
</div>

<!-- ゲームオーバー -->
<div class="overlay" id="go-ov">
  <div class="ov-box">
    <div class="ov-emoji">💀</div>
    <div class="ov-title" style="color:#FF5252;">ゲームオーバー</div>
    <div class="ov-sub">もう すこし だったのに！</div>
    <div class="ov-score" id="go-score"></div>
    <button class="btn-gold" onclick="restartGame()">もういちど</button>
    <button class="btn-ghost" onclick="showTitle()">タイトルへ</button>
  </div>
</div>

<!-- 全クリア -->
<div class="overlay" id="ac-ov">
  <div class="ov-box">
    <div class="ov-emoji">🏆</div>
    <div class="ov-title">ぜんぶ クリア！！</div>
    <div class="ov-sub">3つの めいろを<br>すべて とおりぬけた！</div>
    <div class="ov-score" id="ac-score"></div>
    <div id="ac-hs" style="font-size:12px;color:rgba(255,215,0,0.6);margin-bottom:12px;"></div>
    <button class="btn-gold" onclick="restartGame()">もういちど</button>
  </div>
</div>

<script>
const STAGES=[
  {size:11,enemies:2,coins:6, speed:700},
  {size:15,enemies:3,coins:10,speed:580},
  {size:19,enemies:5,coins:14,speed:460},
];
const CHARS=['🐱','🐶','🐰','🐸','🐼','🦊'];
const ENEMY_EMOJIS=['👾','🧟','👻','🐉','🦇','🕷️'];

let stageIdx=0,lives=3,totalCoins=0,totalTime=0;
let selChar=0;
let maze=[],sz=11,cs=28;
let px=1,py=1;
let enemies=[],coins=[];
let gx=0,gy=0;
let invincible=false,invTimer=null;
let moving=false;
let timerIv=null,enemyIv=null,startTime=0;
let cells=[];// DOM cellsの2D配列

// ===== キャラ選択 =====
function buildCharGrid(){
  const g=document.getElementById('char-grid');g.innerHTML='';
  CHARS.forEach((c,i)=>{
    const d=document.createElement('div');
    d.className='char-opt'+(i===selChar?' sel':'');
    d.textContent=c;
    d.onclick=()=>{selChar=i;buildCharGrid();};
    g.appendChild(d);
  });
}
buildCharGrid();

// ===== 迷路生成 =====
function genMaze(n){
  const g=Array.from({length:n},()=>Array(n).fill(1));
  function carve(x,y){
    const dirs=[[0,-2],[0,2],[-2,0],[2,0]].sort(()=>Math.random()-0.5);
    for(const[dx,dy]of dirs){
      const nx=x+dx,ny=y+dy;
      if(nx>0&&nx<n-1&&ny>0&&ny<n-1&&g[ny][nx]===1){
        g[y+dy/2][x+dx/2]=0;g[ny][nx]=0;carve(nx,ny);
      }
    }
  }
  g[1][1]=0;carve(1,1);return g;
}

function getPaths(m,n){
  const r=[];
  for(let y=0;y<n;y++)for(let x=0;x<n;x++)if(m[y][x]===0)r.push({x,y});
  return r;
}

// ===== 敵配置 =====
function placeEnemies(m,n,cnt){
  const paths=getPaths(m,n).filter(p=>!(p.x<=2&&p.y<=2)&&!(p.x>=n-3&&p.y>=n-3));
  const list=[];
  [...paths].sort(()=>Math.random()-0.5).slice(0,cnt).forEach((p,i)=>{
    const canH=m[p.y]?.[p.x-1]===0&&m[p.y]?.[p.x+1]===0;
    const canV=m[p.y-1]?.[p.x]===0&&m[p.y+1]?.[p.x]===0;
    const dir=(canH&&canV)?(Math.random()<0.5?'h':'v'):canH?'h':'v';
    let range=1;
    if(dir==='h'){let l=p.x,r=p.x;while(l>1&&m[p.y][l-1]===0)l--;while(r<n-2&&m[p.y][r+1]===0)r++;range=Math.max(1,Math.floor((r-l)/2));}
    else{let t=p.y,b=p.y;while(t>1&&m[t-1][p.x]===0)t--;while(b<n-2&&m[b+1][p.x]===0)b++;range=Math.max(1,Math.floor((b-t)/2));}
    list.push({x:p.x,y:p.y,ox:p.x,oy:p.y,dir,range,step:0,ds:1,emoji:ENEMY_EMOJIS[i%ENEMY_EMOJIS.length]});
  });
  return list;
}

// ===== コイン配置 =====
function placeCoins(m,n,cnt,epos){
  const paths=getPaths(m,n).filter(p=>
    !(p.x===1&&p.y===1)&&!(p.x===n-2&&p.y===n-2)&&
    !epos.some(e=>e.x===p.x&&e.y===p.y)
  );
  return [...paths].sort(()=>Math.random()-0.5).slice(0,cnt).map(p=>({...p,got:false}));
}

// ===== セルサイズ計算 =====
function calcCellSize(n){
  const hudH=document.getElementById('hud').offsetHeight||72;
  const ctrlH=document.getElementById('controls').offsetHeight||118;
  const avW=Math.min(window.innerWidth-8,480);
  const avH=window.innerHeight-hudH-ctrlH-16;
  return Math.max(14,Math.floor(Math.min(avW,avH)/n));
}

// ===== 迷路DOM構築 =====
function buildMazeDOM(){
  const mazeEl=document.getElementById('maze');
  mazeEl.innerHTML='';
  mazeEl.style.gridTemplateColumns=`repeat(${sz},${cs}px)`;
  mazeEl.style.gridTemplateRows=`repeat(${sz},${cs}px)`;
  mazeEl.style.fontSize=`${Math.round(cs*0.72)}px`;
  cells=[];
  for(let y=0;y<sz;y++){
    cells[y]=[];
    for(let x=0;x<sz;x++){
      const div=document.createElement('div');
      div.className='cell '+(maze[y][x]===1?'wall':'path');
      div.style.width=cs+'px';div.style.height=cs+'px';
      const inner=document.createElement('div');inner.className='cell-inner';
      div.appendChild(inner);mazeEl.appendChild(div);
      cells[y][x]=div;
    }
  }
}

// ===== 画面更新 =====
function renderAll(){
  // リセット
  for(let y=0;y<sz;y++)for(let x=0;x<sz;x++){
    const div=cells[y][x];
    div.className='cell '+(maze[y][x]===1?'wall':'path');
    div.firstChild.textContent='';
  }
  // ゴール
  cells[gy][gx].className='cell path goal';
  cells[gy][gx].firstChild.textContent='🏁';
  // コイン
  coins.forEach(c=>{
    if(c.got)return;
    cells[c.y][c.x].className='cell path coin';
    cells[c.y][c.x].firstChild.textContent='🪙';
  });
  // 敵
  enemies.forEach(e=>{
    if(cells[e.y]&&cells[e.y][e.x]){
      cells[e.y][e.x].className='cell path enemy';
      cells[e.y][e.x].firstChild.textContent=e.emoji;
    }
  });
  // プレイヤー
  const pd=cells[py][px];
  pd.className='cell path player'+(invincible?' invincible':'');
  pd.firstChild.textContent=CHARS[selChar];
}

// ===== ステージセットアップ =====
function setupStage(idx){
  const cfg=STAGES[idx];sz=cfg.size;
  maze=genMaze(sz);
  px=1;py=1;gx=sz-2;gy=sz-2;
  enemies=placeEnemies(maze,sz,cfg.enemies);
  coins=placeCoins(maze,sz,cfg.coins,enemies);
  cs=calcCellSize(sz);
  buildMazeDOM();renderAll();
  clearInterval(enemyIv);
  enemyIv=setInterval(moveEnemies,cfg.speed);
  startTime=Date.now()-totalTime*1000;
  clearInterval(timerIv);
  timerIv=setInterval(()=>{
    totalTime=Math.floor((Date.now()-startTime)/1000);
    const m=Math.floor(totalTime/60),s=totalTime%60;
    document.getElementById('hud-time').textContent=`⏱ ${m}:${String(s).padStart(2,'0')}`;
  },500);
  document.getElementById('hud-stage').textContent=`⚔️ ステージ ${idx+1}`;
  updateHUD();
}

// ===== 敵移動 =====
function moveEnemies(){
  enemies.forEach(e=>{
    e.step+=e.ds;
    if(Math.abs(e.step)>=e.range)e.ds*=-1;
    const nx=e.dir==='h'?e.ox+e.step:e.ox;
    const ny=e.dir==='v'?e.oy+e.step:e.oy;
    if(maze[ny]?.[nx]===0){e.x=nx;e.y=ny;}
    else{e.ds*=-1;e.step+=e.ds*2;}
  });
  checkEnemy();
  renderAll();
}

// ===== 移動 =====
function tryMove(dx,dy){
  if(moving)return;
  const nx=px+dx,ny=py+dy;
  if(nx<0||nx>=sz||ny<0||ny>=sz||maze[ny][nx]===1)return;
  moving=true;px=nx;py=ny;
  checkCoin();checkEnemy();checkGoal();
  renderAll();
  setTimeout(()=>{moving=false;},70);
}

function checkCoin(){
  const c=coins.find(c=>!c.got&&c.x===px&&c.y===py);
  if(c){c.got=true;totalCoins++;updateHUD();showCoinPop();}
}
function showCoinPop(){
  const el=document.createElement('div');el.className='coin-pop';el.textContent='+🪙';
  const maze=document.getElementById('maze').getBoundingClientRect();
  el.style.left=(maze.left+maze.width/2-12)+'px';
  el.style.top=(maze.top+maze.height/2-12)+'px';
  document.body.appendChild(el);setTimeout(()=>el.remove(),650);
}

function checkEnemy(){
  if(invincible)return;
  if(enemies.some(e=>e.x===px&&e.y===py)){
    lives--;updateHUD();
    if(lives<=0){setTimeout(gameOver,300);return;}
    invincible=true;clearTimeout(invTimer);
    invTimer=setTimeout(()=>{invincible=false;renderAll();},2000);
  }
}

function checkGoal(){
  if(px===gx&&py===gy)setTimeout(stageClear,100);
}

function updateHUD(){
  document.getElementById('hud-coins').textContent=`🪙 ${totalCoins}`;
  document.getElementById('hud-lives').textContent='❤️'.repeat(lives)+'🖤'.repeat(3-lives);
}

function stageClear(){
  clearInterval(enemyIv);clearInterval(timerIv);
  const got=coins.filter(c=>c.got).length,all=coins.length;
  const stars=got===all?'⭐⭐⭐':got>0?'⭐⭐':'⭐';
  document.getElementById('clear-emoji').textContent=got===all?'🎊':'🎉';
  document.getElementById('clear-title').textContent=`ステージ ${stageIdx+1} クリア！`;
  document.getElementById('clear-sub').innerHTML=`${stars}<br>コイン：🪙 ${got}/${all}　タイム：${fmt(totalTime)}`;
  document.getElementById('clear-score').textContent=`🪙 ${totalCoins} まい`;
  const nb=document.getElementById('next-btn');
  if(stageIdx>=STAGES.length-1){nb.textContent='🏆 ぜんぶ クリア！';nb.onclick=allClear;}
  else{nb.textContent='つぎへ ▶';nb.onclick=nextStage;}
  document.getElementById('clear-ov').classList.add('show');
}

function fmt(s){return `${Math.floor(s/60)}:${String(s%60).padStart(2,'0')}`;}

function nextStage(){
  document.getElementById('clear-ov').classList.remove('show');
  stageIdx++;setupStage(stageIdx);
}

function gameOver(){
  clearInterval(enemyIv);clearInterval(timerIv);
  document.getElementById('go-score').textContent=`🪙 ${totalCoins} まい`;
  document.getElementById('go-ov').classList.add('show');
}

function allClear(){
  document.getElementById('clear-ov').classList.remove('show');
  const hs=parseInt(localStorage.getItem('meiro_hs')||'0');
  const isNew=totalCoins>hs;
  if(isNew)localStorage.setItem('meiro_hs',totalCoins);
  document.getElementById('ac-score').textContent=`🪙 ${totalCoins} まい | ${fmt(totalTime)}`;
  document.getElementById('ac-hs').textContent=isNew?'🏆 ハイスコア こうしん！':`ハイスコア：🪙 ${hs} まい`;
  document.getElementById('ac-ov').classList.add('show');
}

function startGame(){
  document.getElementById('title-ov').classList.remove('show');
  stageIdx=0;lives=3;totalCoins=0;totalTime=0;updateHUD();
  setupStage(0);
}
function restartGame(){
  ['go-ov','ac-ov','clear-ov'].forEach(id=>document.getElementById(id).classList.remove('show'));
  stageIdx=0;lives=3;totalCoins=0;totalTime=0;updateHUD();
  setupStage(0);
}
function showTitle(){
  clearInterval(enemyIv);clearInterval(timerIv);
  document.getElementById('go-ov').classList.remove('show');
  document.getElementById('title-ov').classList.add('show');
}
function goBack(){
  clearInterval(enemyIv);clearInterval(timerIv);
  if(window.parent!==window)window.parent.postMessage({type:'goBack'},'*');
  else history.back();
}

// ===== ボタン操作 =====
['up','down','left','right'].forEach(dir=>{
  const btn=document.getElementById('btn-'+dir);
  const mv={up:[0,-1],down:[0,1],left:[-1,0],right:[1,0]}[dir];
  btn.addEventListener('touchstart',e=>{e.preventDefault();tryMove(...mv);},{passive:false});
  btn.addEventListener('mousedown',()=>tryMove(...mv));
});
window.addEventListener('keydown',e=>{
  const m={ArrowUp:[0,-1],ArrowDown:[0,1],ArrowLeft:[-1,0],ArrowRight:[1,0]}[e.key];
  if(m){e.preventDefault();tryMove(...m);}
});
window.addEventListener('resize',()=>{if(maze.length)setupStage(stageIdx);});
function goHome(){
  if(window.parent!==window)window.parent.postMessage({type:'goHome'},'*');
  else window.location.href='/';
}
</script>
