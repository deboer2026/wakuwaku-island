<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>さーもんをとろう！</title>
<link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@400;700;800;900&display=swap" rel="stylesheet">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'M PLUS Rounded 1c', sans-serif; overflow: hidden; background: #1a0005; }
#game-wrap { width: 100vw; height: 100svh; max-width: 480px; margin: 0 auto; position: relative; overflow: hidden; }
canvas#bg { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 0; }
canvas#cv { position: absolute; inset: 0; width: 100%; height: 100%; z-index: 2; }

/* HUD */
#hud {
  position: fixed; top: 0; left: 50%; transform: translateX(-50%);
  width: 100%; max-width: 480px; z-index: 100; box-sizing: border-box;
  padding: max(10px, env(safe-area-inset-top)) 12px 8px; display: none;
  background: linear-gradient(180deg, rgba(40,0,10,0.93) 0%, rgba(40,0,10,0.6) 70%, transparent);
}
.hud-nav { display: flex; justify-content: space-between; align-items: center; margin-bottom: 4px; }
#back-btn { background: rgba(0,0,0,0.55); color: white; border: 1.5px solid rgba(255,255,255,0.3); border-radius: 20px; padding: 5px 14px; font-size: 12px; font-weight: 700; cursor: pointer; font-family: inherit; }
#ui-bgm-btn { background: rgba(0,0,0,0.55); color: white; border: 1.5px solid rgba(255,255,255,0.3); border-radius: 50%; width: 32px; height: 32px; font-size: 16px; cursor: pointer; display: flex; align-items: center; justify-content: center; }
#status-bar { display: flex; justify-content: center; gap: 10px; pointer-events: none; }
.hud-chip { background: rgba(0,0,0,0.6); border: 1.5px solid rgba(255,100,100,0.4); border-radius: 12px; padding: 3px 12px; display: flex; align-items: center; gap: 6px; }
.hud-chip-label { font-size: 9px; color: rgba(255,255,255,0.5); font-weight: 700; }
.hud-chip-val { font-size: 15px; font-weight: 900; color: #FF8A80; }

.screen { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 20; padding: 0 20px; }

/* TITLE */
.title-frame {
  background: linear-gradient(145deg, rgba(60,5,15,0.97), rgba(35,2,8,0.99));
  border: 4px solid #FF5252; border-radius: 28px; padding: 22px 26px; text-align: center;
  width: 100%; max-width: 340px;
  box-shadow: 0 0 0 2px #7f0000, 0 0 40px rgba(255,82,82,0.15), 0 12px 40px rgba(0,0,0,0.7);
}
.sushi-parade { display: flex; justify-content: center; gap: 5px; margin-bottom: 10px; }
.sushi-plate {
  width: 46px; height: 46px; border-radius: 50%; background: rgba(255,255,255,0.92);
  border: 3px solid #FF5252; display: flex; align-items: center; justify-content: center;
  font-size: 26px; box-shadow: 0 3px 0 #b71c1c, 0 0 10px rgba(255,82,82,0.3);
  animation: plateFloat var(--d,1.2s) ease-in-out infinite;
}
@keyframes plateFloat { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-7px)} }
.lane-preview { width: 100%; height: 10px; background: linear-gradient(90deg, rgba(255,82,82,0.2), rgba(255,82,82,0.5), rgba(255,82,82,0.2)); border-radius: 5px; margin: 8px 0; position: relative; overflow: hidden; }
.lane-preview::after { content:''; position:absolute; top:0; left:-30%; width:30%; height:100%; background:linear-gradient(90deg,transparent,rgba(255,255,255,0.4),transparent); animation:laneSweep 1.5s linear infinite; }
@keyframes laneSweep { to{left:130%} }
.title-label { font-size: 11px; font-weight: 900; color: rgba(255,130,130,0.65); letter-spacing: 4px; margin-bottom: 4px; }
.title-text {
  font-size: 32px; font-weight: 900;
  background: linear-gradient(180deg, #FF8A80, #FF1744);
  -webkit-background-clip: text; -webkit-text-fill-color: transparent;
  filter: drop-shadow(2px 3px 0 rgba(0,0,0,0.6)); margin-bottom: 6px;
}
.title-sub { font-size: 13px; color: rgba(255,255,255,0.72); line-height: 1.9; margin-bottom: 12px; }
.hi-badge { background: rgba(255,82,82,0.12); border: 1.5px solid rgba(255,82,82,0.4); color: #FF8A80; font-size: 13px; font-weight: 700; padding: 5px 18px; border-radius: 20px; margin-bottom: 16px; display: inline-block; }
.big-btn {
  background: linear-gradient(145deg, #FF5252, #B71C1C);
  color: #fff; border: none; border-radius: 50px; padding: 14px 44px; font-size: 20px; font-weight: 900;
  cursor: pointer; position: relative; overflow: hidden;
  box-shadow: 0 6px 0 #7f0000, 0 8px 20px rgba(0,0,0,0.35);
  touch-action: manipulation; font-family: inherit;
}
.big-btn::before { content:''; position:absolute; top:0; left:0; right:0; height:50%; border-radius:50px 50px 0 0; background:rgba(255,255,255,0.18); }
.big-btn:active { transform:translateY(5px); box-shadow:0 1px 0 #7f0000; }
.big-btn.blue { background:linear-gradient(145deg,#42A5F5,#1565C0); box-shadow:0 6px 0 #0D47A1; }
.big-btn.blue:active { box-shadow:0 1px 0 #0D47A1; }

/* Stage clear */
#stage-clear {
  position: absolute; inset: 0; z-index: 28; display: none; flex-direction: column; align-items: center; justify-content: center;
  background: rgba(20,0,5,0.92);
}
.stage-clear-frame {
  background: linear-gradient(145deg, rgba(60,5,15,0.97), rgba(35,2,8,0.99));
  border: 4px solid #FF9800; border-radius: 28px; padding: 28px; text-align: center;
  box-shadow: 0 0 0 2px #E65100, 0 0 40px rgba(255,152,0,0.2);
  width: 100%; max-width: 320px;
}
.stage-clear-frame h2 { font-size: 30px; font-weight: 900; color: #FFD700; text-shadow: 2px 2px 0 #8B6914; margin-bottom: 8px; }
.stage-clear-frame p  { font-size: 15px; color: rgba(255,255,255,0.8); line-height: 1.8; margin-bottom: 16px; }

/* Result */
#result-overlay {
  position: absolute; inset: 0; z-index: 30; display: none; flex-direction: column; align-items: center; justify-content: center;
  background: rgba(15,0,4,0.93);
}
.result-frame {
  background: linear-gradient(145deg, rgba(60,5,15,0.97), rgba(35,2,8,0.99));
  border: 4px solid #FF5252; border-radius: 28px; padding: 26px; text-align: center;
  box-shadow: 0 0 0 2px #7f0000, 0 0 40px rgba(255,82,82,0.15), 0 12px 40px rgba(0,0,0,0.7);
  width: 100%; max-width: 320px;
}
.result-trophy { font-size: 64px; margin-bottom: 6px; animation: tBounce .6s ease; }
@keyframes tBounce { 0%{transform:scale(0) rotate(-10deg)} 60%{transform:scale(1.2)} 100%{transform:scale(1)} }
.result-title { font-size: 28px; font-weight: 900; color: #FF8A80; text-shadow: 2px 2px 0 #7f0000; margin-bottom: 10px; }
.result-score-wrap { background: rgba(0,0,0,0.35); border-radius: 16px; padding: 12px 20px; margin-bottom: 12px; }
.result-score-label { font-size: 13px; color: rgba(255,255,255,.6); font-weight: 700; }
.result-score-num { font-size: 56px; font-weight: 900; color: #FFD700; line-height: 1; display: block; }
.result-hi { font-size: 13px; color: rgba(255,255,255,.5); margin-bottom: 16px; font-weight: 700; }
.result-hi.new { color: #FFD700; font-size: 16px; }
.result-btns { display: flex; gap: 10px; justify-content: center; }
.btn-retry { background:linear-gradient(145deg,#FF5252,#B71C1C); color:#fff; border:none; border-radius:50px; padding:12px 24px; font-size:16px; font-weight:700; cursor:pointer; box-shadow:0 5px 0 #7f0000; font-family:inherit; }
.btn-title { background:linear-gradient(145deg,#42A5F5,#1565C0); color:#fff; border:none; border-radius:50px; padding:12px 24px; font-size:16px; font-weight:700; cursor:pointer; box-shadow:0 5px 0 #0D47A1; font-family:inherit; }
.btn-retry:active,.btn-title:active { transform:translateY(4px); box-shadow:none; }

.confetti { position:fixed; pointer-events:none; z-index:48; font-size:18px; animation:cFall var(--dur,1.4s) ease forwards; }
@keyframes cFall { 0%{opacity:1;transform:translateY(0) rotate(0)} 100%{opacity:0;transform:translateY(140px) rotate(360deg)} }
.pop-label { position:absolute; font-weight:900; pointer-events:none; animation:popUp .7s forwards; z-index:25; white-space:nowrap; }
@keyframes popUp { 0%{opacity:1;transform:translateY(0) scale(1)} 100%{opacity:0;transform:translateY(-60px) scale(1.5)} }
</style>
</head>
<body>
<div id="game-wrap">
<canvas id="bg"></canvas>
<canvas id="cv"></canvas>

<!-- TITLE -->
<div id="title-screen" class="screen">
  <div class="title-frame">
    <div class="sushi-parade">
      <div class="sushi-plate" style="--d:1.0s">🍣</div>
      <div class="sushi-plate" style="--d:1.3s;animation-delay:.2s">🐱</div>
      <div class="sushi-plate" style="--d:1.1s;animation-delay:.05s">🍣</div>
      <div class="sushi-plate" style="--d:1.4s;animation-delay:.3s">🐶</div>
      <div class="sushi-plate" style="--d:1.2s;animation-delay:.15s">🍣</div>
    </div>
    <div class="lane-preview"></div>
    <div class="lane-preview" style="animation-delay:.5s"></div>
    <div class="lane-preview" style="animation-delay:1s"></div>
    <div class="title-label">✦ さーもんをとろう ✦</div>
    <div class="title-text">さーもんをとろう！</div>
    <p class="title-sub">🍣 さーもんをタップしよう！<br>どうぶつはタップしちゃダメ！</p>
    <div id="hi-title" class="hi-badge">🏆 ハイスコア: 0てん</div>
    <button class="big-btn" onclick="startGame()">▶ スタート！</button>
  </div>
</div>

<!-- HUD -->
<div id="hud">
  <div class="hud-nav">
    <button id="back-btn" onclick="goBack()">🏠 もどる</button>
    <div id="ui-bgm-btn">🔊</div>
  </div>
  <div id="status-bar">
    <div class="hud-chip"><span class="hud-chip-label">スコア</span><span class="hud-chip-val" id="score-disp">0</span></div>
    <div class="hud-chip"><span class="hud-chip-label">ステージ</span><span class="hud-chip-val" id="stage-disp">1</span></div>
    <div class="hud-chip"><span class="hud-chip-label">ライフ</span><span class="hud-chip-val" id="hp-disp">❤❤❤</span></div>
  </div>
</div>

<!-- Stage clear -->
<div id="stage-clear">
  <div class="stage-clear-frame">
    <div style="font-size:56px;margin-bottom:8px">🎉</div>
    <h2 id="sc-title">ステージ1 クリア！</h2>
    <p id="sc-msg"></p>
    <button class="big-btn" onclick="nextStage()">つぎへ ▶</button>
  </div>
</div>

<!-- Result -->
<div id="result-overlay">
  <div class="result-frame">
    <div class="result-trophy" id="r-trophy">🍣</div>
    <div class="result-title" id="r-title">ナイス！</div>
    <div class="result-score-wrap">
      <div class="result-score-label">スコア</div>
      <span class="result-score-num" id="r-score">0</span>
      <div class="result-score-label">てん</div>
    </div>
    <div class="result-hi" id="r-hi"></div>
    <div class="result-btns">
      <button class="btn-retry" onclick="startGame()">もういちど</button>
      <button class="btn-title" onclick="goTitle()">タイトルへ</button>
    </div>
  </div>
</div>
</div>

<script>
const wrap=document.getElementById('game-wrap');
const bgcv=document.getElementById('bg'),bgctx=bgcv.getContext('2d');
const cv=document.getElementById('cv'),ctx=cv.getContext('2d');
let W,H,LANE_H,LANE_Y=[],ITEM_SIZE;
const LANE_COUNT=3;
const SALMON={e:'🍣',salmon:true};
const OTHERS=[{e:'🐱'},{e:'🐶'},{e:'🐸'},{e:'🐼'},{e:'🦊'},{e:'🐰'},{e:'🐧'},{e:'🐻'},{e:'🍊'},{e:'🍎'},{e:'🎀'},{e:'⭐'},{e:'🐙'},{e:'🦐'},{e:'🥚'},{e:'🐟'}];
let lanes=[[],[],[]],score=0,hp=3,stage=1,running=false;
let stageGoal=8,salmonCaught=0,speed=2,animId,spawnTimeout,missedSalmon=0;
let beltOffset=0;

function getHi(){return parseInt(localStorage.getItem('sushi3_hi')||'0');}
function saveHi(v){localStorage.setItem('sushi3_hi',v);}
function updateHiBadge(){document.getElementById('hi-title').textContent='🏆 ハイスコア: '+getHi()+'てん';}

function resize(){
  W=wrap.clientWidth;H=wrap.clientHeight;
  bgcv.width=W;bgcv.height=H;cv.width=W;cv.height=H;
  LANE_H=Math.floor((H*.72)/LANE_COUNT);
  ITEM_SIZE=Math.floor(LANE_H*.6);
  for(let i=0;i<LANE_COUNT;i++) LANE_Y[i]=Math.floor(H*.12)+i*LANE_H+LANE_H/2;
}

function stageSpeed(s){return 2+s*1.2;}
function stageGoalCount(s){return s===1?8:s===2?12:16;}
function stageInterval(s){return s===1?500:s===2?380:260;}

function mkItem(l){
  const isSalmon=Math.random()<0.38;
  const data=isSalmon?SALMON:OTHERS[Math.floor(Math.random()*OTHERS.length)];
  return{...data,lane:l,x:W+ITEM_SIZE,popping:false,popAlpha:1,popScale:1,shaking:false,shakeT:0,alive:true};
}

function spawnLoop(){
  if(!running)return;
  const tries = stage>=2 ? 2 : 1;
  const shuffled = [0,1,2].sort(()=>Math.random()-.5);
  let spawned = 0;
  for(const l of shuffled){
    if(spawned >= tries) break;
    // Only consider moving items (not popping/shaking) for gap check
    const active=lanes[l].filter(i=>i.alive&&!i.popping&&!i.shaking);
    const last=active[active.length-1];
    if(!last||last.x<W-ITEM_SIZE*0.8){
      lanes[l].push(mkItem(l));
      spawned++;
    }
  }
  spawnTimeout=setTimeout(spawnLoop,stageInterval(stage)+Math.random()*150);
}

function startGame(){
  score=0;hp=3;stage=1;running=true;salmonCaught=0;missedSalmon=0;
  stageGoal=stageGoalCount(1);speed=stageSpeed(1);lanes=[[],[],[]];
  document.getElementById('title-screen').style.display='none';
  document.getElementById('result-overlay').style.display='none';
  document.getElementById('stage-clear').style.display='none';
  document.getElementById('hud').style.display='block';
  document.getElementById('score-disp').textContent='0';
  document.getElementById('stage-disp').textContent='1';
  updateHp();clearTimeout(spawnTimeout);cancelAnimationFrame(animId);
  loop();spawnLoop();
}
function goTitle(){
  running=false;cancelAnimationFrame(animId);clearTimeout(spawnTimeout);
  document.getElementById('result-overlay').style.display='none';
  document.getElementById('stage-clear').style.display='none';
  document.getElementById('hud').style.display='none';
  document.getElementById('title-screen').style.display='flex';
  updateHiBadge();
}
function updateHp(){document.getElementById('hp-disp').textContent='❤️'.repeat(hp)+'🖤'.repeat(3-hp);}

function onTap(cx,cy){
  if(!running)return;
  for(let l=0;l<LANE_COUNT;l++){
    if(Math.abs(cy-LANE_Y[l])>LANE_H*.55)continue;
    for(let i=lanes[l].length-1;i>=0;i--){
      const item=lanes[l][i];
      if(!item.alive||item.popping||item.shaking)continue;
      if(Math.abs(item.x-cx)<ITEM_SIZE*.8){
        if(item.salmon){
          item.popping=true;salmonCaught++;score+=10;
          document.getElementById('score-disp').textContent=score;
          showPop(item.x,LANE_Y[l],'🍣 +10','#FFD700',24);
          if(salmonCaught>=stageGoal) setTimeout(()=>{running?checkStage():null;},600);
        } else {
          item.shaking=true;item.shakeT=0;
          hp=Math.max(0,hp-1);updateHp();
          showPop(item.x,LANE_Y[l],'🚫 ダメ！','#f44336',22);
          if(hp<=0)setTimeout(endGame,600);
        }
        break;
      }
    }
  }
}
cv.addEventListener('click',e=>{const r=cv.getBoundingClientRect();onTap((e.clientX-r.left)*(W/r.width),(e.clientY-r.top)*(H/r.height));});
cv.addEventListener('touchstart',e=>{e.preventDefault();const r=cv.getBoundingClientRect();Array.from(e.changedTouches).forEach(t=>onTap((t.clientX-r.left)*(W/r.width),(t.clientY-r.top)*(H/r.height)));},{passive:false});

function loop(){if(!running)return;update();draw();animId=requestAnimationFrame(loop);}

function update(){
  beltOffset=(beltOffset+speed)%(ITEM_SIZE*1.2);
  for(let l=0;l<LANE_COUNT;l++){
    lanes[l].forEach(item=>{
      if(!item.alive)return;
      if(item.popping){item.popAlpha-=0.09;item.popScale+=0.07;if(item.popAlpha<=0)item.alive=false;return;}
      if(item.shaking){item.shakeT+=0.28;if(item.shakeT>Math.PI*3){item.shaking=false;item.shakeT=0;}return;}
      item.x-=speed;
      if(item.x<-ITEM_SIZE)item.alive=false;
    });
    lanes[l]=lanes[l].filter(i=>i.alive||i.popping||i.shaking);
  }
}

function drawBg(){
  // Rich restaurant background
  const g=bgctx.createLinearGradient(0,0,0,H);
  g.addColorStop(0,'#1a0005');g.addColorStop(.4,'#2d000a');g.addColorStop(1,'#1a0005');
  bgctx.fillStyle=g;bgctx.fillRect(0,0,W,H);
  // Wood grain panels on sides
  bgctx.fillStyle='rgba(80,30,10,0.3)';
  bgctx.fillRect(0,0,W*.04,H);bgctx.fillRect(W*.96,0,W*.04,H);
  // Decorative top border
  const topG=bgctx.createLinearGradient(0,0,0,H*.08);
  topG.addColorStop(0,'rgba(255,60,60,0.3)');topG.addColorStop(1,'transparent');
  bgctx.fillStyle=topG;bgctx.fillRect(0,0,W,H*.08);
  // Lane divider decorations
  for(let i=0;i<LANE_COUNT-1;i++){
    const y=Math.floor(H*.12)+(i+1)*LANE_H;
    bgctx.strokeStyle='rgba(255,80,80,0.15)';bgctx.lineWidth=2;
    bgctx.setLineDash([8,8]);bgctx.beginPath();bgctx.moveTo(0,y);bgctx.lineTo(W,y);bgctx.stroke();bgctx.setLineDash([]);
  }
  // Bottom progress area bg
  bgctx.fillStyle='rgba(0,0,0,0.4)';bgctx.fillRect(0,H*.88,W,H*.12);
}

function draw(){
  drawBg();
  ctx.clearRect(0,0,W,H);
  const t=performance.now()/1000;

  for(let l=0;l<LANE_COUNT;l++){
    const y=LANE_Y[l];
    // Lane bg gradient
    const lG=ctx.createLinearGradient(0,y-LANE_H/2,0,y+LANE_H/2);
    const lColors=[['rgba(60,10,20,0.7)','rgba(40,5,12,0.7)'],['rgba(50,15,5,0.7)','rgba(35,8,3,0.7)'],['rgba(10,20,50,0.7)','rgba(5,12,35,0.7)']];
    lG.addColorStop(0,lColors[l][0]);lG.addColorStop(1,lColors[l][1]);
    ctx.fillStyle=lG;ctx.fillRect(0,y-LANE_H/2,W,LANE_H);

    // Conveyor belt track
    const beltY=y+LANE_H*.25;const beltH=LANE_H*.18;
    const bG=ctx.createLinearGradient(0,beltY,0,beltY+beltH);
    bG.addColorStop(0,'rgba(80,40,30,0.8)');bG.addColorStop(.5,'rgba(120,60,40,0.8)');bG.addColorStop(1,'rgba(60,30,20,0.8)');
    ctx.fillStyle=bG;ctx.fillRect(0,beltY,W,beltH);
    // Belt segments
    ctx.strokeStyle='rgba(200,100,60,0.4)';ctx.lineWidth=1;
    const segW=ITEM_SIZE*.8;
    for(let x=-beltOffset;x<W+segW;x+=segW){
      ctx.beginPath();ctx.moveTo(x,beltY);ctx.lineTo(x,beltY+beltH);ctx.stroke();
    }
    // Belt shine
    ctx.fillStyle='rgba(255,255,255,0.08)';ctx.fillRect(0,beltY,W,beltH*.3);

    // Items
    lanes[l].forEach(item=>{
      if(!item.alive)return;
      ctx.save();
      let ox=0;
      if(item.shaking)ox=Math.sin(item.shakeT*6)*9;
      if(item.popping){
        ctx.globalAlpha=Math.max(0,item.popAlpha);
        ctx.translate(item.x+ox,y);ctx.scale(item.popScale,item.popScale);
      } else {
        ctx.translate(item.x+ox,y);
      }
      const r=ITEM_SIZE*.52;
      // Plate shadow
      ctx.beginPath();ctx.ellipse(0,r*.15,r*.9,r*.25,0,0,Math.PI*2);
      ctx.fillStyle='rgba(0,0,0,0.35)';ctx.fill();
      // Plate body
      const pG=ctx.createRadialGradient(-r*.2,-r*.2,r*.1,0,0,r);
      if(item.salmon){
        pG.addColorStop(0,'#fff5f5');pG.addColorStop(1,'#ffe0e0');
      } else {
        pG.addColorStop(0,'#f8f8f8');pG.addColorStop(1,'#ececec');
      }
      ctx.beginPath();ctx.arc(0,0,r,0,Math.PI*2);
      ctx.fillStyle=pG;ctx.fill();
      // Plate rim
      ctx.strokeStyle=item.salmon?'#FF5252':'rgba(180,180,180,0.8)';
      ctx.lineWidth=item.salmon?3:2;ctx.stroke();
      // Salmon glow
      if(item.salmon){
        const glow=Math.sin(t*3)*0.2+0.4;
        ctx.beginPath();ctx.arc(0,0,r+4,0,Math.PI*2);
        ctx.strokeStyle=`rgba(255,82,82,${glow})`;ctx.lineWidth=3;ctx.stroke();
      }
      // Plate highlight
      ctx.beginPath();ctx.ellipse(-r*.22,-r*.26,r*.32,r*.16,Math.PI*-.35,0,Math.PI*2);
      ctx.fillStyle='rgba(255,255,255,0.55)';ctx.fill();
      // Emoji
      ctx.font=`${Math.round(ITEM_SIZE*.72)}px serif`;
      ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(item.e,0,-1);
      // X for traps
      if(!item.salmon&&!item.popping){
        ctx.strokeStyle='rgba(255,30,30,0.5)';ctx.lineWidth=2.5;
        const s=r*.38;
        ctx.beginPath();ctx.moveTo(-s,-s);ctx.lineTo(s,s);ctx.stroke();
        ctx.beginPath();ctx.moveTo(s,-s);ctx.lineTo(-s,s);ctx.stroke();
      }
      ctx.restore();
    });
  }

  // Progress bar (stylized)
  const prog=Math.min(salmonCaught/stageGoal,1);
  const barY=H*.9;const barH=H*.04;
  ctx.fillStyle='rgba(255,255,255,0.06)';ctx.fillRect(W*.05,barY,W*.9,barH);
  ctx.fillStyle='rgba(255,255,255,0.04)';
  const barG=ctx.createLinearGradient(W*.05,0,W*.95,0);
  barG.addColorStop(0,'#FF5252');barG.addColorStop(.5,'#FF8A80');barG.addColorStop(1,'#FF5252');
  ctx.fillStyle=barG;ctx.fillRect(W*.05,barY,W*.9*prog,barH);
  // Progress text
  ctx.fillStyle='rgba(255,255,255,0.8)';
  ctx.font=`bold ${Math.round(H*.025)}px 'M PLUS Rounded 1c',sans-serif`;
  ctx.textAlign='center';ctx.textBaseline='middle';
  ctx.fillText(`🍣 ${salmonCaught} / ${stageGoal}  (ステージ${stage})`,W/2,H*.94);
}

function checkStage(){
  if(!running)return;
  running=false;clearTimeout(spawnTimeout);cancelAnimationFrame(animId);
  if(stage>=3){endGame();return;}
  document.getElementById('stage-clear').style.display='flex';
  document.getElementById('sc-title').textContent=`ステージ${stage} クリア！`;
  document.getElementById('sc-msg').innerHTML=`🍣×${salmonCaught} とれたよ！<br>つぎは もっとはやいよ！`;
  for(let i=0;i<18;i++)setTimeout(spawnConfetti,i*80);
}
function nextStage(){
  stage++;stageGoal=stageGoalCount(stage);speed=stageSpeed(stage);
  salmonCaught=0;lanes=[[],[],[]];
  document.getElementById('stage-clear').style.display='none';
  document.getElementById('stage-disp').textContent=stage;
  running=true;loop();spawnLoop();
}
function endGame(){
  running=false;clearTimeout(spawnTimeout);cancelAnimationFrame(animId);
  document.getElementById('hud').style.display='none';
  document.getElementById('result-overlay').style.display='flex';
  const hi=getHi(),isNew=score>hi;if(isNew)saveHi(score);
  updateHiBadge();
  document.getElementById('r-score').textContent=score;
  const hiEl=document.getElementById('r-hi');
  hiEl.textContent=isNew?'🏆 ニューレコード！':'ハイスコア: '+hi+'てん';
  hiEl.className='result-hi'+(isNew?' new':'');
  let trophy,title;
  if(stage>=3&&salmonCaught>=stageGoal){trophy='🏆';title='チャンピオン！';}
  else if(score>=80){trophy='🍣';title='ナイス！';}
  else{trophy='😅';title='もういちど！';}
  document.getElementById('r-trophy').textContent=trophy;
  document.getElementById('r-title').textContent=title;
  for(let i=0;i<20;i++)setTimeout(spawnConfetti,i*80);
}
function spawnConfetti(){
  const items=['🍣','⭐','✨','🎉'];
  const el=document.createElement('div');el.className='confetti';
  el.textContent=items[Math.floor(Math.random()*items.length)];
  el.style.cssText=`left:${Math.random()*100}%;top:5px;--dur:${1+Math.random()*.8}s;animation-delay:${Math.random()*.2}s`;
  wrap.appendChild(el);setTimeout(()=>el.remove(),2000);
}
function showPop(x,y,text,color,size){
  const el=document.createElement('div');el.className='pop-label';el.textContent=text;
  el.style.color=color;el.style.fontSize=size+'px';
  el.style.left=(x-50)+'px';el.style.top=(y-40)+'px';
  wrap.appendChild(el);setTimeout(()=>el.remove(),800);
}
function goBack(){if(window.parent!==window)window.parent.postMessage({type:'goBack'},'*');else history.back();}
resize();updateHiBadge();window.addEventListener('resize',resize);
</script>
