<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>いろあわせ</title>
<link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@400;700;800;900&display=swap" rel="stylesheet">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'M PLUS Rounded 1c', sans-serif; overflow: hidden; background: #1a0033; }
#game-wrap { width: 100vw; height: 100svh; max-width: 480px; margin: 0 auto; position: relative; overflow: hidden; }
canvas#bg { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }

/* HUD */
#hud {
  position: fixed; top: 0; left: 50%; transform: translateX(-50%);
  width: 100%; max-width: 480px; z-index: 100; box-sizing: border-box;
  padding: max(10px, env(safe-area-inset-top)) 12px 8px; display: none;
  background: linear-gradient(180deg, rgba(20,0,50,0.93) 0%, rgba(20,0,50,0.6) 70%, transparent);
}
.hud-nav { display: flex; justify-content: space-between; align-items: center; margin-bottom: 4px; }
#back-btn { background: rgba(0,0,0,0.55); color: white; border: 1.5px solid rgba(255,255,255,0.3); border-radius: 20px; padding: 5px 14px; font-size: 12px; font-weight: 700; cursor: pointer; font-family: inherit; }
#ui-bgm-btn { background: rgba(0,0,0,0.55); color: white; border: 1.5px solid rgba(255,255,255,0.3); border-radius: 50%; width: 32px; height: 32px; font-size: 16px; cursor: pointer; display: flex; align-items: center; justify-content: center; }
#status-bar { display: flex; justify-content: center; gap: 14px; pointer-events: none; }
.hud-chip { background: rgba(0,0,0,0.6); border: 1.5px solid rgba(200,120,255,0.4); border-radius: 12px; padding: 3px 12px; display: flex; align-items: center; gap: 6px; }
.hud-chip-label { font-size: 9px; color: rgba(255,255,255,0.5); font-weight: 700; }
.hud-chip-val { font-size: 16px; font-weight: 900; color: #CE93D8; }

.screen { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 20; padding: 0 20px; }

/* TITLE */
.title-frame {
  background: linear-gradient(145deg, rgba(50,10,90,0.97), rgba(25,5,55,0.99));
  border: 4px solid #CE93D8; border-radius: 28px; padding: 24px 28px; text-align: center;
  width: 100%; max-width: 340px;
  box-shadow: 0 0 0 2px #6A1B9A, 0 0 40px rgba(206,147,216,0.2), 0 12px 40px rgba(0,0,0,0.6);
}
.title-palette { position: relative; width: 80px; height: 80px; margin: 0 auto 10px; }
.palette-svg { width: 80px; height: 80px; }
.palette-dot { animation: dotPop var(--d,1.2s) ease-in-out infinite; }
@keyframes dotPop { 0%,100%{transform:scale(1)} 50%{transform:scale(1.3)} }
.title-label { font-size: 12px; font-weight: 900; color: rgba(206,147,216,0.7); letter-spacing: 4px; margin-bottom: 4px; }
.title-text {
  font-size: 36px; font-weight: 900;
  background: linear-gradient(135deg, #F48FB1, #CE93D8, #90CAF9);
  -webkit-background-clip: text; -webkit-text-fill-color: transparent;
  filter: drop-shadow(2px 3px 0 rgba(0,0,0,0.5)); margin-bottom: 6px;
}
.title-sub { font-size: 13px; color: rgba(255,255,255,0.72); line-height: 1.9; margin-bottom: 14px; }
.hi-badge { background: rgba(206,147,216,0.15); border: 1.5px solid rgba(206,147,216,0.4); color: #CE93D8; font-size: 13px; font-weight: 700; padding: 5px 18px; border-radius: 20px; margin-bottom: 16px; display: inline-block; }
.big-btn {
  background: linear-gradient(145deg, #AB47BC, #6A1B9A);
  color: #fff; border: none; border-radius: 50px; padding: 15px 48px; font-size: 21px; font-weight: 900;
  cursor: pointer; position: relative; overflow: hidden;
  box-shadow: 0 6px 0 #4A148C, 0 8px 20px rgba(0,0,0,0.35);
  touch-action: manipulation; font-family: inherit;
}
.big-btn::before { content:''; position:absolute; top:0; left:0; right:0; height:50%; border-radius:50px 50px 0 0; background:rgba(255,255,255,0.18); }
.big-btn:active { transform:translateY(5px); box-shadow:0 1px 0 #4A148C; }

/* GAME */
#game-area {
  position: absolute; inset: 0; z-index: 10; display: none;
  flex-direction: column; align-items: center; justify-content: space-around;
  padding: 80px 14px 14px;
}

/* Progress */
#progress-wrap { width: 100%; max-width: 340px; }
.progress-stars { display: flex; gap: 3px; justify-content: center; margin-bottom: 6px; }
.p-star { font-size: 15px; opacity: 0.2; filter: grayscale(1); transition: all .3s; }
.p-star.earned { opacity: 1; filter: none; animation: starPop .4s ease; }
@keyframes starPop { 0%{transform:scale(0) rotate(-30deg)} 60%{transform:scale(1.5)} 100%{transform:scale(1)} }
#progress-bar-bg { background: rgba(255,255,255,0.12); border-radius: 10px; height: 8px; overflow: hidden; border: 1px solid rgba(255,255,255,0.2); }
#progress-bar { background: linear-gradient(90deg, #AB47BC, #F06292, #FFD700); height: 100%; border-radius: 10px; transition: width .5s ease; }
#progress-text { font-size: 10px; color: rgba(255,255,255,0.45); text-align: right; margin-top: 3px; }

/* Mix display panel */
#mix-panel {
  width: 100%; max-width: 340px;
  background: linear-gradient(145deg, rgba(50,10,90,0.92), rgba(25,5,55,0.95));
  border: 3px solid rgba(206,147,216,0.45); border-radius: 22px; padding: 16px;
  box-shadow: 0 0 24px rgba(206,147,216,0.12), 0 6px 20px rgba(0,0,0,0.4);
}
#mix-mode-label { font-size: 12px; font-weight: 700; color: rgba(206,147,216,0.8); text-align: center; margin-bottom: 14px; letter-spacing: 1px; }

/* Color circles in mix display */
#mix-display { display: flex; align-items: center; justify-content: center; gap: 10px; }
.color-orb {
  width: 70px; height: 70px; border-radius: 50%;
  box-shadow: 0 0 20px var(--glow, rgba(255,255,255,0.3)), 0 4px 12px rgba(0,0,0,0.4);
  border: 3px solid rgba(255,255,255,0.3);
  display: flex; align-items: center; justify-content: center;
  font-size: 12px; font-weight: 700; color: rgba(255,255,255,0.9);
  text-shadow: 1px 1px 3px rgba(0,0,0,0.6);
  flex-shrink: 0;
  animation: orbFloat 2s ease-in-out infinite;
}
@keyframes orbFloat { 0%,100%{transform:translateY(0) scale(1)} 50%{transform:translateY(-6px) scale(1.04)} }
.mix-op { font-size: 28px; font-weight: 900; color: #FFD700; text-shadow: 0 0 10px rgba(255,215,0,0.6); }
.mix-eq { font-size: 28px; font-weight: 900; color: #CE93D8; }
.result-orb {
  width: 80px; height: 80px; border-radius: 50%;
  background: linear-gradient(135deg, #555, #333);
  border: 3px solid rgba(255,255,255,0.25);
  box-shadow: 0 4px 16px rgba(0,0,0,0.5);
  display: flex; align-items: center; justify-content: center;
  font-size: 32px;
  animation: orbPulse 1s ease-in-out infinite;
}
@keyframes orbPulse { 0%,100%{transform:scale(1);box-shadow:0 4px 16px rgba(0,0,0,.5)} 50%{transform:scale(1.08);box-shadow:0 4px 24px rgba(206,147,216,.4)} }

/* Choices */
#choices { display: grid; grid-template-columns: repeat(2,1fr); gap: 10px; width: 100%; max-width: 340px; }
.choice-btn {
  position: relative; overflow: hidden;
  background: rgba(30,10,60,0.85);
  border: 3px solid rgba(206,147,216,0.35); border-radius: 18px;
  padding: 12px 8px; cursor: pointer; text-align: center;
  box-shadow: 0 5px 0 rgba(0,0,0,0.4), 0 7px 14px rgba(0,0,0,0.2);
  touch-action: manipulation; font-family: inherit; transition: transform .1s;
  display: flex; flex-direction: column; align-items: center; gap: 6px;
}
.choice-btn::before { content:''; position:absolute; top:0; left:0; right:0; height:45%; border-radius:15px 15px 0 0; background:rgba(255,255,255,0.06); }
.choice-btn:active { transform:translateY(4px); box-shadow:0 1px 0 rgba(0,0,0,.4); }
.choice-btn.correct { border-color:#4CAF50; background:rgba(20,60,20,0.9); animation:cPop .4s; box-shadow:0 5px 0 #1b5e20, 0 0 20px rgba(76,175,80,0.4); }
.choice-btn.wrong   { border-color:#f44336; background:rgba(60,10,10,0.9); animation:wShake .4s; }
@keyframes cPop  { 0%{transform:scale(1)} 30%{transform:scale(1.08)} 100%{transform:scale(1)} }
@keyframes wShake{ 0%,100%{transform:translateX(0)} 25%{transform:translateX(-8px)} 75%{transform:translateX(8px)} }
.choice-orb { width: 48px; height: 48px; border-radius: 50%; box-shadow: 0 3px 10px rgba(0,0,0,0.4), 0 0 12px var(--glow,rgba(255,255,255,0.2)); border: 2px solid rgba(255,255,255,0.2); }
.choice-name { font-size: 14px; font-weight: 800; color: rgba(255,255,255,0.9); }

/* Feedback */
#feedback-overlay { position:fixed; inset:0; pointer-events:none; z-index:50; display:flex; align-items:center; justify-content:center; opacity:0; transition:opacity .15s; }
#feedback-text { font-size:90px; filter:drop-shadow(0 4px 12px rgba(0,0,0,.3)); }
#flash { position:fixed; inset:0; z-index:45; pointer-events:none; opacity:0; }

/* Result */
#result-overlay { position:absolute; inset:0; z-index:30; display:none; flex-direction:column; align-items:center; justify-content:center; background:rgba(10,0,25,0.93); }
.result-frame {
  background: linear-gradient(145deg, rgba(50,10,90,0.97), rgba(25,5,55,0.99));
  border: 4px solid #CE93D8; border-radius: 28px; padding: 26px; text-align: center;
  box-shadow: 0 0 0 2px #6A1B9A, 0 0 40px rgba(206,147,216,0.2), 0 12px 40px rgba(0,0,0,0.6);
  width: 100%; max-width: 320px;
}
.result-trophy { font-size: 64px; margin-bottom: 6px; animation: tBounce .6s ease; }
@keyframes tBounce { 0%{transform:scale(0) rotate(-10deg)} 60%{transform:scale(1.2)} 100%{transform:scale(1)} }
.result-title { font-size: 30px; font-weight: 900; color: #CE93D8; margin-bottom: 10px; }
.result-score-wrap { background: rgba(0,0,0,0.35); border-radius: 16px; padding: 12px 20px; margin-bottom: 12px; }
.result-score-label { font-size: 14px; color: rgba(255,255,255,.6); font-weight: 700; }
.result-score-num { font-size: 58px; font-weight: 900; color: #FFD700; line-height: 1; display: block; }
.result-hi { font-size: 13px; color: rgba(255,255,255,.5); margin-bottom: 18px; font-weight: 700; }
.result-hi.new { color: #FFD700; font-size: 16px; }
.result-btns { display: flex; gap: 10px; justify-content: center; }
.btn-retry { background:linear-gradient(145deg,#AB47BC,#6A1B9A); color:#fff; border:none; border-radius:50px; padding:12px 24px; font-size:16px; font-weight:700; cursor:pointer; box-shadow:0 5px 0 #4A148C; font-family:inherit; }
.btn-title { background:linear-gradient(145deg,#FF9800,#e65100); color:#fff; border:none; border-radius:50px; padding:12px 24px; font-size:16px; font-weight:700; cursor:pointer; box-shadow:0 5px 0 #bf360c; font-family:inherit; }
.btn-retry:active,.btn-title:active { transform:translateY(4px); box-shadow:none; }

.particle { position:fixed; pointer-events:none; z-index:48; font-size:20px; animation:pFly var(--dur,.9s) ease forwards; }
@keyframes pFly { 0%{opacity:1;transform:translate(0,0) scale(1)} 100%{opacity:0;transform:translate(var(--tx,0),var(--ty,-80px)) scale(.2)} }
.pop-word { position:fixed; font-weight:900; pointer-events:none; z-index:49; font-size:24px; animation:pWord .9s ease forwards; }
@keyframes pWord { 0%{opacity:0;transform:translateY(10px) scale(.6)} 25%{opacity:1;transform:translateY(-8px) scale(1.2)} 100%{opacity:0;transform:translateY(-60px) scale(.9)} }
</style>
<script src="/games/wakuwaku_bgm.js"></script>
</head>
<body>
<div id="game-wrap">
<canvas id="bg"></canvas>

<!-- TITLE -->
<div id="title-screen" class="screen">
  <div class="title-frame">
    <svg class="palette-svg" viewBox="0 0 80 80">
      <ellipse cx="40" cy="44" rx="34" ry="28" fill="#6D2B9A" stroke="#CE93D8" stroke-width="2.5"/>
      <ellipse cx="40" cy="44" rx="34" ry="28" fill="url(#pg)"/>
      <defs>
        <radialGradient id="pg" cx="35%" cy="35%"><stop offset="0%" stop-color="#AB47BC"/><stop offset="100%" stop-color="#4A148C"/></radialGradient>
      </defs>
      <circle cx="28" cy="52" r="8" fill="#F44336" class="palette-dot" style="--d:1.0s"/>
      <circle cx="40" cy="56" r="8" fill="#FF9800" class="palette-dot" style="--d:1.3s;animation-delay:.2s"/>
      <circle cx="52" cy="52" r="8" fill="#FFD700" class="palette-dot" style="--d:1.1s;animation-delay:.1s"/>
      <circle cx="56" cy="40" r="8" fill="#4CAF50" class="palette-dot" style="--d:1.4s;animation-delay:.3s"/>
      <circle cx="50" cy="30" r="8" fill="#2196F3" class="palette-dot" style="--d:1.2s;animation-delay:.15s"/>
      <circle cx="38" cy="26" r="8" fill="#9C27B0" class="palette-dot" style="--d:1.0s;animation-delay:.25s"/>
      <ellipse cx="40" cy="36" rx="10" ry="10" fill="#fff" opacity=".18"/>
      <circle cx="58" cy="20" r="10" fill="#fff8e1" stroke="#CE93D8" stroke-width="2"/>
      <rect x="54" y="28" width="4" height="16" rx="2" fill="#8D6E63" transform="rotate(-20 56 36)"/>
    </svg>
    <div class="title-label">✦ いろあわせ ✦</div>
    <div class="title-text">いろあわせ！</div>
    <p class="title-sub">いろをまぜると<br>なんいろになるかな？</p>
    <div id="hi-title" class="hi-badge">🏆 ハイスコア: 0もん</div>
    <button class="big-btn" onclick="startGame()">▶ スタート！</button>
  </div>
</div>

<!-- HUD -->
<div id="hud">
  <div class="hud-nav">
    <button id="back-btn" onclick="goBack()">🏠 もどる</button>
    <div id="ui-bgm-btn">🔊</div>
  </div>
  <div id="status-bar">
    <div class="hud-chip"><span class="hud-chip-label">せいかい</span><span class="hud-chip-val" id="score-disp">0</span></div>
    <div class="hud-chip"><span class="hud-chip-label">もんだい</span><span class="hud-chip-val" id="q-num-disp">1/10</span></div>
  </div>
</div>

<!-- GAME -->
<div id="game-area">
  <div id="progress-wrap">
    <div class="progress-stars" id="progress-stars"></div>
    <div id="progress-bar-bg"><div id="progress-bar" style="width:0%"></div></div>
    <div id="progress-text">0 / 10</div>
  </div>
  <div id="mix-panel">
    <div id="mix-mode-label">まぜると なにいろ？</div>
    <div id="mix-display"></div>
  </div>
  <div id="choices"></div>
</div>

<!-- FEEDBACK -->
<div id="feedback-overlay"><div id="feedback-text">⭕</div></div>
<div id="flash"></div>

<!-- RESULT -->
<div id="result-overlay" style="display:none;">
  <div class="result-frame">
    <div class="result-trophy" id="r-trophy">🏆</div>
    <div class="result-title" id="r-title">かんぺき！</div>
    <div class="result-score-wrap">
      <div class="result-score-label">せいかい</div>
      <span class="result-score-num" id="r-score">0</span>
      <div class="result-score-label">/ 10 もん</div>
    </div>
    <div class="result-hi" id="r-hi"></div>
    <div class="result-btns">
      <button class="btn-retry" onclick="startGame()">もういちど</button>
      <button class="btn-title" onclick="goTitle()">タイトルへ</button>
    </div>
  </div>
</div>
</div>

<script>
/* ===== Canvas BG: Paint studio ===== */
const cvs=document.getElementById('bg'),ctx=cvs.getContext('2d');
let W,H,drops=[],sparks=[];
function initC(){
  W=cvs.offsetWidth;H=cvs.offsetHeight;cvs.width=W;cvs.height=H;
  drops=[];
  const cols=['#f44336','#2196F3','#FFD700','#4CAF50','#9C27B0','#FF9800','#E91E63','#00BCD4'];
  for(let i=0;i<12;i++)drops.push({x:Math.random()*W,y:Math.random()*H,r:8+Math.random()*20,color:cols[i%cols.length],ph:Math.random()*Math.PI*2,sp:.3+Math.random()*.5,alpha:.08+Math.random()*.12});
  sparks=[];
  for(let i=0;i<30;i++)sparks.push({x:Math.random()*W,y:Math.random()*H,r:.8+Math.random()*1.8,color:cols[Math.floor(Math.random()*cols.length)],ph:Math.random()*Math.PI*2,sp:.6+Math.random()});
}
function drawBg(t){
  ctx.clearRect(0,0,W,H);
  const g=ctx.createLinearGradient(0,0,0,H);
  g.addColorStop(0,'#12002a');g.addColorStop(.5,'#1e0040');g.addColorStop(1,'#2a005a');
  ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  const ts=t/1000;
  drops.forEach(d=>{
    const bob=Math.sin(ts*d.sp+d.ph)*10;
    ctx.beginPath();ctx.arc(d.x,d.y+bob,d.r,0,Math.PI*2);
    ctx.fillStyle=d.color.replace(')',`,${d.alpha})`).replace('rgb','rgba').replace('#','');
    // simple hex→rgba
    const hex=d.color.replace('#','');
    const r=parseInt(hex.slice(0,2),16),g2=parseInt(hex.slice(2,4),16),b=parseInt(hex.slice(4,6),16);
    ctx.fillStyle=`rgba(${r},${g2},${b},${d.alpha})`;
    ctx.fill();
  });
  sparks.forEach(s=>{
    const tw=(Math.sin(ts*s.sp+s.ph)+1)/2;
    const hex=s.color.replace('#','');
    const r=parseInt(hex.slice(0,2),16),g2=parseInt(hex.slice(2,4),16),b=parseInt(hex.slice(4,6),16);
    ctx.fillStyle=`rgba(${r},${g2},${b},${tw*.8})`;
    ctx.beginPath();ctx.arc(s.x,s.y,s.r*(0.5+tw*.5),0,Math.PI*2);ctx.fill();
  });
}
let raf;function bgLoop(t){drawBg(t);raf=requestAnimationFrame(bgLoop);}
initC();requestAnimationFrame(bgLoop);window.addEventListener('resize',initC);

/* ===== Color Data ===== */
const COLORS={
  あか:    {hex:'#f44336',dark:'#b71c1c'},
  あお:    {hex:'#2196F3',dark:'#0D47A1'},
  きいろ:  {hex:'#FFEB3B',dark:'#F57F17'},
  しろ:    {hex:'#FAFAFA',dark:'#9E9E9E'},
  くろ:    {hex:'#424242',dark:'#212121'},
  みどり:  {hex:'#4CAF50',dark:'#1B5E20'},
  きみどり:{hex:'#8BC34A',dark:'#33691E'},
  オレンジ:{hex:'#FF9800',dark:'#E65100'},
  むらさき:{hex:'#9C27B0',dark:'#4A148C'},
  ピンク:  {hex:'#E91E63',dark:'#880E4F'},
  みずいろ:{hex:'#03A9F4',dark:'#01579B'},
  ちゃいろ:{hex:'#795548',dark:'#3E2723'},
  はいいろ:{hex:'#9E9E9E',dark:'#424242'},
};
const MIX=[
  {a:'あか',b:'あお',result:'むらさき'},
  {a:'あか',b:'きいろ',result:'オレンジ'},
  {a:'あお',b:'きいろ',result:'みどり'},
  {a:'あか',b:'しろ',result:'ピンク'},
  {a:'あお',b:'しろ',result:'みずいろ'},
  {a:'あか',b:'くろ',result:'ちゃいろ'},
  {a:'しろ',b:'くろ',result:'はいいろ'},
  {a:'あお',b:'みどり',result:'きみどり'},
  {a:'きいろ',b:'みどり',result:'きみどり'},
];
const NAME=[
  {color:'あか'},{color:'あお'},{color:'きいろ'},{color:'みどり'},
  {color:'オレンジ'},{color:'むらさき'},{color:'ピンク'},{color:'みずいろ'},
];

const TOTAL=10;
let queue=[],current=null,qIdx=0,score=0,locked=false;
function shuffle(a){return [...a].sort(()=>Math.random()-.5);}
function getHi(){return parseInt(localStorage.getItem('iro_hi')||'0');}
function saveHi(v){localStorage.setItem('iro_hi',v);}
function updateHiBadge(){document.getElementById('hi-title').textContent='🏆 ハイスコア: '+getHi()+'もん';}

function initStars(){
  const c=document.getElementById('progress-stars');c.innerHTML='';
  for(let i=0;i<TOTAL;i++){const s=document.createElement('span');s.className='p-star';s.textContent='⭐';s.id='pstar-'+i;c.appendChild(s);}
}
function earnStar(i){const el=document.getElementById('pstar-'+i);if(el)el.classList.add('earned');}

function buildQueue(){
  const mix=shuffle(MIX).slice(0,7).map(r=>({type:'mix',...r}));
  const name=shuffle(NAME).slice(0,3).map(r=>({type:'name',result:r.color}));
  return shuffle([...mix,...name]);
}

function startGame(){
  score=0;qIdx=0;locked=false;queue=buildQueue();
  document.getElementById('title-screen').style.display='none';
  document.getElementById('result-overlay').style.display='none';
  document.getElementById('hud').style.display='block';
  document.getElementById('game-area').style.display='flex';
  initStars();nextQ();
}
function goTitle(){
  document.getElementById('result-overlay').style.display='none';
  document.getElementById('hud').style.display='none';
  document.getElementById('game-area').style.display='none';
  document.getElementById('title-screen').style.display='flex';
  updateHiBadge();
}

function makeOrb(name,size=70,showLabel=true){
  const col=COLORS[name];
  const d=document.createElement('div');
  d.className='color-orb';
  d.style.cssText=`width:${size}px;height:${size}px;background:${col.hex};--glow:${col.hex}88;animation-delay:${Math.random()*.5}s`;
  if(showLabel) d.textContent=name;
  return d;
}

function nextQ(){
  if(qIdx>=TOTAL){endGame();return;}
  locked=false;current=queue[qIdx];
  document.getElementById('progress-bar').style.width=(qIdx/TOTAL*100)+'%';
  document.getElementById('progress-text').textContent=qIdx+' / '+TOTAL;
  document.getElementById('q-num-disp').textContent=(qIdx+1)+'/'+TOTAL;
  document.getElementById('score-disp').textContent=score;

  const disp=document.getElementById('mix-display');disp.innerHTML='';
  const label=document.getElementById('mix-mode-label');

  if(current.type==='mix'){
    label.textContent='まぜると なにいろ？';
    disp.appendChild(makeOrb(current.a));
    const op=document.createElement('span');op.className='mix-op';op.textContent='＋';disp.appendChild(op);
    disp.appendChild(makeOrb(current.b));
    const eq=document.createElement('span');eq.className='mix-eq';eq.textContent='＝';disp.appendChild(eq);
    const res=document.createElement('div');res.className='result-orb';res.textContent='？';disp.appendChild(res);
  } else {
    label.textContent='この いろは なに？';
    disp.appendChild(makeOrb(current.result,88,false)); // name quiz: hide label
  }

  // Choices: 4 colors
  const allNames=Object.keys(COLORS);
  const wrong=shuffle(allNames.filter(n=>n!==current.result)).slice(0,3);
  const ch=shuffle([current.result,...wrong]);
  const grid=document.getElementById('choices');grid.innerHTML='';

  // name quiz: choices show text only; mix quiz: show color orb + name
  const isNameMode = current.type === 'name';
  ch.forEach(name=>{
    const col=COLORS[name];
    const b=document.createElement('button');b.className='choice-btn';
    if(isNameMode){
      // text-only: large hiragana, no color orb
      b.style.cssText='padding:18px 8px;';
      const nm=document.createElement('div');nm.className='choice-name';nm.style.fontSize='22px';nm.textContent=name;
      b.appendChild(nm);
    } else {
      const orb=document.createElement('div');orb.className='choice-orb';
      orb.style.cssText=`background:${col.hex};--glow:${col.hex}66`;
      const nm=document.createElement('div');nm.className='choice-name';nm.textContent=name;
      b.appendChild(orb);b.appendChild(nm);
    }
    b.onclick=()=>onAnswer(b,name);
    b.addEventListener('touchend',e=>{e.preventDefault();onAnswer(b,name);},{passive:false});
    grid.appendChild(b);
  });
}

function onAnswer(btn,chosen){
  if(locked)return;locked=true;
  const ok=chosen===current.result;
  btn.classList.add(ok?'correct':'wrong');
  if(ok){
    score++;document.getElementById('score-disp').textContent=score;
    earnStar(qIdx);showFeedback('⭕');flash('rgba(156,39,176,0.35)');burst(current.result);pop('✨ せいかい！','#FFD700');
  } else {
    showFeedback('❌');flash('rgba(244,67,54,0.3)');pop('ざんねん…','#FF8A65');
    document.querySelectorAll('.choice-btn .choice-name').forEach(el=>{if(el.textContent===current.result)el.closest('.choice-btn').classList.add('correct');});
  }
  setTimeout(()=>{hideFeedback();qIdx++;nextQ();},1200);
}

function showFeedback(t){document.getElementById('feedback-text').textContent=t;document.getElementById('feedback-overlay').style.opacity='1';}
function hideFeedback(){document.getElementById('feedback-overlay').style.opacity='0';}
function flash(c){const f=document.getElementById('flash');f.style.transition='';f.style.background=c;f.style.opacity='1';setTimeout(()=>{f.style.transition='opacity .35s';f.style.opacity='0';},120);}

function burst(colorName){
  const hex=(COLORS[colorName]||{hex:'#FFD700'}).hex;
  const cx=window.innerWidth/2,cy=window.innerHeight*.45;
  const items=['●','◆','★','✦','🎨'];
  for(let i=0;i<12;i++){
    const el=document.createElement('div');el.className='particle';
    el.textContent=items[Math.floor(Math.random()*items.length)];
    el.style.color=hex;
    const a=(i/12)*Math.PI*2,d=60+Math.random()*70;
    el.style.cssText+=`;left:${cx}px;top:${cy}px;--tx:${Math.cos(a)*d}px;--ty:${Math.sin(a)*d-50}px;--dur:${.6+Math.random()*.4}s;animation-delay:${Math.random()*.08}s`;
    document.body.appendChild(el);setTimeout(()=>el.remove(),1100);
  }
}
function pop(text,color){
  const el=document.createElement('div');el.className='pop-word';el.textContent=text;el.style.color=color;
  el.style.cssText+=`;left:${window.innerWidth/2-80}px;top:${window.innerHeight*.38}px;text-shadow:2px 2px 4px rgba(0,0,0,.5)`;
  document.body.appendChild(el);setTimeout(()=>el.remove(),1000);
}
function endGame(){
  document.getElementById('hud').style.display='none';
  document.getElementById('game-area').style.display='none';
  document.getElementById('result-overlay').style.display='flex';
  const hi=getHi(),isNew=score>hi;if(isNew)saveHi(score);
  updateHiBadge();
  document.getElementById('r-score').textContent=score;
  const hiEl=document.getElementById('r-hi');
  let trophy,title;
  if(score>=9){trophy='🏆';title='いろはかせ！';}
  else if(score>=6){trophy='⭐';title='ナイス！';}
  else{trophy='🎨';title='もういちど！';}
  document.getElementById('r-trophy').textContent=trophy;
  document.getElementById('r-title').textContent=title;
  hiEl.textContent=isNew?'🏆 ニューレコード！':'ハイスコア: '+hi+'もん';
  hiEl.className='result-hi'+(isNew?' new':'');
  if(score>=6)for(let i=0;i<10;i++)setTimeout(()=>burst(['あか','あお','きいろ','みどり','むらさき'][Math.floor(Math.random()*5)]),i*150);
}
function goBack(){if(window.parent!==window)window.parent.postMessage({type:'goBack'},'*');else history.back();}
updateHiBadge();
</script>

<script>
// ── BGM (WakuwakuBGM library) ──────────────────────
let _bgm = null;

function _startBGM() {
  if (_bgm) return;
  _bgm = new WakuwakuBGM('magical');
  const on = WakuwakuBGM.loadState();
  _bgm.setEnabled(on);
  if (on) _bgm.start();
  _syncBgmBtn();
}

function toggleCommonBGM() {
  if (!_bgm) { _startBGM(); return; }
  const on = _bgm.toggle();
  WakuwakuBGM.saveState(on);
  _syncBgmBtn();
}

function _syncBgmBtn() {
  const on = _bgm ? _bgm.enabled : WakuwakuBGM.loadState();
  const btns = document.querySelectorAll(
    '#bgm-btn,#ui-bgm-btn,#bgm-toggle,#sound-btn,.bgm-btn'
  );
  btns.forEach(b => { b.textContent = on ? '🔊' : '🔇'; });
}

(function(){
  function _first(){ _startBGM(); }
  document.addEventListener('click', _first, { once: true });
  document.addEventListener('touchstart', _first, { once: true });
})();
// ── End BGM ────────────────────────────────────────
</script>
