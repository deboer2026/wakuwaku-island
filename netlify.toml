[build]
  command   = "npm run build"
  publish   = "dist"

# ── URL エイリアス 301リダイレクト ──────────────────────────
[[redirects]]
  from = "/kudamono"
  to   = "/kudamono-catch"
  status = 301

[[redirects]]
  from = "/puzzle"
  to   = "/doubutsu-puzzle"
  status = 301

[[redirects]]
  from = "/kazu"
  to   = "/kazu-asobi"
  status = 301

[[redirects]]
  from = "/soccer"
  to   = "/animal-soccer"
  status = 301

[[redirects]]
  from = "/jewelry"
  to   = "/jewelry-shop"
  status = 301

# ── SPA フォールバック（全ルートを index.html へ） ──────────
[[redirects]]
  from   = "/*"
  to     = "/index.html"
  status = 200

# ── キャッシュヘッダー（TTFB改善） ────────────────────────
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.css"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/icons/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
