<title>わくわくまちづくり</title>

<style>
*{margin:0;padding:0;box-sizing:border-box;}
html,body{height:100%;overflow:hidden;font-family:'M PLUS Rounded 1c',sans-serif;user-select:none;-webkit-tap-highlight-color:transparent;}
body{background:#0a1628;display:flex;flex-direction:column;}

/* ===== HUD ===== */
#hud{
  flex-shrink:0;
  background:linear-gradient(180deg,rgba(5,10,25,0.98),rgba(5,10,25,0.9));
  border-bottom:1px solid rgba(100,160,255,0.15);
  padding:max(10px,var(--sat,env(safe-area-inset-top,0px))) 8px 5px;
  display:flex;flex-direction:column;gap:4px;
}
.hud-nav-row{display:flex;align-items:center;gap:4px;}
.hud-status-row{display:flex;gap:4px;flex-wrap:wrap;}
.hud-spacer{flex:1;}
.hud-btn.icon-only{padding:4px 6px;min-width:28px;}
.hud-btn{background:none;border:1px solid rgba(255,255,255,0.18);border-radius:9px;padding:4px 9px;color:rgba(255,255,255,0.65);font-size:11px;font-weight:700;cursor:pointer;font-family:inherit;white-space:nowrap;}
.hud-btn:active{background:rgba(255,255,255,0.1);}
.hud-coin{background:rgba(255,215,0,0.12);border:1px solid rgba(255,215,0,0.35);border-radius:9px;padding:4px 11px;font-size:13px;font-weight:900;color:#FFD700;}
.hud-info{background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.1);border-radius:9px;padding:4px 9px;font-size:11px;font-weight:700;color:rgba(255,255,255,0.65);}
.hud-time-badge{border-radius:9px;padding:4px 9px;font-size:11px;font-weight:800;border:1px solid;}
#mission-bar{width:100%;background:rgba(255,200,0,0.08);border:1px solid rgba(255,200,0,0.25);border-radius:7px;padding:3px 9px;font-size:10px;font-weight:700;color:#FFE082;display:none;}

/* ===== ゲームエリア ===== */
#game-area{flex:1;position:relative;overflow:hidden;touch-action:none;}
#iso-canvas{position:absolute;top:0;left:0;touch-action:none;}

/* ===== 下部パネル ===== */
#bottom-panel{flex-shrink:0;background:linear-gradient(180deg,rgba(5,10,25,0.98),rgba(3,7,18,0.99));border-top:1px solid rgba(100,160,255,0.15);}
#cat-tabs{display:flex;overflow-x:auto;padding:5px 6px 0;gap:3px;scrollbar-width:none;}
#cat-tabs::-webkit-scrollbar{display:none;}
.cat-tab{flex-shrink:0;padding:5px 11px;border-radius:8px 8px 0 0;border:1px solid rgba(255,255,255,0.08);border-bottom:none;background:rgba(255,255,255,0.03);color:rgba(255,255,255,0.45);font-size:11px;font-weight:800;cursor:pointer;font-family:inherit;white-space:nowrap;}
.cat-tab.active{background:rgba(100,160,255,0.12);color:#90CAF9;border-color:rgba(100,160,255,0.25);}
#item-scroll{display:flex;gap:5px;padding:6px 8px 8px;overflow-x:auto;scrollbar-width:none;}
#item-scroll::-webkit-scrollbar{display:none;}
.item-btn{flex-shrink:0;width:66px;display:flex;flex-direction:column;align-items:center;gap:2px;background:rgba(255,255,255,0.05);border:1.5px solid rgba(255,255,255,0.08);border-radius:12px;padding:7px 3px 5px;cursor:pointer;font-family:inherit;color:white;position:relative;transition:all 0.15s;}
.item-btn:active{transform:scale(0.92);}
.item-btn.active-tool{background:rgba(255,215,0,0.15);border-color:#FFD700;box-shadow:0 0 10px rgba(255,215,0,0.25);}
.item-emoji{font-size:26px;line-height:1;filter:drop-shadow(0 2px 4px rgba(0,0,0,0.5));}
.item-name{font-size:9px;font-weight:700;text-align:center;line-height:1.2;opacity:0.85;}
.item-cost{font-size:9px;font-weight:900;color:#FFD700;background:rgba(0,0,0,0.4);border-radius:5px;padding:1px 4px;}
.item-locked{position:absolute;inset:0;border-radius:11px;background:rgba(0,0,0,0.6);display:flex;align-items:center;justify-content:center;font-size:16px;}

/* オーバーレイ共通 */
.modal-bg{position:fixed;inset:0;z-index:150;background:rgba(0,0,0,0.65);display:none;}
#mission-panel{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);z-index:200;background:linear-gradient(160deg,#0a1428,#162040);border:1.5px solid rgba(255,215,0,0.35);border-radius:18px;padding:18px;width:300px;max-width:90%;max-height:80vh;overflow-y:auto;display:none;}
.mission-item{display:flex;align-items:center;gap:9px;background:rgba(255,255,255,0.04);border-radius:9px;padding:7px 10px;margin-bottom:5px;}
.mission-check{width:20px;height:20px;border-radius:50%;border:2px solid rgba(255,215,0,0.4);display:flex;align-items:center;justify-content:center;font-size:11px;flex-shrink:0;}
.mission-check.done{background:#FFD700;border-color:#FFD700;color:#000;}
.mission-prog-bar{height:3px;background:rgba(255,255,255,0.08);border-radius:2px;margin-top:3px;overflow:hidden;}
.mission-prog-fill{height:100%;background:#FFD700;border-radius:2px;transition:width 0.3s;}

/* トースト・ポップアップ */
#toast{position:fixed;bottom:76px;left:50%;transform:translateX(-50%);background:linear-gradient(135deg,#1a3060,#0d1a3a);border:1px solid rgba(100,160,255,0.35);border-radius:18px;padding:7px 18px;font-size:12px;font-weight:800;color:white;z-index:300;opacity:0;transition:opacity 0.3s;white-space:nowrap;pointer-events:none;}
#toast.show{opacity:1;}
@keyframes coinPop{0%{transform:translateY(0);opacity:1;}100%{transform:translateY(-45px);opacity:0;}}
.coin-pop{position:fixed;font-size:14px;font-weight:900;pointer-events:none;z-index:500;animation:coinPop 0.65s ease-out forwards;}
@keyframes citizenBob{0%{transform:translate(-50%,-50%) translateY(0);}100%{transform:translate(-50%,-50%) translateY(-4px);}}
@keyframes shimmer{0%{background-position:0%}100%{background-position:200%}}
#mission-clear-popup{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);z-index:400;background:linear-gradient(135deg,#1a3060,#0d1a3a);border:2px solid #FFD700;border-radius:18px;padding:18px 24px;text-align:center;display:none;box-shadow:0 0 40px rgba(255,215,0,0.3);}
@keyframes placeAnim{0%{transform:scale(0.3);opacity:0;}60%{transform:scale(1.2);}100%{transform:scale(1);opacity:1;}}


#common-bgm-btn{
  position:fixed;
  top:max(10px,var(--sat,env(safe-area-inset-top,0px)));
  right:10px;z-index:1000;
  background:rgba(0,0,0,0.45);
  border:1.5px solid rgba(255,255,255,0.35);
  border-radius:50%;width:40px;height:40px;
  font-size:18px;cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  color:white;
}

/* === safe-area & common buttons === */
:root {
  --sat: env(safe-area-inset-top, 0px);
  --sab: env(safe-area-inset-bottom, 0px);
}
#ui-bgm-btn {
  width: 40px; height: 40px;
  background: rgba(0,0,0,0.5);
  border: 1.5px solid rgba(255,255,255,0.4);
  border-radius: 50%;
  font-size: 20px;
  cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  touch-action: manipulation;
  -webkit-tap-highlight-color: transparent;
  flex-shrink: 0;
}

/* === 横向き対応 === */
@media (orientation: landscape) {
  body { overflow-y: auto; }
}
@media (orientation: landscape) and (max-height: 500px) {
  /* 横向き時にゲームエリアを縮小・スクロール対応 */
  canvas { max-height: 100vh; }
  #game-area { overflow-y: auto; }
}
</style>
<script src="/games/wakuwaku_bgm.js"></script>

const MISSIONS=[

// カメラ

const TIME_PHASES=[

];
const WEATHERS=['☀️ はれ','🌤️ くもり','🌧️ あめ','❄️ ゆき'];
let timeIdx=1, weatherIdx=0;
// 住民
const CITIZEN_EMOJIS=['👦','👧','👨','👩','🧓','🧑'];
let citizens=[];

// アニメ
let placedAnim={}; // {key: t}  0→1でアニメ
let animFrame=null;
// 雨雪パーティクル
let particles=[];

// canvas
const canvas=document.getElementById('iso-canvas');
const ctx=canvas.getContext('2d');

// ===== 初期化 =====
function init(){

  buildCatTabs();
  buildItemPanel();

  const area=document.getElementById('game-area');
  canvas.width=area.clientWidth;
  canvas.height=area.clientHeight;

window.addEventListener('resize',()=>{resizeCanvas();});

// ===== セーブ・ロード =====
function saveState(){
  try{
    localStorage.setItem('machi_v3_grid',JSON.stringify(grid));
    localStorage.setItem('machi_v3_coins',coins);
    localStorage.setItem('machi_v3_mp',JSON.stringify(missionProgress));
  }catch(e){}
}
function loadState(){
  try{
    const g=localStorage.getItem('machi_v3_grid');
    if(g)grid=JSON.parse(g);
    const c=localStorage.getItem('machi_v3_coins');
    if(c!==null)coins=parseInt(c);
    const mp=localStorage.getItem('machi_v3_mp');
    if(mp)missionProgress=JSON.parse(mp);
  }catch(e){}
  // population再計算
  population=0;
  for(let y=0;y<GRID;y++)for(let x=0;x<GRID;x++){
    const item=findItem(grid[y][x]);
    if(item)population+=item.pop;
  }
}
function findItem(id){
  if(!id)return null;
  for(const cat of Object.values(ITEMS)){
    const item=cat.find(i=>i.id===id);
    if(item)return item;
  }
  return null;
}

// ワールドオフセット（drawScene・updateEmojiLayer・screenToIso共通）
function getWorldOffset(){
  return {
    cx: canvas.width/2/camScale,
    cy: canvas.height*0.35/camScale
  };
}
// グリッド(gx,gy) → スクリーン座標（ワールド原点基準）
function isoToScreen(gx,gy){
  const x=(gx-gy)*TW/2;
  const y=(gx+gy)*TH/2;
  return {x,y};
}
// drawScene内での実際の描画座標（ワールドオフセット込み）
// ※ ctx.save/translate済みの中で使う用
function isoToScreen2(gx,gy){
  return isoToScreen(gx,gy);
}
// スクリーン → グリッド（逆変換）
function screenToIso(sx,sy){
  const {cx,cy}=getWorldOffset();
  const wx=(sx-camX)/camScale;
  const wy=(sy-camY)/camScale;
  const lx=wx-cx;
  const ly=wy-cy;
  const gx=(lx/(TW/2)+ly/(TH/2))/2;
  const gy=(ly/(TH/2)-lx/(TW/2))/2;
  return {x:Math.floor(gx), y:Math.floor(gy)};
}

// ===== 描画 =====
function drawScene(){
  const W=canvas.width, H=canvas.height;
  ctx.clearRect(0,0,W,H);

  // 背景グラデーション
  const phase=TIME_PHASES[timeIdx];
  const bg=ctx.createLinearGradient(0,0,0,H);
  bg.addColorStop(0,phase.skyTop);
  bg.addColorStop(1,phase.skyBot);
  ctx.fillStyle=bg;
  ctx.fillRect(0,0,W,H);

  // 星（夜・朝）
  if(timeIdx===3||timeIdx===0){
    ctx.fillStyle='rgba(255,255,255,0.7)';
    for(let i=0;i<40;i++){
      const sx=((i*137+31)%W);
      const sy=((i*97+17)%(H*0.6));
      const r=(i%3===0)?1.2:0.7;
      ctx.beginPath();ctx.arc(sx,sy,r,0,Math.PI*2);ctx.fill();
    }
  }

  // 月（夜）
  if(timeIdx===3){
    ctx.save();
    const mg=ctx.createRadialGradient(W*0.8,H*0.12,0,W*0.8,H*0.12,30);
    mg.addColorStop(0,'#FFF9C4');mg.addColorStop(1,'rgba(255,240,150,0)');
    ctx.fillStyle=mg;ctx.fillRect(W*0.7,0,W*0.3,H*0.3);
    ctx.fillStyle='#FFF176';ctx.beginPath();ctx.arc(W*0.8,H*0.12,18,0,Math.PI*2);ctx.fill();
    ctx.restore();
  }
  // 太陽（昼・朝）
  if(timeIdx===1||timeIdx===0){
    const sx=timeIdx===1?W*0.8:W*0.2;
    const sy=timeIdx===1?H*0.08:H*0.15;
    ctx.save();
    const sg=ctx.createRadialGradient(sx,sy,0,sx,sy,40);
    sg.addColorStop(0,'rgba(255,235,100,0.5)');sg.addColorStop(1,'rgba(255,200,0,0)');
    ctx.fillStyle=sg;ctx.fillRect(sx-40,sy-40,80,80);
    ctx.fillStyle=timeIdx===1?'#FFD600':'#FF8F00';
    ctx.beginPath();ctx.arc(sx,sy,18,0,Math.PI*2);ctx.fill();
    ctx.restore();
  }

  ctx.save();
  ctx.translate(camX,camY);
  ctx.scale(camScale,camScale);
  const {cx,cy}=getWorldOffset();
  ctx.translate(cx,cy);

  const amb=phase.ambient;

  // タイル描画（奥から手前 y+x でソート）
  for(let sum=0;sum<GRID*2-1;sum++){
    for(let gx=0;gx<GRID;gx++){
      const gy=sum-gx;
      if(gy<0||gy>=GRID)continue;
      drawTile(gx,gy,amb);
    }
  }

  // 住民・建物絵文字はDOMレイヤーで描画
  updateEmojiLayer();

  // 天気パーティクル
  ctx.restore();
  drawParticles();
}

function drawTile(gx,gy,amb){
  const {x,y}=isoToScreen(gx,gy);
  const isHover=(hoverX===gx&&hoverY===gy);
  const itemId=grid[gy][gx];
  const item=findItem(itemId);
  const isBuilding=!!item;
  const animKey=`${gx},${gy}`;
  const animT=placedAnim[animKey]??1;

  // タイルの4頂点（ひし形）
  const hw=TW/2, hh=TH/2;
  // 上面の色
  let topColor;
  if(itemId==='road1'||itemId==='highway'){
    topColor=isHover?'#757575':'#555';
  } else if(itemId==='lake'){
    topColor=isHover?'#1976D2':'#1565C0';
  } else {
    // 草地（市松模様）
    const check=(gx+gy)%2===0;
    topColor=isHover?(check?'#4CAF50':'#45a045'):(check?'#2E7D32':'#276327');
  }

  // 影（建物がある場合）
  if(isBuilding){
    ctx.save();
    ctx.globalAlpha=0.25*amb;
    ctx.fillStyle='#000';
    ctx.beginPath();
    ctx.ellipse(x,y+hh*0.6,hw*0.8,hh*0.4,0,0,Math.PI*2);
    ctx.fill();
    ctx.restore();
  }

  // 上面（ひし形）
  ctx.save();
  ctx.globalAlpha=amb;
  ctx.beginPath();
  ctx.moveTo(x,y-hh);
  ctx.lineTo(x+hw,y);
  ctx.lineTo(x,y+hh);
  ctx.lineTo(x-hw,y);
  ctx.closePath();

  if(isHover&&!isBuilding&&selectedTool){
    // ホバーハイライト
    const item2=findItem(selectedTool);
    if(item2){
      const hg=ctx.createLinearGradient(x-hw,y-hh,x+hw,y+hh);
      hg.addColorStop(0,item2.color+'cc');
      hg.addColorStop(1,item2.color+'66');
      ctx.fillStyle=hg;
    } else {
      ctx.fillStyle='rgba(255,215,0,0.4)';
    }
  } else {
    ctx.fillStyle=topColor;
  }
  ctx.fill();
  // タイル境界線（薄め）
  ctx.strokeStyle='rgba(0,0,0,0.2)';ctx.lineWidth=0.5;ctx.stroke();
  ctx.restore();

  // 建物の壁（左・右）
  if(isBuilding&&itemId!=='tree1'&&itemId!=='tree2'&&itemId!=='flower'&&itemId!=='mount'&&itemId!=='rainbow'&&itemId!=='lake'){
    const wallH=WALL_H*(item.pop>5?1.6:item.pop>2?1.2:1)*animT;
    const lc=hexToRgb(item.color);
    // 左壁（グラデーション）
    ctx.save();ctx.globalAlpha=amb;
    ctx.beginPath();
    ctx.moveTo(x-hw,y);ctx.lineTo(x,y+hh);
    ctx.lineTo(x,y+hh+wallH);ctx.lineTo(x-hw,y+wallH);
    ctx.closePath();
    const lgL=ctx.createLinearGradient(x-hw,y,x,y+hh);
    lgL.addColorStop(0,`rgba(${Math.round(lc.r*0.55)},${Math.round(lc.g*0.55)},${Math.round(lc.b*0.55)},1)`);
    lgL.addColorStop(1,`rgba(${Math.round(lc.r*0.45)},${Math.round(lc.g*0.45)},${Math.round(lc.b*0.45)},1)`);
    ctx.fillStyle=lgL;ctx.fill();
    // ハイライトライン（左壁上端）
    ctx.strokeStyle='rgba(255,255,255,0.12)';ctx.lineWidth=1;
    ctx.beginPath();ctx.moveTo(x-hw,y);ctx.lineTo(x,y+hh);ctx.stroke();
    ctx.strokeStyle='rgba(0,0,0,0.28)';ctx.lineWidth=0.5;ctx.stroke();
    ctx.restore();
    // 右壁（グラデーション）
    ctx.save();ctx.globalAlpha=amb;
    ctx.beginPath();
    ctx.moveTo(x,y+hh);ctx.lineTo(x+hw,y);
    ctx.lineTo(x+hw,y+wallH);ctx.lineTo(x,y+hh+wallH);
    ctx.closePath();
    const lgR=ctx.createLinearGradient(x,y+hh,x+hw,y);
    lgR.addColorStop(0,`rgba(${Math.round(lc.r*0.38)},${Math.round(lc.g*0.38)},${Math.round(lc.b*0.38)},1)`);
    lgR.addColorStop(1,`rgba(${Math.round(lc.r*0.32)},${Math.round(lc.g*0.32)},${Math.round(lc.b*0.32)},1)`);
    ctx.fillStyle=lgR;ctx.fill();
    ctx.strokeStyle='rgba(0,0,0,0.28)';ctx.lineWidth=0.5;ctx.stroke();
    ctx.restore();
    // 上面（グラデーション）
    ctx.save();ctx.globalAlpha=amb;
    ctx.beginPath();
    ctx.moveTo(x,y-hh-wallH*animT);
    ctx.lineTo(x+hw,y-wallH*animT);
    ctx.lineTo(x,y+hh-wallH*animT);
    ctx.lineTo(x-hw,y-wallH*animT);
    ctx.closePath();
    const tg=ctx.createLinearGradient(x-hw,y-wallH,x+hw,y-wallH);
    tg.addColorStop(0,`rgba(${Math.min(255,Math.round(lc.r*1.15))},${Math.min(255,Math.round(lc.g*1.15))},${Math.min(255,Math.round(lc.b*1.15))},1)`);
    tg.addColorStop(1,`rgba(${lc.r},${lc.g},${lc.b},1)`);
    ctx.fillStyle=tg;ctx.fill();
    // 上面エッジハイライト
    ctx.strokeStyle='rgba(255,255,255,0.2)';ctx.lineWidth=1;
    ctx.beginPath();ctx.moveTo(x,y-hh-wallH*animT);ctx.lineTo(x+hw,y-wallH*animT);ctx.stroke();
    ctx.strokeStyle='rgba(0,0,0,0.18)';ctx.lineWidth=0.5;ctx.stroke();
    ctx.restore();
    // 詳細描画（窓・日よけ等）
    drawBuildingDetails(x,y,hw,hh,wallH,itemId,animT,amb);
  }
  // 特殊建物（樹木・自然系）
  if(isBuilding&&(itemId==='tree1'||itemId==='tree2')){
    drawTree(x,y,hw,hh,itemId,animT,amb);
  } else if(isBuilding&&itemId==='flower'){
    drawFlower(x,y,hw,hh,animT,amb);
  } else if(isBuilding&&itemId==='rainbow'){
    drawRainbow(x,y,hw,hh,animT,amb);
  } else if(isBuilding&&itemId==='mount'){
    drawMount(x,y,hw,hh,animT,amb);
  }

  // 絵文字（建物）→ DOMレイヤーで描画
  // ※ drawTile内では描画しない（updateEmojiLayer()で一括処理）
}

// ===== DOMの絵文字レイヤー更新 =====
function updateEmojiLayer(){
  const layer=document.getElementById('emoji-layer');
  layer.innerHTML='';
  const phase=TIME_PHASES[timeIdx];
  const amb=phase.ambient;
  const {cx,cy}=getWorldOffset();

  // 建物絵文字
  for(let sum=0;sum<GRID*2-1;sum++){
    for(let gx2=0;gx2<GRID;gx2++){
      const gy2=sum-gx2;
      if(gy2<0||gy2>=GRID)continue;
      const itemId=grid[gy2][gx2];
      if(!itemId)continue;
      const item=findItem(itemId);
      if(!item)continue;
      const {x,y}=isoToScreen(gx2,gy2);
      const animKey=`${gx2},${gy2}`;
      const animT=placedAnim[animKey]??1;
      const wallH2=WALL_H*(item.pop>5?1.6:item.pop>2?1.2:1)*animT;
      const emojiSize=Math.round(TH*(item.pop>10?1.4:item.pop>4?1.1:0.9)*camScale);
      // ワールド→スクリーン変換
      const sx=(x+cx)*camScale+camX;
      const sy=(y+cy-wallH2)*camScale+camY;
      const el=document.createElement('div');
      el.style.cssText=`
        position:absolute;
        left:${sx}px;top:${sy}px;
        font-size:${emojiSize}px;
        line-height:1;
        transform:translate(-50%,-50%) scale(${animT});
        opacity:${amb};
        pointer-events:none;
        transition:transform 0.1s;
        z-index:${sum+1};
      `;
      el.textContent=item.emoji;
      layer.appendChild(el);
    }
  }

  // 住民
  citizens.forEach((c,i)=>{
    const {x,y}=isoToScreen(c.gx,c.gy);
    const sx=(x+cx)*camScale+camX;
    const sy=(y+cy-TH*0.3)*camScale+camY;
    const sz=Math.round(TH*0.85*camScale);
    const el=document.createElement('div');
    el.style.cssText=`
      position:absolute;
      left:${sx}px;top:${sy}px;
      font-size:${sz}px;
      line-height:1;
      transform:translate(-50%,-50%);
      opacity:${amb*0.95};
      pointer-events:none;
      animation:citizenBob 1s ease-in-out ${i*0.3}s infinite alternate;
      z-index:${Math.round(c.gx+c.gy)+1};
      filter:drop-shadow(0 2px 3px rgba(0,0,0,0.4));
    `;
    el.textContent=c.emoji;
    layer.appendChild(el);
  });
}

function hexToRgb(hex){
  const r=parseInt(hex.slice(1,3),16)||100;
  const g=parseInt(hex.slice(3,5),16)||100;
  const b=parseInt(hex.slice(5,7),16)||100;
  return {r,g,b};
}

// ===== 描画ヘルパー =====
// 左壁面の (u,v)∈[0,1]² の座標
function lwPt(x,y,hw,hh,wh,u,v){return{x:x-hw+u*hw,y:y+u*hh+v*wh};}
// 右壁面の (u,v)∈[0,1]² の座標
function rwPt(x,y,hw,hh,wh,u,v){return{x:x+u*hw,y:y+hh*(1-u)+v*wh};}

function winL(x,y,hw,hh,wh,u,v,du,dv,col){
  if(wh<4)return;
  const a=lwPt(x,y,hw,hh,wh,u,v),b=lwPt(x,y,hw,hh,wh,u+du,v);
  const c=lwPt(x,y,hw,hh,wh,u+du,v+dv),d=lwPt(x,y,hw,hh,wh,u,v+dv);
  ctx.beginPath();
  ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y);ctx.lineTo(c.x,c.y);ctx.lineTo(d.x,d.y);
  ctx.closePath();ctx.fillStyle=col;ctx.fill();
  ctx.strokeStyle='rgba(0,0,0,0.1)';ctx.lineWidth=0.3;ctx.stroke();
}
function winR(x,y,hw,hh,wh,u,v,du,dv,col){
  if(wh<4)return;
  const a=rwPt(x,y,hw,hh,wh,u,v),b=rwPt(x,y,hw,hh,wh,u+du,v);
  const c=rwPt(x,y,hw,hh,wh,u+du,v+dv),d=rwPt(x,y,hw,hh,wh,u,v+dv);
  ctx.beginPath();
  ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y);ctx.lineTo(c.x,c.y);ctx.lineTo(d.x,d.y);
  ctx.closePath();ctx.fillStyle=col;ctx.fill();
  ctx.strokeStyle='rgba(0,0,0,0.1)';ctx.lineWidth=0.3;ctx.stroke();
}

function drawTree(x,y,hw,hh,itemId,animT,amb){
  ctx.save();ctx.globalAlpha=amb;
  const cherry=itemId==='tree2';
  const h=WALL_H*1.45*animT;
  // 幹
  ctx.fillStyle='#6D4C41';
  ctx.beginPath();
  ctx.moveTo(x-4,y+hh*0.15);ctx.lineTo(x+4,y+hh*0.1);
  ctx.lineTo(x+4,y+hh*0.1+h*0.55);ctx.lineTo(x-4,y+hh*0.15+h*0.55);
  ctx.closePath();ctx.fill();
  // 葉（3層）
  const fy=y-h*0.28;
  const r0=hw*0.62*animT;
  ctx.fillStyle=cherry?'#AD1457':'#1B5E20';
  ctx.beginPath();ctx.arc(x,fy,r0,0,Math.PI*2);ctx.fill();
  ctx.fillStyle=cherry?'#E91E63':'#2E7D32';
  ctx.beginPath();ctx.arc(x-r0*0.28,fy-r0*0.45,r0*0.74,0,Math.PI*2);ctx.fill();
  ctx.fillStyle=cherry?'#F48FB1':'#66BB6A';
  ctx.beginPath();ctx.arc(x+r0*0.12,fy-r0*0.82,r0*0.5,0,Math.PI*2);ctx.fill();
  // 花びら（桜のみ）
  if(cherry){
    ctx.fillStyle='rgba(255,255,255,0.55)';
    for(let i=0;i<6;i++){
      const a=i*Math.PI/3;
      ctx.beginPath();ctx.arc(x+Math.cos(a)*r0*0.5,fy+Math.sin(a)*r0*0.3,2.5,0,Math.PI*2);ctx.fill();
    }
  }
  ctx.restore();
}

function drawFlower(x,y,hw,hh,animT,amb){
  ctx.save();ctx.globalAlpha=amb*animT;
  const cols=['#E91E63','#FF5722','#FF9800','#9C27B0','#F44336'];
  for(let i=0;i<5;i++){
    const a=i*Math.PI*2/5-Math.PI/2;
    ctx.fillStyle=cols[i];
    ctx.beginPath();ctx.arc(x+Math.cos(a)*hw*0.3,y+Math.sin(a)*hh*0.6,3.5,0,Math.PI*2);ctx.fill();
  }
  ctx.fillStyle='#FFEE58';ctx.beginPath();ctx.arc(x,y,3,0,Math.PI*2);ctx.fill();
  ctx.restore();
}

function drawRainbow(x,y,hw,hh,animT,amb){
  ctx.save();ctx.globalAlpha=amb*0.9*animT;
  const cols=['#F44336','#FF9800','#FFEB3B','#4CAF50','#2196F3','#7B1FA2'];
  const by=y+hh*0.55;
  cols.forEach((c,i)=>{
    ctx.strokeStyle=c;ctx.lineWidth=3;
    ctx.beginPath();ctx.arc(x,by,hw*(0.92-i*0.13),Math.PI,0);ctx.stroke();
  });
  ctx.restore();
}

function drawMount(x,y,hw,hh,animT,amb){
  ctx.save();ctx.globalAlpha=amb;
  const h=WALL_H*2.6*animT;
  // 山体
  const mg=ctx.createLinearGradient(x,y-h,x,y+hh);
  mg.addColorStop(0,'#78909C');mg.addColorStop(0.6,'#607D8B');mg.addColorStop(1,'#546E7A');
  ctx.fillStyle=mg;
  ctx.beginPath();ctx.moveTo(x-hw,y+hh);ctx.lineTo(x+hw,y+hh);ctx.lineTo(x,y-h);ctx.closePath();ctx.fill();
  // 雪帽子
  ctx.fillStyle='rgba(245,245,255,0.88)';
  ctx.beginPath();ctx.moveTo(x-hw*0.22,y-h*0.62);ctx.lineTo(x+hw*0.22,y-h*0.62);ctx.lineTo(x,y-h);ctx.closePath();ctx.fill();
  ctx.restore();
}

function drawBuildingDetails(x,y,hw,hh,wallH,itemId,animT,amb){
  if(wallH<5)return;
  const isNight=timeIdx===3,isDawn=timeIdx===0,isSunset=timeIdx===2;
  const lit=isNight||isDawn;
  const wc=lit?'rgba(255,215,55,0.95)':'rgba(200,230,255,0.52)';
  const gc=lit?'rgba(150,255,190,0.75)':'rgba(140,215,255,0.55)'; // ガラス

  ctx.save();ctx.globalAlpha=amb;

  if(itemId==='house1'){
    winL(x,y,hw,hh,wallH,0.14,0.18,0.32,0.42,wc);
    winR(x,y,hw,hh,wallH,0.54,0.18,0.32,0.42,wc);
    winR(x,y,hw,hh,wallH,0.22,0.62,0.3,0.36,'rgba(100,55,10,0.75)'); // ドア
  } else if(itemId==='house2'){
    winL(x,y,hw,hh,wallH,0.09,0.14,0.3,0.38,wc);
    winL(x,y,hw,hh,wallH,0.61,0.14,0.3,0.38,wc);
    winR(x,y,hw,hh,wallH,0.09,0.14,0.3,0.38,wc);
    winR(x,y,hw,hh,wallH,0.61,0.14,0.3,0.38,wc);
  } else if(itemId==='house3'){
    for(let i=0;i<3;i++){
      winL(x,y,hw,hh,wallH,0.06+i*0.3,0.12,0.22,0.32,wc);
      winR(x,y,hw,hh,wallH,0.06+i*0.3,0.12,0.22,0.32,wc);
    }
  } else if(itemId==='apt1'){
    for(let r=0;r<2;r++) for(let c=0;c<2;c++){
      winL(x,y,hw,hh,wallH,0.11+c*0.46,0.1+r*0.44,0.28,0.3,wc);
      winR(x,y,hw,hh,wallH,0.11+c*0.46,0.1+r*0.44,0.28,0.3,wc);
    }
  } else if(itemId==='apt2'){
    for(let r=0;r<3;r++) for(let c=0;c<2;c++){
      winL(x,y,hw,hh,wallH,0.1+c*0.46,0.06+r*0.3,0.26,0.22,wc);
      winR(x,y,hw,hh,wallH,0.1+c*0.46,0.06+r*0.3,0.26,0.22,wc);
    }
    // 屋上給水塔
    if(animT>0.8){
      ctx.save();ctx.globalAlpha=amb*0.85;
      ctx.fillStyle='#78909C';
      ctx.beginPath();ctx.arc(x+hw*0.2,y-wallH-hh*0.35,hw*0.15,0,Math.PI*2);ctx.fill();
      ctx.strokeStyle='#546E7A';ctx.lineWidth=1;
      ctx.beginPath();ctx.moveTo(x+hw*0.2,y-wallH-hh*0.5);ctx.lineTo(x+hw*0.2,y-wallH-hh*0.35+hw*0.15);ctx.stroke();
      ctx.restore();
    }
  } else if(itemId==='castle'){
    winL(x,y,hw,hh,wallH,0.11,0.09,0.24,0.3,wc);
    winL(x,y,hw,hh,wallH,0.65,0.09,0.24,0.3,wc);
    winR(x,y,hw,hh,wallH,0.11,0.09,0.24,0.3,wc);
    winR(x,y,hw,hh,wallH,0.65,0.09,0.24,0.3,wc);
    // 城壁の鋸歯
    ctx.strokeStyle='rgba(0,0,0,0.35)';ctx.lineWidth=2;
    for(let i=0;i<4;i++){
      const u=0.1+i*0.22;
      const p1=lwPt(x,y,hw,hh,wallH,u,0);
      const p2=lwPt(x,y,hw,hh,wallH,u+0.12,0);
      ctx.strokeStyle='rgba(0,0,0,0.3)';ctx.lineWidth=1.5;
      ctx.beginPath();
      ctx.moveTo(p1.x,p1.y);ctx.lineTo(p1.x,p1.y-6);
      ctx.lineTo(p2.x,p2.y-6);ctx.lineTo(p2.x,p2.y);ctx.stroke();
    }
    // 旗
    if(animT>0.8){
      ctx.save();ctx.globalAlpha=amb;
      const fx=x,fy=y-wallH-hh-6;
      ctx.strokeStyle='#8D6E63';ctx.lineWidth=1.5;
      ctx.beginPath();ctx.moveTo(fx,fy);ctx.lineTo(fx,fy+12);ctx.stroke();
      ctx.fillStyle='#EF5350';
      ctx.beginPath();ctx.moveTo(fx,fy);ctx.lineTo(fx+9,fy+3.5);ctx.lineTo(fx,fy+7);ctx.closePath();ctx.fill();

    const aw=awCol[itemId]||'#FF8A65';
    // 日よけ
    ctx.fillStyle=aw;ctx.globalAlpha=amb*0.88;
    const la0=lwPt(x,y,hw,hh,wallH,0,0),la1=lwPt(x,y,hw,hh,wallH,1,0);
    const la2=lwPt(x,y,hw,hh,wallH,1,0.13),la3=lwPt(x,y,hw,hh,wallH,0,0.13);
    ctx.beginPath();ctx.moveTo(la0.x,la0.y);ctx.lineTo(la1.x,la1.y);ctx.lineTo(la2.x,la2.y);ctx.lineTo(la3.x,la3.y);ctx.closePath();ctx.fill();

    const ra2=rwPt(x,y,hw,hh,wallH,1,0.13),ra3=rwPt(x,y,hw,hh,wallH,0,0.13);
    ctx.beginPath();ctx.moveTo(ra0.x,ra0.y);ctx.lineTo(ra1.x,ra1.y);ctx.lineTo(ra2.x,ra2.y);ctx.lineTo(ra3.x,ra3.y);ctx.closePath();ctx.fill();
    ctx.globalAlpha=amb;
    // ガラスウィンドウ
    winL(x,y,hw,hh,wallH,0.1,0.17,0.76,0.5,gc);
    winR(x,y,hw,hh,wallH,0.1,0.17,0.76,0.5,gc);
  } else if(itemId==='school'){
    winL(x,y,hw,hh,wallH,0.07,0.1,0.28,0.3,wc);
    winL(x,y,hw,hh,wallH,0.65,0.1,0.28,0.3,wc);
    winR(x,y,hw,hh,wallH,0.07,0.1,0.28,0.3,wc);
    winR(x,y,hw,hh,wallH,0.65,0.1,0.28,0.3,wc);
    // 国旗ポール
    if(animT>0.8){
      ctx.save();ctx.globalAlpha=amb;
      const px=x-hw*0.4,py=y-wallH-hh*0.6;
      ctx.strokeStyle='#9E9E9E';ctx.lineWidth=1.5;
      ctx.beginPath();ctx.moveTo(px,py-8);ctx.lineTo(px,py+8);ctx.stroke();
      ctx.fillStyle='#1565C0';
      ctx.fillRect(px,py-8,7,5);
      ctx.restore();
    }
  } else if(itemId==='hosp'){
    // 赤十字
    winL(x,y,hw,hh,wallH,0.32,0.08,0.36,0.42,'rgba(220,0,0,0.82)');
    winR(x,y,hw,hh,wallH,0.32,0.08,0.36,0.42,'rgba(220,0,0,0.82)');
    winL(x,y,hw,hh,wallH,0.41,0.14,0.18,0.3,'rgba(255,255,255,0.9)');
    winR(x,y,hw,hh,wallH,0.41,0.14,0.18,0.3,'rgba(255,255,255,0.9)');
    winL(x,y,hw,hh,wallH,0.33,0.24,0.34,0.1,'rgba(255,255,255,0.9)');
    winR(x,y,hw,hh,wallH,0.33,0.24,0.34,0.1,'rgba(255,255,255,0.9)');
  } else if(itemId==='tower'){
    // 展望窓
    winL(x,y,hw,hh,wallH,0.28,0.14,0.44,0.22,gc);
    winR(x,y,hw,hh,wallH,0.28,0.14,0.44,0.22,gc);
    // 夜の点滅ライト
    if(isNight && Math.floor(Date.now()/600)%2===0){
      ctx.save();ctx.globalAlpha=0.92;
      ctx.fillStyle='#FF5252';
      ctx.beginPath();ctx.arc(x,y-wallH-hh*0.85,3.5,0,Math.PI*2);ctx.fill();
      const glw=ctx.createRadialGradient(x,y-wallH-hh*0.85,0,x,y-wallH-hh*0.85,10);
      glw.addColorStop(0,'rgba(255,82,82,0.4)');glw.addColorStop(1,'rgba(255,82,82,0)');
      ctx.fillStyle=glw;ctx.beginPath();ctx.arc(x,y-wallH-hh*0.85,10,0,Math.PI*2);ctx.fill();
      ctx.restore();
    }
  } else if(itemId==='windmill'){
    // 風車の羽
    if(animT>0.8){
      ctx.save();ctx.globalAlpha=amb*0.85;
      const cx2=x,cy2=y-wallH-hh*0.6;
      const rot=(Date.now()/1000)*0.8;
      ctx.strokeStyle='rgba(255,255,255,0.75)';ctx.lineWidth=3;
      for(let i=0;i<4;i++){
        const a=rot+i*Math.PI/2;
        ctx.beginPath();ctx.moveTo(cx2,cy2);ctx.lineTo(cx2+Math.cos(a)*hw*0.6,cy2+Math.sin(a)*hh*0.9);ctx.stroke();
      }
      ctx.fillStyle='rgba(255,255,255,0.6)';
      ctx.beginPath();ctx.arc(cx2,cy2,3,0,Math.PI*2);ctx.fill();
      ctx.restore();
    }
  } else if(itemId==='station'){
    winL(x,y,hw,hh,wallH,0.08,0.12,0.28,0.3,gc);
    winL(x,y,hw,hh,wallH,0.64,0.12,0.28,0.3,gc);
    winR(x,y,hw,hh,wallH,0.08,0.12,0.28,0.3,gc);
    winR(x,y,hw,hh,wallH,0.64,0.12,0.28,0.3,gc);
  } else if(lit && wallH>8){
    // 夜/朝：すべての建物に最低限の窓の灯り
    winL(x,y,hw,hh,wallH,0.18,0.18,0.3,0.38,wc);
    winR(x,y,hw,hh,wallH,0.18,0.18,0.3,0.38,wc);
  }

  // 夕焼け照り返し（全建物の上面）
  if(isSunset){
    const sp=lwPt(x,y,hw,hh,wallH,0,0);
    ctx.globalAlpha=amb*0.18;
    ctx.fillStyle='rgba(255,100,30,1)';
    ctx.beginPath();
    ctx.moveTo(x,y-hh-wallH);ctx.lineTo(x+hw,y-wallH);
    ctx.lineTo(x,y+hh-wallH);ctx.lineTo(x-hw,y-wallH);
    ctx.closePath();ctx.fill();
  }

  ctx.restore();
}

// 配置SE (Web Audio API)
let _seCtx=null;
function playSE(freq,dur){
  try{
    if(!_seCtx)_seCtx=new(window.AudioContext||window.webkitAudioContext)();
    const o=_seCtx.createOscillator(),g=_seCtx.createGain();
    o.connect(g);g.connect(_seCtx.destination);
    o.frequency.value=freq;o.type='sine';
    g.gain.setValueAtTime(0.22,_seCtx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001,_seCtx.currentTime+dur);
    o.start();o.stop(_seCtx.currentTime+dur);
  }catch(e){}
}

// ===== 雨雪パーティクル =====
function updateParticles(){
  if(weatherIdx===2){// 雨
    if(particles.length<60){
      particles.push({
        x:Math.random()*canvas.width,y:-10,
        vy:8+Math.random()*4,vx:1,
        len:12+Math.random()*8,life:1
      });
    }
  } else if(weatherIdx===3){// 雪
    if(particles.length<40){
      particles.push({
        x:Math.random()*canvas.width,y:-10,
        vy:1.5+Math.random()*1,vx:Math.sin(Date.now()/500)*0.5,
        size:3+Math.random()*4,life:1,snow:true
      });
    }
  } else {
    particles=[];return;
  }
  particles=particles.filter(p=>{
    p.y+=p.vy;p.x+=p.vx;
    return p.y<canvas.height+20;
  });
}

function drawParticles(){
  particles.forEach(p=>{
    ctx.save();ctx.globalAlpha=0.5;
    if(p.snow){
      ctx.fillStyle='rgba(200,230,255,0.8)';
      ctx.beginPath();ctx.arc(p.x,p.y,p.size/2,0,Math.PI*2);ctx.fill();
    } else {
      ctx.strokeStyle='rgba(150,200,255,0.6)';ctx.lineWidth=1.5;
      ctx.beginPath();ctx.moveTo(p.x,p.y);ctx.lineTo(p.x+p.vx*p.len/p.vy,p.y+p.len);ctx.stroke();
    }
    ctx.restore();
  });
}

// ===== アニメループ =====
function loop(){
  // 配置アニメ更新
  Object.keys(placedAnim).forEach(k=>{
    placedAnim[k]=Math.min(1,placedAnim[k]+0.08);
    if(placedAnim[k]>=1)delete placedAnim[k];
  });
  updateParticles();
  drawScene();
  animFrame=requestAnimationFrame(loop);
}

// ===== タイルクリック =====
function handleTap(clientX,clientY){
  if(hasDragged)return;
  const rect=canvas.getBoundingClientRect();
  const sx=clientX-rect.left, sy=clientY-rect.top;
  const {x:gx,y:gy}=screenToIso(sx,sy);
  if(gx<0||gx>=GRID||gy<0||gy>=GRID)return;
  if(!selectedTool)return;

  if(selectedTool==='erase'){
    if(grid[gy][gx]){
      const item=findItem(grid[gy][gx]);
      if(item){
        coins+=Math.floor(item.cost/2);
        population-=item.pop;
        grid[gy][gx]=null;
        removeCitizensNear(gx,gy);
        updateHUD();saveState();
        showToast(`🗑️ ${item.emoji} とりのぞいた！🪙+${Math.floor(item.cost/2)}`);
      }
    }
    return;
  }

  const item=findItem(selectedTool);
  if(!item)return;
  if(item.unlock&&coins<item.unlock){showToast(`🔒 🪙${item.unlock}まい たまると かいほう！`);return;}
  if(grid[gy][gx]){showToast('⚠️ もう なにか あるよ！');return;}
  if(coins<item.cost){showToast(`🪙 コインが たりない！（${item.cost}まい ひつよう）`);return;}

  coins-=item.cost;
  population+=item.pop;
  grid[gy][gx]=selectedTool;
  placedAnim[`${gx},${gy}`]=0;
  playSE(item.pop>5?660:item.pop>2?520:400, 0.18);
  updateHUD();saveState();
  updateMissionProgress(item);
  spawnCitizens(gx,gy,item);
  showCoinPop(-item.cost,clientX,clientY);
  if(item.pop>0)showToast(`👥+${item.pop} ${item.emoji} をたてた！`);
}

// ===== 住民 =====
function spawnCitizens(bx,by,item){
  if(item.pop===0)return;
  const n=Math.min(Math.ceil(item.pop/3),3);
  for(let i=0;i<n&&citizens.length<25;i++){
    citizens.push({
      gx:bx+(Math.random()-0.5),
      gy:by+(Math.random()-0.5),
      emoji:CITIZEN_EMOJIS[Math.floor(Math.random()*CITIZEN_EMOJIS.length)],
      homeX:bx,homeY:by,
    });
  }
}
function removeCitizensNear(bx,by){
  citizens=citizens.filter(c=>Math.abs(c.homeX-bx)+Math.abs(c.homeY-by)>1);
}
function moveCitizens(){
  citizens.forEach(c=>{
    c.gx+=( Math.random()-0.5)*0.6;
    c.gy+=(Math.random()-0.5)*0.6;
    c.gx=Math.max(0,Math.min(GRID-1,c.gx));
    c.gy=Math.max(0,Math.min(GRID-1,c.gy));
    // 徐々に家に戻る
    c.gx+=(c.homeX-c.gx)*0.03;
    c.gy+=(c.homeY-c.gy)*0.03;
  });
}

// ===== ミッション =====
function getMissionCount(m){
  if(m.type==='pop')return population;
  if(m.type==='build'){
    let cnt=0;
    for(let y=0;y<GRID;y++)for(let x=0;x<GRID;x++)
      if(grid[y][x]===m.target)cnt++;
    return cnt;
  }
  return 0;
}
function updateMissionProgress(placedItem){
  MISSIONS.forEach(m=>{
    if(missionProgress[m.id].done)return;
    const cnt=getMissionCount(m);
    if(cnt>=m.count){
      missionProgress[m.id].done=true;
      coins+=m.reward;
      updateHUD();saveState();
      document.getElementById('mission-clear-text').textContent=`${m.text}\n🪙+${m.reward} もらった！`;
      document.getElementById('mission-clear-popup').style.display='block';
    }
  });
  buildMissionList();
  updateMissionBar();
}
function buildMissionList(){
  const list=document.getElementById('mission-list');
  list.innerHTML='';
  MISSIONS.forEach(m=>{
    const done=missionProgress[m.id]?.done;
    const cnt=getMissionCount(m);
    const pct=Math.min(100,Math.round(cnt/m.count*100));
    const div=document.createElement('div');div.className='mission-item';
    div.innerHTML=`
      <div class="mission-check ${done?'done':''}">
        ${done?'✓':''}
      </div>
      <div style="flex:1;">
        <div style="font-size:11px;font-weight:700;color:${done?'rgba(255,255,255,0.35)':'white'};">${m.text}</div>
        <div style="font-size:10px;color:#FFD700;margin-top:1px;">${done?'クリア！🎉':`${cnt}/${m.count} 🪙+${m.reward}`}</div>
        <div class="mission-prog-bar"><div class="mission-prog-fill" style="width:${pct}%"></div></div>
      </div>`;
    list.appendChild(div);
  });
}
function updateMissionBar(){
  const bar=document.getElementById('mission-bar');
  const next=MISSIONS.find(m=>!missionProgress[m.id]?.done);
  if(next){
    const cnt=getMissionCount(next);
    bar.style.display='block';
    bar.textContent=`📋 ${next.text}（${cnt}/${next.count}）`;
  } else {
    bar.style.display='block';bar.textContent='🎊 ぜんぶ クリア！';
  }
}
function toggleMission(){
  const p=document.getElementById('mission-panel');
  const bg=document.getElementById('modal-bg');
  const open=p.style.display==='block';
  p.style.display=open?'none':'block';
  bg.style.display=open?'none':'block';
  if(!open)buildMissionList();
}
function closeMission(){
  document.getElementById('mission-panel').style.display='none';
  document.getElementById('modal-bg').style.display='none';
}

// ===== HUD =====
function updateHUD(){
  document.getElementById('hud-coin').textContent=`🪙 ${coins}`;
  document.getElementById('hud-pop').textContent=`👥 ${population}`;
  buildItemPanel();
  updateMissionBar();
}

// ===== 時刻・天気 =====
function startTimers(){
  setInterval(()=>{timeIdx=(timeIdx+1)%TIME_PHASES.length;updateTimeUI();},90000);
  setInterval(()=>{weatherIdx=Math.floor(Math.random()*WEATHERS.length);updateWeatherUI();},180000);
  setInterval(()=>{
    let inc=0;
    for(let y=0;y<GRID;y++)for(let x=0;x<GRID;x++){
      const item=findItem(grid[y][x]);
      if(item&&item.inc>0)inc+=item.inc;
    }
    if(inc>0){coins+=inc;updateHUD();saveState();showToast(`💰 じどうしゅうにゅう +${inc}🪙`);}
  },30000);
  setInterval(moveCitizens,2500);
}
function updateTimeUI(){
  const p=TIME_PHASES[timeIdx];
  const b=document.getElementById('hud-time');
  b.textContent=p.label;
  const colors={0:'#FF8A65',1:'#90CAF9',2:'#FF8A65',3:'#7986CB'};
  b.style.color=colors[timeIdx];b.style.borderColor=colors[timeIdx]+'66';b.style.background=colors[timeIdx]+'18';
}
function updateWeatherUI(){
  document.getElementById('hud-weather').textContent=WEATHERS[weatherIdx];
  particles=[];
}

// ===== カテゴリ・アイテムパネル =====
function buildCatTabs(){
  const row=document.getElementById('cat-tabs');row.innerHTML='';
  CATEGORIES.forEach(cat=>{
    const btn=document.createElement('button');
    btn.className='cat-tab'+(cat.id===selectedCat?' active':'');
    btn.textContent=cat.label;
    btn.onclick=()=>{selectedCat=cat.id;selectedTool=null;buildCatTabs();buildItemPanel();};
    row.appendChild(btn);
  });
}
function buildItemPanel(){
  const scroll=document.getElementById('item-scroll');scroll.innerHTML='';
  if(selectedCat==='erase'){
    const btn=document.createElement('button');
    btn.className='item-btn'+(selectedTool==='erase'?' active-tool':'');
    btn.innerHTML=`<div class="item-emoji">🗑️</div><div class="item-name">けしゴム</div>`;
    btn.onclick=()=>{selectedTool=selectedTool==='erase'?null:'erase';buildItemPanel();};
    scroll.appendChild(btn);return;
  }
  (ITEMS[selectedCat]||[]).forEach(item=>{
    const btn=document.createElement('button');
    const active=selectedTool===item.id;
    const locked=item.unlock&&coins<item.unlock;
    btn.className='item-btn'+(active?' active-tool':'');
    btn.style.borderColor=active?'#FFD700':`${item.color}44`;
    btn.style.background=active?`${item.color}22`:`${item.color}11`;
    btn.innerHTML=`
      <div class="item-emoji">${item.emoji}</div>
      <div class="item-name">${item.name}</div>
      <div class="item-cost">🪙${item.cost}</div>
      ${item.inc>0?`<div style="font-size:8px;color:#A5D6A7;font-weight:700;">+${item.inc}🪙</div>`:''}
      ${locked?'<div class="item-locked">🔒</div>':''}
    `;
    btn.onclick=()=>{
      if(locked){showToast(`🔒 🪙${item.unlock}まい ためると かいほう！`);return;}
      selectedTool=selectedTool===item.id?null:item.id;
      buildItemPanel();
    };
    scroll.appendChild(btn);
  });
}

// ===== 操作 =====
function setupControls(){
  // マウス
  canvas.addEventListener('mousemove',e=>{
    if(isDragging){
      const dx=e.clientX-dragStartX, dy=e.clientY-dragStartY;
      if(Math.abs(dx)>3||Math.abs(dy)>3)hasDragged=true;
      camX=camStartX+dx; camY=camStartY+dy;
    } else {
      const rect=canvas.getBoundingClientRect();
      const {x,y}=screenToIso(e.clientX-rect.left,e.clientY-rect.top);
      hoverX=x;hoverY=y;
    }
  });
  canvas.addEventListener('mousedown',e=>{
    isDragging=true;hasDragged=false;
    dragStartX=e.clientX;dragStartY=e.clientY;
    camStartX=camX;camStartY=camY;
  });
  window.addEventListener('mouseup',e=>{
    if(!hasDragged)handleTap(e.clientX,e.clientY);
    isDragging=false;
  });
  canvas.addEventListener('wheel',e=>{
    e.preventDefault();
    const d=e.deltaY>0?0.9:1.1;
    const rect=canvas.getBoundingClientRect();
    const mx=e.clientX-rect.left, my=e.clientY-rect.top;
    camX=(camX-mx)*d+mx; camY=(camY-my)*d+my;
    camScale=Math.max(0.3,Math.min(5,camScale*d));
  },{passive:false});

  // タッチ
  canvas.addEventListener('touchstart',e=>{
    e.preventDefault();
    if(e.touches.length===1){
      isDragging=true;hasDragged=false;
      dragStartX=e.touches[0].clientX;dragStartY=e.touches[0].clientY;
      camStartX=camX;camStartY=camY;
    } else if(e.touches.length===2){
      isDragging=false;
      lastPinchDist=Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY);
    }
  },{passive:false});
  canvas.addEventListener('touchmove',e=>{
    e.preventDefault();
    if(e.touches.length===1&&isDragging){
      const dx=e.touches[0].clientX-dragStartX, dy=e.touches[0].clientY-dragStartY;
      if(Math.abs(dx)>4||Math.abs(dy)>4)hasDragged=true;
      camX=camStartX+dx;camY=camStartY+dy;
    } else if(e.touches.length===2){
      const d=Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY);
      const cx=(e.touches[0].clientX+e.touches[1].clientX)/2;
      const cy=(e.touches[0].clientY+e.touches[1].clientY)/2;
      const rect=canvas.getBoundingClientRect();
      const mx=cx-rect.left,my=cy-rect.top;
      const scale=d/lastPinchDist;
      camX=(camX-mx)*scale+mx;camY=(camY-my)*scale+my;
      camScale=Math.max(0.3,Math.min(5,camScale*scale));
      lastPinchDist=d;hasDragged=true;
    }
  },{passive:false});
  canvas.addEventListener('touchend',e=>{
    if(e.changedTouches.length===1&&!hasDragged){
      handleTap(e.changedTouches[0].clientX,e.changedTouches[0].clientY);
    }
    if(e.touches.length===0)isDragging=false;
  });
}

function resetView(){
  const W=canvas.width, H=canvas.height;
  // グリッド全体がちょうど収まるスケール
  const worldW=GRID*TW; const worldH=GRID*TH;
  camScale=Math.min(W/worldW,H/worldH)*0.85;
  camX=W/2; camY=H*0.08;
}

function showToast(msg){
  const t=document.getElementById('toast');
  t.textContent=msg;t.classList.add('show');
  clearTimeout(showToast._t);
  showToast._t=setTimeout(()=>t.classList.remove('show'),2200);
}
function showCoinPop(amount,cx,cy){
  const el=document.createElement('div');
  el.className='coin-pop';
  el.textContent=amount>0?`+${amount}🪙`:`${amount}🪙`;
  el.style.left=(cx-16)+'px';el.style.top=(cy-20)+'px';
  el.style.color=amount>=0?'#A5D6A7':'#EF9A9A';
  document.body.appendChild(el);
  setTimeout(()=>el.remove(),700);
}

  _bgm = new WakuwakuBGM('building');
  const on = WakuwakuBGM.loadState();
  _bgm.setEnabled(on);
  if (on) _bgm.start();
  _syncBgmBtn();
}

function toggleCommonBGM() {
  if (!_bgm) { _startBGM(); return; }
  const on = _bgm.toggle();
  WakuwakuBGM.saveState(on);
  _syncBgmBtn();
}

function _syncBgmBtn() {
  const on = _bgm ? _bgm.enabled : WakuwakuBGM.loadState();
  const btns = document.querySelectorAll(
    '#bgm-btn,#ui-bgm-btn,#bgm-toggle,#sound-btn,.bgm-btn'
  );
  btns.forEach(b => { b.textContent = on ? '🔊' : '🔇'; });
}
