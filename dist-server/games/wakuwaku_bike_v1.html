<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>New わくわくバイク</title>
<style>
  :root{
    --sky1:#bdeaff; --sky2:#e9f8ff; --grass:#8fd66a; --grassDk:#6fc24c;
    --road:#9aa3ad; --roadLine:#fff; --accent:#ff7ab8; --accent2:#ffd34d;
    --ink:#3a2b3f; --panel:#fff;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;}
  html,body{margin:0;height:100%;overflow:hidden;font-family:"Hiragino Maru Gothic ProN","Yu Gothic",system-ui,sans-serif;background:#0b1230;}
  #wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;
    padding:var(--sat,env(safe-area-inset-top,0px)) var(--sar,env(safe-area-inset-right,0px)) var(--sab,env(safe-area-inset-bottom,0px)) var(--sal,env(safe-area-inset-left,0px));}
  canvas{display:block;background:linear-gradient(#bdeaff,#e9f8ff);touch-action:none;}

  /* overlays */
  .screen{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:14px;text-align:center;color:#fff;
    background:linear-gradient(160deg,#0d1a3a 0%,#1a2d5a 35%,#2a1040 70%,#1a0030 100%);
    padding:20px;overflow:hidden;}
  .screen::before{content:'';position:absolute;inset:0;pointer-events:none;
    background:radial-gradient(ellipse 90% 60% at 50% 10%,rgba(255,120,80,.15),transparent 70%),
               radial-gradient(ellipse 60% 40% at 80% 80%,rgba(80,160,255,.1),transparent 60%);}
  /* speed lines in background */
  @keyframes speedLine{0%{transform:translateX(0)}100%{transform:translateX(200%)}}
  .spline{position:absolute;left:-100%;height:2px;background:linear-gradient(90deg,transparent,rgba(255,200,0,.4),transparent);
    animation:speedLine var(--d,1.2s) linear infinite;animation-delay:var(--dl,0s);pointer-events:none;}
  @keyframes bikeFloat{0%,100%{transform:translateY(0) rotate(-2deg)}50%{transform:translateY(-10px) rotate(2deg)}}
  .bike-hero{font-size:clamp(54px,16vw,80px);animation:bikeFloat 2s ease-in-out infinite;
    filter:drop-shadow(0 8px 20px rgba(255,120,0,.5));position:relative;z-index:1;}
  @keyframes flagWave{0%,100%{transform:rotate(-5deg)}50%{transform:rotate(5deg)}}
  .flag-deco{display:flex;gap:8px;align-items:center;position:relative;z-index:1;}
  .flag-deco span{font-size:24px;animation:flagWave var(--d,1s) ease-in-out infinite;animation-delay:var(--dl,0s);}
  /* override text colors for dark bg */
  .sub{color:rgba(255,255,255,.85)!important;}
  h1{color:#FFD700!important;text-shadow:2px 2px 0 #FF6D00,0 0 30px rgba(255,200,0,.6),4px 4px 0 #8B4500!important;}
  .hidden{display:none!important;}
  h1{font-size:clamp(26px,7vw,46px);margin:0;color:#ff5fa2;text-shadow:2px 2px 0 #fff,4px 4px 0 #ffd34d;}
  .sub{font-size:clamp(13px,3.4vw,17px);color:#5a4a5f;margin-top:-4px;}
  .btn{border:none;border-radius:999px;padding:14px 26px;font-size:clamp(16px,4.4vw,20px);font-weight:800;
    color:#fff;background:linear-gradient(#ff8ec4,#ff5fa2);box-shadow:0 5px 0 #d23d83,0 8px 14px rgba(0,0,0,.2);
    cursor:pointer;transition:transform .05s;}
  .btn:active{transform:translateY(3px);box-shadow:0 2px 0 #d23d83;}
  .btn.alt{background:linear-gradient(#ffe27a,#ffc83d);box-shadow:0 5px 0 #d99a1f;color:#7a5300;}
  .chars{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;max-width:420px;}
  .char{width:64px;height:64px;border-radius:18px;background:#fff;border:3px solid #ffd6ea;font-size:34px;
    display:flex;align-items:center;justify-content:center;cursor:pointer;box-shadow:0 3px 8px rgba(0,0,0,.12);}
  .char.sel{border-color:#ff5fa2;background:#fff0f8;transform:scale(1.08);}
  .diff{display:flex;gap:12px;}
  .res-emoji{font-size:54px;}
  .res-time{font-size:clamp(22px,6vw,34px);font-weight:900;color:#ff5fa2;}

  /* HUD + controls */
  #hud{position:absolute;top:8px;left:0;right:0;display:flex;justify-content:space-between;
    padding:0 14px;pointer-events:none;font-weight:800;color:#3a2b3f;}
  .hud-pill{background:rgba(255,255,255,.85);border-radius:999px;padding:5px 12px;font-size:14px;box-shadow:0 2px 6px rgba(0,0,0,.12);}
  #heatBox{position:absolute;left:14px;bottom:118px;width:120px;height:14px;background:rgba(255,255,255,.7);
    border-radius:999px;overflow:hidden;box-shadow:0 2px 6px rgba(0,0,0,.15);pointer-events:none;}
  #heatBar{height:100%;width:0;background:linear-gradient(90deg,#7ee37e,#ffd34d,#ff5a5a);transition:width .08s;}
  #heatLbl{position:absolute;left:18px;bottom:136px;font-size:12px;font-weight:800;color:#3a2b3f;pointer-events:none;}

  .pad{position:absolute;bottom:18px;display:flex;gap:10px;}
  #padL{left:16px;flex-direction:column;}
  #padR{right:16px;}
  .ctl{width:64px;height:64px;border-radius:18px;border:none;font-size:26px;font-weight:900;color:#fff;
    background:rgba(58,43,63,.55);box-shadow:0 4px 0 rgba(0,0,0,.25);cursor:pointer;}
  .ctl:active{transform:translateY(2px);}
  #go{width:90px;height:90px;border-radius:26px;background:linear-gradient(#7ee37e,#3fbf5f);box-shadow:0 5px 0 #2a8c43;font-size:22px;}
  #turbo{width:76px;height:90px;border-radius:26px;background:linear-gradient(#ffd34d,#ff9d2e);box-shadow:0 5px 0 #d97a16;color:#5a3a00;font-size:18px;}
  .mute{position:absolute;top:8px;right:50%;transform:translateX(50%);pointer-events:auto;
    background:rgba(255,255,255,.85);border:none;border-radius:999px;padding:5px 10px;font-size:13px;cursor:pointer;}
  @media (max-width:380px){.ctl{width:54px;height:54px;font-size:22px}#go{width:78px;height:78px}#turbo{width:64px;height:78px}}

  /* ===== Landscape compaction (short height) ===== */
  @media (max-height:480px){
    .screen{ gap:6px !important; padding:6px 16px !important; justify-content:center; overflow-y:auto; }
    .bike-hero{ font-size:34px !important; animation:none; }
    .flag-deco span{ font-size:16px !important; }
    .spline{ display:none; }
    h1{ font-size:22px !important; }
    .sub{ font-size:11px !important; margin:0 !important; }
    .chars{ gap:6px !important; max-width:560px; }
    .chars button, .chars > *{ transform:scale(.85); }
    .diff{ gap:8px !important; }
    .diff button, .diff > *{ padding:8px 20px !important; font-size:15px !important; }
  }
</style>
    <script src="/games/safe_area.js"></script>
</head>
<body>
<div id="wrap">
  <canvas id="cv"></canvas>

  <!-- TITLE -->
  <div id="title" class="screen">
    <!-- speed lines -->
    <div class="spline" style="top:15%;width:60%;--d:1.1s;--dl:0s"></div>
    <div class="spline" style="top:25%;width:80%;--d:1.4s;--dl:.2s"></div>
    <div class="spline" style="top:38%;width:50%;--d:1.0s;--dl:.5s"></div>
    <div class="spline" style="top:55%;width:70%;--d:1.3s;--dl:.1s"></div>
    <div class="spline" style="top:68%;width:55%;--d:1.2s;--dl:.4s"></div>
    <div class="spline" style="top:80%;width:75%;--d:1.5s;--dl:.3s"></div>
    <div class="bike-hero">🏍️</div>
    <h1>わくわくバイク</h1>
    <div class="flag-deco">
      <span style="--d:1.0s;--dl:0s">🏁</span>
      <span style="--d:1.2s;--dl:.15s">⭐</span>
      <span style="--d:0.9s;--dl:.3s">🏁</span>
      <span style="--d:1.3s;--dl:.05s">💨</span>
      <span style="--d:1.1s;--dl:.25s">🏁</span>
    </div>
    <div class="sub" style="position:relative;z-index:1">ジャンプ台でとんで、まっすぐ着地しよう！🏁</div>
    <div class="chars" id="charList" style="position:relative;z-index:1"></div>
    <div class="sub" style="position:relative;z-index:1">なんでのる？👆</div>
    <div class="diff" style="position:relative;z-index:1">
      <button class="btn alt" data-diff="easy">かんたん</button>
      <button class="btn" data-diff="hard">チャレンジ</button>
    </div>
    <div class="sub" style="font-size:12px;opacity:.7">↑↓レーン / →すすむ / スペース ダッシュ</div>
  </div>

  <!-- HUD -->
  <div id="hud" class="hidden">
    <span class="hud-pill" id="distPill">0 m</span>
    <span class="hud-pill" id="timePill">0.0 秒</span>
    <span class="hud-pill" id="coinPill">🪙 0</span>
  </div>
  <div id="heatLbl" class="hidden">げんき</div>
  <div id="heatBox" class="hidden"><div id="heatBar"></div></div>

  <div id="padL" class="pad hidden">
    <button class="ctl" id="up">▲</button>
    <button class="ctl" id="down">▼</button>
  </div>
  <div id="padR" class="pad hidden">
    <button class="ctl" id="turbo">ダッシュ</button>
    <button class="ctl" id="go">GO</button>
  </div>

  <!-- RESULT -->
  <div id="result" class="screen hidden">
    <div class="res-emoji" id="resEmoji">🎉</div>
    <h1 id="resTitle">ゴール！</h1>
    <div class="res-time" id="resTime"></div>
    <div class="sub" id="resCoin"></div>
    <div class="sub" id="resRank" style="font-size:clamp(18px,5vw,26px);font-weight:900;"></div>
    <button class="btn" id="again">もういちど</button>
    <button class="btn alt" id="toTitle">さいしょから</button>
  </div>
</div>

<script>
(()=>{
"use strict";
const cv=document.getElementById('cv'), ctx=cv.getContext('2d');
let W=0,H=0,DPR=1;
function resize(){
  DPR=Math.min(window.devicePixelRatio||1,2);
  W=window.innerWidth; H=window.innerHeight;
  cv.width=W*DPR; cv.height=H*DPR; cv.style.width=W+'px'; cv.style.height=H+'px';
  ctx.setTransform(DPR,0,0,DPR,0,0);
}
window.addEventListener('resize',resize); resize();

/* ---------- audio ---------- */
const AudioFX=(()=>{
  let ac=null,master=null,bgmTimer=null,muted=false;
  function ensure(){ if(!ac){ ac=new (window.AudioContext||window.webkitAudioContext)(); master=ac.createGain(); master.gain.value=.5; master.connect(ac.destination);} if(ac.state==='suspended')ac.resume(); }
  function tone(f,d,type='square',v=.3,slideTo){ if(muted)return; ensure();
    const o=ac.createOscillator(),g=ac.createGain(); o.type=type; o.frequency.value=f;
    if(slideTo)o.frequency.linearRampToValueAtTime(slideTo,ac.currentTime+d);
    g.gain.setValueAtTime(v,ac.currentTime); g.gain.exponentialRampToValueAtTime(.0001,ac.currentTime+d);
    o.connect(g); g.connect(master); o.start(); o.stop(ac.currentTime+d); }
  const coin=()=>{tone(880,.08,'square',.25);setTimeout(()=>tone(1320,.1,'square',.22),60);};
  const jump=()=>tone(300,.18,'sawtooth',.25,720);
  const land=()=>tone(520,.1,'triangle',.3,180);
  const crash=()=>{tone(160,.3,'sawtooth',.35,60);};
  const goal=()=>{[523,659,784,1046].forEach((f,i)=>setTimeout(()=>tone(f,.18,'square',.3),i*120));};
  // simple bgm loop
  const mel=[392,392,440,392,523,494, 392,392,440,392,587,523];
  let mi=0;
  function startBGM(){ if(bgmTimer)return; ensure();
    bgmTimer=setInterval(()=>{ if(muted)return; const f=mel[mi%mel.length]; tone(f,.16,'triangle',.12); if(mi%2===0)tone(f/2,.2,'sine',.08); mi++; },230); }
  function stopBGM(){ if(bgmTimer){clearInterval(bgmTimer);bgmTimer=null;} }
  function setMute(m){ muted=m; }
  return {coin,jump,land,crash,goal,startBGM,stopBGM,setMute,ensure};
})();

/* ---------- characters ---------- */
const CHARS=['🐰','🐶','🐱','🐻','🐼','🦊','🤴','👸'];
let chosen='🐰';
const charList=document.getElementById('charList');
CHARS.forEach((c,i)=>{ const d=document.createElement('div'); d.className='char'+(i===0?' sel':''); d.textContent=c;
  d.onclick=()=>{ document.querySelectorAll('.char').forEach(e=>e.classList.remove('sel')); d.classList.add('sel'); chosen=c; AudioFX.ensure(); };
  charList.appendChild(d); });

/* ---------- game state ---------- */
const G={ running:false, mode:'easy' };
let player, world, keys={}, lastT=0;

function makeLevel(mode){
  const goal = mode==='easy'? 1400 : 2300;
  const items=[]; // {type, x, lane}
  let x = 260;
  const rnd=(a,b)=>a+Math.random()*(b-a);
  while(x<goal-200){
    const r=Math.random();
    if(r<0.42){ items.push({type:'ramp',x, lane:1, big: mode==='hard'&&Math.random()<.4}); x+=rnd(mode==='easy'?260:200, 360); }
    else if(r<0.72){ items.push({type:'rock',x, lane:(Math.random()*3)|0}); x+=rnd(140,240); }
    else { items.push({type:'coin',x, lane:(Math.random()*3)|0}); x+=rnd(90,170); }
  }
  items.push({type:'goal',x:goal,lane:1});
  return {goal,items};
}

function startGame(mode){
  G.mode=mode; G.running=true;
  world={ dist:0, scroll:0, level:makeLevel(mode,1), coins:0, time:0, stage:1, mode:mode };
  player={
    screenX: W*0.26, lane:1, laneY:0, // 0,1,2 -> visual offset
    speed:0, maxSpeed: mode==='easy'?5.6:7.2, accel:7, friction:2.2,
    air:false, jumpY:0, vy:0, tilt:0, // tilt: + lean back (wheelie), - nose down
    heat:0, overheat:0, stumble:0, finished:false
  };
  document.getElementById('title').classList.add('hidden');
  document.getElementById('result').classList.add('hidden');
  ['hud','heatBox','heatLbl','padL','padR'].forEach(id=>document.getElementById(id).classList.remove('hidden'));
  AudioFX.ensure(); AudioFX.startBGM();
  lastT=performance.now();
  requestAnimationFrame(loop);
}

/* lane visual offsets (pseudo perspective): farther lane = higher & smaller */
function laneScreenY(lane){ const base=H*0.62; return base - lane*44; }
function laneScale(lane){ return 1 - lane*0.08; }

/* ---------- input ---------- */
const press=(k,v)=>{keys[k]=v;};
addEventListener('keydown',e=>{ if(['ArrowUp','ArrowDown','ArrowRight','ArrowLeft',' '].includes(e.key))e.preventDefault();
  if(e.key==='ArrowUp')onUp(); if(e.key==='ArrowDown')onDown();
  if(e.key==='ArrowRight'||e.key==='z'||e.key==='Z')press('go',true);
  if(e.key===' '||e.key==='x'||e.key==='X')press('turbo',true); });
addEventListener('keyup',e=>{ if(e.key==='ArrowRight'||e.key==='z'||e.key==='Z')press('go',false);
  if(e.key===' '||e.key==='x'||e.key==='X')press('turbo',false); });

function bindHold(id,key){ const el=document.getElementById(id);
  const dn=e=>{e.preventDefault();press(key,true);}; const up=e=>{e.preventDefault();press(key,false);};
  el.addEventListener('touchstart',dn,{passive:false}); el.addEventListener('touchend',up); el.addEventListener('touchcancel',up);
  el.addEventListener('mousedown',dn); el.addEventListener('mouseup',up); el.addEventListener('mouseleave',up); }
bindHold('go','go'); bindHold('turbo','turbo');

function onUp(){ if(!player)return; if(player.air){player.tilt=Math.min(1,player.tilt+0.5);} else if(player.lane<2){player.lane++;} }
function onDown(){ if(!player)return; if(player.air){player.tilt=Math.max(-1,player.tilt-0.5);} else if(player.lane>0){player.lane--;} }
function tap(id,fn){ const el=document.getElementById(id);
  el.addEventListener('touchstart',e=>{e.preventDefault();fn();},{passive:false}); el.addEventListener('click',e=>{e.preventDefault();fn();}); }
tap('up',onUp); tap('down',onDown);

/* ---------- update ---------- */
function loop(now){
  if(!G.running)return;
  let dt=(now-lastT)/1000; lastT=now; if(dt>0.05)dt=0.05;
  update(dt); render();
  requestAnimationFrame(loop);
}

function update(dt){
  const p=player, lv=world.level;
  world.time+=dt;

  // lane lerp
  const targetY=laneScreenY(p.lane);
  p.laneY += (targetY-(laneScreenY(p.lane)))*0; // visual handled in render via lerp store
  // store smooth lane
  p._ly = (p._ly==null)?targetY:p._ly + (targetY-p._ly)*Math.min(1,dt*10);

  // speed control
  let accelOn = keys.go || keys.turbo;
  if(p.overheat>0){ p.overheat-=dt; accelOn=false; }
  if(p.stumble>0){ p.stumble-=dt; }
  const top = (keys.turbo && p.overheat<=0)? p.maxSpeed*1.45 : p.maxSpeed;
  if(p.stumble>0){
    // Stopped after hitting a rock: hold near-zero speed during stumble
    p.speed = 0;
  } else {
    if(accelOn){ p.speed += p.accel*dt; }
    else { p.speed -= p.friction*dt; }
  }
  p.speed=Math.max(0,Math.min(p.speed,top));

  // heat
  if(keys.turbo && p.overheat<=0 && !p.air){ p.heat+=dt*0.55; }
  else { p.heat-=dt*0.4; }
  p.heat=Math.max(0,Math.min(1,p.heat));
  if(p.heat>=1 && p.overheat<=0){ p.overheat=1.4; p.heat=0.9; AudioFX.crash(); }

  // advance world
  const move=p.speed*120*dt;
  world.dist += move;

  // air physics
  if(p.air){
    p.vy += 26*dt;            // gravity
    p.jumpY += p.vy*dt;
    // tilt drift toward nose-down naturally a touch
    if(p.jumpY>=0){ // land
      p.air=false; p.jumpY=0;
      const lvAng=Math.abs(p.tilt);
      if(p.tilt < -0.45){ // nose first -> tumble
        p.stumble=1.0; p.speed*=0.3; AudioFX.crash(); flash('💥',p);
      } else if(lvAng<0.35 || (p.tilt>0.2 && p.tilt<0.85)){ // level or slight wheelie -> perfect
        p.speed=Math.min(top,p.speed+0.9); AudioFX.land(); flash('✨',p);
      } else { AudioFX.land(); }
      p.tilt=0; p.vy=0;
    }
  }

  // item interactions (convert world dist to item-space; player reference x = world.dist)
  for(const it of lv.items){
    if(it.done) continue;
    const rel = it.x - (world.dist/8); // scale: dist units
    // we instead compare in same unit: define item.x in "meters*?" simpler: use world.dist directly
  }
  // Collision: use world.dist as the player's position in level units.
  const px = world.dist/8; // player level-x
  for(const it of lv.items){
    if(it.done) continue;
    if(it.type==='goal'){
      // Goal: trigger as soon as player reaches OR passes (prevents skipping at high speed)
      if(!p.finished && px >= it.x - 3){ p.finished=true; finish(); }
      continue;
    }
    if(Math.abs(it.x - px) < 6){
      if(it.type==='ramp' && !p.air && p.stumble<=0){
        p.air=true; p.vy = -(22 + p.speed*2.8) * (it.big?1.4:1); it.done=true; AudioFX.jump();
      } else if(it.type==='coin'){
        if(it.lane===p.lane || p.air){ world.coins++; it.done=true; AudioFX.coin(); }
      } else if(it.type==='rock'){
        // Hit rock: come to a full stop briefly, then recover
        if(!p.air && it.lane===p.lane && p.stumble<=0){
          p.stumble=1.1; p.speed=0; AudioFX.crash(); flash('💥 ストップ！',p); it.hit=true;
        }
      }
    }
  }

  // HUD
  document.getElementById('distPill').textContent=Math.floor(px)+' m';
  document.getElementById('timePill').textContent=world.time.toFixed(1)+' 秒';
  document.getElementById('coinPill').textContent='🪙 '+world.coins;
  document.getElementById('heatBar').style.width=(p.heat*100)+'%';
}

let flashes=[];
function flash(txt,p){ flashes.push({txt,x:p.screenX,y:(p._ly||H*0.5)-60,t:0}); }

/* ---------- render ---------- */
function render(){
  const p=player, lv=world.level, px=world.dist/8;
  // sky - richer gradient
  const g=ctx.createLinearGradient(0,0,0,H);
  g.addColorStop(0,'#4a90d9'); g.addColorStop(.4,'#7ec8f0'); g.addColorStop(1,'#d4f1ff');
  ctx.fillStyle=g; ctx.fillRect(0,0,W,H);
  // distant mountains silhouette
  ctx.fillStyle='rgba(100,140,200,.35)';
  ctx.beginPath(); ctx.moveTo(0,H*.52);
  for(let mx=0;mx<=W;mx+=W/8){
    const mh=H*(.18+0.12*Math.sin(mx*.009+world.dist*.0002));
    ctx.lineTo(mx,H*.52-mh);
  }
  ctx.lineTo(W,H*.52); ctx.closePath(); ctx.fill();
  ctx.fillStyle='rgba(130,170,220,.25)';
  ctx.beginPath(); ctx.moveTo(0,H*.52);
  for(let mx=0;mx<=W;mx+=W/6){
    const mh=H*(.10+0.08*Math.sin(mx*.013+world.dist*.0003+2));
    ctx.lineTo(mx,H*.52-mh);
  }
  ctx.lineTo(W,H*.52); ctx.closePath(); ctx.fill();
  // sun with rays
  const sx=W*0.82, sy=H*0.18, sr=34;
  // rays
  for(let ri=0;ri<12;ri++){
    const ra=ri/12*Math.PI*2 + world.time*.4;
    const rl=sr*1.4+sr*.4*Math.sin(world.time*2+ri);
    const x1=sx+Math.cos(ra)*sr*1.1, y1=sy+Math.sin(ra)*sr*1.1;
    const x2=sx+Math.cos(ra)*rl, y2=sy+Math.sin(ra)*rl;
    ctx.strokeStyle='rgba(255,240,100,.35)'; ctx.lineWidth=3;
    ctx.beginPath(); ctx.moveTo(x1,y1); ctx.lineTo(x2,y2); ctx.stroke();
  }
  const sg=ctx.createRadialGradient(sx-8,sy-8,0,sx,sy,sr);
  sg.addColorStop(0,'#fffde0'); sg.addColorStop(.5,'#ffe066'); sg.addColorStop(1,'#ffb300');
  ctx.fillStyle=sg; ctx.beginPath(); ctx.arc(sx,sy,sr,0,7); ctx.fill();
  // clouds (richer)
  for(let i=0;i<4;i++){
    const cx=((i*320 - world.dist*0.15)%(W+200)+W+200)%(W+200)-100;
    const cy=60+i*40%120;
    // cloud shadow
    ctx.globalAlpha=0.12; ctx.fillStyle='#6090c0';
    cloud(cx+6,cy+8,30+(i%2)*10);
    ctx.globalAlpha=1; ctx.fillStyle='rgba(255,255,255,.92)';
    cloud(cx,cy,30+(i%2)*10);
  }
  // ── Horizontal side-scroller road (SNES style) ──
  const roadTopY = laneScreenY(2) - 12;   // top of road area
  const roadBotY = laneScreenY(0) + 44;   // bottom of road area

  // Grass above road (far) with horizon
  const grassTopG = ctx.createLinearGradient(0,H*0.52,0,roadTopY);
  grassTopG.addColorStop(0,'#8ad95a'); grassTopG.addColorStop(1,'#6db84a');
  ctx.fillStyle=grassTopG; ctx.fillRect(0,H*0.52,W,roadTopY-H*0.52);

  // Roadside scenery (trees/signs/spectators) sitting on grass above road
  drawRoadside(px, roadTopY);

  // Asphalt road band
  const asphG=ctx.createLinearGradient(0,roadTopY,0,roadBotY);
  asphG.addColorStop(0,'#62686f'); asphG.addColorStop(.5,'#70767e'); asphG.addColorStop(1,'#5c6168');
  ctx.fillStyle=asphG; ctx.fillRect(0,roadTopY,W,roadBotY-roadTopY);

  // top & bottom red/white curb (scrolling horizontally)
  const curbSeg=36, curbOff=(world.dist*3)%(curbSeg*2);
  for(let cx=-curbOff; cx<W+curbSeg; cx+=curbSeg*2){
    ctx.fillStyle='#e84545';
    ctx.fillRect(cx,roadTopY-6,curbSeg,6);
    ctx.fillRect(cx+curbSeg,roadBotY,curbSeg,6);
    ctx.fillStyle='#fff';
    ctx.fillRect(cx+curbSeg,roadTopY-6,curbSeg,6);
    ctx.fillRect(cx,roadBotY,curbSeg,6);
  }

  // lane divider dashed lines (between the 3 lanes) - horizontal, scrolling
  ctx.strokeStyle='rgba(255,235,120,.9)'; ctx.lineWidth=4;
  ctx.setLineDash([30,24]); ctx.lineDashOffset=-(world.dist*3)%54;
  for(let lane=0;lane<2;lane++){
    const y=(laneScreenY(lane)+laneScreenY(lane+1))/2 + 22;
    ctx.beginPath(); ctx.moveTo(0,y); ctx.lineTo(W,y); ctx.stroke();
  }
  ctx.setLineDash([]);

  // asphalt speckle texture (scrolling dots)
  const spOff=(world.dist*3)%40;
  ctx.fillStyle='rgba(255,255,255,.06)';
  for(let sx=-spOff; sx<W; sx+=40){
    for(let sy=roadTopY+12; sy<roadBotY; sy+=26){
      ctx.fillRect(sx+(sy%13),sy,2,2);
    }
  }

  // grass below road (near) checker stripes scrolling
  const grassBotG=ctx.createLinearGradient(0,roadBotY,0,H);
  grassBotG.addColorStop(0,'#7fce52'); grassBotG.addColorStop(1,'#8ad95a');
  ctx.fillStyle=grassBotG; ctx.fillRect(0,roadBotY+6,W,H-roadBotY);
  const stripeW=70, gOff=(world.dist*3)%(stripeW*2);
  for(let sx=-gOff; sx<W+stripeW; sx+=stripeW*2){
    ctx.fillStyle='rgba(90,180,60,.28)';
    ctx.fillRect(sx,roadBotY+6,stripeW,H-roadBotY);
  }

  // items
  ctx.globalAlpha=1; // ensure reset
  for(const it of lv.items){
    if(it.type==='coin'&&it.done) continue;
    const sx = p.screenX + (it.x-px)*8;
    if(sx<-60||sx>W+60) continue;
    const ly=laneScreenY(it.lane)+10; const sc=Math.max(0.9, laneScale(it.lane));
    if(it.type==='ramp'){
      const w=72*(it.big?1.4:1), hgt=(it.big?60:42);
      // shadow
      ctx.fillStyle='rgba(0,0,0,.25)';
      ctx.beginPath(); ctx.moveTo(sx-w/2+4,ly+4); ctx.lineTo(sx+w/2+4,ly-hgt+4); ctx.lineTo(sx+w/2+4,ly+4); ctx.closePath(); ctx.fill();
      // base
      ctx.fillStyle='#5a3510';
      ctx.beginPath(); ctx.moveTo(sx-w/2,ly+2); ctx.lineTo(sx+w/2,ly-hgt); ctx.lineTo(sx+w/2,ly+2); ctx.closePath(); ctx.fill();
      // yellow/black diagonal stripes
      const stripes=4;
      for(let s=0;s<stripes;s++){
        const t0=s/stripes, t1=(s+1)/stripes;
        const x0=sx-w/2+w*t0, x1=sx-w/2+w*t1;
        const y0=ly + (ly-hgt-ly)*t0, y1=ly + (ly-hgt-ly)*t1;
        ctx.fillStyle=s%2?'#ffe040':'#ff6600';
        ctx.beginPath();
        ctx.moveTo(x0,ly+1); ctx.lineTo(x1,y1); ctx.lineTo(x1,ly+1);
        ctx.closePath(); ctx.fill();
      }
      // top surface
      ctx.fillStyle='#ffe040';
      ctx.beginPath(); ctx.moveTo(sx-w/2,ly); ctx.lineTo(sx+w/2,ly-hgt); ctx.lineTo(sx+w/2,ly-hgt-5); ctx.lineTo(sx-w/2,ly-5); ctx.closePath(); ctx.fill();
      // outline
      ctx.strokeStyle='#8B4500'; ctx.lineWidth=3;
      ctx.beginPath(); ctx.moveTo(sx-w/2,ly); ctx.lineTo(sx+w/2,ly-hgt); ctx.lineTo(sx+w/2,ly); ctx.closePath(); ctx.stroke();
      // flashing arrow sign
      const flash2=Math.sin(world.time*10)>0;
      ctx.fillStyle=flash2?'#ff2222':'#ffee00';
      ctx.fillRect(sx-22, ly-hgt-32, 44, 26);
      ctx.strokeStyle='#8B0000'; ctx.lineWidth=2.5; ctx.strokeRect(sx-22,ly-hgt-32,44,26);
      ctx.fillStyle='#8B0000'; ctx.font='bold 14px sans-serif'; ctx.textAlign='center';
      ctx.fillText('🚀ジャンプ!',sx,ly-hgt-14);
    } else if(it.type==='rock'){
      if(!it.hit){
        const r=20*sc;
        // shadow
        ctx.fillStyle='rgba(0,0,0,.3)'; ctx.beginPath(); ctx.ellipse(sx+4,ly+4,r*1.1,r*.5,0,0,Math.PI*2); ctx.fill();
        // warning ring
        const pulse=0.6+0.4*Math.sin(world.time*8);
        ctx.strokeStyle=`rgba(255,60,60,${pulse})`; ctx.lineWidth=3;
        ctx.beginPath(); ctx.arc(sx,ly-r*.4,r*1.3,0,Math.PI*2); ctx.stroke();
        // rock emoji
        ctx.font=Math.round(38*sc)+'px sans-serif'; ctx.textAlign='center';
        ctx.fillText('🪨',sx,ly+6);
        // "!" label
        ctx.fillStyle='#ff2020'; ctx.font=`bold ${Math.round(14*sc)}px sans-serif`;
        ctx.fillText('！',sx,ly-r*1.6);
      }
    } else if(it.type==='coin'){
      const bob=Math.sin(world.time*6+it.x)*4;
      const r=16*sc;
      // glow
      const cg=ctx.createRadialGradient(sx,ly-10+bob,0,sx,ly-10+bob,r*2);
      cg.addColorStop(0,'rgba(255,220,0,.45)'); cg.addColorStop(1,'rgba(255,220,0,0)');
      ctx.fillStyle=cg; ctx.beginPath(); ctx.arc(sx,ly-10+bob,r*2,0,Math.PI*2); ctx.fill();
      // coin emoji
      ctx.font=Math.round(32*sc)+'px sans-serif'; ctx.textAlign='center';
      ctx.fillText('🪙',sx,ly-4+bob);
    } else if(it.type==='goal'){
      // Dramatic goal line
      const gx=sx;
      ctx.fillStyle='rgba(255,255,255,.7)'; ctx.fillRect(gx-3,ly-160,6,165);
      // checkered flag pole
      const fsize=50; const fseg=10;
      for(let fr=0;fr<4;fr++) for(let fc=0;fc<4;fc++){
        ctx.fillStyle=(fr+fc)%2?'#222':'#fff';
        ctx.fillRect(gx+fc*fseg-fsize/2, ly-160+fr*fseg, fseg, fseg);
      }
      ctx.strokeStyle='#333'; ctx.lineWidth=2;
      ctx.strokeRect(gx-fsize/2, ly-160, fsize, fseg*4);
      ctx.font='44px sans-serif'; ctx.textAlign='center'; ctx.fillText('🏁',gx,ly+4);
      // GOAL text
      ctx.fillStyle='#FFD700'; ctx.font='bold 22px sans-serif'; ctx.textAlign='center';
      ctx.strokeStyle='#8B4500'; ctx.lineWidth=4; ctx.lineJoin='round';
      ctx.strokeText('GOAL!',gx,ly-170);
      ctx.fillText('GOAL!',gx,ly-170);
    }
  }
  ctx.textAlign='left'; ctx.globalAlpha=1;

  // player
  const baseY=p._ly||laneScreenY(p.lane);
  const py=baseY - p.jumpY*-1*0 - (p.air? -p.jumpY : 0); // jumpY negative when up
  const drawY = baseY + (p.air? p.jumpY : 0) - (p.air?0:0);
  drawBike(p.screenX, baseY + (p.air?p.jumpY:0), p);

  // turbo speed lines
  if(keys.turbo&&p.overheat<=0){ ctx.strokeStyle='rgba(255,255,255,.6)'; ctx.lineWidth=3;
    for(let i=0;i<5;i++){const yy=baseY-40+i*16+ (i*7); ctx.beginPath(); ctx.moveTo(p.screenX-30-i*8,yy); ctx.lineTo(p.screenX-70-i*14,yy); ctx.stroke();} }

  // flashes
  flashes=flashes.filter(f=>f.t<0.7);
  for(const f of flashes){ f.t+=0.016; ctx.globalAlpha=1-f.t/0.7; ctx.font='30px sans-serif'; ctx.fillText(f.txt,f.x-14,f.y-f.t*40); ctx.globalAlpha=1; }

  // overheat warning
  if(p.overheat>0){ ctx.fillStyle='rgba(255,80,80,.85)'; ctx.font='bold 22px sans-serif'; ctx.textAlign='center';
    ctx.fillText('つかれた…💦',W/2,H*0.32); ctx.textAlign='left'; }
}

function cloud(x,y,r){ ctx.beginPath(); ctx.arc(x,y,r,0,7); ctx.arc(x+r,y+6,r*0.8,0,7); ctx.arc(x-r,y+6,r*0.7,0,7); ctx.fill(); }

// ── Roadside scenery: trees, signs, spectators (horizontal scroll) ──
function drawRoadside(px, roadTopY){
  // Objects placed every N level-units, scroll horizontally right-to-left
  const spacing=18;
  const startIdx=Math.floor(px/spacing)-1;
  for(let i=startIdx; i<startIdx+12; i++){
    const objX = i*spacing;
    const rel = objX - px;                    // units ahead of player
    const screenX = W*0.26 + rel*8;           // same 8px/unit scale as items
    if(screenX<-60 || screenX>W+60) continue;
    const baseY = roadTopY - 4;               // sit on grass just above road
    const kind = (i*7) % 5;
    const sc = 0.85 + ((i*13)%5)*0.06;        // slight size variation
    drawScenery(kind, screenX, baseY, sc, i);
  }
}
function drawScenery(kind,x,y,sc,seed){
  ctx.save();
  ctx.translate(x,y);
  ctx.scale(sc,sc);
  if(kind===0 || kind===1){
    // ── Tree ──
    ctx.fillStyle='#6b4423';
    ctx.fillRect(-5,-18,10,22);
    ctx.fillStyle= kind===0?'#2e8b40':'#37a14a';
    ctx.beginPath(); ctx.arc(0,-30,22,0,7); ctx.fill();
    ctx.beginPath(); ctx.arc(-15,-22,16,0,7); ctx.fill();
    ctx.beginPath(); ctx.arc(15,-22,16,0,7); ctx.fill();
    ctx.fillStyle='rgba(255,255,255,.18)';
    ctx.beginPath(); ctx.arc(-6,-36,10,0,7); ctx.fill();
  } else if(kind===2){
    // ── Sign board ──
    ctx.fillStyle='#8d6e63'; ctx.fillRect(-3,-10,6,16);
    ctx.fillStyle='#1976d2'; ctx.fillRect(-22,-40,44,30);
    ctx.fillStyle='#fff'; ctx.fillRect(-19,-37,38,24);
    ctx.fillStyle='#1976d2';
    ctx.font='bold 18px sans-serif'; ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.fillText(['🏁','⛽','🍔','➡️'][seed%4],0,-25);
  } else if(kind===3){
    // ── Spectators (cheering) ──
    const emos=['🐰','🐱','🐶','🐻','🦊','🐼'];
    for(let k=-1;k<=1;k++){
      ctx.font='26px serif'; ctx.textAlign='center';
      const bob=Math.sin(world.time*5+k+seed)*3;
      ctx.fillText(emos[(seed+k+6)%emos.length], k*22, -10+bob);
    }
    // banner
    ctx.fillStyle='#ff5fa2'; ctx.fillRect(-34,-34,68,10);
    ctx.fillStyle='#fff'; ctx.font='bold 8px sans-serif'; ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.fillText('GANBARE!',0,-29);
  } else {
    // ── Building/house ──
    ctx.fillStyle='#ffab91'; ctx.fillRect(-20,-34,40,38);
    ctx.fillStyle='#d84315';
    ctx.beginPath(); ctx.moveTo(-24,-34); ctx.lineTo(0,-52); ctx.lineTo(24,-34); ctx.closePath(); ctx.fill();
    ctx.fillStyle='#4fc3f7'; ctx.fillRect(-14,-26,11,11); ctx.fillRect(4,-26,11,11);
    ctx.fillStyle='#6d4c41'; ctx.fillRect(-6,-14,12,18);
  }
  ctx.restore();
}

function drawBike(x,y,p){
  ctx.save(); ctx.translate(x,y);
  // tilt rotation when airborne
  const ang = p.air? (-p.tilt*0.5) : (p.stumble>0? Math.sin(world.time*30)*0.15 : 0);
  ctx.rotate(ang);
  // wheels
  ctx.fillStyle='#333';
  ctx.beginPath(); ctx.arc(-16,4,12,0,7); ctx.fill();
  ctx.beginPath(); ctx.arc(18,4,12,0,7); ctx.fill();
  ctx.fillStyle='#bbb'; ctx.beginPath(); ctx.arc(-16,4,5,0,7); ctx.fill(); ctx.beginPath(); ctx.arc(18,4,5,0,7); ctx.fill();
  // body
  ctx.fillStyle='#ff5fa2'; ctx.beginPath();
  ctx.moveTo(-16,2); ctx.lineTo(6,-10); ctx.lineTo(22,-6); ctx.lineTo(18,4); ctx.lineTo(-16,4); ctx.closePath(); ctx.fill();
  ctx.fillStyle='#ffd34d'; ctx.fillRect(-4,-9,12,5);
  // rider
  ctx.font='30px sans-serif'; ctx.textAlign='center';
  ctx.fillText(chosen,0,-12);
  ctx.textAlign='left';
  ctx.restore();
}

/* ---------- finish ---------- */
function finish(){
  G.running=false; AudioFX.stopBGM(); AudioFX.goal();
  const MAX_STAGE=3;
  if(world.stage < MAX_STAGE){
    // Stage clear → next stage
    ['hud','heatBox','heatLbl','padL','padR'].forEach(id=>document.getElementById(id).classList.add('hidden'));
    const sc=document.createElement('div');
    sc.id='stageClear';
    sc.style.cssText='position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;background:rgba(0,0,0,.75);color:#fff;font-family:inherit;z-index:50;';
    sc.innerHTML=`
      <div style="font-size:56px">🎉</div>
      <div style="font-size:28px;font-weight:900;color:#FFD700;text-shadow:2px 2px 0 #8B4500">ステージ${world.stage} クリア！</div>
      <div style="font-size:16px;color:rgba(255,255,255,.8)">タイム ${world.time.toFixed(1)}秒 ／ 🪙×${world.coins}</div>
      <div style="font-size:14px;color:#88ccff">つぎは もっとながいよ！</div>
      <button style="background:linear-gradient(145deg,#FF9800,#E65100);color:#fff;border:none;border-radius:40px;padding:14px 40px;font-size:20px;font-weight:900;cursor:pointer;box-shadow:0 5px 0 #BF360C;font-family:inherit"
        onclick="nextStage()">つぎへ ▶</button>`;
    document.querySelector('#wrap').appendChild(sc);
    return;
  }
  // Final clear
  ['hud','heatBox','heatLbl','padL','padR'].forEach(id=>document.getElementById(id).classList.add('hidden'));
  const t=world.time;
  document.getElementById('resTime').textContent='タイム '+t.toFixed(1)+' 秒';
  document.getElementById('resCoin').textContent='🪙 コイン '+world.coins+' まい';
  let rank,em;
  const par = (world.mode==='easy'? 26 : 38)*3;
  if(t<par*0.85){rank='⭐⭐⭐ パーフェクト！';em='🏆';}
  else if(t<par){rank='⭐⭐ じょうず！';em='🎉';}
  else {rank='⭐ クリア！';em='😊';}
  document.getElementById('resRank').textContent=rank;
  document.getElementById('resEmoji').textContent=em;
  document.getElementById('resTitle').textContent='ぜんぶ クリア！🏆';
  document.getElementById('result').classList.remove('hidden');
}

window.nextStage = function nextStage(){
  const sc=document.getElementById('stageClear'); if(sc)sc.remove();
  world.stage++;
  world.dist=0; world.scroll=0; world.time=0;
  world.level=makeLevel(world.mode, world.stage);
  player.air=false; player.jumpY=0; player.vy=0; player.lane=1;
  player.speed=world.mode==='easy'?3.5+world.stage*0.5:5+world.stage*0.8;
  player.overheat=0; player.stumble=0; player.screenX=130;
  ['hud','heatBox','heatLbl','padL','padR'].forEach(id=>document.getElementById(id).classList.remove('hidden'));
  document.getElementById('stageDisp') && (document.getElementById('stageDisp').textContent=`S${world.stage}`);
  AudioFX.startBGM(); G.running=true;
  requestAnimationFrame(loop);
}

/* ---------- buttons ---------- */
document.querySelectorAll('[data-diff]').forEach(b=>b.onclick=()=>startGame(b.dataset.diff));
document.getElementById('again').onclick=()=>startGame(G.mode);
document.getElementById('toTitle').onclick=()=>{ document.getElementById('result').classList.add('hidden'); document.getElementById('title').classList.remove('hidden'); };

})();
</script>
